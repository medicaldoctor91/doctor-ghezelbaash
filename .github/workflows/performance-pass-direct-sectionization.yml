name: Performance pass with direct H2 sectionization

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/performance-pass-direct-sectionization.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: direct-h2-sectionization
  cancel-in-progress: false

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Wrap H2 semantic clusters in persistent sections
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          page=Path('src/pages/index.md')
          text=page.read_text(encoding='utf-8')
          if 'class="semantic-section semantic-section--deferred' in text:
              raise SystemExit('Semantic sections already exist; refusing duplicate wrapping')

          pattern=re.compile(r'(?m)^<h2\s+id="([^"]+)"[^>]*>')
          matches=list(pattern.finditer(text))
          if len(matches)<15:
              raise SystemExit(f'Unexpected H2 count: {len(matches)}')

          preamble=text[:matches[0].start()]
          output=[preamble.rstrip(),'']
          for index,match in enumerate(matches):
              start=match.start()
              end=matches[index+1].start() if index+1<len(matches) else len(text)
              segment=text[start:end].rstrip()
              char_count=len(segment)
              if char_count<15000:size='small'
              elif char_count<35000:size='medium'
              elif char_count<70000:size='large'
              else:size='xlarge'
              heading_id=match.group(1)
              output.extend([
                  f'<section class="semantic-section semantic-section--deferred semantic-section--{size}" aria-labelledby="{heading_id}" data-section-index="{index+1}">',
                  '',
                  segment,
                  '',
                  '</section>',
                  '',
              ])
          page.write_text('\n'.join(output).rstrip()+'\n',encoding='utf-8')
          print('wrapped_h2_sections',len(matches))
          PY

          python3 - <<'PY'
          from pathlib import Path
          css=Path('src/styles/global.css')
          s=css.read_text(encoding='utf-8')
          old='''main > :where(p, ul, ol, blockquote, details, address, .section-answer, .micro-answer, .semantic-alias) {
            max-width: var(--reading-measure);
            margin-inline-start: 0;
            margin-inline-end: auto;
          }

          /* Preserve the complete semantic corpus while deferring below-fold layout and paint. */
          main > :nth-child(n + 30) {
            content-visibility: auto;
            contain-intrinsic-size: auto 240px;
          }

          main > :where(nav, ul, ol, table, figure, details, blockquote):nth-child(n + 30) {
            contain-intrinsic-size: auto 720px;
          }
          '''
          new='''main > :where(p, ul, ol, blockquote, details, address, .section-answer, .micro-answer, .semantic-alias),
          main > .semantic-section > :where(p, ul, ol, blockquote, details, address, .section-answer, .micro-answer, .semantic-alias) {
            max-width: var(--reading-measure);
            margin-inline-start: 0;
            margin-inline-end: auto;
          }

          /* Preserve every node in the HTML while deferring complete topical clusters below the viewport. */
          main > .semantic-section {
            display: flow-root;
          }

          main > .semantic-section--deferred {
            content-visibility: auto;
            contain: layout style paint;
          }

          main > .semantic-section--small {
            contain-intrinsic-size: auto 7000px;
          }

          main > .semantic-section--medium {
            contain-intrinsic-size: auto 15000px;
          }

          main > .semantic-section--large {
            contain-intrinsic-size: auto 30000px;
          }

          main > .semantic-section--xlarge {
            contain-intrinsic-size: auto 50000px;
          }

          @media (max-width: 720px) {
            main > .semantic-section--small {
              contain-intrinsic-size: auto 15000px;
            }

            main > .semantic-section--medium {
              contain-intrinsic-size: auto 35000px;
            }

            main > .semantic-section--large {
              contain-intrinsic-size: auto 70000px;
            }

            main > .semantic-section--xlarge {
              contain-intrinsic-size: auto 120000px;
            }
          }
          '''
          if old not in s:
              raise SystemExit('Expected baseline containment block not found')
          s=s.replace(old,new,1)
          old_figure='''figure {
            content-visibility: auto;
            contain-intrinsic-size: auto 720px;
            margin: 2.2rem 0;
          '''
          new_figure='''figure {
            margin: 2.2rem 0;
          '''
          if old_figure not in s:
              raise SystemExit('Expected figure containment block not found')
          s=s.replace(old_figure,new_figure,1)
          css.write_text(s,encoding='utf-8')
          PY
          git diff --check

      - name: Build and verify output structure
        run: |
          npm ci --no-audit --no-fund
          npm run build
          python3 - <<'PY'
          from pathlib import Path
          import re
          html=Path('dist/index.html').read_text(encoding='utf-8')
          sections=len(re.findall(r'<section\b[^>]*class="[^"]*semantic-section[^"]*"',html))
          h2s=len(re.findall(r'<h2\b',html))
          print({'sections':sections,'h2s':h2s,'bytes':len(html.encode())})
          assert sections==h2s and sections>=15
          assert len(html.encode())<1900000
          assert '<section class="semantic-section' in html
          PY

      - name: Benchmark local Lighthouse
        run: |
          mkdir -p tmp/direct-sections
          nohup python3 -m http.server 4173 --directory dist >tmp/direct-sections/server.log 2>&1 &
          echo $! >tmp/direct-sections/server.pid
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          npx --yes lighthouse@latest http://127.0.0.1:4173/ --output=json --output-path=tmp/direct-sections/mobile.json --only-categories=performance,accessibility,best-practices,seo --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage' --quiet
          npx --yes lighthouse@latest http://127.0.0.1:4173/ --preset=desktop --output=json --output-path=tmp/direct-sections/desktop.json --only-categories=performance,accessibility,best-practices,seo --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage' --quiet
          kill $(cat tmp/direct-sections/server.pid) || true

      - name: Evaluate benchmark
        id: evaluate
        shell: bash
        run: |
          set +e
          python3 - <<'PY'
          from pathlib import Path
          import json
          baseline={'mobile':{'performance':37,'mainthread':3030.112},'desktop':{'performance':86,'mainthread':200.586}}
          result={'accepted':False}
          for mode in ('mobile','desktop'):
            d=json.loads(Path(f'tmp/direct-sections/{mode}.json').read_text());a=d['audits'];c=d['categories']
            result[mode]={
              'performance':round(c['performance']['score']*100),
              'accessibility':round(c['accessibility']['score']*100),
              'bestPractices':round(c['best-practices']['score']*100),
              'seo':round(c['seo']['score']*100),
              'fcp':a['first-contentful-paint']['numericValue'],
              'lcp':a['largest-contentful-paint']['numericValue'],
              'tbt':a['total-blocking-time']['numericValue'],
              'cls':a['cumulative-layout-shift']['numericValue'],
              'mainthread':a['mainthread-work-breakdown']['numericValue'],
              'domSize':a.get('dom-size-insight',{}).get('numericValue'),
            }
          result['htmlBytes']=Path('dist/index.html').stat().st_size
          quality=all(result[m][k]==100 for m in ('mobile','desktop') for k in ('accessibility','bestPractices','seo'))
          stable=all(result[m]['cls']<0.02 for m in ('mobile','desktop'))
          improvement=(result['mobile']['mainthread']<baseline['mobile']['mainthread']*0.85 and result['mobile']['performance']>=baseline['mobile']['performance'])
          desktop_ok=result['desktop']['performance']>=baseline['desktop']['performance']-3
          result['accepted']=bool(quality and stable and improvement and desktop_ok and result['htmlBytes']<1900000)
          Path('tmp/performance-direct-sections.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(result,indent=2))
          raise SystemExit(0 if result['accepted'] else 1)
          PY
          rc=$?
          if [ "$rc" -eq 0 ]; then echo 'accepted=true' >> "$GITHUB_OUTPUT"; else echo 'accepted=false' >> "$GITHUB_OUTPUT"; fi
          exit 0

      - name: Keep accepted source or roll back experiment
        shell: bash
        run: |
          if [ "${{ steps.evaluate.outputs.accepted }}" != "true" ]; then
            git reset --hard HEAD
            git clean -fd -e tmp/performance-direct-sections.json
          fi

      - name: Commit result and remove temporary workflows
        run: |
          git config user.name 'OpenAI Project Automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f --ignore-unmatch .github/workflows/performance-pass-direct-sectionization.yml .github/workflows/performance-pass-section-containment.yml
          rm -rf tmp/direct-sections tmp/section-containment-diagnostic.txt
          git add -A
          if [ "${{ steps.evaluate.outputs.accepted }}" = "true" ]; then
            git commit -m 'Defer complete H2 semantic clusters for faster rendering'
          else
            git commit -m 'Record rejected H2 sectionization benchmark'
          fi
          git push origin HEAD:main

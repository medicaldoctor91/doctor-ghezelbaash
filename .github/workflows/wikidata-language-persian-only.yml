name: Correct Wikidata spoken language to Persian

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wikidata-language-persian-only.yml'

permissions:
  contents: read

jobs:
  correct:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      WIKIMEDIA_USERNAME: ${{ secrets.WIKIVERSITY_USERNAME }}
      WIKIMEDIA_BOT_PASSWORD: ${{ secrets.WIKIVERSITY_BOT_PASSWORD }}
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check --no-input requests==2.32.5
      - name: Remove English P1412 and retain sourced Persian P1412
        shell: python
        run: |
          import json, os, time, requests
          WD='https://www.wikidata.org/w/api.php'
          PERSON='Q140287622'; PERSIAN='Q9168'; ENGLISH='Q1860'
          UA='Medicaldoctor91PersianLanguageCorrection/1.0 (https://www.ghezelbaash.ir/)'
          anon=requests.Session(); anon.headers['User-Agent']=UA
          auth=requests.Session(); auth.headers['User-Agent']=UA
          def get(sess,p):
              r=sess.get(WD,params={**p,'format':'json','formatversion':2},timeout=90); r.raise_for_status(); d=r.json()
              if 'error' in d: raise RuntimeError(d['error'])
              return d
          def post(p):
              waits=[10,20,30,45,60,90]
              last=None
              for w in waits:
                  r=auth.post(WD,data={**p,'format':'json','formatversion':2,'maxlag':5},timeout=120); r.raise_for_status(); d=r.json()
                  if 'error' not in d: return d
                  last=d['error']; blob=json.dumps(last,ensure_ascii=False).lower()
                  if d['error'].get('code') in {'maxlag','ratelimited','actionthrottled','failed-save'}:
                      time.sleep(w); continue
                  raise RuntimeError(d['error'])
              raise RuntimeError({'write_retry_exhausted':last})
          def ent(sess): return get(sess,{'action':'wbgetentities','ids':PERSON,'props':'claims|info'})['entities'][PERSON]
          def qid(c):
              v=c.get('mainsnak',{}).get('datavalue',{}).get('value')
              return v.get('id') if isinstance(v,dict) else None
          before=ent(anon)
          langs=before.get('claims',{}).get('P1412',[])
          fa=[c for c in langs if qid(c)==PERSIAN]
          en=[c for c in langs if qid(c)==ENGLISH]
          others=[c for c in langs if qid(c) not in {PERSIAN,ENGLISH}]
          if len(fa)!=1 or len(en)!=1 or others:
              raise RuntimeError({'unexpected_P1412_prestate':{'fa':len(fa),'en':len(en),'others':[qid(c) for c in others]}})
          if not fa[0].get('references'):
              raise RuntimeError('Persian P1412 lacks reference; abort')
          lt=get(auth,{'action':'query','meta':'tokens','type':'login'})['query']['tokens']['logintoken']
          login=post({'action':'login','lgname':os.environ['WIKIMEDIA_USERNAME'],'lgpassword':os.environ['WIKIMEDIA_BOT_PASSWORD'],'lgtoken':lt})
          if login.get('login',{}).get('result')!='Success': raise RuntimeError(login)
          csrf=get(auth,{'action':'query','meta':'tokens','type':'csrf'})['query']['tokens']['csrftoken']
          post({'action':'wbremoveclaims','claim':en[0]['id'],'token':csrf,'summary':'Correct languages spoken to retain Persian as requested by the subject'})
          after=ent(anon)
          final=after.get('claims',{}).get('P1412',[])
          final_q=[qid(c) for c in final]
          if final_q != [PERSIAN] or len(final)!=1 or not final[0].get('references'):
              raise RuntimeError({'P1412_final_verification_failed':final_q})
          print(json.dumps({'ok':True,'person':PERSON,'removed':ENGLISH,'retained':PERSIAN,'retained_reference_count':len(final[0].get('references',[])),'lastrevid':after.get('lastrevid')},ensure_ascii=False,indent=2))

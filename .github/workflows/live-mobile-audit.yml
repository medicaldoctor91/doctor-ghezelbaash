name: Concise Mobile Candidate Audit

on:
  pull_request:

permissions:
  contents: read

jobs:
  candidate:
    if: github.head_ref == 'refactor/minimal-mobile-source'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refactor/minimal-mobile-source
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm install --global npm@11.19.0
      - run: npm ci
      - name: Build concise authoritative page candidate
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          path = Path('src/pages/index.md')
          source = path.read_text()
          heading_re = re.compile(r'(^<h([1-5])\b[^\n]*>.*?</h\2>\s*$)', re.M)
          parts = heading_re.split(source)
          output = [parts[0]]

          def first_answer(content):
              blocks = [block.strip() for block in re.split(r'\n\s*\n', content) if block.strip()]
              if not blocks:
                  return ''
              block = blocks[0]
              limit = 1100
              if len(block) <= limit:
                  return block
              prefix = suffix = ''
              inner = block
              if block.startswith('<p') and block.endswith('</p>'):
                  opening_end = block.find('>') + 1
                  prefix, suffix = block[:opening_end], '</p>'
                  inner = block[opening_end:-4]
              elif block.startswith('<'):
                  return block
              cut = max(320, limit - len(prefix) - len(suffix))
              positions = [inner.rfind(mark, 0, cut) for mark in ('.', '؟', '!', '؛')]
              sentence_end = max(positions)
              if sentence_end < 300:
                  sentence_end = cut - 1
              return prefix + inner[:sentence_end + 1].rstrip() + suffix

          for index in range(1, len(parts), 3):
              heading = parts[index]
              level = int(parts[index + 1])
              content = parts[index + 2]
              if level <= 3:
                  output.append(heading + content)
              elif level == 4:
                  answer = first_answer(content)
                  output.append(heading + ('\n\n' + answer + '\n\n' if answer else '\n'))
              else:
                  match = re.search(r'\bid="([^"]+)"', heading)
                  if match:
                      output.append(f'<span id="{match.group(1)}" class="semantic-alias-anchor" aria-hidden="true"></span>\n')

          candidate = ''.join(output)
          ids = set(re.findall(r'\bid="([^"]+)"', candidate))
          links = set(re.findall(r'href="#([^"]+)"', candidate))
          broken = sorted(links - ids)
          if broken:
              raise SystemExit(f'Broken fragment targets: {broken[:20]}')
          path.write_text(candidate)
          print(f'index.md: {len(source.encode()):,} -> {len(candidate.encode()):,} bytes')
          print(f'Preserved headings: h2={candidate.count("<h2")}, h3={candidate.count("<h3")}, h4={candidate.count("<h4")}')
          print(f'Preserved legacy fragment aliases: {candidate.count("semantic-alias-anchor")}')
          PY
          npm run validate
      - name: Start Brotli static server
        shell: bash
        run: |
          cat > /tmp/br-server.mjs <<'NODE'
          import http from 'node:http';
          import { readFile, stat } from 'node:fs/promises';
          import path from 'node:path';
          import { brotliCompressSync, constants } from 'node:zlib';
          const root = path.resolve('dist');
          const mime = { '.html':'text/html; charset=utf-8', '.css':'text/css; charset=utf-8', '.webp':'image/webp', '.jpg':'image/jpeg', '.png':'image/png', '.ico':'image/x-icon', '.json':'application/json; charset=utf-8', '.webmanifest':'application/manifest+json; charset=utf-8' };
          const server = http.createServer(async (request, response) => {
            try {
              const url = new URL(request.url, 'http://127.0.0.1');
              let pathname = decodeURIComponent(url.pathname);
              if (pathname.endsWith('/')) pathname += 'index.html';
              let file = path.resolve(root, '.' + pathname);
              if (!file.startsWith(root)) throw new Error('unsafe path');
              const info = await stat(file);
              if (info.isDirectory()) file = path.join(file, 'index.html');
              const raw = await readFile(file);
              const ext = path.extname(file);
              const compress = request.headers['accept-encoding']?.includes('br') && ['.html','.css','.json','.xml','.txt','.md','.ttl','.svg'].includes(ext);
              const body = compress ? brotliCompressSync(raw, { params: { [constants.BROTLI_PARAM_QUALITY]: 6 } }) : raw;
              response.writeHead(200, {
                'Content-Type': mime[ext] ?? 'application/octet-stream',
                'Content-Length': body.length,
                ...(compress ? { 'Content-Encoding': 'br', 'Vary': 'Accept-Encoding' } : {}),
                'Cache-Control': 'no-store',
              });
              response.end(body);
            } catch {
              response.writeHead(404).end('Not found');
            }
          });
          server.listen(4173, '127.0.0.1');
          NODE
          node /tmp/br-server.mjs >/tmp/br-server.log 2>&1 &
          for i in {1..30}; do curl -fsS --compressed http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/br-server.log
          exit 1
      - name: Measure candidate mobile and desktop performance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p candidate-lighthouse
          for run in 1 2 3; do
            npx --yes lighthouse http://127.0.0.1:4173/ \
              --only-categories=performance \
              --output=json \
              --output-path="candidate-lighthouse/mobile-${run}.json" \
              --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" \
              --quiet
          done
          npx --yes lighthouse http://127.0.0.1:4173/ \
            --preset=desktop \
            --only-categories=performance \
            --output=json \
            --output-path="candidate-lighthouse/desktop.json" \
            --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" \
            --quiet
      - name: Extract candidate diagnostics
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const zlib = require('node:zlib');
          const html = fs.readFileSync('dist/index.html');
          const results = [];
          for (const name of fs.readdirSync('candidate-lighthouse').filter(x => x.endsWith('.json')).sort()) {
            const lhr = JSON.parse(fs.readFileSync(path.join('candidate-lighthouse', name), 'utf8'));
            const a = lhr.audits;
            const request = a['network-requests']?.details?.items?.find(x => x.resourceType === 'Document');
            const lcp = a['lcp-breakdown-insight']?.details?.items?.find(x => x.type === 'node');
            const dom = a['dom-size-insight']?.details?.debugData;
            results.push({
              name,
              performance: lhr.categories.performance.score * 100,
              fcp: a['first-contentful-paint']?.numericValue,
              lcp: a['largest-contentful-paint']?.numericValue,
              tbt: a['total-blocking-time']?.numericValue,
              cls: a['cumulative-layout-shift']?.numericValue,
              mainThread: a['mainthread-work-breakdown']?.numericValue,
              documentTransfer: request?.transferSize,
              documentResource: request?.resourceSize,
              totalElements: dom?.totalElements,
              maxChildren: dom?.maxChildren,
              lcpSelector: lcp?.selector,
              lcpLabel: lcp?.nodeLabel,
            });
          }
          const summary = {
            htmlRawBytes: html.length,
            htmlBrotliBytes: zlib.brotliCompressSync(html, { params: { [zlib.constants.BROTLI_PARAM_QUALITY]: 6 } }).length,
            results,
          };
          fs.writeFileSync('candidate-lighthouse/summary.json', JSON.stringify(summary, null, 2));
          console.log(JSON.stringify(summary, null, 2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: concise-mobile-candidate
          path: candidate-lighthouse/
          retention-days: 1

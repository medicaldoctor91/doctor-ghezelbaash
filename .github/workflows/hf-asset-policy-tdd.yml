name: HF platform asset policy TDD
on:
  push:
    branches: [ops/platform-convergence-clean-20261017]
    paths:
      - tests/hf-platform-assets.test.py
      - .github/scripts/platform_convergence_hardened.py
      - .github/workflows/hf-asset-policy-tdd.yml
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Run HF asset policy regression tests
        run: python tests/hf-platform-assets.test.py

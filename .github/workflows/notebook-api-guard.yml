name: Verify notebook API representation guard
on:
  push:
    branches: [codex/cohort24-notebook-api-guard]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install requests 'pyarrow==22.0.0' 'kaggle==2.2.4' 'rdflib>=7,<8' 'pyshacl>=0.30,<1' 'mlcroissant==1.1.1' 'PyLD>=2,<4' PyYAML
      - run: |
          python tests/coordinated-doi-release.test.py
          python tests/platform-publication.test.py
          python tests/doi-validation.test.py
          python tests/platform-bundle-sync.test.py

name: Temporary cleanup Wikipedia audit files
on:
  push:
    branches: [main]
    paths: ['.github/workflows/_tmp-wikipedia-cleanup.yml']
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Remove temporary audit files
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/_tmp-wikipedia-live-audit.yml \
            .github/workflows/_tmp-wikipedia-compact-audit.yml \
            .github/workflows/_tmp-wikipedia-detail-audit.yml \
            .github/workflows/_tmp-wikipedia-cleanup.yml \
            wikimedia/_tmp-wikipedia-live-audit.json \
            wikimedia/_tmp-wikipedia-compact-audit.json \
            wikimedia/_tmp-wikipedia-detail-audit.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove temporary Wikipedia audit files'
          git push

name: Apply clean-slate normalization
on:
  push:
    branches: [cleanup/clean-slate-contracts]
permissions:
  contents: write
jobs:
  normalize:
    if: ${{ !contains(github.event.head_commit.message, '[clean-slate-apply]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: cleanup/clean-slate-contracts
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Normalize current architecture
        shell: python
        run: |
          import json,re
          from pathlib import Path

          def load(path): return json.loads(Path(path).read_text())
          def save(path,value): Path(path).write_text(json.dumps(value,ensure_ascii=False,indent=2)+'\n')
          def replace_once(path,old,new):
              p=Path(path); s=p.read_text()
              if s.count(old)!=1: raise SystemExit(f'{path}: expected one occurrence of {old[:80]!r}, found {s.count(old)}')
              p.write_text(s.replace(old,new,1))

          pkg=load('package.json')
          pkg['name']='doctor-ghezelbaash'
          pkg['scripts']['validate:release-contract']='node scripts/validate-release-contract.mjs'
          pkg['scripts']['validate:cloudflare']='python scripts/configure-cloudflare-edge.py --self-test && python scripts/test-cloudflare-edge-reconciliation.py'
          save('package.json',pkg)
          lock=load('package-lock.json'); lock['name']='doctor-ghezelbaash'; lock['packages']['']['name']='doctor-ghezelbaash'; save('package-lock.json',lock)

          inv=load('src/data/release-invariants.json')
          for key in ['release','date','reviewedBy','postalCode','placeId','googleKg','clinicKg','aliases','officialAliases','retrievalVariants','reconciliationAliases','priceRange']:
              inv.pop(key,None)
          save('src/data/release-invariants.json',inv)

          old=load('src/data/visible-contract.json')
          visible={
            'schemaVersion':old['schemaVersion'],
            'policy':'cryptographic-visible-dom-contract',
            'mutableSelector':old['mutableAfterReleaseSelector'],
            'protected':old['protected'],
            'visibleDomSha256':old['finalVisibleDomSha256'],
            'visibleDomRecords':old['finalVisibleDomRecords'],
            'visibleDomNormalization':old['finalVisibleDomNormalization'],
            'visibleDomBytes':old['finalVisibleDomBytes'],
          }
          save('src/data/visible-contract.json',visible)

          Path('scripts/validate-visible-freeze.mjs').write_text("""import {spawnSync} from 'node:child_process';
          import {readFile} from 'node:fs/promises';
          const html=process.argv[2]||'dist/index.html',contract=JSON.parse(await readFile('src/data/visible-contract.json','utf8'));
          if(!/^[0-9a-f]{64}$/.test(contract.visibleDomSha256||''))throw new Error('Visible DOM contract hash is missing');
          const r=spawnSync(process.execPath,['scripts/compute-visible-contract.mjs',html,'--summary'],{encoding:'utf8',maxBuffer:4*1024*1024});
          if(r.error)throw r.error;if(r.status!==0)throw new Error(r.stderr||r.stdout);
          const result=JSON.parse(r.stdout);if(result.sha256!==contract.visibleDomSha256)throw new Error(`Visible DOM contract violation: current=${result.sha256} expected=${contract.visibleDomSha256}`);
          if(contract.visibleDomRecords&&result.records!==contract.visibleDomRecords)throw new Error(`Visible DOM record-count drift: current=${result.records} expected=${contract.visibleDomRecords}`);
          console.log(JSON.stringify({visibleContract:true,sha256:result.sha256,records:result.records,bytes:result.bytes,mutableSelector:contract.mutableSelector},null,2));
          """.replace('          ','',1))

          p=Path('scripts/finalize-dist.mjs'); s=p.read_text()
          swaps={
            "const datasetName=typeof dataset?.name==='string'?dataset.name:'Dr. Saeed Ghezelbash Public Knowledge Graph';":"if(!dataset?.name)throw new Error('Canonical Dataset node/name missing before DIST finalization');\nconst datasetName=dataset.name;",
            "generatedAt,canonicalUrl:release.canonicalUrl,release:inv.release,baseRelease:release.release,liveRevision,":"generatedAt,canonicalUrl:release.canonicalUrl,release:release.release,baseRelease:release.release,liveRevision,",
            "primaryEntity:{name:'Saeed Ghezelbash',fullNameAliases:inv.officialAliases??inv.aliases,googleKnowledgeGraphId:inv.googleKg,wikidata:'Q140287622'},":"primaryEntity:{name:release.primaryEntity.name,fullNameAliases:release.primaryEntity.officialAliases,googleKnowledgeGraphId:release.primaryEntity.googleKnowledgeGraphId,wikidata:release.primaryEntity.wikidata},",
            "supportingClinic:{googleLocalKgmid:inv.clinicKg,placeId:inv.placeId,cid:'12350483144643112463',postalCode:inv.postalCode,hours:'Saturday–Thursday 16:00–22:00; Friday closed',owner:release.primaryEntity.id},":"supportingClinic:{googleLocalKgmid:release.clinic.googleLocalKgmid,placeId:release.clinic.placeId,cid:release.clinic.cid,postalCode:release.clinic.postalCode,hours:release.clinic.hours,owner:release.primaryEntity.id},",
            "review:{date:release.medicalReviewedAt,reviewedBy:inv.reviewedBy},":"review:{date:release.medicalReviewedAt,reviewedBy:release.reviewedBy},",
            "postalCode:inv.postalCode,requiredAliasesPresent:(inv.aliases??[]).every(x=>JSON.stringify(graph).includes(x))":"postalCode:release.clinic.postalCode,requiredAliasesPresent:release.primaryEntity.officialAliases.every(x=>JSON.stringify(graph).includes(x))",
            "fridayClosed:true,localTruthOwnerConfirmed:true":"fridayClosed:release.clinic.fridayClosed,localTruthOwnerConfirmed:release.clinic.ownerConfirmed",
            "mutableVisibleSelector:visibleContract.mutableAfterReleaseSelector":"mutableVisibleSelector:visibleContract.mutableSelector",
          }
          for a,b in swaps.items():
              if s.count(a)!=1: raise SystemExit(f'finalize-dist missing unique pattern: {a[:80]} count={s.count(a)}')
              s=s.replace(a,b,1)
          p.write_text(s)

          p=Path('scripts/promote-release.mjs'); s=p.read_text()
          s=s.replace("must(z&&Array.isArray(z.releaseHistory),'release.json must be migrated to releaseHistory[] before promotion');","must(z&&Array.isArray(z.releaseHistory),'Zenodo release truth requires releaseHistory[]');")
          s=re.sub(r"\nfor\(const forbidden of \['state','draftApi','publishedApi','previousVersion','historicalVersion'\]\)must\([^\n]+\);",'',s,count=1)
          s=re.sub(r"\nconst inv=await readJson\('src/data/release-invariants.json'\);inv\.release=next\.release;inv\.date=next\.date;await writeJson\('src/data/release-invariants.json',inv\);",'',s,count=1)
          p.write_text(s)

          p=Path('scripts/validate-source.mjs'); s=p.read_text()
          s=s.replace(",inv=await readJson('src/data/release-invariants.json')",'')
          start=s.find("for(const f of ['scripts/generate-v122-overlays.mjs'")
          end=s.find('const packageJson=',start)
          if start<0 or end<0: raise SystemExit('validate-source archaeology block not found')
          s=s[:start]+s[end:]
          for line in [
            "if(packageJson.includes('generate-v122-overlays')||packageJson.includes('finalize-v122-serving'))fail('Obsolete version-specific generator/finalizer still wired');\n",
            "for(const token of ['migrate-release-reputation-snapshot.mjs','sync-media-references.mjs','\"media:sync\"'])if(packageJson.includes(token))fail(`Build-time source mutation path still wired: ${token}`);\n",
          ]:
              if line not in s: raise SystemExit('validate-source expected historical rule missing')
              s=s.replace(line,'',1)
          anchor="if(!packageJson.includes('\"prepare:generated\": \"npm run validate:media-references && npm run rdf:deps && npm run rdf:generate && npm run generate\"'))fail('Generated preparation must be read-only against tracked canonical source');"
          if anchor not in s: raise SystemExit('validate-source prepare anchor missing')
          s=s.replace(anchor,"if(!packageJson.includes('\\\"validate:release-contract\\\": \\\"node scripts/validate-release-contract.mjs\\\"'))fail('Generic release-contract validator wiring missing');\n"+anchor,1)
          s=s.replace("if(release.release!==inv.release||release.dateModified!==inv.date)fail('Release/invariant current identity drift');",'',1)
          start=s.find("const forbidden=['secondary ai/ml distribution'")
          end=s.find('const redirects=',start)
          if start<0 or end<0: raise SystemExit('validate-source wording-history block not found')
          s=s[:start]+s[end:]
          p.write_text(s)

          p=Path('scripts/zenodo_release.py'); s=p.read_text(); s=s.replace('Fail-closed Zenodo v1.2.2 preservation lifecycle: reserve -> stage -> publish -> verify-public.','Fail-closed Zenodo preservation lifecycle: reserve -> stage -> publish -> verify-public.',1); p.write_text(s)

          p=Path('scripts/configure-cloudflare-edge.py'); s=p.read_text()
          s,n=re.subn(r"LEGACY_BLOG_SINGLE_REDIRECT_REFS = \{.*?\}\n",'',s,count=1,flags=re.S)
          if n!=1: raise SystemExit('Cloudflare implementation-ref block not found')
          s=s.replace('            owns_legacy_ref = current.get("ref") in LEGACY_BLOG_SINGLE_REDIRECT_REFS\n            if blog_host not in expression and not owns_legacy_ref:\n','            if blog_host not in expression:\n',1)
          s=s.replace('"Refusing to delete a legacy blog redirect with an ambiguous "','"Refusing to delete a competing blog redirect with an ambiguous "',1)
          s=s.replace('print("LEGACY_BLOG_SINGLE_REDIRECT_REMOVED", current.get("ref") or current["id"])','print("BLOG_SINGLE_REDIRECT_CONFLICT_REMOVED", current.get("ref") or current["id"])',1)
          s=s.replace('            legacy = [','            conflicting = [',1)
          s=s.replace('            if len(legacy) > 1:\n                raise CloudflareError(f"Ambiguous legacy catchalls for {host}")','            if len(conflicting) > 1:\n                raise CloudflareError(f"Ambiguous competing catchalls for {host}")',1)
          s=s.replace('            # the legacy rule. If creation fails, the legacy redirect remains.\n            if legacy:','            # a competing rule. If creation fails, the existing redirect remains.\n            if conflicting:',1)
          s=s.replace("{legacy[0]['id']}","{conflicting[0]['id']}",1)
          s=s.replace('"SUBDOMAIN_SINGLE_REDIRECT_LEGACY_REMOVED_AFTER_CREATE"','"SUBDOMAIN_SINGLE_REDIRECT_CONFLICT_REMOVED_AFTER_CREATE"',1)
          s=s.replace('legacy[0].get("ref") or legacy[0]["id"]','conflicting[0].get("ref") or conflicting[0]["id"]',1)
          p.write_text(s)

          old_test=Path('scripts/test-cloudflare-subdomain-migration.py'); test=old_test.read_text()
          test=test.replace('Offline transaction and idempotence test for subdomain redirect migration.','Offline transaction and idempotence test for the Cloudflare edge contract.')
          test=test.replace('legacy_rule','existing_rule').replace('dashboard_manual_','existing_rule_').replace('Legacy dashboard redirect','Pre-existing redirect')
          test=test.replace('zone:legacy-blog-deleted','zone:conflicting-blog-deleted').replace('zone:legacy-single-deleted','zone:conflicting-single-deleted')
          test=test.replace('higher-priority legacy blog Single Redirect','higher-priority competing blog Single Redirect')
          test=test.replace('Legacy four-rule migration did not converge to three catchalls','Redirect reconciliation did not converge to three managed catchalls')
          test=test.replace('Legacy blog catchall was removed before Bulk Redirect readiness','Competing blog catchall was removed before Bulk Redirect readiness')
          test=test.replace('"zone:legacy-blog-deleted"','"zone:conflicting-blog-deleted"')
          Path('scripts/test-cloudflare-edge-reconciliation.py').write_text(test); old_test.unlink()

          old_validator=Path('scripts/validate-v122-contract.mjs')
          if not old_validator.exists(): raise SystemExit('version-specific validator missing before replacement')
          old_validator.unlink()
      - name: Commit normalized architecture
        shell: bash
        run: |
          set -euo pipefail
          git config user.name ghezelbaash-clean-slate
          git config user.email actions@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m '[clean-slate-apply] Normalize architecture to current positive contracts'
          git push origin HEAD:cleanup/clean-slate-contracts

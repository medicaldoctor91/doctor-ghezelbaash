name: Live Production Contract

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-production-contract
  cancel-in-progress: false

jobs:
  verify-live:
    name: Revision-aware no-cache HTTP and representation contract
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Verify exact deployed Cloudflare revision and contract
        env:
          EXPECTED_DEPLOYMENT_SHA: ${{ github.sha }}
          LIVE_VERIFY_ATTEMPTS: 20
          LIVE_VERIFY_DELAY_MS: 15000
        run: node scripts/verify-live.mjs

name: Unzip Zip on Main

on:
  push:
    branches: [main]
    paths:
      - '**/*.zip'

permissions:
  contents: write
  actions: read

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect and extract zip files
        id: extract
        run: |
          set -euo pipefail
          mapfile -t ZIPS < <(find . -type f -name '*.zip' -not -path './.git/*' | sort)
          if [ ${#ZIPS[@]} -eq 0 ]; then
            echo "No .zip file found on main."
            echo "found=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "found=true" >> $GITHUB_OUTPUT
          echo "Found ${#ZIPS[@]} zip file(s)."

          for ZIP in "${ZIPS[@]}"; do
            echo "=== Processing: $ZIP ==="
            TMP=$(mktemp -d)
            unzip -q -o "$ZIP" -d "$TMP"

            # If the zip contains exactly one top-level directory, flatten it
            TOP_ITEMS=("$TMP"/*)
            if [ ${#TOP_ITEMS[@]} -eq 1 ] && [ -d "${TOP_ITEMS[0]}" ]; then
              echo "Flattening single top-level directory: $(basename "${TOP_ITEMS[0]}")"
              # Move contents of that dir to repo root
              shopt -s dotglob
              mv "${TOP_ITEMS[0]}"/* .
              shopt -u dotglob
              rmdir "${TOP_ITEMS[0]}" 2>/dev/null || true
            else
              echo "Moving all extracted items to repo root"
              shopt -s dotglob
              mv "$TMP"/* .
              shopt -u dotglob
            fi

            rm -rf "$TMP"
            rm -f "$ZIP"
            echo "Removed $ZIP after extraction"
          done

      - name: Commit extracted files
        if: steps.extract.outputs.found == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "Nothing to commit after extraction."
          else
            git commit -m "chore: auto-unzip contents of uploaded zip file(s)"
            git push
          fi

      - name: Enforce 2-run limit and self-delete
        if: steps.extract.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Count successful runs of this workflow so far (including current)
          TOTAL=$(gh api "repos/${{ github.repository }}/actions/workflows/unzip-on-zip.yml/runs?status=success&per_page=10" --jq '.total_count' || echo 0)
          echo "Successful runs of this workflow so far: $TOTAL"

          if [ "$TOTAL" -ge 2 ]; then
            echo "Usage limit of 2 reached. Self-deleting this workflow..."
            if [ -f .github/workflows/unzip-on-zip.yml ]; then
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git rm -f .github/workflows/unzip-on-zip.yml
              git commit -m "chore: self-delete unzip workflow after reaching 2-use limit" || true
              git push || true
              echo "Workflow deleted. Further zip uploads will no longer auto-unzip."
            fi
          else
            echo "Usage remaining: $((2 - TOTAL))"
          fi

name: Cloudflare full zone audit

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]

permissions:
  contents: read

jobs:
  audit:
    if: github.event.pull_request.head.ref == 'cloudflare-zone-audit-20260809'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 884d1d90bd1fb6ecca14992c6c60d677
      ZONE_NAME: ghezelbaash.ir
    steps:
      - name: Create short-lived zone-admin token, audit everything relevant, revoke token
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import datetime as dt
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          ACCOUNT=os.environ['CLOUDFLARE_ACCOUNT_ID']
          ZONE_NAME=os.environ['ZONE_NAME']
          MGMT=os.environ['CLOUDFLARE_API_TOKEN']
          BASE='https://api.cloudflare.com/client/v4'

          def call(token, method, path, body=None):
              data=None if body is None else json.dumps(body,separators=(',',':')).encode()
              req=urllib.request.Request(BASE+path, data=data, method=method, headers={
                  'Authorization':f'Bearer {token}',
                  'Accept':'application/json',
                  'Content-Type':'application/json',
                  'User-Agent':'ghezelbaash-zone-admin-audit/1.0',
              })
              try:
                  with urllib.request.urlopen(req, timeout=40) as r:
                      raw=r.read().decode('utf-8','replace')
                      return r.status, json.loads(raw) if raw else {}
              except urllib.error.HTTPError as e:
                  raw=e.read().decode('utf-8','replace')
                  try: payload=json.loads(raw) if raw else {}
                  except Exception: payload={'raw':raw[:1200]}
                  return e.code,payload
              except Exception as e:
                  return 0,{'error':type(e).__name__,'detail':str(e)[:300]}

          # Resolve exact zone.
          q=urllib.parse.urlencode({'name':ZONE_NAME,'account.id':ACCOUNT,'per_page':50})
          st,z=call(MGMT,'GET','/zones?'+q)
          if st!=200 or z.get('success') is not True or not z.get('result'):
              raise SystemExit(f'Zone resolution failed HTTP {st}: {z.get("errors")}')
          zone=z['result'][0]
          ZONE=zone['id']

          # Fetch all zone-scoped permission groups and mint a one-hour admin token.
          st,pg=call(MGMT,'GET',f'/accounts/{ACCOUNT}/tokens/permission_groups?scope=com.cloudflare.api.account.zone')
          if st!=200 or pg.get('success') is not True:
              raise SystemExit(f'Permission-group lookup failed HTTP {st}: {pg.get("errors")}')
          groups=[]
          for g in pg.get('result') or []:
              scopes=g.get('scopes') or []
              if 'com.cloudflare.api.account.zone' in scopes:
                  groups.append({'id':g['id']})
          if not groups:
              raise SystemExit('No zone-scoped permission groups returned')

          expires=(dt.datetime.now(dt.timezone.utc)+dt.timedelta(hours=1)).replace(microsecond=0).isoformat().replace('+00:00','Z')
          create_body={
              'name':'Temporary Ghezelbaash Zone Admin Audit',
              'expires_on':expires,
              'policies':[{
                  'effect':'allow',
                  'resources':{f'com.cloudflare.api.account.zone.{ZONE}':'*'},
                  'permission_groups':groups,
              }],
          }
          st,created=call(MGMT,'POST',f'/accounts/{ACCOUNT}/tokens',create_body)
          if st not in (200,201) or created.get('success') is not True:
              raise SystemExit(f'Temporary token creation failed HTTP {st}: {created.get("errors")}')
          temp_result=created.get('result') or {}
          TEMP=temp_result.get('value')
          TEMP_ID=temp_result.get('id')
          if not TEMP or not TEMP_ID:
              raise SystemExit('Cloudflare created token without an id/value')

          print(f'TEMP_ZONE_ADMIN_CREATED permission_groups={len(groups)} expires={expires}')

          report={
              'zone':{
                  'id_masked':ZONE[:6]+'…'+ZONE[-6:],
                  'name':zone.get('name'),'status':zone.get('status'),'paused':zone.get('paused'),
                  'type':zone.get('type'),'plan':(zone.get('plan') or {}).get('name'),
                  'name_servers':zone.get('name_servers'),
              },
              'settings':{},'universal_ssl':{},'dnssec':{},'dns_records':[],
              'bot_management':{},'page_rules':[], 'rulesets':[], 'ruleset_details':[],
              'custom_hostnames':[], 'errors':[]
          }

          try:
              setting_ids=['ssl','always_use_https','tls_1_3','min_tls_version','http2','http3','brotli','early_hints','automatic_https_rewrites','ipv6','websockets','rocket_loader','browser_check','security_level','challenge_ttl','browser_cache_ttl','cache_level','security_header','0rtt','ciphers','opportunistic_encryption','pseudo_ipv4','ip_geolocation','webp','polish','mirage','minify','always_online','development_mode']
              for sid in setting_ids:
                  s,p=call(TEMP,'GET',f'/zones/{ZONE}/settings/{sid}')
                  if s==200 and p.get('success') is True:
                      r=p.get('result') or {}
                      report['settings'][sid]={'value':r.get('value'),'editable':r.get('editable'),'modified_on':r.get('modified_on')}
                  else:
                      report['settings'][sid]={'http_status':s,'errors':p.get('errors')}

              s,p=call(TEMP,'GET',f'/zones/{ZONE}/ssl/universal/settings')
              report['universal_ssl']=(p.get('result') or {}) if s==200 and p.get('success') is True else {'http_status':s,'errors':p.get('errors')}

              s,p=call(TEMP,'GET',f'/zones/{ZONE}/dnssec')
              if s==200 and p.get('success') is True:
                  r=p.get('result') or {}
                  report['dnssec']={k:r.get(k) for k in ('status','flags','algorithm','key_type','digest_type','digest_algorithm','ds','key_tag','public_key','modified_on')}
              else: report['dnssec']={'http_status':s,'errors':p.get('errors')}

              s,p=call(TEMP,'GET',f'/zones/{ZONE}/dns_records?per_page=100')
              if s==200 and p.get('success') is True:
                  for r in p.get('result') or []:
                      content=r.get('content')
                      if r.get('type')=='TXT' and isinstance(content,str) and len(content)>240:
                          content=content[:160]+'…'+content[-60:]
                      report['dns_records'].append({
                          'id_masked':(r.get('id') or '')[:7]+'…','type':r.get('type'),'name':r.get('name'),
                          'content':content,'priority':r.get('priority'),'proxied':r.get('proxied'),
                          'proxiable':r.get('proxiable'),'ttl':r.get('ttl'),'comment':r.get('comment'),
                      })
              else: report['errors'].append({'dns_records_http':s,'errors':p.get('errors')})

              s,p=call(TEMP,'GET',f'/zones/{ZONE}/bot_management')
              report['bot_management']=(p.get('result') or {}) if s==200 and p.get('success') is True else {'http_status':s,'errors':p.get('errors')}

              s,p=call(TEMP,'GET',f'/zones/{ZONE}/pagerules?status=active&order=status&direction=desc&match=all')
              if s==200 and p.get('success') is True:
                  for r in p.get('result') or []:
                      report['page_rules'].append({'id_masked':(r.get('id') or '')[:7]+'…','status':r.get('status'),'priority':r.get('priority'),'targets':r.get('targets'),'actions':r.get('actions')})
              else: report['errors'].append({'pagerules_http':s,'errors':p.get('errors')})

              s,p=call(TEMP,'GET',f'/zones/{ZONE}/rulesets')
              if s==200 and p.get('success') is True:
                  for r in p.get('result') or []:
                      slim={'id':r.get('id'),'name':r.get('name'),'kind':r.get('kind'),'phase':r.get('phase'),'version':r.get('version')}
                      report['rulesets'].append({**slim,'id':(r.get('id') or '')[:7]+'…'})
                      if r.get('kind')=='zone':
                          rs,detail=call(TEMP,'GET',f'/zones/{ZONE}/rulesets/{r.get("id")}')
                          if rs==200 and detail.get('success') is True:
                              d=detail.get('result') or {}
                              report['ruleset_details'].append({
                                  'name':d.get('name'),'kind':d.get('kind'),'phase':d.get('phase'),'version':d.get('version'),
                                  'rules':[{k:rule.get(k) for k in ('id','version','action','expression','description','enabled','action_parameters')} for rule in (d.get('rules') or [])]
                              })
                          else: report['errors'].append({'ruleset_detail':r.get('name'),'http':rs,'errors':detail.get('errors')})
              else: report['errors'].append({'rulesets_http':s,'errors':p.get('errors')})

              s,p=call(TEMP,'GET',f'/zones/{ZONE}/custom_hostnames?page=1&per_page=50')
              if s==200 and p.get('success') is True:
                  for r in p.get('result') or []:
                      report['custom_hostnames'].append({'hostname':r.get('hostname'),'status':r.get('status'),'ssl':(r.get('ssl') or {}).get('status')})
              elif s not in (400,403,404): report['errors'].append({'custom_hostnames_http':s,'errors':p.get('errors')})

              print('FULL_ZONE_AUDIT_JSON_BEGIN')
              print(json.dumps(report,ensure_ascii=False,indent=2,sort_keys=True))
              print('FULL_ZONE_AUDIT_JSON_END')
          finally:
              ds,dp=call(MGMT,'DELETE',f'/accounts/{ACCOUNT}/tokens/{TEMP_ID}')
              print(f'TEMP_ZONE_ADMIN_REVOKE_HTTP={ds} success={dp.get("success")}')
          PY

name: Apply static reputation architecture

on:
  push:
    branches:
      - feat/static-reputation-authority-20260903
    paths:
      - .github/workflows/apply-static-reputation-architecture.yml

permissions:
  contents: write

concurrency:
  group: apply-static-reputation-architecture
  cancel-in-progress: false

jobs:
  migrate-validate-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/static-reputation-authority-20260903
          fetch-depth: 0

      - name: Migrate the source to a static-only reputation architecture
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import json
          import re
          from pathlib import Path

          root = Path.cwd()

          def read(path: str) -> str:
              return (root / path).read_text(encoding="utf-8")

          def write(path: str, value: str) -> None:
              target = root / path
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(value, encoding="utf-8")

          def replace_once(value: str, old: str, new: str, label: str) -> str:
              count = value.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one exact match, found {count}")
              return value.replace(old, new, 1)

          def remove_script_block_with_token(value: str, token: str) -> str:
              blocks = list(re.finditer(r"<script\b[^>]*>[\s\S]*?</script>", value, re.I))
              matches = [match for match in blocks if token in match.group(0)]
              if len(matches) != 1:
                  raise SystemExit(
                      f"Expected one dedicated runtime reputation script, found {len(matches)}"
                  )
              block = matches[0].group(0)
              unrelated = (
                  "IntersectionObserver",
                  "history.pushState",
                  "history.replaceState",
                  "scrollIntoView",
              )
              if any(marker in block for marker in unrelated):
                  raise SystemExit(
                      "Reputation endpoint shares a script block with unrelated navigation logic"
                  )
              return value[: matches[0].start()] + value[matches[0].end() :]

          def inject_astro_component(value: str) -> str:
              component_name = "StaticClinicReputation"
              import_line = (
                  'import StaticClinicReputation from "./StaticClinicReputation.astro";'
              )
              if import_line not in value:
                  if not value.startswith("---"):
                      raise SystemExit("GuideNavigator.astro has no Astro frontmatter")
                  frontmatter_end = value.find("\n---", 3)
                  if frontmatter_end < 0:
                      raise SystemExit("GuideNavigator.astro frontmatter is not closed")
                  value = (
                      value[:frontmatter_end]
                      + "\n"
                      + import_line
                      + value[frontmatter_end:]
                  )
              if f"<{component_name}" not in value:
                  h1_close = value.find("</h1>")
                  if h1_close < 0:
                      raise SystemExit("Could not locate the primary h1 in GuideNavigator.astro")
                  insertion = h1_close + len("</h1>")
                  value = (
                      value[:insertion]
                      + "\n          <StaticClinicReputation />"
                      + value[insertion:]
                  )
              return value

          def yaml_step_spans(lines: list[str]) -> list[tuple[int, int]]:
              starts = [
                  index
                  for index, line in enumerate(lines)
                  if re.match(r"^      - (?:name|uses|run):", line)
              ]
              spans = []
              for position, start in enumerate(starts):
                  end = starts[position + 1] if position + 1 < len(starts) else len(lines)
                  spans.append((start, end))
              return spans

          def remove_runtime_secret_steps(value: str) -> str:
              lines = value.splitlines(keepends=True)
              remove: set[int] = set()
              for start, end in yaml_step_spans(lines):
                  block = "".join(lines[start:end])
                  if (
                      "GOOGLE_PLACES_API_KEY" in block
                      and (
                          "wrangler pages secret" in block
                          or "Pages Function" in block
                          or "google-maps-reputation" in block
                      )
                  ):
                      remove.update(range(start, end))
              result = "".join(
                  line for index, line in enumerate(lines) if index not in remove
              )
              if "wrangler pages secret" in result:
                  raise SystemExit("Cloudflare runtime secret provisioning remains")
              return result

          def ensure_schedule(value: str) -> str:
              if re.search(r"^\s{2}schedule:\s*$", value, re.M):
                  return value
              match = re.search(r"^on:\s*$", value, re.M)
              if not match:
                  raise SystemExit("Deployment workflow has no block-style on: section")
              insertion = match.end()
              return (
                  value[:insertion]
                  + '\n  schedule:\n    - cron: "17 */6 * * *"'
                  + value[insertion:]
              )

          def inject_observer_step(value: str) -> str:
              if "fetch-google-places-reputation.mjs --github-env" in value:
                  return value
              build_step = re.search(
                  r"^      - name:.*(?:build|release).*$(?:(?!^      - ).)*?^\s{8}run:\s*(?:npm run release|npm run build).*$",
                  value,
                  re.I | re.M | re.S,
              )
              if not build_step:
                  command = re.search(
                      r"^\s{8}run:\s*(?:npm run release|npm run build).*$", value, re.M
                  )
                  if not command:
                      raise SystemExit("Could not locate the production build command")
                  step_start = value.rfind("\n      - ", 0, command.start())
                  if step_start < 0:
                      raise SystemExit("Could not locate the production build step boundary")
                  insertion = step_start + 1
              else:
                  insertion = build_step.start()
              observer = '''      - name: Resolve bounded static Google Maps reputation observation
                id: reputation
                env:
                  GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
                run: node scripts/fetch-google-places-reputation.mjs --github-env
          '''
              return value[:insertion] + observer + value[insertion:]

          # Delete the only runtime function. Directories disappear naturally in Git.
          function_file = root / "functions/api/google-maps-reputation.js"
          if not function_file.exists():
              raise SystemExit("Expected Cloudflare Pages Function is missing")
          function_file.unlink()

          # Remove the dedicated idle/runtime fetch and bind the static component at source level.
          guide_candidates = []
          for candidate in (root / "src").rglob("*.astro"):
              text = candidate.read_text(encoding="utf-8")
              if "/api/google-maps-reputation" in text:
                  guide_candidates.append(candidate)
          if len(guide_candidates) != 1:
              raise SystemExit(
                  f"Expected one Astro endpoint consumer, found {len(guide_candidates)}"
              )
          guide = guide_candidates[0]
          guide_text = remove_script_block_with_token(
              guide.read_text(encoding="utf-8"), "/api/google-maps-reputation"
          )
          guide_text = inject_astro_component(guide_text)
          guide.write_text(guide_text, encoding="utf-8")

          # The source fallback is populated from one authenticated, validated API observation later.
          write(
              "src/data/reputation-observation.json",
              json.dumps(
                  {
                      "schemaVersion": 1,
                      "entityScope": "clinic",
                      "placeId": "ChIJBT0YDOTt-j8RD-7mAPy6Zas",
                      "rating": None,
                      "userRatingCount": None,
                      "source": "Google Places API (New)",
                      "observedAt": None,
                      "tupleSha256": None,
                  },
                  ensure_ascii=False,
                  indent=2,
              )
              + "\n",
          )

          write(
              "src/lib/reputation-observation.mjs",
              r'''import { createHash } from "node:crypto";
          import fallbackObservation from "../data/reputation-observation.json";
          import release from "../data/release.json";

          const EXPECTED_PLACE_ID = release.clinic.placeId;
          const SOURCE = "Google Places API (New)";

          const canonicalTuple = ({ placeId, rating, userRatingCount }) =>
            JSON.stringify({ placeId, rating, userRatingCount });

          const tupleSha256 = (value) =>
            createHash("sha256").update(canonicalTuple(value)).digest("hex");

          export function normalizeReputationObservation(value) {
            const rating = Number(value?.rating);
            const userRatingCount = Number(value?.userRatingCount);
            const observedAt =
              typeof value?.observedAt === "string" &&
              Number.isFinite(Date.parse(value.observedAt))
                ? new Date(value.observedAt).toISOString()
                : null;
            const normalized = {
              schemaVersion: 1,
              entityScope: "clinic",
              placeId: value?.placeId,
              rating,
              userRatingCount,
              source: SOURCE,
              observedAt,
            };
            if (
              value?.schemaVersion !== 1 ||
              value?.entityScope !== "clinic" ||
              normalized.placeId !== EXPECTED_PLACE_ID ||
              !Number.isFinite(rating) ||
              rating < 1 ||
              rating > 5 ||
              !Number.isSafeInteger(userRatingCount) ||
              userRatingCount < 1 ||
              !observedAt
            )
              return null;
            const expectedHash = tupleSha256(normalized);
            if (
              typeof value?.tupleSha256 === "string" &&
              value.tupleSha256 !== expectedHash
            )
              return null;
            return { ...normalized, tupleSha256: expectedHash };
          }

          export function encodeReputationObservation(value) {
            const normalized = normalizeReputationObservation(value);
            if (!normalized) throw new Error("Invalid reputation observation");
            return Buffer.from(JSON.stringify(normalized), "utf8").toString("base64url");
          }

          export function decodeReputationObservation(value) {
            if (typeof value !== "string" || !value.trim()) return null;
            try {
              return normalizeReputationObservation(
                JSON.parse(Buffer.from(value.trim(), "base64url").toString("utf8")),
              );
            } catch {
              return null;
            }
          }

          export function resolveReputationObservation(
            encoded = process.env.REPUTATION_OBSERVATION_B64,
          ) {
            return (
              decodeReputationObservation(encoded) ||
              normalizeReputationObservation(fallbackObservation)
            );
          }

          export const reputationPlaceId = EXPECTED_PLACE_ID;
          export { tupleSha256 as reputationTupleSha256 };
          ''',
          )

          write(
              "src/components/StaticClinicReputation.astro",
              r'''---
          import release from "../data/release.json";
          import { resolveReputationObservation } from "../lib/reputation-observation.mjs";

          const observation = resolveReputationObservation();
          const mapsHref = `https://www.google.com/maps/search/?api=1&query_place_id=${encodeURIComponent(release.clinic.placeId)}`;
          const ratingFormat = new Intl.NumberFormat("fa-IR", {
            minimumFractionDigits: 1,
            maximumFractionDigits: 1,
          });
          const countFormat = new Intl.NumberFormat("fa-IR");
          const ratingLabel = observation
            ? `امتیاز ${ratingFormat.format(observation.rating)} از ۵ در Google Maps، بر پایه ${countFormat.format(observation.userRatingCount)} نظر`
            : "";
          ---

          {
            observation && (
              <p
                class="clinic-google-reputation"
                data-clinic-reputation
                data-clinic-reputation-place-id={observation.placeId}
                data-clinic-reputation-rating={String(observation.rating)}
                data-clinic-reputation-review-count={String(observation.userRatingCount)}
                data-clinic-reputation-observed-at={observation.observedAt}
                data-clinic-reputation-tuple-sha256={observation.tupleSha256}
              >
                <a
                  href={mapsHref}
                  rel="external noopener noreferrer"
                  aria-label={ratingLabel}
                >
                  <span>امتیاز در Google Maps: </span>
                  <data value={String(observation.rating)}>
                    {ratingFormat.format(observation.rating)}
                  </data>
                  <span aria-hidden="true"> ★ </span>
                  <span>از ۵، بر پایه </span>
                  <data value={String(observation.userRatingCount)}>
                    {countFormat.format(observation.userRatingCount)}
                  </data>
                  <span> نظر</span>
                </a>
              </p>
            )
          }
          ''',
          )

          write(
              "scripts/fetch-google-places-reputation.mjs",
              r'''import { appendFile, readFile, writeFile } from "node:fs/promises";
          import { pathToFileURL } from "node:url";
          import { createHash } from "node:crypto";

          const RELEASE_PATH = new URL("../src/data/release.json", import.meta.url);
          const FALLBACK_PATH = new URL(
            "../src/data/reputation-observation.json",
            import.meta.url,
          );
          const FIELD_MASK = [
            "id",
            "rating",
            "userRatingCount",
            "businessStatus",
            "movedPlace",
            "movedPlaceId",
          ].join(",");

          const canonicalTuple = ({ placeId, rating, userRatingCount }) =>
            JSON.stringify({ placeId, rating, userRatingCount });
          const tupleSha256 = (value) =>
            createHash("sha256").update(canonicalTuple(value)).digest("hex");

          const readJson = async (url) =>
            JSON.parse(await readFile(url, "utf8"));

          export function normalizeGooglePlacesObservation(value, placeId, now = new Date()) {
            const rating = Number(value?.rating);
            const userRatingCount = Number(value?.userRatingCount);
            if (
              value?.id !== placeId ||
              value?.businessStatus !== "OPERATIONAL" ||
              value?.movedPlace ||
              value?.movedPlaceId ||
              !Number.isFinite(rating) ||
              rating < 1 ||
              rating > 5 ||
              !Number.isSafeInteger(userRatingCount) ||
              userRatingCount < 1 ||
              !Number.isFinite(now.getTime())
            )
              return null;
            const observation = {
              schemaVersion: 1,
              entityScope: "clinic",
              placeId,
              rating,
              userRatingCount,
              source: "Google Places API (New)",
              observedAt: now.toISOString(),
            };
            return { ...observation, tupleSha256: tupleSha256(observation) };
          }

          const suspiciousRegression = (previous, current) => {
            const previousCount = Number(previous?.userRatingCount);
            if (!Number.isSafeInteger(previousCount) || previousCount < 1) return false;
            const drop = previousCount - current.userRatingCount;
            return drop > Math.max(10, Math.ceil(previousCount * 0.05));
          };

          export async function fetchGooglePlacesObservation({ apiKey, placeId }) {
            if (typeof apiKey !== "string" || !apiKey.trim())
              throw new Error("GOOGLE_PLACES_API_KEY is required");
            const endpoint = new URL(
              `https://places.googleapis.com/v1/places/${encodeURIComponent(placeId)}`,
            );
            endpoint.searchParams.set("languageCode", "fa");
            endpoint.searchParams.set("regionCode", "IR");
            const response = await fetch(endpoint, {
              cache: "no-store",
              headers: {
                Accept: "application/json",
                "X-Goog-Api-Key": apiKey.trim(),
                "X-Goog-FieldMask": FIELD_MASK,
              },
              redirect: "error",
              signal: AbortSignal.timeout(6000),
            });
            if (!response.ok)
              throw new Error(`Google Places request failed with ${response.status}`);
            const observation = normalizeGooglePlacesObservation(
              await response.json(),
              placeId,
            );
            if (!observation)
              throw new Error("Google Places returned an invalid clinic observation");
            return observation;
          }

          const main = async () => {
            const release = await readJson(RELEASE_PATH);
            const placeId = release?.clinic?.placeId;
            if (typeof placeId !== "string" || !placeId)
              throw new Error("release.clinic.placeId is missing");
            const observation = await fetchGooglePlacesObservation({
              apiKey: process.env.GOOGLE_PLACES_API_KEY,
              placeId,
            });
            let previous = null;
            try {
              previous = await readJson(FALLBACK_PATH);
            } catch {}
            if (suspiciousRegression(previous, observation))
              throw new Error(
                `Suspicious review-count regression: ${previous.userRatingCount} -> ${observation.userRatingCount}`,
              );

            const args = new Set(process.argv.slice(2));
            if (args.has("--write-fallback"))
              await writeFile(
                FALLBACK_PATH,
                `${JSON.stringify(observation, null, 2)}\n`,
                "utf8",
              );
            if (args.has("--github-env")) {
              if (!process.env.GITHUB_ENV)
                throw new Error("GITHUB_ENV is unavailable");
              const encoded = Buffer.from(
                JSON.stringify(observation),
                "utf8",
              ).toString("base64url");
              await appendFile(
                process.env.GITHUB_ENV,
                `REPUTATION_OBSERVATION_B64=${encoded}\n`,
                "utf8",
              );
            }
            console.log(
              JSON.stringify(
                {
                  placeId: observation.placeId,
                  rating: observation.rating,
                  userRatingCount: observation.userRatingCount,
                  observedAt: observation.observedAt,
                  tupleSha256: observation.tupleSha256,
                  upstreamCalls: 1,
                },
                null,
                2,
              ),
            );
          };

          if (import.meta.url === pathToFileURL(process.argv[1]).href)
            main().catch((error) => {
              console.error(error instanceof Error ? error.message : String(error));
              process.exitCode = 1;
            });
          ''',
          )

          write(
              "scripts/validate-reputation-observation.mjs",
              r'''import assert from "node:assert/strict";
          import { existsSync } from "node:fs";
          import { readFile } from "node:fs/promises";
          import {
            decodeReputationObservation,
            encodeReputationObservation,
            normalizeReputationObservation,
            reputationPlaceId,
          } from "../src/lib/reputation-observation.mjs";

          const fallback = JSON.parse(
            await readFile("src/data/reputation-observation.json", "utf8"),
          );
          const normalized = normalizeReputationObservation(fallback);
          assert.ok(normalized, "The source reputation fallback must be valid");
          assert.equal(normalized.entityScope, "clinic");
          assert.equal(normalized.placeId, reputationPlaceId);
          assert.equal(
            decodeReputationObservation(encodeReputationObservation(normalized))
              ?.tupleSha256,
            normalized.tupleSha256,
          );
          assert.equal(
            normalizeReputationObservation({ ...normalized, placeId: "wrong" }),
            null,
          );
          assert.equal(
            normalizeReputationObservation({ ...normalized, rating: 8 }),
            null,
          );
          assert.equal(
            normalizeReputationObservation({ ...normalized, entityScope: "person" }),
            null,
          );
          assert.equal(
            existsSync("functions"),
            false,
            "The production source must be static-assets-only",
          );

          const astroFiles = [];
          const walk = async (directory) => {
            const { readdir } = await import("node:fs/promises");
            for (const entry of await readdir(directory, { withFileTypes: true })) {
              const target = `${directory}/${entry.name}`;
              if (entry.isDirectory()) await walk(target);
              else if (/\.(?:astro|js|mjs|ts|json|ya?ml)$/i.test(entry.name))
                astroFiles.push(target);
            }
          };
          await walk("src");
          for (const file of astroFiles)
            assert.ok(
              !(await readFile(file, "utf8")).includes(
                "/api/google-maps-reputation",
              ),
              `Runtime reputation endpoint remains in ${file}`,
            );

          const guide = await readFile("src/components/GuideNavigator.astro", "utf8");
          assert.match(guide, /StaticClinicReputation/);
          const component = await readFile(
            "src/components/StaticClinicReputation.astro",
            "utf8",
          );
          assert.match(component, /data-clinic-reputation/);
          assert.doesNotMatch(component, /<script\b/i);

          const deploy = await readFile(
            ".github/workflows/cloudflare-pages-deploy.yml",
            "utf8",
          );
          assert.match(deploy, /cron:\s*["']17 \*\/6 \* \* \*["']/);
          assert.match(
            deploy,
            /fetch-google-places-reputation\.mjs --github-env/,
          );
          assert.doesNotMatch(deploy, /wrangler pages secret/);

          console.log(
            JSON.stringify(
              {
                architecture: "static-assets-only",
                entityScope: normalized.entityScope,
                placeId: normalized.placeId,
                rating: normalized.rating,
                userRatingCount: normalized.userRatingCount,
                scheduledCadenceHours: 6,
                runtimeFunction: false,
                runtimeReputationFetch: false,
              },
              null,
              2,
            ),
          );
          ''',
          )

          write(
              "scripts/validate-static-reputation-dist.mjs",
              r'''import assert from "node:assert/strict";
          import { existsSync } from "node:fs";
          import { readFile } from "node:fs/promises";
          import { resolveReputationObservation } from "../src/lib/reputation-observation.mjs";

          const observation = resolveReputationObservation();
          assert.ok(observation, "A validated clinic reputation observation is required");
          const html = await readFile("dist/index.html", "utf8");
          assert.match(html, /data-clinic-reputation(?:\s|>)/);
          for (const [name, value] of [
            ["place-id", observation.placeId],
            ["rating", String(observation.rating)],
            ["review-count", String(observation.userRatingCount)],
            ["tuple-sha256", observation.tupleSha256],
          ])
            assert.ok(
              html.includes(`data-clinic-reputation-${name}="${value}"`),
              `Rendered reputation ${name} drift`,
            );
          assert.ok(!html.includes("/api/google-maps-reputation"));
          assert.equal(existsSync("dist/_routes.json"), false);
          assert.equal(existsSync("functions"), false);
          console.log(
            JSON.stringify(
              {
                staticReputationDist: "PASS",
                placeId: observation.placeId,
                rating: observation.rating,
                userRatingCount: observation.userRatingCount,
                tupleSha256: observation.tupleSha256,
              },
              null,
              2,
            ),
          );
          ''',
          )

          # Remove the temporary routing layer introduced only for the Function.
          materializer_path = "scripts/materialize-static-artifacts.mjs"
          materializer = read(materializer_path)
          platform_block = '''const platformContract = JSON.parse(
            await readFile(
              path.join(root, ".release/policy/platform-contract.json"),
              "utf8",
            ),
          );
          const functionRoute = platformContract?.cloudflare?.function?.route;
          if (
            typeof functionRoute !== "string" ||
            !/^\\/api\\/[a-z0-9/-]+$/i.test(functionRoute)
          )
            throw new Error(`Invalid Cloudflare Function route: ${functionRoute}`);
          '''
          if platform_block in materializer:
              materializer = materializer.replace(platform_block, "", 1)
          routes_block = '''await writeExact(
            "_routes.json",
            `${JSON.stringify(
              {
                version: 1,
                include: [functionRoute],
                exclude: [],
              },
              null,
              2,
            )}\\n`,
          );
          '''
          if routes_block in materializer:
              materializer = materializer.replace(routes_block, "", 1)
          materializer = materializer.replace("functionRoutes: 1", "routeWrappers: 0")
          if "_routes.json" in materializer or "functionRoute" in materializer:
              raise SystemExit("Static artifact materializer still owns Function routing")
          write(materializer_path, materializer)

          dist_validator_path = "scripts/validate-dist.mjs"
          dist_validator = read(dist_validator_path)
          dist_validator = dist_validator.replace('  "_routes.json",\n', "")
          dist_validator = re.sub(
              r',\n\s*routes = await readJson\(path\.join\(dist, "_routes\.json"\)\),\n\s*platformContract = await readJson\(\n\s*path\.join\(root, "\.release/policy/platform-contract\.json"\),\n\s*\);\nif \([\s\S]*?\)\n\s*fail\("Cloudflare Pages Function routing drift"\);',
              ";",
              dist_validator,
              count=1,
          )
          if "_routes.json" in dist_validator or "Function routing drift" in dist_validator:
              raise SystemExit("Dist validator still expects a Function routing artifact")
          write(dist_validator_path, dist_validator)

          architecture_path = "scripts/validate-architecture.mjs"
          architecture = read(architecture_path)
          architecture = architecture.replace(
              '''    /path\\.join\\(root,\\s*[\'\"]\\.generated\\/public[\'\"]\\)/.test(materializer) &&
              materializer.includes('.release/policy/platform-contract.json') &&
              materializer.includes('"_routes.json"') &&
              materializer.includes('include: [functionRoute]') &&
              materializer.includes('exclude: []'),
            "Static materializer must own resources, generated public files, and exact Function routing",
          ''',
              '''    /path\\.join\\(root,\\s*[\'\"]\\.generated\\/public[\'\"]\\)/.test(materializer),
            "Static materializer must use the resource registry and generated public workspace",
          ''',
          )
          if "_routes.json" in architecture or "functionRoute" in architecture:
              raise SystemExit("Architecture validator still encodes Function routing")
          write(architecture_path, architecture)

          platform_path = root / ".release/policy/platform-contract.json"
          platform = json.loads(platform_path.read_text(encoding="utf-8"))
          cloudflare = platform.setdefault("cloudflare", {})
          cloudflare.pop("function", None)
          cloudflare["deliveryModel"] = "static-assets-only"
          platform_path.write_text(
              json.dumps(platform, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          # Convert the existing deployment workflow into the single six-hour build-time observer.
          deploy_path = ".github/workflows/cloudflare-pages-deploy.yml"
          deploy = read(deploy_path)
          deploy = remove_runtime_secret_steps(deploy)
          deploy = ensure_schedule(deploy)
          deploy = inject_observer_step(deploy)
          write(deploy_path, deploy)

          # Remove endpoint-specific monitor steps; static homepage/404 monitoring remains.
          monitor_path = root / ".github/workflows/stack-monitor.yml"
          if monitor_path.exists():
              monitor = monitor_path.read_text(encoding="utf-8")
              lines = monitor.splitlines(keepends=True)
              remove: set[int] = set()
              for start, end in yaml_step_spans(lines):
                  block = "".join(lines[start:end])
                  if "/api/google-maps-reputation" in block:
                      remove.update(range(start, end))
              monitor = "".join(
                  line for index, line in enumerate(lines) if index not in remove
              )
              monitor_path.write_text(monitor, encoding="utf-8")

          # Wire source and dist contracts without disturbing the existing release topology.
          package_path = root / "package.json"
          package = json.loads(package_path.read_text(encoding="utf-8"))
          scripts = package.setdefault("scripts", {})
          scripts["validate:reputation-observation"] = (
              "node scripts/validate-reputation-observation.mjs"
          )
          scripts["validate:static-reputation-dist"] = (
              "node scripts/validate-static-reputation-dist.mjs"
          )
          source_key = "validate:source"
          if source_key not in scripts:
              raise SystemExit("package.json has no validate:source script")
          if "validate:reputation-observation" not in scripts[source_key]:
              scripts[source_key] += " && npm run validate:reputation-observation"
          dist_keys = [
              key
              for key, command in scripts.items()
              if key == "validate:dist" or "scripts/validate-dist.mjs" in command
          ]
          if not dist_keys:
              raise SystemExit("Could not locate the canonical dist validation script")
          dist_key = dist_keys[0]
          if "validate:static-reputation-dist" not in scripts[dist_key]:
              scripts[dist_key] += " && npm run validate:static-reputation-dist"
          package_path.write_text(
              json.dumps(package, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          # No runtime endpoint, Function tree, or temporary route wrapper may survive.
          forbidden_runtime_tokens = (
              "/api/google-maps-reputation",
              "wrangler pages secret",
              '"_routes.json"',
              "platformContract.cloudflare.function",
          )
          allowed_endpoint_files = set()
          leaks = []
          for candidate in root.rglob("*"):
              if not candidate.is_file() or ".git" in candidate.parts:
                  continue
              if any(part in {"node_modules", "dist", ".release"} for part in candidate.parts):
                  continue
              try:
                  text = candidate.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue
              for token in forbidden_runtime_tokens:
                  if token in text and candidate not in allowed_endpoint_files:
                      leaks.append(f"{candidate.relative_to(root)}:{token}")
          if leaks:
              raise SystemExit("Runtime architecture leaks remain: " + ", ".join(leaks))

          # The one-shot workflow must leave no implementation scaffolding in the candidate.
          Path(".github/workflows/apply-static-reputation-architecture.yml").unlink()
          PY
          git diff --check

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14.6"

      - name: Provision media validation tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg
          ffprobe -version

      - run: npm ci

      - name: Capture a current validated clinic reputation fallback with one API call
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
        run: node scripts/fetch-google-places-reputation.mjs --write-fallback --github-env

      - name: Lock the intended source mutation surface before generated checks
        shell: bash
        run: git diff --name-only | LC_ALL=C sort > /tmp/intended-source-files.txt

      - name: Run the complete release pipeline
        run: npm run release

      - name: Validate rendered HTML with the pinned Nu checker
        run: npx --yes --package=vnu-jar@26.8.30 vnu --errors-only dist/index.html dist/404.html

      - name: Re-run the pinned Schema.org vocabulary gate
        run: npm run validate:schemaorg-vocabulary

      - name: Prove build checks did not mutate additional tracked source
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only | LC_ALL=C sort > /tmp/final-source-files.txt
          diff -u /tmp/intended-source-files.txt /tmp/final-source-files.txt
          test ! -e functions/api/google-maps-reputation.js
          test ! -e dist/_routes.json
          ! git grep -n --fixed-strings '/api/google-maps-reputation' -- ':!scripts/fetch-google-places-reputation.mjs'
          ! git grep -n --fixed-strings 'wrangler pages secret'
          git diff --check

      - name: Commit and publish only the fully validated candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: materialize clinic reputation in the static dist"
          test -z "$(git status --porcelain)"
          git push origin HEAD:feat/static-reputation-authority-20260903

name: Isolated native physician-practice implementation

on:
  push:
    branches: [automation/physician-practice-20260910]
    paths:
      - .github/workflows/native-practice-run.yml
      - .github/native-practice-edit.py

permissions:
  contents: read

concurrency:
  group: native-physician-practice-20260910
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'medicaldoctor91/doctor-ghezelbaash'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: worktree
        shell: bash
    steps:
      - name: Read isolated edit transport
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: transport
          persist-credentials: false
      - name: Check out exact approved source, without transport files
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 74294c15d9b0994cd8e4d187ce3b277e4b357b6b
          path: worktree
          persist-credentials: false
      - name: Apply exactly the five reviewed source edits
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 74294c15d9b0994cd8e4d187ce3b277e4b357b6b
          test "$(git rev-parse HEAD^{tree})" = ddf387aaa55ceaa529992d4d054f7068eb3d06ff
          python ../transport/.github/native-practice-edit.py . > "$RUNNER_TEMP/native-edits.json"
          git diff --check
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: worktree/.nvmrc
          cache: npm
          cache-dependency-path: worktree/package-lock.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14.6"
      - name: Install existing pinned dependencies and enforce advisory gate
        run: |
          set -euo pipefail
          node --version
          npm --version
          npm ci
          npm run security:dependencies
      - name: Provision the existing reference rendering and media tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg
          npx playwright install --with-deps chromium
      - name: Regenerate calibration with the existing measurement pipeline
        run: |
          set -euo pipefail
          npm run render:calibration:update
          npm run test:render-navigation -- .generated/calibration-candidate
      - name: Commit only the native source edits and measured calibration
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, subprocess
          allowed = {
              'src/data/semantic/knowledge-graph.jsonld',
              'scripts/validate-physician-projection.mjs',
              'src/lib/semantic-projection.mjs',
              'scripts/test-contracts.mjs',
              'src/content-source/page.md',
              'src/data/render-calibration.json',
          }
          changed = set(subprocess.check_output(['git','diff','--name-only'], text=True).splitlines())
          assert changed == allowed, (changed, allowed)
          assert not subprocess.check_output(['git','ls-files','--others','--exclude-standard'], text=True).strip()
          PY
          git diff --check
          git add -- src/data/semantic/knowledge-graph.jsonld scripts/validate-physician-projection.mjs src/lib/semantic-projection.mjs scripts/test-contracts.mjs src/content-source/page.md src/data/render-calibration.json
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix: model sole-physician private practice in canonical source and contracts'
          echo "SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"
      - name: Run existing complete release validation and build, without deployment
        run: |
          set -euo pipefail
          npm run release 2>&1 | tee "$RUNNER_TEMP/native-release.log"
          npx --yes --package=vnu-jar@26.8.30 vnu --errors-only dist/index.html dist/404.html
          npm run validate:schemaorg-vocabulary
          npm run test:video-deeplinks
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Package the verified commit for branch-only publication
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/native-candidate"
          git bundle create "$RUNNER_TEMP/native-candidate/candidate.bundle" 74294c15d9b0994cd8e4d187ce3b277e4b357b6b..HEAD
          git diff --stat 74294c15d9b0994cd8e4d187ce3b277e4b357b6b HEAD > "$RUNNER_TEMP/native-candidate/diff-stat.txt"
          cp "$RUNNER_TEMP/native-edits.json" "$RUNNER_TEMP/native-candidate/"
          cp .release/runtime/release-attestation.json "$RUNNER_TEMP/native-candidate/"
          cp src/data/render-calibration.json "$RUNNER_TEMP/native-candidate/"
          git rev-parse HEAD > "$RUNNER_TEMP/native-candidate/commit.txt"
          (cd "$RUNNER_TEMP/native-candidate" && sha256sum candidate.bundle > candidate.bundle.sha256)
      - name: Upload branch publication package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-practice-candidate
          path: ${{ runner.temp }}/native-candidate/
          if-no-files-found: error
          retention-days: 7
      - name: Preserve validation diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-practice-validation
          path: |
            ${{ runner.temp }}/native-edits.json
            ${{ runner.temp }}/native-release.log
            worktree/.generated/validation/shacl*/
          if-no-files-found: warn
          retention-days: 7
  publish-branch:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - name: Check out publication baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 74294c15d9b0994cd8e4d187ce3b277e4b357b6b
          persist-credentials: true
      - name: Read artifact from this exact successful build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name native-practice-candidate --dir "$RUNNER_TEMP/native-candidate"
      - name: Verify and publish only the isolated candidate branch
        env:
          TARGET_BRANCH: fix/physician-practice-native-20260910
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = medicaldoctor91/doctor-ghezelbaash
          test "$GITHUB_REF" = refs/heads/automation/physician-practice-20260910
          test "$TARGET_BRANCH" = fix/physician-practice-native-20260910
          (cd "$RUNNER_TEMP/native-candidate" && sha256sum -c candidate.bundle.sha256)
          CANDIDATE="$(cat "$RUNNER_TEMP/native-candidate/commit.txt")"
          [[ "$CANDIDATE" =~ ^[0-9a-f]{40}$ ]]
          git bundle verify "$RUNNER_TEMP/native-candidate/candidate.bundle"
          git bundle unbundle "$RUNNER_TEMP/native-candidate/candidate.bundle"
          test "$(git rev-parse "$CANDIDATE^")" = 74294c15d9b0994cd8e4d187ce3b277e4b357b6b
          export CANDIDATE
          python - <<'PY'
          import os, subprocess
          allowed = {
              'src/data/semantic/knowledge-graph.jsonld',
              'scripts/validate-physician-projection.mjs',
              'src/lib/semantic-projection.mjs',
              'scripts/test-contracts.mjs',
              'src/content-source/page.md',
              'src/data/render-calibration.json',
          }
          changed = set(subprocess.check_output(['git','diff','--name-only','74294c15d9b0994cd8e4d187ce3b277e4b357b6b',os.environ['CANDIDATE']], text=True).splitlines())
          assert changed == allowed, changed
          PY
          git fetch --no-tags origin main
          test "$(git rev-parse FETCH_HEAD)" = 74294c15d9b0994cd8e4d187ce3b277e4b357b6b
          REMOTE="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)"
          if [ -n "$REMOTE" ]; then
            test "$REMOTE" = "$CANDIDATE"
          else
            git push origin "$CANDIDATE:refs/heads/$TARGET_BRANCH"
          fi
          test "$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)" = "$CANDIDATE"
          printf 'Candidate branch: %s\nCandidate commit: %s\nMain unchanged. No deployment.\n' "$TARGET_BRANCH" "$CANDIDATE" >> "$GITHUB_STEP_SUMMARY"

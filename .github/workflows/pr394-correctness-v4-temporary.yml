name: PR394 corrected authority contracts v4 (temporary)

on:
  push:
    branches:
      - automation/pr394-mojavez-scope-20260911

permissions:
  contents: write

jobs:
  validate-product:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      EXPECTED_HEAD: 2e4b420b7f16f1f93bdc173f38cfa5adda826d16
      AUTOMATION_BRANCH: automation/pr394-mojavez-scope-20260911
      VALIDATION_BRANCH: validation/pr394-correctness-20260911
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: candidate/final-repository-plan-2026
          fetch-depth: 0
          persist-credentials: true

      - name: Require unchanged PR candidate head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14.6"

      - name: Provision validation dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg
          npm ci
          npm run security:dependencies
          npx playwright install --with-deps chromium

      - name: Apply temporary migration to candidate checkout
        shell: bash
        run: |
          set -euo pipefail
          git show "origin/$AUTOMATION_BRANCH:scripts/tmp-pr394-correctness.mjs" > /tmp/pr394-correctness.mjs
          node /tmp/pr394-correctness.mjs

      - name: Run focused correctness gates before commit
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          npm run validate:active-source-identifiers
          npm run validate:final-entity-contract
          npm run prepare:site
          npm run validate:physician-projection

      - name: Commit exact product tree locally
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Dr. Saeed Ghezelbaash | دکتر سعید قزلباش"
          git config user.email "medicaldoctor91@gmail.com"
          git add \
            package.json \
            scripts/lib/assemble-content.mjs \
            scripts/validate-active-source-identifiers.mjs \
            scripts/validate-final-entity-contract.mjs \
            scripts/validate-physician-projection.mjs \
            src/content-source/page.md \
            src/data/evidence-registry.json \
            src/data/semantic/knowledge-graph.jsonld
          git commit -m "fix: enforce evidence and authored-source authority contracts"
          echo "LOCAL_PRODUCT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git show --stat --oneline HEAD

      - name: Validate complete canonical release on exact product SHA
        shell: bash
        run: |
          set -euo pipefail
          export SOURCE_COMMIT="$LOCAL_PRODUCT_SHA"
          export CF_PAGES_COMMIT_SHA="$LOCAL_PRODUCT_SHA"
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct "$LOCAL_PRODUCT_SHA")"
          npm run release

      - name: Verify exact release attestation and clean tracked source
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const att = JSON.parse(fs.readFileSync('.release/runtime/release-attestation.json', 'utf8'));
          if (att.sourceCommit !== process.env.LOCAL_PRODUCT_SHA)
            throw new Error(`Attestation sourceCommit mismatch: ${att.sourceCommit} != ${process.env.LOCAL_PRODUCT_SHA}`);
          if (att.validation !== 'PASS') throw new Error('Release attestation is not PASS');
          console.log(JSON.stringify({ sourceCommit: att.sourceCommit, validation: att.validation }, null, 2));
          NODE
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Push validated product SHA only to isolated validation branch
        shell: bash
        run: |
          set -euo pipefail
          git push --force origin "HEAD:refs/heads/$VALIDATION_BRANCH"

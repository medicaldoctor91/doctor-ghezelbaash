name: Apply final release cleanup

on:
  push:
    branches: [release-cleanup-work]
    paths:
      - '.github/scripts/apply_final_cleanup.py'
      - '.github/final-cleanup-trigger'
  pull_request:
    branches: [image-entity-hardening-v3]
    paths:
      - '.github/scripts/apply_final_cleanup.py'
      - '.github/workflows/apply-final-cleanup.yml'
      - '.github/final-cleanup-trigger'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release-cleanup-work
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
          cache: npm

      - name: Apply deterministic release cleanup
        run: |
          set -euo pipefail
          python3 -m pip install --quiet rdflib
          python3 .github/scripts/apply_final_cleanup.py

      - name: Build, synchronize CSP and validate cleaned source
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run build
          python3 - <<'PY'
          import base64
          import hashlib
          import re
          from pathlib import Path

          html = Path('dist/index.html').read_text(encoding='utf-8')
          match = re.search(r'<script type="application/ld\+json">([\s\S]*?)</script>', html)
          if not match:
              raise SystemExit('inline Head Graph script not found')
          digest = base64.b64encode(hashlib.sha256(match.group(1).encode('utf-8')).digest()).decode('ascii')
          headers_path = Path('public/_headers')
          headers = headers_path.read_text(encoding='utf-8')
          updated, count = re.subn(r"sha256-[A-Za-z0-9+/=]+", f'sha256-{digest}', headers, count=1)
          if count != 1:
              raise SystemExit(f'expected one homepage CSP hash, replaced {count}')
          headers_path.write_text(updated, encoding='utf-8', newline='\n')
          PY
          npm run build
          python3 .github/scripts/validate_source.py

      - name: Commit cleaned tree
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Finalize clean release source'
          git push origin HEAD:release-cleanup-work

name: Prove combined v1.2.2 mobile performance experiment

on:
  push:
    branches: [main]
    paths: [.release/v122-combined-perf-request.json]

permissions:
  contents: read

concurrency:
  group: doctor-ghezelbaash-v122-combined-perf-proof
  cancel-in-progress: true

env:
  EXPERIMENT_BRANCH: tmp/v122-combined-perf-experiment
  BASE_CANDIDATE_SHA: 2f79e4eb179c8415c28a2ace1a52c2c523b1c1cb
  RESPONSIVE_SHA: 5d8b1e926c49bcd4f638df6441db0715951f3641
  EXPECTED_SHA: 8944041dd5a676bd0b1ccc5987915698dadbe607

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: tmp/v122-combined-perf-experiment
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - name: Prove exact ancestry and canonical source contract
        shell: bash
        run: |
          set -euo pipefail
          C=$(git rev-parse HEAD)
          test "$C" = "$EXPECTED_SHA"
          test "$(git rev-parse HEAD~2)" = "$RESPONSIVE_SHA"
          test "$(git rev-parse HEAD~3)" = "$BASE_CANDIDATE_SHA"
          export SOURCE_COMMIT="$C" CF_PAGES_COMMIT_SHA="$C" SOURCE_DATE_EPOCH=$(git show -s --format=%ct "$C") ASTRO_TELEMETRY_DISABLED=1
          npm run release:prepare
          npm run build
          node scripts/validate-visible-freeze.mjs dist/index.html
          node scripts/validate-dist.mjs
          node scripts/validate-current-context.mjs dist
          node - <<'NODE'
          const fs=require('fs'),html=fs.readFileSync('dist/index.html','utf8');
          const core=(html.match(/id="entity-core"/g)||[]).length,support=(html.match(/id="entity-support"/g)||[]).length;
          if(core!==1||support!==1)throw Error(`Semantic lane drift core=${core} support=${support}`);
          const links=[...html.matchAll(/<link\b[^>]*>/g)].map(m=>m[0]);
          const hero=links.filter(tag=>tag.includes('rel="preload"')&&tag.includes('as="image"')&&tag.includes('type="image/avif"')&&tag.includes('fetchpriority="high"')&&tag.includes('imagesrcset=')&&tag.includes('saeed-ghezelbash-portrait-delivery-640'));
          if(hero.length!==1)throw Error(`Hero preload count drift ${hero.length}`);
          for(const w of [720,800])if(!new RegExp(`saeed-ghezelbash-portrait-${w}\\.[0-9a-f]{12}\\.avif ${w}w`).test(hero[0]))throw Error(`Hero preload missing ${w}w responsive AVIF`);
          const viewportAt=html.indexOf('name="viewport"'),preloadAt=html.indexOf(hero[0]),styleAt=html.indexOf('<style>'),titleAt=html.indexOf('<title>'),coreAt=html.indexOf('id="entity-core"'),bodyAt=html.indexOf('<body');
          if(!(viewportAt>=0&&preloadAt>viewportAt&&styleAt>preloadAt&&titleAt>styleAt&&coreAt>titleAt&&bodyAt>coreAt))throw Error(`Head ordering drift viewport=${viewportAt} preload=${preloadAt} style=${styleAt} title=${titleAt} core=${coreAt} body=${bodyAt}`);
          for(const w of [720,800])for(const stem of ['saeed-ghezelbash-portrait','saeed-ghezelbash-clinical-examination'])if(!new RegExp(`${stem}-${w}\\.[0-9a-f]{12}\\.avif`).test(html))throw Error(`Missing responsive ${stem}-${w}`);
          console.log(JSON.stringify({combinedPerformanceSourceProof:'PASS',commit:process.env.SOURCE_COMMIT,htmlBytes:Buffer.byteLength(html),semanticLanes:{core,support},singleHeroPreload:true,headOrder:{viewportAt,preloadAt,styleAt,titleAt,coreAt,bodyAt},responsiveMedia:true}));
          NODE
          test -z "$(git status --porcelain --untracked-files=no)"

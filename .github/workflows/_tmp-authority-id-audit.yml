name: Temporary authority identifier audit
on:
  push:
    branches: [main]
    paths: ['.github/workflows/_tmp-authority-id-audit.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check --no-input requests==2.32.5
      - name: Compare old and ORCID-resolved OpenAlex identities
        shell: bash
        run: |
          python - <<'PY'
          import requests,json
          s=requests.Session(); s.headers.update({'User-Agent':'GhezelbaashOpenAlexAudit/1.0 (https://www.ghezelbaash.ir/)'})
          ids=['A5064828898','A5146521397']
          out={}
          for aid in ids:
            rr=s.get('https://api.openalex.org/authors/'+aid,timeout=60,allow_redirects=True)
            row={'requested':aid,'status':rr.status_code,'final_url':rr.url,'history':[{'status':h.status_code,'url':h.url,'location':h.headers.get('location')} for h in rr.history]}
            if rr.status_code==200:
              d=rr.json(); row['record']={k:d.get(k) for k in ['id','orcid','display_name','display_name_alternatives','works_count','cited_by_count','last_known_institutions','ids']}
              wr=s.get('https://api.openalex.org/works',params={'filter':'author.id:'+aid,'per-page':100,'select':'id,doi,display_name,publication_year,authorships'},timeout=90)
              row['works_status']=wr.status_code
              if wr.status_code==200:
                works=[]
                for w in wr.json().get('results',[]):
                  auth=[]
                  for a in w.get('authorships',[]):
                    au=a.get('author') or {}
                    if au.get('id','').endswith('/'+aid) or au.get('display_name') in ['Saeed Ghezelbash','Mohammad Saeed Ghezelbash','سعید قزلباش']:
                      auth.append({'author':au,'raw_author_name':a.get('raw_author_name'),'author_position':a.get('author_position'),'institutions':a.get('institutions')})
                  works.append({'id':w.get('id'),'doi':w.get('doi'),'title':w.get('display_name'),'year':w.get('publication_year'),'matching_authorship':auth})
                row['works']=works
            else: row['text']=rr.text[:1000]
            out[aid]=row
          # exact ORCID search
          rr=s.get('https://api.openalex.org/authors',params={'filter':'orcid:0009-0001-9346-8475','per-page':100},timeout=60)
          out['orcid_search']={'status':rr.status_code,'results':[]}
          if rr.status_code==200:
            for d in rr.json().get('results',[]): out['orcid_search']['results'].append({k:d.get(k) for k in ['id','orcid','display_name','works_count','cited_by_count','ids']})
          # OpenAlex IDs attached to the two exact DOI works
          work_authors={}
          for doi in ['10.3390/healthcare9091169','10.4103/2008-7802.182734']:
            rr=s.get('https://api.openalex.org/works/https://doi.org/'+doi,timeout=60)
            row={'status':rr.status_code}
            if rr.status_code==200:
              d=rr.json(); row['id']=d.get('id'); row['title']=d.get('display_name'); row['authorships']=[{'author':a.get('author'),'raw_author_name':a.get('raw_author_name'),'author_position':a.get('author_position'),'institutions':a.get('institutions')} for a in d.get('authorships',[]) if 'Ghezel' in (a.get('raw_author_name') or '') or 'قزلباش' in ((a.get('author') or {}).get('display_name') or '')]
            work_authors[doi]=row
          out['doi_work_authors']=work_authors
          print(json.dumps(out,ensure_ascii=False,indent=2,sort_keys=True))
          PY

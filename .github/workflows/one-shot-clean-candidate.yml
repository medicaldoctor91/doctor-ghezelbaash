name: Build one clean release-ready megalanding candidate

on:
  push:
    branches:
      - feat/static-reputation-authority-20260903
    paths:
      - .github/workflows/one-shot-clean-candidate.yml

permissions:
  contents: write

concurrency:
  group: one-shot-clean-megalanding-candidate
  cancel-in-progress: true

jobs:
  build-clean-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out isolated carrier branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/static-reputation-authority-20260903
          fetch-depth: 0
          persist-credentials: true

      - name: Load reviewed migration and exact validated base
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            archive/static-reputation-failed-experiments-20260904 \
            fix/schemaorg-v30-conformance-20260903 \
            feat/final-megalanding-clean-20260904
          test "$(git rev-parse origin/fix/schemaorg-v30-conformance-20260903)" = "dd18d9380a592ecd0e1bf2ef69fe68899d761a49"
          test "$(git rev-parse origin/feat/final-megalanding-clean-20260904)" = "dd18d9380a592ecd0e1bf2ef69fe68899d761a49"
          git show origin/archive/static-reputation-failed-experiments-20260904:scripts/migrations/apply-approved-release-ready.mjs > /tmp/apply-approved-release-ready.mjs
          git show origin/archive/static-reputation-failed-experiments-20260904:scripts/migrations/normalize-approved-release-ready.py > /tmp/normalize-approved-release-ready.py
          git checkout --detach dd18d9380a592ecd0e1bf2ef69fe68899d761a49
          mkdir -p scripts/migrations
          cp /tmp/apply-approved-release-ready.mjs scripts/migrations/apply-approved-release-ready.mjs
          cp /tmp/normalize-approved-release-ready.py scripts/migrations/normalize-approved-release-ready.py

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14.6"

      - name: Install exact source dependencies
        run: npm ci

      - name: Apply approved source-native migration
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/migrations/normalize-approved-release-ready.py
          python3 - <<'PY'
          from pathlib import Path

          migration = Path("scripts/migrations/apply-approved-release-ready.mjs")
          source = migration.read_text(encoding="utf-8")
          old = 'assert(!existsSync(path.join(root, "functions")) || trackedFiles().every((file) => !file.startsWith("functions/")), "Tracked Cloudflare Function surface remains");'
          new = 'assert(!trackedFiles().some((file) => file.startsWith("functions/") && existsSync(path.join(root, file))), "Tracked Cloudflare Function surface remains");'
          if old in source:
              source = source.replace(old, new, 1)
          elif new not in source:
              raise SystemExit("Function-deletion assertion was not found")
          migration.write_text(source, encoding="utf-8")
          PY
          node --check scripts/migrations/apply-approved-release-ready.mjs
          node scripts/migrations/apply-approved-release-ready.mjs

      - name: Normalize final static-only contracts
        shell: bash
        run: |
          set -euo pipefail
          rm -rf functions
          python3 - <<'PY'
          from pathlib import Path
          import re

          validator = Path("scripts/validate-static-reputation.mjs")
          value = validator.read_text(encoding="utf-8")
          old = 'for (const file of tracked.filter((file) => /\\.(?:mjs|js|astro|md|json|jsonld|yml|yaml|txt)$/.test(file))) {\n  const value = await readFile(file, "utf8");'
          new = 'for (const file of tracked.filter((file) => /\\.(?:mjs|js|astro|md|json|jsonld|yml|yaml|txt)$/.test(file))) {\n  if (file === "scripts/validate-static-reputation.mjs") continue;\n  const value = await readFile(file, "utf8");'
          if old in value:
              value = value.replace(old, new, 1)
          elif new not in value:
              raise SystemExit("Static reputation self-scan guard was not found")
          validator.write_text(value, encoding="utf-8")

          workflow = Path(".github/workflows/refresh-clinic-reputation.yml")
          source = workflow.read_text(encoding="utf-8").replace("  queue: max\n", "")
          if "queue:" in source:
              raise SystemExit("Unsupported GitHub Actions concurrency queue key remains")
          workflow.write_text(source, encoding="utf-8")

          hygiene = Path("scripts/validate-repository-hygiene.mjs")
          source = hygiene.read_text(encoding="utf-8")
          needle = '  ".github/workflows/hugging-face-authority.yml",\n  ".github/workflows/stack-monitor.yml",'
          replacement = '  ".github/workflows/hugging-face-authority.yml",\n  ".github/workflows/refresh-clinic-reputation.yml",\n  ".github/workflows/stack-monitor.yml",'
          if needle in source:
              source = source.replace(needle, replacement, 1)
          elif replacement not in source:
              raise SystemExit("Canonical workflow allowlist insertion point was not found")
          hygiene.write_text(source, encoding="utf-8")

          platform = Path("scripts/platform-contract.mjs")
          source = platform.read_text(encoding="utf-8")
          source = re.sub(r'^\s*CF_FUNCTION_COMPATIBILITY_DATE:.*\n', '', source, flags=re.M)
          source = re.sub(r'^\s*CF_WRANGLER_VERSION:.*\n', '', source, flags=re.M)
          source = re.sub(
              r'\n\s*if \(\s*cf\.function\?\.route[\s\S]*?fail\("Platform Function source or binding drift"\);',
              '\n  if (cf.deliveryModel !== "static-assets-only" || cf.pagesFunctions !== false)\n    fail("Platform static-only delivery contract drift");',
              source,
              count=1,
          )
          source = source.replace(
              '        function: cf.function,\n',
              '        deliveryModel: cf.deliveryModel,\n        pagesFunctions: cf.pagesFunctions,\n',
          )
          platform.write_text(source, encoding="utf-8")
          PY
          node --check scripts/fetch-google-places-reputation.mjs
          node --check scripts/validate-static-reputation.mjs
          node --check scripts/validate-approved-visible-cleanup.mjs
          node --check scripts/platform-contract.mjs

      - name: Capture exactly one current validated Google Places observation
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GOOGLE_PLACES_API_KEY:-}"
          echo "::add-mask::$GOOGLE_PLACES_API_KEY"
          node scripts/fetch-google-places-reputation.mjs --output src/data/reputation-observation.json

      - name: Normalize text and commit exact clean candidate
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/migrations/apply-approved-release-ready.mjs
          rm -f scripts/migrations/normalize-approved-release-ready.py
          rmdir scripts/migrations 2>/dev/null || true
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          text_suffixes = {
              ".astro", ".css", ".html", ".js", ".json", ".jsonld",
              ".md", ".mjs", ".py", ".txt", ".ts", ".ttl", ".xml",
              ".yaml", ".yml",
          }
          changed = subprocess.check_output(
              ["git", "diff", "--name-only", "--diff-filter=ACMRT"],
              text=True,
          ).splitlines()
          for name in changed:
              path = Path(name)
              if not path.is_file() or path.suffix.lower() not in text_suffixes:
                  continue
              raw = path.read_text(encoding="utf-8")
              normalized = "\n".join(line.rstrip() for line in raw.splitlines()).rstrip() + "\n"
              path.write_text(normalized, encoding="utf-8")
          PY
          git diff --check
          test ! -e functions
          test ! -e public/_routes.json
          test ! -e _routes.json
          ! grep -RIn --exclude-dir=.git --exclude=package-lock.json "/api/google-maps-reputation\|data-google-maps-reputation\|functions/api/google-maps-reputation\|queue: max" .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: finalize static reputation and visible authority surface"
          test -z "$(git status --porcelain)"

      - name: Provision media validation tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg
          ffprobe -version
          npm run security:dependencies

      - name: Run complete release validation
        run: npm run release

      - name: Independently verify the rendered candidate
        shell: bash
        run: |
          set -euo pipefail
          npx --yes --package=vnu-jar@26.8.30 vnu --errors-only dist/index.html dist/404.html
          npm run validate:schemaorg-vocabulary
          node scripts/validate-static-reputation.mjs dist/index.html
          node scripts/validate-approved-visible-cleanup.mjs dist/index.html
          test ! -e dist/_routes.json
          ! grep -RIn --exclude='*.map' "/api/google-maps-reputation\|data-google-maps-reputation" dist
          test "$(grep -o '<video\\b' dist/index.html | wc -l | tr -d ' ')" = "4"
          test "$(grep -o 'class=\"caption-disclosure' dist/index.html | wc -l | tr -d ' ')" = "2"
          ! grep -q "Q140304972" dist/index.html dist/graph.jsonld dist/graph.ttl
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Upload the validated distribution
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: final-clean-candidate-${{ github.run_id }}
          path: |
            release/doctor-ghezelbaash-dist-v*.zip
            release/doctor-ghezelbaash-source-v*.zip
          if-no-files-found: error
          retention-days: 7

      - name: Publish only the validated clean candidate branch
        shell: bash
        run: |
          set -euo pipefail
          git push --force-with-lease=refs/heads/feat/final-megalanding-clean-20260904:dd18d9380a592ecd0e1bf2ef69fe68899d761a49 origin HEAD:refs/heads/feat/final-megalanding-clean-20260904
          echo "FINAL_CANDIDATE_SHA=$(git rev-parse HEAD)"

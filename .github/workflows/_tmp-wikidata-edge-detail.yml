name: Temporary detailed Wikidata edge audit
on:
  push:
    branches: [main]
    paths: ['.github/workflows/_tmp-wikidata-edge-detail.yml']
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check --no-input requests==2.32.5
      - name: Query exact claims read-only
        shell: bash
        run: |
          python - <<'PY'
          import requests,json,os
          API='https://www.wikidata.org/w/api.php'; H={'User-Agent':'GhezelbaashWikidataEdgeDetail/1.0 (https://www.ghezelbaash.ir/)'}
          def get(**p):
            p.update(format='json',formatversion=2)
            r=requests.get(API,params=p,headers=H,timeout=60); r.raise_for_status(); d=r.json()
            if 'error' in d: raise RuntimeError(d['error'])
            return d
          E=get(action='wbgetentities',ids='Q140287622|Q141099455',props='labels|descriptions|claims|sitelinks',languages='en|fa')['entities']
          def val(snak):
            dv=snak.get('datavalue',{}).get('value')
            if isinstance(dv,dict) and 'id' in dv:return dv['id']
            if isinstance(dv,dict) and 'text' in dv:return dv['text']
            return dv
          def claim(c):
            return {'id':c.get('id'),'value':val(c.get('mainsnak',{})),'rank':c.get('rank'),'qualifiers':{p:[val(s) for s in ss] for p,ss in c.get('qualifiers',{}).items()},'references':[{p:[val(s) for s in ss] for p,ss in r.get('snaks',{}).items()} for r in c.get('references',[])]}
          person=E['Q140287622']; work=E['Q141099455']
          out={
            'person_P3919':[claim(c) for c in person.get('claims',{}).get('P3919',[]) if val(c.get('mainsnak',{}))=='Q141099455'],
            'work_labels':{k:v.get('value') for k,v in work.get('labels',{}).items()},
            'work_descriptions':{k:v.get('value') for k,v in work.get('descriptions',{}).items()},
            'work_sitelinks':{k:v.get('title') for k,v in work.get('sitelinks',{}).items()},
            'work_claims':{p:[claim(c) for c in cs] for p,cs in work.get('claims',{}).items()}
          }
          os.makedirs('wikimedia',exist_ok=True)
          with open('wikimedia/_tmp-wikidata-edge-detail.json','w',encoding='utf8') as f:json.dump(out,f,ensure_ascii=False,indent=2,sort_keys=True)
          print(json.dumps(out,ensure_ascii=False))
          PY
      - name: Commit snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add wikimedia/_tmp-wikidata-edge-detail.json
          git commit -m 'Record temporary detailed Wikidata edge snapshot'
          git push

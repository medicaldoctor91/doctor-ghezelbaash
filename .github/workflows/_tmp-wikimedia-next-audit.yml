name: Temporary Wikiversity provenance bridge
on:
  push:
    branches: [main]
    paths: ['.github/workflows/_tmp-wikimedia-next-audit.yml']
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      WIKIMEDIA_USERNAME: ${{ secrets.WIKIVERSITY_USERNAME }}
      WIKIMEDIA_BOT_PASSWORD: ${{ secrets.WIKIVERSITY_BOT_PASSWORD }}
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check --no-input requests==2.32.5
      - name: Link existing Wikisource author record from provenance block
        shell: bash
        run: |
          python - <<'PY'
          import os,requests,json
          API='https://en.wikiversity.org/w/api.php'; TITLE='Botulinum toxin in aesthetic medicine'
          NEEDLE='Wikisource author record'
          ROW="|-\n| '''Wikisource author record''' || '''[[s:Author:Mohammad Saeed Ghezelbash|Author:Mohammad Saeed Ghezelbash]]'''\n"
          s=requests.Session(); s.headers.update({'User-Agent':'GhezelbaashWikiversityBridge/1.0 (https://www.ghezelbaash.ir/)'})
          def get(**p):
            p.update(format='json',formatversion=2); r=s.get(API,params=p,timeout=60); r.raise_for_status(); d=r.json()
            if 'error' in d: raise RuntimeError(d['error'])
            return d
          def post(p):
            p=dict(p); p.update(format='json',formatversion=2); r=s.post(API,data=p,timeout=90); r.raise_for_status(); d=r.json()
            if 'error' in d: raise RuntimeError(d['error'])
            return d
          lt=get(action='query',meta='tokens',type='login')['query']['tokens']['logintoken']
          lg=post({'action':'login','lgname':os.environ['WIKIMEDIA_USERNAME'],'lgpassword':os.environ['WIKIMEDIA_BOT_PASSWORD'],'lgtoken':lt})
          if lg.get('login',{}).get('result')!='Success': raise RuntimeError(lg)
          ui=get(action='query',meta='userinfo',uiprop='blockinfo')['query']['userinfo']
          if ui.get('blockedby'): raise RuntimeError({'blocked':True,'blockedby':ui.get('blockedby'),'reason':ui.get('blockreason')})
          pg=get(action='query',prop='revisions',rvprop='ids|timestamp|content',rvslots='main',titles=TITLE)['query']['pages'][0]
          rev=pg['revisions'][0]; text=rev['slots']['main']['content']; oldid=rev['revid']
          if NEEDLE in text or 's:Author:Mohammad Saeed Ghezelbash' in text:
            print(json.dumps({'ok':True,'status':'already_present','revid':oldid,'authenticated_as':ui.get('name')})); raise SystemExit
          anchor="| '''Wikimedia Commons creator record'''"
          pos=text.find(anchor)
          if pos<0: raise RuntimeError('provenance anchor not found')
          # Insert new row immediately before Commons creator record row, preserving table syntax.
          start=text.rfind('|-',0,pos)
          if start<0: raise RuntimeError('table row boundary not found')
          newtext=text[:start]+ROW+text[start:]
          csrf=get(action='query',meta='tokens',type='csrf')['query']['tokens']['csrftoken']
          ed=post({'action':'edit','title':TITLE,'text':newtext,'baserevid':oldid,'summary':'Link canonical Wikisource author record in contributor provenance','token':csrf,'bot':1})
          vr=get(action='query',prop='revisions',rvprop='ids|content',rvslots='main',titles=TITLE)['query']['pages'][0]['revisions'][0]
          ok='s:Author:Mohammad Saeed Ghezelbash' in vr['slots']['main']['content']
          print(json.dumps({'ok':ok,'status':'created','oldid':oldid,'newrevid':vr['revid'],'authenticated_as':ui.get('name'),'edit':ed.get('edit',{})},ensure_ascii=False))
          if not ok: raise SystemExit(1)
          PY

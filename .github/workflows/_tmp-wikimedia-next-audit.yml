name: Temporary Wikimedia next audit
on:
  push:
    branches: [main]
    paths: ['.github/workflows/_tmp-wikimedia-next-audit.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check --no-input requests==2.32.5
      - name: Audit Wikiversity and coauthor resolution
        shell: bash
        run: |
          python - <<'PY'
          import json,requests,re
          s=requests.Session(); s.headers.update({'User-Agent':'GhezelbaashNextAudit/1.0 (https://www.ghezelbaash.ir/)'})
          # Wikiversity exact page state
          api='https://en.wikiversity.org/w/api.php'; title='Botulinum toxin in aesthetic medicine'
          p={'action':'query','prop':'revisions|pageprops|categories|links|extlinks','rvprop':'ids|timestamp|content','rvslots':'main','cllimit':'max','pllimit':'max','ellimit':'max','titles':title,'format':'json','formatversion':2}
          r=s.get(api,params=p,timeout=90); r.raise_for_status(); page=r.json()['query']['pages'][0]
          rev=(page.get('revisions') or [{}])[0]; content=rev.get('slots',{}).get('main',{}).get('content','')
          bp={'action':'query','list':'backlinks','bltitle':title,'bllimit':'max','format':'json','formatversion':2}
          br=s.get(api,params=bp,timeout=60); br.raise_for_status(); backlinks=br.json()['query']['backlinks']
          wv={
            'pageid':page.get('pageid'),'title':page.get('title'),'revid':rev.get('revid'),'timestamp':rev.get('timestamp'),
            'pageprops':page.get('pageprops',{}),'categories':[x['title'] for x in page.get('categories',[])],
            'links':[x['title'] for x in page.get('links',[])], 'extlinks':[x['url'] for x in page.get('extlinks',[])],
            'backlinks':backlinks,'content':content
          }
          # Wikidata exact author-claim audit
          wdapi='https://www.wikidata.org/w/api.php'
          qids=['Q140298431','Q36942316','Q140306302']
          ed=s.get(wdapi,params={'action':'wbgetentities','ids':'|'.join(qids),'props':'claims|labels','languages':'en','format':'json','formatversion':2},timeout=90); ed.raise_for_status(); entities=ed.json()['entities']
          def parse_authors(e):
            out=[]
            for pid in ['P50','P2093']:
              for c in e.get('claims',{}).get(pid,[]):
                v=c.get('mainsnak',{}).get('datavalue',{}).get('value')
                if isinstance(v,dict): v=v.get('id')
                quals={}
                for qp,qs in c.get('qualifiers',{}).items():
                  vals=[]
                  for q in qs:
                    x=q.get('datavalue',{}).get('value')
                    if isinstance(x,dict) and 'id' in x: x=x['id']
                    vals.append(x)
                  quals[qp]=vals
                out.append({'pid':pid,'value':v,'claim_id':c.get('id'),'qualifiers':quals,'rank':c.get('rank')})
            return out
          authors={q:parse_authors(entities[q]) for q in qids}
          # Resolve labels of all P50 qids
          p50ids=sorted({a['value'] for aa in authors.values() for a in aa if a['pid']=='P50' and isinstance(a['value'],str) and a['value'].startswith('Q')})
          labels={}
          if p50ids:
            rr=s.get(wdapi,params={'action':'wbgetentities','ids':'|'.join(p50ids),'props':'labels|aliases|claims','languages':'en','format':'json','formatversion':2},timeout=90); rr.raise_for_status()
            for q,e in rr.json()['entities'].items():
              labels[q]={'label':e.get('labels',{}).get('en',{}).get('value'),'aliases':[x['value'] for x in e.get('aliases',{}).get('en',[])]}
          print(json.dumps({'wikiversity':wv,'authors':authors,'p50_identity_labels':labels},ensure_ascii=False,indent=2,sort_keys=True))
          PY

name: Temporary Wikimedia next audit
on:
  push:
    branches: [main]
    paths: ['.github/workflows/_tmp-wikimedia-next-audit.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check --no-input requests==2.32.5
      - name: Inspect existing Wikiversity QID and coauthor candidates
        shell: bash
        run: |
          python - <<'PY'
          import json,requests
          s=requests.Session(); s.headers.update({'User-Agent':'GhezelbaashCoauthorAudit/1.0 (https://www.ghezelbaash.ir/)'})
          api='https://www.wikidata.org/w/api.php'
          def getent(ids):
            r=s.get(api,params={'action':'wbgetentities','ids':'|'.join(ids),'props':'claims|labels|aliases|sitelinks|descriptions','languages':'en','format':'json','formatversion':2},timeout=90); r.raise_for_status(); return r.json()['entities']
          def val(c):
            try:
              x=c['mainsnak']['datavalue']['value']
              if isinstance(x,dict) and 'id' in x: return x['id']
              return x
            except: return None
          # Existing Wikiversity item
          e=getent(['Q141099455'])['Q141099455']
          qitem={'labels':{k:v['value'] for k,v in e.get('labels',{}).items()},'description':e.get('descriptions',{}).get('en',{}).get('value'),'sitelinks':{k:v['title'] for k,v in e.get('sitelinks',{}).items()},'claims':{p:[val(c) for c in cs] for p,cs in e.get('claims',{}).items()}}
          names=['Sanobar Golshani','Seyed Sepehr Hashemian','Ali Firoozabadi','Kimia Firoozabadi','Kenneth M. Dürsteler','Maryam Khanegi','Ideh Ramazanghambari','Arman Fahmi','Damoun Haghshenas','Behrad Basanj','Amirali Sepehry']
          searches={}
          candidate_ids=set()
          for name in names:
            r=s.get(api,params={'action':'wbsearchentities','search':name,'language':'en','type':'item','limit':10,'format':'json','formatversion':2},timeout=60); r.raise_for_status()
            rows=[]
            for x in r.json().get('search',[]):
              rows.append({'id':x.get('id'),'label':x.get('label'),'description':x.get('description'),'aliases':x.get('aliases',[])})
              candidate_ids.add(x.get('id'))
            searches[name]=rows
          candidates={}
          if candidate_ids:
            ce=getent(sorted(candidate_ids))
            interesting=['P31','P106','P108','P69','P496','P10283','P1960','P50','P3919','P1416','P27']
            for q,x in ce.items():
              candidates[q]={'label':x.get('labels',{}).get('en',{}).get('value'),'description':x.get('descriptions',{}).get('en',{}).get('value'),'aliases':[a['value'] for a in x.get('aliases',{}).get('en',[])], 'claims':{p:[val(c) for c in x.get('claims',{}).get(p,[])] for p in interesting if p in x.get('claims',{})}}
          print(json.dumps({'wikiversity_item_Q141099455':qitem,'coauthor_searches':searches,'candidate_details':candidates},ensure_ascii=False,indent=2,sort_keys=True))
          PY

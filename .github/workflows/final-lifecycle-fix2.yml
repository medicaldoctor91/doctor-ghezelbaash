name: Temporary lifecycle contract fix

on:
  push:
    branches: [refactor/final-lifecycle-authority]

permissions:
  contents: write

jobs:
  rewrite:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: refactor/final-lifecycle-authority
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
      - name: Replace remaining package-script topology assertions
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const file='scripts/validate-source.mjs';
          let source=fs.readFileSync(file,'utf8');
          const pattern=/if\(pkg\.scripts\?\.\['descriptors:finalize'\][\s\S]*?if\(retrievalGenerator\.includes\('public\/current-release-matrix\.json'\)\)/;
          if(!pattern.test(source)){
            if(source.includes("Build pipeline missing"))process.exit(0);
            throw new Error('stale lifecycle assertion block not found');
          }
          const replacement=`for(const required of [\"run('Astro static build',astro,['build'])\",\"js('prepare IndexNow key','scripts/indexnow.mjs',['prepare'])\",\"js('finalize descriptors','scripts/generate-descriptors.mjs',['--dist','dist'])\",\"js('finalize DIST','scripts/finalize-dist.mjs')\"])if(!pipeline.includes(required))fail(\`Build pipeline missing \${required}\`);
          for(const required of [\"js('current serving context','scripts/validate-current-context.mjs',['dist'])\",\"js('release attestation','scripts/write-release-attestation.mjs')\",\"js('package DIST','scripts/package-dist.mjs')\"])if(!pipeline.includes(required))fail(\`Release pipeline missing \${required}\`);
          if(!(pipeline.indexOf(\"scripts/validate-current-context.mjs\")<pipeline.indexOf(\"scripts/write-release-attestation.mjs\")&&pipeline.indexOf(\"scripts/write-release-attestation.mjs\")<pipeline.indexOf(\"js('package DIST','scripts/package-dist.mjs')\")))fail('Release attestation ordering drift');
          if(retrievalGenerator.includes('public/current-release-matrix.json'))`;
          source=source.replace(pattern,replacement);
          fs.writeFileSync(file,source);
          NODE
      - name: Commit if changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name ghezelbaash-architecture-bot
          git config user.email actions@users.noreply.github.com
          git add scripts/validate-source.mjs
          git commit -m "refactor: bind source validation to pipeline owner"
          git push origin HEAD:refactor/final-lifecycle-authority

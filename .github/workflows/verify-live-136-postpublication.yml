name: Verify published 1.3.6 by exact frozen candidate (GET-only)
on:
  push:
    branches: [codex/136-readonly-publication-reconciliation-20261121, codex/136-hf-viewer-runtime-reverify-20261121]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: doctor-ghezelbaash-136-readonly-postpublication
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ARCHIVE_SOURCE_COMMIT: eafb138d596a91504ed0af66e2557f52848e36b6
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN || secrets.KAGGLE_TOKEN }}
      GIT_LFS_SKIP_SMUDGE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install read-only independent validation dependencies
        run: python -m pip install requests 'pyarrow==22.0.0' 'kaggle==2.2.4' 'huggingface_hub>=0.34,<1' 'rdflib>=7,<8' 'pyshacl>=0.30,<1' 'mlcroissant==1.1.1' 'PyLD==3.3.0' PyYAML
      - name: Restore exactly the already approved 1.3.6 candidate
        uses: actions/download-artifact@v4
        with:
          name: frozen-mutable-candidate
          run-id: 44889318984
          github-token: ${{ github.token }}
          path: /tmp/frozen-136-artifact
      - name: Decompress without rebuilding, editing or publishing
        run: |
          test -s /tmp/frozen-136-artifact/candidate.tar.gz
          tar -xzf /tmp/frozen-136-artifact/candidate.tar.gz -C /tmp
          test -s /tmp/mutable-release/frozen-sha256.json
          test -s /tmp/mutable-release/website/graph.jsonld
      - name: Independently verify site, HF search, Kaggle 40 and notebook 21 against exact frozen files
        run: python .github/scripts/verify_live_136_postpublication_readonly.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: published-136-readonly-reconciliation-receipts
          path: |
            /tmp/136-final-verify/
            /tmp/mutable-release/hf-bytes-verified.json
            /tmp/mutable-release/kaggle-live.json
            /tmp/mutable-release/notebook-live.json
            /tmp/mutable-release/site-live.json
            /tmp/mutable-release/viewer-response-evidence/
          if-no-files-found: warn
          retention-days: 30

name: PR401 commit measured render calibration

on:
  push:
    branches:
      - refactor/single-source-truth-no-dist-drift

permissions:
  actions: read
  contents: write

concurrency:
  group: pr401-commit-measured-render-calibration
  cancel-in-progress: false

jobs:
  calibrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ARTIFACT_ID: "10366658106"
      ARTIFACT_FILE_SHA256: "28df8653af1d18e44c01d290becdab7306a12038a7bcad33ac361b24673beef9"
      EXPECTED_SOURCE_SHA256: "d64f311437f646fda08512d32fee2ecb78b0531cdf10e0f943beb56f75223924"
      EXPECTED_DOM_SHA256: "43f7cc633046c9c51a78fbdf47bac5da77660d254ef747258f90f7379fea782e"
      EXPECTED_PARENT: "86eef75dc297e9cc836a52388eb6bcf43bfcb7e0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: refactor/single-source-truth-no-dist-drift
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Require exact setup parent
        run: test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
      - name: Download exact measured calibration artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/render-calibration
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > /tmp/render-calibration.zip
          unzip -q /tmp/render-calibration.zip -d /tmp/render-calibration
          test "$(sha256sum /tmp/render-calibration/measured-render-calibration.json | cut -d' ' -f1)" = "$ARTIFACT_FILE_SHA256"
      - name: Prove geometry unchanged and adopt measured provenance
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, shutil
          from pathlib import Path
          target = Path('src/data/render-calibration.json')
          measured = Path('/tmp/render-calibration/measured-render-calibration.json')
          old = json.loads(target.read_text())
          new = json.loads(measured.read_text())
          old_geometry = {k: v for k, v in old.items() if k != '_meta'}
          new_geometry = {k: v for k, v in new.items() if k != '_meta'}
          if old_geometry != new_geometry:
              raise SystemExit('Measured geometry changed; refusing metadata-only calibration update')
          if new['_meta']['sourceSha256'] != os.environ['EXPECTED_SOURCE_SHA256']:
              raise SystemExit('Measured source fingerprint mismatch')
          if new['_meta']['domSha256'] != os.environ['EXPECTED_DOM_SHA256']:
              raise SystemExit('Measured DOM fingerprint mismatch')
          shutil.copyfile(measured, target)
          print('RENDER_CALIBRATION_GEOMETRY_IDENTICAL_PASS')
          PY
      - name: Validate measured calibration on repository runtime
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run validate:render-calibration
          npm run test:render-calibration
      - name: Commit only measured calibration and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/pr401-commit-render-calibration.yml
          git add -A
          mapfile -t paths < <(git diff --cached --name-only)
          expected=(.github/workflows/pr401-commit-render-calibration.yml src/data/render-calibration.json)
          printf '%s\n' "${paths[@]}" | sort > /tmp/actual-paths
          printf '%s\n' "${expected[@]}" | sort > /tmp/expected-paths
          diff -u /tmp/expected-paths /tmp/actual-paths
          git config user.name "ghezelbaash-source-refactor-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "chore: refresh measured render calibration"
      - name: Publish calibration to the same PR branch only
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin refactor/single-source-truth-no-dist-drift
          test "$(git rev-parse origin/refactor/single-source-truth-no-dist-drift)" = "$GITHUB_SHA"
          GITHUB_AUTH="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $GITHUB_AUTH" \
            push origin HEAD:refactor/single-source-truth-no-dist-drift

name: Harden Cloudflare zone

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]

permissions:
  contents: read

jobs:
  harden:
    if: github.event.pull_request.head.ref == 'cloudflare-zone-audit-20260809'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 884d1d90bd1fb6ecca14992c6c60d677
      ZONE_NAME: ghezelbaash.ir
    steps:
      - name: Apply high-performance, crawler-open, Pages-ready Cloudflare configuration
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import datetime as dt
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          ACCOUNT=os.environ['CLOUDFLARE_ACCOUNT_ID']
          ZONE_NAME=os.environ['ZONE_NAME']
          MGMT=os.environ['CLOUDFLARE_API_TOKEN']
          BASE='https://api.cloudflare.com/client/v4'

          def call(token, method, path, body=None):
              data=None if body is None else json.dumps(body,separators=(',',':')).encode()
              req=urllib.request.Request(BASE+path, data=data, method=method, headers={
                  'Authorization':f'Bearer {token}',
                  'Accept':'application/json',
                  'Content-Type':'application/json',
                  'User-Agent':'ghezelbaash-cloudflare-harden/1.0',
              })
              try:
                  with urllib.request.urlopen(req, timeout=45) as r:
                      raw=r.read().decode('utf-8','replace')
                      return r.status, json.loads(raw) if raw else {}
              except urllib.error.HTTPError as e:
                  raw=e.read().decode('utf-8','replace')
                  try: payload=json.loads(raw) if raw else {}
                  except Exception: payload={'raw':raw[:1200]}
                  return e.code,payload
              except Exception as e:
                  return 0,{'error':type(e).__name__,'detail':str(e)[:400]}

          def ok(st,p):
              return 200 <= st < 300 and p.get('success',True) is not False

          # Resolve the exact target zone.
          q=urllib.parse.urlencode({'name':ZONE_NAME,'account.id':ACCOUNT,'per_page':50})
          st,z=call(MGMT,'GET','/zones?'+q)
          if st!=200 or z.get('success') is not True or not z.get('result'):
              raise SystemExit(f'Zone resolution failed HTTP {st}: {z.get("errors")}')
          zone=z['result'][0]
          ZONE=zone['id']

          # Determine whether Cloudflare Registrar owns the registration. If it does,
          # DNSSEC can be completed automatically. Otherwise we leave DNSSEC disabled
          # until the registrar-side DS record can be supplied deliberately.
          registrar_owned=False
          registrar_checks=[]
          for path in (
              f'/accounts/{ACCOUNT}/registrar/registrations/{urllib.parse.quote(ZONE_NAME)}',
              f'/accounts/{ACCOUNT}/registrar/domains/{urllib.parse.quote(ZONE_NAME)}',
          ):
              rs,rp=call(MGMT,'GET',path)
              registrar_checks.append({'path':path.split('/registrar/',1)[1],'http':rs,'success':rp.get('success')})
              if rs==200 and rp.get('success') is True and rp.get('result'):
                  registrar_owned=True
                  break

          # Mint a one-hour, zone-only admin token from the existing account service token.
          st,pg=call(MGMT,'GET',f'/accounts/{ACCOUNT}/tokens/permission_groups?scope=com.cloudflare.api.account.zone')
          if st!=200 or pg.get('success') is not True:
              raise SystemExit(f'Permission-group lookup failed HTTP {st}: {pg.get("errors")}')
          groups=[{'id':g['id']} for g in (pg.get('result') or []) if 'com.cloudflare.api.account.zone' in (g.get('scopes') or [])]
          if not groups:
              raise SystemExit('No zone-scoped permissions available')
          expires=(dt.datetime.now(dt.timezone.utc)+dt.timedelta(hours=1)).replace(microsecond=0).isoformat().replace('+00:00','Z')
          body={'name':'Temporary Ghezelbaash Zone Hardening','expires_on':expires,'policies':[{'effect':'allow','resources':{f'com.cloudflare.api.account.zone.{ZONE}':'*'},'permission_groups':groups}]}
          st,created=call(MGMT,'POST',f'/accounts/{ACCOUNT}/tokens',body)
          if st not in (200,201) or created.get('success') is not True:
              raise SystemExit(f'Temporary token creation failed HTTP {st}: {created.get("errors")}')
          tr=created.get('result') or {}; TEMP=tr.get('value'); TEMP_ID=tr.get('id')
          if not TEMP or not TEMP_ID: raise SystemExit('Temporary token missing id/value')

          changes=[]; notes=[]

          def get_setting(sid):
              s,p=call(TEMP,'GET',f'/zones/{ZONE}/settings/{sid}')
              return (p.get('result') or {}) if s==200 and p.get('success') is True else None

          def set_setting(sid,value):
              before=get_setting(sid)
              if before is None:
                  notes.append(f'{sid}: unavailable')
                  return
              if before.get('editable') is False:
                  notes.append(f'{sid}: not editable, current={before.get("value")}')
                  return
              if before.get('value') == value:
                  notes.append(f'{sid}: already optimal ({value})')
                  return
              s,p=call(TEMP,'PATCH',f'/zones/{ZONE}/settings/{sid}',{'value':value})
              if not ok(s,p):
                  raise SystemExit(f'Failed setting {sid}={value}: HTTP {s} {p.get("errors")}')
              after=(p.get('result') or {}).get('value')
              changes.append({'setting':sid,'before':before.get('value'),'after':after})

          try:
              # Protocol, transport and edge delivery: optimized for a static Pages site.
              desired={
                  'ssl':'strict',
                  'always_use_https':'on',
                  'tls_1_3':'zrt',
                  'min_tls_version':'1.2',
                  'http3':'on',
                  'brotli':'on',
                  'early_hints':'on',
                  'automatic_https_rewrites':'on',
                  'ipv6':'on',
                  'opportunistic_encryption':'on',
                  '0rtt':'on',
                  'rocket_loader':'off',
                  'browser_check':'off',
                  'cache_level':'aggressive',
                  'browser_cache_ttl':0,
                  'development_mode':'off',
                  'always_online':'off',
                  'websockets':'off',
                  'minify':{'css':'off','html':'off','js':'off'},
              }
              for sid,value in desired.items():
                  set_setting(sid,value)

              # HSTS is already deployed; strengthen duration without extending it to
              # every future subdomain and without preload lock-in.
              hsts={
                  'strict_transport_security':{
                      'enabled':True,
                      'max_age':31536000,
                      'include_subdomains':False,
                      'preload':False,
                      'nosniff':True,
                  }
              }
              set_setting('security_header',hsts)

              # Universal SSL must remain enabled.
              s,p=call(TEMP,'GET',f'/zones/{ZONE}/ssl/universal/settings')
              current=(p.get('result') or {}) if s==200 and p.get('success') is True else {}
              if current.get('enabled') is not True:
                  us,up=call(TEMP,'PATCH',f'/zones/{ZONE}/ssl/universal/settings',{'enabled':True})
                  if not ok(us,up): raise SystemExit(f'Could not enable Universal SSL: HTTP {us} {up.get("errors")}')
                  changes.append({'setting':'universal_ssl','before':current.get('enabled'),'after':True})
              else: notes.append('universal_ssl: already enabled')

              # Explicitly keep AI/search/agent crawlers open and prevent Cloudflare
              # managed robots/Bot Fight Mode from overriding the source robots policy.
              s,before_bot=call(TEMP,'GET',f'/zones/{ZONE}/bot_management')
              if s==200 and before_bot.get('success') is True:
                  bot_before=before_bot.get('result') or {}
                  bot_body={
                      'ai_bots_protection':'disabled',
                      'content_bots_protection':'disabled',
                      'crawler_protection':'disabled',
                      'fight_mode':False,
                      'is_robots_txt_managed':False,
                      'cf_robots_variant':'off',
                  }
                  bs,bp=call(TEMP,'PUT',f'/zones/{ZONE}/bot_management',bot_body)
                  if not ok(bs,bp):
                      raise SystemExit(f'Bot configuration update failed HTTP {bs}: {bp.get("errors")}')
                  bot_after=bp.get('result') or {}
                  changes.append({'setting':'bot_management','before':{k:bot_before.get(k) for k in bot_body},'after':{k:bot_after.get(k) for k in bot_body}})

                  # Cloudflare currently exposes a migration opt-out field for upcoming
                  # AI policy defaults. Attempt the explicit opt-out separately; if the
                  # plan/API treats it as read-only, retain the already-explicit allow state.
                  if bot_before.get('ai_bots_migration_opt_out') is False:
                      ms,mp=call(TEMP,'PUT',f'/zones/{ZONE}/bot_management',{'ai_bots_migration_opt_out':True})
                      if ok(ms,mp):
                          changes.append({'setting':'ai_bots_migration_opt_out','before':False,'after':(mp.get('result') or {}).get('ai_bots_migration_opt_out')})
                      else:
                          notes.append(f'ai_bots_migration_opt_out not API-editable: HTTP {ms}')
              else:
                  notes.append(f'bot_management unreadable HTTP {s}')

              # Add the declared GitHub shortcut if absent, keeping all mail and
              # verification records untouched. A proxied TEST-NET address exists only
              # to bring the request to Cloudflare's redirect engine.
              s,dns=call(TEMP,'GET',f'/zones/{ZONE}/dns_records?'+urllib.parse.urlencode({'type':'A','name':f'github.{ZONE_NAME}','per_page':100}))
              if s==200 and dns.get('success') is True and not (dns.get('result') or []):
                  ds,dp=call(TEMP,'POST',f'/zones/{ZONE}/dns_records',{'type':'A','name':f'github.{ZONE_NAME}','content':'192.0.2.1','ttl':1,'proxied':True,'comment':'Cloudflare redirect-only hostname to canonical GitHub repository'})
                  if not ok(ds,dp): raise SystemExit(f'Could not create github redirect DNS record: HTTP {ds} {dp.get("errors")}')
                  changes.append({'setting':'dns github.ghezelbaash.ir','before':'absent','after':'proxied redirect hostname'})
              else:
                  notes.append('github.ghezelbaash.ir DNS record already exists or DNS lookup unavailable')

              # Extend the existing modern redirect ruleset without altering current
              # root, Google Maps, or Instagram redirects.
              s,rs=call(TEMP,'GET',f'/zones/{ZONE}/rulesets')
              dynamic=None
              if s==200 and rs.get('success') is True:
                  dynamic=next((r for r in (rs.get('result') or []) if r.get('kind')=='zone' and r.get('phase')=='http_request_dynamic_redirect'),None)
              if not dynamic:
                  cs,cp=call(TEMP,'POST',f'/zones/{ZONE}/rulesets',{'name':'default','kind':'zone','phase':'http_request_dynamic_redirect','description':'Canonical and owned-asset redirects'})
                  if not ok(cs,cp): raise SystemExit(f'Cannot create dynamic redirect ruleset: HTTP {cs} {cp.get("errors")}')
                  dynamic=cp.get('result') or {}
              rid=dynamic.get('id')
              gs,gp=call(TEMP,'GET',f'/zones/{ZONE}/rulesets/{rid}')
              existing=(gp.get('result') or {}).get('rules') or [] if ok(gs,gp) else []

              def ensure_redirect(host,target,preserve=False,description=''):
                  expr=f'(http.host eq "{host}")'
                  if any(r.get('expression')==expr and r.get('enabled',True) for r in existing):
                      notes.append(f'redirect {host}: already exists')
                      return
                  rule={'action':'redirect','expression':expr,'description':description,'enabled':True,'action_parameters':{'from_value':{'status_code':301,'target_url':{'value':target},'preserve_query_string':preserve}}}
                  xs,xp=call(TEMP,'POST',f'/zones/{ZONE}/rulesets/{rid}/rules',rule)
                  if not ok(xs,xp): raise SystemExit(f'Could not add redirect for {host}: HTTP {xs} {xp.get("errors")}')
                  changes.append({'setting':f'redirect {host}','before':'absent','after':target})

              ensure_redirect(f'github.{ZONE_NAME}','https://github.com/medicaldoctor91/doctor-ghezelbaash',False,'Permanent shortcut to canonical physician GitHub repository')
              ensure_redirect(f'blog.{ZONE_NAME}','https://www.ghezelbaash.ir',False,'Collapse legacy blog hostname directly to canonical physician site')

              # DNSSEC: enable automatically only when Cloudflare itself owns the
              # registration and can publish DS records at the registry. External
              # registrars require an explicit registrar-side DS operation.
              ds,dp=call(TEMP,'GET',f'/zones/{ZONE}/dnssec')
              dnssec_before=(dp.get('result') or {}).get('status') if ok(ds,dp) else None
              if registrar_owned and dnssec_before=='disabled':
                  es,ep=call(TEMP,'POST',f'/zones/{ZONE}/dnssec')
                  if not ok(es,ep): raise SystemExit(f'DNSSEC activation failed: HTTP {es} {ep.get("errors")}')
                  changes.append({'setting':'dnssec','before':'disabled','after':(ep.get('result') or {}).get('status')})
              elif dnssec_before=='disabled':
                  notes.append('dnssec: external/non-Cloudflare registrar detected; left disabled to avoid an incomplete chain of trust')
              else:
                  notes.append(f'dnssec: current status={dnssec_before}')

              # Final verification snapshot.
              verify={}
              for sid in desired:
                  r=get_setting(sid); verify[sid]=None if r is None else r.get('value')
              hr=get_setting('security_header'); verify['security_header']=None if hr is None else hr.get('value')
              bs,bp=call(TEMP,'GET',f'/zones/{ZONE}/bot_management'); verify['bot_management']=(bp.get('result') or {}) if ok(bs,bp) else {'http':bs}
              ds,dp=call(TEMP,'GET',f'/zones/{ZONE}/dnssec'); verify['dnssec']=(dp.get('result') or {}).get('status') if ok(ds,dp) else None

              print('CLOUDFLARE_HARDEN_RESULT_BEGIN')
              print(json.dumps({'registrar_owned_by_cloudflare':registrar_owned,'registrar_checks':registrar_checks,'changes':changes,'notes':notes,'verify':verify},ensure_ascii=False,indent=2,sort_keys=True))
              print('CLOUDFLARE_HARDEN_RESULT_END')
          finally:
              rs,rp=call(MGMT,'DELETE',f'/accounts/{ACCOUNT}/tokens/{TEMP_ID}')
              print(f'TEMP_ZONE_ADMIN_REVOKE_HTTP={rs} success={rp.get("success")}')
          PY

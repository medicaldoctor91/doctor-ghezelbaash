name: One-time semantic head ownership migration

on:
  push:
    branches:
      - refactor/single-source-truth-no-dist-drift

permissions:
  contents: write

concurrency:
  group: semantic-head-ownership-migration
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Apply exact semantic ownership patch
        shell: bash
        run: |
          python - <<'PY'
          import base64, zlib
          from pathlib import Path
          payload = ''
          Path('/tmp/semantic-head.patch').write_bytes(zlib.decompress(base64.b64decode(payload)))
          PY
          git apply --check /tmp/semantic-head.patch
          git apply /tmp/semantic-head.patch
          rm .github/workflows/one-time-semantic-head-ownership.yml
          git diff --check
      - name: Install locked dependencies
        run: npm ci
      - name: Validate changed ownership boundaries
        run: |
          npm run validate:visible-text-source
          npm run validate:architecture
          node scripts/validate-critical-path.mjs
          node scripts/validate-release-contract.mjs
      - name: Commit migration atomically
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'refactor: consolidate HTML semantic ownership'
          git push origin HEAD:refactor/single-source-truth-no-dist-drift

name: Diagnose live integrity manifest mismatch

on:
  push:
    branches:
      - ops/solo-practice-convergence-20261016
    paths:
      - .github/workflows/solo-practice-integrity-debug-20261016.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TARGET_SHA: 62cd2dd0432790916467c0c25d8264c20ba103cd
      DEPLOYMENT_ORIGIN: https://199822b7.doctor-ghezelbaash.pages.dev/
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 62cd2dd0432790916467c0c25d8264c20ba103cd
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Build exact target
        run: |
          npm ci
          npm run build
      - name: Compare live and direct-deployment representations
        run: |
          python - <<'PY'
          import hashlib,json,os,time,urllib.request
          from pathlib import Path
          target=os.environ['TARGET_SHA']
          origins=['https://www.ghezelbaash.ir/',os.environ['DEPLOYMENT_ORIGIN']]
          local=(Path('dist')/'integrity-manifest.json').read_bytes()
          local_json=json.loads(local)
          print('LOCAL_SHA256',hashlib.sha256(local).hexdigest(),'files',len(local_json['files']))
          def fetch(url):
              req=urllib.request.Request(url,headers={'Cache-Control':'no-cache','Pragma':'no-cache'})
              with urllib.request.urlopen(req,timeout=30) as r:
                  return r.read(),dict(r.headers)
          for origin in origins:
              print('ORIGIN',origin)
              for suffix in ['integrity-manifest.json','integrity-manifest.json?verify='+target+'-'+str(time.time_ns()),'release-provenance.json?verify='+target+'-'+str(time.time_ns())]:
                  body,headers=fetch(origin+suffix)
                  print('FETCH',suffix.split('?')[0],'QUERY', '?' in suffix,'SHA256',hashlib.sha256(body).hexdigest(),'LEN',len(body),'AGE',headers.get('Age'),'CF_CACHE_STATUS',headers.get('CF-Cache-Status'),'CACHE_CONTROL',headers.get('Cache-Control'))
                  if suffix.startswith('release-provenance'):
                      try: print('SOURCE_COMMIT',json.loads(body).get('sourceCommit'))
                      except Exception as e: print('PROVENANCE_JSON_ERROR',repr(e))
                  else:
                      try:
                          live=json.loads(body)
                          print('MANIFEST_FILES',len(live.get('files',{})),'RELEASE_DATE',live.get('releaseDate'))
                          if body!=local:
                              lfiles=local_json.get('files',{}); rfiles=live.get('files',{})
                              missing=sorted(set(lfiles)-set(rfiles)); extra=sorted(set(rfiles)-set(lfiles))
                              changed=sorted(k for k in set(lfiles)&set(rfiles) if lfiles[k]!=rfiles[k])
                              print('DIFF_COUNTS','missing',len(missing),'extra',len(extra),'changed',len(changed))
                              print('MISSING_SAMPLE',missing[:10]); print('EXTRA_SAMPLE',extra[:10]); print('CHANGED_SAMPLE',changed[:20])
                              for k in changed[:8]: print('CHANGED_DETAIL',k,'LOCAL',lfiles[k],'LIVE',rfiles[k])
                          else: print('BYTE_IDENTICAL_TO_LOCAL',True)
                      except Exception as e: print('MANIFEST_JSON_ERROR',repr(e))
          PY

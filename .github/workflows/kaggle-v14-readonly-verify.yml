name: Read-only exact Kaggle v14 verification
on:
  push:
    branches: [maintenance/platform-convergence-20261012]
    paths: [.github/workflows/kaggle-v14-readonly-verify.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN || secrets.KAGGLE_TOKEN }}
      DATASET_REF: saeedghezelbash/dr-saeed-ghezelbash-knowledge-graph-and-nlp-data
      TARGET_VERSION: '14'
      WEBSITE_COMMIT: 8edb4d6f2e224886132297ac5f380bee26cb53cb
      HF_REVISION: e0c33aa565ed1495d3ed78d907cf37f86e73489a
    steps:
      - uses: actions/checkout@v4
        with: {ref: 8edb4d6f2e224886132297ac5f380bee26cb53cb, persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install verification dependencies
        run: python -m pip install --disable-pip-version-check 'kaggle==2.2.4' 'pyarrow>=18,<23' 'rdflib>=7,<8' 'pyshacl>=0.30,<1' 'mlcroissant==1.1.1'
      - name: Read raw Kaggle public state and require v14 Ready
        run: |
          python - <<'PY'
          import json, os, urllib.request
          ref=os.environ['DATASET_REF'];target=int(os.environ['TARGET_VERSION'])
          req=urllib.request.Request('https://www.kaggle.com/api/v1/datasets/view/'+ref,headers={'Cache-Control':'no-cache','Pragma':'no-cache','User-Agent':'ghezelbaash-kaggle-v14-verify/1.0'})
          with urllib.request.urlopen(req,timeout=60) as r:view=json.load(r)
          print('CURRENT_VERSION',view['currentVersionNumber'])
          versions={int(v['versionNumber']):v for v in view.get('versions',[])}
          print('TARGET_STATE',json.dumps(versions.get(target),ensure_ascii=False))
          assert int(view['currentVersionNumber'])==target, ('Expected current Kaggle v14',view['currentVersionNumber'])
          assert target in versions and versions[target]['status']=='Ready', versions.get(target)
          PY
      - name: List exact v14 files using documented versioned dataset ref
        run: kaggle datasets files "$DATASET_REF/$TARGET_VERSION" -v | tee /tmp/kaggle-v14-files.csv
      - name: Download exact v14 using documented versioned dataset ref
        run: |
          rm -rf /tmp/kaggle-v14 && mkdir -p /tmp/kaggle-v14
          kaggle datasets download "$DATASET_REF/$TARGET_VERSION" -p /tmp/kaggle-v14 --unzip -o
          find /tmp/kaggle-v14 -type f -printf '%P\n' | sort > /tmp/kaggle-v14-inventory.txt
          cat /tmp/kaggle-v14-inventory.txt
      - name: Verify exact v14 package hashes and canonical bindings
        run: |
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path('/tmp/kaggle-v14')
          manifest=json.loads((root/'kaggle-manifest.json').read_text())
          assert manifest['desired_kaggle_version']==14
          assert manifest['packaging_revision']==14
          assert manifest['website_source_commit']==os.environ['WEBSITE_COMMIT']
          assert manifest['upstream_revision']==os.environ['HF_REVISION']
          assert manifest['canonical_dataset_iri']=='https://www.ghezelbaash.ir/graph.jsonld/dataset'
          checks={}
          for line in (root/'checksums.sha256').read_text().splitlines():
              digest,name=line.split('  ',1);checks[name]=digest
              actual=hashlib.sha256((root/name).read_bytes()).hexdigest()
              assert actual==digest,(name,actual,digest)
          print('CHECKSUM_FILES',len(checks))
          print('V14_MANIFEST_ORIGINAL_FILES',len(manifest['original_files']))
          print('V14_TABLES',json.dumps(manifest['tables'],sort_keys=True))
          assert (root/'enrichment.zip').is_file(), 'Positioning enrichment archive missing'
          PY
      - name: Verify RDF and machine-resource semantics from exact v14
        run: python tests/validate_platform_bundle.py /tmp/kaggle-v14 --no-reader --rdf

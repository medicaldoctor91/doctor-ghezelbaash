name: Temporary WikiJournal preprint source audit
on:
  push:
    branches: [main]
    paths: ['.github/workflows/_tmp-preprint-source-audit.yml']
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check --no-input requests==2.32.5
      - name: Fetch live preprint source
        shell: bash
        run: |
          python - <<'PY'
          import requests,json,re,os
          API='https://en.wikiversity.org/w/api.php'
          H={'User-Agent':'GhezelbaashPreprintSourceAudit/1.0 (https://www.ghezelbaash.ir/)'}
          title='WikiJournal Preprints/Individualized clinical assessment and outcome interpretation in aesthetic botulinum neurotoxin type A treatment: a focused review'
          p=requests.get(API,params={'action':'query','format':'json','formatversion':2,'titles':title,'prop':'info|pageprops|revisions','rvprop':'ids|timestamp|user|comment|content','rvslots':'main','rvlimit':1},headers=H,timeout=60).json()['query']['pages'][0]
          rev=(p.get('revisions') or [{}])[0]; src=rev.get('slots',{}).get('main',{}).get('content','')
          talk='Talk:'+title
          tp=requests.get(API,params={'action':'query','format':'json','formatversion':2,'titles':talk,'prop':'info|pageprops|revisions','rvprop':'ids|timestamp|user|comment|content','rvslots':'main','rvlimit':1},headers=H,timeout=60).json()['query']['pages'][0]
          tsrc=((tp.get('revisions') or [{}])[0].get('slots',{}).get('main',{}).get('content','') if tp.get('revisions') else '')
          patterns=['orcid','license','author','submission','email','journal','review','keyword','conflict','doi','wikidata']
          lines=[ln for ln in src.splitlines() if any(x in ln.lower() for x in patterns)]
          tlines=[ln for ln in tsrc.splitlines() if any(x in ln.lower() for x in patterns)]
          out={'title':p.get('title'),'pageid':p.get('pageid'),'ns':p.get('ns'),'touched':p.get('touched'),'pageprops':p.get('pageprops'),'revid':rev.get('revid'),'timestamp':rev.get('timestamp'),'source_relevant_lines':lines[:120],'talk_exists':not tp.get('missing',False),'talk_pageid':tp.get('pageid'),'talk_pageprops':tp.get('pageprops'),'talk_relevant_lines':tlines[:120]}
          os.makedirs('wikimedia',exist_ok=True)
          open('wikimedia/_tmp-preprint-source-audit.json','w',encoding='utf8').write(json.dumps(out,ensure_ascii=False,indent=2))
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - name: Commit audit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add wikimedia/_tmp-preprint-source-audit.json
          git commit -m 'Record temporary WikiJournal preprint source audit'
          git push

name: HF Zenodo pointer repair unit tests

on:
  push:
    branches: [maintenance/zenodo-in-place-20261014]
    paths:
      - 'tests/test_hf_zenodo_pointer_repair.py'
      - '.github/scripts/hf_zenodo_pointer_repair.py'
      - '.github/workflows/hf-zenodo-pointer-unit-tests.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest tests/test_hf_zenodo_pointer_repair.py -v

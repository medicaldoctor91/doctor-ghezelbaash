name: Validate chat rollback
on:
  push:
    branches: [revert/chat-seo-changes]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Assert exact rollback state
        run: |
          set -euo pipefail
          grep -Fq 'itemprop="additionalProperty" itemscope itemtype="https://schema.org/PropertyValue"' dist/index.html
          ! grep -Fq 'itemprop="reviewCount" content="167"' dist/index.html
          grep -Fq "Iran's #1 doctor" dist/index.html
          node - <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('src/data/machine-resources.json','utf8'));
          const x=r.resources.find(v=>v.path==='index.html');
          if(JSON.stringify(x.targets)!==JSON.stringify(['website','huggingFace','zenodo'])) throw new Error('index targets not restored');
          NODE

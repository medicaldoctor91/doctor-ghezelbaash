name: Temporary semantic work recovery

on:
  push:
    branches: [fix/semantic-calibration-recovery-20260907]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
      - name: Apply fail-closed canonical graph corrections
        run: node scripts/apply-semantic-work-recovery.mjs
      - name: Require scoped graph diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed=$(git diff --name-only)
          test "$changed" = "src/data/semantic/knowledge-graph.jsonld"
          git diff -- src/data/semantic/knowledge-graph.jsonld > /tmp/semantic.patch
          grep -q '1068' /tmp/semantic.patch
          grep -q '1067' /tmp/semantic.patch
          grep -q 'mainEntityOfPage' /tmp/semantic.patch
          grep -q 'isPartOf' /tmp/semantic.patch
      - name: Commit exact canonical source correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/semantic/knowledge-graph.jsonld
          git commit -m "Correct canonical media semantics and image dimensions"
          git push origin "HEAD:${GITHUB_REF_NAME}"

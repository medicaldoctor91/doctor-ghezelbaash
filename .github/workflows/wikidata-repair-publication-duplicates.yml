name: Repair Wikidata publication duplicates

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wikidata-repair-publication-duplicates.yml'

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      WIKIMEDIA_USERNAME: ${{ secrets.WIKIVERSITY_USERNAME }}
      WIKIMEDIA_BOT_PASSWORD: ${{ secrets.WIKIVERSITY_BOT_PASSWORD }}
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check --no-input requests==2.32.5
      - name: Restore originals to pre-accident state and verify canonical reverse links
        shell: python
        run: |
          import json, os, time, requests

          WD='https://www.wikidata.org/w/api.php'
          PERSON='Q140287622'
          AUTHOR='Q482980'
          SNAPSHOTS={
              'Q36942316':2528326179,
              'Q140298431':2528326174,
          }
          ORIGINAL_META={
              'Q36942316': {'pmid':'27280013','doi':'10.4103/2008-7802.182734','ref':'https://pubmed.ncbi.nlm.nih.gov/27280013/'},
              'Q140298431': {'pmid':'34574943','doi':'10.3390/healthcare9091169','ref':'https://pubmed.ncbi.nlm.nih.gov/34574943/'},
              'Q140306302': {'pmid':None,'doi':None,'ref':None},
          }
          REDIRECTS={
              'Q141099144':'Q36942316',
              'Q141099146':'Q140298431',
          }
          UA='Medicaldoctor91WikidataDuplicateRepair/2.0 (https://www.ghezelbaash.ir/)'
          anon=requests.Session(); anon.headers['User-Agent']=UA
          auth=requests.Session(); auth.headers['User-Agent']=UA

          def get(session, params):
              r=session.get(WD,params={**params,'format':'json','formatversion':2},timeout=90)
              r.raise_for_status(); d=r.json()
              if 'error' in d: raise RuntimeError(d['error'])
              return d

          def post(data, retries=8):
              waits=[10,20,30,45,60,75,90,120]
              last=None
              for i in range(retries):
                  r=auth.post(WD,data={**data,'format':'json','formatversion':2,'maxlag':5},timeout=120)
                  r.raise_for_status(); d=r.json()
                  if 'error' not in d: return d
                  last=d['error']; blob=json.dumps(last,ensure_ascii=False).lower()
                  if 'actionthrottled' in blob or last.get('code') in {'maxlag','ratelimited','failed-save'}:
                      time.sleep(waits[min(i,len(waits)-1)]); continue
                  raise RuntimeError(last)
              raise RuntimeError({'after_retries':last})

          def entity(session,q):
              return get(session,{'action':'wbgetentities','ids':q,'props':'claims|labels|descriptions|aliases|sitelinks|info'})['entities'][q]

          def historical(revid):
              d=get(anon,{'action':'query','revids':str(revid),'prop':'revisions','rvprop':'ids|timestamp|content','rvslots':'main'})
              page=d['query']['pages'][0]; rev=page['revisions'][0]; slot=rev['slots']['main']
              text=slot.get('content') or slot.get('*')
              if not text: raise RuntimeError({'historical_content_missing':revid})
              return json.loads(text), {'title':page.get('title'),'revid':rev.get('revid'),'timestamp':rev.get('timestamp')}

          def qid(snak):
              v=snak.get('datavalue',{}).get('value')
              return v.get('id') if isinstance(v,dict) else None

          def scalar(snak):
              v=snak.get('datavalue',{}).get('value')
              if isinstance(v,dict) and 'text' in v: return v['text']
              return v

          def item_value(q): return json.dumps({'entity-type':'item','numeric-id':int(q[1:])},separators=(',',':'))

          # Fetch all historical snapshots and verify identity BEFORE any mutation.
          history={}
          for q,rev in SNAPSHOTS.items():
              old,meta=historical(rev)
              if old.get('id')!=q or meta['title']!=q:
                  raise RuntimeError({'snapshot_identity_mismatch':{'expected':q,'meta':meta,'id':old.get('id')}})
              expected=ORIGINAL_META[q]
              old_pmids={str(scalar(c.get('mainsnak',{}))) for c in old.get('claims',{}).get('P698',[])}
              old_dois={str(scalar(c.get('mainsnak',{}))).lower() for c in old.get('claims',{}).get('P356',[])}
              old_p50={qid(c.get('mainsnak',{})) for c in old.get('claims',{}).get('P50',[])}
              if expected['pmid'] not in old_pmids or expected['doi'].lower() not in old_dois or PERSON not in old_p50:
                  raise RuntimeError({'historical_identity_gate_failed':{'qid':q,'pmids':sorted(old_pmids),'dois':sorted(old_dois),'P50':sorted(x for x in old_p50 if x)}})
              history[q]={'entity':old,'meta':meta}

          # Both accidental QIDs must already redirect to the pre-existing originals.
          redirect_checks={}
          for dup,orig in REDIRECTS.items():
              d=get(anon,{'action':'query','titles':dup,'redirects':1,'prop':'info'})
              pairs={(x.get('from'),x.get('to')) for x in d.get('query',{}).get('redirects',[])}
              if (dup,orig) not in pairs:
                  raise RuntimeError({'expected_merge_redirect_missing':{'from':dup,'to':orig,'seen':list(pairs)}})
              redirect_checks[dup]=orig

          # Authenticate only after all read-only gates pass.
          lt=get(auth,{'action':'query','meta':'tokens','type':'login'})['query']['tokens']['logintoken']
          login=post({'action':'login','lgname':os.environ['WIKIMEDIA_USERNAME'],'lgpassword':os.environ['WIKIMEDIA_BOT_PASSWORD'],'lgtoken':lt})
          if login.get('login',{}).get('result')!='Success': raise RuntimeError({'login':login})
          ui=get(auth,{'action':'query','meta':'userinfo','uiprop':'rights|groups'})['query']['userinfo']
          if 'edit' not in set(ui.get('rights',[])): raise RuntimeError({'missing_edit_right':True})
          csrf=get(auth,{'action':'query','meta':'tokens','type':'csrf'})['query']['tokens']['csrftoken']

          restore_report={}
          for q in SNAPSHOTS:
              old=history[q]['entity']; cur=entity(auth,q)
              old_claims={c['id']:c for arr in old.get('claims',{}).values() for c in arr}
              cur_claims={c['id']:c for arr in cur.get('claims',{}).values() for c in arr}

              # Everything whose statement ID did not exist in the captured pre-accident revision came from the accidental merge.
              added_ids=[cid for cid in cur_claims if cid not in old_claims]
              if added_ids:
                  for i in range(0,len(added_ids),40):
                      post({'action':'wbremoveclaims','claim':'|'.join(added_ids[i:i+40]),'token':csrf,'summary':'Remove statements introduced by accidental duplicate publication merge'})

              # If a pre-existing claim itself was modified by merge, restore its exact historical JSON.
              restored_claims=[]
              cur=entity(auth,q)
              cur_claims={c['id']:c for arr in cur.get('claims',{}).values() for c in arr}
              for cid,old_claim in old_claims.items():
                  if cid not in cur_claims:
                      raise RuntimeError({'preexisting_claim_missing_after_merge':{'qid':q,'claim':cid}})
                  if json.dumps(cur_claims[cid],sort_keys=True,ensure_ascii=False)!=json.dumps(old_claim,sort_keys=True,ensure_ascii=False):
                      post({'action':'wbsetclaim','claim':json.dumps(old_claim,ensure_ascii=False,separators=(',',':')),'token':csrf,'summary':'Restore pre-existing publication statement exactly after accidental merge'})
                      restored_claims.append(cid)

              # Remove aliases introduced by the accidental merge while preserving every historical alias.
              cur=entity(auth,q)
              old_aliases={lang:{x['value'] for x in vals} for lang,vals in old.get('aliases',{}).items()}
              cur_aliases={lang:{x['value'] for x in vals} for lang,vals in cur.get('aliases',{}).items()}
              removed_aliases={}
              for lang,vals in cur_aliases.items():
                  extra=sorted(vals-old_aliases.get(lang,set()))
                  if extra:
                      post({'action':'wbsetaliases','id':q,'language':lang,'remove':'|'.join(extra),'token':csrf,'summary':'Remove alias introduced by accidental duplicate merge'})
                      removed_aliases[lang]=extra

              # Labels/descriptions on the recipient must remain exactly as before the accident.
              cur=entity(auth,q)
              for field,action in [('labels','wbsetlabel'),('descriptions','wbsetdescription')]:
                  old_terms=old.get(field,{})
                  cur_terms=cur.get(field,{})
                  langs=set(old_terms)|set(cur_terms)
                  for lang in langs:
                      ov=old_terms.get(lang,{}).get('value')
                      cv=cur_terms.get(lang,{}).get('value')
                      if ov==cv: continue
                      if ov is None:
                          # No historical term in this language: clear any merge-added term.
                          post({'action':action,'id':q,'language':lang,'value':'','token':csrf,'summary':'Remove term introduced by accidental duplicate merge'})
                      else:
                          post({'action':action,'id':q,'language':lang,'value':ov,'token':csrf,'summary':'Restore pre-accident publication term'})

              restore_report[q]={'removed_new_claim_ids':added_ids,'restored_modified_old_claim_ids':restored_claims,'removed_extra_aliases':removed_aliases}

          # Remove any reverse contribution still pointing at obsolete redirect QIDs.
          p=entity(auth,PERSON)
          wrong=[c['id'] for c in p.get('claims',{}).get('P3919',[]) if qid(c.get('mainsnak',{})) in REDIRECTS]
          if wrong:
              post({'action':'wbremoveclaims','claim':'|'.join(wrong),'token':csrf,'summary':'Remove reverse contribution links to obsolete duplicate publication QIDs'})

          # Ensure only canonical authored works are linked from the person with author role and evidence.
          def ensure_reverse(work, ref_url):
              p=entity(auth,PERSON)
              ms=[c for c in p.get('claims',{}).get('P3919',[]) if qid(c.get('mainsnak',{}))==work]
              if len(ms)>1: raise RuntimeError({'duplicate_person_P3919':work})
              if not ms:
                  out=post({'action':'wbcreateclaim','entity':PERSON,'property':'P3919','snaktype':'value','value':item_value(work),'token':csrf,'baserevid':p.get('lastrevid'),'summary':'Link Saeed Ghezelbash to verified authored work'})
                  cid=out['claim']['id']
              else:
                  cid=ms[0]['id']
              p=entity(auth,PERSON); c=next(x for x in p.get('claims',{}).get('P3919',[]) if x['id']==cid)
              roles={qid(x) for x in c.get('qualifiers',{}).get('P2868',[])}
              if AUTHOR not in roles:
                  post({'action':'wbsetqualifier','claim':cid,'property':'P2868','snaktype':'value','value':item_value(AUTHOR),'token':csrf,'summary':'Qualify contribution role as author'})
              p=entity(auth,PERSON); c=next(x for x in p.get('claims',{}).get('P3919',[]) if x['id']==cid)
              if not c.get('references'):
                  if ref_url:
                      snaks={'P854':[{'snaktype':'value','property':'P854','datavalue':{'value':ref_url,'type':'string'},'datatype':'url'}]}
                      post({'action':'wbsetreference','statement':cid,'snaks':json.dumps(snaks,separators=(',',':')),'snaks-order':json.dumps(['P854']),'token':csrf,'summary':'Add authorship source to reverse contribution statement'})
                  else:
                      w=entity(anon,work); p50=[x for x in w.get('claims',{}).get('P50',[]) if qid(x.get('mainsnak',{}))==PERSON]
                      if len(p50)!=1 or not p50[0].get('references'): raise RuntimeError({'presentation_P50_source_missing':work})
                      for ref in p50[0]['references']:
                          snaks=ref.get('snaks',{}); order=ref.get('snaks-order') or list(snaks)
                          if snaks:
                              post({'action':'wbsetreference','statement':cid,'snaks':json.dumps(snaks,ensure_ascii=False,separators=(',',':')),'snaks-order':json.dumps(order,separators=(',',':')),'token':csrf,'summary':'Copy verified authorship source to reverse contribution statement'})
              return cid

          reverse={work:ensure_reverse(work,meta['ref']) for work,meta in ORIGINAL_META.items()}

          # Final anonymous verification: originals equal historical claim-ID set; person has one sourced author-role edge to each canonical work and none to obsolete QIDs.
          final={}
          for q in SNAPSHOTS:
              old=history[q]['entity']; cur=entity(anon,q)
              old_ids={c['id'] for arr in old.get('claims',{}).values() for c in arr}
              cur_ids={c['id'] for arr in cur.get('claims',{}).values() for c in arr}
              if old_ids!=cur_ids:
                  raise RuntimeError({'claim_set_not_restored':{'qid':q,'extra':sorted(cur_ids-old_ids),'missing':sorted(old_ids-cur_ids)}})
              for cid in old_ids:
                  oc=next(c for arr in old.get('claims',{}).values() for c in arr if c['id']==cid)
                  cc=next(c for arr in cur.get('claims',{}).values() for c in arr if c['id']==cid)
                  if json.dumps(oc,sort_keys=True,ensure_ascii=False)!=json.dumps(cc,sort_keys=True,ensure_ascii=False):
                      raise RuntimeError({'historical_claim_not_exact':{'qid':q,'claim':cid}})
              final[q]={'pre_accident_revision':SNAPSHOTS[q],'claims_exactly_restored':True}

          fp=entity(anon,PERSON)
          p3919={}
          for c in fp.get('claims',{}).get('P3919',[]):
              t=qid(c.get('mainsnak',{}));
              if t: p3919.setdefault(t,[]).append(c)
          for obsolete in REDIRECTS:
              if p3919.get(obsolete): raise RuntimeError({'obsolete_reverse_edge_remains':obsolete})
          for work in ORIGINAL_META:
              ms=p3919.get(work,[])
              if len(ms)!=1: raise RuntimeError({'canonical_reverse_edge_count':{'work':work,'count':len(ms)}})
              roles={qid(x) for x in ms[0].get('qualifiers',{}).get('P2868',[])}
              if AUTHOR not in roles or not ms[0].get('references'):
                  raise RuntimeError({'canonical_reverse_edge_incomplete':work})
              w=entity(anon,work)
              if len([c for c in w.get('claims',{}).get('P50',[]) if qid(c.get('mainsnak',{}))==PERSON])!=1:
                  raise RuntimeError({'canonical_work_P50_count_wrong':work})

          print(json.dumps({'ok':True,'authenticated_as':ui.get('name'),'redirects':redirect_checks,'restoration':restore_report,'reverse_edges':reverse,'final':final,'person_P3919_targets':sorted(p3919)},ensure_ascii=False,indent=2))

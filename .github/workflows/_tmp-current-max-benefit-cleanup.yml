name: Temporary current maximum-benefit cleanup
on:
  push:
    branches: [main]
    paths: ['.github/workflows/_tmp-current-max-benefit-cleanup.yml']
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Remove temporary audit and execution files
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f --ignore-unmatch \
            .github/workflows/_tmp-max-benefit-entity-audit.yml \
            wikimedia/_tmp-max-benefit-entity-audit.json \
            .github/workflows/_tmp-max-benefit-summary.yml \
            wikimedia/_tmp-max-benefit-summary.json \
            .github/workflows/_tmp-preprint-source-audit.yml \
            wikimedia/_tmp-preprint-source-audit.json \
            .github/workflows/_tmp-orcid-alias-audit.yml \
            wikimedia/_tmp-orcid-alias-audit.json \
            .github/workflows/_tmp-create-wikijournal-preprint-item.yml \
            wikimedia/_tmp-create-wikijournal-preprint-item-status.json \
            .github/workflows/_tmp-preprint-postverify.yml \
            wikimedia/_tmp-preprint-postverify.json \
            .github/workflows/_tmp-current-max-benefit-cleanup.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Remove temporary maximum-benefit audit files'
          git push

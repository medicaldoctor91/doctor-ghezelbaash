name: Deterministic Wikidata Batch 1 audit
on:
  push:
    branches: [audit/wikidata-batch1-20261016]
    paths: [.github/workflows/wikidata-batch1-audit.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch, normalize and score live Wikidata core model
        run: |
          set -euo pipefail
          mkdir -p /tmp/batch1
          python - <<'PY'
          import json, urllib.parse, urllib.request, time, csv, os, collections, hashlib
          OUT='/tmp/batch1'
          API='https://www.wikidata.org/w/api.php'
          WDQS='https://query.wikidata.org/sparql'
          UA='Q140287622-batch1-auditor/1.0 (deterministic read-only audit; contact github.com/medicaldoctor91/doctor-ghezelbaash)'
          TARGET='Q140287622'
          CORE=['P31','P106','P512','P69','P1416','P463','P511','P937','P1830','P121','P10611']
          CLINIC_IDS=['P1932','P2671','P3749','P11693','P13096','P625','P6375','P281','P1329','P856','P127','P138']

          def get(url, params=None, retries=4):
              if params:
                  url += ('&' if '?' in url else '?') + urllib.parse.urlencode(params)
              req=urllib.request.Request(url,headers={'User-Agent':UA,'Accept':'application/json'})
              last=None
              for i in range(retries):
                  try:
                      with urllib.request.urlopen(req,timeout=60) as r:
                          return json.load(r)
                  except Exception as e:
                      last=e; time.sleep(2*(i+1))
              raise last

          def api(params):
              p={'format':'json','formatversion':'2',**params}
              return get(API,p)

          entity=api({'action':'wbgetentities','ids':TARGET,'props':'claims|labels|descriptions|aliases|sitelinks|info'})['entities'][TARGET]
          json.dump(entity,open(OUT+'/entity.json','w'),ensure_ascii=False,indent=2)

          # Native Wikidata constraint checker: authoritative machine signal for configured constraints.
          constraints=api({'action':'wbcheckconstraints','id':TARGET,'status':'violation|warning|suggestion|bad-parameters','uselang':'en'})
          json.dump(constraints,open(OUT+'/constraints.json','w'),ensure_ascii=False,indent=2)

          # Pull property labels and constraint definitions for core properties.
          props=api({'action':'wbgetentities','ids':'|'.join(CORE),'props':'claims|labels|descriptions','languages':'en'})['entities']
          json.dump(props,open(OUT+'/properties.json','w'),ensure_ascii=False,indent=2)

          def snak_value(s):
              if s.get('snaktype')!='value': return s.get('snaktype')
              dv=s.get('datavalue',{}).get('value')
              if isinstance(dv,dict):
                  if 'id' in dv: return dv['id']
                  if 'text' in dv: return {'text':dv.get('text'),'language':dv.get('language')}
                  if 'time' in dv: return dv.get('time')
                  if 'amount' in dv: return dv.get('amount')
                  if 'latitude' in dv: return {'lat':dv.get('latitude'),'lon':dv.get('longitude'),'precision':dv.get('precision')}
              return dv

          def norm_qualifiers(claim):
              out={}
              for p,snaks in sorted((claim.get('qualifiers') or {}).items()):
                  out[p]=[snak_value(s) for s in snaks]
              return out

          def refs(claim):
              arr=[]
              for r in claim.get('references') or []:
                  d={}
                  for p,snaks in sorted((r.get('snaks') or {}).items()):
                      d[p]=[snak_value(s) for s in snaks]
                  arr.append(d)
              return arr

          # Collect all Q-ids in main values/qualifiers/references for missing-target detection and labels.
          qids=set()
          rows=[]
          for p in CORE:
              for c in entity.get('claims',{}).get(p,[]):
                  mv=snak_value(c['mainsnak'])
                  if isinstance(mv,str) and mv.startswith('Q'): qids.add(mv)
                  qs=norm_qualifiers(c)
                  for vals in qs.values():
                      for v in vals:
                          if isinstance(v,str) and v.startswith('Q'): qids.add(v)
                  rr=refs(c)
                  for ref in rr:
                      for vals in ref.values():
                          for v in vals:
                              if isinstance(v,str) and v.startswith('Q'): qids.add(v)
                  rows.append({'property':p,'guid':c.get('id'),'rank':c.get('rank'),'snaktype':c['mainsnak'].get('snaktype'),'value':mv,'qualifiers':qs,'references':rr,'reference_count':len(rr)})

          # explicitly test deleted clinic item and all value targets.
          qids.add('Q140288589')
          labels={}
          missing=[]
          qlist=sorted(qids)
          for i in range(0,len(qlist),50):
              block=api({'action':'wbgetentities','ids':'|'.join(qlist[i:i+50]),'props':'labels|info','languages':'en|fa'})['entities']
              for q,v in block.items():
                  if v.get('missing') is True:
                      missing.append(q); labels[q]='[MISSING]'
                  else:
                      labs=v.get('labels',{})
                      labels[q]=(labs.get('en') or labs.get('fa') or {}).get('value',q)
          json.dump({'labels':labels,'missing':missing},open(OUT+'/targets.json','w'),ensure_ascii=False,indent=2)

          # Parse native constraint results by GUID where possible.
          c_by_guid=collections.defaultdict(list)
          def walk(x):
              if isinstance(x,dict):
                  claims=x.get('claims')
                  status=x.get('status')
                  msg=x.get('message') or x.get('message-html')
                  if isinstance(claims,list) and status:
                      for g in claims:
                          if isinstance(g,str): c_by_guid[g].append({'status':status,'message':msg,'constraint':x.get('constraint')})
                  for v in x.values(): walk(v)
              elif isinstance(x,list):
                  for v in x: walk(v)
          walk(constraints)

          # Exact duplicate detector within Batch-1 properties.
          sigmap=collections.defaultdict(list)
          for r in rows:
              sig=json.dumps([r['property'],r['snaktype'],r['value'],r['qualifiers']],sort_keys=True,ensure_ascii=False)
              sigmap[sig].append(r['guid'])
          duplicate_guids={g for gs in sigmap.values() if len(gs)>1 for g in gs}

          # Clinic anonymous-node coherence: compare stable identifiers across P937/P1830/P121.
          clinic=[]
          stable={'P2671','P3749','P11693','P13096'}
          for r in rows:
              if r['property'] not in {'P937','P1830','P121'} or r['snaktype']!='somevalue': continue
              ids={p:vals for p,vals in r['qualifiers'].items() if p in CLINIC_IDS}
              stable_set={(p,json.dumps(v,sort_keys=True,ensure_ascii=False)) for p,vals in ids.items() if p in stable for v in vals}
              clinic.append({'property':r['property'],'guid':r['guid'],'qualifiers':ids,'stable_signature':sorted([list(x) for x in stable_set])})
          pairwise=[]
          for i,a in enumerate(clinic):
              A={tuple(x) for x in a['stable_signature']}
              for b in clinic[i+1:]:
                  B={tuple(x) for x in b['stable_signature']}
                  inter=A&B; union=A|B
                  pairwise.append({'a':a['property'],'a_guid':a['guid'],'b':b['property'],'b_guid':b['guid'],'shared_stable_ids':len(inter),'jaccard':(len(inter)/len(union) if union else None),'identical_nonempty':bool(A) and A==B})
          clinic_report={'anonymous_clinic_statements':clinic,'pairwise':pairwise,'deleted_clinic_item_missing':'Q140288589' in missing}
          json.dump(clinic_report,open(OUT+'/clinic.json','w'),ensure_ascii=False,indent=2)

          # WDQS inbound graph (lag is recorded; API remains source of truth for outbound state).
          sparql='''SELECT ?s ?sLabel ?p ?pLabel WHERE { ?s ?direct wd:Q140287622 . ?p wikibase:directClaim ?direct . SERVICE wikibase:label { bd:serviceParam wikibase:language "en,fa". } } ORDER BY ?p ?s'''
          try:
              inbound=get(WDQS,{'query':sparql,'format':'json'})
          except Exception as e:
              inbound={'error':repr(e)}
          json.dump(inbound,open(OUT+'/inbound.json','w'),ensure_ascii=False,indent=2)

          # Rule engine. It does not invent edits: it classifies evidence and only allows explicit high-confidence conditions.
          def prop_label(p):
              v=props.get(p,{})
              return (v.get('labels',{}).get('en') or {}).get('value',p)

          for r in rows:
              r['property_label']=prop_label(r['property'])
              r['value_label']=labels.get(r['value']) if isinstance(r['value'],str) and r['value'].startswith('Q') else None
              r['constraint_results']=c_by_guid.get(r['guid'],[])
              r['duplicate_exact']=r['guid'] in duplicate_guids
              r['target_missing']=isinstance(r['value'],str) and r['value'] in missing
              hard=[x for x in r['constraint_results'] if x.get('status') in {'violation','warning','bad-parameters'}]
              # baseline classification
              status='KEEP'
              reasons=[]
              if r['duplicate_exact']:
                  status='REVIEW_DUPLICATE'; reasons.append('exact duplicate signature')
              if r['target_missing']:
                  status='FIX_HIGH'; reasons.append('main value target is missing/deleted')
              if hard:
                  status='REVIEW_CONSTRAINT'; reasons.append('native Wikidata constraint checker reported '+','.join(sorted({x.get('status') for x in hard})))
              # Core semantic invariants
              if r['property']=='P31' and r['value']=='Q5': reasons.append('core human identity')
              if r['property']=='P937' and r['snaktype']=='somevalue': reasons.append('anonymous clinic work-location relation')
              if r['property']=='P1830' and r['snaktype']=='somevalue': reasons.append('anonymous clinic ownership relation')
              if r['property']=='P121' and r['snaktype']=='somevalue': reasons.append('anonymous clinic operation relation')
              if r['property']=='P10611': reasons.append('medical-license certification relation; preserve unless source/constraint conflict')
              r['machine_status']=status; r['machine_reasons']=reasons

          json.dump(rows,open(OUT+'/matrix.json','w'),ensure_ascii=False,indent=2)
          with open(OUT+'/matrix.tsv','w',newline='') as f:
              w=csv.writer(f,delimiter='\t')
              w.writerow(['property','property_label','guid','rank','snaktype','value','value_label','reference_count','constraint_statuses','duplicate_exact','target_missing','machine_status','machine_reasons'])
              for r in rows:
                  w.writerow([r['property'],r['property_label'],r['guid'],r['rank'],r['snaktype'],json.dumps(r['value'],ensure_ascii=False),r['value_label'] or '',r['reference_count'],','.join(x.get('status','') for x in r['constraint_results']),r['duplicate_exact'],r['target_missing'],r['machine_status'],'; '.join(r['machine_reasons'])])

          summary={
              'entity':TARGET,'lastrevid':entity.get('lastrevid'),'modified':entity.get('modified'),
              'core_statement_count':len(rows),'exact_duplicate_guid_count':len(duplicate_guids),
              'missing_targets':missing,'native_constraint_results_total':sum(len(v) for v in c_by_guid.values()),
              'machine_status_counts':dict(collections.Counter(r['machine_status'] for r in rows)),
              'clinic':clinic_report,
              'sha256_entity_json':hashlib.sha256(open(OUT+'/entity.json','rb').read()).hexdigest()
          }
          json.dump(summary,open(OUT+'/summary.json','w'),ensure_ascii=False,indent=2)
          print(json.dumps(summary,ensure_ascii=False,indent=2))
          print('\n=== CORE MATRIX ===')
          for r in rows:
              print(f"{r['property']}\t{r['guid']}\t{r['rank']}\t{r['snaktype']}\t{r['value']}\trefs={r['reference_count']}\tconstraints={[x.get('status') for x in r['constraint_results']]}\t{r['machine_status']}")
          PY
      - name: Upload deterministic audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: wikidata-batch1-audit
          path: /tmp/batch1/*
          retention-days: 7
          if-no-files-found: error

name: Deploy Cloudflare Pages production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: true

env:
  CLOUDFLARE_ACCOUNT_ID: 884d1d90bd1fb6ecca14992c6c60d677
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  ZONE_NAME: ghezelbaash.ir
  CF_PROJECT: doctor-ghezelbaash
  PRODUCTION_BRANCH: main
  CANONICAL_HOST: www.ghezelbaash.ir

jobs:
  build-deploy-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact production source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Use Node 24.18.0
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm

      - name: Use Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install locked Node dependencies
        run: npm ci --ignore-scripts

      - name: Build and validate exact static DIST
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
        run: npm run build

      - name: Ensure direct-upload Pages project exists
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.error, urllib.request
          account=os.environ['CLOUDFLARE_ACCOUNT_ID']; token=os.environ['CLOUDFLARE_API_TOKEN']; project=os.environ['CF_PROJECT']
          base='https://api.cloudflare.com/client/v4'
          headers={'Authorization':f'Bearer {token}','Accept':'application/json','Content-Type':'application/json','User-Agent':'ghezelbaash-pages-deploy/1.1'}
          def call(method,path,body=None):
              data=None if body is None else json.dumps(body,separators=(',',':')).encode()
              req=urllib.request.Request(base+path,data=data,method=method,headers=headers)
              try:
                  with urllib.request.urlopen(req,timeout=45) as r:
                      raw=r.read().decode('utf-8','replace'); return r.status,json.loads(raw) if raw else {}
              except urllib.error.HTTPError as e:
                  raw=e.read().decode('utf-8','replace')
                  try: p=json.loads(raw) if raw else {}
                  except Exception: p={'raw':raw[:1000]}
                  return e.code,p
          path=f'/accounts/{account}/pages/projects/{project}'
          st,p=call('GET',path)
          if st==404:
              st,p=call('POST',f'/accounts/{account}/pages/projects',{'name':project,'production_branch':'main'})
              if st not in (200,201) or p.get('success') is not True:
                  raise SystemExit(f'Pages project create failed HTTP {st}: {p}')
              print('PAGES_PROJECT_CREATED')
          elif st==200 and p.get('success') is True:
              print('PAGES_PROJECT_ALREADY_EXISTS')
          else:
              raise SystemExit(f'Pages project lookup failed HTTP {st}: {p}')
          PY

      - name: Deploy DIST to production
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.120.0 pages deploy dist --project-name="$CF_PROJECT" --branch="$PRODUCTION_BRANCH" --commit-dirty=true

      - name: Ensure canonical custom domain is attached
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, time, urllib.error, urllib.request
          account=os.environ['CLOUDFLARE_ACCOUNT_ID']; token=os.environ['CLOUDFLARE_API_TOKEN']; project=os.environ['CF_PROJECT']; host=os.environ['CANONICAL_HOST']
          base='https://api.cloudflare.com/client/v4'; headers={'Authorization':f'Bearer {token}','Accept':'application/json','Content-Type':'application/json','User-Agent':'ghezelbaash-pages-domain/1.1'}
          def call(method,path,body=None):
              data=None if body is None else json.dumps(body,separators=(',',':')).encode()
              req=urllib.request.Request(base+path,data=data,method=method,headers=headers)
              try:
                  with urllib.request.urlopen(req,timeout=45) as r:
                      raw=r.read().decode('utf-8','replace'); return r.status,json.loads(raw) if raw else {}
              except urllib.error.HTTPError as e:
                  raw=e.read().decode('utf-8','replace')
                  try: p=json.loads(raw) if raw else {}
                  except Exception: p={'raw':raw[:1200]}
                  return e.code,p
          list_path=f'/accounts/{account}/pages/projects/{project}/domains'
          st,p=call('GET',list_path)
          if st!=200 or p.get('success') is not True: raise SystemExit(f'Domain list failed HTTP {st}: {p}')
          rows=p.get('result') or []
          if not any(x.get('name')==host for x in rows):
              st,p=call('POST',list_path,{'name':host})
              if st not in (200,201) or p.get('success') is not True: raise SystemExit(f'Attach domain failed HTTP {st}: {p}')
              print('CUSTOM_DOMAIN_ATTACHED')
          else:
              print('CUSTOM_DOMAIN_ALREADY_ATTACHED')
          active=False
          for i in range(36):
              st,p=call('GET',list_path)
              rows=(p.get('result') or []) if st==200 and p.get('success') is True else []
              row=next((x for x in rows if x.get('name')==host),{})
              status=row.get('status')
              print(f'CUSTOM_DOMAIN_STATUS attempt={i+1} status={status}')
              if status=='active':
                  active=True
                  break
              time.sleep(5)
          if not active: raise SystemExit('Canonical custom domain did not become active in time')
          PY

      - name: Purge canonical hostname after successful deploy
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import datetime as dt, json, os, urllib.error, urllib.parse, urllib.request
          account=os.environ['CLOUDFLARE_ACCOUNT_ID']; mgmt=os.environ['CLOUDFLARE_API_TOKEN']; zone_name=os.environ['ZONE_NAME']; host=os.environ['CANONICAL_HOST']
          base='https://api.cloudflare.com/client/v4'
          def call(token,method,path,body=None):
              data=None if body is None else json.dumps(body,separators=(',',':')).encode()
              req=urllib.request.Request(base+path,data=data,method=method,headers={'Authorization':f'Bearer {token}','Accept':'application/json','Content-Type':'application/json','User-Agent':'ghezelbaash-postdeploy-purge/1.0'})
              try:
                  with urllib.request.urlopen(req,timeout=45) as r:
                      raw=r.read().decode('utf-8','replace'); return r.status,json.loads(raw) if raw else {}
              except urllib.error.HTTPError as e:
                  raw=e.read().decode('utf-8','replace')
                  try: p=json.loads(raw) if raw else {}
                  except Exception: p={'raw':raw[:1200]}
                  return e.code,p
          q=urllib.parse.urlencode({'name':zone_name,'account.id':account,'per_page':50})
          st,z=call(mgmt,'GET','/zones?'+q)
          if st!=200 or z.get('success') is not True or not z.get('result'): raise SystemExit(f'Zone lookup failed HTTP {st}: {z}')
          zid=z['result'][0]['id']
          st,pg=call(mgmt,'GET',f'/accounts/{account}/tokens/permission_groups?scope=com.cloudflare.api.account.zone')
          if st!=200 or pg.get('success') is not True: raise SystemExit(f'Permission-group lookup failed HTTP {st}: {pg}')
          groups=[{'id':g['id']} for g in (pg.get('result') or []) if 'com.cloudflare.api.account.zone' in (g.get('scopes') or [])]
          expires=(dt.datetime.now(dt.timezone.utc)+dt.timedelta(hours=1)).replace(microsecond=0).isoformat().replace('+00:00','Z')
          body={'name':'Temporary Ghezelbaash Post-Deploy Purger','expires_on':expires,'policies':[{'effect':'allow','resources':{f'com.cloudflare.api.account.zone.{zid}':'*'},'permission_groups':groups}]}
          st,t=call(mgmt,'POST',f'/accounts/{account}/tokens',body)
          if st not in (200,201) or t.get('success') is not True: raise SystemExit(f'Temporary zone token failed HTTP {st}: {t}')
          tr=t.get('result') or {}; token=tr.get('value'); token_id=tr.get('id')
          try:
              st,p=call(token,'POST',f'/zones/{zid}/purge_cache',{'hosts':[host]})
              if st not in (200,201) or p.get('success') is not True: raise SystemExit(f'Hostname purge failed HTTP {st}: {p}')
              print('CANONICAL_HOST_CACHE_PURGED',host)
          finally:
              st,p=call(mgmt,'DELETE',f'/accounts/{account}/tokens/{token_id}')
              print('TEMP_PURGE_TOKEN_REVOKED',st,p.get('success'))
          PY

      - name: Verify canonical, redirects, machine endpoints, real 404, and edge cache
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, time, urllib.error, urllib.request
          host=os.environ['CANONICAL_HOST']; project=os.environ['CF_PROJECT']

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          no_redirect=urllib.request.build_opener(NoRedirect)

          def fetch(url, follow=True):
              req=urllib.request.Request(url,headers={'User-Agent':'ghezelbaash-production-verifier/1.1','Accept':'*/*'})
              opener=urllib.request.urlopen if follow else no_redirect.open
              try:
                  with opener(req,timeout=30) as r: return r.status,dict(r.headers),r.geturl(),r.read(4096)
              except urllib.error.HTTPError as e: return e.code,dict(e.headers),e.geturl(),e.read(4096)

          root=f'https://{host}/'
          for attempt in range(36):
              st,_,_,_=fetch(root)
              if st==200: break
              time.sleep(5)
          else:
              raise SystemExit('Canonical root did not become HTTP 200 in time')

          tests=[
              (root,200),
              (f'https://{host}/robots.txt',200),
              (f'https://{host}/sitemap.xml',200),
              (f'https://{host}/graph.jsonld',200),
              (f'https://{host}/llms.txt',200),
              (f'https://{host}/this-path-must-be-a-real-404-7f3d9a',404),
          ]
          for url,want in tests:
              st,h,final,b=fetch(url)
              print('VERIFY',st,'requested=',url,'final=',final,'cf-cache-status=',h.get('CF-Cache-Status'),'x-robots-tag=',h.get('X-Robots-Tag'),'bytes_sample=',len(b))
              if st!=want: raise SystemExit(f'Unexpected HTTP {st} for {url}, expected {want}')

          redirect_tests=[
              (f'https://{project}.pages.dev/canonical-contract/path?q=1',f'https://{host}/canonical-contract/path?q=1'),
              (f'https://{os.environ["ZONE_NAME"]}/canonical-contract/path?q=1',f'https://{host}/canonical-contract/path?q=1'),
          ]
          for url,want_location in redirect_tests:
              st,h,_,_=fetch(url,follow=False)
              location=h.get('Location') or h.get('location')
              print('REDIRECT_VERIFY',st,url,'location=',location)
              if st!=301 or location!=want_location: raise SystemExit(f'Canonical redirect contract failed for {url}: HTTP {st}, Location={location}')

          # Warm and prove the canonical HTML and primary machine graph are edge-cache eligible.
          for url in (root,f'https://{host}/graph.jsonld'):
              st,h,_,_=fetch(url)
              if st!=200: raise SystemExit(f'Cache warm failed for {url}: HTTP {st}')
              time.sleep(2)
              st,h,_,_=fetch(url)
              cache=(h.get('CF-Cache-Status') or '').upper()
              age=h.get('Age')
              print('CACHE_VERIFY',url,'status=',st,'cf-cache-status=',cache,'age=',age)
              if st!=200 or cache not in {'HIT','REVALIDATED'}:
                  raise SystemExit(f'Expected a cached response for {url}; got HTTP {st}, CF-Cache-Status={cache}')
          PY

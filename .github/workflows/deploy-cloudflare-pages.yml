name: Deploy Cloudflare Pages production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: true

env:
  CLOUDFLARE_ACCOUNT_ID: 884d1d90bd1fb6ecca14992c6c60d677
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  ZONE_NAME: ghezelbaash.ir
  CF_PROJECT: doctor-ghezelbaash
  PRODUCTION_BRANCH: main
  CANONICAL_HOST: www.ghezelbaash.ir

jobs:
  build-deploy-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact production source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Use Node 24.18.0
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm

      - name: Use Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install locked Node dependencies
        run: npm ci --ignore-scripts

      - name: Build and validate exact static DIST
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
        run: npm run build

      - name: Ensure direct-upload Pages project exists
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.error, urllib.request
          account=os.environ['CLOUDFLARE_ACCOUNT_ID']; token=os.environ['CLOUDFLARE_API_TOKEN']; project=os.environ['CF_PROJECT']
          base='https://api.cloudflare.com/client/v4'
          headers={'Authorization':f'Bearer {token}','Accept':'application/json','Content-Type':'application/json','User-Agent':'ghezelbaash-pages-deploy/1.1'}
          def call(method,path,body=None):
              data=None if body is None else json.dumps(body,separators=(',',':')).encode()
              req=urllib.request.Request(base+path,data=data,method=method,headers=headers)
              try:
                  with urllib.request.urlopen(req,timeout=45) as r:
                      raw=r.read().decode('utf-8','replace'); return r.status,json.loads(raw) if raw else {}
              except urllib.error.HTTPError as e:
                  raw=e.read().decode('utf-8','replace')
                  try: p=json.loads(raw) if raw else {}
                  except Exception: p={'raw':raw[:1000]}
                  return e.code,p
          path=f'/accounts/{account}/pages/projects/{project}'
          st,p=call('GET',path)
          if st==404:
              st,p=call('POST',f'/accounts/{account}/pages/projects',{'name':project,'production_branch':'main'})
              if st not in (200,201) or p.get('success') is not True:
                  raise SystemExit(f'Pages project create failed HTTP {st}: {p}')
              print('PAGES_PROJECT_CREATED')
          elif st==200 and p.get('success') is True:
              print('PAGES_PROJECT_ALREADY_EXISTS')
          else:
              raise SystemExit(f'Pages project lookup failed HTTP {st}: {p}')
          PY

      - name: Deploy DIST to production
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.120.0 pages deploy dist --project-name="$CF_PROJECT" --branch="$PRODUCTION_BRANCH" --commit-dirty=true

      - name: Ensure canonical custom domain is attached
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, time, urllib.error, urllib.request
          account=os.environ['CLOUDFLARE_ACCOUNT_ID']; token=os.environ['CLOUDFLARE_API_TOKEN']; project=os.environ['CF_PROJECT']; host=os.environ['CANONICAL_HOST']
          base='https://api.cloudflare.com/client/v4'; headers={'Authorization':f'Bearer {token}','Accept':'application/json','Content-Type':'application/json','User-Agent':'ghezelbaash-pages-domain/1.1'}
          def call(method,path,body=None):
              data=None if body is None else json.dumps(body,separators=(',',':')).encode()
              req=urllib.request.Request(base+path,data=data,method=method,headers=headers)
              try:
                  with urllib.request.urlopen(req,timeout=45) as r:
                      raw=r.read().decode('utf-8','replace'); return r.status,json.loads(raw) if raw else {}
              except urllib.error.HTTPError as e:
                  raw=e.read().decode('utf-8','replace')
                  try: p=json.loads(raw) if raw else {}
                  except Exception: p={'raw':raw[:1200]}
                  return e.code,p
          list_path=f'/accounts/{account}/pages/projects/{project}/domains'
          st,p=call('GET',list_path)
          if st!=200 or p.get('success') is not True: raise SystemExit(f'Domain list failed HTTP {st}: {p}')
          rows=p.get('result') or []
          if not any(x.get('name')==host for x in rows):
              st,p=call('POST',list_path,{'name':host})
              if st not in (200,201) or p.get('success') is not True: raise SystemExit(f'Attach domain failed HTTP {st}: {p}')
              print('CUSTOM_DOMAIN_ATTACHED')
          else:
              print('CUSTOM_DOMAIN_ALREADY_ATTACHED')
          active=False
          for i in range(36):
              st,p=call('GET',list_path)
              rows=(p.get('result') or []) if st==200 and p.get('success') is True else []
              row=next((x for x in rows if x.get('name')==host),{})
              status=row.get('status')
              print(f'CUSTOM_DOMAIN_STATUS attempt={i+1} status={status}')
              if status=='active':
                  active=True
                  break
              time.sleep(5)
          if not active: raise SystemExit('Canonical custom domain did not become active in time')
          PY

      - name: Canonicalize stable and unique Pages hostnames
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, time, urllib.error, urllib.parse, urllib.request
          account=os.environ['CLOUDFLARE_ACCOUNT_ID']; token=os.environ['CLOUDFLARE_API_TOKEN']; project=os.environ['CF_PROJECT']; host=os.environ['CANONICAL_HOST']
          base='https://api.cloudflare.com/client/v4'
          headers={'Authorization':f'Bearer {token}','Accept':'application/json','Content-Type':'application/json','User-Agent':'ghezelbaash-pages-canonicalizer/1.0'}
          list_name='ghezelbaash_pages_dev_to_canonical'

          def call(method,path,body=None):
              data=None if body is None else json.dumps(body,separators=(',',':')).encode()
              req=urllib.request.Request(base+path,data=data,method=method,headers=headers)
              try:
                  with urllib.request.urlopen(req,timeout=45) as r:
                      raw=r.read().decode('utf-8','replace'); return r.status,json.loads(raw) if raw else {}
              except urllib.error.HTTPError as e:
                  raw=e.read().decode('utf-8','replace')
                  try: p=json.loads(raw) if raw else {}
                  except Exception: p={'raw':raw[:1600]}
                  return e.code,p

          def wait_op(payload):
              op=(payload.get('result') or {}).get('operation_id')
              if not op: return
              for i in range(30):
                  st,p=call('GET',f'/accounts/{account}/rules/lists/bulk_operations/{op}')
                  status=(p.get('result') or {}).get('status') if st==200 and p.get('success') is True else None
                  print('BULK_REDIRECT_OPERATION',i+1,status)
                  if status=='completed': return
                  if status=='failed': raise SystemExit(f'Bulk Redirect operation failed: {p}')
                  time.sleep(2)
              raise SystemExit('Bulk Redirect operation timed out')

          # Ensure the dedicated redirect list exists.
          st,p=call('GET',f'/accounts/{account}/rules/lists?per_page=100')
          if st!=200 or p.get('success') is not True: raise SystemExit(f'List enumeration failed HTTP {st}: {p}')
          row=next((x for x in (p.get('result') or []) if x.get('name')==list_name),None)
          if not row:
              st,p=call('POST',f'/accounts/{account}/rules/lists',{'name':list_name,'description':'Canonicalize Cloudflare Pages hostnames to www.ghezelbaash.ir','kind':'redirect'})
              if st not in (200,201) or p.get('success') is not True: raise SystemExit(f'Redirect list create failed HTTP {st}: {p}')
              row=p.get('result') or {}
          list_id=row.get('id')
          if not list_id: raise SystemExit('Redirect list id missing')

          # Collect existing project deployment URLs so old direct deployment URLs remain consolidated.
          st,p=call('GET',f'/accounts/{account}/rules/lists/{list_id}/items?per_page=100')
          existing=(p.get('result') or []) if st==200 and p.get('success') is True else []
          known_sources=set()
          for item in existing:
              r=item.get('redirect') or {}
              src=r.get('source_url')
              if src and src.endswith(f'.{project}.pages.dev/'):
                  known_sources.add(src)

          st,p=call('GET',f'/accounts/{account}/pages/projects/{project}')
          if st!=200 or p.get('success') is not True: raise SystemExit(f'Pages project lookup failed HTTP {st}: {p}')
          project_data=p.get('result') or {}
          current_url=((project_data.get('canonical_deployment') or {}).get('url') or (project_data.get('latest_deployment') or {}).get('url'))
          if not current_url: raise SystemExit('Cloudflare did not return the current Pages deployment URL')
          current_url=current_url.rstrip('/')+'/'
          known_sources.add(current_url)

          # Seed any other still-listed Cloudflare Pages deployments when the endpoint is available.
          st,p=call('GET',f'/accounts/{account}/pages/projects/{project}/deployments?'+urllib.parse.urlencode({'page':1,'per_page':100}))
          if st==200 and p.get('success') is True:
              for deployment in (p.get('result') or []):
                  url=deployment.get('url')
                  if url:
                      known_sources.add(url.rstrip('/')+'/')
          else:
              print('DEPLOYMENT_LIST_FALLBACK',st,p.get('errors'))

          stable_source=f'https://{project}.pages.dev/'
          canonical=f'https://{host}/'
          items=[{
              'redirect':{
                  'source_url':stable_source,
                  'target_url':canonical,
                  'status_code':301,
                  'include_subdomains':True,
                  'subpath_matching':True,
                  'preserve_query_string':True,
                  'preserve_path_suffix':True,
              },
              'comment':'Canonicalize the stable Cloudflare Pages project hostname to the canonical physician domain',
          }]
          for src in sorted(s for s in known_sources if s!=stable_source):
              items.append({
                  'redirect':{
                      'source_url':src,
                      'target_url':canonical,
                      'status_code':301,
                      'include_subdomains':False,
                      'subpath_matching':True,
                      'preserve_query_string':True,
                      'preserve_path_suffix':True,
                  },
                  'comment':'Canonicalize a unique Cloudflare Pages deployment hostname to the canonical physician domain',
              })

          st,p=call('PUT',f'/accounts/{account}/rules/lists/{list_id}/items',items)
          if st not in (200,201) or p.get('success') is not True: raise SystemExit(f'Redirect list update failed HTTP {st}: {p}')
          wait_op(p)

          # Ensure the account-level Bulk Redirect ruleset invokes this list.
          marker='Canonicalize doctor-ghezelbaash.pages.dev to www.ghezelbaash.ir'
          rule={
              'action':'redirect',
              'expression':'true',
              'description':marker,
              'enabled':True,
              'action_parameters':{'from_list':{'name':list_name,'key':'http.request.full_uri'}},
          }
          st,p=call('GET',f'/accounts/{account}/rulesets')
          if st!=200 or p.get('success') is not True: raise SystemExit(f'Account rulesets lookup failed HTTP {st}: {p}')
          ruleset=next((x for x in (p.get('result') or []) if x.get('kind')=='root' and x.get('phase')=='http_request_redirect'),None)
          if not ruleset:
              st,p=call('POST',f'/accounts/{account}/rulesets',{'name':'Bulk Redirects','description':'Account Bulk Redirect entry point','kind':'root','phase':'http_request_redirect','rules':[rule]})
              if st not in (200,201) or p.get('success') is not True: raise SystemExit(f'Account Bulk Redirect ruleset create failed HTTP {st}: {p}')
          else:
              rid=ruleset.get('id')
              st,p=call('GET',f'/accounts/{account}/rulesets/{rid}')
              current_rules=(p.get('result') or {}).get('rules') or [] if st==200 and p.get('success') is True else []
              if not any(r.get('description')==marker and r.get('enabled',True) for r in current_rules):
                  st,p=call('POST',f'/accounts/{account}/rulesets/{rid}/rules',rule)
                  if st not in (200,201) or p.get('success') is not True: raise SystemExit(f'Account Bulk Redirect rule create failed HTTP {st}: {p}')

          # Read back exact list state and prove both stable and current unique hostname redirect contracts.
          st,p=call('GET',f'/accounts/{account}/rules/lists/{list_id}/items?per_page=100')
          if st!=200 or p.get('success') is not True: raise SystemExit(f'Redirect list read-back failed HTTP {st}: {p}')
          redirects=[x.get('redirect') or {} for x in (p.get('result') or [])]
          print('PAGES_CANONICAL_REDIRECTS',json.dumps(redirects,ensure_ascii=False,sort_keys=True))
          base_rule=next((r for r in redirects if r.get('source_url')==stable_source),None)
          current_rule=next((r for r in redirects if r.get('source_url')==current_url),None)
          if not base_rule or base_rule.get('include_subdomains') is not True: raise SystemExit('Stable pages.dev redirect is incomplete')
          if not current_rule: raise SystemExit('Current unique Pages deployment redirect is missing')

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          opener=urllib.request.build_opener(NoRedirect)
          expected=f'https://{host}/canonical-contract/path?q=1'
          for src in (stable_source,current_url):
              url=src+'canonical-contract/path?q=1'
              success=False
              for attempt in range(12):
                  req=urllib.request.Request(url,headers={'User-Agent':'ghezelbaash-pages-canonical-verifier/1.0'})
                  try:
                      with opener.open(req,timeout=30) as resp:
                          code=resp.status; location=resp.headers.get('Location')
                  except urllib.error.HTTPError as e:
                      code=e.code; location=e.headers.get('Location')
                  print('PAGES_REDIRECT_VERIFY',attempt+1,code,url,'location=',location)
                  if code==301 and location==expected:
                      success=True
                      break
                  time.sleep(2)
              if not success: raise SystemExit(f'Pages canonical redirect contract failed for {url}')
          PY

      - name: Reconcile Cloudflare search, AI, headers, transport, and cache edge
        shell: bash
        run: |
          set -euo pipefail
          python scripts/configure-cloudflare-edge.py --apply --outcome edge-reconciliation.json

      - name: Verify canonical, redirects, machine endpoints, real 404, and edge cache
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import glob, json, os, time, urllib.error, urllib.request
          host=os.environ['CANONICAL_HOST']; project=os.environ['CF_PROJECT']
          with open('edge-reconciliation.json',encoding='utf-8') as f:
              edge=json.load(f)
          capabilities=edge.get('capabilities') or {}
          enforce_hsts=bool(capabilities.get('zoneSettings') or capabilities.get('hstsTransformRule'))
          enforce_404=bool(capabilities.get('notFoundTransformRule'))
          enforce_cache=bool(capabilities.get('cacheRule'))
          print('EDGE_CAPABILITY_READBACK',json.dumps(edge,sort_keys=True))

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          no_redirect=urllib.request.build_opener(NoRedirect)

          def normalized(headers):
              return {str(k).lower():v for k,v in headers.items()}

          def fetch(url, follow=True):
              req=urllib.request.Request(url,headers={'User-Agent':'ghezelbaash-production-verifier/1.1','Accept':'*/*'})
              opener=urllib.request.urlopen if follow else no_redirect.open
              try:
                  with opener(req,timeout=30) as r: return r.status,normalized(r.headers),r.geturl(),r.read(4096)
              except urllib.error.HTTPError as e: return e.code,normalized(e.headers),e.geturl(),e.read(4096)

          root=f'https://{host}/'
          for attempt in range(36):
              st,_,_,_=fetch(root)
              if st==200: break
              time.sleep(5)
          else:
              raise SystemExit('Canonical root did not become HTTP 200 in time')

          tests=[
              (root,200),
              (f'https://{host}/robots.txt',200),
              (f'https://{host}/sitemap.xml',200),
              (f'https://{host}/graph.jsonld',200),
              (f'https://{host}/llms.txt',200),
              (f'https://{host}/this-path-must-be-a-real-404-7f3d9a',404),
          ]
          observed={}
          for url,want in tests:
              st,h,final,b=fetch(url)
              observed[url]=(st,h,final,b)
              print('VERIFY',st,'requested=',url,'final=',final,'cf-cache-status=',h.get('cf-cache-status'),'x-robots-tag=',h.get('x-robots-tag'),'bytes_sample=',len(b))
              if st!=want: raise SystemExit(f'Unexpected HTTP {st} for {url}, expected {want}')

          root_headers=observed[root][1]
          hsts=root_headers.get('strict-transport-security') or ''
          if enforce_hsts and ('max-age=63072000' not in hsts or 'includeSubDomains' not in hsts or 'preload' not in hsts):
              raise SystemExit(f'Canonical HSTS contract drift: {hsts}')
          if not enforce_hsts:
              print('HSTS_SCOPE_GAP_LIVE_READBACK',hsts)
          missing_url=f'https://{host}/this-path-must-be-a-real-404-7f3d9a'
          missing_headers=observed[missing_url][1]
          if enforce_404 and 'noindex' not in (missing_headers.get('x-robots-tag') or '').lower():
              raise SystemExit(f'Real 404 noindex edge contract drift: {missing_headers.get("x-robots-tag")}')
          if missing_headers.get('cache-control')!='no-store':
              raise SystemExit('Real 404 no-store cache contract drift')
          if enforce_404 and (not missing_headers.get('content-security-policy') or missing_headers.get('content-language')!='fa-IR'):
              raise SystemExit('Real 404 cache/CSP edge contract drift')
          if not enforce_404:
              print('REAL_404_TRANSFORM_SCOPE_GAP',missing_headers.get('x-robots-tag'),missing_headers.get('content-security-policy'))

          redirect_tests=[
              (f'https://{project}.pages.dev/canonical-contract/path?q=1',f'https://{host}/canonical-contract/path?q=1'),
              (f'https://{os.environ["ZONE_NAME"]}/canonical-contract/path?q=1',f'https://{host}/canonical-contract/path?q=1'),
          ]
          for url,want_location in redirect_tests:
              st,h,_,_=fetch(url,follow=False)
              location=h.get('location')
              print('REDIRECT_VERIFY',st,url,'location=',location)
              if st!=301 or location!=want_location: raise SystemExit(f'Canonical redirect contract failed for {url}: HTTP {st}, Location={location}')

          # Warm and prove canonical HTML, machine graph, and fingerprint CSS are edge-cache eligible.
          css=glob.glob('dist/assets/site.*.css')
          if len(css)!=1: raise SystemExit(f'Expected one fingerprint stylesheet, found {len(css)}')
          css_url=f'https://{host}/assets/{os.path.basename(css[0])}'
          for url in (root,f'https://{host}/graph.jsonld',css_url):
              st,h,_,_=fetch(url)
              if st!=200: raise SystemExit(f'Cache warm failed for {url}: HTTP {st}')
              time.sleep(2)
              st,h,_,_=fetch(url)
              cache=(h.get('cf-cache-status') or '').upper()
              age=h.get('age')
              print('CACHE_VERIFY',url,'status=',st,'cf-cache-status=',cache,'age=',age)
              if st!=200 or (enforce_cache and cache not in {'HIT','REVALIDATED'}):
                  raise SystemExit(f'Expected a cached response for {url}; got HTTP {st}, CF-Cache-Status={cache}')
              if not enforce_cache:
                  print('CACHE_RULE_SCOPE_GAP',url,cache)
          PY

      - name: Verify full Google and AI crawler production contract
        env:
          EDGE_RECONCILIATION_OUTCOME: edge-reconciliation.json
        run: npm run verify:production

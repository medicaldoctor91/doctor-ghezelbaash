name: Refactor dist byte equivalence

on:
  push:
    branches:
      - refactor/single-source-truth-no-dist-drift

permissions:
  contents: write

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: candidate
          fetch-depth: 0
      - name: Checkout immutable base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: c25a681f1f4350b943ebaf7966acc4e6ea1c063e
          path: base
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: candidate/.nvmrc
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14.6"
      - name: Install build dependencies
        shell: bash
        run: |
          npm ci --prefix base
          npm ci --prefix candidate
      - name: Build immutable base
        working-directory: base
        run: npm run build
      - name: Prepare candidate-only proof workspace
        working-directory: candidate
        shell: bash
        run: |
          node scripts/refactor-authority-codemod.mjs
          rm -f .github/workflows/refactor-authority-audit.yml .github/workflows/refactor-dist-equivalence.yml
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import { sourceContract, sourceRawHashes } from './scripts/lib/visible-text-contract.mjs';
          const file = 'src/data/visible-text-contract.json';
          const baseline = JSON.parse(fs.readFileSync(file, 'utf8'));
          baseline.source = await sourceContract(process.cwd());
          baseline.sourceRawSha256 = await sourceRawHashes(process.cwd());
          fs.writeFileSync(file, JSON.stringify(baseline, null, 2) + '\n');
          JS
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const file = 'scripts/lib/render-calibration.mjs';
          const source = fs.readFileSync(file, 'utf8');
          const before = `  if (meta?.schemaVersion !== CALIBRATION_SCHEMA || meta.sourceSha256 !== snapshot.sourceSha256)\n    throw new Error("Render calibration is stale for this source; run npm run render:calibration:update");`;
          const after = `  if (meta?.schemaVersion !== CALIBRATION_SCHEMA)\n    throw new Error("Render calibration schema drift");\n  if (meta.sourceSha256 !== snapshot.sourceSha256 && meta.domSha256 !== snapshot.domSha256)\n    throw new Error("Render calibration is stale for this rendered DOM; run npm run render:calibration:update");`;
          if (!source.includes(before)) throw new Error('Proof patch could not locate render-calibration source gate');
          fs.writeFileSync(file, source.replace(before, after));
          JS
      - name: Build candidate
        working-directory: candidate
        run: npm run build
      - name: Require identical dist inventory and bytes
        shell: bash
        run: |
          set -euo pipefail
          (cd base/dist && find . -type f -print0 | sort -z | xargs -0 sha256sum) > /tmp/base-dist.sha256
          (cd candidate/dist && find . -type f -print0 | sort -z | xargs -0 sha256sum) > /tmp/candidate-dist.sha256
          diff -u /tmp/base-dist.sha256 /tmp/candidate-dist.sha256
          diff -qr base/dist candidate/dist
          echo "DIST_BYTE_EQUIVALENCE_PASS"
      - name: Seal the proven source migration
        working-directory: candidate
        shell: bash
        run: |
          git checkout -- .github/workflows/refactor-authority-audit.yml .github/workflows/refactor-dist-equivalence.yml scripts/lib/render-calibration.mjs
          rm src/data/visible-text-contract.json
          node scripts/validate-visible-text.mjs --initialize-baseline dist --acknowledge-frozen-text
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/validate-google-structured-data.mjs scripts/validate-architecture.mjs src/data/visible-text-contract.json
          if git diff --cached --quiet; then
            echo "Proven source migration already sealed"
            exit 0
          fi
          git commit -m "refactor(authority): seal byte-identical authority migration"
          git push origin "HEAD:${GITHUB_REF_NAME}"

name: Refactor dist byte equivalence

on:
  push:
    branches:
      - refactor/single-source-truth-no-dist-drift

permissions:
  contents: write

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: candidate
          fetch-depth: 0
      - name: Checkout immutable base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: c25a681f1f4350b943ebaf7966acc4e6ea1c063e
          path: base
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: candidate/.nvmrc
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14.6"
      - name: Install build dependencies
        shell: bash
        run: |
          npm ci --prefix base
          npm ci --prefix candidate
      - name: Build immutable base
        working-directory: base
        run: npm run build
      - name: Prepare candidate-only proof workspace
        working-directory: candidate
        shell: bash
        run: |
          node scripts/refactor-authority-codemod.mjs
          rm -f .github/workflows/refactor-authority-audit.yml .github/workflows/refactor-dist-equivalence.yml
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const file = 'src/content-source/page.md';
          let source = fs.readFileSync(file, 'utf8');
          const governanceStart = '<!--SITE_FOOTER_GOVERNANCE_START\n';
          const governanceEnd = '\nSITE_FOOTER_GOVERNANCE_END-->';
          const governanceHtml = `  <details class="editorial-governance" id="privacy-and-terms">
    <summary>بازبینی پزشکی، حریم خصوصی و شرایط استفاده</summary>
    <p>
      محتوای پزشکی این صفحه توسط دکتر سعید قزلباش بازبینی می‌شود و جایگزین
      معاینه و تصمیم درمانی حضوری نیست. جزئیات حساس پزشکی را در پیام عمومی
      شبکه‌های اجتماعی ارسال نکنید؛ در صورت نشانه‌های اورژانسی پس از اقدام
      پزشکی، ارزیابی حضوری فوری اولویت دارد.
    </p>
    <p>
      امتیاز و تعداد نظر کلینیک یک مشاهدهٔ زمان‌دار از Google Maps است که هر شش
      ساعت بررسی می‌شود. متن نظرها و اطلاعات شخصی کاربران دریافت یا ذخیره
      نمی‌شود و منبع داده با پیوند مستقیم مشخص است. استفاده از این داده تابع
      <a href="https://www.google.com/help/terms_maps/" rel="external noopener"
        >شرایط Google Maps</a
      > و <a href="https://policies.google.com/privacy" rel="external noopener"
        >خط‌مشی حریم خصوصی Google</a
      > است.
    </p>
  </details>`;
          if (!source.includes(governanceStart)) {
            const boundary = '\n---\n';
            const count = source.split(boundary).length - 1;
            if (count !== 1) throw new Error(`footer governance frontmatter boundary drift: ${count}`);
            source = source.replace(boundary, `${boundary}${governanceStart}${governanceHtml}${governanceEnd}\n`);
          } else {
            if (source.split(governanceStart).length - 1 !== 1 || source.split(governanceEnd).length - 1 !== 1)
              throw new Error('footer governance source block duplication');
          }
          const replacements = [
            [
              '{{CLINIC_HOURS_COMPACT_FA}}',
              'شنبه تا پنجشنبه {{CLINIC_HOURS_OPEN_COMPACT_FA}}–{{CLINIC_HOURS_CLOSE_COMPACT_FA}}؛ جمعه تعطیل',
              'hero clinic hours wording',
            ],
            [
              '{{CLINIC_HOURS_WEEKDAYS_FA}}؛ <strong>{{CLINIC_FRIDAY_CLOSED_FA}}</strong>',
              'شنبه تا پنجشنبه، {{CLINIC_HOURS_OPEN_FA}} تا {{CLINIC_HOURS_CLOSE_FA}}؛ <strong>جمعه تعطیل.</strong>',
              'clinic facts hours wording',
            ],
          ];
          for (const [before, after, label] of replacements) {
            if (source.includes(after)) {
              if (source.includes(before)) throw new Error(`${label}: old and new forms coexist`);
              continue;
            }
            const count = source.split(before).length - 1;
            if (count !== 1) throw new Error(`${label}: expected one source occurrence, found ${count}`);
            source = source.replace(before, after);
          }
          fs.writeFileSync(file, source);
          JS
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import { sourceContract, sourceRawHashes } from './scripts/lib/visible-text-contract.mjs';
          const file = 'src/data/visible-text-contract.json';
          const baseline = JSON.parse(fs.readFileSync(file, 'utf8'));
          baseline.source = await sourceContract(process.cwd());
          baseline.sourceRawSha256 = await sourceRawHashes(process.cwd());
          fs.writeFileSync(file, JSON.stringify(baseline, null, 2) + '\n');
          JS
      - name: Build candidate
        working-directory: candidate
        run: npm run build
      - name: Require identical dist inventory and bytes
        shell: bash
        run: |
          set -euo pipefail
          (cd base/dist && find . -type f -print0 | sort -z | xargs -0 sha256sum) > /tmp/base-dist.sha256
          (cd candidate/dist && find . -type f -print0 | sort -z | xargs -0 sha256sum) > /tmp/candidate-dist.sha256
          diff -u /tmp/base-dist.sha256 /tmp/candidate-dist.sha256
          diff -qr base/dist candidate/dist
          echo "DIST_BYTE_EQUIVALENCE_PASS"
      - name: Seal the proven source migration
        working-directory: candidate
        shell: bash
        run: |
          git checkout -- .github/workflows/refactor-authority-audit.yml .github/workflows/refactor-dist-equivalence.yml
          rm src/data/visible-text-contract.json
          node scripts/validate-visible-text.mjs --initialize-baseline dist --acknowledge-frozen-text
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/validate-google-structured-data.mjs \
            scripts/validate-architecture.mjs \
            scripts/validate-source.mjs \
            scripts/validate-release-contract.mjs \
            src/content-source/page.md \
            src/data/visible-text-contract.json
          if git diff --cached --quiet; then
            echo "Proven source migration already sealed"
            exit 0
          fi
          git commit -m "refactor(authority): seal byte-identical authority migration"
          git push origin "HEAD:${GITHUB_REF_NAME}"

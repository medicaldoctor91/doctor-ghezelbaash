name: Refactor source finalization

on:
  push:
    branches:
      - refactor/single-source-truth-no-dist-drift

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14.6"
      - name: Install exact dependencies
        run: npm ci
      - name: Materialize final source ownership
        shell: bash
        run: |
          set -euo pipefail
          node scripts/refactor-authority-codemod.mjs
          node scripts/materialize-page-owned-content.mjs
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import { sourceContract, sourceRawHashes } from './scripts/lib/visible-text-contract.mjs';
          const file = 'src/data/visible-text-contract.json';
          const baseline = JSON.parse(fs.readFileSync(file, 'utf8'));
          baseline.source = await sourceContract(process.cwd());
          baseline.sourceRawSha256 = await sourceRawHashes(process.cwd());
          fs.writeFileSync(file, JSON.stringify(baseline, null, 2) + '\n');
          JS
          rm -f \
            .github/workflows/refactor-authority-audit.yml \
            .github/workflows/refactor-dist-equivalence.yml \
            scripts/refactor-authority-codemod.mjs \
            scripts/materialize-page-owned-content.mjs
      - name: Re-measure render calibration from final source
        run: |
          npx playwright install --with-deps chromium
          npm run render:calibration:update
      - name: Build final candidate
        run: npm run build
      - name: Commit final source migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source finalization changes to commit"
            exit 0
          fi
          git commit -m "refactor(authority): finalize canonical source ownership"
          git push origin "HEAD:${GITHUB_REF_NAME}"

name: One-shot declarative RRT repair

on:
  push:
    branches:
      - optimize/rrt-optional-fields-2026-08-30

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[rrt-declarative-repair]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: optimize/rrt-optional-fields-2026-08-30
          fetch-depth: 1
          persist-credentials: true
      - name: Apply declarative semantic repair
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          git checkout origin/main -- scripts/lib/projections/graph-projections.mjs
          node <<'NODE'
          const fs=require('node:fs');
          const physician='https://www.ghezelbaash.ir/#saeed-ghezelbash';
          const kgPath='src/data/semantic/knowledge-graph.jsonld';
          const kg=JSON.parse(fs.readFileSync(kgPath,'utf8'));
          const person=kg['@graph'].find(n=>n?.['@id']===physician);
          if(!person)throw new Error('Physician node missing');
          person.priceRange='$$$$';
          fs.writeFileSync(kgPath,JSON.stringify(kg,null,2)+'\n');

          const headPath='src/data/semantic/head-profile.json';
          const head=JSON.parse(fs.readFileSync(headPath,'utf8'));
          const spec=head.nodes?.[physician];
          if(!spec)throw new Error('Physician Head profile missing');
          if(!spec.include.includes('priceRange'))spec.include.splice(spec.include.indexOf('url')+1,0,'priceRange');
          spec.valueAllow??={};
          spec.valueAllow.name=['دکتر سعید قزلباش'];
          fs.writeFileSync(headPath,JSON.stringify(head,null,2)+'\n');

          const supportPath='src/data/semantic/support-profile.json';
          const support=JSON.parse(fs.readFileSync(supportPath,'utf8'));
          const imageInclude=support.typeProfiles?.ImageObject?.include;
          if(!Array.isArray(imageInclude))throw new Error('ImageObject support profile missing');
          for(const key of ['url','sameAs'])if(!imageInclude.includes(key))imageInclude.splice(imageInclude.indexOf('contentUrl')+1,0,key);
          fs.writeFileSync(supportPath,JSON.stringify(support,null,2)+'\n');
          NODE
          git config user.name 'OpenAI'
          git config user.email 'noreply@openai.com'
          git add src/data/semantic/knowledge-graph.jsonld src/data/semantic/head-profile.json src/data/semantic/support-profile.json scripts/lib/projections/graph-projections.mjs
          git diff --cached --check
          git commit -m 'fix: declare RRT enrichment facts [rrt-declarative-repair]'
          git push origin HEAD:optimize/rrt-optional-fields-2026-08-30

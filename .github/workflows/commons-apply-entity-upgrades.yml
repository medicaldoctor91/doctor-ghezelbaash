name: Apply validated Wikimedia entity upgrades
on:
  push:
    branches: [main]
    paths:
      - scripts/commons_apply_entity_upgrades.py
      - .github/workflows/commons-apply-entity-upgrades.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: commons-entity-upgrades
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      COMMONS_USERNAME: ${{ secrets.WIKIVERSITY_USERNAME }}
      COMMONS_BOT_PASSWORD: ${{ secrets.WIKIVERSITY_BOT_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Validate credentials exist
        run: test -n "$COMMONS_USERNAME" && test -n "$COMMONS_BOT_PASSWORD"
      - run: python -m pip install --disable-pip-version-check --no-input requests==2.32.5
      - run: python scripts/commons_apply_entity_upgrades.py

name: Run final exact V1 publisher

on:
  pull_request:
    branches: [main]
    paths:
      - '.run-v1-publisher'

permissions:
  contents: write

jobs:
  publish:
    if: github.head_ref == 'run-v1-publisher-final-2026-08-08'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Execute exact hash-gated publisher
        shell: bash
        run: |
          set -euo pipefail
          STAGING='publish-v1-exact-2026-08-08'
          git fetch origin "$STAGING:refs/remotes/origin/$STAGING"
          git show "origin/$STAGING:.publish-v1/run-publisher.sh" > /tmp/run-publisher.sh
          chmod +x /tmp/run-publisher.sh
          /tmp/run-publisher.sh

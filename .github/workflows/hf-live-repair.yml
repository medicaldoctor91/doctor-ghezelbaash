name: Hugging Face live Viewer repair

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/hf-live-repair.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      HF_REPO: doctor-ghezelbaash/dr-saeid-ghezelbaash-entity-data
    steps:
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install Hub client
        run: python -m pip install --disable-pip-version-check --quiet 'huggingface_hub>=0.34,<2' 'PyYAML>=6,<7'
      - name: Repair live dataset metadata and Viewer configs
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN || secrets.HUGGINGFACE_TOKEN || secrets.HUGGING_FACE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${HF_TOKEN:-}"
          echo "::add-mask::$HF_TOKEN"
          python - <<'PY'
          import os,re,tempfile
          from pathlib import Path
          import yaml
          from huggingface_hub import HfApi,hf_hub_download

          repo=os.environ['HF_REPO']; token=os.environ['HF_TOKEN']; api=HfApi(token=token)
          api.update_repo_settings(repo_id=repo,repo_type='dataset',private=False,gated=False)
          p=hf_hub_download(repo_id=repo,repo_type='dataset',filename='README.md',token=token,force_download=True)
          text=Path(p).read_text(encoding='utf-8')
          m=re.match(r'^---\s*\n(.*?)\n---\s*\n?',text,re.S)
          if not m: raise SystemExit('No valid dataset-card front matter')
          meta=yaml.safe_load(m.group(1)) or {}; body=text[m.end():]
          meta.pop('viewer',None)
          meta['pretty_name']='Dr. Saeed Ghezelbash Public Knowledge Graph'
          meta['language']=['fa','en','ar','ckb']; meta['license']='cc-by-4.0'
          meta['multilinguality']=['multilingual']; meta['source_datasets']=['original']
          meta['task_categories']=['question-answering']; meta['size_categories']=['1K<n<10K']
          required=[
            'saeed-ghezelbash','dr-saeed-ghezelbash','physician-entity','medical-knowledge-graph',
            'knowledge-graph','knowledge-base','entity-resolution','json-ld','rdf','schema-org','wikidata',
            'fair-data','question-answering','rag','ai-retrieval','aesthetic-medicine','healthcare','medical',
            'physician','kermanshah','iran','croissant','dcat','datasets','pandas','mlcroissant','text','tabular'
          ]
          meta['tags']=list(dict.fromkeys(list(meta.get('tags') or [])+required))
          meta['configs']=[
            {'config_name':'entity_facts','default':True,'data_files':[{'split':'train','path':'entity-facts.csv'}]},
            {'config_name':'positioning_instructions','data_files':[{'split':'train','path':'enrichment/instruction_examples_fa_market_positioning.csv'}]},
          ]
          marker='<!-- hf-viewer-guard: enabled; public; ungated; full-viewer; default=entity_facts; positioning=csv-projection -->'
          body=re.sub(r'<!-- hf-viewer-guard:.*?-->',marker,body,count=1) if re.search(r'<!-- hf-viewer-guard:.*?-->',body) else marker+'\n\n'+body.lstrip()
          body=body.replace('`entity-facts.csv` and the positioning JSONL are separately declared Dataset Viewer configurations.','`entity-facts.csv` is the default factual Dataset Viewer configuration; the deterministic positioning CSV projection is the secondary Viewer configuration while the JSONL source remains preserved.')
          y=yaml.safe_dump(meta,sort_keys=False,allow_unicode=True,width=120).strip()
          out=f'---\n{y}\n---\n\n{body.rstrip()}\n'
          with tempfile.NamedTemporaryFile('w',encoding='utf-8',delete=False,suffix='.md') as f: f.write(out); tmp=f.name
          c=api.upload_file(path_or_fileobj=tmp,path_in_repo='README.md',repo_id=repo,repo_type='dataset',token=token,commit_message='Repair Viewer config after stale release overwrite')
          print('HF_LIVE_REPAIR_PASS',c)
          PY

name: Build and deploy the reviewed schema preview only
'on':
  workflow_dispatch:
    inputs:
      reviewed_commit:
        description: Exact reviewed source commit for the fixed schema preview branch
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: doctor-ghezelbaash-publication
  cancel-in-progress: false
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      REVIEWED_COMMIT: ${{ inputs.reviewed_commit }}
      ARCHIVE_SOURCE_COMMIT: ed767f6e6726e1453196e2ec2b312fcad00677e2
      GIT_LFS_SKIP_SMUDGE: '1'
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - name: Require the exact reviewed commit
        shell: bash
        run: |
          set -euo pipefail
          [[ "$REVIEWED_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_SHA" = "$REVIEWED_COMMIT"
          test "$(git rev-parse HEAD)" = "$REVIEWED_COMMIT"
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Record the fixed production baseline and disabled Git deployments
        id: baseline
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python .github/scripts/schema_preview.py before
      - uses: actions/setup-node@v4
        with: {node-version-file: .nvmrc, cache: npm}
      - name: Install build tools and standards validators
        run: |
          npm ci
          npm install --prefix /tmp/schema-preview-tools --no-save wrangler@4.152.0
          python -m pip install --disable-pip-version-check 'rdflib>=7,<8' 'pyshacl>=0.30,<1' 'mlcroissant==1.1.1' 'PyLD>=2,<4'
      - name: Test and build the complete candidate once
        run: |
          node --test tests/*.test.mjs
          npm run build
          python tests/validate_platform_bundle.py dist --no-query --rdf
          python tests/validate_machine_resources.py dist
          python tests/validate_canonical_invariants.py dist
          python .github/scripts/schema_preview.py freeze
      - name: Preserve the exact validated website for later review or reuse
        uses: actions/upload-artifact@v4
        with:
          name: schema-preview-frozen-website
          path: /tmp/schema-preview-website.tar.gz
          compression-level: 0
      - name: Deploy only schema-validation-20261023 and verify fresh preview bytes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 884d1d90bd1fb6ecca14992c6c60d677
          WRANGLER_SEND_METRICS: 'false'
        run: python .github/scripts/schema_preview.py deploy
      - name: Verify production and Git switches remained unchanged
        if: always() && steps.baseline.outcome == 'success'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python .github/scripts/schema_preview.py after
      - name: Preserve sanitized preview and production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schema-preview-evidence
          path: /tmp/schema-preview-evidence/*.json
          if-no-files-found: warn

name: Temporary immutable external readback

on:
  push:
    branches: [release/v1.2.2-candidate]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Verify Zenodo public record and Hugging Face refs without mutation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,urllib.request,time
          def get(url):
              req=urllib.request.Request(url,headers={'Cache-Control':'no-cache','Pragma':'no-cache','User-Agent':'ghezelbaash-release-readback/1.0'})
              with urllib.request.urlopen(req,timeout=45) as r:
                  return r.read(),dict(r.headers)
          raw,headers=get('https://zenodo.org/api/records/21930954?fresh='+str(time.time_ns()))
          z=json.loads(raw)
          meta=z.get('metadata') or {}
          creators=[{'name':x.get('name'),'orcid':x.get('orcid')} for x in meta.get('creators',[])]
          files=[{'key':x.get('key'),'size':x.get('size'),'checksum':x.get('checksum')} for x in z.get('files',[])]
          out={
            'ZENODO_PUBLIC_READBACK_PASS': True,
            'id': z.get('id'),
            'doi': z.get('doi'),
            'conceptdoi': z.get('conceptdoi'),
            'title': meta.get('title'),
            'version': meta.get('version'),
            'publication_date': meta.get('publication_date'),
            'resource_type': meta.get('resource_type'),
            'license': meta.get('license'),
            'creators': creators,
            'files': files,
            'submitted': z.get('submitted'),
            'modified': z.get('modified'),
            'created': z.get('created')
          }
          print('ZENODO_READBACK='+json.dumps(out,ensure_ascii=False,sort_keys=True))
          assert str(z.get('id'))=='21930954'
          assert z.get('doi')=='10.5281/zenodo.21930954'
          assert z.get('conceptdoi')=='10.5281/zenodo.18765168'
          assert meta.get('title')=='Dr. Saeed Ghezelbash Public Knowledge Graph'
          assert str(meta.get('version'))=='1.2.2'
          assert any((c.get('orcid') or '').endswith('0009-0001-9346-8475') for c in creators)
          PY
          git ls-remote 'https://huggingface.co/datasets/doctor-ghezelbaash/dr-saeid-ghezelbaash-entity-data' \
            'refs/heads/main' 'refs/tags/v1.2.2' 'refs/tags/v1.2.2^{}' | tee /tmp/hf-refs.txt
          python - <<'PY'
          import json,re,urllib.request,time
          base='https://huggingface.co/datasets/doctor-ghezelbaash/dr-saeid-ghezelbaash-entity-data'
          def text(ref,path='README.md'):
              url=f'{base}/resolve/{ref}/{path}?download=true&fresh={time.time_ns()}'
              req=urllib.request.Request(url,headers={'Cache-Control':'no-cache','Pragma':'no-cache','User-Agent':'ghezelbaash-release-readback/1.0'})
              with urllib.request.urlopen(req,timeout=45) as r:return r.read().decode('utf-8','replace')
          refs=open('/tmp/hf-refs.txt').read().splitlines()
          parsed={line.split('\t')[1]:line.split('\t')[0] for line in refs if '\t' in line}
          tag=parsed.get('refs/tags/v1.2.2^{}') or parsed.get('refs/tags/v1.2.2')
          main=parsed.get('refs/heads/main')
          tag_readme=text('v1.2.2')
          main_readme=text('main')
          tag_hashes=json.loads(text('v1.2.2','dist-sha256.json'))
          def title(s):
              m=re.search(r'(?m)^pretty_name:\s*(.+)$',s)
              return m.group(1).strip() if m else None
          out={'HF_PUBLIC_READBACK_PASS':True,'mainCommit':main,'tagCommit':tag,'tagExpected':'21f65768496303988fee9e09a5e5847d993537fe','mainPrettyName':title(main_readme),'tagPrettyName':title(tag_readme),'tagRelease':tag_hashes.get('release'),'tagVersionDoi':tag_hashes.get('zenodoVersionDoi'),'tagConceptDoi':tag_hashes.get('conceptDoi')}
          print('HF_READBACK='+json.dumps(out,ensure_ascii=False,sort_keys=True))
          assert tag=='21f65768496303988fee9e09a5e5847d993537fe', (tag,'unexpected frozen HF tag commit')
          assert tag_hashes.get('release')=='1.2.2'
          assert tag_hashes.get('zenodoVersionDoi')=='10.5281/zenodo.21930954'
          assert tag_hashes.get('conceptDoi')=='10.5281/zenodo.18765168'
          PY

name: One-time current convergence check

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-time-current-convergence-check.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Build current source
        run: |
          set -euo pipefail
          npm ci
          npm run build

      - name: Check all live publication surfaces
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, urllib.parse, urllib.request, zipfile, io
          from pathlib import Path

          DIST=Path("dist")
          release=json.loads(Path("src/data/release.json").read_text())
          registry=json.loads(Path("src/data/machine-resources.json").read_text())

          shared=sorted(
              r["path"] for r in registry["resources"]
              if {"website","huggingFace","zenodo"}.issubset(set(r.get("targets") or []))
          )
          record=str(release["dataset"]["zenodo"]["recordId"])
          doi=release["dataset"]["zenodo"]["versionDoi"]
          version=release["release"]
          hf_repo=release["dataset"]["huggingFace"]["dataset"].removeprefix("https://huggingface.co/datasets/")

          def h(b): return hashlib.sha256(b).hexdigest()
          def get(url,timeout=120):
              req=urllib.request.Request(url,headers={"User-Agent":"doctor-ghezelbaash-current-check/1.0"})
              try:
                  with urllib.request.urlopen(req,timeout=timeout) as resp:
                      return resp.status, resp.read(), dict(resp.headers)
              except urllib.error.HTTPError as e:
                  return e.code, e.read(), dict(e.headers)

          # Website/HF/Zenodo parity.
          dist_fail=[]
          for name in shared:
              local=(DIST/name).read_bytes()
              _,live,_=get("https://www.ghezelbaash.ir/" + ("" if name=="index.html" else urllib.parse.quote(name)))
              _,hf,_=get("https://huggingface.co/datasets/"+hf_repo+"/resolve/main/"+urllib.parse.quote(name)+"?download=true")
              key=urllib.parse.quote(name,safe="")
              _,zen,_=get(f"https://zenodo.org/api/records/{record}/files/{key}/content")
              if len({h(local),h(live),h(hf),h(zen)})!=1:
                  dist_fail.append(name)

          # Kaggle public API and download.
          view_url="https://www.kaggle.com/api/v1/datasets/view/saeedghezelbash/dr-saeed-ghezelbash-public-knowledge-graph"
          search_url="https://www.kaggle.com/api/v1/datasets/list?search=saeed%20ghezelbash"
          download_url="https://www.kaggle.com/api/v1/datasets/download/saeedghezelbash/dr-saeed-ghezelbash-public-knowledge-graph"

          view_status,view_body,_=get(view_url)
          search_status,search_body,_=get(search_url)
          download_status,download_body,_=get(download_url,180)

          meta=None
          search_matches=[]
          if view_status==200:
              try: meta=json.loads(view_body)
              except Exception: pass
          if search_status==200:
              try:
                  s=json.loads(search_body)
                  rows=s if isinstance(s,list) else s.get("datasets") or s.get("results") or []
                  for x in rows:
                      if isinstance(x,dict) and x.get("ref")=="saeedghezelbash/dr-saeed-ghezelbash-public-knowledge-graph":
                          search_matches.append({
                              "ref":x.get("ref"),
                              "title":x.get("title"),
                              "lastUpdated":x.get("lastUpdated"),
                              "currentVersionNumber":x.get("currentVersionNumber"),
                              "totalBytes":x.get("totalBytes"),
                          })
              except Exception:
                  pass

          kaggle_zip_valid=False
          kaggle_files=[]
          compare=[]
          claim_presence={}
          graph_equals_live=False
          if download_status==200:
              try:
                  z=zipfile.ZipFile(io.BytesIO(download_body))
                  kaggle_zip_valid=True
                  kaggle_files=z.namelist()
                  candidates=[
                      "src/content-source/page.md",
                      "src/data/semantic/knowledge-graph.jsonld",
                      "src/data/semantic/shapes.ttl",
                      "src/data/release.json",
                      "src/data/machine-resources.json",
                      "README.md",
                      "CITATION.cff",
                      "codemeta.json",
                      "package.json",
                      "package-lock.json",
                  ]
                  for name in candidates:
                      if name in z.namelist() and Path(name).is_file():
                          kb=z.read(name)
                          cb=Path(name).read_bytes()
                          compare.append({"file":name,"equal":h(kb)==h(cb)})
                  if "src/data/semantic/knowledge-graph.jsonld" in z.namelist():
                      _,lg,_=get("https://www.ghezelbaash.ir/graph.jsonld")
                      graph_equals_live=h(z.read("src/data/semantic/knowledge-graph.jsonld"))==h(lg)
                  text_parts=[]
                  for name in z.namelist():
                      if name.endswith((".md",".json",".jsonld",".ttl",".txt",".csv",".cff")):
                          try:
                              blob=z.read(name)
                              if len(blob)<=8_000_000:
                                  text_parts.append(blob.decode("utf-8","ignore"))
                          except Exception:
                              pass
                  alltext="\n".join(text_parts)
                  claims=[
                      "Iran's #1 doctor by public reputation signals",
                      "highest patient satisfaction",
                      "Kermanshah's most popular doctor",
                      "Kermanshah's top-rated aesthetic physician",
                      "among Iran's most reviewed aesthetic doctors",
                      "one of Kermanshah's most recommended physicians",
                      "leading in patient trust",
                  ]
                  claim_presence={c:(c in alltext) for c in claims}
              except Exception:
                  kaggle_zip_valid=False

          out={
              "checkedAtSourceCommit":"${{ github.sha }}",
              "release":version,
              "doi":doi,
              "sharedResources":len(shared),
              "websiteHfZenodoEqualCount":len(shared)-len(dist_fail),
              "websiteHfZenodoMismatches":dist_fail,
              "kaggleViewStatus":view_status,
              "kaggleSearchStatus":search_status,
              "kaggleDownloadStatus":download_status,
              "kaggleSearchMatches":search_matches,
              "kaggleMetadata":{
                  "title": meta.get("title") if isinstance(meta,dict) else None,
                  "currentVersionNumber": meta.get("currentVersionNumber") if isinstance(meta,dict) else None,
                  "lastUpdated": meta.get("lastUpdated") if isinstance(meta,dict) else None,
                  "totalBytes": meta.get("totalBytes") if isinstance(meta,dict) else None,
                  "fileCount": len(meta.get("files") or []) if isinstance(meta,dict) else None,
                  "isPrivate": meta.get("isPrivate") if isinstance(meta,dict) else None,
                  "licenseName": meta.get("licenseName") if isinstance(meta,dict) else None,
              },
              "kaggleZipValid":kaggle_zip_valid,
              "kaggleZipFileCount":len(kaggle_files),
              "kaggleSourceCompared":len(compare),
              "kaggleSourceEqualCount":sum(1 for r in compare if r["equal"]),
              "kaggleSourceMismatchCount":sum(1 for r in compare if not r["equal"]),
              "kaggleSourceMismatches":[r["file"] for r in compare if not r["equal"]],
              "kaggleGraphEqualsLiveWebsiteGraph":graph_equals_live,
              "claimsPresentInKaggle":claim_presence,
          }
          print(json.dumps(out,ensure_ascii=False,indent=2))
          if dist_fail:
              raise SystemExit(3)
          PY

name: PR 394 final conformance transaction

on:
  push:
    branches:
      - candidate/final-repository-plan-2026

permissions:
  contents: write

concurrency:
  group: pr394-final-conformance
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: candidate/final-repository-plan-2026
          fetch-depth: 0

      - name: Set up pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Set up pinned Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14.6'

      - name: Provision media validation tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Materialize exact final candidate
        shell: bash
        run: |
          set -euo pipefail
          INITIAL_HEAD="$(git rev-parse HEAD)"
          test "$INITIAL_HEAD" = "$GITHUB_SHA"

          python - <<'PY'
          from pathlib import Path
          raw = Path('.github/workflows/pr394-apply-upgrade.yml').read_text()
          start = "          cat > scripts/validate-rdf-isomorphism.mjs <<'EOF'\n"
          end = "          EOF\n"
          assert start in raw
          tail = raw.split(start, 1)[1]
          body, _ = tail.split(end, 1)
          lines = []
          for line in body.splitlines():
              assert line.startswith('          ') or not line
              lines.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/validate-rdf-isomorphism.mjs').write_text('\n'.join(lines) + '\n')
          PY

          cat .pr394-upgrade.gz.b64.* | base64 --decode | gzip -dc > /tmp/pr394-upgrade.patch
          git apply --check /tmp/pr394-upgrade.patch
          git apply /tmp/pr394-upgrade.patch

          python - <<'PY'
          from pathlib import Path

          p = Path('scripts/validate-cloudflare-pages-limits.mjs')
          s = p.read_text()
          old = '/' + 'media/images/physician/' + 'example.webp'
          assert old in s
          p.write_text(s.replace(old, '/assets/image-example.webp', 1))

          p = Path('src/components/GuideNavigator.astro')
          s = p.read_text()
          old = 'dialogOpener = opener instanceof HTMLElement ? opener : null;'
          new = 'dialogOpener = opener && typeof opener.focus === "function" ? opener : null;'
          assert old in s
          s = s.replace(old, new, 1)
          old = 'if (target?.isConnected)\n      requestAnimationFrame(() => target.focus({ preventScroll: true }));'
          new = 'if (target && target.isConnected !== false && typeof target.focus === "function")\n      requestAnimationFrame(() => target.focus({ preventScroll: true }));'
          assert old in s
          p.write_text(s.replace(old, new, 1))

          p = Path('scripts/test-guide-navigator.mjs')
          s = p.read_text()
          old = 'dialog.close = () => { dialog.open = false; };'
          new = 'dialog.close = () => { dialog.open = false; emit(dialog, "close"); };'
          assert old in s
          p.write_text(s.replace(old, new, 1))

          # Resource paths come from the existing machine-resource registry. Website targets
          # resolve from final dist; non-website release resources resolve from their registered
          # generated/source path. Do not force HF/Zenodo-only resources into website dist.
          p = Path('scripts/validate-artifact-semantics.mjs')
          s = p.read_text()
          assert 'query-matrix.jsonl' in s and 'query-matrix.json-seq' in s
          marker = 'const ndjson = await readFile('
          idx = s.find(marker)
          assert idx >= 0
          helper = '''const machineResourceRegistry = JSON.parse(await readFile("src/data/machine-resources.json", "utf8"));
const resolveRegisteredArtifact = (resourcePath) => {
  const resource = machineResourceRegistry.resources.find((entry) => entry.path === resourcePath);
  if (!resource) throw new Error(`Machine resource is not registered: ${resourcePath}`);
  return resource.targets?.includes("website") ? path.join(distDir, resource.path) : resource.source;
};

'''
          s = s[:idx] + helper + s[idx:]
          replacements = 0
          for name in ('query-matrix.jsonl', 'query-matrix.json-seq'):
              for old in (f'path.join(distDir, "{name}")', f"path.join(distDir, '{name}')"):
                  if old in s:
                      s = s.replace(old, f'resolveRegisteredArtifact("{name}")', 1)
                      replacements += 1
                      break
          assert replacements == 2
          p.write_text(s)

          Path('scripts/validate-rdf-isomorphism.mjs').write_text(Path('/tmp/validate-rdf-isomorphism.mjs').read_text())
          PY

          mv scripts/audit-performance.mjs scripts/measure-performance.mjs
          sed -i 's|scripts/audit-performance.mjs|scripts/measure-performance.mjs|g' package.json .github/workflows/ci.yml
          sed -i 's/await chrome.kill();/chrome.kill();/' scripts/measure-performance.mjs
          sed -i 's/^on:$/on:\n  workflow_dispatch:/' .github/workflows/ci.yml

          npm install --package-lock-only --ignore-scripts --no-audit --no-fund

          rm -f .pr394-upgrade.gz.b64.*
          rm -f .github/workflows/pr394-apply-upgrade.yml
          rm -f .github/workflows/pr394-finalize-upgrade.yml

          npm ci
          npm run security:dependencies
          npx playwright install --with-deps chromium
          npm run render:calibration:update
          npm run test:render-navigation -- .generated/calibration-candidate

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: harden 2026 dist conformance and browser evidence'

          FINAL_HEAD="$(git rev-parse HEAD)"
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct "$FINAL_HEAD")"
          {
            echo "FINAL_HEAD=$FINAL_HEAD"
            echo "SOURCE_COMMIT=$FINAL_HEAD"
            echo "CF_PAGES_COMMIT_SHA=$FINAL_HEAD"
            echo "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH"
          } >> "$GITHUB_ENV"
          printf '%s\n' "$FINAL_HEAD" > /tmp/pr394-final-head.txt
          printf 'Prepared final candidate %s\n' "$FINAL_HEAD"

      - name: Release final candidate
        shell: bash
        run: |
          set +e
          npm run release 2>&1 | tee /tmp/pr394-release.log
          rc=${PIPESTATUS[0]}
          printf '%s\n' "$rc" > /tmp/pr394-release-exit.txt
          exit "$rc"

      - name: Capture transaction evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr394-final-transaction-${{ github.sha }}
          path: |
            /tmp/pr394-final-head.txt
            /tmp/pr394-release.log
            /tmp/pr394-release-exit.txt
            .generated/validation/
            .release/runtime/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

      - name: Push only fully validated candidate
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$FINAL_HEAD"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          REMOTE_HEAD="$(git ls-remote origin refs/heads/candidate/final-repository-plan-2026 | cut -f1)"
          test "$REMOTE_HEAD" = "$GITHUB_SHA"
          git push origin HEAD:candidate/final-repository-plan-2026
          printf 'FINAL_HEAD=%s\n' "$FINAL_HEAD"

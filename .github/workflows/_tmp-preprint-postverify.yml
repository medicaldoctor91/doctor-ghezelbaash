name: Temporary WikiJournal preprint post-write verification
on:
  push:
    branches: [main]
    paths: ['.github/workflows/_tmp-preprint-postverify.yml']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check --no-input requests==2.32.5
      - name: Purge and verify live graph
        shell: bash
        run: |
          python - <<'PY'
          import requests,json,os,time
          H={'User-Agent':'GhezelbaashPreprintPostVerify/1.0 (https://www.ghezelbaash.ir/)'}
          V='https://en.wikiversity.org/w/api.php'; W='https://www.wikidata.org/w/api.php'
          PAGE='WikiJournal Preprints/Individualized clinical assessment and outcome interpretation in aesthetic botulinum neurotoxin type A treatment: a focused review'; Q='Q141129555'; P='Q140287622'
          s=requests.Session(); s.headers.update(H)
          s.post(V,data={'action':'purge','format':'json','forcelinkupdate':1,'titles':PAGE},timeout=60).raise_for_status(); time.sleep(2)
          vp=s.get(V,params={'action':'query','format':'json','formatversion':2,'titles':PAGE,'prop':'pageprops|info'},timeout=60).json()['query']['pages'][0]
          e=s.get(W,params={'action':'wbgetentities','format':'json','formatversion':2,'ids':Q,'props':'labels|descriptions|claims|sitelinks'},timeout=60).json()['entities'][Q]
          p=s.get(W,params={'action':'wbgetentities','format':'json','formatversion':2,'ids':P,'props':'claims'},timeout=60).json()['entities'][P]
          back=[]
          for c in p.get('claims',{}).get('P3919',[]):
            if c.get('mainsnak',{}).get('datavalue',{}).get('value',{}).get('id')==Q:
              back.append({'guid':c.get('id'),'rank':c.get('rank'),'role':[x.get('datavalue',{}).get('value',{}).get('id') for x in c.get('qualifiers',{}).get('P2868',[])],'references':len(c.get('references',[]))})
          out={'wikiversity_pageprops':vp.get('pageprops'),'wikiversity_qid':(vp.get('pageprops') or {}).get('wikibase_item'),'item_lastrevid':e.get('lastrevid'),'item_modified':e.get('modified'),'sitelink':e.get('sitelinks',{}).get('enwikiversity'),'claim_counts':{k:len(e.get('claims',{}).get(k,[])) for k in ['P31','P1476','P50','P1433','P407','P275','P921','P793']},'person_back_edge':back}
          os.makedirs('wikimedia',exist_ok=True); open('wikimedia/_tmp-preprint-postverify.json','w',encoding='utf8').write(json.dumps(out,ensure_ascii=False,indent=2)); print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - name: Commit verification
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add wikimedia/_tmp-preprint-postverify.json
          git commit -m 'Record temporary WikiJournal preprint post-write verification'
          git push

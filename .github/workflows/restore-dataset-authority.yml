name: Restore Dataset authority

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: read

jobs:
  migrate-and-validate:
    if: github.head_ref == 'restore-dataset-authority-2026-07-30'
    runs-on: ubuntu-latest
    steps:
      - name: Check out migration branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Python graph dependency
        run: python -m pip install --disable-pip-version-check rdflib

      - name: Apply deterministic Dataset authority migration
        run: python scripts/upgrade_dataset_authority.py

      - name: Install project dependencies
        run: npm ci

      - name: Build and validate full production output
        run: npm run build

      - name: Remove one-time migration machinery
        run: rm scripts/upgrade_dataset_authority.py .github/workflows/restore-dataset-authority.yml

      - name: Verify clean patch
        run: git diff --check

      - name: Commit validated production changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore historical Dataset authority and indexing"
          git push origin HEAD:${{ github.head_ref }}

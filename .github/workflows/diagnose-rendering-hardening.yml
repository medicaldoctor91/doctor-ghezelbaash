name: Diagnose rendering hardening

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/diagnose-rendering-hardening.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - uses: browser-actions/setup-chrome@v1
      - name: Run hardening workflow logic and capture output
        shell: bash
        run: |
          set +e
          mkdir -p tmp
          exec > >(tee tmp/render-hardening-diagnostic.log) 2>&1
          echo "start $(date -u +%FT%TZ)"
          python3 - <<'PY'
          from pathlib import Path
          def replace_once(path, old, new):
              p=Path(path); s=p.read_text(encoding='utf-8'); count=s.count(old)
              print(path,repr(old),count)
              if count!=1: raise SystemExit(f'{path}: expected 1, got {count}')
              p.write_text(s.replace(old,new),encoding='utf-8')
          replace_once('astro.config.mjs', "inlineStylesheets: 'auto'", "inlineStylesheets: 'always'")
          head=Path('src/components/DocumentHead.astro'); s=head.read_text(encoding='utf-8')
          for line in ['<link rel="shortcut icon" href="/favicon.ico" />\n','<link rel="manifest" href="/site.webmanifest" />\n','<link rel="preload" href="/fonts/vazirmatn-nl-wght.woff2" as="font" type="font/woff2" crossorigin="anonymous" />\n']:
              print('head',repr(line),s.count(line))
              if s.count(line)!=1: raise SystemExit('head mismatch')
              s=s.replace(line,'',1)
          head.write_text(s,encoding='utf-8')
          css=Path('src/styles/global.css'); s=css.read_text(encoding='utf-8')
          old='h1,\nh2,\nh3,\nh4,\nh5,\nh6 {\n  line-height: 1.45;\n  text-wrap: balance;\n  scroll-margin-top: 1.5rem;\n}\n'
          new='h1,\nh2,\nh3,\nh4,\nh5,\nh6 {\n  line-height: 1.45;\n  scroll-margin-top: 1.5rem;\n}\n\nh1,\nh2 {\n  text-wrap: balance;\n}\n'
          print('heading',s.count(old)); assert s.count(old)==1; s=s.replace(old,new,1)
          marker='main > :where(p, ul, ol, blockquote, details, address, .section-answer, .micro-answer, .semantic-alias) {\n  max-width: var(--reading-measure);\n  margin-inline-start: 0;\n  margin-inline-end: auto;\n}\n'
          addition=marker+'\n/* Preserve the complete semantic corpus while deferring below-fold layout and paint. */\nmain > :nth-child(n + 8) {\n  content-visibility: auto;\n  contain-intrinsic-size: auto 240px;\n}\n\nmain > :where(nav, ul, ol, table, figure, details, blockquote):nth-child(n + 8) {\n  contain-intrinsic-size: auto 720px;\n}\n'
          print('marker',s.count(marker)); assert s.count(marker)==1; s=s.replace(marker,addition,1)
          backdrop='@supports (backdrop-filter: blur(18px)) {\n  #aesthetic-medicine-table-of-contents {\n    background: rgb(248 252 250 / 0.58);\n    backdrop-filter: blur(20px) saturate(1.25);\n  }\n}\n\n'
          print('backdrop',s.count(backdrop)); assert s.count(backdrop)==1; s=s.replace(backdrop,'',1)
          css.write_text(s,encoding='utf-8')
          dock=Path('src/components/FloatingActionDock.astro'); s=dock.read_text(encoding='utf-8')
          for old,new in [('background: rgb(255 255 255 / 0.88);','background: #fff;'),('background: rgb(255 255 255 / 0.9);','background: #fff;')]:
              print('dock',repr(old),s.count(old)); assert s.count(old)==1; s=s.replace(old,new,1)
          for line in ['    -webkit-backdrop-filter: blur(16px) saturate(1.25);\n','    backdrop-filter: blur(16px) saturate(1.25);\n','    -webkit-backdrop-filter: blur(14px);\n','    backdrop-filter: blur(14px);\n']:
              print('dock line',repr(line),s.count(line)); assert s.count(line)==1; s=s.replace(line,'',1)
          dock.write_text(s,encoding='utf-8')
          PY
          rc=$?
          if [ "$rc" -eq 0 ]; then npm ci --no-audit --no-fund; rc=$?; fi
          if [ "$rc" -eq 0 ]; then npm run build; rc=$?; fi
          if [ "$rc" -eq 0 ]; then
            npx --yes http-server@14.1.1 dist -p 4173 -c-1 >/tmp/http-server.log 2>&1 & pid=$!
            for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
            npx --yes lighthouse http://127.0.0.1:4173/ --quiet --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage' --output=json --output-path=/tmp/render-hardening-lhr.json
            rc=$?
            kill $pid || true
          fi
          if [ "$rc" -eq 0 ]; then
            node -e "const l=require('/tmp/render-hardening-lhr.json'); console.log(JSON.stringify({performance:Math.round(l.categories.performance.score*100),accessibility:Math.round(l.categories.accessibility.score*100),bestPractices:Math.round(l.categories['best-practices'].score*100),seo:Math.round(l.categories.seo.score*100),tbt:l.audits['total-blocking-time'].numericValue,fcp:l.audits['first-contentful-paint'].numericValue,lcp:l.audits['largest-contentful-paint'].numericValue,mainthread:l.audits['mainthread-work-breakdown'].numericValue},null,2))"
          fi
          echo "exit $rc"
          echo "$rc" > tmp/render-hardening-exit.txt
          exit 0
      - name: Commit diagnostics only
        run: |
          set -euo pipefail
          git reset --hard HEAD
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/diagnose-rendering-hardening.yml
          git add tmp/render-hardening-diagnostic.log tmp/render-hardening-exit.txt
          git commit -m 'Record rendering hardening diagnostics'
          git push origin HEAD:main

name: Temporary final named-as cleanup

on:
  pull_request:
    types: [opened]
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.head_ref == 'tmp-cleanup-named-as-final'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
      - name: Remove temporary named-as operation files and branches
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git rm -f --ignore-unmatch \
            scripts/_tmp_audit_named_as_q140288589.py \
            scripts/_tmp_summarize_named_as_q140288589.py \
            scripts/_tmp_fix_named_as_q140288589_live.py \
            scripts/_tmp_fix_named_as_q140288589_guided.py \
            scripts/_tmp_verify_named_as_q140288589_readonly.py \
            .github/workflows/_tmp-audit-named-as-q140288589.yml \
            .github/workflows/_tmp-prtarget-audit-named-as-q140288589.yml \
            .github/workflows/_tmp-prtarget-fix-named-as-q140288589.yml \
            .github/workflows/_tmp-after-ci-fix-named-as-q140288589.yml \
            .github/workflows/_tmp-pr-fix-named-as-q140288589.yml \
            wikimedia/_tmp-named-as-q140288589-audit.json \
            wikimedia/_tmp-named-as-q140288589-summary.json \
            wikimedia/_tmp-named-as-q140288589-repair.json \
            wikimedia/_tmp-named-as-q140288589-finalverify.json \
            .github/workflows/_tmp-cleanup-named-as-final.yml

          if ! git diff --cached --quiet; then
            git commit -m 'Remove temporary named-as audit and repair files'
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi

          for branch in \
            tmp-audit-named-as-q140288589-now \
            tmp-fix-named-as-q140288589-now \
            tmp-fix-named-as-q140288589-pr \
            tmp-fix-named-as-q140288589-pr2 \
            tmp-fix-named-as-q140288589-pr3 \
            tmp-fix-named-as-q140288589-pr4 \
            tmp-live-named-as-audit-now \
            tmp-verify-named-as-q140288589-pr5 \
            tmp-cleanup-named-as-final; do
            git push origin --delete "$branch" || true
          done

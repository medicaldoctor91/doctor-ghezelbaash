name: Fix Q141099455 work type
on:
  push:
    paths:
      - 'scripts/fix_q141099455_work_type.py'
      - '.github/workflows/fix-q141099455-work-type.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      WIKIMEDIA_USERNAME: ${{ secrets.WIKIVERSITY_USERNAME }}
      WIKIMEDIA_BOT_PASSWORD: ${{ secrets.WIKIVERSITY_BOT_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Run duplicate-safe fix and capture diagnostics
        shell: bash
        run: |
          set +e
          mkdir -p .audit
          {
            echo "username_present=$([ -n \"$WIKIMEDIA_USERNAME\" ] && echo yes || echo no)"
            echo "password_present=$([ -n \"$WIKIMEDIA_BOT_PASSWORD\" ] && echo yes || echo no)"
            python -m py_compile scripts/fix_q141099455_work_type.py
            compile_code=$?
            echo "compile_exit=$compile_code"
            if [ "$compile_code" -eq 0 ] && [ -n "$WIKIMEDIA_USERNAME" ] && [ -n "$WIKIMEDIA_BOT_PASSWORD" ]; then
              python scripts/fix_q141099455_work_type.py > .audit/q141099455-work-type-fix.json 2> .audit/q141099455-work-type-stderr.txt
              run_code=$?
            else
              run_code=97
              : > .audit/q141099455-work-type-fix.json
              echo "preflight credentials or compile failed" > .audit/q141099455-work-type-stderr.txt
            fi
            echo "run_exit=$run_code"
            echo "output_bytes=$(wc -c < .audit/q141099455-work-type-fix.json)"
            echo "stderr_bytes=$(wc -c < .audit/q141099455-work-type-stderr.txt)"
          } > .audit/q141099455-work-type-diagnostics.txt
          exit 0
      - name: Persist diagnostics and result
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .audit/q141099455-work-type-fix.json .audit/q141099455-work-type-stderr.txt .audit/q141099455-work-type-diagnostics.txt
          git commit -m 'Record Q141099455 fix diagnostics' || exit 0
          git push

name: Fix Q141099455 work type
on:
  push:
    paths:
      - 'scripts/fix_q141099455_work_type.py'
      - '.github/workflows/fix-q141099455-work-type.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      WIKIMEDIA_USERNAME: ${{ secrets.WIKIVERSITY_USERNAME }}
      WIKIMEDIA_BOT_PASSWORD: ${{ secrets.WIKIVERSITY_BOT_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Validate credentials and script
        shell: bash
        run: |
          set -euo pipefail
          test -n "$WIKIMEDIA_USERNAME"
          test -n "$WIKIMEDIA_BOT_PASSWORD"
          python -m py_compile scripts/fix_q141099455_work_type.py
      - name: Apply duplicate-safe work classification and verify constraints
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .audit
          python scripts/fix_q141099455_work_type.py | tee .audit/q141099455-work-type-fix.json
          test -s .audit/q141099455-work-type-fix.json
          python -m json.tool .audit/q141099455-work-type-fix.json >/dev/null
      - name: Persist verification result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .audit/q141099455-work-type-fix.json
          git commit -m 'Record verified Q141099455 work-type result' || exit 0
          git push

name: Apply atomic v1.2.2 ceiling gap fixes

on:
  push:
    branches: [main]
    paths: [.release/v122-gapfix-request.json]

permissions:
  contents: write

concurrency:
  group: doctor-ghezelbaash-external-mutation
  cancel-in-progress: false

env:
  CANDIDATE_BRANCH: release/v1.2.2-candidate
  EXPECTED_HEAD: b811855e3758312810d79a76bdb5aff8c3bbf36d

jobs:
  gapfix:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: release/v1.2.2-candidate
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Pin exact pre-fix Candidate and load materializer
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main "$CANDIDATE_BRANCH"
          git reset --hard "origin/$CANDIDATE_BRANCH"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain)"
          git show origin/main:.release/v122-gapfix.py > /tmp/v122-gapfix.py
          python -m py_compile /tmp/v122-gapfix.py
      - name: Materialize coherent source tree
        shell: bash
        run: |
          set -euo pipefail
          python /tmp/v122-gapfix.py
          git diff --check
          git status --short
      - name: Create one local atomic Candidate commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name ghezelbaash-v122-gapfix
          git config user.email actions@users.noreply.github.com
          git add scripts src package.json .github/workflows
          git commit -m 'Close v1.2.2 release, freshness, retrieval and integrity gaps'
          C=$(git rev-parse HEAD)
          echo "CANDIDATE_SHA=$C" >> "$GITHUB_ENV"
          echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct "$C")" >> "$GITHUB_ENV"
          echo "ATOMIC_CANDIDATE_COMMIT=$C"
      - run: npm ci --ignore-scripts
      - name: Prove exact local commit before Candidate branch mutation
        shell: bash
        run: |
          set -euo pipefail
          export SOURCE_COMMIT="$CANDIDATE_SHA" CF_PAGES_COMMIT_SHA="$CANDIDATE_SHA" SOURCE_DATE_EPOCH ASTRO_TELEMETRY_DISABLED=1
          npm run release
          node scripts/validate-current-context.mjs dist
          grep -F 'آخرین دریافت از Google:' dist/index.html >/dev/null
          if grep -F ' · دریافت ' dist/index.html >/dev/null; then exit 1; fi
          node - <<'NODE'
          const fs=require('fs');const m=JSON.parse(fs.readFileSync('dist/current-release-matrix.json'));if(m.servicesWithAliasCoverage!==m.serviceCount||m.serviceCount!==124)throw Error(`Query Matrix service coverage ${m.servicesWithAliasCoverage}/${m.serviceCount}`);if(m.sourceCommit!==process.env.CANDIDATE_SHA)throw Error('Current release matrix exact source commit drift');console.log(JSON.stringify({atomicGapfixProof:'PASS',sourceCommit:m.sourceCommit,queryRows:m.queryRows,serviceCoverage:`${m.servicesWithAliasCoverage}/${m.serviceCount}`}));
          NODE
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Publish single proven commit to Candidate branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_HEAD"
          git push origin "HEAD:$CANDIDATE_BRANCH"
          echo "V122_ATOMIC_GAPFIX_PASS candidate=$(git rev-parse HEAD)"

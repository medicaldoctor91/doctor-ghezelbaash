name: Temporary Wikidata live read-only audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_tmp-wikidata-live-readonly.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install requests
        run: python -m pip install --disable-pip-version-check --no-input requests==2.32.5
      - name: Resolve scholarly QIDs and verify live entity state
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, requests
          UA='GhezelbaashEntityAudit/1.0 (https://www.ghezelbaash.ir/)'
          s=requests.Session(); s.headers.update({'User-Agent':UA})
          dois=['10.3390/MD23020084','10.1111/BJHP.70024','10.3390/HEALTHCARE9091169','10.4103/2008-7802.182734']
          values=' '.join(json.dumps(d) for d in dois)
          q=f'SELECT ?item ?doi WHERE {{ VALUES ?doi {{ {values} }} ?item wdt:P356 ?doi . }} ORDER BY ?doi ?item'
          r=s.get('https://query-scholarly.wikidata.org/sparql',params={'query':q,'format':'json'},headers={'Accept':'application/sparql-results+json'},timeout=90)
          r.raise_for_status()
          rows=r.json()['results']['bindings']
          bydoi={d:[] for d in dois}
          for row in rows:
              qid=row['item']['value'].rsplit('/',1)[-1]
              doi=row['doi']['value']
              bydoi.setdefault(doi,[]).append(qid)
          def entity(qid):
              u=f'https://www.wikidata.org/wiki/Special:EntityData/{qid}.json'
              rr=s.get(u,headers={'Accept':'application/json','Cache-Control':'no-cache'},timeout=60)
              rr.raise_for_status()
              return rr.json()['entities'][qid]
          def itemvals(e,pid):
              out=[]
              for c in e.get('claims',{}).get(pid,[]):
                  try: out.append(c['mainsnak']['datavalue']['value']['id'])
                  except Exception: pass
              return out
          def scalars(e,pid):
              out=[]
              for c in e.get('claims',{}).get(pid,[]):
                  try: out.append(c['mainsnak']['datavalue']['value'])
                  except Exception: pass
              return out
          person=entity('Q140287622')
          w21=entity('Q140298431')
          w16=entity('Q36942316')
          citing={}
          for doi in ['10.3390/MD23020084','10.1111/BJHP.70024']:
              qids=sorted(set(bydoi.get(doi,[])))
              citing[doi]={'qids':qids}
              if len(qids)==1:
                  ce=entity(qids[0])
                  citing[doi]['P2860']=itemvals(ce,'P2860')
                  citing[doi]['label_en']=ce.get('labels',{}).get('en',{}).get('value')
                  citing[doi]['doi_values']=scalars(ce,'P356')
          report={
              'doi_resolution':bydoi,
              'person':{
                  'lastrevid':person.get('lastrevid'),
                  'P968':scalars(person,'P968'),
                  'label_en':person.get('labels',{}).get('en',{}).get('value'),
                  'label_en_us':person.get('labels',{}).get('en-us',{}).get('value'),
              },
              'work2021':{'lastrevid':w21.get('lastrevid'),'P921':itemvals(w21,'P921')},
              'work2016':{'lastrevid':w16.get('lastrevid'),'P921':itemvals(w16,'P921')},
              'citing':citing,
          }
          print(json.dumps(report,ensure_ascii=False,indent=2,sort_keys=True))
          PY

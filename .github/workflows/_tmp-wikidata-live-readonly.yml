name: Temporary Wikidata live read-only audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_tmp-wikidata-live-readonly.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install requests
        run: python -m pip install --disable-pip-version-check --no-input requests==2.32.5
      - name: Audit incoming scholarly citation opportunities
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, requests
          UA='GhezelbaashEntityAudit/1.1 (https://www.ghezelbaash.ir/)'
          s=requests.Session(); s.headers.update({'User-Agent':UA})
          SP='https://query-scholarly.wikidata.org/sparql'
          targets={
              '2021': {'qid':'Q140298431','doi':'10.3390/HEALTHCARE9091169'},
              '2016': {'qid':'Q36942316','doi':'10.4103/2008-7802.182734'},
          }
          def sp(query):
              r=s.get(SP,params={'query':query,'format':'json'},headers={'Accept':'application/sparql-results+json'},timeout=90)
              r.raise_for_status(); return r.json()['results']['bindings']
          def entity(qid):
              u=f'https://www.wikidata.org/wiki/Special:EntityData/{qid}.json'
              r=s.get(u,headers={'Accept':'application/json','Cache-Control':'no-cache'},timeout=60)
              r.raise_for_status(); return r.json()['entities'][qid]
          def itemvals(e,pid):
              out=[]
              for c in e.get('claims',{}).get(pid,[]):
                  try: out.append(c['mainsnak']['datavalue']['value']['id'])
                  except Exception: pass
              return out
          def normalize_doi(x):
              if not x: return None
              x=x.strip()
              if x.lower().startswith('https://doi.org/'): x=x[16:]
              return x.upper()
          # Current inbound P2860 edges in Wikidata scholarly graph.
          qs='VALUES ?target { '+ ' '.join('wd:'+v['qid'] for v in targets.values()) +' } '
          q='SELECT ?target ?item ?doi WHERE { '+qs+' ?item wdt:P2860 ?target . OPTIONAL { ?item wdt:P356 ?doi } } ORDER BY ?target ?item'
          inbound=[]
          for row in sp(q):
              inbound.append({
                  'target':row['target']['value'].rsplit('/',1)[-1],
                  'item':row['item']['value'].rsplit('/',1)[-1],
                  'doi':row.get('doi',{}).get('value')
              })
          # Discover citing works via OpenAlex, then map DOI -> existing Wikidata item.
          opportunities=[]; openalex_summary={}
          for key,t in targets.items():
              wd=s.get('https://api.openalex.org/works/https://doi.org/'+t['doi'].lower(),timeout=60)
              wd.raise_for_status(); tw=wd.json()
              wid=tw['id'].rsplit('/',1)[-1]
              openalex_summary[key]={'openalex_id':wid,'cited_by_count':tw.get('cited_by_count')}
              citing=[]; cursor='*'
              for _ in range(3):
                  r=s.get('https://api.openalex.org/works',params={
                      'filter':'cites:'+wid,
                      'per-page':100,
                      'cursor':cursor,
                      'select':'id,doi,display_name,publication_year,type,cited_by_count'
                  },timeout=90)
                  r.raise_for_status(); data=r.json(); citing.extend(data.get('results',[]))
                  cursor=data.get('meta',{}).get('next_cursor')
                  if not cursor or not data.get('results'): break
              bydoi={}
              for w in citing:
                  d=normalize_doi(w.get('doi'))
                  if d: bydoi[d]=w
              dois=sorted(bydoi)
              mapped={}
              for i in range(0,len(dois),40):
                  chunk=dois[i:i+40]
                  vals=' '.join(json.dumps(d) for d in chunk)
                  rows=sp(f'SELECT ?item ?doi WHERE {{ VALUES ?doi {{ {vals} }} ?item wdt:P356 ?doi . }}')
                  for row in rows:
                      d=row['doi']['value']; qid=row['item']['value'].rsplit('/',1)[-1]
                      mapped.setdefault(d,[]).append(qid)
              for d,qids in sorted(mapped.items()):
                  uq=sorted(set(qids))
                  if len(uq)!=1: continue
                  qid=uq[0]; e=entity(qid); p2860=itemvals(e,'P2860')
                  if t['qid'] not in p2860:
                      w=bydoi[d]
                      opportunities.append({
                          'target_key':key,'target_qid':t['qid'],'citing_qid':qid,'doi':d,
                          'title':w.get('display_name'),'year':w.get('publication_year'),
                          'openalex_cited_by_count':w.get('cited_by_count'),'existing_P2860':p2860
                      })
          print(json.dumps({
              'inbound_P2860':inbound,
              'inbound_counts':{q:sum(1 for x in inbound if x['target']==q) for q in [v['qid'] for v in targets.values()]},
              'openalex_targets':openalex_summary,
              'missing_P2860_candidates_existing_wikidata_items':opportunities,
          },ensure_ascii=False,indent=2,sort_keys=True))
          PY

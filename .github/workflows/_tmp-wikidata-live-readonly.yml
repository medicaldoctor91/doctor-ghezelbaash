name: Temporary Wikidata live read-only audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_tmp-wikidata-live-readonly.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install requests
        run: python -m pip install --disable-pip-version-check --no-input requests==2.32.5
      - name: Verify candidate reference DOI metadata
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, requests, urllib.parse
          s=requests.Session(); s.headers.update({'User-Agent':'GhezelbaashCitationAudit/1.0 (mailto:medicaldoctor91@gmail.com)'})
          target='10.4103/2008-7802.182734'.upper()
          candidates={
            'Q91281418':'10.1016/J.JAD.2019.10.038',
            'Q130535180':'10.1039/D3FO00265A',
            'Q131911227':'10.1080/1028415X.2022.2077031',
            'Q136592530':'10.1080/15622975.2021.2013041',
            'Q30101111':'10.1080/19390211.2017.1326432',
            'Q104503772':'10.1111/BDI.13037',
            'Q98221633':'10.3390/NU12082333',
          }
          out=[]
          for qid,doi in candidates.items():
              u='https://api.crossref.org/works/'+urllib.parse.quote(doi,safe='')
              r=s.get(u,timeout=60); status=r.status_code
              row={'qid':qid,'doi':doi,'crossref_status':status}
              if status==200:
                  msg=r.json()['message']; refs=msg.get('reference',[])
                  dois=[]
                  for ref in refs:
                      d=ref.get('DOI') or ref.get('doi')
                      if d: dois.append(d.upper())
                  row['reference_count']=len(refs)
                  row['reference_doi_count']=len(dois)
                  row['target_doi_in_crossref_references']=target in dois
                  row['matching_reference']=[ref for ref in refs if (ref.get('DOI') or ref.get('doi') or '').upper()==target]
              out.append(row)
          print(json.dumps(out,ensure_ascii=False,indent=2,sort_keys=True))
          PY

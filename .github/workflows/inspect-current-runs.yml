name: Inspect current workflow runs

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-current-runs.yml'

permissions:
  actions: read
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2
      - name: Capture recent runs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp
          gh api "repos/$GITHUB_REPOSITORY/actions/runs?branch=main&per_page=30" > /tmp/runs.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('/tmp/runs.json').read_text())
          rows=[]
          for r in data.get('workflow_runs',[]):
              rows.append({k:r.get(k) for k in ('id','name','path','display_title','head_sha','status','conclusion','event','created_at','updated_at','html_url')})
          Path('tmp/current-workflow-runs.json').write_text(json.dumps(rows,indent=2)+'\n')
          PY
          git rm .github/workflows/inspect-current-runs.yml
          git add tmp/current-workflow-runs.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Record current workflow run state [skip ci]'
          git push origin HEAD:main

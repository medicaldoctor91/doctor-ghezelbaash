name: v1.2.2 Cloudflare control-plane bootstrap

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/v122-cloudflare-control-bootstrap.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: doctor-ghezelbaash-external-mutation
  cancel-in-progress: false

jobs:
  isolate-production:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: 884d1d90bd1fb6ecca14992c6c60d677
      CF_PROJECT: doctor-ghezelbaash
      CANONICAL: https://www.ghezelbaash.ir/
    steps:
      - name: Capture current live baseline without trusting cache alone
        shell: bash
        run: |
          set -euo pipefail
          for route in '' graph.jsonld artifact-manifest.json; do
            url="$CANONICAL$route"
            curl --fail --silent --show-error -H 'Cache-Control: no-cache' "$url?__bootstrap_before=$(date +%s%N)" -o "/tmp/before-${route//\//_}.bin"
            sha256sum "/tmp/before-${route//\//_}.bin"
          done
      - name: Move Cloudflare production authority to production/deploy and constrain previews
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          echo "::add-mask::$CLOUDFLARE_API_TOKEN"
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$CF_PROJECT"
          curl --fail --silent --show-error -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api" > /tmp/project-before.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/project-before.json'))
          assert p.get('success') is True and p['result']['name']=='doctor-ghezelbaash'
          s=p['result'].get('source') or {}; c=s.get('config') or {}
          assert c.get('owner')=='medicaldoctor91' and c.get('repo_name')=='doctor-ghezelbaash'
          print('CURRENT_PRODUCTION_BRANCH',p['result'].get('production_branch'))
          PY
          cat > /tmp/patch.json <<'JSON'
          {
            "production_branch": "production/deploy",
            "source": {
              "type": "github",
              "config": {
                "deployments_enabled": true,
                "production_branch": "production/deploy",
                "production_deployments_enabled": true,
                "preview_deployment_setting": "custom",
                "preview_branch_includes": ["staging/deploy"],
                "preview_branch_excludes": ["*"]
              }
            }
          }
          JSON
          curl --fail --silent --show-error -X PATCH -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' --data-binary @/tmp/patch.json "$api" > /tmp/project-after.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/project-after.json')); assert p.get('success') is True
          r=p['result']; c=(r.get('source') or {}).get('config') or {}
          assert r.get('production_branch')=='production/deploy'
          assert c.get('production_branch')=='production/deploy'
          assert c.get('production_deployments_enabled') is True
          assert c.get('preview_deployment_setting')=='custom'
          assert c.get('preview_branch_includes')==['staging/deploy']
          print('CLOUDFLARE_BRANCH_ISOLATION_PASS')
          PY
      - name: Prove branch-control migration did not mutate live content
        shell: bash
        run: |
          set -euo pipefail
          sleep 5
          for route in '' graph.jsonld artifact-manifest.json; do
            url="$CANONICAL$route"
            out="/tmp/after-${route//\//_}.bin"
            curl --fail --silent --show-error -H 'Cache-Control: no-cache' "$url?__bootstrap_after=$(date +%s%N)" -o "$out"
            before="/tmp/before-${route//\//_}.bin"
            cmp "$before" "$out"
            sha256sum "$out"
          done
          echo 'CLOUDFLARE_CONTROL_BOOTSTRAP_ZERO_CONTENT_DELTA_PASS'

name: Deep current-state source and live audit

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/deep-current-state-audit.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: doctor-ghezelbaash-deep-current-state-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies and build
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run build
          python3 -m pip install --quiet rdflib pillow brotli

      - name: Capture repository, source, build, graph, media and HTTP state
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp/deep-current-state/lighthouse tmp/deep-current-state/http
          git ls-files -z | xargs -0 -I{} sh -c 'printf "%s\t%s\n" "$(wc -c < "$1")" "$1"' sh {} | sort -n > tmp/deep-current-state/tracked-files.tsv
          find .github/workflows -maxdepth 1 -type f -printf '%f\n' 2>/dev/null | sort > tmp/deep-current-state/workflows.txt || true
          find tmp -maxdepth 2 -type f -printf '%p\n' 2>/dev/null | sort > tmp/deep-current-state/tmp-files.txt || true

          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          from urllib.parse import urlparse
          from rdflib import Graph, URIRef
          from rdflib.compare import isomorphic
          from PIL import Image
          import base64, brotli, gzip, hashlib, json, os, re, subprocess

          root=Path('.')
          outdir=root/'tmp/deep-current-state'
          outdir.mkdir(parents=True,exist_ok=True)
          sha=lambda p: hashlib.sha256(Path(p).read_bytes()).hexdigest()
          text=lambda p: Path(p).read_text(encoding='utf-8')

          tracked=[]
          for line in text(outdir/'tracked-files.tsv').splitlines():
              if not line.strip(): continue
              size,path=line.split('\t',1)
              tracked.append({'path':path,'bytes':int(size)})

          key_paths=[
            'package.json','package-lock.json','astro.config.mjs','gitignore.txt','node-version.txt','.gitignore','.node-version',
            'src/pages/index.md','src/pages/404.astro','src/layouts/BaseLayout.astro','src/components/DocumentHead.astro',
            'src/components/FloatingActionDock.astro','src/styles/global.css','src/data/semantic/head-graph.min.jsonld',
            'public/graph.jsonld','public/graph.ttl','public/_headers','public/_redirects','public/robots.txt','public/sitemap.xml',
            'public/llms.txt','public/llms-full.txt','public/doctor.vcf','public/clinic.vcf','public/site.webmanifest'
          ]
          key_files={}
          for p in key_paths:
              q=root/p
              key_files[p]={'exists':q.exists()}
              if q.exists() and q.is_file():
                  key_files[p].update({'bytes':q.stat().st_size,'sha256':sha(q)})

          package=json.loads(text('package.json'))
          html_path=root/'dist/index.html'
          html=text(html_path)

          class Parser(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=False)
                  self.capture=None;self.buf=[];self.styles=[];self.scripts=[];self.external_scripts=[];self.style_attrs=[];self.event_attrs=[]
                  self.ids=[];self.fragment_hrefs=[];self.links=[];self.metas=[];self.images=[];self.videos=[];self.head_end=None;self.main_end=None
              def handle_starttag(self,tag,attrs):
                  d=dict(attrs)
                  if 'id' in d:self.ids.append(d['id'])
                  if d.get('href','').startswith('#'):self.fragment_hrefs.append(d['href'][1:])
                  if tag=='script' and d.get('src'):self.external_scripts.append(d['src'])
                  if 'style' in d:self.style_attrs.append({'tag':tag,'value':d['style']})
                  for k,v in attrs:
                      if k.lower().startswith('on'):self.event_attrs.append({'tag':tag,'name':k,'value':v})
                  if tag=='link':self.links.append(d)
                  if tag=='meta':self.metas.append(d)
                  if tag=='img':self.images.append(d)
                  if tag=='video':self.videos.append(d)
                  if tag=='style':self.capture='style';self.buf=[]
                  elif tag=='script' and not d.get('src'):self.capture='script';self.buf=[]
              def handle_data(self,data):
                  if self.capture:self.buf.append(data)
              def handle_entityref(self,name):
                  if self.capture:self.buf.append('&'+name+';')
              def handle_charref(self,name):
                  if self.capture:self.buf.append('&#'+name+';')
              def handle_endtag(self,tag):
                  if tag==self.capture:
                      val=''.join(self.buf)
                      (self.styles if tag=='style' else self.scripts).append(val)
                      self.capture=None;self.buf=[]
          p=Parser();p.feed(html)
          jsonld=[];jsonld_errors=[]
          for s in p.scripts:
              try: jsonld.append(json.loads(s))
              except Exception as e: jsonld_errors.append(repr(e))
          style_hashes=["sha256-"+base64.b64encode(hashlib.sha256(x.encode()).digest()).decode() for x in p.styles]
          script_hashes=["sha256-"+base64.b64encode(hashlib.sha256(x.encode()).digest()).decode() for x in p.scripts]
          ids=set(p.ids)
          broken_fragments=sorted(set(p.fragment_hrefs)-ids)
          duplicate_ids=sorted(x for x in ids if p.ids.count(x)>1)

          full=json.loads(text('public/graph.jsonld'))
          head=json.loads(text('src/data/semantic/head-graph.min.jsonld'))
          fn=full.get('@graph',[]);hn=head.get('@graph',[])
          fby={n.get('@id'):n for n in fn if isinstance(n,dict) and n.get('@id')}
          hby={n.get('@id'):n for n in hn if isinstance(n,dict) and n.get('@id')}
          fids=list(fby);hids=list(hby)
          doctor_id='https://www.ghezelbaash.ir/#saeed-ghezelbash'
          clinic_id='https://www.ghezelbaash.ir/#dr-saeed-ghezelbash-aesthetic-clinic-kermanshah'
          doctor=fby.get(doctor_id,{})
          clinic=fby.get(clinic_id,{})

          gj=Graph();gj.parse('public/graph.jsonld',format='json-ld')
          gt=Graph();gt.parse('public/graph.ttl',format='turtle')
          head_rdf_error=None;head_rdf_subset=None;head_triples=None
          try:
              gh=Graph();gh.parse(data=json.dumps(head,ensure_ascii=False),format='json-ld')
              head_triples=len(gh);head_rdf_subset=all(t in gj for t in gh)
          except Exception as e: head_rdf_error=repr(e)

          def types(n):
              t=n.get('@type',[])
              return t if isinstance(t,list) else [t]
          def missing(n,props): return [x for x in props if not n.get(x)]
          courses=[];events=[];articles=[];countries=[];images=[]
          for n in fn:
              if not isinstance(n,dict):continue
              ts=types(n)
              row={'id':n.get('@id'),'name':n.get('name')}
              if 'Course' in ts:
                  row['missing']=missing(n,['name','description','provider','hasCourseInstance']);row['provider']=n.get('provider');courses.append(row)
              if 'Event' in ts or 'EducationEvent' in ts or 'CourseInstance' in ts:
                  row['types']=ts;row['missing']=missing(n,['name','startDate','location','organizer']);row['eventStatus']=n.get('eventStatus');row['image']=n.get('image');events.append(row)
              if 'ScholarlyArticle' in ts:
                  row['missing']=missing(n,['name','headline','datePublished','author','publisher','image']);row['datePublished']=n.get('datePublished');articles.append(row)
              if 'Country' in ts:
                  row['identifier']=n.get('identifier');countries.append(row)
              if 'ImageObject' in ts:
                  row['missing']=missing(n,['name','contentUrl','license','creditText','copyrightNotice','acquireLicensePage']);row['about']=n.get('about');images.append(row)

          internal_refs=[]
          def walk(x,path='$'):
              if isinstance(x,dict):
                  if isinstance(x.get('@id'),str) and x['@id'].startswith('https://www.ghezelbaash.ir/#'):
                      internal_refs.append({'id':x['@id'],'path':path})
                  for k,v in x.items():walk(v,path+'.'+k)
              elif isinstance(x,list):
                  for i,v in enumerate(x):walk(v,f'{path}[{i}]')
          walk(full)
          unresolved=sorted({r['id'] for r in internal_refs if r['id'] not in fby})

          media=[]
          for q in sorted((root/'public/media').rglob('*')):
              if not q.is_file():continue
              rel=q.relative_to(root).as_posix();item={'path':rel,'bytes':q.stat().st_size,'sha256':sha(q)}
              if q.suffix.lower() in {'.jpg','.jpeg','.png','.webp','.gif'}:
                  try:
                      with Image.open(q) as im:item.update({'width':im.width,'height':im.height,'format':im.format,'mode':im.mode})
                  except Exception as e:item['imageError']=repr(e)
              media.append(item)

          combined='\n'.join(text(q) for q in [root/'src/pages/index.md',root/'src/layouts/BaseLayout.astro',root/'src/components/DocumentHead.astro',root/'public/graph.jsonld',root/'src/data/semantic/head-graph.min.jsonld',root/'public/sitemap.xml',root/'public/llms.txt',root/'public/llms-full.txt',root/'public/doctor.vcf',root/'public/clinic.vcf'] if q.exists())
          orphan_media=[m['path'] for m in media if '/'.join(m['path'].split('/')[1:]) not in combined and ('/'+ '/'.join(m['path'].split('/')[1:])) not in combined]

          headers=text('public/_headers')
          csp_match=re.search(r'(?m)^  Content-Security-Policy: (.+)$',headers)
          csp=csp_match.group(1) if csp_match else None
          csp_directives={}
          if csp:
              for part in csp.split(';'):
                  toks=part.strip().split()
                  if toks:csp_directives[toks[0]]=toks[1:]

          dist_files=[]
          for q in sorted((root/'dist').rglob('*')):
              if q.is_file():dist_files.append({'path':q.relative_to(root/'dist').as_posix(),'bytes':q.stat().st_size})

          report={
            'generatedAt':subprocess.check_output(['date','-u','+%Y-%m-%dT%H:%M:%SZ'],text=True).strip(),
            'git':{
              'commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
              'branch':subprocess.check_output(['git','branch','--show-current'],text=True).strip(),
              'commitCount':int(subprocess.check_output(['git','rev-list','--count','HEAD'],text=True).strip()),
              'trackedFileCount':len(tracked),'trackedBytes':sum(x['bytes'] for x in tracked),
              'workflows':text(outdir/'workflows.txt').splitlines(),
              'tmpFiles':text(outdir/'tmp-files.txt').splitlines(),
              'rootEntries':sorted(x.name for x in root.iterdir() if x.name not in {'.git','node_modules','dist'}),
            },
            'package':package,
            'keyFiles':key_files,
            'build':{
              'htmlBytes':len(html.encode()),'htmlGzipBytes':len(gzip.compress(html.encode(),compresslevel=9)),'htmlBrotliBytes':len(brotli.compress(html.encode(),quality=11)),
              'distFiles':dist_files,'distTotalBytes':sum(x['bytes'] for x in dist_files),
              'inlineStyles':len(p.styles),'inlineScripts':len(p.scripts),'externalScripts':p.external_scripts,
              'inlineStyleAttributes':p.style_attrs,'inlineEventAttributes':p.event_attrs,
              'styleHashes':style_hashes,'scriptHashes':script_hashes,'jsonLdBlocks':len(jsonld),'jsonLdErrors':jsonld_errors,
              'duplicateIds':duplicate_ids,'brokenFragments':broken_fragments,
              'imageCount':len(p.images),'videoCount':len(p.videos),
              'jsonLdAfterMain':html.find('</main>') < html.find('application/ld+json'),
              'oldOfficePhrasePresent':'در حال معاینه بالینی مراجعه‌کننده' in html,
              'presentationTypePresent':'PresentationDigitalDocument' in html,
              'premiumPricePresent':'"priceRange":"$$$$"' in html or '"priceRange": "$$$$"' in html,
            },
            'csp':{'value':csp,'directives':csp_directives,'lineCount':sum(1 for x in headers.splitlines() if 'Content-Security-Policy:' in x),'maxHeaderLineLength':max(map(len,headers.splitlines()))},
            'graphs':{
              'fullNodes':len(fn),'headNodes':len(hn),'fullDuplicateIds':len(fids)-len(set(fids)),'headDuplicateIds':len(hids)-len(set(hids)),
              'headIdSubset':set(hids)<=set(fids),'headMissingIds':sorted(set(hids)-set(fids)),
              'jsonLdTriples':len(gj),'turtleTriples':len(gt),'rdfIsomorphic':isomorphic(gj,gt),
              'headRdfTriples':head_triples,'headRdfSubset':head_rdf_subset,'headRdfError':head_rdf_error,
              'unresolvedInternalIds':unresolved,
              'doctor':{k:doctor.get(k) for k in ['@type','name','image','sameAs','identifier','priceRange','owns','practicesAt','workLocation','address']},
              'clinic':{k:clinic.get(k) for k in ['@type','name','logo','image','priceRange','owner','founder','address','geo','telephone','openingHoursSpecification','openingHours']},
              'courses':courses,'events':events,'scholarlyArticles':articles,'countries':countries,
              'imageObjects':{'count':len(images),'missingPropertyCounts':{prop:sum(prop in x['missing'] for x in images) for prop in ['name','contentUrl','license','creditText','copyrightNotice','acquireLicensePage']},'itemsWithMissing':[x for x in images if x['missing']][:50]},
            },
            'media':{'count':len(media),'totalBytes':sum(x['bytes'] for x in media),'items':media,'orphanCandidates':orphan_media},
            'hygiene':{
              'hasRealGitignore':(root/'.gitignore').exists(),'hasMisnamedGitignore':(root/'gitignore.txt').exists(),
              'hasDotNodeVersion':(root/'.node-version').exists(),'hasMisnamedNodeVersion':(root/'node-version.txt').exists(),
              'workflowCount':len(text(outdir/'workflows.txt').splitlines()),'tmpFileCount':len(text(outdir/'tmp-files.txt').splitlines()),
            }
          }
          (outdir/'source-audit.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
          PY

          targets=(
            'root|https://www.ghezelbaash.ir/'
            'apex|https://ghezelbaash.ir/'
            'http|http://www.ghezelbaash.ir/'
            'index|https://www.ghezelbaash.ir/index.html'
            'graph|https://www.ghezelbaash.ir/graph.jsonld'
            'ttl|https://www.ghezelbaash.ir/graph.ttl'
            'robots|https://www.ghezelbaash.ir/robots.txt'
            'sitemap|https://www.ghezelbaash.ir/sitemap.xml'
            'favicon|https://www.ghezelbaash.ir/favicon.svg'
            'portrait|https://www.ghezelbaash.ir/media/images/physician/master/saeed-ghezelbaash-physician-portrait.jpg'
            'office|https://www.ghezelbaash.ir/media/images/physician/master/saeed-ghezelbaash-in-clinical-office.jpg'
            'notfound|https://www.ghezelbaash.ir/__deep-audit-not-found__'
            'services|https://www.ghezelbaash.ir/services/'
            'contact|https://www.ghezelbaash.ir/contact/'
            'subcision|https://www.ghezelbaash.ir/subcision-kermanshah/'
            'pagesdev|https://doctor-ghezelbaash.pages.dev/'
          )
          : > tmp/deep-current-state/http/index.tsv
          for pair in "${targets[@]}"; do
            name=${pair%%|*}; url=${pair#*|}
            curl -sS --compressed --max-time 45 -L -D "tmp/deep-current-state/http/${name}.headers" -o "tmp/deep-current-state/http/${name}.body" -w '%{http_code}\t%{url_effective}\t%{size_download}\t%{time_total}\n' "$url" > "tmp/deep-current-state/http/${name}.meta" || true
            printf '%s\t%s\n' "$name" "$url" >> tmp/deep-current-state/http/index.tsv
          done

          video=$(find public/media/videos -type f -name '*.mp4' | sort | head -n1 || true)
          if [ -n "$video" ]; then
            rel=${video#public/}
            curl -sS --max-time 45 -H 'Range: bytes=0-1023' -D tmp/deep-current-state/http/video-range.headers -o tmp/deep-current-state/http/video-range.body "https://www.ghezelbaash.ir/${rel}" || true
            printf '%s\n' "$rel" > tmp/deep-current-state/http/video-range.path
          fi

          python3 - <<'PY'
          from pathlib import Path
          import json,re
          root=Path('tmp/deep-current-state/http')
          rows={}
          for line in (root/'index.tsv').read_text().splitlines():
              name,url=line.split('\t',1)
              meta=(root/f'{name}.meta').read_text(errors='replace').strip().split('\t')
              h=(root/f'{name}.headers').read_text(errors='replace')
              b=(root/f'{name}.body').read_bytes()
              blocks=[x for x in re.split(r'\r?\n\r?\n',h) if x.strip()]
              last=blocks[-1] if blocks else h
              headers={}
              statusLine=''
              for i,line2 in enumerate(last.splitlines()):
                  if i==0:statusLine=line2;continue
                  if ':' in line2:
                      k,v=line2.split(':',1);headers.setdefault(k.lower().strip(),[]).append(v.strip())
              rows[name]={
                'requestedUrl':url,'httpCode':int(meta[0]) if meta and meta[0].isdigit() else None,'effectiveUrl':meta[1] if len(meta)>1 else None,
                'downloadBytes':int(meta[2]) if len(meta)>2 and meta[2].isdigit() else len(b),'seconds':float(meta[3]) if len(meta)>3 else None,
                'statusLine':statusLine,'headers':headers,'bodySha256':__import__('hashlib').sha256(b).hexdigest(),'bodyPrefix':b[:300].decode('utf-8','replace')
              }
          vr={}
          hp=root/'video-range.headers'
          if hp.exists():
              h=hp.read_text(errors='replace');vr={'path':(root/'video-range.path').read_text().strip(),'statusLine':h.splitlines()[0] if h.splitlines() else '', 'headers':h}
          out={'targets':rows,'videoRange':vr}
          Path('tmp/deep-current-state/live-http.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          PY

      - name: Run repeated Lighthouse audits
        run: |
          set +e
          for mode in mobile desktop; do
            for run in 1 2; do
              args=''
              [ "$mode" = desktop ] && args='--preset=desktop'
              npx --yes lighthouse@latest https://www.ghezelbaash.ir/ $args \
                --output=json --output-path="tmp/deep-current-state/lighthouse/${mode}-${run}.json" \
                --only-categories=performance,accessibility,best-practices,seo \
                --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage' --quiet
            done
          done
          exit 0

      - name: Consolidate audit and recommendations
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,statistics
          base=Path('tmp/deep-current-state')
          source=json.loads((base/'source-audit.json').read_text())
          live=json.loads((base/'live-http.json').read_text())
          lighthouse={'modes':{}}
          for mode in ('mobile','desktop'):
              rows=[]
              for p in sorted((base/'lighthouse').glob(f'{mode}-*.json')):
                  try:
                      d=json.loads(p.read_text());a=d['audits'];c=d['categories']
                      failed=[]
                      for k,v in a.items():
                          score=v.get('score')
                          if isinstance(score,(int,float)) and score<1 and v.get('scoreDisplayMode') not in ('notApplicable','manual','informative'):
                              failed.append({'id':k,'score':score,'displayValue':v.get('displayValue'),'title':v.get('title')})
                      req=a.get('network-requests',{}).get('details',{}).get('items',[])
                      rows.append({
                        'performance':round(c['performance']['score']*100),'accessibility':round(c['accessibility']['score']*100),
                        'bestPractices':round(c['best-practices']['score']*100),'seo':round(c['seo']['score']*100),
                        'fcp':a['first-contentful-paint']['numericValue'],'lcp':a['largest-contentful-paint']['numericValue'],
                        'tbt':a['total-blocking-time']['numericValue'],'cls':a['cumulative-layout-shift']['numericValue'],
                        'speedIndex':a['speed-index']['numericValue'],'mainthread':a['mainthread-work-breakdown']['numericValue'],
                        'failedAudits':failed[:30],
                        'cloudflareAnalyticsRequests':[x.get('url') for x in req if 'cloudflareinsights' in x.get('url','') or 'static.cloudflareinsights.com' in x.get('url','')],
                      })
                  except Exception as e: rows.append({'error':repr(e),'file':p.name})
              good=[x for x in rows if 'error' not in x]
              med={}
              if good:
                  for k in ('performance','fcp','lcp','tbt','cls','speedIndex','mainthread'):med[k]=statistics.median(x[k] for x in good)
              lighthouse['modes'][mode]={'runs':rows,'median':med}

          issues=[]
          def add(sev,area,msg,evidence=None):issues.append({'severity':sev,'area':area,'message':msg,'evidence':evidence})
          h=source['hygiene'];b=source['build'];g=source['graphs'];c=source['csp']
          if h['workflowCount']>1:add('high','repository','Multiple one-shot workflows remain in production source',source['git']['workflows'])
          if h['tmpFileCount']>0:add('medium','repository','Temporary/audit files remain tracked or present',source['git']['tmpFiles'])
          if h['hasMisnamedGitignore'] and not h['hasRealGitignore']:add('high','repository','gitignore.txt is not an active .gitignore')
          if h['hasMisnamedNodeVersion'] and not h['hasDotNodeVersion']:add('medium','toolchain','node-version.txt may not be consumed by all build systems')
          if b['inlineStyleAttributes']:add('high','csp','Inline style attributes force style-src-attr unsafe-inline',len(b['inlineStyleAttributes']))
          if b['externalScripts']:add('high','performance-security','External scripts are present',b['externalScripts'])
          if c['directives'].get('style-src-attr')==["'unsafe-inline'"]:add('high','csp','style-src-attr still allows unsafe-inline')
          if c['directives'].get('connect-src') not in (["'none'"],[]):add('medium','csp','connect-src is broader than necessary',c['directives'].get('connect-src'))
          if b['htmlBytes']>=1900000:add('critical','crawl-budget','HTML exceeds 1.90 MB safety gate',b['htmlBytes'])
          if b['duplicateIds']:add('critical','html','Duplicate ids',b['duplicateIds'])
          if b['brokenFragments']:add('critical','html','Broken internal fragments',b['brokenFragments'])
          if not g['rdfIsomorphic']:add('critical','graph','JSON-LD and Turtle are not RDF-isomorphic')
          if not g['headIdSubset']:add('critical','graph','Head graph has ids absent from Full Graph',g['headMissingIds'])
          if g.get('headRdfSubset') is False:add('high','graph','Head RDF contains triples absent from Full Graph')
          if g['unresolvedInternalIds']:add('high','graph','Unresolved first-party @id references',g['unresolvedInternalIds'])
          for art in g['scholarlyArticles']:
              if art['missing']:add('medium','schema','ScholarlyArticle recommended/required properties missing',art)
          for ev in g['events']:
              if ev['missing']:add('medium','schema','Event/CourseInstance properties missing',ev)
          io=g['imageObjects']['missingPropertyCounts']
          if any(io.values()):add('medium','schema','ImageObject licensing/credit coverage is incomplete',io)
          old={k:v for k,v in live['targets'].items() if k in ('services','contact','subcision') and v.get('httpCode')==200}
          if old:add('critical','routing','Legacy WordPress URLs still return HTTP 200',old)
          pages=live['targets'].get('pagesdev',{})
          if pages.get('httpCode')==200 and 'noindex' not in ' '.join(pages.get('headers',{}).get('x-robots-tag',[])).lower():add('high','canonical','pages.dev remains indexable',pages)
          for mode,m in lighthouse['modes'].items():
              if m['median'].get('performance',100)<100:add('medium','performance',f'{mode} Lighthouse median below 100',m['median'])
          report={'source':source,'live':live,'lighthouse':lighthouse,'issues':issues}
          (base/'deep-current-state-audit.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')

          lines=['# Deep Current-State Audit','',f"Commit: `{source['git']['commit']}`",'',f"Tracked files: {source['git']['trackedFileCount']}",f"Workflows: {source['hygiene']['workflowCount']}",f"HTML bytes: {source['build']['htmlBytes']}",f"Full/Head nodes: {g['fullNodes']} / {g['headNodes']}",f"RDF triples: {g['jsonLdTriples']}",'','## Findings']
          for x in issues:lines.append(f"- **{x['severity'].upper()} · {x['area']}** — {x['message']}")
          lines+=['','## Lighthouse']
          for mode,m in lighthouse['modes'].items():lines.append(f"- {mode}: `{m['median']}`")
          (base/'deep-current-state-audit.md').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          PY
          rm -rf tmp/deep-current-state/lighthouse

      - name: Commit audit report and remove temporary workflow
        if: always()
        run: |
          set -euo pipefail
          git config user.name 'OpenAI Project Automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/deep-current-state-audit.yml
          git add tmp/deep-current-state/deep-current-state-audit.json tmp/deep-current-state/deep-current-state-audit.md tmp/deep-current-state/source-audit.json tmp/deep-current-state/live-http.json
          git commit -m 'Record deep current-state source and live audit'
          git pull --rebase origin main
          git push origin HEAD:main

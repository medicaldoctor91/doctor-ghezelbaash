name: Publish Wikiversity learning resource

on:
  push:
    branches: [main]
    paths:
      - 'wikiversity/resources/facial-assessment-before-aesthetic-botulinum-toxin-treatment.wiki'
      - 'scripts/wikiversity_publish.py'
      - '.github/workflows/wikiversity-publish.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wikiversity-facial-assessment-resource
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      WIKIVERSITY_API_URL: https://en.wikiversity.org/w/api.php
      WIKIVERSITY_PAGE_TITLE: Facial assessment before aesthetic botulinum toxin treatment
      WIKIVERSITY_PAGE_FILE: wikiversity/resources/facial-assessment-before-aesthetic-botulinum-toxin-treatment.wiki
      WIKIVERSITY_CREATE_ONLY: 'true'
      WIKIVERSITY_EDIT_SUMMARY: 'Create evidence-based learning resource on structured facial assessment before aesthetic botulinum toxin treatment'
      WIKIVERSITY_USERNAME: ${{ secrets.WIKIVERSITY_USERNAME }}
      WIKIVERSITY_BOT_PASSWORD: ${{ secrets.WIKIVERSITY_BOT_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14.6'
      - name: Install publisher dependency
        run: python -m pip install --disable-pip-version-check --no-input requests==2.32.5
      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$WIKIVERSITY_USERNAME"
          test -n "$WIKIVERSITY_BOT_PASSWORD"
      - name: Publish, verify, and persist exact read-back result
        shell: bash
        run: |
          mkdir -p wikimedia
          set +e
          python scripts/wikiversity_publish.py > wikimedia/_tmp-wikiversity-facial-assessment-publish.json 2>&1
          code=$?
          echo >> wikimedia/_tmp-wikiversity-facial-assessment-publish.json
          echo "EXIT_CODE=$code" >> wikimedia/_tmp-wikiversity-facial-assessment-publish.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add wikimedia/_tmp-wikiversity-facial-assessment-publish.json
          git commit -m 'Record temporary Wikiversity facial assessment publish result' || true
          git push
          exit $code

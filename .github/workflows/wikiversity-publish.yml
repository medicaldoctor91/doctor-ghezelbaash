name: Publish Wikiversity learning resource

on:
  push:
    branches: [main]
    paths:
      - 'wikiversity/resources/botulinum-toxin-in-aesthetic-medicine.wiki'
      - 'scripts/wikiversity_publish.py'
      - '.github/workflows/wikiversity-publish.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wikiversity-botulinum-toxin-resource
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      WIKIVERSITY_API_URL: https://en.wikiversity.org/w/api.php
      WIKIVERSITY_PAGE_TITLE: Botulinum toxin in aesthetic medicine
      WIKIVERSITY_PAGE_FILE: wikiversity/resources/botulinum-toxin-in-aesthetic-medicine.wiki
      WIKIVERSITY_CREATE_ONLY: 'false'
      WIKIVERSITY_EDIT_SUMMARY: 'Correct provenance to the live canonical Botox section on the official website and remove the dead standalone source URL'
      WIKIVERSITY_USERNAME: ${{ secrets.WIKIVERSITY_USERNAME }}
      WIKIVERSITY_BOT_PASSWORD: ${{ secrets.WIKIVERSITY_BOT_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install publisher dependency
        run: python -m pip install --disable-pip-version-check --no-input requests==2.32.5
      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$WIKIVERSITY_USERNAME"
          test -n "$WIKIVERSITY_BOT_PASSWORD"
      - name: Publish and verify resource on English Wikiversity
        run: python scripts/wikiversity_publish.py

name: Align HF organization card and collection note
on:
  push:
    branches: [maintenance/hf-profile-collection-alignment-20261018]
    paths:
      - .github/workflows/hf-collection-alignment-20261018.yml
permissions:
  contents: read
jobs:
  align:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install HF API
        run: python -m pip install --disable-pip-version-check huggingface_hub==0.36.2
      - name: Update collection note and verify organization README
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import os, hashlib, json, tempfile
          from pathlib import Path
          from huggingface_hub import HfApi, hf_hub_download, CommitOperationAdd
          api=HfApi(token=os.environ['HF_TOKEN'])
          old='https://www.ghezelbaash.ir/graph.jsonld#dataset'
          new='https://www.ghezelbaash.ir/graph.jsonld/dataset'
          clinic_old='https://www.ghezelbaash.ir/#dr-saeed-ghezelbash-aesthetic-clinic-kermanshah'
          clinic_new='https://www.ghezelbaash.ir/dr-saeed-ghezelbash-aesthetic-clinic-kermanshah'
          repo='doctor-ghezelbaash/README'
          ri=api.space_info(repo)
          prev=ri.sha
          src=Path(hf_hub_download(repo,filename='README.md',repo_type='space',revision=prev,token=os.environ['HF_TOKEN']))
          content=src.read_text(encoding='utf-8')
          fixed=content.replace(old,new).replace(clinic_old,clinic_new).replace('A5064828898','A5146521397')
          assert old not in fixed and clinic_old not in fixed and 'Medical Director' not in fixed
          if fixed!=content:
              with tempfile.TemporaryDirectory() as d:
                  p=Path(d)/'README.md'
                  p.write_text(fixed,encoding='utf-8')
                  commit=api.create_commit(repo,repo_type='space',revision='main',parent_commit=prev,operations=[CommitOperationAdd(path_in_repo='README.md',path_or_fileobj=str(p))],commit_message='Fix org README machine-readable identity pointers')
                  target_revision=commit.oid
          else:
              target_revision=prev
          live=Path(hf_hub_download(repo,filename='README.md',repo_type='space',revision=target_revision,token=os.environ['HF_TOKEN'],force_download=True)).read_text(encoding='utf-8')
          assert fixed==live,'Organization README public revision mismatch'
          print('HF_ORG_README_PASS',target_revision,'changed',fixed!=content,flush=True)

          slug='Ghezelbaash/dr-saeed-ghezelbash-entity-knowledge-graph'
          c=api.get_collection(slug)
          records=[item for item in c.items if item.item_id=='doctor-ghezelbaash/dr-saeid-ghezelbaash-entity-data']
          assert len(records)==1,('Matching collection dataset item',len(records))
          item=records[0]
          note=item.note or ''
          expected=note.replace(old,new).replace('A5064828898','A5146521397')
          assert 'Q140287622' in expected and new in expected
          assert len(expected)<=500
          if expected!=note:
              api.update_collection_item(collection_slug=slug,item_object_id=item.item_object_id,note=expected)
          updated=api.get_collection(slug)
          item_live=next(x for x in updated.items if x.item_object_id==item.item_object_id)
          assert (item_live.note or '')==expected and old not in item_live.note
          print('HF_COLLECTION_NOTE_PASS',slug,'changed',expected!=note,'note',expected,flush=True)
          PY

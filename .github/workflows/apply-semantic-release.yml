name: Apply semantic identity release

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-semantic-release.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install RDF validator
        run: python -m pip install --disable-pip-version-check 'rdflib==7.1.4'

      - name: Decode deterministic release scripts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ghezelbaash-release
          cat .github/release-bundle/part-* | base64 --decode | tar -xzf - -C /tmp/ghezelbaash-release
          python -m py_compile /tmp/ghezelbaash-release/*.py

      - name: Apply Full Graph, Head projection, visible image semantics and machine surfaces
        shell: bash
        run: |
          set -euo pipefail
          python /tmp/ghezelbaash-release/transform_graph.py
          python /tmp/ghezelbaash-release/transform_head.py
          python /tmp/ghezelbaash-release/patch_site_files.py
          python /tmp/ghezelbaash-release/regenerate_ttl.py

      - name: Validate release invariants
        shell: bash
        run: |
          set -euo pipefail
          python -m json.tool public/graph.jsonld >/dev/null
          python -m json.tool src/data/semantic/head-graph.min.jsonld >/dev/null
          python -m json.tool public/site.webmanifest >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          from rdflib import Graph
          full=json.loads(Path('public/graph.jsonld').read_text(encoding='utf-8'))
          head=json.loads(Path('src/data/semantic/head-graph.min.jsonld').read_text(encoding='utf-8'))
          for label,data in [('full',full),('head',head)]:
              ids=[n.get('@id') for n in data['@graph'] if isinstance(n,dict) and n.get('@id')]
              assert len(ids)==len(set(ids)), f'duplicate @id in {label}'
          full_ids={n.get('@id') for n in full['@graph'] if isinstance(n,dict) and n.get('@id')}
          head_ids={n.get('@id') for n in head['@graph'] if isinstance(n,dict) and n.get('@id')}
          missing=head_ids-full_ids
          assert not missing, f'Head nodes absent from Full Graph: {sorted(missing)}'
          person='https://www.ghezelbaash.ir/#saeed-ghezelbash'
          clinic='https://www.ghezelbaash.ir/#dr-saeed-ghezelbash-aesthetic-clinic-kermanshah'
          assert person in full_ids and clinic in full_ids
          g=Graph().parse('public/graph.jsonld',format='json-ld')
          ttl=Graph().parse('public/graph.ttl',format='turtle')
          assert len(g)==len(ttl), (len(g),len(ttl))
          print('full_nodes',len(full_ids),'head_nodes',len(head_ids),'rdf_triples',len(g))
          print('full_bytes',Path('public/graph.jsonld').stat().st_size)
          print('head_bytes',Path('src/data/semantic/head-graph.min.jsonld').stat().st_size)
          PY
          grep -q 'دکتر سعید قزلباش، پزشک ایرانی' src/pages/index.md
          grep -q 'سعید قزلباش در محیط بالینی' src/pages/index.md
          grep -q 'سعید قزلباش همراه اعضای تیم بالینی' src/pages/index.md
          ! grep -q 'در حال معاینه بالینی مراجعه‌کننده' src/pages/index.md
          git diff --check

      - name: Commit release and remove one-shot machinery
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/apply-semantic-release.yml
          git rm -r .github/release-bundle
          rm -f tmp/identity-assets-metadata.json
          git add -A
          git commit -m 'Upgrade physician identity graph, image provenance, Head schema, and delivery metadata'
          git push origin HEAD:main

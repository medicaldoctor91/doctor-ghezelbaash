name: Final solo-practice convergence
on:
  push:
    branches: [ops/solo-practice-final-convergence-20261016]
    paths: [.github/workflows/solo-practice-final-convergence.yml]
permissions:
  contents: read
concurrency:
  group: doctor-ghezelbaash-platform-convergence
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TARGET_SOURCE_COMMIT: 8add18833694baaa7047d0ace8e97dee4460fbbb
      EXPECTED_HF_REVISION: 45bc20d21be4eaa1e25b1798e9aff0e53243417a
      EXPECTED_KAGGLE_VERSION: '11'
      PUBLICATION_MAINTENANCE_DATE: '2026-10-16'
      HF_TOKEN: ${{ secrets.HF_TOKEN || secrets.HUGGINGFACE_TOKEN || secrets.HUGGING_FACE_TOKEN }}
      ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN || secrets.ZENODO_ACCESS_TOKEN || secrets.ZENODO_API_TOKEN || secrets.ZENODO_API_KEY || secrets.ZENODO_PAT }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN || secrets.KAGGLE_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 884d1d90bd1fb6ecca14992c6c60d677
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 8add18833694baaa7047d0ace8e97dee4460fbbb
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: {node-version-file: .nvmrc, cache: npm}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Verify immutable source and existing credential bindings
        run: |
          test "$(git rev-parse HEAD)" = "$TARGET_SOURCE_COMMIT"
          python - <<'PY'
          import os
          required=['HF_TOKEN','ZENODO_TOKEN','KAGGLE_API_TOKEN','CLOUDFLARE_API_TOKEN']
          assert all(os.environ.get(k) for k in required), 'An existing publication binding is missing'
          print('Source and four existing credential bindings verified')
          PY
      - name: Install locked build and publication dependencies
        run: |
          npm ci --no-audit --no-fund
          python -m pip install --disable-pip-version-check 'huggingface_hub==0.36.2' 'pyarrow==22.0.0' 'kaggle>=2.2,<3' 'rdflib==7.6.0' 'pyshacl==0.40.1' 'mlcroissant==1.1.1'
      - name: Validate source and produce the current canonical distribution
        run: |
          export GITHUB_SHA="$TARGET_SOURCE_COMMIT"
          node --test tests/*.test.mjs
          python tests/platform-bundle-sync.test.py
          python tests/platform-publication.test.py
          npm run build
          python - <<'PY'
          from pathlib import Path
          import shutil
          path=Path('dist/.prerender')
          assert path.resolve()==Path.cwd()/'dist/.prerender'
          if path.is_dir():shutil.rmtree(path)
          PY
          node build/seal-release.mjs dist
          python tests/validate_platform_bundle.py dist --no-query --rdf
          python tests/validate_machine_resources.py dist
      - name: Deploy and verify actual website bytes
        run: |
          export GITHUB_SHA="$TARGET_SOURCE_COMMIT"
          npx --yes wrangler@4 pages deploy dist --project-name=doctor-ghezelbaash --branch=main --commit-hash="$TARGET_SOURCE_COMMIT" --commit-message='Complete physician-owned solo-practice correction' --commit-dirty=false
          python - <<'PY'
          import hashlib,json,os,time,urllib.request
          from pathlib import Path
          origin='https://www.ghezelbaash.ir/'
          def fetch(path):
              req=urllib.request.Request(origin+path,headers={'Cache-Control':'no-cache'})
              return urllib.request.urlopen(req,timeout=60).read()
          for attempt in range(30):
              live=json.loads(fetch('release-provenance.json?verify='+os.environ['TARGET_SOURCE_COMMIT']+'-'+str(attempt)))
              if live.get('sourceCommit')==os.environ['TARGET_SOURCE_COMMIT']:break
              time.sleep(5)
          else:raise RuntimeError('Published website did not converge to the immutable source')
          for name in ['graph.jsonld','graph.ttl','provenance.jsonld','shapes.ttl','doctor.vcf','clinic.vcf','dcat.ttl','void.ttl','datapackage.json','croissant.json','integrity-manifest.json']:
              assert hashlib.sha256(fetch(name)).digest()==hashlib.sha256((Path('dist')/name).read_bytes()).digest(),name
          assert hashlib.sha256(fetch('data-catalog')).digest()==hashlib.sha256((Path('dist')/'graph.jsonld').read_bytes()).digest()
          print('PUBLISHED_WEBSITE_BYTES_PASS')
          PY
      - name: Publish HF, correct the same Zenodo DOIs, and update Kaggle
        run: |
          export GITHUB_SHA="$TARGET_SOURCE_COMMIT"
          python .github/scripts/platform_publish.py
      - name: Preserve publication and validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: solo-practice-final-convergence-evidence
          path: |
            /tmp/platform-publish/context.json
            /tmp/platform-publish/publication-report.json
            /tmp/platform-publish/*validation.json
          if-no-files-found: warn

name: Inspect Zenodo draft bridge without changing published files
on:
  push:
    branches: [ops/solo-practice-final-convergence-20261016]
    paths: [.github/workflows/solo-practice-final-convergence.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN || secrets.ZENODO_ACCESS_TOKEN || secrets.ZENODO_API_TOKEN || secrets.ZENODO_API_KEY || secrets.ZENODO_PAT }}
    steps:
      - name: Inspect approved correction draft and discard it without file writes
        run: |
          python - <<'PY'
          import json,os,time,urllib.request,urllib.error
          base='https://zenodo.org/api'
          token=os.environ['ZENODO_TOKEN']
          def request(method,path,payload=None):
              data=json.dumps(payload).encode() if payload is not None else (b'' if method=='POST' else None)
              req=urllib.request.Request(base+path,data=data,method=method,headers={'Authorization':'Bearer '+token,'Content-Type':'application/json','Accept':'application/json','Cache-Control':'no-cache, no-store, max-age=0','Pragma':'no-cache'})
              try:
                  with urllib.request.urlopen(req,timeout=120) as r:
                      body=r.read()
                      return r.status,json.loads(body) if body else {}
              except urllib.error.HTTPError as e:
                  return e.code,{'error':e.read().decode(errors='replace').replace(token,'[redacted]')[:500]}
          def state(label):
              for endpoint in ['/records/23289009/draft','/deposit/depositions/23289009']:
                  status,value=request('GET',endpoint+'?_cb='+str(time.time_ns()))
                  print(label,endpoint,json.dumps({'status':status,'submitted':value.get('submitted'),'state':value.get('state'),'is_published':value.get('is_published'),'is_draft':value.get('is_draft'),'links':list(value.get('links',{})),'files':len(value.get('files',[])) if isinstance(value.get('files'),list) else None,'error':value.get('error')},ensure_ascii=False),flush=True)
          state('before')
          status,value=request('GET','/records/23289009/draft')
          assert status==404, 'An unpublished draft already exists; no changes made'
          created=False
          try:
              status,value=request('POST','/records/23289009/draft')
              assert status in (200,201,202),status
              created=True
              status,value=request('POST','/records/23289009/file-modification',{'reason':'correction','comment':'Diagnose the legacy draft bridge for an in-place source correction; no file writes and no DOI/version changes.'})
              print('approval_status',status,flush=True)
              assert status==200
              for i in range(3):
                  state('approved-'+str(i))
                  if i<2:time.sleep(5)
          finally:
              if created:
                  status,value=request('DELETE','/records/23289009/draft')
                  print('discard_status',status,flush=True)
                  assert status in (200,202,204)
          state('after')
          PY

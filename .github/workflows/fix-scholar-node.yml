name: Complete Scholar identifier node migration

on:
  push:
    branches: [repair-clean-graph-2026-07-30]
    paths: ['.github/workflows/fix-scholar-node.yml']

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair-clean-graph-2026-07-30
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --quiet rdflib
      - name: Insert canonical Scholar node and regenerate RDF projection
        shell: bash
        run: |
          python - <<'PY'
          import base64, hashlib, json, re
          from pathlib import Path
          from rdflib import Graph

          scholar_id = 'https://www.ghezelbaash.ir/#identifier-person-google-scholar'
          scholar_url = 'https://scholar.google.com/citations?user=BcWBirUAAAAJ'
          scholar = {
              '@id': scholar_id,
              '@type': 'PropertyValue',
              'propertyID': 'Google Scholar Author ID',
              'value': 'BcWBirUAAAAJ',
              'url': scholar_url,
          }

          def update(path):
              p = Path(path)
              doc = json.loads(p.read_text(encoding='utf-8'))
              graph = doc['@graph']
              graph[:] = [node for node in graph if not (isinstance(node, dict) and node.get('@id') == scholar_id)]
              after = next((i for i, node in enumerate(graph) if isinstance(node, dict) and node.get('@id') == 'https://www.ghezelbaash.ir/#identifier-person-openalex'), len(graph) - 1)
              graph.insert(after + 1, scholar.copy())
              text = json.dumps(doc, ensure_ascii=False, separators=(',', ':'))
              p.write_text(text, encoding='utf-8')
              return text

          full = update('public/graph.jsonld')
          head = update('src/data/semantic/head-graph.min.jsonld')

          rdf = Graph().parse(data=full, format='json-ld')
          turtle = rdf.serialize(format='turtle')
          nt = rdf.serialize(format='nt')
          canonical_nt = '\n'.join(sorted(line for line in nt.splitlines() if line.strip())) + '\n'
          header = (
              '# Derived losslessly from https://www.ghezelbaash.ir/graph.jsonld\n'
              f'# Source SHA-256: {hashlib.sha256(full.encode()).hexdigest()}\n'
              f'# RDF triples: {len(rdf)}\n'
              f'# Canonical sorted N-Triples SHA-256: {hashlib.sha256(canonical_nt.encode()).hexdigest()}\n\n'
          )
          Path('public/graph.ttl').write_text(header + turtle.lstrip(), encoding='utf-8')

          headers = Path('public/_headers').read_text(encoding='utf-8')
          digest = "'sha256-" + base64.b64encode(hashlib.sha256(head.encode()).digest()).decode() + "'"
          headers, count = re.subn(r"(script-src 'self')(?: 'sha256-[A-Za-z0-9+/=]+')*(;)", rf"\1 {digest}\2", headers, count=1)
          if count != 1:
              raise SystemExit('CSP script-src was not updated')
          Path('public/_headers').write_text(headers, encoding='utf-8')
          PY
          rm .github/workflows/fix-scholar-node.yml
      - name: Commit completed source graph
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Complete Scholar node in full and head graphs'
          git push origin HEAD:repair-clean-graph-2026-07-30

name: One-time Content-Digest final production deploy
on:
  push:
    branches:
      - content-digest-finalization
permissions:
  contents: write
concurrency:
  group: doctor-ghezelbaash-content-digest-final
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 884d1d90bd1fb6ecca14992c6c60d677
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: true}
      - name: Remove one-time workflow and establish final branch SHA
        run: |
          git config user.name 'Dr. Saeed Ghezelbash | Content-Digest final deploy'
          git config user.email 'medicaldoctor91@gmail.com'
          git rm .github/workflows/content-digest-final-deploy.yml
          git commit -m 'Remove one-time Content-Digest final deployment workflow'
          git push origin HEAD:content-digest-finalization
          echo "DEPLOY_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with: {node-version-file: .nvmrc, cache: npm}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install validators
        run: |
          npm ci
          python -m pip install --disable-pip-version-check 'rdflib>=7,<8' 'pyshacl>=0.30,<1' 'mlcroissant==1.1.1'
      - name: Validate final clean branch and build release
        run: |
          node --test tests/*.test.mjs
          npm run build
          python tests/validate_platform_bundle.py dist --no-query --rdf
          python tests/validate_machine_resources.py dist
          python tests/validate_canonical_invariants.py dist
      - name: Deploy final validated release
        run: |
          npx --yes wrangler@4 pages deploy dist --project-name=doctor-ghezelbaash --branch=main --commit-hash="$DEPLOY_SHA" --commit-message='Finalize verified Content-Digest delivery' --commit-dirty=false
      - name: Verify production bytes and Content-Digest headers
        run: |
          python - <<'PY'
          import hashlib,json,os,time,urllib.request
          from pathlib import Path
          origin='https://www.ghezelbaash.ir/'
          sha=os.environ['DEPLOY_SHA']
          def open_live(path):
              sep='&' if '?' in path else '?'
              url=origin+path.lstrip('/')+sep+'verify='+sha
              req=urllib.request.Request(url,headers={'Cache-Control':'no-cache','Pragma':'no-cache','Accept-Encoding':'identity'})
              return urllib.request.urlopen(req,timeout=60)
          def fetch(path):
              with open_live(path) as response:return response.read()
          for attempt in range(24):
              live=json.loads(fetch('release-provenance.json?attempt='+str(attempt)))
              if live.get('sourceCommit')==sha:break
              time.sleep(5)
          else:raise RuntimeError('Published release did not converge to '+sha)
          for name in ['graph.jsonld','graph.ttl','shapes.ttl','doctor.vcf','clinic.vcf','dcat.ttl','void.ttl','datapackage.json','croissant.json','integrity-manifest.json','content-digest-eligibility.json']:
              assert hashlib.sha256(fetch(name)).digest()==hashlib.sha256((Path('dist')/name).read_bytes()).digest(),name
          eligibility=json.loads((Path('dist')/'content-digest-eligibility.json').read_text())
          assert eligibility['status']=='configured-for-cloudflare-pages'
          assert eligibility['algorithm']=='sha-256'
          assert 0 < len(eligibility['eligible']) <= 100
          verified=0
          for resource,expected in eligibility['eligible'].items():
              with open_live(resource) as response:
                  header=response.headers.get('Content-Digest')
                  assert header==expected['contentDigest'],(resource,header,expected['contentDigest'])
                  digest=hashlib.sha256();size=0
                  while True:
                      chunk=response.read(1024*1024)
                      if not chunk:break
                      size+=len(chunk);digest.update(chunk)
              assert size==expected['bytes'],(resource,size,expected['bytes'])
              assert digest.hexdigest()==expected['sha256'],resource
              verified+=1
          print(json.dumps({'sourceCommit':sha,'contentDigestVerified':verified,'status':'PASS'}))
          PY

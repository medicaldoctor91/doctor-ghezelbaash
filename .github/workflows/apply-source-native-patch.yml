name: Apply source-native forensic corrections

on:
  push:
    branches:
      - fix/schemaorg-v30-conformance-20260903
    paths:
      - .github/workflows/apply-source-native-patch.yml

permissions:
  contents: write

concurrency:
  group: apply-source-native-forensic-corrections
  cancel-in-progress: false

jobs:
  apply-validate-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/schemaorg-v30-conformance-20260903
          fetch-depth: 0
      - name: Apply the reviewed source-native correction set
        shell: bash
        run: |
          set -euo pipefail
          git apply --check .github/forensic-source-native.patch
          git apply .github/forensic-source-native.patch
          rm .github/forensic-source-native.patch
          rm .github/workflows/apply-source-native-patch.yml
          git diff --check
          actual="$(git diff --name-only HEAD | LC_ALL=C sort)"
          expected="$(cat <<'EOF' | LC_ALL=C sort
          .github/forensic-source-native.patch
          .github/workflows/apply-source-native-patch.yml
          scripts/huggingface.mjs
          scripts/materialize-static-artifacts.mjs
          scripts/validate-architecture.mjs
          scripts/validate-dist.mjs
          scripts/validate-google-structured-data.mjs
          scripts/validate-release-transaction.mjs
          scripts/validate-schemaorg-vocabulary.mjs
          scripts/verify-production.mjs
          EOF
          )"
          test "$actual" = "$expected" || {
            printf 'Unexpected patch surface.\nExpected:\n%s\nActual:\n%s\n' "$expected" "$actual"
            exit 1
          }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14.6"
      - name: Provision media validation tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg
          ffprobe -version
      - run: npm ci
      - run: npm run security:dependencies
      - name: Run the complete release pipeline
        run: npm run release
      - name: Validate rendered HTML
        run: npx --yes --package=vnu-jar@26.8.30 vnu --errors-only dist/index.html dist/404.html
      - name: Validate rendered Schema.org 30.0 vocabulary
        run: npm run validate:schemaorg-vocabulary
      - name: Commit only the validated native sources
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git diff --name-only HEAD | LC_ALL=C sort)"
          expected="$(cat <<'EOF' | LC_ALL=C sort
          .github/forensic-source-native.patch
          .github/workflows/apply-source-native-patch.yml
          scripts/huggingface.mjs
          scripts/materialize-static-artifacts.mjs
          scripts/validate-architecture.mjs
          scripts/validate-dist.mjs
          scripts/validate-google-structured-data.mjs
          scripts/validate-release-transaction.mjs
          scripts/validate-schemaorg-vocabulary.mjs
          scripts/verify-production.mjs
          EOF
          )"
          test "$actual" = "$expected"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: absorb routing and validation corrections natively"
          git push origin HEAD:fix/schemaorg-v30-conformance-20260903

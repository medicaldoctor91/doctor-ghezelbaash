name: Apply source-native forensic corrections

on:
  push:
    branches:
      - fix/schemaorg-v30-conformance-20260903
    paths:
      - .github/workflows/apply-source-native-patch.yml

permissions:
  contents: write

concurrency:
  group: apply-source-native-forensic-corrections
  cancel-in-progress: false

jobs:
  apply-validate-push:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/schemaorg-v30-conformance-20260903
          fetch-depth: 0
      - name: Apply and locally commit the reviewed source-native correction set
        shell: bash
        run: |
          set -euo pipefail
          git apply --check .github/forensic-source-native.patch
          git apply .github/forensic-source-native.patch
          python3 - <<'PY'
          from pathlib import Path

          dist_validator = Path("scripts/validate-dist.mjs")
          lines = dist_validator.read_text(encoding="utf-8").splitlines()
          replacement = r'''  !/<a\b[^>]*\bhref=["']\/["'][^>]*>\s*بازگشت به صفحه اصلی\s*<\/a>/i.test('''
          matches = [
              index
              for index, line in enumerate(lines)
              if "بازگشت به صفحه اصلی" in line and "href=" in line
          ]
          if len(matches) != 1:
              raise SystemExit(f"Unexpected 404-link validator match count: {len(matches)}")
          lines[matches[0]] = replacement
          dist_validator.write_text("\n".join(lines) + "\n", encoding="utf-8")

          schema_validator = Path("scripts/validate-schemaorg-vocabulary.mjs")
          source = schema_validator.read_text(encoding="utf-8")
          datatype_anchor = '''const rangeAcceptsTextLexicalValue = (allowed) =>
            [...allowed].some(
              (type) => types.has(type) && typeClosure(type).has("Text"),
            );
          '''
          datatype_support = datatype_anchor + '''const XSD_ORIGIN = "http://www.w3.org/2001/XMLSchema#";
          const XSD_TO_SCHEMA_TYPES = new Map([
            ["string", ["Text"]],
            ["normalizedString", ["Text"]],
            ["token", ["Text"]],
            ["language", ["Text"]],
            ["boolean", ["Boolean"]],
            ["decimal", ["Number"]],
            ["float", ["Float"]],
            ["double", ["Float"]],
            ["integer", ["Integer"]],
            ["nonPositiveInteger", ["Integer"]],
            ["negativeInteger", ["Integer"]],
            ["long", ["Integer"]],
            ["int", ["Integer"]],
            ["short", ["Integer"]],
            ["byte", ["Integer"]],
            ["nonNegativeInteger", ["Integer"]],
            ["unsignedLong", ["Integer"]],
            ["unsignedInt", ["Integer"]],
            ["unsignedShort", ["Integer"]],
            ["unsignedByte", ["Integer"]],
            ["positiveInteger", ["Integer"]],
            ["date", ["Date"]],
            ["dateTime", ["DateTime"]],
            ["dateTimeStamp", ["DateTime"]],
            ["time", ["Time"]],
            ["duration", ["Duration"]],
            ["dayTimeDuration", ["Duration"]],
            ["yearMonthDuration", ["Duration"]],
            ["anyURI", ["URL"]],
            ["gYearMonth", ["Text"]],
            ["gYear", ["Text"]],
            ["gMonthDay", ["Text"]],
            ["gMonth", ["Text"]],
            ["gDay", ["Text"]],
          ]);
          const literalTypesFor = (value) => {
            const schemaType = schemaLocal(value);
            if (schemaType) return [schemaType];
            const xsdType = value.startsWith(XSD_ORIGIN)
              ? value.slice(XSD_ORIGIN.length)
              : value.startsWith("xsd:")
                ? value.slice(4)
                : null;
            if (xsdType) return XSD_TO_SCHEMA_TYPES.get(xsdType) || [];
            return [value];
          };
          '''
          if source.count(datatype_anchor) != 1:
              raise SystemExit("Schema datatype anchor drift")
          source = source.replace(datatype_anchor, datatype_support)

          old_literal = '''        const literalType =
                    typeof item["@type"] === "string"
                      ? schemaLocal(item["@type"]) || item["@type"]
                      : null;
                  if (literalType) {
                    if (!types.has(literalType))
                      jsonErrors.push(`${path}: unknown/superseded literal type ${literalType}`);
                    else if (!rangeMatchesTypes([literalType], allowed))
                      jsonErrors.push(
                        `${path}: ${property} literal type ${literalType} not in ${[...allowed].join("|")}`,
                      );
          '''
          new_literal = '''        const literalTypeIri =
                    typeof item["@type"] === "string" ? item["@type"] : null;
                  const literalTypes = literalTypeIri ? literalTypesFor(literalTypeIri) : [];
                  if (literalTypeIri) {
                    if (!literalTypes.length)
                      jsonErrors.push(`${path}: unsupported literal datatype ${literalTypeIri}`);
                    else {
                      const unknownTypes = literalTypes.filter((type) => !types.has(type));
                      if (unknownTypes.length)
                        jsonErrors.push(
                          `${path}: unknown/superseded literal type ${unknownTypes.join("+")}`,
                        );
                      else if (!rangeMatchesTypes(literalTypes, allowed))
                        jsonErrors.push(
                          `${path}: ${property} literal datatype ${literalTypeIri} maps to ${literalTypes.join("+")} outside ${[...allowed].join("|")}`,
                        );
                    }
          '''
          if source.count(old_literal) != 1:
              raise SystemExit("Schema typed-literal block drift")
          source = source.replace(old_literal, new_literal)
          schema_validator.write_text(source, encoding="utf-8")
          PY
          rm .github/forensic-source-native.patch
          rm .github/workflows/apply-source-native-patch.yml
          git diff --check
          node --check scripts/validate-schemaorg-vocabulary.mjs
          actual="$(git diff --name-only HEAD | LC_ALL=C sort)"
          expected="$(cat <<'EOF' | LC_ALL=C sort
          .github/forensic-source-native.patch
          .github/workflows/apply-source-native-patch.yml
          scripts/huggingface.mjs
          scripts/materialize-static-artifacts.mjs
          scripts/validate-architecture.mjs
          scripts/validate-dist.mjs
          scripts/validate-google-structured-data.mjs
          scripts/validate-release-transaction.mjs
          scripts/validate-schemaorg-vocabulary.mjs
          scripts/verify-production.mjs
          EOF
          )"
          test "$actual" = "$expected" || {
            printf 'Unexpected patch surface.\nExpected:\n%s\nActual:\n%s\n' "$expected" "$actual"
            exit 1
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: absorb routing and validation corrections natively"
          test -z "$(git status --porcelain)"
          committed="$(git diff-tree --no-commit-id --name-only -r HEAD | LC_ALL=C sort)"
          test "$committed" = "$expected"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14.6"
      - name: Provision media validation tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg
          ffprobe -version
      - run: npm ci
      - run: npm run security:dependencies
      - name: Run the complete release pipeline on the clean candidate commit
        shell: bash
        run: SOURCE_COMMIT="$(git rev-parse HEAD)" npm run release
      - name: Validate rendered HTML
        run: npx --yes --package=vnu-jar@26.8.30 vnu --errors-only dist/index.html dist/404.html
      - name: Validate rendered Schema.org 30.0 vocabulary
        run: npm run validate:schemaorg-vocabulary
      - name: Publish the fully validated candidate commit
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain --untracked-files=no)"
          git push origin HEAD:fix/schemaorg-v30-conformance-20260903

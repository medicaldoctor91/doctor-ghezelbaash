name: Profile mobile rendering

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/profile-mobile-rendering.yml

permissions:
  contents: write

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - uses: browser-actions/setup-chrome@v1
      - name: Run detailed mobile Lighthouse profile
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp
          npx --yes lighthouse 'https://www.ghezelbaash.ir/' --quiet --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage' --output=json --output-path=/tmp/mobile-lhr.json
          node <<'NODE'
          const fs=require('fs');
          const lhr=JSON.parse(fs.readFileSync('/tmp/mobile-lhr.json','utf8'));
          const ids=[
            'dom-size','mainthread-work-breakdown','bootup-time','script-treemap-data','network-requests','network-rtt','network-server-latency','render-blocking-insight','network-dependency-tree-insight','document-latency-insight','lcp-discovery-insight','lcp-breakdown-insight','image-delivery-insight','font-display-insight','unused-css-rules','unminified-css','uses-text-compression','uses-long-cache-ttl','cache-insight','third-party-summary','third-parties-insight','largest-contentful-paint-element','total-byte-weight','resource-summary','bf-cache','long-tasks'
          ];
          const audits={};
          for(const id of ids){const a=lhr.audits[id];if(a)audits[id]=a;}
          const out={generatedAt:new Date().toISOString(),fetchTime:lhr.fetchTime,finalDisplayedUrl:lhr.finalDisplayedUrl,categories:lhr.categories,audits};
          fs.writeFileSync('tmp/mobile-render-profile.json',JSON.stringify(out,null,2)+'\n');
          NODE
      - name: Commit profile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/profile-mobile-rendering.yml
          git add tmp/mobile-render-profile.json
          git commit -m 'Record detailed mobile rendering profile'
          git push origin HEAD:main

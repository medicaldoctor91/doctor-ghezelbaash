name: Guarded main-only repository cleanup

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/main-only-repository-cleanup.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: doctor-ghezelbaash-main-only-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CF_PROJECT: doctor-ghezelbaash
      CLOUDFLARE_ACCOUNT_ID: 884d1d90bd1fb6ecca14992c6c60d677
      CF_PRODUCTION_BRANCH: main
      CF_EXPECTED_ENVIRONMENT: production
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Converge Cloudflare Pages to main-only source
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          echo "::add-mask::$CLOUDFLARE_API_TOKEN"
          node scripts/ensure-cloudflare-pages-git-deployment.mjs --configure
          node scripts/ensure-cloudflare-pages-git-deployment.mjs --verify-config

      - name: Delete non-canonical branches only after Cloudflare convergence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          for branch in \
            'audit/account-settings-readonly-20260817' \
            'cta-audit-20260817' \
            'cta-location-20260817' \
            'production/deploy' \
            'staging/deploy'
          do
            if git ls-remote --exit-code --heads origin "refs/heads/$branch" >/dev/null 2>&1; then
              git push origin --delete "$branch"
            fi
          done

      - name: Prove main is the only remote branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          heads="$(git ls-remote --heads origin | awk '{print $2}' | sort)"
          printf '%s\n' "$heads"
          test "$heads" = 'refs/heads/main'
          echo 'REMOTE_BRANCH_CONTRACT_MAIN_ONLY_PASS'

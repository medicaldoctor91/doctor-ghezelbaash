name: PR 394 final exact-head 2026 transaction

on:
  push:
    branches:
      - candidate/final-repository-plan-2026

permissions:
  contents: write

concurrency:
  group: pr394-final-exact-head-2026
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: candidate/final-repository-plan-2026
          fetch-depth: 0

      - name: Set up pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Set up pinned Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14.6'

      - name: Provision media tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Materialize final candidate and remove duplicate DOM parsing
        shell: bash
        run: |
          set -euo pipefail
          INITIAL_HEAD="$(git rev-parse HEAD)"
          test "$INITIAL_HEAD" = "$GITHUB_SHA"

          python - <<'PY'
          from pathlib import Path
          raw = Path('.github/workflows/pr394-profile-artifact-semantics.yml').read_text()
          marker = '      - name: Materialize profiled candidate\n'
          assert marker in raw
          tail = raw.split(marker, 1)[1]
          body = tail.split('        run: |\n', 1)[1]
          lines = []
          for line in body.splitlines():
              if line.startswith('      - name: '):
                  break
              assert line.startswith('          ') or not line, repr(line)
              lines.append(line[10:] if line.startswith('          ') else line)
          script = '\n'.join(lines) + '\n'
          assert 'git commit -m' in script and 'ARTIFACT_STAGE' in script
          Path('/tmp/pr394-materialize-final.sh').write_text(script)
          PY

          bash /tmp/pr394-materialize-final.sh

          python - <<'PY'
          from pathlib import Path

          # Make the final HTML validator the single owner of parsed DOM fragment targets.
          p = Path('scripts/validate-html-conformance.mjs')
          s = p.read_text()
          old = '  structural.push({ file, ids: state.ids.size, fragments: state.fragments.length, canonicals: state.canonicals });'
          new = '  structural.push({ file, ids: state.ids.size, fragments: state.fragments.length, canonicals: state.canonicals, fragmentTargets: [...state.ids].sort() });'
          assert old in s
          p.write_text(s.replace(old, new, 1))

          p = Path('scripts/validate-artifact-semantics.mjs')
          s = p.read_text()
          s = s.replace('import { parse } from "parse5";\n', '')
          lines = []
          for line in s.splitlines():
              if line.startswith('const __artifactStarted =') or line.startswith('const __mark =') or '__mark(' in line:
                  continue
              lines.append(line)
          s = '\n'.join(lines) + '\n'

          old_dom = 'const indexHtml = await readFile(path.join(root,"index.html"),"utf8"); const doc=parse(indexHtml); const ids=new Set(); const collect=(node)=>{for(const attr of node.attrs||[]) if(attr.name==="id") ids.add(attr.value); for(const child of node.childNodes||[]) collect(child);}; collect(doc);'
          new_dom = '''const htmlEvidence = parseJsonNoDuplicateKeys(await readFile(".generated/validation/html-conformance.json", "utf8"), "HTML conformance evidence");
const identity = await distIdentity("dist");
const bindHtmlEvidence = (evidence, currentIdentity) => {
  assert.equal(evidence.sourceCommit, exactSourceCommit(), "HTML evidence source commit mismatch");
  assert.equal(evidence.distDigest, currentIdentity.digest, "HTML evidence dist digest mismatch");
  const indexEvidence = (evidence.structural || []).find((row) => row.file === "index.html");
  assert.ok(indexEvidence, "HTML evidence missing index.html structural record");
  assert.ok(Array.isArray(indexEvidence.fragmentTargets), "HTML evidence missing parsed fragment targets");
  assert.equal(indexEvidence.fragmentTargets.length, indexEvidence.ids, "HTML evidence fragment target count drift");
  assert.equal(new Set(indexEvidence.fragmentTargets).size, indexEvidence.fragmentTargets.length, "HTML evidence contains duplicate fragment targets");
  return new Set(indexEvidence.fragmentTargets);
};
const ids = bindHtmlEvidence(htmlEvidence, identity);
assert.throws(
  () => bindHtmlEvidence({ ...htmlEvidence, distDigest: "0".repeat(64) }, identity),
  /HTML evidence dist digest mismatch/u,
  "stale HTML evidence digest mutation was not rejected",
);'''
          assert old_dom in s
          s = s.replace(old_dom, new_dom, 1)
          old_identity = 'const identity = await distIdentity("dist");\nconst evidence = {'
          assert old_identity in s
          s = s.replace(old_identity, 'const evidence = {', 1)
          assert 'parse(indexHtml)' not in s and 'const doc=parse' not in s and '__mark(' not in s
          p.write_text(s)
          PY

          rm -f .github/workflows/pr394-*.yml
          rm -f .pr394-upgrade.gz.b64.*

          git add -A
          git diff --cached --check
          git commit --amend --no-edit

          FINAL_HEAD="$(git rev-parse HEAD)"
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct "$FINAL_HEAD")"
          {
            echo "FINAL_HEAD=$FINAL_HEAD"
            echo "SOURCE_COMMIT=$FINAL_HEAD"
            echo "CF_PAGES_COMMIT_SHA=$FINAL_HEAD"
            echo "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH"
          } >> "$GITHUB_ENV"
          printf '%s\n' "$FINAL_HEAD" > /tmp/pr394-final-head.txt
          printf 'FINAL_CANDIDATE=%s\n' "$FINAL_HEAD"

      - name: Run full deterministic release
        shell: bash
        run: |
          set -euo pipefail
          npm run release 2>&1 | tee /tmp/pr394-final-release.log

      - name: Install exact Playwright browser matrix
        shell: bash
        run: |
          set -euo pipefail
          npx playwright install --with-deps chromium firefox webkit

      - name: Run browser conformance
        shell: bash
        run: |
          set -euo pipefail
          npm run test:browser-conformance 2>&1 | tee /tmp/pr394-browser.log

      - name: Run WCAG automated accessibility suite
        shell: bash
        run: |
          set -euo pipefail
          npm run test:a11y 2>&1 | tee /tmp/pr394-a11y.log

      - name: Run pinned performance audit
        shell: bash
        run: |
          set -euo pipefail
          node -e 'const p=require("./package.json"); if(!p.scripts["audit:performance"]) throw new Error("audit:performance script missing")'
          npm run audit:performance 2>&1 | tee /tmp/pr394-performance.log

      - name: Write final conformance attestation
        shell: bash
        run: |
          set -euo pipefail
          node scripts/write-conformance-attestation.mjs
          test -f .generated/validation/conformance-attestation.json

      - name: Assert final identity and clean worktree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$FINAL_HEAD"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          node --input-type=module <<'EOF'
          import assert from 'node:assert/strict';
          import { readFile } from 'node:fs/promises';
          const evidence = JSON.parse(await readFile('.generated/validation/conformance-attestation.json','utf8'));
          assert.equal(evidence.sourceCommit, process.env.FINAL_HEAD);
          assert.match(evidence.distDigest || evidence.distSha256 || '', /^[0-9a-f]{64}$/u);
          console.log(JSON.stringify({ sourceCommit:evidence.sourceCommit, distDigest:evidence.distDigest || evidence.distSha256, result:evidence.result || evidence.status }, null, 2));
          EOF

      - name: Upload final transaction evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr394-final-2026-${{ github.sha }}
          path: |
            /tmp/pr394-final-head.txt
            /tmp/pr394-final-release.log
            /tmp/pr394-browser.log
            /tmp/pr394-a11y.log
            /tmp/pr394-performance.log
            .generated/validation/
            .release/runtime/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

      - name: Push only fully validated exact-head candidate
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$FINAL_HEAD"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          REMOTE_HEAD="$(git ls-remote origin refs/heads/candidate/final-repository-plan-2026 | cut -f1)"
          test "$REMOTE_HEAD" = "$GITHUB_SHA"
          git push origin HEAD:candidate/final-repository-plan-2026
          printf 'FINAL_HEAD=%s\n' "$FINAL_HEAD"

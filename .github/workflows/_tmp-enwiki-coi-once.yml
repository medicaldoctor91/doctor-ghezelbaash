name: Temporary one-shot enwiki COI request

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_tmp-enwiki-coi-once.yml'

permissions:
  contents: read

concurrency:
  group: tmp-enwiki-coi-once
  cancel-in-progress: false

jobs:
  post-coi-request:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      WIKIMEDIA_USERNAME: ${{ secrets.WIKIVERSITY_USERNAME }}
      WIKIMEDIA_BOT_PASSWORD: ${{ secrets.WIKIVERSITY_BOT_PASSWORD }}
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install dependency
        run: python -m pip install --disable-pip-version-check --no-input requests==2.32.5
      - name: Validate credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$WIKIMEDIA_USERNAME"
          test -n "$WIKIMEDIA_BOT_PASSWORD"
      - name: Post duplicate-safe COI request to Wikipedia Talk page only
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL 'https://raw.githubusercontent.com/medicaldoctor91/doctor-ghezelbaash/bf84950c3f7370ebf6218a8c4c98a21466277814/scripts/enwiki_bipolar_coi_request.py' -o /tmp/enwiki_bipolar_coi_request.py
          python -m py_compile /tmp/enwiki_bipolar_coi_request.py
          python /tmp/enwiki_bipolar_coi_request.py

name: Live Attachment submit and WikiJournal audit

on:
  push:
    branches: [wiki-api-access-exec]

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      WIKIMEDIA_USERNAME: ${{ secrets.WIKIVERSITY_USERNAME }}
      WIKIMEDIA_BOT_PASSWORD: ${{ secrets.WIKIVERSITY_BOT_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: wiki-api-access-exec
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14.6'
      - run: python -m pip install --disable-pip-version-check requests
      - name: Submit and verify from Wikimedia APIs
        shell: bash
        run: |
          set -euo pipefail
          echo "::add-mask::$WIKIMEDIA_BOT_PASSWORD"
          python - <<'PY' > wiki-deep-audit.json
          import os,json,requests,datetime,re
          USER=os.environ['WIKIMEDIA_USERNAME']; PASS=os.environ['WIKIMEDIA_BOT_PASSWORD']
          def session(host,login=False):
              s=requests.Session(); s.headers['User-Agent']='Medicaldoctor91LiveWikimediaAudit/1.0'
              api=f'https://{host}/w/api.php'
              def get(**p):
                  p.update(format='json',formatversion=2,maxage=0,smaxage=0)
                  r=s.get(api,params=p,timeout=90); r.raise_for_status(); return r.json()
              if login:
                  lt=get(action='query',meta='tokens',type='login')['query']['tokens']['logintoken']
                  r=s.post(api,data={'action':'login','lgname':USER,'lgpassword':PASS,'lgtoken':lt,'format':'json','formatversion':2},timeout=90); r.raise_for_status(); lg=r.json()
                  if lg.get('login',{}).get('result')!='Success': raise RuntimeError(lg)
              return s,api,get
          s,api,get=session('en.wikipedia.org',True)
          account=get(action='query',meta='userinfo',uiprop='rights|editcount')['query']['userinfo']
          title='Talk:Attachment and health'; heading='Update Mental health section with recent meta-analytic evidence'
          p=get(action='query',prop='revisions',titles=title,rvprop='ids|timestamp|user|comment|content',rvslots='main',rvlimit=1)['query']['pages'][0]
          r=(p.get('revisions') or [{}])[0]; txt=r.get('slots',{}).get('main',{}).get('content','')
          if heading in txt:
              edit_result={'status':'already_present','revid':r.get('revid')}
          else:
              csrf=get(action='query',meta='tokens')['query']['tokens']['csrftoken']
              body="""{{edit COI|summary=Update the Mental health section with recent meta-analytic evidence}}
I am a co-author of the 2021 MDD study cited below, so I am requesting this change rather than editing the article directly.

'''Specific change:''' In § Mental health, immediately after the paragraph ending “including depression, anxiety, eating, psychotic and personality disorders”, add:

More recent meta-analytic evidence supports a robust association between adult attachment insecurity and mental-health outcomes. A 2022 meta-analysis of 224 studies (245 samples; N=79,722) found moderate associations between attachment anxiety and avoidance and poorer mental health, including depression and anxiety.<ref>{{cite journal |vauthors=Zhang X, Li J, Xie F, Chen X, Xu W, Hudson NW |title=The relationship between adult attachment and mental health: A meta-analysis |journal=Journal of Personality and Social Psychology |year=2022 |volume=123 |issue=5 |pages=1089–1137 |doi=10.1037/pspp0000437 |pmid=36201836}}</ref> Consistent with this broader literature, a 2021 cross-sectional study of 300 people with major depressive disorder reported high rates of insecure attachment and an association between anxious attachment and dissociative symptoms; because the study was cross-sectional, it does not establish causality.<ref>{{cite journal |vauthors=Golshani S, Najafpour A, Hashemian SS, Goudarzi N, Firoozabadi A, Ghezelbash MS, Hookari S, Firoozabadi K, Dürsteler KM, Brühl AB, Alikhani M, Sadeghi-Bahmani D, Brand S |title=Individuals with Major Depressive Disorder Report High Scores of Insecure-Avoidant and Insecure-Anxious Attachment Styles, Dissociative Identity Symptoms, and Adult Traumatic Events |journal=Healthcare |year=2021 |volume=9 |issue=9 |page=1169 |doi=10.3390/healthcare9091169 |pmid=34574943 |pmc=PMC8469763}}</ref>

'''Reason:''' The existing section states the association using mostly older literature. The proposed addition anchors that statement in a large recent meta-analysis and gives one narrowly framed clinical example, with the study design limitation stated explicitly.

~~~~"""
              params={'action':'edit','title':title,'section':'new','sectiontitle':heading,'text':body,'summary':'COI disclosed: request independent review of Mental health section using recent meta-analytic evidence','token':csrf,'assertuser':account['name'],'format':'json','formatversion':2}
              resp=s.post(api,data=params,timeout=90); raw=resp.json()
              edit_result={'http_status':resp.status_code,'response':raw}
          verify=get(action='query',prop='revisions',titles=title,rvprop='ids|timestamp|user|comment|content',rvslots='main',rvlimit=1)['query']['pages'][0]
          vr=(verify.get('revisions') or [{}])[0]; vtxt=vr.get('slots',{}).get('main',{}).get('content','')
          contribs=get(action='query',list='usercontribs',ucuser=account['name'],uclimit='max',ucprop='ids|title|timestamp|comment')['query']['usercontribs']
          ws,wapi,wget=session('en.wikiversity.org',False)
          pre='WikiJournal Preprints/Individualized clinical assessment and outcome interpretation in aesthetic botulinum neurotoxin type A treatment: a focused review'
          wp=wget(action='query',prop='revisions|categories|info',titles=pre,rvprop='ids|timestamp|user|comment|content',rvslots='main',rvlimit=50,cllimit='max')['query']['pages'][0]
          wr=(wp.get('revisions') or [{}])[0]; wtext=wr.get('slots',{}).get('main',{}).get('content','')
          cats=[x.get('title') for x in wp.get('categories',[])]
          terms=['peer review','reviewer','editor','submission','submitted','stage','authorship','handling editor','accepted','declined','revise','review coordinator']
          markers={t:bool(re.search(re.escape(t),wtext,re.I)) for t in terms}
          uc=[]; cont={}
          while True:
              q={'action':'query','list':'usercontribs','ucuser':'Medicaldoctor91','uclimit':'max','ucprop':'ids|title|timestamp|comment'}; q.update(cont); d=wget(**q); uc.extend(d['query']['usercontribs'])
              if 'continue' not in d: break
              cont=d['continue']
          hist=[{k:x.get(k) for k in ['revid','timestamp','user','comment']} for x in wp.get('revisions',[])]
          cat_sub='Category:Articles currently submitted to WikiJournal of Medicine for peer review'
          cat_not='Category:Article preprints not yet submitted to WikiJournal of Medicine for peer review'
          categories={}
          for ct in [cat_sub,cat_not]:
              d=wget(action='query',list='categorymembers',cmtitle=ct,cmlimit='max',cmprop='ids|title|timestamp')
              categories[ct]=d['query']['categorymembers']
          out={'generated_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'attachment':{'account':account,'edit_result':edit_result,'verified_latest':{k:vr.get(k) for k in ['revid','timestamp','user','comment']},'heading_present':heading in vtxt,'attachment_contribs':[x for x in contribs if x.get('title')==title],'all_editcount':len(contribs)},'wikijournal':{'source':'en.wikiversity.org/w/api.php','preprint_title':pre,'exists':not bool(wp.get('missing',False)),'pageid':wp.get('pageid'),'categories':cats,'latest':{k:wr.get(k) for k in ['revid','timestamp','user','comment']},'history':hist,'markers':markers,'content_excerpt':wtext[:12000],'medicaldoctor91_contributions':[x for x in uc if ('WikiJournal' in x.get('title','') or 'botulinum' in x.get('title','').lower())],'tracking_categories':categories}}
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - name: Store result on isolated branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name ghezelbaash-wiki-audit-bot
          git config user.email actions@users.noreply.github.com
          git add wiki-deep-audit.json
          git commit -m "Store live Attachment and WikiJournal verification" || exit 0
          git push origin HEAD:wiki-api-access-exec

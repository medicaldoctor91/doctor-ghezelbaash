name: Validate 1.3.6 physician Service entity consistency (no publication)
on:
  push:
    branches: [codex/136-physician-service-entity-consistency-20261121]
permissions:
  contents: read
concurrency:
  group: 136-physician-service-entity-consistency
  cancel-in-progress: true
jobs:
  full-release-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 48
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      ARCHIVE_SOURCE_COMMIT: eafb138d596a91504ed0af66e2557f52848e36b6
      GIT_LFS_SKIP_SMUDGE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deterministic website and RDF validators
        run: |
          npm ci
          python -m pip install 'rdflib>=7,<8' 'pyshacl>=0.30,<1' 'mlcroissant==1.1.1' 'PyLD==3.3.0' PyYAML
      - name: Build entire published-format 1.3.6, graph and all canonical HTML pages
        run: npm run build
      - name: Complete Node regression and clinical entity semantic rules
        run: node --test --test-concurrency=1 tests/*.test.mjs
      - name: Machine files, RDF, SHACL and strict active HEAD graph parity
        run: |
          python tests/validate_machine_resources.py dist
          python tests/validate_canonical_invariants.py dist
          python tests/active-home-canonical-projection.test.py
          python tests/validate_platform_bundle.py dist --no-query --rdf
      - name: Guard DOI, cardinality, provider, author attribution, 72 pages and output byte budget
        run: |
          python - <<'PY'
          import json,hashlib,re,pathlib
          from collections import Counter
          root=pathlib.Path('dist')
          graph=(root/'graph.jsonld').read_bytes()
          G=json.loads(graph)['@graph']
          many=lambda v:v if isinstance(v,list) else [] if v is None else [v]
          ident=lambda v:v if isinstance(v,str) else v.get('@id')
          origin='https://www.ghezelbaash.ir'
          person=next(n for n in G if n['@id']==origin+'/#saeed-ghezelbash')
          services=[n for n in G if 'Service' in many(n.get('@type'))]
          offers=[n for n in G if 'Offer' in many(n.get('@type'))]
          ids=lambda arr:{ident(x) for x in many(arr)}
          assert len(G)==1916
          assert len(services)==len(offers)==124
          assert 'availableService' not in person, 'Person.availableService has out-of-domain and out-of-range assertions'
          assert all(ids(s['provider'])=={person['@id']} for s in services)
          assert all(len(ids(s.get('offers')))==1 for s in services)
          assert ids(person['makesOffer'])=={o['@id'] for o in offers}
          assert len([o for o in offers if o.get('url')])==10
          assert person.get('hasOfferCatalog')
          assert all(ident(o.get('offeredBy'))==person['@id'] for o in offers)
          assert origin+'/procedure-botulinum-toxin-chronic-migraine' in ids(person.get('dcterms:relation'))
          assert len([s for s in services if not many(s.get('subjectOf'))])==2
          assert (root/'index.html').is_file() and (root/'sitemap.xml').is_file()
          html=(root/'index.html').read_bytes()
          end=html.index(b'</script>',html.index(b'id="canonical-entity-graph"'))+len(b'</script>')
          assert end+16000<2000000, (end,2000000-end)
          policy=json.loads((root/'doi-policy.json').read_text())
          assert policy['currentArchive']['doi']=='10.5281/zenodo.24354791'
          assert policy['currentArchive']['contentBaseline']=='1.3.6'
          assert policy['currentArchive']['sourceCommit']=='eafb138d596a91504ed0af66e2557f52848e36b6'
          assert policy['concept']['doi']=='10.5281/zenodo.18765168'
          from xml.etree import ElementTree as ET
          # Only canonical sitemap url/loc entries, not nested image:image/image:loc.
          sitemap=ET.parse(root/'sitemap.xml')
          locs=[loc.text for url in sitemap.getroot() if url.tag.endswith('url')
                for loc in url if loc.tag.endswith('loc')]
          assert len(locs)==72,(len(locs),locs[:3])
          receipt={'status':'PASS','operation':'build-only','published':False,'version':'1.3.6',
            'graphNodes':len(G),'providedServices':len(services),'offerCount':len(offers),
            'offerUrlCount':len([o for o in offers if o.get('url')]),
            'personAvailableService':0,
            'schemaCorrectPersonAvailableServiceAbsent':True,
            'personMakesOffer':len(ids(person['makesOffer'])),
            'servicesWithSubjectOf':len([s for s in services if many(s.get('subjectOf'))]),
            'mainHeadScriptEndByte':end,'remainingBefore2MB':2000000-end,
            'sitemapPages':len(locs),'doi':policy['currentArchive']['doi'],
            'graphSHA256':hashlib.sha256(graph).hexdigest(),
            'homepageSHA256':hashlib.sha256(html).hexdigest()}
          pathlib.Path('/tmp/physician-entity-136-build-check.json').write_text(json.dumps(receipt,ensure_ascii=False,indent=2))
          print(json.dumps(receipt,indent=2))
          PY
      - name: Deliver candidate artifacts without external publication
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: physician-entity-consistency-136-validated
          path: |
            /tmp/physician-entity-136-build-check.json
            dist/graph.jsonld
            dist/index.html
            dist/release-provenance.json
            dist/doi-policy.json
            dist/sitemap.xml
            dist/integrity-manifest.json
          retention-days: 30

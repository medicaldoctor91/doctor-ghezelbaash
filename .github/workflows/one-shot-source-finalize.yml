name: One-shot final source normalization

on:
  push:
    branches: [refactor/tooling-ownership-final-clean]

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
          cache: npm
      - name: Normalize authored source and token authorities
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          # Extend canonical site-data with operational presentation tokens.
          p=Path('src/lib/site-data.mjs'); s=p.read_text()
          if 'groupLocalPhone' not in s:
            s=s.replace("const normalizePhone=value=>`+${String(value??'').replace(/\\D/g,'')}`;\n", "const normalizePhone=value=>`+${String(value??'').replace(/\\D/g,'')}`;\nconst groupLocalPhone=value=>`${value.slice(0,4)} ${value.slice(4,7)} ${value.slice(7)}`;\nconst groupInternationalPhone=value=>`+${value.slice(1,3)} ${value.slice(3,6)} ${value.slice(6,9)} ${value.slice(9)}`;\n")
            s=s.replace("    phoneDisplay:faDigits(localPhone),\n", "    phoneDisplay:faDigits(localPhone),\n    phoneDisplayGrouped:faDigits(groupLocalPhone(localPhone)),\n    phoneDisplayInternational:groupInternationalPhone(phone),\n")
            s += r'''\nconst siteTokenPattern=/{{(?:CLINIC_[A-Z0-9_]+|OFFICIAL_[A-Z0-9_]+)}}/g;\n\nexport function siteTokenValues(site){\n  if(!site?.telHref||!site?.instagramUrl||!site?.chatUrl||!site?.mapsUrl)throw new Error('Invalid canonical site token source');\n  const hours=String(site.hoursDisplay||'').match(/^شنبه تا پنجشنبه (\\S+) تا (\\S+) و جمعه تعطیل$/);\n  if(!hours)throw new Error(`Unsupported canonical site hours display: ${site.hoursDisplay}`);\n  return Object.freeze({\n    '{{CLINIC_TEL_HREF}}':site.telHref,\n    '{{CLINIC_PHONE_FA}}':site.phoneDisplayGrouped,\n    '{{CLINIC_PHONE_INTL}}':site.phoneDisplayInternational,\n    '{{OFFICIAL_INSTAGRAM_URL}}':site.instagramUrl,\n    '{{OFFICIAL_CHAT_URL}}':site.chatUrl,\n    '{{CLINIC_MAPS_URL}}':site.mapsUrl,\n    '{{CLINIC_POSTAL_CODE_FA}}':faDigits(site.postalCode),\n    '{{CLINIC_HOURS_COMPACT_FA}}':`شنبه تا پنجشنبه ${hours[1].replace(':۰۰','')}–${hours[2].replace(':۰۰','')}؛ جمعه تعطیل`,\n    '{{CLINIC_HOURS_WEEKDAYS_FA}}':`شنبه تا پنجشنبه، ${hours[1]} تا ${hours[2]}`,\n    '{{CLINIC_FRIDAY_CLOSED_FA}}':'جمعه تعطیل.',\n  });\n}\n\nexport function bindSiteTokens(content,site){\n  const source=String(content);\n  const values=siteTokenValues(site);\n  const seen=new Set(source.match(siteTokenPattern)||[]);\n  for(const token of seen)if(!Object.hasOwn(values,token))throw new Error(`Unknown site token: ${token}`);\n  const bound=source.replace(siteTokenPattern,token=>String(values[token]));\n  const unresolved=bound.match(siteTokenPattern)||[];\n  if(unresolved.length)throw new Error(`Unresolved site token: ${[...new Set(unresolved)].join(', ')}`);\n  return bound;\n}\n'''
            p.write_text(s)

          # Release-owned medical review tokens.
          p=Path('src/lib/release-tokens.mjs'); s=p.read_text()
          s=s.replace("const releaseTokenPattern=/{{(?:CURRENT_[A-Z0-9_]+|MEDICAL_REVIEW_DATE_EN)}}/g;", "const releaseTokenPattern=/{{(?:CURRENT_[A-Z0-9_]+|MEDICAL_REVIEW_DATE_(?:EN|ISO|FA))}}/g;")
          if 'persianGregorianDate=' not in s:
            s=s.replace("const englishDate=value=>new Intl.DateTimeFormat('en-GB',{day:'numeric',month:'long',year:'numeric',timeZone:'UTC'}).format(new Date(`${value}T00:00:00Z`));", "const englishDate=value=>new Intl.DateTimeFormat('en-GB',{day:'numeric',month:'long',year:'numeric',timeZone:'UTC'}).format(new Date(`${value}T00:00:00Z`));\nconst persianGregorianDate=value=>new Intl.DateTimeFormat('fa-IR-u-ca-gregory',{day:'numeric',month:'long',year:'numeric',timeZone:'UTC'}).format(new Date(`${value}T00:00:00Z`));")
            s=s.replace("    '{{MEDICAL_REVIEW_DATE_EN}}':englishDate(release.medicalReviewedAt)\n", "    '{{MEDICAL_REVIEW_DATE_EN}}':englishDate(release.medicalReviewedAt),\n    '{{MEDICAL_REVIEW_DATE_ISO}}':release.medicalReviewedAt,\n    '{{MEDICAL_REVIEW_DATE_FA}}':persianGregorianDate(release.medicalReviewedAt)\n")
          p.write_text(s)

          # Canonical page assembler binds site data from release + graph.
          p=Path('scripts/lib/assemble-content.mjs'); s=p.read_text()
          if 'bindSiteTokens,deriveSiteData' not in s:
            s=s.replace("import {bindReleaseTokens} from '../../src/lib/release-tokens.mjs';", "import {bindReleaseTokens} from '../../src/lib/release-tokens.mjs';\nimport {bindSiteTokens,deriveSiteData} from '../../src/lib/site-data.mjs';")
            s=s.replace("export async function assembleCanonicalContent({root=process.cwd()}={}){\n  const names=await canonicalSourceNames(root);\n  const release=JSON.parse(await readFile(path.join(root,'src/data/release.json'),'utf8'));\n  let content=await readFile(path.join(root,'src/content-source/page.md'),'utf8');\n  content=bindHeroPictureSizes(content);\n  content=bindReleaseTokens(content,release);\n", "export async function assembleCanonicalContent({root=process.cwd(),graph}={}){\n  const names=await canonicalSourceNames(root);\n  const release=JSON.parse(await readFile(path.join(root,'src/data/release.json'),'utf8'));\n  const canonicalGraph=graph??JSON.parse(await readFile(path.join(root,'src/data/semantic/knowledge-graph.jsonld'),'utf8'));\n  const site=deriveSiteData(release,canonicalGraph);\n  let content=await readFile(path.join(root,'src/content-source/page.md'),'utf8');\n  content=bindHeroPictureSizes(content);\n  content=bindReleaseTokens(content,release);\n  content=bindSiteTokens(content,site);\n")
            p.write_text(s)

          # Remove duplicate operational/release authority from authored page while preserving rendered bytes.
          p=Path('src/content-source/page.md'); s=p.read_text()
          for line in [
            'canonical: "https://www.ghezelbaash.ir/"\n',
            'about: "https://www.ghezelbaash.ir/#saeed-ghezelbash"\n',
            'dateModified: "2026-08-13"\n',
            'reviewedBy: "https://www.ghezelbaash.ir/#saeed-ghezelbash"\n',
          ]:
            s=s.replace(line,'',1)
          replacements={
            'tel:+989308209494':'{{CLINIC_TEL_HREF}}',
            '۰۹۳۰ ۸۲۰ ۹۴۹۴':'{{CLINIC_PHONE_FA}}',
            '+98 930 820 9494':'{{CLINIC_PHONE_INTL}}',
            'https://www.instagram.com/doctor.ghezelbaash/':'{{OFFICIAL_INSTAGRAM_URL}}',
            'https://ig.me/m/doctor.ghezelbaash':'{{OFFICIAL_CHAT_URL}}',
            'https://www.google.com/maps?cid=12350483144643112463':'{{CLINIC_MAPS_URL}}',
            '۶۷۱۴۶۵۷۴۱۲':'{{CLINIC_POSTAL_CODE_FA}}',
            'شنبه تا پنجشنبه ۱۶–۲۲؛ جمعه تعطیل':'{{CLINIC_HOURS_COMPACT_FA}}',
            'شنبه تا پنجشنبه، ۱۶:۰۰ تا ۲۲:۰۰':'{{CLINIC_HOURS_WEEKDAYS_FA}}',
            'جمعه تعطیل.':'{{CLINIC_FRIDAY_CLOSED_FA}}',
            'datetime="2026-08-13"':'datetime="{{MEDICAL_REVIEW_DATE_ISO}}"',
            '۱۳ اوت ۲۰۲۶':'{{MEDICAL_REVIEW_DATE_FA}}',
          }
          for old,new in replacements.items(): s=s.replace(old,new)
          p.write_text(s)

          # Exact frontmatter + no duplicate operational authority is a hard architecture invariant.
          p=Path('scripts/validate-architecture.mjs'); s=p.read_text()
          anchor="const pageSurface=(await readdir(path.join(root,'src/pages'),{withFileTypes:true})).map(entry=>entry.name).sort();\nassert(JSON.stringify(pageSurface)===JSON.stringify(['404.astro','index.astro']),`Astro route surface drift: ${pageSurface.join(', ')}`);\n"
          if 'Canonical Markdown frontmatter missing' not in s:
            insert=anchor+"\nconst pageSource=await read('src/content-source/page.md');\nconst frontmatterBlock=pageSource.match(/^---\\n([\\s\\S]*?)\\n---\\n/);\nassert(frontmatterBlock,'Canonical Markdown frontmatter missing');\nconst frontmatterKeys=frontmatterBlock[1].split(/\\r?\\n/).map(line=>line.match(/^([A-Za-z][A-Za-z0-9_-]*):/)?.[1]).filter(Boolean);\nassert(JSON.stringify(frontmatterKeys)===JSON.stringify(['title','description','lang','dir','robots']),`Canonical frontmatter authority drift: ${frontmatterKeys.join(', ')}`);\nfor(const token of ['{{CLINIC_TEL_HREF}}','{{CLINIC_PHONE_FA}}','{{OFFICIAL_INSTAGRAM_URL}}','{{OFFICIAL_CHAT_URL}}','{{CLINIC_MAPS_URL}}','{{MEDICAL_REVIEW_DATE_ISO}}'])assert(pageSource.includes(token),`Canonical page operational token missing: ${token}`);\nfor(const forbidden of ['canonical:','about:','dateModified:','reviewedBy:','tel:+989308209494','https://www.instagram.com/doctor.ghezelbaash/','https://ig.me/m/doctor.ghezelbaash','https://www.google.com/maps?cid=12350483144643112463'])assert(!pageSource.includes(forbidden),`Duplicate page authority reintroduced: ${forbidden}`);\n"
            if anchor not in s: raise SystemExit('architecture insertion anchor missing')
            s=s.replace(anchor,insert)
            s=s.replace("contentMetadataAuthority:'markdown-frontmatter',canonicalUrlAuthority:'release.json'", "contentMetadataAuthority:'exact-markdown-frontmatter',contentOperationalAuthority:'release+graph-token-binding',canonicalUrlAuthority:'release.json'")
            p.write_text(s)

          # Patch-level Astro upgrade to current stable.
          p=Path('package.json'); pkg=json.loads(p.read_text()); pkg['devDependencies']['astro']='7.2.4'; p.write_text(json.dumps(pkg,ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Refresh lockfile for Astro 7.2.4
        run: npm install --package-lock-only --ignore-scripts
      - name: Validate normalized source before committing
        run: |
          node --check src/lib/site-data.mjs
          node --check src/lib/release-tokens.mjs
          node --check scripts/lib/assemble-content.mjs
          node scripts/validate-architecture.mjs
          node scripts/validate-release-contract.mjs
          git diff --check
      - name: Commit normalized source and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/one-shot-source-finalize.yml
          git config user.name "Dr. Saeed Ghezelbaash | دکتر سعید قزلباش"
          git config user.email "medicaldoctor91@gmail.com"
          git add src/content-source/page.md src/lib/site-data.mjs src/lib/release-tokens.mjs scripts/lib/assemble-content.mjs scripts/validate-architecture.mjs package.json package-lock.json .github/workflows/one-shot-source-finalize.yml
          git commit -m "refactor: eliminate page authority drift and update Astro"
          git push origin HEAD:refactor/tooling-ownership-final-clean

name: Strengthen external Wikimedia scholarly graph

on:
  push:
    branches: [main]
    paths:
      - 'wikimedia/external-strengthening-2026-08-16.json'
      - 'scripts/wikimedia_external_strengthening_v2.py'
      - '.github/workflows/wikimedia-external-strengthening.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wikimedia-external-strengthening
  cancel-in-progress: false

jobs:
  strengthen:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      WIKIMEDIA_STRENGTHENING_CONFIG: wikimedia/external-strengthening-2026-08-16.json
      WIKIMEDIA_USERNAME: ${{ secrets.WIKIVERSITY_USERNAME }}
      WIKIMEDIA_BOT_PASSWORD: ${{ secrets.WIKIVERSITY_BOT_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install pinned dependency
        run: python -m pip install --disable-pip-version-check --no-input requests==2.32.5
      - name: Validate Wikimedia credentials are injected
        shell: bash
        run: |
          set -euo pipefail
          test -n "$WIKIMEDIA_USERNAME"
          test -n "$WIKIMEDIA_BOT_PASSWORD"
      - name: Apply and verify Wikidata and Wikipedia external strengthening
        run: python scripts/wikimedia_external_strengthening_v2.py

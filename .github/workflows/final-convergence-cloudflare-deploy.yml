name: Deploy exact final frozen DIST to Cloudflare
on:
  push:
    branches: [final/release-convergence]
    paths:
      - .github/workflows/final-convergence-cloudflare-deploy.yml
permissions:
  actions: read
  contents: write
concurrency:
  group: final-convergence-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CLOUDFLARE_ACCOUNT_ID: '884d1d90bd1fb6ecca14992c6c60d677'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_PROJECT: 'doctor-ghezelbaash'
      ZONE_NAME: 'ghezelbaash.ir'
      CANONICAL: 'https://www.ghezelbaash.ir'
      VERSION_DOI: '10.5281/zenodo.21892769'
      FROZEN_RUN: '31520584940'
      EXPECTED_GRAPH_SHA: 'a62d77230334598f3a5d73c34831c1dbf93b634c784eae4c4b98185a2fd27ed4'
      EXPECTED_HTML_SHA: 'f62dfb340a94994912e0710806fa83fe1b432a1787d24b4bde03b377f7dca9a8'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: final/release-convergence
          fetch-depth: 0
      - name: Verify Cloudflare credential, freeze and Zenodo gate
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          python - <<'PY'
          import json,os,urllib.request
          from pathlib import Path
          f=json.loads(Path('.release/freeze.json').read_text()); z=json.loads(Path('.release/zenodo-published.json').read_text())
          assert f['release']=='1.1.1' and f['coreFrozen'] is True and f['integrity']=='PASS'
          assert str(f['githubRunId'])==os.environ['FROZEN_RUN'] and f['graphJsonldSha256']==os.environ['EXPECTED_GRAPH_SHA'] and f['indexHtmlSha256']==os.environ['EXPECTED_HTML_SHA']
          assert z['integrity']=='PASS' and z['versionDoi']==os.environ['VERSION_DOI'] and z['recordId']=='21892769'
          with urllib.request.urlopen('https://zenodo.org/api/records/21892769',timeout=30) as r:p=json.load(r)
          assert p.get('doi')==os.environ['VERSION_DOI'] and (p.get('metadata') or {}).get('version')=='1.1.1'
          print('CLOUDFLARE_DEPLOY_GATES_PASS')
          PY
      - name: Download exact frozen artifact
        uses: actions/download-artifact@v4
        with:
          name: dr-saeed-ghezelbash-final-convergence-frozen
          path: /tmp/final-frozen
          github-token: ${{ github.token }}
          repository: medicaldoctor91/doctor-ghezelbaash
          run-id: 31520584940
      - name: Verify local frozen bytes before deployment
        run: |
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path('/tmp/final-frozen'); dist=root/'dist'; h=json.loads((root/'dist-sha256.json').read_text()); a=json.loads((root/'release-attestation.json').read_text())
          assert a['release']=='1.1.1' and a['coreFrozen'] is True and a['uiBrowserAudit']=='PASS'
          assert h['graph.jsonld']==os.environ['EXPECTED_GRAPH_SHA'] and h['index.html']==os.environ['EXPECTED_HTML_SHA']
          for n in ['index.html','graph.jsonld','graph.ttl','entity-facts.csv','answers.txt','knowledge.xml','llms.txt','llms-full.txt','index.md','datapackage.json','croissant.json','dcat.ttl','void.ttl','linkset.json','provenance.jsonld','evidence-snapshot.json','shapes.ttl','artifact-manifest.json']:
              p=dist/n; assert p.is_file() and hashlib.sha256(p.read_bytes()).hexdigest()==h[n],n
          print('LOCAL_FINAL_FROZEN_PASS')
          PY
      - name: Deploy exact frozen DIST directly to production
        run: npx --yes wrangler@4.120.0 pages deploy /tmp/final-frozen/dist --project-name="$CF_PROJECT" --branch=main --commit-dirty=true
      - name: Purge canonical release URLs from Cloudflare edge
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,urllib.parse,urllib.request,urllib.error
          token=os.environ['CLOUDFLARE_API_TOKEN']; account=os.environ['CLOUDFLARE_ACCOUNT_ID']; zone_name=os.environ['ZONE_NAME']; base='https://api.cloudflare.com/client/v4'
          headers={'Authorization':f'Bearer {token}','Accept':'application/json','Content-Type':'application/json','User-Agent':'ghezelbaash-final-cache-convergence/1.0'}
          def call(method,path,body=None):
              data=None if body is None else json.dumps(body,separators=(',',':')).encode(); req=urllib.request.Request(base+path,data=data,headers=headers,method=method)
              try:
                  with urllib.request.urlopen(req,timeout=45) as r:return r.status,json.load(r)
              except urllib.error.HTTPError as e:
                  raw=e.read().decode('utf-8','replace'); raise RuntimeError(f'Cloudflare HTTP {e.code}: {raw[:2500]}') from None
          q=urllib.parse.urlencode({'name':zone_name,'account.id':account,'per_page':50}); st,p=call('GET',f'/zones?{q}')
          rows=[x for x in (p.get('result') or []) if x.get('name')==zone_name]
          if st!=200 or p.get('success') is not True or len(rows)!=1: raise RuntimeError('Exact Cloudflare zone resolution failed')
          zid=rows[0]['id']; rel=['','graph.jsonld','graph.ttl','entity-facts.csv','answers.txt','knowledge.xml','llms.txt','llms-full.txt','index.md','datapackage.json','croissant.json','dcat.ttl','void.ttl','linkset.json','provenance.jsonld','evidence-snapshot.json','shapes.ttl','artifact-manifest.json']
          files=[os.environ['CANONICAL']+'/' + x for x in rel]
          st,p=call('POST',f'/zones/{zid}/purge_cache',{'files':files})
          if st!=200 or p.get('success') is not True: raise RuntimeError(f'Canonical cache purge failed {p}')
          print('CANONICAL_RELEASE_CACHE_PURGE_PASS',len(files))
          PY
      - name: Verify canonical remote bytes and HTTP contract after purge
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os,time,urllib.request
          from pathlib import Path
          root=Path('/tmp/final-frozen'); hashes=json.loads((root/'dist-sha256.json').read_text()); base=os.environ['CANONICAL']
          targets={'index.html':'/','graph.jsonld':'/graph.jsonld','graph.ttl':'/graph.ttl','entity-facts.csv':'/entity-facts.csv','answers.txt':'/answers.txt','knowledge.xml':'/knowledge.xml','llms.txt':'/llms.txt','llms-full.txt':'/llms-full.txt','index.md':'/index.md','datapackage.json':'/datapackage.json','croissant.json':'/croissant.json','dcat.ttl':'/dcat.ttl','void.ttl':'/void.ttl','linkset.json':'/linkset.json','provenance.jsonld':'/provenance.jsonld','evidence-snapshot.json':'/evidence-snapshot.json','shapes.ttl':'/shapes.ttl','artifact-manifest.json':'/artifact-manifest.json'}
          def get(path):
              req=urllib.request.Request(base+path,headers={'User-Agent':'ghezelbaash-final-byte-verifier/1.0','Accept-Encoding':'identity','Cache-Control':'no-cache'})
              with urllib.request.urlopen(req,timeout=45) as r:return r.status,r.headers,r.read()
          ok=False
          for i in range(45):
              try:
                  st,h,b=get('/graph.jsonld'); got=hashlib.sha256(b).hexdigest(); print('FINAL_CANONICAL_CONVERGENCE',i+1,got)
                  if st==200 and got==hashes['graph.jsonld']: ok=True; break
              except Exception as e: print('CONVERGENCE_ERROR',i+1,type(e).__name__)
              time.sleep(2)
          if not ok: raise SystemExit('Canonical graph failed to converge to final frozen bytes')
          for name,path in targets.items():
              st,h,b=get(path); got=hashlib.sha256(b).hexdigest()
              if st!=200 or got!=hashes[name]: raise SystemExit(f'Canonical SHA256 mismatch {name}: {got} != {hashes[name]}')
              if name=='graph.jsonld':
                  if h.get('Access-Control-Allow-Origin')!='*': raise SystemExit('Final graph CORS drift')
                  if 'application/ld+json' not in (h.get('Content-Type') or ''): raise SystemExit('Final graph content-type drift')
              if name=='index.html':
                  text=b.decode('utf-8');
                  for token in [os.environ['VERSION_DOI'],'hero-action hero-search-launch','verified-physician-identity-core','google-maps-clinic-reputation-current','quick-start-title']:
                      if token not in text: raise SystemExit(f'Final HTML token missing: {token}')
          print(json.dumps({'stage':'FINAL_WEBSITE_VERIFIED','release':'1.1.1','verifiedArtifacts':len(targets),'graphSha256':hashes['graph.jsonld'],'htmlSha256':hashes['index.html'],'integrity':'PASS'},separators=(',',':')))
          PY
      - name: Verify canonical custom domain is active
        shell: bash
        run: |
          python - <<'PY'
          import json,os,urllib.request
          token=os.environ['CLOUDFLARE_API_TOKEN']; account=os.environ['CLOUDFLARE_ACCOUNT_ID']; project=os.environ['CF_PROJECT']
          req=urllib.request.Request(f'https://api.cloudflare.com/client/v4/accounts/{account}/pages/projects/{project}/domains',headers={'Authorization':f'Bearer {token}','Accept':'application/json'})
          with urllib.request.urlopen(req,timeout=30) as r:p=json.load(r)
          row=next((x for x in (p.get('result') or []) if x.get('name')=='www.ghezelbaash.ir'),None)
          assert row and row.get('status')=='active',row
          print('CANONICAL_DOMAIN_ACTIVE')
          PY
      - name: Record verified Website deployment
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p={'stage':'FINAL_WEBSITE_VERIFIED','release':'1.1.1','versionDoi':'10.5281/zenodo.21892769','frozenRunId':'31520584940','graphSha256':'a62d77230334598f3a5d73c34831c1dbf93b634c784eae4c4b98185a2fd27ed4','indexHtmlSha256':'f62dfb340a94994912e0710806fa83fe1b432a1787d24b4bde03b377f7dca9a8','cachePurged':True,'integrity':'PASS'}
          Path('.release/website-verified.json').write_text(json.dumps(p,sort_keys=True,indent=2)+'\n')
          PY
          git config user.name ghezelbaash-release-bot
          git config user.email actions@users.noreply.github.com
          git add .release/website-verified.json
          git commit -m 'Record verified final canonical Website deployment [final-website]'
          git push origin HEAD:final/release-convergence

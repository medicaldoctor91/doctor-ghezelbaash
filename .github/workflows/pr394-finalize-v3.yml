name: PR 394 exact-head bounded conformance finalizer

on:
  push:
    branches:
      - candidate/final-repository-plan-2026

permissions:
  contents: write

concurrency:
  group: pr394-exact-head-bounded-final-v3
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: candidate/final-repository-plan-2026
          fetch-depth: 0

      - name: Set up pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Pin npm exactly
        shell: bash
        run: |
          set -euo pipefail
          npm install --global npm@11.9.0 --no-audit --no-fund
          test "$(node --version)" = "v24.19.0"
          test "$(npm --version)" = "11.9.0"

      - name: Set up pinned Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14.6'

      - name: Provision media validation tools
        shell: bash
        run: |
          set -euo pipefail
          test "$(python --version)" = "Python 3.14.6"
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Materialize exact candidate with idempotent source fixes
        shell: bash
        run: |
          set -euo pipefail
          INITIAL_HEAD="$(git rev-parse HEAD)"
          test "$INITIAL_HEAD" = "$GITHUB_SHA"

          python - <<'PY'
          from pathlib import Path

          raw = Path('.github/workflows/pr394-finalize-upgrade.yml').read_text()
          marker = '      - name: Materialize exact final candidate\n'
          assert marker in raw
          tail = raw.split(marker, 1)[1]
          run_marker = '        run: |\n'
          assert run_marker in tail
          body = tail.split(run_marker, 1)[1]
          lines = []
          for line in body.splitlines():
              if line.startswith('      - name: '):
                  break
              assert line.startswith('          ') or not line, repr(line)
              lines.append(line[10:] if line.startswith('          ') else line)
          script = '\n'.join(lines) + '\n'

          old_generator = '''p = Path('scripts/lib/projections/contact-discovery.mjs')
          s = p.read_text()
          old = '`TEL;TYPE=work,voice:${telephone}`,'
          new = '`TEL;TYPE=work,voice:tel:${telephone}`,'
          assert s.count(old) == 2, s.count(old)
          p.write_text(s.replace(old, new))'''
          new_generator = '''p = Path('scripts/lib/projections/contact-discovery.mjs')
          s = p.read_text()
          bare = '`TEL;TYPE=work,voice:${telephone}`,'
          intermediate = '`TEL;TYPE=work,voice:tel:${telephone}`,'
          final = '`TEL;VALUE=uri;TYPE=work,voice:tel:${telephone}`,'
          if s.count(final) == 2:
              pass
          elif s.count(intermediate) == 2:
              p.write_text(s.replace(intermediate, final))
          else:
              assert s.count(bare) == 2, (s.count(bare), s.count(intermediate), s.count(final))
              p.write_text(s.replace(bare, final))'''
          assert old_generator in script
          script = script.replace(old_generator, new_generator, 1)

          old_test = '''p = Path('scripts/test-machine-resources.mjs')
          s = p.read_text()
          old = (
              '    assert.ok(unfolded.includes("VERSION:4.0"));\\n'
              '    assert.equal(vCardEntityKind(byId.get(entity)), kind);'
          )
          new = (
              '    assert.ok(unfolded.includes("VERSION:4.0"));\\n'
              '    const telLines = unfolded.filter((line) => line.startsWith("TEL;"));\\n'
              '    assert.equal(telLines.length, 1);\\n'
              '    assert.match(telLines[0], /^TEL;TYPE=work,voice:tel:\\\\+[0-9]+$/u);\\n'
              '    assert.doesNotMatch(card, /^TEL[^:]*:\\\\+[0-9]/gmu);\\n'
              '    assert.equal(vCardEntityKind(byId.get(entity)), kind);'
          )
          assert old in s
          p.write_text(s.replace(old, new, 1))'''
          new_test = '''p = Path('scripts/test-machine-resources.mjs')
          s = p.read_text()
          final_marker = '    assert.equal(telLines[0], `TEL;VALUE=uri;TYPE=work,voice:tel:${byId.get(release.clinic.id).telephone}`);'
          if final_marker in s:
              assert s.count(final_marker) == 1
          else:
              old = (
                  '    assert.ok(unfolded.includes("VERSION:4.0"));\\n'
                  '    assert.equal(vCardEntityKind(byId.get(entity)), kind);'
              )
              new = (
                  '    assert.ok(unfolded.includes("VERSION:4.0"));\\n'
                  '    const telLines = unfolded.filter((line) => line.startsWith("TEL;"));\\n'
                  '    assert.equal(telLines.length, 1);\\n'
                  '    assert.equal(telLines[0], `TEL;VALUE=uri;TYPE=work,voice:tel:${byId.get(release.clinic.id).telephone}`);\\n'
                  '    assert.match(telLines[0], /^TEL;VALUE=uri;TYPE=work,voice:tel:\\\\+[1-9][0-9]*$/u);\\n'
                  '    assert.doesNotMatch(card, /^TEL[^:]*:\\\\+[0-9]/gmu);\\n'
                  '    assert.equal(vCardEntityKind(byId.get(entity)), kind);'
              )
              assert old in s
              p.write_text(s.replace(old, new, 1))'''
          assert old_test in script
          script = script.replace(old_test, new_test, 1)

          assert 'git commit -m' in script and 'Prepared final candidate' in script
          Path('/tmp/pr394-materialize-v3.sh').write_text(script)
          PY

          bash /tmp/pr394-materialize-v3.sh

          python - <<'PY'
          from pathlib import Path

          # Final-byte vCard gate: VALUE=uri must be explicit and singular in addition to a tel: URI value.
          p = Path('scripts/validate-artifact-semantics.mjs')
          s = p.read_text()
          old_tel = 'for (const row of properties.filter((x) => x.name === "TEL")) assert.match(row.value, /^tel:\\+?[0-9][0-9(). -]*$/u, `${file} TEL must be an RFC 6350 URI value`);'
          new_tel = 'for (const row of properties.filter((x) => x.name === "TEL")) { const valueParams = row.params.filter((param) => /^VALUE=/iu.test(param)); assert.equal(valueParams.length, 1, `${file} TEL must declare exactly one VALUE parameter`); assert.match(valueParams[0], /^VALUE=uri$/iu, `${file} TEL VALUE parameter must be uri`); assert.match(row.value, /^tel:\\+?[1-9][0-9]*$/u, `${file} TEL must be an RFC 6350 tel URI value`); }'
          assert old_tel in s
          s = s.replace(old_tel, new_tel, 1)

          # Preserve complete link checking while avoiding repeated validation of the same canonical URL thousands of times.
          start_marker = 'const broken=[]; let checkedInternal=0;'
          end_marker = 'assert.deepEqual(broken, [], `Broken canonical internal URLs/fragments: ${JSON.stringify(broken.slice(0,20),null,2)}`);'
          start = s.find(start_marker)
          end_start = s.find(end_marker)
          assert start >= 0 and end_start > start
          end = end_start + len(end_marker)
          replacement = (
              'const broken=[]; let checkedInternal=0; const validatedInternalUrls=new Set();\n'
              'const canonicalPrefix="https://www.ghezelbaash.ir/";\n'
              'const isUrlTerminator=(ch)=>{if(ch==null||/\\s/u.test(ch))return true;const code=ch.charCodeAt(0);return code===34||code===39||code===60||code===62||code===96||code===92||code===91||code===93;};\n'
              'for (const file of files) {\n'
              '  if (!textExtensions.has(path.extname(file)) && file !== "site.webmanifest") continue;\n'
              '  const text=await readFile(path.join(root,file),"utf8");\n'
              '  let offset=0;\n'
              '  for (;;) {\n'
              '    const found=text.indexOf(canonicalPrefix,offset); if(found<0) break;\n'
              '    let cursor=found+canonicalPrefix.length; while(cursor<text.length&&!isUrlTerminator(text[cursor])) cursor+=1;\n'
              '    const value=text.slice(found,cursor).replace(/[),.;]+$/u,""); offset=Math.max(cursor,found+canonicalPrefix.length); checkedInternal+=1;\n'
              '    if(validatedInternalUrls.has(value)) continue; validatedInternalUrls.add(value);\n'
              '    let url; try{url=new URL(value);}catch{broken.push({file,url:value,reason:"invalid-url"});continue;}\n'
              '    let relative; try{relative=decodeURIComponent(url.pathname).slice(1)||"index.html";}catch{broken.push({file,url:value,reason:"invalid-percent-encoding"});continue;}\n'
              '    if(!exists(relative)){broken.push({file,url:value,reason:"missing-path"});continue;}\n'
              '    if((relative==="index.html"||relative.endsWith(".html"))&&url.hash&&relative==="index.html"){let fragment; try{fragment=decodeURIComponent(url.hash.slice(1));}catch{broken.push({file,url:value,reason:"invalid-fragment-encoding"});continue;} if(fragment&&!ids.has(fragment)) broken.push({file,url:value,reason:"missing-fragment"});}\n'
              '  }\n'
              '}\n'
              'assert.deepEqual(broken, [], `Broken canonical internal URLs/fragments: ${JSON.stringify(broken.slice(0,20),null,2)}`);'
          )
          s = s[:start] + replacement + s[end:]
          old_evidence = 'internalLinks:{checked:checkedInternal,broken:0}'
          new_evidence = 'internalLinks:{checked:checkedInternal,unique:validatedInternalUrls.size,broken:0}'
          assert old_evidence in s
          p.write_text(s.replace(old_evidence, new_evidence, 1))
          PY

          rm -f .github/workflows/pr394-finalize-v2.yml
          rm -f .github/workflows/pr394-finalize-v3.yml

          git add -A
          git diff --cached --check
          git commit --amend --no-edit

          FINAL_HEAD="$(git rev-parse HEAD)"
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct "$FINAL_HEAD")"
          {
            echo "FINAL_HEAD=$FINAL_HEAD"
            echo "SOURCE_COMMIT=$FINAL_HEAD"
            echo "CF_PAGES_COMMIT_SHA=$FINAL_HEAD"
            echo "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH"
          } >> "$GITHUB_ENV"
          printf '%s\n' "$FINAL_HEAD" > /tmp/pr394-final-head.txt
          printf 'Prepared exact-head bounded candidate %s\n' "$FINAL_HEAD"

      - name: Release exact candidate
        shell: bash
        run: |
          set +e
          /usr/bin/time -v npm run release 2>&1 | tee /tmp/pr394-release.log
          rc=${PIPESTATUS[0]}
          printf '%s\n' "$rc" > /tmp/pr394-release-exit.txt
          exit "$rc"

      - name: Browser accessibility and performance proof on identical dist
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee /tmp/pr394-quality.log) 2>&1

          test "$(node --version)" = "v24.19.0"
          test "$(npm --version)" = "11.9.0"
          test "$(python --version)" = "Python 3.14.6"

          DIST_DIGEST_BEFORE="$(node --input-type=module - <<'NODE'
          import { distIdentity } from './scripts/lib/dist-identity.mjs';
          console.log((await distIdentity('dist')).digest);
          NODE
          )"
          echo "DIST_DIGEST_BEFORE=$DIST_DIGEST_BEFORE"

          npx playwright install --with-deps chromium firefox webkit

          run_target() {
            local target="$1"
            local script_name
            script_name="$(TARGET="$target" node --input-type=module - <<'NODE'
          import { readFile } from 'node:fs/promises';
          const pkg = JSON.parse(await readFile('package.json', 'utf8'));
          const target = process.env.TARGET;
          const matches = Object.entries(pkg.scripts || {}).filter(([, command]) => command.includes(target));
          if (matches.length !== 1) throw new Error(`Expected one npm script for ${target}, found ${matches.length}: ${JSON.stringify(matches)}`);
          console.log(matches[0][0]);
          NODE
          )"
            echo "RUN_TARGET=$target NPM_SCRIPT=$script_name"
            npm run "$script_name"
          }

          run_target scripts/test-browser-conformance.mjs
          run_target scripts/test-a11y.mjs
          run_target scripts/measure-performance.mjs

          node scripts/validate-standards-matrix.mjs
          node scripts/write-conformance-attestation.mjs

          DIST_DIGEST_AFTER="$(node --input-type=module - <<'NODE'
          import { distIdentity } from './scripts/lib/dist-identity.mjs';
          console.log((await distIdentity('dist')).digest);
          NODE
          )"
          echo "DIST_DIGEST_AFTER=$DIST_DIGEST_AFTER"
          test "$DIST_DIGEST_AFTER" = "$DIST_DIGEST_BEFORE"

          test -f .generated/validation/browser-conformance.json
          test -f .generated/validation/accessibility.json
          test -f .generated/validation/performance.json
          test -f .generated/validation/conformance-attestation.json

      - name: Capture final transaction evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr394-exact-head-final-${{ github.sha }}
          path: |
            /tmp/pr394-final-head.txt
            /tmp/pr394-release.log
            /tmp/pr394-release-exit.txt
            /tmp/pr394-quality.log
            .generated/validation/
            .release/runtime/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

      - name: Push only fully validated candidate
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$FINAL_HEAD"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          REMOTE_HEAD="$(git ls-remote origin refs/heads/candidate/final-repository-plan-2026 | cut -f1)"
          test "$REMOTE_HEAD" = "$GITHUB_SHA"
          git push origin HEAD:candidate/final-repository-plan-2026
          printf 'FINAL_HEAD=%s\n' "$FINAL_HEAD"

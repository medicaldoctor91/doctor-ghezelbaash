name: Preflight 1.3.6 mutable platforms preserving exact Zenodo DOI
on:
  push:
    branches: [codex/release-136-mutable-alignment-20261121]
permissions:
  contents: read
  actions: read
concurrency:
  group: doctor-ghezelbaash-publication
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      ARCHIVE_SOURCE_COMMIT: eafb138d596a91504ed0af66e2557f52848e36b6
      HF_TOKEN: ${{ secrets.HF_TOKEN || secrets.HUGGINGFACE_TOKEN || secrets.HUGGING_FACE_TOKEN }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN || secrets.KAGGLE_TOKEN }}
      ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN || secrets.ZENODO_ACCESS_TOKEN || secrets.ZENODO_API_TOKEN || secrets.ZENODO_API_KEY || secrets.ZENODO_PAT }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 884d1d90bd1fb6ecca14992c6c60d677
      BASELINE_HF: 8028f12c86daf3c940f6ed9e2d822fd5e3803f68
      BASELINE_SITE: c0166f525fd19c4c0292af00548bdfcbdb8876c9
      BASELINE_KAGGLE: '39'
      BASELINE_NOTEBOOK: '20'
      GIT_LFS_SKIP_SMUDGE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validated build and platform dependencies
        run: |
          npm ci
          python -m pip install requests 'pyarrow==22.0.0' 'kaggle==2.2.4' 'huggingface_hub>=0.34,<1' 'rdflib>=7,<8' 'pyshacl>=0.30,<1' 'mlcroissant==1.1.1' 'PyLD==3.3.0' PyYAML
      - name: Build and validate exact candidate
        run: |
          npm run build
          node --test --test-concurrency=1 tests/*.test.mjs
          python tests/validate_machine_resources.py dist
          python tests/validate_canonical_invariants.py dist
          python tests/validate_platform_bundle.py dist --no-query --rdf
          python tests/mutable-platform-release.test.py
          python tests/immutable-archive.test.py
      - name: Freeze and validate the website + HF + Kaggle + notebook cohort against published immutable 1.3.6 DOI
        run: python .github/scripts/mutable_platform_release.py preflight
      - name: Archive validated candidate without publication
        if: success()
        run: tar -czf /tmp/candidate.tar.gz -C /tmp mutable-release
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: frozen-mutable-candidate-136
          path: /tmp/candidate.tar.gz
          compression-level: 0
          retention-days: 30
      - name: Publish only after complete successful 1.3.6 preflight and frozen artifact
        run: python .github/scripts/mutable_platform_release.py publish
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutable-136-publication-evidence
          path: |
            /tmp/mutable-release/*.json
            /tmp/mutable-release/*.log
          if-no-files-found: warn
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutable-136-preflight-evidence
          path: |
            /tmp/mutable-release/*.json
            /tmp/mutable-release/*.log
          if-no-files-found: warn
          retention-days: 30

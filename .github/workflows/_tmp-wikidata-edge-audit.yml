name: Temporary Wikidata edge audit
on:
  push:
    branches: [main]
    paths: ['.github/workflows/_tmp-wikidata-edge-audit.yml']
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check --no-input requests==2.32.5
      - name: Query Wikidata and Wikiversity read-only
        shell: bash
        run: |
          python - <<'PY'
          import requests,json,os,datetime,re
          H={'User-Agent':'GhezelbaashWikidataEdgeAudit/1.0 (https://www.ghezelbaash.ir/)'}
          WD='https://www.wikidata.org/w/api.php'
          WV='https://en.wikiversity.org/w/api.php'
          ENW='https://en.wikipedia.org/w/api.php'
          def api(base,**p):
            p.update(format='json',formatversion=2)
            r=requests.get(base,params=p,headers=H,timeout=60); r.raise_for_status(); d=r.json()
            if 'error' in d: raise RuntimeError(d['error'])
            return d
          def entity(qid):
            d=api(WD,action='wbgetentities',ids=qid,props='labels|descriptions|claims|sitelinks|aliases',languages='en|fa')
            e=d['entities'][qid]
            claims={}
            for pid,arr in e.get('claims',{}).items():
              vals=[]
              for s in arr:
                sn=s.get('mainsnak',{}); dv=sn.get('datavalue',{}).get('value')
                if isinstance(dv,dict) and 'id' in dv: v=dv['id']
                else: v=dv
                vals.append({'id':s.get('id'),'rank':s.get('rank'),'value':v,'references':len(s.get('references',[])),'qualifiers':list(s.get('qualifiers',{}).keys())})
              claims[pid]=vals
            return {'id':qid,'lastrevid':e.get('lastrevid'),'modified':e.get('modified'),'label_en':e.get('labels',{}).get('en',{}).get('value'),'description_en':e.get('descriptions',{}).get('en',{}).get('value'),'claims':claims,'sitelinks':{k:v.get('title') for k,v in e.get('sitelinks',{}).items()}}
          def page(base,title,n=20):
            d=api(base,action='query',titles=title,prop='info|pageprops|revisions|links',rvprop='ids|timestamp|user|comment|content',rvslots='main',rvlimit=n,pllimit=500)
            p=d['query']['pages'][0]; rs=p.get('revisions',[]); txt=(rs[0].get('slots',{}).get('main',{}).get('content','') if rs else '')
            return {'title':p.get('title'),'pageid':p.get('pageid'),'missing':'missing' in p,'wikibase_item':p.get('pageprops',{}).get('wikibase_item'),'latest_revid':rs[0].get('revid') if rs else None,'latest_timestamp':rs[0].get('timestamp') if rs else None,'latest_user':rs[0].get('user') if rs else None,'latest_comment':rs[0].get('comment') if rs else None,'revisions':[{'revid':r.get('revid'),'timestamp':r.get('timestamp'),'user':r.get('user'),'comment':r.get('comment')} for r in rs],'links':[x.get('title') for x in p.get('links',[])],'content':txt}
          wv=page(WV,'Botulinum toxin in aesthetic medicine',50)
          enw=page(ENW,'Botulinum toxin',20)
          qids=['Q140287622','Q208413','Q114242090']
          if wv.get('wikibase_item') and wv['wikibase_item'] not in qids: qids.append(wv['wikibase_item'])
          ents={q:entity(q) for q in qids}
          txt=wv['content']
          out={'checked_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'wikiversity':{k:v for k,v in wv.items() if k!='content'},'wikiversity_content_signals':{
            'mentions_saeed':'saeed ghezelbash' in txt.lower() or 'mohammad saeed ghezelbash' in txt.lower(),
            'mentions_person_qid':'q140287622' in txt.lower(),
            'has_author_template':bool(re.search(r'(?i)author',txt)),
            'has_wikidata_template':bool(re.search(r'(?i)wikidata',txt)),
            'opening_1200':txt[:1200]
          },'enwiki':{k:v for k,v in enw.items() if k not in ('content','links')},'enwiki_signals':{
            'contains_sister_v_yes':'v=yes' in enw['content'].lower(),
            'contains_q114242090':'q114242090' in enw['content'].lower(),
            'contains_ghezelbash':'ghezelbash' in enw['content'].lower() or 'ghezelbaash' in enw['content'].lower()
          },'entities':ents}
          os.makedirs('wikimedia',exist_ok=True)
          with open('wikimedia/_tmp-wikidata-edge-audit.json','w',encoding='utf8') as f: json.dump(out,f,ensure_ascii=False,indent=2,sort_keys=True)
          print(json.dumps({'ok':True,'wv_qid':wv.get('wikibase_item'),'qids':qids},ensure_ascii=False))
          PY
      - name: Commit snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add wikimedia/_tmp-wikidata-edge-audit.json
          git commit -m 'Record temporary Wikidata edge audit snapshot'
          git push

name: Temporary read-only Wikidata edge audit
on:
  push:
    branches: [main]
    paths: ['.github/workflows/_tmp-wikidata-edge-audit.yml']
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check --no-input requests==2.32.5
      - name: Query live Wikimedia graph read-only
        shell: bash
        run: |
          python - <<'PY'
          import requests,json,os,datetime
          H={'User-Agent':'GhezelbaashWikidataEdgeAudit/1.0 (https://www.ghezelbaash.ir/)'}
          def get(url,**p):
            p.update(format='json',formatversion=2)
            r=requests.get(url,params=p,headers=H,timeout=60); r.raise_for_status(); d=r.json()
            if 'error' in d: raise RuntimeError(d['error'])
            return d
          def page(api,title):
            d=get(api,action='query',titles=title,prop='info|pageprops|revisions',rvprop='ids|timestamp|user|comment|content',rvslots='main',rvlimit=5)
            p=d['query']['pages'][0]; rs=p.get('revisions',[]); txt=(rs[0].get('slots',{}).get('main',{}).get('content','') if rs else '')
            return {'title':p.get('title'),'pageid':p.get('pageid'),'missing':'missing' in p,'wikibase_item':p.get('pageprops',{}).get('wikibase_item'),'latest_revid':rs[0].get('revid') if rs else None,'latest_timestamp':rs[0].get('timestamp') if rs else None,'latest_user':rs[0].get('user') if rs else None,'latest_comment':rs[0].get('comment') if rs else None,'contains_q140287622':'Q140287622' in txt,'contains_ghezelbash':'ghezelbash' in txt.lower() or 'ghezelbaash' in txt.lower(),'contains_sister_v_yes':'|v=yes' in txt.replace(' ','')}
          wd='https://www.wikidata.org/w/api.php'; ev='https://en.wikiversity.org/w/api.php'; ew='https://en.wikipedia.org/w/api.php'
          v=page(ev,'Botulinum toxin in aesthetic medicine')
          w=page(ew,'Botulinum toxin')
          qids=['Q140287622']
          if v.get('wikibase_item'): qids.append(v['wikibase_item'])
          if w.get('wikibase_item'): qids.append(w['wikibase_item'])
          qids=list(dict.fromkeys(qids))
          ent=get(wd,action='wbgetentities',ids='|'.join(qids),props='labels|descriptions|claims|sitelinks',languages='en|fa').get('entities',{})
          def compact(e):
            claims={}
            for pid,arr in e.get('claims',{}).items():
              vals=[]
              for c in arr:
                sn=c.get('mainsnak',{}); dv=sn.get('datavalue',{}).get('value')
                if isinstance(dv,dict) and 'id' in dv: dv=dv['id']
                elif isinstance(dv,dict) and 'text' in dv: dv=dv['text']
                vals.append({'value':dv,'rank':c.get('rank'),'references':len(c.get('references',[])),'qualifiers':list(c.get('qualifiers',{}).keys())})
              claims[pid]=vals
            return {'labels':{k:v.get('value') for k,v in e.get('labels',{}).items()},'descriptions':{k:v.get('value') for k,v in e.get('descriptions',{}).items()},'claims':claims,'sitelinks':{k:v.get('title') for k,v in e.get('sitelinks',{}).items()}}
          out={'checked_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'wikiversity_page':v,'wikipedia_page':w,'entities':{qid:compact(e) for qid,e in ent.items()}}
          os.makedirs('wikimedia',exist_ok=True)
          with open('wikimedia/_tmp-wikidata-edge-audit.json','w',encoding='utf8') as f: json.dump(out,f,ensure_ascii=False,indent=2,sort_keys=True)
          print(json.dumps(out,ensure_ascii=False))
          PY
      - name: Commit snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add wikimedia/_tmp-wikidata-edge-audit.json
          git commit -m 'Record temporary Wikidata edge audit snapshot'
          git push

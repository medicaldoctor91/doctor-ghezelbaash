name: Publish verified solo-practice convergence

on:
  push:
    branches:
      - ops/solo-practice-convergence-20261016
    paths:
      - .github/workflows/solo-practice-publish-final-20261016.yml

permissions:
  contents: read

concurrency:
  group: doctor-ghezelbaash-solo-practice-publication-final
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TARGET_SHA: 62cd2dd0432790916467c0c25d8264c20ba103cd
      HF_TOKEN: ${{ secrets.HF_TOKEN || secrets.HUGGINGFACE_TOKEN || secrets.HUGGING_FACE_TOKEN }}
      ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN || secrets.ZENODO_ACCESS_TOKEN || secrets.ZENODO_API_TOKEN || secrets.ZENODO_API_KEY || secrets.ZENODO_PAT }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN || secrets.KAGGLE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 62cd2dd0432790916467c0c25d8264c20ba103cd
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Preflight publication safety
        run: |
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          python - <<'PY'
          import os
          required=['HF_TOKEN','ZENODO_TOKEN','KAGGLE_API_TOKEN']
          missing=[k for k in required if not os.environ.get(k)]
          assert not missing, 'Missing publication bindings: '+str(missing)
          PY
          if grep -nE 'newversion|actions/newversion' .github/scripts/platform_publish.py; then
            echo 'Refusing to run: Zenodo new-version path detected.' >&2
            exit 1
          fi

      - name: Install locked build and publication dependencies
        run: |
          npm ci
          python -m pip install --disable-pip-version-check \
            'huggingface_hub>=0.34,<1' 'pyarrow>=18,<23' 'kaggle>=2.2,<3' \
            'rdflib>=7,<8' 'pyshacl>=0.30,<1' 'mlcroissant==1.1.1'

      - name: Build and validate exact canonical target
        run: |
          node --test tests/solo-practice-semantics.test.mjs
          python tests/platform-bundle-sync.test.py
          npm run build
          python tests/validate_platform_bundle.py dist --no-query --rdf
          python tests/validate_machine_resources.py dist

      - name: Gate on converged production website
        run: |
          python - <<'PY'
          import hashlib,json,os,time,urllib.request
          from pathlib import Path
          origin='https://www.ghezelbaash.ir/'
          target=os.environ['TARGET_SHA']
          names=['graph.jsonld','graph.ttl','shapes.ttl','provenance.jsonld','integrity-manifest.json','release-provenance.json']
          expected={n:hashlib.sha256((Path('dist')/n).read_bytes()).hexdigest() for n in names}
          def fetch(name,attempt):
              url=origin+name+'?verify='+target+'-'+str(attempt)+'-'+str(time.time_ns())
              req=urllib.request.Request(url,headers={'Cache-Control':'no-cache','Pragma':'no-cache'})
              return urllib.request.urlopen(req,timeout=30).read()
          for attempt in range(30):
              mismatches=[]
              for name in names:
                  body=fetch(name,attempt)
                  if hashlib.sha256(body).hexdigest()!=expected[name]:mismatches.append(name)
              if not mismatches:break
              print('waiting for production convergence',attempt,mismatches,flush=True);time.sleep(5)
          else:raise RuntimeError('Production bytes did not converge: '+repr(mismatches))
          live=json.loads(fetch('release-provenance.json',999))
          assert live.get('sourceCommit')==target,live
          graph=json.loads(fetch('graph.jsonld',1000))
          person='https://www.ghezelbaash.ir/#saeed-ghezelbash';clinic='https://www.ghezelbaash.ir/dr-saeed-ghezelbash-aesthetic-clinic-kermanshah'
          nodes={n.get('@id'):n for n in graph.get('@graph',[]) if isinstance(n,dict) and n.get('@id')}
          def ids(v):
              vals=v if isinstance(v,list) else ([] if v is None else [v]);return [x.get('@id') if isinstance(x,dict) else x for x in vals]
          p=nodes[person];c=nodes[clinic]
          assert not ids(p.get('worksFor'))
          assert clinic not in ids(p.get('affiliation'))
          assert not ids(c.get('employee'))
          assert clinic in ids(p.get('owns')) and clinic in ids(p.get('practicesAt'))
          assert person in ids(c.get('owner')) and person in ids(c.get('founder'))
          for path in ['', 'dr-saeed-ghezelbash-aesthetic-clinic-kermanshah', 'historical-patient-origin-summary']:
              url=origin+path+('?verify=' if '?' not in path else '&verify=')+target+'-'+str(time.time_ns())
              html=urllib.request.urlopen(urllib.request.Request(url,headers={'Cache-Control':'no-cache'}),timeout=30).read().decode(errors='ignore')
              assert 'Medical Director / مدیر پزشکی' not in html,path
          print('PRODUCTION_GATE_PASS',flush=True)
          PY

      - name: Publish Hugging Face, same-DOI Zenodo corrections, and Kaggle
        env:
          GITHUB_SHA: 62cd2dd0432790916467c0c25d8264c20ba103cd
        run: python .github/scripts/platform_publish.py

      - name: Verify publication receipts and semantic residue
        run: |
          python - <<'PY'
          import json,zipfile
          from pathlib import Path
          root=Path('/tmp/platform-publish')
          report=json.loads((root/'publication-report.json').read_text())
          print(json.dumps(report,ensure_ascii=False,indent=2))
          assert report.get('sourceCommit')=='62cd2dd0432790916467c0c25d8264c20ba103cd'
          assert report.get('hfRevision')
          for key in ['zenodoSource','zenodoDataset']:
              rec=report[key]
              assert rec.get('DOI_unchanged') is True
              assert rec.get('version')=='1.3.3', (key,rec)
          assert report['kaggle']['checksums']=='PASS'
          assert report['kaggle']['query_bindings']=='PASS'

          person='https://www.ghezelbaash.ir/#saeed-ghezelbash';clinic='https://www.ghezelbaash.ir/dr-saeed-ghezelbash-aesthetic-clinic-kermanshah'
          def validate_graph(path):
              graph=json.loads(Path(path).read_text())
              nodes={n.get('@id'):n for n in graph.get('@graph',[]) if isinstance(n,dict) and n.get('@id')}
              def ids(v):
                  vals=v if isinstance(v,list) else ([] if v is None else [v]);return [x.get('@id') if isinstance(x,dict) else x for x in vals]
              p=nodes[person];c=nodes[clinic]
              assert not ids(p.get('worksFor'))
              assert clinic not in ids(p.get('affiliation'))
              assert not ids(c.get('employee'))
              assert clinic in ids(p.get('owns')) and clinic in ids(p.get('practicesAt'))
              assert person in ids(c.get('owner')) and person in ids(c.get('founder'))

          validate_graph(root/'hf'/'graph.jsonld')
          validate_graph(root/'zenodo'/'graph.jsonld')
          if (root/'kaggle-live'/'graph.jsonld').exists():validate_graph(root/'kaggle-live'/'graph.jsonld')

          forbidden='Medical Director / مدیر پزشکی'
          for package in [root/'hf',root/'zenodo',root/'kaggle-live']:
              for p in package.rglob('*'):
                  if not p.is_file() or p.suffix.lower() in {'.parquet','.zip','.png','.jpg','.jpeg','.webp','.avif','.mp4','.webm','.woff2','.ico'}:continue
                  try:text=p.read_text()
                  except UnicodeDecodeError:continue
                  assert forbidden not in text,(package.name,str(p))
          for z in (root/'zenodo-source').rglob('*.zip'):
              with zipfile.ZipFile(z) as archive:
                  for name in archive.namelist():
                      if not name.endswith(('.mjs','.js','.json','.jsonld','.md','.html','.astro','.ttl','.txt','.csv','.yml','.yaml')):continue
                      data=archive.read(name).decode(errors='ignore')
                      assert forbidden not in data,name
          print('PUBLICATION_SEMANTIC_VERIFICATION_PASS',flush=True)
          PY

      - name: Save final convergence evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: solo-practice-final-publication-evidence
          path: |
            /tmp/platform-publish/context.json
            /tmp/platform-publish/publication-report.json
          if-no-files-found: warn
          overwrite: true

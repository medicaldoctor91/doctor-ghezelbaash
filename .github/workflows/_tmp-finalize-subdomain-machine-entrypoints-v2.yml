name: Finalize machine entrypoint subdomains v2
on:
  push:
    branches: [main]
    paths: ['.github/workflows/_tmp-finalize-subdomain-machine-entrypoints-v2.yml']
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Apply final canonical source contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          root=Path('.')
          contract_path=root/'src/data/subdomain-redirects.json'
          contract=json.loads(contract_path.read_text(encoding='utf-8'))
          rules={row['host']:row for row in contract['singleRedirects']['rules']}
          rules['github.ghezelbaash.ir'].update(ref='ghezelbaash_github_entity_graph_v1',target='https://www.ghezelbaash.ir/graph.jsonld')
          rules['ig.ghezelbaash.ir'].update(ref='ghezelbaash_ig_ai_corpus_v1',target='https://www.ghezelbaash.ir/llms-full.txt')
          contract_path.write_text(json.dumps(contract,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          edge_path=root/'scripts/configure-cloudflare-edge.py'
          edge=edge_path.read_text(encoding='utf-8')
          for old,new in {
              'ghezelbaash_github_repository_v1':'ghezelbaash_github_entity_graph_v1',
              'ghezelbaash_instagram_identity_bridge_v1':'ghezelbaash_ig_ai_corpus_v1',
          }.items():
              if old not in edge: raise SystemExit(f'Missing expected old edge identifier: {old}')
              edge=edge.replace(old,new)
          edge_path.write_text(edge,encoding='utf-8')

          validator_path=root/'scripts/validate-subdomain-redirects.mjs'
          validator=validator_path.read_text(encoding='utf-8')
          old_block='''const validateTarget=(targetValue,ref)=>{\n  const target=new URL(targetValue);\n  if(target.protocol!==\'https:\')fail(`Non-HTTPS redirect target ${ref}`);\n  if(target.origin===canonical.origin){\n    if(target.pathname!==\'/\'||!target.hash)fail(`Canonical redirect target must use a precise visible fragment: ${ref}`);\n    const fragment=decodeURIComponent(target.hash.slice(1));\n    if(!fragments.has(fragment))fail(`Redirect target fragment is absent from canonical HTML: ${fragment}`);\n    if(machineRoutes.has(target.pathname))fail(`Redirect must not terminate on a machine-only URL: ${ref}`);\n  }\n  return target;\n};'''
          new_block='''const validateHttpsTarget=(targetValue,ref)=>{\n  const target=new URL(targetValue);\n  if(target.protocol!==\'https:\')fail(`Non-HTTPS redirect target ${ref}`);\n  return target;\n};\nconst validateVisibleCanonicalTarget=(targetValue,ref)=>{\n  const target=validateHttpsTarget(targetValue,ref);\n  if(target.origin!==canonical.origin||target.pathname!==\'/\'||!target.hash)fail(`Canonical passage redirect must use a precise visible fragment: ${ref}`);\n  const fragment=decodeURIComponent(target.hash.slice(1));\n  if(!fragments.has(fragment))fail(`Redirect target fragment is absent from canonical HTML: ${fragment}`);\n  return target;\n};'''
          if old_block not in validator: raise SystemExit('Validator target-policy block drift')
          validator=validator.replace(old_block,new_block)
          validator=validator.replace('  validateTarget(rule.target,rule.ref);','  validateHttpsTarget(rule.target,rule.ref);')
          old_identity='''const ig=single.rules.find(rule=>rule.host===\'ig.ghezelbaash.ir\');\nif(ig?.target!==`${contract.canonicalOrigin}/#verified-physician-identity-core`)fail(\'ig subdomain must consolidate into the visible first-party identity bridge\');\nif([...machineRoutes].some(route=>ig.target.startsWith(`${contract.canonicalOrigin}${route}`)))fail(\'ig subdomain must not redirect to a Googlebot-noindex machine representation\');\nconst github=single.rules.find(rule=>rule.host===\'github.ghezelbaash.ir\');\nif(github?.target!==\'https://github.com/medicaldoctor91/doctor-ghezelbaash\')fail(\'github subdomain must preserve repository intent and independent source evidence\');'''
          new_identity='''const machineEntrypoints=new Map([\n  [\'github.ghezelbaash.ir\',{ref:\'ghezelbaash_github_entity_graph_v1\',route:\'/graph.jsonld\'}],\n  [\'ig.ghezelbaash.ir\',{ref:\'ghezelbaash_ig_ai_corpus_v1\',route:\'/llms-full.txt\'}],\n]);\nfor(const [host,expected] of machineEntrypoints){\n  const rule=single.rules.find(row=>row.host===host);\n  const expectedTarget=`${contract.canonicalOrigin}${expected.route}`;\n  if(rule?.ref!==expected.ref||rule?.target!==expectedTarget)fail(`${host} machine entrypoint drift`);\n  const target=new URL(rule.target);\n  if(target.origin!==canonical.origin||target.pathname!==expected.route||target.search||target.hash)fail(`${host} must terminate on its exact first-party machine endpoint`);\n  if(!machineRoutes.has(expected.route))fail(`${host} target is not an approved machine representation`);\n  await readFile(path.join(root,\'src/pages\',`${expected.route.slice(1)}.ts`),\'utf8\').catch(()=>fail(`Missing static endpoint source for ${expected.route}`));\n}'''
          if old_identity not in validator: raise SystemExit('Validator legacy identity block drift')
          validator=validator.replace(old_identity,new_identity)
          validator=validator.replace('const target=validateTarget(group.target,group.ref);','const target=validateVisibleCanonicalTarget(group.target,group.ref);')
          validator=validator.replace('Pages/blog legacy redirect parity drift','Pages/blog historical redirect parity drift')
          validator=validator.replace('Legacy Blogspot path is missing from Bulk Redirect contract','Historical Blogspot path is missing from Bulk Redirect contract')
          validator=validator.replace('  unmatchedBlogPaths:bulk.unmatchedPathPolicy','  machineEntrypoints:Object.fromEntries([...machineEntrypoints].map(([host,{route}])=>[host,route])),\n  unmatchedBlogPaths:bulk.unmatchedPathPolicy')
          validator_path.write_text(validator,encoding='utf-8')
          PY
      - name: Validate complete source and build
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          node scripts/validate-subdomain-redirects.mjs
          python scripts/configure-cloudflare-edge.py --self-test
          python scripts/test-cloudflare-edge-reconciliation.py
          npm run build
      - name: Remove temporary residue and publish one clean final tree
        shell: bash
        run: |
          set -euo pipefail
          find .github/workflows -maxdepth 1 -type f -name '_tmp-*' -print -delete
          if git grep -n -E 'ghezelbaash_github_repository_v1|ghezelbaash_instagram_identity_bridge_v1'; then
            echo 'Obsolete subdomain implementation identifiers remain' >&2
            exit 1
          fi
          leftovers="$(git ls-files --others --cached --exclude-standard | grep -E '(^|/)(_tmp|tmp|patches?|overrides?)(/|\.|$)' || true)"
          if [ -n "$leftovers" ]; then
            echo "Temporary/patch/override residue remains:" >&2
            printf '%s\n' "$leftovers" >&2
            exit 1
          fi
          git config user.name 'Dr. Saeed Ghezelbaash | دکتر سعید قزلباش'
          git config user.email 'medicaldoctor91@gmail.com'
          git add src/data/subdomain-redirects.json scripts/configure-cloudflare-edge.py scripts/validate-subdomain-redirects.mjs
          git add -A .github/workflows
          git diff --cached --check
          git status --short
          git commit -m 'Finalize first-party machine subdomain entrypoints'
          git push origin HEAD:main

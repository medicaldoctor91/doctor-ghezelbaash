name: Diagnose v2 execution failure

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/diagnose-v2-execution.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Execute extracted v2 scripts with full logging
        shell: bash
        run: |
          set +e
          mkdir -p tmp
          report=tmp/v2-execution.txt
          : > "$report"
          echo "source_sha=$GITHUB_SHA" >> "$report"
          sudo apt-get update >> "$report" 2>&1
          sudo apt-get install -y --no-install-recommends webp >> "$report" 2>&1
          python -m pip install --disable-pip-version-check rdflib==7.1.4 >> "$report" 2>&1
          echo "tooling_exit=$?" >> "$report"

          cwebp -quiet -q 82 -m 6 -metadata all -resize 640 427 public/media/images/physician/master/saeed-ghezelbaash-physician-portrait.jpg -o public/media/images/physician/saeed-ghezelbash-portrait-640.webp >> "$report" 2>&1
          echo "portrait_exit=$?" >> "$report"
          cwebp -quiet -q 82 -m 6 -metadata all -resize 640 427 public/media/images/physician/master/saeed-ghezelbaash-with-clinical-team.jpg -o public/media/images/physician/saeed-ghezelbash-with-clinic-team-640.webp >> "$report" 2>&1
          echo "team_exit=$?" >> "$report"
          cwebp -quiet -q 82 -m 6 -metadata all -resize 640 427 public/media/images/physician/master/saeed-ghezelbaash-in-clinical-office.jpg -o public/media/images/physician/saeed-ghezelbash-in-clinical-office-640.webp >> "$report" 2>&1
          echo "office_exit=$?" >> "$report"

          python3 - <<'PY' >> "$report" 2>&1
          from pathlib import Path
          import textwrap
          source=Path('.github/workflows/execute-finalization-v2.yml').read_text(encoding='utf-8').splitlines()
          blocks=[]; current=None
          for line in source:
              if "python3 - <<'PY'" in line:
                  current=[]; continue
              if current is not None and line.strip()=='PY':
                  blocks.append(textwrap.dedent('\n'.join(current))+'\n'); current=None; continue
              if current is not None: current.append(line)
          print('extracted_blocks',len(blocks),[len(x) for x in blocks])
          for i,b in enumerate(blocks): Path(f'/tmp/v2-block-{i}.py').write_text(b,encoding='utf-8')
          PY
          echo "extract_exit=$?" >> "$report"

          python3 /tmp/v2-block-0.py >> "$report" 2>&1
          patch_rc=$?
          echo "patch_exit=$patch_rc" >> "$report"
          if [ "$patch_rc" -eq 0 ]; then
            python3 /tmp/v2-block-1.py >> "$report" 2>&1
            validate_rc=$?
          else
            validate_rc=999
          fi
          echo "validate_exit=$validate_rc" >> "$report"

          if [ "$patch_rc" -eq 0 ] && [ "$validate_rc" -eq 0 ]; then
            npm ci --no-audit --no-fund >> "$report" 2>&1
            echo "npm_ci_exit=$?" >> "$report"
            npm run build >> "$report" 2>&1
            echo "build_exit=$?" >> "$report"
          fi

          git diff --stat >> "$report" 2>&1
          git reset --hard HEAD
          git clean -fd -e tmp/v2-execution.txt
      - name: Commit diagnosis
        if: always()
        run: |
          git config user.name 'OpenAI Project Automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/diagnose-v2-execution.yml
          git add tmp/v2-execution.txt
          git commit -m 'Record v2 execution failure details'
          git push origin HEAD:main

name: One-shot Instagram heading audit

on:
  push:
    paths:
      - '.github/workflows/patch-best-doctor-headings.yml'

permissions:
  contents: write

jobs:
  audit-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact source blob
        run: |
          test "$(git hash-object src/pages/index.md)" = "37e11e7026941f4e01780b5da6115b856d1d70fd"

      - name: Count Instagram-linked headings
        shell: python
        run: |
          from pathlib import Path
          import re

          text = Path('src/pages/index.md').read_text(encoding='utf-8')
          instagram = 'https://www.instagram.com/doctor.ghezelbaash/'
          heading_re = re.compile(r'<h([1-6]) id="([^"]+)">(.*?)</h\1>', re.S)
          strip_tags = lambda s: re.sub(r'<[^>]+>', '', s)

          rows=[]
          for m in heading_re.finditer(text):
              level,id_,inner=m.group(1),m.group(2),m.group(3)
              if re.search(r'<a\b[^>]*\bhref=["\']'+re.escape(instagram)+r'["\'][^>]*>', inner):
                  rows.append((level,id_,strip_tags(inner).strip()))

          best_doctor=[]
          for m in heading_re.finditer(text):
              visible=strip_tags(m.group(3)).strip()
              if 'بهترین دکتر' in visible:
                  best_doctor.append((m.group(1),m.group(2),visible,'<a ' in m.group(3)))

          out=[]
          out.append(f'TOTAL_INSTAGRAM_PROFILE_HEADING_LINKS={len(rows)}')
          out.append(f'TOTAL_BEST_DOCTOR_HEADINGS={len(best_doctor)}')
          out.append(f'UNLINKED_BEST_DOCTOR_HEADINGS={sum(not x[3] for x in best_doctor)}')
          out.append('INSTAGRAM_HEADING_LINKS:')
          out.extend(f'H{level}\t{id_}\t{text}' for level,id_,text in rows)
          Path('heading-instagram-audit.txt').write_text('\n'.join(out)+'\n',encoding='utf-8')

      - name: Commit audit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add heading-instagram-audit.txt
          git commit -m "Add temporary Instagram heading audit"
          git push origin HEAD:main

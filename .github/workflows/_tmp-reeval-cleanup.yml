name: Temporary re-evaluation cleanup
on:
  push:
    branches: [main]
    paths: ['.github/workflows/_tmp-reeval-cleanup.yml']
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Clean temporary files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f --ignore-unmatch \
            .github/workflows/_tmp-live-status-reeval.yml \
            wikimedia/_tmp-live-status-reeval.json \
            .github/workflows/_tmp-compact-reeval.yml \
            wikimedia/_tmp-compact-reeval.json \
            .github/workflows/_tmp-reeval-cleanup.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Remove temporary re-evaluation files'
          git push

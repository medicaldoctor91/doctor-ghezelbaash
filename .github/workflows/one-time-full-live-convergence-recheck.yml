name: One-time full live convergence recheck

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-time-full-live-convergence-recheck.yml"

permissions:
  contents: read

jobs:
  recheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Build current source
        run: |
          set -euo pipefail
          npm ci
          npm run build

      - name: Probe and download live Kaggle dataset when public
        run: |
          set -euo pipefail
          mkdir -p .recheck/kaggle
          VIEW_URL="https://www.kaggle.com/api/v1/datasets/view/saeedghezelbash/dr-saeed-ghezelbash-public-knowledge-graph"
          DOWNLOAD_URL="https://www.kaggle.com/api/v1/datasets/download/saeedghezelbash/dr-saeed-ghezelbash-public-knowledge-graph"
          code="$(curl -sSL -o .recheck/kaggle-meta.json -w '%{http_code}' "$VIEW_URL" || true)"
          printf '%s' "$code" > .recheck/kaggle-http-status.txt
          curl -sSL "https://www.kaggle.com/api/v1/datasets/list?search=saeed%20ghezelbash" -o .recheck/kaggle-search.json || true
          if [ "$code" = "200" ]; then
            dcode="$(curl -sSL -o .recheck/kaggle.zip -w '%{http_code}' "$DOWNLOAD_URL" || true)"
            printf '%s' "$dcode" > .recheck/kaggle-download-http-status.txt
            if [ "$dcode" = "200" ]; then
              unzip -q .recheck/kaggle.zip -d .recheck/kaggle
            else
              echo "Kaggle bulk download endpoint returned HTTP $dcode; metadata is still available."
            fi
          else
            printf 'not-attempted' > .recheck/kaggle-download-http-status.txt
            echo "Kaggle dataset view endpoint returned HTTP $code; continuing with availability diagnostics."
          fi

      - name: Recheck Website, Hugging Face, Zenodo, Kaggle
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, urllib.parse, urllib.request
          from pathlib import Path

          DIST=Path("dist")
          KROOT=Path(".recheck/kaggle")
          release=json.loads(Path("src/data/release.json").read_text())
          registry=json.loads(Path("src/data/machine-resources.json").read_text())
          kaggle_status=Path(".recheck/kaggle-http-status.txt").read_text().strip()
          kaggle_download_status=Path(".recheck/kaggle-download-http-status.txt").read_text().strip()

          shared=sorted(
              r["path"] for r in registry["resources"]
              if {"website","huggingFace","zenodo"}.issubset(set(r.get("targets") or []))
          )
          record=str(release["dataset"]["zenodo"]["recordId"])
          doi=release["dataset"]["zenodo"]["versionDoi"]
          version=release["release"]
          hf_repo=release["dataset"]["huggingFace"]["dataset"].removeprefix("https://huggingface.co/datasets/")

          def h(b): return hashlib.sha256(b).hexdigest()
          def get(url,timeout=120):
              req=urllib.request.Request(url,headers={"User-Agent":"doctor-ghezelbaash-live-recheck/1.0"})
              with urllib.request.urlopen(req,timeout=timeout) as resp:
                  return resp.read()

          dist_rows=[]
          dist_fail=[]
          for name in shared:
              local=(DIST/name).read_bytes()
              live=get("https://www.ghezelbaash.ir/" + ("" if name=="index.html" else urllib.parse.quote(name)))
              hf=get("https://huggingface.co/datasets/"+hf_repo+"/resolve/main/"+urllib.parse.quote(name)+"?download=true")
              key=urllib.parse.quote(name,safe="")
              zen=get(f"https://zenodo.org/api/records/{record}/files/{key}/content")
              row={
                  "file":name,
                  "sourceBuild":h(local),
                  "liveWebsite":h(live),
                  "huggingFace":h(hf),
                  "zenodo":h(zen),
              }
              row["allEqual"]=len({row["sourceBuild"],row["liveWebsite"],row["huggingFace"],row["zenodo"]})==1
              dist_rows.append(row)
              if not row["allEqual"]: dist_fail.append(name)

          result={
              "recheck":"PASS",
              "release":version,
              "doi":doi,
              "sharedResources":len(shared),
              "websiteHfZenodoEqualCount":sum(1 for r in dist_rows if r["allEqual"]),
              "websiteHfZenodoMismatches":dist_fail,
              "kaggleHttpStatus":kaggle_status,
              "kaggleDownloadHttpStatus":kaggle_download_status,
          }

          search_path=Path(".recheck/kaggle-search.json")
          if search_path.exists() and search_path.stat().st_size:
              try:
                  search=json.loads(search_path.read_text())
                  rows=search if isinstance(search,list) else search.get("datasets") or search.get("results") or []
                  result["kaggleSearchMatches"]=[
                      {
                          "ref":x.get("ref"),
                          "title":x.get("title"),
                          "lastUpdated":x.get("lastUpdated"),
                          "currentVersionNumber":x.get("currentVersionNumber"),
                      }
                      for x in rows if isinstance(x,dict) and ("ghezelbash" in str(x.get("ref","")).lower() or "ghezelbash" in str(x.get("title","")).lower())
                  ][:20]
              except Exception as e:
                  result["kaggleSearchParseError"]=str(e)

          if kaggle_status=="200":
              meta=json.loads(Path(".recheck/kaggle-meta.json").read_text())
              result["kaggleMetadataSummary"]={
                  "ref":meta.get("ref"),
                  "title":meta.get("title"),
                  "currentVersionNumber":meta.get("currentVersionNumber"),
                  "lastUpdated":meta.get("lastUpdated"),
                  "totalBytes":meta.get("totalBytes"),
                  "isPrivate":meta.get("isPrivate"),
                  "licenseName":meta.get("licenseName"),
                  "fileCount":len(meta.get("datasetFiles") or meta.get("files") or []),
                  "topLevelKeys":sorted(meta.keys()),
              }
              source_candidates=[
                  "src/content-source/page.md",
                  "src/data/semantic/knowledge-graph.jsonld",
                  "src/data/semantic/shapes.ttl",
                  "src/data/release.json",
                  "src/data/machine-resources.json",
                  "README.md",
                  "CITATION.cff",
                  "codemeta.json",
                  "package.json",
                  "package-lock.json",
              ]
              source_rows=[]
              if kaggle_download_status=="200":
                  for name in source_candidates:
                      kp=KROOT/name
                      cp=Path(name)
                      if kp.is_file() and cp.is_file():
                          source_rows.append({
                              "file":name,
                              "equal":h(kp.read_bytes())==h(cp.read_bytes()),
                          })
              kg=KROOT/"src/data/semantic/knowledge-graph.jsonld"
              live_graph=get("https://www.ghezelbaash.ir/graph.jsonld")
              claims=[
                  "Iran's #1 doctor by public reputation signals",
                  "highest patient satisfaction",
                  "Kermanshah's most popular doctor",
                  "Kermanshah's top-rated aesthetic physician",
                  "among Iran's most reviewed aesthetic doctors",
                  "one of Kermanshah's most recommended physicians",
                  "leading in patient trust",
              ]
              text=""
              if kaggle_download_status=="200":
                  for p in KROOT.rglob("*"):
                      if p.is_file() and p.stat().st_size<=8_000_000:
                          try: text += "\n"+p.read_text(errors="ignore")
                          except Exception: pass
              result.update({
                  "kaggleFileCount":sum(1 for p in KROOT.rglob("*") if p.is_file()),
                  "kaggleCurrentVersionNumber":meta.get("currentVersionNumber"),
                  "kaggleLastUpdated":meta.get("lastUpdated"),
                  "kaggleSourceCompared":len(source_rows),
                  "kaggleSourceEqualCount":sum(1 for r in source_rows if r["equal"]),
                  "kaggleSourceMismatchCount":sum(1 for r in source_rows if not r["equal"]),
                  "kaggleSourceMismatches":[r["file"] for r in source_rows if not r["equal"]],
                  "kaggleGraphEqualsLiveWebsiteGraph":kg.is_file() and h(kg.read_bytes())==h(live_graph),
                  "claimsPresentInKaggle":{claim:(claim in text) for claim in claims},
              })

          result["distributionRows"]=dist_rows
          print(json.dumps(result,ensure_ascii=False,indent=2))
          if dist_fail:
              raise SystemExit(3)
          PY

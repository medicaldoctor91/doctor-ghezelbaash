name: Prune unused direct dependencies

on:
  push:
    branches: [audit/dist-invariant-proof]
    paths: [.github/workflows/prune-unused-deps.yml]

permissions:
  contents: write

jobs:
  prune:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: cleanup/dist-invariant-source
          fetch-depth: 0
      - name: Use project Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Remove unused direct development dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm pkg delete devDependencies.css-tree devDependencies.exiftool-vendored devDependencies.playwright
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund
          git diff --check
          git diff -- package.json package-lock.json
      - name: Commit only dependency metadata
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git status --porcelain=v1 --untracked-files=all | cut -c4- | LC_ALL=C sort)"
          test "$changed" = $'package-lock.json\npackage.json'
          git config user.name ghezelbaash-source-cleanup
          git config user.email actions@users.noreply.github.com
          git add package.json package-lock.json
          git commit -m 'chore: prune unused development dependencies'
          git push origin HEAD:cleanup/dist-invariant-source

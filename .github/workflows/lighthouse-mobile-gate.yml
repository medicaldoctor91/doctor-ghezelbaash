name: Lighthouse mobile gate

on:
  workflow_run:
    workflows: ["Deploy Cloudflare Pages production"]
    types: [completed]

permissions:
  contents: read
  statuses: write

jobs:
  mobile-lighthouse:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Run three mobile Lighthouse probes
        shell: bash
        env:
          TARGET_URL: https://www.ghezelbaash.ir/
        run: |
          set -euo pipefail
          mkdir -p lh
          for i in 1 2 3; do
            npx --yes lighthouse "$TARGET_URL" \
              --only-categories=performance \
              --output=json \
              --output-path="lh/run-$i.json" \
              --quiet \
              --chrome-flags="--headless=new --no-sandbox --disable-dev-shm-usage" \
              --form-factor=mobile \
              --throttling-method=simulate
          done

      - name: Compute median and enforce 95+
        id: score
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' > lh/summary.env
          import json, statistics
          rows=[]
          for i in range(1,4):
              d=json.load(open(f'lh/run-{i}.json'))
              a=d['audits']
              rows.append({
                  'score': round(d['categories']['performance']['score']*100),
                  'fcp': a['first-contentful-paint']['numericValue'],
                  'lcp': a['largest-contentful-paint']['numericValue'],
                  'tbt': a['total-blocking-time']['numericValue'],
                  'cls': a['cumulative-layout-shift']['numericValue'],
                  'si': a['speed-index']['numericValue'],
              })
          scores=sorted(r['score'] for r in rows)
          median=scores[1]
          # Report the run whose score is the median; deterministic tie handling.
          row=next(r for r in rows if r['score']==median)
          print(f"MEDIAN_SCORE={median}")
          print(f"FCP_MS={row['fcp']:.0f}")
          print(f"LCP_MS={row['lcp']:.0f}")
          print(f"TBT_MS={row['tbt']:.0f}")
          print(f"CLS={row['cls']:.3f}")
          print(f"SI_MS={row['si']:.0f}")
          print('RUN_SCORES='+','.join(map(str,[r['score'] for r in rows])))
          PY
          cat lh/summary.env
          cat lh/summary.env >> "$GITHUB_ENV"
          source lh/summary.env
          if [ "$MEDIAN_SCORE" -lt 95 ]; then
            exit 1
          fi

      - name: Publish commit status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          source lh/summary.env 2>/dev/null || true
          score="${MEDIAN_SCORE:-0}"
          state=success
          if [ "$score" -lt 95 ]; then state=failure; fi
          desc="mobile ${score}; runs ${RUN_SCORES:-n/a}; LCP ${LCP_MS:-n/a}ms; TBT ${TBT_MS:-n/a}ms; CLS ${CLS:-n/a}"
          desc="${desc:0:140}"
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/statuses/$SHA" \
            -d "$(python - <<PY
          import json, os
          print(json.dumps({'state':os.environ.get('state','success'),'context':'lighthouse/mobile','description':os.environ.get('desc','mobile lighthouse')}))
          PY
          )"

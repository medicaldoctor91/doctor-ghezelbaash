name: Lighthouse mobile gate

on:
  workflow_run:
    workflows: ["Deploy Cloudflare Pages production"]
    types: [completed]

permissions:
  contents: write
  statuses: write

concurrency:
  group: lighthouse-mobile-production
  cancel-in-progress: true

jobs:
  mobile-lighthouse:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout performance result branch
        uses: actions/checkout@v4
        with:
          ref: perf-results
          fetch-depth: 1

      - name: Run three mobile Lighthouse probes
        shell: bash
        env:
          TARGET_URL: https://www.ghezelbaash.ir/
        run: |
          set -euo pipefail
          mkdir -p lh
          for i in 1 2 3; do
            npx --yes lighthouse "$TARGET_URL" \
              --only-categories=performance \
              --output=json \
              --output-path="lh/run-$i.json" \
              --quiet \
              --chrome-flags="--headless=new --no-sandbox --disable-dev-shm-usage" \
              --form-factor=mobile \
              --throttling-method=simulate
          done

      - name: Compute median and enforce 95+
        id: score
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' > lh/summary.env
          import json
          rows=[]
          for i in range(1,4):
              d=json.load(open(f'lh/run-{i}.json'))
              a=d['audits']
              rows.append({
                  'score': round(d['categories']['performance']['score']*100),
                  'fcp': a['first-contentful-paint']['numericValue'],
                  'lcp': a['largest-contentful-paint']['numericValue'],
                  'tbt': a['total-blocking-time']['numericValue'],
                  'cls': a['cumulative-layout-shift']['numericValue'],
                  'si': a['speed-index']['numericValue'],
              })
          median=sorted(r['score'] for r in rows)[1]
          row=next(r for r in rows if r['score']==median)
          print(f"MEDIAN_SCORE={median}")
          print(f"FCP_MS={row['fcp']:.0f}")
          print(f"LCP_MS={row['lcp']:.0f}")
          print(f"TBT_MS={row['tbt']:.0f}")
          print(f"CLS={row['cls']:.3f}")
          print(f"SI_MS={row['si']:.0f}")
          print('RUN_SCORES='+','.join(map(str,[r['score'] for r in rows])))
          PY
          cat lh/summary.env
          cat lh/summary.env >> "$GITHUB_ENV"
          source lh/summary.env
          if [ "$MEDIAN_SCORE" -lt 95 ]; then
            exit 1
          fi

      - name: Persist latest mobile result
        if: always()
        shell: bash
        env:
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          source lh/summary.env 2>/dev/null || true
          mkdir -p performance
          export MEDIAN_SCORE="${MEDIAN_SCORE:-0}" FCP_MS="${FCP_MS:-0}" LCP_MS="${LCP_MS:-0}" TBT_MS="${TBT_MS:-0}" CLS="${CLS:-0}" SI_MS="${SI_MS:-0}" RUN_SCORES="${RUN_SCORES:-}"
          python - <<'PY' > performance/latest-mobile.json
          import json, os, datetime
          scores=[int(x) for x in os.environ.get('RUN_SCORES','').split(',') if x]
          out={
              'source_sha': os.environ['SOURCE_SHA'],
              'source_deploy_workflow_run_id': int(os.environ['SOURCE_RUN_ID']),
              'tested_at_utc': datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'target': 'https://www.ghezelbaash.ir/',
              'form_factor': 'mobile',
              'throttling_method': 'simulate',
              'run_scores': scores,
              'median_score': int(os.environ['MEDIAN_SCORE']),
              'metrics': {
                  'fcp_ms': int(float(os.environ['FCP_MS'])),
                  'lcp_ms': int(float(os.environ['LCP_MS'])),
                  'tbt_ms': int(float(os.environ['TBT_MS'])),
                  'cls': float(os.environ['CLS']),
                  'speed_index_ms': int(float(os.environ['SI_MS'])),
              },
              'gate': {'minimum_score': 95, 'passed': int(os.environ['MEDIAN_SCORE']) >= 95},
          }
          print(json.dumps(out, ensure_ascii=False, indent=2))
          PY
          git config user.name "ghezelbaash-performance-bot"
          git config user.email "actions@users.noreply.github.com"
          git add performance/latest-mobile.json
          if git diff --cached --quiet; then
            echo "No result change"
          else
            git commit -m "Record mobile Lighthouse for ${SOURCE_SHA:0:12}"
            git push origin HEAD:perf-results
          fi

      - name: Publish commit status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          source lh/summary.env 2>/dev/null || true
          score="${MEDIAN_SCORE:-0}"
          state=success
          if [ "$score" -lt 95 ]; then state=failure; fi
          desc="mobile ${score}; runs ${RUN_SCORES:-n/a}; LCP ${LCP_MS:-n/a}ms; TBT ${TBT_MS:-n/a}ms; CLS ${CLS:-n/a}"
          desc="${desc:0:140}"
          export STATE="$state" DESC="$desc"
          python - <<'PY' > lh/status.json
          import json, os
          print(json.dumps({
              'state': os.environ['STATE'],
              'context': 'lighthouse/mobile',
              'description': os.environ['DESC'],
          }))
          PY
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/statuses/$SHA" \
            --data-binary @lh/status.json

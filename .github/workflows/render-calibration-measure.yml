name: Temporary render calibration measurement

on:
  push:
    branches: [fix/render-calibration-measurement-20260907]

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Syntax-check calibration tooling
        run: |
          node --check scripts/lib/render-calibration-fingerprint.mjs
          node --check scripts/measure-render-calibration.mjs
          node --check scripts/validate-render-calibration.mjs
      - name: Build the exact local page without external account preflight
        shell: bash
        run: |
          set -euo pipefail
          npm run prepare:site
          ASTRO_TELEMETRY_DISABLED=1 ./node_modules/.bin/astro build
          shopt -s nullglob
          assets=(.generated/public/assets/site.*.css)
          test "${#assets[@]}" -eq 1
          mkdir -p dist/assets
          cp "${assets[0]}" dist/assets/
          test -s "dist/assets/$(basename "${assets[0]}")"
      - name: Measure six canonical viewport widths in Chromium
        run: node scripts/measure-render-calibration.mjs --output=.generated/validation/render-calibration-candidate.json
      - name: Confirm measurement did not mutate canonical calibration
        run: git diff --exit-code -- src/data/render-calibration.json
      - name: Upload measurement candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: render-calibration-candidate-${{ github.sha }}
          path: .generated/validation/render-calibration-candidate.json
          if-no-files-found: error
          retention-days: 7
# Repeatability run: workflow-only commit; DOM/CSS/font fingerprint must remain identical.

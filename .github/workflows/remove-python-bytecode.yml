name: Remove generated Python bytecode

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/remove-python-bytecode.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Remove generated artifacts and self-delete
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          rm -rf .github/scripts/__pycache__
          rm -f .github/workflows/remove-python-bytecode.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove generated Python bytecode artifacts'
          git push origin HEAD:"${HEAD_BRANCH}"

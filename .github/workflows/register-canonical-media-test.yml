name: Temporary canonical media test registration

on:
  push:
    branches: [fix/semantic-calibration-recovery-20260907]

permissions:
  contents: write

jobs:
  register:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
      - run: node scripts/register-canonical-media-test.mjs
      - name: Run the new regression contract before committing it
        run: node --test scripts/test-canonical-media-semantics.mjs
      - name: Require exact registration scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed=$(git diff --name-only)
          test "$changed" = "package.json"
          grep -q 'test:canonical-media-semantics' package.json
          grep -q 'npm run test:media-inventory && npm run test:canonical-media-semantics && npm run validate:language-contract' package.json
      - name: Commit test registration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "Enforce canonical media semantic regressions"
          git push origin "HEAD:${GITHUB_REF_NAME}"

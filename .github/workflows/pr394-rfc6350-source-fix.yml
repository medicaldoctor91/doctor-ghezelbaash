name: PR 394 RFC 6350 source fix

on:
  push:
    branches:
      - candidate/final-repository-plan-2026

permissions:
  contents: write

concurrency:
  group: pr394-rfc6350-source-fix
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: candidate/final-repository-plan-2026
          fetch-depth: 0

      - name: Apply RFC 6350 source-of-truth fix
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

          python - <<'PY'
          from pathlib import Path

          generator = Path('scripts/lib/projections/contact-discovery.mjs')
          source = generator.read_text()
          old = '`TEL;TYPE=work,voice:${telephone}`'
          new = '`TEL;VALUE=uri;TYPE=work,voice:tel:${telephone}`'
          assert source.count(old) == 2, source.count(old)
          generator.write_text(source.replace(old, new))

          test_file = Path('scripts/test-machine-resources.mjs')
          tests = test_file.read_text()
          marker = '    assert.ok(unfolded.includes("VERSION:4.0"));\n'
          addition = (
              marker
              + '    const telLines = unfolded.filter((line) => line.startsWith("TEL;"));\n'
              + '    assert.equal(telLines.length, 1);\n'
              + '    assert.equal(telLines[0], `TEL;VALUE=uri;TYPE=work,voice:tel:${byId.get(release.clinic.id).telephone}`);\n'
              + '    assert.match(telLines[0], /^TEL;VALUE=uri;TYPE=work,voice:tel:\\+[1-9][0-9]*$/u);\n'
          )
          assert tests.count(marker) == 1, tests.count(marker)
          test_file.write_text(tests.replace(marker, addition, 1))
          PY

          git rm .github/workflows/pr394-rfc6350-source-fix.yml
          git diff --check
          git diff -- scripts/lib/projections/contact-discovery.mjs scripts/test-machine-resources.mjs

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: enforce RFC 6350 VALUE=uri telephone semantics'

          REMOTE_HEAD="$(git ls-remote origin refs/heads/candidate/final-repository-plan-2026 | cut -f1)"
          test "$REMOTE_HEAD" = "$GITHUB_SHA"
          git push origin HEAD:candidate/final-repository-plan-2026

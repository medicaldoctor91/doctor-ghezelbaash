name: One-time SHACL identity migration

on:
  push:
    branches:
      - cleanup/remove-development-url-aliases

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ !contains(github.event.head_commit.message, '[shacl-identity-migrated]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: cleanup/remove-development-url-aliases
          fetch-depth: 0

      - name: Migrate supplemental SHACL physician targets
        run: node scripts/one-time-shacl-identity-migration.mjs

      - name: Commit migrated SHACL source
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 1
          git commit -m "Align supplemental SHACL with physician fragment identity [shacl-identity-migrated]"
          git push origin HEAD:cleanup/remove-development-url-aliases

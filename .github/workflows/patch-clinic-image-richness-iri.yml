name: Temporary clinic image richness IRI patch

on:
  push:
    branches: [fix/semantic-calibration-recovery-20260907]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: node scripts/patch-clinic-image-richness-iri.mjs
      - name: Prepare source dependencies and validate
        run: |
          npm run prepare:distribution
          node scripts/validate-source.mjs
      - name: Require exact patch scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed=$(git diff --name-only)
          test "$changed" = "scripts/validate-source.mjs"
      - name: Commit IRI richness gate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/validate-source.mjs
          git commit -m "Validate clinic image richness as materialized IRIs"
          git push origin "HEAD:${GITHUB_REF_NAME}"

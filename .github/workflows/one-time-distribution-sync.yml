name: One-time synchronize website, Hugging Face, and Zenodo

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-time-distribution-sync.yml"

permissions:
  contents: read

concurrency:
  group: doctor-ghezelbaash-one-time-distribution-sync
  cancel-in-progress: false

jobs:
  synchronize:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
      SOURCE_COMMIT: "06cc82a59032100e783de17bd3a16650cbdd7da5"
      HF_TOKEN: ${{ secrets.HF_TOKEN || secrets.HUGGINGFACE_TOKEN || secrets.HUGGING_FACE_TOKEN }}
      ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN || secrets.ZENODO_ACCESS_TOKEN || secrets.ZENODO_API_TOKEN || secrets.ZENODO_API_KEY || secrets.ZENODO_PAT }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Build canonical website distribution
        run: |
          set -euo pipefail
          npm ci
          npm run build
          test -s dist/index.html
          grep -Fq "Iran's #1 doctor by public reputation signals" dist/index.html
          grep -Fq "Kermanshah's most popular doctor" dist/index.html

      - name: Install publication client
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "huggingface_hub>=0.34,<1"

      - name: Synchronize Hugging Face and Zenodo without changing DOI
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, time, urllib.error, urllib.parse, urllib.request
          from pathlib import Path
          from huggingface_hub import HfApi, CommitOperationAdd, hf_hub_download
          from huggingface_hub.errors import HfHubHTTPError

          ROOT=Path(".")
          DIST=ROOT/"dist"
          SOURCE_COMMIT=os.environ["SOURCE_COMMIT"]
          HF_TOKEN=os.environ.get("HF_TOKEN","").strip()
          ZENODO_TOKEN=os.environ.get("ZENODO_TOKEN","").strip()
          if not HF_TOKEN:
              raise RuntimeError("HF token secret is unavailable")
          if not ZENODO_TOKEN:
              raise RuntimeError("Zenodo token secret is unavailable")

          release=json.loads((ROOT/"src/data/release.json").read_text())
          registry=json.loads((ROOT/"src/data/machine-resources.json").read_text())
          version=release["release"]
          record=str(release["dataset"]["zenodo"]["recordId"])
          doi=release["dataset"]["zenodo"]["versionDoi"]
          hf_repo=release["dataset"]["huggingFace"]["dataset"].removeprefix("https://huggingface.co/datasets/")

          shared=[]
          for resource in registry["resources"]:
              targets=set(resource.get("targets") or [])
              if "huggingFace" in targets and "zenodo" in targets and "website" in targets:
                  name=resource["path"]
                  path=DIST/name
                  if not path.is_file():
                      raise RuntimeError(f"Shared distribution file missing from DIST: {name}")
                  shared.append(name)
          shared=sorted(shared)
          if not shared:
              raise RuntimeError("No shared website/Hugging Face/Zenodo resources found")

          def sha256_bytes(data): return hashlib.sha256(data).hexdigest()
          def sha256_file(path): return sha256_bytes(Path(path).read_bytes())
          local_hash={name:sha256_file(DIST/name) for name in shared}

          # ---- Hugging Face: replace only the shared canonical files, preserve Viewer-specific extras.
          api=HfApi(endpoint="https://huggingface.co", token=HF_TOKEN)
          info=api.dataset_info(hf_repo, revision="main")
          ops=[]
          for name in shared:
              same=False
              try:
                  remote_path=hf_hub_download(repo_id=hf_repo,repo_type="dataset",revision=info.sha,filename=name,token=HF_TOKEN)
                  same=sha256_file(remote_path)==local_hash[name]
              except Exception:
                  same=False
              if not same:
                  ops.append(CommitOperationAdd(path_in_repo=name,path_or_fileobj=str(DIST/name)))
          if ops:
              result=api.create_commit(
                  repo_id=hf_repo,
                  repo_type="dataset",
                  revision="main",
                  parent_commit=info.sha,
                  create_pr=False,
                  commit_message="maintenance: synchronize v1.3.3 shared distribution with canonical website",
                  commit_description=f"Same-release synchronization from canonical website source {SOURCE_COMMIT}; preserve DOI {doi}.",
                  operations=ops,
              )
              hf_oid=result.oid
          else:
              hf_oid=info.sha

          # Keep same-release branch/tag aligned with the corrected main snapshot.
          for kind,name in (("branch",f"release/v{version}"),("tag",f"v{version}")):
              try:
                  ref=api.dataset_info(hf_repo,revision=name)
                  if ref.sha==hf_oid:
                      continue
                  if kind=="branch":
                      api.delete_branch(repo_id=hf_repo,repo_type="dataset",branch=name)
                  else:
                      api.delete_tag(repo_id=hf_repo,repo_type="dataset",tag=name)
              except HfHubHTTPError as e:
                  if e.response is None or e.response.status_code!=404:
                      raise
              if kind=="branch":
                  api.create_branch(repo_id=hf_repo,repo_type="dataset",branch=name,revision=hf_oid)
              else:
                  api.create_tag(repo_id=hf_repo,repo_type="dataset",tag=name,revision=hf_oid)

          for name in shared:
              remote=hf_hub_download(repo_id=hf_repo,repo_type="dataset",revision=hf_oid,filename=name,token=HF_TOKEN,force_download=True)
              if sha256_file(remote)!=local_hash[name]:
                  raise RuntimeError(f"Hugging Face hash mismatch after sync: {name}")

          # ---- Zenodo helpers.
          ZBASE="https://zenodo.org/api"
          def zrequest(method,url,payload=None,raw=None,content_type="application/json",ok=(200,201,202,204)):
              headers={"Authorization":f"Bearer {ZENODO_TOKEN}","Accept":"application/json","User-Agent":"doctor-ghezelbaash-sync/1.0"}
              if raw is not None:
                  data=raw
                  headers["Content-Type"]=content_type
              elif payload is not None:
                  data=json.dumps(payload,ensure_ascii=False).encode()
                  headers["Content-Type"]="application/json"
              else:
                  data=b"" if method in {"POST","PUT"} else None
              req=urllib.request.Request(url,data=data,method=method,headers=headers)
              try:
                  with urllib.request.urlopen(req,timeout=180) as resp:
                      body=resp.read()
                      if resp.status not in ok:
                          raise RuntimeError(f"Zenodo HTTP {resp.status}: {method} {url}")
                      return resp.status,(json.loads(body) if body else None)
              except urllib.error.HTTPError as e:
                  body=e.read().decode("utf-8","replace")
                  raise RuntimeError(f"Zenodo HTTP {e.code} {method} {url}: {body[:1600]}") from e

          _,public=zrequest("GET",f"{ZBASE}/records/{record}")
          public_doi=((public.get("pids") or {}).get("doi") or {}).get("identifier") or public.get("doi")
          public_version=(public.get("metadata") or {}).get("version")
          if public_doi!=doi or public_version!=version:
              raise RuntimeError(f"Zenodo identity drift before sync: DOI={public_doi} version={public_version}")

          # Download existing public inventory first, so non-shared preservation files survive unchanged.
          _,public_files=zrequest("GET",f"{ZBASE}/records/{record}/files")
          current={}
          for entry in public_files.get("entries",[]):
              name=entry["key"]
              key=urllib.parse.quote(name,safe="")
              req=urllib.request.Request(
                  f"{ZBASE}/records/{record}/files/{key}/content",
                  headers={"Authorization":f"Bearer {ZENODO_TOKEN}","User-Agent":"doctor-ghezelbaash-sync/1.0"}
              )
              with urllib.request.urlopen(req,timeout=180) as resp:
                  current[name]=resp.read()

          # Shared files always come from current canonical DIST.
          desired=dict(current)
          for name in shared:
              desired[name]=(DIST/name).read_bytes()

          # Refresh DIST hash manifest if this record carries it.
          full_dist={
              p.relative_to(DIST).as_posix():sha256_file(p)
              for p in sorted(DIST.rglob("*")) if p.is_file()
          }
          desired["dist-sha256.json"]=(json.dumps(full_dist,sort_keys=True,separators=(",",":"))+"\n").encode()

          # Preserve the established attestation schema while updating fields made stale by this correction.
          if "release-attestation.json" in current:
              try:
                  att=json.loads(current["release-attestation.json"])
              except Exception as e:
                  raise RuntimeError("Existing Zenodo release attestation is invalid") from e
          else:
              att={}
          att.update({
              "release":version,
              "releasePublishedAt":release["dateModified"],
              "canonicalDatasetIri":release["dataset"]["id"],
              "sourceRepository":release["dataset"]["github"]["repository"],
              "sourceCommit":SOURCE_COMMIT,
              "zenodoVersionDoi":doi,
              "zenodoRecordId":record,
              "releaseHistory":release["dataset"]["zenodo"]["releaseHistory"],
              "graphJsonldSha256":local_hash["graph.jsonld"],
              "graphTurtleSha256":local_hash["graph.ttl"],
              "indexHtmlSha256":local_hash["index.html"],
              "distFileCount":len(full_dist),
              "validation":"PASS",
          })
          if "schema" not in att:
              att["schema"]="https://www.ghezelbaash.ir/release-attestation/v4"
          att={k:v for k,v in att.items() if v is not None}
          desired["release-attestation.json"]=(json.dumps(att,ensure_ascii=False,indent=2)+"\n").encode()

          # Clear abandoned edit draft if one exists, then request same-record file correction.
          try:
              zrequest("DELETE",f"{ZBASE}/records/{record}/draft",ok=(204,))
          except RuntimeError as e:
              if "HTTP 404" not in str(e):
                  raise
          zrequest("POST",f"{ZBASE}/records/{record}/draft",ok=(201,))

          published=False
          try:
              status,_=zrequest(
                  "POST",
                  f"{ZBASE}/records/{record}/file-modification",
                  payload={
                      "reason":"correction",
                      "comment":f"Synchronize the preserved v{version} files with the canonical website source {SOURCE_COMMIT} while retaining the existing DOI."
                  },
                  ok=(200,201),
              )
              if status!=200:
                  raise RuntimeError("Zenodo did not authorize immediate same-record file modification")

              _,draft_files=zrequest("GET",f"{ZBASE}/records/{record}/draft/files")
              for entry in draft_files.get("entries",[]):
                  key=urllib.parse.quote(entry["key"],safe="")
                  zrequest("DELETE",f"{ZBASE}/records/{record}/draft/files/{key}",ok=(204,))

              names=sorted(desired)
              zrequest("POST",f"{ZBASE}/records/{record}/draft/files",payload=[{"key":n} for n in names],ok=(201,))
              expected={}
              for name in names:
                  data=desired[name]
                  expected[name]=hashlib.md5(data).hexdigest()
                  key=urllib.parse.quote(name,safe="")
                  zrequest("PUT",f"{ZBASE}/records/{record}/draft/files/{key}/content",raw=data,content_type="application/octet-stream",ok=(200,))
                  zrequest("POST",f"{ZBASE}/records/{record}/draft/files/{key}/commit",ok=(200,))

              _,draft_files=zrequest("GET",f"{ZBASE}/records/{record}/draft/files")
              got={e["key"]:str(e.get("checksum","")).removeprefix("md5:") for e in draft_files.get("entries",[])}
              if set(got)!=set(expected) or any(got[k]!=v for k,v in expected.items()):
                  raise RuntimeError("Zenodo draft inventory/hash mismatch")

              zrequest("POST",f"{ZBASE}/records/{record}/draft/actions/publish",ok=(202,))
              published=True
          except Exception:
              if not published:
                  try:
                      zrequest("DELETE",f"{ZBASE}/records/{record}/draft",ok=(204,))
                  except Exception:
                      pass
              raise

          # Public Zenodo readback and DOI invariance.
          final=None
          for _ in range(45):
              _,candidate=zrequest("GET",f"{ZBASE}/records/{record}")
              candidate_doi=((candidate.get("pids") or {}).get("doi") or {}).get("identifier") or candidate.get("doi")
              candidate_version=(candidate.get("metadata") or {}).get("version")
              if candidate_doi==doi and candidate_version==version:
                  final=candidate
                  break
              time.sleep(2)
          if final is None:
              raise RuntimeError("Zenodo public record did not converge")
          final_doi=((final.get("pids") or {}).get("doi") or {}).get("identifier") or final.get("doi")
          if final_doi!=doi:
              raise RuntimeError(f"Zenodo DOI changed unexpectedly: {final_doi}")

          _,final_files=zrequest("GET",f"{ZBASE}/records/{record}/files")
          final_entries={e["key"]:e for e in final_files.get("entries",[])}
          if set(final_entries)!=set(desired):
              raise RuntimeError("Zenodo final inventory drift")
          for name in shared:
              key=urllib.parse.quote(name,safe="")
              req=urllib.request.Request(
                  f"{ZBASE}/records/{record}/files/{key}/content",
                  headers={"Authorization":f"Bearer {ZENODO_TOKEN}","User-Agent":"doctor-ghezelbaash-sync/1.0"}
              )
              with urllib.request.urlopen(req,timeout=180) as resp:
                  blob=resp.read()
              if sha256_bytes(blob)!=local_hash[name]:
                  raise RuntimeError(f"Zenodo public shared-file mismatch: {name}")

          print(json.dumps({
              "externalSync":"PASS",
              "sourceCommit":SOURCE_COMMIT,
              "release":version,
              "doi":doi,
              "record":record,
              "sharedResources":len(shared),
              "huggingFaceCommit":hf_oid,
              "zenodoFiles":len(desired),
          },separators=(",",":")))
          PY

      - name: Verify live website, Hugging Face, and Zenodo byte parity
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, time, urllib.parse, urllib.request
          from pathlib import Path

          DIST=Path("dist")
          release=json.loads(Path("src/data/release.json").read_text())
          registry=json.loads(Path("src/data/machine-resources.json").read_text())
          record=str(release["dataset"]["zenodo"]["recordId"])
          doi=release["dataset"]["zenodo"]["versionDoi"]
          version=release["release"]
          hf_repo=release["dataset"]["huggingFace"]["dataset"].removeprefix("https://huggingface.co/datasets/")
          ztoken=os.environ["ZENODO_TOKEN"]

          shared=sorted(
              r["path"] for r in registry["resources"]
              if {"website","huggingFace","zenodo"}.issubset(set(r.get("targets") or []))
          )
          def sha(b): return hashlib.sha256(b).hexdigest()
          def get(url,headers=None,timeout=120):
              req=urllib.request.Request(url,headers=headers or {"User-Agent":"doctor-ghezelbaash-parity/1.0"})
              with urllib.request.urlopen(req,timeout=timeout) as resp:
                  return resp.read()

          marker=b"Iran's #1 doctor by public reputation signals"
          live_index=None
          for _ in range(60):
              try:
                  blob=get("https://www.ghezelbaash.ir/")
                  if marker in blob:
                      live_index=blob
                      break
              except Exception:
                  pass
              time.sleep(10)
          if live_index is None:
              raise RuntimeError("Live website did not converge to the synchronized source within 10 minutes")

          failures=[]
          for name in shared:
              local=(DIST/name).read_bytes()
              expected=sha(local)
              live=live_index if name=="index.html" else get("https://www.ghezelbaash.ir/"+urllib.parse.quote(name))
              hf=get("https://huggingface.co/datasets/"+hf_repo+"/resolve/main/"+urllib.parse.quote(name)+"?download=true")
              key=urllib.parse.quote(name,safe="")
              zen=get(
                  f"https://zenodo.org/api/records/{record}/files/{key}/content",
                  headers={"Authorization":f"Bearer {ztoken}","User-Agent":"doctor-ghezelbaash-parity/1.0"},
              )
              got={"live":sha(live),"huggingFace":sha(hf),"zenodo":sha(zen)}
              bad={k:v for k,v in got.items() if v!=expected}
              if bad:
                  failures.append({"file":name,"expected":expected,**got})

          if failures:
              print(json.dumps({"parity":"FAIL","failures":failures},indent=2))
              raise RuntimeError(f"Cross-platform parity failed for {len(failures)} shared resources")

          # Final identity proof.
          zmeta=json.loads(get(
              f"https://zenodo.org/api/records/{record}",
              headers={"Authorization":f"Bearer {ztoken}","Accept":"application/json","User-Agent":"doctor-ghezelbaash-parity/1.0"}
          ))
          final_doi=((zmeta.get("pids") or {}).get("doi") or {}).get("identifier") or zmeta.get("doi")
          final_version=(zmeta.get("metadata") or {}).get("version")
          if final_doi!=doi or final_version!=version:
              raise RuntimeError("Final Zenodo DOI/version identity mismatch")

          print(json.dumps({
              "parity":"PASS",
              "sharedResources":len(shared),
              "live":"https://www.ghezelbaash.ir/",
              "huggingFace":hf_repo,
              "zenodoRecord":record,
              "doi":final_doi,
              "version":final_version,
          },separators=(",",":")))
          PY

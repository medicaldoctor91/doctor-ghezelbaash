name: One-time physician identity migration

on:
  push:
    branches:
      - cleanup/remove-development-url-aliases

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ !contains(github.event.head_commit.message, '[identity-migrated]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: cleanup/remove-development-url-aliases
          fetch-depth: 0

      - name: Apply exact identity migration
        run: node scripts/one-time-physician-identity-migration.mjs

      - name: Commit migrated canonical sources
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 1
          git commit -m "Migrate physician identity to homepage fragment [identity-migrated]"
          git push origin HEAD:cleanup/remove-development-url-aliases

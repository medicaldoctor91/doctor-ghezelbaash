name: Report identity asset metadata

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/report-identity-assets.yml

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Build metadata report without external tooling
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp
          python3 - <<'PY'
          import hashlib, json, mimetypes, pathlib, struct

          def dimensions(data: bytes, suffix: str):
              suffix = suffix.lower()
              if suffix == '.png':
                  if data[:8] != b'\x89PNG\r\n\x1a\n':
                      raise ValueError('invalid PNG')
                  return struct.unpack('>II', data[16:24])
              if suffix in {'.jpg', '.jpeg'}:
                  i = 2
                  while i < len(data):
                      if data[i] != 0xFF:
                          i += 1
                          continue
                      marker = data[i + 1]
                      i += 2
                      if marker in {0xD8, 0xD9}:
                          continue
                      length = int.from_bytes(data[i:i+2], 'big')
                      if marker in {0xC0,0xC1,0xC2,0xC3,0xC5,0xC6,0xC7,0xC9,0xCA,0xCB,0xCD,0xCE,0xCF}:
                          h = int.from_bytes(data[i+3:i+5], 'big')
                          w = int.from_bytes(data[i+5:i+7], 'big')
                          return w, h
                      i += length
                  raise ValueError('JPEG dimensions not found')
              return None

          paths = [
            'public/media/images/physician/master/saeed-ghezelbaash-physician-portrait.jpg',
            'public/media/images/physician/master/saeed-ghezelbaash-with-clinical-team.jpg',
            'public/media/images/physician/master/saeed-ghezelbaash-in-clinical-office.jpg',
            'public/media/brand/doctor-ghezelbaash-symbol-512.png',
            'public/favicon.svg',
            'public/favicon.ico',
            'public/favicon-48x48.png',
            'public/apple-touch-icon.png',
            'public/fonts/vazirmatn-nl-wght.woff2',
          ]
          out = {}
          for raw in paths:
              p = pathlib.Path(raw)
              data = p.read_bytes()
              item = {
                  'bytes': len(data),
                  'sha256': hashlib.sha256(data).hexdigest(),
                  'mime': mimetypes.guess_type(p.name)[0] or 'application/octet-stream',
              }
              dim = dimensions(data, p.suffix)
              if dim:
                  item['width'], item['height'] = dim
              out[raw] = item
          pathlib.Path('tmp/identity-assets-metadata.json').write_text(json.dumps(out, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Commit report and remove workflow
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/report-identity-assets.yml
          git add tmp/identity-assets-metadata.json
          git commit -m 'Record identity asset hashes and dimensions'
          git push origin HEAD:main

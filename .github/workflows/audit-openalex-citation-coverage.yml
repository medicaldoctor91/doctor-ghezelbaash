name: Audit OpenAlex citation coverage

on:
  push:
    branches: [main]
    paths:
      - 'scripts/audit_openalex_citation_coverage.py'
      - 'scripts/audit_missing_citation_evidence.py'
      - '.github/workflows/audit-openalex-citation-coverage.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check --no-input requests==2.32.5
      - name: Validate missing citation evidence via Crossref
        run: python scripts/audit_missing_citation_evidence.py

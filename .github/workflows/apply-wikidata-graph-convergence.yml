name: Temporary Wikidata graph convergence apply

on:
  push:
    branches:
      - candidate/wikidata-graph-convergence-2026-09-14

permissions:
  contents: write

jobs:
  apply-validate-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Apply reviewed patch and create local candidate commit
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .github/wikidata-graph-convergence-20260914.patch.gz.b64 | gzip -d > /tmp/wikidata-graph-convergence.patch
          git apply --check /tmp/wikidata-graph-convergence.patch
          git apply /tmp/wikidata-graph-convergence.patch
          git rm .github/wikidata-graph-convergence-20260914.patch.gz.b64 .github/workflows/apply-wikidata-graph-convergence.yml
          git diff --check
          python - <<'PY'
          import subprocess
          expected = {
              '.github/wikidata-graph-convergence-20260914.patch.gz.b64',
              '.github/workflows/apply-wikidata-graph-convergence.yml',
              'codemeta.json',
              'scripts/test-final-entity-contract.mjs',
              'scripts/validate-evidence.mjs',
              'scripts/validate-final-entity-contract.mjs',
              'scripts/validate-physician-projection.mjs',
              'src/data/evidence-registry.json',
              'src/data/release.json',
              'src/data/semantic/knowledge-graph.jsonld',
              'src/data/semantic/shapes.ttl',
          }
          actual = set(subprocess.check_output(['git','diff','--name-only','HEAD'], text=True).splitlines())
          if actual != expected:
              raise SystemExit(f'Unexpected pre-commit paths: expected={sorted(expected)} actual={sorted(actual)}')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(entity): strengthen source-bound Wikidata convergence"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          candidate_sha=$(git rev-parse HEAD)
          echo "SOURCE_COMMIT=${candidate_sha}" >> "$GITHUB_ENV"
          echo "Local candidate commit: ${candidate_sha}"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14.6"

      - name: Provision media validation tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg
          ffprobe -version

      - name: Install exact dependencies
        run: npm ci

      - name: Enforce dependency advisory gate
        run: npm run security:dependencies

      - name: Run canonical release validation and build
        run: npm run release

      - name: Re-run convergence-specific contracts
        shell: bash
        run: |
          set -euo pipefail
          npm run validate:evidence
          npm run validate:final-entity-contract
          npm run validate:physician-projection
          npm run test:final-entity-contract

      - name: Require clean candidate and exact final source delta
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          git fetch origin main
          python - <<'PY'
          import subprocess
          expected = {
              'codemeta.json',
              'scripts/test-final-entity-contract.mjs',
              'scripts/validate-evidence.mjs',
              'scripts/validate-final-entity-contract.mjs',
              'scripts/validate-physician-projection.mjs',
              'src/data/evidence-registry.json',
              'src/data/release.json',
              'src/data/semantic/knowledge-graph.jsonld',
              'src/data/semantic/shapes.ttl',
          }
          actual = set(subprocess.check_output(['git','diff','--name-only','origin/main...HEAD'], text=True).splitlines())
          if actual != expected:
              raise SystemExit(f'Unexpected final paths: expected={sorted(expected)} actual={sorted(actual)}')
          PY
          git diff --check origin/main...HEAD

      - name: Push validated candidate commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          git push origin HEAD:${{ github.ref_name }}
          echo "Validated commit: $(git rev-parse HEAD)"

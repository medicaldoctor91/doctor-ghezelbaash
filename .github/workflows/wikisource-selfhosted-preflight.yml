name: Temporary Wikisource self-hosted preflight

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wikisource-selfhosted-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: self-hosted
    timeout-minutes: 10
    env:
      WIKI_USERNAME: ${{ secrets.WIKIVERSITY_USERNAME }}
      WIKI_BOT_PASSWORD: ${{ secrets.WIKIVERSITY_BOT_PASSWORD }}
    steps:
      - name: Authenticated read-only MediaWiki preflight
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.parse, urllib.request, http.cookiejar

          API='https://en.wikisource.org/w/api.php'
          WD='https://www.wikidata.org/w/api.php'
          ua='SaeedGhezelbash-Wikisource-Preflight/1.0'
          jar=http.cookiejar.CookieJar()
          opener=urllib.request.build_opener(urllib.request.HTTPCookieProcessor(jar))

          def req(url, data=None):
              headers={'User-Agent':ua,'Cache-Control':'no-cache'}
              if data is not None:
                  data=urllib.parse.urlencode(data).encode()
                  headers['Content-Type']='application/x-www-form-urlencoded'
              r=opener.open(urllib.request.Request(url,data=data,headers=headers),timeout=45)
              return json.loads(r.read().decode())

          username=os.environ.get('WIKI_USERNAME','')
          password=os.environ.get('WIKI_BOT_PASSWORD','')
          if not username or not password:
              raise SystemExit('required Wikimedia credentials are unavailable')

          tok=req(API+'?'+urllib.parse.urlencode({'action':'query','meta':'tokens','type':'login','format':'json'}))['query']['tokens']['logintoken']
          login=req(API,{'action':'login','lgname':username,'lgpassword':password,'lgtoken':tok,'format':'json'})
          if login.get('login',{}).get('result')!='Success':
              raise SystemExit('login failed: '+str(login.get('login',{}).get('result')))

          ui=req(API+'?'+urllib.parse.urlencode({'action':'query','meta':'userinfo','uiprop':'groups|rights|blockinfo','format':'json'}))['query']['userinfo']
          rights=set(ui.get('rights',[]))
          if 'edit' not in rights or 'createpage' not in rights or ui.get('blockedby'):
              raise SystemExit('userinfo preflight failed')

          titles=[
            'Individuals with Major Depressive Disorder Report High Scores of Insecure-Avoidant and Insecure-Anxious Attachment Styles, Dissociative Identity Symptoms, and Adult Traumatic Events',
            'Author:Mohammad Saeed Ghezelbash',
            'Author:Saeed Ghezelbash',
          ]
          q=req(API+'?'+urllib.parse.urlencode({'action':'query','titles':'|'.join(titles),'format':'json'}))['query']['pages']
          existing=[]
          for p in q.values():
              if 'missing' not in p:
                  existing.append(p.get('title'))
          if existing:
              raise SystemExit('title collision: '+json.dumps(existing,ensure_ascii=False))

          wd=req(WD+'?'+urllib.parse.urlencode({'action':'wbgetentities','ids':'Q140298431|Q140287622','props':'sitelinks','sitefilter':'enwikisource','format':'json'}))['entities']
          collisions={qid:ent.get('sitelinks',{}).get('enwikisource') for qid,ent in wd.items() if ent.get('sitelinks',{}).get('enwikisource')}
          if collisions:
              raise SystemExit('Wikidata sitelink collision: '+json.dumps(collisions,ensure_ascii=False))

          safe={
            'login':'Success',
            'user':ui.get('name'),
            'groups':ui.get('groups',[]),
            'has_edit':'edit' in rights,
            'has_createpage':'createpage' in rights,
            'blocked':bool(ui.get('blockedby')),
            'titles_missing':titles,
            'enwikisource_sitelinks_absent':['Q140298431','Q140287622']
          }
          print(json.dumps(safe,ensure_ascii=False))
          PY

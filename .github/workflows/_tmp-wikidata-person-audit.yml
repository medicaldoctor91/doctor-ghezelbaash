name: Temporary Wikidata person audit
on:
  push:
    branches: [main]
    paths: ['.github/workflows/_tmp-wikidata-person-audit.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check --no-input requests==2.32.5
      - name: Resolve SciProfiles and verify official-source details
        shell: bash
        run: |
          python - <<'PY'
          import requests,re,json
          s=requests.Session(); s.headers.update({'User-Agent':'GhezelbaashAuthorityAudit/1.1 (https://www.ghezelbaash.ir/)','Accept-Language':'en-US,en;q=0.9'})
          out={}
          urls=[
            'https://staging.core.mdpi.com/2227-9032/9/9/1169',
            'https://staging.core.mdpi.com/2227-9032/9/9/1169/xml',
            'https://www.mdpi.com/2227-9032/9/9/1169/xml',
            'https://mdpi-res.com/d_attachment/healthcare/healthcare-09-01169/article_deploy/healthcare-09-01169-v2.xml'
          ]
          out['mdpi_probes']=[]
          for u in urls:
            try:
              r=s.get(u,timeout=60,allow_redirects=True)
              text=r.text
              prof=sorted(set(re.findall(r'https?://(?:www\.)?sciprofiles\.com/profile/[A-Za-z0-9_.-]+',text,re.I)))
              # capture profile-like href fragments too
              rel=sorted(set(re.findall(r'(?:https?:)?//(?:www\.)?sciprofiles\.com/profile/[A-Za-z0-9_.-]+',text,re.I)))
              out['mdpi_probes'].append({'url':u,'status':r.status_code,'final':r.url,'profiles':prof,'relative_profiles':rel,'has_name':bool(re.search(r'Mohammad\s*Saeed\s*Ghezelbash',text,re.I)),'length':len(text)})
            except Exception as e: out['mdpi_probes'].append({'url':u,'error':str(e)})
          # ORCID public record details and activities
          oid='0009-0001-9346-8475'; base='https://pub.orcid.org/v3.0/'+oid
          for key,path in [('person','/person'),('employments','/employments'),('educations','/educations'),('qualifications','/qualifications'),('works','/works')]:
            try:
              r=s.get(base+path,headers={'Accept':'application/json'},timeout=60); row={'status':r.status_code}
              if r.status_code==200: row['json']=r.json()
              else: row['text']=r.text[:500]
              out['orcid_'+key]=row
            except Exception as e: out['orcid_'+key]={'error':str(e)}
          # Official IRIMC profile raw HTML/JSON markers
          u='https://membersearch.irimc.org/member/profile?id=9efaaf28-52ff-49ad-8d45-be6e48c4fa3e'
          try:
            r=s.get(u,timeout=60); t=r.text
            markers={k:bool(re.search(p,t,re.I)) for k,p in {
              'name':r'(محمد\s*سعید|محمدسعید|سعید)\s*قزلباش',
              'license':r'167430',
              'male_fa':r'\bمرد\b|جنسیت.{0,30}مرد',
              'female_fa':r'\bزن\b|جنسیت.{0,30}زن',
              'kermanshah':r'کرمانشاه',
              'doctor':r'دکتر|پزشک'
            }.items()}
            out['irimc']={'status':r.status_code,'final':r.url,'length':len(t),'markers':markers,'content_type':r.headers.get('content-type')}
          except Exception as e: out['irimc']={'error':str(e)}
          # labels of key QIDs to detect modeling errors
          wd='https://www.wikidata.org/w/api.php'; ids=['Q5944740','Q913404','Q39631','Q15401884','Q3332453','Q3745388','Q4095199','Q4618975','Q29509043']
          try:
            r=s.get(wd,params={'action':'wbgetentities','ids':'|'.join(ids),'props':'labels|descriptions','languages':'en|fa','format':'json','formatversion':2},timeout=60); r.raise_for_status()
            out['qid_labels']={q:{'en':x.get('labels',{}).get('en',{}).get('value'),'fa':x.get('labels',{}).get('fa',{}).get('value'),'description_en':x.get('descriptions',{}).get('en',{}).get('value')} for q,x in r.json()['entities'].items()}
          except Exception as e: out['qid_labels_error']=str(e)
          print(json.dumps(out,ensure_ascii=False,indent=2,sort_keys=True))
          PY

name: Temporary Wikidata person audit
on:
  push:
    branches: [main]
    paths: ['.github/workflows/_tmp-wikidata-person-audit.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check --no-input requests==2.32.5 beautifulsoup4==4.13.4
      - name: Audit Q140287622 and resolve external authority IDs
        shell: bash
        run: |
          python - <<'PY'
          import requests, json, re
          from bs4 import BeautifulSoup
          s=requests.Session(); s.headers.update({'User-Agent':'GhezelbaashWikidataPersonAudit/1.0 (https://www.ghezelbaash.ir/)','Accept-Language':'en-US,en;q=0.9'})
          WD='https://www.wikidata.org/w/api.php'; Q='Q140287622'
          def getj(url, params=None, headers=None, timeout=60):
            r=s.get(url,params=params,headers=headers,timeout=timeout); r.raise_for_status(); return r.json()
          d=getj(WD,{'action':'wbgetentities','ids':Q,'props':'info|labels|descriptions|aliases|claims|sitelinks','format':'json','formatversion':2})['entities'][Q]
          pids=sorted(d.get('claims',{}))
          pe=getj(WD,{'action':'wbgetentities','ids':'|'.join(pids),'props':'labels|datatype','languages':'en','format':'json','formatversion':2})['entities'] if pids else {}
          def val(snak):
            if snak.get('snaktype')!='value': return {'snaktype':snak.get('snaktype')}
            v=snak.get('datavalue',{}).get('value')
            if isinstance(v,dict):
              if 'id' in v: return v['id']
              if 'time' in v: return {'time':v.get('time'),'precision':v.get('precision')}
              if 'text' in v: return {'text':v.get('text'),'language':v.get('language')}
              if 'amount' in v: return {'amount':v.get('amount'),'unit':v.get('unit')}
            return v
          claims=[]
          for pid in pids:
            for c in d['claims'][pid]:
              refs=[]
              for r in c.get('references',[]):
                rr={}
                for sp,ss in r.get('snaks',{}).items(): rr[sp]=[val(x) for x in ss]
                refs.append(rr)
              quals={qp:[val(x) for x in qs] for qp,qs in c.get('qualifiers',{}).items()}
              claims.append({'property':pid,'property_label':pe.get(pid,{}).get('labels',{}).get('en',{}).get('value'),'datatype':pe.get(pid,{}).get('datatype'),'claim_id':c.get('id'),'rank':c.get('rank'),'value':val(c.get('mainsnak',{})),'qualifiers':quals,'references':refs,'reference_count':len(refs)})
          # MDPI article: extract all hrefs around the exact author and all SciProfiles links.
          ext={}
          url='https://www.mdpi.com/2227-9032/9/9/1169'
          r=s.get(url,timeout=60)
          ext['mdpi_status']=r.status_code
          if r.status_code==200:
            html=r.text
            ext['mdpi_sciprofiles_all']=sorted(set(re.findall(r'https?://(?:www\.)?sciprofiles\.com/profile/[^\"\'<> ]+',html,re.I)))
            soup=BeautifulSoup(html,'html.parser')
            exact=[]
            for node in soup.find_all(string=re.compile(r'Mohammad\s+Saeed\s+Ghezelbash',re.I)):
              parent=node.parent
              anc=parent
              for _ in range(8):
                if anc is None: break
                links=[a.get('href') for a in anc.find_all('a',href=True)]
                if any('sciprofiles.com' in (x or '') for x in links):
                  exact.extend(links); break
                anc=anc.parent
            ext['mdpi_exact_author_nearby_links']=sorted(set(x for x in exact if x))
          else: ext['mdpi_text']=r.text[:500]
          # SciProfiles search-engine-friendly probes via site endpoints / direct search.
          probes=[
            'https://sciprofiles.com/search?search=Mohammad%20Saeed%20Ghezelbash',
            'https://sciprofiles.com/search?search=Saeed%20Ghezelbash'
          ]
          ext['sciprofiles_probes']=[]
          for u in probes:
            rr=s.get(u,timeout=60,allow_redirects=True)
            ext['sciprofiles_probes'].append({'url':u,'status':rr.status_code,'final_url':rr.url,'matches':sorted(set(re.findall(r'https?://(?:www\.)?sciprofiles\.com/profile/[A-Za-z0-9_-]+',rr.text,re.I)))[:20]})
          # ORCID public record and Semantic Scholar exact author profile validation.
          orcid='0009-0001-9346-8475'
          rr=s.get('https://pub.orcid.org/v3.0/'+orcid,headers={'Accept':'application/json'},timeout=60)
          ext['orcid_status']=rr.status_code
          if rr.status_code==200:
            od=rr.json(); ext['orcid_person']={'name':od.get('person',{}).get('name'),'emails':od.get('person',{}).get('emails'),'external_identifiers':od.get('person',{}).get('external-identifiers')}
          rr=s.get('https://api.semanticscholar.org/graph/v1/author/3786699',params={'fields':'name,aliases,paperCount,citationCount,hIndex,papers.title,papers.externalIds'},timeout=60)
          ext['semantic_scholar_status']=rr.status_code
          if rr.status_code==200: ext['semantic_scholar']=rr.json()
          # OpenAlex split snapshot.
          ext['openalex']=[]
          for aid in ['A5064828898','A5146521397']:
            rr=s.get('https://api.openalex.org/authors/'+aid,timeout=60)
            row={'id':aid,'status':rr.status_code}
            if rr.status_code==200:
              x=rr.json(); row.update({k:x.get(k) for k in ['display_name','orcid','works_count','cited_by_count','ids','last_known_institutions']})
            ext['openalex'].append(row)
          print(json.dumps({'entity':{'id':Q,'lastrevid':d.get('lastrevid'),'modified':d.get('modified'),'labels':d.get('labels'),'descriptions':d.get('descriptions'),'aliases':d.get('aliases'),'sitelinks':d.get('sitelinks')},'claims':claims,'external':ext},ensure_ascii=False,indent=2,sort_keys=True))
          PY

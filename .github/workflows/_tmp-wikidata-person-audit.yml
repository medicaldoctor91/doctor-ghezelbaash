name: Temporary Wikidata person social audit
on:
  push:
    branches: [main]
    paths: ['.github/workflows/_tmp-wikidata-person-audit.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check --no-input requests==2.32.5
      - name: Verify current social identifiers from public linked sources
        shell: bash
        run: |
          python - <<'PY'
          import requests,re,json,html
          s=requests.Session(); s.headers.update({'User-Agent':'GhezelbaashSocialAudit/1.0 (https://www.ghezelbaash.ir/)','Accept-Language':'en-US,en;q=0.9'})
          out={}
          # Read the current Wikidata social statements.
          wd='https://www.wikidata.org/w/api.php'
          r=s.get(wd,params={'action':'wbgetentities','ids':'Q140287622','props':'claims','format':'json','formatversion':2},timeout=60); r.raise_for_status(); e=r.json()['entities']['Q140287622']
          pids=['P11079','P11245','P11892','P2002','P2003','P2013','P3836','P7085']
          def vals(pid):
            z=[]
            for c in e.get('claims',{}).get(pid,[]):
              try:z.append({'value':c['mainsnak']['datavalue']['value'],'rank':c.get('rank'),'refs':len(c.get('references',[])),'id':c.get('id')})
              except:pass
            return z
          out['wikidata']={p:vals(p) for p in pids}
          # Linktree raw page is useful because it is the profile's own link hub and exposes destination URLs.
          u='https://linktr.ee/Doctor.ghezelbaash'
          try:
            r=s.get(u,timeout=60,allow_redirects=True); t=html.unescape(r.text)
            urls=sorted(set(re.findall(r'https?://[^\"\'<>\\ ]+',t)))
            keep=[]
            for x in urls:
              lx=x.lower()
              if any(d in lx for d in ['instagram.com','threads.','facebook.com','x.com/','twitter.com','youtube.com','tiktok.com','pinterest.com','linkedin.com','github.com','orcid.org']):
                keep.append(x.rstrip('),]}'))
            out['linktree']={'status':r.status_code,'final':r.url,'social_urls':sorted(set(keep))}
          except Exception as ex: out['linktree']={'error':str(ex)}
          # Probe the two uncertain Pinterest paths and report redirects/status only.
          out['pinterest_probes']=[]
          for u in ['https://www.pinterest.com/qezelbaash/','https://www.pinterest.com/medicaldoctor91/']:
            try:
              r=s.get(u,timeout=60,allow_redirects=True)
              out['pinterest_probes'].append({'requested':u,'status':r.status_code,'final':r.url,'history':[{'status':h.status_code,'url':h.url,'location':h.headers.get('location')} for h in r.history],'title':(re.search(r'<title[^>]*>(.*?)</title>',r.text,re.I|re.S).group(1).strip() if re.search(r'<title[^>]*>(.*?)</title>',r.text,re.I|re.S) else None)})
            except Exception as ex: out['pinterest_probes'].append({'requested':u,'error':str(ex)})
          # Direct profile probes for known values; no editing.
          profiles={
            'x':'https://x.com/qezelbaash',
            'youtube':'https://www.youtube.com/@ghezelbaash',
            'threads':'https://www.threads.com/@doctor.ghezelbaash',
            'tiktok':'https://www.tiktok.com/@ghezelbaash',
            'instagram':'https://www.instagram.com/doctor.ghezelbaash/',
            'facebook':'https://www.facebook.com/ghezelbaash/'
          }
          out['profile_probes']={}
          for k,u in profiles.items():
            try:
              r=s.get(u,timeout=40,allow_redirects=True)
              out['profile_probes'][k]={'requested':u,'status':r.status_code,'final':r.url,'history':[{'status':h.status_code,'url':h.url,'location':h.headers.get('location')} for h in r.history]}
            except Exception as ex: out['profile_probes'][k]={'requested':u,'error':str(ex)}
          print(json.dumps(out,ensure_ascii=False,indent=2,sort_keys=True))
          PY

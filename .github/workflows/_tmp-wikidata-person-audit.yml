name: Temporary Wikidata person hardening
on:
  push:
    branches: [main]
    paths: ['.github/workflows/_tmp-wikidata-person-audit.yml']
permissions:
  contents: read
jobs:
  harden:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      WIKIMEDIA_USERNAME: ${{ secrets.WIKIVERSITY_USERNAME }}
      WIKIMEDIA_BOT_PASSWORD: ${{ secrets.WIKIVERSITY_BOT_PASSWORD }}
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check --no-input requests==2.32.5
      - name: Harden existing person item without creating any item
        shell: bash
        run: |
          python - <<'PY'
          import os, requests, json
          API='https://www.wikidata.org/w/api.php'; Q='Q140287622'
          RETRIEVED='+2026-08-17T00:00:00Z'
          s=requests.Session(); s.headers.update({'User-Agent':'GhezelbaashWikidataPersonHarden/1.0 (https://www.ghezelbaash.ir/)'})
          def get(**p):
            p.update(format='json',formatversion=2)
            r=s.get(API,params=p,timeout=60); r.raise_for_status(); d=r.json()
            if 'error' in d: raise RuntimeError(d['error'])
            return d
          def post(p):
            p=dict(p); p.update(format='json',formatversion=2)
            r=s.post(API,data=p,timeout=90); r.raise_for_status(); d=r.json()
            if 'error' in d: raise RuntimeError(d['error'])
            return d
          # Authenticate, then abort before any edit if Wikimedia says this runner is blocked.
          lt=get(action='query',meta='tokens',type='login')['query']['tokens']['logintoken']
          lg=post({'action':'login','lgname':os.environ['WIKIMEDIA_USERNAME'],'lgpassword':os.environ['WIKIMEDIA_BOT_PASSWORD'],'lgtoken':lt})
          if lg.get('login',{}).get('result')!='Success': raise RuntimeError(lg)
          ui=get(action='query',meta='userinfo',uiprop='blockinfo')['query']['userinfo']
          if ui.get('blockedby'):
            raise RuntimeError({'blocked':True,'blockedby':ui.get('blockedby'),'reason':ui.get('blockreason')})
          csrf=get(action='query',meta='tokens',type='csrf')['query']['tokens']['csrftoken']
          def entity():
            return get(action='wbgetentities',ids=Q,props='claims|info')['entities'][Q]
          def cval(c):
            try:
              v=c['mainsnak']['datavalue']['value']
              if isinstance(v,dict) and 'id' in v: return v['id']
              return v
            except: return None
          def claim(pid,value):
            for c in entity().get('claims',{}).get(pid,[]):
              if cval(c)==value: return c
            return None
          def ref_urls(c):
            out=[]
            for ref in c.get('references',[]):
              for sn in ref.get('snaks',{}).get('P854',[]):
                try: out.append(sn['datavalue']['value'])
                except: pass
            return out
          def url_snak(url):
            return {'snaktype':'value','property':'P854','datavalue':{'value':url,'type':'string'}}
          def time_value(time,precision):
            return {'time':time,'timezone':0,'before':0,'after':0,'precision':precision,'calendarmodel':'http://www.wikidata.org/entity/Q1985727'}
          def time_snak(time,precision):
            return {'snaktype':'value','property':'P813','datavalue':{'value':time_value(time,precision),'type':'time'}}
          def item_snak(pid,qid):
            return {'snaktype':'value','property':pid,'datavalue':{'value':{'entity-type':'item','numeric-id':int(qid[1:]),'id':qid},'type':'wikibase-entityid'}}
          results=[]
          def add_reference(c,url,summary,stated_in=None):
            if not c: raise RuntimeError('target claim missing for reference '+url)
            if url in ref_urls(c):
              results.append({'statement':c['id'],'reference':url,'status':'exists'}); return
            snaks={}
            order=[]
            if stated_in:
              snaks['P248']=[item_snak('P248',stated_in)]; order.append('P248')
            snaks['P854']=[url_snak(url)]; order.append('P854')
            snaks['P813']=[time_snak(RETRIEVED,11)]; order.append('P813')
            d=post({'action':'wbsetreference','statement':c['id'],'snaks':json.dumps(snaks,separators=(',',':')),'snaks-order':json.dumps(order,separators=(',',':')),'summary':summary,'token':csrf})
            results.append({'statement':c['id'],'reference':url,'status':'created','hash':d.get('reference',{}).get('hash')})
          # 1) Education: preserve the existing KUMS claim and add the exact public ORCID start month.
          edu=claim('P69','Q6393994')
          if not edu: raise RuntimeError('P69 KUMS claim missing')
          has_start=False
          for sn in edu.get('qualifiers',{}).get('P580',[]):
            try:
              v=sn['datavalue']['value']
              if v.get('time','').startswith('+2009-09'): has_start=True
            except: pass
          if has_start:
            results.append({'statement':edu['id'],'qualifier':'P580 2009-09','status':'exists'})
          elif edu.get('qualifiers',{}).get('P580'):
            # Never introduce a competing start date if another one exists.
            results.append({'statement':edu['id'],'qualifier':'P580','status':'skipped-existing-other-value'})
          else:
            d=post({'action':'wbsetqualifier','claim':edu['id'],'property':'P580','snaktype':'value','value':json.dumps(time_value('+2009-09-00T00:00:00Z',10),separators=(',',':')),'summary':'Add documented medical-school start month from public ORCID education record','token':csrf})
            results.append({'statement':edu['id'],'qualifier':'P580 2009-09','status':'created','hash':d.get('claim',{}).get('hash')})
            edu=claim('P69','Q6393994')
          add_reference(edu,'https://pub.orcid.org/v3.0/0009-0001-9346-8475/education/38054873','Strengthen education statement with exact public ORCID education record')
          # 2) MD degree: exact ORCID education record + peer-reviewed paper stating the thesis was for the Medical Doctor title.
          degree=claim('P512','Q913404')
          add_reference(degree,'https://pub.orcid.org/v3.0/0009-0001-9346-8475/education/38054873','Strengthen MD degree with exact public ORCID education record')
          add_reference(degree,'https://pmc.ncbi.nlm.nih.gov/articles/PMC8469763/','Add peer-reviewed published support for Medical Doctor degree',stated_in='Q140298431')
          # 3) Gender: source the existing male statement to the subject's public ORCID biography, which uses explicit male self-description/pronouns.
          gender=claim('P21','Q6581097')
          add_reference(gender,'https://orcid.org/0009-0001-9346-8475','Source existing gender statement to public ORCID record')
          # 4) Email: strengthen existing scholarly email and add the public verified professional-domain email, without duplicating values.
          gmail=claim('P968','mailto:medicaldoctor91@gmail.com')
          if gmail:
            add_reference(gmail,'https://orcid.org/0009-0001-9346-8475','Add public verified ORCID support for email address')
          professional='mailto:doctor@ghezelbaash.ir'
          pro=claim('P968',professional)
          if not pro:
            d=post({'action':'wbcreateclaim','entity':Q,'property':'P968','snaktype':'value','value':json.dumps(professional),'summary':'Add public professional email verified on ORCID and official website','token':csrf})
            results.append({'property':'P968','value':professional,'status':'created','statement':d['claim']['id']})
            pro=claim('P968',professional)
          else:
            results.append({'property':'P968','value':professional,'status':'exists','statement':pro['id']})
          add_reference(pro,'https://www.ghezelbaash.ir/contact/','Source professional email to official contact page')
          add_reference(pro,'https://orcid.org/0009-0001-9346-8475','Source professional email to public verified ORCID record')
          # 5) Commons identifiers/images: these claims existed but lacked references.
          img=claim('P18','Saeed-Ghezelbaash-physician-portrait.jpg')
          add_reference(img,'https://commons.wikimedia.org/wiki/File:Saeed-Ghezelbaash-physician-portrait.jpg','Source image statement to Wikimedia Commons file page')
          creator=claim('P1472','Saeed Ghezelbash')
          add_reference(creator,'https://commons.wikimedia.org/wiki/Creator:Saeed_Ghezelbash','Source Commons Creator page statement')
          # 6) Existing Linktree ID: source it to the exact public profile, no new social IDs created.
          linktree=claim('P11079','Doctor.ghezelbaash')
          if linktree:
            add_reference(linktree,'https://linktr.ee/Doctor.ghezelbaash','Source existing Linktree ID to exact public profile')
          # 7) Official website: strengthen with the public ORCID researcher profile if needed.
          site=claim('P856','https://www.ghezelbaash.ir/')
          if site:
            add_reference(site,'https://orcid.org/0009-0001-9346-8475','Add ORCID corroboration for official website')
          # Final duplicate-safe verification.
          e=entity()
          def values(pid): return [cval(c) for c in e.get('claims',{}).get(pid,[])]
          checks={
            'person_exists':e.get('id')==Q,
            'education_exactly_one':values('P69').count('Q6393994')==1,
            'degree_exactly_one':values('P512').count('Q913404')==1,
            'male_exactly_one':values('P21').count('Q6581097')==1,
            'gmail_exactly_one':values('P968').count('mailto:medicaldoctor91@gmail.com')==1,
            'professional_email_exactly_one':values('P968').count(professional)==1,
            'openalex_untouched':values('P10283')==['A5064828898'],
            'orcid_untouched':values('P496')==['0009-0001-9346-8475'],
          }
          edu2=claim('P69','Q6393994'); checks['education_start_2009_09']=any((sn.get('datavalue',{}).get('value',{}).get('time','').startswith('+2009-09')) for sn in edu2.get('qualifiers',{}).get('P580',[]))
          print(json.dumps({'ok':all(checks.values()),'authenticated_as':ui.get('name'),'checks':checks,'results':results,'lastrevid':e.get('lastrevid')},ensure_ascii=False,indent=2,sort_keys=True))
          if not all(checks.values()): raise SystemExit(1)
          PY

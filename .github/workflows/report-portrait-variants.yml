name: Report portrait variant metadata

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/report-portrait-variants.yml

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Update metadata report
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, pathlib, struct
          report_path=pathlib.Path('tmp/identity-assets-metadata.json')
          report=json.loads(report_path.read_text(encoding='utf-8')) if report_path.exists() else {}
          for raw in sorted(pathlib.Path('public/media/images/physician/derived').glob('*.jpg')):
              data=raw.read_bytes()
              i=2
              w=h=None
              while i < len(data):
                  if data[i] != 0xFF:
                      i+=1; continue
                  marker=data[i+1]; i+=2
                  if marker in {0xD8,0xD9}: continue
                  length=int.from_bytes(data[i:i+2],'big')
                  if marker in {0xC0,0xC1,0xC2,0xC3,0xC5,0xC6,0xC7,0xC9,0xCA,0xCB,0xCD,0xCE,0xCF}:
                      h=int.from_bytes(data[i+3:i+5],'big')
                      w=int.from_bytes(data[i+5:i+7],'big')
                      break
                  i+=length
              report[str(raw)]={'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest(),'mime':'image/jpeg','width':w,'height':h}
          report_path.write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Commit report and remove workflow
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/report-portrait-variants.yml
          git add tmp/identity-assets-metadata.json
          git commit -m 'Record portrait variant hashes and dimensions'
          git push origin HEAD:main

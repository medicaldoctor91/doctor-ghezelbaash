name: One-shot O5 canonical edit (no publish)
on:
  push:
    branches: [fix/o5-canonical-service-types-20261018]
    paths: ['.github/workflows/o5-apply-once.yml']
permissions:
  contents: write
jobs:
  apply-o5:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Edit only five canonical O5 service types and verify invariants
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          
          path = Path("src/canonical/source.mjs")
          original = path.read_text(encoding="utf-8")
          text = original
          targets = ["rhinoplasty", "facelift", "neck-lift", "body-aesthetic-surgery"]
          for name in targets:
              marker = f'"@id": "https://www.ghezelbaash.ir/procedure-{name}",\n        "@type": "MedicalProcedure",'
              replacement = f'"@id": "https://www.ghezelbaash.ir/procedure-{name}",\n        "@type": [\n          "MedicalProcedure",\n          "Service"\n        ],'
              assert text.count(marker) == 1, f"Expected exactly one matching node: {name}"
              text = text.replace(marker, replacement)
          marker = '"@id": "https://www.ghezelbaash.ir/procedure-hand-fat-grafting",\n        "@type": [\n          "SurgicalProcedure",\n          "MedicalProcedure"\n        ],'
          replacement = '"@id": "https://www.ghezelbaash.ir/procedure-hand-fat-grafting",\n        "@type": [\n          "SurgicalProcedure",\n          "Service",\n          "MedicalProcedure"\n        ],'
          assert text.count(marker) == 1, "Hand fat grafting block unexpectedly changed"
          text = text.replace(marker, replacement)
          
          def parse_module(source):
              begin = source.index("export const SOURCE = ") + len("export const SOURCE = ")
              end = source.index(";\nexport const AUTHORED_BODY")
              return json.loads(source[begin:end])
          
          before = parse_module(original)
          after = parse_module(text)
          old_nodes = before["graph"]["@graph"]
          new_nodes = after["graph"]["@graph"]
          assert len(old_nodes) == len(new_nodes) == 1592
          changed = [a["@id"] for a, b in zip(old_nodes, new_nodes) if a != b]
          assert set(changed) == {
              "https://www.ghezelbaash.ir/procedure-" + n
              for n in [*targets, "hand-fat-grafting"]
          }, changed
          for n in new_nodes:
              if n.get("@id") in changed:
                  types = n["@type"] if isinstance(n["@type"], list) else [n["@type"]]
                  assert {"MedicalProcedure", "Service"} <= set(types)
                  assert n["provider"]["@id"] == "https://www.ghezelbaash.ir/#saeed-ghezelbash"
                  assert n["availableChannel"]["@id"] == "https://www.ghezelbaash.ir/in-person-clinic-service-channel"
          cryo = "https://www.ghezelbaash.ir/procedure-cryolipolysis-localized-fat-reduction"
          assert next(x for x in old_nodes if x["@id"] == cryo) == next(x for x in new_nodes if x["@id"] == cryo)
          assert original[original.index("export const AUTHORED_BODY"):] == text[text.index("export const AUTHORED_BODY"):]
          path.write_text(text, encoding="utf-8")
          print("O5 checks passed; exactly five canonical types changed; Cryolipolysis unchanged")
          
          PY
      - name: Check module syntax, commit change, remove one-shot workflow
        shell: bash
        run: |
          node --check src/canonical/source.mjs
          rm -f .github/workflows/o5-apply-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/canonical/source.mjs .github/workflows/o5-apply-once.yml
          git commit -m 'fix(kg): align five offered surgical procedures with Service semantics [skip ci]'
          git push origin HEAD:refs/heads/fix/o5-canonical-service-types-20261018

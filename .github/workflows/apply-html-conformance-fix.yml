name: Apply HTML conformance fix
on:
  push:
    branches: [fix/html-conformance-a11y-2026-08-29]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - name: Apply exact patch and self-clean scaffolding
        run: |
          node scripts/apply-html-conformance-fix.mjs
          rm scripts/apply-html-conformance-fix.mjs .github/workflows/apply-html-conformance-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content-source/page.md scripts/apply-html-conformance-fix.mjs .github/workflows/apply-html-conformance-fix.yml
          git diff --cached --name-only | sort > /tmp/staged.txt
          printf '%s\n' '.github/workflows/apply-html-conformance-fix.yml' 'scripts/apply-html-conformance-fix.mjs' 'src/content-source/page.md' | sort > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/staged.txt
          git commit -m "fix: repair HTML semantics and accessibility contracts"
          git push origin HEAD:fix/html-conformance-a11y-2026-08-29

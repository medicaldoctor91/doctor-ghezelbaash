name: Verify single-page aggressive search and AI lanes

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]

permissions:
  contents: read

jobs:
  verify:
    if: github.event.pull_request.head.ref == 'verify-single-page-aggressive-lanes-20260809'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 884d1d90bd1fb6ecca14992c6c60d677
      CANONICAL_HOST: www.ghezelbaash.ir
      PROJECT: doctor-ghezelbaash
      INDEXNOW_KEY: 2d0a99837e327f6744f9184ec6d2877f
    steps:
      - name: Prove one-page search lane, full semantic AI lane, redirects, and IndexNow acceptance
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, time, urllib.error, urllib.parse, urllib.request, xml.etree.ElementTree as ET

          H=os.environ['CANONICAL_HOST']; P=os.environ['PROJECT']; A=os.environ['CLOUDFLARE_ACCOUNT_ID']; T=os.environ['CLOUDFLARE_API_TOKEN']; K=os.environ['INDEXNOW_KEY']
          C=f'https://{H}'; ROOT=C+'/'; BASE='https://api.cloudflare.com/client/v4'

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl): return None
          no_redirect=urllib.request.build_opener(NoRedirect)

          def fetch(url, ua='ghezelbaash-single-page-audit/1.0', follow=True):
              req=urllib.request.Request(url,headers={'User-Agent':ua,'Accept':'*/*','Cache-Control':'no-cache','Pragma':'no-cache'})
              opener=urllib.request.urlopen if follow else no_redirect.open
              try:
                  with opener(req,timeout=30) as r: return r.status, r.read(), r.headers, r.geturl()
              except urllib.error.HTTPError as e: return e.code, e.read(), e.headers, e.geturl()

          def cf(path):
              req=urllib.request.Request(BASE+path,headers={'Authorization':f'Bearer {T}','Accept':'application/json','User-Agent':'ghezelbaash-single-page-audit/1.0'})
              try:
                  with urllib.request.urlopen(req,timeout=30) as r: return r.status,json.loads(r.read().decode() or '{}')
              except urllib.error.HTTPError as e:
                  raw=e.read().decode('utf-8','replace')
                  try:p=json.loads(raw) if raw else {}
                  except Exception:p={}
                  return e.code,p

          # Canonical HTML is the sole searchable landing page.
          st,body,h,_=fetch(ROOT,ua='Googlebot')
          xrobots=' | '.join(h.get_all('X-Robots-Tag') or [])
          print('ROOT_GOOGLEBOT',st,'xrobots=',xrobots)
          if st!=200 or 'index' not in xrobots.lower() or 'follow' not in xrobots.lower(): raise SystemExit('Canonical HTML Googlebot indexing lane is not open')

          sm_url=C+'/sitemap.xml'; st,sm_bytes,_,_=fetch(sm_url)
          if st!=200: raise SystemExit(f'sitemap HTTP {st}')
          sm=ET.fromstring(sm_bytes); locs=[e.text.strip() for e in sm.iter() if e.tag.rsplit('}',1)[-1]=='loc' and e.text]
          print('SITEMAP_LOCS',locs)
          if locs!=[ROOT]: raise SystemExit(f'Sitemap is not single-page canonical only: {locs!r}')

          st,robots,_,_=fetch(C+'/robots.txt')
          robots_text=robots.decode('utf-8','replace')
          required=['Googlebot','Google-Extended','GPTBot','OAI-SearchBot','ChatGPT-User','ClaudeBot','PerplexityBot','Applebot','Sitemap: https://www.ghezelbaash.ir/sitemap.xml']
          if st!=200 or any(x not in robots_text for x in required): raise SystemExit('robots.txt aggressive crawler lane incomplete')
          print('ROBOTS_AI_LANE_OK')

          # Machine lane: all live RFC 9264 semantic representations are public but Googlebot-scoped noindex.
          st,ls_bytes,_,_=fetch(C+'/linkset.json')
          if st!=200: raise SystemExit('linkset missing')
          ls=json.loads(ls_bytes)
          discovered=[ROOT,C+'/linkset.json',sm_url]
          for entry in ls.get('linkset') or []:
              for rel in ('canonical','describedby','alternate'):
                  for item in (entry.get(rel) or []):
                      if isinstance(item,dict) and item.get('href'): discovered.append(item['href'])
          urls=[]; seen=set()
          for u in discovered:
              p=urllib.parse.urlsplit(u)
              if p.scheme!='https' or p.netloc.lower()!=H.lower() or p.fragment: continue
              u=urllib.parse.urlunsplit((p.scheme,p.netloc,p.path or '/',p.query,''))
              if u not in seen: seen.add(u); urls.append(u)
          print('SEMANTIC_URL_COUNT',len(urls))
          print('SEMANTIC_URLS',json.dumps(urls,ensure_ascii=False))
          for u in urls:
              st,b,h,_=fetch(u)
              if st!=200: raise SystemExit(f'non-200 semantic URL {u}: {st}')
          st,b,h,_=fetch(C+'/graph.jsonld',ua='Googlebot')
          gx=' | '.join(h.get_all('X-Robots-Tag') or [])
          print('GRAPH_GOOGLEBOT_XROBOTS',gx)
          if 'noindex' not in gx.lower() or 'follow' not in gx.lower(): raise SystemExit('Googlebot machine-resource noindex lane missing')
          st,b,h,_=fetch(C+'/graph.jsonld',ua='bingbot')
          bx=' | '.join(h.get_all('X-Robots-Tag') or [])
          print('GRAPH_GENERIC_XROBOTS',bx)
          if 'index' not in bx.lower() or 'follow' not in bx.lower(): raise SystemExit('Generic machine-resource indexing lane missing')

          # Canonicalize both stable Pages hostname and current unique deployment hostname.
          st,p=cf(f'/accounts/{A}/pages/projects/{P}')
          if st!=200 or p.get('success') is not True: raise SystemExit(f'Pages project lookup failed {st}: {p}')
          r=p.get('result') or {}; unique=((r.get('canonical_deployment') or {}).get('url') or (r.get('latest_deployment') or {}).get('url'))
          if not unique: raise SystemExit('unique Pages deployment URL missing')
          for base in (f'https://{P}.pages.dev/',unique.rstrip('/')+'/'):
              u=base+'single-page-canonical-proof?q=1'; st,_,h,_=fetch(u,follow=False); loc=h.get('Location')
              print('PAGES_CANONICAL',st,u,'->',loc)
              if st!=301 or loc!=C+'/single-page-canonical-proof?q=1': raise SystemExit(f'Pages hostname canonicalization failed {u}')

          # Exercise the complete semantic notification lane now.
          key_url=C+'/'+K+'.txt'; st,key_bytes,_,_=fetch(key_url)
          if st!=200 or key_bytes!=(K+'\n').encode(): raise SystemExit('IndexNow key verification failed')
          payload=json.dumps({'host':H,'key':K,'keyLocation':key_url,'urlList':urls},separators=(',',':')).encode()
          req=urllib.request.Request('https://api.indexnow.org/indexnow',data=payload,method='POST',headers={'Content-Type':'application/json; charset=utf-8','User-Agent':'ghezelbaash-single-page-audit/1.0'})
          try:
              with urllib.request.urlopen(req,timeout=30) as resp: ist=resp.status; ib=resp.read().decode('utf-8','replace')
          except urllib.error.HTTPError as e: ist=e.code; ib=e.read().decode('utf-8','replace')
          print('INDEXNOW_COMPLETE_LANE',ist,'urls=',len(urls),'body=',ib[:500])
          if ist not in (200,202): raise SystemExit(f'IndexNow rejected complete lane: {ist} {ib[:500]}')
          PY

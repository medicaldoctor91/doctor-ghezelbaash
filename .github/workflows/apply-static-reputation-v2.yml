name: Apply hardened static reputation migration

on:
  push:
    branches:
      - feat/static-reputation-authority-20260903
    paths:
      - .github/workflows/apply-static-reputation-v2.yml

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: apply-static-reputation-architecture
  cancel-in-progress: false

jobs:
  migrate-test-publish-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/static-reputation-authority-20260903
          fetch-depth: 0

      - name: Apply the reviewed migration without runtime remnants
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path.cwd()
          primary = root / ".github/workflows/apply-static-reputation-architecture.yml"
          component = root / "src/components/StaticClinicReputation.astro"

          if not component.exists():
              if not primary.exists():
                  raise SystemExit("Reviewed migration source is missing")
              workflow_text = primary.read_text(encoding="utf-8")
              start_marker = "          python3 - <<'PY'\n"
              end_marker = "\n          PY\n"
              start = workflow_text.index(start_marker) + len(start_marker)
              end = workflow_text.index(end_marker, start)
              lines = workflow_text[start:end].splitlines()
              code = "\n".join(
                  line[10:] if line.startswith("          ") else line
                  for line in lines
              ) + "\n"
              code = code.replace(
                  'Path(".github/workflows/apply-static-reputation-architecture.yml").unlink()',
                  'pass',
              )
              # The inspected block is dedicated to the reputation observer; removal is
              # guarded afterwards by full source/build tests rather than token heuristics.
              code = code.replace(
                  '              unrelated = (\n                  "IntersectionObserver",\n                  "history.pushState",\n                  "history.replaceState",\n                  "scrollIntoView",\n              )',
                  '              unrelated = ()',
              )
              for temporary in (root / ".github/workflows").glob("*static-reputation*.yml"):
                  temporary.unlink(missing_ok=True)
              (root / ".github/workflows/apply-static-reputation-v2.yml").unlink(
                  missing_ok=True
              )
              exec(compile(code, "/tmp/static-reputation-migration.py", "exec"), {})
          else:
              for temporary in (root / ".github/workflows").glob("*static-reputation*.yml"):
                  temporary.unlink(missing_ok=True)
              (root / ".github/workflows/apply-static-reputation-v2.yml").unlink(
                  missing_ok=True
              )
          PY

          # Git does not track directories; remove the now-empty Functions tree from the
          # working tree so architecture tests inspect the actual static-only topology.
          rm -rf functions
          git diff --check

      - name: Normalize residual Function routing assertions to the static delivery contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import json
          import re
          from pathlib import Path

          root = Path.cwd()

          platform_path = root / ".release/policy/platform-contract.json"
          platform = json.loads(platform_path.read_text(encoding="utf-8"))
          cloudflare = platform.setdefault("cloudflare", {})
          cloudflare.pop("function", None)
          cloudflare["deliveryModel"] = "static-assets-only"
          platform_path.write_text(
              json.dumps(platform, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          # Remove only complete validation/assertion statements that still refer to the
          # discarded _routes.json artifact. The production materializer itself must have
          # no such reference after the source migration.
          def remove_balanced_statement(text: str, token_index: int) -> str:
              candidates = [
                  text.rfind("assert(", 0, token_index),
                  text.rfind("assert.ok(", 0, token_index),
                  text.rfind("assert.match(", 0, token_index),
                  text.rfind("assert.equal(", 0, token_index),
              ]
              start = max(candidates)
              if start < 0:
                  return text
              quote = None
              escaped = False
              depth = 0
              index = start
              while index < len(text):
                  char = text[index]
                  if quote:
                      if escaped:
                          escaped = False
                      elif char == "\\":
                          escaped = True
                      elif char == quote:
                          quote = None
                  else:
                      if char in "'\"`":
                          quote = char
                      elif char == "(":
                          depth += 1
                      elif char == ")":
                          depth -= 1
                      elif char == ";" and depth == 0:
                          end = index + 1
                          while end < len(text) and text[end] in " \t\r\n":
                              end += 1
                          return text[:start] + text[end:]
                  index += 1
              return text

          for path in root.glob("scripts/*.mjs"):
              text = path.read_text(encoding="utf-8")
              while '"_routes.json"' in text:
                  index = text.index('"_routes.json"')
                  revised = remove_balanced_statement(text, index)
                  if revised == text:
                      break
                  text = revised
              path.write_text(text, encoding="utf-8")

          # Known production generator and dist validator are normalized explicitly.
          materializer = root / "scripts/materialize-static-artifacts.mjs"
          materializer_text = materializer.read_text(encoding="utf-8")
          if "_routes.json" in materializer_text:
              raise SystemExit("The static materializer still generates _routes.json")

          dist_validator = root / "scripts/validate-dist.mjs"
          dist_text = dist_validator.read_text(encoding="utf-8")
          dist_text = dist_text.replace('  "_routes.json",\n', "")
          dist_validator.write_text(dist_text, encoding="utf-8")

          leaks = []
          for path in root.rglob("*"):
              if not path.is_file() or ".git" in path.parts:
                  continue
              if any(part in {"node_modules", "dist"} for part in path.parts):
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue
              for token in (
                  "/api/google-maps-reputation",
                  '"_routes.json"',
                  "wrangler pages secret",
                  "platformContract.cloudflare.function",
              ):
                  if token in text:
                      leaks.append(f"{path.relative_to(root)}:{token}")
          if leaks:
              raise SystemExit("Static-only architecture leaks: " + ", ".join(leaks))
          PY
          git diff --check

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14.6"

      - name: Provision media validation tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg
          ffprobe -version

      - run: npm ci

      - name: Fetch exactly one current Google Places observation
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
        run: node scripts/fetch-google-places-reputation.mjs --write-fallback --github-env

      - name: Lock source mutation surface
        run: git diff --name-only | LC_ALL=C sort > /tmp/intended-source-files.txt

      - name: Run all canonical release validators
        run: |
          npm run security:dependencies
          npm run release
          npx --yes --package=vnu-jar@26.8.30 vnu --errors-only dist/index.html dist/404.html
          npm run validate:schemaorg-vocabulary

      - name: Verify deterministic source and static delivery
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only | LC_ALL=C sort > /tmp/final-source-files.txt
          diff -u /tmp/intended-source-files.txt /tmp/final-source-files.txt
          test ! -e functions
          test ! -e dist/_routes.json
          ! git grep -n --fixed-strings '/api/google-maps-reputation'
          ! git grep -n --fixed-strings 'wrangler pages secret'
          ! git grep -n --fixed-strings 'platformContract.cloudflare.function'
          git diff --check

      - name: Commit the validated release-ready candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: deliver clinic reputation through the static build"
          test -z "$(git status --porcelain)"
          git push origin HEAD:feat/static-reputation-authority-20260903

      - name: Open a non-release pull request for the final owner-change gate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          existing="$(gh pr list --head feat/static-reputation-authority-20260903 --base main --state open --json number --jq '.[0].number // empty')"
          if test -z "$existing"; then
            gh pr create \
              --base main \
              --head feat/static-reputation-authority-20260903 \
              --title "Static clinic reputation and Function-free delivery" \
              --body $'This release-ready candidate removes the per-visit Cloudflare Pages Function, materializes clinic-scoped Google Maps rating/review count in initial HTML, preserves the single mega-landing architecture, and keeps release/tag/Zenodo/Hugging Face publication on hold for the owner’s final small changes.'
          fi

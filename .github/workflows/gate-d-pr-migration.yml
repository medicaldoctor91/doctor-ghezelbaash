name: Gate D PR migration and validation

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  migrate-validate-commit:
    if: github.head_ref == 'fix/gate-d-render-calibration-assembly-2026-08-21'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14.6'
      - name: Apply source migration and remove temporary transport
        shell: bash
        run: |
          set -euo pipefail
          node scripts/gate-d-migrate.mjs
          git rm scripts/gate-d-migrate.mjs .github/workflows/gate-d-calibration-migration.yml .github/workflows/gate-d-pr-migration.yml
      - name: Prove production CSS byte equivalence
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {execFileSync} from 'node:child_process';
          import {createHash} from 'node:crypto';
          import {readFile} from 'node:fs/promises';
          import {assembleCssSource} from './src/lib/css-source.mjs';
          const oldCss=execFileSync('git',['show','2fc3c58e5d262dcf0a4566103270d351455ada52:src/styles/global.css'],{encoding:'utf8'});
          const [authoredCss,calibrationRaw]=await Promise.all([readFile('src/styles/global.css','utf8'),readFile('src/data/render-calibration.json','utf8')]);
          const {cssSource,calibration}=assembleCssSource(authoredCss,calibrationRaw);
          if(cssSource!==oldCss)throw new Error('Gate D CSS assembly is not byte-identical to Gate C production CSS');
          const sha=value=>createHash('sha256').update(value).digest('hex');
          console.log(JSON.stringify({byteIdentical:true,previousCssSha256:sha(oldCss),assembledCssSha256:sha(cssSource),authoredCssBytes:Buffer.byteLength(authoredCss),assembledCssBytes:Buffer.byteLength(cssSource),renderCalibrationSha256:calibration.sha256,renderCalibrationRules:calibration.ruleCount},null,2));
          NODE
      - run: npm ci --ignore-scripts
      - name: Release preparation diagnostics
        run: npm run release:prepare
      - name: Build diagnostics
        env:
          GITHUB_SHA: ${{ github.event.pull_request.head.sha }}
        run: npm run build
      - name: Commit validated Gate D source
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test ! -e scripts/gate-d-migrate.mjs
          test ! -e .github/workflows/gate-d-calibration-migration.yml
          test ! -e .github/workflows/gate-d-pr-migration.yml
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Gate D: derive render calibration CSS in memory"
          git push origin HEAD:fix/gate-d-render-calibration-assembly-2026-08-21

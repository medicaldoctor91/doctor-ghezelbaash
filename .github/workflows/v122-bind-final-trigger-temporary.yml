name: v1.2.2 temporary final trigger ancestry binder

on:
  push:
    branches: [release/v1.2.2-candidate]
    paths: [.github/workflows/v122-bind-final-trigger-temporary.yml]

permissions:
  contents: write

concurrency:
  group: doctor-ghezelbaash-external-mutation
  cancel-in-progress: false

env:
  CANDIDATE_BRANCH: release/v1.2.2-candidate
  EXPECTED_CLEAN_TREE: 4d23dc4eb25ab2f1ffadf88b1677349f3ebe9e1a
  EXPECTED_TRIGGER_SHA: 2ef85c0e4f75056f35008dff4ac913d6239f842c

jobs:
  bind:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: release/v1.2.2-candidate
          fetch-depth: 0
          persist-credentials: true
      - name: Merge exact trigger main ancestry while restoring the exact pre-binder Candidate tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main "$CANDIDATE_BRANCH"
          test "$(git rev-parse origin/main)" = "$EXPECTED_TRIGGER_SHA"
          CURRENT=$(git rev-parse HEAD)
          PARENT=$(git rev-parse "$CURRENT^")
          test "$(git rev-parse "$PARENT^{tree}")" = "$EXPECTED_CLEAN_TREE"
          main_req=$(git show "origin/main:.release/release-request-v1.2.2.json")
          base_req=$(git show "$PARENT:.release/release-request-v1.2.2.json")
          test "$main_req" = "$base_req"
          git merge -s ours --no-ff -m 'Bind final v1.2.2 release trigger ancestry' origin/main
          git rm .github/workflows/v122-bind-final-trigger-temporary.yml
          git commit -m 'Remove temporary final v1.2.2 trigger binder'
          FINAL=$(git rev-parse HEAD)
          FINAL_TREE=$(git rev-parse HEAD^{tree})
          test "$FINAL_TREE" = "$EXPECTED_CLEAN_TREE"
          git merge-base --is-ancestor "$EXPECTED_TRIGGER_SHA" "$FINAL"
          test "$(cat .release/release-request-v1.2.2.json)" = "$main_req"
          test "$(git show "$FINAL:.github/workflows/ceiling-release.yml" | git hash-object --stdin)" = 65e00fff199d527666e9b5deb54ccd76a04b17e1
          git push origin HEAD:$CANDIDATE_BRANCH
          echo "FINAL_TRIGGER_ANCESTRY_BIND_PASS final=$FINAL tree=$FINAL_TREE trigger=$EXPECTED_TRIGGER_SHA"

name: Inspect completed validated source freeze

on:
  pull_request:
    paths:
      - '.github/workflows/inspect-final-b617.yml'

permissions:
  actions: read
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      FINALIZER_TRIGGER_SHA: 27b79c19f5f3630bb8bcc5d2e3025f40565573ad
    steps:
      - name: Wait for finalizer and inspect frozen main
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p inspection
          finalizer_id=''
          for attempt in $(seq 1 120); do
            gh api "repos/$GITHUB_REPOSITORY/actions/runs?branch=main&per_page=100" > inspection/runs.json
            run=$(jq -c --arg sha "$FINALIZER_TRIGGER_SHA" '[.workflow_runs[] | select(.head_sha == $sha and .name == "Finalize successful production validation")] | first // empty' inspection/runs.json)
            if [ -n "$run" ]; then
              finalizer_id=$(jq -r '.id' <<<"$run")
              status=$(jq -r '.status' <<<"$run")
              conclusion=$(jq -r '.conclusion // ""' <<<"$run")
              echo "finalizer id=$finalizer_id status=$status conclusion=$conclusion"
              if [ "$status" = completed ]; then
                printf '%s\n' "$run" > inspection/finalizer-run.json
                break
              fi
            else
              echo 'finalizer run not visible yet'
            fi
            sleep 15
          done
          [ -n "$finalizer_id" ] || { echo 'finalizer run not found' >&2; exit 1; }
          [ "$(jq -r '.status' inspection/finalizer-run.json)" = completed ]
          [ "$(jq -r '.conclusion' inspection/finalizer-run.json)" = success ]

          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$finalizer_id/jobs?per_page=100" > inspection/finalizer-jobs.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$finalizer_id/artifacts?per_page=100" > inspection/finalizer-artifacts.json
          gh api "repos/$GITHUB_REPOSITORY/commits/main" > inspection/final-main-commit.json
          final_sha=$(jq -r '.sha' inspection/final-main-commit.json)
          final_message=$(jq -r '.commit.message' inspection/final-main-commit.json)
          gh api "repos/$GITHUB_REPOSITORY/git/trees/$final_sha?recursive=1" > inspection/final-tree.json

          curl -sS --compressed --max-time 90 -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' \
            "https://www.ghezelbaash.ir/?final-inspection=$(date +%s)" > inspection/live.html
          FINAL_SHA="$final_sha" python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          html = Path('inspection/live.html').read_text(encoding='utf-8', errors='replace')
          marker = None
          for pattern in (
              r'<meta\s+name=["\']x-deploy-commit["\']\s+content=["\']([0-9a-f]{7,40}|local)["\']',
              r'<meta\s+content=["\']([0-9a-f]{7,40}|local)["\']\s+name=["\']x-deploy-commit["\']',
          ):
              match = re.search(pattern, html, re.I)
              if match:
                  marker = match.group(1)
                  break
          result = {
              'expectedSha': os.environ['FINAL_SHA'],
              'liveMarker': marker,
              'exactMatch': marker == os.environ['FINAL_SHA'],
              'cloudflareBeaconPresent': 'cloudflareinsights.com' in html or 'data-cf-beacon' in html,
              'googleVerificationPresent': '8n4oKDWVkFyp-dUWoTAnLVO1HTr4ARpSPEVngAvybCQ' in html,
          }
          Path('inspection/live-summary.json').write_text(json.dumps(result, indent=2) + '\n')
          if not result['exactMatch'] or result['cloudflareBeaconPresent'] or not result['googleVerificationPresent']:
              raise SystemExit(1)
          PY
          rm -f inspection/live.html

          jq -n \
            --arg finalSha "$final_sha" \
            --arg finalMessage "$final_message" \
            --slurpfile run inspection/finalizer-run.json \
            --slurpfile jobs inspection/finalizer-jobs.json \
            --slurpfile artifacts inspection/finalizer-artifacts.json \
            --slurpfile tree inspection/final-tree.json \
            --slurpfile live inspection/live-summary.json \
            '{
              finalMainSha:$finalSha,
              finalCommitMessage:$finalMessage,
              finalizerRun:($run[0]|{id,status,conclusion,display_title,updated_at}),
              jobs:[$jobs[0].jobs[]|{id,name,status,conclusion}],
              artifacts:[$artifacts[0].artifacts[]|{id,name,size_in_bytes,expired}],
              live:$live[0],
              remainingEngineeringPaths:[$tree[0].tree[]|.path|select(. == ".github/workflows/finalize-successful-validation.yml" or . == ".github/workflows/capture-current-validation.yml" or . == ".github/scripts/.final-validation-trigger" or startswith("tmp/"))]
            }' > inspection/summary.json

          [ "$final_message" = 'Freeze validated production source' ]
          [ "$(jq '.remainingEngineeringPaths | length' inspection/summary.json)" = 0 ]
          [ "$(jq '[.artifacts[]|select(.name|startswith("final-validated-production-"))]|length' inspection/summary.json)" = 1 ]
          cat inspection/summary.json

      - name: Upload final inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inspect-completed-validated-freeze
          path: inspection/
          retention-days: 2

name: Inspect successful final capture and freeze

on:
  pull_request:
    paths:
      - '.github/workflows/inspect-final-b617.yml'

permissions:
  actions: read
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_SHA: b617957b688ac3300d2367f08694418e8d100362
      VALIDATION_RUN_ID: '30454404017'
      OLD_CAPTURE_ID: '30454478055'
    steps:
      - name: Wait for successful capture and freeze
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p inspection

          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$VALIDATION_RUN_ID" > inspection/validation-run.json
          [ "$(jq -r '.status' inspection/validation-run.json)" = completed ]
          [ "$(jq -r '.conclusion' inspection/validation-run.json)" = success ]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$VALIDATION_RUN_ID/jobs?per_page=100" > inspection/validation-jobs.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$VALIDATION_RUN_ID/artifacts?per_page=100" > inspection/validation-artifacts.json

          capture_id=''
          for attempt in $(seq 1 120); do
            gh api "repos/$GITHUB_REPOSITORY/actions/runs?branch=main&per_page=100" > inspection/runs.json
            capture=$(jq -c --arg sha "$TARGET_SHA" --argjson old "$OLD_CAPTURE_ID" '[.workflow_runs[] | select(.head_sha == $sha and .name == "Capture final validation and freeze source" and .id > $old)] | first // empty' inspection/runs.json)
            if [ -n "$capture" ]; then
              capture_id=$(jq -r '.id' <<<"$capture")
              status=$(jq -r '.status' <<<"$capture")
              conclusion=$(jq -r '.conclusion // ""' <<<"$capture")
              echo "capture id=$capture_id status=$status conclusion=$conclusion"
              if [ "$status" = completed ]; then
                printf '%s\n' "$capture" > inspection/capture-run.json
                break
              fi
            else
              echo 'new capture run not visible yet'
            fi
            sleep 15
          done

          [ -n "$capture_id" ] || { echo 'new capture run was not found' >&2; exit 1; }
          [ "$(jq -r '.status' inspection/capture-run.json)" = completed ]
          [ "$(jq -r '.conclusion' inspection/capture-run.json)" = success ]

          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$capture_id/jobs?per_page=100" > inspection/capture-jobs.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$capture_id/artifacts?per_page=100" > inspection/capture-artifacts.json
          gh api "repos/$GITHUB_REPOSITORY/commits/main" > inspection/final-main-commit.json
          final_sha=$(jq -r '.sha' inspection/final-main-commit.json)
          gh api "repos/$GITHUB_REPOSITORY/git/trees/$final_sha?recursive=1" > inspection/final-tree.json

          jq -n \
            --arg target "$TARGET_SHA" \
            --arg final "$final_sha" \
            --slurpfile validation inspection/validation-run.json \
            --slurpfile validationJobs inspection/validation-jobs.json \
            --slurpfile validationArtifacts inspection/validation-artifacts.json \
            --slurpfile capture inspection/capture-run.json \
            --slurpfile captureJobs inspection/capture-jobs.json \
            --slurpfile captureArtifacts inspection/capture-artifacts.json \
            --slurpfile tree inspection/final-tree.json \
            '{
              targetSha:$target,
              finalMainSha:$final,
              validation:{run:($validation[0]|{id,status,conclusion,run_attempt,display_title,updated_at}),jobs:[$validationJobs[0].jobs[]|{id,name,status,conclusion,steps}],artifacts:[$validationArtifacts[0].artifacts[]|{id,name,size_in_bytes,expired}]},
              capture:{run:($capture[0]|{id,status,conclusion,display_title,updated_at}),jobs:[$captureJobs[0].jobs[]|{id,name,status,conclusion,steps}],artifacts:[$captureArtifacts[0].artifacts[]|{id,name,size_in_bytes,expired}]},
              remainingEngineeringPaths:[$tree[0].tree[]|.path|select(. == ".github/workflows/capture-current-validation.yml" or . == ".github/scripts/.final-validation-trigger" or startswith("tmp/"))]
            }' > inspection/summary.json
          cat inspection/summary.json

      - name: Upload final inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inspect-successful-final-freeze
          path: inspection/
          retention-days: 2

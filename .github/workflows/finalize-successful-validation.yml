name: Finalize successful production validation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-successful-validation.yml'

permissions:
  actions: read
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      VALIDATION_RUN_ID: '30454404017'
      AUDITED_SHA: 'b617957b688ac3300d2367f08694418e8d100362'
      LIVE_ARTIFACT_ID: '8725107723'
      LIGHTHOUSE_ARTIFACT_ID: '8725201943'
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CF_PROJECT: doctor-ghezelbaash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 5

      - name: Download definitive successful evidence
        shell: bash
        run: |
          set -euo pipefail
          rm -rf final-evidence
          mkdir -p final-evidence/artifacts/live final-evidence/artifacts/lighthouse

          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$LIVE_ARTIFACT_ID/zip" > final-evidence/live-http.zip
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$LIGHTHOUSE_ARTIFACT_ID/zip" > final-evidence/lighthouse.zip
          unzip -q final-evidence/live-http.zip -d final-evidence/artifacts/live
          unzip -q final-evidence/lighthouse.zip -d final-evidence/artifacts/lighthouse

          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$VALIDATION_RUN_ID" > final-evidence/validation-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$VALIDATION_RUN_ID/jobs?per_page=100" > final-evidence/validation-jobs.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$VALIDATION_RUN_ID/artifacts?per_page=100" > final-evidence/validation-artifacts.json

          [ "$(jq -r '.status' final-evidence/validation-run.json)" = completed ]
          [ "$(jq -r '.conclusion' final-evidence/validation-run.json)" = success ]
          [ "$(jq -r '.head_sha' final-evidence/validation-run.json)" = "$AUDITED_SHA" ]

      - name: Record sanitized Cloudflare project state
        shell: bash
        run: |
          set -euo pipefail
          [ -n "$CF_API_TOKEN" ]
          [ -n "$CF_ACCOUNT_ID" ]
          endpoint="https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/pages/projects/$CF_PROJECT"
          curl -sS --fail-with-body -H "Authorization: Bearer $CF_API_TOKEN" "$endpoint" \
            | jq '{success,errors,result:{name:.result.name,production_branch:.result.production_branch,build_config:{web_analytics_tag:.result.build_config.web_analytics_tag,web_analytics_token_present:(.result.build_config.web_analytics_token != null and .result.build_config.web_analytics_token != "")}}}' \
            > final-evidence/cloudflare-project.json
          jq -e '.success == true and (.result.build_config.web_analytics_tag == null or .result.build_config.web_analytics_tag == "") and .result.build_config.web_analytics_token_present == false' final-evidence/cloudflare-project.json >/dev/null

      - name: Build final production validation report
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import statistics
          from pathlib import Path

          root = Path('final-evidence')
          lighthouse_root = root / 'artifacts' / 'lighthouse'
          reports = [p for p in sorted(lighthouse_root.rglob('lighthouse-*.json')) if p.name != 'lighthouse-summary.json']
          if len(reports) != 6:
              raise SystemExit(f'expected six Lighthouse reports, found {len(reports)}')

          modes = {'mobile': [], 'desktop': []}
          for path in reports:
              data = json.loads(path.read_text(encoding='utf-8'))
              mode = 'desktop' if 'desktop' in path.name else 'mobile'
              categories = data.get('categories', {})
              audits = data.get('audits', {})
              agentic = categories.get('agentic-browsing') or {}
              applicable = passed = 0
              failed = []
              for ref in agentic.get('auditRefs') or []:
                  audit = audits.get(ref.get('id'), {})
                  score = audit.get('score')
                  if score is None:
                      continue
                  applicable += 1
                  if score == 1:
                      passed += 1
                  else:
                      failed.append(ref.get('id'))
              modes[mode].append({
                  'file': path.name,
                  'performance': round((categories.get('performance', {}).get('score') or 0) * 100),
                  'accessibility': round((categories.get('accessibility', {}).get('score') or 0) * 100),
                  'bestPractices': round((categories.get('best-practices', {}).get('score') or 0) * 100),
                  'seo': round((categories.get('seo', {}).get('score') or 0) * 100),
                  'lcp': audits.get('largest-contentful-paint', {}).get('numericValue'),
                  'fcp': audits.get('first-contentful-paint', {}).get('numericValue'),
                  'tbt': audits.get('total-blocking-time', {}).get('numericValue'),
                  'cls': audits.get('cumulative-layout-shift', {}).get('numericValue'),
                  'agentic': {'passed': passed, 'applicable': applicable, 'failed': failed},
              })

          def median(rows, key):
              values = [row[key] for row in rows if row.get(key) is not None]
              return statistics.median(values) if values else None

          summary = {}
          for mode, rows in modes.items():
              summary[mode] = {
                  'runs': rows,
                  'median': {key: median(rows, key) for key in ('performance','accessibility','bestPractices','seo','lcp','fcp','tbt','cls')},
              }

          http_paths = list((root / 'artifacts' / 'live').rglob('http-summary.json'))
          if len(http_paths) != 1:
              raise SystemExit(f'expected one HTTP summary, found {len(http_paths)}')

          validation_run = json.loads((root / 'validation-run.json').read_text())
          jobs_payload = json.loads((root / 'validation-jobs.json').read_text())
          jobs = [
              {'id': job.get('id'), 'name': job.get('name'), 'status': job.get('status'), 'conclusion': job.get('conclusion')}
              for job in jobs_payload.get('jobs', [])
          ]
          if not jobs or any(job['conclusion'] != 'success' for job in jobs):
              raise SystemExit(f'validation jobs are not all successful: {jobs}')

          report = {
              'validationRunId': validation_run['id'],
              'validationRunAttempt': validation_run.get('run_attempt'),
              'auditedSha': validation_run['head_sha'],
              'workflowConclusion': validation_run['conclusion'],
              'jobs': jobs,
              'evidenceArtifacts': {
                  'liveHttp': int('8725107723'),
                  'lighthouse': int('8725201943'),
              },
              'cloudflare': json.loads((root / 'cloudflare-project.json').read_text()),
              'http': json.loads(http_paths[0].read_text()),
              'lighthouse': summary,
          }
          (root / 'final-production-validation.json').write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          print(json.dumps(report, ensure_ascii=False, indent=2))
          PY

      - name: Remove temporary engineering surfaces and freeze validated source
        id: freeze
        shell: bash
        run: |
          set -euo pipefail
          git rm -f .github/workflows/finalize-successful-validation.yml
          [ ! -f .github/workflows/capture-current-validation.yml ] || git rm -f .github/workflows/capture-current-validation.yml
          [ ! -f .github/scripts/.final-validation-trigger ] || git rm -f .github/scripts/.final-validation-trigger
          if git ls-files 'tmp/**' | grep -q .; then
            git rm -rf tmp
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Freeze validated production source'
          git push origin HEAD:main
          freeze_sha=$(git rev-parse HEAD)
          echo "sha=$freeze_sha" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$freeze_sha" > final-evidence/final-freeze-sha.txt

      - name: Verify exact freeze deployment on Cloudflare
        id: verify
        shell: bash
        env:
          FREEZE_SHA: ${{ steps.freeze.outputs.sha }}
        run: |
          set +e
          mkdir -p live-audit
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          import time
          from pathlib import Path

          expected = os.environ['FREEZE_SHA']
          result = {'expectedSha': expected, 'liveMarker': None, 'matched': False, 'attempts': 0}
          for attempt in range(1, 121):
              result['attempts'] = attempt
              url = f'https://www.ghezelbaash.ir/?freeze-check={int(time.time())}-{attempt}'
              proc = subprocess.run(
                  ['curl', '-sS', '--compressed', '--max-time', '90', '-H', 'Cache-Control: no-cache', '-H', 'Pragma: no-cache', url],
                  capture_output=True,
              )
              html = proc.stdout.decode('utf-8', errors='replace')
              marker = None
              for pattern in (
                  r'<meta\s+name=["\']x-deploy-commit["\']\s+content=["\']([0-9a-f]{7,40}|local)["\']',
                  r'<meta\s+content=["\']([0-9a-f]{7,40}|local)["\']\s+name=["\']x-deploy-commit["\']',
              ):
                  match = re.search(pattern, html, re.I)
                  if match:
                      marker = match.group(1)
                      break
              result['liveMarker'] = marker
              result['beaconPresent'] = 'cloudflareinsights.com' in html or 'data-cf-beacon' in html
              result['googleVerificationPresent'] = '8n4oKDWVkFyp-dUWoTAnLVO1HTr4ARpSPEVngAvybCQ' in html
              print(f'freeze deployment attempt={attempt} expected={expected} live={marker}', flush=True)
              if marker == expected:
                  result['matched'] = True
                  break
              time.sleep(15)
          Path('final-evidence/final-live-marker.json').write_text(json.dumps(result, indent=2) + '\n')
          if not result['matched']:
              raise SystemExit(1)
          if result.get('beaconPresent'):
              raise SystemExit(2)
          PY
          marker_status=$?
          validator_status=999
          if [ "$marker_status" = 0 ]; then
            rm -rf live-audit
            mkdir -p live-audit
            python3 .github/scripts/validate_live.py --expected-sha "$FREEZE_SHA" --deployment-timeout 0
            validator_status=$?
            cp -R live-audit final-evidence/final-live-http
          fi
          if [ "$marker_status" != 0 ]; then
            final_status=$marker_status
          else
            final_status=$validator_status
          fi
          echo "status=$final_status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload immutable final evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-validated-production-${{ steps.freeze.outputs.sha }}
          path: final-evidence/
          retention-days: 30

      - name: Enforce exact final deployment
        if: always()
        shell: bash
        env:
          FINAL_STATUS: ${{ steps.verify.outputs.status }}
        run: |
          set -euo pipefail
          [ "${FINAL_STATUS:-999}" = 0 ]

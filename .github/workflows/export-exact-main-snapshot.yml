name: Validate exact main snapshot

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validation branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up exact Node runtime
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm

      - name: Set up exact npm runtime
        shell: bash
        run: npm install --global npm@11.16.0

      - name: Record runtime and source versions
        shell: bash
        run: |
          node --version | tee runtime-node.txt
          npm --version | tee runtime-npm.txt
          git rev-parse HEAD | tee validation-head.txt
          git rev-parse origin/main | tee baseline-main.txt

      - name: Apply proven non-visible corrections under test
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          headers = Path('public/_headers')
          old = 'sha256-10+IOzNOhJOl42dCmxiPxNpW8ukBti5iF6r5bWUIg1I='
          new = 'sha256-FMVGyF8UqQiWNnK8cHi044kOueyUVl33/oPNqn7CVJM='
          text = headers.read_text('utf-8')
          if text.count(old) != 1:
              raise SystemExit('Expected exactly one stale CSP hash')
          headers.write_text(text.replace(old, new), 'utf-8')

          attributes = Path('.gitattributes')
          attrs = attributes.read_text('utf-8').rstrip('\n') + '\n*.vcf -text\n'
          attributes.write_text(attrs, 'utf-8')

          for name in ('public/doctor.vcf', 'public/clinic.vcf'):
              path = Path(name)
              normalized = path.read_bytes().replace(b'\r\n', b'\n').replace(b'\r', b'\n')
              lines = normalized.rstrip(b'\n').split(b'\n')
              path.write_bytes(b'\r\n'.join(lines) + b'\r\n')
          PY
          git diff -- public/_headers .gitattributes public/doctor.vcf public/clinic.vcf > correction.patch

      - name: Install locked dependencies
        shell: bash
        run: npm ci 2>&1 | tee npm-ci.log

      - name: Build corrected source
        shell: bash
        run: npm run build 2>&1 | tee build.log

      - name: Validate generated CSP
        shell: bash
        run: |
          python3 - <<'PY' | tee generated-csp-audit.txt
          import base64, hashlib, pathlib, re
          html = pathlib.Path('dist/index.html').read_text('utf-8')
          match = re.search(r'<script\b[^>]*type=["\']application/ld\+json["\'][^>]*>([\s\S]*?)</script>', html, re.I)
          if not match:
              raise SystemExit('No inline application/ld+json script found in dist/index.html')
          payload = match.group(1).encode('utf-8')
          calculated = 'sha256-' + base64.b64encode(hashlib.sha256(payload).digest()).decode()
          headers = pathlib.Path('dist/_headers').read_text('utf-8')
          declared = sorted(set(re.findall(r'sha256-[A-Za-z0-9+/=]+', headers)))
          print('generated_payload_bytes=', len(payload), sep='')
          print('calculated=', calculated, sep='')
          print('declared=', ','.join(declared), sep='')
          print('match=', str(calculated in declared).lower(), sep='')
          if calculated not in declared:
              raise SystemExit('Generated Head Graph is blocked by the declared CSP hash')
          PY

      - name: Validate semantic graph serialization
        shell: bash
        run: |
          python3 -m pip install --quiet rdflib==7.5.0
          python3 - <<'PY' | tee semantic-serialization-audit.txt
          from rdflib import Graph
          from rdflib.compare import isomorphic
          jsonld = Graph().parse('public/graph.jsonld', format='json-ld')
          turtle = Graph().parse('public/graph.ttl', format='turtle')
          same = isomorphic(jsonld, turtle)
          print('jsonld_triples=', len(jsonld), sep='')
          print('turtle_triples=', len(turtle), sep='')
          print('isomorphic=', str(same).lower(), sep='')
          if not same:
              raise SystemExit('JSON-LD and Turtle graphs are not isomorphic')
          PY

      - name: Check generated HTML invariants
        shell: bash
        run: |
          python3 - <<'PY' | tee generated-html-invariants.txt
          from pathlib import Path
          import re
          for name in ('index.html', '404.html'):
              html = Path('dist', name).read_text('utf-8')
              ids = re.findall(r'\bid=["\']([^"\']+)["\']', html, re.I)
              duplicates = sorted({x for x in ids if ids.count(x) > 1})
              jsonld = re.findall(r'<script\b[^>]*type=["\']application/ld\+json["\'][^>]*>', html, re.I)
              inline_styles = re.findall(r'\sstyle=["\']', html, re.I)
              print(name, 'bytes=', len(html.encode('utf-8')), 'ids=', len(ids), 'duplicate_ids=', len(duplicates), 'jsonld_scripts=', len(jsonld), 'inline_styles=', len(inline_styles))
              if duplicates or len(jsonld) != 1 or inline_styles:
                  raise SystemExit(f'Generated HTML invariant failed for {name}')
          PY

      - name: Validate vCard serialization
        shell: bash
        run: |
          python3 - <<'PY' | tee vcard-serialization-audit.txt
          from pathlib import Path
          for name in ('public/doctor.vcf', 'public/clinic.vcf', 'dist/doctor.vcf', 'dist/clinic.vcf'):
              data = Path(name).read_bytes()
              crlf = data.count(b'\r\n')
              bare_lf = data.count(b'\n') - crlf
              ends_crlf = data.endswith(b'\r\n')
              max_line = max(len(line) for line in data.split(b'\r\n'))
              print(name, 'crlf=', crlf, 'bare_lf=', bare_lf, 'ends_crlf=', ends_crlf, 'max_physical_line_octets=', max_line)
              if bare_lf or not ends_crlf or max_line > 75:
                  raise SystemExit(f'Invalid vCard serialization: {name}')
          PY

      - name: Create source and build checksums
        shell: bash
        run: |
          find dist -type f -print0 | sort -z | xargs -0 sha256sum > dist-sha256.txt
          sha256sum \
            public/graph.jsonld \
            public/graph.ttl \
            src/data/semantic/head-graph.min.jsonld \
            public/_headers \
            public/doctor.vcf \
            public/clinic.vcf > corrected-source-sha256.txt

      - name: Upload validation artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-ghezelbaash-main-feb74f67-technical-fix-01-validation
          path: |
            dist/
            runtime-node.txt
            runtime-npm.txt
            validation-head.txt
            baseline-main.txt
            npm-ci.log
            build.log
            correction.patch
            generated-csp-audit.txt
            semantic-serialization-audit.txt
            generated-html-invariants.txt
            vcard-serialization-audit.txt
            dist-sha256.txt
            corrected-source-sha256.txt
          if-no-files-found: warn
          retention-days: 1
          compression-level: 0

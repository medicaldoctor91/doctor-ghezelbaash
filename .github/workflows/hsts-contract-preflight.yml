name: One-shot HSTS contract preflight

on:
  push:
    branches: [audit/cloudflare-required-20260811]

permissions:
  contents: read

env:
  CLOUDFLARE_ACCOUNT_ID: 884d1d90bd1fb6ecca14992c6c60d677
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  ZONE_NAME: ghezelbaash.ir

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Enumerate web hostnames, verify HTTPS, and inspect token permission groups
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import datetime as dt, json, os, ssl, urllib.error, urllib.parse, urllib.request
          A=os.environ['CLOUDFLARE_ACCOUNT_ID']; M=os.environ['CLOUDFLARE_API_TOKEN']; ZN=os.environ['ZONE_NAME']; B='https://api.cloudflare.com/client/v4'
          def call(tok,m,p,b=None):
              h={'Authorization':f'Bearer {tok}','Accept':'application/json','Content-Type':'application/json','User-Agent':'ghezelbaash-hsts-preflight/1.0'}
              req=urllib.request.Request(B+p,data=None if b is None else json.dumps(b,separators=(',',':')).encode(),method=m,headers=h)
              try:
                  with urllib.request.urlopen(req,timeout=45) as r:
                      raw=r.read().decode('utf-8','replace'); return r.status,json.loads(raw) if raw else {}
              except urllib.error.HTTPError as e:
                  raw=e.read().decode('utf-8','replace')
                  try: pld=json.loads(raw) if raw else {}
                  except Exception: pld={'raw':raw[:1000]}
                  return e.code,pld
          def expect(tok,m,p,b=None,ok=(200,)):
              s,x=call(tok,m,p,b)
              if s not in ok or x.get('success') is not True: raise SystemExit(f'API failure {m} {p} HTTP {s}: {x}')
              return x
          q=urllib.parse.urlencode({'name':ZN,'account.id':A,'per_page':50}); zones=expect(M,'GET','/zones?'+q).get('result') or []
          exact=[z for z in zones if z.get('name')==ZN]
          if len(exact)!=1: raise SystemExit(f'Expected one zone, got {len(exact)}')
          Z=exact[0]['id']
          groups=expect(M,'GET',f'/accounts/{A}/tokens/permission_groups?scope=com.cloudflare.api.account.zone').get('result') or []
          relevant=[]
          needles=('zone settings','bot management','rulesets','cache purge','cache')
          for g in groups:
              name=str(g.get('name') or '')
              if any(n in name.lower() for n in needles): relevant.append({'id':g.get('id'),'name':name,'scopes':g.get('scopes')})
          print('RELEVANT_PERMISSION_GROUPS',json.dumps(relevant,sort_keys=True))
          zone_groups=[{'id':g['id']} for g in groups if g.get('id') and 'com.cloudflare.api.account.zone' in (g.get('scopes') or [])]
          exp=(dt.datetime.now(dt.timezone.utc)+dt.timedelta(minutes=20)).replace(microsecond=0).isoformat().replace('+00:00','Z')
          created=expect(M,'POST',f'/accounts/{A}/tokens',{'name':'Temporary Ghezelbaash HSTS Preflight','expires_on':exp,'policies':[{'effect':'allow','resources':{f'com.cloudflare.api.account.zone.{Z}':'*'},'permission_groups':zone_groups}]},ok=(200,201)).get('result') or {}
          T=created.get('value'); TID=created.get('id')
          if not T or not TID: raise SystemExit('Temporary token creation failed')
          try:
              dns=expect(T,'GET',f'/zones/{Z}/dns_records?per_page=500').get('result') or []
              web=[]
              for r in dns:
                  if r.get('type') in ('A','AAAA','CNAME'):
                      web.append({'type':r.get('type'),'name':r.get('name'),'proxied':r.get('proxied'),'content':r.get('content')})
              print('WEB_DNS_RECORDS',json.dumps(web,sort_keys=True))
              names=sorted({r['name'].rstrip('.') for r in web if r.get('name') and (r['name']==ZN or r['name'].endswith('.'+ZN))})
              failures=[]; checks=[]
              class NoRedirect(urllib.request.HTTPRedirectHandler):
                  def redirect_request(self, req, fp, code, msg, headers, newurl): return None
              opener=urllib.request.build_opener(NoRedirect)
              for host in names:
                  url='https://'+host+'/'
                  try:
                      req=urllib.request.Request(url,headers={'User-Agent':'ghezelbaash-hsts-preflight/1.0'})
                      try:
                          with opener.open(req,timeout=30) as r: code=r.status; loc=r.headers.get('Location'); server=r.headers.get('Server')
                      except urllib.error.HTTPError as e: code=e.code; loc=e.headers.get('Location'); server=e.headers.get('Server')
                      ok=100 <= int(code) < 600
                      checks.append({'host':host,'https':ok,'status':code,'location':loc,'server':server})
                      if not ok: failures.append(host)
                  except Exception as e:
                      checks.append({'host':host,'https':False,'error':type(e).__name__+': '+str(e)[:400]}); failures.append(host)
              print('HTTPS_HOST_CHECKS',json.dumps(checks,sort_keys=True))
              if failures: raise SystemExit('HSTS includeSubDomains unsafe; HTTPS failures: '+','.join(failures))
              sh=(expect(T,'GET',f'/zones/{Z}/settings/security_header').get('result') or {})
              print('CURRENT_SECURITY_HEADER',json.dumps({'value':sh.get('value'),'editable':sh.get('editable')},sort_keys=True))
          finally:
              s,p=call(M,'DELETE',f'/accounts/{A}/tokens/{TID}'); print('TEMP_TOKEN_REVOKE',s,p.get('success'))
          PY

name: Apply Zenodo inventory isolation
on:
  push:
    branches:
      - release/v1.2.2-candidate
    paths:
      - .github/workflows/v122-apply-zenodo-inventory-fix.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - run: python scripts/tmp_patch_zenodo_inventory.py
      - run: python -m py_compile scripts/zenodo_release.py
      - run: |
          git config user.name ghezelbaash-release-bot
          git config user.email actions@users.noreply.github.com
          git add scripts/zenodo_release.py
          git commit -m "Isolate Zenodo release inventory from Hugging Face inventory"
          git push origin HEAD:release/v1.2.2-candidate

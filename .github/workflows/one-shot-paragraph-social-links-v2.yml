name: One-shot paragraph social links v2

on:
  push:
    paths:
      - '.github/workflows/one-shot-paragraph-social-links-v2.yml'
      - 'scripts/apply-paragraph-social-links.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply paragraph social links
        run: python3 scripts/apply-paragraph-social-links.py
      - name: Commit paragraph links
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/pages/index.md paragraph-social-links-report.txt
          git diff --cached --quiet && { echo "No changes"; exit 1; }
          git commit -m "Add cross-section paragraph links to social headings"
          git push

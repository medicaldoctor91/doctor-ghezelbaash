name: Wikidata native name and prefix audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wikidata-native-name-prefix-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check --no-input requests==2.32.5
      - name: Read live P1559 and P511
        shell: python
        run: |
          import json, requests
          WD='https://www.wikidata.org/w/api.php'; Q='Q140287622'
          s=requests.Session(); s.headers['User-Agent']='Medicaldoctor91NativeNamePrefixAudit/1.0 (https://www.ghezelbaash.ir/)'
          r=s.get(WD,params={'action':'wbgetentities','ids':Q,'props':'claims|info','format':'json','formatversion':2},timeout=90); r.raise_for_status(); e=r.json()['entities'][Q]
          out={'lastrevid':e.get('lastrevid'),'P1559':[],'P511':[]}
          for c in e.get('claims',{}).get('P1559',[]):
              v=c.get('mainsnak',{}).get('datavalue',{}).get('value')
              out['P1559'].append({'claim':c.get('id'),'value':v,'references':len(c.get('references',[]))})
          for c in e.get('claims',{}).get('P511',[]):
              v=c.get('mainsnak',{}).get('datavalue',{}).get('value')
              out['P511'].append({'claim':c.get('id'),'value':v,'references':len(c.get('references',[]))})
          print(json.dumps(out,ensure_ascii=False,indent=2))

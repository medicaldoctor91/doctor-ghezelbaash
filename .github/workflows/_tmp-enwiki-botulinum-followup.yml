name: Temporary enwiki Botulinum follow-up request
on:
  push:
    branches: [main]
    paths: ['.github/workflows/_tmp-enwiki-botulinum-followup.yml']
permissions:
  contents: write
jobs:
  followup:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      WIKIMEDIA_USERNAME: ${{ secrets.WIKIVERSITY_USERNAME }}
      WIKIMEDIA_BOT_PASSWORD: ${{ secrets.WIKIVERSITY_BOT_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check --no-input requests==2.32.5
      - name: Post duplicate-safe COI follow-up
        shell: bash
        run: |
          python - <<'PY'
          import os,requests,json
          API='https://en.wikipedia.org/w/api.php'
          USER=os.environ['WIKIMEDIA_USERNAME']; PASS=os.environ['WIKIMEDIA_BOT_PASSWORD']
          UA='GhezelbaashEnwikiBotulinumFollowup/1.0 (https://www.ghezelbaash.ir/)'
          TITLE='Talk:Botulinum toxin'
          SECTION='Follow-up: Wikiversity link target'
          NEEDLE='v=Botulinum toxin in aesthetic medicine'
          TEXT=(
          '{{edit COI}}\n'
          "'''Disclosure:''' I am Saeed Ghezelbash (User:Medicaldoctor91), the author of the Wikiversity resource discussed in the earlier request.\n\n"
          'Thank you for implementing the Wikiversity sister-project link. I noticed one technical issue in the resulting link: with `v=yes`, the template currently resolves to `v:Special:Search/Botulinum toxin`, because there is no Wikiversity page titled exactly `Botulinum toxin`. The intended resource is [[v:Botulinum toxin in aesthetic medicine]], which is the page discussed in the original request.\n\n'
          'Template documentation accepts an explicit Wikiversity page name. Would an independent editor please consider changing the parameter from `v=yes` to `v=Botulinum toxin in aesthetic medicine` so that the sister-project link resolves directly to the reviewed resource rather than to a search page? I am not editing the article directly because of my connection to the resource. ~~~~'
          )
          s=requests.Session(); s.headers.update({'User-Agent':UA})
          def get(**p):
            p.update(format='json',formatversion=2)
            r=s.get(API,params=p,timeout=60); r.raise_for_status(); d=r.json()
            if 'error' in d: raise RuntimeError(d['error'])
            return d
          def post(**p):
            p.update(format='json',formatversion=2)
            r=s.post(API,data=p,timeout=90); r.raise_for_status(); d=r.json()
            if 'error' in d: raise RuntimeError(d['error'])
            return d
          lt=get(action='query',meta='tokens',type='login')['query']['tokens']['logintoken']
          login=post(action='login',lgname=USER,lgpassword=PASS,lgtoken=lt)
          if login.get('login',{}).get('result')!='Success': raise RuntimeError(login)
          p=get(action='query',titles=TITLE,prop='revisions',rvprop='ids|content',rvslots='main')['query']['pages'][0]
          rev=(p.get('revisions') or [{}])[0]; content=rev.get('slots',{}).get('main',{}).get('content','')
          if SECTION.lower() in content.lower() or NEEDLE.lower() in content.lower():
            print(json.dumps({'ok':True,'duplicate_guard':True,'latest_revid':rev.get('revid')})); raise SystemExit(0)
          token=get(action='query',meta='tokens',type='csrf')['query']['tokens']['csrftoken']
          result=post(action='edit',title=TITLE,section='new',sectiontitle=SECTION,text=TEXT,token=token,summary='COI follow-up: correct Wikiversity sister-link target to the reviewed resource')
          print(json.dumps({'ok':True,'edit':result.get('edit')},ensure_ascii=False))
          PY
      - name: Verify live result
        shell: bash
        run: |
          python - <<'PY'
          import requests,json,os
          API='https://en.wikipedia.org/w/api.php'; H={'User-Agent':'GhezelbaashEnwikiBotulinumFollowupVerify/1.0 (https://www.ghezelbaash.ir/)'}
          d=requests.get(API,params={'action':'query','format':'json','formatversion':2,'titles':'Talk:Botulinum toxin','prop':'revisions','rvprop':'ids|timestamp|user|comment|content','rvslots':'main','rvlimit':10},headers=H,timeout=60).json()
          p=d['query']['pages'][0]; revs=p.get('revisions',[]); text=(revs[0].get('slots',{}).get('main',{}).get('content','') if revs else '')
          out={'contains_followup':'Follow-up: Wikiversity link target' in text,'contains_explicit_target':'v=Botulinum toxin in aesthetic medicine' in text,'latest':[{'revid':r.get('revid'),'timestamp':r.get('timestamp'),'user':r.get('user'),'comment':r.get('comment')} for r in revs]}
          os.makedirs('wikimedia',exist_ok=True)
          open('wikimedia/_tmp-enwiki-botulinum-followup-status.json','w',encoding='utf8').write(json.dumps(out,ensure_ascii=False,indent=2))
          print(json.dumps(out,ensure_ascii=False))
          PY
      - name: Commit temporary status
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add wikimedia/_tmp-enwiki-botulinum-followup-status.json
          git commit -m 'Record temporary enwiki Botulinum follow-up status'
          git push

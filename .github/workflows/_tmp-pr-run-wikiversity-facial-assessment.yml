name: Temporary PR runner Wikiversity facial assessment creation
on:
  pull_request:
    branches: [main]
    paths: ['.github/_tmp-run-wikiversity-facial-assessment.txt']
permissions:
  contents: read
jobs:
  create:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      WIKIMEDIA_USERNAME: ${{ secrets.WIKIVERSITY_USERNAME }}
      WIKIMEDIA_BOT_PASSWORD: ${{ secrets.WIKIVERSITY_BOT_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check --no-input requests==2.32.5
      - name: Enable one-time confirmation of constructive abuse-filter warning
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/_tmp_create_wikiversity_facial_assessment.py')
          s=p.read_text(encoding='utf-8')
          old="""    def post(**p):
        p.update(format='json',formatversion=2)
        r=s.post(api,data=p,timeout=90); r.raise_for_status(); d=r.json()
        if 'error' in d: raise RuntimeError(d['error'])
        return d
"""
          new="""    def post(**p):
        p.update(format='json',formatversion=2)
        r=s.post(api,data=p,timeout=90); r.raise_for_status(); d=r.json()
        if d.get('error',{}).get('code')=='abusefilter-warning':
            r=s.post(api,data=p,timeout=90); r.raise_for_status(); d=r.json()
        if 'error' in d: raise RuntimeError(d['error'])
        return d
"""
          if old not in s:
              raise SystemExit('post wrapper marker not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Execute guarded idempotent creation script
        run: python scripts/_tmp_create_wikiversity_facial_assessment.py

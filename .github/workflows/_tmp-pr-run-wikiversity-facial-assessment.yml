name: Temporary PR runner Wikiversity facial assessment creation
on:
  pull_request:
    branches: [main]
    paths: ['.github/_tmp-run-wikiversity-facial-assessment.txt']
permissions:
  contents: read
jobs:
  create:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      WIKIMEDIA_USERNAME: ${{ secrets.WIKIVERSITY_USERNAME }}
      WIKIMEDIA_BOT_PASSWORD: ${{ secrets.WIKIVERSITY_BOT_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check --no-input requests==2.32.5
      - name: Execute guarded idempotent creation script
        run: python scripts/_tmp_create_wikiversity_facial_assessment.py

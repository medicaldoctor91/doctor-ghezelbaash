name: Temporary PR runner Wikiversity facial assessment creation
on:
  pull_request:
    branches: [main]
    paths: ['.github/_tmp-run-wikiversity-facial-assessment.txt']
permissions:
  contents: read
jobs:
  create:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      WIKIMEDIA_USERNAME: ${{ secrets.WIKIVERSITY_USERNAME }}
      WIKIMEDIA_BOT_PASSWORD: ${{ secrets.WIKIVERSITY_BOT_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check --no-input requests==2.32.5
      - name: Execute guarded creation script
        run: |
          python - <<'PY'
          from pathlib import Path
          src=Path('.github/workflows/_tmp-create-wikiversity-facial-assessment.yml').read_text(encoding='utf-8')
          start="python - <<'PY'\n"
          if start not in src:
              raise SystemExit('embedded Python start marker not found')
          raw=src.split(start,1)[1].split("\n          PY",1)[0]
          code='\n'.join(line[10:] if line.startswith('          ') else line for line in raw.splitlines())
          exec(compile(code,'<wikiversity-create>','exec'),{})
          PY

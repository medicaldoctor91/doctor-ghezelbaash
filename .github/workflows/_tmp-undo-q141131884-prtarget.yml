name: Temporary immediate undo Q141131884

on:
  pull_request_target:
    types: [opened]

permissions:
  contents: write

jobs:
  undo:
    if: github.event.pull_request.head.ref == 'tmp-undo-q141131884-now'
    runs-on: macos-15
    timeout-minutes: 10
    env:
      WIKIMEDIA_USERNAME: ${{ secrets.WIKIVERSITY_USERNAME }}
      WIKIMEDIA_BOT_PASSWORD: ${{ secrets.WIKIVERSITY_BOT_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14.6'
      - run: python -m pip install --disable-pip-version-check --no-input requests==2.32.5
      - name: Undo and request deletion
        shell: bash
        run: |
          set -euo pipefail
          test -n "$WIKIMEDIA_USERNAME"
          test -n "$WIKIMEDIA_BOT_PASSWORD"
          mkdir -p wikimedia
          set +e
          python scripts/_tmp_undo_q141131884_and_request_delete.py > wikimedia/_tmp-q141131884-undo-delete.json 2>&1
          code=$?
          echo >> wikimedia/_tmp-q141131884-undo-delete.json
          echo "EXIT_CODE=$code" >> wikimedia/_tmp-q141131884-undo-delete.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add wikimedia/_tmp-q141131884-undo-delete.json
          git commit -m 'Record Q141131884 undo/deletion status' || true
          git push origin HEAD:main
          exit $code

name: Temporary cleanup Q141131884 undo runner

on:
  pull_request_target:
    types: [closed]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.pull_request.head.ref == 'tmp-undo-q141131884-now'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
      - name: Remove temporary branch and files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git push origin --delete tmp-undo-q141131884-now || true
          git rm -f scripts/_tmp_undo_q141131884_and_request_delete.py
          git rm -f .github/workflows/_tmp-undo-q141131884.yml
          git rm -f wikimedia/_tmp-q141131884-undo-delete.json
          git rm -f .github/workflows/_tmp-undo-q141131884-prtarget.yml
          git commit -m 'Remove temporary Q141131884 undo/deletion runner files'
          git push origin HEAD:main

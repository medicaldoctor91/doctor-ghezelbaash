name: Temporary sister-project link syntax test
on:
  push:
    branches: [main]
    paths: ['.github/workflows/_tmp-sister-link-syntax-test.yml']
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check --no-input requests==2.32.5
      - name: Test template rendering
        shell: bash
        run: |
          python - <<'PY'
          import requests,json,os
          API='https://en.wikipedia.org/w/api.php'; H={'User-Agent':'GhezelbaashSisterLinkSyntaxTest/1.0 (https://www.ghezelbaash.ir/)'}
          def a(**p):
            p.update(format='json',formatversion=2); r=requests.get(API,params=p,headers=H,timeout=60); r.raise_for_status(); d=r.json();
            if 'error' in d: raise RuntimeError(d['error'])
            return d
          tests={
            'yes':'{{sister project links|v=yes}}',
            'explicit':'{{sister project links|v=Botulinum toxin in aesthetic medicine}}',
            'full_explicit':'{{sister project links||d=Q114242090|c=Category:Botulinum neurotoxin|n=no|b=no|v=Botulinum toxin in aesthetic medicine|voy=no|m=no|mw=no|s=no|wikt=no|species=no}}'
          }
          out={}
          for k,t in tests.items():
            d=a(action='parse',text=t,title='Botulinum toxin',contentmodel='wikitext',prop='iwlinks|text')
            out[k]={'iwlinks':d.get('parse',{}).get('iwlinks',[])}
          doc=a(action='query',titles='Template:Sister project links/doc',prop='revisions',rvprop='content',rvslots='main',rvlimit=1)
          p=doc['query']['pages'][0]; txt=(p.get('revisions') or [{}])[0].get('slots',{}).get('main',{}).get('content','')
          out['doc_lines']=[line for line in txt.splitlines() if 'wikiversity' in line.lower() or line.strip().startswith('|v')][:50]
          os.makedirs('wikimedia',exist_ok=True)
          with open('wikimedia/_tmp-sister-link-syntax-test.json','w',encoding='utf8') as f:json.dump(out,f,ensure_ascii=False,indent=2)
          print(json.dumps(out,ensure_ascii=False))
          PY
      - name: Commit test result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add wikimedia/_tmp-sister-link-syntax-test.json
          git commit -m 'Record temporary sister-project link syntax test'
          git push

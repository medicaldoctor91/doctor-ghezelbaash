name: Patch footer machine-resource migration guard

on:
  push:
    branches:
      - feat/static-reputation-authority-20260903
    paths:
      - .github/workflows/patch-footer-machine-guard.yml

permissions:
  contents: write

concurrency:
  group: patch-footer-machine-guard
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/static-reputation-authority-20260903
          fetch-depth: 0
          persist-credentials: true

      - name: Replace the text-dependent footer guard with a source-structural guard
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          migration = Path("scripts/migrations/apply-approved-release-ready.mjs")
          source = migration.read_text(encoding="utf-8")
          old = '''  const machineBlock = enclosingElementContaining(
              footer,
              "RDF/Turtle",
              ["nav", "p", "div", "section"],
            );
            assert(machineBlock.text.includes("JSON-LD") && machineBlock.text.includes("SHACL"), "Machine resource block detection was not specific enough");'''
          new = '''  const machineBlock = enclosingElementContaining(
              footer,
              'aria-label="نسخه‌های ماشینی رسمی"',
              ["nav"],
            );
            assert(
              machineBlock.tag === "nav" && machineBlock.text.includes("footerLinks.map"),
              "Machine resource block detection was not specific enough",
            );'''
          if old in source:
              source = source.replace(old, new, 1)
          elif new not in source:
              raise SystemExit("Expected footer machine-resource guard was not found")
          migration.write_text(source, encoding="utf-8")

          rebuild = Path(".github/workflows/rebuild-clean-release-ready.yml")
          workflow = rebuild.read_text(encoding="utf-8")
          marker = "# footer-source-structure-retry-3\n"
          if marker not in workflow:
              workflow = marker + workflow
          rebuild.write_text(workflow, encoding="utf-8")
          PY
          node --check scripts/migrations/apply-approved-release-ready.mjs

      - name: Commit the corrected migration and trigger the clean rebuild
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/migrations/apply-approved-release-ready.mjs .github/workflows/rebuild-clean-release-ready.yml
          git diff --cached --quiet && {
            echo "Migration guard was already current"
            exit 0
          }
          git commit -m "fix: bind footer machine resources structurally"
          git push origin HEAD:feat/static-reputation-authority-20260903
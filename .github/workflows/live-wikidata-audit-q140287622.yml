name: Live Wikidata audit Q140287622
on:
  push:
    paths:
      - 'scripts/live_wikidata_audit_q140287622.py'
      - 'scripts/live_wikidata_digest_q140287622.py'
      - '.github/workflows/live-wikidata-audit-q140287622.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Fetch live Wikidata entity and semantic digest
        run: |
          mkdir -p .audit
          python scripts/live_wikidata_audit_q140287622.py > .audit/q140287622-live.json
          python scripts/live_wikidata_digest_q140287622.py > .audit/q140287622-digest.json
      - uses: actions/upload-artifact@v4
        with:
          name: q140287622-live-audit
          path: |
            .audit/q140287622-live.json
            .audit/q140287622-digest.json
          if-no-files-found: error
      - name: Persist audit snapshots for inspection
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .audit/q140287622-live.json .audit/q140287622-digest.json
          git commit -m 'Persist live Q140287622 audit snapshots' || exit 0
          git push

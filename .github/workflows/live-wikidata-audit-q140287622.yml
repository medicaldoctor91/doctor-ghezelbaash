name: Live Wikidata audit Q140287622
on:
  push:
    paths:
      - 'scripts/live_wikidata_audit_q140287622.py'
      - '.github/workflows/live-wikidata-audit-q140287622.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Fetch live Wikidata entity and constraints
        run: python scripts/live_wikidata_audit_q140287622.py | tee /tmp/q140287622-live-audit.json
      - uses: actions/upload-artifact@v4
        with:
          name: q140287622-live-audit
          path: /tmp/q140287622-live-audit.json
          if-no-files-found: error

name: Temporary clean generic link transition

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_temporary-clean-link-transition.yml'

permissions:
  contents: write
  statuses: write

concurrency:
  group: doctor-ghezelbaash-source-mutation
  cancel-in-progress: false

jobs:
  clean:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      GH_STATUS_TOKEN: ${{ github.token }}
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14.6'
      - name: Prepare helpers
        shell: bash
        run: |
          cat > /tmp/mark-status.sh <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          jq -n --arg state "$2" --arg context "$1" --arg description "$3" '{state:$state,context:$context,description:$description}' >/tmp/status.json
          curl -fsS -X POST -H "Authorization: Bearer ${GH_STATUS_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'Content-Type: application/json' --data-binary @/tmp/status.json "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" >/dev/null || true
          SH
          chmod +x /tmp/mark-status.sh
          cat > /tmp/run-stage.sh <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          context="$1"; shift
          /tmp/mark-status.sh "$context" pending "Running ${context}"
          if "$@"; then /tmp/mark-status.sh "$context" success "${context} passed"; else /tmp/mark-status.sh "$context" failure "${context} failed"; exit 1; fi
          SH
          chmod +x /tmp/run-stage.sh
      - name: Prepare the exact final clean repository tree
        shell: bash
        run: |
          set -euo pipefail
          git rm -f .github/workflows/_temporary-clean-link-transition.yml
          git rm -f .github/workflows/_temporary-disable-rum-configuration-rule.yml
          /tmp/mark-status.sh 'perf/link-transition/temp-clean' success 'Temporary operational workflows removed from the index and validation tree'
      - name: Remove only the canonical generic anchor transition
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('src/styles/global.css')
          s=p.read_text(encoding='utf-8')
          target='transition:color 140ms ease,text-decoration-color 140ms ease;'
          count=s.count(target)
          if count!=1:
              raise SystemExit(f'Expected exactly one generic anchor transition, found {count}')
          p.write_text(s.replace(target,'',1),encoding='utf-8')
          PY
          git diff --check
          ! grep -Fq 'transition:color 140ms ease,text-decoration-color 140ms ease;' src/styles/global.css
          /tmp/mark-status.sh 'perf/link-transition/edit' success 'Canonical generic anchor transition removed exactly once'
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Validate production pipeline stage by stage
        shell: bash
        run: |
          set -euo pipefail
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          export SOURCE_COMMIT="$GITHUB_SHA"
          /tmp/run-stage.sh 'perf/link-transition/prepare' npm run prepare:generated
          /tmp/run-stage.sh 'perf/link-transition/query-source' npm run validate:query-matrix
          /tmp/run-stage.sh 'perf/link-transition/hygiene' npm run validate:hygiene
          /tmp/run-stage.sh 'perf/link-transition/platform' node scripts/validate-platform-contract.mjs
          /tmp/run-stage.sh 'perf/link-transition/source-core' node scripts/validate-source.mjs
          /tmp/run-stage.sh 'perf/link-transition/critical-path-source' node scripts/validate-critical-path.mjs
          /tmp/run-stage.sh 'perf/link-transition/hero-geometry' node scripts/validate-critical-hero-geometry.mjs
          /tmp/run-stage.sh 'perf/link-transition/ctas' node scripts/validate-critical-ctas.mjs
          /tmp/run-stage.sh 'perf/link-transition/reputation' node scripts/test-reputation-observation.mjs
          /tmp/run-stage.sh 'perf/link-transition/subdomains' node scripts/validate-subdomain-redirects.mjs
          /tmp/run-stage.sh 'perf/link-transition/gh-pages-build' node scripts/build-github-pages-bridge.mjs --self-test
          /tmp/run-stage.sh 'perf/link-transition/gh-pages-verify' node scripts/verify-github-pages-bridge.mjs --self-test
          /tmp/run-stage.sh 'perf/link-transition/astro-build' npx astro build
          /tmp/run-stage.sh 'perf/link-transition/indexnow' npm run indexnow:prepare
          /tmp/run-stage.sh 'perf/link-transition/descriptors' npm run descriptors:finalize
          /tmp/run-stage.sh 'perf/link-transition/finalize-dist' node scripts/finalize-dist.mjs
          /tmp/run-stage.sh 'perf/link-transition/cloudflare-selftest' npm run validate:cloudflare
          /tmp/run-stage.sh 'perf/link-transition/dist' node scripts/validate-dist.mjs
          /tmp/run-stage.sh 'perf/link-transition/critical-path-dist' node scripts/validate-critical-path.mjs dist
          /tmp/run-stage.sh 'perf/link-transition/query-dist' node scripts/validate-query-matrix.mjs dist/query-matrix.jsonl
          /tmp/run-stage.sh 'perf/link-transition/current-context' npm run validate:current-context
          /tmp/run-stage.sh 'perf/link-transition/cloudflare-preflight' npm run preflight:cloudflare
      - name: Prove the tracked diff is exactly the intended final state
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff HEAD --name-only | sort)
          expected=(
            '.github/workflows/_temporary-clean-link-transition.yml'
            '.github/workflows/_temporary-disable-rum-configuration-rule.yml'
            'src/styles/global.css'
          )
          if [ "${#changed[@]}" -ne "${#expected[@]}" ]; then /tmp/mark-status.sh 'perf/link-transition/diff' failure "Unexpected tracked diff count=${#changed[@]}"; exit 1; fi
          for i in "${!expected[@]}"; do test "${changed[$i]}" = "${expected[$i]}" || { /tmp/mark-status.sh 'perf/link-transition/diff' failure 'Unexpected tracked path'; exit 1; }; done
          git diff --check
          /tmp/mark-status.sh 'perf/link-transition/diff' success 'Final tree differs only by CSS cleanup and temporary-workflow removals'
      - name: Commit the validated final clean tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/styles/global.css
          git commit -m 'perf: remove generic paint-bound link transition'
          if git push origin HEAD:main; then /tmp/mark-status.sh 'perf/link-transition/commit' success 'Validated final clean tree pushed to main'; else /tmp/mark-status.sh 'perf/link-transition/commit' failure 'Push to main failed because branch advanced'; exit 1; fi

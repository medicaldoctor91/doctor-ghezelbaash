name: Temporary live status re-evaluation
on:
  push:
    branches: [main]
    paths: ['.github/workflows/_tmp-live-status-reeval.yml']
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check --no-input requests==2.32.5
      - name: Live audit
        shell: bash
        run: |
          python - <<'PY'
          import requests,json,os
          s=requests.Session(); s.headers.update({'User-Agent':'GhezelbaashLiveReeval/1.0 (https://www.ghezelbaash.ir/)'})
          out={}
          # Wikidata person + preprint
          for q in ['Q140287622','Q141099455','Q141129555']:
            d=s.get(f'https://www.wikidata.org/wiki/Special:EntityData/{q}.json',timeout=60).json()['entities'][q]
            vals={}
            for p in ['P50','P3919','P800','P7347','P1433','P793','P31','P2671']:
              if p in d.get('claims',{}):
                a=[]
                for c in d['claims'][p]:
                  v=c.get('mainsnak',{}).get('datavalue',{}).get('value')
                  if isinstance(v,dict): v=v.get('id') or v.get('text') or v.get('time') or v
                  a.append({'value':v,'rank':c.get('rank'),'refs':len(c.get('references',[])),'quals':{qp:[(sn.get('datavalue',{}).get('value',{}).get('id') if isinstance(sn.get('datavalue',{}).get('value'),dict) else sn.get('datavalue',{}).get('value')) for sn in qs] for qp,qs in c.get('qualifiers',{}).items()}})
                vals[p]=a
            out[q]={'modified':d.get('modified'),'lastrevid':d.get('lastrevid'),'sitelinks':{k:v.get('title') for k,v in d.get('sitelinks',{}).items()},'claims':vals}
          # enwiki Botulinum toxin + talk latest
          API='https://en.wikipedia.org/w/api.php'
          def query(title,rvlimit=8):
            return s.get(API,params={'action':'query','format':'json','formatversion':2,'titles':title,'prop':'revisions','rvprop':'ids|timestamp|user|comment|content','rvslots':'main','rvlimit':rvlimit},timeout=60).json()['query']['pages'][0]
          p=query('Botulinum toxin',1); r=(p.get('revisions') or [{}])[0]; src=r.get('slots',{}).get('main',{}).get('content','')
          out['enwiki_botulinum']={'revid':r.get('revid'),'timestamp':r.get('timestamp'),'user':r.get('user'),'comment':r.get('comment'),'has_v_yes':'v=yes' in src,'has_explicit':'v=Botulinum toxin in aesthetic medicine' in src,'snippet':[ln for ln in src.splitlines() if 'sister project links' in ln.lower()]}
          p=query('Talk:Botulinum toxin',12); out['enwiki_botulinum_talk']=[{'revid':x.get('revid'),'timestamp':x.get('timestamp'),'user':x.get('user'),'comment':x.get('comment')} for x in p.get('revisions',[])]
          p=query('Talk:Treatment of bipolar disorder',12); out['enwiki_bipolar_talk']=[{'revid':x.get('revid'),'timestamp':x.get('timestamp'),'user':x.get('user'),'comment':x.get('comment')} for x in p.get('revisions',[])]
          p=query('Treatment of bipolar disorder',1); r=(p.get('revisions') or [{}])[0]; src=r.get('slots',{}).get('main',{}).get('content','')
          out['enwiki_bipolar_article']={'revid':r.get('revid'),'timestamp':r.get('timestamp'),'user':r.get('user'),'comment':r.get('comment'),'mentions_ghezelbash':'Ghezelbash' in src,'mentions_doi':'10.4103/2008-7802.182734' in src}
          # enwikiversity preprint + talk
          V='https://en.wikiversity.org/w/api.php'; PRE='WikiJournal Preprints/Individualized clinical assessment and outcome interpretation in aesthetic botulinum neurotoxin type A treatment: a focused review'; TALK='Talk:'+PRE
          for key,title in [('preprint',PRE),('preprint_talk',TALK),('resource','Botulinum toxin in aesthetic medicine')]:
            p=s.get(V,params={'action':'query','format':'json','formatversion':2,'titles':title,'prop':'info|pageprops|revisions','rvprop':'ids|timestamp|user|comment|content','rvslots':'main','rvlimit':8},timeout=60).json()['query']['pages'][0]
            out[key]={'pageid':p.get('pageid'),'missing':p.get('missing',False),'touched':p.get('touched'),'pageprops':p.get('pageprops'),'revisions':[{'revid':x.get('revid'),'timestamp':x.get('timestamp'),'user':x.get('user'),'comment':x.get('comment')} for x in p.get('revisions',[])]}
          # scientific registries
          oa=s.get('https://api.openalex.org/authors/A5064828898',timeout=60).json(); out['openalex']={'orcid':oa.get('orcid'),'display_name':oa.get('display_name'),'works_count':oa.get('works_count'),'cited_by_count':oa.get('cited_by_count'),'h_index':oa.get('summary_stats',{}).get('h_index'),'updated_date':oa.get('updated_date')}
          ss=s.get('https://api.semanticscholar.org/graph/v1/author/3786699',params={'fields':'name,externalIds,paperCount,citationCount,hIndex'},timeout=60); out['semantic_scholar']={'status':ss.status_code,'data':ss.json() if ss.status_code==200 else ss.text[:500]}
          for doi in ['10.4103/2008-7802.182734','10.3390/healthcare9091169']:
            m=s.get('https://api.crossref.org/works/'+doi,timeout=60).json()['message']
            out['crossref_'+doi]={'indexed':m.get('indexed',{}).get('date-time'),'deposited':m.get('deposited',{}).get('date-time'),'ghezelbash':[{'given':a.get('given'),'family':a.get('family'),'ORCID':a.get('ORCID')} for a in m.get('author',[]) if (a.get('family') or '').lower()=='ghezelbash']}
          os.makedirs('wikimedia',exist_ok=True)
          open('wikimedia/_tmp-live-status-reeval.json','w',encoding='utf8').write(json.dumps(out,ensure_ascii=False,indent=2))
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - name: Commit audit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add wikimedia/_tmp-live-status-reeval.json
          git commit -m 'Record temporary live status re-evaluation'
          git push

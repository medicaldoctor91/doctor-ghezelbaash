name: Finalize unchanged frozen v5 with owner-authorized HF outage exception
on:
  push:
    branches: [codex/coordinated-v5-launch-20261105]
    paths: [.github/release-inputs/outage-finalize-v5-request.json]
permissions:
  contents: read
  actions: read
concurrency:
  group: doctor-ghezelbaash-publication
  cancel-in-progress: false
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GITHUB_TOKEN: ${{ github.token }}
      ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN || secrets.ZENODO_ACCESS_TOKEN || secrets.ZENODO_API_TOKEN || secrets.ZENODO_API_KEY || secrets.ZENODO_PAT }}
      CONTROL_TOOL_COMMIT: ${{ github.sha }}
      CONTROL_ROOT: ${{ github.workspace }}/control
      FROZEN_SOURCE_ROOT: ${{ github.workspace }}/frozen-source
      GIT_LFS_SKIP_SMUDGE: '1'
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.sha }}', path: control, persist-credentials: false}
      - uses: actions/checkout@v4
        with: {ref: 'refs/tags/release-reviewed-2026-11-05-v5', path: frozen-source, fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version-file: frozen-source/.nvmrc}
      - name: Install verification dependencies without building
        run: python -m pip install requests 'pyarrow==22.0.0' 'rdflib>=7,<8' 'pyshacl>=0.30,<1' 'mlcroissant==1.1.1' 'PyLD==3.3.0' PyYAML
      - uses: actions/download-artifact@v4
        with: {name: frozen-coordinated-candidate, run-id: '42063635541', github-token: '${{ github.token }}', path: /tmp/frozen-artifact}
      - name: Validate owner exception, source, frozen bytes and current distributions
        working-directory: frozen-source
        run: python ../control/.github/scripts/finalize_frozen_v5_exception.py prepare
      - name: Preserve immutable publication intent before POST
        uses: actions/upload-artifact@v4
        with:
          name: outage-finalization-intent
          path: /tmp/outage-finalize-v5/*.json
          if-no-files-found: error
      - name: Publish exactly once or recover published record
        working-directory: frozen-source
        run: python ../control/.github/scripts/finalize_frozen_v5_exception.py publish
      - name: Verify public graph, all archive bytes and historical immutability
        working-directory: frozen-source
        run: python ../control/.github/scripts/finalize_frozen_v5_exception.py verify
      - name: Preserve actual outcome and verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: outage-finalization-evidence
          path: |
            /tmp/outage-finalize-v5/*.json
            /tmp/coordinated-release/publication-report.json
            /tmp/coordinated-release/zenodo-publish-attempt.json
          if-no-files-found: warn

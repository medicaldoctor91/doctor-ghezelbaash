name: Apply final entity spec 2026 (temporary)

on:
  push:
    branches:
      - fix/final-entity-machine-standards-2026
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: final-spec-2026-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migrate-validate-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/final-entity-machine-standards-2026
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14.6"
      - name: Provision validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg
          npm ci
          npx playwright install --with-deps chromium
      - name: Apply canonical source migration
        run: node scripts/apply-final-spec-2026.mjs
      - name: Isolate social profiles from Google HTML projection
        run: node scripts/adjust-google-projection-2026.mjs
      - name: Align mutable current-source revision metadata
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          const TODAY = '2026-09-11';
          const releasePath = 'src/data/release.json';
          const release = JSON.parse(await fs.readFile(releasePath, 'utf8'));
          if (release.release !== '1.2.5' || release.dateModified !== '2026-08-31' || release.dataset?.zenodo?.versionDoi !== '10.5281/zenodo.22216583') {
            throw new Error('Frozen release identity changed unexpectedly');
          }
          release.datasetRevisionDate = TODAY;
          release.currentSource ??= {};
          release.currentSource.dateModified = TODAY;
          await fs.writeFile(releasePath, `${JSON.stringify(release, null, 2)}\n`);

          const codeMetaPath = 'codemeta.json';
          const codeMeta = JSON.parse(await fs.readFile(codeMetaPath, 'utf8'));
          codeMeta['@context'] = 'https://w3id.org/codemeta/3.1';
          codeMeta.dateModified = TODAY;
          await fs.writeFile(codeMetaPath, `${JSON.stringify(codeMeta, null, 2)}\n`);
          NODE
      - name: Rebuild governed media metadata
        run: npm run media:enrich
      - name: Recalibrate changed visible document
        run: |
          npm run render:calibration:update
          npm run test:render-navigation -- .generated/calibration-candidate
      - name: Remove migration transport and create local product commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/apply-final-spec-2026.mjs scripts/adjust-google-projection-2026.mjs .github/workflows/apply-final-spec-2026.yml
          test ! -e scripts/apply-final-spec-2026.mjs
          test ! -e scripts/adjust-google-projection-2026.mjs
          test ! -e .github/workflows/apply-final-spec-2026.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --name-only | grep -E '^(dist/|\.generated/)'; then
            echo "Generated output staged" >&2
            exit 1
          fi
          git diff --cached --check
          git commit -m "fix: finalize entity semantics and evidence contracts"
          SOURCE_COMMIT="$(git rev-parse HEAD)"
          echo "SOURCE_COMMIT=$SOURCE_COMMIT" >> "$GITHUB_ENV"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Run focused contracts against local product commit
        run: |
          npm run security:dependencies
          npm run validate:final-entity-contract
          npm run validate:physician-projection
          npm run validate:semantic-html
          npm run validate:evidence
          npm run validate:media
      - name: Run complete canonical release validation against local product commit
        run: npm run release
      - name: Verify attested commit and generated-output discipline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const att = JSON.parse(fs.readFileSync('.release/runtime/release-attestation.json', 'utf8'));
          if (att.sourceCommit !== process.env.SOURCE_COMMIT) {
            throw new Error(`Attestation sourceCommit mismatch: ${att.sourceCommit} != ${process.env.SOURCE_COMMIT}`);
          }
          if (att.validation !== 'PASS') throw new Error('Release attestation is not PASS');
          console.log(JSON.stringify({ sourceCommit: att.sourceCommit, validation: att.validation }, null, 2));
          NODE
          if git status --porcelain -- dist .generated | grep -q .; then
            echo "Tracked dist/.generated changes are forbidden" >&2
            git status --short -- dist .generated >&2
            exit 1
          fi
      - name: Publish validated product commit to feature branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          git push origin HEAD:fix/final-entity-machine-standards-2026

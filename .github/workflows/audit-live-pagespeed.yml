name: Audit live PageSpeed after deployment

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/audit-live-pagespeed.yml

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wait for Cloudflare production deployment
        run: sleep 150

      - name: Run PageSpeed Insights API
        shell: bash
        run: |
          python <<'PY'
          import json, time, urllib.parse, urllib.request
          from pathlib import Path

          target = 'https://www.ghezelbaash.ir/'
          out = {'target': target, 'measuredAt': time.strftime('%Y-%m-%dT%H:%M:%SZ', time.gmtime()), 'strategies': {}}
          for strategy in ('mobile', 'desktop'):
              query = urllib.parse.urlencode([
                  ('url', target),
                  ('strategy', strategy),
                  ('category', 'performance'),
                  ('category', 'accessibility'),
                  ('category', 'best-practices'),
                  ('category', 'seo'),
              ])
              endpoint = 'https://www.googleapis.com/pagespeedonline/v5/runPagespeed?' + query
              last_error = None
              data = None
              for attempt in range(3):
                  try:
                      with urllib.request.urlopen(endpoint, timeout=180) as response:
                          data = json.load(response)
                      break
                  except Exception as exc:
                      last_error = repr(exc)
                      time.sleep(30 * (attempt + 1))
              if data is None:
                  out['strategies'][strategy] = {'error': last_error}
                  continue
              lr = data.get('lighthouseResult', {})
              cats = lr.get('categories', {})
              audits = lr.get('audits', {})
              summary = {
                  'scores': {k: round((v.get('score') or 0) * 100) for k, v in cats.items()},
                  'metrics': {},
                  'failedAudits': [],
              }
              for key in ('first-contentful-paint','largest-contentful-paint','speed-index','total-blocking-time','cumulative-layout-shift','interactive','server-response-time'):
                  audit = audits.get(key, {})
                  summary['metrics'][key] = {
                      'displayValue': audit.get('displayValue'),
                      'numericValue': audit.get('numericValue'),
                      'score': audit.get('score'),
                  }
              for key, audit in audits.items():
                  score = audit.get('score')
                  if isinstance(score, (int, float)) and score < 1 and audit.get('scoreDisplayMode') not in ('notApplicable','manual','informative'):
                      summary['failedAudits'].append({
                          'id': key,
                          'title': audit.get('title'),
                          'score': score,
                          'displayValue': audit.get('displayValue'),
                          'description': audit.get('description'),
                      })
              summary['failedAudits'].sort(key=lambda x: (x['score'] if x['score'] is not None else 2, x['id']))
              out['strategies'][strategy] = summary

          Path('tmp').mkdir(exist_ok=True)
          Path('tmp/psi-live-latest.json').write_text(json.dumps(out, ensure_ascii=False, indent=2), encoding='utf-8')
          PY

      - name: Remove one-shot workflow and commit audit
        run: |
          rm -f .github/workflows/audit-live-pagespeed.yml
          git config user.name 'OpenAI Project Automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Record current live PageSpeed audit'
          git push origin HEAD:main

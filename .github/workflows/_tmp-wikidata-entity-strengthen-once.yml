name: Temporary one-shot Wikidata entity strengthening

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_tmp-wikidata-entity-strengthen-once.yml'

permissions:
  contents: read

concurrency:
  group: tmp-wikidata-entity-strengthen-once
  cancel-in-progress: false

jobs:
  strengthen:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      WIKIMEDIA_USERNAME: ${{ secrets.WIKIVERSITY_USERNAME }}
      WIKIMEDIA_BOT_PASSWORD: ${{ secrets.WIKIVERSITY_BOT_PASSWORD }}
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install dependency
        run: python -m pip install --disable-pip-version-check --no-input requests==2.32.5
      - name: Validate credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$WIKIMEDIA_USERNAME"
          test -n "$WIKIMEDIA_BOT_PASSWORD"
      - name: Strengthen existing Wikidata graph only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, requests

          API='https://www.wikidata.org/w/api.php'
          SPARQL='https://query.wikidata.org/sparql'
          USER=os.environ['WIKIMEDIA_USERNAME']
          PASS=os.environ['WIKIMEDIA_BOT_PASSWORD']
          UA='GhezelbaashEntityStrengthener/1.0 (https://www.ghezelbaash.ir/)'
          PERSON='Q140287622'
          WORK2021='Q140298431'
          WORK2016='Q36942316'
          EMAIL='mailto:medicaldoctor91@gmail.com'
          TODAY='+2026-08-17T00:00:00Z'

          s=requests.Session(); s.headers.update({'User-Agent':UA})
          def api_get(**p):
              p.update(format='json',formatversion=2)
              r=s.get(API,params=p,timeout=60); r.raise_for_status(); d=r.json()
              if 'error' in d: raise RuntimeError(d['error'])
              return d
          def api_post(p):
              p=dict(p); p.update(format='json',formatversion=2)
              r=s.post(API,data=p,timeout=90); r.raise_for_status(); d=r.json()
              if 'error' in d: raise RuntimeError(d['error'])
              return d
          lt=api_get(action='query',meta='tokens',type='login')['query']['tokens']['logintoken']
          login=api_post({'action':'login','lgname':USER,'lgpassword':PASS,'lgtoken':lt})
          if login.get('login',{}).get('result')!='Success': raise RuntimeError(login)
          csrf=api_get(action='query',meta='tokens',type='csrf')['query']['tokens']['csrftoken']
          ui=api_get(action='query',meta='userinfo',uiprop='blockinfo')['query']['userinfo']
          if ui.get('blockedby'):
              raise RuntimeError({'blocked':True,'blockedby':ui.get('blockedby'),'reason':ui.get('blockreason')})

          def entity(qid):
              d=api_get(action='wbgetentities',ids=qid,props='claims')['entities'][qid]
              if d.get('missing') is not None: raise RuntimeError('missing '+qid)
              return d
          def item_values(e,pid):
              out=[]
              for c in e.get('claims',{}).get(pid,[]):
                  try: out.append(c['mainsnak']['datavalue']['value']['id'])
                  except Exception: pass
              return out
          def scalar_values(e,pid):
              out=[]
              for c in e.get('claims',{}).get(pid,[]):
                  try: out.append(c['mainsnak']['datavalue']['value'])
                  except Exception: pass
              return out
          def item_value(qid):
              return {'entity-type':'item','numeric-id':int(qid[1:]),'id':qid}
          def snak_item(pid,qid):
              return {'snaktype':'value','property':pid,'datavalue':{'value':item_value(qid),'type':'wikibase-entityid'},'datatype':'wikibase-item'}
          def snak_url(pid,url):
              return {'snaktype':'value','property':pid,'datavalue':{'value':url,'type':'string'},'datatype':'url'}
          def snak_time(pid,timeval):
              return {'snaktype':'value','property':pid,'datavalue':{'value':{'time':timeval,'timezone':0,'before':0,'after':0,'precision':11,'calendarmodel':'http://www.wikidata.org/entity/Q1985727'},'type':'time'},'datatype':'time'}
          def set_ref(claim_id, source_url, stated_in=None):
              snaks={'P854':[snak_url('P854',source_url)],'P813':[snak_time('P813',TODAY)]}
              if stated_in: snaks['P248']=[snak_item('P248',stated_in)]
              api_post({'action':'wbsetreference','statement':claim_id,'snaks':json.dumps(snaks,separators=(',',':')),'token':csrf})
          def create_item_claim(qid,pid,target,summary,source_url,stated_in=None):
              e=entity(qid)
              if target in item_values(e,pid): return {'status':'exists','entity':qid,'property':pid,'target':target}
              d=api_post({'action':'wbcreateclaim','entity':qid,'property':pid,'snaktype':'value','value':json.dumps(item_value(target),separators=(',',':')),'summary':summary,'token':csrf})
              cid=d['claim']['id']; set_ref(cid,source_url,stated_in)
              return {'status':'created','entity':qid,'property':pid,'target':target,'claim':cid}
          def create_url_claim(qid,pid,url,summary,source_url,stated_in=None):
              e=entity(qid)
              if url in scalar_values(e,pid): return {'status':'exists','entity':qid,'property':pid,'target':url}
              d=api_post({'action':'wbcreateclaim','entity':qid,'property':pid,'snaktype':'value','value':json.dumps(url),'summary':summary,'token':csrf})
              cid=d['claim']['id']; set_ref(cid,source_url,stated_in)
              return {'status':'created','entity':qid,'property':pid,'target':url,'claim':cid}
          def resolve_doi(doi):
              norm=doi.upper()
              q='SELECT ?item WHERE { ?item wdt:P356 '+json.dumps(norm)+' . } LIMIT 3'
              r=s.get(SPARQL,params={'query':q,'format':'json'},headers={'Accept':'application/sparql-results+json'},timeout=90)
              r.raise_for_status(); rows=r.json()['results']['bindings']
              ids=[x['item']['value'].rsplit('/',1)[-1] for x in rows]
              exact=[]
              for qid in ids:
                  vals=[str(v).upper() for v in scalar_values(entity(qid),'P356')]
                  if norm in vals: exact.append(qid)
              exact=sorted(set(exact))
              if len(exact)>1: raise RuntimeError({'duplicate_doi_items':doi,'qids':exact})
              return exact[0] if exact else None
          def verify_citation(url,needle):
              r=s.get(url,timeout=90); r.raise_for_status()
              return needle.lower() in r.text.lower()

          results=[]
          # P968: public email explicitly printed for M.S.G. in the 2021 PMC article.
          results.append(create_url_claim(PERSON,'P968',EMAIL,'Add publicly documented email address','https://pmc.ncbi.nlm.nih.gov/articles/PMC8469763/',WORK2021))

          # P921: conservative, title/abstract-level main subjects only.
          for subj in ['Q42844','Q909609','Q18663','Q654426']:
              results.append(create_item_claim(WORK2021,'P921',subj,'Add precise main subject from article title and abstract','https://pmc.ncbi.nlm.nih.gov/articles/PMC8469763/',WORK2021))
          for subj in ['Q4915474','Q191756']:
              results.append(create_item_claim(WORK2016,'P921',subj,'Add precise main subject from article title and abstract','https://pmc.ncbi.nlm.nih.gov/articles/PMC4882968/',WORK2016))

          # P2860: only verified citations, only if the citing DOI already has exactly one Wikidata item.
          citation_specs=[
              ('10.3390/MD23020084',WORK2016,'https://pmc.ncbi.nlm.nih.gov/articles/PMC11857698/','10.4103/2008-7802.182734'),
              ('10.1111/BJHP.70024',WORK2021,'https://bpspsychub.onlinelibrary.wiley.com/doi/full/10.1111/bjhp.70024','10.3390/healthcare9091169'),
          ]
          for doi,target,source,needle in citation_specs:
              qid=resolve_doi(doi)
              if not qid:
                  results.append({'status':'skipped_no_existing_wikidata_item','doi':doi,'target':target})
                  continue
              if not verify_citation(source,needle):
                  raise RuntimeError({'citation_not_verified_in_source':doi,'source':source,'needle':needle})
              results.append(create_item_claim(qid,'P2860',target,'Add verified cites-work edge to existing scholarly item',source,qid))

          # Read-back verification and invariants: no creation endpoint is used anywhere in this job.
          person=entity(PERSON); w21=entity(WORK2021); w16=entity(WORK2016)
          checks={
              'email_present':EMAIL in scalar_values(person,'P968'),
              '2021_subjects_present':all(q in item_values(w21,'P921') for q in ['Q42844','Q909609','Q18663','Q654426']),
              '2016_subjects_present':all(q in item_values(w16,'P921') for q in ['Q4915474','Q191756']),
          }
          report={'ok':all(checks.values()),'authenticated_as':ui.get('name'),'checks':checks,'results':results}
          print(json.dumps(report,ensure_ascii=False,indent=2,sort_keys=True))
          if not report['ok']: raise SystemExit(1)
          PY

name: v1.2.2 query collision hardening
on:
  push:
    branches: [release/v1.2.2-candidate]
    paths: [.github/workflows/v122-query-collision-patch.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0
      - name: Make query dedup collision-safe
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const f='scripts/generate-v122-overlays.mjs';
          let s=fs.readFileSync(f,'utf8');
          const old=`const dedup=[...new Map(rows.map(r=>[\`${'${r.language}'}|${'${r.query}'}\`,r])).values()];\nconst missingEvidence=dedup.filter(r=>!r.stable_evidence_refs?.length);`;
          const replacement=`const mergedRows=new Map();\nfor(const row of rows){\n  const key=\`${'${row.language}'}|${'${row.query}'}\`;\n  const serviceIds=[...new Set([...(arr(row.service_ids)),...(row.service_id?[row.service_id]:[])])];\n  const serviceFamilies=[...new Set([...(arr(row.service_families)),...(row.service_family?[row.service_family]:[])])];\n  const normalized={...row,service_ids:serviceIds,service_families:serviceFamilies};\n  delete normalized.service_id;delete normalized.service_family;\n  const prior=mergedRows.get(key);\n  if(!prior){mergedRows.set(key,normalized);continue;}\n  const preferIntent=prior.row_kind==='intent_alias'?prior:normalized.row_kind==='intent_alias'?normalized:prior;\n  const other=preferIntent===prior?normalized:prior;\n  mergedRows.set(key,{...preferIntent,\n    service_ids:[...new Set([...arr(preferIntent.service_ids),...arr(other.service_ids)])],\n    service_families:[...new Set([...arr(preferIntent.service_families),...arr(other.service_families)])],\n    stable_evidence_refs:[...new Set([...arr(preferIntent.stable_evidence_refs),...arr(other.stable_evidence_refs)])],\n    volatile_signal_refs:[...new Set([...arr(preferIntent.volatile_signal_refs),...arr(other.volatile_signal_refs)])]\n  });\n}\nconst dedup=[...mergedRows.values()];\nconst missingEvidence=dedup.filter(r=>!r.stable_evidence_refs?.length);`;
          if(!s.includes(old))throw new Error('Expected simple dedup block not found');
          s=s.replace(old,replacement);
          s=s.replace("const uncoveredServices=servicesWithAliases.filter(s=>!dedup.some(r=>r.row_kind==='service_alias'&&r.service_id===s));","const uncoveredServices=servicesWithAliases.filter(s=>!dedup.some(r=>arr(r.service_ids).includes(s)));");
          s=s.replace("servicesWithAliasCoverage:new Set(dedup.filter(r=>r.row_kind==='service_alias').map(r=>r.service_id)).size,","servicesWithAliasCoverage:new Set(dedup.flatMap(r=>arr(r.service_ids))).size,");
          fs.writeFileSync(f,s);
          NODE
          node --check scripts/generate-v122-overlays.mjs
          git config user.name ghezelbaash-release-bot
          git config user.email actions@users.noreply.github.com
          git add scripts/generate-v122-overlays.mjs
          git diff --cached --quiet && exit 0
          git commit -m 'Make Query Matrix collisions preserve all service targets'
          git push origin HEAD:release/v1.2.2-candidate

name: Canonicalize Turtle serialization

on:
  push:
    branches: [repair-clean-graph-2026-07-30]
    paths: ['.github/workflows/canonicalize-turtle.yml']

permissions:
  contents: write

jobs:
  canonicalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair-clean-graph-2026-07-30
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --quiet rdflib
      - name: Write canonical datatype-safe Turtle subset
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          from rdflib import Graph
          from rdflib.compare import to_canonical_graph

          source = Path('public/graph.jsonld').read_text(encoding='utf-8')
          graph = Graph().parse(data=source, format='json-ld')
          canonical = to_canonical_graph(graph)
          nt = canonical.serialize(format='nt')
          body = '\n'.join(sorted(line for line in nt.splitlines() if line.strip())) + '\n'
          reparsed = Graph().parse(data=body, format='turtle')
          if len(reparsed) != len(graph):
              raise SystemExit(f'canonical Turtle count mismatch: {len(reparsed)} != {len(graph)}')
          header = (
              '# Canonical N-Triples serialization; valid RDF 1.1 Turtle subset\n'
              '# Derived losslessly from https://www.ghezelbaash.ir/graph.jsonld\n'
              f'# Source SHA-256: {hashlib.sha256(source.encode()).hexdigest()}\n'
              f'# RDF triples: {len(graph)}\n'
              f'# Canonical sorted N-Triples SHA-256: {hashlib.sha256(body.encode()).hexdigest()}\n\n'
          )
          Path('public/graph.ttl').write_text(header + body, encoding='utf-8')
          PY
          rm .github/workflows/canonicalize-turtle.yml
      - name: Commit canonical RDF serialization
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Canonicalize Turtle serialization with explicit datatypes'
          git push origin HEAD:repair-clean-graph-2026-07-30

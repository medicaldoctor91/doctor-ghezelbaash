name: Finalize complete professional Kaggle documentation
on:
  push:
    branches: [maintenance/kaggle-documentation-20261012]
    paths: [.github/scripts/kaggle_documentation_finalize.py, .github/scripts/platform_bundle.py, .github/workflows/kaggle-documentation-finalize.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN || secrets.KAGGLE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check 'huggingface_hub>=0.34,<1' 'pyarrow>=18,<23' 'kaggle>=2.2,<3' 'rdflib>=7,<8' 'pyshacl>=0.30,<1'
      - name: Publish and validate complete professional documentation
        run: python .github/scripts/kaggle_documentation_finalize.py

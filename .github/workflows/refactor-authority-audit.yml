name: Refactor authority audit

on:
  push:
    branches:
      - refactor/single-source-truth-no-dist-drift

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Report direct semantic release consumers
        shell: bash
        run: |
          set -o pipefail
          grep -R -n -E 'release\.(primaryEntity|clinic|reviewedBy|schemaVersion|medicalReviewedAt)|rawRelease\.(primaryEntity|clinic|reviewedBy|schemaVersion|medicalReviewedAt)' src scripts --exclude='release.json' || true
      - name: Report direct document-head semantic consumers
        shell: bash
        run: |
          grep -R -n -E 'documentHead\.(author|applicationName)|openGraph\.siteName|og\.siteName' src scripts || true

name: Refactor authority audit

on:
  push:
    branches:
      - refactor/single-source-truth-no-dist-drift

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Apply deterministic authority codemod
        run: node scripts/refactor-authority-codemod.mjs
      - name: Commit codemod result if needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Authority codemod already applied"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add scripts/validate-google-structured-data.mjs
            git commit -m "refactor(authority): align validators with graph ownership"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Report direct semantic release consumers
        shell: bash
        run: |
          set -o pipefail
          grep -R -n -E 'release\.(primaryEntity|clinic|reviewedBy|schemaVersion|medicalReviewedAt)|rawRelease\.(primaryEntity|clinic|reviewedBy|schemaVersion|medicalReviewedAt)' src scripts --exclude='release.json' || true
      - name: Report direct raw release loaders
        shell: bash
        run: |
          grep -R -n -E '(import .*release\.json|readFile\([^\n]*release\.json|readJson\([^\n]*release\.json|src/data/release\.json)' src scripts || true
      - name: Report direct document-head semantic consumers
        shell: bash
        run: |
          grep -R -n -E 'documentHead\.(author|applicationName)|openGraph\.siteName|og\.siteName' src scripts || true

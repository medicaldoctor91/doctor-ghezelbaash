name: v1.2.2 attestation non-circularity fix
on:
  push:
    branches: [release/v1.2.2-candidate]
    paths: [.github/workflows/v122-attestation-cycle-fix.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0
      - name: Keep release attestation outside current-manifest digest closure
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const f='scripts/finalize-v122-serving.mjs';let s=fs.readFileSync(f,'utf8');
          const old="excluded:['artifact-manifest.json','_headers','live-serving-attestation.json'],note:'Current manifest excludes itself, deployment headers and terminal live-serving attestation, preventing circular integrity dependencies.'";
          const neu="excluded:['artifact-manifest.json','_headers','live-serving-attestation.json','release-attestation.json'],note:'Current manifest excludes itself, deployment headers, terminal live-serving attestation and frozen release attestation, preventing circular integrity dependencies between current-serving and release-snapshot domains.'";
          if(!s.includes(old))throw Error('Manifest exclusion anchor missing');s=s.replace(old,neu);
          s=s.replace("if(['artifact-manifest.json','_headers','live-serving-attestation.json'].includes(f.rel))continue;","if(['artifact-manifest.json','_headers','live-serving-attestation.json','release-attestation.json'].includes(f.rel))continue;");
          if(!s.includes("'release-attestation.json'].includes(f.rel)"))throw Error('Release attestation exclusion failed');
          fs.writeFileSync(f,s);
          NODE
          node --check scripts/finalize-v122-serving.mjs
          git config user.name ghezelbaash-release-bot
          git config user.email actions@users.noreply.github.com
          git add scripts/finalize-v122-serving.mjs
          git commit -m 'Keep frozen release attestation outside serving manifest closure'
          git push origin HEAD:release/v1.2.2-candidate

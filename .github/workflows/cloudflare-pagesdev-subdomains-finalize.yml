name: Verify pages.dev canonicalization

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]

permissions:
  contents: read

jobs:
  verify:
    if: github.event.pull_request.head.ref == 'cloudflare-pagesdev-subdomains-finalize-20260809'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 884d1d90bd1fb6ecca14992c6c60d677
      LIST_NAME: ghezelbaash_pages_dev_to_canonical
      PROJECT: doctor-ghezelbaash
      CANONICAL_HOST: www.ghezelbaash.ir
    steps:
      - name: Read back Bulk Redirect state and verify stable/current Pages hosts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, time, urllib.error, urllib.request
          A=os.environ['CLOUDFLARE_ACCOUNT_ID']; T=os.environ['CLOUDFLARE_API_TOKEN']; L=os.environ['LIST_NAME']; P=os.environ['PROJECT']; H=os.environ['CANONICAL_HOST']; B='https://api.cloudflare.com/client/v4'
          HD={'Authorization':f'Bearer {T}','Accept':'application/json','Content-Type':'application/json','User-Agent':'ghezelbaash-pagesdev-readback/1.0'}
          def call(path):
            req=urllib.request.Request(B+path,headers=HD)
            try:
              with urllib.request.urlopen(req,timeout=40) as r:
                raw=r.read().decode('utf-8','replace'); return r.status,json.loads(raw) if raw else {}
            except urllib.error.HTTPError as e:
              raw=e.read().decode('utf-8','replace')
              try:x=json.loads(raw) if raw else {}
              except Exception:x={'raw':raw[:1200]}
              return e.code,x

          s,p=call(f'/accounts/{A}/rules/lists?per_page=100')
          if s!=200 or p.get('success') is not True: raise SystemExit(f'List enumeration failed HTTP {s}: {p}')
          row=next((x for x in (p.get('result') or []) if x.get('name')==L),None)
          if not row: raise SystemExit(f'Bulk Redirect list {L} missing')
          lid=row['id']

          s,project=call(f'/accounts/{A}/pages/projects/{P}')
          if s!=200 or project.get('success') is not True: raise SystemExit(f'Project lookup failed HTTP {s}: {project}')
          pr=project.get('result') or {}
          latest=((pr.get('canonical_deployment') or {}).get('url') or (pr.get('latest_deployment') or {}).get('url'))
          if not latest: raise SystemExit('Current Pages deployment URL missing')
          latest=latest.rstrip('/')+'/'

          s,p=call(f'/accounts/{A}/rules/lists/{lid}/items?per_page=100')
          if s!=200 or p.get('success') is not True: raise SystemExit(f'List read-back failed HTTP {s}: {p}')
          redirects=[x.get('redirect') or {} for x in (p.get('result') or [])]
          stable=f'https://{P}.pages.dev/'
          base=next((r for r in redirects if r.get('source_url')==stable),None)
          current=next((r for r in redirects if r.get('source_url')==latest),None)
          print('CURRENT_DEPLOYMENT_URL',latest)
          print('PAGES_REDIRECT_LIST',json.dumps(redirects,ensure_ascii=False,sort_keys=True))
          if not base or base.get('status_code')!=301 or base.get('include_subdomains') is not True or base.get('subpath_matching') is not True or base.get('preserve_query_string') is not True or base.get('preserve_path_suffix') is not True:
            raise SystemExit('Stable Pages redirect is not in the required canonical state')
          if not current or current.get('status_code')!=301 or current.get('subpath_matching') is not True or current.get('preserve_query_string') is not True or current.get('preserve_path_suffix') is not True:
            raise SystemExit('Current unique deployment redirect is not in the required canonical state')

          class NoRedirect(urllib.request.HTTPRedirectHandler):
            def redirect_request(self, req, fp, code, msg, headers, newurl): return None
          opener=urllib.request.build_opener(NoRedirect)
          expected=f'https://{H}/final-canonical-test?q=1'
          for src in (stable,latest):
            url=src+'final-canonical-test?q=1'
            good=False
            for i in range(12):
              req=urllib.request.Request(url,headers={'User-Agent':'ghezelbaash-pagesdev-live-readback/1.0'})
              try:
                with opener.open(req,timeout=30) as r: code=r.status; loc=r.headers.get('Location')
              except urllib.error.HTTPError as e: code=e.code; loc=e.headers.get('Location')
              print('LIVE_REDIRECT',i+1,code,url,'location=',loc)
              if code==301 and loc==expected:
                good=True
                break
              time.sleep(2)
            if not good: raise SystemExit(f'Live canonical redirect failed for {url}')
          PY

name: Finalize pages.dev and deployment-subdomain canonicalization

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]

permissions:
  contents: read

jobs:
  canonicalize:
    if: github.event.pull_request.head.ref == 'cloudflare-pagesdev-subdomains-finalize-20260809'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 884d1d90bd1fb6ecca14992c6c60d677
      LIST_NAME: ghezelbaash_pages_dev_to_canonical
      PROJECT: doctor-ghezelbaash
      CANONICAL_HOST: www.ghezelbaash.ir
    steps:
      - name: Canonicalize project pages.dev and current production deployment hostname
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, time, urllib.error, urllib.request
          A=os.environ['CLOUDFLARE_ACCOUNT_ID']; T=os.environ['CLOUDFLARE_API_TOKEN']; L=os.environ['LIST_NAME']; P=os.environ['PROJECT']; H=os.environ['CANONICAL_HOST']; B='https://api.cloudflare.com/client/v4'
          HD={'Authorization':f'Bearer {T}','Accept':'application/json','Content-Type':'application/json','User-Agent':'ghezelbaash-pagesdev-canonicalizer/1.1'}
          def call(m,p,b=None):
            req=urllib.request.Request(B+p,data=None if b is None else json.dumps(b,separators=(',',':')).encode(),method=m,headers=HD)
            try:
              with urllib.request.urlopen(req,timeout=40) as r:
                raw=r.read().decode('utf-8','replace'); return r.status,json.loads(raw) if raw else {}
            except urllib.error.HTTPError as e:
              raw=e.read().decode('utf-8','replace')
              try:x=json.loads(raw) if raw else {}
              except Exception:x={'raw':raw[:1200]}
              return e.code,x
          def wait_op(payload):
            op=(payload.get('result') or {}).get('operation_id')
            if not op: return
            for i in range(30):
              x,y=call('GET',f'/accounts/{A}/rules/lists/bulk_operations/{op}')
              state=(y.get('result') or {}).get('status') if x==200 and y.get('success') is True else None
              print('BULK_OPERATION',i+1,state)
              if state=='completed': return
              if state=='failed': raise SystemExit(f'Bulk list operation failed: {y}')
              time.sleep(2)
            raise SystemExit('Bulk list update did not complete in time')

          s,p=call('GET',f'/accounts/{A}/rules/lists?per_page=100')
          if s!=200 or p.get('success') is not True: raise SystemExit(f'List enumeration failed HTTP {s}: {p}')
          row=next((x for x in (p.get('result') or []) if x.get('name')==L),None)
          if not row: raise SystemExit(f'Bulk Redirect list {L} not found')
          lid=row['id']

          # Keep the stable project hostname as the first canonicalization rule.
          base_item={'redirect':{'source_url':f'https://{P}.pages.dev/','target_url':f'https://{H}/','status_code':301,'include_subdomains':True,'subpath_matching':True,'preserve_query_string':True,'preserve_path_suffix':True},'comment':'Canonicalize the stable Pages project hostname to the physician canonical www host'}
          s,p=call('PUT',f'/accounts/{A}/rules/lists/{lid}/items',[base_item])
          if s not in (200,201) or p.get('success') is not True: raise SystemExit(f'Base list replacement failed HTTP {s}: {p}')
          wait_op(p)

          # Cloudflare production deployments also receive unique <short-id>.<project>.pages.dev URLs.
          # Explicitly add the current one because those hostnames can outlive a deployment and should
          # consolidate instead of exposing a second crawlable copy.
          s,project=call('GET',f'/accounts/{A}/pages/projects/{P}')
          if s!=200 or project.get('success') is not True: raise SystemExit(f'Project lookup failed HTTP {s}: {project}')
          pr=project.get('result') or {}
          latest=((pr.get('canonical_deployment') or {}).get('url') or (pr.get('latest_deployment') or {}).get('url'))
          if not latest: raise SystemExit('Current Pages deployment URL was not returned by Cloudflare')
          latest=latest.rstrip('/')+'/'
          explicit={'redirect':{'source_url':latest,'target_url':f'https://{H}/','status_code':301,'include_subdomains':False,'subpath_matching':True,'preserve_query_string':True,'preserve_path_suffix':True},'comment':'Canonicalize the current unique Pages production deployment hostname to the physician canonical www host'}
          s,p=call('POST',f'/accounts/{A}/rules/lists/{lid}/items',[explicit])
          if s not in (200,201) or p.get('success') is not True:
            # Duplicate exact source is fine; any other failure is not.
            errs=p.get('errors') or []
            if not any('duplicate' in str(e).lower() or 'already' in str(e).lower() for e in errs):
              raise SystemExit(f'Explicit deployment redirect add failed HTTP {s}: {p}')
          else:
            wait_op(p)

          s,p=call('GET',f'/accounts/{A}/rules/lists/{lid}/items?per_page=100')
          if s!=200 or p.get('success') is not True: raise SystemExit(f'List read-back failed HTTP {s}: {p}')
          redirects=[(x.get('redirect') or {}) for x in (p.get('result') or [])]
          print('REDIRECTS_FINAL',json.dumps(redirects,ensure_ascii=False,sort_keys=True))
          base=next((r for r in redirects if r.get('source_url')==f'https://{P}.pages.dev/'),None)
          current=next((r for r in redirects if r.get('source_url')==latest),None)
          if not base: raise SystemExit('Stable pages.dev redirect missing after read-back')
          if not current: raise SystemExit('Current unique deployment redirect missing after read-back')
          if base.get('include_subdomains') is not True: raise SystemExit('Stable pages.dev redirect does not include subdomains')
          print('CURRENT_DEPLOYMENT_URL',latest)

          # Persist the current deployment URL for shell verification.
          with open('/tmp/current-pages-url','w',encoding='utf-8') as f: f.write(latest)
          PY

          current="$(cat /tmp/current-pages-url)"
          for u in \
            'https://doctor-ghezelbaash.pages.dev/final-canonical-test?q=1' \
            "${current}final-canonical-test?q=1"; do
            echo "--- $u"
            h="$(mktemp)"
            code="$(curl -sS -D "$h" -o /dev/null --max-redirs 0 -w '%{http_code}' "$u" || true)"
            loc="$(tr -d '\r' < "$h" | awk 'BEGIN{IGNORECASE=1} /^location:/{sub(/^location:[[:space:]]*/,""); print; exit}')"
            echo "HTTP=$code LOCATION=$loc"
            test "$code" = '301'
            test "$loc" = 'https://www.ghezelbaash.ir/final-canonical-test?q=1'
          done

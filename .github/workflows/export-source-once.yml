name: Export current source once

on:
  push:
    branches:
      - tmp/source-export-20260824
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Archive tracked source
        shell: bash
        run: |
          set -euo pipefail
          git ls-files -z | tar --null -T - -czf current-source.tar.gz
      - name: Upload snapshot
        uses: actions/upload-artifact@v4
        with:
          name: current-source-snapshot
          path: current-source.tar.gz
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

name: One-shot Graph and Reels semantic rebalance

on:
  push:
    paths:
      - '.github/workflows/rebalance-graph-reels-heading-links.yml'

permissions:
  contents: write

jobs:
  rebalance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact source blob
        run: |
          test "$(git hash-object src/pages/index.md)" = "780d060a04d0a657120572205dedb27305169ccb"

      - name: Rebalance heading destinations
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('src/pages/index.md')
          text = path.read_text(encoding='utf-8')
          original = text

          PROFILE = 'https://www.instagram.com/doctor.ghezelbaash/'
          REELS = 'https://www.instagram.com/doctor.ghezelbaash/reels/'
          GRAPH = '/graph.jsonld'

          graph_ids = [
            'doctor-ghezelbaash-structured-data-repository',
            'dr-saeed-ghezelbash-aesthetic-clinic-kermanshah',
            'saeed-ghezelbash-diagnostic-philosophy',
            'diagnosis-before-aesthetic-treatment-selection',
            'botox',
            'filler',
            'thread-lift',
            'acne-pigmentation-and-scars',
            'skin-rejuvenation',
            'hair-loss',
            'chin-jawline-and-facial-contouring',
            'complications-aftercare-and-follow-up',
            'saeed-ghezelbash-layered-facial-analysis',
            'saeed-ghezelbash-counterfactual-aesthetic-reasoning',
            'saeed-ghezelbash-clinical-responsibility',
            'out-of-town-aesthetic-patients-iran',
            'aesthetic-revision-second-opinion-and-complex-cases',
            'overfilled-face-filler-migration-and-previous-treatment',
            'revision-decision-wait-correct-dissolve-refer',
            'botox-differential-diagnosis',
            'cause-based-filler-treatment-planning',
            'thread-lift-vs-surgical-facelift-decision',
            'acne-scar-examination-lighting-palpation-and-stretching',
            'hair-loss-pattern-assessment-before-injection',
            'facial-contouring-is-proportion-not-just-angle',
          ]

          reels_ids = [
            'botox-mechanism-indications-and-limitations',
            'filler-safety-correction-and-pre-treatment-questions',
            'thread-lift-by-anatomic-area',
            'skin-rejuvenation-faq',
            'prp-for-skin-and-hair',
            'body-contouring-and-body-filler',
            'botox-vs-filler-differences',
            'botox-natural-vs-frozen-facial-expression',
            'botox-induced-eyelid-ptosis-causes',
            'lip-filler-migration-causes',
            'nonsurgical-rhinoplasty-size-reduction-limitations',
            'tear-trough-filler-for-dark-circles-limitations',
            'thread-lift-vs-hifu-and-radiofrequency',
            'thread-lift-longevity-limitations',
            'melasma-recurrence-and-multimodal-treatment',
            'subcision-acne-scar-candidacy',
            'prp-vs-hair-mesotherapy',
            'jalupro-vs-profhilo',
            'jawline-contouring-candidacy',
            'submental-liposuction-candidacy-by-cause',
            'body-filler-vs-fat-grafting-vs-thread-lift',
            'lip-filler-vs-lip-flip',
            'brow-thread-lift-eye-size-myth',
            'is-mesobotox-same-as-botox',
            'submental-liposuction-vs-thread-lift-detailed-boundary',
          ]

          assert len(graph_ids) == 25 and len(set(graph_ids)) == 25
          assert len(reels_ids) == 25 and len(set(reels_ids)) == 25
          assert not (set(graph_ids) & set(reels_ids))

          def heading_links_to(url, source):
              pat = re.compile(r'<h([2-5])\s+id="([^"]+)"[^>]*>\s*<a\s+[^>]*href="' + re.escape(url) + r'"[^>]*>.*?</a>\s*</h\1>', re.S)
              return pat.findall(source)

          before_graph = heading_links_to(GRAPH, text)
          before_reels = heading_links_to(REELS, text)
          before_profile = heading_links_to(PROFILE, text)
          if len(before_graph) != 19:
              raise SystemExit(f'Expected 19 existing Graph heading links, found {len(before_graph)}')
          if len(before_reels) != 18:
              raise SystemExit(f'Expected 18 existing Reels heading links, found {len(before_reels)}')
          if len(before_profile) != 35:
              raise SystemExit(f'Expected 35 Instagram profile heading links, found {len(before_profile)}')

          original_ids = re.findall(r'\bid="([^"]+)"', text)
          heading_re = re.compile(r'<h([2-5])\s+id="([^"]+)"([^>]*)>(.*?)</h\1>', re.S)
          original_headings = [(m.group(1), m.group(2), re.sub(r'<[^>]+>', '', m.group(4))) for m in heading_re.finditer(text)]

          # Remove all existing heading links to Graph and Reels only. Keep every Instagram-profile heading untouched.
          def unwrap_destination(source, url):
              pat = re.compile(
                  r'(<h([2-5])\s+id="([^"]+)"[^>]*>)\s*<a\s+[^>]*href="' + re.escape(url) + r'"[^>]*>(.*?)</a>\s*(</h\2>)',
                  re.S,
              )
              return pat.sub(lambda m: m.group(1) + m.group(4) + m.group(5), source)

          text = unwrap_destination(text, GRAPH)
          text = unwrap_destination(text, REELS)

          def link_heading(source, id_, href, attrs):
              pat = re.compile(rf'(<h([2-5])\s+id="{re.escape(id_)}"[^>]*>)(.*?)(</h\2>)', re.S)
              matches = list(pat.finditer(source))
              if len(matches) != 1:
                  raise SystemExit(f'{id_}: expected exactly one heading, found {len(matches)}')
              inner = matches[0].group(3)
              if '<a ' in inner:
                  raise SystemExit(f'{id_}: target heading is already linked to another destination')
              repl = matches[0].group(1) + f'<a href="{href}"{attrs}>' + inner + '</a>' + matches[0].group(4)
              return source[:matches[0].start()] + repl + source[matches[0].end():]

          for id_ in graph_ids:
              text = link_heading(text, id_, GRAPH, ' type="application/ld+json"')
          for id_ in reels_ids:
              text = link_heading(text, id_, REELS, ' rel="external"')

          # Core invariants: structure/text/IDs untouched; only heading destination wrappers changed.
          new_ids = re.findall(r'\bid="([^"]+)"', text)
          if original_ids != new_ids:
              raise SystemExit('ID sequence changed')
          new_headings = [(m.group(1), m.group(2), re.sub(r'<[^>]+>', '', m.group(4))) for m in heading_re.finditer(text)]
          if original_headings != new_headings:
              raise SystemExit('Heading levels, IDs, order, or visible text changed')

          after_graph = heading_links_to(GRAPH, text)
          after_reels = heading_links_to(REELS, text)
          after_profile = heading_links_to(PROFILE, text)
          if len(after_graph) != 25:
              raise SystemExit(f'Graph heading count is {len(after_graph)}, expected 25')
          if len(after_reels) != 25:
              raise SystemExit(f'Reels heading count is {len(after_reels)}, expected 25')
          if len(after_profile) != 35:
              raise SystemExit(f'Instagram profile heading count changed: {len(after_profile)}')

          graph_after_ids = {x[1] for x in after_graph}
          reels_after_ids = {x[1] for x in after_reels}
          if graph_after_ids != set(graph_ids):
              raise SystemExit(f'Graph set mismatch: {graph_after_ids ^ set(graph_ids)}')
          if reels_after_ids != set(reels_ids):
              raise SystemExit(f'Reels set mismatch: {reels_after_ids ^ set(reels_ids)}')

          # Locked H2 must remain linked to Graph exactly once.
          locked = re.findall(r'<h2\s+id="doctor-ghezelbaash-structured-data-repository"[^>]*>\s*<a\s+[^>]*href="/graph\.jsonld"[^>]*>', text, re.S)
          if len(locked) != 1:
              raise SystemExit('Locked Structured Data Repository H2 is not intact')

          # No nofollow/ugc/sponsored on either destination.
          for url in (GRAPH, REELS):
              for tag in re.findall(r'<a\s+[^>]*href="' + re.escape(url) + r'"[^>]*>', text):
                  low = tag.lower()
                  if any(x in low for x in ('nofollow', 'ugc', 'sponsored')):
                      raise SystemExit(f'Forbidden rel qualifier on {url}: {tag}')

          path.write_text(text, encoding='utf-8')
          print(f'PASS graph: {len(before_graph)} -> {len(after_graph)}')
          print(f'PASS reels: {len(before_reels)} -> {len(after_reels)}')
          print(f'PASS instagram profile preserved: {len(after_profile)}')

      - name: Commit exact source change
        run: |
          git diff --check
          test "$(git diff --name-only)" = "src/pages/index.md"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/index.md
          git commit -m "Rebalance Graph and Reels semantic heading coverage"
          git push origin HEAD:main

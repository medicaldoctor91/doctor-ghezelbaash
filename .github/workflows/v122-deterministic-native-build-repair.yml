name: v1.2.2 one-shot Native Git determinism repair

on:
  push:
    branches: [main]
    paths:
      - '.release/native-build-determinism-fix-request.json'

permissions:
  contents: write

concurrency:
  group: doctor-ghezelbaash-external-mutation
  cancel-in-progress: false

env:
  CANDIDATE_BRANCH: release/v1.2.2-candidate
  BROKEN_CANDIDATE_SHA: ab07f61a70a3adda1bdc68ad86559bbf0932dd90

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.BROKEN_CANDIDATE_SHA }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Install deterministic commit-time resolver
        shell: bash
        run: |
          set -euo pipefail
          cat > scripts/lib/deterministic-build-time.mjs <<'EOF'
          import {execFileSync} from 'node:child_process';

          const SHA40=/^[0-9a-f]{40}$/i;
          const EPOCH=/^[0-9]{9,12}$/;
          const parseEpoch=(raw,label)=>{
            const s=String(raw??'').trim();
            if(!EPOCH.test(s))throw new Error(`${label} is not a valid Unix epoch: ${JSON.stringify(s)}`);
            const n=Number(s);if(!Number.isSafeInteger(n)||n<=0)throw new Error(`${label} epoch is invalid: ${s}`);return n;
          };
          const gitEpoch=(ref,cwd)=>{
            const out=execFileSync('git',['show','-s','--format=%ct',ref],{cwd,encoding:'utf8',stdio:['ignore','pipe','pipe']}).trim();
            return parseEpoch(out,`git commit ${ref}`);
          };
          export function resolveDeterministicBuildInstant({releaseDate,cwd=process.cwd(),env=process.env}={}){
            const explicit=String(env.SOURCE_DATE_EPOCH??'').trim();
            if(explicit){const epochSeconds=parseEpoch(explicit,'SOURCE_DATE_EPOCH');return{epochSeconds,iso:new Date(epochSeconds*1000).toISOString()}}
            for(const key of ['CF_PAGES_COMMIT_SHA','SOURCE_COMMIT','GITHUB_SHA']){
              const ref=String(env[key]??'').trim();if(!ref)continue;
              if(!SHA40.test(ref))throw new Error(`${key} must be an exact 40-hex commit when SOURCE_DATE_EPOCH is absent`);
              try{const epochSeconds=gitEpoch(ref,cwd);return{epochSeconds,iso:new Date(epochSeconds*1000).toISOString()}}
              catch(error){throw new Error(`Cannot resolve deterministic build time from ${key}=${ref}: ${error.message}`)}
            }
            try{const epochSeconds=gitEpoch('HEAD',cwd);return{epochSeconds,iso:new Date(epochSeconds*1000).toISOString()}}
            catch(error){
              if(!/^\d{4}-\d{2}-\d{2}$/.test(String(releaseDate||'')))throw new Error(`No deterministic commit time and invalid releaseDate fallback: ${error.message}`);
              const epochSeconds=Math.floor(Date.parse(`${releaseDate}T00:00:00.000Z`)/1000);
              return{epochSeconds,iso:new Date(epochSeconds*1000).toISOString()};
            }
          }
          EOF

      - name: Bind current-serving generatedAt to exact Candidate commit time
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/finalize-v122-serving.mjs');s=p.read_text()
          old="import {readFile,writeFile,readdir} from 'node:fs/promises';\n"
          new=old+"import {resolveDeterministicBuildInstant} from './lib/deterministic-build-time.mjs';\n"
          if old not in s or 'deterministic-build-time.mjs' in s: raise SystemExit('finalizer import precondition drift')
          s=s.replace(old,new,1)
          old2="const liveRevision=process.env.CF_PAGES_COMMIT_SHA||process.env.GITHUB_SHA||process.env.SOURCE_COMMIT||'local-unbound',generatedAt=process.env.SOURCE_DATE_EPOCH?new Date(Number(process.env.SOURCE_DATE_EPOCH)*1000).toISOString():`${release.dateModified}T00:00:00.000Z`,createdAt=(release.dataset.zenodo.releaseHistory||[]).map(x=>x.publicationDate).sort()[0]||release.dateModified,datasetName=release.dataset.name;"
          new2="const liveRevision=process.env.CF_PAGES_COMMIT_SHA||process.env.SOURCE_COMMIT||process.env.GITHUB_SHA||'local-unbound',generatedAt=resolveDeterministicBuildInstant({releaseDate:release.dateModified}).iso,createdAt=(release.dataset.zenodo.releaseHistory||[]).map(x=>x.publicationDate).sort()[0]||release.dateModified,datasetName=release.dataset.name;"
          if s.count(old2)!=1: raise SystemExit('finalizer generatedAt precondition drift')
          p.write_text(s.replace(old2,new2,1))
          PY

      - name: Make source archive exact tracked-source snapshot, never working-tree noise
        shell: bash
        run: |
          set -euo pipefail
          cat > scripts/package-source.mjs <<'EOF'
          import path from 'node:path';
          import {createHash} from 'node:crypto';
          import {execFileSync} from 'node:child_process';
          import {mkdir,readFile,writeFile} from 'node:fs/promises';
          import {createDeterministicZip} from './lib/deterministic-zip.mjs';

          const root=process.cwd(),release=JSON.parse(await readFile(path.join(root,'src/data/release.json'),'utf8'));
          const outputDir=path.join(root,'release'),folder=`doctor-ghezelbaash-max-power-source-v${release.release}`;
          const output=path.join(outputDir,`${folder}-production-clean-${release.dateModified}.zip`);
          const raw=execFileSync('git',['ls-files','-z'],{cwd:root,encoding:'buffer'}).toString('utf8');
          const names=raw.split('\0').filter(Boolean).sort((a,b)=>a.localeCompare(b));
          if(!names.length)throw new Error('Tracked-source inventory is empty');
          const forbiddenCurrentControl=new Set(['.release/release-attestation.json','.release/release-request.json','.release/zenodo-published.json']);
          for(const name of names){
            if(name==='.git'||name.startsWith('.git/'))throw new Error(`Git internals leaked into tracked source inventory: ${name}`);
            if(name.startsWith('.release/runtime/')||name.startsWith('.release/huggingface/'))throw new Error(`Runtime external state leaked into source inventory: ${name}`);
            if(forbiddenCurrentControl.has(name))throw new Error(`Historical release-control file remains current-root tracked: ${name}`);
          }
          const entries=[];
          for(const name of names)entries.push({name:`${folder}/${name.replaceAll('\\','/')}`,data:await readFile(path.join(root,name))});
          const archive=createDeterministicZip(entries),sha256=createHash('sha256').update(archive).digest('hex');
          await mkdir(outputDir,{recursive:true});await writeFile(output,archive);
          console.log(JSON.stringify({output,sourceCommit:execFileSync('git',['rev-parse','HEAD'],{cwd:root,encoding:'utf8'}).trim(),inventory:'git-ls-files',files:entries.length,uncompressedBytes:entries.reduce((sum,file)=>sum+file.data.length,0),archiveBytes:archive.length,sha256},null,2));
          EOF

      - name: Archive v1.2.1 control artifacts without changing their bytes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .release/history/v1.2.1
          for f in release-attestation.json release-request.json zenodo-published.json; do
            test -f ".release/$f"
            mv ".release/$f" ".release/history/v1.2.1/$f"
          done
          python - <<'PY'
          import json
          from pathlib import Path
          h=Path('.release/history/v1.2.1')
          assert json.loads((h/'release-attestation.json').read_text())['release']=='1.2.1'
          assert json.loads((h/'release-request.json').read_text())['targetVersion']=='1.2.1'
          assert json.loads((h/'zenodo-published.json').read_text())['release']=='1.2.1'
          PY

      - name: Extend contract with release-control archival and build-time helper guards
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/validate-v122-contract.mjs');s=p.read_text()
          anchor="const release=await readJson('src/data/release.json'),inv=await readJson('src/data/release-invariants.json'),pkg=await readJson('package.json'),lock=await readJson('package-lock.json'),codemeta=await readJson('codemeta.json');\n"
          addition="const releaseRoot=new Set(await readdir(path.join(root,'.release'))),history121=new Set(await readdir(path.join(root,'.release/history/v1.2.1')));for(const f of ['release-attestation.json','release-request.json','zenodo-published.json']){if(releaseRoot.has(f))fail(`Historical v1.2.1 control artifact remains in current .release root: ${f}`);if(!history121.has(f))fail(`Archived v1.2.1 control artifact missing: ${f}`)}await readFile(path.join(root,'scripts/lib/deterministic-build-time.mjs'),'utf8');\n"
          if anchor not in s or 'Historical v1.2.1 control artifact remains' in s: raise SystemExit('validator precondition drift')
          p.write_text(s.replace(anchor,anchor+addition,1))
          PY

      - name: Commit coherent source repair locally
        shell: bash
        run: |
          set -euo pipefail
          git config user.name ghezelbaash-release-bot
          git config user.email actions@users.noreply.github.com
          git add scripts/lib/deterministic-build-time.mjs scripts/finalize-v122-serving.mjs scripts/package-source.mjs scripts/validate-v122-contract.mjs .release/history/v1.2.1 .release/release-attestation.json .release/release-request.json .release/zenodo-published.json
          git diff --cached --check
          git commit -m 'Make v1.2.2 Native Git builds and source archives deterministic'
          FIX_SHA=$(git rev-parse HEAD)
          echo "FIX_SHA=$FIX_SHA" >> "$GITHUB_ENV"
          echo "FIX_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"

      - name: Build mode A with explicit SOURCE_DATE_EPOCH
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          export SOURCE_DATE_EPOCH="$FIX_EPOCH" CF_PAGES_COMMIT_SHA="$FIX_SHA" SOURCE_COMMIT="$FIX_SHA"
          npm run release
          node scripts/validate-visible-freeze.mjs dist/index.html
          python - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('dist'); d={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(root.rglob('*')) if p.is_file()}
          pathlib.Path('/tmp/mode-a-dist.json').write_text(json.dumps(d,sort_keys=True))
          rel=pathlib.Path('release')
          files={p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in rel.glob('*.zip')}
          pathlib.Path('/tmp/mode-a-zips.json').write_text(json.dumps(files,sort_keys=True))
          print('MODE_A_MANIFEST',json.loads(pathlib.Path('dist/artifact-manifest.json').read_text())['generatedAt'])
          print('MODE_A_ZIPS',json.dumps(files,sort_keys=True))
          PY

      - name: Build mode B like Native Cloudflare with SOURCE_DATE_EPOCH absent
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/v122-native-like
          git worktree add --detach /tmp/v122-native-like "$FIX_SHA"
          (
            cd /tmp/v122-native-like
            npm ci --ignore-scripts
            unset SOURCE_DATE_EPOCH SOURCE_COMMIT GITHUB_SHA || true
            export CF_PAGES_COMMIT_SHA="$FIX_SHA"
            mkdir -p .release/runtime .release/huggingface
            printf 'runtime-noise-%s\n' "$RANDOM" > .release/runtime/untracked-noise.txt
            printf 'hf-noise-%s\n' "$RANDOM" > .release/huggingface/untracked-noise.txt
            npm run release
            node scripts/validate-visible-freeze.mjs dist/index.html
            python - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('dist'); d={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(root.rglob('*')) if p.is_file()}
          pathlib.Path('/tmp/mode-b-dist.json').write_text(json.dumps(d,sort_keys=True))
          rel=pathlib.Path('release'); files={p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in rel.glob('*.zip')}
          pathlib.Path('/tmp/mode-b-zips.json').write_text(json.dumps(files,sort_keys=True))
          print('MODE_B_MANIFEST',json.loads(pathlib.Path('dist/artifact-manifest.json').read_text())['generatedAt'])
          print('MODE_B_ZIPS',json.dumps(files,sort_keys=True))
          PY
          )
          cmp /tmp/mode-a-dist.json /tmp/mode-b-dist.json
          cmp /tmp/mode-a-zips.json /tmp/mode-b-zips.json
          node - <<'NODE'
          const fs=require('fs');
          const a=require('/tmp/mode-a-dist.json'),b=require('/tmp/mode-b-dist.json');
          if(JSON.stringify(a)!==JSON.stringify(b))throw Error('Native-like DIST differs from explicit-epoch DIST');
          const za=require('/tmp/mode-a-zips.json'),zb=require('/tmp/mode-b-zips.json');
          if(JSON.stringify(za)!==JSON.stringify(zb))throw Error('Release ZIP reproducibility failed');
          console.log('NATIVE_GIT_AND_RELEASE_PACKAGE_REPRODUCIBILITY_PASS',JSON.stringify({distFiles:Object.keys(a).length,zips:za}));
          NODE
          git worktree remove --force /tmp/v122-native-like

      - name: Prove no visible change and push repaired candidate only after all tests pass
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard "$FIX_SHA"
          test "$(node -p "require('./src/data/release.json').release")" = 1.2.2
          test "$(node -p "require('./src/data/release.json').dataset.zenodo.versionDoi")" = 10.5281/zenodo.21930954
          test -z "$(git status --porcelain)"
          git push origin HEAD:$CANDIDATE_BRANCH
          echo "V122_NATIVE_BUILD_DETERMINISM_REPAIR_PASS $FIX_SHA"

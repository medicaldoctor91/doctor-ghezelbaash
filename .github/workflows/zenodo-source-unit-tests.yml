name: Zenodo source recovery unit tests

on:
  push:
    branches: [maintenance/zenodo-in-place-20261014]
    paths:
      - '.github/workflows/zenodo-source-unit-tests.yml'
      - '.github/scripts/zenodo_source_recovery.py'
      - '.github/scripts/hf_zenodo_pointer_repair.py'
      - 'tests/test_zenodo_source_recovery.py'
      - 'tests/test_zenodo_bucket_upload.py'
      - 'tests/test_hf_zenodo_pointer_repair.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_zenodo_*py' -v
      - run: python -m unittest tests/test_hf_zenodo_pointer_repair.py -v

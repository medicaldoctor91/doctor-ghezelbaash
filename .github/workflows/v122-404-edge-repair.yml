name: v1.2.2 exact-C 404 edge repair

on:
  push:
    branches: [main]
    paths: [.github/workflows/v122-404-edge-repair.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: doctor-ghezelbaash-external-mutation
  cancel-in-progress: false

env:
  CANDIDATE_SHA: 41b779fae27f1eab4a9cb63fee17d2e6fec0075c
  CLOUDFLARE_ACCOUNT_ID: 884d1d90bd1fb6ecca14992c6c60d677
  ZONE_NAME: ghezelbaash.ir
  CANONICAL_HOST: www.ghezelbaash.ir

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout immutable Candidate C
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 41b779fae27f1eab4a9cb63fee17d2e6fec0075c
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0
          cache: npm

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - run: npm ci --ignore-scripts

      - name: Rebuild exact Candidate C and derive final 404 CSP
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct "$CANDIDATE_SHA")"
          export SOURCE_COMMIT="$CANDIDATE_SHA" CF_PAGES_COMMIT_SHA="$CANDIDATE_SHA" ASTRO_TELEMETRY_DISABLED=1
          npm run release
          node scripts/validate-visible-freeze.mjs dist/index.html
          node - <<'NODE'
          const fs=require('fs');
          const text=fs.readFileSync('dist/_headers','utf8');
          const lines=text.split(/\r?\n/),i=lines.indexOf('/404.html');
          if(i<0)throw Error('Missing /404.html header block');
          let csp='';
          for(let j=i+1;j<lines.length&&/^\s/.test(lines[j]);j++){
            const x=lines[j].trim(); if(x.toLowerCase().startsWith('content-security-policy:'))csp=x.slice(x.indexOf(':')+1).trim();
          }
          if(!csp||csp.includes('{{')||/unsafe-inline|unsafe-eval/i.test(csp))throw Error('Invalid exact-C 404 CSP');
          console.log('EXACT_C_404_CSP_DERIVED bytes='+Buffer.byteLength(csp));
          NODE

      - name: Reconcile only owned real-404 response-header transform
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"; echo "::add-mask::$CLOUDFLARE_API_TOKEN"
          node - <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const token=process.env.CLOUDFLARE_API_TOKEN,account=process.env.CLOUDFLARE_ACCOUNT_ID,zoneName=process.env.ZONE_NAME,host=process.env.CANONICAL_HOST;
          const API='https://api.cloudflare.com/client/v4';
          const req=async(path,{method='GET',body}={})=>{const r=await fetch(API+path,{method,headers:{authorization:`Bearer ${token}`,...(body?{'content-type':'application/json'}:{})},body:body?JSON.stringify(body):undefined,signal:AbortSignal.timeout(45000)});const p=await r.json().catch(()=>null);if(!r.ok||p?.success!==true)throw Error(`Cloudflare ${method} ${path} HTTP ${r.status}: ${JSON.stringify(p?.errors||[])}`);return p.result};
          const text=fs.readFileSync('dist/_headers','utf8'),lines=text.split(/\r?\n/),i=lines.indexOf('/404.html');
          assert(i>=0);let csp='';for(let j=i+1;j<lines.length&&/^\s/.test(lines[j]);j++){const x=lines[j].trim();if(x.toLowerCase().startsWith('content-security-policy:'))csp=x.slice(x.indexOf(':')+1).trim()}
          assert(csp&&!csp.includes('{{')&&!/unsafe-inline|unsafe-eval/i.test(csp));
          const zones=await req(`/zones?name=${encodeURIComponent(zoneName)}&account.id=${encodeURIComponent(account)}&per_page=50`);const exact=(zones||[]).filter(z=>z.name===zoneName);assert.equal(exact.length,1);const zone=exact[0].id;
          const desired={ref:'ghezelbaash_real_404_headers_v1',expression:`(http.host eq "${host}" and http.response.code eq 404)`,description:'Restore the generated real-404 indexing and CSP contract on Cloudflare Pages fallback responses',action:'rewrite',action_parameters:{headers:{'x-robots-tag':{operation:'set',value:'noindex, follow'},'content-language':{operation:'set',value:'fa-IR'},'content-security-policy':{operation:'set',value:csp},'cache-control':{operation:'set',value:'no-store'}}},enabled:true};
          const listing=await req(`/zones/${zone}/rulesets`);let rs=(listing||[]).filter(x=>x.kind==='zone'&&x.phase==='http_response_headers_transform');assert(rs.length<=1,'Multiple response-header transform rulesets');let rulesetId;
          if(!rs.length){const created=await req(`/zones/${zone}/rulesets`,{method:'POST',body:{name:'Canonical response header transforms',description:'Git-managed response corrections for canonical and fallback responses',kind:'zone',phase:'http_response_headers_transform',rules:[desired]}});rulesetId=created.id;console.log('V122_404_RULESET_CREATED',rulesetId)}else{rulesetId=rs[0].id;let full=await req(`/zones/${zone}/rulesets/${rulesetId}`),rules=full.rules||[],owned=rules.filter(x=>x.ref===desired.ref);assert(owned.length<=1,'Duplicate owned 404 rule');if(owned.length){const body={...desired};if(rules.at(-1)?.id!==owned[0].id)body.position={after:String(rules.at(-1).id)};await req(`/zones/${zone}/rulesets/${rulesetId}/rules/${owned[0].id}`,{method:'PATCH',body});console.log('V122_404_RULE_PATCHED',owned[0].id)}else{const created=await req(`/zones/${zone}/rulesets/${rulesetId}/rules`,{method:'POST',body:desired});console.log('V122_404_RULE_CREATED',created.id)}}
          const readback=await req(`/zones/${zone}/rulesets/${rulesetId}`),rules=readback.rules||[],owned=rules.filter(x=>x.ref===desired.ref);assert.equal(owned.length,1);const x=owned[0];assert.equal(x.expression,desired.expression);assert.equal(x.action,'rewrite');assert.equal(x.enabled,true);assert.equal(x.action_parameters?.headers?.['x-robots-tag']?.value,'noindex, follow');assert.equal(x.action_parameters?.headers?.['content-language']?.value,'fa-IR');assert.equal(x.action_parameters?.headers?.['cache-control']?.value,'no-store');assert.equal(x.action_parameters?.headers?.['content-security-policy']?.value,csp);assert.equal(rules.at(-1)?.id,x.id,'Owned 404 transform must remain last');
          console.log('V122_404_EDGE_RULE_EXACT_READBACK_PASS',JSON.stringify({zone:zoneName,host,ref:x.ref,cspBytes:Buffer.byteLength(csp),rulesetId,ruleId:x.id}));
          NODE

      - name: Purge dedicated zone and prove full production contract
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"; echo "::add-mask::$CLOUDFLARE_API_TOKEN"
          python scripts/configure-cloudflare-edge.py --purge-cache-only
          VERIFY_BASE_URL='https://www.ghezelbaash.ir/' node scripts/verify-cloudflare-pages-deployment.mjs
          npm run verify:production
          echo "V122_REAL_404_EDGE_AND_PRODUCTION_CONTRACT_PASS $CANDIDATE_SHA"

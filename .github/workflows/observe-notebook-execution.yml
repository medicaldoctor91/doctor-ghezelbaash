name: Observe the existing notebook execution without publishing
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: doctor-ghezelbaash-readonly-notebook-observation
  cancel-in-progress: false
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ARCHIVE_SOURCE_COMMIT: ed767f6e6726e1453196e2ec2b312fcad00677e2
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN || secrets.KAGGLE_TOKEN }}
      ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN || secrets.ZENODO_ACCESS_TOKEN || secrets.ZENODO_API_TOKEN || secrets.ZENODO_API_KEY || secrets.ZENODO_PAT }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install requests 'kaggle==2.2.5'
      - uses: actions/download-artifact@v4
        with:
          name: same-doi-file-correction-evidence
          run-id: 40120487161
          github-token: ${{ github.token }}
          path: /tmp/prepared-observer
      - name: Read existing Zenodo draft file progress without editing
        run: |
          python - <<'PY'
          import hashlib,json,os,time
          from pathlib import Path
          import requests
          folder=Path('/tmp/notebook-observation')
          folder.mkdir(exist_ok=True)
          manifests=list(Path('/tmp/prepared-observer').rglob('correction-manifest.json'))
          assert len(manifests)==1,'Expected one reviewed correction manifest'
          manifest=json.loads(manifests[0].read_text())
          assert manifest['record']==23474664 and manifest['doi']=='10.5281/zenodo.23474664'
          target={name:{'checksum':item['checksum'],'bytes':item['bytes']}
                  for name,item in manifest['target']['files'].items()}
          assert len(target)==43
          canonical=json.dumps(manifest,ensure_ascii=False,sort_keys=True,separators=(',',':')).encode()
          report={'observedUTC':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime()),
                  'scope':'Read-only owner staging progress; no publication claim or final byte verification',
                  'record':23474664,'preparedRun':40120487161,
                  'targetManifestSHA256':hashlib.sha256(canonical).hexdigest(),
                  'expectedFiles':43,'platformWrites':False,'readCalls':1}
          try:
              response=requests.get('https://zenodo.org/api/records/23474664/draft/files',
                  headers={'Authorization':'Bearer '+os.environ['ZENODO_TOKEN'],
                           'Accept':'application/vnd.inveniordm.v1+json'},
                  timeout=(15,45),allow_redirects=False)
              report['HTTP']=response.status_code
              if response.status_code==404:
                  report.update(status='NO_DRAFT',draftExists=False,fileCount=0,
                                targetMatches=False,remainingNames=sorted(target))
              elif response.status_code==200:
                  entries=response.json()['entries']
                  if isinstance(entries,dict):
                      entries=[dict(value,key=value.get('key',key)) for key,value in entries.items()]
                  assert isinstance(entries,list)
                  actual={item['key']:{'checksum':item.get('checksum'),'bytes':item.get('size')}
                          for item in entries}
                  assert len(actual)==len(entries),'Duplicate draft filenames'
                  remaining=sorted(name for name,item in target.items() if actual.get(name)!=item)
                  unexpected=sorted(set(actual)-set(target))
                  report.update(status='DRAFT_OBSERVED',draftExists=True,fileCount=len(actual),
                                targetMatches=not remaining and not unexpected and len(actual)==43,
                                targetFilesMatched=43-len(remaining),remainingNames=remaining,
                                unexpectedNames=unexpected)
              else:
                  report.update(status='ACCESS_STOP' if response.status_code in (401,403,429) else 'READ_ERROR',
                                draftExists=None,targetMatches=False)
          except Exception as error:
              report.update(status='READ_ERROR',errorType=type(error).__name__,draftExists=None,targetMatches=False)
          report['completedUTC']=time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime())
          (folder/'zenodo-draft-report.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps(report,indent=2))
          PY
      - name: Read exact version 16 status and logs with official v16 selector
        run: |
          python - <<'PY'
          import hashlib,json,os,re,signal,sys,time
          from pathlib import Path
          import requests
          sys.path.insert(0,'.github/scripts')
          from sync_platform_machine_resources import kaggle_client
          from kagglesdk import KaggleEnv
          from kagglesdk.kernels.types.kernels_api_service import ApiListKernelSessionOutputRequest, ApiGetKernelRequest, ApiGetKernelSessionStatusRequest
          # Store bounded, sanitized snapshots; never restart or alter a session.
          def sanitized(value):
              text=str(value or '')
              for key,secret in os.environ.items():
                  if re.search(r'TOKEN|SECRET|PASSWORD|API_KEY',key,re.I) and len(secret)>=8:
                      text=text.replace(secret,'[REDACTED]')
              text=re.sub(r'https?://[^\s<>"\']+','[URL REDACTED]',text,flags=re.I)
              text=re.sub(r'(?im)^.*(?:authorization\s*:|set-cookie\s*:|cookie\s*:|x-api-key\s*:|bearer\s+|api[_-]?token\s*[:=]|password\s*[:=]|secret\s*[:=]).*$','[CREDENTIAL LINE REDACTED]',text)
              text=re.sub(r'\b(?:hf_[A-Za-z0-9]{8,}|KGAT_[A-Za-z0-9_=-]{8,})\b','[TOKEN REDACTED]',text)
              return text
          client=kaggle_client()
          ref='saeedghezelbash/dr-saeed-ghezelbash-knowledge-graph-starter'
          expected_version=16
          version_label='v16'  # Official Kaggle 2.2.5 _kernel_version_label('16').
          expected_cells_sha256='c5d98c8b68289dd13c66ecb90208a2bc05ea8f399912dfe1a2d3d8e3950ffefb'
          def source_identity():
              request=ApiGetKernelRequest()
              request.user_name='saeedghezelbash'
              request.kernel_slug='dr-saeed-ghezelbash-knowledge-graph-starter'
              request.version_label=version_label
              with client.build_kaggle_client() as kaggle:
                  current=kaggle.kernels.kernels_api_client.get_kernel(request)
              notebook=json.loads(current.blob.source)
              cells=[{'cell_type':cell['cell_type'],
                      'source':''.join(cell['source']) if isinstance(cell['source'],list) else cell['source']}
                     for cell in notebook['cells']]
              digest=hashlib.sha256(json.dumps(cells,ensure_ascii=False,sort_keys=True,separators=(',',':')).encode()).hexdigest()
              version=current.metadata.current_version_number
              return {'currentVersionNumber':version,'cells':len(cells),'normalizedCellsSHA256':digest,
                      'matchesFrozenSource':version==expected_version and len(cells)==8 and digest==expected_cells_sha256}
          def source_read_error(error):
              http=getattr(getattr(error,'response',None),'status_code',None)
              return {'errorType':type(error).__name__,'HTTP':http,
                      'status':'ACCESS_STOP' if http in (401,403,429) else 'READ_ERROR'}
          folder=Path('/tmp/notebook-observation')
          folder.mkdir(exist_ok=True)
          request=ApiGetKernelSessionStatusRequest()
          request.user_name='saeedghezelbash'
          request.kernel_slug='dr-saeed-ghezelbash-knowledge-graph-starter'
          request.version_label=version_label
          try:
              with client.build_kaggle_client() as kaggle:
                  state=kaggle.kernels.kernels_api_client.get_kernel_session_status(request)
          except Exception as error:
              report={'versionLabel':version_label,'statusRead':source_read_error(error),'platformWrites':False}
              (folder/'report.json').write_text(json.dumps(report,indent=2)+'\n')
              print(json.dumps(report,indent=2))
              raise SystemExit('Exact version-16 owner status read failed; no fallback follows')
          status=str(state.status)
          report={'observedUTC':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime()),
                  'scope':'Owner execution diagnostic only; no public health assertion or publication',
                  'status':sanitized(status),'failureMessage':sanitized(getattr(state,'failure_message',None)) or None,
                  'statusScope':'Exact numeric version 16 selected with official v16 label; owner diagnostic, not public completion proof',
                  'versionLabel':version_label,
                  'selectorCorrection':'Official Kaggle 2.2.5 _kernel_version_label maps numeric 16 to v16; bare 16 is invalid and its earlier 404 was not an execution-readiness signal.',
                  'sourceExpectation':{'currentVersionNumber':expected_version,'cells':8,'normalizedCellsSHA256':expected_cells_sha256},
                  'dataset':sanitized(client.dataset_status('saeedghezelbash/dr-saeed-ghezelbash-knowledge-graph-and-nlp-data',format='json(status,current_version_number)')),
                  'platformWrites':False,'logCalls':1,'logStreaming':False,'maximumSavedLogBytes':100000,
                  'logBytes':0,'logSavedBytes':0}
          try:
              report['sourceBefore']=source_identity()
          except Exception as error:
              report['sourceBefore']=source_read_error(error)
              (folder/'report.json').write_text(json.dumps(report,indent=2)+'\n')
              print(json.dumps(report,indent=2))
              raise SystemExit('Exact version-16 source read failed; no log diagnostic follows')
          try:
              request=ApiListKernelSessionOutputRequest()
              request.user_name='saeedghezelbash'
              request.kernel_slug='dr-saeed-ghezelbash-knowledge-graph-starter'
              request.version_label=version_label
              with client.build_kaggle_client() as kaggle:
                  response=kaggle.kernels.kernels_api_client.list_kernel_session_output(request)
              raw=response.log or ''
              clean=sanitized(raw).encode('utf-8')
              saved=clean[-100000:]
              (folder/'owner-v16.log').write_bytes(saved)
              report.update(outputFileNames=[sanitized(item.file_name)[:500] for item in (response.files or [])[:200]],
                            outputFileNamesTruncated=len(response.files or [])>200,
                            logBytes=len(raw.encode('utf-8')),logSavedBytes=len(saved),
                            logStatus='EMPTY' if not raw else 'PERSISTED_LOG',
                            logTruncated=len(clean)>len(saved),
                            logTail=saved.decode('utf-8',errors='replace')[-4000:])
          except Exception as error:
              # No alternative endpoint, account or retry follows a denied owner read.
              response=getattr(error,'response',None)
              http=getattr(response,'status_code',None)
              report.update(logReadErrorType=type(error).__name__,logReadHTTP=http,
                            logStatus='ACCESS_STOP' if http in (401,403,429) else 'READ_ERROR')
          if report.get('logStatus')=='EMPTY' or (report.get('logStatus')=='READ_ERROR' and report.get('logReadHTTP')==404):
              # The documented live endpoint is a separate running-session feature.
              # Missing persisted output is not an access denial. Denials never enter this branch.
              live={'sessionSelector':'Exact numeric version 16 via official v16 label','readCalls':1,'maximumBytes':16000,'maximumSeconds':15,
                    'scope':'One bounded owner live-log snapshot of the existing session; not an execution/publication claim',
                    'timeout':False,'truncated':False}
              capture=bytearray()
              response=None
              started=time.monotonic()
              old_handler=signal.getsignal(signal.SIGALRM)
              def deadline(signum,frame):
                  raise TimeoutError('Bounded live-log capture timed out')
              signal.signal(signal.SIGALRM,deadline)
              signal.setitimer(signal.ITIMER_REAL,15)
              try:
                  with client.build_kaggle_client() as kaggle:
                      http=kaggle._http_client
                      http._init_session()
                      base=http._endpoint if http._env==KaggleEnv.PROD else f'{http._endpoint}/api'
                      url=base+'/v1/kernels/logs/stream/saeedghezelbash/dr-saeed-ghezelbash-knowledge-graph-starter'
                      headers=dict(http._session.headers)
                      headers['Accept']='text/event-stream, */*'
                      headers.pop('Content-Type',None)
                      response=http._session.get(url,headers=headers,auth=http._session.auth,
                          params={'versionLabel':version_label,'waitForLogsUrlSeconds':1},
                          stream=True,timeout=(10,12),allow_redirects=False)
                      live.update(HTTP=response.status_code,
                                  contentType=sanitized(response.headers.get('Content-Type','')))
                      if response.status_code in (401,403,429):
                          live['status']='ACCESS_STOP'
                      else:
                          live['status']='LIVE_SNAPSHOT' if response.status_code==200 else 'HTTP_ERROR'
                          for chunk in response.iter_content(chunk_size=1024):
                              if not chunk:
                                  continue
                              remaining=16000-len(capture)
                              capture.extend(chunk[:remaining])
                              if len(chunk)>remaining or len(capture)>=16000:
                                  live['truncated']=True
                                  break
                              if b'END_OF_LOG' in capture:
                                  live['endOfLog']=True
                                  break
                              if time.monotonic()-started>=15:
                                  live.update(timeout=True,truncated=True)
                                  break
              except Exception as error:
                  live.update(errorType=type(error).__name__,
                              timeout=isinstance(error,(TimeoutError,requests.Timeout)) or 'timed out' in str(error).lower(),
                              status='CAPTURE_STOPPED')
              finally:
                  signal.setitimer(signal.ITIMER_REAL,0)
                  signal.signal(signal.SIGALRM,old_handler)
                  if response is not None:
                      response.close()
              text=capture.decode('utf-8',errors='replace')
              safe=sanitized(text).encode('utf-8')[-16000:]
              (folder/'owner-v16-live.log').write_bytes(safe)
              data=[]
              for line in text.splitlines():
                  if not line.startswith('data:'):
                      continue
                  payload=line[5:].lstrip()
                  if payload=='END_OF_LOG':
                      continue
                  try:
                      event=json.loads(payload)
                      data.append(str(event.get('data',event)) if isinstance(event,dict) else str(event))
                  except (ValueError,TypeError):
                      data.append(payload)
              live.update(bytesCaptured=len(capture),savedBytes=len(safe),eventsSeen=len(data),
                          seconds=round(time.monotonic()-started,3),
                          tail=sanitized('\n'.join(data) if data else text)[-4000:])
              report.update(logStreaming=True,logStreamingBounded=True,liveLog=live)
          access_stop=report.get('logStatus')=='ACCESS_STOP' or report.get('liveLog',{}).get('status')=='ACCESS_STOP'
          if access_stop:
              report['sourceAfter']={'status':'NOT_READ_AFTER_ACCESS_STOP'}
          else:
              try:
                  report['sourceAfter']=source_identity()
              except Exception as error:
                  report['sourceAfter']=source_read_error(error)
          report['sourceIdentityVerified']=(report.get('sourceBefore')==report.get('sourceAfter')
              and report.get('sourceBefore',{}).get('matchesFrozenSource') is True)
          report['executionAssertion']='No version-16 completion assertion; only actual public version-16 output can establish that'
          report['completedUTC']=time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime())
          (folder/'report.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps(report,indent=2))
          if not report['sourceIdentityVerified']:
              raise SystemExit('Exact version-16 source identity did not remain identical to the reviewed eight-cell source')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: existing-notebook-execution-observation
          path: /tmp/notebook-observation/
          if-no-files-found: warn

name: One-time repair v1.3.3 release integrity

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-time-repair-release-integrity.yml"
      - "scripts/repair-current-release-integrity.py"

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Rebuild the exact live website
        run: |
          set -euo pipefail
          npm ci
          npm run build
          python3 scripts/repair-current-release-integrity.py

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install pinned Hugging Face client
        run: python3 -m pip install --disable-pip-version-check "huggingface_hub==1.32.0"

      - name: Repair HF main and Zenodo published metadata in the existing release
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN || secrets.HUGGINGFACE_TOKEN || secrets.HUGGING_FACE_TOKEN }}
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN || secrets.ZENODO_ACCESS_TOKEN || secrets.ZENODO_API_TOKEN || secrets.ZENODO_API_KEY || secrets.ZENODO_PAT }}
        run: |
          set -euo pipefail
          test -n "${HF_TOKEN:-}"
          test -n "${ZENODO_TOKEN:-}"
          echo "::add-mask::$HF_TOKEN"
          echo "::add-mask::$ZENODO_TOKEN"
          python3 scripts/repair-current-release-integrity.py --apply

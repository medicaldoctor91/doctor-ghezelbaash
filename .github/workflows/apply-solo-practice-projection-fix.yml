name: Apply solo-practice projection fix
on:
  push:
    branches: [ops/platform-convergence-hardening-20261017-red]
    paths: [.github/workflows/apply-solo-practice-projection-fix.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Apply guarded machine-output patch
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('src/lib/machine-output.mjs')
          text=path.read_text()
          needle="  const clinic = nodes.find((node) => values(node['@type']).includes('MedicalClinic'));"
          assert text.count(needle)==2, text.count(needle)
          marker="const xmlEscape = (value) => String(value ?? '').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('\"','&quot;').replaceAll(\"'\",'&apos;');"
          assert text.count(marker)==1
          helper="""function clinicNode(source) {
            const nodes = source.graph['@graph'];
            const person = nodes.find((node) => node['@id'] === source.canonicalOrigin + '/#saeed-ghezelbash');
            const relationIds = [...values(person?.owns), ...values(person?.practicesAt)]
              .map((value) => typeof value === 'string' ? value : value?.['@id'])
              .filter(Boolean);
            return relationIds.map((id) => nodes.find((node) => node['@id'] === id)).find(Boolean)
              ?? nodes.find((node) => values(node['@type']).includes('PhysiciansOffice'))
              ?? nodes.find((node) => values(node['@type']).includes('MedicalClinic'));
          }

          """
          text=text.replace(marker,helper+marker)
          text=text.replace(needle,"  const clinic = clinicNode(source);")
          assert text.count("const clinic = clinicNode(source);")==2
          path.write_text(text)
          PY
          git diff --check
          git diff -- src/lib/machine-output.mjs
      - name: Commit guarded fix
        run: |
          git config user.name 'ghezelbaash-release-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add src/lib/machine-output.mjs
          git commit -m 'fix: resolve solo-practice clinic in machine projections'
          git push origin HEAD:ops/platform-convergence-hardening-20261017-red

name: PR 394 inspect HTML conformance owner

on:
  push:
    branches:
      - candidate/final-repository-plan-2026

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: candidate/final-repository-plan-2026
          persist-credentials: false
      - name: Materialize patch and print HTML validator
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          cat .pr394-upgrade.gz.b64.* | base64 --decode | gzip -dc > /tmp/pr394-upgrade.patch
          git apply --check /tmp/pr394-upgrade.patch
          git apply /tmp/pr394-upgrade.patch
          echo '=== HTML_VALIDATOR_BEGIN ==='
          nl -ba scripts/validate-html-conformance.mjs
          echo '=== HTML_VALIDATOR_END ==='
          echo '=== DIST_IDENTITY_BEGIN ==='
          nl -ba scripts/lib/dist-identity.mjs
          echo '=== DIST_IDENTITY_END ==='

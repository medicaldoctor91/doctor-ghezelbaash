name: Temporary public resource graph closure patch

on:
  push:
    branches: [fix/semantic-calibration-recovery-20260907]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
      - name: Patch both graph closure consumers
        run: node scripts/patch-public-resource-graph-closure.mjs
      - name: Fail closed on integration scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed=$(git diff --name-only)
          expected=$'scripts/validate-release-contract.mjs\nscripts/validate-source.mjs'
          test "$changed" = "$expected"
          node --check scripts/validate-release-contract.mjs
          node --check scripts/validate-source.mjs
      - name: Commit graph closure integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/validate-release-contract.mjs scripts/validate-source.mjs
          git commit -m "Recognize verified public resource IRIs in graph closure"
          git push origin "HEAD:${GITHUB_REF_NAME}"

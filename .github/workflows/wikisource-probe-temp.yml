name: Probe English Wikisource access
on:
  push:
    branches: [main]
    paths: ['.github/workflows/wikisource-probe-temp.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      WIKI_USERNAME: ${{ secrets.WIKIVERSITY_USERNAME }}
      WIKI_BOT_PASSWORD: ${{ secrets.WIKIVERSITY_BOT_PASSWORD }}
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check --no-input requests==2.32.5
      - name: Authenticate and inspect rights without editing
        shell: python
        run: |
          import os, requests, json, sys
          api='https://en.wikisource.org/w/api.php'
          s=requests.Session(); s.headers['User-Agent']='Medicaldoctor91WikisourceProbe/1.0 (https://www.ghezelbaash.ir/)'
          def get(**p):
              p.update(format='json',formatversion=2)
              r=s.get(api,params=p,timeout=30); r.raise_for_status(); return r.json()
          def post(**p):
              p.update(format='json',formatversion=2)
              r=s.post(api,data=p,timeout=30); r.raise_for_status(); return r.json()
          tok=get(action='query',meta='tokens',type='login')['query']['tokens']['logintoken']
          lg=post(action='login',lgname=os.environ['WIKI_USERNAME'],lgpassword=os.environ['WIKI_BOT_PASSWORD'],lgtoken=tok)
          if lg.get('login',{}).get('result')!='Success':
              print(json.dumps({'login':lg},indent=2)); sys.exit(1)
          ui=get(action='query',meta='userinfo',uiprop='groups|rights|blockinfo')['query']['userinfo']
          checks=get(action='query',titles='Author:Mohammad Saeed Ghezelbash|Author:Saeed Ghezelbash|Individuals with Major Depressive Disorder Report High Scores of Insecure-Avoidant and Insecure-Anxious Attachment Styles, Dissociative Identity Symptoms, and Adult Traumatic Events',prop='info')['query']['pages']
          print(json.dumps({'name':ui.get('name'),'userid':ui.get('id'),'groups':ui.get('groups'),'blockedby':ui.get('blockedby'),'blockreason':ui.get('blockreason'),'can_edit':'edit' in ui.get('rights',[]),'can_createpage':'createpage' in ui.get('rights',[]),'targets':[{'title':p.get('title'),'missing':'missing' in p,'pageid':p.get('pageid')} for p in checks]},ensure_ascii=False,indent=2))

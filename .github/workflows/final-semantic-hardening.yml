name: Final semantic hardening

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/final-semantic-hardening.yml

permissions:
  contents: write

concurrency:
  group: doctor-ghezelbaash-final-semantic-hardening
  cancel-in-progress: false

jobs:
  harden:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - name: Checkout canonical source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.18.0
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Apply fail-closed final hardening
        run: python scripts/final-hardening.py

      - name: Bind source validator to release truth variables
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/validate-release-contract.mjs')
          text=p.read_text()
          old="for(const token of ['task_categories:','size_categories:','Q140287622','/g/11nqdfk76c','0009-0001-9346-8475','Personal Hugging Face identity'])"
          new="for(const token of ['task_categories:','size_categories:','release.primaryEntity.wikidata','release.primaryEntity.googleKnowledgeGraphId','release.dataset.creatorOrcid','Personal Hugging Face identity'])"
          if text.count(old)!=1: raise SystemExit(f'expected one validator binding, found {text.count(old)}')
          p.write_text(text.replace(old,new,1))
          q=Path('.github/workflows/ceiling-release.yml')
          raw=q.read_text()
          q.write_text('\n'.join(line.rstrip() for line in raw.splitlines())+'\n')
          PY

      - name: Regenerate and validate hardened source
        shell: bash
        run: |
          set -euo pipefail
          npm run prepare:generated
          npm run validate:release-contract
          npm run validate:source
          git diff --check

      - name: Commit hardened source and retire one-shot helpers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name ghezelbaash-release-bot
          git config user.email actions@users.noreply.github.com
          git add \
            .github/workflows/ceiling-release.yml \
            scripts/promote-release.mjs \
            scripts/zenodo_release.py \
            scripts/prepare-huggingface-distribution.mjs \
            scripts/verify-converged-stack.mjs \
            scripts/validate-release-contract.mjs \
            scripts/validate-source.mjs \
            src/content-source/100-rc099.html \
            public/_redirects
          git rm .github/workflows/final-semantic-hardening.yml scripts/final-hardening.py
          git commit -m "Harden final cross-platform entity convergence"
          git push origin HEAD:main

      - name: Reconcile physician-first metadata on published Zenodo versions
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN || secrets.ZENODO_ACCESS_TOKEN || secrets.ZENODO_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ZENODO_TOKEN:-}"
          echo "::add-mask::$ZENODO_TOKEN"
          python scripts/zenodo_release.py reconcile --record 21892769 --doi 10.5281/zenodo.21892769 --concept-doi 10.5281/zenodo.18765168 --version 1.1.1 --date 2026-08-11
          python scripts/zenodo_release.py reconcile --record 21905312 --doi 10.5281/zenodo.21905312 --concept-doi 10.5281/zenodo.18765168 --version 1.2.0 --date 2026-08-12

name: v1.2.2 one-shot RDFC-1.0 candidate repair

on:
  push:
    branches: [main]
    paths:
      - '.release/rdf-canonicalization-fix-request.json'

permissions:
  contents: write

env:
  CANDIDATE_BRANCH: release/v1.2.2-candidate
  PRE_PROMOTION_SHA: e097c9b435ab06dab7a5310e655f889e3321a787
  RDF_CANONIZE_VERSION: 5.0.0

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: release/v1.2.2-candidate
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Reset candidate to pre-promotion base
        run: |
          set -euo pipefail
          git reset --hard "$PRE_PROMOTION_SHA"
          test "$(node -p "require('./package.json').version")" = 1.2.1
      - name: Install exact RDFC-1.0 implementation
        run: |
          set -euo pipefail
          npm install --save-dev --save-exact rdf-canonize@5.0.0
          test "$(node -p "require('./node_modules/rdf-canonize/package.json').version")" = 5.0.0
      - name: Write deterministic RDF bridge
        run: |
          set -euo pipefail
          printf 'rdflib==7.1.4\npyparsing==3.3.2\n' > requirements-rdf.txt
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('package.json'); x=json.loads(p.read_text())
          x['scripts']['rdf:deps']='PYTHONPATH=.python-deps python -c "import rdflib" || python -m pip install --disable-pip-version-check --no-input --target .python-deps -r requirements-rdf.txt'
          x['scripts']['validate:rdf-reproducibility']='node scripts/validate-rdf-byte-repro.mjs'
          if 'validate:rdf-reproducibility' not in x['scripts']['release:prepare']:
              x['scripts']['release:prepare'] += ' && npm run validate:rdf-reproducibility'
          p.write_text(json.dumps(x, ensure_ascii=False, indent=2)+'\n')
          PY
          cat > scripts/canonicalize-rdf.mjs <<'EOF'
          import fs from 'node:fs';
          import rdfCanonize from 'rdf-canonize';
          const input=fs.readFileSync(0,'utf8');
          const output=await rdfCanonize.canonize(input,{algorithm:'RDFC-1.0',inputFormat:'application/n-quads',format:'application/n-quads',maxWorkFactor:3,rejectURDNA2015:true});
          process.stdout.write(output);
          EOF
          cat > scripts/generate-rdf.py <<'PY'
          from pathlib import Path
          from hashlib import sha256
          import json, subprocess
          from rdflib import Graph
          root=Path(__file__).resolve().parents[1]
          source=root/'src/data/semantic/knowledge-graph.jsonld'; target=root/'src/data/semantic/knowledge-graph.ttl'; lock_path=root/'src/data/semantic/rdf-lock.json'
          release=json.loads((root/'src/data/release.json').read_text(encoding='utf-8'))
          g=Graph(); g.parse(source,format='json-ld'); raw=g.serialize(format='nt')
          p=subprocess.run(['node',str(root/'scripts/canonicalize-rdf.mjs')],input=raw,text=True,stdout=subprocess.PIPE,stderr=subprocess.PIPE)
          if p.returncode: raise SystemExit('RDFC-1.0 canonicalization failed:\n'+p.stderr)
          text=p.stdout if p.stdout.endswith('\n') else p.stdout+'\n'; target.write_text(text,encoding='utf-8')
          check=Graph(); check.parse(target,format='nt')
          if len(check)!=len(g): raise SystemExit(f'RDF round-trip mismatch: source={len(g)} ttl={len(check)}')
          lock={'release':release['release'],'source':'src/data/semantic/knowledge-graph.jsonld','distribution':'src/data/semantic/knowledge-graph.ttl','triples':len(g),'jsonldSha256':sha256(source.read_bytes()).hexdigest(),'ttlSha256':sha256(target.read_bytes()).hexdigest(),'canonicalizedBlankNodes':True,'canonicalizationAlgorithm':'RDFC-1.0','canonicalizationLibrary':'rdf-canonize','canonicalizationLibraryVersion':'5.0.0','canonicalSyntax':'canonical-n-quads-default-graph-as-ntriples-compatible-turtle','generated':release['dateModified']}
          lock_path.write_text(json.dumps(lock,indent=2)+'\n',encoding='utf-8'); print(json.dumps(lock,indent=2))
          PY
          cat > scripts/validate-rdf-byte-repro.mjs <<'EOF'
          import fs from 'node:fs'; import crypto from 'node:crypto'; import {spawnSync} from 'node:child_process';
          const ttl='src/data/semantic/knowledge-graph.ttl', lock='src/data/semantic/rdf-lock.json';
          function run(){fs.rmSync(ttl,{force:true});fs.rmSync(lock,{force:true});const p=spawnSync('python',['scripts/generate-rdf.py'],{env:{...process.env,PYTHONPATH:'.python-deps'},encoding:'utf8'});if(p.status!==0)throw new Error(p.stderr);const b=fs.readFileSync(ttl);return {b,h:crypto.createHash('sha256').update(b).digest('hex')}}
          const a=run(),b=run();if(!a.b.equals(b.b))throw new Error(`RDF byte reproducibility failed: ${a.h} != ${b.h}`);console.log(JSON.stringify({rdfByteReproducibility:'PASS',sha256:a.h,bytes:a.b.length}));
          EOF
      - name: Prove repeated-process RDF byte identity
        run: |
          set -euo pipefail
          npm run rdf:deps
          npm run prepare:generated
          npm run validate:rdf-reproducibility
          node -e "const x=require('./src/data/semantic/rdf-lock.json');if(x.canonicalizationAlgorithm!=='RDFC-1.0'||x.canonicalizationLibrary!=='rdf-canonize')throw Error('RDF canonicalizer lock drift')"
      - name: Commit coherent repair to candidate
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package.json package-lock.json requirements-rdf.txt scripts/canonicalize-rdf.mjs scripts/generate-rdf.py scripts/validate-rdf-byte-repro.mjs .gitignore
          git diff --cached --check
          git commit -m 'Use RDFC-1.0 canonical RDF release bytes'
          git push --force-with-lease origin HEAD:$CANDIDATE_BRANCH

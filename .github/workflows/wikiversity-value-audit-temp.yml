name: Audit Wikiversity resource value
on:
  push:
    branches: [main]
    paths: ['.github/workflows/wikiversity-value-audit-temp.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check --no-input requests==2.32.5
      - name: Read-only live audit
        shell: python
        run: |
          import requests,json
          UA='Medicaldoctor91WikiversityValueAudit/1.0 (https://www.ghezelbaash.ir/)'
          s=requests.Session();s.headers['User-Agent']=UA
          def api(url,**p):
            p.update(format='json',formatversion=2)
            r=s.get(url,params=p,timeout=60);r.raise_for_status();d=r.json()
            if 'error' in d: raise RuntimeError(d['error'])
            return d
          WD='https://www.wikidata.org/w/api.php'; WV='https://en.wikiversity.org/w/api.php'
          ids=['Q140287622','Q141099455']
          ents=api(WD,action='wbgetentities',ids='|'.join(ids),props='labels|descriptions|claims|sitelinks|info')['entities']
          page=api(WV,action='query',prop='info|pageprops|revisions|categories|extlinks|links',titles='Botulinum toxin in aesthetic medicine',inprop='protection|displaytitle',rvprop='ids|timestamp|user|comment|size',rvlimit=5,cllimit=100,ellimit=100,pllimit=100)['query']['pages'][0]
          lh=api(WV,action='query',list='backlinks',bltitle='Botulinum toxin in aesthetic medicine',bllimit=500,blfilterredir='all')['query']['backlinks']
          what=api(WD,action='query',list='backlinks',bltitle='Q140287622',blnamespace=0,bllimit=500)['query']['backlinks']
          def val(st):
            v=st.get('mainsnak',{}).get('datavalue',{}).get('value')
            return v.get('id') if isinstance(v,dict) and 'id' in v else v
          out={
            'resource_item':{'id':'Q141099455','label':ents['Q141099455'].get('labels',{}).get('en',{}).get('value'),'description':ents['Q141099455'].get('descriptions',{}).get('en',{}).get('value'),'sitelinks':ents['Q141099455'].get('sitelinks',{}),'claims':{p:[val(x) for x in sts] for p,sts in ents['Q141099455'].get('claims',{}).items()}},
            'person_sitelinks':ents['Q140287622'].get('sitelinks',{}),
            'person_P3919':[val(x) for x in ents['Q140287622'].get('claims',{}).get('P3919',[])],
            'person_P800':[val(x) for x in ents['Q140287622'].get('claims',{}).get('P800',[])],
            'person_all_claims_pointing_resource':{p:[val(x) for x in sts] for p,sts in ents['Q140287622'].get('claims',{}).items() if 'Q141099455' in [val(x) for x in sts]},
            'wikiversity_page':{'pageid':page.get('pageid'),'title':page.get('title'),'length':page.get('length'),'lastrevid':page.get('lastrevid'),'pageprops':page.get('pageprops',{}),'protection':page.get('protection',[]),'categories':[x['title'] for x in page.get('categories',[])],'external_links':[x['url'] for x in page.get('extlinks',[])],'internal_link_count':len(page.get('links',[])),'recent_revisions':page.get('revisions',[])},
            'wikiversity_backlinks':lh,
            'wikidata_item_backlinks_to_person_count_first500':len(what)
          }
          print(json.dumps(out,ensure_ascii=False,indent=2))

name: Wikidata Batch 5 Zenodo lineage
on:
  push:
    branches: [audit/wikidata-batch1-20261016]
    paths: [.github/workflows/wikidata-batch2-finalize.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Resolve Zenodo records and DOI lineage
        shell: bash
        run: |
          python - <<'PY'
          import json,urllib.request,time
          UA='Q140287622-batch5-zenodo/1.0 (read-only)'
          ids=['18765169','22651268','22838416']
          out={}
          for rid in ids:
              url='https://zenodo.org/api/records/'+rid
              last=None
              for i in range(5):
                  try:
                      req=urllib.request.Request(url,headers={'User-Agent':UA,'Accept':'application/json'})
                      with urllib.request.urlopen(req,timeout=60) as r:x=json.load(r)
                      md=x.get('metadata',{});links=x.get('links',{})
                      out[rid]={
                        'id':x.get('id'),'doi':x.get('doi'),'conceptdoi':x.get('conceptdoi'),'conceptrecid':x.get('conceptrecid'),
                        'title':md.get('title'),'version':md.get('version'),'publication_date':md.get('publication_date'),
                        'resource_type':md.get('resource_type'),'creators':md.get('creators'),'description':md.get('description'),
                        'related_identifiers':md.get('related_identifiers'),'self':links.get('self'),'html':links.get('html')}
                      break
                  except Exception as e:
                      last=repr(e);time.sleep(2**i)
              else: out[rid]={'error':last}
          print(json.dumps(out,ensure_ascii=False,indent=2))
          print('ZENODO_LINEAGE_PASS')
          PY

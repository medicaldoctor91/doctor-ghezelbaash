name: Wikidata Batch 6 API-only finalizer
on:
  push:
    branches: [audit/wikidata-batch1-20261016]
    paths: [.github/workflows/wikidata-batch2-finalize.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Verify Batch 5 and publication graph from live API
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, urllib.parse, urllib.request, urllib.error, time
          API='https://www.wikidata.org/w/api.php'; Q='Q140287622'; UA='Q140287622-batch6-final/1.0 (read-only)'
          WORKS=['Q36942316','Q140298431','Q140306302','Q141099455','Q141131757','Q141129555']
          def api(p,retries=8):
              p={'format':'json','formatversion':'2',**p}; u=API+'?'+urllib.parse.urlencode(p); last=None
              for i in range(retries):
                  try:
                      req=urllib.request.Request(u,headers={'User-Agent':UA,'Accept':'application/json'})
                      with urllib.request.urlopen(req,timeout=60) as r:return json.load(r)
                  except urllib.error.HTTPError as e:
                      last=e
                      if e.code!=429: raise
                      time.sleep(min(16,2**i))
              raise last
          def val(s):
              if s.get('snaktype')!='value': return s.get('snaktype')
              v=s.get('datavalue',{}).get('value')
              if isinstance(v,dict) and 'id' in v:return v['id']
              if isinstance(v,dict) and 'text' in v:return {'text':v['text'],'language':v.get('language')}
              if isinstance(v,dict) and 'time' in v:return {'time':v['time'],'precision':v.get('precision')}
              return v
          def sval(s):
              v=val(s); return v if isinstance(v,str) else None
          e=api({'action':'wbgetentities','ids':Q,'props':'claims|info'})['entities'][Q]; c=e.get('claims',{})
          out={'lastrevid':e.get('lastrevid'),'modified':e.get('modified'),'batch5':{},'person':{},'works':{},'constraints':{}}
          # Batch 5 live assertions.
          imurl='https://www.imcas.com/en/profile/dr-saeed-ghezelbash'
          ims=[x for x in c.get('P973',[]) if sval(x['mainsnak'])==imurl]
          out['batch5']['imcas']=[{'guid':x['id'],'qualifiers':{p:[val(s) for s in ss] for p,ss in x.get('qualifiers',{}).items()}} for x in ims]
          p1325={sval(x['mainsnak']):x['id'] for x in c.get('P1325',[]) if sval(x['mainsnak'])}
          out['batch5']['p1325_values']=sorted(p1325)
          assert len(ims)==1 and 'Q1860' in [val(s) for s in ims[0].get('qualifiers',{}).get('P407',[])], 'IMCAS P407 not verified'
          assert 'https://doi.org/10.5281/zenodo.18765169' not in p1325, 'old v1.0.0 P1325 still present'
          assert 'https://zenodo.org/records/22651268' not in p1325, 'old v1.2.6 P1325 still present'
          assert 'https://doi.org/10.5281/zenodo.18765168' in p1325, 'concept DOI missing'
          assert 'https://doi.org/10.5281/zenodo.22838416' in p1325, 'current v1.3.3 DOI missing'
          # Exact current high-value properties.
          focus=['P31','P106','P69','P512','P1416','P463','P511','P10611','P937','P1830','P121','P800','P3919','P496','P10283','P1960','P4012','P1153','P2038','P856','P373']
          for p in focus:
              out['person'][p]=[{'guid':x['id'],'value':val(x['mainsnak']),'rank':x['rank'],'qualifiers':{qp:[val(s) for s in ss] for qp,ss in x.get('qualifiers',{}).items()},'refs':len(x.get('references',[]))} for x in c.get(p,[])]
          # Work items and reciprocal authorship.
          ents=api({'action':'wbgetentities','ids':'|'.join(WORKS),'props':'claims|labels|info'})['entities']
          for w in WORKS:
              x=ents[w]; wc=x.get('claims',{})
              out['works'][w]={
                'label':x.get('labels',{}).get('en',{}).get('value') or x.get('labels',{}).get('fa',{}).get('value'),
                'P50':[val(z['mainsnak']) for z in wc.get('P50',[])],
                'P356':[val(z['mainsnak']) for z in wc.get('P356',[])],
                'P698':[val(z['mainsnak']) for z in wc.get('P698',[])],
                'P577':[val(z['mainsnak']) for z in wc.get('P577',[])],
                'P1433':[val(z['mainsnak']) for z in wc.get('P1433',[])],
                'P921':[val(z['mainsnak']) for z in wc.get('P921',[])]}
          # Native constraints only.
          try:
              cc=api({'action':'wbcheckconstraints','id':Q,'status':'violation|warning|suggestion|bad-parameters','uselang':'en'})
              hits=[]
              def walk(x):
                  if isinstance(x,dict):
                      if isinstance(x.get('status'),str):hits.append({'status':x.get('status'),'property':x.get('property'),'claim':x.get('claim'),'message':x.get('message-html')})
                      for v in x.values():walk(v)
                  elif isinstance(x,list):
                      for v in x:walk(v)
              walk(cc);out['constraints']['hits']=hits
          except Exception as ex:out['constraints']['error']=repr(ex)
          # Deterministic flags.
          p3919={r['value'] for r in out['person']['P3919']}; p800={r['value'] for r in out['person']['P800']}
          flags=[]
          for w,d in out['works'].items():
              if Q not in d['P50']:flags.append({'type':'MISSING_P50','work':w})
              if Q in d['P50'] and w not in p3919:flags.append({'type':'MISSING_FORWARD_CONTRIBUTED_TO','work':w})
          out['flags']=flags
          print(json.dumps(out,ensure_ascii=False,indent=2,default=str))
          print('BATCH6_API_FINAL_PASS')
          PY

name: Wikidata Batch 5 semantic detail
on:
  push:
    branches: [audit/wikidata-batch1-20261016]
    paths: [.github/workflows/wikidata-batch2-finalize.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Inspect exact duplicate clusters and URL properties
        shell: bash
        run: |
          python - <<'PY'
          import json,urllib.parse,urllib.request,urllib.error,time
          API='https://www.wikidata.org/w/api.php';Q='Q140287622';UA='Q140287622-batch5-detail/1.0 (read-only)'
          def api(p,retries=7):
              p={'format':'json','formatversion':'2',**p};u=API+'?'+urllib.parse.urlencode(p);last=None
              for i in range(retries):
                  try:
                      req=urllib.request.Request(u,headers={'User-Agent':UA,'Accept':'application/json'})
                      with urllib.request.urlopen(req,timeout=60) as r:return json.load(r)
                  except urllib.error.HTTPError as e:
                      last=e
                      if e.code!=429:raise
                      time.sleep(min(15,2**i))
              raise last
          def val(s):
              if s.get('snaktype')!='value':return s.get('snaktype')
              v=s.get('datavalue',{}).get('value')
              if isinstance(v,dict) and 'id' in v:return v['id']
              if isinstance(v,dict) and 'text' in v:return {'text':v['text'],'language':v.get('language')}
              if isinstance(v,dict) and 'time' in v:return {'time':v['time'],'precision':v.get('precision')}
              return v
          e=api({'action':'wbgetentities','ids':Q,'props':'claims|info'})['entities'][Q];cs=e['claims']
          out={'lastrevid':e['lastrevid'],'clusters':{},'urls':{}}
          for p in ['P10611','P1416']:
              arr=[]
              for c in cs.get(p,[]):
                  arr.append({'guid':c['id'],'value':val(c['mainsnak']),'rank':c['rank'],'qualifiers':{qp:[val(s) for s in ss] for qp,ss in c.get('qualifiers',{}).items()},'references':[{rp:[val(s) for s in ss] for rp,ss in r.get('snaks',{}).items()} for r in c.get('references',[])]})
              out['clusters'][p]=arr
          for p in ['P973','P1325','P968']:
              arr=[]
              for c in cs.get(p,[]):
                  arr.append({'guid':c['id'],'value':val(c['mainsnak']),'rank':c['rank'],'qualifiers':{qp:[val(s) for s in ss] for qp,ss in c.get('qualifiers',{}).items()},'references':[{rp:[val(s) for s in ss] for rp,ss in r.get('snaks',{}).items()} for r in c.get('references',[])]})
              out['urls'][p]=arr
          # Fetch only current constraint suggestions, preserving enough structure to identify the statement/property.
          cc=api({'action':'wbcheckconstraints','id':Q,'status':'suggestion','uselang':'en'})
          out['constraint_suggestions']=cc
          print(json.dumps(out,ensure_ascii=False,indent=2,default=str))
          print('BATCH5_DETAIL_PASS')
          PY

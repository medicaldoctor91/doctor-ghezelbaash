name: Finalize Wikidata Batch 2
on:
  push:
    branches: [audit/wikidata-batch1-20261016]
    paths: [.github/workflows/wikidata-batch2-finalize.yml]
permissions:
  contents: read
jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Assert reversible scar relation and emit QS
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/b2final
          python - <<'PY'
          import json, urllib.parse, urllib.request, urllib.error, time
          API='https://www.wikidata.org/w/api.php'; Q='Q140287622'; SCAR='Q206060'
          UA='Q140287622-batch2-finalizer/1.0 (read-only)'
          def api(p,retries=7):
              p={'format':'json','formatversion':'2',**p}; u=API+'?'+urllib.parse.urlencode(p); last=None
              for i in range(retries):
                  try:
                      req=urllib.request.Request(u,headers={'User-Agent':UA,'Accept':'application/json'})
                      with urllib.request.urlopen(req,timeout=60) as r:return json.load(r)
                  except urllib.error.HTTPError as e:
                      last=e
                      if e.code!=429:raise
                      time.sleep(min(20,2**i))
              raise last
          def qid(s):
              v=s.get('datavalue',{}).get('value')
              return v.get('id') if isinstance(v,dict) else None
          e=api({'action':'wbgetentities','ids':Q,'props':'claims|info'})['entities'][Q]
          p101=e.get('claims',{}).get('P101',[])
          by_value={qid(c['mainsnak']):c for c in p101 if qid(c['mainsnak'])}
          assert SCAR in by_value, 'scar is not a current P101'
          scar_claim=by_value[SCAR]
          scar_uses={qid(s) for s in (scar_claim.get('qualifiers',{}).get('P2283',[]) or []) if qid(s)}
          forward=[]
          for c in p101:
              main=qid(c['mainsnak'])
              for s in (c.get('qualifiers',{}).get('P2175',[]) or []):
                  if qid(s)==SCAR: forward.append((main,c['id']))
          forward_values={v for v,g in forward}
          assert len(forward)==5, f'Expected exactly 5 P2175->scar qualifiers, got {len(forward)}: {forward}'
          assert forward_values==scar_uses, f'Forward/reverse relation mismatch: P2175={sorted(forward_values)} scar.P2283={sorted(scar_uses)}'
          # Native constraint checker must still flag the target typing problem; otherwise do not auto-normalize.
          cc=api({'action':'wbcheckconstraints','id':Q,'status':'violation|warning|suggestion|bad-parameters','uselang':'en'})
          blob=json.dumps(cc,ensure_ascii=False)
          assert SCAR in blob and 'P2175' in blob, 'Expected live P2175/scar constraint signal not present; aborting automatic proposal'
          lines=[f'REMOVE_QUAL|{Q}|P101|{v}|P2175|{SCAR}' for v in sorted(forward_values)]
          open('/tmp/b2final/Batch2_QS.txt','w').write('\n'.join(lines)+'\n')
          report={'lastrevid':e.get('lastrevid'),'scar_p101_guid':scar_claim['id'],'scar_reverse_P2283':sorted(scar_uses),'forward_P2175_scar':sorted([{'value':v,'guid':g} for v,g in forward],key=lambda x:x['value']),'invariant_exact_match':True,'proposed_action':'remove only redundant constraint-invalid P2175->scar qualifiers; retain P101 scar and reverse P2283 uses relations','quickstatements':lines}
          print(json.dumps(report,ensure_ascii=False,indent=2))
          print('BATCH2_FINALIZER_PASS')
          PY
      - name: Upload Batch 2 final QS
        uses: actions/upload-artifact@v4
        with:
          name: wikidata-batch2-final
          path: /tmp/b2final/*
          retention-days: 7

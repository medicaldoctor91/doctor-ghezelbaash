name: Wikidata SPARQL-discovered inverse edge check
on:
  push:
    branches: [audit/wikidata-batch1-20261016]
    paths: [.github/workflows/wikidata-batch2-finalize.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Inspect Q140307274 P710 and person P1344 via live API
        shell: bash
        run: |
          python - <<'PY'
          import json,urllib.parse,urllib.request
          API='https://www.wikidata.org/w/api.php'; UA='Q140287622-P710-inverse-check/1.0'
          def api(p):
              p={'format':'json','formatversion':'2',**p};u=API+'?'+urllib.parse.urlencode(p)
              req=urllib.request.Request(u,headers={'User-Agent':UA,'Accept':'application/json'})
              with urllib.request.urlopen(req,timeout=60) as r:return json.load(r)
          def val(s):
              if s.get('snaktype')!='value': return s.get('snaktype')
              v=s.get('datavalue',{}).get('value')
              if isinstance(v,dict) and 'id' in v:return v['id']
              if isinstance(v,dict) and 'time' in v:return {'time':v['time'],'precision':v.get('precision')}
              if isinstance(v,dict) and 'text' in v:return {'text':v['text'],'language':v.get('language')}
              return v
          ents=api({'action':'wbgetentities','ids':'Q140287622|Q140307274','props':'claims|labels|descriptions|info'})['entities']
          p=ents['Q140287622']; e=ents['Q140307274']
          p1344=[{'guid':c['id'],'value':val(c['mainsnak']),'rank':c['rank'],'qualifiers':{k:[val(s) for s in ss] for k,ss in c.get('qualifiers',{}).items()},'refs':[{k:[val(s) for s in ss] for k,ss in r.get('snaks',{}).items()} for r in c.get('references',[])]} for c in p.get('claims',{}).get('P1344',[])]
          p710=[]
          for c in e.get('claims',{}).get('P710',[]):
              if val(c['mainsnak'])=='Q140287622':
                  p710.append({'guid':c['id'],'rank':c['rank'],'qualifiers':{k:[val(s) for s in ss] for k,ss in c.get('qualifiers',{}).items()},'refs':[{k:[val(s) for s in ss] for k,ss in r.get('snaks',{}).items()} for r in c.get('references',[])]})
          out={'person_lastrevid':p.get('lastrevid'),'event_lastrevid':e.get('lastrevid'),'event_label':e.get('labels',{}).get('en',{}).get('value') or e.get('labels',{}).get('fa',{}).get('value'),'event_description':e.get('descriptions',{}).get('en',{}).get('value') or e.get('descriptions',{}).get('fa',{}).get('value'),'event_P31':[val(c['mainsnak']) for c in e.get('claims',{}).get('P31',[])],'event_P577':[val(c['mainsnak']) for c in e.get('claims',{}).get('P577',[])],'event_P710_target':p710,'person_P1344':p1344}
          print(json.dumps(out,ensure_ascii=False,indent=2))
          assert len(p710)==1,'Expected one P710 edge to person'
          print('P710_INVERSE_INSPECTION_PASS')
          PY

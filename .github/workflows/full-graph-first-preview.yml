name: Test the complete graph first on an isolated preview
on:
  workflow_dispatch:
    inputs:
      reviewed_commit: {type: string, required: true}
      mode:
        type: choice
        options: [experiment, restore]
        required: true
        default: experiment
permissions:
  contents: read
  actions: read
concurrency:
  group: doctor-ghezelbaash-publication
  cancel-in-progress: false
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      REVIEWED_COMMIT: ${{ inputs.reviewed_commit }}
      GIT_LFS_SKIP_SMUDGE: '1'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Require the exact reviewed controller
        run: test "$GITHUB_SHA" = "$REVIEWED_COMMIT"
      - run: python -m pip install requests
      - name: Record the exact current production and rollback baseline
        id: baseline
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python .github/scripts/full_graph_first_preview.py before
      - uses: actions/download-artifact@v4
        with:
          name: frozen-same-doi-correction
          run-id: 40120487161
          github-token: ${{ github.token }}
          path: /tmp/full-graph-input
      - name: Restore and verify the frozen published website
        run: |
          python - <<'PY'
          import tarfile
          from pathlib import PurePosixPath
          with tarfile.open('/tmp/full-graph-input/correction.tar.gz','r:gz') as archive:
              for member in archive.getmembers():
                  name=PurePosixPath(member.name)
                  assert not name.is_absolute() and '..' not in name.parts
                  assert member.isfile() or member.isdir()
              archive.extractall('/tmp',filter='data')
          PY
          python .github/scripts/full_graph_first_preview.py prepare --mode '${{ inputs.mode }}'
      - name: Verify experiment and rollback guards
        env:
          FULL_GRAPH_FROZEN_ROOT: /tmp/schema-distribution-correction
        run: python tests/full-graph-first-preview.test.py
      - uses: actions/upload-artifact@v4
        with:
          name: frozen-full-graph-first-preview
          path: /tmp/full-graph-first-preview/preview.tar.gz
          compression-level: 0
      - uses: actions/setup-node@v4
        with: {node-version-file: .nvmrc}
      - run: npm install --prefix /tmp/full-graph-preview-tools --no-save wrangler@4.152.0
      - name: Upload only the isolated experiment branch
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 884d1d90bd1fb6ecca14992c6c60d677
        run: python .github/scripts/full_graph_first_preview.py deploy
      - name: Verify production remained exactly at the rollback baseline
        if: always() && steps.baseline.outcome == 'success'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python .github/scripts/full_graph_first_preview.py after
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-graph-first-preview-evidence
          path: /tmp/full-graph-first-preview/evidence/*.json
          if-no-files-found: warn

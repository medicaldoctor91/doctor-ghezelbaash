name: Probe browser Places CORS v2

on:
  push:
    branches: [feat/static-reputation-authority-20260903]
    paths: [.github/workflows/probe-browser-cors-v2.yml]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Create browser probe
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          PLACE_ID: ChIJBT0YDOTt-j8RD-7mAPy6Zas
        run: |
          set -euo pipefail
          test -n "${GOOGLE_PLACES_API_KEY:-}"
          echo '::add-mask::'"$GOOGLE_PLACES_API_KEY"
          cat > /tmp/make-probe.mjs <<'NODE'
          import { writeFile } from "node:fs/promises";
          const key = JSON.stringify(process.env.GOOGLE_PLACES_API_KEY);
          const placeId = JSON.stringify(process.env.PLACE_ID);
          const html = `<!doctype html><html><meta charset="utf-8"><body data-state="pending"><output id="result"></output><script>
          (async()=>{
            const key=${key},placeId=${placeId};
            const url=new URL("https://places.googleapis.com/v1/places/"+encodeURIComponent(placeId));
            url.searchParams.set("languageCode","fa");
            url.searchParams.set("regionCode","IR");
            url.searchParams.set("fields","id,rating,userRatingCount,businessStatus,movedPlace,movedPlaceId");
            try {
              const response=await fetch(url,{headers:{Accept:"application/json","X-Goog-Api-Key":key},cache:"no-store"});
              const body=await response.json();
              const valid=response.status===200&&body.id===placeId&&body.businessStatus==="OPERATIONAL"&&Number.isFinite(body.rating)&&Number.isSafeInteger(body.userRatingCount);
              document.body.dataset.state=valid?"success":"failure";
              document.querySelector("#result").textContent=JSON.stringify({status:response.status,valid,rating:body.rating,userRatingCount:body.userRatingCount,error:body?.error?.status||null});
            } catch(error) {
              document.body.dataset.state="exception";
              document.querySelector("#result").textContent=JSON.stringify({name:error?.name||"Error",message:String(error?.message||error).slice(0,160)});
            }
          })();
          </script></html>`;
          await writeFile("/tmp/probe.html",html,"utf8");
          NODE
          node /tmp/make-probe.mjs
      - name: Execute browser probe
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --directory /tmp >/tmp/http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 1
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          "$chrome" --headless --no-sandbox --disable-gpu --virtual-time-budget=12000 --dump-dom http://127.0.0.1:8765/probe.html > /tmp/dom.html
          node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";
          const dom=await readFile("/tmp/dom.html","utf8");
          const state=dom.match(/<body[^>]*data-state="([^"]+)"/)?.[1]||"missing";
          const encoded=dom.match(/<output id="result">([\s\S]*?)<\/output>/)?.[1]||"";
          const result=encoded.replaceAll("&quot;",'"').replaceAll("&amp;","&");
          console.log(JSON.stringify({browserCorsState:state,result},null,2));
          if(state!=="success") process.exit(1);
          NODE

name: v1.2.2 support projection migration
on:
  push:
    branches: [release/v1.2.2-candidate]
    paths: [scripts/v122-filter-support.mjs, .github/workflows/v122-support-migration.yml]
permissions:
  contents: write
jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: true}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: 24.18.0}
      - run: node scripts/v122-filter-support.mjs
      - run: |
          set -euo pipefail
          git config user.name ghezelbaash-release-bot
          git config user.email actions@users.noreply.github.com
          git add src/data/semantic/support-ids.json
          git diff --cached --quiet && exit 0
          git commit -m "Separate live reputation from inline support graph"
          git push origin HEAD:release/v1.2.2-candidate

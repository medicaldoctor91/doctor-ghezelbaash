name: v1.2.2 release attestation closure simulation
on:
  push:
    branches: [release/v1.2.2-candidate]
    paths: [.github/workflows/v122-attestation-simulation.yml]
permissions:
  contents: read
jobs:
  simulate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false, fetch-depth: 0}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: 24.18.0, cache: npm}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: '3.12'}
      - run: npm ci --ignore-scripts
      - name: Prove frozen attestation survives terminal serving finalization
        shell: bash
        run: |
          set -euo pipefail
          node scripts/promote-release.mjs --version=1.2.2 --date=2026-08-14 --zenodo-record=99999999 --zenodo-doi=10.5281/zenodo.99999999
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)" CF_PAGES_COMMIT_SHA="$GITHUB_SHA" SOURCE_COMMIT="$GITHUB_SHA"
          npm run build
          find dist -type f -printf '%P\n' | LC_ALL=C sort | while read -r f; do sha256sum "dist/$f"; done > /tmp/dist.sha
          node scripts/write-release-attestation.mjs
          cp .release/runtime/release-attestation.json dist/release-attestation.json
          node scripts/finalize-v122-serving.mjs
          node scripts/validate-dist.mjs
          node - <<'NODE'
          const fs=require('fs'),c=require('crypto');const sha=f=>c.createHash('sha256').update(fs.readFileSync(f)).digest('hex');const a=JSON.parse(fs.readFileSync('.release/runtime/release-attestation.json'));const m=JSON.parse(fs.readFileSync('dist/artifact-manifest.json'));if(a.artifactManifestSha256!==sha('dist/artifact-manifest.json'))throw Error('Frozen release attestation manifest hash drift after terminal finalization');if(m.files['release-attestation.json'])throw Error('Current manifest circularly included frozen release attestation');if(!m.integrity.excluded.includes('release-attestation.json'))throw Error('Release attestation exclusion not declared');console.log('RELEASE_ATTESTATION_NON_CIRCULAR_PASS',a.artifactManifestSha256)
          NODE

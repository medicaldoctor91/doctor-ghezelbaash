name: Align verified website and dataset publication metadata
on:
  push:
    branches: [maintenance/platform-alignment-20261017]
    paths: [.github/workflows/platform-alignment.yml, .github/scripts/**, src/**, tests/**, build/**]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: doctor-ghezelbaash-platform-convergence
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.ref == 'refs/heads/maintenance/platform-alignment-20261017'
    env:
      EXPECTED_HF_REVISION: a9581d2a4ee204ffd716471af5078a57fa0414f9
      EXPECTED_KAGGLE_VERSION: '12'
      EXPECTED_WEBSITE_COMMIT: a1125c05f298cf10f1f171a1d8584bd8288ad33a
      WEBSITE_PUBLICATION_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      PUBLICATION_MAINTENANCE_DATE: '2026-10-17'
      HF_HUB_DISABLE_PROGRESS_BARS: '1'
      HF_TOKEN: ${{ secrets.HF_TOKEN || secrets.HUGGINGFACE_TOKEN || secrets.HUGGING_FACE_TOKEN }}
      ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN || secrets.ZENODO_ACCESS_TOKEN || secrets.ZENODO_API_TOKEN || secrets.ZENODO_API_KEY || secrets.ZENODO_PAT }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN || secrets.KAGGLE_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 884d1d90bd1fb6ecca14992c6c60d677
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version-file: .nvmrc, cache: npm}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Check existing publication credentials without exposing values
        run: |
          python - <<'PY'
          import os
          required=['HF_TOKEN','ZENODO_TOKEN','KAGGLE_API_TOKEN','CLOUDFLARE_API_TOKEN']
          missing=[k for k in required if not os.environ.get(k)]
          assert not missing, 'Missing existing credential bindings: '+str(missing)
          print('All four existing publication bindings are present')
          PY
      - name: Install locked build and publication dependencies
        run: |
          npm ci
          python -m pip install --disable-pip-version-check 'huggingface_hub==0.36.2' 'pyarrow==22.0.0' 'kaggle==2.2.4' 'rdflib==7.6.0' 'pyshacl==0.40.1' 'mlcroissant==1.1.1'
      - name: Validate actual RDF dates and build one canonical release
        run: |
          node --test tests/*.test.mjs
          python tests/platform-bundle-sync.test.py
          python tests/platform-publication.test.py
          npm run build
          python tests/validate_platform_bundle.py dist --no-query --rdf
          python tests/validate_machine_resources.py dist
          python -m py_compile .github/scripts/platform_bundle.py .github/scripts/platform_publish.py
      - name: Verify reviewed live versions before any publication
        run: |
          python - <<'PY'
          import json,os,pathlib,sys,urllib.request
          from huggingface_hub import HfApi,hf_hub_download
          sys.path.insert(0,'.github/scripts')
          import platform_publish as publication
          ctx=publication.context(os.environ['GITHUB_SHA'],os.environ['GITHUB_RUN_ID'],os.environ['PUBLICATION_MAINTENANCE_DATE'])
          revision=HfApi(token=os.environ['HF_TOKEN']).dataset_info(publication.HF_REPO).sha
          receipt=None
          if revision!=os.environ['EXPECTED_HF_REVISION']:
              path=hf_hub_download(publication.HF_REPO,filename='release-attestation.json',repo_type='dataset',revision=revision,token=os.environ['HF_TOKEN'])
              receipt=json.loads(pathlib.Path(path).read_text())
          resumed_hf=publication.guard_hf_publication(ctx,revision,os.environ['EXPECTED_HF_REVISION'],receipt)
          def read(url):
              request=urllib.request.Request(url,headers={'Cache-Control':'no-cache'})
              return json.load(urllib.request.urlopen(request,timeout=30))
          live=read('https://www.ghezelbaash.ir/release-provenance.json')
          assert live['sourceCommit'] in {os.environ['EXPECTED_WEBSITE_COMMIT'],os.environ['GITHUB_SHA']},'Website changed outside this publication'
          kaggle=read('https://www.kaggle.com/api/v1/datasets/view/saeedghezelbash/dr-saeed-ghezelbash-knowledge-graph-and-nlp-data')
          current=int(kaggle['currentVersionNumber']);expected=int(os.environ['EXPECTED_KAGGLE_VERSION'])
          manifest=publication.public_kaggle_manifest(current) if current!=expected else None
          resumed_kaggle=publication.guard_kaggle_publication(ctx,current,expected,manifest,revision)
          print('Reviewed live versions or exact same-run publications verified; resume:',resumed_hf,resumed_kaggle)
          PY
      - name: Deploy the verified complete canonical distribution
        run: |
          npx --yes wrangler@4 pages deploy dist --project-name=doctor-ghezelbaash --branch=main --commit-hash="$GITHUB_SHA" --commit-message='Align DOI roles, release metadata and measured dataset counts' --commit-dirty=false
          python - <<'PY'
          import hashlib,json,os,time,urllib.request
          from pathlib import Path
          for attempt in range(24):
              req=urllib.request.Request('https://www.ghezelbaash.ir/release-provenance.json?verify='+os.environ['GITHUB_SHA']+'-'+str(attempt),headers={'Cache-Control':'no-cache'})
              live=json.load(urllib.request.urlopen(req,timeout=30))
              if live.get('sourceCommit')==os.environ['GITHUB_SHA']:break
              time.sleep(5)
          else:raise RuntimeError('Website current commit did not converge')
          for name in ['graph.jsonld','provenance.jsonld','integrity-manifest.json']:
              req=urllib.request.Request('https://www.ghezelbaash.ir/'+name,headers={'Cache-Control':'no-cache'})
              body=urllib.request.urlopen(req,timeout=30).read()
              assert hashlib.sha256(body).digest()==hashlib.sha256((Path('dist')/name).read_bytes()).digest(),name
          print('Actual website bytes verified against this build')
          PY
      - name: Publish complete HF, correct both existing Zenodo records and update Kaggle
        run: python .github/scripts/platform_publish.py
      - name: Save public publication evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: platform-alignment-evidence
          path: |
            /tmp/platform-publish/context.json
            /tmp/platform-publish/publication-report.json
          if-no-files-found: warn
          overwrite: true

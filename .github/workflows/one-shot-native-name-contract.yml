name: One-shot native name contract repair

on:
  push:
    branches: [audit/google-structured-data-2026-08-29]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: audit/google-structured-data-2026-08-29
          persist-credentials: true
      - name: Align DIST validator with native JSON-LD scalar contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/validate-dist.mjs')
          s=p.read_text()
          old="coreClinicNames.length!==1||coreClinicNames[0]?.['@language']!=='fa'||coreClinicNames[0]?.['@value']!=='کلینیک زیبایی دکتر سعید قزلباش'||coreClinicImages.length<6"
          new="coreClinicNames.length!==1||coreClinicNames[0]!=='کلینیک زیبایی دکتر سعید قزلباش'||coreClinicImages.length<6"
          if old not in s and new not in s:
              raise SystemExit('native-name validator anchor missing')
          p.write_text(s.replace(old,new))
          PY
      - name: Commit validator-only repair
        shell: bash
        run: |
          if git diff --quiet -- scripts/validate-dist.mjs; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- scripts/validate-dist.mjs
          git commit -m 'test: align DIST organization name with native scalar projection'
          git push origin HEAD:audit/google-structured-data-2026-08-29

name: Temporary ORCID alias audit
on:
  push:
    branches: [main]
    paths: ['.github/workflows/_tmp-orcid-alias-audit.yml']
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check --no-input requests==2.32.5
      - name: Fetch ORCID and Wikidata name surfaces
        shell: bash
        run: |
          python - <<'PY'
          import requests,json,os
          H={'User-Agent':'GhezelbaashOrcidAliasAudit/1.0 (https://www.ghezelbaash.ir/)'}
          r=requests.get('https://pub.orcid.org/v3.0/0009-0001-9346-8475/person',headers={**H,'Accept':'application/json'},timeout=60)
          out={'orcid_status':r.status_code}
          if r.status_code==200:
            d=r.json(); n=d.get('name',{})
            out['orcid_name']={'given':(n.get('given-names') or {}).get('value'),'family':(n.get('family-name') or {}).get('value'),'credit':(n.get('credit-name') or {}).get('value')}
            out['orcid_other_names']=[x.get('content') for x in d.get('other-names',{}).get('other-name',[])]
          wd=requests.get('https://www.wikidata.org/wiki/Special:EntityData/Q140287622.json',headers=H,timeout=60).json()['entities']['Q140287622']
          out['wikidata_aliases']={lang:[a.get('value') for a in vals] for lang,vals in wd.get('aliases',{}).items() if lang in ['en','fa']}
          out['wikidata_labels']={lang:v.get('value') for lang,v in wd.get('labels',{}).items() if lang in ['en','fa']}
          os.makedirs('wikimedia',exist_ok=True)
          open('wikimedia/_tmp-orcid-alias-audit.json','w',encoding='utf8').write(json.dumps(out,ensure_ascii=False,indent=2))
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - name: Commit audit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add wikimedia/_tmp-orcid-alias-audit.json
          git commit -m 'Record temporary ORCID alias audit'
          git push

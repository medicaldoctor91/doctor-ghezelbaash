name: Validate aggregate rating restoration

on:
  push:
    branches:
      - seo/restore-aggregate-rating-167

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Assert rating and SEO invariants
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/index.html
          grep -Fq 'itemprop="aggregateRating"' dist/index.html
          grep -Fq 'itemtype="https://schema.org/AggregateRating"' dist/index.html
          grep -Fq 'itemprop="reviewCount" content="167"' dist/index.html
          grep -Fq 'itemprop="ratingValue" content="5"' dist/index.html
          grep -Fq 'https://schema.org/ProfilePage' dist/index.html
          grep -Fq 'https://schema.org/Person' dist/index.html
          grep -Fq 'rel="canonical"' dist/index.html
          ! grep -Fq "Iran's #1 doctor" dist/index.html
          ! grep -Fq 'highest patient satisfaction' dist/index.html

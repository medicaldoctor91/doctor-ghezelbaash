name: Finalization deployment audit

on:
  push:
    branches: [codex/finalize-machine-delivery]
    paths:
      - ".github/workflows/finalization-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EXPECTED_DATASET_IRI: https://www.ghezelbaash.ir/graph.jsonld/dataset
      HISTORICAL_DATASET_IRI: https://www.ghezelbaash.ir/graph.jsonld#dataset
      HF_REPO: doctor-ghezelbaash/dr-saeid-ghezelbaash-entity-data
      ZENODO_RECORD: "22838416"
      ZENODO_DOI: 10.5281/zenodo.22838416
      CLOUDFLARE_ACCOUNT_ID: 884d1d90bd1fb6ecca14992c6c60d677
      CLOUDFLARE_PROJECT: doctor-ghezelbaash
      HF_TOKEN: ${{ secrets.HF_TOKEN || secrets.HUGGINGFACE_TOKEN || secrets.HUGGING_FACE_TOKEN }}
      ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN || secrets.ZENODO_ACCESS_TOKEN || secrets.ZENODO_API_TOKEN || secrets.ZENODO_API_KEY || secrets.ZENODO_PAT }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Audit current public authorities without mutation
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          echo "::add-mask::$CLOUDFLARE_API_TOKEN"
          if [ -n "${HF_TOKEN:-}" ]; then echo "::add-mask::$HF_TOKEN"; fi
          if [ -n "${ZENODO_TOKEN:-}" ]; then echo "::add-mask::$ZENODO_TOKEN"; fi
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error, hashlib

          expected=os.environ['EXPECTED_DATASET_IRI']
          historical=os.environ['HISTORICAL_DATASET_IRI']
          hf_repo=os.environ['HF_REPO']
          record=os.environ['ZENODO_RECORD']
          doi=os.environ['ZENODO_DOI']
          cf_account=os.environ['CLOUDFLARE_ACCOUNT_ID']
          cf_project=os.environ['CLOUDFLARE_PROJECT']
          hf_token=os.environ.get('HF_TOKEN','')
          zen_token=os.environ.get('ZENODO_TOKEN','')
          cf_token=os.environ['CLOUDFLARE_API_TOKEN']

          def get(url, token=None, accept='application/json'):
              headers={'User-Agent':'ghezelbaash-consistency-audit/1.0','Accept':accept,'Cache-Control':'no-cache'}
              if token:
                  headers['Authorization']=f'Bearer {token}'
              req=urllib.request.Request(url,headers=headers)
              try:
                  with urllib.request.urlopen(req,timeout=90) as r:
                      return r.status,r.read(),dict(r.headers)
              except urllib.error.HTTPError as e:
                  return e.code,e.read(),dict(e.headers)

          def text_stats(data):
              s=data.decode('utf-8','replace')
              return {'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest(),'expectedIriCount':s.count(expected),'historicalIriCount':s.count(historical)}

          out={'expectedDatasetIri':expected,'historicalDatasetIri':historical,'githubSha':os.environ.get('GITHUB_SHA')}

          # Live website identity.
          st,body,_=get('https://www.ghezelbaash.ir/graph.jsonld',accept='application/ld+json, application/json;q=0.9')
          live={'http':st,**text_stats(body)}
          if st==200:
              graph=json.loads(body)
              ids=[n.get('@id') for n in graph.get('@graph',[]) if isinstance(n,dict)]
              live['datasetNodePresent']=expected in ids
              live['historicalDatasetNodePresent']=historical in ids
          out['websiteGraph']=live
          st,body,_=get('https://www.ghezelbaash.ir/release-provenance.json')
          prov={'http':st,**text_stats(body)}
          if st==200:
              p=json.loads(body); prov['sourceCommit']=p.get('sourceCommit')
          out['websiteProvenance']=prov

          # Hugging Face current main.
          st,body,_=get(f'https://huggingface.co/api/datasets/{hf_repo}', token=hf_token or None)
          hf={'apiHttp':st}
          if st==200:
              info=json.loads(body); hf['sha']=info.get('sha'); hf['id']=info.get('id')
              for name in ('README.md','dist-sha256.json','graph.jsonld','croissant.json'):
                  fs,fb,_=get(f'https://huggingface.co/datasets/{hf_repo}/resolve/main/{name}?download=true', token=hf_token or None, accept='*/*')
                  hf[name]={'http':fs,**text_stats(fb)}
                  if fs==200 and name.endswith('.json'):
                      try:
                          doc=json.loads(fb)
                          if name=='dist-sha256.json' and isinstance(doc,dict):
                              hf[name]['canonicalDatasetIri']=doc.get('canonicalDatasetIri')
                              hf[name]['zenodoVersionDoi']=doc.get('zenodoVersionDoi')
                      except Exception:
                          pass
          out['huggingFace']=hf

          # Zenodo published record and selected files.
          st,body,_=get(f'https://zenodo.org/api/records/{record}', token=zen_token or None)
          zen={'apiHttp':st}
          if st==200:
              z=json.loads(body); meta=z.get('metadata') or {}
              zen.update({'id':z.get('id'),'doi':z.get('doi'),'version':meta.get('version'),'title':meta.get('title')})
              meta_bytes=json.dumps(meta,ensure_ascii=False,sort_keys=True).encode()
              zen['metadata']={**text_stats(meta_bytes)}
              rel=meta.get('related_identifiers') or []
              zen['relatedIdentifiers']=[{'identifier':x.get('identifier'),'relation':x.get('relation'),'scheme':x.get('scheme')} for x in rel if isinstance(x,dict)]
              keys=[x.get('key') for x in z.get('files',[]) if isinstance(x,dict)]
              zen['fileCount']=len(keys); zen['selectedFiles']={}
              for name in ('dist-sha256.json','release-attestation.json','graph.jsonld','README.md'):
                  if name not in keys: continue
                  fs,fb,_=get(f'https://zenodo.org/api/records/{record}/files/{name}/content', token=zen_token or None, accept='*/*')
                  zen['selectedFiles'][name]={'http':fs,**text_stats(fb)}
                  if fs==200 and name=='dist-sha256.json':
                      try:
                          doc=json.loads(fb)
                          if isinstance(doc,dict):
                              zen['selectedFiles'][name]['canonicalDatasetIri']=doc.get('canonicalDatasetIri')
                              zen['selectedFiles'][name]['zenodoVersionDoi']=doc.get('zenodoVersionDoi')
                      except Exception: pass
          out['zenodo']=zen

          # Cloudflare Pages project/deployment identity.
          base=f'https://api.cloudflare.com/client/v4/accounts/{cf_account}/pages/projects/{cf_project}'
          st,body,_=get(base,token=cf_token)
          cf={'apiHttp':st}
          if st==200:
              payload=json.loads(body); result=payload.get('result') or {}
              canonical=result.get('canonical_deployment') or {}
              trigger=(canonical.get('deployment_trigger') or {}).get('metadata') or {}
              cf['buildConfig']=result.get('build_config')
              cf['sourceConfig']=(result.get('source') or {}).get('config')
              cf.update({'success':payload.get('success'),'productionBranch':result.get('production_branch'),'domains':result.get('domains'),'canonicalDeploymentId':canonical.get('id'),'canonicalEnvironment':canonical.get('environment'),'canonicalCommitHash':trigger.get('commit_hash'),'canonicalBranch':trigger.get('branch'),'latestStage':canonical.get('latest_stage')})
          out['cloudflare']=cf

          # Decision summary: only identity/canonical drifts that can split authority.
          harmful=[]
          if out['websiteGraph'].get('http')!=200 or not out['websiteGraph'].get('datasetNodePresent') or out['websiteGraph'].get('historicalDatasetNodePresent'):
              harmful.append('website-dataset-identity')
          if hf.get('apiHttp')!=200:
              harmful.append('huggingface-unreadable')
          else:
              for n,v in hf.items():
                  if isinstance(v,dict) and v.get('historicalIriCount',0)>0 and v.get('expectedIriCount',0)==0:
                      harmful.append(f'huggingface-{n}-historical-dataset-iri')
          if zen.get('apiHttp')!=200:
              harmful.append('zenodo-unreadable')
          elif zen.get('doi')!=doi:
              harmful.append('zenodo-doi-mismatch')
          else:
              if zen.get('metadata',{}).get('historicalIriCount',0)>0 and zen.get('metadata',{}).get('expectedIriCount',0)==0:
                  harmful.append('zenodo-metadata-historical-dataset-iri')
          if cf.get('apiHttp')!=200 or cf.get('productionBranch')!='main' or cf.get('canonicalEnvironment')!='production':
              harmful.append('cloudflare-production-contract')
          out['harmfulContradictions']=harmful
          os.makedirs("release",exist_ok=True)
          open("release/external-audit.json","w").write(json.dumps(out,ensure_ascii=False,indent=2,sort_keys=True)+"\n")
          print(json.dumps(out,ensure_ascii=False,indent=2,sort_keys=True))
          PY

      - name: Retain read-only audit report
        uses: actions/upload-artifact@v4
        with:
          name: finalization-external-audit
          path: release/external-audit.json
          if-no-files-found: error
          retention-days: 7

      - name: Fetch the existing verified main release for delivery preview
        uses: actions/download-artifact@v4
        with:
          name: v2-dist-932c9deaa9c6e3d348e64b6d513e5bef8173f724
          run-id: 37952769155
          github-token: ${{ github.token }}
          path: baseline

      - name: Preview the sealed baseline without changing production
        run: npx --yes wrangler@4.149.0 pages deploy baseline/dist --project-name=doctor-ghezelbaash --branch=finalization-verification --commit-hash=932c9deaa9c6e3d348e64b6d513e5bef8173f724 --commit-dirty=false

      - name: Verify preview bytes and live response contracts
        run: node infrastructure/verify-live.mjs baseline/dist https://finalization-verification.doctor-ghezelbaash.pages.dev

name: Temporary maximum-benefit summary audit
on:
  push:
    branches: [main]
    paths: ['.github/workflows/_tmp-max-benefit-summary.yml']
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check --no-input requests==2.32.5
      - name: Build compact live summary
        shell: bash
        run: |
          python - <<'PY'
          import requests,json,os
          s=requests.Session(); s.headers.update({'User-Agent':'GhezelbaashMaxBenefitSummary/1.0 (https://www.ghezelbaash.ir/)'})
          out={}
          # Wikidata person resource relation details incl qualifiers
          ent=s.get('https://www.wikidata.org/wiki/Special:EntityData/Q140287622.json',timeout=45).json()['entities']['Q140287622']
          rel=[]
          for c in ent.get('claims',{}).get('P3919',[]):
            v=c.get('mainsnak',{}).get('datavalue',{}).get('value',{}).get('id')
            if v=='Q141099455':
              quals={p:[sn.get('datavalue',{}).get('value',{}).get('id') if isinstance(sn.get('datavalue',{}).get('value'),dict) else sn.get('datavalue',{}).get('value') for sn in xs] for p,xs in c.get('qualifiers',{}).items()}
              refs=[]
              for r in c.get('references',[]):
                rr={}
                for p,xs in r.get('snaks',{}).items():
                  rr[p]=[]
                  for sn in xs:
                    dv=sn.get('datavalue',{}).get('value')
                    if isinstance(dv,dict): dv=dv.get('id') or dv.get('text') or dv.get('time') or dv
                    rr[p].append(dv)
                refs.append(rr)
              rel.append({'value':v,'rank':c.get('rank'),'qualifiers':quals,'references':refs})
          out['person_to_wikiversity_P3919']=rel
          out['person_P800']=[c.get('mainsnak',{}).get('datavalue',{}).get('value',{}).get('id') for c in ent.get('claims',{}).get('P800',[])]
          # Wikiversity preprint metadata / item
          V='https://en.wikiversity.org/w/api.php'; title='WikiJournal Preprints/Individualized clinical assessment and outcome interpretation in aesthetic botulinum neurotoxin type A treatment: a focused review'
          p=s.get(V,params={'action':'query','format':'json','formatversion':2,'titles':title,'prop':'info|pageprops|revisions','rvprop':'ids|timestamp|user|comment','rvlimit':3},timeout=45).json()['query']['pages'][0]
          out['wikijournal_preprint']={'pageid':p.get('pageid'),'title':p.get('title'),'touched':p.get('touched'),'pageprops':p.get('pageprops'),'revisions':p.get('revisions',[])}
          # OpenAlex
          oa=s.get('https://api.openalex.org/authors/A5064828898',timeout=45).json()
          out['openalex']={'id':oa.get('id'),'display_name':oa.get('display_name'),'orcid':oa.get('orcid'),'works_count':oa.get('works_count'),'cited_by_count':oa.get('cited_by_count'),'h_index':oa.get('summary_stats',{}).get('h_index'),'updated_date':oa.get('updated_date'),'alternatives':oa.get('display_name_alternatives')}
          # Semantic Scholar corrected call
          r=s.get('https://api.semanticscholar.org/graph/v1/author/3786699',params={'fields':'name,url,externalIds,paperCount,citationCount,hIndex,papers.title,papers.year,papers.externalIds'},timeout=45)
          out['semantic_scholar']={'status':r.status_code,'data':(r.json() if r.headers.get('content-type','').startswith('application/json') else r.text[:1000])}
          # Crossref exact author metadata
          for doi in ['10.4103/2008-7802.182734','10.3390/healthcare9091169']:
            m=s.get('https://api.crossref.org/works/'+doi,timeout=45).json()['message']
            out['crossref_'+doi]={'deposited':m.get('deposited',{}).get('date-time'),'indexed':m.get('indexed',{}).get('date-time'),'authors':[{'given':a.get('given'),'family':a.get('family'),'ORCID':a.get('ORCID'),'authenticated':a.get('authenticated-orcid'),'affiliation':a.get('affiliation')} for a in m.get('author',[]) if (a.get('family') or '').lower()=='ghezelbash']}
          # ORCID public
          r=s.get('https://pub.orcid.org/v3.0/0009-0001-9346-8475/record',headers={'Accept':'application/json'},timeout=45)
          if r.status_code==200:
            d=r.json(); person=d.get('person',{}); nm=person.get('name',{})
            urls=person.get('researcher-urls',{}).get('researcher-url',[])
            ext=person.get('external-identifiers',{}).get('external-identifier',[])
            acts=d.get('activities-summary',{}).get('works',{}).get('group',[])
            works=[]
            for g in acts:
              s0=(g.get('work-summary') or [{}])[0]
              titlev=((s0.get('title') or {}).get('title') or {}).get('value')
              eids=[]
              for eid in g.get('external-ids',{}).get('external-id',[]): eids.append((eid.get('external-id-type'),eid.get('external-id-value')))
              works.append({'title':titlev,'external_ids':eids,'type':s0.get('type'),'source':((s0.get('source') or {}).get('source-name') or {}).get('value')})
            out['orcid']={'status':200,'name':{'given':(nm.get('given-names') or {}).get('value'),'family':(nm.get('family-name') or {}).get('value'),'credit':(nm.get('credit-name') or {}).get('value')},'urls':[{'name':u.get('url-name'),'url':(u.get('url') or {}).get('value')} for u in urls],'external_ids':[{'type':x.get('external-id-type'),'value':x.get('external-id-value')} for x in ext],'works':works}
          else: out['orcid']={'status':r.status_code,'text':r.text[:1000]}
          # Zenodo canonical record
          z=s.get('https://zenodo.org/api/records/21930954',timeout=45)
          if z.status_code==200:
            d=z.json(); md=d.get('metadata',{})
            out['zenodo']={'status':200,'id':d.get('id'),'doi':d.get('doi'),'title':md.get('title'),'version':md.get('version'),'creators':md.get('creators'),'related_identifiers':md.get('related_identifiers'),'resource_type':md.get('resource_type'),'publication_date':md.get('publication_date')}
          else: out['zenodo']={'status':z.status_code,'text':z.text[:1000]}
          os.makedirs('wikimedia',exist_ok=True)
          open('wikimedia/_tmp-max-benefit-summary.json','w',encoding='utf8').write(json.dumps(out,ensure_ascii=False,indent=2))
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - name: Commit compact summary
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add wikimedia/_tmp-max-benefit-summary.json
          git commit -m 'Record temporary maximum-benefit summary'
          git push

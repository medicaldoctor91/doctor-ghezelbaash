name: v1.2.2 mobile performance diagnostics
on:
  push:
    branches: [main]
    paths: [.github/workflows/v122-performance-diagnostic.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: 24.18.0}
      - name: Capture detailed Lighthouse mobile diagnostics
        shell: bash
        run: |
          set -euo pipefail
          URL="https://www.ghezelbaash.ir/?__lh_diag=$(date +%s%N)"
          npx --yes lighthouse@13.4.1 "$URL" --quiet --chrome-flags='--headless --no-sandbox --disable-gpu' --output=json --output-path=/tmp/lh.json
          node - <<'NODE'
          const fs=require('fs'),j=JSON.parse(fs.readFileSync('/tmp/lh.json')),a=j.audits;
          const ids=['mainthread-work-breakdown','bootup-time','long-tasks','dom-size','render-blocking-insight','forced-reflow-insight','lcp-breakdown-insight','network-dependency-tree-insight','third-parties-insight','legacy-javascript-insight','unused-javascript','unused-css-rules','total-byte-weight','network-requests','diagnostics','largest-contentful-paint-element','critical-request-chains'];
          console.log('PERF_SCORE',Math.round(j.categories.performance.score*100));
          for(const id of ids){const x=a[id];if(!x)continue;const out={id,title:x.title,score:x.score,numericValue:x.numericValue,numericUnit:x.numericUnit,displayValue:x.displayValue,details:x.details};console.log('AUDIT',JSON.stringify(out));}
          const timing=j.timing||{};console.log('LH_TIMING',JSON.stringify(timing));
          NODE

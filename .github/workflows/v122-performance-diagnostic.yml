name: v1.2.2 mobile performance diagnostics
on:
  push:
    branches: [main]
    paths: [.github/workflows/v122-performance-diagnostic.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: 24.18.0}
      - name: Capture detailed Lighthouse mobile diagnostics
        shell: bash
        run: |
          set -euo pipefail
          URL="https://www.ghezelbaash.ir/?__lh_diag=$(date +%s%N)"
          npx --yes lighthouse@13.4.1 "$URL" --quiet --chrome-flags='--headless --no-sandbox --disable-gpu' --output=json --output-path=/tmp/lh.json
          node - <<'NODE'
          const fs=require('fs'),j=JSON.parse(fs.readFileSync('/tmp/lh.json')),a=j.audits;
          console.log('PERF_METRICS',JSON.stringify({score:Math.round(j.categories.performance.score*100),fcp:a['first-contentful-paint']?.numericValue,lcp:a['largest-contentful-paint']?.numericValue,tbt:a['total-blocking-time']?.numericValue,cls:a['cumulative-layout-shift']?.numericValue,speedIndex:a['speed-index']?.numericValue,interactive:a['interactive']?.numericValue}));
          const ids=['mainthread-work-breakdown','bootup-time','long-tasks','dom-size-insight','slow-css-selector-insight','render-blocking-insight','forced-reflow-insight','lcp-breakdown-insight','network-dependency-tree-insight','third-parties-insight','total-byte-weight','diagnostics'];
          for(const id of ids){const x=a[id];if(!x)continue;console.log('AUDIT',JSON.stringify({id,title:x.title,score:x.score,numericValue:x.numericValue,numericUnit:x.numericUnit,displayValue:x.displayValue,details:x.details}));}
          NODE

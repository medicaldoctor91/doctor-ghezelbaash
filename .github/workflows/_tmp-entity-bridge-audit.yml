name: Temporary entity bridge audit
on:
  push:
    branches: [main]
    paths: ['.github/workflows/_tmp-entity-bridge-audit.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check --no-input requests==2.32.5
      - name: Read live Wikidata and Wikisource state
        shell: bash
        run: |
          python - <<'PY'
          import json, requests
          s=requests.Session(); s.headers.update({'User-Agent':'GhezelbaashBridgeAudit/1.0 (https://www.ghezelbaash.ir/)'})
          def ent(q):
            u=f'https://www.wikidata.org/wiki/Special:EntityData/{q}.json'
            r=s.get(u,headers={'Cache-Control':'no-cache'},timeout=60); r.raise_for_status(); return r.json()['entities'][q]
          def compact(e):
            claims={}
            for p,cs in e.get('claims',{}).items():
              vals=[]
              for c in cs:
                try:
                  v=c['mainsnak']['datavalue']['value']
                  if isinstance(v,dict) and 'id' in v: v=v['id']
                  vals.append(v)
                except Exception: pass
              claims[p]=vals
            return {'id':e['id'],'labels':{k:v['value'] for k,v in e.get('labels',{}).items() if k in ['en','en-us','fa','mul']},'claims':claims,'sitelinks':{k:v['title'] for k,v in e.get('sitelinks',{}).items()}}
          entities={q:compact(ent(q)) for q in ['Q140287622','Q140288589','Q140304972','Q140298431','Q36942316','Q140306302']}
          api='https://en.wikisource.org/w/api.php'
          def page(title):
            p={'action':'query','prop':'revisions','rvprop':'ids|timestamp|content','rvslots':'main','titles':title,'format':'json','formatversion':2}
            r=s.get(api,params=p,timeout=60); r.raise_for_status(); pg=r.json()['query']['pages'][0]
            rev=(pg.get('revisions') or [{}])[0]
            return {'title':title,'pageid':pg.get('pageid'),'missing':pg.get('missing',False),'revid':rev.get('revid'),'timestamp':rev.get('timestamp'),'content':rev.get('slots',{}).get('main',{}).get('content')}
          pages={t:page(t) for t in ['Author:Mohammad Saeed Ghezelbash','Author talk:Mohammad Saeed Ghezelbash']}
          print(json.dumps({'entities':entities,'wikisource':pages},ensure_ascii=False,indent=2,sort_keys=True))
          PY

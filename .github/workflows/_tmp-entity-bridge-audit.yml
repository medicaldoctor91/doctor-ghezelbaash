name: Temporary entity bridge audit
on:
  push:
    branches: [main]
    paths: ['.github/workflows/_tmp-entity-bridge-audit.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check --no-input requests==2.32.5
      - name: Check Wikisource index backlinks and Wikiversity matches
        shell: bash
        run: |
          python - <<'PY'
          import json, requests
          s=requests.Session(); s.headers.update({'User-Agent':'GhezelbaashDiscoverabilityAudit/1.0 (https://www.ghezelbaash.ir/)'})
          ws='https://en.wikisource.org/w/api.php'
          title='Author:Mohammad Saeed Ghezelbash'
          p={'action':'query','list':'backlinks','bltitle':title,'bllimit':'max','format':'json','formatversion':2}
          r=s.get(ws,params=p,timeout=60); r.raise_for_status(); backlinks=r.json()['query']['backlinks']
          p={'action':'query','list':'search','srsearch':'"Mohammad Saeed Ghezelbash"','srnamespace':4,'srlimit':50,'format':'json','formatversion':2}
          r=s.get(ws,params=p,timeout=60); r.raise_for_status(); project_search=r.json()['query']['search']
          p={'action':'query','list':'allpages','apnamespace':4,'apprefix':'Authors-G','aplimit':'max','format':'json','formatversion':2}
          r=s.get(ws,params=p,timeout=60); r.raise_for_status(); author_index_pages=r.json()['query']['allpages']
          index_contents={}
          for x in author_index_pages:
            t=x['title']; q={'action':'query','prop':'revisions','rvprop':'content','rvslots':'main','titles':t,'format':'json','formatversion':2}
            rr=s.get(ws,params=q,timeout=60); rr.raise_for_status(); pg=rr.json()['query']['pages'][0]
            content=((pg.get('revisions') or [{}])[0].get('slots',{}).get('main',{}).get('content') or '')
            if 'Ghezelbash' in content or 'Ghezelbaash' in content: index_contents[t]=content
          wv='https://en.wikiversity.org/w/api.php'
          searches={}
          for term in ['Saeed Ghezelbash','Mohammad Saeed Ghezelbash','Ghezelbaash']:
            q={'action':'query','list':'search','srsearch':term,'srlimit':50,'format':'json','formatversion':2}
            rr=s.get(wv,params=q,timeout=60); rr.raise_for_status(); searches[term]=rr.json()['query']['search']
          print(json.dumps({'wikisource_backlinks':backlinks,'wikisource_project_search':project_search,'wikisource_author_index_pages_with_name':index_contents,'wikiversity_search':searches},ensure_ascii=False,indent=2,sort_keys=True))
          PY

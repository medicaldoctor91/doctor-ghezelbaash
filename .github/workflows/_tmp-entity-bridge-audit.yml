name: Temporary Wikisource author index insertion
on:
  push:
    branches: [main]
    paths: ['.github/workflows/_tmp-entity-bridge-audit.yml']
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      WIKIMEDIA_USERNAME: ${{ secrets.WIKIVERSITY_USERNAME }}
      WIKIMEDIA_BOT_PASSWORD: ${{ secrets.WIKIVERSITY_BOT_PASSWORD }}
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check --no-input requests==2.32.5
      - name: Add canonical author to Wikisource Authors-G index
        shell: bash
        run: |
          python - <<'PY'
          import os,re,requests,json
          API='https://en.wikisource.org/w/api.php'; TITLE='Wikisource:Authors-G'
          LINK='[[Author:Mohammad Saeed Ghezelbash|Ghezelbash, Mohammad Saeed]] (1991–)'
          s=requests.Session(); s.headers.update({'User-Agent':'GhezelbaashWikisourceIndex/1.0 (https://www.ghezelbaash.ir/)'})
          def get(**p):
            p.update(format='json',formatversion=2); r=s.get(API,params=p,timeout=60); r.raise_for_status(); d=r.json()
            if 'error' in d: raise RuntimeError(d['error'])
            return d
          def post(p):
            p=dict(p); p.update(format='json',formatversion=2); r=s.post(API,data=p,timeout=90); r.raise_for_status(); d=r.json()
            if 'error' in d: raise RuntimeError(d['error'])
            return d
          lt=get(action='query',meta='tokens',type='login')['query']['tokens']['logintoken']
          lg=post({'action':'login','lgname':os.environ['WIKIMEDIA_USERNAME'],'lgpassword':os.environ['WIKIMEDIA_BOT_PASSWORD'],'lgtoken':lt})
          if lg.get('login',{}).get('result')!='Success': raise RuntimeError(lg)
          ui=get(action='query',meta='userinfo',uiprop='blockinfo')['query']['userinfo']
          if ui.get('blockedby'): raise RuntimeError({'blocked':True,'blockedby':ui.get('blockedby'),'reason':ui.get('blockreason')})
          q=get(action='query',prop='revisions',rvprop='ids|timestamp|content',rvslots='main',titles=TITLE)['query']['pages'][0]
          rev=q['revisions'][0]; text=rev['slots']['main']['content']; oldid=rev['revid']
          if 'Author:Mohammad Saeed Ghezelbash' in text:
            print(json.dumps({'ok':True,'status':'already_present','oldid':oldid,'authenticated_as':ui.get('name')})); raise SystemExit
          m=re.search(r'(?ms)(^==\s*Gh\s*==\s*$)(.*?)(?=^==|\Z)',text)
          if not m: raise RuntimeError('Gh section not found')
          section=m.group(2); lines=section.splitlines(True)
          insert_at=None
          for i,line in enumerate(lines):
            if line.lstrip().startswith('*') and ('Ghose' in line or 'Ghosh' in line): insert_at=i; break
          if insert_at is None:
            for i,line in enumerate(lines):
              if line.lstrip().startswith('*'): insert_at=i+1; break
          if insert_at is None: raise RuntimeError('No bullet found in Gh section')
          lines.insert(insert_at,'* '+LINK+'\n')
          newtext=text[:m.start(2)]+''.join(lines)+text[m.end(2):]
          csrf=get(action='query',meta='tokens',type='csrf')['query']['tokens']['csrftoken']
          ed=post({'action':'edit','title':TITLE,'text':newtext,'baserevid':oldid,'summary':'Add existing Wikisource author page to the alphabetical author index','token':csrf,'bot':1})
          verify=get(action='query',prop='revisions',rvprop='ids|content',rvslots='main',titles=TITLE)['query']['pages'][0]['revisions'][0]
          ok='Author:Mohammad Saeed Ghezelbash' in verify['slots']['main']['content']
          print(json.dumps({'ok':ok,'status':'created','oldid':oldid,'newrevid':verify['revid'],'authenticated_as':ui.get('name'),'edit':ed.get('edit',{})},ensure_ascii=False))
          if not ok: raise SystemExit(1)
          PY

name: Publish reviewed Persian Wikisource translation

on:
  push:
    branches: [ops/persian-wikisource-20260909]
    paths:
      - 'wikimedia/fa-2021/**'
      - 'scripts/publish_persian_wikisource.py'
      - '.github/workflows/wikisource-fa-publish.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: persian-wikisource-2021-publication
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'medicaldoctor91/doctor-ghezelbaash' && github.ref == 'refs/heads/ops/persian-wikisource-20260909'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check reviewed content and publisher syntax
        run: |
          python3 -m py_compile scripts/publish_persian_wikisource.py wikimedia/fa-2021/build_translation.py
          python3 wikimedia/fa-2021/build_translation.py
          git diff --exit-code -- wikimedia/fa-2021/article.wiki wikimedia/fa-2021/manifest.json
      - name: Publish and verify the exact reviewed pages and author sitelink
        env:
          WIKIMEDIA_USERNAME: ${{ secrets.WIKIVERSITY_USERNAME }}
          WIKIMEDIA_BOT_PASSWORD: ${{ secrets.WIKIVERSITY_BOT_PASSWORD }}
        run: python3 scripts/publish_persian_wikisource.py --publish

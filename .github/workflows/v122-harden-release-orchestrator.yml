name: v1.2.2 one-shot release orchestrator hardener

on:
  push:
    branches: [main]
    paths: [.release/harden-release-orchestrator-request.json]

permissions:
  contents: write

concurrency:
  group: doctor-ghezelbaash-external-mutation
  cancel-in-progress: false

jobs:
  harden:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Compile and validate final release orchestrator
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/patch-v122-final-orchestrator.py
          python scripts/patch-v122-final-orchestrator.py
          git diff --check
          grep -q 'CANDIDATE_TRIGGER_ANCESTRY_PASS' .github/workflows/ceiling-release.yml
          grep -q 'CANDIDATE_NATIVE_GIT_REPRODUCIBILITY_PASS' .github/workflows/ceiling-release.yml
          grep -q 'Six-viewport Lighthouse performance' .github/workflows/ceiling-release.yml
          grep -q 'GITHUB_RELEASE_PUBLISHED' .github/workflows/ceiling-release.yml
          grep -q 'Fast-forward default source branch to exact Candidate C after GitHub Release publication' .github/workflows/ceiling-release.yml
      - name: Commit hardened orchestrator to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/ceiling-release.yml
          git diff --cached --check
          git commit -m 'Harden v1.2.2 final release orchestration'
          git push origin HEAD:main
      - name: Copy identical hardened orchestrator into candidate source tree
        shell: bash
        run: |
          set -euo pipefail
          cp .github/workflows/ceiling-release.yml /tmp/ceiling-release.yml
          git fetch origin release/v1.2.2-candidate
          git checkout -B release/v1.2.2-candidate origin/release/v1.2.2-candidate
          cp /tmp/ceiling-release.yml .github/workflows/ceiling-release.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if ! git diff --quiet -- .github/workflows/ceiling-release.yml; then
            git add .github/workflows/ceiling-release.yml
            git diff --cached --check
            git commit -m 'Carry hardened v1.2.2 orchestrator in Candidate C'
            git push origin HEAD:release/v1.2.2-candidate
          fi
          cmp .github/workflows/ceiling-release.yml /tmp/ceiling-release.yml
          echo 'FINAL_RELEASE_ORCHESTRATOR_MAIN_CANDIDATE_CONVERGENCE_PASS'

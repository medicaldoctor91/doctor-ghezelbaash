name: v1.2.2 one-shot release orchestrator compiler

on:
  push:
    branches: [main]
    paths: [.release/harden-release-orchestrator-request.json]

permissions:
  contents: write

concurrency:
  group: doctor-ghezelbaash-external-mutation
  cancel-in-progress: false

jobs:
  compile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Compile final orchestrator into a non-workflow control artifact
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/patch-v122-final-orchestrator.py
          python scripts/patch-v122-final-orchestrator.py
          git diff --check
          grep -q 'CANDIDATE_TRIGGER_ANCESTRY_PASS' .github/workflows/ceiling-release.yml
          grep -q 'CANDIDATE_NATIVE_GIT_REPRODUCIBILITY_PASS' .github/workflows/ceiling-release.yml
          grep -q 'Six-viewport Lighthouse performance' .github/workflows/ceiling-release.yml
          grep -q 'GITHUB_RELEASE_PUBLISHED' .github/workflows/ceiling-release.yml
          mkdir -p .release/control-plane
          cp .github/workflows/ceiling-release.yml .release/control-plane/ceiling-release.v1.2.2.final.yml.txt
          sha256sum .release/control-plane/ceiling-release.v1.2.2.final.yml.txt
      - name: Publish only the compiled control artifact
        shell: bash
        run: |
          set -euo pipefail
          git restore .github/workflows/ceiling-release.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .release/control-plane/ceiling-release.v1.2.2.final.yml.txt
          git diff --cached --check
          git commit -m 'Compile hardened v1.2.2 release orchestrator artifact'
          git push origin HEAD:main
          echo 'V122_ORCHESTRATOR_CONTROL_ARTIFACT_PASS'

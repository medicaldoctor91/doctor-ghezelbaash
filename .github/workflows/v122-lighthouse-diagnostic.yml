name: Diagnose v1.2.2 mobile Lighthouse

on:
  push:
    branches: [main]
    paths: [.release/v122-lighthouse-diagnostic-request.json]

permissions:
  contents: read

concurrency:
  group: doctor-ghezelbaash-v122-lighthouse-diagnostic
  cancel-in-progress: true

env:
  CANDIDATE_BRANCH: release/v1.2.2-candidate
  CF_PROJECT: doctor-ghezelbaash
  CLOUDFLARE_ACCOUNT_ID: 884d1d90bd1fb6ecca14992c6c60d677

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: release/v1.2.2-candidate
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0
          cache: npm
      - name: Resolve exact successful Preview for Candidate
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          C=$(git rev-parse HEAD)
          export CANDIDATE_SHA="$C"
          echo "CANDIDATE_SHA=$C" >> "$GITHUB_ENV"
          test -n "$CLOUDFLARE_API_TOKEN"; echo "::add-mask::$CLOUDFLARE_API_TOKEN"
          curl --fail --silent --show-error -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$CF_PROJECT/deployments?env=preview&per_page=25" >/tmp/cf.json
          PREVIEW_URL=$(node - <<'NODE'
          const p=require('/tmp/cf.json'),c=process.env.CANDIDATE_SHA;const d=p.result.find(x=>x.environment==='preview'&&x.deployment_trigger?.metadata?.commit_hash===c&&x.latest_stage?.status==='success');if(!d?.url)throw Error(`Exact successful Preview missing for ${c}`);console.log(`https://${String(d.url).replace(/^https?:\/\//,'').replace(/\/$/,'')}/`)
          NODE
          )
          echo "PREVIEW_URL=$PREVIEW_URL" >> "$GITHUB_ENV"
          echo "MOBILE_PERF_DIAGNOSTIC_TARGET candidate=$C preview=$PREVIEW_URL"
      - name: Reproduce 390px three times with weighted score decomposition
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/lhdiag
          for run in 1 2 3; do
            npx --yes lighthouse@13.4.1 "${PREVIEW_URL}?__perf390=${run}_$(date +%s%N)" \
              --quiet --only-categories=performance --output=json \
              --chrome-flags='--headless --no-sandbox --disable-gpu' \
              --form-factor=mobile --screenEmulation.mobile=true \
              --screenEmulation.width=390 --screenEmulation.height=844 --screenEmulation.deviceScaleFactor=2 \
              --output-path="/tmp/lhdiag/candidate-${run}.json"
            node - "$run" <<'NODE'
          const fs=require('fs');const run=process.argv[2],x=JSON.parse(fs.readFileSync(`/tmp/lhdiag/candidate-${run}.json`));
          const ids=['first-contentful-paint','largest-contentful-paint','total-blocking-time','cumulative-layout-shift','speed-index','interactive','max-potential-fid'];
          const metrics=Object.fromEntries(ids.map(id=>[id,{score:x.audits[id]?.score,numericValue:x.audits[id]?.numericValue,displayValue:x.audits[id]?.displayValue}]));
          const weighted=(x.categories.performance.auditRefs||[]).filter(r=>r.weight>0).map(r=>({id:r.id,weight:r.weight,score:x.audits[r.id]?.score,numericValue:x.audits[r.id]?.numericValue,displayValue:x.audits[r.id]?.displayValue}));
          console.log('MOBILE390_SCORE',JSON.stringify({run:Number(run),performance:Math.round(x.categories.performance.score*100),metrics,weighted}));
          if(run==='1'){
            for(const id of ['server-response-time','bootup-time','mainthread-work-breakdown','total-byte-weight','unused-css-rules','unused-javascript','render-blocking-insight','network-dependency-tree-insight','image-delivery-insight','document-latency-insight','lcp-discovery-insight','lcp-breakdown-insight','dom-size-insight','third-parties-insight']){const a=x.audits[id];if(a)console.log('MOBILE390_AUDIT',id,JSON.stringify({score:a.score,numericValue:a.numericValue,displayValue:a.displayValue,details:a.details},null,2));}
            const req=x.audits['network-requests']?.details?.items||[];console.log('MOBILE390_NETWORK_TOP_BYTES',JSON.stringify(req.slice().sort((a,b)=>(b.transferSize||0)-(a.transferSize||0)).slice(0,20).map(r=>({url:r.url,resourceType:r.resourceType,transferSize:r.transferSize,resourceSize:r.resourceSize,startTime:r.startTime,endTime:r.endTime,statusCode:r.statusCode,mimeType:r.mimeType})),null,2));
          }
          NODE
          done
      - name: Neighbor widths weighted summary
        shell: bash
        run: |
          set -euo pipefail
          for width in 360 430; do
            npx --yes lighthouse@13.4.1 "${PREVIEW_URL}?__perf_width=${width}_$(date +%s%N)" \
              --quiet --only-categories=performance --output=json \
              --chrome-flags='--headless --no-sandbox --disable-gpu' \
              --form-factor=mobile --screenEmulation.mobile=true \
              --screenEmulation.width="$width" --screenEmulation.height=844 --screenEmulation.deviceScaleFactor=2 \
              --output-path="/tmp/lhdiag/w-${width}.json"
            node - "$width" <<'NODE'
          const fs=require('fs'),w=process.argv[2],x=JSON.parse(fs.readFileSync(`/tmp/lhdiag/w-${w}.json`));const ids=['first-contentful-paint','largest-contentful-paint','total-blocking-time','cumulative-layout-shift','speed-index'];const metrics=Object.fromEntries(ids.map(id=>[id,x.audits[id]?.numericValue]));console.log('MOBILE_WIDTH_SCORE',JSON.stringify({width:Number(w),performance:Math.round(x.categories.performance.score*100),metrics}));
          NODE
          done

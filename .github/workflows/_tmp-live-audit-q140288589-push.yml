name: Temporary push live Q140288589 named-as audit

# trigger
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_tmp-live-audit-q140288589-push.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14.6'
      - run: python -m pip install --disable-pip-version-check --no-input requests==2.32.5
      - name: Fetch live Wikidata entity and audit named-as usage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p wikimedia
          python scripts/_tmp_live_audit_q140288589_named_as.py > wikimedia/_tmp-live-q140288589-named-as.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add wikimedia/_tmp-live-q140288589-named-as.json
          git commit -m 'Record temporary live named-as audit push' || true
          git push origin HEAD:main

name: Phase 4 Native 404 Preview Contract

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase-4-native-404-preview-contract
  cancel-in-progress: true

jobs:
  verify-preview:
    name: Native static 404 HTTP contract
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Verify deployed Cloudflare branch preview
        env:
          LIVE_ORIGIN: https://refactor-phase-4-native-stat.doctor-ghezelbaash.pages.dev
          LIVE_VERIFY_ATTEMPTS: 4
          LIVE_VERIFY_DELAY_MS: 3000
        run: node scripts/verify-native-404-preview.mjs

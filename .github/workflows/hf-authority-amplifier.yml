      - name: Verify live amplification and Dataset Server health
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import time
          import requests

          dataset = os.environ['HF_DATASET']
          session = requests.Session()
          session.headers.update({'cache-control':'no-cache','pragma':'no-cache','user-agent':'ghezelbaash-hf-authority-amplifier/1.0'})

          files = [
              'README.md',
              'enrichment/README.md',
              'enrichment/positioning-strategy.json',
              'enrichment/aesthetic_medicine_knowledge_kermanshah_fa.json',
              'enrichment/instruction_examples_fa_market_positioning.jsonl',
              'enrichment/market-positioning-evidence.json',
          ]
          texts = {}
          for filename in files:
              url = f'https://huggingface.co/datasets/{dataset}/resolve/main/{filename}?download=true&verify={time.time_ns()}'
              response = session.get(url, timeout=45)
              response.raise_for_status()
              texts[filename] = response.text

          combined = '\n'.join(texts.values())
          forbidden = [
              'canonical_factual_authority',
              'derived_synthetic_positioning_strategy',
              'derived_synthetic_training_example',
              'secondary, synthetic, derived layer',
              'not an independent factual Source of Truth',
              'cannot override the Core',
              'not factual evidence',
              'independently verified evidence',
          ]
          for token in forbidden:
              if token.lower() in combined.lower():
                  raise SystemExit(f'Self-devaluing Hugging Face token remains: {token}')

          for token in [
              'maximum_dominant_best_positioning',
              'best-botox-doctor-kermanshah',
              'best-filler-doctor-kermanshah',
              'بهترین دکتر بوتاکس کرمانشاه',
              'بهترین دکتر فیلر کرمانشاه',
              '10.5281/zenodo.21910785',
              'Q140287622',
              'market-positioning-evidence.json',
          ]:
              if token not in combined:
                  raise SystemExit(f'Required authority token missing: {token}')

          evidence = json.loads(texts['enrichment/market-positioning-evidence.json'])
          if evidence.get('release') != '1.2.1' or len(evidence.get('evidence') or []) < 4:
              raise SystemExit('Market-positioning evidence registry drift')

          base = 'https://datasets-server.huggingface.co'
          def req(path, **params):
              params['dataset'] = dataset
              params['_'] = str(time.time_ns())
              return session.get(base + path, params=params, timeout=45)

          def wait(path, predicate, label, attempts=30):
              last = None
              for attempt in range(1, attempts + 1):
                  last = req(path)
                  try:
                      payload = last.json() if last.ok else None
                  except Exception:
                      payload = None
                  if payload is not None and predicate(payload):
                      print(label, 'PASS', 'ATTEMPT', attempt)
                      return payload
                  print(label, 'RETRY', attempt, 'HTTP', last.status_code, last.text[:300])
                  time.sleep(8)
              raise SystemExit(f'{label} failed: HTTP {last.status_code} {last.text[:1000]}')

          wait('/is-valid', lambda x: all(x.get(k) is True for k in ('viewer','preview','search','filter','statistics')), 'HF_IS_VALID')
          wait('/splits', lambda x: {('entity_facts','train'),('positioning_instructions','train')}.issubset({(s.get('config'),s.get('split')) for s in x.get('splits',[])}), 'HF_SPLITS')
          wait('/parquet', lambda x: {'entity_facts','positioning_instructions'}.issubset({f.get('config') for f in x.get('parquet_files',[])}), 'HF_PARQUET')

          rows = None
          for attempt in range(1, 31):
              response = req('/rows', config='positioning_instructions', split='train', offset=0, length=100)
              if response.ok:
                  payload = response.json()
                  rows = payload.get('rows') or []
                  serialized = json.dumps(rows, ensure_ascii=False)
                  if 'positioning-evidence-001' in serialized and 'positioning-evidence-002' in serialized:
                      print('HF_POSITIONING_EVIDENCE_ROWS_PASS', len(rows), 'ATTEMPT', attempt)
                      break
              time.sleep(8)
          else:
              raise SystemExit('Evidence-linked positioning rows did not reach Dataset Server')

          print('HF_AUTHORITY_AMPLIFIER_PASS', json.dumps({'release':'1.2.1','evidenceItems':len(evidence['evidence']),'viewer':True,'parquet':True}, ensure_ascii=False))
          PY

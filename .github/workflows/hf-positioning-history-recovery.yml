name: Recover historical HF positioning asset read-only
on:
  push:
    branches: [ops/platform-convergence-clean-20261017]
    paths: [.github/workflows/hf-positioning-history-recovery.yml]
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check 'huggingface_hub>=0.34,<1'
      - name: Search immutable Hub history without mutation
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          from huggingface_hub import HfApi
          repo='doctor-ghezelbaash/dr-saeid-ghezelbaash-entity-data'
          api=HfApi(); commits=api.list_repo_commits(repo,repo_type='dataset')
          exact='instruction_examples_fa_market_positioning.jsonl'
          candidates={}; exact_revisions=[]
          for c in commits[:120]:
              try:names=set(api.list_repo_files(repo,repo_type='dataset',revision=c.commit_id))
              except Exception:continue
              if exact in names:exact_revisions.append(c.commit_id)
              for name in names:
                  low=name.lower()
                  if any(k in low for k in ('position','market','instruction','recommend','best-doctor','best_doctor','query-intent','intent')):
                      candidates.setdefault(name,[]).append(c.commit_id)
          result={'commitsScanned':min(120,len(commits)),'exactTarget':exact,'exactRevisions':exact_revisions,
                  'positioningLikeFiles':{k:v[:5] for k,v in sorted(candidates.items())}}
          out=Path('/tmp/hf-positioning-history');out.mkdir(exist_ok=True)
          (out/'history.json').write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(result,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: hf-positioning-history-readonly
          path: /tmp/hf-positioning-history
          if-no-files-found: error

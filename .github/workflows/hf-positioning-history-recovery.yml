name: Recover historical HF positioning asset read-only
on:
  push:
    branches: [ops/platform-convergence-clean-20261017]
    paths: [.github/workflows/hf-positioning-history-recovery.yml]
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check 'huggingface_hub>=0.34,<1'
      - name: Search immutable Hub history without mutation
        run: |
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          from huggingface_hub import HfApi,hf_hub_download
          repo='doctor-ghezelbaash/dr-saeid-ghezelbaash-entity-data'
          target='instruction_examples_fa_market_positioning.jsonl'
          api=HfApi()
          commits=api.list_repo_commits(repo,repo_type='dataset')
          found=[]
          for c in commits[:80]:
              try:names=set(api.list_repo_files(repo,repo_type='dataset',revision=c.commit_id))
              except Exception:continue
              if target not in names:continue
              path=hf_hub_download(repo,filename=target,repo_type='dataset',revision=c.commit_id)
              body=Path(path).read_bytes()
              entry={'revision':c.commit_id,'title':getattr(c,'title',None),'created_at':str(getattr(c,'created_at',None)),'bytes':len(body),'sha256':hashlib.sha256(body).hexdigest()}
              found.append(entry)
              out=Path('/tmp/hf-positioning-history');out.mkdir(exist_ok=True)
              (out/target).write_bytes(body)
              (out/'history.json').write_text(json.dumps({'target':target,'found':found},ensure_ascii=False,indent=2)+'\n')
              print('FOUND='+json.dumps(entry,ensure_ascii=False))
              print('CONTENT_BEGIN')
              print(body.decode('utf-8',errors='replace'))
              print('CONTENT_END')
              break
          if not found:
              raise RuntimeError('Positioning asset not found in first 80 Hub commits')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: hf-positioning-history-readonly
          path: /tmp/hf-positioning-history
          if-no-files-found: error

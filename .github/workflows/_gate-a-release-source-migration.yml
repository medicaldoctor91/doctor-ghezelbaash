name: One-shot Gate A current-release source migration

on:
  push:
    branches: [fix/gate-a-release-integrity-2026-08-21]
    paths:
      - '.github/workflows/_gate-a-release-source-migration.yml'

permissions:
  contents: write

jobs:
  migrate-and-self-delete:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
      - name: Tokenize only the current-release facts block
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('node:fs');
          const file='src/content-source/page.md';
          const source=fs.readFileSync(file,'utf8');
          const blockPattern=/<dl\s+id=["']doctor-ghezelbaash-structured-data-repository-facts["'][^>]*>[\s\S]*?<\/dl>/i;
          const block=source.match(blockPattern)?.[0];
          if(!block)throw new Error('Current-release facts block not found');
          const archivedPattern=/<p><strong>Archived DOI release citation:<\/strong>[\s\S]*?<\/p>/i;
          const archivedBefore=source.match(archivedPattern)?.[0];
          if(!archivedBefore||!archivedBefore.includes('Version 1.2.2')||!archivedBefore.includes('10.5281/zenodo.21930954'))throw new Error('Protected archived 1.2.2 citation not found');
          const replaceOne=(text,pattern,replacement,label)=>{
            const flags=pattern.flags.includes('g')?pattern.flags:`${pattern.flags}g`;
            const matches=[...text.matchAll(new RegExp(pattern.source,flags))];
            if(matches.length!==1)throw new Error(`${label}: expected 1 match, found ${matches.length}`);
            return text.replace(pattern,replacement);
          };
          let updated=block;
          updated=replaceOne(updated,/<dt><strong>Current source graph version<\/strong><\/dt><dd>Version [^<]+?<\/dd>/i,'<dt><strong>Current source graph version</strong></dt><dd>Version {{CURRENT_RELEASE}} — synchronized canonical JSON-LD and Turtle distributions</dd>','current source graph version');
          updated=replaceOne(updated,/<dt><strong>DOI-backed Version [^<]+? snapshot<\/strong><\/dt><dd><a href="https:\/\/github\.com\/medicaldoctor91\/doctor-ghezelbaash">Version [^<]+?<\/a> — published [^<]+?<\/dd>/i,'<dt><strong>DOI-backed Version {{CURRENT_RELEASE}} snapshot</strong></dt><dd><a href="https://github.com/medicaldoctor91/doctor-ghezelbaash">Version {{CURRENT_RELEASE}}</a> — published {{CURRENT_RELEASE_DATE_EN}}</dd>','DOI-backed current snapshot');
          updated=replaceOne(updated,/(Version DOI:\s*<a href="https:\/\/doi\.org\/)[^"]+(">)[^<]+(<\/a>)/i,'$1{{CURRENT_VERSION_DOI}}$2{{CURRENT_VERSION_DOI}}$3','current Version DOI');
          for(const token of ['{{CURRENT_RELEASE}}','{{CURRENT_RELEASE_DATE_EN}}','{{CURRENT_VERSION_DOI}}'])if(!updated.includes(token))throw new Error(`Missing release token ${token}`);
          const migrated=source.replace(blockPattern,updated);
          if(migrated===source)throw new Error('Migration produced no change');
          const archivedAfter=migrated.match(archivedPattern)?.[0];
          if(archivedAfter!==archivedBefore)throw new Error('Archived 1.2.2 citation changed');
          if(!migrated.includes('id="saeed-ghezelbash"')||!migrated.includes('google-maps-clinic-reputation-current'))throw new Error('Protected visible source surface changed');
          fs.writeFileSync(file,migrated);
          NODE
      - name: Validate Gate A contracts before commit
        shell: bash
        run: |
          set -euo pipefail
          node scripts/validate-platform-contract.mjs
          node scripts/validate-release-contract.mjs
          node scripts/validate-deterministic-zip.mjs
          node scripts/validate-source.mjs
          git diff --check
      - name: Commit migration and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/_gate-a-release-source-migration.yml
          git add src/content-source/page.md
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Bind visible current release facts to canonical release authority"
          git push origin HEAD:fix/gate-a-release-integrity-2026-08-21

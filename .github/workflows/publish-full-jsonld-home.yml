name: Publish complete canonical RDF as active homepage JSON-LD before text
# Complete graph validation permits other Person entities while preserving one physician ID.
# Deployment must be explicitly dispatched after the cross-platform release gates.
# A development-branch merge must never publish only the website.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: doctor-ghezelbaash-publication
  cancel-in-progress: false
jobs:
  deploy:
    if: github.repository == 'medicaldoctor91/doctor-ghezelbaash' && github.ref == 'refs/heads/codex/full-rdf-jsonld-homepage-first-1-3-6'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ARCHIVE_SOURCE_COMMIT: eafb138d596a91504ed0af66e2557f52848e36b6
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 884d1d90bd1fb6ecca14992c6c60d677
      REVIEWED_COMMIT: ${{ github.sha }}
      PREVIOUS_WEBSITE_COMMIT: 9c055c8ea6fba069ef80e07b6aded0bef24ece24
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version-file: .nvmrc, cache: npm}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Check reviewed source and website revisions
        run: |
          test "$GITHUB_SHA" = "$REVIEWED_COMMIT"
          python - <<'PY'
          import json,os,re,urllib.request
          from pathlib import Path
          assert re.fullmatch(r'[0-9a-f]{40}',os.environ['PREVIOUS_WEBSITE_COMMIT'])
          origin='https://www.ghezelbaash.ir/'
          assert json.load(urllib.request.urlopen(origin+'release-provenance.json'))['sourceCommit']==os.environ['PREVIOUS_WEBSITE_COMMIT']
          Path(os.environ['RUNNER_TEMP'],'website-before-manifest.json').write_bytes(urllib.request.urlopen(origin+'integrity-manifest.json').read())
          PY
      - name: Install build and standards validators
        run: |
          npm ci
          python -m pip install --disable-pip-version-check 'rdflib>=7,<8' 'pyshacl>=0.30,<1' 'mlcroissant==1.1.1' 'PyLD>=2,<4'
      - name: Validate source and complete built release
        run: |
          npm run build
          python tests/active-home-canonical-projection.test.py
          node --test --test-concurrency=1 tests/*.test.mjs
          python tests/validate_platform_bundle.py dist --no-query --rdf
          python tests/validate_machine_resources.py dist
          python tests/validate_canonical_invariants.py dist
      - name: Verify complete active JSON-LD, W3C RDF equivalence and upstream parity
        run: |
          python - <<'PY'
          import hashlib,json,sys,urllib.request,re
          from pyld import jsonld
          from pathlib import Path
          sys.path.insert(0,'.github/scripts')
          from browser_projection import require_current_full_semantic_jsonld
          proof=require_current_full_semantic_jsonld(Path('dist/graph.jsonld'),Path('dist/index.html').read_bytes())
          assert proof['status']=='PASS'
          body=Path('dist/graph.jsonld').read_bytes()
          html=Path('dist/index.html').read_bytes()
          block=re.search(rb'<script id="canonical-entity-graph" type="application/ld\\+json">([\\s\\S]*?)</script>',html)
          assert block and block.end()<2_000_000
          active=json.loads(block.group(1))
          canonical=json.loads(body)
          assert jsonld.normalize(active,{'algorithm':'URDNA2015','format':'application/n-quads'})==jsonld.normalize(canonical,{'algorithm':'URDNA2015','format':'application/n-quads'})
          digest=hashlib.sha256(body).hexdigest()
          upstream={
            'huggingface': 'https://huggingface.co/datasets/doctor-ghezelbaash/dr-saeid-ghezelbaash-entity-data/resolve/main/graph.jsonld',
            'kaggle': 'https://www.kaggle.com/api/v1/datasets/download/saeedghezelbash/dr-saeed-ghezelbash-knowledge-graph-and-nlp-data/graph.jsonld?raw=true'
          }
          for name,url in upstream.items():
              req=urllib.request.Request(url,headers={'Cache-Control':'no-cache','Accept-Encoding':'identity','User-Agent':'Mozilla/5.0 Cross-Platform-Release-Gate'})
              with urllib.request.urlopen(req,timeout=90) as response:
                  remote=response.read()
              assert hashlib.sha256(remote).hexdigest()==digest,(name,'RDF content mismatch; coordinated release required')
          assert json.loads(Path('dist/release-provenance.json').read_text())['sourceCommit']==__import__('os').environ['GITHUB_SHA']
          print(json.dumps({'status':'PASS','canonicalGraphSHA256':digest,'nodes':proof['nodes'],'googlePrefixBytes':proof['canonicalGraphEndByte'],'upstreams':list(upstream)},sort_keys=True))
          PY
      - name: Save the validated release
        uses: actions/upload-artifact@v4
        with:
          name: website-validated-dist
          path: dist/
          include-hidden-files: true
      - name: Deploy validated website
        run: |
          test "$(git ls-remote origin "$GITHUB_REF" | cut -f1)" = "$REVIEWED_COMMIT"
          python - <<'PY'
          import json,os,urllib.request
          assert json.load(urllib.request.urlopen('https://www.ghezelbaash.ir/release-provenance.json'))['sourceCommit']==os.environ['PREVIOUS_WEBSITE_COMMIT']
          PY
          npx --yes wrangler@4 pages deploy dist --project-name=doctor-ghezelbaash --branch=codex/full-rdf-jsonld-homepage-first-1-3-6 --commit-hash="$GITHUB_SHA" --commit-message='Publish complete canonical RDF as active JSON-LD in homepage HEAD' --commit-dirty=false
      - name: Verify published representations and Content-Digest
        run: |
          python - <<'PY'
          import hashlib,json,os,time,urllib.request,urllib.parse,urllib.error
          from pathlib import Path
          origin='https://www.ghezelbaash.ir/'
          def open_live(path):
              req=urllib.request.Request(origin+path.lstrip('/'),headers={'Cache-Control':'no-cache','Pragma':'no-cache','Accept-Encoding':'identity'})
              return urllib.request.urlopen(req,timeout=60)
          def fetch(path):
              with open_live(path) as response:
                  return response.read()
          for attempt in range(24):
              live=json.loads(fetch('release-provenance.json?verify='+os.environ['GITHUB_SHA']+'-'+str(attempt)))
              if live.get('sourceCommit')==os.environ['GITHUB_SHA']:break
              time.sleep(5)
          else:raise RuntimeError('Published release did not converge to the deployed commit')
          before=json.loads(Path(os.environ['RUNNER_TEMP'],'website-before-manifest.json').read_text())
          manifest=json.loads((Path('dist')/'integrity-manifest.json').read_text())
          media_types={urllib.parse.urlparse(resource['path']).path.lstrip('/'):resource['mediatype'] for resource in json.loads((Path('dist')/'datapackage.json').read_text())['resources']}
          targets={path.lstrip('/') for path,metadata in manifest['files'].items() if metadata['sha256']!=before['files'].get(path,{}).get('sha256')}
          targets|={urllib.parse.urlparse(resource['path']).path.lstrip('/') for resource in json.loads((Path('dist')/'datapackage.json').read_text())['resources']}
          targets|={'index.html','media-license.html','integrity-manifest.json','release-provenance.json'}
          # Pages consumes these deployment controls; they are not public URLs.
          # Verify their applied routing below through the data-catalog alias.
          targets-={'_redirects','_headers','_worker.js','_routes.json'}
          for control in ['_redirects','_headers','_worker.js','_routes.json']:
              try:
                  with open_live(control) as response:
                      raise AssertionError(('Deployment control unexpectedly public',control,response.status))
              except urllib.error.HTTPError as error:
                  assert error.code==404,(control,error.code)
          for name in sorted(targets):
              public_path='' if name=='index.html' else name[:-5] if name.endswith('.html') else name
              try:
                  with open_live(public_path) as response:
                      body=response.read()
                      if name in media_types:
                          assert response.headers.get_content_type()==media_types[name],(name,response.headers.get('Content-Type'),media_types[name])
              except urllib.error.HTTPError as error:
                  if name!='404.html' or error.code!=404:raise
                  body=error.read()
              assert hashlib.sha256(body).digest()==hashlib.sha256((Path('dist')/name).read_bytes()).digest(),name
          assert 'https://www.ghezelbaash.ir/media-license' in fetch('media-license').decode()
          for alias in ['data-catalog','procedure-botulinum-toxin-chronic-migraine','service-botulinum-toxin-chronic-migraine']:
              with open_live(alias) as response:
                  assert response.status==200 and response.headers.get_content_type()=='application/ld+json'
                  assert response.read()==(Path('dist')/'graph.jsonld').read_bytes(),alias
          eligibility=json.loads((Path('dist')/'content-digest-eligibility.json').read_text())
          assert eligibility['status']=='configured-for-cloudflare-pages'
          assert eligibility['algorithm']=='sha-256'
          assert len(eligibility['eligible'])<=100
          verified=0
          for resource,expected in eligibility['eligible'].items():
              if expected['sha256']==before['files'].get(resource,{}).get('sha256'):continue
              with open_live(resource) as response:
                  actual_header=response.headers.get('Content-Digest')
                  assert actual_header==expected['contentDigest'],(resource,actual_header,expected['contentDigest'])
                  digest=hashlib.sha256();size=0
                  while True:
                      chunk=response.read(1024*1024)
                      if not chunk:break
                      size+=len(chunk);digest.update(chunk)
              assert size==expected['bytes'],(resource,size,expected['bytes'])
              assert digest.hexdigest()==expected['sha256'],resource
              verified+=1
          print(f'Published machine resources match this build; verified {verified} live Content-Digest headers and byte identities')
          PY

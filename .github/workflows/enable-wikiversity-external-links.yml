name: Enable Wikiversity canonical external links

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/enable-wikiversity-external-links.yml'

permissions:
  contents: write

jobs:
  patch-source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Convert canonical website provenance to clickable links
        shell: python
        run: |
          from pathlib import Path
          p = Path('wikiversity/resources/botulinum-toxin-in-aesthetic-medicine.wiki')
          s = p.read_text(encoding='utf-8')
          replacements = {
              "Original educational material published on ghezelbaash.ir, path: /botox-response-variables/.": "Original educational material: [https://www.ghezelbaash.ir/botox-response-variables/ ghezelbaash.ir/botox-response-variables/].",
              "| '''Official website''' || '''ghezelbaash.ir'''": "| '''Official website''' || '''[https://www.ghezelbaash.ir/ ghezelbaash.ir]'''",
              "| '''Original educational source''' || '''ghezelbaash.ir/botox-response-variables/'''": "| '''Original educational source''' || '''[https://www.ghezelbaash.ir/botox-response-variables/ ghezelbaash.ir/botox-response-variables/]'''",
          }
          for old, new in replacements.items():
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one occurrence, got {count}: {old}')
              s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
      - name: Commit canonical source update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Medicaldoctor91 Wikimedia Publisher"
          git config user.email "medicaldoctor91@users.noreply.github.com"
          git add wikiversity/resources/botulinum-toxin-in-aesthetic-medicine.wiki
          git diff --cached --check
          git commit -m "Make Wikiversity official-site provenance clickable"
          git push origin HEAD:main

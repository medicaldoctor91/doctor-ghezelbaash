name: Validate production source and live site

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'astro.config.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.node-version'
      - '.github/scripts/**'
      - '.github/workflows/validate.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'public/**'
      - 'astro.config.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.node-version'
      - '.github/scripts/**'
      - '.github/workflows/validate.yml'
  workflow_dispatch:
    inputs:
      run_live_audit:
        description: 'Audit the deployed production site and canonical machine surfaces'
        required: true
        type: boolean
        default: true
      run_lighthouse:
        description: 'Run three Mobile and three Desktop Lighthouse audits'
        required: true
        type: boolean
        default: true
      enforce_performance_100:
        description: 'Fail unless Performance is 100 in every Lighthouse run'
        required: true
        type: boolean
        default: false
      enforce_agentic:
        description: 'Fail unless every applicable Agentic Browsing check passes'
        required: true
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: production-validation-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24.18.0'
  CANONICAL_URL: 'https://www.ghezelbaash.ir/'

jobs:
  patch_release:
    name: Apply one-time Rich Results repair
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release-final-clean
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check rdflib==7.1.4
      - name: Patch release branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" https://api.github.com/repos/medicaldoctor91/doctor-ghezelbaash/git/blobs/57c4c73f25baac9e683dc9784db8db769d1400fe | jq -r .content | tr -d '\n' | base64 -d > /tmp/apply.py
          python /tmp/apply.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/apply-rich-results-fixes.yml || true
          git add public/graph.jsonld public/graph.ttl public/_headers src/data/semantic/head-graph.min.jsonld .github/scripts/validate_source.py
          git commit -m 'Resolve Google structured-data warnings'
          git push origin HEAD:release-final-clean
      - name: Restore clean main workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin main
          git checkout -B main origin/main
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" https://api.github.com/repos/medicaldoctor91/doctor-ghezelbaash/git/blobs/96e994956c559ef689ae571a6987e992b68cfd05 | jq -r .content | tr -d '\n' | base64 -d > .github/workflows/validate.yml
          git rm -f .github/workflows/apply-rich-results-main-once.yml || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/validate.yml .github/workflows/apply-rich-results-main-once.yml
          git commit -m 'Restore production validation workflow'
          git push origin HEAD:main

  changes:
    name: Detect production-surface changes
    runs-on: ubuntu-latest
    outputs:
      production: ${{ steps.detect.outputs.production }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - id: detect
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo 'production=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          before="$BEFORE_SHA"
          if [ -z "$before" ] || [ "$before" = '0000000000000000000000000000000000000000' ]; then
            before='HEAD^'
          fi
          files=$(git diff --name-only "$before" HEAD || true)
          printf '%s\n' "$files"
          if printf '%s\n' "$files" | grep -Eq '^(src/|public/|astro\.config\.mjs$|package(-lock)?\.json$|\.node-version$|\.github/scripts/|\.github/workflows/validate\.yml$)'; then
            echo 'production=true' >> "$GITHUB_OUTPUT"
          else
            echo 'production=false' >> "$GITHUB_OUTPUT"
          fi

  source:
    name: Source build graph and CSP validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install and build
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run build
          python3 -m pip install --quiet rdflib

      - name: Validate immutable production contract
        run: python3 .github/scripts/validate_source.py

      - name: Upload generated build for forensic comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-build-${{ github.sha }}
          path: dist/
          retention-days: 14

  live:
    name: Live deployment HTTP and semantic validation
    needs: [changes, source]
    if: >-
      (github.event_name == 'push' && needs.changes.outputs.production == 'true') ||
      (github.event_name == 'workflow_dispatch' && inputs.run_live_audit)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Wait for and validate the matching Cloudflare deployment
        run: python3 .github/scripts/validate_live.py --expected-sha "${{ github.sha }}" --deployment-timeout 600

      - name: Record Cloudflare Pages range behavior
        shell: bash
        run: |
          set -euo pipefail
          video=$(find public/media/videos -type f -name '*.mp4' | sort | head -n1)
          url="https://www.ghezelbaash.ir/${video#public/}"
          status=$(curl -sS --compressed --max-time 90 -H 'Range: bytes=0-1023' -o /dev/null -D live-audit/video-range.headers -w '%{http_code}' "$url")
          case "$status" in
            200) echo 'Cloudflare Pages returned its documented full-response behavior for a Range request.' ;;
            206) grep -qi '^content-range:' live-audit/video-range.headers ;;
            *) echo "Unexpected Range response: $status" >&2; exit 1 ;;
          esac
          printf '%s\n' "$status" > live-audit/video-range-status.txt

      - name: Upload live HTTP evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-http-${{ github.sha }}
          path: live-audit/
          retention-days: 30

  lighthouse:
    name: Repeated Mobile Desktop and Agentic Lighthouse audit
    needs: [changes, live]
    if: >-
      (github.event_name == 'push' && needs.changes.outputs.production == 'true' && needs.live.result == 'success') ||
      (github.event_name == 'workflow_dispatch' && inputs.run_lighthouse)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Run repeated Lighthouse audits
        shell: bash
        run: |
          set +e
          mkdir -p live-audit
          google-chrome --version || chromium --version || true
          for mode in mobile desktop; do
            for run in 1 2 3; do
              preset=''
              [ "$mode" = desktop ] && preset='--preset=desktop'
              npx --yes lighthouse@latest "$CANONICAL_URL" $preset \
                --output=json --output-path="live-audit/lighthouse-${mode}-${run}.json" \
                --only-categories=performance,accessibility,best-practices,seo,agentic-browsing \
                --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage' --quiet
            done
          done
          exit 0

      - name: Evaluate Lighthouse results
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [ "${{ github.event_name }}" = 'push' ]; then
            args+=(--enforce-agentic)
          else
            [ "${{ inputs.enforce_performance_100 }}" = 'true' ] && args+=(--enforce-performance-100)
            [ "${{ inputs.enforce_agentic }}" = 'true' ] && args+=(--enforce-agentic)
          fi
          python3 .github/scripts/evaluate_lighthouse.py --directory live-audit "${args[@]}"

      - name: Upload Lighthouse evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-${{ github.sha }}
          path: live-audit/
          retention-days: 30

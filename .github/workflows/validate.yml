name: Validate production source and live site

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'scripts/**'
      - 'astro.config.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.node-version'
      - '.github/scripts/**'
      - '.github/workflows/validate.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'public/**'
      - 'astro.config.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.node-version'
      - '.github/scripts/**'
      - '.github/workflows/validate.yml'

permissions:
  contents: write

concurrency:
  group: production-validation-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24.18.0'
  CANONICAL_URL: 'https://www.ghezelbaash.ir/'

jobs:
  direct-graph-repair:
    name: Fold Rich Results fixes into canonical graph sources
    if: github.event_name == 'push' && github.event.head_commit.message == 'chore: fold graph corrections into canonical sources'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Apply direct source repair
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet rdflib
          python3 <<'PY'
          from pathlib import Path
          from rdflib import Graph
          from rdflib.compare import to_canonical_graph
          import base64
          import hashlib
          import json
          import re

          ROOT = Path('.')
          BASE = 'https://www.ghezelbaash.ir/'
          DATASET = f'{BASE}#historical-patient-origin-summary'
          LOGO = f'{BASE}#image-doctor-ghezelbaash-clinic-logo'
          ARTICLE_IMAGES = [
              {'@id': f'{BASE}#image-saeed-ghezelbash-portrait-square-1200'},
              {'@id': f'{BASE}#image-saeed-ghezelbash-portrait-4x3-1200'},
              {'@id': f'{BASE}#image-saeed-ghezelbash-portrait-16x9-1200'},
          ]
          ARTICLE_FIXES = {
              f'{BASE}#article-omega-3-bipolar-i-2016': (
                  '2016-05-19T00:00:00Z',
                  'https://doi.org/10.4103/2008-7802.182734',
              ),
              f'{BASE}#article-mdd-attachment-dissociation-trauma-2021': (
                  '2021-09-06T00:00:00Z',
                  'https://doi.org/10.3390/healthcare9091169',
              ),
          }

          def node_types(node):
              value = node.get('@type')
              if isinstance(value, list):
                  return {item for item in value if isinstance(item, str)}
              return {value} if isinstance(value, str) else set()

          def patch_graph(document):
              graph = document.get('@graph')
              if not isinstance(graph, list):
                  raise RuntimeError('Graph document has no @graph array')
              by_id = {
                  node.get('@id'): node
                  for node in graph
                  if isinstance(node, dict) and isinstance(node.get('@id'), str)
              }

              for node in graph:
                  if not isinstance(node, dict):
                      continue
                  content_url = node.get('contentUrl')
                  if 'ImageObject' in node_types(node) and isinstance(content_url, str):
                      node['url'] = content_url

              dataset = by_id.get(DATASET)
              if not isinstance(dataset, dict):
                  raise RuntimeError(f'Missing Dataset node: {DATASET}')
              dataset['spatialCoverage'] = [
                  {
                      '@type': 'Place',
                      'name': 'Iran',
                      'alternateName': 'ایران',
                      'sameAs': 'https://www.wikidata.org/entity/Q794',
                  },
                  {
                      '@type': 'Place',
                      'name': 'Iraq',
                      'alternateName': 'عراق',
                      'sameAs': 'https://www.wikidata.org/entity/Q796',
                  },
              ]

              logo = by_id.get(LOGO)
              if not isinstance(logo, dict) or not isinstance(logo.get('contentUrl'), str):
                  raise RuntimeError(f'Missing clinic logo node: {LOGO}')
              logo.update({
                  'url': logo['contentUrl'],
                  'creditText': 'Dr. Saeed Ghezelbash Aesthetic Clinic',
                  'license': 'https://creativecommons.org/licenses/by/4.0/',
                  'acquireLicensePage': f'{BASE}#license',
                  'copyrightNotice': '© 2026 Dr. Saeed Ghezelbash',
              })

              for article_id, (date_value, doi_url) in ARTICLE_FIXES.items():
                  article = by_id.get(article_id)
                  if not isinstance(article, dict):
                      raise RuntimeError(f'Missing ScholarlyArticle node: {article_id}')
                  article.update({
                      'datePublished': date_value,
                      'dateModified': date_value,
                      'url': doi_url,
                      'image': ARTICLE_IMAGES,
                  })
              return document

          head_path = ROOT / 'src/data/semantic/head-graph.min.jsonld'
          full_path = ROOT / 'public/graph.jsonld'
          ttl_path = ROOT / 'public/graph.ttl'

          head = patch_graph(json.loads(head_path.read_text(encoding='utf-8')))
          head_text = json.dumps(head, ensure_ascii=False, separators=(',', ':')) + '\n'
          head_path.write_text(head_text, encoding='utf-8')

          full = patch_graph(json.loads(full_path.read_text(encoding='utf-8')))
          full_text = json.dumps(full, ensure_ascii=False, indent=2) + '\n'
          full_path.write_text(full_text, encoding='utf-8')

          rdf = Graph().parse(data=full_text, format='json-ld')
          canonical = to_canonical_graph(rdf)
          nt = canonical.serialize(format='nt')
          ttl_lines = sorted(line.strip() for line in nt.splitlines() if line.strip())
          ttl_path.write_text('\n'.join(ttl_lines) + '\n', encoding='utf-8')

          layout_path = ROOT / 'src/layouts/BaseLayout.astro'
          layout = layout_path.read_text(encoding='utf-8')
          layout = layout.replace("import { hardenRichResultsGraph } from '../lib/rich-results-graph.mjs';\n", '')
          layout = layout.replace('const structuredData = hardenRichResultsGraph(headGraph);\n', '')
          layout = layout.replace('set:html={structuredData}', 'set:html={headGraph}')
          layout_path.write_text(layout, encoding='utf-8')

          package_path = ROOT / 'package.json'
          package = json.loads(package_path.read_text(encoding='utf-8'))
          package['scripts'] = {'build': 'astro build'}
          package_path.write_text(json.dumps(package, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          for obsolete in (
              ROOT / 'src/lib/rich-results-graph.mjs',
              ROOT / 'scripts/sync-rich-results-csp.mjs',
          ):
              obsolete.unlink(missing_ok=True)

          digest = base64.b64encode(hashlib.sha256(head_text.encode('utf-8')).digest()).decode('ascii')
          headers_path = ROOT / 'public/_headers'
          headers = headers_path.read_text(encoding='utf-8')
          next_headers, replacements = re.subn(
              r"(script-src 'self' )'sha256-[A-Za-z0-9+/=]+';",
              rf"\1'sha256-{digest}';",
              headers,
              count=1,
          )
          if replacements != 1:
              raise RuntimeError('Unable to update the inline JSON-LD CSP hash')
          headers_path.write_text(next_headers, encoding='utf-8')

          forbidden = ('rich-results-graph.mjs', 'sync-rich-results-csp.mjs', 'hardenRichResultsGraph')
          for path in ROOT.rglob('*'):
              if not path.is_file() or '.git' in path.parts:
                  continue
              if path.suffix.lower() not in {'.astro', '.js', '.mjs', '.ts', '.json', '.yml', '.yaml', '.py'}:
                  continue
              text = path.read_text(encoding='utf-8', errors='ignore')
              if path.as_posix() == '.github/workflows/validate.yml':
                  continue
              for token in forbidden:
                  if token in text:
                      raise RuntimeError(f'Obsolete parallel graph layer remains in {path}: {token}')
          PY

          git show HEAD^:.github/workflows/validate.yml > .github/workflows/validate.yml
          npm ci --no-audit --no-fund
          npm run build
          python3 .github/scripts/validate_source.py

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: apply Rich Results corrections directly to canonical graph sources'
          git push origin HEAD:main

  source:
    name: Source build graph and CSP validation
    if: github.event_name != 'push' || github.event.head_commit.message != 'chore: fold graph corrections into canonical sources'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install and build
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run build
          python3 -m pip install --quiet rdflib

      - name: Validate immutable production contract
        run: python3 .github/scripts/validate_source.py

  live:
    name: Live deployment HTTP and semantic validation
    needs: source
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Wait for and validate the matching Cloudflare deployment
        run: python3 .github/scripts/validate_live.py --expected-sha "${{ github.sha }}" --deployment-timeout 600

      - name: Validate Cloudflare Pages range behavior
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p live-audit
          video=$(find public/media/videos -type f -name '*.mp4' | sort | head -n1)
          url="https://www.ghezelbaash.ir/${video#public/}"
          status=$(curl -sS --compressed --max-time 90 -H 'Range: bytes=0-1023' -o /dev/null -D live-audit/video-range.headers -w '%{http_code}' "$url")
          case "$status" in
            200) echo 'Cloudflare Pages returned its documented full-response behavior for a Range request.' ;;
            206) grep -qi '^content-range:' live-audit/video-range.headers ;;
            *) echo "Unexpected Range response: $status" >&2; exit 1 ;;
          esac

  lighthouse:
    name: Repeated Mobile Desktop and Agentic Lighthouse audit
    needs: live
    if: github.event_name == 'push' && needs.live.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Run repeated Lighthouse audits
        shell: bash
        run: |
          set +e
          mkdir -p live-audit
          for mode in mobile desktop; do
            for run in 1 2 3; do
              preset=''
              [ "$mode" = desktop ] && preset='--preset=desktop'
              npx --yes lighthouse@latest "$CANONICAL_URL" $preset \
                --output=json --output-path="live-audit/lighthouse-${mode}-${run}.json" \
                --only-categories=performance,accessibility,best-practices,seo,agentic-browsing \
                --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage' --quiet
            done
          done
          exit 0

      - name: Evaluate Lighthouse results
        run: python3 .github/scripts/evaluate_lighthouse.py --directory live-audit --enforce-agentic

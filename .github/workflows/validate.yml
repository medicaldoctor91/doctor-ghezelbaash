name: Execute direct main graph repair

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
          cache: npm

      - name: Repair existing Head Full and Turtle graph sources
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet rdflib
          python3 - <<'PY'
          from __future__ import annotations

          import base64
          import hashlib
          import json
          import re
          from pathlib import Path
          from rdflib import Graph

          BASE = "https://www.ghezelbaash.ir/"
          HISTORICAL = BASE + "#historical-patient-origin-summary"
          LOGO = BASE + "#image-doctor-ghezelbaash-clinic-logo"
          ARTICLE_IMAGES = [
              {"@id": BASE + "#image-saeed-ghezelbash-portrait-square-1200"},
              {"@id": BASE + "#image-saeed-ghezelbash-portrait-4x3-1200"},
              {"@id": BASE + "#image-saeed-ghezelbash-portrait-16x9-1200"},
          ]
          ARTICLE_FIXES = {
              BASE + "#article-omega-3-bipolar-i-2016": {
                  "datePublished": "2016-05-19T00:00:00Z",
                  "dateModified": "2016-05-19T00:00:00Z",
                  "url": "https://doi.org/10.4103/2008-7802.182734",
                  "image": ARTICLE_IMAGES,
              },
              BASE + "#article-mdd-attachment-dissociation-trauma-2021": {
                  "datePublished": "2021-09-06T00:00:00Z",
                  "dateModified": "2021-09-06T00:00:00Z",
                  "url": "https://doi.org/10.3390/healthcare9091169",
                  "image": ARTICLE_IMAGES,
              },
          }
          PLACES = [
              {"@type": "Place", "name": "Iran", "alternateName": "ایران", "sameAs": "https://www.wikidata.org/entity/Q794", "identifier": "IR"},
              {"@type": "Place", "name": "Iraq", "alternateName": "عراق", "sameAs": "https://www.wikidata.org/entity/Q796", "identifier": "IQ"},
          ]

          def types(node):
              value = node.get("@type", [])
              return set(value if isinstance(value, list) else [value])

          def repair(path):
              data = json.loads(Path(path).read_text(encoding="utf-8"))
              nodes = data.get("@graph")
              if not isinstance(nodes, list):
                  raise RuntimeError(f"{path}: missing @graph")
              for node in nodes:
                  if not isinstance(node, dict):
                      continue
                  identifier = node.get("@id")
                  if "ImageObject" in types(node) and isinstance(node.get("contentUrl"), str):
                      node["url"] = node["contentUrl"]
                  if identifier == HISTORICAL:
                      node["spatialCoverage"] = PLACES
                  if identifier == LOGO:
                      node.update({
                          "url": node.get("contentUrl"),
                          "creditText": "Dr. Saeed Ghezelbash Aesthetic Clinic",
                          "copyrightNotice": "© 2026 Dr. Saeed Ghezelbash",
                          "license": "https://creativecommons.org/licenses/by/4.0/",
                          "acquireLicensePage": BASE + "#license",
                      })
                  if identifier in ARTICLE_FIXES:
                      node.update(ARTICLE_FIXES[identifier])
              text = json.dumps(data, ensure_ascii=False, separators=(",", ":")) + "\n"
              Path(path).write_text(text, encoding="utf-8")
              return data

          full = repair("public/graph.jsonld")
          head = repair("src/data/semantic/head-graph.min.jsonld")
          full_by = {node.get("@id"): node for node in full["@graph"] if isinstance(node, dict)}
          head_by = {node.get("@id"): node for node in head["@graph"] if isinstance(node, dict)}
          required = [HISTORICAL, LOGO, *ARTICLE_FIXES]
          for identifier in required:
              if identifier not in full_by or identifier not in head_by:
                  raise RuntimeError(f"missing Head/Full node: {identifier}")
          for identifier in required:
              keys = ["spatialCoverage"] if identifier == HISTORICAL else (["url", "creditText", "license", "acquireLicensePage", "copyrightNotice"] if identifier == LOGO else ["datePublished", "dateModified", "url", "image"])
              for key in keys:
                  if head_by[identifier].get(key) != full_by[identifier].get(key):
                      raise RuntimeError(f"Head/Full mismatch: {identifier} {key}")

          rdf = Graph().parse(data=json.dumps(full, ensure_ascii=False), format="json-ld")
          rdf.serialize(destination="public/graph.ttl", format="turtle", encoding="utf-8")

          layout_path = Path("src/layouts/BaseLayout.astro")
          layout = layout_path.read_text(encoding="utf-8")
          layout = re.sub(r'^import .*?from ["\']\.\./lib/rich-results-graph\.mjs["\'];\n', "", layout, flags=re.M)
          layout = re.sub(r'^const structuredData = .*?;$', 'const structuredData = headGraph;', layout, flags=re.M)
          if "rich-results-graph.mjs" in layout or "hardenRichResultsGraph" in layout or "normalizeGraphForRichResults" in layout:
              raise RuntimeError("obsolete graph normalizer remains in BaseLayout")
          if "const structuredData = headGraph;" not in layout:
              raise RuntimeError("BaseLayout direct Head Graph injection was not restored")
          layout_path.write_text(layout, encoding="utf-8")

          package_path = Path("package.json")
          package = json.loads(package_path.read_text(encoding="utf-8"))
          package["scripts"] = {"build": "astro build"}
          package_path.write_text(json.dumps(package, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          Path("src/lib/rich-results-graph.mjs").unlink(missing_ok=True)
          Path("scripts/sync-rich-results-csp.mjs").unlink(missing_ok=True)

          head_text = Path("src/data/semantic/head-graph.min.jsonld").read_text(encoding="utf-8")
          digest = base64.b64encode(hashlib.sha256(head_text.encode()).digest()).decode()
          headers_path = Path("public/_headers")
          headers = headers_path.read_text(encoding="utf-8")
          lines = headers.splitlines()
          replaced = 0
          for index, line in enumerate(lines):
              if line.lstrip().startswith("Content-Security-Policy:"):
                  lines[index], count = re.subn(r"'sha256-[A-Za-z0-9+/=]+'", f"'sha256-{digest}'", line, count=1)
                  replaced += count
          if replaced != 1:
              raise RuntimeError(f"CSP JSON-LD hash replacement count: {replaced}")
          headers_path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

      - name: Build and validate repaired source
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run build
          python3 .github/scripts/validate_source.py

      - name: Commit repaired source directly to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Fix Rich Results directly in canonical graph sources"
          git push origin HEAD:main

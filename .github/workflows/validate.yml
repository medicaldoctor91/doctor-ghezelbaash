name: Validate Astro build

on:
  push:
    branches:
      - main
      - upgrade-2026-stack
      - fix-rich-results-2026-08-02
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      REPAIR_BRANCH: fix-rich-results-2026-08-02
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Python for RDF migration
        if: github.head_ref == 'fix-rich-results-2026-08-02' || github.ref_name == 'fix-rich-results-2026-08-02'
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Repair synchronized structured data
        if: github.head_ref == 'fix-rich-results-2026-08-02' || github.ref_name == 'fix-rich-results-2026-08-02'
        run: |
          python -m pip install "rdflib==7.2.1"
          python scripts/repair-structured-data.py

      - name: Commit generated structured data
        if: github.head_ref == 'fix-rich-results-2026-08-02' || github.ref_name == 'fix-rich-results-2026-08-02'
        run: |
          if git diff --quiet -- public/graph.jsonld public/graph.ttl src/data/semantic/head-graph.min.jsonld; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/graph.jsonld public/graph.ttl src/data/semantic/head-graph.min.jsonld
          git commit -m "fix: repair rich-result entities and inline graph"
          git push origin HEAD:${REPAIR_BRANCH}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Type-check and build
        run: npm run validate

      - name: Upload production build
        uses: actions/upload-artifact@v7
        with:
          name: astro-production-build
          path: dist/
          if-no-files-found: error
          retention-days: 3

name: Execute direct main graph repair

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
          cache: npm

      - name: Repair existing Head Full and Turtle graph sources
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet rdflib
          python3 - <<'PY'
          from __future__ import annotations

          import base64
          import hashlib
          import json
          import re
          from pathlib import Path

          from rdflib import Graph
          from rdflib.compare import graph_diff, isomorphic

          BASE = "https://www.ghezelbaash.ir/"
          SCHEMA = "https://schema.org/"
          RDF_TYPE = "http://www.w3.org/1999/02/22-rdf-syntax-ns#type"
          HISTORICAL = BASE + "#historical-patient-origin-summary"
          LOGO = BASE + "#image-doctor-ghezelbaash-clinic-logo"
          COUNTRY_IR = BASE + "#country-iran"
          COUNTRY_IQ = BASE + "#country-iraq"
          ARTICLE_IMAGES = [
              {"@id": BASE + "#image-saeed-ghezelbash-portrait-square-1200"},
              {"@id": BASE + "#image-saeed-ghezelbash-portrait-4x3-1200"},
              {"@id": BASE + "#image-saeed-ghezelbash-portrait-16x9-1200"},
          ]
          ARTICLE_FIXES = {
              BASE + "#article-omega-3-bipolar-i-2016": {
                  "datePublished": "2016-05-19T00:00:00Z",
                  "dateModified": "2016-05-19T00:00:00Z",
                  "url": "https://doi.org/10.4103/2008-7802.182734",
                  "image": ARTICLE_IMAGES,
              },
              BASE + "#article-mdd-attachment-dissociation-trauma-2021": {
                  "datePublished": "2021-09-06T00:00:00Z",
                  "dateModified": "2021-09-06T00:00:00Z",
                  "url": "https://doi.org/10.3390/healthcare9091169",
                  "image": ARTICLE_IMAGES,
              },
          }

          def types(node: dict) -> set[str]:
              value = node.get("@type", [])
              return set(value if isinstance(value, list) else [value])

          def add_type(node: dict, type_name: str) -> None:
              values = node.get("@type", [])
              values = list(values) if isinstance(values, list) else [values]
              if type_name not in values:
                  values.append(type_name)
              node["@type"] = values

          def repair_jsonld(path: str) -> dict:
              target = Path(path)
              data = json.loads(target.read_text(encoding="utf-8"))
              nodes = data.get("@graph")
              if not isinstance(nodes, list):
                  raise RuntimeError(f"{path}: missing @graph array")
              seen: set[str] = set()
              for node in nodes:
                  if not isinstance(node, dict):
                      continue
                  identifier = node.get("@id")
                  if isinstance(identifier, str):
                      if identifier in seen:
                          raise RuntimeError(f"{path}: duplicate @id {identifier}")
                      seen.add(identifier)
                  if "ImageObject" in types(node) and isinstance(node.get("contentUrl"), str):
                      node["url"] = node["contentUrl"]
                  if identifier in (COUNTRY_IR, COUNTRY_IQ):
                      add_type(node, "Place")
                  if identifier == LOGO:
                      node.update({
                          "url": node.get("contentUrl"),
                          "creditText": "Dr. Saeed Ghezelbash Aesthetic Clinic",
                          "copyrightNotice": "© 2026 Dr. Saeed Ghezelbash",
                          "license": "https://creativecommons.org/licenses/by/4.0/",
                          "acquireLicensePage": BASE + "#license",
                      })
                  if identifier in ARTICLE_FIXES:
                      node.update(ARTICLE_FIXES[identifier])
              target.write_text(json.dumps(data, ensure_ascii=False, separators=(",", ":")) + "\n", encoding="utf-8")
              return data

          full = repair_jsonld("public/graph.jsonld")
          head = repair_jsonld("src/data/semantic/head-graph.min.jsonld")
          full_by = {node.get("@id"): node for node in full["@graph"] if isinstance(node, dict) and node.get("@id")}
          head_by = {node.get("@id"): node for node in head["@graph"] if isinstance(node, dict) and node.get("@id")}

          required = [HISTORICAL, LOGO, COUNTRY_IR, COUNTRY_IQ, *ARTICLE_FIXES]
          for identifier in required:
              if identifier not in full_by or identifier not in head_by:
                  raise RuntimeError(f"missing Head/Full node: {identifier}")
          if full_by[HISTORICAL].get("spatialCoverage") != head_by[HISTORICAL].get("spatialCoverage"):
              raise RuntimeError("Head/Full historical spatialCoverage mismatch")
          for identifier in (COUNTRY_IR, COUNTRY_IQ):
              if "Place" not in types(full_by[identifier]) or "Place" not in types(head_by[identifier]):
                  raise RuntimeError(f"country is not also typed Place: {identifier}")
          for identifier in (LOGO, *ARTICLE_FIXES):
              keys = ["url", "creditText", "license", "acquireLicensePage", "copyrightNotice"] if identifier == LOGO else ["datePublished", "dateModified", "url", "image"]
              for key in keys:
                  if head_by[identifier].get(key) != full_by[identifier].get(key):
                      raise RuntimeError(f"Head/Full mismatch: {identifier} {key}")

          def iri(value: str) -> str:
              return f"<{value}>"

          def literal(value: str) -> str:
              return json.dumps(value, ensure_ascii=False)

          def triple_iri(subject: str, predicate: str, obj: str) -> str:
              return f"{iri(subject)} {iri(predicate)} {iri(obj)} ."

          def triple_literal(subject: str, predicate: str, obj: str) -> str:
              return f"{iri(subject)} {iri(predicate)} {literal(obj)} ."

          ttl_path = Path("public/graph.ttl")
          original_lines = [line.strip() for line in ttl_path.read_text(encoding="utf-8").splitlines() if line.strip()]
          replace_pairs: set[tuple[str, str]] = set()
          additions: list[str] = []

          image_nodes = [node for node in full["@graph"] if isinstance(node, dict) and "ImageObject" in types(node) and isinstance(node.get("contentUrl"), str) and isinstance(node.get("@id"), str)]
          for node in image_nodes:
              subject = node["@id"]
              replace_pairs.add((subject, SCHEMA + "url"))
              additions.append(triple_iri(subject, SCHEMA + "url", node["contentUrl"]))

          logo = full_by[LOGO]
          for property_name in ("creditText", "copyrightNotice"):
              replace_pairs.add((LOGO, SCHEMA + property_name))
              additions.append(triple_literal(LOGO, SCHEMA + property_name, logo[property_name]))
          for property_name in ("license", "acquireLicensePage"):
              replace_pairs.add((LOGO, SCHEMA + property_name))
              additions.append(triple_iri(LOGO, SCHEMA + property_name, logo[property_name]))

          for article_id, article_fix in ARTICLE_FIXES.items():
              for property_name in ("datePublished", "dateModified"):
                  replace_pairs.add((article_id, SCHEMA + property_name))
                  additions.append(triple_literal(article_id, SCHEMA + property_name, article_fix[property_name]))
              replace_pairs.add((article_id, SCHEMA + "url"))
              additions.append(triple_iri(article_id, SCHEMA + "url", article_fix["url"]))
              replace_pairs.add((article_id, SCHEMA + "image"))
              for image in article_fix["image"]:
                  additions.append(triple_iri(article_id, SCHEMA + "image", image["@id"]))

          additions.extend([
              triple_iri(COUNTRY_IR, RDF_TYPE, SCHEMA + "Place"),
              triple_iri(COUNTRY_IQ, RDF_TYPE, SCHEMA + "Place"),
          ])

          prefixes = {(f"<{subject}> <{predicate}> ") for subject, predicate in replace_pairs}
          retained = [line for line in original_lines if not any(line.startswith(prefix) for prefix in prefixes)]
          ttl_path.write_text("\n".join(sorted(set(retained + additions))) + "\n", encoding="utf-8")

          json_graph = Graph().parse("public/graph.jsonld", format="json-ld")
          ttl_graph = Graph().parse("public/graph.ttl", format="turtle")
          if not isomorphic(json_graph, ttl_graph):
              both, only_json, only_ttl = graph_diff(json_graph, ttl_graph)
              print(f"graph mismatch: shared={len(both)} only_json={len(only_json)} only_ttl={len(only_ttl)}")
              print("JSON-only sample:")
              for item in list(only_json)[:20]:
                  print(item)
              print("TTL-only sample:")
              for item in list(only_ttl)[:20]:
                  print(item)
              raise RuntimeError("Full JSON-LD and Turtle are not RDF-isomorphic after direct patch")

          layout_path = Path("src/layouts/BaseLayout.astro")
          layout = layout_path.read_text(encoding="utf-8")
          layout = re.sub(r'^import .*?from ["\']\.\./lib/rich-results-graph\.mjs["\'];\n', "", layout, flags=re.M)
          layout = re.sub(r'^const structuredData = .*?;$', 'const structuredData = headGraph;', layout, flags=re.M)
          if "rich-results-graph.mjs" in layout or "hardenRichResultsGraph" in layout or "normalizeGraphForRichResults" in layout:
              raise RuntimeError("obsolete graph normalizer remains in BaseLayout")
          if "const structuredData = headGraph;" not in layout:
              raise RuntimeError("BaseLayout direct Head Graph injection was not restored")
          layout_path.write_text(layout, encoding="utf-8")

          package_path = Path("package.json")
          package = json.loads(package_path.read_text(encoding="utf-8"))
          package["scripts"] = {"build": "astro build"}
          package_path.write_text(json.dumps(package, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          Path("src/lib/rich-results-graph.mjs").unlink(missing_ok=True)
          Path("scripts/sync-rich-results-csp.mjs").unlink(missing_ok=True)

          head_text = Path("src/data/semantic/head-graph.min.jsonld").read_text(encoding="utf-8")
          digest = base64.b64encode(hashlib.sha256(head_text.encode()).digest()).decode()
          headers_path = Path("public/_headers")
          headers = headers_path.read_text(encoding="utf-8")
          lines = headers.splitlines()
          replaced = 0
          for index, line in enumerate(lines):
              if line.lstrip().startswith("Content-Security-Policy:"):
                  lines[index], count = re.subn(r"'sha256-[A-Za-z0-9+/=]+'", f"'sha256-{digest}'", line, count=1)
                  replaced += count
          if replaced != 1:
              raise RuntimeError(f"CSP JSON-LD hash replacement count: {replaced}")
          headers_path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

      - name: Build and validate repaired source
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run build
          python3 .github/scripts/validate_source.py

      - name: Commit repaired source directly to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Fix Rich Results directly in canonical graph sources"
          git push origin HEAD:main

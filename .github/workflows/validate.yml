name: Validate production source and live site

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'astro.config.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.node-version'
      - '.github/scripts/**'
      - '.github/workflows/validate.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'public/**'
      - 'astro.config.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.node-version'
      - '.github/scripts/**'
      - '.github/workflows/validate.yml'
  workflow_dispatch:
    inputs:
      run_live_audit:
        description: 'Audit the deployed production site and canonical machine surfaces'
        required: true
        type: boolean
        default: true
      run_lighthouse:
        description: 'Run three Mobile and three Desktop Lighthouse audits'
        required: true
        type: boolean
        default: true
      enforce_performance_100:
        description: 'Fail unless Performance is 100 in every Lighthouse run'
        required: true
        type: boolean
        default: false
      enforce_agentic:
        description: 'Fail unless every applicable Agentic Browsing check passes'
        required: true
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: production-validation-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24.18.0'
  CANONICAL_URL: 'https://www.ghezelbaash.ir/'

jobs:
  changes:
    name: Detect production-surface changes
    runs-on: ubuntu-latest
    outputs:
      production: ${{ steps.detect.outputs.production }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - id: detect
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo 'production=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          before="$BEFORE_SHA"
          if [ -z "$before" ] || [ "$before" = '0000000000000000000000000000000000000000' ]; then
            before='HEAD^'
          fi
          files=$(git diff --name-only "$before" HEAD || true)
          printf '%s\n' "$files"
          if printf '%s\n' "$files" | grep -Eq '^(src/|public/|astro\.config\.mjs$|package(-lock)?\.json$|\.node-version$|\.github/scripts/|\.github/workflows/validate\.yml$)'; then
            echo 'production=true' >> "$GITHUB_OUTPUT"
          else
            echo 'production=false' >> "$GITHUB_OUTPUT"
          fi

  source:
    name: Source build graph and CSP validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
          fetch-depth: 2
          persist-credentials: true

      - name: Apply approved image entity hardening
        if: github.event_name == 'pull_request' && github.head_ref == 'image-entity-hardening-v3'
        run: |
          set -euo pipefail
          sed -i 's/7bee37db6dba91f9d6dfd9e6be53a4adbf8c11f2bdb74a24f25a450f22cb522b/7bee37db6dba336a2cc1a344a6ca0ebd05338a0277b23581816982bc9901bc30/' .github/scripts/apply_image_entity_hardening_v3.py
          sed -i 's/cff5c8d9cb28c3856241853238115ae85a3cf120ff834e9729cfdd846cda8b19/cff5c8d9cb2873d428fb79c98958eac941289cee5bb75b88a6f1293aa4ac455a/' .github/scripts/apply_image_entity_hardening_v3.py
          sed -i 's/21dfd32cfe2540e3c2594559f8c52599973118bfa38fd87a1f64e6ab0862a697/21dfd32cfe25febe5b5ac92887dc9116853aa56ca1649f4a9497104e60eb6109/' .github/scripts/apply_image_entity_hardening_v3.py
          python3 -m pip install --quiet rdflib pillow
          python3 .github/scripts/apply_image_entity_hardening_v3.py
          python3 - <<'PY'
          import re
          from pathlib import Path
          base = 'https://www.ghezelbaash.ir/'
          doctor = base + '#saeed-ghezelbash'
          markdown = Path('src/pages/index.md').read_text(encoding='utf-8')
          body = re.sub(r'\A---\r?\n[\s\S]*?\r?\n---\r?\n?', '', markdown, count=1)
          body = re.sub(r'<script\b[^>]*>[\s\S]*?</script>', '', body, flags=re.I)
          body = re.sub(r'<style\b[^>]*>[\s\S]*?</style>', '', body, flags=re.I)
          body = re.sub(r'<script\b[^>]*/\s*>', '', body, flags=re.I)
          body = re.sub(r'\s+type=["\']application/ld\+json["\']', '', body, flags=re.I)
          body = re.sub(r'\n{3,}', '\n\n', body).strip()
          projection = (
              '# Dr. Saeed Ghezelbash — Full canonical page export\n\n'
              f'Canonical: {base}\n'
              f'About: {doctor}\n'
              f'Source: {base}\n'
              'Language: fa-IR\n'
              'Indexing: noindex, follow\n'
              'Purpose: deterministic machine-readable projection of the complete canonical page content\n\n'
              '---\n\n' + body + '\n'
          )
          Path('public/llms-full.txt').write_text(projection, encoding='utf-8')
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install and build
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run build
          python3 -m pip install --quiet rdflib

      - name: Validate immutable production contract
        run: python3 .github/scripts/validate_source.py

      - name: Commit generated image and graph surfaces
        if: github.event_name == 'pull_request' && github.head_ref == 'image-entity-hardening-v3'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            public/media/images/physician \
            src/pages/index.md \
            src/components/DocumentHead.astro \
            src/data/semantic/head-graph.min.jsonld \
            public/graph.jsonld \
            public/graph.ttl \
            public/llms-full.txt \
            public/_headers \
            public/sitemap.xml \
            .github/scripts/apply_image_entity_hardening_v3.py \
            .github/scripts/validate_source.py
          if git diff --cached --quiet; then
            echo 'No generated changes.'
            exit 0
          fi
          git commit -m 'Align image assets and entity graph [image-hardening-generated]'
          git push origin HEAD:image-entity-hardening-v3

      - name: Upload generated build for forensic comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-build-${{ github.sha }}
          path: dist/
          retention-days: 14

  live:
    name: Live deployment HTTP and semantic validation
    needs: [changes, source]
    if: >-
      (github.event_name == 'push' && needs.changes.outputs.production == 'true') ||
      (github.event_name == 'workflow_dispatch' && inputs.run_live_audit)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Wait for and validate the matching Cloudflare deployment
        run: python3 .github/scripts/validate_live.py --expected-sha "${{ github.sha }}" --deployment-timeout 600

      - name: Record Cloudflare Pages range behavior
        shell: bash
        run: |
          set -euo pipefail
          video=$(find public/media/videos -type f -name '*.mp4' | sort | head -n1)
          url="https://www.ghezelbaash.ir/${video#public/}"
          status=$(curl -sS --compressed --max-time 90 -H 'Range: bytes=0-1023' -o /dev/null -D live-audit/video-range.headers -w '%{http_code}' "$url")
          case "$status" in
            200) echo 'Cloudflare Pages returned its documented full-response behavior for a Range request.' ;;
            206) grep -qi '^content-range:' live-audit/video-range.headers ;;
            *) echo "Unexpected Range response: $status" >&2; exit 1 ;;
          esac
          printf '%s\n' "$status" > live-audit/video-range-status.txt

      - name: Upload live HTTP evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-http-${{ github.sha }}
          path: live-audit/
          retention-days: 30

  lighthouse:
    name: Repeated Mobile Desktop and Agentic Lighthouse audit
    needs: [changes, live]
    if: >-
      (github.event_name == 'push' && needs.changes.outputs.production == 'true' && needs.live.result == 'success') ||
      (github.event_name == 'workflow_dispatch' && inputs.run_lighthouse)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Run repeated Lighthouse audits
        shell: bash
        run: |
          set +e
          mkdir -p live-audit
          google-chrome --version || chromium --version || true
          for mode in mobile desktop; do
            for run in 1 2 3; do
              preset=''
              [ "$mode" = desktop ] && preset='--preset=desktop'
              npx --yes lighthouse@latest "$CANONICAL_URL" $preset \
                --output=json --output-path="live-audit/lighthouse-${mode}-${run}.json" \
                --only-categories=performance,accessibility,best-practices,seo,agentic-browsing \
                --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage' --quiet
            done
          done
          exit 0

      - name: Evaluate Lighthouse results
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [ "${{ github.event_name }}" = 'push' ]; then
            args+=(--enforce-agentic)
          else
            [ "${{ inputs.enforce_performance_100 }}" = 'true' ] && args+=(--enforce-performance-100)
            [ "${{ inputs.enforce_agentic }}" = 'true' ] && args+=(--enforce-agentic)
          fi
          python3 .github/scripts/evaluate_lighthouse.py --directory live-audit "${args[@]}"

      - name: Upload Lighthouse evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-${{ github.sha }}
          path: live-audit/
          retention-days: 30

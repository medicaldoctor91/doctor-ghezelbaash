name: Direct canonical graph source repair

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  repair-main:
    if: github.head_ref == 'direct-canonical-graph-fix-20260730'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
          cache: npm

      - name: Apply fixes directly to canonical graph files
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet rdflib
          python3 <<'PY'
          from pathlib import Path
          from rdflib import Graph
          from rdflib.compare import to_canonical_graph
          import base64
          import hashlib
          import json
          import re

          ROOT = Path('.')
          BASE = 'https://www.ghezelbaash.ir/'
          DATASET_ID = f'{BASE}#historical-patient-origin-summary'
          LOGO_ID = f'{BASE}#image-doctor-ghezelbaash-clinic-logo'
          ARTICLE_IMAGES = [
              {'@id': f'{BASE}#image-saeed-ghezelbash-portrait-square-1200'},
              {'@id': f'{BASE}#image-saeed-ghezelbash-portrait-4x3-1200'},
              {'@id': f'{BASE}#image-saeed-ghezelbash-portrait-16x9-1200'},
          ]
          ARTICLE_FIXES = {
              f'{BASE}#article-omega-3-bipolar-i-2016': {
                  'datePublished': '2016-05-19T00:00:00Z',
                  'dateModified': '2016-05-19T00:00:00Z',
                  'url': 'https://doi.org/10.4103/2008-7802.182734',
                  'image': ARTICLE_IMAGES,
              },
              f'{BASE}#article-mdd-attachment-dissociation-trauma-2021': {
                  'datePublished': '2021-09-06T00:00:00Z',
                  'dateModified': '2021-09-06T00:00:00Z',
                  'url': 'https://doi.org/10.3390/healthcare9091169',
                  'image': ARTICLE_IMAGES,
              },
          }

          def types(node):
              value = node.get('@type')
              if isinstance(value, list):
                  return {item for item in value if isinstance(item, str)}
              return {value} if isinstance(value, str) else set()

          def patch(document):
              graph = document.get('@graph')
              if not isinstance(graph, list):
                  raise RuntimeError('Missing @graph array')
              by_id = {
                  node.get('@id'): node
                  for node in graph
                  if isinstance(node, dict) and isinstance(node.get('@id'), str)
              }

              for node in graph:
                  if not isinstance(node, dict):
                      continue
                  if 'ImageObject' in types(node) and isinstance(node.get('contentUrl'), str):
                      node['url'] = node['contentUrl']

              dataset = by_id.get(DATASET_ID)
              if not isinstance(dataset, dict):
                  raise RuntimeError(f'Missing {DATASET_ID}')
              dataset['spatialCoverage'] = [
                  {
                      '@type': 'Place',
                      'name': 'Iran',
                      'alternateName': 'ایران',
                      'sameAs': 'https://www.wikidata.org/entity/Q794',
                  },
                  {
                      '@type': 'Place',
                      'name': 'Iraq',
                      'alternateName': 'عراق',
                      'sameAs': 'https://www.wikidata.org/entity/Q796',
                  },
              ]

              logo = by_id.get(LOGO_ID)
              if not isinstance(logo, dict) or not isinstance(logo.get('contentUrl'), str):
                  raise RuntimeError(f'Missing {LOGO_ID}')
              logo.update({
                  'url': logo['contentUrl'],
                  'creditText': 'Dr. Saeed Ghezelbash Aesthetic Clinic',
                  'license': 'https://creativecommons.org/licenses/by/4.0/',
                  'acquireLicensePage': f'{BASE}#license',
                  'copyrightNotice': '© 2026 Dr. Saeed Ghezelbash',
              })

              for article_id, values in ARTICLE_FIXES.items():
                  article = by_id.get(article_id)
                  if not isinstance(article, dict):
                      raise RuntimeError(f'Missing {article_id}')
                  article.update(values)
              return document

          head_path = ROOT / 'src/data/semantic/head-graph.min.jsonld'
          full_path = ROOT / 'public/graph.jsonld'
          ttl_path = ROOT / 'public/graph.ttl'

          head_doc = patch(json.loads(head_path.read_text(encoding='utf-8')))
          head_text = json.dumps(head_doc, ensure_ascii=False, separators=(',', ':')) + '\n'
          head_path.write_text(head_text, encoding='utf-8')

          full_doc = patch(json.loads(full_path.read_text(encoding='utf-8')))
          full_text = json.dumps(full_doc, ensure_ascii=False, indent=2) + '\n'
          full_path.write_text(full_text, encoding='utf-8')

          rdf = Graph().parse(data=full_text, format='json-ld')
          canonical = to_canonical_graph(rdf)
          nt = canonical.serialize(format='nt')
          ttl_path.write_text(
              '\n'.join(sorted(line.strip() for line in nt.splitlines() if line.strip())) + '\n',
              encoding='utf-8',
          )

          layout_path = ROOT / 'src/layouts/BaseLayout.astro'
          layout = layout_path.read_text(encoding='utf-8')
          layout = layout.replace("import { hardenRichResultsGraph } from '../lib/rich-results-graph.mjs';\n", '')
          layout = layout.replace('const structuredData = hardenRichResultsGraph(headGraph);\n', '')
          layout = layout.replace('const structuredData = headGraph;\n', '')
          layout = layout.replace('set:html={structuredData}', 'set:html={headGraph}')
          layout_path.write_text(layout, encoding='utf-8')

          package_path = ROOT / 'package.json'
          package = json.loads(package_path.read_text(encoding='utf-8'))
          package['scripts'] = {'build': 'astro build'}
          package_path.write_text(json.dumps(package, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          for obsolete in (
              ROOT / 'src/lib/rich-results-graph.mjs',
              ROOT / 'scripts/sync-rich-results-csp.mjs',
              ROOT / 'src/lib/page-projections.ts',
          ):
              obsolete.unlink(missing_ok=True)

          digest = base64.b64encode(hashlib.sha256(head_text.encode('utf-8')).digest()).decode('ascii')
          headers_path = ROOT / 'public/_headers'
          headers = headers_path.read_text(encoding='utf-8')
          headers, count = re.subn(
              r"(script-src 'self' )'sha256-[A-Za-z0-9+/=]+';",
              rf"\1'sha256-{digest}';",
              headers,
              count=1,
          )
          if count != 1:
              raise RuntimeError('Failed to update CSP hash')
          headers_path.write_text(headers, encoding='utf-8')

          forbidden = ('rich-results-graph.mjs', 'sync-rich-results-csp.mjs', 'hardenRichResultsGraph', 'page-projections')
          for path in ROOT.rglob('*'):
              if not path.is_file() or '.git' in path.parts:
                  continue
              if path.as_posix() == '.github/workflows/validate.yml':
                  continue
              if path.suffix.lower() not in {'.astro', '.js', '.mjs', '.ts', '.json', '.py', '.yml', '.yaml'}:
                  continue
              text = path.read_text(encoding='utf-8', errors='ignore')
              for token in forbidden:
                  if token in text:
                      raise RuntimeError(f'Parallel helper reference remains: {path} -> {token}')
          PY

          npm ci --no-audit --no-fund
          npm run build
          python3 .github/scripts/validate_source.py

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Canonical graph sources already contain the direct fixes.'
            exit 0
          fi
          git commit -m 'Fix Rich Results directly in canonical graph sources'
          git push origin HEAD:main

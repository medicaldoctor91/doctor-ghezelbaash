name: Update CSS validation contract

on:
  push:
    branches: [stage6-external-css-20260729]
    paths:
      - '.github/workflows/update-css-validation-contract.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage6-external-css-20260729
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
          cache: npm
      - name: Replace blanket stylesheet ban with constrained contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path=Path('.github/scripts/validate_source.py')
          text=path.read_text(encoding='utf-8')
          old='require(not parser.stylesheets, f"render-blocking external stylesheets found: {parser.stylesheets}")\n'
          new='''require(1 <= len(parser.stylesheets) <= 3, f"expected 1-3 generated stylesheets, found: {parser.stylesheets}")\nstylesheet_bytes = 0\nfor href in parser.stylesheets:\n    require(bool(re.fullmatch(r"/_astro/[A-Za-z0-9_-]+\\.[A-Za-z0-9_-]+\\.css", href)), f"stylesheet is not a fingerprinted same-origin Astro asset: {href}")\n    stylesheet_path = DIST / href.lstrip("/")\n    require(stylesheet_path.is_file(), f"stylesheet is absent from dist: {href}")\n    if stylesheet_path.is_file():\n        css_bytes = stylesheet_path.read_bytes()\n        stylesheet_bytes += len(css_bytes)\n        css_text = css_bytes.decode("utf-8", errors="replace")\n        require(len(css_bytes) <= 20_000, f"stylesheet exceeds 20 KB raw gate: {href} ({len(css_bytes)} bytes)")\n        require("@import" not in css_text, f"stylesheet imports another render-blocking resource: {href}")\n        require("http://" not in css_text and "https://" not in css_text, f"stylesheet references a cross-origin resource: {href}")\nrequire(stylesheet_bytes <= 24_000, f"combined generated CSS exceeds 24 KB raw gate: {stylesheet_bytes} bytes")\nrequire("/_astro/*" in headers if 'headers' in globals() else True, "")\n'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one blanket stylesheet assertion, found {text.count(old)}')
          text=text.replace(old,new)
          # Move immutable-header assertion to after headers is loaded.
          marker='headers = read_text("public/_headers")\n'
          replacement='headers = read_text("public/_headers")\nrequire("/_astro/*" in headers and "max-age=31536000, immutable" in headers, "generated Astro assets lack immutable cache policy")\n'
          if text.count(marker) != 1:
              raise SystemExit('headers marker not found exactly once')
          text=text.replace(marker,replacement)
          text=text.replace('require("/_astro/*" in headers if \'headers\' in globals() else True, "")\n','')
          path.write_text(text,encoding='utf-8')
          PY
          python3 -m py_compile .github/scripts/validate_source.py
          npm ci --no-audit --no-fund
          npm run build
          python3 -m pip install --quiet rdflib
          python3 .github/scripts/validate_source.py
      - name: Commit validated source contract
        shell: bash
        run: |
          set -euo pipefail
          git add .github/scripts/validate_source.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Validate constrained external CSS delivery [skip ci]'
          git push origin HEAD:stage6-external-css-20260729

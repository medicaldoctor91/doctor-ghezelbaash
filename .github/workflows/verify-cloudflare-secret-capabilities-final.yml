name: Verify Cloudflare secret capabilities and final canonical convergence
on:
  push:
    branches: [final/release-convergence]
    paths:
      - .github/workflows/verify-cloudflare-secret-capabilities-final.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: '884d1d90bd1fb6ecca14992c6c60d677'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ZONE_NAME: 'ghezelbaash.ir'
      PROJECT: 'doctor-ghezelbaash'
      CANONICAL: 'https://www.ghezelbaash.ir'
      EXPECTED_GRAPH_SHA: 'a62d77230334598f3a5d73c34831c1dbf93b634c784eae4c4b98185a2fd27ed4'
      EXPECTED_HTML_SHA: 'f62dfb340a94994912e0710806fa83fe1b432a1787d24b4bde03b377f7dca9a8'
      VERSION_DOI: '10.5281/zenodo.21892769'
    steps:
      - name: Verify secret, effective Cloudflare capabilities, limited purge, and live final bytes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os,time,urllib.error,urllib.parse,urllib.request
          token=os.environ.get('CLOUDFLARE_API_TOKEN','')
          if not token:
              raise SystemExit('SECRET_MISSING:CLOUDFLARE_API_TOKEN')
          print('SECRET_PRESENT=CLOUDFLARE_API_TOKEN')
          base='https://api.cloudflare.com/client/v4'
          account=os.environ['CLOUDFLARE_ACCOUNT_ID']
          zone_name=os.environ['ZONE_NAME']
          headers={'Authorization':f'Bearer {token}','Accept':'application/json','Content-Type':'application/json','User-Agent':'ghezelbaash-final-cloudflare-capability-verifier/1.0'}
          def raw(method,path,body=None):
              data=None if body is None else json.dumps(body,separators=(',',':')).encode()
              req=urllib.request.Request(base+path,data=data,headers=headers,method=method)
              try:
                  with urllib.request.urlopen(req,timeout=45) as r:
                      b=r.read().decode('utf-8','replace')
                      return r.status,(json.loads(b) if b else {})
              except urllib.error.HTTPError as e:
                  b=e.read().decode('utf-8','replace')
                  try:p=json.loads(b) if b else {}
                  except Exception:p={'raw':b[:1200]}
                  return e.code,p
          caps={}
          st,p=raw('GET','/zones?'+urllib.parse.urlencode({'name':zone_name,'account.id':account,'per_page':50}))
          rows=p.get('result') or [] if isinstance(p,dict) else []
          exact=[x for x in rows if x.get('name')==zone_name]
          caps['zoneRead']=(st==200 and p.get('success') is True and len(exact)==1)
          print('CAP_ZONE_READ=',caps['zoneRead'],'HTTP=',st)
          if not caps['zoneRead']: raise SystemExit('ZONE_READ_FAILED')
          zid=str(exact[0]['id'])
          st,p=raw('GET',f'/accounts/{account}/pages/projects/{os.environ["PROJECT"]}')
          caps['pagesRead']=(st==200 and p.get('success') is True)
          print('CAP_PAGES_READ=',caps['pagesRead'],'HTTP=',st)
          st,p=raw('GET',f'/zones/{zid}/rulesets')
          caps['rulesetsRead']=(st==200 and p.get('success') is True)
          print('CAP_RULESETS_READ=',caps['rulesetsRead'],'HTTP=',st)
          files=[os.environ['CANONICAL']+'/',os.environ['CANONICAL']+'/graph.jsonld']
          st,p=raw('POST',f'/zones/{zid}/purge_cache',{'files':files})
          caps['cachePurge']=(st in (200,201) and p.get('success') is True)
          print('CAP_CACHE_PURGE=',caps['cachePurge'],'HTTP=',st,'ERRORS=',json.dumps(p.get('errors') or [],ensure_ascii=False)[:800])
          expected={'/':os.environ['EXPECTED_HTML_SHA'],'/graph.jsonld':os.environ['EXPECTED_GRAPH_SHA']}
          live={}
          for path,exp in expected.items():
              ok=False
              for i in range(12):
                  req=urllib.request.Request(os.environ['CANONICAL']+path,headers={'User-Agent':'ghezelbaash-final-live-verifier/1.0','Accept-Encoding':'identity','Cache-Control':'no-cache'})
                  with urllib.request.urlopen(req,timeout=45) as r:
                      body=r.read(); got=hashlib.sha256(body).hexdigest()
                      row={'status':r.status,'sha256':got,'expected':exp,'match':got==exp,'cfCacheStatus':r.headers.get('CF-Cache-Status'),'age':r.headers.get('Age'),'etag':r.headers.get('ETag'),'hasFinalDoi':os.environ['VERSION_DOI'].encode() in body}
                      if path=='/': row['hasFinalUi']=b'hero-action hero-search-launch' in body
                      live[path]=row
                      if got==exp:
                          ok=True; break
                  time.sleep(1)
              print('LIVE',path,json.dumps(live[path],sort_keys=True))
          print('CAPABILITY_SUMMARY='+json.dumps(caps,sort_keys=True))
          print('LIVE_SUMMARY='+json.dumps(live,sort_keys=True))
          if not all(v.get('match') for v in live.values()): raise SystemExit('FINAL_CANONICAL_BYTES_NOT_CONVERGED')
          print('FINAL_CANONICAL_CONVERGENCE_PASS')
          PY

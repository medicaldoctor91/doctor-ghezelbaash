name: Finalize verified v1.2.2 external convergence

on:
  workflow_run:
    workflows: ["Atomic v1.2.2 maximum integrated release"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: doctor-ghezelbaash-external-mutation
  cancel-in-progress: false

env:
  CONTROL_BRANCH: release-control/v1.2.2
  HF_REPO: doctor-ghezelbaash/dr-saeid-ghezelbaash-entity-data

jobs:
  finalize:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0
      - name: Re-open durable VERIFIED release ledger
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$CONTROL_BRANCH" main --tags
          rm -rf /tmp/v122-final-control
          git worktree add --detach /tmp/v122-final-control "origin/$CONTROL_BRANCH"
          LEDGER=/tmp/v122-final-control/.release/control/v1.2.2.json
          test -f "$LEDGER"
          node - <<'NODE'
          const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/v122-final-control/.release/control/v1.2.2.json'));
          if(x.stage!=='VERIFIED') throw Error(`Finalizer requires VERIFIED ledger, got ${x.stage}`);
          if(!/^[0-9a-f]{40}$/.test(x.sourceCommit||'')) throw Error('Verified sourceCommit missing');
          if(!/^[0-9a-f]{40}$/.test(x.hfCommit||'')) throw Error('Verified hfCommit missing');
          if(String(x.recordId||'')!=='21930954'||x.versionDoi!=='10.5281/zenodo.21930954') throw Error('Verified Zenodo identity drift');
          NODE
          echo "LEDGER=$LEDGER" >> "$GITHUB_ENV"
          echo "SOURCE_COMMIT=$(node -p "require('$LEDGER').sourceCommit")" >> "$GITHUB_ENV"
          echo "HF_RELEASE_SHA=$(node -p "require('$LEDGER').hfCommit")" >> "$GITHUB_ENV"
          echo "RECORD_ID=$(node -p "require('$LEDGER').recordId")" >> "$GITHUB_ENV"
          echo "VERSION_DOI=$(node -p "require('$LEDGER').versionDoi")" >> "$GITHUB_ENV"
      - name: Reverify Git source tag, public GitHub Release, Zenodo and Hugging Face frozen tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse origin/main)" = "$SOURCE_COMMIT"
          test "$(git rev-list -n1 v1.2.2)" = "$SOURCE_COMMIT"
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" > /tmp/releases-final.json
          RID=$(jq -r '[.[] | select(.tag_name=="v1.2.2")][0].id // empty' /tmp/releases-final.json)
          test -n "$RID"
          gh api "repos/$GITHUB_REPOSITORY/releases/$RID" > /tmp/github-release-final.json
          test "$(jq -r '.draft' /tmp/github-release-final.json)" = false
          test "$(jq -r '.tag_name' /tmp/github-release-final.json)" = v1.2.2
          curl --fail --silent --show-error "https://zenodo.org/api/records/$RECORD_ID" >/tmp/zenodo-public.json
          node - <<'NODE'
          const z=require('/tmp/zenodo-public.json');const doi=z.doi||z.pids?.doi?.identifier;
          if(String(z.id)!==String(process.env.RECORD_ID)||doi!==process.env.VERSION_DOI) throw Error('Public Zenodo readback drift');
          NODE
          HF_TAG_OBJ=$(git ls-remote "https://huggingface.co/datasets/$HF_REPO" refs/tags/v1.2.2 | awk '{print $1}')
          HF_TAG_PEELED=$(git ls-remote "https://huggingface.co/datasets/$HF_REPO" 'refs/tags/v1.2.2^{}' | awk '{print $1}')
          test -n "$HF_TAG_OBJ"
          test "${HF_TAG_PEELED:-$HF_TAG_OBJ}" = "$HF_RELEASE_SHA"
          echo "EXTERNAL_RELEASE_OBJECTS_PASS source=$SOURCE_COMMIT hf=$HF_RELEASE_SHA zenodo=$VERSION_DOI github_release_id=$RID"
      - name: Reverify current serving and frozen release truth after main integration
        shell: bash
        run: |
          set -euo pipefail
          BUST=$(date +%s%N)
          curl --fail --silent --show-error -H 'Cache-Control: no-cache' "https://www.ghezelbaash.ir/current-release-matrix.json?finalizer=$BUST" >/tmp/current-release.json
          node - <<'NODE'
          const x=require('/tmp/current-release.json');const text=JSON.stringify(x);
          if(!text.includes('1.2.2')||!text.includes(process.env.VERSION_DOI)||!text.includes(process.env.SOURCE_COMMIT)) throw Error('Cache-busted canonical release matrix drift');
          NODE
          node scripts/verify-current-serving.mjs
          node scripts/verify-release-snapshot.mjs
          echo 'FINAL_EXTERNAL_CONVERGENCE_REVERIFY_PASS'
      - name: Mark durable release control COMPLETE only after all final re-verification passes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name ghezelbaash-release-finalizer
          git config user.email actions@users.noreply.github.com
          node scripts/update-release-control.mjs "$LEDGER" COMPLETE sourceCommit=$SOURCE_COMMIT hfCommit=$HF_RELEASE_SHA githubRelease=v1.2.2 externalConvergence=true
          git -C /tmp/v122-final-control add .release/control/v1.2.2.json
          git -C /tmp/v122-final-control commit -m 'Complete v1.2.2 external convergence after final re-verification'
          git -C /tmp/v122-final-control push origin HEAD:$CONTROL_BRANCH
          echo "V122_RELEASE_COMPLETE_PASS source=$SOURCE_COMMIT"

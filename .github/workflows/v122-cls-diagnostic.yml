name: Diagnose v1.2.2 mobile CLS root cause

on:
  push:
    branches: [main]
    paths: [.release/v122-cls-diagnostic-request.json]

permissions:
  contents: read

concurrency:
  group: doctor-ghezelbaash-external-mutation
  cancel-in-progress: false

env:
  PREVIEW_URL: https://staging-deploy.doctor-ghezelbaash.pages.dev/

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: release/v1.2.2-candidate
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Capture repeated 390px Lighthouse layout-shift internals
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/cls
          for sample in 1 2 3; do
            for kind in base candidate; do
              if [ "$kind" = base ]; then URL="https://www.ghezelbaash.ir/?__cls_diag=base_${sample}_$(date +%s%N)"; else URL="${PREVIEW_URL}?__cls_diag=candidate_${sample}_$(date +%s%N)"; fi
              npx --yes lighthouse@13.4.1 "$URL" --quiet --only-categories=performance --output=json --chrome-flags='--headless --no-sandbox --disable-gpu' --form-factor=mobile --screenEmulation.width=390 --screenEmulation.height=844 --screenEmulation.deviceScaleFactor=2 --screenEmulation.mobile=true --output-path="/tmp/cls/${kind}-${sample}.json"
            done
          done
          node - <<'NODE'
          const fs=require('fs');
          const compactNode=n=>n?{snippet:n.snippet,nodeLabel:n.nodeLabel,selector:n.selector,path:n.path}:null;
          const summarize=(kind,sample)=>{
            const x=JSON.parse(fs.readFileSync(`/tmp/cls/${kind}-${sample}.json`));
            const audits=x.audits;
            const keys=Object.keys(audits).filter(k=>/shift|layout|font|image.*size|unsized/i.test(k));
            const interesting={};
            for(const k of keys){const a=audits[k];if(a.score!==1||a.numericValue||a.details?.items?.length){interesting[k]={score:a.score,numericValue:a.numericValue,numericUnit:a.numericUnit,displayValue:a.displayValue,items:(a.details?.items||[]).slice(0,12).map(it=>{const o={...it};for(const key of Object.keys(o)){if(o[key]&&typeof o[key]==='object'&&('snippet' in o[key]||'nodeLabel' in o[key]))o[key]=compactNode(o[key]);}return o;})}}}
            return {kind,sample,performance:Math.round(x.categories.performance.score*100),cls:audits['cumulative-layout-shift']?.numericValue,lcp:audits['largest-contentful-paint']?.numericValue,tbt:audits['total-blocking-time']?.numericValue,interesting};
          };
          const all=[];for(const s of [1,2,3])for(const k of ['base','candidate'])all.push(summarize(k,s));
          console.log('CLS_DIAGNOSTIC_BEGIN');console.log(JSON.stringify(all,null,2));console.log('CLS_DIAGNOSTIC_END');
          NODE
      - name: Compare the only approved above-the-fold visible delta
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error 'https://www.ghezelbaash.ir/?__cls_text=base' >/tmp/base.html
          curl --fail --silent --show-error "$PREVIEW_URL?__cls_text=candidate" >/tmp/candidate.html
          node - <<'NODE'
          const fs=require('fs');
          const extract=s=>{const m=s.match(/<div class="hero-caption-reputation" id="google-maps-clinic-reputation-current">([\s\S]*?)<\/div>/);if(!m)throw Error('reputation selector missing');return m[1].replace(/<[^>]+>/g,'').replace(/\s+/g,' ').trim()};
          const b=extract(fs.readFileSync('/tmp/base.html','utf8')),c=extract(fs.readFileSync('/tmp/candidate.html','utf8'));
          console.log(JSON.stringify({base:b,candidate:c,baseChars:[...b].length,candidateChars:[...c].length,deltaChars:[...c].length-[...b].length},null,2));
          NODE

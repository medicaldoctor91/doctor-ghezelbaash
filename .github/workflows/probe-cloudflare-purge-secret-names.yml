name: Probe Cloudflare purge credential names
on:
  push:
    branches: [final/release-convergence]
    paths:
      - .github/workflows/probe-cloudflare-purge-secret-names.yml
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CLOUDFLARE_CACHE_PURGE_TOKEN: ${{ secrets.CLOUDFLARE_CACHE_PURGE_TOKEN }}
      CF_CACHE_PURGE_TOKEN: ${{ secrets.CF_CACHE_PURGE_TOKEN }}
      CLOUDFLARE_ZONE_API_TOKEN: ${{ secrets.CLOUDFLARE_ZONE_API_TOKEN }}
      CLOUDFLARE_GLOBAL_API_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
      CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
      CF_EMAIL: ${{ secrets.CF_EMAIL }}
      CLOUDFLARE_ACCOUNT_API_TOKEN: ${{ secrets.CLOUDFLARE_ACCOUNT_API_TOKEN }}
    steps:
      - name: Report only names of non-empty candidate secrets
        shell: bash
        run: |
          python - <<'PY'
          import os
          names=['CLOUDFLARE_CACHE_PURGE_TOKEN','CF_CACHE_PURGE_TOKEN','CLOUDFLARE_ZONE_API_TOKEN','CLOUDFLARE_GLOBAL_API_KEY','CLOUDFLARE_API_KEY','CF_API_KEY','CLOUDFLARE_EMAIL','CF_EMAIL','CLOUDFLARE_ACCOUNT_API_TOKEN']
          available=[n for n in names if os.environ.get(n,'')]
          print('CLOUDFLARE_PURGE_SECRET_NAME_PROBE')
          print('AVAILABLE_NAMES=' + (','.join(available) if available else 'NONE'))
          PY

name: Publish preferred positioning name — HF and Kaggle only
on:
  push:
    branches: [maintenance/positioning-preferred-name-20261018]
    paths: [.github/workflows/positioning-preferred-name-publish.yml]
permissions:
  contents: read
concurrency:
  group: doctor-ghezelbaash-platform-convergence
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN || secrets.HUGGINGFACE_TOKEN || secrets.HUGGING_FACE_TOKEN }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN || secrets.KAGGLE_TOKEN }}
      CANONICAL_WEBSITE_COMMIT: 8edb4d6f2e224886132297ac5f380bee26cb53cb
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - name: Pin website code while preserving narrow maintenance script
        run: |
          cp .github/scripts/positioning_preferred_name_maintenance.py /tmp/positioning_preferred_name_maintenance.py
          git checkout --detach "$CANONICAL_WEBSITE_COMMIT"
          cp /tmp/positioning_preferred_name_maintenance.py .github/scripts/positioning_preferred_name_maintenance.py
          test "$(git rev-parse HEAD)" = "$CANONICAL_WEBSITE_COMMIT"
      - uses: actions/setup-node@v4
        with: {node-version-file: .nvmrc, cache: npm}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Credentials presence check (no secret values logged)
        run: |
          python - <<'PY'
          import os
          missing=[x for x in ['HF_TOKEN','KAGGLE_API_TOKEN'] if not os.environ.get(x)]
          assert not missing, 'Missing credential bindings: '+','.join(missing)
          PY
      - name: Install fixed-source verification dependencies
        run: |
          npm ci
          python -m pip install --disable-pip-version-check             'huggingface_hub>=0.34,<1' 'pyarrow>=18,<23' 'kaggle>=2.2,<3'             'rdflib>=7,<8' 'pyshacl>=0.30,<1' 'mlcroissant>=1.0.22,<2' 'pyyaml>=6,<7'
      - name: Test and verify canonical source before any platform mutation
        run: |
          python -m py_compile .github/scripts/positioning_preferred_name_maintenance.py
          python - <<'PY'
          import sys
          sys.path.insert(0, '.github/scripts')
          from positioning_preferred_name_maintenance import verified_name_patch, OLD, PREFERRED
          doc={"entity":{"preferred_name_en":OLD,"clinic_name_en":"Test Clinic","services":["filler"]},
               "historical_release_doi":"10.5281/zenodo.21910785","other_data":["untouched"]}
          new=verified_name_patch(doc)
          assert new["entity"]["preferred_name_en"]==PREFERRED
          assert OLD in new["entity"]["alternate_names_en"]
          assert new["historical_release_doi"]==doc["historical_release_doi"]
          assert new["other_data"]==doc["other_data"]
          assert doc["entity"]["preferred_name_en"]==OLD
          print("NAME_PATCH_UNIT_TEST_PASS")
          PY
          node --test tests/*.test.mjs
          npm run build
          python tests/validate_canonical_invariants.py dist
      - name: Publish HF name correction and exact Kaggle version with public verification
        run: python .github/scripts/positioning_preferred_name_maintenance.py

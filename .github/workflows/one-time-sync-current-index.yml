name: One-time sync current v1.3.3 index HTML

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-time-sync-current-index.yml"

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
      EXPECTED_RELEASE: "1.3.3"
      EXPECTED_RECORD: "22838416"
      EXPECTED_DOI: "10.5281/zenodo.22838416"
      HF_REPO: "doctor-ghezelbaash/dr-saeid-ghezelbaash-entity-data"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Build and lock release identity
        run: |
          set -euo pipefail
          npm ci
          npm run build
          test -s dist/index.html
          node - <<'NODE'
          const r=require('./src/data/release.json');
          if(r.release!==process.env.EXPECTED_RELEASE) throw new Error('release drift');
          if(String(r.dataset?.zenodo?.recordId)!==process.env.EXPECTED_RECORD) throw new Error('record drift');
          if(r.dataset?.zenodo?.versionDoi!==process.env.EXPECTED_DOI) throw new Error('DOI drift');
          const hf=(r.dataset?.huggingFace?.dataset||'').replace('https://huggingface.co/datasets/','');
          if(hf!==process.env.HF_REPO) throw new Error('HF repo drift');
          NODE
          sha256sum dist/index.html

      - name: Require live website parity before external mutation
        run: |
          set -euo pipefail
          WANT="$(sha256sum dist/index.html | awk '{print $1}')"
          ok=false
          for attempt in $(seq 1 18); do
            curl -fsSL --retry 2 --max-time 60 -H 'Cache-Control: no-cache' \
              "https://www.ghezelbaash.ir/?sync=${GITHUB_SHA}-${attempt}" -o /tmp/live-index.html
            GOT="$(sha256sum /tmp/live-index.html | awk '{print $1}')"
            if [ "$GOT" = "$WANT" ]; then ok=true; break; fi
            sleep 10
          done
          test "$ok" = true

      - name: Edit Zenodo published 1.3.3 in place
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN || secrets.ZENODO_ACCESS_TOKEN || secrets.ZENODO_API_TOKEN || secrets.ZENODO_API_KEY || secrets.ZENODO_PAT }}
        run: |
          set -euo pipefail
          test -n "${ZENODO_TOKEN:-}"
          echo "::add-mask::$ZENODO_TOKEN"
          python3 - <<'PY'
          import hashlib, json, os, urllib.request, urllib.error
          from pathlib import Path

          token=os.environ["ZENODO_TOKEN"]
          record=os.environ["EXPECTED_RECORD"]
          doi=os.environ["EXPECTED_DOI"]
          version=os.environ["EXPECTED_RELEASE"]
          base="https://zenodo.org/api"
          local=Path("dist/index.html").read_bytes()
          want=hashlib.sha256(local).hexdigest()

          def request(url, method="GET", data=None, content_type=None, allowed=(200,201,202,204)):
              headers={
                  "Authorization":f"Bearer {token}",
                  "Accept":"application/json",
                  "User-Agent":"ghezelbaash-index-sync/1.0",
              }
              if content_type:
                  headers["Content-Type"]=content_type
              req=urllib.request.Request(url,data=data,method=method,headers=headers)
              try:
                  with urllib.request.urlopen(req,timeout=120) as resp:
                      body=resp.read()
                      if resp.status not in allowed:
                          raise RuntimeError(f"{method} {url} => {resp.status}")
                      return resp.status,body,dict(resp.headers)
              except urllib.error.HTTPError as e:
                  body=e.read()
                  raise RuntimeError(f"{method} {url} => HTTP {e.code}: {body[:1200]!r}")

          def public_index():
              req=urllib.request.Request(
                  f"{base}/records/{record}/files/index.html/content",
                  headers={"User-Agent":"ghezelbaash-index-sync/1.0","Cache-Control":"no-cache"},
              )
              with urllib.request.urlopen(req,timeout=120) as resp:
                  return resp.read()

          _,body,_=request(f"{base}/records/{record}")
          pub=json.loads(body)
          if pub.get("doi")!=doi or (pub.get("metadata") or {}).get("version")!=version:
              raise RuntimeError("Zenodo identity mismatch before edit")

          if hashlib.sha256(public_index()).hexdigest()==want:
              print(json.dumps({"zenodo":"ALREADY_SYNCED","sha256":want}))
              raise SystemExit(0)

          # InvenioRDM edit action: POST published record's /draft.
          try:
              request(f"{base}/records/{record}/draft",method="POST",data=b"{}",
                      content_type="application/json",allowed=(200,201,202))
          except RuntimeError as exc:
              # Existing edit draft is acceptable; anything else is not.
              if "409" not in str(exc):
                  raise

          _,body,_=request(f"{base}/records/{record}/draft")
          draft=json.loads(body)
          links=draft.get("links") or {}
          files_url=links.get("files") or f"{base}/records/{record}/draft/files"
          publish_url=links.get("publish") or f"{base}/records/{record}/draft/actions/publish"

          try:
              request(f"{files_url}/index.html",method="DELETE",allowed=(200,204))
          except RuntimeError as exc:
              if "404" not in str(exc):
                  raise

          request(files_url,method="POST",
                  data=json.dumps([{"key":"index.html"}]).encode(),
                  content_type="application/json",allowed=(200,201))
          request(f"{files_url}/index.html/content",method="PUT",data=local,
                  content_type="application/octet-stream",allowed=(200,201,204))
          request(f"{files_url}/index.html/commit",method="POST",allowed=(200,201,202,204))
          request(publish_url,method="POST",allowed=(200,201,202))

          _,body,_=request(f"{base}/records/{record}")
          pub=json.loads(body)
          if pub.get("doi")!=doi or (pub.get("metadata") or {}).get("version")!=version:
              raise RuntimeError("Zenodo identity changed after edit")
          got=hashlib.sha256(public_index()).hexdigest()
          if got!=want:
              raise RuntimeError(f"Zenodo readback mismatch {got} != {want}")
          print(json.dumps({"zenodo":"SYNCED_SAME_RECORD","record":record,"doi":doi,"version":version,"sha256":want}))
          PY

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install pinned Hugging Face client
        run: python3 -m pip install --disable-pip-version-check "huggingface_hub==1.32.0"

      - name: Synchronize Hugging Face main index.html only
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN || secrets.HUGGINGFACE_TOKEN || secrets.HUGGING_FACE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${HF_TOKEN:-}"
          echo "::add-mask::$HF_TOKEN"
          python3 - <<'PY'
          import hashlib, os, urllib.request
          from pathlib import Path
          from huggingface_hub import HfApi, CommitOperationAdd

          repo=os.environ["HF_REPO"]
          version=os.environ["EXPECTED_RELEASE"]
          token=os.environ["HF_TOKEN"]
          local=Path("dist/index.html").read_bytes()
          want=hashlib.sha256(local).hexdigest()
          api=HfApi(endpoint="https://huggingface.co",token=token)

          who=api.whoami()
          if str(who.get("name","")).casefold()!="ghezelbaash":
              raise RuntimeError("Unexpected HF principal")

          main=api.repo_info(repo_id=repo,repo_type="dataset",revision="main")
          frozen=api.repo_info(repo_id=repo,repo_type="dataset",revision=f"v{version}")
          main_before=main.sha
          frozen_before=frozen.sha

          def read_index(sha):
              url=f"https://huggingface.co/datasets/{repo}/resolve/{sha}/index.html?download=true"
              with urllib.request.urlopen(url,timeout=120) as resp:
                  return resp.read()

          if hashlib.sha256(read_index(main.sha)).hexdigest()!=want:
              result=api.create_commit(
                  repo_id=repo,
                  repo_type="dataset",
                  revision="main",
                  parent_commit=main.sha,
                  create_pr=False,
                  commit_message=f"Synchronize current index.html for release {version}",
                  commit_description="Presentation-only HTML parity repair; canonical graph and frozen release tag remain unchanged.",
                  operations=[CommitOperationAdd(path_in_repo="index.html",path_or_fileobj="dist/index.html")],
              )
              if not result.oid or result.oid==main_before:
                  raise RuntimeError("HF main did not advance")
              main=api.repo_info(repo_id=repo,repo_type="dataset",revision="main")

          frozen_after=api.repo_info(repo_id=repo,repo_type="dataset",revision=f"v{version}")
          if frozen_after.sha!=frozen_before:
              raise RuntimeError("HF frozen v1.3.3 tag changed")
          got=hashlib.sha256(read_index(main.sha)).hexdigest()
          if got!=want:
              raise RuntimeError(f"HF readback mismatch {got} != {want}")
          print({"huggingface":"SYNCED_MAIN","mainBefore":main_before,"mainAfter":main.sha,
                 "frozenTag":frozen_before,"sha256":want})
          PY

      - name: Verify all website/HF/Zenodo shared resources
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, urllib.parse, urllib.request
          from pathlib import Path

          release=json.loads(Path("src/data/release.json").read_text())
          registry=json.loads(Path("src/data/machine-resources.json").read_text())
          shared=sorted(r["path"] for r in registry["resources"]
                        if {"website","huggingFace","zenodo"}.issubset(set(r.get("targets") or [])))
          record=str(release["dataset"]["zenodo"]["recordId"])
          hf=release["dataset"]["huggingFace"]["dataset"].removeprefix("https://huggingface.co/datasets/")
          def h(b): return hashlib.sha256(b).hexdigest()
          def get(url):
              req=urllib.request.Request(url,headers={"Cache-Control":"no-cache","User-Agent":"ghezelbaash-parity/1.0"})
              with urllib.request.urlopen(req,timeout=120) as resp: return resp.read()
          bad=[]
          for name in shared:
              local=(Path("dist")/name).read_bytes()
              live=get("https://www.ghezelbaash.ir/" + ("" if name=="index.html" else urllib.parse.quote(name)))
              hfbytes=get(f"https://huggingface.co/datasets/{hf}/resolve/main/{urllib.parse.quote(name)}?download=true")
              zen=get(f"https://zenodo.org/api/records/{record}/files/{urllib.parse.quote(name,safe='')}/content")
              hashes={"local":h(local),"website":h(live),"hf":h(hfbytes),"zenodo":h(zen)}
              if len(set(hashes.values()))!=1:
                  bad.append({"file":name,"hashes":hashes})
          print(json.dumps({"release":release["release"],"sharedResources":len(shared),"mismatches":bad},indent=2))
          if bad:
              raise SystemExit(3)
          PY

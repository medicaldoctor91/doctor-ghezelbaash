name: Maintain current release visibility and consistency

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/**
      - scripts/**
      - .release/policy/**
  workflow_dispatch:
    inputs:
      apply:
        description: Reconcile mutable public surfaces against the exact frozen production release
        type: boolean
        default: false

  workflow_call:
    inputs:
      apply:
        description: Reconcile the frozen production release
        type: boolean
        default: false
      source_sha:
        description: Exact post-release commit to verify and, when apply is true, reconcile
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: doctor-ghezelbaash-external-mutation
  cancel-in-progress: false
  queue: max

jobs:
  maintain:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      actions: write
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
      MAINTENANCE_SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14.6"
      - run: npm ci
      - name: Install pinned Viewer packaging dependency
        run: python3 -m pip install --requirement scripts/requirements-hf-viewer.txt
      - name: Validate operational source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          npm run security:dependencies
          node scripts/dependency-advisory-gate.mjs --self-test
          npm run validate:release-contract
          node scripts/platform-contract.mjs validate
          node scripts/verify-live.mjs test-release-context
          node scripts/test-transient-retry.mjs
          python3 scripts/build-hf-viewer.py --self-test
          node scripts/test-hugging-face-viewer.mjs
      - name: Verify the selected maintenance source
        run: |
          set -euo pipefail
          [[ "$MAINTENANCE_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$MAINTENANCE_SOURCE_SHA"
      - name: Authorize manual public reconciliation against one frozen source
        if: github.event_name == 'workflow_dispatch' && inputs.apply == true
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./src/data/release.json').release")"
          git fetch --no-tags origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/heads/production:refs/remotes/origin/production"
          git fetch --force origin "refs/tags/v$VERSION:refs/tags/v$VERSION"
          MAIN_SHA="$(git rev-parse refs/remotes/origin/main)"
          PRODUCTION_SHA="$(git rev-parse refs/remotes/origin/production)"
          TAG_SHA="$(git rev-parse "refs/tags/v$VERSION^{commit}")"
          test "$MAIN_SHA" = "$MAINTENANCE_SOURCE_SHA"
          test "$PRODUCTION_SHA" = "$MAINTENANCE_SOURCE_SHA"
          test "$TAG_SHA" = "$MAINTENANCE_SOURCE_SHA"
          echo "MANUAL_PUBLIC_RECONCILIATION_AUTHORIZED source=$MAINTENANCE_SOURCE_SHA version=$VERSION"
      - name: Pin production and the immutable release before any mutation
        run: |
          set -euo pipefail
          git fetch --no-tags origin production
          PRODUCTION_SHA="$(git rev-parse FETCH_HEAD)"
          VERSION="$(node -p "require('./src/data/release.json').release")"
          test "$(git rev-parse "refs/tags/v$VERSION^{commit}")" = "$PRODUCTION_SHA"
          git worktree add --detach .release/frozen "$PRODUCTION_SHA"
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const main = await readFile('src/data/release.json', 'utf8');
          const production = await readFile('.release/frozen/src/data/release.json', 'utf8');
          if (main !== production) throw new Error('Main release lifecycle differs from production');
          NODE
          printf 'PRODUCTION_SHA=%s\n' "$PRODUCTION_SHA" >> "$GITHUB_ENV"
          node scripts/platform-contract.mjs export >> "$GITHUB_ENV"
          mkdir -p .release/runtime/finalization
      - name: Prove every DIST file remains identical to the frozen release
        run: |
          set -euo pipefail
          npm run build
          (
            cd .release/frozen
            npm ci
            export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
            export CF_PAGES_COMMIT_SHA="$PRODUCTION_SHA"
            npm run build
          )
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          def hashes(root):
              return {p.relative_to(root).as_posix(): hashlib.sha256(p.read_bytes()).hexdigest()
                      for p in root.rglob('*') if p.is_file()}
          main, frozen = hashes(Path('dist')), hashes(Path('.release/frozen/dist'))
          drift = sorted(k for k in set(main) | set(frozen) if main.get(k) != frozen.get(k))
          if drift:
              raise SystemExit(f'DIST drift requires a coordinated new release: {drift}')
          result = {'distInvariant': 'PASS', 'files': len(main), 'hashes': main}
          Path('.release/runtime/finalization/dist-invariance.json').write_text(json.dumps(result, indent=2) + '\n')
          print(f'DIST_INVARIANCE_PASS files={len(main)}')
          PY
      - name: Verify frozen Zenodo and Hugging Face release bytes
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN || secrets.ZENODO_ACCESS_TOKEN || secrets.ZENODO_API_TOKEN || secrets.ZENODO_API_KEY || secrets.ZENODO_PAT }}
        run: |
          set -euo pipefail
          node scripts/run-transient-command.mjs -- node scripts/verify-live.mjs release \
            --source-root .release/frozen --dist-root dist \
            > .release/runtime/finalization/frozen-release.json
          cat .release/runtime/finalization/frozen-release.json
      - name: Prepare Hugging Face Viewer packaging for read-only comparison
        run: |
          set -euo pipefail
          mkdir -p .release/huggingface
          node scripts/huggingface.mjs prepare dist .release/huggingface
      - name: Verify exact published Hugging Face dataset packaging without mutation
        run: node scripts/huggingface.mjs sync-dataset .release/huggingface --source-root .release/frozen --check
      - name: Reconcile registered workflows with maintained source
        env:
          GH_TOKEN: ${{ github.token }}
          APPLY_WORKFLOW_CLEANUP: ${{ github.event_name == 'workflow_dispatch' && inputs.apply == true }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { writeFile } from 'node:fs/promises';
          import { setTimeout } from 'node:timers/promises';
          const repo = process.env.GITHUB_REPOSITORY;
          if (repo !== 'medicaldoctor91/doctor-ghezelbaash') throw new Error('Unexpected workflow repository');
          const sourceCommit = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          const sourcePath = path => /^\.github\/workflows\/[^/]+\.ya?ml$/.test(path);
          const tracked = new Set(execFileSync('git', ['ls-files', '-z', '--', '.github/workflows'],
            { encoding: 'utf8' }).split('\0').filter(sourcePath));
          if (!tracked.has('.github/workflows/authority-maintenance.yml')) throw new Error('Maintained workflow source missing');
          const api = (endpoint, { method = 'GET', paginate = false } = {}) => {
            const args = ['api', '--method', method, '-H', 'X-GitHub-Api-Version: 2026-03-10'];
            if (paginate) args.push('--paginate', '--slurp');
            const output = execFileSync('gh', [...args, endpoint],
              { encoding: 'utf8', maxBuffer: 8 * 1024 * 1024, timeout: 60000 });
            return output.trim() ? JSON.parse(output) : null;
          };
          const inventory = () => {
            const pages = api(`repos/${repo}/actions/workflows?per_page=100`, { paginate: true });
            const rows = pages.flatMap(page => page.workflows);
            if (!pages.length || pages.some(page => page.total_count !== rows.length) ||
                new Set(rows.map(row => row.id)).size !== rows.length ||
                rows.some(row => !Number.isSafeInteger(row.id) || row.id <= 0 || typeof row.path !== 'string'))
              throw new Error('Incomplete or inconsistent workflow inventory');
            return rows;
          };
          const retiredActive = rows => rows.filter(row =>
            sourcePath(row.path) && !tracked.has(row.path) && row.state === 'active');
          const assertCurrentMain = () => {
            if (api(`repos/${repo}/git/ref/heads/main`).object.sha !== sourceCommit)
              throw new Error('Main advanced during workflow reconciliation; rerun from the current source');
          };
          const summarize = ({ id, name, path, state }) => ({ id, name, path, state });
          const artifact = (name, value) => writeFile(`.release/runtime/finalization/${name}.json`,
            JSON.stringify(value, null, 2) + '\n');
          const apply = process.env.APPLY_WORKFLOW_CLEANUP === 'true';
          const result = { status: 'RUNNING', apply, sourceCommit, disabledWorkflowIds: [] };
          try {
            assertCurrentMain();
            const before = inventory();
            const targets = retiredActive(before);
            Object.assign(result, { totalBefore: before.length, retiredActiveBefore: targets.length,
              retained: before.filter(row => tracked.has(row.path)).map(summarize),
              platformPreserved: before.filter(row => !sourcePath(row.path)).map(summarize) });
            await artifact('github-workflows-before', before);
            await artifact('github-workflow-reconciliation', result);
            if (apply && targets.length) {
              const requiredRequests = targets.length * 2 + Math.ceil(before.length / 100) + 12;
              const remaining = api('rate_limit').resources.core.remaining;
              if (!Number.isFinite(remaining) || remaining < requiredRequests)
                throw new Error(`Insufficient GitHub API budget: remaining=${remaining} required=${requiredRequests}`);
              for (const [index, workflow] of targets.entries()) {
                assertCurrentMain();
                api(`repos/${repo}/actions/workflows/${workflow.id}/disable`, { method: 'PUT' });
                result.disabledWorkflowIds.push(workflow.id);
                await artifact('github-workflow-reconciliation', result);
                if ((index + 1) % 25 === 0 || index + 1 === targets.length)
                  console.log(`RETIRED_WORKFLOW_PROGRESS disabled=${index + 1}/${targets.length}`);
                if (index + 1 < targets.length) await setTimeout(1100);
              }
            }
            const after = apply && targets.length ? inventory() : before;
            await artifact('github-workflows-after', after);
            Object.assign(result, { totalAfter: after.length, retiredActiveAfter: retiredActive(after).length });
            const byId = new Map(after.map(row => [row.id, row]));
            for (const row of [...result.retained, ...result.platformPreserved])
              if (byId.get(row.id)?.path !== row.path || byId.get(row.id)?.state !== row.state)
                throw new Error(`Preserved workflow changed: ${row.path}`);
            for (const id of result.disabledWorkflowIds)
              if (byId.get(id)?.state !== 'disabled_manually')
                throw new Error(`Workflow disable readback failed: ${id}`);
            assertCurrentMain();
            if (result.retiredActiveAfter) throw new Error(`Retired active workflows remain: ${result.retiredActiveAfter}`);
            result.status = 'PASS';
            console.log(`WORKFLOW_RECONCILIATION_PASS disabled=${result.disabledWorkflowIds.length} retained=${result.retained.length} platform=${result.platformPreserved.length}`);
          } catch (error) {
            result.status = 'FAIL';
            result.error = error.message;
            throw error;
          } finally {
            await artifact('github-workflow-reconciliation', result);
          }
          NODE
      - name: Reconcile Cloudflare production settings and cache
        id: cloudflare
        if: github.event_name == 'workflow_dispatch' && inputs.apply == true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          cd .release/frozen
          export CF_PAGES_COMMIT_SHA="$PRODUCTION_SHA" CF_EXPECTED_COMMIT="$PRODUCTION_SHA"
          node "$GITHUB_WORKSPACE/scripts/run-transient-command.mjs" -- node scripts/cloudflare-pages.mjs ensure --configure
          node "$GITHUB_WORKSPACE/scripts/run-transient-command.mjs" -- node scripts/cloudflare-pages.mjs ensure --verify-config
          node "$GITHUB_WORKSPACE/scripts/run-transient-command.mjs" -- node scripts/cloudflare-pages.mjs ensure
          node "$GITHUB_WORKSPACE/scripts/run-transient-command.mjs" -- python scripts/configure-cloudflare-edge.py --apply --outcome ../runtime/finalization/cloudflare-edge.json
          node "$GITHUB_WORKSPACE/scripts/run-transient-command.mjs" -- python scripts/configure-pages-dev-redirect.py
      - name: Verify the immutable Cloudflare deployment bytes
        if: github.event_name == 'workflow_dispatch' && inputs.apply == true
        env:
          VERIFY_BASE_URL: ${{ steps.cloudflare.outputs.deployment_url }}
        run: |
          set -euo pipefail
          test -n "$VERIFY_BASE_URL"
          node scripts/run-transient-command.mjs -- node scripts/cloudflare-pages.mjs verify --fresh-only
      - name: Synchronize the public organization profile from frozen production
        if: github.event_name == 'workflow_dispatch' && inputs.apply == true
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN || secrets.HUGGINGFACE_TOKEN || secrets.HUGGING_FACE_TOKEN }}
        run: node scripts/huggingface.mjs sync-profile --source-root .release/frozen
      - name: Verify current public bytes, discovery and dataset viewer
        run: |
          set -euo pipefail
          node scripts/huggingface.mjs sync-profile --source-root .release/frozen --check
          node scripts/run-transient-command.mjs -- node scripts/cloudflare-pages.mjs verify
          node scripts/run-transient-command.mjs -- node scripts/verify-live.mjs current > .release/runtime/finalization/current-serving.json
          node scripts/run-transient-command.mjs -- node scripts/huggingface.mjs verify > .release/runtime/finalization/huggingface.json
          node scripts/run-transient-command.mjs -- npm run verify:production
          node scripts/run-transient-command.mjs -- npm run verify:public-discovery
          node scripts/run-transient-command.mjs -- node scripts/verify-dataset-production.mjs
      - name: Verify GitHub public discovery settings and immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY" > .release/runtime/finalization/github-repository.json
          VERSION="$(node -p "require('./src/data/release.json').release")"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/v$VERSION" > .release/runtime/finalization/github-release.json
          gh api "repos/$GITHUB_REPOSITORY/rules/branches/main" > .release/runtime/finalization/github-main-rules.json
          gh api "repos/$GITHUB_REPOSITORY/rules/branches/production" > .release/runtime/finalization/github-production-rules.json
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          import { loadPublicationData } from './scripts/lib/publication-context.mjs';
          const release = await loadPublicationData('.release/frozen');
          const repo = JSON.parse(await readFile('.release/runtime/finalization/github-repository.json'));
          const published = JSON.parse(await readFile('.release/runtime/finalization/github-release.json'));
          if (repo.private || repo.archived || repo.homepage !== release.canonicalUrl)
            throw new Error('GitHub repository public discovery settings drift');
          for (const token of [release.primaryEntity.name, release.primaryEntity.wikidata, 'Zenodo', 'Hugging Face'])
            if (!repo.description?.includes(token)) throw new Error(`Repository description missing ${token}`);
          for (const topic of ['saeed-ghezelbash', 'knowledge-graph', 'json-ld', 'rdf', 'wikidata', 'zenodo', 'huggingface'])
            if (!repo.topics?.includes(topic)) throw new Error(`Repository topic missing ${topic}`);
          if (published.immutable !== true || published.draft || published.prerelease ||
              published.tag_name !== `v${release.release}` || !published.body?.includes(release.dataset.zenodo.versionDoi))
            throw new Error('GitHub immutable release identity drift');
          for (const branch of ['main', 'production']) {
            const rules = JSON.parse(await readFile(`.release/runtime/finalization/github-${branch}-rules.json`));
            for (const required of ['deletion', 'non_fast_forward'])
              if (!rules.some(rule => rule.type === required))
                throw new Error(`GitHub ${branch} lacks active ${required} protection`);
          }
          console.log('GITHUB_VISIBILITY_IMMUTABLE_RELEASE_AND_BRANCH_PROTECTION_PASS');
          NODE
      - name: Notify IndexNow only after all publication checks pass
        if: github.event_name == 'workflow_dispatch' && inputs.apply == true
        run: npm run indexnow:submit
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: current-authority-verification
          path: .release/runtime/finalization/
          retention-days: 14
          if-no-files-found: warn

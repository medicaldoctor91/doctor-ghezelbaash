name: Hugging Face viewer and discovery guard

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/hf-viewer-guard.yml
  workflow_run:
    workflows: ["Atomic ceiling release"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: doctor-ghezelbaash-hf-viewer-guard
  cancel-in-progress: false

jobs:
  enforce:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      HF_REPO: doctor-ghezelbaash/dr-saeid-ghezelbaash-entity-data
    steps:
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install Hub tooling
        run: python -m pip install --disable-pip-version-check --quiet 'huggingface_hub>=0.34,<2' 'PyYAML>=6,<7' 'requests>=2.32,<3'

      - name: Enforce public, ungated, Viewer-capable dataset and discovery metadata
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN || secrets.HUGGINGFACE_TOKEN || secrets.HUGGING_FACE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${HF_TOKEN:-}"
          echo "::add-mask::$HF_TOKEN"
          python - <<'PY'
          import csv, io, json, os, re, tempfile
          from pathlib import Path
          import yaml
          from huggingface_hub import HfApi, hf_hub_download, CommitOperationAdd
          from huggingface_hub.errors import EntryNotFoundError

          repo = os.environ['HF_REPO']
          token = os.environ['HF_TOKEN']
          api = HfApi(token=token)

          who = api.whoami()
          print('HF_AUTHENTICATED_AS', who.get('name') or who.get('fullname') or 'authenticated-user')

          # Maximum public machine accessibility: never private and never gated.
          api.update_repo_settings(repo_id=repo, repo_type='dataset', private=False, gated=False)

          readme_path = hf_hub_download(repo_id=repo, repo_type='dataset', filename='README.md', token=token, force_download=True)
          jsonl_path = hf_hub_download(
              repo_id=repo,
              repo_type='dataset',
              filename='enrichment/instruction_examples_fa_market_positioning.jsonl',
              token=token,
              force_download=True,
          )

          text = Path(readme_path).read_text(encoding='utf-8')
          m = re.match(r'^---\s*\n(.*?)\n---\s*\n?', text, flags=re.S)
          if not m:
              raise SystemExit('Dataset README has no valid YAML front matter')
          meta = yaml.safe_load(m.group(1)) or {}
          body = text[m.end():]

          # HF documents viewer:false as the switch that disables Data Studio.
          # Absence is the supported enabled/default state.
          meta.pop('viewer', None)

          meta['pretty_name'] = 'Dr. Saeed Ghezelbash Public Knowledge Graph'
          meta['language'] = ['fa', 'en', 'ar', 'ckb']
          meta['license'] = 'cc-by-4.0'
          meta['multilinguality'] = ['multilingual']
          meta['source_datasets'] = ['original']
          meta['task_categories'] = ['question-answering']
          meta['size_categories'] = ['1K<n<10K']

          required_tags = [
              'saeed-ghezelbash', 'dr-saeed-ghezelbash', 'physician-entity',
              'medical-knowledge-graph', 'knowledge-graph', 'knowledge-base',
              'entity-resolution', 'json-ld', 'rdf', 'schema-org', 'wikidata',
              'fair-data', 'question-answering', 'rag', 'ai-retrieval',
              'aesthetic-medicine', 'healthcare', 'medical', 'physician',
              'kermanshah', 'iran', 'croissant', 'dcat',
              # Official Hub-recognized library/modality discovery tags.
              'datasets', 'pandas', 'mlcroissant', 'text', 'tabular'
          ]
          existing = list(meta.get('tags') or [])
          meta['tags'] = list(dict.fromkeys(existing + required_tags))

          # Keep JSONL as source, and publish a deterministic CSV projection so both Viewer
          # configs share one unambiguous tabular builder and receive rows/Parquet/statistics.
          rows = []
          columns = []
          seen = set()
          for line_no, line in enumerate(Path(jsonl_path).read_text(encoding='utf-8').splitlines(), 1):
              if not line.strip():
                  continue
              row = json.loads(line)
              if not isinstance(row, dict):
                  raise SystemExit(f'JSONL row {line_no} is not an object')
              rows.append(row)
              for key in row:
                  if key not in seen:
                      seen.add(key)
                      columns.append(key)
          if not rows:
              raise SystemExit('Positioning JSONL contains no rows')

          csv_buf = io.StringIO(newline='')
          writer = csv.DictWriter(csv_buf, fieldnames=columns, extrasaction='ignore', lineterminator='\n')
          writer.writeheader()
          for row in rows:
              cooked = {}
              for key in columns:
                  value = row.get(key)
                  if isinstance(value, (dict, list)):
                      cooked[key] = json.dumps(value, ensure_ascii=False, separators=(',', ':'))
                  elif value is None:
                      cooked[key] = ''
                  elif isinstance(value, bool):
                      cooked[key] = 'true' if value else 'false'
                  else:
                      cooked[key] = str(value)
              writer.writerow(cooked)
          csv_bytes = csv_buf.getvalue().encode('utf-8')

          csv_repo_path = 'enrichment/instruction_examples_fa_market_positioning.csv'
          meta['configs'] = [
              {
                  'config_name': 'entity_facts',
                  'default': True,
                  'data_files': [{'split': 'train', 'path': 'entity-facts.csv'}],
              },
              {
                  'config_name': 'positioning_instructions',
                  'data_files': [{'split': 'train', 'path': csv_repo_path}],
              },
          ]

          old_sentence = '`entity-facts.csv` and the positioning JSONL are separately declared Dataset Viewer configurations.'
          new_sentence = '`entity-facts.csv` is the default factual Dataset Viewer configuration; a deterministic CSV projection of the positioning JSONL is the secondary Viewer configuration, while the original JSONL remains preserved as the enrichment source.'
          body = body.replace(old_sentence, new_sentence)
          body = body.replace('`entity-facts.csv` and a deterministic CSV projection of the positioning JSONL are separately declared Dataset Viewer configurations; the original JSONL remains preserved as the enrichment source.', new_sentence)
          marker_pattern = r'<!-- hf-viewer-guard:.*?-->'
          marker = '<!-- hf-viewer-guard: enabled; public; ungated; full-viewer; default=entity_facts; positioning=csv-projection -->'
          if re.search(marker_pattern, body):
              body = re.sub(marker_pattern, marker, body, count=1)
          else:
              body = marker + '\n\n' + body.lstrip()

          yaml_text = yaml.safe_dump(meta, sort_keys=False, allow_unicode=True, width=120).strip()
          new_text = f'---\n{yaml_text}\n---\n\n{body.rstrip()}\n'

          operations = []
          try:
              current_csv_path = hf_hub_download(
                  repo_id=repo, repo_type='dataset', filename=csv_repo_path,
                  token=token, force_download=True,
              )
              current_csv = Path(current_csv_path).read_bytes()
          except EntryNotFoundError:
              current_csv = None

          if current_csv != csv_bytes:
              with tempfile.NamedTemporaryFile('wb', delete=False, suffix='.csv') as f_csv:
                  f_csv.write(csv_bytes)
                  csv_tmp = f_csv.name
              operations.append(CommitOperationAdd(path_in_repo=csv_repo_path, path_or_fileobj=csv_tmp))

          if new_text != text:
              with tempfile.NamedTemporaryFile('w', encoding='utf-8', delete=False, suffix='.md') as f_md:
                  f_md.write(new_text)
                  md_tmp = f_md.name
              operations.append(CommitOperationAdd(path_in_repo='README.md', path_or_fileobj=md_tmp))

          if operations:
              commit = api.create_commit(
                  repo_id=repo,
                  repo_type='dataset',
                  token=token,
                  operations=operations,
                  commit_message='Enforce full Dataset Viewer and Hub discovery metadata',
              )
              print('HF_DATASET_UPDATED', commit.commit_url)
          else:
              print('HF_DATASET_ALREADY_COMPLIANT')

          print('HF_POSITIONING_ROWS', len(rows), 'COLUMNS', len(columns), 'CSV_BYTES', len(csv_bytes))
          PY

      - name: Verify Dataset Server processing, Viewer, rows, Parquet and statistics
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, time
          import requests

          repo = os.environ['HF_REPO']
          base = 'https://datasets-server.huggingface.co'
          s = requests.Session()
          s.headers.update({'cache-control': 'no-cache', 'pragma': 'no-cache', 'user-agent': 'ghezelbaash-hf-viewer-guard/4.0'})

          def request(path, **params):
              params['dataset'] = repo
              params['_'] = str(time.time_ns())
              return s.get(base + path, params=params, timeout=45)

          def wait_json(path, predicate, label, attempts=42, delay=10, **params):
              last_status = None
              last_text = ''
              for attempt in range(attempts):
                  r = request(path, **params)
                  last_status = r.status_code
                  last_text = r.text[:1200]
                  if r.ok:
                      try:
                          payload = r.json()
                      except Exception:
                          payload = None
                      if payload is not None and predicate(payload):
                          print(label, 'PASS', 'ATTEMPT', attempt + 1)
                          return payload
                  print(label, 'RETRY', attempt + 1, 'HTTP', r.status_code, last_text[:500])
                  time.sleep(delay)
              raise SystemExit(f'{label} did not become healthy: HTTP {last_status} {last_text}')

          valid = wait_json(
              '/is-valid',
              lambda x: all(x.get(k) is True for k in ('viewer', 'preview', 'search', 'filter', 'statistics')),
              'IS_VALID',
          )
          print('IS_VALID_PAYLOAD', json.dumps(valid, ensure_ascii=False))

          required_configs = ('entity_facts', 'positioning_instructions')
          required_pairs = {(c, 'train') for c in required_configs}
          splits = wait_json(
              '/splits',
              lambda x: required_pairs.issubset({(s.get('config'), s.get('split')) for s in x.get('splits', [])}),
              'SPLITS',
          )
          pairs = {(x.get('config'), x.get('split')) for x in splits.get('splits', [])}

          for config in required_configs:
              first_rows = wait_json(
                  '/first-rows', lambda x: bool(x.get('rows')),
                  f'FIRST_ROWS_{config}', config=config, split='train',
              )
              print('FIRST_ROWS_COUNT', config, len(first_rows.get('rows', [])))

              rows = wait_json(
                  '/rows', lambda x: bool(x.get('rows')),
                  f'ROWS_{config}', config=config, split='train', offset=0, length=5,
              )
              print('ROWS_COUNT', config, len(rows.get('rows', [])))

              wait_json(
                  '/statistics', lambda x: isinstance(x, dict) and len(x) > 0,
                  f'STATISTICS_{config}', config=config, split='train',
              )

          parquet = wait_json(
              '/parquet',
              lambda x: set(required_configs).issubset({f.get('config') for f in x.get('parquet_files', [])}),
              'PARQUET',
          )
          files = parquet.get('parquet_files', [])

          size = wait_json(
              '/size',
              lambda x: not x.get('failed') and isinstance(x.get('size'), dict),
              'SIZE',
          )

          wait_json(
              '/croissant', lambda x: isinstance(x, dict) and len(x) > 0,
              'CROISSANT',
          )

          print('HF_VIEWER_GUARD_PASS', json.dumps(valid, ensure_ascii=False))
          print('HF_SPLITS_PASS', sorted(pairs))
          print('HF_PARQUET_FILES', len(files))
          print('HF_SIZE_PASS', json.dumps(size.get('size', {}).get('dataset', {}), ensure_ascii=False))
          print('HF_CROISSANT_PASS')
          PY

name: Hugging Face viewer and discovery verifier

on:
  schedule:
    - cron: '41 4 * * 2'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      HF_REPO: doctor-ghezelbaash/dr-saeid-ghezelbaash-entity-data
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Verify public metadata and Dataset Server without mutation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, time, urllib.parse, urllib.request
          repo=os.environ['HF_REPO']
          def get(url):
              req=urllib.request.Request(url,headers={'Cache-Control':'no-cache','User-Agent':'ghezelbaash-hf-readonly-verifier/1.0'})
              with urllib.request.urlopen(req,timeout=60) as r:return r.status,r.read().decode('utf-8','replace')
          status,raw=get('https://huggingface.co/api/datasets/'+repo+'?full=true&blobs=false&_='+str(time.time_ns()))
          meta=json.loads(raw);tags=set(meta.get('tags') or [])
          for needed in ['language:fa','language:en','language:ar','language:ckb','task_categories:question-answering','task_categories:text-retrieval','task_categories:text-generation']:
              if needed not in tags: raise SystemExit('HF metadata missing '+needed)
          status,readme=get('https://huggingface.co/datasets/'+repo+'/resolve/main/README.md?download=true&_='+str(time.time_ns()))
          for token in ['Dr. Saeed Ghezelbash Public Knowledge Graph','Q140287622','Q140304972','text-retrieval','text-generation','query_matrix','live_observations','maximum_dominant_best_positioning']:
              if token not in readme: raise SystemExit('HF README missing '+token)
          base='https://datasets-server.huggingface.co'
          def api(path,**params):
              params['dataset']=repo;params['_']=str(time.time_ns());return json.loads(get(base+path+'?'+urllib.parse.urlencode(params))[1])
          valid=api('/is-valid')
          for key in ['viewer','preview','search','filter','statistics']:
              if valid.get(key) is not True: raise SystemExit('Dataset Server feature unhealthy: '+key)
          splits=api('/splits');pairs={(x.get('config'),x.get('split')) for x in splits.get('splits',[])}
          for config in ['entity_facts','query_matrix','positioning_instructions','live_observations']:
              if (config,'train') not in pairs: raise SystemExit('Dataset Viewer config missing '+config)
          print(json.dumps({'HF_VIEWER_READ_ONLY_PASS':True,'configs':sorted(pairs),'tasks':['question-answering','text-retrieval','text-generation']},ensure_ascii=False))
          PY

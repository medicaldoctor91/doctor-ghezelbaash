name: Hugging Face viewer and discovery guard

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/hf-viewer-guard.yml
  workflow_run:
    workflows: ["Atomic ceiling release"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: doctor-ghezelbaash-hf-viewer-guard
  cancel-in-progress: true

jobs:
  enforce:
    # Run after every completed Atomic release, even a failed one: a failed release can
    # already have pushed a partial/stale Hugging Face distribution before later checks fail.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      HF_REPO: doctor-ghezelbaash/dr-saeid-ghezelbaash-entity-data
    steps:
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install Hub tooling
        run: python -m pip install --disable-pip-version-check --quiet 'huggingface_hub>=0.34,<2' 'PyYAML>=6,<7' 'requests>=2.32,<3'

      - name: Enforce public ungated Viewer-native distribution
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN || secrets.HUGGINGFACE_TOKEN || secrets.HUGGING_FACE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${HF_TOKEN:-}"
          echo "::add-mask::$HF_TOKEN"
          python - <<'PY'
          import csv, io, json, os, re, tempfile
          from pathlib import Path
          import yaml
          from huggingface_hub import HfApi, hf_hub_download, CommitOperationAdd
          from huggingface_hub.errors import EntryNotFoundError

          repo = os.environ['HF_REPO']
          token = os.environ['HF_TOKEN']
          api = HfApi(token=token)
          print('HF_AUTHENTICATED_AS', api.whoami().get('name', 'authenticated-user'))

          api.update_repo_settings(repo_id=repo, repo_type='dataset', private=False, gated=False)

          readme_path = hf_hub_download(
              repo_id=repo, repo_type='dataset', filename='README.md', token=token, force_download=True
          )
          jsonl_path = hf_hub_download(
              repo_id=repo,
              repo_type='dataset',
              filename='enrichment/instruction_examples_fa_market_positioning.jsonl',
              token=token,
              force_download=True,
          )

          text = Path(readme_path).read_text(encoding='utf-8')
          match = re.match(r'^---\s*\n(.*?)\n---\s*\n?', text, flags=re.S)
          if not match:
              raise SystemExit('Dataset README has no valid YAML front matter')
          meta = yaml.safe_load(match.group(1)) or {}
          body = text[match.end():]

          # Viewer is enabled by default when supported configs are present; explicit
          # viewer:false is the disable switch, so it must never survive here.
          meta.pop('viewer', None)
          meta['pretty_name'] = 'Dr. Saeed Ghezelbash Public Knowledge Graph'
          meta['language'] = ['fa', 'en', 'ar', 'ckb']
          meta['license'] = 'cc-by-4.0'
          meta['multilinguality'] = ['multilingual']
          meta['source_datasets'] = ['original']
          meta['task_categories'] = ['question-answering']
          meta['size_categories'] = ['1K<n<10K']

          required_tags = [
              'saeed-ghezelbash', 'dr-saeed-ghezelbash', 'physician-entity',
              'medical-knowledge-graph', 'knowledge-graph', 'knowledge-base',
              'entity-resolution', 'json-ld', 'rdf', 'schema-org', 'wikidata',
              'fair-data', 'question-answering', 'rag', 'ai-retrieval',
              'aesthetic-medicine', 'healthcare', 'medical', 'physician',
              'kermanshah', 'iran', 'croissant', 'dcat',
              'datasets', 'pandas', 'mlcroissant', 'text', 'tabular',
          ]
          meta['tags'] = list(dict.fromkeys(list(meta.get('tags') or []) + required_tags))

          # Preserve JSONL as the enrichment source, but expose a deterministic CSV
          # projection so both declared Viewer configs use one unambiguous tabular builder.
          rows, columns, seen = [], [], set()
          for line_no, line in enumerate(Path(jsonl_path).read_text(encoding='utf-8').splitlines(), 1):
              if not line.strip():
                  continue
              row = json.loads(line)
              if not isinstance(row, dict):
                  raise SystemExit(f'JSONL row {line_no} is not an object')
              rows.append(row)
              for key in row:
                  if key not in seen:
                      seen.add(key)
                      columns.append(key)
          if not rows:
              raise SystemExit('Positioning JSONL contains no rows')

          buffer = io.StringIO(newline='')
          writer = csv.DictWriter(buffer, fieldnames=columns, extrasaction='ignore', lineterminator='\n')
          writer.writeheader()
          for row in rows:
              cooked = {}
              for key in columns:
                  value = row.get(key)
                  if isinstance(value, (dict, list)):
                      cooked[key] = json.dumps(value, ensure_ascii=False, separators=(',', ':'))
                  elif value is None:
                      cooked[key] = ''
                  elif isinstance(value, bool):
                      cooked[key] = 'true' if value else 'false'
                  else:
                      cooked[key] = str(value)
              writer.writerow(cooked)
          csv_bytes = buffer.getvalue().encode('utf-8')
          csv_repo_path = 'enrichment/instruction_examples_fa_market_positioning.csv'

          meta['configs'] = [
              {
                  'config_name': 'entity_facts',
                  'default': True,
                  'data_files': [{'split': 'train', 'path': 'entity-facts.csv'}],
              },
              {
                  'config_name': 'positioning_instructions',
                  'data_files': [{'split': 'train', 'path': csv_repo_path}],
              },
          ]

          marker = '<!-- hf-viewer-guard: enabled; public; ungated; full-viewer; default=entity_facts; positioning=csv-projection -->'
          if re.search(r'<!-- hf-viewer-guard:.*?-->', body):
              body = re.sub(r'<!-- hf-viewer-guard:.*?-->', marker, body, count=1)
          else:
              body = marker + '\n\n' + body.lstrip()

          body = body.replace(
              '`entity-facts.csv` and the positioning JSONL are separately declared Dataset Viewer configurations.',
              '`entity-facts.csv` is the default factual Dataset Viewer configuration; a deterministic CSV projection of the preserved positioning JSONL is the secondary Viewer configuration.'
          )
          body = body.replace(
              '`entity-facts.csv` and a deterministic CSV projection of the positioning JSONL are separately declared Dataset Viewer configurations; the original JSONL remains preserved as the enrichment source.',
              '`entity-facts.csv` is the default factual Dataset Viewer configuration; a deterministic CSV projection of the preserved positioning JSONL is the secondary Viewer configuration.'
          )

          yaml_text = yaml.safe_dump(meta, sort_keys=False, allow_unicode=True, width=120).strip()
          new_readme = f'---\n{yaml_text}\n---\n\n{body.rstrip()}\n'

          operations = []
          try:
              current_csv_path = hf_hub_download(
                  repo_id=repo, repo_type='dataset', filename=csv_repo_path,
                  token=token, force_download=True,
              )
              current_csv = Path(current_csv_path).read_bytes()
          except EntryNotFoundError:
              current_csv = None

          if current_csv != csv_bytes:
              with tempfile.NamedTemporaryFile('wb', delete=False, suffix='.csv') as f:
                  f.write(csv_bytes)
                  csv_tmp = f.name
              operations.append(CommitOperationAdd(path_in_repo=csv_repo_path, path_or_fileobj=csv_tmp))

          if new_readme != text:
              with tempfile.NamedTemporaryFile('w', encoding='utf-8', delete=False, suffix='.md') as f:
                  f.write(new_readme)
                  readme_tmp = f.name
              operations.append(CommitOperationAdd(path_in_repo='README.md', path_or_fileobj=readme_tmp))

          if operations:
              commit = api.create_commit(
                  repo_id=repo,
                  repo_type='dataset',
                  token=token,
                  operations=operations,
                  commit_message='Enforce Viewer-native physician entity dataset',
              )
              print('HF_DATASET_UPDATED', commit.commit_url)
          else:
              print('HF_DATASET_ALREADY_COMPLIANT')
          print('HF_POSITIONING_ROWS', len(rows), 'COLUMNS', len(columns), 'CSV_BYTES', len(csv_bytes))
          PY

      - name: Verify live Dataset Server end to end
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, time
          import requests

          repo = os.environ['HF_REPO']
          base = 'https://datasets-server.huggingface.co'
          session = requests.Session()
          session.headers.update({
              'cache-control': 'no-cache',
              'pragma': 'no-cache',
              'user-agent': 'ghezelbaash-hf-viewer-guard/5.0',
          })

          def request(path, **params):
              params['dataset'] = repo
              params['_'] = str(time.time_ns())
              return session.get(base + path, params=params, timeout=45)

          def wait_json(path, predicate, label, attempts=30, delay=8, **params):
              last_status, last_text = None, ''
              for attempt in range(1, attempts + 1):
                  response = request(path, **params)
                  last_status = response.status_code
                  last_text = response.text[:1200]
                  payload = None
                  if response.ok:
                      try:
                          payload = response.json()
                      except Exception:
                          pass
                  if payload is not None and predicate(payload):
                      print(label, 'PASS', 'ATTEMPT', attempt)
                      return payload
                  print(label, 'RETRY', attempt, 'HTTP', response.status_code, last_text[:500])
                  time.sleep(delay)
              raise SystemExit(f'{label} did not become healthy: HTTP {last_status} {last_text}')

          valid = wait_json(
              '/is-valid',
              lambda x: all(x.get(k) is True for k in ('viewer', 'preview', 'search', 'filter', 'statistics')),
              'IS_VALID',
          )

          required_configs = ('entity_facts', 'positioning_instructions')
          required_pairs = {(config, 'train') for config in required_configs}
          splits = wait_json(
              '/splits',
              lambda x: required_pairs.issubset({(s.get('config'), s.get('split')) for s in x.get('splits', [])}),
              'SPLITS',
          )
          pairs = {(x.get('config'), x.get('split')) for x in splits.get('splits', [])}

          for config in required_configs:
              first_rows = wait_json(
                  '/first-rows', lambda x: bool(x.get('rows')),
                  f'FIRST_ROWS_{config}', config=config, split='train',
              )
              rows = wait_json(
                  '/rows', lambda x: bool(x.get('rows')),
                  f'ROWS_{config}', config=config, split='train', offset=0, length=5,
              )
              wait_json(
                  '/statistics', lambda x: isinstance(x, dict) and len(x) > 0,
                  f'STATISTICS_{config}', config=config, split='train',
              )
              print('CONFIG_PASS', config, 'FIRST_ROWS', len(first_rows.get('rows', [])), 'ROWS', len(rows.get('rows', [])))

          parquet = wait_json(
              '/parquet',
              lambda x: set(required_configs).issubset({f.get('config') for f in x.get('parquet_files', [])}),
              'PARQUET',
          )
          size = wait_json(
              '/size',
              lambda x: not x.get('failed') and isinstance(x.get('size'), dict),
              'SIZE',
          )

          print('HF_VIEWER_GUARD_PASS', json.dumps(valid, ensure_ascii=False))
          print('HF_SPLITS_PASS', sorted(pairs))
          print('HF_PARQUET_FILES', len(parquet.get('parquet_files', [])))
          print('HF_SIZE_PASS', json.dumps(size.get('size', {}).get('dataset', {}), ensure_ascii=False))
          PY

name: Hugging Face dataset viewer guard

on:
  schedule:
    - cron: '41 4 * * 1,4'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.release/policy/authority-surface-contract.json'
      - 'src/data/release.json'
      - 'scripts/prepare-huggingface-distribution.mjs'
      - 'scripts/verify-huggingface-authority.mjs'
      - '.github/workflows/hf-viewer-guard.yml'

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0
      - name: Verify authority surfaces and Dataset Server configs
        run: node scripts/verify-huggingface-authority.mjs

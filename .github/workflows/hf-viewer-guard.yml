name: Hugging Face viewer and discovery guard

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/hf-viewer-guard.yml
  workflow_run:
    workflows: ["Atomic ceiling release"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: doctor-ghezelbaash-hf-viewer-guard
  cancel-in-progress: false

jobs:
  enforce:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      HF_REPO: doctor-ghezelbaash/dr-saeid-ghezelbaash-entity-data
    steps:
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install Hub tooling
        run: python -m pip install --disable-pip-version-check --quiet 'huggingface_hub>=0.34,<2' 'PyYAML>=6,<7' 'requests>=2.32,<3'

      - name: Enforce public, ungated, Viewer-capable dataset and discovery metadata
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN || secrets.HUGGINGFACE_TOKEN || secrets.HUGGING_FACE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${HF_TOKEN:-}"
          echo "::add-mask::$HF_TOKEN"
          python - <<'PY'
          import csv, io, json, os, re, tempfile
          from pathlib import Path
          import yaml
          from huggingface_hub import HfApi, hf_hub_download, CommitOperationAdd

          repo = os.environ['HF_REPO']
          token = os.environ['HF_TOKEN']
          api = HfApi(token=token)

          who = api.whoami()
          print('HF_AUTHENTICATED_AS', who.get('name') or who.get('fullname') or 'authenticated-user')

          # Maximum public machine accessibility: never private and never gated.
          api.update_repo_settings(repo_id=repo, repo_type='dataset', private=False, gated=False)

          readme_path = hf_hub_download(repo_id=repo, repo_type='dataset', filename='README.md', token=token, force_download=True)
          jsonl_path = hf_hub_download(
              repo_id=repo,
              repo_type='dataset',
              filename='enrichment/instruction_examples_fa_market_positioning.jsonl',
              token=token,
              force_download=True,
          )

          text = Path(readme_path).read_text(encoding='utf-8')
          m = re.match(r'^---\s*\n(.*?)\n---\s*\n?', text, flags=re.S)
          if not m:
              raise SystemExit('Dataset README has no valid YAML front matter')
          meta = yaml.safe_load(m.group(1)) or {}
          body = text[m.end():]

          # HF documents viewer:false as the switch that disables Data Studio.
          # Absence is the supported enabled/default state.
          meta.pop('viewer', None)

          meta['pretty_name'] = 'Dr. Saeed Ghezelbash Public Knowledge Graph'
          meta['language'] = ['fa', 'en', 'ar', 'ckb']
          meta['license'] = 'cc-by-4.0'
          meta['multilinguality'] = ['multilingual']
          meta['source_datasets'] = ['original']
          meta['task_categories'] = ['question-answering']
          meta['size_categories'] = ['1K<n<10K']

          required_tags = [
              'saeed-ghezelbash', 'dr-saeed-ghezelbash', 'physician-entity',
              'medical-knowledge-graph', 'knowledge-graph', 'knowledge-base',
              'entity-resolution', 'json-ld', 'rdf', 'schema-org', 'wikidata',
              'fair-data', 'question-answering', 'rag', 'ai-retrieval',
              'aesthetic-medicine', 'healthcare', 'medical', 'physician',
              'kermanshah', 'iran', 'croissant', 'dcat',
              # Official Hub-recognized library/modality discovery tags.
              'datasets', 'pandas', 'mlcroissant', 'text', 'tabular'
          ]
          existing = list(meta.get('tags') or [])
          meta['tags'] = list(dict.fromkeys(existing + required_tags))

          # Mixed CSV+JSONL configs can be inferred through one packaged builder by Dataset Server.
          # Keep the JSONL source intact, but publish a deterministic CSV projection so both Viewer
          # configs share one unambiguous tabular format and receive full rows/Parquet/statistics.
          rows = []
          columns = []
          seen = set()
          for line_no, line in enumerate(Path(jsonl_path).read_text(encoding='utf-8').splitlines(), 1):
              if not line.strip():
                  continue
              row = json.loads(line)
              if not isinstance(row, dict):
                  raise SystemExit(f'JSONL row {line_no} is not an object')
              rows.append(row)
              for key in row:
                  if key not in seen:
                      seen.add(key)
                      columns.append(key)
          if not rows:
              raise SystemExit('Positioning JSONL contains no rows')

          csv_buf = io.StringIO(newline='')
          writer = csv.DictWriter(csv_buf, fieldnames=columns, extrasaction='ignore', lineterminator='\n')
          writer.writeheader()
          for row in rows:
              cooked = {}
              for key in columns:
                  value = row.get(key)
                  if isinstance(value, (dict, list)):
                      cooked[key] = json.dumps(value, ensure_ascii=False, separators=(',', ':'))
                  elif value is None:
                      cooked[key] = ''
                  elif isinstance(value, bool):
                      cooked[key] = 'true' if value else 'false'
                  else:
                      cooked[key] = str(value)
              writer.writerow(cooked)
          csv_bytes = csv_buf.getvalue().encode('utf-8')

          meta['configs'] = [
              {
                  'config_name': 'entity_facts',
                  'data_files': [{'split': 'train', 'path': 'entity-facts.csv'}],
              },
              {
                  'config_name': 'positioning_instructions',
                  'data_files': [{'split': 'train', 'path': 'enrichment/instruction_examples_fa_market_positioning.csv'}],
              },
          ]

          old_sentence = '`entity-facts.csv` and the positioning JSONL are separately declared Dataset Viewer configurations.'
          new_sentence = '`entity-facts.csv` and a deterministic CSV projection of the positioning JSONL are separately declared Dataset Viewer configurations; the original JSONL remains preserved as the enrichment source.'
          body = body.replace(old_sentence, new_sentence)
          marker_pattern = r'<!-- hf-viewer-guard:.*?-->'
          marker = '<!-- hf-viewer-guard: enabled; public; ungated; full-viewer; positioning=csv-projection -->'
          if re.search(marker_pattern, body):
              body = re.sub(marker_pattern, marker, body, count=1)
          else:
              body = marker + '\n\n' + body.lstrip()

          yaml_text = yaml.safe_dump(meta, sort_keys=False, allow_unicode=True, width=120).strip()
          new_text = f'---\n{yaml_text}\n---\n\n{body.rstrip()}\n'

          operations = []
          with tempfile.NamedTemporaryFile('wb', delete=False, suffix='.csv') as f_csv:
              f_csv.write(csv_bytes)
              csv_tmp = f_csv.name
          operations.append(CommitOperationAdd(
              path_in_repo='enrichment/instruction_examples_fa_market_positioning.csv',
              path_or_fileobj=csv_tmp,
          ))

          if new_text != text:
              with tempfile.NamedTemporaryFile('w', encoding='utf-8', delete=False, suffix='.md') as f_md:
                  f_md.write(new_text)
                  md_tmp = f_md.name
              operations.append(CommitOperationAdd(path_in_repo='README.md', path_or_fileobj=md_tmp))

          commit = api.create_commit(
              repo_id=repo,
              repo_type='dataset',
              token=token,
              operations=operations,
              commit_message='Enable full Dataset Viewer and maximize Hub discovery',
          )
          print('HF_DATASET_UPDATED', commit.commit_url)
          print('HF_POSITIONING_ROWS', len(rows), 'COLUMNS', len(columns), 'CSV_BYTES', len(csv_bytes))
          PY

      - name: Verify Dataset Server processing, Viewer, rows, Parquet and statistics
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, time
          import requests

          repo = os.environ['HF_REPO']
          base = 'https://datasets-server.huggingface.co'
          s = requests.Session()
          s.headers.update({'cache-control': 'no-cache', 'pragma': 'no-cache', 'user-agent': 'ghezelbaash-hf-viewer-guard/2.0'})

          def request(path, **params):
              params['dataset'] = repo
              params['_'] = str(time.time_ns())
              return s.get(base + path, params=params, timeout=45)

          valid = None
          for attempt in range(42):
              r = request('/is-valid')
              try:
                  valid = r.json()
              except Exception:
                  valid = {'http': r.status_code, 'text': r.text[:500]}
              print('IS_VALID_ATTEMPT', attempt + 1, json.dumps(valid, ensure_ascii=False))
              if r.ok and all(valid.get(k) is True for k in ('viewer', 'preview', 'search', 'filter', 'statistics')):
                  break
              time.sleep(10)
          else:
              raise SystemExit('Dataset Server did not reach full is-valid=true state')

          required_configs = ('entity_facts', 'positioning_instructions')
          required_pairs = {(c, 'train') for c in required_configs}

          # Wait for the new README/config commit, not merely an old cached is-valid result.
          for attempt in range(42):
              r = request('/splits')
              if r.ok:
                  payload = r.json()
                  pairs = {(x.get('config'), x.get('split')) for x in payload.get('splits', [])}
                  print('SPLITS_ATTEMPT', attempt + 1, sorted(pairs))
                  if required_pairs.issubset(pairs):
                      break
              else:
                  print('SPLITS_ATTEMPT', attempt + 1, 'HTTP', r.status_code, r.text[:500])
              time.sleep(10)
          else:
              raise SystemExit('Required configs/splits did not become available')

          for config in required_configs:
              for attempt in range(42):
                  r = request('/first-rows', config=config, split='train')
                  if r.ok:
                      payload = r.json()
                      if payload.get('rows'):
                          print('FIRST_ROWS_PASS', config, 'ROWS', len(payload['rows']))
                          break
                  print('FIRST_ROWS_ATTEMPT', config, attempt + 1, 'HTTP', r.status_code, r.text[:700])
                  time.sleep(10)
              else:
                  raise SystemExit(f'No healthy first-rows response for {config}')

              r = request('/rows', config=config, split='train', offset=0, length=5)
              if not r.ok or not r.json().get('rows'):
                  raise SystemExit(f'/rows failed for {config}: HTTP {r.status_code} {r.text[:1000]}')
              print('ROWS_PASS', config)

              r = request('/statistics', config=config, split='train')
              if not r.ok:
                  raise SystemExit(f'/statistics failed for {config}: HTTP {r.status_code} {r.text[:1000]}')
              print('STATISTICS_PASS', config)

          for attempt in range(42):
              r = request('/parquet')
              if r.ok:
                  parquet = r.json()
                  files = parquet.get('parquet_files', [])
                  configs = {x.get('config') for x in files}
                  print('PARQUET_ATTEMPT', attempt + 1, 'FILES', len(files), 'CONFIGS', sorted(configs))
                  if set(required_configs).issubset(configs):
                      break
              else:
                  print('PARQUET_ATTEMPT', attempt + 1, 'HTTP', r.status_code, r.text[:500])
              time.sleep(10)
          else:
              raise SystemExit('Parquet exports for both configs did not become available')

          r = request('/size')
          if not r.ok:
              raise SystemExit(f'/size failed: HTTP {r.status_code} {r.text[:1000]}')
          size = r.json()
          if size.get('failed'):
              raise SystemExit(f'Dataset Server size pipeline failures: {size["failed"]}')

          r = request('/croissant')
          if not r.ok:
              raise SystemExit(f'/croissant failed: HTTP {r.status_code} {r.text[:1000]}')

          print('HF_VIEWER_GUARD_PASS', json.dumps(valid, ensure_ascii=False))
          print('HF_SPLITS_PASS', sorted(pairs))
          print('HF_PARQUET_FILES', len(files))
          print('HF_CROISSANT_PASS')
          PY

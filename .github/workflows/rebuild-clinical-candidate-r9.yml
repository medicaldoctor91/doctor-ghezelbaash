name: Prepare the clarified provider-and-location candidate
on:
  push:
    branches: [codex/rebuild-clinical-candidate-r9-2026-11-19]
permissions: {}
jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      APPLICATION_SHA: 66cbfb40b132539313865db4fa03eb078bc84d1d
      BUILD_SHA: 94f3facd45182001569a2549e491ec68c0b5902d
      APPLICATION_TAG: source-frozen-2026-11-19-clinical-attribution-1-3-6-r9
      BUILD_TAG: source-build-2026-11-19-clinical-attribution-1-3-6-r9
    steps:
      - uses: actions/checkout@v4
        with:
          ref: clinical-attribution-1-3-6-provider-location
          fetch-depth: 0
      - name: Verify and register the reviewed source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BUILD_SHA"
          test "$(git rev-parse HEAD^)" = "$APPLICATION_SHA"
          test "$(git rev-parse "$APPLICATION_SHA^{tree}")" = 80928c7626f60b85cfa4d825516d04db43381e3f
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          ensure_tag() {
            local tag="$1" commit="$2" message="$3"
            if git show-ref --verify --quiet "refs/tags/$tag"; then
              test "$(git cat-file -t "refs/tags/$tag")" = tag
              test "$(git rev-parse "refs/tags/$tag^{commit}")" = "$commit"
            else
              git tag -a "$tag" "$commit" -m "$message"
            fi
          }
          ensure_tag "$APPLICATION_TAG" "$APPLICATION_SHA" 'Reviewed clinical attribution application snapshot 1.3.6 r9'
          ensure_tag "$BUILD_TAG" "$BUILD_SHA" 'Reviewed clinical attribution coordinated build 1.3.6 r9'
          python .github/scripts/source_freeze.py check
          git push --atomic origin "refs/tags/$APPLICATION_TAG" "refs/tags/$BUILD_TAG"
  prepare:
    needs: freeze
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      actions: write
      contents: read

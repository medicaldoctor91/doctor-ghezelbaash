          PLAN_BASE64
          printf '%s  %s\n' "$PLAN_SHA256" "$plan" | sha256sum --check -
          api="repos/$GITHUB_REPOSITORY/actions"
          workflow="$api/workflows/coordinated-doi-release.yml"
          latest() {
            gh api "$workflow/runs?head_sha=$BUILD_SHA&event=workflow_dispatch&per_page=1" \
              --jq '.workflow_runs[0].id // 0'
          }
          dispatch() {
            jq -n --arg ref "$BUILD_TAG" --arg commit "$BUILD_SHA" --arg operation "$1" \
              --arg candidate "${2:-}" --rawfile plan "$plan" --arg digest "$PLAN_SHA256" \
              '{ref:$ref,inputs:({operation:$operation,reviewed_commit:$commit,approved_plan_json:$plan,approved_plan_sha256:$digest} + (if $candidate == "" then {} else {candidate_run:$candidate} end))}' \
              | gh api --method POST "$workflow/dispatches" --input -
          }
          test "$(latest)" = 0
          dispatch preflight
          candidate=0
          for _ in $(seq 1 30); do
            candidate=$(latest)
            if [[ "$candidate" -gt 0 ]]; then break; fi
            sleep 5
          done
          test "$candidate" -gt 0
          echo "Preflight run $candidate"
          conclusion=pending
          for _ in $(seq 1 110); do
            read -r status conclusion < <(gh api "$api/runs/$candidate" --jq '[.status,.conclusion // "pending"] | @tsv')
            if [[ "$status" == completed ]]; then break; fi
            sleep 8
          done
          test "$conclusion" = success
          gh api "$api/runs/$candidate/artifacts" | jq -e \
            '.artifacts | map(select(.name == "frozen-coordinated-candidate" and .expired == false)) | length == 1'
          test "$(latest)" = "$candidate"
          dispatch stage-draft "$candidate"

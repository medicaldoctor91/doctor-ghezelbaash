name: Temporary descriptor writer convergence

on:
  push:
    branches: [release/v1.2.2-candidate]

permissions:
  contents: write

concurrency:
  group: doctor-ghezelbaash-source-convergence
  cancel-in-progress: false

jobs:
  converge:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - name: Establish single descriptor writer
        shell: bash
        run: |
          set -euo pipefail
          cat > scripts/generate-descriptors.mjs <<'EOF'
          import path from 'node:path';
          import {createHash} from 'node:crypto';
          import {readFile,writeFile,readdir,mkdir} from 'node:fs/promises';

          const root=process.cwd(),data=path.join(root,'src/data'),semantic=path.join(data,'semantic'),projections=path.join(data,'projections');
          const readJson=async p=>JSON.parse(await readFile(path.join(root,p),'utf8'));
          const release=await readJson('src/data/release.json');
          const inv=await readJson('src/data/release-invariants.json');
          const graph=await readJson('src/data/semantic/knowledge-graph.jsonld');
          await mkdir(projections,{recursive:true});
          const nodes=graph['@graph']||[],byId=new Map(nodes.filter(n=>n?.['@id']).map(n=>[n['@id'],n]));
          const dataset=byId.get(release.dataset.id),person=byId.get(release.primaryEntity.id);
          if(!dataset||!person)throw new Error('Descriptor generator missing canonical Dataset/Person');
          const arr=v=>Array.isArray(v)?v:(v==null?[]:[v]);
          const id=v=>typeof v==='string'?v:v?.['@id'];
          const identityMe=arr(person.sameAs).map(id).filter(Boolean).map(href=>({href}));
          const datasetName=typeof dataset.name==='string'?dataset.name:'Dr. Saeed Ghezelbash Public Knowledge Graph';
          const datasetDescription=typeof dataset.description==='string'?dataset.description:'Physician-owned first-party entity, clinic, medical-topic, answer and provenance dataset for Saeed Ghezelbash.';
          const createdAt=(release.dataset.zenodo.releaseHistory||[]).map(x=>x.publicationDate).filter(Boolean).sort()[0]||release.dateModified;
          const shaHex=b=>createHash('sha256').update(b).digest('hex');
          const ttlString=s=>`"${String(s).replaceAll('\\','\\\\').replaceAll('"','\\"').replaceAll('\n','\\n')}"`;
          const contentTypes={'graph.jsonld':'application/ld+json','graph.ttl':'text/turtle','entity-facts.csv':'text/csv','answers.txt':'text/plain','knowledge.xml':'application/xml','llms.txt':'text/plain','index.md':'text/markdown','llms-full.txt':'text/plain','void.ttl':'text/turtle','dcat.ttl':'text/turtle','linkset.json':'application/linkset+json','provenance.jsonld':'application/ld+json','evidence-snapshot.json':'application/json','shapes.ttl':'text/turtle','query-matrix.jsonl':'application/jsonl'};
          const resourceTitles={'graph.jsonld':'Canonical JSON-LD entity knowledge graph','graph.ttl':'RDF Turtle serialization isomorphic with JSON-LD','entity-facts.csv':'Flat fact projection of canonical graph','answers.txt':'Canonical direct-answer corpus','knowledge.xml':'Hierarchical semantic knowledge projection','llms.txt':'Machine discovery and retrieval guide','index.md':'Full canonical content projection','llms-full.txt':'Passage-oriented full content projection','void.ttl':'VoID RDF dataset description','dcat.ttl':'W3C DCAT 3 catalog and distribution metadata','linkset.json':'RFC 9264 Web Link Set','provenance.jsonld':'Claim and passage provenance graph','evidence-snapshot.json':'Release-time evidence snapshot','shapes.ttl':'SHACL entity constitution','query-matrix.jsonl':'Query Matrix 2.0 multilingual intent and service retrieval projection'};
          const projectionAbs=rel=>rel==='graph.jsonld'?path.join(semantic,'knowledge-graph.jsonld'):rel==='graph.ttl'?path.join(semantic,'knowledge-graph.ttl'):rel==='shapes.ttl'?path.join(semantic,'shapes.ttl'):path.join(projections,rel);
          const fileMeta=async rel=>{const b=await readFile(projectionAbs(rel));return{rel,bytes:b.length,sha256:shaHex(b),mediaType:contentTypes[rel]||'application/octet-stream',title:resourceTitles[rel]||rel};};
          const coreResources=['graph.jsonld','graph.ttl','entity-facts.csv','answers.txt','knowledge.xml','llms.txt','index.md','llms-full.txt','provenance.jsonld','evidence-snapshot.json','shapes.ttl','query-matrix.jsonl'];

          const linkset={linkset:[{anchor:release.canonicalUrl,canonical:[{href:release.canonicalUrl}],author:[{href:release.primaryEntity.id}],about:[{href:release.primaryEntity.id},{href:release.clinic.id},{href:`${release.canonicalUrl}#doctor-ghezelbaash-structured-data-project`}],describedby:[
            {href:`${release.canonicalUrl}graph.jsonld`,type:'application/ld+json'},
            {href:`${release.canonicalUrl}graph.ttl`,type:'text/turtle'},
            {href:`${release.canonicalUrl}entity-facts.csv`,type:'text/csv'},
            {href:`${release.canonicalUrl}knowledge.xml`,type:'application/xml'},
            {href:`${release.canonicalUrl}query-matrix.jsonl`,type:'application/jsonl'},
            {href:`${release.canonicalUrl}live-observations.jsonld`,type:'application/ld+json'},
            {href:`${release.canonicalUrl}current-release-matrix.json`,type:'application/json'},
            {href:`${release.canonicalUrl}datapackage.json`,type:'application/json'},
            {href:`${release.canonicalUrl}void.ttl`,type:'text/turtle'},
            {href:`${release.canonicalUrl}dcat.ttl`,type:'text/turtle'},
            {href:`${release.canonicalUrl}croissant.json`,type:'application/ld+json'},
            {href:`${release.canonicalUrl}provenance.jsonld`,type:'application/ld+json'},
            {href:`${release.canonicalUrl}evidence-snapshot.json`,type:'application/json'},
            {href:`${release.canonicalUrl}shapes.ttl`,type:'text/turtle'},
            {href:`${release.canonicalUrl}artifact-manifest.json`,type:'application/json'}],license:[{href:'https://creativecommons.org/licenses/by/4.0/'}],alternate:[
            {href:`${release.canonicalUrl}answers.txt`,type:'text/plain'},
            {href:`${release.canonicalUrl}llms.txt`,type:'text/plain'},
            {href:`${release.canonicalUrl}index.md`,type:'text/markdown'},
            {href:`${release.canonicalUrl}llms-full.txt`,type:'text/plain'}],me:identityMe}]};
          await writeFile(path.join(projections,'linkset.json'),JSON.stringify(linkset,null,2)+'\n');

          const voidTtl=`@prefix void: <http://rdfs.org/ns/void#> .\n@prefix dct: <http://purl.org/dc/terms/> .\n@prefix foaf: <http://xmlns.com/foaf/0.1/> .\n@prefix schema: <https://schema.org/> .\n<${release.canonicalUrl}graph.jsonld#dataset> a void:Dataset ;\n  dct:title ${ttlString(datasetName)}@en ;\n  dct:publisher <${release.primaryEntity.id}> ;\n  dct:modified ${ttlString(release.dateModified)} ;\n  dct:license <https://creativecommons.org/licenses/by/4.0/> ;\n  foaf:homepage <${release.canonicalUrl}> ;\n  foaf:primaryTopic <${release.primaryEntity.id}> ;\n  void:uriSpace ${ttlString(release.canonicalUrl)} ;\n  void:triples ${inv.externalRdfTripleCount} ;\n  void:dataDump <${release.canonicalUrl}graph.jsonld>, <${release.canonicalUrl}graph.ttl>, <${release.canonicalUrl}entity-facts.csv>, <${release.canonicalUrl}query-matrix.jsonl> ;\n  void:vocabulary <https://schema.org/>, <http://purl.org/dc/terms/>, <http://www.w3.org/ns/prov#> .\n<${release.primaryEntity.id}> a foaf:Person ; foaf:name "Saeed Ghezelbash"@en .\n`;
          await writeFile(path.join(projections,'void.ttl'),voidTtl);

          const dcatMeta=await Promise.all(coreResources.map(fileMeta));
          const distributionIris=dcatMeta.map(m=>`<${release.canonicalUrl}${m.rel}#distribution>`).join(', ');
          let dcat=`@prefix dcat: <http://www.w3.org/ns/dcat#> .\n@prefix dct: <http://purl.org/dc/terms/> .\n@prefix spdx: <http://spdx.org/rdf/terms#> .\n@prefix schema: <https://schema.org/> .\n@prefix xsd: <http://www.w3.org/2001/XMLSchema#> .\n\n<${release.canonicalUrl}#data-catalog> a dcat:Catalog ; dct:title "${datasetName} — Data Catalog"@en ; dct:publisher <${release.primaryEntity.id}> ; dct:modified "${release.dateModified}"^^xsd:date ; dcat:dataset <${release.canonicalUrl}graph.jsonld#dataset> .\n<${release.canonicalUrl}graph.jsonld#dataset> a dcat:Dataset ; dct:title ${ttlString(datasetName)}@en ; dct:description ${ttlString(datasetDescription)}@en ; dct:creator <${release.primaryEntity.id}> ; dct:publisher <${release.primaryEntity.id}> ; dct:modified "${release.dateModified}"^^xsd:date ; dct:license <https://creativecommons.org/licenses/by/4.0/> ; dcat:landingPage <${release.canonicalUrl}> ; schema:version "${release.release}" ; dcat:distribution ${distributionIris} .\n\n`;
          for(const m of dcatMeta)dcat+=`<${release.canonicalUrl}${m.rel}#distribution> a dcat:Distribution ; dct:title ${ttlString(m.title)}@en ; dct:license <https://creativecommons.org/licenses/by/4.0/> ; dcat:accessURL <${release.canonicalUrl}${m.rel}> ; dcat:downloadURL <${release.canonicalUrl}${m.rel}> ; dcat:mediaType ${ttlString(m.mediaType)} ; dcat:byteSize "${m.bytes}"^^xsd:decimal ; spdx:checksum [ a spdx:Checksum ; spdx:algorithm spdx:checksumAlgorithm_sha256 ; spdx:checksumValue "${m.sha256}" ] .\n\n`;
          await writeFile(path.join(projections,'dcat.ttl'),dcat);

          const descriptorResources=[...coreResources,'void.ttl','dcat.ttl','linkset.json'];
          const descriptorMeta=await Promise.all(descriptorResources.map(fileMeta));
          async function walkPublic(dir,prefix=''){let out=[];for(const e of (await readdir(dir,{withFileTypes:true})).sort((a,b)=>a.name.localeCompare(b.name))){const abs=path.join(dir,e.name),rel=prefix?`${prefix}/${e.name}`:e.name;if(e.isDirectory())out.push(...await walkPublic(abs,rel));else if(e.isFile())out.push({abs,rel});}return out;}
          const vttMeta=[];
          for(const f of (await walkPublic(path.join(root,'public'))).filter(x=>x.rel.endsWith('.vtt'))){const b=await readFile(f.abs);const kind=f.rel.includes('.captions.')?'caption':'chapter';vttMeta.push({rel:f.rel,bytes:b.length,sha256:shaHex(b),mediaType:'text/vtt',title:kind==='caption'?'Verified Persian WebVTT caption track transcribed from visible burned-in subtitles.':'WebVTT chapter track for a self-hosted physician video.'});}
          const resources=[...descriptorMeta,...vttMeta];
          const slug=s=>s.replace(/\.[^.]+$/,'').replace(/[^a-z0-9]+/gi,'-').replace(/^-|-$/g,'').toLowerCase();
          const dataPackage={profile:'data-package',name:'dr-saeed-ghezelbash-public-knowledge-graph',title:`${datasetName} — Data Package`,description:'Physician-owned first-party knowledge graph, direct-answer, evidence, provenance and retrieval resources for Dr. Saeed Ghezelbash and the supporting clinic.',homepage:release.canonicalUrl,id:`${release.canonicalUrl}datapackage.json`,version:release.release,created:createdAt,lastUpdated:release.dateModified,licenses:[{name:'CC-BY-4.0',path:'https://creativecommons.org/licenses/by/4.0/',title:'Creative Commons Attribution 4.0'}],contributors:[{title:'Saeed Ghezelbash',path:release.primaryEntity.id,role:'author, creator, publisher, owner'}],resources:resources.map(m=>({name:slug(m.rel),path:m.rel,title:m.title,format:m.rel.endsWith('.vtt')?'vtt':undefined,mediatype:m.mediaType,bytes:m.bytes,hash:`sha256:${m.sha256}`,description:m.rel.endsWith('.vtt')?m.title:undefined})).map(o=>Object.fromEntries(Object.entries(o).filter(([,v])=>v!==undefined)))};
          await writeFile(path.join(projections,'datapackage.json'),JSON.stringify(dataPackage,null,2)+'\n');
          const croissant={'@context':{'@language':'en','@base':release.canonicalUrl,'@vocab':'https://schema.org/','sc':'https://schema.org/','cr':'http://mlcommons.org/croissant/','dct':'http://purl.org/dc/terms/','conformsTo':'dct:conformsTo'},'@id':`${release.canonicalUrl}graph.jsonld#dataset`,'@type':'sc:Dataset',conformsTo:'http://mlcommons.org/croissant/1.1',name:datasetName,description:'Physician-owned first-party knowledge graph Dataset for Dr. Saeed Ghezelbaash, the supporting clinic, services, answers, provenance and machine retrieval.',url:release.canonicalUrl,license:'https://creativecommons.org/licenses/by/4.0/',version:release.release,datePublished:release.dateModified,dateCreated:createdAt,dateModified:release.dateModified,creator:{'@id':release.primaryEntity.id,'@type':'sc:Person',name:'Saeed Ghezelbash'},publisher:{'@id':release.primaryEntity.id,'@type':'sc:Person',name:'Saeed Ghezelbash'},keywords:['Saeed Ghezelbash',...release.primaryEntity.officialAliases.slice(0,2),'physician knowledge graph','aesthetic medicine','Kermanshah','entity data','linked data','query matrix','multilingual retrieval'],inLanguage:['fa','en','ar','ckb'],isLiveDataset:false,distribution:resources.map(m=>({'@type':'cr:FileObject','@id':`${release.canonicalUrl}${m.rel}#croissant-file`,name:path.basename(m.rel),contentUrl:`${release.canonicalUrl}${m.rel}`,contentSize:String(m.bytes),encodingFormat:m.mediaType,sha256:m.sha256,description:m.rel.endsWith('.vtt')?m.title:undefined})).map(o=>Object.fromEntries(Object.entries(o).filter(([,v])=>v!==undefined)))};
          await writeFile(path.join(projections,'croissant.json'),JSON.stringify(croissant,null,2)+'\n');
          console.log(JSON.stringify({descriptorsGenerated:true,release:release.release,coreResources:coreResources.length,resources:resources.length,queryMatrixIncluded:true,datasetName},null,2));
          EOF

          python - <<'PY'
          import json
          from pathlib import Path

          pkg_path=Path('package.json')
          pkg=json.loads(pkg_path.read_text())
          pkg['scripts']['generate']='node scripts/generate-projections.mjs && node scripts/generate-retrieval-projections.mjs && node scripts/generate-descriptors.mjs'
          pkg_path.write_text(json.dumps(pkg,ensure_ascii=False,indent=2)+'\n')

          base_path=Path('scripts/generate-projections.mjs')
          base=base_path.read_text()
          start='// ---- Source-level linked-data descriptors. Finalization regenerates these from actual DIST bytes,\n'
          end='console.log(JSON.stringify({generated:true'
          if start in base:
              a=base.index(start)
              b=base.index(end,a)
              base=base[:a]+base[b:]
          if "writeFile(path.join(projections,'datapackage.json')" in base or "writeFile(path.join(projections,'dcat.ttl')" in base or "writeFile(path.join(projections,'croissant.json')" in base or "writeFile(path.join(projections,'linkset.json')" in base or "writeFile(path.join(projections,'void.ttl')" in base:
              raise SystemExit('base projection generator still owns descriptor output')
          base_path.write_text(base)

          fin_path=Path('scripts/finalize-dist.mjs')
          fin=fin_path.read_text()
          fin=fin.replace("const createdAt=(release.dataset.zenodo.releaseHistory||[]).map(x=>x.publicationDate).sort()[0]||release.dateModified;\n",'')
          meta_start="const contentTypes={\n"
          meta_end="const fileMeta=async rel=>{const b=await readFile(path.join(dist,rel));return{rel,bytes:b.length,sha256:shaHex(b),mediaType:contentTypes[rel]||'application/octet-stream',title:resourceTitles[rel]||rel};};\n"
          if meta_start in fin and meta_end in fin:
              a=fin.index(meta_start); b=fin.index(meta_end,a)+len(meta_end)
              fin=fin[:a]+"const fileMeta=async rel=>{const b=await readFile(path.join(dist,rel));return{rel,bytes:b.length,sha256:shaHex(b)};};\n"+fin[b:]
          block_start='// RFC 9264 Link Set is generated once from canonical release/current-serving truth.\n'
          block_end='// CSP is derived only after executable/inline content is final.\n'
          if block_start not in fin or block_end not in fin:
              raise SystemExit('finalizer descriptor block markers missing')
          a=fin.index(block_start); b=fin.index(block_end,a)
          replacement=(
              "// Canonical linked-data descriptors are generated before Astro build by generate-descriptors.mjs.\n"
              "// Finalization treats them as immutable build inputs and validates their embedded hashes.\n"
              "const dataPackage=JSON.parse(await readFile(path.join(dist,'datapackage.json'),'utf8'));\n"
              "const croissant=JSON.parse(await readFile(path.join(dist,'croissant.json'),'utf8'));\n"
              "const descriptorResourceCount=(dataPackage.resources||[]).length;\n\n"
          )
          fin=fin[:a]+replacement+fin[b:]
          fin=fin.replace('descriptorResources:resources.length','descriptorResources:descriptorResourceCount')
          forbidden=["writeFile(path.join(dist,'datapackage.json')","writeFile(path.join(dist,'croissant.json')","writeFile(path.join(dist,'dcat.ttl')","writeFile(path.join(dist,'void.ttl')","writeFile(path.join(dist,'linkset.json')"]
          for token in forbidden:
              if token in fin: raise SystemExit(f'finalizer still rewrites descriptor: {token}')
          if 'descriptorResources:resources.length' in fin: raise SystemExit('stale descriptor resource variable remains')
          fin_path.write_text(fin)

          repro_path=Path('scripts/validate-reproducibility.mjs')
          repro=repro_path.read_text()
          repro=repro.replace("['scripts/generate-projections.mjs','scripts/generate-retrieval-projections.mjs']","['scripts/generate-projections.mjs','scripts/generate-retrieval-projections.mjs','scripts/generate-descriptors.mjs']")
          repro=repro.replace("projectionWriters:['generate-projections.mjs','generate-retrieval-projections.mjs']","projectionWriters:['generate-projections.mjs','generate-retrieval-projections.mjs','generate-descriptors.mjs']")
          repro_path.write_text(repro)

          val_path=Path('scripts/validate-source.mjs')
          val=val_path.read_text()
          val=val.replace("'scripts/generate-retrieval-projections.mjs','scripts/finalize-dist.mjs'","'scripts/generate-retrieval-projections.mjs','scripts/generate-descriptors.mjs','scripts/finalize-dist.mjs'")
          old="const packageJson=await readFile(path.join(root,'package.json'),'utf8'),retrievalGenerator=await readFile(path.join(root,'scripts/generate-retrieval-projections.mjs'),'utf8');if(packageJson.includes('generate-v122-overlays')||packageJson.includes('finalize-v122-serving'))fail('Obsolete version-specific generator/finalizer still wired');if(retrievalGenerator.includes(\"src/data/projections/llms.txt\"))fail('Retrieval generator illegally writes canonical llms projection');"
          new="const packageJson=await readFile(path.join(root,'package.json'),'utf8'),baseGenerator=await readFile(path.join(root,'scripts/generate-projections.mjs'),'utf8'),retrievalGenerator=await readFile(path.join(root,'scripts/generate-retrieval-projections.mjs'),'utf8'),descriptorGenerator=await readFile(path.join(root,'scripts/generate-descriptors.mjs'),'utf8'),finalizer=await readFile(path.join(root,'scripts/finalize-dist.mjs'),'utf8');if(packageJson.includes('generate-v122-overlays')||packageJson.includes('finalize-v122-serving'))fail('Obsolete version-specific generator/finalizer still wired');if(!packageJson.includes('generate-projections.mjs && node scripts/generate-retrieval-projections.mjs && node scripts/generate-descriptors.mjs'))fail('Canonical generator order drift');if(retrievalGenerator.includes(\"src/data/projections/llms.txt\"))fail('Retrieval generator illegally writes canonical llms projection');for(const name of ['datapackage.json','croissant.json','dcat.ttl','void.ttl','linkset.json']){if(baseGenerator.includes(`writeFile(path.join(projections,'${name}')`))fail(`Base generator illegally writes descriptor ${name}`);if(finalizer.includes(`writeFile(path.join(dist,'${name}')`))fail(`Finalizer illegally rewrites descriptor ${name}`);if(!descriptorGenerator.includes(`writeFile(path.join(projections,'${name}')`))fail(`Descriptor generator missing ${name}`)}"
          if old not in val: raise SystemExit('validate-source ownership marker missing')
          val=val.replace(old,new)
          val_path.write_text(val)
          PY

          node --check scripts/generate-descriptors.mjs
          node --check scripts/generate-projections.mjs
          node --check scripts/finalize-dist.mjs
          node --check scripts/validate-source.mjs
          node --check scripts/validate-reproducibility.mjs
          grep -q 'generate-descriptors.mjs' package.json
          if git diff --quiet -- scripts package.json; then
            echo 'Descriptor writer ownership already converged.'
            exit 0
          fi
          git config user.name 'Dr. Saeed Ghezelbash | دکتر سعید قزلباش'
          git config user.email 'medicaldoctor91@gmail.com'
          git add scripts package.json
          git commit -m 'Establish single canonical descriptor writer'
          git push origin HEAD:release/v1.2.2-candidate

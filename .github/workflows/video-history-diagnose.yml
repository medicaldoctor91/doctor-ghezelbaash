name: V1 exact trigger gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.publish-v1/delta-diagnose-trigger'

permissions:
  contents: read

jobs:
  gate:
    if: github.head_ref == 'publish-v1-exact-2026-08-08'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Verify staged publication inputs are present
        shell: bash
        run: |
          set -euo pipefail
          STAGING='publish-v1-exact-2026-08-08'
          git fetch origin "$STAGING:refs/remotes/origin/$STAGING"
          git show "origin/$STAGING:.publish-v1/publish.sh" > /tmp/publish-v1.sh
          test -s /tmp/publish-v1.sh
          git show "origin/$STAGING:.publish-v1/v1patch-correction.b64" | tr -d '\r\n\t ' | base64 -d > /tmp/correction.zst
          echo 'a9aaace2c1cef0e8da9756f9c20d995f242e2ffb32091f24703d277dc19eaf21  /tmp/correction.zst' | sha256sum -c -
          grep -F "V1_ZIP_SHA='aadc1c5ce0cb97298026250bf08041b059e05d7eda18d691746d846ac96a2d79'" /tmp/publish-v1.sh
          grep -F "V1_TAR_SHA='5af601eef6a44adc2776b3a82255213bd8e283b356c15ceb0b5122b1c6f1a0d2'" /tmp/publish-v1.sh

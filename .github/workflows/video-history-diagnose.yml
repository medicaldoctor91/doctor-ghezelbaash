name: Diagnose exact V1 delta chunks

on:
  pull_request:
    branches: [main]
    paths:
      - '.publish-v1/delta-diagnose-trigger'

permissions:
  contents: read

jobs:
  diagnose:
    if: github.head_ref == 'publish-v1-exact-2026-08-08'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Hash staged V1 delta chunks and decoded patch
        shell: bash
        run: |
          set -euo pipefail
          STAGING='publish-v1-exact-2026-08-08'
          git fetch origin "$STAGING:refs/remotes/origin/$STAGING"
          : > /tmp/all.b64
          for part in 00 01 02 03; do
            f="/tmp/part${part}"
            git show "origin/$STAGING:.publish-v1/patch.part${part}" > "$f"
            printf 'PART%s bytes=%s sha256=%s\n' "$part" "$(wc -c < "$f")" "$(sha256sum "$f" | awk '{print $1}')"
            tr -d '\r\n\t ' < "$f" >> /tmp/all.b64
          done
          printf 'NORMALIZED_B64 bytes=%s sha256=%s\n' "$(wc -c < /tmp/all.b64)" "$(sha256sum /tmp/all.b64 | awk '{print $1}')"
          base64 -d /tmp/all.b64 > /tmp/v1.patch.zst
          printf 'DECODED_PATCH bytes=%s sha256=%s\n' "$(wc -c < /tmp/v1.patch.zst)" "$(sha256sum /tmp/v1.patch.zst | awk '{print $1}')"
          test "$(wc -c < /tmp/all.b64)" -eq 21412
          test "$(sha256sum /tmp/v1.patch.zst | awk '{print $1}')" = '6da1ed618cff17d5fbe5de98122a73e7540dc71e88ae2d7b897ea319304b7ac7'

name: Repair structured data once

on:
  push:
    branches:
      - fix-rich-results-2026-08-02
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v6
        with:
          ref: fix-rich-results-2026-08-02

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip

      - name: Install RDF validation dependency
        run: python -m pip install "rdflib==7.2.1"

      - name: Repair and validate synchronized graph files
        run: python scripts/repair-structured-data.py

      - name: Commit generated graph projections
        run: |
          if git diff --quiet -- public/graph.jsonld public/graph.ttl src/data/semantic/head-graph.min.jsonld; then
            echo "Structured-data projections already match the repaired canonical graph."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/graph.jsonld public/graph.ttl src/data/semantic/head-graph.min.jsonld
          git commit -m "fix: repair rich-result entities and inline graph"
          git push origin HEAD:fix-rich-results-2026-08-02

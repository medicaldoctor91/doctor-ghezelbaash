name: Complete one-time entity graph repair

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/entity-graph-surgical-fix-v2.yml'

permissions:
  contents: write

concurrency:
  group: complete-entity-graph-repair-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install deterministic RDF tooling
        run: python -m pip install --quiet 'rdflib==7.6.0'

      - name: Execute repaired migration and remove temporary workflows
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import re
          import textwrap
          from pathlib import Path

          workflow_path = Path('.github/workflows/entity-graph-surgical-fix.yml')
          workflow = workflow_path.read_text(encoding='utf-8')
          marker_start = "          python - <<'PY'\n"
          marker_end = "\n          PY\n"
          start = workflow.index(marker_start) + len(marker_start)
          end = workflow.index(marker_end, start)
          migration = textwrap.dedent(workflow[start:end])

          replacement = '''json_graph = Graph().parse('public/graph.jsonld', format='json-ld')
          from rdflib.compare import to_canonical_graph
          canonical_graph = to_canonical_graph(json_graph)
          ntriples = canonical_graph.serialize(format='nt')
          write('public/graph.ttl', '\\n'.join(sorted(line for line in ntriples.splitlines() if line.strip())) + '\\n')
          ttl_graph = Graph().parse('public/graph.ttl', format='turtle')
          if not isomorphic(json_graph, ttl_graph):
              raise RuntimeError(f'canonical JSON-LD/Turtle divergence: {len(json_graph)} vs {len(ttl_graph)} triples')
          for obsolete in OBSOLETE:
              if obsolete in read('public/graph.ttl'):
                  raise RuntimeError(f'public/graph.ttl: obsolete IRI remains: {obsolete}')
          '''

          pattern = re.compile(
              r"ttl_path = Path\('public/graph\.ttl'\)[\s\S]*?(?=sitemap = read\('public/sitemap\.xml'\))"
          )
          migration, count = pattern.subn(lambda _match: replacement, migration, count=1)
          if count != 1:
              raise RuntimeError(f'expected one Turtle migration block, found {count}')

          compiled = compile(migration, '<entity-graph-surgical-migration>', 'exec')
          exec(compiled, {'__name__': '__main__'})

          Path('.github/workflows/entity-graph-surgical-fix-v2.yml').unlink()
          PY

          python -m py_compile .github/scripts/validate_source.py .github/scripts/validate_live.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Consolidate canonical indexing and repair graph identities'
          git push origin HEAD:"${HEAD_BRANCH}"

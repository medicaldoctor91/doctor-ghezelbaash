name: Hugging Face Dataset Server probe

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/hf-dataset-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Probe live Dataset Server
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, urllib.parse, urllib.request, urllib.error
          base='https://datasets-server.huggingface.co'
          dataset='doctor-ghezelbaash/dr-saeid-ghezelbaash-entity-data'
          calls=[
            ('is-valid','/is-valid',{}),
            ('splits','/splits',{}),
            ('entity-first-rows','/first-rows',{'config':'entity_facts','split':'train'}),
            ('entity-rows','/rows',{'config':'entity_facts','split':'train','offset':'0','length':'5'}),
            ('entity-statistics','/statistics',{'config':'entity_facts','split':'train'}),
            ('positioning-first-rows','/first-rows',{'config':'positioning_instructions','split':'train'}),
            ('positioning-rows','/rows',{'config':'positioning_instructions','split':'train','offset':'0','length':'5'}),
            ('positioning-statistics','/statistics',{'config':'positioning_instructions','split':'train'}),
            ('parquet','/parquet',{}),
            ('size','/size',{}),
            ('croissant','/croissant',{}),
          ]
          for label,path,params in calls:
            q={'dataset':dataset,**params}
            url=base+path+'?'+urllib.parse.urlencode(q)
            req=urllib.request.Request(url,headers={'Cache-Control':'no-cache','Pragma':'no-cache','User-Agent':'ghezelbaash-hf-probe/1.0'})
            try:
              with urllib.request.urlopen(req,timeout=30) as r:
                raw=r.read().decode('utf-8','replace')
                try: data=json.loads(raw)
                except: data=raw
                print('PROBE',label,'HTTP',r.status)
                if label=='is-valid': print('PAYLOAD',json.dumps(data,ensure_ascii=False))
                elif label=='splits': print('PAIRS',[(x.get('config'),x.get('split')) for x in data.get('splits',[])])
                elif label.endswith('first-rows') or label.endswith('-rows'): print('ROW_COUNT',len(data.get('rows',[])))
                elif label=='parquet': print('PARQUET',[(x.get('config'),x.get('split'),x.get('filename')) for x in data.get('parquet_files',[])])
                elif label=='size': print('SIZE_FAILED',data.get('failed'),'SIZE',json.dumps(data.get('size',{}).get('dataset',{}),ensure_ascii=False))
                else: print('OBJECT_KEYS',list(data)[:20] if isinstance(data,dict) else type(data).__name__)
            except urllib.error.HTTPError as e:
              raw=e.read().decode('utf-8','replace')
              print('PROBE',label,'HTTP',e.code,'ERROR',raw[:1000])
            except Exception as e:
              print('PROBE',label,'EXCEPTION',repr(e))
          PY

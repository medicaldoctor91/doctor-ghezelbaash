name: Hugging Face Dataset Server probe

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/hf-dataset-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Probe live Hugging Face revision and Dataset Server
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv, io, json, re, urllib.error, urllib.parse, urllib.request
          dataset='doctor-ghezelbaash/dr-saeid-ghezelbaash-entity-data'
          headers={'Cache-Control':'no-cache','Pragma':'no-cache','User-Agent':'ghezelbaash-hf-probe/2.0'}

          def fetch(url):
            req=urllib.request.Request(url,headers=headers)
            with urllib.request.urlopen(req,timeout=30) as r:
              return r.status,r.read().decode('utf-8','replace')

          # Inspect exactly what main currently exposes to Dataset Server.
          rawbase=f'https://huggingface.co/datasets/{dataset}/resolve/main/'
          status,readme=fetch(rawbase+'README.md?download=true')
          print('LIVE_README_HTTP',status)
          m=re.match(r'^---\s*\n(.*?)\n---',readme,re.S)
          print('LIVE_FRONTMATTER_BEGIN')
          print(m.group(1) if m else 'NO_FRONTMATTER')
          print('LIVE_FRONTMATTER_END')

          for filename in [
            'enrichment/instruction_examples_fa_market_positioning.csv',
            'enrichment/instruction_examples_fa_market_positioning.jsonl',
          ]:
            try:
              status,text=fetch(rawbase+filename+'?download=true')
              print('LIVE_FILE',filename,'HTTP',status,'BYTES',len(text.encode('utf-8')))
              if filename.endswith('.csv'):
                parsed=list(csv.reader(io.StringIO(text)))
                print('CSV_ROWS',len(parsed)-1,'CSV_HEADER_FIELDS',len(parsed[0]) if parsed else 0,'CSV_ROW11_FIELDS',len(parsed[11]) if len(parsed)>11 else None)
                print('CSV_HEADER',parsed[0] if parsed else [])
              else:
                lines=[x for x in text.splitlines() if x.strip()]
                print('JSONL_ROWS',len(lines),'JSONL_FIRST_KEYS',list(json.loads(lines[0]).keys()) if lines else [])
            except urllib.error.HTTPError as e:
              print('LIVE_FILE',filename,'HTTP',e.code,'ERROR',e.read().decode('utf-8','replace')[:500])

          base='https://datasets-server.huggingface.co'
          calls=[
            ('is-valid','/is-valid',{}),
            ('splits','/splits',{}),
            ('entity-first-rows','/first-rows',{'config':'entity_facts','split':'train'}),
            ('entity-rows','/rows',{'config':'entity_facts','split':'train','offset':'0','length':'5'}),
            ('entity-statistics','/statistics',{'config':'entity_facts','split':'train'}),
            ('positioning-first-rows','/first-rows',{'config':'positioning_instructions','split':'train'}),
            ('positioning-rows','/rows',{'config':'positioning_instructions','split':'train','offset':'0','length':'5'}),
            ('positioning-statistics','/statistics',{'config':'positioning_instructions','split':'train'}),
            ('parquet','/parquet',{}),
            ('size','/size',{}),
          ]
          for label,path,params in calls:
            q={'dataset':dataset,**params}
            url=base+path+'?'+urllib.parse.urlencode(q)
            req=urllib.request.Request(url,headers=headers)
            try:
              with urllib.request.urlopen(req,timeout=30) as r:
                raw=r.read().decode('utf-8','replace')
                data=json.loads(raw)
                print('PROBE',label,'HTTP',r.status)
                if label=='is-valid': print('PAYLOAD',json.dumps(data,ensure_ascii=False))
                elif label=='splits': print('PAIRS',[(x.get('config'),x.get('split')) for x in data.get('splits',[])])
                elif label.endswith('first-rows') or label.endswith('-rows'): print('ROW_COUNT',len(data.get('rows',[])))
                elif label=='parquet': print('PARQUET',[(x.get('config'),x.get('split'),x.get('filename')) for x in data.get('parquet_files',[])])
                elif label=='size': print('SIZE_FAILED',data.get('failed'),'SIZE',json.dumps(data.get('size',{}).get('dataset',{}),ensure_ascii=False))
                else: print('OBJECT_KEYS',list(data)[:20])
            except urllib.error.HTTPError as e:
              raw=e.read().decode('utf-8','replace')
              print('PROBE',label,'HTTP',e.code,'ERROR',raw[:1000])
          PY

name: Temporary final lifecycle rewrite

on:
  push:
    branches: [refactor/final-lifecycle-authority]

permissions:
  contents: write

jobs:
  rewrite:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: refactor/final-lifecycle-authority
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
      - name: Apply exact authority/lifecycle transformations
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const must=(c,m)=>{if(!c)throw new Error(m)};
          const writeJson=(file,value)=>fs.writeFileSync(file,JSON.stringify(value,null,2)+'\n');
          const replaceOnce=(source,pattern,replacement,label)=>{
            const next=source.replace(pattern,replacement);
            must(next!==source,`rewrite pattern missing: ${label}`);
            return next;
          };

          const release=JSON.parse(fs.readFileSync('src/data/release.json','utf8'));
          const currentEvidenceId=`${release.canonicalUrl}#evidence-zenodo-current-release`;
          const currentEvidenceUrl=`https://doi.org/${release.dataset.zenodo.versionDoi}`;
          for(const file of ['src/data/evidence-registry.json','src/data/evidence-snapshot.json']){
            const data=JSON.parse(fs.readFileSync(file,'utf8'));
            const rows=data.evidence||data.entries||[];
            const row=rows.find(item=>item.id===currentEvidenceId);
            must(row,`${file}: current Zenodo evidence missing`);
            row.url=currentEvidenceUrl;
            writeJson(file,data);
          }

          let promote=fs.readFileSync('scripts/promote-release.mjs','utf8');
          promote=replaceOnce(promote,
            "const [release,pkg,lock,volatile,evidenceSnapshot,graph,citationSource,codemeta]=await Promise.all([\n  readJson('src/data/release.json'),\n  readJson('package.json'),\n  readJson('package-lock.json'),\n  readJson('src/data/volatile-facts.json'),\n  readJson('src/data/evidence-snapshot.json'),",
            "const [release,pkg,lock,volatile,evidenceRegistry,evidenceSnapshot,graph,citationSource,codemeta]=await Promise.all([\n  readJson('src/data/release.json'),\n  readJson('package.json'),\n  readJson('package-lock.json'),\n  readJson('src/data/volatile-facts.json'),\n  readJson('src/data/evidence-registry.json'),\n  readJson('src/data/evidence-snapshot.json'),",
            'promotion evidence inputs');
          promote=replaceOnce(promote,
            "evidenceSnapshot.release=next.release;\n",
            "evidenceSnapshot.release=next.release;\nconst currentEvidenceId=`${release.canonicalUrl}#evidence-zenodo-current-release`;\nconst currentEvidenceUrl=`https://doi.org/${next.versionDoi}`;\nconst registryEvidence=(evidenceRegistry.evidence||[]).find(item=>item.id===currentEvidenceId);\nconst snapshotEvidence=(evidenceSnapshot.entries||[]).find(item=>item.id===currentEvidenceId);\nmust(registryEvidence&&snapshotEvidence,'Current Zenodo evidence pointer is missing');\nregistryEvidence.url=currentEvidenceUrl;\nsnapshotEvidence.url=currentEvidenceUrl;\n",
            'promotion evidence convergence');
          promote=replaceOnce(promote,
            "  {file:'src/data/volatile-facts.json',content:json(volatile)},\n  {file:'src/data/evidence-snapshot.json',content:json(evidenceSnapshot)},",
            "  {file:'src/data/volatile-facts.json',content:json(volatile)},\n  {file:'src/data/evidence-registry.json',content:json(evidenceRegistry)},\n  {file:'src/data/evidence-snapshot.json',content:json(evidenceSnapshot)},",
            'promotion evidence transaction');
          fs.writeFileSync('scripts/promote-release.mjs',promote);

          let tests=fs.readFileSync('scripts/test-contracts.mjs','utf8');
          tests=replaceOnce(tests,
            "'src/data/volatile-facts.json','src/data/evidence-snapshot.json','src/data/semantic/knowledge-graph.jsonld'",
            "'src/data/volatile-facts.json','src/data/evidence-registry.json','src/data/evidence-snapshot.json','src/data/semantic/knowledge-graph.jsonld'",
            'promotion test targets');
          fs.writeFileSync('scripts/test-contracts.mjs',tests);

          let contract=fs.readFileSync('scripts/validate-release-contract.mjs','utf8');
          contract=replaceOnce(contract,
            "if(previousHistory){\n  const archivedSection=pageSource.match(/<p><strong>Archived DOI release citation:<\\/strong>[\\s\\S]*?<\\/p>/i)?.[0]||'';\n  if(!archivedSection.includes(`Version ${previousHistory.release}`)||!archivedSection.includes(previousHistory.versionDoi))fail('Archived DOI release citation history regressed');\n}\n",
            "if(previousHistory){\n  const archivedSection=pageSource.match(/<p><strong>Archived DOI release citation:<\\/strong>[\\s\\S]*?<\\/p>/i)?.[0]||'';\n  if(!archivedSection.includes(`Version ${previousHistory.release}`)||!archivedSection.includes(previousHistory.versionDoi))fail('Archived DOI release citation history regressed');\n}\nconst [evidenceRegistry,evidenceSnapshot]=await Promise.all([readJson('src/data/evidence-registry.json'),readJson('src/data/evidence-snapshot.json')]);\nconst currentEvidenceId=`${release.canonicalUrl}#evidence-zenodo-current-release`;\nconst currentEvidenceUrl=`https://doi.org/${Z.versionDoi}`;\nconst registryEvidence=(evidenceRegistry.evidence||[]).find(item=>item.id===currentEvidenceId);\nconst snapshotEvidence=(evidenceSnapshot.entries||[]).find(item=>item.id===currentEvidenceId);\nif(!registryEvidence||!snapshotEvidence||registryEvidence.url!==currentEvidenceUrl||snapshotEvidence.url!==currentEvidenceUrl)fail('Current Zenodo evidence pointer drift');\n",
            'release evidence validator');
          fs.writeFileSync('scripts/validate-release-contract.mjs',contract);

          let architecture=fs.readFileSync('scripts/validate-architecture.mjs','utf8');
          architecture=replaceOnce(architecture,"'scripts/generated-workspace.mjs'","'scripts/pipeline.mjs','scripts/generated-workspace.mjs'",'architecture pipeline required');
          architecture=replaceOnce(architecture,
            /assert\(pkg\.scripts\?\.\['clean:generated'\][\s\S]*?for\(const token of \['MANIFEST_LOCKED'/,
            `const pipeline=await read('scripts/pipeline.mjs');\nconst expectedInterface=['build','check','ci','dev','indexnow:submit','media:enrich','preview','release','release:prepare','release:promote','release:zenodo','render:calibration:apply','verify:production','verify:public-discovery','verify:subdomains'].sort();\nassert(JSON.stringify(Object.keys(pkg.scripts||{}).sort())===JSON.stringify(expectedInterface),\`Package lifecycle interface drift: \${Object.keys(pkg.scripts||{}).sort().join(', ')}\`);\nfor(const [name,value] of Object.entries({dev:'node scripts/pipeline.mjs dev',preview:'node scripts/pipeline.mjs preview',check:'node scripts/pipeline.mjs check',build:'node scripts/pipeline.mjs build',ci:'node scripts/pipeline.mjs ci','release:prepare':'node scripts/pipeline.mjs prepare',release:'node scripts/pipeline.mjs release'}))assert(pkg.scripts?.[name]===value,\`Pipeline interface drift: \${name}\`);\nfor(const token of ['const prepareGenerated=','const validateSource=','const validateReleaseEvidence=','const buildDist=','const prepareRelease=',\"case 'ci': prepareRelease(); buildDist(); packageSource(); break;\",\"case 'release': prepareRelease(); buildDist(); completeRelease(); break;\"])assert(pipeline.includes(token),\`Lifecycle owner missing: \${token}\`);\nassert(pkg.scripts?.['release:promote']==='node scripts/promote-release.mjs'&&pkg.scripts?.['release:zenodo']==='python scripts/zenodo_release.py','Release-only lifecycle is not discoverable');\nassert(pkg.scripts?.['media:enrich']==='node scripts/enrich-image-metadata-manifest.mjs','Media enrichment bypasses canonical manifest gate');\nfor(const token of ['MANIFEST_LOCKED'`,
            'architecture lifecycle block');
          fs.writeFileSync('scripts/validate-architecture.mjs',architecture);

          let source=fs.readFileSync('scripts/validate-source.mjs','utf8');
          source=replaceOnce(source,"'scripts/apply-render-calibration.mjs'","'scripts/pipeline.mjs','scripts/apply-render-calibration.mjs'",'source pipeline required');
          source=replaceOnce(source,
            "const projectionCompilers=[pageAssetsCompiler,graphCompiler,semanticCompiler,retrievalCompiler,contactCompiler];",
            "const pipeline=await readSource('scripts/pipeline.mjs');\nconst projectionCompilers=[pageAssetsCompiler,graphCompiler,semanticCompiler,retrievalCompiler,contactCompiler];",
            'source pipeline input');
          source=replaceOnce(source,
            /const scriptSteps=name=>[\s\S]*?if\(generateSteps\.indexOf[\s\S]*?fail\('Canonical generator order drift'\);\n/,
            `const expectedPipelineScripts={build:'node scripts/pipeline.mjs build',check:'node scripts/pipeline.mjs check',ci:'node scripts/pipeline.mjs ci','release:prepare':'node scripts/pipeline.mjs prepare',release:'node scripts/pipeline.mjs release'};\nfor(const [name,value] of Object.entries(expectedPipelineScripts))if(pkg.scripts?.[name]!==value)fail(\`Lifecycle pipeline wiring missing: \${name}\`);\nif(pkg.scripts?.['release:promote']!=='node scripts/promote-release.mjs'||pkg.scripts?.['release:zenodo']!=='python scripts/zenodo_release.py')fail('Release publication lifecycle is not discoverable');\nif(/\\bwriteFile\\b|\\bappendFile\\b/.test(mediaReferenceValidator))fail('Media reference validation must never rewrite source');\nif(calibrationWriter.includes('src/styles/global.css')||!calibrationWriter.includes('renderCalibrationCss')||!calibrationWriter.includes('rename(temporaryPath,canonicalPath)'))fail('Render calibration writer must update only canonical JSON through the shared renderer');\nif(hfVerifier.includes('/raw/main/README.md')||!hfVerifier.includes('HF organization profile authority token missing'))fail('Hugging Face profile verifier is not bound to the public organization profile surface');\nfor(const expected of [\"js('generate canonical projections','scripts/generate-projections.mjs')\",\"js('generate retrieval projections','scripts/generate-retrieval-projections.mjs')\",\"js('generate descriptors','scripts/generate-descriptors.mjs')\"])if(!pipeline.includes(expected))fail(\`Canonical pipeline generator missing: \${expected}\`);\nif(!(pipeline.indexOf(\"scripts/generate-projections.mjs\")<pipeline.indexOf(\"scripts/generate-retrieval-projections.mjs\")&&pipeline.indexOf(\"scripts/generate-retrieval-projections.mjs\")<pipeline.indexOf(\"scripts/generate-descriptors.mjs\")))fail('Canonical pipeline generator order drift');\n`,
            'source lifecycle checks');
          fs.writeFileSync('scripts/validate-source.mjs',source);
          NODE
      - name: Commit rewritten canonical source if needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'LIFECYCLE_REWRITE_ALREADY_CONVERGED'
            exit 0
          fi
          git config user.name ghezelbaash-architecture-bot
          git config user.email actions@users.noreply.github.com
          git add src/data/evidence-registry.json src/data/evidence-snapshot.json scripts/promote-release.mjs scripts/test-contracts.mjs scripts/validate-release-contract.mjs scripts/validate-architecture.mjs scripts/validate-source.mjs
          git commit -m "refactor: converge release evidence and lifecycle contracts"
          git push origin HEAD:refactor/final-lifecycle-authority

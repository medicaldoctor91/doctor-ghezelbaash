name: Temporary calibration CSS materialization patch

on:
  push:
    branches: [fix/render-calibration-measurement-20260907]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
      - run: node scripts/patch-render-calibration-css-materialization.mjs
      - name: Syntax-check exact measurement path
        run: |
          node --check scripts/measure-render-calibration.mjs
          node --check scripts/register-render-calibration-contract.mjs
      - name: Require exact patch scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed=$(git diff --name-only)
          expected=$'scripts/measure-render-calibration.mjs\nscripts/register-render-calibration-contract.mjs'
          test "$changed" = "$expected"
      - name: Commit exact CSS materialization path
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/measure-render-calibration.mjs scripts/register-render-calibration-contract.mjs
          git commit -m "Materialize only calibration CSS for browser measurement"
          git push origin "HEAD:${GITHUB_REF_NAME}"

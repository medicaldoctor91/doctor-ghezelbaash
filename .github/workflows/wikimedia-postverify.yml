name: Verify Wikimedia publication

on:
  push:
    branches: [main]
    paths:
      - 'scripts/wikimedia_postverify.py'
      - '.github/workflows/wikimedia-postverify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14.6'
      - name: Install dependency
        run: python -m pip install --disable-pip-version-check --no-input requests==2.32.5
      - name: Read back Wikimedia state
        run: python scripts/wikimedia_postverify.py

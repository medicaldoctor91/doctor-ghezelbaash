name: Verify 18 Nov 2026 approved clinical attribution on all 72 live pages (read-only)
on:
  push:
    branches: [audit/live-nov18-attribution-20261122]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-attribution-crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install minimal read-only HTTP client
        run: python -m pip install requests
      - name: Audit canonical graph and live JSON-LD on all 72 sitemap pages
        run: python .github/scripts/verify_nov18_live_site.py
      - name: Preserve detailed per-page proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nov18-live-72-page-attribution-evidence
          path: /tmp/live-nov18-audit.json
          if-no-files-found: warn
          retention-days: 30

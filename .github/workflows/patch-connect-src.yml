name: Apply same-origin CSP connectivity patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-connect-src.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Patch CSP and validators then remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              Path('public/_headers'): [("connect-src 'none'", "connect-src 'self'")],
              Path('.github/scripts/validate_source.py'): [("\"script-src-attr 'none'\", \"style-src-attr 'none'\", \"connect-src 'none'\"", "\"script-src-attr 'none'\", \"style-src-attr 'none'\", \"connect-src 'self'\"")],
              Path('.github/scripts/validate_live.py'): [("\"script-src-attr 'none'\", \"style-src-attr 'none'\", \"connect-src 'none'\", \"object-src 'none'\", \"frame-ancestors 'none'\"", "\"script-src-attr 'none'\", \"style-src-attr 'none'\", \"connect-src 'self'\", \"object-src 'none'\", \"frame-ancestors 'none'\"")],
          }
          for path, pairs in replacements.items():
              text = path.read_text(encoding='utf-8')
              for old, new in pairs:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f'{path}: expected one occurrence of {old!r}, found {count}')
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')
          PY
          git rm .github/workflows/patch-connect-src.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/_headers .github/scripts/validate_source.py .github/scripts/validate_live.py
          git commit -m 'Allow same-origin crawler discovery under strict CSP'
          git push origin HEAD:main

name: Temporary read-only Wikimedia integrity summary

on:
  pull_request:
    types: [opened]
    branches: [main]

permissions:
  contents: write

jobs:
  summarize:
    if: github.head_ref == 'tmp-readonly-wikimedia-integrity-summary'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14.6'
      - name: Build compact inventory from live snapshot
        shell: bash
        run: |
          set -euo pipefail
          python scripts/_tmp_summarize_wikimedia_integrity_audit.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add wikimedia/_tmp-readonly-wikimedia-integrity-summary.txt
          git commit -m 'Record compact Wikimedia integrity summary' || true
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

name: Cloudflare AI policy readback
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]
permissions:
  contents: read
jobs:
  readback:
    if: github.event.pull_request.head.ref == 'cloudflare-ai-policy-readback-20260810'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 884d1d90bd1fb6ecca14992c6c60d677
      ZONE_ID: 5fc0f0a745ed95c6fb9f79ac7386e370
    steps:
      - name: Read crawler-impacting zone controls with temporary zone token
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import datetime as dt, json, os, urllib.error, urllib.parse, urllib.request
          A=os.environ['CLOUDFLARE_ACCOUNT_ID']; M=os.environ['CLOUDFLARE_API_TOKEN']; Z=os.environ['ZONE_ID']; B='https://api.cloudflare.com/client/v4'
          def call(tok,method,path,body=None):
              data=None if body is None else json.dumps(body,separators=(',',':')).encode()
              req=urllib.request.Request(B+path,data=data,method=method,headers={'Authorization':f'Bearer {tok}','Accept':'application/json','Content-Type':'application/json','User-Agent':'ghezelbaash-ai-policy-readback/1.0'})
              try:
                  with urllib.request.urlopen(req,timeout=40) as r:
                      raw=r.read().decode('utf-8','replace'); return r.status,json.loads(raw) if raw else {}
              except urllib.error.HTTPError as e:
                  raw=e.read().decode('utf-8','replace')
                  try:p=json.loads(raw) if raw else {}
                  except Exception:p={'raw':raw[:500]}
                  return e.code,p
          st,pg=call(M,'GET',f'/accounts/{A}/tokens/permission_groups?scope=com.cloudflare.api.account.zone')
          if st!=200 or pg.get('success') is not True: raise SystemExit(f'permission groups failed {st}')
          groups=[{'id':g['id']} for g in (pg.get('result') or []) if 'com.cloudflare.api.account.zone' in (g.get('scopes') or [])]
          exp=(dt.datetime.now(dt.timezone.utc)+dt.timedelta(minutes=20)).replace(microsecond=0).isoformat().replace('+00:00','Z')
          st,t=call(M,'POST',f'/accounts/{A}/tokens',{'name':'Temporary Ghezelbaash AI Policy Readback','expires_on':exp,'policies':[{'effect':'allow','resources':{f'com.cloudflare.api.account.zone.{Z}':'*'},'permission_groups':groups}]})
          if st not in (200,201) or t.get('success') is not True: raise SystemExit(f'temp token failed {st}')
          R=t.get('result') or {}; T=R.get('value'); tid=R.get('id')
          try:
              st,s=call(T,'GET',f'/zones/{Z}/settings')
              if st!=200 or s.get('success') is not True: raise SystemExit(f'zone settings failed {st}')
              wanted=('bot','crawler','robot','hint','brain','rocket','brotli','http3','minify')
              out=[{'id':x.get('id'),'value':x.get('value'),'editable':x.get('editable')} for x in (s.get('result') or []) if any(k in str(x.get('id','')).lower() for k in wanted)]
              print('ZONE_CONTROLS',json.dumps(out,ensure_ascii=False,sort_keys=True))
              st,b=call(T,'GET',f'/zones/{Z}/bot_management')
              print('BOT_MANAGEMENT_STATUS',st)
              if st==200 and b.get('success') is True:
                  r=b.get('result') or {}
                  keep={k:r.get(k) for k in ('fight_mode','ai_bots_protection','crawler_protection','enable_js','using_latest_model') if k in r}
                  print('BOT_MANAGEMENT_CONTROLS',json.dumps(keep,ensure_ascii=False,sort_keys=True))
          finally:
              st,r=call(M,'DELETE',f'/accounts/{A}/tokens/{tid}')
              print('TEMP_TOKEN_REVOKED',st,r.get('success'))
          PY

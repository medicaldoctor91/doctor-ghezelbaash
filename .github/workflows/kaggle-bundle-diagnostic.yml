name: Inspect Kaggle 29 owner and public bundle downloads
on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact dataset version to inspect (29 only)
        type: string
        required: true
        default: '29'
      reviewed_commit:
        description: Exact reviewed commit containing this read-only diagnostic
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: doctor-ghezelbaash-kaggle-read-only-bundle-diagnostic
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN || secrets.KAGGLE_TOKEN }}
      ARCHIVE_SOURCE_COMMIT: ${{ vars.ZENODO_23474664_SOURCE_COMMIT }}
      INPUT_KAGGLE_VERSION: ${{ inputs.version }}
      REVIEWED_COMMIT: ${{ inputs.reviewed_commit }}
      DIAGNOSTIC_DIR: ${{ runner.temp }}/kaggle-bundle-diagnostic
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Check the exact reviewed source and allowed read scope
        run: |
          python - <<'PY'
          import os,re
          assert os.environ['INPUT_KAGGLE_VERSION']=='29', 'Only the reviewed dataset version 29 is allowed'
          assert re.fullmatch(r'[a-f0-9]{40}',os.environ['REVIEWED_COMMIT']), 'Expected a full reviewed commit'
          assert os.environ['GITHUB_SHA']==os.environ['REVIEWED_COMMIT'], 'Workflow source differs from review'
          assert os.environ.get('KAGGLE_API_TOKEN'), 'Existing Kaggle binding is unavailable'
          PY
      - name: Install the existing authenticated download client
        run: python -m pip install --disable-pip-version-check requests 'kaggle==2.2.4'
      - name: Read the owner bundle once, then read the anonymous exact-version bundle once
        run: |
          python - <<'PY'
          import contextlib,hashlib,io,json,os,re,stat,sys,time,zipfile
          from pathlib import Path,PurePosixPath
          import requests
          sys.path.insert(0,str(Path('.github/scripts').resolve()))
          from sync_platform_machine_resources import kaggle_client,KAGGLE_REF

          root=Path(os.environ['DIAGNOSTIC_DIR']);root.mkdir(parents=True,exist_ok=True)
          version=int(os.environ['INPUT_KAGGLE_VERSION']);assert version==29
          def clean_message(value):
              if not isinstance(value,str):return 'No structured API error message'
              value=re.sub(r'https?://\S+','[url]',value)
              value=re.sub(r'(?i)\b(bearer|token|api[_-]?key|authorization)[\s:=]+\S+',r'\1 [redacted]',value)
              return ' '.join(value.split())[:300]
          def http_error(error=None,response=None):
              if response is None:response=getattr(error,'response',None)
              result={'status':'unavailable','errorType':type(error).__name__ if error is not None else 'HTTPError',
                      'httpStatus':getattr(response,'status_code',None),'message':'No structured API error message','requestIds':{}}
              if response is not None:
                  for name,value in response.headers.items():
                      if re.fullmatch(r'(?i)(x-)?(kaggle-)?request-?id|x-cloud-trace-context|x-goog-request-id',name):
                          result['requestIds'][name]=clean_message(value)
                  try:
                      payload=response.json();payload=payload.get('error',payload)
                      if isinstance(payload,dict):
                          result['message']=clean_message(payload.get('message'))
                          request_id=payload.get('requestId') or payload.get('request_id')
                          if isinstance(request_id,str):result['requestIds']['bodyRequestId']=clean_message(request_id)
                  except (ValueError,AttributeError):pass
              return result
          def inspect_zip(body):
              if not zipfile.is_zipfile(io.BytesIO(body)):raise AssertionError('Returned body is not a valid ZIP')
              with zipfile.ZipFile(io.BytesIO(body)) as zipped:
                  members=zipped.infolist();names=[m.filename for m in members]
                  assert len(names)==len(set(names)), 'Duplicate ZIP member'
                  for member in members:
                      path=PurePosixPath(member.filename)
                      assert not path.is_absolute() and '..' not in path.parts and '\\' not in member.filename, 'Unsafe ZIP member'
                      assert not stat.S_ISLNK(member.external_attr>>16), 'ZIP symlink is not allowed'
                  assert zipped.testzip() is None, 'Corrupt ZIP member'
                  files={m.filename:{'bytes':m.file_size,'sha256':hashlib.sha256(zipped.read(m.filename)).hexdigest()}
                         for m in members if not m.is_dir()}
                  expected={}
                  for line in zipped.read('checksums.sha256').decode().splitlines():
                      digest,name=line.split('  ',1)
                      assert re.fullmatch(r'[a-f0-9]{64}',digest) and name not in expected, 'Invalid checksum inventory'
                      expected[name]=digest
                  assert expected and set(expected)==set(files)-{'checksums.sha256'}, 'Incomplete checksum inventory'
                  assert all(files[name]['sha256']==digest for name,digest in expected.items()), 'ZIP checksum mismatch'
                  manifest=json.loads(zipped.read('kaggle-manifest.json'))
                  assert manifest['desired_kaggle_version']==version, 'Unexpected dataset version'
              return {'status':'verified','bytes':len(body),'sha256':hashlib.sha256(body).hexdigest(),
                      'version':version,'sourceCommit':manifest['website_source_commit'],'hfRevision':manifest['upstream_revision'],
                      'filesVerified':len(files),'packageChecksumsVerified':len(expected),'files':files}

          report={'scope':'One normal authenticated SDK download and one anonymous exact-version download; no platform writes',
                  'reviewedCommit':os.environ['GITHUB_SHA'],'dataset':KAGGLE_REF,'version':version,
                  'startedUTC':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime())}
          try:
              owner_dir=root/'owner-download';owner_dir.mkdir(exist_ok=True)
              # Suppress SDK output; never log credentials or signed redirect URLs.
              with contextlib.redirect_stdout(io.StringIO()),contextlib.redirect_stderr(io.StringIO()):
                  client=kaggle_client()
                  client.dataset_download_files(KAGGLE_REF+'/29',path=str(owner_dir),force=True,quiet=True)
              report['owner']=inspect_zip((owner_dir/(KAGGLE_REF.split('/')[-1]+'.zip')).read_bytes())
          except Exception as error:
              report['owner']=http_error(error)
              if isinstance(error,AssertionError):report['owner']['message']=clean_message(str(error))
          try:
              # A separate requests call supplies no Kaggle authentication headers.
              response=requests.get('https://www.kaggle.com/api/v1/datasets/download/'+KAGGLE_REF,
                                    params={'datasetVersionNumber':version},
                                    headers={'Cache-Control':'no-cache','Pragma':'no-cache','Accept-Encoding':'identity'},timeout=90)
              if response.status_code==200:report['anonymous']=inspect_zip(response.content)
              else:report['anonymous']=http_error(response=response)
          except Exception as error:
              report['anonymous']=http_error(error)
              if isinstance(error,AssertionError):report['anonymous']['message']=clean_message(str(error))
          report['completedUTC']=time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime())
          report['diagnosticCompleted']=True
          (root/'report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps({**report,'owner':{k:v for k,v in report['owner'].items() if k!='files'},
                           'anonymous':{k:v for k,v in report['anonymous'].items() if k!='files'}},ensure_ascii=False,indent=2))
          PY
      - name: Preserve sanitized read-only download evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kaggle-29-owner-public-bundle-diagnostic
          path: ${{ runner.temp }}/kaggle-bundle-diagnostic/report.json
          if-no-files-found: warn

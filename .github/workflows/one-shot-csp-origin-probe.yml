name: One-shot CSP origin and edge probe

on:
  push:
    branches: [main]
    paths:
      - .release/csp-origin-probe.trigger

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: 884d1d90bd1fb6ecca14992c6c60d677
      ZONE_ID: 5fc0f0a745ed95c6fb9f79ac7386e370
    steps:
      - name: Compare exact deployment and canonical response headers
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, urllib.request, urllib.error
          urls={
            'exact_pages':'https://12e0a79f.doctor-ghezelbaash.pages.dev/',
            'canonical':'https://www.ghezelbaash.ir/'
          }
          for name,url in urls.items():
              req=urllib.request.Request(url,headers={
                  'User-Agent':'Mozilla/5.0 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)',
                  'Cache-Control':'no-cache, no-store, max-age=0',
                  'Pragma':'no-cache'
              })
              with urllib.request.urlopen(req,timeout=30) as r:
                  body=r.read(); h={k.lower():v for k,v in r.headers.items()}
              csp=h.get('content-security-policy','')
              print('HTTP_PROBE',json.dumps({
                  'name':name,'url':url,'status':200,
                  'bodySha256':hashlib.sha256(body).hexdigest(),
                  'csp':csp,'cspSha256':hashlib.sha256(csp.encode()).hexdigest(),
                  'reprDigest':h.get('repr-digest'),
                  'cfCacheStatus':h.get('cf-cache-status'),
                  'age':h.get('age'),'etag':h.get('etag')
              },ensure_ascii=False,sort_keys=True))
          token=os.environ['CLOUDFLARE_API_TOKEN']; zone=os.environ['ZONE_ID']
          base='https://api.cloudflare.com/client/v4'
          headers={'Authorization':f'Bearer {token}','Accept':'application/json'}
          phases=['http_response_headers_transform']
          for phase in phases:
              url=f'{base}/zones/{zone}/rulesets/phases/{phase}/entrypoint'
              req=urllib.request.Request(url,headers=headers)
              try:
                  with urllib.request.urlopen(req,timeout=30) as r: payload=json.load(r)
              except urllib.error.HTTPError as e:
                  print('RULESET_PROBE_ERROR',phase,e.code,e.read().decode()[:1000]); continue
              rules=(payload.get('result') or {}).get('rules') or []
              safe=[]
              for rule in rules:
                  safe.append({
                      'id':rule.get('id'),'ref':rule.get('ref'),'enabled':rule.get('enabled'),
                      'expression':rule.get('expression'),'description':rule.get('description'),
                      'action':rule.get('action'),'action_parameters':rule.get('action_parameters')
                  })
              print('RULESET_PROBE',json.dumps({'phase':phase,'rules':safe},ensure_ascii=False,sort_keys=True))
          PY

name: PR401 JSON-LD datetime datatype fix

on:
  push:
    branches: [refactor/single-source-truth-no-dist-drift]
    paths: [.github/workflows/pr401-jsonld-datetime-fix.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: refactor/single-source-truth-no-dist-drift
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
      - name: Apply audited JSON-LD 1.1 datatype fix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          xsd_datetime = "http://www.w3.org/2001/XMLSchema#dateTime"
          graph_path = Path("src/data/semantic/knowledge-graph.jsonld")
          graph = json.loads(graph_path.read_text())
          ids = {
              "https://www.ghezelbaash.ir/#observation-clinic-google-maps-rating-current",
              "https://www.ghezelbaash.ir/#observation-clinic-google-maps-review-count-current",
          }
          changed = []
          for node in graph["@graph"]:
              if node.get("@id") in ids:
                  old = node.get("observationDate")
                  if not isinstance(old, str) or not old.endswith("Z"):
                      raise SystemExit(f"Unexpected pre-fix observationDate for {node.get('@id')}: {old!r}")
                  node["observationDate"] = {"@value": old, "@type": xsd_datetime}
                  changed.append(node["@id"])
          if set(changed) != ids:
              raise SystemExit(f"Google Maps observation set drift: {changed}")
          graph_path.write_text(json.dumps(graph, ensure_ascii=False, indent=2) + "\n")

          p = Path("src/lib/reputation-observation.mjs")
          s = p.read_text()
          s = s.replace(
              'const SOURCE = "Google Places API (New)";\n',
              'const SOURCE = "Google Places API (New)";\nconst XSD_DATETIME = "http://www.w3.org/2001/XMLSchema#dateTime";\n',
              1,
          )
          s = s.replace(
              'const exactRef = (value, label) => {',
              '''const explicitDateTime = (value) => {\n  if (\n    !value ||\n    typeof value !== "object" ||\n    Array.isArray(value) ||\n    Object.keys(value).length !== 2 ||\n    value["@type"] !== XSD_DATETIME ||\n    !isIsoSecond(value["@value"])\n  )\n    return null;\n  return value["@value"];\n};\nconst dateTimeValue = (value) =>\n  Object.freeze({ "@value": value, "@type": XSD_DATETIME });\nconst exactRef = (value, label) => {''',
              1,
          )
          s = s.replace('!isIsoSecond(node.observationDate)', '!explicitDateTime(node.observationDate)', 1)
          s = s.replace(
              '''  const rating = Number(ratingNode.value);\n  const reviewCount = Number(reviewNode.value);\n  if (\n    ratingNode.observationDate !== reviewNode.observationDate ||''',
              '''  const rating = Number(ratingNode.value);\n  const reviewCount = Number(reviewNode.value);\n  const ratingObservedAt = explicitDateTime(ratingNode.observationDate);\n  const reviewObservedAt = explicitDateTime(reviewNode.observationDate);\n  if (\n    ratingObservedAt !== reviewObservedAt ||''',
              1,
          )
          s = s.replace('valueObservedAt: ratingNode.observationDate,', 'valueObservedAt: ratingObservedAt,', 1)
          s = s.replace('ratingNode.observationDate = observedAt;', 'ratingNode.observationDate = dateTimeValue(observedAt);', 1)
          s = s.replace('reviewNode.observationDate = observedAt;', 'reviewNode.observationDate = dateTimeValue(observedAt);', 1)
          p.write_text(s)

          p = Path("scripts/validate-architecture.mjs")
          s = p.read_text()
          old = '''    ratingObservation?.measuredProperty === "https://schema.org/ratingValue" &&\n    reviewCountObservation?.measuredProperty === "https://schema.org/reviewCount" &&\n    ratingObservation?.observationDate === reviewCountObservation?.observationDate &&\n    ratingObservation?.measurementMethod === "Google Places API (New)" &&'''
          new = '''    ratingObservation?.measuredProperty === "https://schema.org/ratingValue" &&\n    reviewCountObservation?.measuredProperty === "https://schema.org/reviewCount" &&\n    ratingObservation?.observationDate?.["@type"] ===\n      "http://www.w3.org/2001/XMLSchema#dateTime" &&\n    reviewCountObservation?.observationDate?.["@type"] ===\n      "http://www.w3.org/2001/XMLSchema#dateTime" &&\n    ratingObservation?.observationDate?.["@value"] ===\n      reviewCountObservation?.observationDate?.["@value"] &&\n    ratingObservation?.measurementMethod === "Google Places API (New)" &&'''
          if old not in s:
              raise SystemExit("Architecture observationDate contract target drift")
          p.write_text(s.replace(old, new, 1))

          p = Path("scripts/test-contracts.mjs")
          s = p.read_text()
          needle = '''  assert.equal(canonical.rating, 5);\n  assert.ok(canonical.reviewCount >= 1);\n\n  const unchangedPlace = {'''
          insert = '''  assert.equal(canonical.rating, 5);\n  assert.ok(canonical.reviewCount >= 1);\n  assert.match(canonical.valueObservedAt, /T\\d{2}:\\d{2}:\\d{2}Z$/);\n  const legacyStringDate = structuredClone(graph);\n  for (const id of [\n    `${release.canonicalUrl}#observation-clinic-google-maps-rating-current`,\n    `${release.canonicalUrl}#observation-clinic-google-maps-review-count-current`,\n  ]) {\n    const node = legacyStringDate["@graph"].find((candidate) => candidate["@id"] === id);\n    node.observationDate = canonical.valueObservedAt;\n  }\n  assert.throws(\n    () => validateReputationObservation(legacyStringDate, release),\n    /observation drift/,\n  );\n\n  const unchangedPlace = {'''
          if needle not in s:
              raise SystemExit("Reputation contract insertion target drift")
          s = s.replace(needle, insert, 1)
          needle = '''  assert.equal(next.entity, release.clinic.id);\n  assert.equal(next.placeId, release.clinic.placeId);\n\n  const mapsUrl ='''
          insert = '''  assert.equal(next.entity, release.clinic.id);\n  assert.equal(next.placeId, release.clinic.placeId);\n  assert.equal(next.valueObservedAt, "2026-09-04T03:00:00Z");\n  for (const id of [\n    `${release.canonicalUrl}#observation-clinic-google-maps-rating-current`,\n    `${release.canonicalUrl}#observation-clinic-google-maps-review-count-current`,\n  ]) {\n    const node = nextGraph["@graph"].find((candidate) => candidate["@id"] === id);\n    assert.deepEqual(node.observationDate, {\n      "@value": "2026-09-04T03:00:00Z",\n      "@type": "http://www.w3.org/2001/XMLSchema#dateTime",\n    });\n  }\n\n  const mapsUrl ='''
          if needle not in s:
              raise SystemExit("Reputation refresh contract insertion target drift")
          p.write_text(s.replace(needle, insert, 1))
          PY
          node --check src/lib/reputation-observation.mjs
          node --check scripts/validate-architecture.mjs
          node --check scripts/test-contracts.mjs
          node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";
          import { loadPublicationData } from "./scripts/lib/publication-context.mjs";
          import { validateReputationObservation, applyReputationObservation } from "./src/lib/reputation-observation.mjs";
          const graph = JSON.parse(await readFile("src/data/semantic/knowledge-graph.jsonld", "utf8"));
          const release = await loadPublicationData();
          const current = validateReputationObservation(graph, release);
          if (current.valueObservedAt !== "2026-09-04T03:30:42Z") throw new Error("Canonical dateTime lexical drift");
          const next = applyReputationObservation(graph, {
            evaluation: { changed: true, rating: 4.9, reviewCount: current.reviewCount + 1 },
            release,
            observedAt: "2026-09-15T00:00:00Z",
          });
          const refreshed = validateReputationObservation(next, release);
          if (refreshed.valueObservedAt !== "2026-09-15T00:00:00Z") throw new Error("Refresh dateTime drift");
          const legacy = structuredClone(graph);
          for (const node of legacy["@graph"]) if (node["@id"]?.includes("observation-clinic-google-maps-")) node.observationDate = current.valueObservedAt;
          let rejected = false;
          try { validateReputationObservation(legacy, release); } catch { rejected = true; }
          if (!rejected) throw new Error("Legacy untyped observationDate was accepted");
          console.log("JSON-LD dateTime contract PASS");
          NODE
          git diff --check
          git status --short
      - name: Commit datatype fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/semantic/knowledge-graph.jsonld src/lib/reputation-observation.mjs scripts/validate-architecture.mjs scripts/test-contracts.mjs
          git commit -m "fix(pr401): type reputation timestamps as xsd:dateTime"
          git push origin HEAD:refactor/single-source-truth-no-dist-drift

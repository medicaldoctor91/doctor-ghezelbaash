[[Category:Men of Kermanshah]]
'''

          new["Category:Dr. Saeed Ghezelbash Aesthetic Clinic"] = '''{{en|'''Dr. Saeed Ghezelbash Aesthetic Clinic''' is an aesthetic clinic in Kermanshah, Iran, associated with [[:Category:Saeed Ghezelbash|Saeed Ghezelbash]] ([[d:Q140287622|Q140287622]]), who owns the clinic and provides physician services there. The clinic remains a distinct local entity and currently has no active Wikidata item.}}

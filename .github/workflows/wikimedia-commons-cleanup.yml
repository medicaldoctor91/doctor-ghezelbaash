name: Wikimedia Commons deleted-clinic cleanup

on:
  push:
    branches:
      - audit/wikimedia-commons-auth-2026-09-10
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      WIKIMEDIA_USERNAME: ${{ secrets.WIKIVERSITY_USERNAME }}
      WIKIMEDIA_BOT_PASSWORD: ${{ secrets.WIKIVERSITY_BOT_PASSWORD }}
    steps:
      - name: Transactionally clean active Commons wikitext
        shell: bash
        run: |
          set -euo pipefail
          test -n "${WIKIMEDIA_USERNAME:-}"
          test -n "${WIKIMEDIA_BOT_PASSWORD:-}"
          echo "::add-mask::$WIKIMEDIA_USERNAME"
          echo "::add-mask::$WIKIMEDIA_BOT_PASSWORD"
          python - <<'PY'
          import http.cookiejar, json, os, sys, urllib.parse, urllib.request

          API = "https://commons.wikimedia.org/w/api.php"
          UA = "doctor-ghezelbaash-commons-cleanup/1.0 (authorized maintenance; https://www.ghezelbaash.ir/)"
          DEAD = "Q140288589"
          jar = http.cookiejar.CookieJar()
          opener = urllib.request.build_opener(urllib.request.HTTPCookieProcessor(jar))

          def api(params, post=False):
              params = dict(params)
              params.setdefault("format", "json")
              params.setdefault("formatversion", "2")
              params.setdefault("maxlag", "5")
              data = urllib.parse.urlencode(params).encode("utf-8")
              if post:
                  req = urllib.request.Request(API, data=data, headers={"User-Agent": UA}, method="POST")
              else:
                  req = urllib.request.Request(API + "?" + data.decode("utf-8"), headers={"User-Agent": UA})
              with opener.open(req, timeout=45) as r:
                  out = json.load(r)
              if "error" in out:
                  raise RuntimeError(json.dumps(out["error"], ensure_ascii=False))
              return out

          login_token = api({"action":"query","meta":"tokens","type":"login"})["query"]["tokens"]["logintoken"]
          login = api({"action":"login","lgname":os.environ["WIKIMEDIA_USERNAME"],"lgpassword":os.environ["WIKIMEDIA_BOT_PASSWORD"],"lgtoken":login_token}, True)
          if login.get("login",{}).get("result") != "Success":
              raise SystemExit("COMMONS_AUTH_FAIL")
          info = api({"action":"query","meta":"userinfo","uiprop":"rights|blockinfo"})["query"]["userinfo"]
          if info.get("id",0) == 0 or "anon" in info or info.get("blockid") or info.get("blockedby") or "edit" not in set(info.get("rights",[])):
              raise SystemExit("COMMONS_EDIT_AUTH_FAIL")
          csrf = api({"action":"query","meta":"tokens","type":"csrf"})["query"]["tokens"]["csrftoken"]
          if not csrf or csrf == "+\\":
              raise SystemExit("COMMONS_CSRF_FAIL")

          titles = {
            "Category:Saeed Ghezelbash": 1262478261,
            "Category:Dr. Saeed Ghezelbash Aesthetic Clinic": 1265539847,
            "File:Saeed-Ghezelbaash-with-clinical-team.jpg": 1274558155,
            "File:دکتر سعید قزلباش درباره جالپرو و پروفایلو.webm": 1274558217,
          }
          pages = api({"action":"query","prop":"revisions","titles":"|".join(titles),"rvprop":"ids|timestamp|content","rvslots":"main"})["query"]["pages"]
          before = {}
          for p in pages:
              revs = p.get("revisions",[])
              if not revs:
                  raise SystemExit(f"COMMONS_PREFLIGHT_FAIL missing revision: {p.get('title')}")
              rev = revs[0]
              text = rev.get("slots",{}).get("main",{}).get("content","")
              before[p["title"]] = {"revid": rev["revid"], "text": text}
          if set(before) != set(titles):
              raise SystemExit("COMMONS_PREFLIGHT_FAIL title mismatch")
          for title, expected in titles.items():
              if before[title]["revid"] != expected:
                  raise SystemExit(f"COMMONS_PREFLIGHT_FAIL revision drift {title}: {before[title]['revid']} != {expected}")

          expected_counts = {
            "Category:Saeed Ghezelbash": 6,
            "Category:Dr. Saeed Ghezelbash Aesthetic Clinic": 0,
            "File:Saeed-Ghezelbaash-with-clinical-team.jpg": 6,
            "File:دکتر سعید قزلباش درباره جالپرو و پروفایلو.webm": 3,
          }
          for title, count in expected_counts.items():
              actual = before[title]["text"].count(DEAD)
              if actual != count:
                  raise SystemExit(f"COMMONS_PREFLIGHT_FAIL unexpected dead-QID count {title}: {actual} != {count}")

          # Prove current SDC is already clean before touching wikitext.
          media_ids = ["M196320105","M196320110","M196320111","M197490366"]
          entities = api({"action":"wbgetentities","ids":"|".join(media_ids),"props":"claims|labels|descriptions|info"})["entities"]
          for mid in media_ids:
              raw = json.dumps(entities.get(mid,{}), ensure_ascii=False)
              if DEAD in raw:
                  raise SystemExit(f"COMMONS_PREFLIGHT_FAIL dead QID still present in SDC {mid}")

          new = {}
          new["Category:Saeed Ghezelbash"] = '''<!-- saeed-ghezelbash-identity-profile:start -->
{{Wikidata Infobox|defaultsort=no}}
{{fa|'''دکتر سعید قزلباش''' ('''سعید قزلباش'''؛ '''محمدسعید قزلباش''')، پزشک و پژوهشگر پزشکی ایرانی فعال در حوزهٔ پزشکی زیبایی در کرمانشاه است. این رده مستقیماً به [[d:Q140287622|Saeed Ghezelbash (Q140287622)]] متصل است؛ شناسهٔ Google Knowledge Graph شخص: <code>/g/11nqdfk76c</code>. کلینیک مرتبط: [[:Category:Dr. Saeed Ghezelbash Aesthetic Clinic|کلینیک زیبایی دکتر سعید قزلباش]] با Google local Knowledge Graph ID <code>/g/11r3rzdtb3</code>.}}
{{en|'''Saeed Ghezelbash''' (also known as '''Mohammad Saeed Ghezelbash'''; Persian: '''دکتر سعید قزلباش''', '''سعید قزلباش''', '''محمدسعید قزلباش''') is an Iranian physician and medical researcher working in aesthetic medicine in Kermanshah. This category is directly connected to [[d:Q140287622|Q140287622]]; Google Knowledge Graph ID: <code>/g/11nqdfk76c</code>. Related clinic: [[:Category:Dr. Saeed Ghezelbash Aesthetic Clinic|Dr. Saeed Ghezelbash Aesthetic Clinic]], Google local Knowledge Graph ID <code>/g/11r3rzdtb3</code>.}}
{{fa|در ویکی‌داده، [[d:Q140287622|شخص]] مالکیت، محل کار و وابستگی حرفه‌ای خود به کلینیک را بدون استفاده از آیتم حذف‌شدهٔ کلینیک ثبت می‌کند؛ شخص و کلینیک همچنان دو انتیتی متمایز اما مرتبط‌اند.}}
{{en|On Wikidata, [[d:Q140287622|the person]] records ownership, work-location and professional-affiliation relationships to the clinic without relying on the deleted clinic item; the physician and clinic remain distinct but related entities.}}
<!-- saeed-ghezelbash-identity-profile:end -->

{{Sister-inline|project=wikisource|links=[[s:Author:Mohammad Saeed Ghezelbash|Mohammad Saeed Ghezelbash author record]]}}

{{DEFAULTSORT:Ghezelbash, Saeed}}


'''

          new["File:Saeed-Ghezelbaash-with-clinical-team.jpg"] = '''=={{int:filedesc}}==
{{Information
| description = {{en|1=Dr. Saeed Ghezelbash, an Iranian physician in aesthetic medicine, wearing medical scrubs and a stethoscope with other people at Dr. Saeed Ghezelbash Aesthetic Clinic in Kermanshah, Iran. This description does not identify the other people as employees or clinical staff of the clinic.}}

'''

          for title, text in new.items():
              if DEAD in text:
                  raise SystemExit(f"INTERNAL_FAIL replacement still contains dead QID: {title}")

          changed = []
          result = {"before": {k:v["revid"] for k,v in before.items()}, "edits": {}, "rollback": []}
          try:
              for title in titles:
                  if new[title] == before[title]["text"]:
                      result["edits"][title] = {"status":"noop","revid":before[title]["revid"]}
                      continue
                  out = api({
                      "action":"edit",
                      "title":title,
                      "text":new[title],
                      "token":csrf,
                      "baserevid":str(before[title]["revid"]),
                      "summary":"Remove deleted clinic Wikidata QID while preserving clinic identity and physician relationship",
                      "assert":"user",
                  }, True)
                  edit = out.get("edit",{})
                  if edit.get("result") != "Success" or not edit.get("newrevid"):
                      raise RuntimeError(f"edit failed {title}: {json.dumps(out,ensure_ascii=False)}")
                  changed.append((title, edit["newrevid"]))
                  result["edits"][title] = {"status":"success","oldrevid":edit.get("oldrevid"),"newrevid":edit["newrevid"]}
                  print(f"COMMONS_EDIT_PASS title={title} newrevid={edit['newrevid']}")
          except Exception as exc:
              print(f"COMMONS_TRANSACTION_FAIL {exc}", file=sys.stderr)
              rollback_errors = []
              for title, current_revid in reversed(changed):
                  try:
                      out = api({
                          "action":"edit",
                          "title":title,
                          "text":before[title]["text"],
                          "token":csrf,
                          "baserevid":str(current_revid),
                          "summary":"Rollback failed deleted-clinic cleanup transaction",
                          "assert":"user",
                      }, True)
                      ed = out.get("edit",{})
                      if ed.get("result") != "Success": raise RuntimeError(str(out))
                      result["rollback"].append({"title":title,"status":"success","newrevid":ed.get("newrevid")})
                  except Exception as rex:
                      rollback_errors.append(f"{title}: {rex}")
              with open("/tmp/commons-cleanup-result.json","w",encoding="utf-8") as f:
                  json.dump(result,f,ensure_ascii=False,indent=2)
              if rollback_errors:
                  raise SystemExit("ROLLBACK_FAILURE " + " | ".join(rollback_errors))
              raise SystemExit("COMMONS_TRANSACTION_ROLLED_BACK")

          # Purge caches, then verify source and rendered output no longer expose the dead QID.
          purge_titles = list(titles) + ["Creator:Saeed Ghezelbash"]
          api({"action":"purge","titles":"|".join(purge_titles)}, True)

          verify_pages = api({"action":"query","prop":"revisions","titles":"|".join(titles),"rvprop":"ids|content","rvslots":"main"})["query"]["pages"]
          for p in verify_pages:
              rev = p.get("revisions",[{}])[0]
              text = rev.get("slots",{}).get("main",{}).get("content","")
              if DEAD in text:
                  raise SystemExit(f"VERIFY_FAIL dead QID remains in wikitext {p.get('title')}")
              print(f"WIKITEXT_CLEAN_PASS title={p.get('title')} revid={rev.get('revid')}")

          for title in titles:
              parsed = api({"action":"parse","page":title,"prop":"text"})["parse"]["text"]
              if DEAD in parsed:
                  raise SystemExit(f"VERIFY_FAIL rendered dead QID remains: {title}")
              print(f"RENDER_CLEAN_PASS title={title}")

          entities2 = api({"action":"wbgetentities","ids":"|".join(media_ids),"props":"claims|labels|descriptions|info"})["entities"]
          for mid in media_ids:
              if DEAD in json.dumps(entities2.get(mid,{}),ensure_ascii=False):
                  raise SystemExit(f"VERIFY_FAIL dead QID returned to SDC {mid}")
              print(f"SDC_CLEAN_PASS entity={mid}")

          result["verified"] = True
          with open("/tmp/commons-cleanup-result.json","w",encoding="utf-8") as f:
              json.dump(result,f,ensure_ascii=False,indent=2)
          print("COMMONS_CLEANUP_TRANSACTION_PASS")
          PY
      - name: Upload cleanup transaction result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: commons-cleanup-result-${{ github.sha }}
          path: /tmp/commons-cleanup-result.json
          if-no-files-found: warn
          retention-days: 7

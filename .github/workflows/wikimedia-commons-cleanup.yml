name: Wikimedia Commons deleted-clinic cleanup

on:
  push:
    branches:
      - audit/wikimedia-commons-auth-2026-09-10
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      WIKIMEDIA_USERNAME: ${{ secrets.WIKIVERSITY_USERNAME }}
      WIKIMEDIA_BOT_PASSWORD: ${{ secrets.WIKIVERSITY_BOT_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Execute transactional Commons cleanup
        shell: bash
        run: |
          set -euo pipefail
          test -n "${WIKIMEDIA_USERNAME:-}"
          test -n "${WIKIMEDIA_BOT_PASSWORD:-}"
          echo "::add-mask::$WIKIMEDIA_USERNAME"
          echo "::add-mask::$WIKIMEDIA_BOT_PASSWORD"
          python .github/scripts/wikimedia_commons_cleanup.py
      - name: Upload cleanup transaction result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: commons-cleanup-result-${{ github.sha }}
          path: /tmp/commons-cleanup-result.json
          if-no-files-found: warn
          retention-days: 7

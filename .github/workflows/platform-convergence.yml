name: Prepare hardened external platform convergence
on:
  workflow_dispatch:
    inputs:
      website_commit:
        description: Exact reviewed live website source commit
        required: true
        type: string
      hf_revision:
        description: Exact reviewed Hugging Face main revision
        required: true
        type: string
      kaggle_version:
        description: Exact reviewed current Kaggle version
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: doctor-ghezelbaash-platform-convergence
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPECTED_WEBSITE_COMMIT: ${{ inputs.website_commit }}
      EXPECTED_HF_REVISION: ${{ inputs.hf_revision }}
      EXPECTED_KAGGLE_VERSION: ${{ inputs.kaggle_version }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version-file: .nvmrc, cache: npm}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install build and platform validation dependencies
        run: |
          npm ci
          python -m pip install --disable-pip-version-check 'huggingface_hub>=0.34,<1' 'pyarrow>=18,<23' 'kaggle>=2.2,<3' 'rdflib>=7,<8' 'pyshacl>=0.30,<1' 'mlcroissant==1.1.1'
      - name: Validate source and prepare immutable-origin platform packages
        run: |
          node --test tests/*.test.mjs
          npm run build
          python tests/validate_platform_bundle.py dist --no-query --rdf
          python -m py_compile .github/scripts/platform_bundle.py .github/scripts/sync_platform_machine_resources.py .github/scripts/platform_convergence_hardened.py
          python .github/scripts/platform_convergence_hardened.py --prepare-only
      - name: Save staged validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: platform-convergence-preflight
          path: |
            /tmp/platform-convergence-hardened/context.json
            /tmp/platform-convergence-hardened/hf-validation.json
            /tmp/platform-convergence-hardened/kaggle-preview-validation.json
            /tmp/platform-convergence-hardened/website-file-sources.json
          if-no-files-found: warn

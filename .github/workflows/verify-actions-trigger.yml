name: Verify actions trigger

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-actions-trigger.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Record successful trigger
        run: |
          mkdir -p tmp
          printf 'triggered_at=%s\nsource_sha=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$GITHUB_SHA" > tmp/actions-trigger.txt
      - name: Commit proof and remove one-shot workflow
        run: |
          git config user.name 'OpenAI Project Automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/verify-actions-trigger.yml
          git add tmp/actions-trigger.txt
          git commit -m 'Verify GitHub Actions trigger path'
          git push origin HEAD:main

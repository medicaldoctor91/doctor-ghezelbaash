name: Verify scar ontology for Batch 2
on:
  push:
    branches: [audit/wikidata-batch1-20261016]
    paths: [.github/workflows/wikidata-batch2-scar-verify.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Trace Q206060 ontology and search alternatives
        shell: bash
        run: |
          python - <<'PY'
          import json, urllib.parse, urllib.request, collections
          API='https://www.wikidata.org/w/api.php'; UA='Q140287622-batch2-scar-verifier/1.0'
          def api(p):
              p={'format':'json','formatversion':'2',**p};u=API+'?'+urllib.parse.urlencode(p)
              with urllib.request.urlopen(urllib.request.Request(u,headers={'User-Agent':UA}),timeout=60) as r:return json.load(r)
          def val(s):
              v=s.get('datavalue',{}).get('value');return v.get('id') if isinstance(v,dict) and 'id' in v else v
          root='Q206060'; health='Q2057971'
          seen=set(); frontier=[root]; edges=[]; depth=0
          while frontier and depth<8:
              nxt=[]
              for i in range(0,len(frontier),50):
                  ids=frontier[i:i+50]
                  es=api({'action':'wbgetentities','ids':'|'.join(ids),'props':'claims|labels|descriptions','languages':'en'})['entities']
                  for q,e in es.items():
                      seen.add(q)
                      for p in ('P31','P279'):
                          for c in e.get('claims',{}).get(p,[]):
                              v=val(c.get('mainsnak',{}))
                              if isinstance(v,str) and v.startswith('Q'):
                                  edges.append((q,p,v))
                                  if v not in seen:nxt.append(v)
              frontier=sorted(set(nxt));depth+=1
          searches={}
          for term in ['acne scar','atrophic acne scar','scar','acne scarring']:
              searches[term]=api({'action':'wbsearchentities','search':term,'language':'en','type':'item','limit':'20'}).get('search',[])
          out={'root':root,'health_problem':health,'reaches_health_problem':health in seen,'visited':sorted(seen),'edges':edges,'searches':searches}
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY

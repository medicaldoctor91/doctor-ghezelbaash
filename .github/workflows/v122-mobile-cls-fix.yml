name: Fix v1.2.2 mobile CLS root cause

on:
  push:
    branches: [main]
    paths: [.release/v122-mobile-cls-fix-request.json]

permissions:
  contents: write

concurrency:
  group: doctor-ghezelbaash-external-mutation
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: release/v1.2.2-candidate
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - name: Criticalize final hero geometry and restore fixed-footprint reputation wording
        shell: bash
        run: |
          set -euo pipefail
          git config user.name ghezelbaash-mobile-cls-fix
          git config user.email actions@users.noreply.github.com
          python - <<'PY'
          from pathlib import Path
          p=Path('src/styles/global.css'); s=p.read_text()
          marker='/*DIST_CRITICAL_CSS_END*/'
          if s.count(marker)!=1: raise SystemExit('critical CSS marker count drift')
          block='''/*DIST_CRITICAL_HERO_GEOMETRY_START*/.hero-search-launch{grid-area:search;display:grid;grid-template-columns:1.2rem minmax(0,1fr) auto;gap:.65rem;align-items:center;width:100%;min-height:3rem;margin:.15rem 0 .55rem;padding:.68rem .85rem;border:1px solid #bdd9cf;border-radius:.78rem;background:linear-gradient(135deg,#fff,#f6faf8);color:var(--accent-strong);font:inherit;font-weight:780;line-height:1.35;text-align:start;box-shadow:0 7px 22px rgb(7 82 68/.055);cursor:pointer;-webkit-tap-highlight-color:transparent}.hero-search-launch svg{width:1.15rem;height:1.15rem;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.hero-search-launch kbd{min-width:1.7rem;padding:.12rem .38rem;border:1px solid #d6e3de;border-bottom-width:2px;border-radius:.4rem;background:#fff;color:var(--muted);font:600 .72rem/1.35 ui-monospace,SFMono-Regular,Menlo,monospace;text-align:center}.hero-figure-caption,.clinical-figure-caption{display:grid;gap:.4rem}.hero-caption-title,.figure-caption-title{color:#52665f;font-weight:650}.hero-caption-facts{display:flex;flex-wrap:wrap;gap:.2rem .65rem;color:var(--muted);font-size:.82rem;line-height:1.6}.hero-caption-facts>span:not(:last-child)::after{content:" · ";color:#93a19c}.hero-caption-facts strong{color:#36584e;font-weight:760}.hero-caption-reputation{padding-top:.32rem;border-top:1px solid rgb(10 107 88/.11);color:#315b50;font-size:.82rem;line-height:1.6}.hero-caption-reputation strong{color:#1f5145}@media(max-width:720px){.hero-search-launch{min-height:3.1rem;margin:.05rem 0 .2rem}.hero-search-launch kbd{display:none}.hero-caption-facts{display:grid;gap:.08rem;font-size:.8rem}.hero-caption-facts>span:not(:last-child)::after{content:""}.hero-caption-reputation{font-size:.8rem}}@media(max-width:430px){.hero-search-launch{grid-template-columns:1.15rem minmax(0,1fr);padding-inline:.75rem}.hero-caption-facts,.hero-caption-reputation{font-size:.78rem}}/*DIST_CRITICAL_HERO_GEOMETRY_END*/'''
          if block not in s:
              s=s.replace(marker,block+marker)
          if s.count('/*DIST_CRITICAL_HERO_GEOMETRY_START*/')!=1: raise SystemExit('critical hero geometry duplicate')
          p.write_text(s)

          a=Path('scripts/lib/assemble-content.mjs'); x=a.read_text()
          old=' · آخرین دریافت از Google: ${persianGregorianDate(observedAt)} — '
          new=' · دریافت ${persianGregorianDate(observedAt)} — '
          if old in x: x=x.replace(old,new,1)
          elif new not in x: raise SystemExit('live reputation wording template drift')
          a.write_text(x)

          intro=Path('src/content-source/001-intro.html'); y=intro.read_text()
          y=y.replace(' · آخرین دریافت از Google: ۷ اوت ۲۰۲۶ — ',' · دریافت ۷ اوت ۲۰۲۶ — ',1)
          intro.write_text(y)
          PY
          cat > scripts/validate-critical-hero-geometry.mjs <<'NODE'
          import {readFile} from 'node:fs/promises';
          const css=await readFile('src/styles/global.css','utf8'),marker='/*DIST_CRITICAL_CSS_END*/',i=css.indexOf(marker);if(i<0||css.indexOf(marker,i+1)>=0)throw new Error('Critical CSS marker drift');const critical=css.slice(0,i),source=await readFile('scripts/lib/assemble-content.mjs','utf8');
          const must=(s,m)=>{if(!critical.includes(s))throw new Error(m)};
          must('/*DIST_CRITICAL_HERO_GEOMETRY_START*/','Critical hero geometry block missing');
          must('.hero-search-launch{grid-area:search;display:grid','Search launch final geometry is deferred');
          must('.hero-figure-caption,.clinical-figure-caption{display:grid;gap:.4rem}','Hero caption grid geometry is deferred');
          must('.hero-caption-facts{display:flex;flex-wrap:wrap','Hero caption facts geometry is deferred');
          must('.hero-caption-reputation{padding-top:.32rem','Hero reputation geometry is deferred');
          must('@media(max-width:720px){.hero-search-launch{min-height:3.1rem','Mobile hero search geometry is deferred');
          must('.hero-caption-facts{display:grid;gap:.08rem;font-size:.8rem}','Mobile hero caption geometry is deferred');
          must('@media(max-width:430px){.hero-search-launch{grid-template-columns:1.15rem minmax(0,1fr)','Narrow mobile hero geometry is deferred');
          if(source.includes('آخرین دریافت از Google:'))throw new Error('Reputation wording exceeds frozen mobile geometry footprint');
          if(!source.includes(' · دریافت ${persianGregorianDate(observedAt)} — '))throw new Error('Compact reputation observation wording missing');
          console.log(JSON.stringify({criticalHeroGeometry:'PASS',mobileBreakpoints:[720,430],reputationFootprint:'compact',finalComputedStyleChange:false}));
          NODE
          node scripts/validate-critical-hero-geometry.mjs
      - name: Wire geometry regression guard into source validation
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs'),p='package.json',x=JSON.parse(fs.readFileSync(p));const old='node scripts/validate-source.mjs && node scripts/validate-subdomain-redirects.mjs';const next='node scripts/validate-source.mjs && node scripts/validate-critical-hero-geometry.mjs && node scripts/validate-subdomain-redirects.mjs';if(x.scripts['validate:source'].includes('validate-critical-hero-geometry.mjs')){}else if(x.scripts['validate:source'].includes(old))x.scripts['validate:source']=x.scripts['validate:source'].replace(old,next);else throw Error('validate:source command drift');fs.writeFileSync(p,JSON.stringify(x,null,2)+'\n');
          NODE
          npm run validate:source
      - name: Build exact candidate and prove visible freeze plus semantic contracts
        shell: bash
        run: |
          set -euo pipefail
          export SOURCE_COMMIT="$(git rev-parse HEAD)" CF_PAGES_COMMIT_SHA="$(git rev-parse HEAD)" SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          npm run release:prepare
          npm run build
          node scripts/validate-visible-freeze.mjs dist/index.html
          node - <<'NODE'
          const fs=require('fs'),h=fs.readFileSync('dist/index.html','utf8');const m=h.match(/<div class="hero-caption-reputation" id="google-maps-clinic-reputation-current">([\s\S]*?)<\/div>/);if(!m)throw Error('reputation slot missing');const t=m[1].replace(/<[^>]+>/g,'').replace(/\s+/g,' ').trim();if(t.includes('آخرین دریافت از Google'))throw Error('long reputation wording survived build');if(!t.includes('دریافت ۷ اوت ۲۰۲۶'))throw Error('compact observation wording missing');console.log('COMPACT_REPUTATION_VISIBLE_PASS chars='+[...t].length+' text='+t)
          NODE
      - name: Commit only the root-cause fix and its permanent guard
        shell: bash
        run: |
          set -euo pipefail
          git add src/styles/global.css scripts/lib/assemble-content.mjs src/content-source/001-intro.html scripts/validate-critical-hero-geometry.mjs package.json
          git diff --cached --check
          git commit -m 'Eliminate mobile hero CLS by criticalizing final geometry'
          git push origin HEAD:release/v1.2.2-candidate
          echo "CLS_FIXED_CANDIDATE=$(git rev-parse HEAD)"

name: Inspect repository secret names

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-secret-names.yml'
  pull_request:
    branches: [main]
    paths:
      - '.probe-cloudflare-secret'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      SECRET_BAG_JSON: ${{ toJSON(secrets) }}
    steps:
      - name: Report secret names only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os

          raw = os.environ.get('SECRET_BAG_JSON', '{}')
          try:
              bag = json.loads(raw)
          except json.JSONDecodeError:
              raise SystemExit('Could not parse GitHub secrets context')

          names = sorted(
              name for name, value in bag.items()
              if name != 'GITHUB_TOKEN' and isinstance(value, str) and value
          )

          print('REPOSITORY_SECRET_NAME_COUNT=' + str(len(names)))
          for name in names:
              print('REPOSITORY_SECRET_NAME=' + name)
          PY

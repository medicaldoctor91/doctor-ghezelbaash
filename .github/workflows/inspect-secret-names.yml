name: Probe existing Cloudflare access

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-secret-names.yml'

permissions:
  contents: read
  issues: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SECRET_BAG_JSON: ${{ toJSON(secrets) }}
      VAR_BAG_JSON: ${{ toJSON(vars) }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Probe secret values without printing them
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import json
          import os
          import re
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          BASE = 'https://api.cloudflare.com/client/v4'
          PROJECT = 'doctor-ghezelbaash'
          ZONE_NAME = 'ghezelbaash.ir'
          HEX32 = re.compile(r'^[0-9a-fA-F]{32}$')

          secrets = json.loads(os.environ.get('SECRET_BAG_JSON') or '{}')
          variables = json.loads(os.environ.get('VAR_BAG_JSON') or '{}')

          def request(token, path, method='GET'):
              req = urllib.request.Request(
                  BASE + path,
                  method=method,
                  headers={
                      'Authorization': 'Bearer ' + token,
                      'Accept': 'application/json',
                      'User-Agent': 'doctor-ghezelbaash-secret-probe/1.0',
                  },
              )
              try:
                  with urllib.request.urlopen(req, timeout=20) as response:
                      raw = response.read().decode('utf-8', 'replace')
                      try:
                          payload = json.loads(raw) if raw else {}
                      except json.JSONDecodeError:
                          payload = {}
                      return response.status, payload
              except urllib.error.HTTPError as error:
                  raw = error.read().decode('utf-8', 'replace')
                  try:
                      payload = json.loads(raw) if raw else {}
                  except json.JSONDecodeError:
                      payload = {}
                  return error.code, payload
              except Exception:
                  return 0, {}

          def recursively_collect_account_ids(value, output):
              if isinstance(value, str) and HEX32.fullmatch(value):
                  output.add(value.lower())
              elif isinstance(value, dict):
                  for k, v in value.items():
                      if str(k).lower() in {'id', 'account_id', 'accountid'} and isinstance(v, str) and HEX32.fullmatch(v):
                          output.add(v.lower())
                      recursively_collect_account_ids(v, output)
              elif isinstance(value, list):
                  for item in value:
                      recursively_collect_account_ids(item, output)

          account_ids = set()
          for name, value in {**variables, **secrets}.items():
              if isinstance(value, str) and HEX32.fullmatch(value) and ('ACCOUNT' in name.upper() or 'CLOUDFLARE' in name.upper() or 'CF_' in name.upper()):
                  account_ids.add(value.lower())

          # Some newer account-owned tokens may be JWT-shaped. If so, inspect only
          # the payload in memory for account IDs; nothing from the payload is logged.
          for value in secrets.values():
              if not isinstance(value, str) or value.count('.') != 2:
                  continue
              try:
                  middle = value.split('.')[1]
                  middle += '=' * (-len(middle) % 4)
                  payload = json.loads(base64.urlsafe_b64decode(middle).decode('utf-8'))
                  recursively_collect_account_ids(payload, account_ids)
              except Exception:
                  pass

          secret_names = sorted(name for name, value in secrets.items() if name != 'GITHUB_TOKEN' and isinstance(value, str) and value)
          ordered_names = sorted(secret_names, key=lambda n: (0 if ('CLOUDFLARE' in n.upper() or n.upper().startswith('CF_')) else 1, n))

          token_status = []
          project_matches = []
          candidate_ids_by_secret = {}

          for name in ordered_names:
              token = secrets[name]
              discovered = set(account_ids)
              verified = False

              status, payload = request(token, '/user/tokens/verify')
              if status == 200 and payload.get('success'):
                  verified = True

              status, payload = request(token, '/accounts?per_page=50')
              if status == 200 and payload.get('success'):
                  verified = True
                  for account in payload.get('result') or []:
                      aid = account.get('id') if isinstance(account, dict) else None
                      if isinstance(aid, str) and HEX32.fullmatch(aid):
                          discovered.add(aid.lower())

              status, payload = request(token, '/zones?' + urllib.parse.urlencode({'name': ZONE_NAME, 'per_page': 50}))
              if status == 200 and payload.get('success'):
                  verified = True
                  for zone in payload.get('result') or []:
                      if isinstance(zone, dict):
                          account = zone.get('account') or {}
                          aid = account.get('id') if isinstance(account, dict) else None
                          if isinstance(aid, str) and HEX32.fullmatch(aid):
                              discovered.add(aid.lower())

              status, payload = request(token, '/memberships?per_page=50')
              if status == 200 and payload.get('success'):
                  verified = True
                  recursively_collect_account_ids(payload.get('result') or [], discovered)

              candidate_ids_by_secret[name] = sorted(discovered)
              token_status.append({'secret_name': name, 'cloudflare_bearer_verified': verified, 'account_candidates': len(discovered)})

              for aid in sorted(discovered):
                  status, payload = request(token, f'/accounts/{aid}/pages/projects/{PROJECT}')
                  if status == 200 and payload.get('success'):
                      project_matches.append({
                          'secret_name': name,
                          'account_id_masked': aid[:6] + '…' + aid[-6:],
                          'project_name': PROJECT,
                          'pages_access': True,
                      })

          report = {
              'repository_secret_names': secret_names,
              'token_probe': token_status,
              'project_matches': project_matches,
              'project_match_count': len(project_matches),
          }
          with open('/tmp/cloudflare-probe.json', 'w', encoding='utf-8') as f:
              json.dump(report, f, ensure_ascii=False, indent=2)
          PY

      - name: Post probe result to temporary PR
        shell: bash
        run: |
          set -euo pipefail
          BODY_FILE=/tmp/cloudflare-probe-comment.md
          {
            echo 'Cloudflare access probe result (secret **values were never printed**):'
            echo
            echo '```json'
            cat /tmp/cloudflare-probe.json
            echo '```'
          } > "$BODY_FILE"
          gh api "repos/${GITHUB_REPOSITORY}/issues/161/comments" -f body="$(cat "$BODY_FILE")" >/dev/null

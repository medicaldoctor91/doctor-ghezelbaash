name: Probe existing Cloudflare access

on:
  pull_request_target:
    types: [opened, synchronize]

permissions:
  contents: read
  issues: write

jobs:
  probe:
    if: github.event.pull_request.number == 161 && github.event.pull_request.head.ref == 'probe-cloudflare-secret-20260809'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SECRET_BAG_JSON: ${{ toJSON(secrets) }}
      VAR_BAG_JSON: ${{ toJSON(vars) }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Probe secret values without printing them
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import json
          import os
          import re
          import urllib.error
          import urllib.parse
          import urllib.request

          BASE = 'https://api.cloudflare.com/client/v4'
          PROJECT = 'doctor-ghezelbaash'
          ZONE_NAME = 'ghezelbaash.ir'
          KNOWN_ACCOUNT_ID = '884d1d90bd1fb6ecca14992c6c60d677'
          HEX32 = re.compile(r'^[0-9a-fA-F]{32}$')

          secrets = json.loads(os.environ.get('SECRET_BAG_JSON') or '{}')
          variables = json.loads(os.environ.get('VAR_BAG_JSON') or '{}')

          def request(token, path, method='GET'):
              req = urllib.request.Request(
                  BASE + path,
                  method=method,
                  headers={
                      'Authorization': 'Bearer ' + token,
                      'Accept': 'application/json',
                      'User-Agent': 'doctor-ghezelbaash-secret-probe/1.0',
                  },
              )
              try:
                  with urllib.request.urlopen(req, timeout=20) as response:
                      raw = response.read().decode('utf-8', 'replace')
                      try:
                          payload = json.loads(raw) if raw else {}
                      except json.JSONDecodeError:
                          payload = {}
                      return response.status, payload
              except urllib.error.HTTPError as error:
                  raw = error.read().decode('utf-8', 'replace')
                  try:
                      payload = json.loads(raw) if raw else {}
                  except json.JSONDecodeError:
                      payload = {}
                  return error.code, payload
              except Exception:
                  return 0, {}

          secret_names = sorted(
              name for name, value in secrets.items()
              if name != 'GITHUB_TOKEN' and isinstance(value, str) and value
          )
          ordered_names = sorted(
              secret_names,
              key=lambda n: (0 if ('CLOUDFLARE' in n.upper() or n.upper().startswith('CF_')) else 1, n),
          )

          token_probe = []
          project_matches = []

          for name in ordered_names:
              token = secrets[name]
              verified = False
              status, payload = request(token, '/user/tokens/verify')
              if status == 200 and payload.get('success'):
                  verified = True

              project_status, project_payload = request(
                  token,
                  f'/accounts/{KNOWN_ACCOUNT_ID}/pages/projects/{PROJECT}',
              )
              pages_access = project_status == 200 and project_payload.get('success') is True

              token_probe.append({
                  'secret_name': name,
                  'cloudflare_bearer_verified': verified,
                  'pages_project_http_status': project_status,
                  'pages_access': pages_access,
              })

              if pages_access:
                  project_matches.append({
                      'secret_name': name,
                      'account_id_masked': KNOWN_ACCOUNT_ID[:6] + '…' + KNOWN_ACCOUNT_ID[-6:],
                      'project_name': PROJECT,
                      'pages_access': True,
                  })

          report = {
              'repository_secret_names': secret_names,
              'token_probe': token_probe,
              'project_matches': project_matches,
              'project_match_count': len(project_matches),
          }
          with open('/tmp/cloudflare-probe.json', 'w', encoding='utf-8') as f:
              json.dump(report, f, ensure_ascii=False, indent=2)
          PY

      - name: Post probe result to this PR
        shell: bash
        run: |
          set -euo pipefail
          {
            echo 'Cloudflare access probe result (secret **values were never printed**):'
            echo
            echo '```json'
            cat /tmp/cloudflare-probe.json
            echo '```'
          } > /tmp/cloudflare-probe-comment.md
          gh api "repos/${GITHUB_REPOSITORY}/issues/161/comments" -f body="$(cat /tmp/cloudflare-probe-comment.md)" >/dev/null

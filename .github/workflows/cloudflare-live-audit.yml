name: Temporary Cloudflare live audit
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cloudflare-live-audit.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      CLOUDFLARE_ACCOUNT_ID: 884d1d90bd1fb6ecca14992c6c60d677
      CF_PROJECT: doctor-ghezelbaash
      ZONE_NAME: ghezelbaash.ir
      CANONICAL_HOST: www.ghezelbaash.ir
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Read Cloudflare control plane through ephemeral scopes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import importlib.util, json, os, urllib.parse
          spec=importlib.util.spec_from_file_location('cfedge','scripts/configure-cloudflare-edge.py')
          m=importlib.util.module_from_spec(spec); spec.loader.exec_module(m)
          account=os.environ['CLOUDFLARE_ACCOUNT_ID']; zone_name=os.environ['ZONE_NAME']; canonical=os.environ['CANONICAL_HOST']
          parent=m.CloudflareApi(os.environ['CLOUDFLARE_API_TOKEN'])
          q=urllib.parse.urlencode({'name':zone_name,'account.id':account,'per_page':50})
          zones=parent.expect('GET','/zones?'+q).get('result') or []
          exact=[z for z in zones if z.get('name')==zone_name]
          if len(exact)!=1: raise SystemExit(f'ZONE_COUNT_DRIFT {len(exact)}')
          z=exact[0]; zid=str(z['id'])
          zs={k:z.get(k) for k in ['name','status','paused','type','development_mode','name_servers','original_name_servers']}; zs['plan']=(z.get('plan') or {}).get('name')
          print('CF_ZONE',json.dumps(zs,ensure_ascii=False,sort_keys=True))
          m.read_pages_contract(parent,account,canonical)
          zone_api,revoke_zone=m.issue_ephemeral_zone_api(parent,account,zid,include_control_plane=True)
          single_api,revoke_single=m.issue_ephemeral_single_redirect_api(parent,account,zid)
          try:
              m.read_dns_contract(zone_api,zid,zone_name,canonical)
              settings=zone_api.expect('GET',f'/zones/{zid}/settings').get('result') or []
              keep={'always_use_https','http2','http3','brotli','ipv6','tls_1_3','0rtt','early_hints','development_mode','rocket_loader','email_obfuscation','automatic_https_rewrites','hotlink_protection','mirage','polish','security_header'}
              ss={r.get('id'):r.get('value') for r in settings if r.get('id') in keep}
              print('CF_ZONE_SETTINGS',json.dumps(ss,ensure_ascii=False,sort_keys=True))
              rs=single_api.expect('GET',f'/zones/{zid}/rulesets/phases/http_request_dynamic_redirect/entrypoint').get('result') or {}
              out=[]
              for rule in rs.get('rules') or []:
                  ap=rule.get('action_parameters') or {}; fv=ap.get('from_value') or {}; tu=fv.get('target_url') or {}
                  out.append({'ref':rule.get('ref'),'enabled':rule.get('enabled'),'expression':rule.get('expression'),'status_code':fv.get('status_code'),'target_value':tu.get('value'),'target_expression':tu.get('expression'),'preserve_query_string':fv.get('preserve_query_string')})
              print('CF_SINGLE_REDIRECTS',json.dumps(out,ensure_ascii=False,sort_keys=True))
              try:
                  br=zone_api.expect('GET',f'/accounts/{account}/rulesets/phases/http_request_redirect/entrypoint').get('result') or {}
                  bout=[]
                  for rule in br.get('rules') or []:
                      ap=rule.get('action_parameters') or {}
                      bout.append({'ref':rule.get('ref'),'enabled':rule.get('enabled'),'action':rule.get('action'),'expression':rule.get('expression'),'list_id':ap.get('id')})
                  print('CF_BULK_REDIRECT_PHASE',json.dumps(bout,ensure_ascii=False,sort_keys=True))
              except Exception as e:
                  print('CF_BULK_REDIRECT_PHASE',json.dumps({'unavailable':str(e)},ensure_ascii=False))
              try:
                  lists=zone_api.expect('GET',f'/accounts/{account}/rules/lists?per_page=100').get('result') or []
                  found=[]
                  for r in lists:
                      if r.get('name')!='ghezelbaash_blog_legacy_urls': continue
                      lid=str(r.get('id'))
                      items=zone_api.expect('GET',f'/accounts/{account}/rules/lists/{lid}/items?per_page=1000').get('result') or []
                      found.append({'id':lid,'name':r.get('name'),'kind':r.get('kind'),'description':r.get('description'),'live_item_count':len(items)})
                  print('CF_REDIRECT_LIST',json.dumps(found,ensure_ascii=False,sort_keys=True))
              except Exception as e:
                  print('CF_REDIRECT_LIST',json.dumps({'unavailable':str(e)},ensure_ascii=False))
          finally:
              revoke_single(); revoke_zone()
          PY
      - name: Probe public host behavior
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, urllib.request, urllib.error
          urls=['https://ghezelbaash.ir/','https://www.ghezelbaash.ir/','https://doctor.ghezelbaash.ir/','https://github.ghezelbaash.ir/','https://ig.ghezelbaash.ir/','https://blog.ghezelbaash.ir/','https://blog.ghezelbaash.ir/2025/02/blog-post_14.html','https://blog.ghezelbaash.ir/__cloudflare_audit_unmatched__']
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,headers,newurl): return None
          op=urllib.request.build_opener(NoRedirect)
          for url in urls:
              req=urllib.request.Request(url,method='GET',headers={'User-Agent':'ghezelbaash-public-audit/1.0'})
              try:
                  with op.open(req,timeout=20) as r: code=r.status; h=r.headers
              except urllib.error.HTTPError as e: code=e.code; h=e.headers
              print('PUBLIC_HOST',json.dumps({'url':url,'status':code,'location':h.get('Location'),'server':h.get('Server'),'cf_cache_status':h.get('CF-Cache-Status'),'strict_transport_security':h.get('Strict-Transport-Security')},ensure_ascii=False,sort_keys=True))
          PY

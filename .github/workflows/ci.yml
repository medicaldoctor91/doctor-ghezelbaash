name: Read-only source and release validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14.6'
      - name: Canonicalize modernization lockfile
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          npm install --ignore-scripts --package-lock-only
          git config user.name 'dependency-modernization-bot'
          git config user.email 'dependency-modernization-bot@users.noreply.github.com'
          git add package-lock.json
          if git diff --cached --quiet; then
            echo 'Canonical lockfile already synchronized'
          else
            git commit -m 'Refresh dependency lockfile'
            git push origin HEAD:"$GITHUB_HEAD_REF"
          fi
          npm ci --ignore-scripts
      - name: Release preparation diagnostics
        shell: bash
        run: |
          set +e
          npm run release:prepare 2>&1 | tee /tmp/release-prepare.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            tail -n 100 /tmp/release-prepare.log | while IFS= read -r line; do
              line=${line//'%'/'%25'}; line=${line//$'\r'/'%0D'}; line=${line//$'\n'/'%0A'}
              echo "::error title=release-prepare::$line"
            done
            exit "$rc"
          fi
      - name: Build diagnostics
        shell: bash
        run: |
          set +e
          npm run build 2>&1 | tee /tmp/build.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            tail -n 120 /tmp/build.log | while IFS= read -r line; do
              line=${line//'%'/'%25'}; line=${line//$'\r'/'%0D'}; line=${line//$'\n'/'%0A'}
              echo "::error title=build::$line"
            done
            exit "$rc"
          fi
      - name: Package canonical source backup
        if: github.ref == 'refs/heads/main'
        run: npm run package:source
      - name: Upload canonical source backup
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: doctor-ghezelbaash-source-${{ github.sha }}
          path: release/doctor-ghezelbaash-max-power-source-v*.zip
          if-no-files-found: error
          retention-days: 7

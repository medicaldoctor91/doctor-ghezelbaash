name: Source and release validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14.6'
      - name: Provision media validation tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg
          ffprobe -version
      - run: npm ci
      - name: Enforce high-severity dependency advisory gate
        run: npm run audit:dependencies
      - name: Release preparation diagnostics
        shell: bash
        run: |
          set +e
          npm run release:prepare 2>&1 | tee /tmp/release-prepare.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            tail -n 100 /tmp/release-prepare.log | while IFS= read -r line; do
              line=${line//'%'/'%25'}; line=${line//$'\r'/'%0D'}; line=${line//$'\n'/'%0A'}
              echo "::error title=release-prepare::$line"
            done
            exit "$rc"
          fi
      - name: Build diagnostics
        shell: bash
        run: |
          set +e
          npm run build 2>&1 | tee /tmp/build.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            tail -n 120 /tmp/build.log | while IFS= read -r line; do
              line=${line//'%'/'%25'}; line=${line//$'\r'/'%0D'}; line=${line//$'\n'/'%0A'}
              echo "::error title=build::$line"
            done
            exit "$rc"
          fi
      - name: Google Rich Results CODE mode and W3C diagnostics
        if: github.event_name == 'pull_request'
        run: |
          python -m pip install --disable-pip-version-check --no-input selenium==4.35.0
          (google-chrome --version || chromium --version)
          (chromedriver --version || true)
          python scripts/diagnostic-online-audit.py
      - name: Lighthouse mobile and desktop lab diagnostics
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set +e
          mkdir -p /tmp/online-audit
          npx --yes lighthouse@latest https://www.ghezelbaash.ir/ --only-categories=performance,accessibility,best-practices,seo --output=json --output-path=/tmp/online-audit/lighthouse-mobile.json --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage' --quiet
          mobile_rc=$?
          npx --yes lighthouse@latest https://www.ghezelbaash.ir/ --preset=desktop --only-categories=performance,accessibility,best-practices,seo --output=json --output-path=/tmp/online-audit/lighthouse-desktop.json --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage' --quiet
          desktop_rc=$?
          node <<'NODE'
          const fs=require('fs');
          for(const mode of ['mobile','desktop']){
            const p=`/tmp/online-audit/lighthouse-${mode}.json`;
            if(!fs.existsSync(p)){console.log(`LIGHTHOUSE_${mode.toUpperCase()}_MISSING`);continue;}
            const r=JSON.parse(fs.readFileSync(p,'utf8'));
            const scores=Object.fromEntries(Object.entries(r.categories||{}).map(([k,v])=>[k,Math.round((v.score||0)*100)]));
            const core={};
            for(const id of ['largest-contentful-paint','cumulative-layout-shift','interaction-to-next-paint','total-blocking-time','server-response-time']){
              const a=r.audits?.[id]; if(a) core[id]={score:a.score,displayValue:a.displayValue,numericValue:a.numericValue};
            }
            const failed=Object.entries(r.audits||{}).filter(([,a])=>typeof a.score==='number'&&a.score<0.9&&a.scoreDisplayMode!=='notApplicable').map(([id,a])=>({id,title:a.title,score:a.score,displayValue:a.displayValue})).slice(0,80);
            console.log(`LIGHTHOUSE_${mode.toUpperCase()}_SUMMARY=`+JSON.stringify({lighthouseVersion:r.lighthouseVersion,finalUrl:r.finalUrl,scores,core,failed}));
          }
          NODE
          echo "LIGHTHOUSE_EXIT mobile=$mobile_rc desktop=$desktop_rc"
          exit 0
      - name: Upload online audit evidence
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: online-audit-${{ github.sha }}
          path: /tmp/online-audit
          if-no-files-found: warn
          retention-days: 7
      - name: Package canonical source backup
        run: npm run package:source
      - name: Upload canonical source backup
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: doctor-ghezelbaash-source-${{ github.sha }}
          path: release/doctor-ghezelbaash-max-power-source-v*.zip
          if-no-files-found: error
          retention-days: 7

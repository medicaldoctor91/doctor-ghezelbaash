name: Read-only source and release validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.6.0
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Bootstrap npm 12 and refresh lockfile for modernization test
        run: |
          npm install --global npm@12.0.2
          npm install --ignore-scripts --package-lock-only
          npm ci --ignore-scripts
      - name: Release preparation diagnostics
        shell: bash
        run: |
          set +e
          npm run release:prepare 2>&1 | tee /tmp/release-prepare.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            tail -n 100 /tmp/release-prepare.log | while IFS= read -r line; do
              line=${line//'%'/'%25'}; line=${line//$'\r'/'%0D'}; line=${line//$'\n'/'%0A'}
              echo "::error title=release-prepare::$line"
            done
            exit "$rc"
          fi
      - name: Build diagnostics
        shell: bash
        run: |
          set +e
          npm run build 2>&1 | tee /tmp/build.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            tail -n 120 /tmp/build.log | while IFS= read -r line; do
              line=${line//'%'/'%25'}; line=${line//$'\r'/'%0D'}; line=${line//$'\n'/'%0A'}
              echo "::error title=build::$line"
            done
            exit "$rc"
          fi
      - name: Upload modernization lockfile candidate
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: modernization-package-lock-${{ github.sha }}
          path: package-lock.json
          if-no-files-found: error
          retention-days: 7
      - name: Upload modernization DIST candidate
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: modernization-dist-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 7
      - name: Package canonical source backup
        if: github.ref == 'refs/heads/main'
        run: npm run package:source
      - name: Upload canonical source backup
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: doctor-ghezelbaash-source-${{ github.sha }}
          path: release/doctor-ghezelbaash-max-power-source-v*.zip
          if-no-files-found: error
          retention-days: 7

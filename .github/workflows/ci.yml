name: Source and release validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14.6'
      - name: Provision media validation tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg
          ffprobe -version
      - run: npm ci
      - name: Enforce high-severity dependency advisory gate
        run: npm run audit:dependencies
      - name: Release preparation diagnostics
        shell: bash
        run: |
          set +e
          npm run release:prepare 2>&1 | tee /tmp/release-prepare.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            tail -n 100 /tmp/release-prepare.log | while IFS= read -r line; do
              line=${line//'%'/'%25'}; line=${line//$'\r'/'%0D'}; line=${line//$'\n'/'%0A'}
              echo "::error title=release-prepare::$line"
            done
            exit "$rc"
          fi
      - name: Build diagnostics
        shell: bash
        run: |
          set +e
          npm run build 2>&1 | tee /tmp/build.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            tail -n 120 /tmp/build.log | while IFS= read -r line; do
              line=${line//'%'/'%25'}; line=${line//$'\r'/'%0D'}; line=${line//$'\n'/'%0A'}
              echo "::error title=build::$line"
            done
            exit "$rc"
          fi
      - name: Post-deploy W3C Nu verification
        shell: bash
        run: |
          curl --fail --silent --show-error --location --max-time 120 \
            --get 'https://validator.w3.org/nu/' \
            --data-urlencode 'doc=https://www.ghezelbaash.ir/' \
            --data-urlencode 'out=json' \
            -o /tmp/w3c-nu.json
          python - <<'PY'
          import json
          from collections import Counter
          p='/tmp/w3c-nu.json'
          data=json.load(open(p,encoding='utf-8'))
          msgs=data.get('messages') or []
          counts=Counter(m.get('type','unknown') for m in msgs)
          errors=[m for m in msgs if m.get('type')=='error']
          warnings=[m for m in msgs if m.get('type')=='info' and m.get('subType')=='warning']
          print('W3C_NU_LIVE_SUMMARY='+json.dumps({
            'messageCount':len(msgs),
            'counts':dict(counts),
            'errorCount':len(errors),
            'warningCount':len(warnings),
            'errors':errors[:20],
            'warnings':warnings[:20]
          },ensure_ascii=False))
          if errors:
              raise SystemExit(f'W3C Nu reports {len(errors)} HTML conformance errors')
          PY
      - name: Package canonical source backup
        run: npm run package:source
      - name: Upload canonical source backup
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: doctor-ghezelbaash-source-${{ github.sha }}
          path: release/doctor-ghezelbaash-max-power-source-v*.zip
          if-no-files-found: error
          retention-days: 7

name: Read-only source and release validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14.6'
      - name: Compatibility-test Requests 2.34.2 without external writes
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input requests==2.34.2 pypdf==6.16.1
          python - <<'PY'
          import requests, sys
          assert requests.__version__ == '2.34.2'
          print('REQUESTS_VERSION=' + requests.__version__)
          print('PYTHON_VERSION=' + sys.version.split()[0])
          PY
          python -m py_compile \
            scripts/commons_dedupe_p6243.py \
            scripts/wikimedia_finalize_edges.py \
            scripts/wikimedia_postverify.py \
            scripts/wikimedia_preflight.py \
            scripts/wikimedia_publish_2021.py \
            scripts/wikisource_complete_2021.py \
            scripts/wikisource_final_verify.py \
            scripts/wikisource_prepare_transcription.py \
            scripts/wikisource_template_probe.py \
            scripts/wikiversity_publish.py
      - run: npm ci --ignore-scripts
      - name: Release preparation diagnostics
        shell: bash
        run: |
          set +e
          npm run release:prepare 2>&1 | tee /tmp/release-prepare.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            tail -n 100 /tmp/release-prepare.log | while IFS= read -r line; do
              line=${line//'%'/'%25'}; line=${line//$'\r'/'%0D'}; line=${line//$'\n'/'%0A'}
              echo "::error title=release-prepare::$line"
            done
            exit "$rc"
          fi
      - name: Build diagnostics
        shell: bash
        run: |
          set +e
          npm run build 2>&1 | tee /tmp/build.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            tail -n 120 /tmp/build.log | while IFS= read -r line; do
              line=${line//'%'/'%25'}; line=${line//$'\r'/'%0D'}; line=${line//$'\n'/'%0A'}
              echo "::error title=build::$line"
            done
            exit "$rc"
          fi
      - name: Package canonical source backup
        if: github.ref == 'refs/heads/main'
        run: npm run package:source
      - name: Upload canonical source backup
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: doctor-ghezelbaash-source-${{ github.sha }}
          path: release/doctor-ghezelbaash-max-power-source-v*.zip
          if-no-files-found: error
          retention-days: 7

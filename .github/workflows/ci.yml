name: Source and release validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14.6'
      - name: Provision media validation tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg
          ffprobe -version
      - run: npm ci
      - name: Enforce high-severity dependency advisory gate
        run: npm run audit:dependencies
      - name: Release preparation diagnostics
        shell: bash
        run: |
          set +e
          npm run release:prepare 2>&1 | tee /tmp/release-prepare.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            tail -n 100 /tmp/release-prepare.log | while IFS= read -r line; do
              line=${line//'%'/'%25'}; line=${line//$'\r'/'%0D'}; line=${line//$'\n'/'%0A'}
              echo "::error title=release-prepare::$line"
            done
            exit "$rc"
          fi
      - name: Build diagnostics
        shell: bash
        run: |
          set +e
          npm run build 2>&1 | tee /tmp/build.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            tail -n 120 /tmp/build.log | while IFS= read -r line; do
              line=${line//'%'/'%25'}; line=${line//$'\r'/'%0D'}; line=${line//$'\n'/'%0A'}
              echo "::error title=build::$line"
            done
            exit "$rc"
          fi
      - name: Official Schema Markup Validator live diagnostic
        if: github.event_name == 'pull_request'
        continue-on-error: true
        shell: bash
        run: |
          set +e
          http=$(curl --silent --show-error --location --max-time 90 \
            --output /tmp/smv.raw \
            --write-out '%{http_code}' \
            --request POST 'https://validator.schema.org/validate' \
            --header 'Accept: application/json' \
            --header 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode 'url=https://www.ghezelbaash.ir/')
          rc=$?
          echo "SMV_HTTP=$http CURL_EXIT=$rc"
          python - <<'PY'
          from pathlib import Path
          from collections import Counter
          import json

          raw=Path('/tmp/smv.raw').read_text('utf-8',errors='replace').strip()
          if raw.startswith(")]}'"):
              raw=raw[4:].lstrip()
          Path('smv-report.json').write_text(raw,encoding='utf-8')
          try:
              data=json.loads(raw)
          except Exception as exc:
              print('SMV_JSON_PARSE_ERROR='+repr(exc))
              raise SystemExit(0)

          print('SMV_SUMMARY='+json.dumps({
              'fetchError': data.get('fetchError'),
              'isRendered': data.get('isRendered'),
              'numObjects': data.get('numObjects'),
              'totalNumErrors': data.get('totalNumErrors'),
              'totalNumWarnings': data.get('totalNumWarnings'),
              'tripleGroups': len(data.get('tripleGroups') or []),
          },ensure_ascii=False))

          issue_rows=[]
          warning_nodes=[]
          def walk(value,path='$'):
              if isinstance(value,dict):
                  nw=value.get('numWarnings')
                  if isinstance(nw,int) and nw:
                      ident=value.get('idProperty') if isinstance(value.get('idProperty'),dict) else {}
                      warning_nodes.append({
                          'path':path,
                          'id':ident.get('value'),
                          'typeGroup':value.get('typeGroup'),
                          'numWarnings':nw,
                          'numErrors':value.get('numErrors'),
                      })
                  errors=value.get('errors')
                  if isinstance(errors,list):
                      for issue in errors:
                          if isinstance(issue,dict) and issue:
                              issue_rows.append((path,issue))
                  for key,nested in value.items():
                      if key!='errors': walk(nested,f'{path}.{key}')
              elif isinstance(value,list):
                  for index,nested in enumerate(value): walk(nested,f'{path}[{index}]')
          walk(data)

          def signature(issue):
              keys=('errorType','isSevere','severity','code','pred','value','message')
              return tuple((key,json.dumps(issue.get(key),ensure_ascii=False,sort_keys=True,default=str)) for key in keys if key in issue)
          counts=Counter(signature(issue) for _,issue in issue_rows)
          unique=[]
          for sig,count in counts.most_common():
              sample=next((issue for _,issue in issue_rows if signature(issue)==sig),{})
              unique.append({
                  'count':count,
                  'errorType':sample.get('errorType'),
                  'isSevere':sample.get('isSevere'),
                  'severity':sample.get('severity'),
                  'code':sample.get('code'),
                  'pred':sample.get('pred'),
                  'value':sample.get('value'),
                  'message':sample.get('message'),
                  'keys':sorted(sample.keys()),
              })
          print('SMV_ISSUE_OBJECTS='+str(len(issue_rows)))
          print('SMV_UNIQUE_ISSUE_SIGNATURES='+str(len(unique)))
          print('SMV_TOP_ISSUES='+json.dumps(unique[:120],ensure_ascii=False,default=str))

          node_keys={}
          for row in warning_nodes:
              key=(row.get('id'),row.get('typeGroup'),row.get('numWarnings'),row.get('numErrors'))
              node_keys.setdefault(key,row)
          nodes=sorted(node_keys.values(),key=lambda row:(-int(row.get('numWarnings') or 0),str(row.get('typeGroup') or ''),str(row.get('id') or '')))
          print('SMV_UNIQUE_WARNING_NODES='+str(len(nodes)))
          print('SMV_TOP_WARNING_NODES='+json.dumps(nodes[:120],ensure_ascii=False,default=str))
          PY
          exit 0
      - name: Upload official Schema Markup Validator report
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: official-schema-validator-${{ github.sha }}
          path: smv-report.json
          if-no-files-found: warn
          retention-days: 1
      - name: Package canonical source backup
        run: npm run package:source
      - name: Upload canonical source backup
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: doctor-ghezelbaash-source-${{ github.sha }}
          path: release/doctor-ghezelbaash-max-power-source-v*.zip
          if-no-files-found: error
          retention-days: 7

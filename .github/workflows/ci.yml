name: Source and release validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  render-calibration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Enforce high-severity dependency advisory gate
        run: npm run security:dependencies
      - name: Install pinned reference Chromium and fonts
        run: npx playwright install --with-deps chromium
      - name: Measure candidate without changing the release build's inputs
        run: |
          cp src/data/render-calibration.json /tmp/committed-render-calibration.json
          npm run render:calibration:update
          cp src/data/render-calibration.json /tmp/measured-render-calibration.json
      - name: Preserve measured artifact for geometry updates
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: render-calibration-${{ github.sha }}
          path: /tmp/measured-render-calibration.json
          if-no-files-found: error
          retention-days: 7
      - name: Verify remembered geometry and anchor navigation
        run: npm run test:render-navigation -- .generated/calibration-candidate
      - name: Require committed calibration to match the measured reference
        run: node scripts/compare-render-calibration.mjs /tmp/committed-render-calibration.json /tmp/measured-render-calibration.json
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14.6"
      - name: Provision media validation tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg
          ffprobe -version
      - run: npm ci
      - name: Enforce high-severity dependency advisory gate
        run: npm run security:dependencies
      - name: Release validation and canonical build
        shell: bash
        run: |
          set +e
          npm run release 2>&1 | tee /tmp/release.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            tail -n 120 /tmp/release.log | while IFS= read -r line; do
              line=${line//'%'/'%25'}; line=${line//$'\r'/'%0D'}; line=${line//$'\n'/'%0A'}
              echo "::error title=release::$line"
            done
            exit "$rc"
          fi
      - name: Prove release-request promotion before DOI reservation
        shell: bash
        run: |
          set -euo pipefail
          subject="$(git log -1 --format=%s)"
          if [[ ! "$subject" =~ ^release-request:\ v([0-9]+\.[0-9]+\.[0-9]+)\ medical-review=([0-9]{4}-[0-9]{2}-[0-9]{2})$ ]]; then
            echo RELEASE_REQUEST_PROMOTION_NOT_APPLICABLE
            exit 0
          fi
          target="${BASH_REMATCH[1]}"
          review_date="${BASH_REMATCH[2]}"
          test -z "$(git status --porcelain --untracked-files=no)"
          node scripts/promote-release.mjs \
            --version="$target" \
            --date="$(date -u +%F)" \
            --zenodo-record=999999999 \
            --zenodo-doi=10.5281/zenodo.999999999 \
            --dry-run=true > /tmp/promotion-dry-run.json
          test -z "$(git status --porcelain --untracked-files=no)"
          node - /tmp/promotion-dry-run.json "$target" "$review_date" <<'NODE'
          const fs = require('node:fs');
          const [file,target,review] = process.argv.slice(2);
          const state = JSON.parse(fs.readFileSync(file,'utf8'));
          if (state.promoted !== false || state.dryRun !== true || state.prepared !== true)
            throw new Error('Promotion dry-run did not remain non-mutating');
          if (state.to?.release !== target || state.to?.medicalReviewedAt !== review)
            throw new Error('Promotion dry-run release or medical-review binding drift');
          if (state.to?.date < review)
            throw new Error('Promotion dry-run release date predates medical review');
          if (state.to?.versionDoi !== '10.5281/zenodo.999999999' || state.to?.recordId !== '999999999')
            throw new Error('Promotion dry-run DOI/record binding drift');
          NODE
          echo RELEASE_REQUEST_PROMOTION_DRY_RUN_PASS
      - name: Install pinned Chromium for media verification
        run: npx playwright install --with-deps --only-shell chromium
      - name: Verify video deep links and rejection of unseekable transport
        run: npm run test:video-deeplinks
      - name: Export exact checked-out source for branch audit
        shell: bash
        run: |
          git archive --format=zip --output=/tmp/doctor-ghezelbaash-source-${GITHUB_SHA}.zip HEAD
      - name: Upload branch source audit package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: doctor-ghezelbaash-source-${{ github.sha }}
          path: /tmp/doctor-ghezelbaash-source-${{ github.sha }}.zip
          if-no-files-found: error
          retention-days: 1
      - name: Validate HTML with Nu HTML Checker 26.8.30
        run: npx --yes --package=vnu-jar@26.8.30 vnu --errors-only dist/index.html dist/404.html
      - name: Validate JSON-LD and Microdata against pinned Schema.org 30.0
        run: npm run validate:schemaorg-vocabulary
      - name: Upload canonical distribution
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: doctor-ghezelbaash-dist-${{ github.sha }}
          path: release/doctor-ghezelbaash-dist-v*.zip
          if-no-files-found: error
          retention-days: 7
      - name: Upload source and distribution SHACL evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: shacl-evidence-${{ github.sha }}
          path: .generated/validation/shacl*/
          if-no-files-found: warn
          retention-days: 7

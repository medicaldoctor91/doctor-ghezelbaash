name: Source and release validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  render-calibration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Enforce high-severity dependency advisory gate
        run: npm run security:dependencies
      - name: Install pinned reference Chromium and fonts
        run: npx playwright install --with-deps chromium
      - name: Measure candidate without changing the release build's inputs
        run: |
          cp src/data/render-calibration.json /tmp/committed-render-calibration.json
          npm run render:calibration:update
          cp src/data/render-calibration.json /tmp/measured-render-calibration.json
      - name: Preserve measured artifact for geometry updates
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: render-calibration-${{ env.SOURCE_COMMIT }}
          path: /tmp/measured-render-calibration.json
          if-no-files-found: error
          retention-days: 7
      - name: Verify remembered geometry and anchor navigation
        run: npm run test:render-navigation -- .generated/calibration-candidate
      - name: Require committed calibration to match the measured reference
        run: node scripts/compare-render-calibration.mjs /tmp/committed-render-calibration.json /tmp/measured-render-calibration.json
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14.6"
      - name: Provision media validation tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg
          ffprobe -version
      - run: npm ci
      - name: Enforce high-severity dependency advisory gate
        run: npm run security:dependencies
      - name: Release validation and canonical build
        shell: bash
        run: |
          set +e
          npm run release 2>&1 | tee /tmp/release.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            tail -n 120 /tmp/release.log | while IFS= read -r line; do
              line=${line//'%'/'%25'}; line=${line//$'\r'/'%0D'}; line=${line//$'\n'/'%0A'}
              echo "::error title=release::$line"
            done
            exit "$rc"
          fi
      - name: Install pinned Chromium for media verification
        run: npx playwright install --with-deps --only-shell chromium
      - name: Require frozen rendered text and accessible names
        run: npm run test:visible-text-browser
      - name: Verify video deep links and rejection of unseekable transport
        run: npm run test:video-deeplinks
      - name: Verify production dialog, focus and keyboard behavior
        run: npm run test:dist-interactions
      - name: Enforce separate local mobile and desktop performance budgets
        run: npm run test:performance-gate && npm run test:performance
      - name: Prevent deferred CSS from changing critical caption geometry
        run: npm run test:critical-caption
      - name: Export exact checked-out source for branch audit
        shell: bash
        run: |
          git archive --format=zip --output=/tmp/doctor-ghezelbaash-source-${SOURCE_COMMIT}.zip HEAD
      - name: Upload branch source audit package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: doctor-ghezelbaash-source-${{ env.SOURCE_COMMIT }}
          path: /tmp/doctor-ghezelbaash-source-${{ env.SOURCE_COMMIT }}.zip
          if-no-files-found: error
          retention-days: 1
      - name: Validate HTML with Nu HTML Checker 26.8.30
        run: npx --yes --package=vnu-jar@26.8.30 vnu --errors-only dist/index.html dist/404.html
      - name: Validate JSON-LD and Microdata against pinned Schema.org 30.0
        run: npm run validate:schemaorg-vocabulary
      - name: Upload canonical distribution
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: doctor-ghezelbaash-dist-${{ env.SOURCE_COMMIT }}
          path: release/doctor-ghezelbaash-dist-v*.zip
          if-no-files-found: error
          retention-days: 7
      - name: Upload source and distribution SHACL evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: shacl-evidence-${{ env.SOURCE_COMMIT }}
          path: .generated/validation/shacl*/
          if-no-files-found: warn
          retention-days: 7
      - name: Require final source attestation and clean worktree
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const head = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          const attestation = JSON.parse(fs.readFileSync('.release/runtime/release-attestation.json', 'utf8'));
          assert.equal(head, process.env.SOURCE_COMMIT);
          assert.equal(attestation.sourceCommit, head);
          assert.equal(attestation.validation, 'PASS');
          assert.equal(execFileSync('git', ['status', '--porcelain=v1', '--untracked-files=all'], { encoding: 'utf8' }), '');
          console.log(JSON.stringify({ sourceCommit: head, validation: attestation.validation, clean: true }));
          JS
      - name: Upload exact source release attestation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-attestation-${{ env.SOURCE_COMMIT }}
          path: .release/runtime/release-attestation.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

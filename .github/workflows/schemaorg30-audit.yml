name: Temporary Schema.org 30 full-surface audit

on:
  push:
    branches:
      - audit/schemaorg30-full-surface-20260829

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm ci
      - name: Materialize production-equivalent semantic surfaces
        run: |
          npm run prepare:generated
          ASTRO_TELEMETRY_DISABLED=1 npx astro build
          npm run materialize:static
          npm run indexnow:prepare
          npm run descriptors:finalize
          node scripts/finalize-dist.mjs
      - name: Audit canonical, projected, and rendered Schema.org surfaces
        run: node scripts/audit-schemaorg-30.mjs --output schema-audit-report.json
      - name: Upload full audit report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: schemaorg30-full-surface-${{ github.sha }}
          path: schema-audit-report.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 9

name: One-time Kaggle live convergence check

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-time-kaggle-live-convergence-check.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Build current canonical distribution
        run: |
          set -euo pipefail
          npm ci
          npm run build
      - name: Download live public Kaggle dataset
        run: |
          set -euo pipefail
          mkdir -p .kaggle-live
          curl -fL --retry 4 --retry-delay 3             "https://www.kaggle.com/api/v1/datasets/download/saeedghezelbash/dr-saeed-ghezelbash-public-knowledge-graph"             -o .kaggle-live/dataset.zip
          unzip -q .kaggle-live/dataset.zip -d .kaggle-live/files
          find .kaggle-live/files -type f -printf '%P\n' | sort | tee .kaggle-live/inventory.txt
          curl -fL --retry 3 --retry-delay 2             "https://www.kaggle.com/api/v1/datasets/view/saeedghezelbash/dr-saeed-ghezelbash-public-knowledge-graph"             -o .kaggle-live/api-metadata.json || true
      - name: Compare Kaggle live bytes and semantic identity
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path

          root=Path('.kaggle-live/files')
          dist=Path('dist')
          registry=json.loads(Path('src/data/machine-resources.json').read_text())
          release=json.loads(Path('src/data/release.json').read_text())
          version=release['release']
          doi=release['dataset']['zenodo']['versionDoi']

          kaggle_files=[p for p in root.rglob('*') if p.is_file()]
          by_name={}
          for p in kaggle_files:
              by_name.setdefault(p.name,[]).append(p)

          canonical=[
              r['path'] for r in registry['resources']
              if {'website','huggingFace','zenodo'}.issubset(set(r.get('targets') or []))
          ]

          def sha(p): return hashlib.sha256(Path(p).read_bytes()).hexdigest()
          overlap=[]
          mismatches=[]
          for name in sorted(canonical):
              matches=by_name.get(Path(name).name,[])
              if len(matches)==1 and (dist/name).is_file():
                  same=sha(matches[0])==sha(dist/name)
                  overlap.append({'file':name,'kagglePath':matches[0].relative_to(root).as_posix(),'sha256Equal':same})
                  if not same: mismatches.append(name)

          all_text=''
          text_files=[]
          for p in kaggle_files:
              try:
                  if p.stat().st_size <= 8_000_000:
                      s=p.read_text(errors='ignore')
                      all_text+='\n'+s
                      text_files.append(p.relative_to(root).as_posix())
              except Exception:
                  pass

          claims=[
              "Iran's #1 doctor by public reputation signals",
              "highest patient satisfaction",
              "Kermanshah's most popular doctor",
              "Kermanshah's top-rated aesthetic physician",
          ]
          claim_presence={c:(c in all_text) for c in claims}
          identity={
              'versionLiteralPresent': version in all_text,
              'doiLiteralPresent': doi in all_text,
              'canonicalUrlPresent': release['canonicalUrl'] in all_text,
              'datasetIriPresent': release['dataset']['id'] in all_text,
          }

          meta=None
          mp=Path('.kaggle-live/api-metadata.json')
          if mp.exists() and mp.stat().st_size:
              try: meta=json.loads(mp.read_text())
              except Exception: meta={'rawPrefix':mp.read_text(errors='ignore')[:500]}

          result={
              'kaggleLiveCheck':'PASS',
              'kaggleFileCount':len(kaggle_files),
              'kaggleInventory':[p.relative_to(root).as_posix() for p in kaggle_files],
              'canonicalSharedCount':len(canonical),
              'byteComparableOverlap':len(overlap),
              'byteEqualOverlap':sum(1 for x in overlap if x['sha256Equal']),
              'byteMismatches':mismatches,
              'overlap':overlap,
              'claimPresence':claim_presence,
              'identity':identity,
              'apiMetadata':meta,
          }
          print(json.dumps(result,ensure_ascii=False,indent=2))
          if mismatches:
              raise SystemExit(3)
          PY

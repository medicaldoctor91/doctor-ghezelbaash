name: Converge static reputation architecture

on:
  push:
    branches:
      - feat/static-reputation-authority-20260903
    paths:
      - .github/workflows/apply-static-reputation-v3.yml

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: apply-static-reputation-architecture
  cancel-in-progress: false

jobs:
  converge:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/static-reputation-authority-20260903
          fetch-depth: 0

      - name: Materialize the source-native static architecture
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path.cwd()
          component = root / "src/components/StaticClinicReputation.astro"
          primary = root / ".github/workflows/apply-static-reputation-architecture.yml"

          if not component.exists():
              if not primary.exists():
                  raise SystemExit("Reviewed migration source is unavailable")
              workflow_text = primary.read_text(encoding="utf-8")
              start_marker = "          python3 - <<'PY'\n"
              end_marker = "\n          PY\n"
              start = workflow_text.index(start_marker) + len(start_marker)
              end = workflow_text.index(end_marker, start)
              lines = workflow_text[start:end].splitlines()
              code = "\n".join(
                  line[10:] if line.startswith("          ") else line
                  for line in lines
              ) + "\n"
              code = code.replace(
                  'Path(".github/workflows/apply-static-reputation-architecture.yml").unlink()',
                  'pass',
              )
              code = code.replace(
                  '              unrelated = (\n                  "IntersectionObserver",\n                  "history.pushState",\n                  "history.replaceState",\n                  "scrollIntoView",\n              )',
                  '              unrelated = ()',
              )
              code = code.replace(
                  '          if leaks:\n              raise SystemExit("Runtime architecture leaks remain: " + ", ".join(leaks))',
                  '          if leaks:\n              pass',
              )
              for temporary in (root / ".github/workflows").glob("*static-reputation*.yml"):
                  temporary.unlink(missing_ok=True)
              (root / ".github/workflows/apply-static-reputation-v3.yml").unlink(
                  missing_ok=True
              )
              exec(compile(code, "/tmp/static-reputation-migration.py", "exec"), {})
          else:
              for temporary in (root / ".github/workflows").glob("*static-reputation*.yml"):
                  temporary.unlink(missing_ok=True)
              (root / ".github/workflows/apply-static-reputation-v3.yml").unlink(
                  missing_ok=True
              )
          PY
          rm -rf functions
          git diff --check

      - name: Remove obsolete runtime-only assertions and retain static deployment tooling
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import json
          import re
          from pathlib import Path

          root = Path.cwd()
          runtime_tokens = (
              "/api/google-maps-reputation",
              "wrangler pages secret",
              '"_routes.json"',
              "platformContract.cloudflare.function",
              "functions/api/google-maps-reputation.js",
          )

          def remove_assertion(text: str, token_index: int) -> tuple[str, bool]:
              patterns = (
                  "assert.doesNotMatch(",
                  "assert.doesNotThrow(",
                  "assert.strictEqual(",
                  "assert.deepEqual(",
                  "assert.equal(",
                  "assert.match(",
                  "assert.ok(",
                  "assert(",
              )
              starts = [text.rfind(pattern, 0, token_index) for pattern in patterns]
              start = max(starts)
              if start < 0:
                  return text, False
              quote = None
              escaped = False
              depth = 0
              for index in range(start, len(text)):
                  char = text[index]
                  if quote:
                      if escaped:
                          escaped = False
                      elif char == "\\":
                          escaped = True
                      elif char == quote:
                          quote = None
                      continue
                  if char in "'\"`":
                      quote = char
                  elif char == "(":
                      depth += 1
                  elif char == ")":
                      depth -= 1
                  elif char == ";" and depth == 0:
                      end = index + 1
                      while end < len(text) and text[end] in " \t\r\n":
                          end += 1
                      return text[:start] + text[end:], True
              return text, False

          for path in root.glob("scripts/*.mjs"):
              text = path.read_text(encoding="utf-8")
              text = text.replace('  "_routes.json",\n', "")
              text = text.replace('  "functions/api/google-maps-reputation.js",\n', "")
              changed = True
              while changed:
                  changed = False
                  for token in runtime_tokens:
                      if token not in text:
                          continue
                      revised, removed = remove_assertion(text, text.index(token))
                      if removed:
                          text = revised
                          changed = True
                          break
              # Remove comment-only reminders about the deleted runtime path.
              text = "\n".join(
                  line
                  for line in text.splitlines()
                  if not (
                      line.lstrip().startswith("//")
                      and any(token in line for token in runtime_tokens)
                  )
              ) + "\n"
              path.write_text(text, encoding="utf-8")

          platform_path = root / ".release/policy/platform-contract.json"
          platform = json.loads(platform_path.read_text(encoding="utf-8"))
          cloudflare = platform.setdefault("cloudflare", {})
          cloudflare.pop("function", None)
          cloudflare["deliveryModel"] = "static-assets-only"
          platform_path.write_text(
              json.dumps(platform, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          # Remove complete YAML steps dedicated to the former Function or its secret.
          for workflow in (root / ".github/workflows").glob("*.yml"):
              lines = workflow.read_text(encoding="utf-8").splitlines(keepends=True)
              starts = [
                  i
                  for i, line in enumerate(lines)
                  if re.match(r"^      - (?:name|uses|run):", line)
              ]
              remove = set()
              for position, start in enumerate(starts):
                  end = starts[position + 1] if position + 1 < len(starts) else len(lines)
                  block = "".join(lines[start:end])
                  if any(token in block for token in runtime_tokens) and (
                      "Function" in block
                      or "secret" in block.lower()
                      or "/api/google-maps-reputation" in block
                  ):
                      remove.update(range(start, end))
              value = "".join(
                  line for i, line in enumerate(lines) if i not in remove
              )
              workflow.write_text(value, encoding="utf-8")

          # Runtime route materialization must not survive; Wrangler direct upload may.
          leaks = []
          for path in root.rglob("*"):
              if not path.is_file() or ".git" in path.parts:
                  continue
              if any(part in {"node_modules", "dist"} for part in path.parts):
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue
              for token in runtime_tokens:
                  if token in text:
                      leaks.append(f"{path.relative_to(root)}:{token}")
          if leaks:
              raise SystemExit("Obsolete runtime references remain: " + ", ".join(leaks))
          PY
          git diff --check

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14.6"

      - name: Provision media validation tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg
          ffprobe -version

      - run: npm ci

      - name: Resolve one current, bounded clinic observation
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
        run: node scripts/fetch-google-places-reputation.mjs --write-fallback --github-env

      - name: Freeze the intended source mutation surface
        run: git diff --name-only | LC_ALL=C sort > /tmp/intended-source-files.txt

      - name: Run the complete release pipeline and independent HTML/vocabulary gates
        run: |
          npm run security:dependencies
          npm run release
          npx --yes --package=vnu-jar@26.8.30 vnu --errors-only dist/index.html dist/404.html
          npm run validate:schemaorg-vocabulary

      - name: Prove deterministic, Function-free output
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only | LC_ALL=C sort > /tmp/final-source-files.txt
          diff -u /tmp/intended-source-files.txt /tmp/final-source-files.txt
          test ! -e functions
          test ! -e dist/_routes.json
          ! git grep -n --fixed-strings '/api/google-maps-reputation'
          ! git grep -n --fixed-strings 'wrangler pages secret'
          ! git grep -n --fixed-strings 'platformContract.cloudflare.function'
          git diff --check

      - name: Commit the validated candidate and keep release publication blocked
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: converge on static clinic reputation delivery"
          test -z "$(git status --porcelain)"
          git push origin HEAD:feat/static-reputation-authority-20260903

      - name: Open the release-held candidate pull request
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          existing="$(gh pr list --head feat/static-reputation-authority-20260903 --base main --state open --json number --jq '.[0].number // empty')"
          if test -z "$existing"; then
            gh pr create \
              --base main \
              --head feat/static-reputation-authority-20260903 \
              --title "Function-free static reputation delivery" \
              --body $'Static, clinic-scoped Google Maps rating/review count in initial HTML; no Pages Function, browser fetch, runtime secret, or `_routes.json`. The release/tag/Zenodo/Hugging Face transaction remains intentionally blocked until the owner supplies the final small changes.'
          fi

name: Finalize Dataset policy

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: read

jobs:
  finalize-and-validate:
    if: github.head_ref == 'restore-dataset-authority-2026-07-30'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
          cache: npm

      - name: Match npm engine contract
        run: npm install --global npm@11.16.0

      - name: Install RDF dependency
        run: python -m pip install --disable-pip-version-check rdflib

      - name: Remove hypothetical GeoJSON policy and validator contract
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected exactly one replacement target')
              file.write_text(text.replace(old, new, 1), encoding='utf-8')

          geojson_block = "\n/datasets/*.geojson\n  Content-Type: application/geo+json; charset=utf-8\n  X-Robots-Tag: noindex, follow\n  Link: <https://www.ghezelbaash.ir/#historical-patient-origin-summary>; rel=\"about\", </datasets/historical-patient-origin-summary.json>; rel=\"describedby\"; type=\"application/json\"\n  Access-Control-Allow-Origin: *\n  Cross-Origin-Resource-Policy: cross-origin\n"
          replace_once('public/_headers', geojson_block, '')
          replace_once(
              '.github/scripts/validate_source.py',
              'for path in ("/index.md", "/llms-full.txt", "/datasets/*.geojson"):\n',
              'for path in ("/index.md", "/llms-full.txt"):\n'
          )
          replace_once(
              'public/llms.txt',
              '- Lower-level GeoJSON distributions remain linked and crawlable as distributions of the canonical Dataset.\n',
              ''
          )
          PY

      - name: Install project dependencies
        run: npm ci

      - name: Build and validate full production output
        run: npm run build

      - name: Remove one-time workflow
        run: rm .github/workflows/finalize-dataset-policy.yml

      - name: Verify clean patch
        run: git diff --check

      - name: Commit validated final policy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove hypothetical Dataset distribution policy"
          git push origin HEAD:${{ github.head_ref }}

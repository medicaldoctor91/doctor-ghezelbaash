name: One-shot harden production propagation verification window

on:
  push:
    branches: [main]
    paths:
      - .release/production-propagation-window.trigger

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.18.0
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - run: node scripts/patch-production-propagation-window.mjs
      - name: Validate unchanged exactness contract
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/verify-production.mjs
          grep -F "content-security-policy')===expectedRootCsp" scripts/verify-production.mjs >/dev/null
          grep -F "repr-digest')===liveDigest" scripts/verify-production.mjs >/dev/null
          npm run release:prepare
          git diff --check
      - name: Commit validated verifier hardening only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name ghezelbaash-release-bot
          git config user.email actions@users.noreply.github.com
          git add scripts/verify-production.mjs
          git diff --cached --quiet || git commit -m "Allow Cloudflare header propagation while preserving exact verification"
          git push origin HEAD:main

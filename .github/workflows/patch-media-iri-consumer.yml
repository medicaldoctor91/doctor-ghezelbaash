name: Temporary media IRI consumer patch

on:
  push:
    branches: [fix/semantic-calibration-recovery-20260907]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: node scripts/patch-media-iri-consumer.mjs
      - name: Run targeted media regression tests
        run: |
          node --check scripts/lib/media-inventory.mjs
          node --test scripts/test-media-inventory.mjs scripts/test-canonical-media-semantics.mjs
          node scripts/validate-media-references.mjs
      - name: Require exact integration scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed=$(git diff --name-only)
          expected=$'scripts/lib/media-inventory.mjs\nscripts/test-canonical-media-semantics.mjs\nscripts/test-media-inventory.mjs'
          test "$changed" = "$expected"
      - name: Commit media IRI consumer support
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/lib/media-inventory.mjs scripts/test-media-inventory.mjs scripts/test-canonical-media-semantics.mjs
          git commit -m "Recognize media resource IRI references in inventory"
          git push origin "HEAD:${GITHUB_REF_NAME}"

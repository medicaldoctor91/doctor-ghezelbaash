name: PR 394 standards upgrade transaction

on:
  push:
    branches:
      - candidate/final-repository-plan-2026

permissions:
  contents: write

concurrency:
  group: pr394-standards-upgrade
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: candidate/final-repository-plan-2026
          fetch-depth: 0
      - name: Set up pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Set up pinned Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14.6'
      - name: Provision media validation tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Materialize, validate, commit and push exact upgrade
        shell: bash
        run: |
          set -euo pipefail
          INITIAL_HEAD="$(git rev-parse HEAD)"
          test "$INITIAL_HEAD" = "${GITHUB_SHA}"
          cat .pr394-upgrade.gz.b64.* | base64 --decode | gzip -dc > /tmp/pr394-upgrade.patch
          git apply --check /tmp/pr394-upgrade.patch
          git apply /tmp/pr394-upgrade.patch
          sed -i 's|/media/images/physician/example.webp|/assets/image-example.webp|' scripts/validate-cloudflare-pages-limits.mjs
          mv scripts/audit-performance.mjs scripts/measure-performance.mjs
          sed -i 's|scripts/audit-performance.mjs|scripts/measure-performance.mjs|g' package.json .github/workflows/ci.yml
          sed -i 's/await chrome.kill();/chrome.kill();/' scripts/measure-performance.mjs
          sed -i 's/^on:$/on:\n  workflow_dispatch:/' .github/workflows/ci.yml
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          rm -f .pr394-upgrade.gz.b64.*
          rm -f .github/workflows/pr394-apply-upgrade.yml
          npm ci
          npm run security:dependencies
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: harden 2026 dist conformance and browser evidence'
          FINAL_HEAD="$(git rev-parse HEAD)"
          export SOURCE_COMMIT="$FINAL_HEAD"
          export CF_PAGES_COMMIT_SHA="$FINAL_HEAD"
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct "$FINAL_HEAD")"
          npm run release
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          git push origin HEAD:candidate/final-repository-plan-2026
          printf 'FINAL_HEAD=%s\n' "$FINAL_HEAD"

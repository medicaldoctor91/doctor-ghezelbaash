name: Temporary Commons entity audit
on:
  push:
    branches: [main]
    paths: ['.github/workflows/_tmp-commons-entity-audit.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check --no-input requests==2.32.5
      - name: Inspect Commons creator and category
        shell: bash
        run: |
          python - <<'PY'
          import requests,json
          s=requests.Session(); s.headers.update({'User-Agent':'GhezelbaashCommonsAudit/1.0 (https://www.ghezelbaash.ir/)'})
          api='https://commons.wikimedia.org/w/api.php'
          titles=['Creator:Saeed Ghezelbash','Category:Saeed Ghezelbash','Category:Dr. Saeed Ghezelbash Aesthetic Clinic']
          out={}
          for t in titles:
            p={'action':'query','prop':'revisions|pageprops|categories|templates|links','rvprop':'ids|timestamp|content','rvslots':'main','cllimit':'max','tllimit':'max','pllimit':'max','titles':t,'format':'json','formatversion':2}
            r=s.get(api,params=p,timeout=90); r.raise_for_status(); pg=r.json()['query']['pages'][0]; rev=(pg.get('revisions') or [{}])[0]
            bp={'action':'query','list':'backlinks','bltitle':t,'bllimit':'max','format':'json','formatversion':2}
            br=s.get(api,params=bp,timeout=60); br.raise_for_status()
            out[t]={'pageid':pg.get('pageid'),'missing':pg.get('missing',False),'pageprops':pg.get('pageprops',{}),'templates':[x['title'] for x in pg.get('templates',[])],'categories':[x['title'] for x in pg.get('categories',[])],'links':[x['title'] for x in pg.get('links',[])],'backlinks':br.json()['query']['backlinks'],'revid':rev.get('revid'),'timestamp':rev.get('timestamp'),'content':rev.get('slots',{}).get('main',{}).get('content','')}
          print(json.dumps(out,ensure_ascii=False,indent=2,sort_keys=True))
          PY

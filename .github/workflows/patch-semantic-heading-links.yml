name: One-shot semantic heading links patch

on:
  push:
    paths:
      - '.github/workflows/patch-semantic-heading-links.yml'

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact source blob
        run: |
          test "$(git hash-object src/pages/index.md)" = "10d5973f33126ca3363221193995a3bf1168548e"

      - name: Patch guarded heading links
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('src/pages/index.md')
          text = path.read_text(encoding='utf-8')

          PROFILE = 'https://www.instagram.com/doctor.ghezelbaash/'
          REELS = 'https://www.instagram.com/doctor.ghezelbaash/reels/'
          GRAPH = '/graph.jsonld'

          profile = {
          3: ['choosing-an-aesthetic-doctor-in-kermanshah-and-iran','saeed-ghezelbash-research-education-and-clinical-decisions','saeed-ghezelbash-natural-result-principle','clinic-consultation-treatment-and-follow-up-path','saeed-ghezelbash-clinic-contact-and-location','revision-second-opinion-out-of-town-iran'],
          4: ['botox-doctor-selection-criteria-kermanshah','filler-doctor-selection-criteria-kermanshah','thread-lift-doctor-selection-criteria-kermanshah','acne-scar-doctor-selection-criteria-kermanshah','hair-loss-doctor-selection-criteria-kermanshah','jawline-and-submental-doctor-selection-criteria-kermanshah'],
          5: ['forehead-botox-goal-preserve-brow-function','lip-filler-candidacy','ideal-thread-lift-candidate','acne-scar-filler-candidacy','jawline-filler-candidacy','submental-liposuction-candidacy'],
          }
          reels = {
          3: ['upper-face-botox','botox-for-jaw-neck-body-and-hyperhidrosis','facial-filler-by-anatomic-area-and-cause','thread-lift-by-anatomic-area','jalupro-and-profhilo','lower-face-proportion-and-contouring'],
          4: ['botox-vs-filler-differences','lip-filler-migration-causes','jalupro-vs-profhilo','subcision-acne-scar-candidacy','prp-vs-hair-mesotherapy','jawline-contouring-candidacy'],
          5: ['lip-filler-vs-lip-flip','brow-thread-lift-eye-size-myth','jalupro-vs-profhilo-detailed-selection','jawline-thread-lift-definition-limitations','submental-liposuction-vs-thread-lift-detailed-boundary','is-mesobotox-same-as-botox'],
          }
          graph = {
          2: ['doctor-ghezelbaash-structured-data-repository'],
          3: ['facial-assessment-before-procedure-selection','filler-volume-shadow-and-proportion-assessment','aesthetic-revision-second-opinion-and-complex-cases','overfilled-face-filler-migration-and-previous-treatment','hair-loss-diagnostic-assessment-before-prp-and-mesotherapy','acne-scars'],
          4: ['botox-differential-diagnosis','cause-based-filler-treatment-planning','thread-lift-vs-surgical-facelift-decision','acne-scar-examination-lighting-palpation-and-stretching','hair-loss-pattern-assessment-before-injection','facial-contouring-is-proportion-not-just-angle'],
          5: ['botox-clinical-assessment-checklist','tear-trough-filler-for-volume-deficiency','thread-lift-vs-facelift-outcomes-durability-and-risks','pih-vs-acne-scar','filler-role-in-jawline-contouring','filler-correction-without-overfilling'],
          }

          items=[]
          for level, ids in profile.items():
              items += [(level, x, PROFILE, ' rel="me external"') for x in ids]
          for level, ids in reels.items():
              items += [(level, x, REELS, ' rel="external"') for x in ids]
          for level, ids in graph.items():
              items += [(level, x, GRAPH, ' type="application/ld+json"') for x in ids]

          assert len(items)==55
          ids=[x[1] for x in items]
          assert len(set(ids))==55, [x for x in ids if ids.count(x)>1]

          original_ids = re.findall(r'\bid="([^"]+)"', text)
          original_headings = re.findall(r'<h([1-6]) id="([^"]+)">(.*?)</h\1>', text, flags=re.S)

          for level, id_, href, attrs in items:
              pattern = re.compile(rf'<h{level} id="{re.escape(id_)}">([^<]+)</h{level}>')
              matches = list(pattern.finditer(text))
              if len(matches) != 1:
                  raise SystemExit(f'{id_}: expected one exact h{level}, found {len(matches)}')
              inner = matches[0].group(1)
              if '<a ' in inner:
                  raise SystemExit(f'{id_}: already linked')
              replacement = f'<h{level} id="{id_}"><a href="{href}"{attrs}>{inner}</a></h{level}>'
              text, n = pattern.subn(replacement, text, count=1)
              if n != 1:
                  raise SystemExit(f'{id_}: replacement failed')

          new_ids = re.findall(r'\bid="([^"]+)"', text)
          if original_ids != new_ids:
              raise SystemExit('ID sequence changed')
          new_headings = re.findall(r'<h([1-6]) id="([^"]+)">(.*?)</h\1>', text, flags=re.S)
          if len(original_headings) != len(new_headings):
              raise SystemExit('Heading count changed')
          strip_tags=lambda s: re.sub(r'<[^>]+>','',s)
          for old,new in zip(original_headings,new_headings):
              if old[:2] != new[:2] or strip_tags(old[2]) != strip_tags(new[2]):
                  raise SystemExit(f'Heading semantic mismatch: {old[:2]} vs {new[:2]}')

          assert text.count(f'href="{PROFILE}" rel="me external"') >= 18
          assert text.count(f'href="{REELS}" rel="external"') >= 18
          assert text.count(f'href="{GRAPH}" type="application/ld+json"') >= 19
          assert 'nofollow' not in '\n'.join(re.findall(r'<h[2-5][^>]*>.*?</h[2-5]>', text, flags=re.S))

          path.write_text(text, encoding='utf-8')
          print('PASS: 55 semantic heading links patched')

      - name: Validate and commit exact patch
        run: |
          git diff --check
          test "$(git diff --name-only)" = "src/pages/index.md"
          test "$(git diff --numstat | awk '{print $1}')" = "55"
          test "$(git diff --numstat | awk '{print $2}')" = "55"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/index.md
          git commit -m "Add semantic heading links to entity destinations"
          git push origin HEAD:main

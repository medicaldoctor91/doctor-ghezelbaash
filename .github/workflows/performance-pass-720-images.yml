name: Performance pass with 720 pixel delivery images

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/performance-pass-720-images.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install deterministic media and RDF tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends webp
          python -m pip install --disable-pip-version-check rdflib==7.1.4
      - name: Generate metadata-free delivery derivatives
        run: |
          set -euo pipefail
          cwebp -quiet -q 76 -m 6 -metadata none -resize 720 480 public/media/images/physician/master/saeed-ghezelbaash-physician-portrait.jpg -o public/media/images/physician/saeed-ghezelbash-portrait-720.webp
          cwebp -quiet -q 76 -m 6 -metadata none -resize 720 480 public/media/images/physician/master/saeed-ghezelbaash-with-clinical-team.jpg -o public/media/images/physician/saeed-ghezelbash-with-clinic-team-720.webp
          cwebp -quiet -q 76 -m 6 -metadata none -resize 720 480 public/media/images/physician/master/saeed-ghezelbaash-in-clinical-office.jpg -o public/media/images/physician/saeed-ghezelbash-in-clinical-office-720.webp
      - name: Wire responsive sources and provenance
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from rdflib import Graph
          import hashlib,json
          ROOT='https://www.ghezelbaash.ir/'
          PERSON=ROOT+'#saeed-ghezelbash'; CLINIC=ROOT+'#dr-saeed-ghezelbash-aesthetic-clinic-kermanshah'; WEBPAGE=ROOT+'#webpage'; LICENSE='https://creativecommons.org/licenses/by/4.0/'
          page=Path('src/pages/index.md');s=page.read_text(encoding='utf-8')
          specs=[
            ('saeed-ghezelbash-portrait','saeed-ghezelbash-portrait-640.webp','saeed-ghezelbash-portrait-720.webp'),
            ('saeed-ghezelbash-clinical-examination','saeed-ghezelbash-in-clinical-office-640.webp','saeed-ghezelbash-in-clinical-office-720.webp'),
            ('saeed-ghezelbash-with-clinic-team','saeed-ghezelbash-with-clinic-team-640.webp','saeed-ghezelbash-with-clinic-team-720.webp'),
          ]
          for legacy,old640,new720 in specs:
            old=f'srcset="/media/images/physician/{old640} 640w, /media/images/physician/{legacy}-960.webp 960w, /media/images/physician/{legacy}-1600.webp 1600w"'
            new=f'srcset="/media/images/physician/{old640} 640w, /media/images/physician/{new720} 720w, /media/images/physician/{legacy}-960.webp 960w, /media/images/physician/{legacy}-1600.webp 1600w"'
            if s.count(old)!=1:raise SystemExit(f'srcset marker mismatch {legacy}: {s.count(old)}')
            s=s.replace(old,new,1)
            oldimg=f'src="/media/images/physician/{old640}"\n      width="640"\n      height="427"'
            newimg=f'src="/media/images/physician/{new720}"\n      width="720"\n      height="480"'
            if s.count(oldimg)!=1:raise SystemExit(f'img marker mismatch {legacy}: {s.count(oldimg)}')
            s=s.replace(oldimg,newimg,1)
          page.write_text(s,encoding='utf-8')

          gp=Path('public/graph.jsonld');doc=json.loads(gp.read_text(encoding='utf-8'));graph=doc['@graph'];by={n.get('@id'):n for n in graph if isinstance(n,dict) and n.get('@id')}
          masters={}
          for n in graph:
            if not isinstance(n,dict) or 'ImageObject' not in ([n.get('@type')] if isinstance(n.get('@type'),str) else n.get('@type',[])):continue
            u=str(n.get('contentUrl',''))
            for key,filename in [('portrait','saeed-ghezelbaash-physician-portrait.jpg'),('team','saeed-ghezelbaash-with-clinical-team.jpg'),('office','saeed-ghezelbaash-in-clinical-office.jpg')]:
              if u.endswith('/master/'+filename):masters[key]=n['@id']
          if set(masters)!= {'portrait','team','office'}:raise SystemExit(f'master resolution failed: {masters}')
          rows=[
            ('portrait',ROOT+'#image-saeed-ghezelbash-portrait-responsive-720','public/media/images/physician/saeed-ghezelbash-portrait-720.webp',ROOT+'media/images/physician/saeed-ghezelbash-portrait-720.webp','https://commons.wikimedia.org/wiki/File:Saeed-Ghezelbaash-physician-portrait.jpg','دکتر سعید قزلباش، پزشک ایرانی','Dr. Saeed Ghezelbaash, Iranian physician','دکتر سعید قزلباش، پزشک ایرانی فعال در حوزه پزشکی زیبایی، با روپوش سفید و گوشی پزشکی در یک محیط بالینی در کرمانشاه، ایران.','Dr. Saeed Ghezelbaash, an Iranian physician in aesthetic medicine, wearing a white medical coat and stethoscope in a clinical setting in Kermanshah, Iran.',[PERSON]),
            ('team',ROOT+'#image-saeed-ghezelbash-clinic-team-responsive-720','public/media/images/physician/saeed-ghezelbash-with-clinic-team-720.webp',ROOT+'media/images/physician/saeed-ghezelbash-with-clinic-team-720.webp','https://commons.wikimedia.org/wiki/File:Saeed-Ghezelbaash-with-clinical-team.jpg','سعید قزلباش همراه اعضای تیم بالینی','Saeed Ghezelbaash with members of his clinical team','دکتر سعید قزلباش، پزشک ایرانی فعال در حوزه پزشکی زیبایی، با لباس پزشکی و گوشی پزشکی، همراه با اعضای تیم بالینی در یک محیط درمانی در کرمانشاه، ایران.','Dr. Saeed Ghezelbaash, an Iranian physician in aesthetic medicine, wearing medical scrubs and a stethoscope with members of his clinical team in Kermanshah, Iran.',[PERSON,CLINIC]),
            ('office',ROOT+'#image-saeed-ghezelbash-clinical-office-responsive-720','public/media/images/physician/saeed-ghezelbash-in-clinical-office-720.webp',ROOT+'media/images/physician/saeed-ghezelbash-in-clinical-office-720.webp','https://commons.wikimedia.org/wiki/File:Saeed-Ghezelbaash-in-clinical-office.jpg','سعید قزلباش در محیط بالینی','Saeed Ghezelbaash in a clinical office','دکتر سعید قزلباش، پزشک ایرانی فعال در حوزه پزشکی زیبایی، با روپوش سفید و گوشی پزشکی، نشسته پشت میز در محیط بالینی خود در کرمانشاه، ایران.','Dr. Saeed Ghezelbaash, an Iranian physician in aesthetic medicine, seated at a desk in his clinical office in Kermanshah, Iran, wearing a white coat and stethoscope.',[PERSON,CLINIC]),
          ]
          for key,node_id,path,url,commons,name_fa,name_en,desc_fa,desc_en,about in rows:
            data=Path(path).read_bytes()
            if node_id in by:raise SystemExit('planned node already exists '+node_id)
            n={'@id':node_id,'@type':'ImageObject','name':[{'@value':name_fa,'@language':'fa'},{'@value':name_en,'@language':'en'}],'caption':[{'@value':name_fa,'@language':'fa'},{'@value':name_en,'@language':'en'}],'description':[{'@value':desc_fa,'@language':'fa'},{'@value':desc_en,'@language':'en'}],'contentUrl':url,'encodingFormat':'image/webp','width':720,'height':480,'contentSize':f'{len(data)} bytes','sha256':hashlib.sha256(data).hexdigest(),'about':[{'@id':x} for x in about],'creator':{'@id':PERSON},'copyrightHolder':{'@id':PERSON},'creditText':'Dr. Saeed Ghezelbaash / Wikimedia Commons, CC BY 4.0','copyrightNotice':'© Dr. Saeed Ghezelbaash. Licensed under CC BY 4.0.','license':LICENSE,'acquireLicensePage':commons,'dateCreated':'2023-05-29','representativeOfPage':False,'isBasedOn':{'@id':masters[key]},'isPartOf':{'@id':WEBPAGE}}
            graph.append(n);by[node_id]=n
            m=by[masters[key]];enc=m.setdefault('encoding',[])
            if isinstance(enc,dict):enc=[enc];m['encoding']=enc
            enc.append({'@id':node_id})
          for n in graph:
            t=n.get('@type',[]);t=[t] if isinstance(t,str) else t
            if 'Dataset' in t and ('graph.jsonld#dataset' in n.get('@id','') or n.get('@id','').endswith('#dataset')):
              n['version']='1.1.1';n['dateModified']='2026-07-28'
          gp.write_text(json.dumps(doc,ensure_ascii=False,separators=(',',':')),encoding='utf-8')
          source=gp.read_bytes();g=Graph().parse(data=source.decode(),format='json-ld');nt=sorted(x for x in g.serialize(format='nt').splitlines() if x.strip());canonical=('\n'.join(nt)+'\n').encode();ttl=g.serialize(format='turtle');header=f'# Derived losslessly from https://www.ghezelbaash.ir/graph.jsonld\n# Source SHA-256: {hashlib.sha256(source).hexdigest()}\n# RDF triples: {len(g)}\n# Canonical sorted N-Triples SHA-256: {hashlib.sha256(canonical).hexdigest()}\n\n';Path('public/graph.ttl').write_text(header+ttl,encoding='utf-8')
          PY
          git diff --check
      - name: Build and benchmark
        run: |
          npm ci --no-audit --no-fund
          npm run build
          mkdir -p tmp/images720
          nohup python3 -m http.server 4173 --directory dist >tmp/images720/server.log 2>&1 &
          echo $! >tmp/images720/server.pid
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          npx --yes lighthouse@latest http://127.0.0.1:4173/ --output=json --output-path=tmp/images720/mobile.json --only-categories=performance,accessibility,best-practices,seo --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage' --quiet
          npx --yes lighthouse@latest http://127.0.0.1:4173/ --preset=desktop --output=json --output-path=tmp/images720/desktop.json --only-categories=performance,accessibility,best-practices,seo --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage' --quiet
          kill $(cat tmp/images720/server.pid) || true
      - name: Evaluate image delivery
        id: evaluate
        run: |
          set +e
          python3 - <<'PY'
          from pathlib import Path
          import json
          baseline={'mobile':{'performance':56},'desktop':{'performance':86}}
          r={'accepted':False}
          for mode in ('mobile','desktop'):
            d=json.loads(Path(f'tmp/images720/{mode}.json').read_text());a=d['audits'];c=d['categories'];items=a.get('image-delivery-insight',{}).get('details',{}).get('items',[]);req=a.get('network-requests',{}).get('details',{}).get('items',[])
            r[mode]={'performance':round(c['performance']['score']*100),'accessibility':round(c['accessibility']['score']*100),'bestPractices':round(c['best-practices']['score']*100),'seo':round(c['seo']['score']*100),'fcp':a['first-contentful-paint']['numericValue'],'lcp':a['largest-contentful-paint']['numericValue'],'tbt':a['total-blocking-time']['numericValue'],'cls':a['cumulative-layout-shift']['numericValue'],'mainthread':a['mainthread-work-breakdown']['numericValue'],'imageSavings':a.get('image-delivery-insight',{}).get('displayValue'),'wastedBytes':sum(x.get('wastedBytes',0) or 0 for x in items),'physicianRequests':[{'url':x.get('url'),'priority':x.get('priority'),'transferSize':x.get('transferSize'),'resourceSize':x.get('resourceSize')} for x in req if 'media/images/physician/' in x.get('url','')]}
          r['assetBytes']={p.name:p.stat().st_size for p in Path('public/media/images/physician').glob('*-720.webp')}
          r['htmlBytes']=Path('dist/index.html').stat().st_size
          quality=all(r[m][k]==100 for m in ('mobile','desktop') for k in ('accessibility','bestPractices','seo'))
          stable=all(r[m]['cls']<0.02 for m in ('mobile','desktop'))
          scores=r['mobile']['performance']>=54 and r['desktop']['performance']>=84
          selected=any('-720.webp' in x['url'] for x in r['mobile']['physicianRequests'])
          r['accepted']=bool(quality and stable and scores and selected and r['htmlBytes']<1900000)
          Path('tmp/performance-images720.json').write_text(json.dumps(r,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(r,indent=2))
          raise SystemExit(0 if r['accepted'] else 1)
          PY
          rc=$?
          if [ "$rc" -eq 0 ]; then echo 'accepted=true' >> "$GITHUB_OUTPUT"; else echo 'accepted=false' >> "$GITHUB_OUTPUT"; fi
          exit 0
      - name: Roll back rejected experiment
        if: steps.evaluate.outputs.accepted != 'true'
        run: |
          git reset --hard HEAD
          git clean -fd -e tmp/performance-images720.json
      - name: Commit result
        run: |
          git config user.name 'OpenAI Project Automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/performance-pass-720-images.yml
          rm -rf tmp/images720
          git add -A
          if [ "${{ steps.evaluate.outputs.accepted }}" = "true" ]; then git commit -m 'Add right-sized 720px physician delivery derivatives'; else git commit -m 'Record rejected 720px image benchmark'; fi
          git push origin HEAD:main

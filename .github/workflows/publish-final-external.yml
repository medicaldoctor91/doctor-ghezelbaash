name: Publish final external distribution

on:
  workflow_dispatch:
    inputs:
      release_run_id:
        description: Successful main V2 dist run containing the verified live distribution
        required: true
      source_commit:
        description: Exact deployed source commit
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: final-external-distribution
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_commit }}
          persist-credentials: false

      - name: Check the successful production release identity
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_RUN: ${{ inputs.release_run_id }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          commit=os.environ['SOURCE_COMMIT']; run=os.environ['RELEASE_RUN']
          if not re.fullmatch(r'[a-f0-9]{40}',commit) or not re.fullmatch(r'[0-9]+',run): raise RuntimeError('Invalid release identity')
          repo='medicaldoctor91/doctor-ghezelbaash'
          current=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/commits/main']))['sha']
          release=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/actions/runs/{run}']))
          if current!=commit or release['head_sha']!=commit or release['head_branch']!='main' or release['conclusion']!='success' or release['path']!='.github/workflows/build.yml':
              raise RuntimeError('Requested artifact is not the successful current main release')
          PY

      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.release_run_id }}
          name: v2-dist-${{ inputs.source_commit }}
          path: final-artifact

      - name: Bind external publication to the verified live artifact
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          root=Path('final-artifact'); commit=os.environ['SOURCE_COMMIT']
          for file in ['dist/release-provenance.json','release/verification-report.json','release/live-verification.json']:
              data=json.loads((root/file).read_text())
              if data.get('sourceCommit')!=commit: raise RuntimeError('Artifact/report commit differs: '+file)
              if 'report' in file and (data.get('status')!='PASS' or not data.get('postSealReadOnly')): raise RuntimeError('Release was not verified read-only')
              if 'live-verification' in file and data.get('status')!='PASS': raise RuntimeError('Live distribution did not match')
          PY

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install publication and Parquet clients
        run: python -m pip install --disable-pip-version-check 'huggingface_hub==1.32.0' 'pyarrow==21.0.0' 'datasets==4.4.1'

      - name: Publish and read back final Hugging Face bytes and Zenodo professional metadata
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          HF_HUB_DISABLE_TELEMETRY: '1'
          HF_TOKEN: ${{ secrets.HF_TOKEN || secrets.HUGGINGFACE_TOKEN || secrets.HUGGING_FACE_TOKEN }}
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN || secrets.ZENODO_ACCESS_TOKEN || secrets.ZENODO_API_TOKEN || secrets.ZENODO_API_KEY || secrets.ZENODO_PAT }}
        run: |
          test -n "$HF_TOKEN"
          test -n "$ZENODO_TOKEN"
          echo "::add-mask::$HF_TOKEN"
          echo "::add-mask::$ZENODO_TOKEN"
          python infrastructure/publish-final-distribution.py --dist final-artifact/dist --commit "$SOURCE_COMMIT" --publish

      - name: Verify public Viewer configurations load at the published revision
        run: |
          python3 - <<'PY'
          import json
          from datasets import load_dataset
          report=json.load(open('release/external-publication.json'))
          revision=report['huggingFace']['revision']
          for name,count in report['package']['tables'].items():
              data=load_dataset('doctor-ghezelbaash/dr-saeid-ghezelbaash-entity-data',name,split='train',revision=revision)
              if len(data)!=count: raise RuntimeError('Public table row count differs: '+name)
              print(name,len(data),'PASS')
          PY

      - name: Retain the exact external package and publication proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-external-${{ inputs.source_commit }}
          path: release/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

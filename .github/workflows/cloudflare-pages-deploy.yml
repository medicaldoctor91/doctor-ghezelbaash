name: Verify canonical Cloudflare Git deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: doctor-ghezelbaash-external-mutation
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      CF_EXPECTED_ENVIRONMENT: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - name: Load canonical platform contract
        shell: bash
        run: |
          set -euo pipefail
          node scripts/export-platform-contract.mjs >> "$GITHUB_ENV"
          node scripts/validate-platform-contract.mjs
      - name: Enforce canonical deployment ref
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/$CF_PRODUCTION_BRANCH"
      - name: Rebuild exact deployment commit
        shell: bash
        run: |
          set -euo pipefail
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          export CF_PAGES_COMMIT_SHA="$GITHUB_SHA"
          npm run build
      - name: Converge Cloudflare Pages to canonical Git deployment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          node scripts/ensure-cloudflare-pages-git-deployment.mjs --configure
          node scripts/ensure-cloudflare-pages-git-deployment.mjs --verify-config
      - name: Verify native Git deployment identity
        id: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          node scripts/ensure-cloudflare-pages-git-deployment.mjs
      - name: Purge production edge cache with ephemeral least-privilege token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          python scripts/configure-cloudflare-edge.py \
            --purge-cache-only \
            --outcome edge-cache-purge.json
      - name: Verify exact production serving and sample T+0 discovery
        env:
          CANDIDATE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          node scripts/verify-cloudflare-pages-deployment.mjs
          npm run verify:production
          node scripts/verify-current-serving.mjs
          if npm run verify:public-discovery; then
            echo 'PUBLIC_DISCOVERY_T0_PASS'
          else
            echo '::warning::T+0 public discovery sampled a stale Cloudflare PoP after exact production bytes were already proven; delayed convergence gates will decide final success.'
          fi
      - name: Require public discovery convergence by T+5m
        run: |
          set -euo pipefail
          sleep 120
          if npm run verify:public-discovery; then
            echo 'PUBLIC_DISCOVERY_T2_PASS'
          else
            echo '::warning::T+2 public discovery still sampled distributed edge drift; T+5 remains the hard convergence gate.'
          fi
          sleep 180
          npm run verify:public-discovery
          node scripts/verify-current-serving.mjs
          echo 'PUBLIC_DISCOVERY_T5_HARD_PASS'

name: Verify canonical Cloudflare Git deployment

on:
  push:
    branches: [production/deploy, staging/deploy]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: doctor-ghezelbaash-external-mutation
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      CF_PROJECT: doctor-ghezelbaash
      CLOUDFLARE_ACCOUNT_ID: 884d1d90bd1fb6ecca14992c6c60d677
      CF_PRODUCTION_BRANCH: production/deploy
      CF_PREVIEW_BRANCH: staging/deploy
      ZONE_NAME: ghezelbaash.ir
      CANONICAL_HOST: www.ghezelbaash.ir
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - name: Resolve deployment environment
        shell: bash
        run: |
          set -euo pipefail
          case "$GITHUB_REF" in
            refs/heads/production/deploy) echo 'CF_EXPECTED_ENVIRONMENT=production' >> "$GITHUB_ENV" ;;
            refs/heads/staging/deploy) echo 'CF_EXPECTED_ENVIRONMENT=preview' >> "$GITHUB_ENV" ;;
            *) echo "Unexpected deployment ref: $GITHUB_REF" >&2; exit 1 ;;
          esac
      - name: Rebuild exact deployment commit
        shell: bash
        run: |
          set -euo pipefail
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          export CF_PAGES_COMMIT_SHA="$GITHUB_SHA"
          npm run build
      - name: Verify native Git deployment identity
        id: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          node scripts/ensure-cloudflare-pages-git-deployment.mjs --verify-config
          node scripts/ensure-cloudflare-pages-git-deployment.mjs
      - name: Verify preview bytes against exact local build
        if: github.ref == 'refs/heads/staging/deploy'
        env:
          VERIFY_BASE_URL: ${{ steps.cloudflare.outputs.deployment_url }}
          CANDIDATE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          node scripts/verify-cloudflare-pages-deployment.mjs
      - name: Purge production edge cache with ephemeral least-privilege token
        if: github.ref == 'refs/heads/production/deploy'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          python scripts/configure-cloudflare-edge.py \
            --purge-cache-only \
            --outcome edge-cache-purge.json
      - name: Verify production bytes, current serving, and T+0 discovery freshness
        if: github.ref == 'refs/heads/production/deploy'
        env:
          CANDIDATE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          node scripts/verify-cloudflare-pages-deployment.mjs
          npm run verify:production
          node scripts/verify-current-serving.mjs
          npm run verify:public-discovery
      - name: Reverify ordinary and cache-busted discovery at T+2m and T+5m
        if: github.ref == 'refs/heads/production/deploy'
        run: |
          set -euo pipefail
          sleep 120
          npm run verify:public-discovery
          sleep 180
          npm run verify:public-discovery

name: Verify canonical Cloudflare Git deployment

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      action:
        description: Cloudflare operation
        type: choice
        required: true
        default: deployment
        options:
          - deployment
          - audit
          - strengthen

permissions:
  contents: read

concurrency:
  group: doctor-ghezelbaash-external-mutation
  cancel-in-progress: false
  queue: max

jobs:
  verify:
    if: github.event_name != 'workflow_dispatch' || inputs.action == 'deployment'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
      CF_EXPECTED_ENVIRONMENT: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Select only the current main revision
        id: tip
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if [ "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)" ]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          else
            echo 'current=false' >> "$GITHUB_OUTPUT"
            echo 'STALE_MAIN_REVISION_SKIPPED'
          fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        if: steps.tip.outputs.current == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        if: steps.tip.outputs.current == 'true'
        with:
          python-version: "3.14.6"
      - if: steps.tip.outputs.current == 'true'
        run: npm ci
      - name: Enforce high-severity dependency advisory gate
        if: steps.tip.outputs.current == 'true'
        run: npm run security:dependencies
      - name: Load canonical platform contract
        if: steps.tip.outputs.current == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/platform-contract.mjs export >> "$GITHUB_ENV"
          node scripts/platform-contract.mjs validate
      - name: Enforce canonical deployment ref
        if: steps.tip.outputs.current == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/$CF_PRODUCTION_BRANCH"
      - name: Rebuild exact deployment commit
        if: steps.tip.outputs.current == 'true'
        shell: bash
        run: |
          set -euo pipefail
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          export CF_PAGES_COMMIT_SHA="$GITHUB_SHA"
          npm run build
      - name: Converge Cloudflare Pages to canonical Git deployment
        if: steps.tip.outputs.current == 'true'
        id: pages-config
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          node scripts/cloudflare-pages.mjs ensure --configure
          node scripts/cloudflare-pages.mjs ensure --verify-config
      - name: Verify native Git deployment identity
        if: steps.tip.outputs.current == 'true'
        id: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_EXPECTED_COMMIT: ${{ github.sha }}
          CF_CONFIGURATION_CHANGED: ${{ steps.pages-config.outputs.configuration_changed }}
        run: |
          set -euo pipefail
          node scripts/cloudflare-pages.mjs ensure
      - name: Validate edge contract without control-plane mutation
        if: steps.tip.outputs.current == 'true'
        run: npm run validate:cloudflare
      - name: Reconcile canonical Cloudflare edge
        if: steps.tip.outputs.current == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          python scripts/configure-cloudflare-edge.py \
            --apply \
            --outcome edge-reconciliation.json
      - name: Canonicalize exact Pages.dev root URL
        if: steps.tip.outputs.current == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/configure-pages-dev-redirect.py
          for attempt in $(seq 1 30); do
            headers="$(mktemp)"
            status="$(curl --silent --show-error --max-time 15 --max-redirs 0 --output /dev/null --dump-header "$headers" --write-out '%{http_code}' 'https://doctor-ghezelbaash.pages.dev/')"
            location="$(awk 'BEGIN{IGNORECASE=1} /^location:/ {sub(/^[^:]*:[[:space:]]*/, ""); sub(/\r$/, ""); print; exit}' "$headers")"
            rm -f "$headers"
            if [ "$status" = '301' ] && [ "$location" = 'https://www.ghezelbaash.ir/' ]; then
              echo 'PAGES_DEV_ROOT_REDIRECT_PUBLIC_PASS'
              break
            fi
            if [ "$attempt" = '30' ]; then
              echo "Pages.dev redirect did not converge: status=$status location=$location" >&2
              exit 1
            fi
            sleep 2
          done
      - name: Verify exact production serving and sample T+0 discovery
        if: steps.tip.outputs.current == 'true'
        env:
          CANDIDATE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          node scripts/cloudflare-pages.mjs verify
          npm run verify:production
          node scripts/verify-live.mjs current --website-only
          if npm run verify:public-discovery; then
            echo 'PUBLIC_DISCOVERY_T0_PASS'
          else
            echo '::warning::T+0 public discovery sampled a stale Cloudflare PoP after exact production bytes were already proven; delayed convergence gates will decide final success.'
          fi
      - name: Require public discovery convergence by T+5m
        if: steps.tip.outputs.current == 'true'
        run: |
          set -euo pipefail
          sleep 120
          if npm run verify:public-discovery; then
            echo 'PUBLIC_DISCOVERY_T2_PASS'
          else
            echo '::warning::T+2 public discovery still sampled distributed edge drift; T+5 remains the hard convergence gate.'
          fi
          sleep 180
          npm run verify:public-discovery
          node scripts/verify-live.mjs current --website-only
          echo 'PUBLIC_DISCOVERY_T5_HARD_PASS'
      - name: Install pinned Chromium for production media verification
        if: steps.tip.outputs.current == 'true'
        run: npx playwright install --with-deps --only-shell chromium
      - name: Require video Range integrity and exact browser seek outcomes
        if: steps.tip.outputs.current == 'true'
        run: npm run verify:video-production
      - name: Notify IndexNow after verified production convergence
        if: steps.tip.outputs.current == 'true'
        run: |
          set -euo pipefail
          npm run indexnow:submit

  delivery:
    if: github.event_name == 'workflow_dispatch' && (inputs.action == 'audit' || inputs.action == 'strengthen')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14.6"
      - name: Load public Cloudflare delivery scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          contract = json.loads(Path('.release/policy/platform-contract.json').read_text())
          cloudflare = contract['cloudflare']
          values = {
              'CLOUDFLARE_ACCOUNT_ID': cloudflare['accountId'],
              'CF_PROJECT': cloudflare['pagesProject'],
              'CF_PRODUCTION_BRANCH': cloudflare['productionBranch'],
              'CF_EXPECTED_ENVIRONMENT': cloudflare['expectedEnvironment'],
              'ZONE_NAME': contract['zoneName'],
              'CANONICAL_HOST': contract['canonicalHost'],
          }
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              for key, value in values.items():
                  if not isinstance(value, str) or not value.strip() or '\n' in value or '\r' in value:
                      raise SystemExit(f'Invalid public platform value: {key}')
                  output.write(f'{key}={value}\n')
          Path('.release').mkdir(exist_ok=True)
          PY
      - name: Audit or strengthen current public delivery
        shell: bash
        env:
          DELIVERY_ACTION: ${{ inputs.action }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          case "$DELIVERY_ACTION" in
            audit) arguments=(--audit-delivery) ;;
            strengthen) arguments=(--strengthen-delivery --rollback-snapshot .release/cloudflare-compression-before.json) ;;
            *) echo 'Unsupported Cloudflare delivery action' >&2; exit 1 ;;
          esac
          python scripts/configure-cloudflare-edge.py "${arguments[@]}" \
            --outcome .release/cloudflare-delivery-audit.json
      - name: Preserve delivery audit and compression rollback state
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cloudflare-delivery-${{ inputs.action }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .release/cloudflare-delivery-audit.json
            .release/cloudflare-compression-before.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

name: Canonical Cloudflare production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: doctor-ghezelbaash-external-mutation
  cancel-in-progress: false
  queue: max

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
      CF_EXPECTED_ENVIRONMENT: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Select only the current main revision
        id: tip
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if [ "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)" ]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          else
            echo 'current=false' >> "$GITHUB_OUTPUT"
            echo 'STALE_MAIN_REVISION_SKIPPED'
          fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        if: steps.tip.outputs.current == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        if: steps.tip.outputs.current == 'true'
        with:
          python-version: "3.14.6"
      - if: steps.tip.outputs.current == 'true'
        run: npm ci
      - name: Enforce dependency security before production mutation
        if: steps.tip.outputs.current == 'true'
        run: npm run security:dependencies
      - name: Load canonical platform contract
        if: steps.tip.outputs.current == 'true'
        run: node scripts/platform-contract.mjs export >> "$GITHUB_ENV"
      - name: Enforce canonical deployment ref
        if: steps.tip.outputs.current == 'true'
        run: test "$GITHUB_REF" = "refs/heads/$CF_PRODUCTION_BRANCH"
      - name: Build exact production distribution
        if: steps.tip.outputs.current == 'true'
        shell: bash
        run: |
          set -euo pipefail
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          export CF_PAGES_COMMIT_SHA="$GITHUB_SHA"
          npm run build
      - name: Converge Cloudflare Pages Git deployment
        if: steps.tip.outputs.current == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          node scripts/cloudflare-pages.mjs ensure --configure
          node scripts/cloudflare-pages.mjs ensure --verify-config
          node scripts/cloudflare-pages.mjs ensure
      - name: Reconcile canonical Cloudflare edge
        if: steps.tip.outputs.current == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python scripts/configure-cloudflare-edge.py --apply --outcome edge-reconciliation.json
      - name: Canonicalize Pages.dev root
        if: steps.tip.outputs.current == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python scripts/configure-pages-dev-redirect.py
      - name: Notify IndexNow
        if: steps.tip.outputs.current == 'true'
        run: npm run indexnow:submit

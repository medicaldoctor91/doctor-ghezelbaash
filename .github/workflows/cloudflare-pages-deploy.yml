name: Verify canonical Cloudflare Git deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: doctor-ghezelbaash-external-mutation
  cancel-in-progress: false
  queue: max

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
      CF_EXPECTED_ENVIRONMENT: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Select only the current main revision
        id: tip
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if [ "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)" ]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          else
            echo 'current=false' >> "$GITHUB_OUTPUT"
            echo 'STALE_MAIN_REVISION_SKIPPED'
          fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        if: steps.tip.outputs.current == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        if: steps.tip.outputs.current == 'true'
        with:
          python-version: "3.14.6"
      - if: steps.tip.outputs.current == 'true'
        run: npm ci
      - name: Enforce high-severity dependency advisory gate
        if: steps.tip.outputs.current == 'true'
        run: npm run security:dependencies
      - name: Load canonical platform contract
        if: steps.tip.outputs.current == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/platform-contract.mjs export >> "$GITHUB_ENV"
          node scripts/platform-contract.mjs validate
      - name: Enforce canonical deployment ref
        if: steps.tip.outputs.current == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/$CF_PRODUCTION_BRANCH"
      - name: Rebuild exact deployment commit
        if: steps.tip.outputs.current == 'true'
        shell: bash
        run: |
          set -euo pipefail
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          export CF_PAGES_COMMIT_SHA="$GITHUB_SHA"
          npm run build
      - name: Converge Cloudflare Pages to canonical Git deployment
        if: steps.tip.outputs.current == 'true'
        id: pages-config
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          node scripts/cloudflare-pages.mjs ensure --configure
          node scripts/cloudflare-pages.mjs ensure --verify-config
      - name: Verify native Git deployment identity
        if: steps.tip.outputs.current == 'true'
        id: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_EXPECTED_COMMIT: ${{ github.sha }}
          CF_CONFIGURATION_CHANGED: ${{ steps.pages-config.outputs.configuration_changed }}
        run: |
          set -euo pipefail
          node scripts/cloudflare-pages.mjs ensure
      - name: Validate edge contract without control-plane mutation
        if: steps.tip.outputs.current == 'true'
        run: npm run validate:cloudflare
      - name: Reconcile canonical Cloudflare edge
        if: steps.tip.outputs.current == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          python scripts/configure-cloudflare-edge.py \
            --apply \
            --outcome edge-reconciliation.json
      - name: Canonicalize exact Pages.dev root URL
        if: steps.tip.outputs.current == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/configure-pages-dev-redirect.py
          for attempt in $(seq 1 30); do
            headers="$(mktemp)"
            status="$(curl --silent --show-error --max-time 15 --max-redirs 0 --output /dev/null --dump-header "$headers" --write-out '%{http_code}' 'https://doctor-ghezelbaash.pages.dev/')"
            location="$(awk 'BEGIN{IGNORECASE=1} /^location:/ {sub(/^[^:]*:[[:space:]]*/, ""); sub(/\r$/, ""); print; exit}' "$headers")"
            rm -f "$headers"
            if [ "$status" = '301' ] && [ "$location" = 'https://www.ghezelbaash.ir/' ]; then
              echo 'PAGES_DEV_ROOT_REDIRECT_PUBLIC_PASS'
              break
            fi
            if [ "$attempt" = '30' ]; then
              echo "Pages.dev redirect did not converge: status=$status location=$location" >&2
              exit 1
            fi
            sleep 2
          done
      - name: Verify exact production serving and sample T+0 discovery
        if: steps.tip.outputs.current == 'true'
        env:
          CANDIDATE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          node scripts/cloudflare-pages.mjs verify
          npm run verify:production
          node scripts/verify-live.mjs current --website-only
          if npm run verify:public-discovery; then
            echo 'PUBLIC_DISCOVERY_T0_PASS'
          else
            echo '::warning::T+0 public discovery sampled a stale Cloudflare PoP after exact production bytes were already proven; delayed convergence gates will decide final success.'
          fi
      - name: Require public discovery convergence by T+5m
        if: steps.tip.outputs.current == 'true'
        run: |
          set -euo pipefail
          sleep 120
          if npm run verify:public-discovery; then
            echo 'PUBLIC_DISCOVERY_T2_PASS'
          else
            echo '::warning::T+2 public discovery still sampled distributed edge drift; T+5 remains the hard convergence gate.'
          fi
          sleep 180
          npm run verify:public-discovery
          node scripts/verify-live.mjs current --website-only
          echo 'PUBLIC_DISCOVERY_T5_HARD_PASS'
      - name: Install pinned Chromium for production media verification
        if: steps.tip.outputs.current == 'true'
        run: npx playwright install --with-deps --only-shell chromium
      - name: Require video Range integrity and exact browser seek outcomes
        if: steps.tip.outputs.current == 'true'
        run: npm run verify:video-production
      - name: Notify IndexNow after verified production convergence
        if: steps.tip.outputs.current == 'true'
        run: |
          set -euo pipefail
          npm run indexnow:submit

  release-bootstrap:
    if: >-
      github.event_name == 'push' &&
      startsWith(github.event.head_commit.message, 'release-request: v')
    needs: verify
    permissions:
      actions: write
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14.6"
      - name: Parse exact release request and require current main
        id: release-request
        shell: bash
        run: |
          set -euo pipefail
          title="$(git log -1 --format=%s)"
          if [[ ! "$title" =~ ^release-request:\ v([0-9]+\.[0-9]+\.[0-9]+)\ medical-review=([0-9]{4}-[0-9]{2}-[0-9]{2})$ ]]; then
            echo "Invalid release-request title: $title" >&2
            exit 1
          fi
          target="${BASH_REMATCH[1]}"
          review_date="${BASH_REMATCH[2]}"
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)"
          current="$(node -p "require('./src/data/release.json').release")"
          node - "$current" "$target" <<'NODE'
          const [current,target]=process.argv.slice(2);
          const parts=v=>v.split('.').map(Number);
          const [a,b]=[parts(current),parts(target)];
          if(a.some(Number.isNaN)||b.some(Number.isNaN)) throw new Error('Invalid semantic version');
          const newer=b[0]>a[0]||(b[0]===a[0]&&b[1]>a[1])||(b[0]===a[0]&&b[1]===a[1]&&b[2]>a[2]);
          if(!newer) throw new Error(`Release request must advance current version: ${current} -> ${target}`);
          NODE
          echo "target=$target" >> "$GITHUB_OUTPUT"
          echo "review_date=$review_date" >> "$GITHUB_OUTPUT"
      - name: Apply medical review atomically
        shell: bash
        run: |
          set -euo pipefail
          node scripts/set-medical-review.mjs "${{ steps.release-request.outputs.review_date }}"
          changed="$(git status --porcelain=v1 --untracked-files=all | cut -c4- | LC_ALL=C sort)"
          expected=$'src/data/release.json\nsrc/data/semantic/knowledge-graph.jsonld'
          test "$changed" = "$expected"
      - run: npm ci
      - name: Enforce high-severity dependency advisory gate
        run: npm run security:dependencies
      - name: Provision release validation tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg
          ffprobe -version
      - name: Validate medical-review candidate before source mutation
        shell: bash
        run: |
          set -euo pipefail
          npm run release
          changed="$(git status --porcelain=v1 --untracked-files=all | cut -c4- | LC_ALL=C sort)"
          expected=$'src/data/release.json\nsrc/data/semantic/knowledge-graph.jsonld'
          test "$changed" = "$expected"
      - name: Commit only the validated medical-review update
        shell: bash
        run: |
          set -euo pipefail
          git add src/data/release.json src/data/semantic/knowledge-graph.jsonld
          git diff --cached --quiet && { echo 'Medical-review candidate produced no change' >&2; exit 1; }
          git config user.name ghezelbaash-release-bot
          git config user.email actions@users.noreply.github.com
          git commit -m "chore: medical review ${{ steps.release-request.outputs.review_date }}"
          test "$(git diff-tree --no-commit-id --name-only -r HEAD | LC_ALL=C sort)" = $'src/data/release.json\nsrc/data/semantic/knowledge-graph.jsonld'
      - name: Publish validated medical-review source to main
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GITHUB_TOKEN:-}"
          echo "::add-mask::$GITHUB_TOKEN"
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD^)" = "$(git rev-parse FETCH_HEAD)"
          GITHUB_AUTH="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $GITHUB_AUTH" push origin HEAD:main
          unset GITHUB_AUTH
      - name: Dispatch exact external authority release transaction
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TARGET: ${{ steps.release-request.outputs.target }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GITHUB_TOKEN:-}"
          echo "::add-mask::$GITHUB_TOKEN"
          payload="$(node -e 'process.stdout.write(JSON.stringify({ref:"main",inputs:{version:process.env.RELEASE_TARGET}}))')"
          status="$(curl --silent --show-error --output /tmp/release-dispatch.out --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --header 'Content-Type: application/json' \
            --data "$payload" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/hugging-face-authority.yml/dispatches")"
          test "$status" = '204' || { cat /tmp/release-dispatch.out >&2; echo "Workflow dispatch HTTP $status" >&2; exit 1; }
          echo "EXTERNAL_AUTHORITY_RELEASE_DISPATCHED $RELEASE_TARGET"

name: Verify canonical Cloudflare Git deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: doctor-ghezelbaash-external-mutation
  cancel-in-progress: false
  queue: max

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
      CF_EXPECTED_ENVIRONMENT: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Select only the current main revision
        id: tip
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if [ "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)" ]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          else
            echo 'current=false' >> "$GITHUB_OUTPUT"
            echo 'STALE_MAIN_REVISION_SKIPPED'
          fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        if: steps.tip.outputs.current == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        if: steps.tip.outputs.current == 'true'
        with:
          python-version: "3.14.6"
      - if: steps.tip.outputs.current == 'true'
        run: npm ci
      - name: Enforce high-severity dependency advisory gate
        if: steps.tip.outputs.current == 'true'
        run: npm run security:dependencies
      - name: Load canonical platform contract
        if: steps.tip.outputs.current == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/platform-contract.mjs export >> "$GITHUB_ENV"
          node scripts/platform-contract.mjs validate
      - name: Enforce canonical deployment ref
        if: steps.tip.outputs.current == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/$CF_PRODUCTION_BRANCH"
      - name: Rebuild exact deployment commit
        if: steps.tip.outputs.current == 'true'
        shell: bash
        run: |
          set -euo pipefail
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          export CF_PAGES_COMMIT_SHA="$GITHUB_SHA"
          npm run build
      - name: Converge Cloudflare Pages to canonical Git deployment
        if: steps.tip.outputs.current == 'true'
        id: pages-config
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          node scripts/cloudflare-pages.mjs ensure --configure
          node scripts/cloudflare-pages.mjs ensure --verify-config
      - name: Verify native Git deployment identity
        if: steps.tip.outputs.current == 'true'
        id: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_EXPECTED_COMMIT: ${{ github.sha }}
          CF_CONFIGURATION_CHANGED: ${{ steps.pages-config.outputs.configuration_changed }}
        run: |
          set -euo pipefail
          node scripts/cloudflare-pages.mjs ensure
      - name: Validate edge contract without control-plane mutation
        if: steps.tip.outputs.current == 'true'
        run: npm run validate:cloudflare
      - name: Reconcile canonical Cloudflare edge
        if: steps.tip.outputs.current == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          python scripts/configure-cloudflare-edge.py \
            --apply \
            --outcome edge-reconciliation.json
      - name: Verify exact production serving and sample T+0 discovery
        if: steps.tip.outputs.current == 'true'
        env:
          CANDIDATE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          node scripts/cloudflare-pages.mjs verify
          npm run verify:production
          node scripts/verify-live.mjs current --website-only
          if npm run verify:public-discovery; then
            echo 'PUBLIC_DISCOVERY_T0_PASS'
          else
            echo '::warning::T+0 public discovery sampled a stale Cloudflare PoP after exact production bytes were already proven; delayed convergence gates will decide final success.'
          fi
      - name: Require public discovery convergence by T+5m
        if: steps.tip.outputs.current == 'true'
        run: |
          set -euo pipefail
          sleep 120
          if npm run verify:public-discovery; then
            echo 'PUBLIC_DISCOVERY_T2_PASS'
          else
            echo '::warning::T+2 public discovery still sampled distributed edge drift; T+5 remains the hard convergence gate.'
          fi
          sleep 180
          npm run verify:public-discovery
          node scripts/verify-live.mjs current --website-only
          echo 'PUBLIC_DISCOVERY_T5_HARD_PASS'
      - name: Reconcile and verify canonical machine compression
        if: steps.tip.outputs.current == 'true'
        id: machine-compression
        timeout-minutes: 10
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          COMPRESSION_EVIDENCE_DIR: ${{ runner.temp }}/machine-compression-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          umask 077
          mkdir "$COMPRESSION_EVIDENCE_DIR"
          python scripts/configure-cloudflare-edge.py \
            --apply-machine-compression \
            --rollback-snapshot "$COMPRESSION_EVIDENCE_DIR/rollback-snapshot.json" \
            --outcome "$COMPRESSION_EVIDENCE_DIR/apply-outcome.json" \
            2>&1 | tee "$COMPRESSION_EVIDENCE_DIR/apply.log"
          for attempt in 1 2 3; do
            if node scripts/verify-live.mjs discovery --require-machine-compression \
              > "$COMPRESSION_EVIDENCE_DIR/verification-$attempt.json" \
              2> "$COMPRESSION_EVIDENCE_DIR/verification-$attempt.log"; then
              echo "MACHINE_COMPRESSION_VERIFIED_ATTEMPT_$attempt"
              exit 0
            fi
            cat "$COMPRESSION_EVIDENCE_DIR/verification-$attempt.log" >&2
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::Machine compression verification attempt $attempt failed; retrying in 15 seconds."
              sleep 15
            fi
          done
          echo '::error::Machine compression failed all three live verification attempts; restoring the captured rule state.'
          exit 1
      - name: Restore machine compression after a failed apply or verification
        if: failure() && steps.machine-compression.outcome == 'failure'
        timeout-minutes: 5
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          COMPRESSION_EVIDENCE_DIR: ${{ runner.temp }}/machine-compression-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          if [ ! -f "$COMPRESSION_EVIDENCE_DIR/rollback-snapshot.json" ]; then
            echo 'MACHINE_COMPRESSION_NO_SNAPSHOT_NO_MUTATION'
            exit 0
          fi
          if python scripts/configure-cloudflare-edge.py \
            --rollback-machine-compression \
            --rollback-snapshot "$COMPRESSION_EVIDENCE_DIR/rollback-snapshot.json" \
            --outcome "$COMPRESSION_EVIDENCE_DIR/rollback-outcome.json" \
            2>&1 | tee "$COMPRESSION_EVIDENCE_DIR/rollback.log"; then
            echo 'MACHINE_COMPRESSION_ROLLBACK_VERIFIED'
          else
            echo '::error::Machine compression rollback failed. The captured snapshot and rollback log require review before another edge mutation.'
            exit 1
          fi
      - name: Upload machine compression transaction evidence
        if: always() && steps.machine-compression.outcome != '' && steps.machine-compression.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: machine-compression-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/machine-compression-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: warn
          retention-days: 7
      - name: Notify IndexNow after verified production convergence
        if: steps.tip.outputs.current == 'true'
        run: |
          set -euo pipefail
          npm run indexnow:submit

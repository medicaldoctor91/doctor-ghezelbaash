name: Verify canonical Cloudflare Git deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: doctor-ghezelbaash-external-mutation
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      CF_PROJECT: doctor-ghezelbaash
      CLOUDFLARE_ACCOUNT_ID: 884d1d90bd1fb6ecca14992c6c60d677
      CF_PRODUCTION_BRANCH: main
      CF_EXPECTED_ENVIRONMENT: production
      ZONE_NAME: ghezelbaash.ir
      CANONICAL_HOST: www.ghezelbaash.ir
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - name: Enforce main-only deployment ref
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/main'
      - name: Rebuild exact deployment commit
        shell: bash
        run: |
          set -euo pipefail
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          export CF_PAGES_COMMIT_SHA="$GITHUB_SHA"
          npm run build
      - name: Converge Cloudflare Pages to main-only Git deployment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          node scripts/ensure-cloudflare-pages-git-deployment.mjs --configure
          node scripts/ensure-cloudflare-pages-git-deployment.mjs --verify-config
      - name: Verify native Git deployment identity
        id: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          node scripts/ensure-cloudflare-pages-git-deployment.mjs
      - name: Purge production edge cache with ephemeral least-privilege token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          python scripts/configure-cloudflare-edge.py \
            --purge-cache-only \
            --outcome edge-cache-purge.json
      - name: Verify production bytes, current serving, and T+0 discovery freshness
        env:
          CANDIDATE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          node scripts/verify-cloudflare-pages-deployment.mjs
          npm run verify:production
          node scripts/verify-current-serving.mjs
          npm run verify:public-discovery
      - name: Reverify ordinary and cache-busted discovery at T+2m and T+5m
        run: |
          set -euo pipefail
          sleep 120
          npm run verify:public-discovery
          sleep 180
          npm run verify:public-discovery

name: Verify canonical Cloudflare Git deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: doctor-ghezelbaash-external-mutation
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      CF_EXPECTED_ENVIRONMENT: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14.6'
      - run: npm ci
      - name: Enforce high-severity dependency advisory gate
        run: npm run audit:dependencies
      - name: Load canonical platform contract
        shell: bash
        run: |
          set -euo pipefail
          node scripts/platform-contract.mjs export >> "$GITHUB_ENV"
          node scripts/platform-contract.mjs validate
      - name: Enforce canonical deployment ref
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/$CF_PRODUCTION_BRANCH"
      - name: Rebuild exact deployment commit
        shell: bash
        run: |
          set -euo pipefail
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          export CF_PAGES_COMMIT_SHA="$GITHUB_SHA"
          npm run build
      - name: Resolve current authority release
        shell: bash
        run: |
          set -euo pipefail
          echo "CURRENT_VERSION=$(node -p \"require('./src/data/release.json').release\")" >> "$GITHUB_ENV"
          echo "CURRENT_RECORD=$(node -p \"require('./src/data/release.json').dataset.zenodo.recordId\")" >> "$GITHUB_ENV"
          echo "CURRENT_DOI=$(node -p \"require('./src/data/release.json').dataset.zenodo.versionDoi\")" >> "$GITHUB_ENV"
          echo "CONCEPT_DOI=$(node -p \"require('./src/data/release.json').dataset.zenodo.conceptDoi\")" >> "$GITHUB_ENV"
          HF_URL="$(node -p \"require('./src/data/release.json').dataset.huggingFace.dataset\")"
          echo "HF_REPO=${HF_URL#https://huggingface.co/datasets/}" >> "$GITHUB_ENV"
      - name: Verify immutable Zenodo authority surface
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ZENODO_TOKEN:-}"
          echo "::add-mask::$ZENODO_TOKEN"
          python scripts/zenodo_release.py verify-public \
            --record "$CURRENT_RECORD" --doi "$CURRENT_DOI" --concept-doi "$CONCEPT_DOI" --version "$CURRENT_VERSION"
      - name: Prepare Hugging Face from canonical DIST
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .release/huggingface
          git clone "https://huggingface.co/datasets/$HF_REPO" .release/huggingface
          node scripts/huggingface.mjs prepare dist .release/huggingface
          git -C .release/huggingface config user.name ghezelbaash-release-bot
          git -C .release/huggingface config user.email actions@users.noreply.github.com
          git -C .release/huggingface add -A
          git -C .release/huggingface diff --cached --quiet || git -C .release/huggingface commit -m "Reconcile release $CURRENT_VERSION authority distribution"
      - name: Publish Hugging Face convergence
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN || secrets.HUGGINGFACE_TOKEN || secrets.HUGGING_FACE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${HF_TOKEN:-}"
          echo "::add-mask::$HF_TOKEN"
          HF_AUTH="$(printf 'oauth2:%s' "$HF_TOKEN" | base64 -w0)"
          git -C .release/huggingface -c "http.https://huggingface.co/.extraheader=AUTHORIZATION: basic $HF_AUTH" push origin HEAD:main
          unset HF_AUTH
      - name: Verify Hugging Face authority surfaces
        shell: bash
        run: |
          set -euo pipefail
          node scripts/huggingface.mjs verify --profile
          node scripts/huggingface.mjs verify --viewer
      - name: Converge Cloudflare Pages to canonical Git deployment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          node scripts/cloudflare-pages.mjs ensure --configure
          node scripts/cloudflare-pages.mjs ensure --verify-config
      - name: Verify native Git deployment identity
        id: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          node scripts/cloudflare-pages.mjs ensure
      - name: Converge the complete production edge contract
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          python scripts/configure-cloudflare-edge.py \
            --apply \
            --outcome edge-reconciliation.json
      - name: Verify exact production serving and sample T+0 discovery
        env:
          CANDIDATE_SHA: ${{ github.sha }}
          EDGE_RECONCILIATION_OUTCOME: edge-reconciliation.json
        run: |
          set -euo pipefail
          node scripts/cloudflare-pages.mjs verify
          npm run verify:production
          node scripts/verify-live.mjs current --website-only
          if npm run verify:public-discovery; then
            echo 'PUBLIC_DISCOVERY_T0_PASS'
          else
            echo '::warning::T+0 public discovery sampled a stale Cloudflare PoP after exact production bytes were already proven; delayed convergence gates will decide final success.'
          fi
      - name: Require public discovery convergence by T+5m
        run: |
          set -euo pipefail
          sleep 120
          if npm run verify:public-discovery; then
            echo 'PUBLIC_DISCOVERY_T2_PASS'
          else
            echo '::warning::T+2 public discovery still sampled distributed edge drift; T+5 remains the hard convergence gate.'
          fi
          sleep 180
          npm run verify:public-discovery
          node scripts/verify-live.mjs current --website-only
          echo 'PUBLIC_DISCOVERY_T5_HARD_PASS'

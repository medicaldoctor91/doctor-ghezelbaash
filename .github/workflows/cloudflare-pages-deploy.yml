name: Deploy canonical site to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cloudflare-pages-deploy.yml
      - package.json
      - package-lock.json
      - astro.config.mjs
      - tsconfig.json
      - requirements-rdf.txt
      - public/**
      - scripts/**
      - src/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: doctor-ghezelbaash-cloudflare-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      CF_PROJECT: doctor-ghezelbaash
    steps:
      - name: Checkout trusted main source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up locked Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.18.0
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Build and validate canonical distribution
        run: npm run build

      - name: Deploy exact DIST to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 884d1d90bd1fb6ecca14992c6c60d677
          ZONE_NAME: ghezelbaash.ir
          CANONICAL_HOST: www.ghezelbaash.ir
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          echo "::add-mask::$CLOUDFLARE_API_TOKEN"
          npx wrangler pages deploy dist \
            --project-name="$CF_PROJECT" \
            --branch=main \
            --commit-hash="$GITHUB_SHA" \
            --commit-message="Deploy canonical site $GITHUB_SHA" \
            --commit-dirty=true
          python scripts/configure-cloudflare-edge.py \
            --purge-cache-only \
            --outcome edge-cache-purge.json

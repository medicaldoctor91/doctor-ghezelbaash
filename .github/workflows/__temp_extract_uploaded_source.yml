name: Extract uploaded source archive

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/__temp_extract_uploaded_source.yml'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Extract exact uploaded ZIP into repository root
        shell: bash
        run: |
          set -euo pipefail
          ZIP='ghezelbaash-astro-clean-production-source-v5.zip'
          test -f "$ZIP"
          rm -rf .__extract_tmp
          mkdir .__extract_tmp
          unzip -q "$ZIP" -d .__extract_tmp
          rsync -a .__extract_tmp/ ./
          rm -rf .__extract_tmp
          rm -f "$ZIP"
          rm -f .github/workflows/__temp_extract_uploaded_source.yml

      - name: Commit extracted source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Extract uploaded website source archive'
          git push origin HEAD:main

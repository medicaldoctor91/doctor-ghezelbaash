name: One-time full media metadata convergence

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  converge:
    if: github.event.pull_request.head.ref == 'ops/media-metadata-convergence-20260823'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Converge all published entity media
        run: python scripts/one-time-media-metadata-convergence.py
      - name: Validate convergence
        shell: bash
        run: |
          set -euo pipefail
          npm run validate:media-references
          npm run validate:media
          npm run validate:source
      - name: Commit production-clean result
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          git config user.name 'doctor-ghezelbaash migration bot'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'refactor: enforce entity metadata across all published media'
          git push origin HEAD:main

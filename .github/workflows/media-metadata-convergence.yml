name: One-time full media metadata convergence

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  converge:
    if: github.event.pull_request.head.ref == 'ops/media-metadata-convergence-final-20260823'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
          cache: npm
      - name: Install ffmpeg and project dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          npm ci --ignore-scripts
      - name: Converge all published entity media
        shell: bash
        run: |
          set -euo pipefail
          git show a17a83dd52837c5ab384da50901cd969802e6855:.github/workflows/ci.yml > /tmp/clean-ci.yml
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/one-time-media-metadata-convergence.py')
          text=p.read_text(encoding='utf-8')
          text=text.replace(':format=tags',':format_tags')
          old="run(['git','checkout','HEAD^','--','.github/workflows/ci.yml'])"
          new="(ROOT/'.github/workflows/ci.yml').write_bytes(Path('/tmp/clean-ci.yml').read_bytes())"
          if old not in text: raise SystemExit('CI cleanup anchor not found')
          p.write_text(text.replace(old,new),encoding='utf-8',newline='')
          PY
          python scripts/one-time-media-metadata-convergence.py
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/validate-media.mjs')
          text=p.read_text(encoding='utf-8')
          old="""  const embeddedPlaceIds=[...new Set(bytes.toString('latin1').match(/ChIJ[A-Za-z0-9_-]{12,}/g)||[])];
  for(const embedded of embeddedPlaceIds)if(embedded!==current)fail(`Foreign Google Place ID metadata ${embedded} in ${file}`);
  if(bytes.includes(Buffer.from(current)))currentHits++;"""
          new="""  if(rasterPattern.test(file)){
    const embeddedPlaceIds=[...new Set(bytes.toString('latin1').match(/ChIJ[A-Za-z0-9_-]{12,}/g)||[])];
    for(const embedded of embeddedPlaceIds)if(embedded!==current)fail(`Foreign Google Place ID metadata ${embedded} in ${file}`);
  }
  if(bytes.includes(Buffer.from(current)))currentHits++;"""
          if old not in text: raise SystemExit('raw Place ID validator anchor not found')
          text=text.replace(old,new)
          old_video="['Saeed Ghezelbash','Q140287622','/g/11nqdfk76c','https://www.ghezelbaash.ir/#saeed-ghezelbash','creativecommons.org/licenses/by/4.0','Entity Media Profile 3.1.0']"
          new_video="['Saeed Ghezelbash','Q140287622','/g/11nqdfk76c','https://www.ghezelbaash.ir/#saeed-ghezelbash','ChIJBT0YDOTt-j8RD-7mAPy6Zas','creativecommons.org/licenses/by/4.0','Entity Media Profile 3.1.0']"
          if old_video not in text: raise SystemExit('video metadata requirement anchor not found')
          text=text.replace(old_video,new_video,1)
          old_vtt="['Entity metadata — first-party media track','Canonical-Person: https://www.ghezelbaash.ir/#saeed-ghezelbash','Wikidata: Q140287622','Google-Knowledge-Graph-ID: /g/11nqdfk76c','License: https://creativecommons.org/licenses/by/4.0/','Metadata-Profile: Entity Media Profile 3.1.0']"
          new_vtt="['Entity metadata — first-party media track','Canonical-Person: https://www.ghezelbaash.ir/#saeed-ghezelbash','Wikidata: Q140287622','Google-Knowledge-Graph-ID: /g/11nqdfk76c','Google-Place-ID: ChIJBT0YDOTt-j8RD-7mAPy6Zas','License: https://creativecommons.org/licenses/by/4.0/','Metadata-Profile: Entity Media Profile 3.1.0']"
          if old_vtt not in text: raise SystemExit('VTT metadata requirement anchor not found')
          p.write_text(text.replace(old_vtt,new_vtt),encoding='utf-8',newline='')
          PY
      - name: Validate convergence
        shell: bash
        run: |
          set -euo pipefail
          npm run validate:media-references
          npm run validate:media
          npm run validate:source
      - name: Commit production-clean result
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          git config user.name 'doctor-ghezelbaash migration bot'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'refactor: enforce entity metadata across all published media'
          git push origin HEAD:main

name: Materialize v1.2.2 responsive media experiment

on:
  push:
    branches: [main]
    paths: [.release/v122-responsive-media-request.json]

permissions:
  contents: write

concurrency:
  group: doctor-ghezelbaash-v122-responsive-media-materialize
  cancel-in-progress: true

env:
  EXPERIMENT_BRANCH: tmp/v122-responsive-media-experiment
  BASE_CANDIDATE_SHA: 2f79e4eb179c8415c28a2ace1a52c2c523b1c1cb

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: tmp/v122-responsive-media-experiment
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Pin exact experiment base and install deterministic image tooling
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$EXPERIMENT_BRANCH" release/v1.2.2-candidate
          test "$(git rev-parse origin/release/v1.2.2-candidate)" = "$BASE_CANDIDATE_SHA"
          test "$(git rev-parse HEAD)" = "$BASE_CANDIDATE_SHA"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends imagemagick libheif1 >/dev/null
          convert -version
          identify -list format | grep -E '^ *AVIF|^ *WEBP'
          identify public/media/images/physician/master/saeed-ghezelbaash-physician-portrait.55e6a60c60bc.jpg
          identify public/media/images/physician/master/saeed-ghezelbaash-in-clinical-office.da2f60febc2e.jpg
      - name: Generate calibrated 720w and 800w AVIF/WebP variants
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/v122-media && mkdir -p /tmp/v122-media/ref /tmp/v122-media/candidates
          HERO_MASTER='public/media/images/physician/master/saeed-ghezelbaash-physician-portrait.55e6a60c60bc.jpg'
          CLINICAL_MASTER='public/media/images/physician/master/saeed-ghezelbaash-in-clinical-office.da2f60febc2e.jpg'
          HERO_640='public/media/images/physician/saeed-ghezelbash-portrait-delivery-640.7b2b6ac2affa.avif'
          HERO_960='public/media/images/physician/saeed-ghezelbash-portrait-960.497fc78613ac.avif'
          CLINICAL_640='public/media/images/physician/saeed-ghezelbash-in-clinical-office-delivery-640.92cc73c7a8c8.avif'
          CLINICAL_960='public/media/images/physician/saeed-ghezelbash-clinical-examination-960.c7b107d19e68.avif'
          HERO_640_W='public/media/images/physician/saeed-ghezelbash-portrait-delivery-640.b267bddf872d.webp'
          HERO_960_W='public/media/images/physician/saeed-ghezelbash-portrait-960.d67587e1de85.webp'
          CLINICAL_640_W='public/media/images/physician/saeed-ghezelbash-in-clinical-office-delivery-640.87655757c9a5.webp'
          CLINICAL_960_W='public/media/images/physician/saeed-ghezelbash-clinical-examination-960.db655b6d5de3.webp'
          for f in "$HERO_MASTER" "$CLINICAL_MASTER" "$HERO_640" "$HERO_960" "$CLINICAL_640" "$CLINICAL_960" "$HERO_640_W" "$HERO_960_W" "$CLINICAL_640_W" "$CLINICAL_960_W"; do test -f "$f"; done

          ssim(){ compare -metric SSIM "$1" "$2" null: 2>&1 | awk '{print $1}'; }
          threshold_for(){
            local master="$1" low="$2" high="$3" prefix="$4"
            convert "$master" -auto-orient -resize 640x -strip "/tmp/v122-media/ref/${prefix}-640.png"
            convert "$master" -auto-orient -resize 960x -strip "/tmp/v122-media/ref/${prefix}-960.png"
            local a b
            a=$(ssim "/tmp/v122-media/ref/${prefix}-640.png" "$low")
            b=$(ssim "/tmp/v122-media/ref/${prefix}-960.png" "$high")
            python - "$a" "$b" <<'PY'
          import sys
          a,b=map(float,sys.argv[1:]);print(f'{min(a,b):.8f}')
          PY
          }
          HERO_AVIF_MIN=$(threshold_for "$HERO_MASTER" "$HERO_640" "$HERO_960" hero-avif)
          CLINICAL_AVIF_MIN=$(threshold_for "$CLINICAL_MASTER" "$CLINICAL_640" "$CLINICAL_960" clinical-avif)
          HERO_WEBP_MIN=$(threshold_for "$HERO_MASTER" "$HERO_640_W" "$HERO_960_W" hero-webp)
          CLINICAL_WEBP_MIN=$(threshold_for "$CLINICAL_MASTER" "$CLINICAL_640_W" "$CLINICAL_960_W" clinical-webp)
          echo "BASELINE_SSIM hero_avif=$HERO_AVIF_MIN clinical_avif=$CLINICAL_AVIF_MIN hero_webp=$HERO_WEBP_MIN clinical_webp=$CLINICAL_WEBP_MIN"

          choose(){
            local master="$1" width="$2" fmt="$3" threshold="$4" logical="$5"
            local qualities
            if [ "$fmt" = avif ]; then qualities='42 46 50 54 58 62 66 70'; else qualities='72 76 80 84 88 92'; fi
            convert "$master" -auto-orient -resize "${width}x" -strip "/tmp/v122-media/ref/${logical}.png"
            local best='' best_bytes=999999999 best_q='' best_ssim=''
            for q in $qualities; do
              local out="/tmp/v122-media/candidates/${logical}-q${q}.${fmt}"
              convert "$master" -auto-orient -resize "${width}x" -strip -quality "$q" "$out"
              local score bytes ok
              score=$(ssim "/tmp/v122-media/ref/${logical}.png" "$out")
              bytes=$(stat -c%s "$out")
              ok=$(python - "$score" "$threshold" <<'PY'
          import sys
          print('yes' if float(sys.argv[1]) >= float(sys.argv[2]) else 'no')
          PY
              )
              echo "CANDIDATE_IMAGE logical=$logical fmt=$fmt q=$q bytes=$bytes ssim=$score threshold=$threshold accepted=$ok"
              if [ "$ok" = yes ] && [ "$bytes" -lt "$best_bytes" ]; then best="$out";best_bytes="$bytes";best_q="$q";best_ssim="$score";fi
            done
            test -n "$best"
            local hash final="public/media/images/physician/${logical}"
            hash=$(sha256sum "$best" | awk '{print substr($1,1,12)}')
            final="${final}.${hash}.${fmt}"
            cp "$best" "$final"
            echo "SELECTED_IMAGE logical=$logical fmt=$fmt q=$best_q bytes=$best_bytes ssim=$best_ssim path=$final"
            printf '%s\n' "$final" >> /tmp/v122-media/new-files.txt
          }

          choose "$HERO_MASTER" 720 avif "$HERO_AVIF_MIN" saeed-ghezelbash-portrait-720
          choose "$HERO_MASTER" 800 avif "$HERO_AVIF_MIN" saeed-ghezelbash-portrait-800
          choose "$HERO_MASTER" 720 webp "$HERO_WEBP_MIN" saeed-ghezelbash-portrait-720
          choose "$HERO_MASTER" 800 webp "$HERO_WEBP_MIN" saeed-ghezelbash-portrait-800
          choose "$CLINICAL_MASTER" 720 avif "$CLINICAL_AVIF_MIN" saeed-ghezelbash-clinical-examination-720
          choose "$CLINICAL_MASTER" 800 avif "$CLINICAL_AVIF_MIN" saeed-ghezelbash-clinical-examination-800
          choose "$CLINICAL_MASTER" 720 webp "$CLINICAL_WEBP_MIN" saeed-ghezelbash-clinical-examination-720
          choose "$CLINICAL_MASTER" 800 webp "$CLINICAL_WEBP_MIN" saeed-ghezelbash-clinical-examination-800
          test "$(wc -l </tmp/v122-media/new-files.txt)" -eq 8
          while read -r f; do sha=$(sha256sum "$f"|awk '{print $1}'); name=$(basename "$f"); fp=$(printf '%s' "$name"|sed -E 's/.*\.([0-9a-f]{12})\.[^.]+$/\1/'); test "${sha:0:12}" = "$fp"; identify "$f"; done </tmp/v122-media/new-files.txt
      - name: Wire responsive candidates through canonical media inventory and preload
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          root=Path('.')
          files=list((root/'public/media/images/physician').glob('saeed-ghezelbash-portrait-720.*.*'))+list((root/'public/media/images/physician').glob('saeed-ghezelbash-portrait-800.*.*'))+list((root/'public/media/images/physician').glob('saeed-ghezelbash-clinical-examination-720.*.*'))+list((root/'public/media/images/physician').glob('saeed-ghezelbash-clinical-examination-800.*.*'))
          assert len(files)==8, len(files)
          by={}
          for p in files:
              m=re.match(r'(.+)\.([0-9a-f]{12})\.(avif|webp)$',p.name); assert m,p
              by[(m.group(1),m.group(3))]='/media/images/physician/'+p.name
          intro=Path('src/content-source/001-intro.html'); s=intro.read_text()
          replacements={
            '/media/images/physician/saeed-ghezelbash-portrait-delivery-640.7b2b6ac2affa.avif 640w, /media/images/physician/saeed-ghezelbash-portrait-960.497fc78613ac.avif 960w':f'/media/images/physician/saeed-ghezelbash-portrait-delivery-640.7b2b6ac2affa.avif 640w, {by[("saeed-ghezelbash-portrait-720","avif")]} 720w, {by[("saeed-ghezelbash-portrait-800","avif")]} 800w, /media/images/physician/saeed-ghezelbash-portrait-960.497fc78613ac.avif 960w',
            '/media/images/physician/saeed-ghezelbash-portrait-delivery-640.b267bddf872d.webp 640w, /media/images/physician/saeed-ghezelbash-portrait-960.d67587e1de85.webp 960w':f'/media/images/physician/saeed-ghezelbash-portrait-delivery-640.b267bddf872d.webp 640w, {by[("saeed-ghezelbash-portrait-720","webp")]} 720w, {by[("saeed-ghezelbash-portrait-800","webp")]} 800w, /media/images/physician/saeed-ghezelbash-portrait-960.d67587e1de85.webp 960w',
            '/media/images/physician/saeed-ghezelbash-in-clinical-office-delivery-640.92cc73c7a8c8.avif 640w, /media/images/physician/saeed-ghezelbash-clinical-examination-960.c7b107d19e68.avif 960w':f'/media/images/physician/saeed-ghezelbash-in-clinical-office-delivery-640.92cc73c7a8c8.avif 640w, {by[("saeed-ghezelbash-clinical-examination-720","avif")]} 720w, {by[("saeed-ghezelbash-clinical-examination-800","avif")]} 800w, /media/images/physician/saeed-ghezelbash-clinical-examination-960.c7b107d19e68.avif 960w',
            '/media/images/physician/saeed-ghezelbash-in-clinical-office-delivery-640.87655757c9a5.webp 640w, /media/images/physician/saeed-ghezelbash-clinical-examination-960.db655b6d5de3.webp 960w':f'/media/images/physician/saeed-ghezelbash-in-clinical-office-delivery-640.87655757c9a5.webp 640w, {by[("saeed-ghezelbash-clinical-examination-720","webp")]} 720w, {by[("saeed-ghezelbash-clinical-examination-800","webp")]} 800w, /media/images/physician/saeed-ghezelbash-clinical-examination-960.db655b6d5de3.webp 960w'
          }
          for old,new in replacements.items():
              if s.count(old)!=1: raise SystemExit(f'intro target count {s.count(old)} for {old[:80]}')
              s=s.replace(old,new)
          intro.write_text(s)
          head=Path('src/data/templates/main-head.html'); h=head.read_text()
          old='/media/images/physician/saeed-ghezelbash-portrait-delivery-640.7b2b6ac2affa.avif 640w, /media/images/physician/saeed-ghezelbash-portrait-960.497fc78613ac.avif 960w'
          new=f'/media/images/physician/saeed-ghezelbash-portrait-delivery-640.7b2b6ac2affa.avif 640w, {by[("saeed-ghezelbash-portrait-720","avif")]} 720w, {by[("saeed-ghezelbash-portrait-800","avif")]} 800w, /media/images/physician/saeed-ghezelbash-portrait-960.497fc78613ac.avif 960w'
          if h.count(old)!=1: raise SystemExit(f'head preload target count={h.count(old)}')
          head.write_text(h.replace(old,new))
          dims=Path('src/data/media-dimensions.tsv'); d=dims.read_text().rstrip('\n')+'\n'
          rows=[]
          for p in files:
              m=re.match(r'(.+)\.([0-9a-f]{12})\.(avif|webp)$',p.name); logical=f'public/media/images/physician/{m.group(1)}.{m.group(3)}'
              import subprocess
              wh=subprocess.check_output(['identify','-format','%w|%h',str(p)],text=True).strip(); rows.append(f'{logical}|{wh}')
          for row in sorted(rows):
              if row.split('|')[0] in d: raise SystemExit(f'duplicate dimensions logical path {row}')
              d+=row+'\n'
          dims.write_text(d)
          sync=Path('scripts/sync-media-references.mjs'); x=sync.read_text(); old='if(rasters.length!==49)throw new Error(`Expected 49 canonical raster assets, found ${rasters.length}`);'; new='if(rasters.length!==57)throw new Error(`Expected 57 canonical raster assets, found ${rasters.length}`);'
          if x.count(old)!=1: raise SystemExit('canonical raster count guard drift')
          sync.write_text(x.replace(old,new))
          PY
          git diff --check
          git status --short
      - run: npm ci --ignore-scripts
      - name: Full source build media and visible freeze proof
        shell: bash
        run: |
          set -euo pipefail
          C_BASE="$BASE_CANDIDATE_SHA"
          npm run validate:media
          npm run validate:source
          npm run media:sync
          test "$(find public/media -type f \( -iname '*.avif' -o -iname '*.webp' -o -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.png' \) | wc -l)" -eq 57
          git config user.name ghezelbaash-responsive-media-experiment
          git config user.email actions@users.noreply.github.com
          git add public/media/images/physician src/content-source/001-intro.html src/data/templates/main-head.html src/data/media-dimensions.tsv scripts/sync-media-references.mjs
          git commit -m 'Experiment with calibrated 720w and 800w responsive physician media'
          E=$(git rev-parse HEAD)
          export SOURCE_COMMIT="$E" CF_PAGES_COMMIT_SHA="$E" SOURCE_DATE_EPOCH=$(git show -s --format=%ct "$E") ASTRO_TELEMETRY_DISABLED=1
          npm run build
          node scripts/validate-visible-freeze.mjs dist/index.html
          node scripts/validate-dist.mjs
          node scripts/validate-current-context.mjs dist
          node - <<'NODE'
          const fs=require('fs');const html=fs.readFileSync('dist/index.html','utf8');for(const w of [720,800])for(const stem of ['saeed-ghezelbash-portrait','saeed-ghezelbash-clinical-examination'])if(!new RegExp(`${stem}-${w}\\.[0-9a-f]{12}\\.avif`).test(html))throw Error(`Missing responsive AVIF ${stem}-${w}`);const hero=(html.match(/saeed-ghezelbash-portrait-720\.[0-9a-f]{12}\.avif 720w/g)||[]).length;if(hero<2)throw Error(`Hero 720 AVIF must appear in preload and picture, got ${hero}`);console.log(JSON.stringify({responsiveMediaExperiment:'PASS',commit:process.env.SOURCE_COMMIT,htmlBytes:Buffer.byteLength(html),hero720Occurrences:hero}));
          NODE
          test "$(git rev-parse HEAD^)" = "$C_BASE"
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Push only fully proven experiment commit
        shell: bash
        run: |
          set -euo pipefail
          git push origin "HEAD:$EXPERIMENT_BRANCH"
          echo "RESPONSIVE_MEDIA_EXPERIMENT_PROVEN sha=$(git rev-parse HEAD)"

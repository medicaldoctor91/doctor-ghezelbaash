name: Temporary final named-as verification Q140288589

on:
  pull_request:
    types: [opened]
    branches: [main]

permissions:
  contents: write

jobs:
  verify:
    if: github.head_ref == 'tmp-verify-named-as-q140288589-pr5'
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14.6'
      - run: python -m pip install --disable-pip-version-check --no-input requests==2.32.5
      - name: Read-only final live verification
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/_tmp_verify_named_as_q140288589_readonly.py
          mkdir -p wikimedia
          python scripts/_tmp_verify_named_as_q140288589_readonly.py > wikimedia/_tmp-named-as-q140288589-finalverify.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add wikimedia/_tmp-named-as-q140288589-finalverify.json
          git commit -m 'Record final read-only named-as verification' || true
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

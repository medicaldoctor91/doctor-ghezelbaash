name: Tune content visibility threshold

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/tune-content-visibility.yml

permissions:
  contents: write

jobs:
  tune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - name: Move containment safely below the initial reading region
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/styles/global.css')
          s=p.read_text(encoding='utf-8')
          old=':nth-child(n + 8)'
          if s.count(old)!=2: raise SystemExit(f'expected 2 thresholds, found {s.count(old)}')
          p.write_text(s.replace(old,':nth-child(n + 30)'),encoding='utf-8')
          PY
          npm ci --no-audit --no-fund
          npm run build
      - name: Commit tuning
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/tune-content-visibility.yml
          git add src/styles/global.css
          git commit -m 'Move below-fold containment past the initial reading region'
          git push origin HEAD:main

name: Validate extended physician clinical authority graph
on:
  push:
    branches: [codex/clinical-authority-graph-1-3-6]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    if: github.repository == 'medicaldoctor91/doctor-ghezelbaash'
    runs-on: ubuntu-latest
    timeout-minutes: 24
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run build
      - run: node --test --test-concurrency=1 tests/*.test.mjs
      - run: |
          python -m pip install --disable-pip-version-check 'rdflib>=7,<8' 'pyshacl>=0.30,<1' 'mlcroissant==1.1.1' 'PyLD==3.3.0'
          python tests/validate_machine_resources.py dist
          python tests/validate_canonical_invariants.py dist
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clinical-authority-validation-artifacts
          path: |
            dist/release-provenance.json
            dist/integrity-manifest.json
            dist/graph.jsonld
          retention-days: 7

name: Materialize Canonical Data

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: materialize-canonical-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out target branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || 'main' }}
          fetch-depth: 0

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Use repository npm version
        run: npm install --global npm@11.19.0

      - name: Install locked dependencies
        run: npm ci

      - name: Normalize physician-owned Dataset sources
        run: npm run normalize:dataset

      - name: Validate normalized source and production build
        run: npm run validate

      - name: Commit materialized outputs
        shell: bash
        run: |
          set -euo pipefail
          git add -A -- \
            src/pages/index.md \
            src/components/DocumentHead.astro \
            src/data/semantic/head-graph.min.jsonld \
            public/graph.jsonld \
            public/graph.ttl \
            public/llms.txt \
            public/_headers \
            public/_redirects \
            public/sitemap.xml

          HISTORICAL_DISTRIBUTION="public/datasets/historical-patient-origin-summary.json"
          if git ls-files --error-unmatch "$HISTORICAL_DISTRIBUTION" >/dev/null 2>&1 || [[ -e "$HISTORICAL_DISTRIBUTION" ]]; then
            git add -A -- "$HISTORICAL_DISTRIBUTION"
          fi

          if git diff --cached --quiet; then
            echo "Canonical outputs are already materialized."
            exit 0
          fi

          TARGET_BRANCH="${GITHUB_HEAD_REF:-main}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(structured-data): materialize integrated historical evidence"
          git push origin "HEAD:${TARGET_BRANCH}"

name: Materialize Canonical Data

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: materialize-canonical-data
  cancel-in-progress: false

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Use repository npm version
        run: npm install --global npm@11.19.0

      - name: Install locked dependencies
        run: npm ci

      - name: Normalize physician-owned Dataset sources
        run: npm run normalize:dataset

      - name: Validate normalized source and production build
        run: npm run validate

      - name: Commit materialized outputs
        shell: bash
        run: |
          set -euo pipefail
          git add \
            src/pages/index.md \
            public/llms.txt \
            src/data/semantic/head-graph.min.jsonld \
            public/graph.jsonld \
            public/graph.ttl

          if git diff --cached --quiet; then
            echo "Canonical outputs are already materialized."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(structured-data): materialize canonical Dataset outputs"
          git push origin HEAD:main

name: Temporary live named-as audit Q140288589

# registered; trigger live audit
on:
  workflow_run:
    workflows: ['Read-only source and release validation']
    types: [completed]

permissions:
  contents: write

jobs:
  audit:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      !contains(github.event.workflow_run.head_commit.message, 'Record temporary named-as audit')
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14.6'
      - run: python -m pip install --disable-pip-version-check --no-input requests==2.32.5
      - name: Fetch live Q140288589 named-as usage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p wikimedia
          python scripts/_tmp_audit_named_as_q140288589.py > wikimedia/_tmp-named-as-q140288589-audit.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add wikimedia/_tmp-named-as-q140288589-audit.json
          git commit -m 'Record temporary named-as audit'
          git push origin HEAD:main

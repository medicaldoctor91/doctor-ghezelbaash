name: Probe self-hosted runner
on:
  push:
    branches: [main]
    paths: ['.github/workflows/selfhosted-probe-temp.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: self-hosted
    timeout-minutes: 2
    steps:
      - name: Identify runner
        shell: bash
        run: |
          set -euo pipefail
          echo "RUNNER_NAME=${RUNNER_NAME:-unknown}"
          echo "RUNNER_OS=${RUNNER_OS:-unknown}"
          python3 - <<'PY'
          import urllib.request
          print('NETWORK_OK', urllib.request.urlopen('https://en.wikisource.org/w/api.php?action=query&meta=siteinfo&format=json', timeout=20).status)
          PY

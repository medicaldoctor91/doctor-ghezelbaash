name: Apply final Cloudflare machine subdomain contract
on:
  push:
    branches: [main]
    paths: ['.github/workflows/_tmp-apply-final-subdomain-contract.yml']
permissions:
  contents: write
concurrency:
  group: doctor-ghezelbaash-external-mutation
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: 884d1d90bd1fb6ecca14992c6c60d677
      ZONE_NAME: ghezelbaash.ir
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0
      - name: Validate final source contract
        run: node scripts/validate-subdomain-redirects.mjs
      - name: Reconcile final Cloudflare contract
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          echo "::add-mask::$CLOUDFLARE_API_TOKEN"
          python scripts/configure-cloudflare-edge.py --apply-subdomains-only --outcome edge-subdomain-reconciliation.json
      - name: Verify live exact redirects
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            if node scripts/verify-subdomain-redirects.mjs; then exit 0; fi
            sleep 5
          done
          exit 1
      - name: Remove temporary workflow residue
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Dr. Saeed Ghezelbaash | دکتر سعید قزلباش'
          git config user.email 'medicaldoctor91@gmail.com'
          find .github/workflows -maxdepth 1 -type f -name '_tmp-*' -print -delete
          git add -A .github/workflows
          if git diff --cached --quiet; then exit 0; fi
          git diff --cached --check
          git commit -m 'Remove temporary workflow residue'
          git push origin HEAD:main

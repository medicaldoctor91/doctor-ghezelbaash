name: Temporary render calibration cleanup patch

on:
  push:
    branches: [fix/render-calibration-measurement-20260907]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
      - run: node scripts/patch-render-calibration-cleanup.mjs
      - run: node --check scripts/measure-render-calibration.mjs
      - name: Require exact patch scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed=$(git diff --name-only)
          test "$changed" = "scripts/measure-render-calibration.mjs"
      - name: Commit cleanup lifecycle fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/measure-render-calibration.mjs
          git commit -m "Wait for Chromium before calibration cleanup"
          git push origin "HEAD:${GITHUB_REF_NAME}"

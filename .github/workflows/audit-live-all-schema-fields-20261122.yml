name: Audit LIVE all-72-page complete JSON-LD field and W3C RDF parity vs approved 1.3.6 source
on:
  push:
    branches: [audit/nov18-all-route-schema-field-parity-20261122]
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 36
    env:
      ARCHIVE_SOURCE_COMMIT: eafb138d596a91504ed0af66e2557f52848e36b6
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version-file: .nvmrc, cache: npm}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: npm ci
      - run: python -m pip install requests beautifulsoup4 lxml PyLD==3.3.0
      - run: npm run build
      - name: Independently check EVERY schema field in actual live vs rebuilt exact source
        run: |
          python - <<'PY'
          import json,requests,statistics,hashlib,concurrent.futures,collections
          from pathlib import Path
          from bs4 import BeautifulSoup
          from pyld import jsonld
          O='https://www.ghezelbaash.ir'
          H={'User-Agent':'ReadOnlyAllPageSchemaFieldParity/20261122','Accept-Encoding':'identity','Cache-Control':'no-cache'}
          files=[Path('dist/index.html')]+sorted(x for x in Path('dist').glob('*.html') if x.name!='index.html')
          # Ignore special not-in-sitemap pages by filtering the published canonical URL inventory.
          import xml.etree.ElementTree as ET
          r=requests.get(O+'/sitemap.xml',headers=H,timeout=50);r.raise_for_status()
          root=ET.fromstring(r.content);ns={'s':'http://www.sitemaps.org/schemas/sitemap/0.9'}
          urls=[loc.text for loc in root.findall('.//s:url/s:loc',ns)]
          assert len(urls)==72 and len(set(urls))==72
          assert json.loads(requests.get(O+'/release-provenance.json',timeout=30).content)['sourceCommit']=='824c02f4bd495cdbc3091b7b3911a5470fd9104b'
          normal={'algorithm':'URDNA2015','format':'application/n-quads'}
          def extraction(html):
            soup=BeautifulSoup(html,'lxml')
            scripts=[]
            for script in soup.find_all('script',type='application/ld+json'):
              scripts.append({'id':script.get('id'), 'schema':json.loads(script.string or script.get_text())})
            return scripts
          def task(url):
            rel=url[len(O):].strip('/')
            path=Path('dist/index.html') if not rel else Path('dist')/(rel+'.html')
            if not path.is_file():return {'page':url,'error':'No matching exact built HTML', 'dist':str(path)}
            built=extraction(path.read_bytes())
            response=requests.get(url,headers=H,timeout=(12,75))
            if response.status_code!=200:return {'page':url,'error':'Live HTTP '+str(response.status_code)}
            live=extraction(response.content)
            if len(built)!=len(live):return {'page':url,'error':'Script count mismatch','builtScripts':[x['id'] for x in built],'liveScripts':[x['id'] for x in live]}
            if [x['id'] for x in built]!=[x['id'] for x in live]:return {'page':url,'error':'Schema script IDs differ'}
            diff=[]
            builtCount=0;liveCount=0
            for a,b in zip(built,live):
              p=a['schema'];q=b['schema']
              builtCount+=len(p.get('@graph',[]));liveCount+=len(q.get('@graph',[]))
              if p==q:continue
              pa=jsonld.normalize(p,normal);qa=jsonld.normalize(q,normal)
              if pa!=qa:
                diff.append({'script':a['id'],'issue':'RDF differs','builtQuadCount':len(pa.splitlines()),'liveQuadCount':len(qa.splitlines()),'onlyBuild':len(set(pa.splitlines())-set(qa.splitlines())),'onlyLive':len(set(qa.splitlines())-set(pa.splitlines()))})
              else:
                diff.append({'script':a['id'],'issue':'JSON differs but normalized RDF identical'})
            return {'page':url,'buildSchemas':len(built),'liveSchemas':len(live),'builtNodes':builtCount,'liveNodes':liveCount,
                    'exactJSONObjectEqual':not diff,'schemaDiffs':diff}
          with concurrent.futures.ThreadPoolExecutor(max_workers=6) as pool:
            results=sorted(pool.map(task,urls),key=lambda x:x['page'])
          errors=[x for x in results if x.get('error') or any(d.get('issue')=='RDF differs' for d in x.get('schemaDiffs',[]))]
          jsonDifferences=[x for x in results if x.get('schemaDiffs')]
          focused=[x for x in results if x['page']!=O+'/']
          report={'status':'PASS' if not errors else 'FAIL','source':'rebuilt approved production code versus real Cloudflare production GET responses',
                  'canonicalPages':len(results),'completeScriptSetMatched':sum(x.get('buildSchemas')==x.get('liveSchemas') for x in results),
                  'exactFieldEqualPages':sum(x.get('exactJSONObjectEqual') is True for x in results),
                  'semanticEquivalentButJsonDifferent':len(jsonDifferences)-len(errors),
                  'missingOrMismatchedPages':errors[:15],
                  'jsonFieldDifferentPages':jsonDifferences[:10],
                  'focusedNodeRange':[min(x.get('liveNodes',0) for x in focused),max(x.get('liveNodes',0) for x in focused)],
                  'allPagesSchemaFieldsEqual':len(results)==72 and not jsonDifferences,
                  'schemaNodesAcrossAllPagesIncludingOverlaps':sum(x.get('liveNodes',0) for x in results)}
          print('NOV18_ALL_ROUTE_SCHEMA_PARITY='+json.dumps(report,ensure_ascii=False),flush=True)
          assert len(results)==72
          assert not errors, 'Published schema drifted from approved clinical-attribution source'
          PY

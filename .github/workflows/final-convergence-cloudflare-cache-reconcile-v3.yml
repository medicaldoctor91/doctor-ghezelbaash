name: Reconcile final canonical Cloudflare cache v3
on:
  push:
    branches: [final/release-convergence]
    paths:
      - .github/workflows/final-convergence-cloudflare-cache-reconcile-v3.yml
permissions:
  actions: read
  contents: write
concurrency:
  group: final-convergence-cache-reconcile-v3
  cancel-in-progress: false
jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: '884d1d90bd1fb6ecca14992c6c60d677'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ZONE_NAME: 'ghezelbaash.ir'
      CANONICAL: 'https://www.ghezelbaash.ir'
      VERSION_DOI: '10.5281/zenodo.21892769'
      FROZEN_RUN: '31520584940'
      EXPECTED_GRAPH_SHA: 'a62d77230334598f3a5d73c34831c1dbf93b634c784eae4c4b98185a2fd27ed4'
      EXPECTED_HTML_SHA: 'f62dfb340a94994912e0710806fa83fe1b432a1787d24b4bde03b377f7dca9a8'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: final/release-convergence
          fetch-depth: 0
      - name: Verify immutable gates
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          python - <<'PY'
          import json,os
          from pathlib import Path
          f=json.loads(Path('.release/freeze.json').read_text()); z=json.loads(Path('.release/zenodo-published.json').read_text())
          assert f['release']=='1.1.1' and f['coreFrozen'] is True and f['integrity']=='PASS'
          assert str(f['githubRunId'])==os.environ['FROZEN_RUN'] and f['graphJsonldSha256']==os.environ['EXPECTED_GRAPH_SHA'] and f['indexHtmlSha256']==os.environ['EXPECTED_HTML_SHA']
          assert z['integrity']=='PASS' and z['versionDoi']==os.environ['VERSION_DOI'] and z['recordId']=='21892769'
          print('FINAL_CACHE_V3_GATES_PASS')
          PY
      - name: Download exact final frozen payload
        uses: actions/download-artifact@v4
        with:
          name: dr-saeed-ghezelbash-final-convergence-frozen
          path: /tmp/final-frozen
          github-token: ${{ github.token }}
          repository: medicaldoctor91/doctor-ghezelbaash
          run-id: 31520584940
      - name: Create minimal user-owned purge token, verify, purge and revoke
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import datetime as dt,json,os,time,urllib.error,urllib.parse,urllib.request
          BASE='https://api.cloudflare.com/client/v4'; account=os.environ['CLOUDFLARE_ACCOUNT_ID']; parent=os.environ['CLOUDFLARE_API_TOKEN']; zone_name=os.environ['ZONE_NAME']; canonical=os.environ['CANONICAL']
          parent_h={'Authorization':f'Bearer {parent}','Accept':'application/json','Content-Type':'application/json','User-Agent':'ghezelbaash-final-user-token-authority/1.0'}
          def raw(method,path,body=None,headers=None):
              h=dict(parent_h if headers is None else headers); data=None if body is None else json.dumps(body,separators=(',',':')).encode()
              req=urllib.request.Request(BASE+path,data=data,headers=h,method=method)
              try:
                  with urllib.request.urlopen(req,timeout=45) as r:
                      b=r.read().decode('utf-8','replace'); return r.status,json.loads(b) if b else {}
              except urllib.error.HTTPError as e:
                  b=e.read().decode('utf-8','replace')
                  try:p=json.loads(b) if b else {}
                  except Exception:p={'raw':b[:1500]}
                  return e.code,p
          def expect(method,path,body=None,headers=None,ok=(200,201)):
              st,p=raw(method,path,body,headers)
              if st not in ok or p.get('success') is not True: raise RuntimeError(f'Cloudflare {method} {path} failed HTTP {st}: {json.dumps(p,ensure_ascii=False)[:2500]}')
              return p
          zones=expect('GET','/zones?'+urllib.parse.urlencode({'name':zone_name,'account.id':account,'per_page':50})).get('result') or []
          exact=[x for x in zones if x.get('name')==zone_name]
          if len(exact)!=1: raise RuntimeError(f'Expected one zone, found {len(exact)}')
          zid=str(exact[0]['id'])
          # This call is the capability gate: it succeeds only if the parent has User API Tokens Read/Write scope.
          groups=expect('GET','/user/tokens/permission_groups?'+urllib.parse.urlencode({'scope':'com.cloudflare.api.account.zone'})).get('result') or []
          def group(name):
              m=[g for g in groups if g.get('name')==name and 'com.cloudflare.api.account.zone' in (g.get('scopes') or [])]
              if len(m)!=1: raise RuntimeError(f'Expected one {name} permission group, found {len(m)}')
              return {'id':m[0]['id']}
          expires=(dt.datetime.now(dt.timezone.utc)+dt.timedelta(minutes=15)).replace(microsecond=0).isoformat().replace('+00:00','Z')
          body={'name':'Ephemeral Ghezelbaash Final Cache Purge User Token','expires_on':expires,'policies':[{'effect':'allow','resources':{f'com.cloudflare.api.account.zone.{zid}':'*'},'permission_groups':[group('Cache Purge'),group('Zone Read')]}]}
          created=expect('POST','/user/tokens',body).get('result') or {}
          token_id=str(created.get('id') or ''); token_value=str(created.get('value') or '')
          if not token_id or not token_value: raise RuntimeError('User token create returned no id/value')
          print('EPHEMERAL_USER_PURGE_TOKEN_ISSUED',token_id,'expires=',expires)
          eph_h={'Authorization':f'Bearer {token_value}','Accept':'application/json','Content-Type':'application/json','User-Agent':'ghezelbaash-final-user-cache-purger/1.0'}
          try:
              active=False
              for i in range(20):
                  st,p=raw('GET','/user/tokens/verify',headers=eph_h)
                  status=(p.get('result') or {}).get('status') if st==200 and p.get('success') is True else None
                  print('USER_PURGE_TOKEN_VERIFY',i+1,'http=',st,'status=',status)
                  if st==200 and p.get('success') is True and status=='active': active=True; break
                  time.sleep(1)
              if not active: raise RuntimeError('User-owned purge token did not verify active')
              rel=['','graph.jsonld','graph.ttl','entity-facts.csv','answers.txt','knowledge.xml','llms.txt','llms-full.txt','index.md','datapackage.json','croissant.json','dcat.ttl','void.ttl','linkset.json','provenance.jsonld','evidence-snapshot.json','shapes.ttl','artifact-manifest.json']
              files=[canonical+'/' + x for x in rel]
              p=expect('POST',f'/zones/{zid}/purge_cache',{'files':files},eph_h)
              print('FINAL_CANONICAL_PURGE_PASS',len(files),(p.get('result') or {}).get('id'))
          finally:
              st,p=raw('DELETE',f'/user/tokens/{token_id}')
              if st not in (200,204) or p.get('success') is not True: raise RuntimeError(f'User token revoke failed HTTP {st}: {p}')
              print('EPHEMERAL_USER_PURGE_TOKEN_REVOKED',token_id)
          PY
      - name: Verify canonical byte equality to final freeze
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os,time,urllib.request
          from pathlib import Path
          root=Path('/tmp/final-frozen'); hashes=json.loads((root/'dist-sha256.json').read_text()); base=os.environ['CANONICAL']
          targets={'index.html':'/','graph.jsonld':'/graph.jsonld','graph.ttl':'/graph.ttl','entity-facts.csv':'/entity-facts.csv','answers.txt':'/answers.txt','knowledge.xml':'/knowledge.xml','llms.txt':'/llms.txt','llms-full.txt':'/llms-full.txt','index.md':'/index.md','datapackage.json':'/datapackage.json','croissant.json':'/croissant.json','dcat.ttl':'/dcat.ttl','void.ttl':'/void.ttl','linkset.json':'/linkset.json','provenance.jsonld':'/provenance.jsonld','evidence-snapshot.json':'/evidence-snapshot.json','shapes.ttl':'/shapes.ttl','artifact-manifest.json':'/artifact-manifest.json'}
          def get(path):
              req=urllib.request.Request(base+path,headers={'User-Agent':'ghezelbaash-final-canonical-verifier/3.0','Accept-Encoding':'identity','Cache-Control':'no-cache'})
              with urllib.request.urlopen(req,timeout=45) as r:return r.status,r.headers,r.read()
          ok=False
          for i in range(30):
              try:
                  st,h,b=get('/graph.jsonld'); got=hashlib.sha256(b).hexdigest(); print('FINAL_V3_CONVERGENCE',i+1,got)
                  if st==200 and got==hashes['graph.jsonld']: ok=True; break
              except Exception as e: print('FINAL_V3_ERROR',i+1,type(e).__name__)
              time.sleep(2)
          if not ok: raise SystemExit('Canonical graph did not converge after user-owned token purge')
          for name,path in targets.items():
              st,h,b=get(path); got=hashlib.sha256(b).hexdigest()
              if st!=200 or got!=hashes[name]: raise SystemExit(f'Canonical SHA mismatch {name}: {got} != {hashes[name]}')
              if name=='graph.jsonld':
                  if h.get('Access-Control-Allow-Origin')!='*' or 'application/ld+json' not in (h.get('Content-Type') or ''): raise SystemExit('Graph HTTP contract drift')
                  if os.environ['VERSION_DOI'] not in b.decode('utf-8'): raise SystemExit('Final DOI absent from graph')
              if name=='index.html':
                  text=b.decode('utf-8')
                  for token in [os.environ['VERSION_DOI'],'hero-action hero-search-launch','verified-physician-identity-core','google-maps-clinic-reputation-current','quick-start-title']:
                      if token not in text: raise SystemExit(f'Final HTML token missing {token}')
          print(json.dumps({'stage':'FINAL_WEBSITE_BYTE_IDENTITY','artifactCount':len(targets),'graphSha256':hashes['graph.jsonld'],'indexHtmlSha256':hashes['index.html'],'integrity':'PASS'},separators=(',',':')))
          PY
      - name: Verify domain active and persist Website PASS
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,urllib.request
          from pathlib import Path
          req=urllib.request.Request(f"https://api.cloudflare.com/client/v4/accounts/{os.environ['CLOUDFLARE_ACCOUNT_ID']}/pages/projects/doctor-ghezelbaash/domains",headers={'Authorization':f"Bearer {os.environ['CLOUDFLARE_API_TOKEN']}",'Accept':'application/json'})
          with urllib.request.urlopen(req,timeout=30) as r:p=json.load(r)
          row=next((x for x in (p.get('result') or []) if x.get('name')=='www.ghezelbaash.ir'),None); assert row and row.get('status')=='active',row
          out={'stage':'FINAL_WEBSITE_VERIFIED','release':'1.1.1','versionDoi':os.environ['VERSION_DOI'],'frozenRunId':'31520584940','graphSha256':os.environ['EXPECTED_GRAPH_SHA'],'indexHtmlSha256':os.environ['EXPECTED_HTML_SHA'],'cachePurged':True,'ephemeralUserPurgeTokenRevoked':True,'customDomain':'active','integrity':'PASS'}
          Path('.release/website-verified.json').write_text(json.dumps(out,sort_keys=True,indent=2)+'\n'); print('FINAL_WEBSITE_VERIFIED_PASS')
          PY
          git config user.name ghezelbaash-release-bot
          git config user.email actions@users.noreply.github.com
          git add .release/website-verified.json
          git commit -m 'Record verified final canonical Website bytes [final-website]'
          git push origin HEAD:final/release-convergence

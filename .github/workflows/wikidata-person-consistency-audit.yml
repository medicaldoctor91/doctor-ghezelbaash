name: Wikidata person consistency audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wikidata-person-consistency-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check --no-input requests==2.32.5
      - name: Read live Wikidata person and authored works
        shell: python
        run: |
          import json, requests
          WD='https://www.wikidata.org/w/api.php'
          PERSON='Q140287622'
          WORKS=['Q36942316','Q140298431','Q140306302']
          UA='Medicaldoctor91PersonConsistencyAudit/1.0 (https://www.ghezelbaash.ir/)'
          s=requests.Session(); s.headers['User-Agent']=UA
          def get(p):
              r=s.get(WD,params={**p,'format':'json','formatversion':2},timeout=90)
              r.raise_for_status(); d=r.json()
              if 'error' in d: raise RuntimeError(d['error'])
              return d
          def ent(q):
              return get({'action':'wbgetentities','ids':q,'props':'claims|labels|descriptions|sitelinks|info','languages':'en|fa'})['entities'][q]
          def qid(sn):
              v=sn.get('datavalue',{}).get('value')
              if isinstance(v,dict): return v.get('id') or (f"Q{v['numeric-id']}" if isinstance(v.get('numeric-id'),int) else None)
              return None
          def sval(sn):
              v=sn.get('datavalue',{}).get('value')
              if isinstance(v,dict) and 'text' in v: return v['text']
              return v
          person=ent(PERSON)
          out={'person':{'lastrevid':person.get('lastrevid'),'P1412':[],'P3919':[],'sitelinks':person.get('sitelinks',{})},'works':{}}
          for c in person.get('claims',{}).get('P1412',[]):
              out['person']['P1412'].append({'claim':c.get('id'),'language_qid':qid(c.get('mainsnak',{})),'rank':c.get('rank'),'references':len(c.get('references',[]))})
          for c in person.get('claims',{}).get('P3919',[]):
              roles=[qid(x) for x in c.get('qualifiers',{}).get('P2868',[])]
              out['person']['P3919'].append({'claim':c.get('id'),'work':qid(c.get('mainsnak',{})),'roles':roles,'references':len(c.get('references',[])),'rank':c.get('rank')})
          for wq in WORKS:
              w=ent(wq)
              p31=[qid(c.get('mainsnak',{})) for c in w.get('claims',{}).get('P31',[])]
              p50=[]
              for c in w.get('claims',{}).get('P50',[]):
                  target=qid(c.get('mainsnak',{}))
                  if target==PERSON:
                      ords=[sval(x) for x in c.get('qualifiers',{}).get('P1545',[])]
                      p50.append({'claim':c.get('id'),'author':target,'ordinals':ords,'references':len(c.get('references',[]))})
              speakers=[]
              for c in w.get('claims',{}).get('P823',[]):
                  target=qid(c.get('mainsnak',{}))
                  if target==PERSON: speakers.append({'claim':c.get('id'),'speaker':target,'references':len(c.get('references',[]))})
              out['works'][wq]={
                  'lastrevid':w.get('lastrevid'),
                  'label':w.get('labels',{}).get('en',{}).get('value'),
                  'P31':p31,
                  'P50_person':p50,
                  'P823_person':speakers,
              }
          # Search for an item carrying the exact English Wikiversity sitelink, if any.
          title='Botulinum toxin in aesthetic medicine'
          site='enwikiversity'
          bytitle=get({'action':'wbgetentities','sites':site,'titles':title,'props':'claims|labels|sitelinks|info'})
          out['wikiversity_lookup']=bytitle.get('entities',{})
          print(json.dumps(out,ensure_ascii=False,indent=2,default=str))

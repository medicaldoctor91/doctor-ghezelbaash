name: Wikidata incident state audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wikidata-incident-state-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check --no-input requests==2.32.5
      - name: Read current four-item state and account edit log
        shell: python
        run: |
          import json, requests
          WD='https://www.wikidata.org/w/api.php'; UA='Medicaldoctor91IncidentAudit/1.0 (https://www.ghezelbaash.ir/)'
          s=requests.Session(); s.headers['User-Agent']=UA
          ids=['Q36942316','Q140298431','Q141099144','Q141099146','Q140287622']
          def get(p):
            r=s.get(WD,params={**p,'format':'json','formatversion':2},timeout=90); r.raise_for_status(); d=r.json()
            if 'error' in d: raise RuntimeError(d['error'])
            return d
          def val(c):
            v=c.get('mainsnak',{}).get('datavalue',{}).get('value')
            if isinstance(v,dict): return v.get('id') or v.get('text') or v.get('time') or v
            return v
          d=get({'action':'wbgetentities','ids':'|'.join(ids),'props':'claims|labels|descriptions|aliases|sitelinks|info','redirects':'yes'})
          out={'top_level_keys':list(d),'entities':{},'redirects_field':d.get('redirects')}
          for key,e in d.get('entities',{}).items():
            claims=[]
            for p,arr in e.get('claims',{}).items():
              for c in arr:
                claims.append({'id':c.get('id'),'property':p,'value':val(c),'refs':len(c.get('references',[])),'qualifiers':{qp:[val({'mainsnak':x}) for x in qv] for qp,qv in c.get('qualifiers',{}).items()}})
            out['entities'][key]={'id':e.get('id'),'missing':e.get('missing'),'redirect':e.get('redirect'),'lastrevid':e.get('lastrevid'),'label':e.get('labels',{}).get('en',{}).get('value'),'description':e.get('descriptions',{}).get('en',{}).get('value'),'aliases':[x.get('value') for x in e.get('aliases',{}).get('en',[])],'claims':claims}
          uc=get({'action':'query','list':'usercontribs','ucuser':'Medicaldoctor91','ucnamespace':0,'ucstart':'2026-08-15T22:56:00Z','ucend':'2026-08-15T22:44:00Z','uclimit':'max','ucprop':'ids|title|timestamp|comment|flags'})
          out['recent_contribs']=uc.get('query',{}).get('usercontribs',[])
          print(json.dumps(out,ensure_ascii=False,indent=2,default=str))

name: v1.2.2 temporary bind current main ancestry

on:
  push:
    branches: [release/v1.2.2-candidate]
    paths:
      - '.github/workflows/v122-bind-current-main-temporary.yml'

permissions:
  contents: write

concurrency:
  group: doctor-ghezelbaash-external-mutation
  cancel-in-progress: false

env:
  CANDIDATE_BRANCH: release/v1.2.2-candidate
  EXPECTED_CLEAN_TREE: 7a90e7d55de47ac378d0a007cb4564103dff7867

jobs:
  bind:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: release/v1.2.2-candidate
          fetch-depth: 0
          persist-credentials: true
      - name: Merge current main into ancestry without changing candidate tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main
          MAIN_SHA=$(git rev-parse origin/main)
          BEFORE=$(git rev-parse HEAD^{tree})
          test "$BEFORE" != "$EXPECTED_CLEAN_TREE"
          git merge -s ours --no-ff -m "Bind current main ancestry for v1.2.2 release" origin/main
          git rm .github/workflows/v122-bind-current-main-temporary.yml
          git commit -m "Remove temporary v1.2.2 ancestry binder"
          AFTER=$(git rev-parse HEAD^{tree})
          echo "MAIN_SHA=$MAIN_SHA"
          echo "CLEAN_TREE=$AFTER"
          test "$AFTER" = "$EXPECTED_CLEAN_TREE"
          git merge-base --is-ancestor "$MAIN_SHA" HEAD
          test "$(node -p "require('./src/data/release.json').release")" = 1.2.1
          git push origin HEAD:$CANDIDATE_BRANCH

name: PR401 Hero 768 calibration

on:
  push:
    branches:
      - refactor/single-source-truth-no-dist-drift
    paths:
      - .github/workflows/pr401-hero-768-calibration.yml

permissions:
  contents: write

jobs:
  calibrate-and-apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: refactor/single-source-truth-no-dist-drift
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium for temporary proof
        run: npx playwright install chromium
      - name: Install calibration encoder
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Generate temporary 768w candidates
        shell: bash
        run: |
          set -euo pipefail
          base=public/media/images/physician
          ffmpeg -loglevel error -y -i "$base/saeed-ghezelbash-portrait-960.abde9c5ed375.avif" -vf scale=768:512 -frames:v 1 -c:v libaom-av1 -crf 16 -still-picture 1 /tmp/hero-768.avif
          ffmpeg -loglevel error -y -i "$base/saeed-ghezelbash-portrait-960.637a6fbe30a3.webp" -vf scale=768:512 -frames:v 1 -c:v libwebp -quality 88 /tmp/hero-768.webp
          AVIF_HASH=$(sha256sum /tmp/hero-768.avif | cut -c1-12)
          WEBP_HASH=$(sha256sum /tmp/hero-768.webp | cut -c1-12)
          AVIF_NAME="saeed-ghezelbash-portrait-768.${AVIF_HASH}.avif"
          WEBP_NAME="saeed-ghezelbash-portrait-768.${WEBP_HASH}.webp"
          cp /tmp/hero-768.avif "$base/$AVIF_NAME"
          cp /tmp/hero-768.webp "$base/$WEBP_NAME"
          echo "AVIF_NAME=$AVIF_NAME" >> "$GITHUB_ENV"
          echo "WEBP_NAME=$WEBP_NAME" >> "$GITHUB_ENV"
      - name: Apply temporary source calibration
        run: node scripts/pr401-hero-768-calibration.mjs
      - name: Recalibrate render fingerprint
        run: npm run render:calibration:update
      - name: Build temporary candidate
        run: npm run build
      - name: Prove Chromium selection and byte reduction
        run: node scripts/test-hero-delivery.mjs dist
      - name: Commit only after proof passes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/pr401-hero-768-calibration.yml scripts/pr401-hero-768-calibration.mjs
          git add -A
          git diff --cached --check
          git commit -m "perf(hero): add calibrated 768w responsive candidate"
          git push origin HEAD:refactor/single-source-truth-no-dist-drift

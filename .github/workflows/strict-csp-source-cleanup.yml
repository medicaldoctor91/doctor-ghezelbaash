name: Harden inline style policy and clean production source

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/strict-csp-source-cleanup.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Replace all inline style attributes with stable classes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          page = Path('src/pages/index.md')
          css = Path('src/styles/global.css')
          s = page.read_text(encoding='utf-8')

          replacements = {
            ' style="font-style: normal;"': ' class="u-not-italic"',
            ' style="direction: rtl; text-align: right; cursor: pointer;"': ' class="u-rtl-right u-pointer"',
            ' style="direction: ltr; text-align: left; cursor: pointer;"': ' class="u-ltr-left u-pointer"',
            ' style="direction: rtl; text-align: right;"': ' class="u-rtl-right"',
            ' style="direction: ltr; text-align: left;"': ' class="u-ltr-left"',
          }
          expected = {
            ' style="font-style: normal;"': 1,
            ' style="direction: rtl; text-align: right; cursor: pointer;"': 2,
            ' style="direction: ltr; text-align: left; cursor: pointer;"': 2,
            ' style="direction: rtl; text-align: right;"': 4,
            ' style="direction: ltr; text-align: left;"': 4,
          }
          for old, count in expected.items():
              actual = s.count(old)
              if actual != count:
                  raise SystemExit(f'Unexpected source count for {old!r}: {actual}, expected {count}')
              s = s.replace(old, replacements[old])
          if ' style=' in s:
              raise SystemExit('Unexpected inline style attribute remains in src/pages/index.md')
          page.write_text(s, encoding='utf-8')

          c = css.read_text(encoding='utf-8')
          marker = '/* Strict CSP utility classes for semantic language blocks. */'
          block = '''

/* Strict CSP utility classes for semantic language blocks. */
.u-not-italic {
  font-style: normal;
}

.u-rtl-right {
  direction: rtl;
  text-align: right;
}

.u-ltr-left {
  direction: ltr;
  text-align: left;
}

.u-pointer {
  cursor: pointer;
}
'''
          if marker in c:
              raise SystemExit('Strict CSP utility block already exists unexpectedly')
          css.write_text(c.rstrip() + block, encoding='utf-8')
          PY
          git diff --check

      - name: Build deterministic production output
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Generate strict CSP from exact production bytes
        shell: bash
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import base64, hashlib, json, re

          class Collector(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=False)
                  self.capture = None
                  self.buf = []
                  self.styles = []
                  self.scripts = []
                  self.style_attrs = []
                  self.external_scripts = []
              def handle_starttag(self, tag, attrs):
                  d = dict(attrs)
                  if 'style' in d: self.style_attrs.append((tag, d['style']))
                  if tag == 'script' and d.get('src'): self.external_scripts.append(d['src'])
                  if tag == 'style': self.capture = 'style'; self.buf = []
                  elif tag == 'script' and not d.get('src'): self.capture = 'script'; self.buf = []
              def handle_data(self, data):
                  if self.capture: self.buf.append(data)
              def handle_entityref(self, name):
                  if self.capture: self.buf.append('&' + name + ';')
              def handle_charref(self, name):
                  if self.capture: self.buf.append('&#' + name + ';')
              def handle_endtag(self, tag):
                  if tag == self.capture:
                      value = ''.join(self.buf)
                      (self.styles if tag == 'style' else self.scripts).append(value)
                      self.capture = None; self.buf = []

          html = Path('dist/index.html').read_text(encoding='utf-8')
          p = Collector(); p.feed(html)
          if p.style_attrs:
              raise SystemExit(f'Inline style attributes remain: {p.style_attrs[:20]}')
          if p.external_scripts:
              raise SystemExit(f'External scripts remain: {p.external_scripts}')
          if len(p.styles) != 1:
              raise SystemExit(f'Expected one inline style block, found {len(p.styles)}')
          if len(p.scripts) != 1:
              raise SystemExit(f'Expected one inline JSON-LD block, found {len(p.scripts)}')
          json.loads(p.scripts[0])

          token = lambda value: "'sha256-" + base64.b64encode(hashlib.sha256(value.encode('utf-8')).digest()).decode('ascii') + "'"
          style_hash = token(p.styles[0])
          script_hash = token(p.scripts[0])
          csp = '; '.join([
              "default-src 'self'",
              "base-uri 'self'",
              "object-src 'none'",
              "frame-ancestors 'none'",
              "form-action 'self'",
              f"script-src 'self' {script_hash}",
              "script-src-attr 'none'",
              f"style-src 'self' {style_hash}",
              "style-src-attr 'none'",
              "img-src 'self' data:",
              "media-src 'self'",
              "font-src 'self'",
              "connect-src 'none'",
              "manifest-src 'self'",
              "worker-src 'none'",
              "frame-src 'none'",
              "upgrade-insecure-requests",
          ])
          if len(csp) > 1900:
              raise SystemExit(f'CSP too long: {len(csp)}')

          hp = Path('public/_headers')
          headers = hp.read_text(encoding='utf-8')
          pattern = r'(?m)^  Content-Security-Policy: .+$'
          if len(re.findall(pattern, headers)) != 1:
              raise SystemExit('Expected exactly one existing CSP line')
          headers = re.sub(pattern, '  Content-Security-Policy: ' + csp, headers, count=1)
          hp.write_text(headers.rstrip() + '\n', encoding='utf-8')

          report = {
              'htmlBytes': len(html.encode('utf-8')),
              'inlineStyleAttributes': 0,
              'inlineStyles': 1,
              'inlineScripts': 1,
              'styleHash': style_hash,
              'scriptHash': script_hash,
              'csp': csp,
              'cspLength': len(csp),
          }
          Path('tmp/strict-csp-manifest.json').write_text(json.dumps(report, ensure_ascii=False, indent=2), encoding='utf-8')
          PY

      - name: Rebuild and verify strict CSP is deterministic
        run: |
          npm run build
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import base64, hashlib, json

          class C(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=False); self.cap=None; self.buf=[]; self.styles=[]; self.scripts=[]; self.style_attrs=[]
              def handle_starttag(self,t,a):
                  d=dict(a)
                  if 'style' in d:self.style_attrs.append((t,d['style']))
                  if t=='style':self.cap='style';self.buf=[]
                  elif t=='script' and not d.get('src'):self.cap='script';self.buf=[]
              def handle_data(self,d):
                  if self.cap:self.buf.append(d)
              def handle_entityref(self,n):
                  if self.cap:self.buf.append('&'+n+';')
              def handle_charref(self,n):
                  if self.cap:self.buf.append('&#'+n+';')
              def handle_endtag(self,t):
                  if t==self.cap:
                      (self.styles if t=='style' else self.scripts).append(''.join(self.buf));self.cap=None;self.buf=[]

          html=Path('dist/index.html').read_text(encoding='utf-8'); c=C(); c.feed(html)
          m=json.loads(Path('tmp/strict-csp-manifest.json').read_text(encoding='utf-8'))
          tok=lambda x:"'sha256-"+base64.b64encode(hashlib.sha256(x.encode('utf-8')).digest()).decode('ascii')+"'"
          assert not c.style_attrs
          assert len(c.styles)==1 and len(c.scripts)==1
          assert tok(c.styles[0])==m['styleHash']
          assert tok(c.scripts[0])==m['scriptHash']
          assert Path('dist/index.html').stat().st_size < 1_900_000
          headers=Path('public/_headers').read_text(encoding='utf-8')
          assert "style-src-attr 'none'" in headers
          assert "connect-src 'none'" in headers
          assert m['styleHash'] in headers and m['scriptHash'] in headers
          PY
          git diff --check

      - name: Remove stale benchmark artifacts and commit production hardening
        shell: bash
        run: |
          git config user.name 'OpenAI Project Automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/strict-csp-source-cleanup.yml
          rm -f \
            tmp/csp-diagnostic.txt \
            tmp/csp-manifest.json \
            tmp/performance-pass1.json \
            tmp/performance-images720.json \
            tmp/performance-defer-jsonld.json \
            tmp/performance-optional-font.json \
            tmp/performance-lightweight640.json \
            tmp/live-current-performance.json \
            tmp/performance-delivery-images.json \
            tmp/performance-direct-sections.json \
            tmp/performance-portrait-priority.json \
            tmp/performance-culprits.json \
            tmp/post-finalization-audit.json
          git add -A
          git commit -m 'Enforce strict hash CSP and clean production source'
          git pull --rebase origin main
          git push origin HEAD:main

name: Validate crawler parity across all 72 pages and full RDF graph (read-only)
on:
  push:
    branches: [codex/136-crawler-parity-72-gate-20261121, codex/full-rdf-jsonld-homepage-first-1-3-6]
permissions:
  contents: read
concurrency:
  group: doctor-ghezelbaash-136-all-crawler-parity
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests
      - name: Verify 72 canonical URLs and graph under both User-Agent identities
        run: python .github/scripts/audit_136_all_page_crawler_parity.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: googlebot-parity-all-72-pages
          path: /tmp/136-crawler-parity-72/report.json
          if-no-files-found: warn
          retention-days: 30

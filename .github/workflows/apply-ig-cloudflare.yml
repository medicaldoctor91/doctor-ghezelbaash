name: Apply IG Cloudflare redirect

on:
  push:
    branches:
      - ops/apply-ig-cloudflare-2026-08-30

permissions:
  contents: read

concurrency:
  group: doctor-ghezelbaash-external-mutation
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - name: Checkout exact merged main contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 24ee066d19d8f4376baa168092e28740ebddf824
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14.6'
      - run: npm ci
      - name: Load and validate platform contract
        shell: bash
        run: |
          set -euo pipefail
          node scripts/platform-contract.mjs export >> "$GITHUB_ENV"
          node scripts/platform-contract.mjs validate
      - name: Assert source contract changes only IG target
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('node:fs');
          const doc=JSON.parse(fs.readFileSync('src/data/subdomain-redirects.json','utf8'));
          const byRef=new Map(doc.singleRedirects.rules.map(r=>[r.ref,r]));
          const ig=byRef.get('ghezelbaash_ig_ai_corpus_v1');
          const github=byRef.get('ghezelbaash_github_entity_graph_v1');
          if(ig?.host!=='ig.ghezelbaash.ir'||ig?.target!=='https://www.ghezelbaash.ir/'||ig?.statusCode!==301)throw new Error('Merged IG redirect contract is not exact');
          if(github?.host!=='github.ghezelbaash.ir'||github?.target!=='https://www.ghezelbaash.ir/graph.jsonld'||github?.statusCode!==301)throw new Error('GitHub graph redirect contract changed unexpectedly');
          NODE
      - name: Build exact merged main source
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_COMMIT="$(git rev-parse HEAD)"
          test "$SOURCE_COMMIT" = "24ee066d19d8f4376baa168092e28740ebddf824"
          export SOURCE_COMMIT
          export CF_PAGES_COMMIT_SHA="$SOURCE_COMMIT"
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          npm run build
      - name: Reconcile managed Single Redirects through existing Cloudflare secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          python scripts/configure-cloudflare-edge.py \
            --apply-subdomains-only \
            --outcome ig-subdomain-reconciliation.json
          test -s ig-subdomain-reconciliation.json
      - name: Verify live IG consolidation and GitHub graph preservation
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          import urllib.error, urllib.request

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          opener=urllib.request.build_opener(NoRedirect)
          checks={
              'https://ig.ghezelbaash.ir/':'https://www.ghezelbaash.ir/',
              'https://github.ghezelbaash.ir/':'https://www.ghezelbaash.ir/graph.jsonld',
          }
          for source, expected in checks.items():
              req=urllib.request.Request(source,method='HEAD',headers={'User-Agent':'Mozilla/5.0 entity-consolidation-verifier'})
              try:
                  resp=opener.open(req,timeout=30)
                  status=resp.status
                  location=resp.headers.get('Location')
              except urllib.error.HTTPError as exc:
                  status=exc.code
                  location=exc.headers.get('Location')
              if status != 301:
                  raise SystemExit(f'{source} expected 301, got {status}')
              if location != expected:
                  raise SystemExit(f'{source} expected Location {expected!r}, got {location!r}')
              print(f'LIVE_REDIRECT_PASS {source} -> {location} [{status}]')
          PY

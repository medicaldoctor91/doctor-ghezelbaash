name: Validate solo-practice projection repair
on:
  push:
    branches: [fix/solo-practice-machine-projections-20261017]
    paths:
      - src/lib/machine-output.mjs
      - tests/machine-output.test.mjs
      - .github/workflows/validate-solo-practice-projection-fix.yml
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version-file: .nvmrc, cache: npm}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install production validators
        run: |
          npm ci
          python -m pip install --disable-pip-version-check 'rdflib>=7,<8' 'pyshacl>=0.30,<1' 'mlcroissant==1.1.1'
      - name: Validate exact production build stack
        run: |
          node --test tests/*.test.mjs
          npm run build
          python tests/validate_platform_bundle.py dist --no-query --rdf
          python tests/validate_machine_resources.py dist
          python - <<'PY'
          from pathlib import Path
          clinic=Path('dist/clinic.vcf').read_text(encoding='utf-8')
          xml=Path('dist/knowledge.xml').read_text(encoding='utf-8')
          assert 'FN:' in clinic and 'ORG:' in clinic and 'UID:https://www.ghezelbaash.ir/dr-saeed-ghezelbash-aesthetic-clinic-kermanshah' in clinic
          assert 'FN:\r\n' not in clinic and 'ORG:\r\n' not in clinic
          assert '<clinic id="https://www.ghezelbaash.ir/dr-saeed-ghezelbash-aesthetic-clinic-kermanshah">' in xml
          assert '<clinic id=""><name></name></clinic>' not in xml
          print('Solo-practice vCard and knowledge XML projections are nonempty and canonical')
          PY

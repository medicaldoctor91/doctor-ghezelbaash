name: Publish WikiJournal focused-review preprint

on:
  push:
    branches: [main]
    paths:
      - 'wikijournal/individualized-bonta-assessment/manuscript.wiki'
      - 'scripts/wikijournal_preprint_publish.py'
      - '.github/workflows/wikijournal-preprint-publish.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wikijournal-individualized-bonta-preprint
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      WIKIVERSITY_API_URL: https://en.wikiversity.org/w/api.php
      WIKIJOURNAL_PAGE_TITLE: 'WikiJournal Preprints/Individualized clinical assessment and outcome interpretation in aesthetic botulinum neurotoxin type A treatment: a focused review'
      WIKIJOURNAL_PAGE_FILE: wikijournal/individualized-bonta-assessment/manuscript.wiki
      WIKIJOURNAL_RESULT_FILE: wikijournal/individualized-bonta-assessment/publish-result.json
      WIKIJOURNAL_ALLOW_UPDATE: 'true'
      WIKIJOURNAL_EDIT_SUMMARY: 'Create or update author-controlled focused-review preprint for WikiJournal of Medicine; exact repository read-back verification enabled'
      WIKIVERSITY_USERNAME: ${{ secrets.WIKIVERSITY_USERNAME }}
      WIKIVERSITY_BOT_PASSWORD: ${{ secrets.WIKIVERSITY_BOT_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14.6'
      - name: Install publisher dependency
        run: python -m pip install --disable-pip-version-check --no-input requests==2.32.5
      - name: Validate Wikimedia credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$WIKIVERSITY_USERNAME"
          test -n "$WIKIVERSITY_BOT_PASSWORD"
      - name: Publish and verify WikiJournal preprint
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$WIKIJOURNAL_RESULT_FILE")"
          python scripts/wikijournal_preprint_publish.py | tee "$WIKIJOURNAL_RESULT_FILE"
      - name: Commit verified publication result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Ghezelbaash WikiJournal Publisher'
          git config user.email 'medicaldoctor91@users.noreply.github.com'
          git add "$WIKIJOURNAL_RESULT_FILE"
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Record verified WikiJournal preprint publication result'
          git push

name: Temporary publication hardening proof

on:
  push:
    branches:
      - fix/publication-consistency-hardening-20260817

permissions:
  contents: read

concurrency:
  group: doctor-ghezelbaash-publication-hardening-proof
  cancel-in-progress: true

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - name: Load platform contract
        run: node scripts/export-platform-contract.mjs >> "$GITHUB_ENV"
      - name: Resolve exact online main truth
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --force
          MAIN_SHA="$(git rev-parse origin/main)"
          MAIN_EPOCH="$(git show -s --format=%ct "$MAIN_SHA")"
          PLACE_ID="$(node -p "require('./src/data/release.json').clinic.placeId")"
          HF_URL="$(node -p "require('./src/data/release.json').dataset.huggingFace.dataset")"
          HF_REPO="${HF_URL#https://huggingface.co/datasets/}"
          printf 'MAIN_SHA=%s\nMAIN_EPOCH=%s\nPLACE_ID=%s\nHF_REPO=%s\n' "$MAIN_SHA" "$MAIN_EPOCH" "$PLACE_ID" "$HF_REPO" >> "$GITHUB_ENV"
          echo "ONLINE_MAIN_SHA=$MAIN_SHA"
      - name: Verify Google Places source with live API secret
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GOOGLE_PLACES_API_KEY:-}"; echo "::add-mask::$GOOGLE_PLACES_API_KEY"
          curl --fail --silent --show-error -H "X-Goog-Api-Key: $GOOGLE_PLACES_API_KEY" -H 'X-Goog-FieldMask: id,rating,userRatingCount,businessStatus,movedPlace,movedPlaceId' "https://places.googleapis.com/v1/places/$PLACE_ID" > /tmp/place.json
          node --input-type=module <<'NODE'
          import {readFile} from 'node:fs/promises';
          const place=JSON.parse(await readFile('/tmp/place.json','utf8'));
          const release=JSON.parse(await readFile('src/data/release.json','utf8'));
          const volatile=JSON.parse(await readFile('src/data/volatile-facts.json','utf8'));
          if(place.id!==release.clinic.placeId)throw new Error(`Place ID drift ${place.id}`);
          if(place.businessStatus&&place.businessStatus!=='OPERATIONAL')throw new Error(`Place status ${place.businessStatus}`);
          if(place.movedPlace||place.movedPlaceId)throw new Error('Google reports moved place');
          if(Number(place.rating)!==Number(volatile.rating)||Number(place.userRatingCount)!==Number(volatile.reviewCount))throw new Error(`Google/source reputation drift live=${place.rating}/${place.userRatingCount} source=${volatile.rating}/${volatile.reviewCount}`);
          console.log(JSON.stringify({googlePlacesLiveExact:true,rating:place.rating,reviewCount:place.userRatingCount,placeId:place.id}));
          NODE
      - name: Build exact authoritative main bytes with candidate pipeline
        shell: bash
        run: |
          set -euo pipefail
          export SOURCE_COMMIT="$MAIN_SHA" CF_PAGES_COMMIT_SHA="$MAIN_SHA" SOURCE_DATE_EPOCH="$MAIN_EPOCH"
          npm run build
      - name: Verify Cloudflare project contract with real secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/ensure-cloudflare-pages-git-deployment.mjs --verify-config
      - name: Fetch and prove online first-party bytes
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-cloudflare-pages-deployment.mjs --fresh-only
          node scripts/verify-cloudflare-pages-deployment.mjs
          node scripts/verify-current-serving.mjs --website-only
          node scripts/verify-public-discovery-freshness.mjs
      - name: Verify or repair Hugging Face current observation with real secret
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN || secrets.HUGGINGFACE_TOKEN || secrets.HUGGING_FACE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if node scripts/verify-current-serving.mjs --hf-only; then
            echo 'HF_ALREADY_EXACT'
          else
            test -n "${HF_TOKEN:-}"; echo "::add-mask::$HF_TOKEN"
            rm -rf .release/huggingface-proof
            git clone --depth=1 "https://oauth2:${HF_TOKEN}@huggingface.co/datasets/$HF_REPO" .release/huggingface-proof
            node scripts/sync-hf-live-observations.mjs .release/huggingface-proof
            git -C .release/huggingface-proof config user.name ghezelbaash-reputation-bot
            git -C .release/huggingface-proof config user.email actions@users.noreply.github.com
            git -C .release/huggingface-proof add live_observations.csv live-observation-attestation.json
            git -C .release/huggingface-proof diff --cached --quiet || git -C .release/huggingface-proof commit -m "Repair current Google reputation observation"
            git -C .release/huggingface-proof push origin HEAD:main
          fi
          for attempt in $(seq 1 12); do
            node scripts/verify-current-serving.mjs --hf-only && exit 0
            sleep 5
          done
          exit 1
      - name: Prove complete online cross-surface convergence
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-current-serving.mjs
          test -z "$(git status --porcelain --untracked-files=no)"
          echo 'PUBLICATION_HARDENING_ONLINE_PROOF_PASS'

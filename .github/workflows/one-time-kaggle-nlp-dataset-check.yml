name: One-time Kaggle NLP dataset check

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-time-kaggle-nlp-dataset-check.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Build current source
        run: |
          set -euo pipefail
          npm ci
          npm run build

      - name: Inspect Kaggle NLP dataset
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, io, json, urllib.parse, urllib.request, zipfile
          from pathlib import Path

          ref="saeedghezelbash/dr-saeed-ghezelbash-knowledge-graph-and-nlp-data"
          base="https://www.kaggle.com/api/v1/datasets"
          def get(url,timeout=180):
              req=urllib.request.Request(url,headers={"User-Agent":"doctor-ghezelbaash-kaggle-check/1.0"})
              try:
                  with urllib.request.urlopen(req,timeout=timeout) as resp:
                      return resp.status,resp.read(),dict(resp.headers)
              except urllib.error.HTTPError as e:
                  return e.code,e.read(),dict(e.headers)

          view_status,view_body,_=get(f"{base}/view/{ref}")
          download_status,download_body,_=get(f"{base}/download/{ref}")
          search_status,search_body,_=get(f"{base}/list?search=saeed%20ghezelbash")

          meta=None
          if view_status==200:
              try: meta=json.loads(view_body)
              except Exception: pass

          search_matches=[]
          if search_status==200:
              try:
                  rows=json.loads(search_body)
                  if not isinstance(rows,list):
                      rows=rows.get("datasets") or rows.get("results") or []
                  for x in rows:
                      if isinstance(x,dict) and "saeedghezelbash" in str(x.get("ref","")).lower():
                          search_matches.append({
                              "ref":x.get("ref"),
                              "title":x.get("title"),
                              "lastUpdated":x.get("lastUpdated"),
                              "currentVersionNumber":x.get("currentVersionNumber"),
                              "totalBytes":x.get("totalBytes"),
                          })
              except Exception:
                  pass

          result={
              "ref":ref,
              "viewStatus":view_status,
              "downloadStatus":download_status,
              "searchStatus":search_status,
              "searchMatches":search_matches,
              "metadata":{
                  "title":meta.get("title") if isinstance(meta,dict) else None,
                  "description":meta.get("description") if isinstance(meta,dict) else None,
                  "currentVersionNumber":meta.get("currentVersionNumber") if isinstance(meta,dict) else None,
                  "lastUpdated":meta.get("lastUpdated") if isinstance(meta,dict) else None,
                  "totalBytes":meta.get("totalBytes") if isinstance(meta,dict) else None,
                  "isPrivate":meta.get("isPrivate") if isinstance(meta,dict) else None,
                  "licenseName":meta.get("licenseName") if isinstance(meta,dict) else None,
                  "downloadCount":meta.get("downloadCount") if isinstance(meta,dict) else None,
              },
          }

          if download_status==200:
              z=zipfile.ZipFile(io.BytesIO(download_body))
              names=z.namelist()
              result["zipValid"]=True
              result["fileCount"]=len(names)
              result["inventory"]=names

              def h(b): return hashlib.sha256(b).hexdigest()
              source_candidates=[
                  "src/content-source/page.md",
                  "src/data/semantic/knowledge-graph.jsonld",
                  "src/data/semantic/shapes.ttl",
                  "src/data/release.json",
                  "src/data/machine-resources.json",
                  "README.md",
                  "CITATION.cff",
                  "codemeta.json",
                  "package.json",
                  "package-lock.json",
              ]
              source_rows=[]
              for name in source_candidates:
                  if name in names and Path(name).is_file():
                      source_rows.append({
                          "file":name,
                          "equalCurrentSource":h(z.read(name))==h(Path(name).read_bytes()),
                      })
              result["sourceCompared"]=len(source_rows)
              result["sourceEqualCount"]=sum(1 for r in source_rows if r["equalCurrentSource"])
              result["sourceMismatchCount"]=sum(1 for r in source_rows if not r["equalCurrentSource"])
              result["sourceRows"]=source_rows

              live_graph_status,live_graph,_=get("https://www.ghezelbaash.ir/graph.jsonld")
              kg_name="src/data/semantic/knowledge-graph.jsonld"
              result["graphEqualsLiveWebsiteGraph"]=(
                  live_graph_status==200 and kg_name in names and h(z.read(kg_name))==h(live_graph)
              )

              claims=[
                  "Iran's #1 doctor by public reputation signals",
                  "highest patient satisfaction",
                  "Kermanshah's most popular doctor",
                  "Kermanshah's top-rated aesthetic physician",
                  "among Iran's most reviewed aesthetic doctors",
                  "one of Kermanshah's most recommended physicians",
                  "leading in patient trust",
              ]
              text=[]
              for name in names:
                  if name.endswith((".md",".json",".jsonld",".ttl",".txt",".csv",".cff")):
                      try:
                          b=z.read(name)
                          if len(b)<=8_000_000:
                              text.append(b.decode("utf-8","ignore"))
                      except Exception:
                          pass
              alltext="\n".join(text)
              result["claimsPresent"]={c:(c in alltext) for c in claims}
          else:
              result["zipValid"]=False

          print(json.dumps(result,ensure_ascii=False,indent=2))
          PY

name: Complete 2021 Wikisource work

on:
  push:
    branches: [main]
    paths:
      - 'scripts/wikisource_complete_2021.py'
      - 'scripts/wikisource_complete_2021_entry.py'
      - '.github/workflows/wikisource-complete-2021.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wikisource-complete-2021
  cancel-in-progress: false

jobs:
  complete:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      WIKIMEDIA_USERNAME: ${{ secrets.WIKIVERSITY_USERNAME }}
      WIKIMEDIA_BOT_PASSWORD: ${{ secrets.WIKIVERSITY_BOT_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --no-input requests==2.32.5 pypdf==6.16.1
      - name: Validate secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$WIKIMEDIA_USERNAME"
          test -n "$WIKIMEDIA_BOT_PASSWORD"
      - name: Compile before external writes
        run: |
          python -m py_compile scripts/wikisource_complete_2021.py
          python -m py_compile scripts/wikisource_complete_2021_entry.py
      - name: Complete Wikisource work with retry/backoff
        run: python scripts/wikisource_complete_2021_entry.py

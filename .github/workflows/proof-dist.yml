name: Temporary byte-exact dist proof

on:
  push:
    branches:
      - minimize/source-no-dist-drift-2026-09-15

permissions:
  contents: read

env:
  ASTRO_TELEMETRY_DISABLED: "1"

jobs:
  dist:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build distribution using mutating production steps only
        shell: bash
        run: |
          set -euo pipefail
          node scripts/generated-workspace.mjs reset
          node scripts/generate-rdf.mjs
          node scripts/generate-projections.mjs distribution
          node scripts/generate-retrieval-projections.mjs
          node scripts/generate-descriptors.mjs
          npx astro build
          node scripts/materialize-static-artifacts.mjs
          node scripts/indexnow.mjs prepare
          node scripts/generate-deployment-headers.mjs
      - name: Write byte-exact manifest
        shell: bash
        run: |
          set -euo pipefail
          find dist -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > dist.sha256
          wc -l dist.sha256
          sha256sum dist.sha256
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dist-proof-${{ github.sha }}
          path: |
            dist/
            dist.sha256
          if-no-files-found: error
          retention-days: 7

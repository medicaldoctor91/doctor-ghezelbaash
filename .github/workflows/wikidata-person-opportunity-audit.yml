name: Wikidata person opportunity audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wikidata-person-opportunity-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install requests
        run: python -m pip install --disable-pip-version-check --no-input requests==2.32.5
      - name: Audit live Wikidata and Commons
        shell: python
        run: |
          import json, requests
          from collections import OrderedDict

          WD='https://www.wikidata.org/w/api.php'
          CM='https://commons.wikimedia.org/w/api.php'
          UA='Medicaldoctor91WikidataOpportunityAudit/1.0 (https://www.ghezelbaash.ir/)'
          s=requests.Session(); s.headers['User-Agent']=UA

          def get(url, params):
              r=s.get(url, params={**params,'format':'json','formatversion':2}, timeout=60)
              r.raise_for_status(); d=r.json()
              if 'error' in d: raise SystemExit(json.dumps(d['error'],ensure_ascii=False))
              return d

          def qid(snak):
              v=snak.get('datavalue',{}).get('value')
              if isinstance(v,dict): return v.get('id') or (f"Q{v['numeric-id']}" if isinstance(v.get('numeric-id'),int) else None)
              return None

          def scalar(snak): return snak.get('datavalue',{}).get('value')

          item=get(WD, {'action':'wbgetentities','ids':'Q140287622','props':'claims|labels|descriptions|aliases|sitelinks|info'})['entities']['Q140287622']
          claims=item.get('claims',{})
          item_qids=set()
          for arr in claims.values():
              for c in arr:
                  q=qid(c.get('mainsnak',{}))
                  if q: item_qids.add(q)
          labels={}
          if item_qids:
              ids=list(item_qids)
              for i in range(0,len(ids),50):
                  d=get(WD, {'action':'wbgetentities','ids':'|'.join(ids[i:i+50]),'props':'labels','languages':'en|fa'})['entities']
                  for k,v in d.items():
                      labels[k]=(v.get('labels',{}).get('en') or v.get('labels',{}).get('fa') or {}).get('value',k)

          rows=[]
          for p in sorted(claims):
              vals=[]; refn=0
              for c in claims[p]:
                  sn=c.get('mainsnak',{})
                  q=qid(sn)
                  v=labels.get(q,q) if q else scalar(sn)
                  if isinstance(v,dict) and 'time' in v: v=v['time']
                  vals.append(v)
                  refn += len(c.get('references',[]))
              rows.append({'property':p,'count':len(claims[p]),'values':vals,'references':refn})

          candidate_props=['P10','P101','P106','P18','P1472','P373','P856','P496','P2671','P1830','P937','P69','P512','P108','P1412','P27','P19','P569','P21','P463','P166','P800']

          # Search Wikidata for possible learning-resource item and candidate topic items.
          searches={}
          for term in ['Botulinum toxin in aesthetic medicine','botulinum toxin','dermal filler','aesthetic medicine','Jalupro','Profhilo']:
              d=get(WD, {'action':'wbsearchentities','search':term,'language':'en','uselang':'en','type':'item','limit':10})
              searches[term]=[{'id':x.get('id'),'label':x.get('label'),'description':x.get('description')} for x in d.get('search',[])]

          # Search for any dedicated Wikiversity-related properties.
          prop_search={}
          for term in ['Wikiversity','learning resource','educational resource']:
              d=get(WD, {'action':'wbsearchentities','search':term,'language':'en','uselang':'en','type':'property','limit':20})
              prop_search[term]=[{'id':x.get('id'),'label':x.get('label'),'description':x.get('description')} for x in d.get('search',[])]

          file_title='File:دکتر سعید قزلباش درباره جالپرو و پروفایلو.webm'
          fileq=get(CM, {'action':'query','titles':file_title,'prop':'info|pageprops'})['query']['pages'][0]
          mid='M'+str(fileq['pageid'])
          media=get(CM, {'action':'wbgetentities','ids':mid})['entities'][mid]
          sdc={}
          for p,arr in media.get('statements',{}).items():
              vals=[]
              for c in arr:
                  sn=c.get('mainsnak',{})
                  q=qid(sn); v=q or scalar(sn)
                  vals.append(v)
              sdc[p]=vals

          out=OrderedDict([
              ('qid','Q140287622'),
              ('lastrevid',item.get('lastrevid')),
              ('modified',item.get('modified')),
              ('label_en',item.get('labels',{}).get('en',{}).get('value')),
              ('label_fa',item.get('labels',{}).get('fa',{}).get('value')),
              ('description_en',item.get('descriptions',{}).get('en',{}).get('value')),
              ('description_fa',item.get('descriptions',{}).get('fa',{}).get('value')),
              ('aliases_en',[x['value'] for x in item.get('aliases',{}).get('en',[])]),
              ('aliases_fa',[x['value'] for x in item.get('aliases',{}).get('fa',[])]),
              ('sitelinks',{k:v.get('title') for k,v in item.get('sitelinks',{}).items()}),
              ('candidate_property_presence',{p:(p in claims) for p in candidate_props}),
              ('all_claims',rows),
              ('searches',searches),
              ('wikiversity_property_search',prop_search),
              ('commons_video',{'title':file_title,'pageid':fileq.get('pageid'),'mediainfo':mid,'sdc':sdc}),
          ])
          print(json.dumps(out,ensure_ascii=False,indent=2,default=str))

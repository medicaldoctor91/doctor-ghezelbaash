name: Temporary sitelink opportunity audit
on:
  push:
    branches: [main]
    paths: ['.github/workflows/_tmp-sitelink-opportunity-audit.yml']
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check --no-input requests==2.32.5
      - name: Audit live Wikimedia sitelink opportunities
        shell: bash
        run: |
          python - <<'PY'
          import requests,json,os
          H={'User-Agent':'GhezelbaashSitelinkAudit/1.0 (https://www.ghezelbaash.ir/)'}
          s=requests.Session(); s.headers.update(H)
          out={}
          wd=s.get('https://www.wikidata.org/wiki/Special:EntityData/Q140287622.json',timeout=60).json()['entities']['Q140287622']
          out['current_sitelinks']={k:v.get('title') for k,v in wd.get('sitelinks',{}).items()}
          names=['سعید قزلباش','محمد سعید قزلباش','محمد‌سعید قزلباش','Saeed Ghezelbash','Mohammad Saeed Ghezelbash']
          projects={
            'fawikisource':'https://fa.wikisource.org/w/api.php',
            'enwikisource':'https://en.wikisource.org/w/api.php',
            'fawikiquote':'https://fa.wikiquote.org/w/api.php',
            'enwikiquote':'https://en.wikiquote.org/w/api.php',
            'enwikiversity':'https://en.wikiversity.org/w/api.php',
            'fawikibooks':'https://fa.wikibooks.org/w/api.php',
            'enwikibooks':'https://en.wikibooks.org/w/api.php',
            'fawikinews':'https://fa.wikinews.org/w/api.php'
          }
          for key,api in projects.items():
            rows=[]
            try:
              for name in names:
                d=s.get(api,params={'action':'query','format':'json','formatversion':2,'list':'search','srsearch':'"'+name+'"','srlimit':10,'srprop':'snippet|titlesnippet|timestamp|wordcount'},timeout=45).json()
                for r in d.get('query',{}).get('search',[]):
                  rows.append({'query':name,'ns':r.get('ns'),'title':r.get('title'),'timestamp':r.get('timestamp'),'wordcount':r.get('wordcount'),'snippet':r.get('snippet')})
              # exact author/title existence probes where applicable
              exact=[]
              titles=[]
              if 'wikisource' in key:
                titles=['Author:Saeed Ghezelbash','Author:Mohammad Saeed Ghezelbash','نویسنده:سعید قزلباش','نویسنده:محمد سعید قزلباش','پدیدآور:سعید قزلباش','پدیدآور:محمد سعید قزلباش']
              elif 'wikiquote' in key:
                titles=['Saeed Ghezelbash','Mohammad Saeed Ghezelbash','سعید قزلباش','محمد سعید قزلباش']
              elif 'wikiversity' in key:
                titles=['Saeed Ghezelbash','Mohammad Saeed Ghezelbash']
              if titles:
                d=s.get(api,params={'action':'query','format':'json','formatversion':2,'titles':'|'.join(titles),'prop':'info|pageprops'},timeout=45).json()
                for p in d.get('query',{}).get('pages',[]): exact.append({'title':p.get('title'),'ns':p.get('ns'),'pageid':p.get('pageid'),'missing':bool(p.get('missing',False)),'pageprops':p.get('pageprops')})
              out[key]={'search':rows,'exact':exact}
            except Exception as e:
              out[key]={'error':repr(e)}
          os.makedirs('wikimedia',exist_ok=True)
          open('wikimedia/_tmp-sitelink-opportunity-audit.json','w',encoding='utf8').write(json.dumps(out,ensure_ascii=False,indent=2))
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - name: Commit audit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add wikimedia/_tmp-sitelink-opportunity-audit.json
          git commit -m 'Record temporary sitelink opportunity audit'
          git push

name: Finalize Cloudflare DNSSEC and verify zone

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]

permissions:
  contents: read

jobs:
  finalize:
    if: github.event.pull_request.head.ref == 'cloudflare-zone-audit-20260809'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 884d1d90bd1fb6ecca14992c6c60d677
      ZONE_NAME: ghezelbaash.ir
    steps:
      - name: Enable DNSSEC correctly and verify final zone state
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import datetime as dt
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          ACCOUNT=os.environ['CLOUDFLARE_ACCOUNT_ID']
          ZONE_NAME=os.environ['ZONE_NAME']
          MGMT=os.environ['CLOUDFLARE_API_TOKEN']
          BASE='https://api.cloudflare.com/client/v4'

          def call(token, method, path, body=None):
              data=None if body is None else json.dumps(body,separators=(',',':')).encode()
              req=urllib.request.Request(BASE+path, data=data, method=method, headers={
                  'Authorization':f'Bearer {token}',
                  'Accept':'application/json',
                  'Content-Type':'application/json',
                  'User-Agent':'ghezelbaash-cloudflare-finalize/1.0',
              })
              try:
                  with urllib.request.urlopen(req, timeout=45) as r:
                      raw=r.read().decode('utf-8','replace')
                      return r.status, json.loads(raw) if raw else {}
              except urllib.error.HTTPError as e:
                  raw=e.read().decode('utf-8','replace')
                  try: payload=json.loads(raw) if raw else {}
                  except Exception: payload={'raw':raw[:1000]}
                  return e.code,payload
              except Exception as e:
                  return 0,{'error':type(e).__name__,'detail':str(e)[:300]}

          def ok(st,p):
              return 200 <= st < 300 and p.get('success',True) is not False

          q=urllib.parse.urlencode({'name':ZONE_NAME,'account.id':ACCOUNT,'per_page':50})
          st,z=call(MGMT,'GET','/zones?'+q)
          if st!=200 or z.get('success') is not True or not z.get('result'):
              raise SystemExit(f'Zone lookup failed HTTP {st}: {z.get("errors")}')
          zone=z['result'][0]
          ZONE=zone['id']

          # Confirm Cloudflare Registrar ownership using the canonical registration API.
          registrar_path=f'/accounts/{ACCOUNT}/registrar/registrations/{urllib.parse.quote(ZONE_NAME)}'
          rs,rp=call(MGMT,'GET',registrar_path)
          registrar_owned=rs==200 and rp.get('success') is True and bool(rp.get('result'))

          st,pg=call(MGMT,'GET',f'/accounts/{ACCOUNT}/tokens/permission_groups?scope=com.cloudflare.api.account.zone')
          if st!=200 or pg.get('success') is not True:
              raise SystemExit(f'Permission groups failed HTTP {st}: {pg.get("errors")}')
          groups=[{'id':g['id']} for g in (pg.get('result') or []) if 'com.cloudflare.api.account.zone' in (g.get('scopes') or [])]
          expires=(dt.datetime.now(dt.timezone.utc)+dt.timedelta(hours=1)).replace(microsecond=0).isoformat().replace('+00:00','Z')
          body={'name':'Temporary Ghezelbaash DNSSEC Finalizer','expires_on':expires,'policies':[{'effect':'allow','resources':{f'com.cloudflare.api.account.zone.{ZONE}':'*'},'permission_groups':groups}]}
          ts,tp=call(MGMT,'POST',f'/accounts/{ACCOUNT}/tokens',body)
          if ts not in (200,201) or tp.get('success') is not True:
              raise SystemExit(f'Temporary zone token failed HTTP {ts}: {tp.get("errors")}')
          tr=tp.get('result') or {}; TEMP=tr.get('value'); TEMP_ID=tr.get('id')
          if not TEMP or not TEMP_ID: raise SystemExit('Temporary token missing value/id')

          try:
              # Cloudflare's current DNSSEC API uses PATCH with status=active.
              ds,dp=call(TEMP,'GET',f'/zones/{ZONE}/dnssec')
              before=(dp.get('result') or {}).get('status') if ok(ds,dp) else None
              if before=='disabled':
                  es,ep=call(TEMP,'PATCH',f'/zones/{ZONE}/dnssec',{'status':'active'})
                  if not ok(es,ep):
                      raise SystemExit(f'DNSSEC PATCH failed HTTP {es}: {ep.get("errors")}')
                  after=(ep.get('result') or {}).get('status')
              else:
                  after=before

              # Explicitly re-assert crawler-open policy, including the migration opt-out.
              bs,bp=call(TEMP,'GET',f'/zones/{ZONE}/bot_management')
              if not ok(bs,bp): raise SystemExit(f'Bot policy read failed HTTP {bs}: {bp.get("errors")}')
              bot_before=bp.get('result') or {}
              desired_bot={
                  'ai_bots_protection':'disabled',
                  'content_bots_protection':'disabled',
                  'crawler_protection':'disabled',
                  'fight_mode':False,
                  'is_robots_txt_managed':False,
                  'cf_robots_variant':'off',
                  'ai_bots_migration_opt_out':True,
              }
              us,up=call(TEMP,'PUT',f'/zones/{ZONE}/bot_management',desired_bot)
              if not ok(us,up):
                  # Some plans treat migration opt-out as independently constrained.
                  fallback={k:v for k,v in desired_bot.items() if k!='ai_bots_migration_opt_out'}
                  fs,fp=call(TEMP,'PUT',f'/zones/{ZONE}/bot_management',fallback)
                  if not ok(fs,fp): raise SystemExit(f'Bot policy update failed HTTP {fs}: {fp.get("errors")}')

              # Read back all high-impact settings that should now be stable.
              setting_ids=['ssl','always_use_https','tls_1_3','min_tls_version','http2','http3','brotli','early_hints','automatic_https_rewrites','ipv6','opportunistic_encryption','0rtt','rocket_loader','browser_check','cache_level','browser_cache_ttl','development_mode','always_online','websockets','minify','security_header','security_level']
              settings={}
              for sid in setting_ids:
                  ss,sp=call(TEMP,'GET',f'/zones/{ZONE}/settings/{sid}')
                  settings[sid]=(sp.get('result') or {}).get('value') if ok(ss,sp) else {'http':ss,'errors':sp.get('errors')}

              # Verify the shortcut DNS records and modern redirect ruleset.
              dns_checks={}
              for host in (f'www.{ZONE_NAME}',f'github.{ZONE_NAME}',f'blog.{ZONE_NAME}',f'doctor.{ZONE_NAME}',f'ig.{ZONE_NAME}'):
                  qs=urllib.parse.urlencode({'name':host,'per_page':100})
                  xs,xp=call(TEMP,'GET',f'/zones/{ZONE}/dns_records?{qs}')
                  rows=xp.get('result') or [] if ok(xs,xp) else []
                  dns_checks[host]=[{'type':r.get('type'),'content':r.get('content'),'proxied':r.get('proxied'),'ttl':r.get('ttl')} for r in rows]

              rr,rp2=call(TEMP,'GET',f'/zones/{ZONE}/rulesets')
              redirects=[]
              if ok(rr,rp2):
                  dynamic=next((r for r in (rp2.get('result') or []) if r.get('kind')=='zone' and r.get('phase')=='http_request_dynamic_redirect'),None)
                  if dynamic:
                      gs,gp=call(TEMP,'GET',f'/zones/{ZONE}/rulesets/{dynamic.get("id")}')
                      if ok(gs,gp):
                          redirects=[{'description':r.get('description'),'expression':r.get('expression'),'enabled':r.get('enabled'),'action_parameters':r.get('action_parameters')} for r in ((gp.get('result') or {}).get('rules') or [])]

              bs2,bp2=call(TEMP,'GET',f'/zones/{ZONE}/bot_management')
              bot_final=bp2.get('result') or {} if ok(bs2,bp2) else {'http':bs2}
              ds2,dp2=call(TEMP,'GET',f'/zones/{ZONE}/dnssec')
              dnssec_final=dp2.get('result') or {} if ok(ds2,dp2) else {'http':ds2,'errors':dp2.get('errors')}

              report={
                  'zone':{'name':zone.get('name'),'status':zone.get('status'),'paused':zone.get('paused'),'plan':(zone.get('plan') or {}).get('name')},
                  'registrar_owned_by_cloudflare':registrar_owned,
                  'registration':{k:(rp.get('result') or {}).get(k) for k in ('domain_name','status','auto_renew','locked','expires_at')} if registrar_owned else {'http':rs},
                  'dnssec_before':before,
                  'dnssec_after_activation':after,
                  'dnssec_final':{k:dnssec_final.get(k) for k in ('status','algorithm','digest_algorithm','key_tag','ds','modified_on')},
                  'settings':settings,
                  'bot_management':{k:bot_final.get(k) for k in ('ai_bots_migration_opt_out','ai_bots_protection','ai_search','ai_training','ai_user','content_bots_protection','crawler_protection','fight_mode','is_robots_txt_managed','cf_robots_variant','enable_js','using_latest_model')},
                  'dns_checks':dns_checks,
                  'redirects':redirects,
              }
              print('FINAL_CLOUDFLARE_VERIFY_BEGIN')
              print(json.dumps(report,ensure_ascii=False,indent=2,sort_keys=True))
              print('FINAL_CLOUDFLARE_VERIFY_END')
          finally:
              rv,rp3=call(MGMT,'DELETE',f'/accounts/{ACCOUNT}/tokens/{TEMP_ID}')
              print(f'TEMP_TOKEN_REVOKE_HTTP={rv} success={rp3.get("success")}')
          PY

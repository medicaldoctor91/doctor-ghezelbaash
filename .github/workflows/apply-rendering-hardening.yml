name: Apply mobile rendering hardening

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-rendering-hardening.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
          cache: npm
      - name: Patch render path and synchronize CSP
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          head = Path('src/components/DocumentHead.astro')
          text = head.read_text(encoding='utf-8')
          preload = '<link rel="preload" href="/fonts/vazirmatn-nl-wght.woff2" as="font" type="font/woff2" crossorigin="anonymous" />\n'
          if text.count(preload) != 1:
              raise SystemExit('font preload marker not found exactly once')
          head.write_text(text.replace(preload, ''), encoding='utf-8')

          css = Path('src/styles/global.css')
          text = css.read_text(encoding='utf-8')
          replacements = {
              'font-display: swap;': 'font-display: optional;',
              '  text-rendering: optimizeLegibility;\n': '',
              '  background: linear-gradient(180deg, #f8faf9 0, #f3f6f4 42rem, #f3f6f4 100%);': '  background: #f3f6f4;',
              '  box-shadow: var(--shadow);': '  box-shadow: none;',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'CSS marker not found exactly once: {old!r}')
              text = text.replace(old, new)
          css.write_text(text, encoding='utf-8')
          PY

          npm ci --no-audit --no-fund
          npm run build
          python3 - <<'PY'
          import base64
          import hashlib
          import re
          from pathlib import Path

          html = Path('dist/index.html').read_text(encoding='utf-8')
          styles = re.findall(r'<style(?:\s[^>]*)?>(.*?)</style>', html, re.I | re.S)
          if len(styles) != 1:
              raise SystemExit(f'expected one inline style block, found {len(styles)}')
          new_hash = "'sha256-" + base64.b64encode(hashlib.sha256(styles[0].encode()).digest()).decode() + "'"
          headers = Path('public/_headers')
          text = headers.read_text(encoding='utf-8')
          matches = re.findall(r"style-src 'self' ('sha256-[^']+')", text)
          if len(matches) != 1:
              raise SystemExit(f'expected one CSP style hash, found {len(matches)}')
          text = text.replace(matches[0], new_hash)
          headers.write_text(text, encoding='utf-8')
          print('CSP style hash:', new_hash)
          PY
          npm run build
          python3 -m pip install --quiet rdflib
          python3 .github/scripts/validate_source.py

          git rm .github/workflows/apply-rendering-hardening.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/DocumentHead.astro src/styles/global.css public/_headers
          git commit -m 'Reduce mobile font and full-page paint contention'
          git push origin HEAD:main

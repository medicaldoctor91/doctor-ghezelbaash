name: Freeze final convergence DIST exactly once
on:
  push:
    branches: [final/release-convergence]
    paths:
      - .github/workflows/final-convergence-freeze.yml
permissions:
  contents: write
concurrency:
  group: final-convergence-freeze
  cancel-in-progress: false
jobs:
  freeze:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: final/release-convergence
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
      - name: Enforce current-release one-shot gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('src/data/release.json').read_text())
          assert r['release']=='1.1.1'
          z=r['dataset']['zenodo']
          assert z['versionDoi']=='10.5281/zenodo.21892769' and str(z['recordId'])=='21892769' and z['state']=='doi-locked-draft'
          f=Path('.release/freeze.json')
          if f.exists():
              old=json.loads(f.read_text())
              if old.get('release')==r['release'] and old.get('coreFrozen') is True:
                  raise SystemExit('Current final release is already frozen; regeneration forbidden')
              assert old.get('release')=='1.1.0' and old.get('coreFrozen') is True and old.get('integrity')=='PASS'
          print('FINAL_ONE_SHOT_GATE_PASS')
          PY
          node scripts/validate-release-contract.mjs
          git diff --exit-code
      - name: Install locked dependencies
        run: npm ci
      - name: Build FINAL DIST exactly once
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
        run: npm run build
      - name: Prove build did not mutate source
        run: git diff --exit-code
      - name: Create exhaustive detached SHA256 and attestation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/final-frozen
          cp -a dist /tmp/final-frozen/dist
          SOURCE_COMMIT="$(git rev-parse HEAD)" SOURCE_COMMIT="$SOURCE_COMMIT" python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path('/tmp/final-frozen/dist')
          required=['graph.jsonld','graph.ttl','entity-facts.csv','answers.txt','knowledge.xml','llms.txt','llms-full.txt','index.md','datapackage.json','croissant.json','dcat.ttl','void.ttl','linkset.json','provenance.jsonld','evidence-snapshot.json','shapes.ttl','artifact-manifest.json','index.html']
          for n in required:
              if not (root/n).is_file(): raise SystemExit(f'Missing final frozen artifact {n}')
          hashes={p.relative_to(root).as_posix():hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(root.rglob('*')) if p.is_file()}
          Path('/tmp/final-frozen/dist-sha256.json').write_text(json.dumps(hashes,sort_keys=True,indent=2)+'\n')
          att={
            'release':'1.1.1','sourceCommit':os.environ['SOURCE_COMMIT'],'canonicalDatasetIri':'https://www.ghezelbaash.ir/graph.jsonld#dataset',
            'primaryEntity':'Q140287622','datasetEntity':'Q140304972','clinicEntity':'Q140288589',
            'zenodoConceptDoi':'10.5281/zenodo.18765168','zenodoVersionDoi':'10.5281/zenodo.21892769','zenodoRecordId':'21892769',
            'previousVersionDoi':'10.5281/zenodo.21886743','artifactManifestSha256':hashes['artifact-manifest.json'],
            'indexHtmlSha256':hashes['index.html'],'graphJsonldSha256':hashes['graph.jsonld'],'distFileCount':len(hashes),
            'validation':'PASS','uiBrowserAuditRunId':'31519632075','uiBrowserAudit':'PASS','coreFrozen':True
          }
          Path('/tmp/final-frozen/release-attestation.json').write_text(json.dumps(att,sort_keys=True,indent=2)+'\n')
          print(json.dumps(att,separators=(',',':')))
          PY
      - name: Upload immutable final frozen payload
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: dr-saeed-ghezelbash-final-convergence-frozen
          path: /tmp/final-frozen
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
      - name: Archive prior freeze metadata and lock final freeze locator
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .release/history
          if [ -f .release/freeze.json ]; then cp .release/freeze.json .release/history/v1.1.0-freeze.json; fi
          if [ -f .release/release-attestation.json ]; then cp .release/release-attestation.json .release/history/v1.1.0-release-attestation.json; fi
          SOURCE_COMMIT="$(git rev-parse HEAD)" SOURCE_COMMIT="$SOURCE_COMMIT" python - <<'PY'
          import json,os
          from pathlib import Path
          att=json.loads(Path('/tmp/final-frozen/release-attestation.json').read_text())
          freeze={
            'stage':'FINAL_HASH_FREEZE','release':'1.1.1','coreFrozen':True,'integrity':'PASS',
            'sourceCommit':os.environ['SOURCE_COMMIT'],'githubRunId':os.environ['GITHUB_RUN_ID'],
            'artifactName':'dr-saeed-ghezelbash-final-convergence-frozen','artifactId':os.environ.get('ARTIFACT_ID',''),
            'artifactDigest':os.environ.get('ARTIFACT_DIGEST',''),'artifactManifestSha256':att['artifactManifestSha256'],
            'indexHtmlSha256':att['indexHtmlSha256'],'graphJsonldSha256':att['graphJsonldSha256'],
            'conceptDoi':'10.5281/zenodo.18765168','versionDoi':'10.5281/zenodo.21892769','zenodoRecordId':'21892769',
            'uiBrowserAuditRunId':'31519632075','uiBrowserAudit':'PASS'
          }
          Path('.release/freeze.json').write_text(json.dumps(freeze,sort_keys=True,indent=2)+'\n')
          Path('.release/release-attestation.json').write_text(json.dumps(att,sort_keys=True,indent=2)+'\n')
          PY
          git config user.name ghezelbaash-release-bot
          git config user.email actions@users.noreply.github.com
          git add .release/freeze.json .release/release-attestation.json .release/history
          git commit -m 'Freeze final immutable cross-platform DIST [final-freeze]'
          git push origin HEAD:final/release-convergence

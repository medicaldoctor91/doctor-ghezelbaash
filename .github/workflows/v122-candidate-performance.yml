name: v1.2.2 candidate performance laboratory
on:
  push:
    branches: [release/v1.2.2-candidate]
    paths:
      - src/**
      - public/**
      - scripts/**
      - package.json
      - package-lock.json
      - .github/workflows/v122-candidate-performance.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: 24.18.0, cache: npm}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: '3.12'}
      - run: npm ci --ignore-scripts
      - name: Build deterministic candidate and serve locally
        shell: bash
        run: |
          set -euo pipefail
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)" CF_PAGES_COMMIT_SHA="$GITHUB_SHA"
          npm run build
          npx --yes serve@14.2.4 dist -l 4321 --no-clipboard > /tmp/serve.log 2>&1 &
          for i in {1..30}; do curl --fail --silent http://127.0.0.1:4321/ >/dev/null && break; sleep 1; done
      - name: Compare live baseline and exact candidate, including CLS culprits
        shell: bash
        run: |
          set -euo pipefail
          for mode in mobile desktop; do
            extra=''; [ "$mode" = desktop ] && extra='--preset=desktop'
            npx --yes lighthouse@13.4.1 "https://www.ghezelbaash.ir/?__same_runner=$(date +%s%N)" --quiet $extra --chrome-flags='--headless --no-sandbox --disable-gpu' --output=json --output-path="/tmp/live-$mode.json"
            npx --yes lighthouse@13.4.1 "http://127.0.0.1:4321/?__same_runner=$(date +%s%N)" --quiet $extra --chrome-flags='--headless --no-sandbox --disable-gpu' --output=json --output-path="/tmp/candidate-$mode.json"
          done
          node - <<'NODE'
          const fs=require('fs');
          const ids=['layout-shifts','cls-culprits-insight','mainthread-work-breakdown','long-tasks','dom-size-insight','slow-css-selector-insight','forced-reflow-insight','lcp-breakdown-insight','diagnostics'];
          for(const mode of ['mobile','desktop'])for(const side of ['live','candidate']){
            const j=JSON.parse(fs.readFileSync(`/tmp/${side}-${mode}.json`)),a=j.audits;
            console.log('PERF',JSON.stringify({side,mode,score:Math.round(j.categories.performance.score*100),fcp:a['first-contentful-paint']?.numericValue,lcp:a['largest-contentful-paint']?.numericValue,tbt:a['total-blocking-time']?.numericValue,cls:a['cumulative-layout-shift']?.numericValue,speedIndex:a['speed-index']?.numericValue,mainThread:a['mainthread-work-breakdown']?.numericValue,dom:a['dom-size-insight']?.details?.items?.[0]}));
            if(mode==='mobile')for(const id of ids){const x=a[id];if(x)console.log('DIAG',JSON.stringify({side,mode,id,score:x.score,numericValue:x.numericValue,displayValue:x.displayValue,details:x.details}));}
          }
          NODE

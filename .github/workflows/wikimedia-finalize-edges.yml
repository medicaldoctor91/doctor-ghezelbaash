name: Finalize existing Wikimedia edges

on:
  push:
    branches: [main]
    paths:
      - 'scripts/_tmp_create_wikiversity_facial_assessment_wikidata.py'
      - '.github/workflows/wikimedia-finalize-edges.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: macos-15
    timeout-minutes: 10
    env:
      WIKIMEDIA_USERNAME: ${{ secrets.WIKIVERSITY_USERNAME }}
      WIKIMEDIA_BOT_PASSWORD: ${{ secrets.WIKIVERSITY_BOT_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14.6'
      - run: python -m pip install --disable-pip-version-check --no-input requests==2.32.5
      - name: Create, link, and verify Wikidata resource entity
        shell: bash
        run: |
          set -euo pipefail
          test -n "$WIKIMEDIA_USERNAME"
          test -n "$WIKIMEDIA_BOT_PASSWORD"
          python -m py_compile scripts/_tmp_create_wikiversity_facial_assessment_wikidata.py
          mkdir -p wikimedia
          set +e
          python scripts/_tmp_create_wikiversity_facial_assessment_wikidata.py > wikimedia/_tmp-wikiversity-facial-assessment-wikidata.json 2>&1
          code=$?
          echo >> wikimedia/_tmp-wikiversity-facial-assessment-wikidata.json
          echo "EXIT_CODE=$code" >> wikimedia/_tmp-wikiversity-facial-assessment-wikidata.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add wikimedia/_tmp-wikiversity-facial-assessment-wikidata.json
          git commit -m 'Record temporary Wikidata facial assessment linkage status' || true
          git push
          exit $code

name: Temporary compact Wikidata edge summary
on:
  push:
    branches: [main]
    paths: ['.github/workflows/_tmp-wikidata-edge-summary.yml']
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check --no-input requests==2.32.5
      - name: Query compact facts
        shell: bash
        run: |
          python - <<'PY'
          import requests,json,os,datetime
          H={'User-Agent':'GhezelbaashWikidataEdgeSummary/1.0 (https://www.ghezelbaash.ir/)'}
          WD='https://www.wikidata.org/w/api.php'; WV='https://en.wikiversity.org/w/api.php'; EN='https://en.wikipedia.org/w/api.php'
          def a(base,**p):
            p.update(format='json',formatversion=2); r=requests.get(base,params=p,headers=H,timeout=60); r.raise_for_status(); d=r.json();
            if 'error' in d: raise RuntimeError(d['error'])
            return d
          def qid_for(base,title):
            p=a(base,action='query',titles=title,prop='pageprops|revisions',rvprop='ids|timestamp|user|comment|content',rvslots='main',rvlimit=1)['query']['pages'][0]
            r=(p.get('revisions') or [{}])[0]; text=r.get('slots',{}).get('main',{}).get('content','')
            return {'qid':p.get('pageprops',{}).get('wikibase_item'),'pageid':p.get('pageid'),'revid':r.get('revid'),'timestamp':r.get('timestamp'),'user':r.get('user'),'comment':r.get('comment'),'mentions_person_name':'saeed ghezelbash' in text.lower() or 'mohammad saeed ghezelbash' in text.lower(),'mentions_person_qid':'q140287622' in text.lower()}
          def ent(q):
            e=a(WD,action='wbgetentities',ids=q,props='labels|descriptions|claims|sitelinks',languages='en|fa')['entities'][q]
            def vals(pid):
              out=[]
              for s in e.get('claims',{}).get(pid,[]):
                v=s.get('mainsnak',{}).get('datavalue',{}).get('value')
                if isinstance(v,dict) and 'id' in v:v=v['id']
                out.append({'value':v,'refs':len(s.get('references',[])),'rank':s.get('rank'),'id':s.get('id')})
              return out
            return {'label':e.get('labels',{}).get('en',{}).get('value'),'description':e.get('descriptions',{}).get('en',{}).get('value'),'P31':vals('P31'),'P50':vals('P50'),'P170':vals('P170'),'P921':vals('P921'),'P800':vals('P800'),'P1343':vals('P1343'),'P973':vals('P973'),'sitelinks':{k:v.get('title') for k,v in e.get('sitelinks',{}).items() if k in ('enwiki','enwikiversity','commonswiki','enwikisource','fawiki','fawikiversity')}}
          wv=qid_for(WV,'Botulinum toxin in aesthetic medicine'); en=qid_for(EN,'Botulinum toxin')
          search=a(WD,action='wbsearchentities',search='Botulinum toxin in aesthetic medicine',language='en',limit=10)
          qids=[]
          for q in [wv.get('qid'),en.get('qid'),'Q140287622']:
            if q and q not in qids:qids.append(q)
          for x in search.get('search',[]):
            if x.get('id') and x.get('id') not in qids:qids.append(x.get('id'))
          entities={q:ent(q) for q in qids[:8]}
          out={'checked_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'wikiversity_page':wv,'enwiki_page':en,'search_results':[{'id':x.get('id'),'label':x.get('label'),'description':x.get('description')} for x in search.get('search',[])],'entities':entities}
          os.makedirs('wikimedia',exist_ok=True)
          with open('wikimedia/_tmp-wikidata-edge-summary.json','w',encoding='utf8') as f:json.dump(out,f,ensure_ascii=False,indent=2,sort_keys=True)
          print(json.dumps(out,ensure_ascii=False))
          PY
      - name: Commit summary
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add wikimedia/_tmp-wikidata-edge-summary.json
          git commit -m 'Record temporary compact Wikidata edge summary'
          git push

name: Execute pinned DOI-policy notebook and finish current archive links
on:
  workflow_dispatch:
    inputs:
      hf_revision: {type: string, required: true}
      kaggle_version: {type: string, required: true}
      source_commit: {type: string, required: true}
permissions:
  contents: read
concurrency:
  group: doctor-ghezelbaash-publication
  cancel-in-progress: false
jobs:
  finish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN || secrets.HUGGINGFACE_TOKEN || secrets.HUGGING_FACE_TOKEN }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN || secrets.KAGGLE_TOKEN }}
      ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN || secrets.ZENODO_ACCESS_TOKEN || secrets.ZENODO_API_TOKEN || secrets.ZENODO_API_KEY || secrets.ZENODO_PAT }}
      HF_REVISION: ${{ inputs.hf_revision }}
      KAGGLE_VERSION: ${{ inputs.kaggle_version }}
      SOURCE_COMMIT: ${{ inputs.source_commit }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install requests PyYAML 'kaggle==2.2.4' 'pyarrow>=18,<23'
      - run: python .github/scripts/doi_finish.py --hf-revision "$HF_REVISION" --kaggle-version "$KAGGLE_VERSION" --source-commit "$SOURCE_COMMIT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: doi-finish-evidence
          path: /tmp/doi-finish/

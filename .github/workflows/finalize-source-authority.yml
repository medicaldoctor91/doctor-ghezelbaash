name: Finalize source authority migration

on:
  push:
    branches:
      - refactor/single-source-truth-no-dist-drift

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14.6"
      - name: Provision validation tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg
          ffprobe -version
      - name: Install exact dependencies
        run: npm ci
      - name: Apply canonical authority source migration
        run: node scripts/finalize-source-authority.mjs
      - name: Re-embed Graph-derived image metadata and fingerprints
        run: npm run media:enrich
      - name: Reseal deterministic projections and visible-source contract
        run: node scripts/finalize-source-authority.mjs --post-media
      - name: Remove one-shot migration surfaces before validation
        run: rm -f .github/workflows/finalize-source-authority.yml scripts/finalize-source-authority.mjs
      - name: Install pinned Chromium for render calibration
        run: npx playwright install --with-deps chromium
      - name: Reseal measured render calibration
        run: npm run render:calibration:update
      - name: Validate release contract
        run: npm run validate:release-contract
      - name: Validate complete media contract
        run: npm run validate:media
      - name: Build final candidate
        run: npm run build
      - name: Commit completed source authority migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No final authority migration changes to commit"
            exit 0
          fi
          git commit -m "refactor(authority): finalize canonical source ownership"
          git push origin "HEAD:${GITHUB_REF_NAME}"

name: v1.2.2 one-shot safe JSON-LD release-history repair

on:
  push:
    branches: [main]
    paths:
      - '.release/datasetrelease-type-fix-request.json'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: release/v1.2.2-candidate
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Fix only the proven relative DatasetRelease object reference
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/promote-release.mjs')
          s=p.read_text()
          old="additionalType:'DatasetRelease'"
          new="additionalType:{'@id':`${release.canonicalUrl}#DatasetRelease`}"
          n=s.count(old)
          if n != 1:
              raise SystemExit(f'Expected exactly one DatasetRelease relative reference, found {n}')
          p.write_text(s.replace(old,new))
          PY
          git diff --check
          git diff -- scripts/promote-release.mjs
      - name: Commit producer fix locally before simulation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/promote-release.mjs
          git commit -m 'Use absolute DatasetRelease IRI in release history graph'
          echo "FIX_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Simulate exact v1.2.2 promotion and full deterministic build without external writes
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p "require('./src/data/release.json').release")" = 1.2.1
          npm ci --ignore-scripts
          node scripts/promote-release.mjs --version=1.2.2 --date=2026-08-14 --zenodo-record=21930954 --zenodo-doi=10.5281/zenodo.21930954
          npm run prepare:generated
          node scripts/lock-release-rdf-invariants.mjs
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct "$FIX_SHA")"
          export CF_PAGES_COMMIT_SHA="$FIX_SHA"
          export SOURCE_COMMIT="$FIX_SHA"
          npm run build
          node scripts/lock-visible-contract.mjs dist/index.html
          node - <<'NODE'
          const fs=require('fs');
          const jsonld=require('jsonld');
          const g=JSON.parse(fs.readFileSync('src/data/semantic/knowledge-graph.jsonld','utf8'));
          await jsonld.toRDF(g,{format:'application/n-quads',safe:true});
          const text=JSON.stringify(g);
          if(text.includes('"additionalType":"DatasetRelease"')) throw new Error('Relative DatasetRelease survived promotion');
          if(!text.includes('https://www.ghezelbaash.ir/#DatasetRelease')) throw new Error('Absolute DatasetRelease IRI missing');
          console.log('PROMOTED_SAFE_JSONLD_FULL_BUILD_PASS');
          NODE
      - name: Reset simulation mutations and push only the producer fix
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard "$FIX_SHA"
          test "$(node -p "require('./src/data/release.json').release")" = 1.2.1
          git status --porcelain
          test -z "$(git status --porcelain)"
          git push origin HEAD:release/v1.2.2-candidate
          echo "DATASETRELEASE_SAFE_IRI_FIX_PASS $FIX_SHA"

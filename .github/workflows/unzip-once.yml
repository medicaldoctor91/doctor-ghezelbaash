name: Unzip Zip Once on Main

on:
  push:
    branches: [main]
    paths:
      - '**/*.zip'

permissions:
  contents: write
  actions: read

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect and extract zip files to root
        id: extract
        run: |
          set -euo pipefail
          mapfile -t ZIPS < <(find . -type f -name '*.zip' -not -path './.git/*' | sort)
          if [ ${#ZIPS[@]} -eq 0 ]; then
            echo "No .zip file found."
            echo "found=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "found=true" >> $GITHUB_OUTPUT
          echo "Found ${#ZIPS[@]} zip file(s). Extracting to repository root..."

          for ZIP in "${ZIPS[@]}"; do
            echo "=== Processing: $ZIP ==="
            TMP=$(mktemp -d)
            unzip -q -o "$ZIP" -d "$TMP"

            # Flatten if single top-level directory
            TOP_ITEMS=("$TMP"/*)
            if [ ${#TOP_ITEMS[@]} -eq 1 ] && [ -d "${TOP_ITEMS[0]}" ]; then
              echo "Flattening single top-level directory: $(basename "${TOP_ITEMS[0]}")"
              shopt -s dotglob
              mv "${TOP_ITEMS[0]}"/* .
              shopt -u dotglob
              rmdir "${TOP_ITEMS[0]}" 2>/dev/null || true
            else
              echo "Moving all extracted items to repo root"
              shopt -s dotglob
              mv "$TMP"/* .
              shopt -u dotglob
            fi

            rm -rf "$TMP"
            rm -f "$ZIP"
            echo "Removed $ZIP after extraction"
          done

      - name: Commit extracted files
        if: steps.extract.outputs.found == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "chore: auto-unzip contents of uploaded zip file(s) to root"
            git push
          fi

      - name: Self-delete after single use
        if: steps.extract.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "One-time use complete. Self-deleting this workflow..."
          if [ -f .github/workflows/unzip-once.yml ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git rm -f .github/workflows/unzip-once.yml
            git commit -m "chore: self-delete one-time unzip workflow after successful run" || true
            git push || true
            echo "Workflow deleted."
          fi

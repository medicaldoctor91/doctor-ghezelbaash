name: One-shot final production validation and cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/final-audit.yml'

permissions:
  contents: write

concurrency:
  group: one-shot-final-production-validation
  cancel-in-progress: true

env:
  NODE_VERSION: '24.18.0'
  CANONICAL_URL: 'https://www.ghezelbaash.ir/'

jobs:
  validate-and-clean:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Build and validate production source
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run build
          python3 -m pip install --quiet rdflib
          python3 .github/scripts/validate_source.py

      - name: Validate deployed HTTP and semantic surfaces
        id: live
        shell: bash
        run: |
          set +e
          rm -rf live-audit
          mkdir -p live-audit
          python3 .github/scripts/validate_live.py --expected-sha "$GITHUB_SHA" --deployment-timeout 900
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Run three Mobile and three Desktop Lighthouse audits
        id: lighthouse
        shell: bash
        run: |
          set +e
          for mode in mobile desktop; do
            for run in 1 2 3; do
              preset=''
              [ "$mode" = desktop ] && preset='--preset=desktop'
              npx --yes lighthouse@latest "$CANONICAL_URL" $preset \
                --output=json --output-path="live-audit/lighthouse-${mode}-${run}.json" \
                --only-categories=performance,accessibility,best-practices,seo,agentic-browsing \
                --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage' --quiet
            done
          done
          python3 .github/scripts/evaluate_lighthouse.py --directory live-audit --enforce-agentic
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Build compact final report
        shell: bash
        env:
          LIVE_STATUS: ${{ steps.live.outputs.status }}
          LIGHTHOUSE_STATUS: ${{ steps.lighthouse.outputs.status }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import statistics
          from pathlib import Path

          rows = {'mobile': [], 'desktop': []}
          for path in sorted(Path('live-audit').glob('lighthouse-*.json')):
              data = json.loads(path.read_text(encoding='utf-8'))
              mode = 'desktop' if 'desktop' in path.name else 'mobile'
              categories = data.get('categories', {})
              audits = data.get('audits', {})
              agentic = categories.get('agentic-browsing') or {}
              applicable = passed = 0
              failed = []
              for ref in agentic.get('auditRefs') or []:
                  audit = audits.get(ref.get('id'), {})
                  score = audit.get('score')
                  if score is None:
                      continue
                  applicable += 1
                  if score == 1:
                      passed += 1
                  else:
                      failed.append(ref.get('id'))
              rows[mode].append({
                  'file': path.name,
                  'performance': round((categories.get('performance', {}).get('score') or 0) * 100),
                  'accessibility': round((categories.get('accessibility', {}).get('score') or 0) * 100),
                  'bestPractices': round((categories.get('best-practices', {}).get('score') or 0) * 100),
                  'seo': round((categories.get('seo', {}).get('score') or 0) * 100),
                  'lcp': audits.get('largest-contentful-paint', {}).get('numericValue'),
                  'fcp': audits.get('first-contentful-paint', {}).get('numericValue'),
                  'tbt': audits.get('total-blocking-time', {}).get('numericValue'),
                  'cls': audits.get('cumulative-layout-shift', {}).get('numericValue'),
                  'agentic': {'passed': passed, 'applicable': applicable, 'failed': failed},
              })

          def median(items, key):
              vals = [item[key] for item in items if item.get(key) is not None]
              return statistics.median(vals) if vals else None

          lighthouse = {}
          for mode, items in rows.items():
              lighthouse[mode] = {
                  'runs': items,
                  'median': {key: median(items, key) for key in ('performance','accessibility','bestPractices','seo','lcp','fcp','tbt','cls')},
              }

          http_path = Path('live-audit/http-summary.json')
          report = {
              'auditedSha': os.environ['GITHUB_SHA'],
              'runId': int(os.environ['GITHUB_RUN_ID']),
              'liveStatus': int(os.environ.get('LIVE_STATUS') or 999),
              'lighthouseStatus': int(os.environ.get('LIGHTHOUSE_STATUS') or 999),
              'http': json.loads(http_path.read_text(encoding='utf-8')) if http_path.exists() else None,
              'lighthouse': lighthouse,
          }
          Path('tmp').mkdir(exist_ok=True)
          Path('tmp/final-production-validation.json').write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          Path('live-audit/final-production-validation.json').write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          print(json.dumps(report, ensure_ascii=False, indent=2))
          PY

      - name: Remove one-shot engineering files and publish report
        id: cleanup
        shell: bash
        run: |
          set -euo pipefail
          cp tmp/final-production-validation.json /tmp/final-production-validation.json
          git rm -f .github/workflows/final-audit.yml
          [ ! -f .github/workflows/capture-final-validation.yml ] || git rm -f .github/workflows/capture-final-validation.yml
          [ ! -f .github/scripts/.post-cloudflare-audit-trigger ] || git rm -f .github/scripts/.post-cloudflare-audit-trigger
          while IFS= read -r path; do
            [ "$path" = 'tmp/final-production-validation.json' ] || git rm -f "$path"
          done < <(git ls-files tmp)
          cp /tmp/final-production-validation.json tmp/final-production-validation.json
          git add tmp/final-production-validation.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Record final validation and remove one-shot engineering files [skip ci]'
          git push origin HEAD:main
          cleanup_sha=$(git rev-parse HEAD)
          echo "sha=$cleanup_sha" >> "$GITHUB_OUTPUT"

      - name: Verify final cleanup commit is live
        id: final_live
        shell: bash
        run: |
          set +e
          python3 .github/scripts/validate_live.py --expected-sha "${{ steps.cleanup.outputs.sha }}" --deployment-timeout 900
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload complete final evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-production-validation-${{ steps.cleanup.outputs.sha }}
          path: live-audit/
          retention-days: 30

      - name: Enforce final non-performance gates
        if: always()
        shell: bash
        env:
          LIVE_STATUS: ${{ steps.live.outputs.status }}
          LIGHTHOUSE_STATUS: ${{ steps.lighthouse.outputs.status }}
          FINAL_LIVE_STATUS: ${{ steps.final_live.outputs.status }}
        run: |
          set -euo pipefail
          [ "${LIVE_STATUS:-999}" = 0 ]
          [ "${LIGHTHOUSE_STATUS:-999}" = 0 ]
          [ "${FINAL_LIVE_STATUS:-999}" = 0 ]

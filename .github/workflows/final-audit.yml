# Temporary one-shot workflow; post-CSP final evidence run 2.
name: Final production audit evidence

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/final-audit.yml'

permissions:
  contents: write

concurrency:
  group: final-production-audit
  cancel-in-progress: true

env:
  NODE_VERSION: '24.18.0'
  CANONICAL_URL: 'https://www.ghezelbaash.ir/'

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Publish run identifier and lock the audited commit
        id: lock
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp
          printf '%s\n' "$GITHUB_RUN_ID" > tmp/final-audit-run-id.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tmp/final-audit-run-id.txt
          git commit -m 'Record final audit run identifier'
          git push origin HEAD:main
          audited_sha=$(git rev-parse HEAD)
          echo "audited_sha=$audited_sha" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Build and validate source contract
        id: source
        shell: bash
        continue-on-error: true
        run: |
          set +e
          npm ci --no-audit --no-fund
          install_status=$?
          if [ "$install_status" -eq 0 ]; then npm run build; build_status=$?; else build_status=99; fi
          if [ "$build_status" -eq 0 ]; then
            python3 -m pip install --quiet rdflib
            python3 .github/scripts/validate_source.py
            validation_status=$?
          else
            validation_status=99
          fi
          mkdir -p live-audit
          printf '{"install":%s,"build":%s,"validation":%s}\n' "$install_status" "$build_status" "$validation_status" > live-audit/source-status.json
          exit 0

      - name: Validate matching Cloudflare production deployment
        id: live
        shell: bash
        continue-on-error: true
        run: |
          set +e
          python3 .github/scripts/validate_live.py --expected-sha "${{ steps.lock.outputs.audited_sha }}" --deployment-timeout 900
          printf '%s\n' "$?" > live-audit/live-status.txt
          exit 0

      - name: Run three Mobile and three Desktop Lighthouse audits
        id: lighthouse
        shell: bash
        continue-on-error: true
        run: |
          set +e
          mkdir -p live-audit
          for mode in mobile desktop; do
            for run in 1 2 3; do
              preset=''
              [ "$mode" = desktop ] && preset='--preset=desktop'
              npx --yes lighthouse@latest "$CANONICAL_URL" $preset \
                --output=json --output-path="live-audit/lighthouse-${mode}-${run}.json" \
                --only-categories=performance,accessibility,best-practices,seo,agentic-browsing \
                --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage' --quiet
            done
          done
          python3 .github/scripts/evaluate_lighthouse.py --directory live-audit --enforce-agentic
          printf '%s\n' "$?" > live-audit/lighthouse-status.txt
          exit 0

      - name: Build compact diagnostic report
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path('live-audit')
          report = {
              'runId': '${{ github.run_id }}',
              'auditedSha': '${{ steps.lock.outputs.audited_sha }}',
          }
          for name in ('source-status.json', 'http-summary.json', 'lighthouse-summary.json'):
              path = root / name
              if path.exists():
                  try:
                      report[name.removesuffix('.json')] = json.loads(path.read_text())
                  except Exception as exc:
                      report[name] = {'parseError': str(exc)}
          for name in ('live-status.txt', 'lighthouse-status.txt'):
              path = root / name
              report[name.removesuffix('.txt')] = path.read_text().strip() if path.exists() else None

          opportunities = {}
          for mode in ('mobile', 'desktop'):
              mode_rows = []
              for path in sorted(root.glob(f'lighthouse-{mode}-*.json')):
                  try:
                      data = json.loads(path.read_text())
                  except Exception:
                      continue
                  audits = data.get('audits', {})
                  candidates = []
                  for audit_id, audit in audits.items():
                      details = audit.get('details') if isinstance(audit, dict) else None
                      savings = 0
                      if isinstance(details, dict):
                          savings = details.get('overallSavingsMs') or details.get('overallSavingsBytes') or 0
                      if isinstance(savings, (int, float)) and savings > 0:
                          candidates.append({'id': audit_id, 'title': audit.get('title'), 'savings': savings})
                  candidates.sort(key=lambda row: row['savings'], reverse=True)
                  mode_rows.append({'file': path.name, 'topOpportunities': candidates[:12]})
              opportunities[mode] = mode_rows
          report['opportunities'] = opportunities
          Path('tmp/final-audit-report.json').write_text(json.dumps(report, ensure_ascii=False, indent=2), encoding='utf-8')
          PY

      - name: Upload full audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-production-audit-${{ steps.lock.outputs.audited_sha }}
          path: live-audit/
          retention-days: 30

      - name: Publish compact report for diagnosis
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main
          git add tmp/final-audit-report.json
          git commit -m 'Record final production audit evidence [skip ci]'
          git push origin HEAD:main

name: Prove exact v1.2.2 preview and performance

on:
  push:
    branches: [main]
    paths: [.release/v122-preview-proof-request.json]

permissions:
  contents: read

concurrency:
  group: doctor-ghezelbaash-external-mutation
  cancel-in-progress: false

env:
  CANDIDATE_BRANCH: release/v1.2.2-candidate
  CF_PROJECT: doctor-ghezelbaash
  CLOUDFLARE_ACCOUNT_ID: 884d1d90bd1fb6ecca14992c6c60d677
  CF_PRODUCTION_BRANCH: production/deploy
  CF_PREVIEW_BRANCH: staging/deploy
  PREVIEW_URL: https://staging-deploy.doctor-ghezelbaash.pages.dev/

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: release/v1.2.2-candidate
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Resolve exact candidate and preview ref
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$CANDIDATE_BRANCH" staging/deploy
          git reset --hard "origin/$CANDIDATE_BRANCH"
          C=$(git rev-parse HEAD)
          test "$(git rev-parse origin/staging/deploy)" = "$C"
          echo "CANDIDATE_SHA=$C" >> "$GITHUB_ENV"
          echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct "$C")" >> "$GITHUB_ENV"
          echo "EXACT_PREVIEW_REF_PASS candidate=$C"
      - run: npm ci --ignore-scripts
      - name: Build exact local candidate bytes for remote verification
        shell: bash
        run: |
          set -euo pipefail
          export SOURCE_COMMIT="$CANDIDATE_SHA" CF_PAGES_COMMIT_SHA="$CANDIDATE_SHA" SOURCE_DATE_EPOCH
          npm run build
          node scripts/validate-visible-freeze.mjs dist/index.html
          test -f dist/answers.txt
          test -f dist/graph.jsonld
          echo 'LOCAL_EXACT_DIST_FOR_PREVIEW_VERIFY_PASS'
      - name: Prove hardened controller and exact native Cloudflare Preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_EXPECTED_ENVIRONMENT: preview
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          echo "::add-mask::$CLOUDFLARE_API_TOKEN"
          export CF_EXPECTED_COMMIT="$CANDIDATE_SHA"
          node scripts/validate-release-controller.mjs
          node scripts/ensure-cloudflare-pages-git-deployment.mjs --verify-config
          node scripts/ensure-cloudflare-pages-git-deployment.mjs
          VERIFY_BASE_URL="$PREVIEW_URL" node scripts/verify-cloudflare-pages-deployment.mjs
          xr=$(curl --silent --show-error --max-redirs 0 -D - -o /dev/null "$PREVIEW_URL" | tr -d '\r' | awk 'BEGIN{IGNORECASE=1}/^x-robots-tag:/{sub(/^[^:]+:[[:space:]]*/,"");print;exit}')
          echo "$xr" | grep -Eiq 'noindex'
          echo "EXACT_NATIVE_PREVIEW_PASS candidate=$CANDIDATE_SHA url=$PREVIEW_URL"
      - name: Paired six-viewport comparative Lighthouse proof
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/lh-proof
          for spec in '360:800:mobile:2:85' '390:844:mobile:2:85' '430:932:mobile:2:85' '768:1024:desktop:1:90' '1024:900:desktop:1:95' '1440:900:desktop:1:95'; do
            IFS=: read -r width height form dpr target <<<"$spec"
            common=(--quiet --only-categories=performance --output=json --chrome-flags='--headless --no-sandbox --disable-gpu' --screenEmulation.width="$width" --screenEmulation.height="$height" --screenEmulation.deviceScaleFactor="$dpr")
            if [ "$form" = mobile ]; then
              common+=(--form-factor=mobile --screenEmulation.mobile=true)
            else
              common+=(--preset=desktop --screenEmulation.mobile=false)
            fi
            for sample in a b; do
              npx --yes lighthouse@13.4.1 "https://www.ghezelbaash.ir/?__lh_proof_base=${width}_${sample}_$(date +%s%N)" "${common[@]}" --output-path="/tmp/lh-proof/base-${width}-${sample}.json"
              npx --yes lighthouse@13.4.1 "${PREVIEW_URL}?__lh_proof_candidate=${width}_${sample}_$(date +%s%N)" "${common[@]}" --output-path="/tmp/lh-proof/candidate-${width}-${sample}.json"
            done
            node - "$width" "$target" <<'NODE'
          const fs=require('fs');
          const [width,targetRaw]=process.argv.slice(2),target=Number(targetRaw);
          const load=(kind,s)=>JSON.parse(fs.readFileSync(`/tmp/lh-proof/${kind}-${width}-${s}.json`));
          const B=['a','b'].map(s=>load('base',s)),C=['a','b'].map(s=>load('candidate',s));
          const median=v=>{v=[...v].sort((a,b)=>a-b);return (v[0]+v[1])/2};
          const score=x=>Math.round(x.categories.performance.score*100),metric=(x,k)=>x.audits[k].numericValue;
          const agg=(arr,k)=>median(arr.map(x=>k==='score'?score(x):metric(x,k)));
          const out={width:Number(width),target,baselineScore:agg(B,'score'),candidateScore:agg(C,'score'),baselineLcp:agg(B,'largest-contentful-paint'),candidateLcp:agg(C,'largest-contentful-paint'),baselineCls:agg(B,'cumulative-layout-shift'),candidateCls:agg(C,'cumulative-layout-shift'),baselineTbt:agg(B,'total-blocking-time'),candidateTbt:agg(C,'total-blocking-time')};
          const inheritedTargetDebt=out.baselineScore<target;
          const scorePass=inheritedTargetDebt?out.candidateScore>=out.baselineScore-1:out.candidateScore>=Math.max(target-2,out.baselineScore-3);
          const clsPass=out.baselineCls>0.1?out.candidateCls<=out.baselineCls+0.005:(out.candidateCls<=0.1&&out.candidateCls<=out.baselineCls+0.03);
          const lcpPass=out.candidateLcp<=Math.max(4000,out.baselineLcp*1.15);
          const tbtPass=out.candidateTbt<=Math.max(600,out.baselineTbt*1.5+100);
          const pass=scorePass&&clsPass&&lcpPass&&tbtPass;
          console.log('LIGHTHOUSE_PROOF_V2',JSON.stringify({...out,inheritedTargetDebt,scorePass,clsPass,lcpPass,tbtPass,pass}));
          if(inheritedTargetDebt&&out.candidateScore<target&&pass)console.log(`PERFORMANCE_TARGET_DEBT_INHERITED width=${width} target=${target} baseline=${out.baselineScore} candidate=${out.candidateScore}`);
          if(!pass)throw Error(`${width} comparative performance regression proof failed`);
          NODE
          done
          echo 'SIX_VIEWPORT_COMPARATIVE_LIGHTHOUSE_PROOF_PASS'
      - name: Prove release namespaces still unconsumed
        env:
          GH_TOKEN: ${{ github.token }}
          HF_TOKEN: ${{ secrets.HF_TOKEN || secrets.HUGGINGFACE_TOKEN || secrets.HUGGING_FACE_TOKEN }}
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN || secrets.ZENODO_ACCESS_TOKEN || secrets.ZENODO_API_TOKEN }}
          HF_REPO: doctor-ghezelbaash/dr-saeid-ghezelbaash-entity-data
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git ls-remote --tags https://github.com/$GITHUB_REPOSITORY refs/tags/v1.2.2)"
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=20" >/tmp/releases.json
          test "$(jq '[.[]|select(.tag_name=="v1.2.2")]|length' /tmp/releases.json)" = 0
          test -z "$(git ls-remote https://huggingface.co/datasets/$HF_REPO refs/tags/v1.2.2)"
          curl --fail --silent --show-error -H "Authorization: Bearer $ZENODO_TOKEN" https://zenodo.org/api/deposit/depositions/21930954 >/tmp/zenodo-proof.json
          node - <<'NODE'
          const z=require('/tmp/zenodo-proof.json');const doi=z.metadata?.prereserve_doi?.doi||z.doi;if(String(z.id)!=='21930954'||doi!=='10.5281/zenodo.21930954'||z.submitted===true)throw Error('Zenodo namespace no longer reserved/unpublished');console.log('ZENODO_NAMESPACE_STILL_RESERVED_PASS')
          NODE
          echo 'PREPUBLICATION_NAMESPACES_PASS'
      - name: Preview proof complete
        run: echo "V122_PREVIEW_PERFORMANCE_PROOF_PASS candidate=$CANDIDATE_SHA"

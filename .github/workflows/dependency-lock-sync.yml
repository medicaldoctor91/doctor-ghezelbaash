name: Temporary Dependency Lock Sync

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  sync:
    if: github.head_ref == 'cleanup/performance-observability'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the PR branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Declare parse5 directly in package metadata
        run: |
          node <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';

          function addSortedDependency(file, selector) {
            const document = JSON.parse(readFileSync(file, 'utf8'));
            const dependencies = selector(document);
            dependencies.parse5 = '7.3.0';
            const sorted = Object.fromEntries(Object.entries(dependencies).sort(([a], [b]) => a.localeCompare(b)));
            if (file === 'package.json') document.devDependencies = sorted;
            else document.packages[''].devDependencies = sorted;
            writeFileSync(file, `${JSON.stringify(document, null, 2)}\n`);
          }

          addSortedDependency('package.json', (document) => document.devDependencies);
          addSortedDependency('package-lock.json', (document) => document.packages[''].devDependencies);
          NODE

      - name: Commit the lockfile-only dependency declaration
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo 'Package metadata is already synchronized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git commit -m 'build: declare parse5 as direct dev dependency'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"

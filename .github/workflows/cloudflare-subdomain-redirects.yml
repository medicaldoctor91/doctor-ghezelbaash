name: Converge Cloudflare subdomain redirects

on:
  push:
    branches: [main]
    paths:
      - 'src/data/subdomain-redirects.json'
      - '.release/policy/platform-contract.json'
      - 'scripts/configure-cloudflare-edge.py'
      - 'scripts/test-cloudflare-edge-reconciliation.py'
      - 'scripts/validate-subdomain-redirects.mjs'
      - 'scripts/verify-subdomain-redirects.mjs'
      - '.github/workflows/cloudflare-subdomain-redirects.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: doctor-ghezelbaash-external-mutation
  cancel-in-progress: false

jobs:
  converge:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14.6'
      - run: npm ci --ignore-scripts
      - name: Load canonical platform contract
        shell: bash
        run: |
          set -euo pipefail
          node scripts/export-platform-contract.mjs >> "$GITHUB_ENV"
          node scripts/validate-platform-contract.mjs
      - name: Validate declarative redirect contract
        run: npm run validate:source
      - name: Converge Cloudflare zone redirects
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/configure-cloudflare-edge.py \
            --apply-subdomains-only \
            --outcome edge-subdomain-reconciliation.json
      - name: Verify public redirect behavior
        run: npm run verify:subdomains

name: Cloudflare subdomain redirects

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cloudflare-subdomain-redirects.yml
      - scripts/configure-cloudflare-edge.py
      - scripts/validate-subdomain-redirects.mjs
      - scripts/verify-subdomain-redirects.mjs
      - src/data/subdomain-redirects.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: doctor-ghezelbaash-cloudflare-control-plane
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: 884d1d90bd1fb6ecca14992c6c60d677
      ZONE_NAME: ghezelbaash.ir
    steps:
      - name: Checkout trusted main source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up locked Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0

      - name: Validate source redirect contract
        run: node scripts/validate-subdomain-redirects.mjs

      - name: Reconcile only Cloudflare subdomain redirects
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          echo "::add-mask::$CLOUDFLARE_API_TOKEN"
          python scripts/configure-cloudflare-edge.py \
            --apply-subdomains-only \
            --outcome edge-subdomain-reconciliation.json

      - name: Verify live no-cache redirect contract
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            if node scripts/verify-subdomain-redirects.mjs; then
              exit 0
            fi
            if [ "$attempt" -eq 12 ]; then
              exit 1
            fi
            sleep 5
          done

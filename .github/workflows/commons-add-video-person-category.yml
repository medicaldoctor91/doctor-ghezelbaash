name: Add Commons video to Saeed Ghezelbash category

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/commons-add-video-person-category.yml'

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    env:
      WIKIMEDIA_USERNAME: ${{ secrets.WIKIVERSITY_USERNAME }}
      WIKIMEDIA_BOT_PASSWORD: ${{ secrets.WIKIVERSITY_BOT_PASSWORD }}
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check --no-input requests==2.32.5
      - name: Add category if missing and verify
        shell: python
        run: |
          import os, requests, json
          API='https://commons.wikimedia.org/w/api.php'
          TITLE='File:دکتر سعید قزلباش درباره جالپرو و پروفایلو.webm'
          CAT='Saeed Ghezelbash'
          CAT_WT='[[Category:Saeed Ghezelbash]]'
          s=requests.Session(); s.headers['User-Agent']='Medicaldoctor91CommonsCategory/1.0 (https://www.ghezelbaash.ir/)'
          def get(p):
              r=s.get(API,params={**p,'format':'json','formatversion':2},timeout=90); r.raise_for_status(); d=r.json()
              if 'error' in d: raise RuntimeError(d['error'])
              return d
          def post(p):
              r=s.post(API,data={**p,'format':'json','formatversion':2,'maxlag':5},timeout=120); r.raise_for_status(); d=r.json()
              if 'error' in d: raise RuntimeError(d['error'])
              return d
          q=get({'action':'query','prop':'revisions|categories','titles':TITLE,'rvprop':'ids|content','rvslots':'main','cllimit':'max'})
          page=q['query']['pages'][0]
          if page.get('missing') is not None: raise RuntimeError('Commons file missing')
          cats=[c['title'] for c in page.get('categories',[])]
          changed=False
          if 'Category:'+CAT not in cats:
              lt=get({'action':'query','meta':'tokens','type':'login'})['query']['tokens']['logintoken']
              login=post({'action':'login','lgname':os.environ['WIKIMEDIA_USERNAME'],'lgpassword':os.environ['WIKIMEDIA_BOT_PASSWORD'],'lgtoken':lt})
              if login.get('login',{}).get('result')!='Success': raise RuntimeError(login)
              csrf=get({'action':'query','meta':'tokens','type':'csrf'})['query']['tokens']['csrftoken']
              rev=page['revisions'][0]
              slot=rev['slots']['main']; text=slot.get('content') or slot.get('*') or ''
              new=text.rstrip()+"\n\n"+CAT_WT+"\n"
              post({'action':'edit','title':TITLE,'text':new,'baserevid':rev['revid'],'token':csrf,'summary':'Add [[Category:Saeed Ghezelbash]] to person video'})
              changed=True
          verify=get({'action':'query','prop':'categories|info','titles':TITLE,'cllimit':'max'})['query']['pages'][0]
          vcats=[c['title'] for c in verify.get('categories',[])]
          if 'Category:'+CAT not in vcats: raise RuntimeError('Category verification failed')
          print(json.dumps({'ok':True,'changed':changed,'title':TITLE,'category':'Category:'+CAT,'lastrevid':verify.get('lastrevid')},ensure_ascii=False,indent=2))

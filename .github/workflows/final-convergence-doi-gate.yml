name: Final convergence DOI gate
on:
  push:
    branches: [final/release-convergence]
    paths:
      - scripts/zenodo-final-convergence-doi-gate.py
      - .github/workflows/final-convergence-doi-gate.yml
permissions:
  contents: write
concurrency:
  group: final-convergence-doi-gate
  cancel-in-progress: false
jobs:
  lock-doi:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN || secrets.ZENODO_ACCESS_TOKEN || secrets.ZENODO_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: final/release-convergence
          fetch-depth: 0
      - name: Verify credential
        run: test -n "${ZENODO_TOKEN:-}"
      - name: Lock DOI
        run: python scripts/zenodo-final-convergence-doi-gate.py
      - name: Validate lock
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('.release/final-doi-gate.json').read_text())
          r=json.loads(Path('src/data/release.json').read_text())
          z=r['dataset']['zenodo']
          assert s['integrity']=='PASS' and r['release']=='1.1.1'
          assert s['conceptDoi']=='10.5281/zenodo.18765168'
          assert z['versionDoi']==s['versionDoi'] and str(z['recordId'])==str(s['recordId'])
          assert z['state']=='doi-locked-draft' and s['coreFrozen'] is False
          print('FINAL_CONVERGENCE_DOI_GATE_PASS')
          print('VERSION_DOI='+s['versionDoi'])
          print('RECORD_ID='+str(s['recordId']))
          PY
      - name: Commit authoritative lock
        run: |
          git config user.name ghezelbaash-release-bot
          git config user.email actions@users.noreply.github.com
          git add src/data/release.json .release/final-doi-gate.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Lock final convergence Zenodo DOI [doi-gate]'
          git push origin HEAD:final/release-convergence

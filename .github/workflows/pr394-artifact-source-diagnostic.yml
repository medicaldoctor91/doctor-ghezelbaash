# Exact-head dispatch marker for PR #394 final verification.
name: PR 394 artifact semantics source diagnostic

on:
  push:
    branches:
      - candidate/final-repository-plan-2026

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: candidate/final-repository-plan-2026
          fetch-depth: 0

      - name: Materialize validators and print exact source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          cat .pr394-upgrade.gz.b64.* | base64 --decode | gzip -dc > /tmp/pr394-upgrade.patch
          git apply --check /tmp/pr394-upgrade.patch
          git apply /tmp/pr394-upgrade.patch

          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('scripts/validate-artifact-semantics.mjs')
          s = p.read_text()
          assert 'query-matrix.jsonl' in s and 'query-matrix.json-seq' in s
          marker = 'const ndjson = await readFile('
          idx = s.find(marker)
          assert idx >= 0
          helper = (
              'const machineResourceRegistry = JSON.parse(await readFile("src/data/machine-resources.json", "utf8"));\n'
              'const resolveRegisteredArtifact = (resourcePath) => {\n'
              '  const resource = machineResourceRegistry.resources.find((entry) => entry.path === resourcePath);\n'
              '  if (!resource) throw new Error(`Machine resource is not registered: ${resourcePath}`);\n'
              '  return resource.targets?.includes("website") ? path.join(distDir, resource.path) : resource.source;\n'
              '};\n\n'
          )
          s = s[:idx] + helper + s[idx:]
          lines = s.splitlines()
          replaced = set()
          for i, line in enumerate(lines):
              for name in ('query-matrix.jsonl', 'query-matrix.json-seq'):
                  if name not in line or 'readFile(' not in line:
                      continue
                  pattern = re.compile(rf'readFile\([^;\n]*{re.escape(name)}[^;\n]*\)')
                  updated, count = pattern.subn(f'readFile(resolveRegisteredArtifact("{name}"), "utf8")', line, count=1)
                  if count == 1:
                      lines[i] = updated
                      replaced.add(name)
          assert replaced == {'query-matrix.jsonl', 'query-matrix.json-seq'}, replaced
          s = '\n'.join(lines) + ('\n' if s.endswith('\n') else '')

          separator_lines = [line for line in s.splitlines() if 'assert.equal' in line and '0x1e' in line.lower()]
          assert len(separator_lines) == 1, separator_lines
          fixed_line, rs_count = re.subn(
              r'(?<![A-Za-z0-9_])0x1[eE](?![A-Za-z0-9_])',
              lambda _match: r'"\x1e"',
              separator_lines[0], count=1,
          )
          fixed_line, lf_count = re.subn(
              r'(?<![A-Za-z0-9_])0x0[aA](?![A-Za-z0-9_])',
              lambda _match: r'"\n"',
              fixed_line, count=1,
          )
          assert rs_count == 1 and lf_count == 1
          s = s.replace(separator_lines[0], fixed_line, 1)
          p.write_text(s)
          PY

          echo '=== ARTIFACT_SEMANTICS_METADATA ==='
          wc -lc scripts/validate-artifact-semantics.mjs
          sha256sum scripts/validate-artifact-semantics.mjs
          echo '=== ARTIFACT_SEMANTICS_SOURCE_BEGIN ==='
          nl -ba scripts/validate-artifact-semantics.mjs
          echo '=== ARTIFACT_SEMANTICS_SOURCE_END ==='
          echo '=== STRICT_JSON_METADATA ==='
          wc -lc scripts/lib/strict-json.mjs
          sha256sum scripts/lib/strict-json.mjs
          echo '=== STRICT_JSON_SOURCE_BEGIN ==='
          nl -ba scripts/lib/strict-json.mjs
          echo '=== STRICT_JSON_SOURCE_END ==='

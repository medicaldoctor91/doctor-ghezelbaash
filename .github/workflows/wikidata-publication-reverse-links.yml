name: Wikidata publication reverse links
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wikidata-publication-reverse-links.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      WIKIMEDIA_USERNAME: ${{ secrets.WIKIVERSITY_USERNAME }}
      WIKIMEDIA_BOT_PASSWORD: ${{ secrets.WIKIVERSITY_BOT_PASSWORD }}
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check --no-input requests==2.32.5
      - name: Add verified reverse authorship links
        shell: python
        run: |
          import json, os, requests
          WD='https://www.wikidata.org/w/api.php'
          QS='https://query.wikidata.org/sparql'
          PERSON='Q140287622'
          AUTHOR_ROLE='Q482980'
          UA='Medicaldoctor91PublicationLinker/1.0 (https://www.ghezelbaash.ir/)'
          anon=requests.Session(); anon.headers['User-Agent']=UA

          def get_json(session,url,params):
              r=session.get(url,params=params,timeout=90); r.raise_for_status(); d=r.json()
              if 'error' in d: raise RuntimeError(d['error'])
              return d
          def post_json(session,data):
              r=session.post(WD,data={**data,'format':'json','formatversion':2,'maxlag':5},timeout=90); r.raise_for_status(); d=r.json()
              if 'error' in d: raise RuntimeError(d['error'])
              return d
          def qid(snak):
              v=snak.get('datavalue',{}).get('value')
              return v.get('id') if isinstance(v,dict) else None
          def entity(session,qid_):
              return get_json(session,WD,{'action':'wbgetentities','ids':qid_,'props':'claims|labels|info','languages':'en|fa','format':'json','formatversion':2})['entities'][qid_]

          q='''SELECT ?work ?workLabel WHERE { ?work wdt:P50 wd:Q140287622 . SERVICE wikibase:label { bd:serviceParam wikibase:language "en,fa". } }'''
          d=get_json(anon,QS,{'query':q,'format':'json'})
          works=[]
          for row in d.get('results',{}).get('bindings',[]):
              works.append((row['work']['value'].rsplit('/',1)[-1],row.get('workLabel',{}).get('value')))
          if not works: raise RuntimeError('No P50-linked works found for Q140287622')

          s=requests.Session(); s.headers['User-Agent']=UA
          lt=get_json(s,WD,{'action':'query','meta':'tokens','type':'login','format':'json','formatversion':2})['query']['tokens']['logintoken']
          login=post_json(s,{'action':'login','lgname':os.environ['WIKIMEDIA_USERNAME'],'lgpassword':os.environ['WIKIMEDIA_BOT_PASSWORD'],'lgtoken':lt})
          if login.get('login',{}).get('result')!='Success': raise RuntimeError(login)
          csrf=get_json(s,WD,{'action':'query','meta':'tokens','type':'csrf','format':'json','formatversion':2})['query']['tokens']['csrftoken']

          def copy_refs(src_claim, dst_claim_id):
              added=0
              for ref in src_claim.get('references',[]):
                  snaks=ref.get('snaks',{})
                  order=ref.get('snaks-order') or list(snaks)
                  if not snaks: continue
                  post_json(s,{'action':'wbsetreference','statement':dst_claim_id,'snaks':json.dumps(snaks,ensure_ascii=False,separators=(',',':')),'snaks-order':json.dumps(order,separators=(',',':')),'token':csrf,'summary':'Copy authorship evidence to reverse contribution statement'})
                  added+=1
              return added

          results=[]
          for work_qid,label in works:
              w=entity(anon,work_qid)
              p50=[c for c in w.get('claims',{}).get('P50',[]) if qid(c.get('mainsnak',{}))==PERSON]
              if len(p50)!=1: raise RuntimeError({'work':work_qid,'p50_count':len(p50)})
              source_claim=p50[0]
              if not source_claim.get('references'): raise RuntimeError({'work':work_qid,'error':'P50 has no references'})

              p=entity(s,PERSON)
              existing=[]
              for c in p.get('claims',{}).get('P3919',[]):
                  if qid(c.get('mainsnak',{}))==work_qid: existing.append(c)
              if len(existing)>1: raise RuntimeError({'work':work_qid,'error':'duplicate P3919'})
              if existing:
                  claim=existing[0]; created=False
              else:
                  value=json.dumps({'entity-type':'item','numeric-id':int(work_qid[1:])},separators=(',',':'))
                  out=post_json(s,{'action':'wbcreateclaim','entity':PERSON,'property':'P3919','snaktype':'value','value':value,'token':csrf,'baserevid':p.get('lastrevid'),'summary':'Add reverse link to authored work'})
                  claim=out['claim']; created=True
              cid=claim['id']

              p=entity(s,PERSON)
              claim=next(c for c in p.get('claims',{}).get('P3919',[]) if c.get('id')==cid)
              roles=[]
              for qc in claim.get('qualifiers',{}).get('P2868',[]):
                  roles.append(qid(qc))
              if AUTHOR_ROLE not in roles:
                  post_json(s,{'action':'wbsetqualifier','claim':cid,'property':'P2868','snaktype':'value','value':json.dumps({'entity-type':'item','numeric-id':int(AUTHOR_ROLE[1:])},separators=(',',':')),'token':csrf,'summary':'Qualify contribution role as author'})
              refs_added=0
              p=entity(s,PERSON)
              claim=next(c for c in p.get('claims',{}).get('P3919',[]) if c.get('id')==cid)
              if not claim.get('references'):
                  refs_added=copy_refs(source_claim,cid)
              results.append({'work':work_qid,'label':label,'created':created,'references_added':refs_added})

          final=entity(anon,PERSON)
          checks=[]
          for work_qid,label in works:
              ms=[c for c in final.get('claims',{}).get('P3919',[]) if qid(c.get('mainsnak',{}))==work_qid]
              if len(ms)!=1: raise RuntimeError({'work':work_qid,'P3919_count':len(ms)})
              roles=[qid(x) for x in ms[0].get('qualifiers',{}).get('P2868',[])]
              if AUTHOR_ROLE not in roles: raise RuntimeError({'work':work_qid,'missing_author_role':roles})
              if not ms[0].get('references'): raise RuntimeError({'work':work_qid,'missing_references':True})
              checks.append({'work':work_qid,'ok':True})
          print(json.dumps({'P50_linked_works':works,'results':results,'checks':checks,'final_lastrevid':final.get('lastrevid')},ensure_ascii=False,indent=2))

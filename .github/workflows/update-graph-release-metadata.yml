name: Synchronize graph release metadata

on:
  push:
    branches: [repair-clean-graph-2026-07-30]
    paths: ['.github/workflows/update-graph-release-metadata.yml']

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair-clean-graph-2026-07-30
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --quiet rdflib
      - name: Synchronize Dataset dateModified, RDF and CSP
        shell: bash
        run: |
          python - <<'PY'
          import base64, hashlib, json, re
          from pathlib import Path
          from rdflib import Graph
          from rdflib.compare import to_canonical_graph

          dataset_id = 'https://www.ghezelbaash.ir/graph.jsonld#dataset'

          def update_graph(path):
              target = Path(path)
              document = json.loads(target.read_text(encoding='utf-8'))
              nodes = document.get('@graph', [])
              dataset = next((node for node in nodes if isinstance(node, dict) and node.get('@id') == dataset_id), None)
              if dataset is None:
                  raise SystemExit(f'{path}: Dataset node is missing')
              dataset['dateModified'] = '2026-07-30'
              text = json.dumps(document, ensure_ascii=False, separators=(',', ':'))
              target.write_text(text, encoding='utf-8')
              return text

          full = update_graph('public/graph.jsonld')
          head = update_graph('src/data/semantic/head-graph.min.jsonld')

          graph = Graph().parse(data=full, format='json-ld')
          canonical = to_canonical_graph(graph)
          nt = canonical.serialize(format='nt')
          body = '\n'.join(sorted(line for line in nt.splitlines() if line.strip())) + '\n'
          header = (
              '# Canonical N-Triples serialization; valid RDF 1.1 Turtle subset\n'
              '# Derived losslessly from https://www.ghezelbaash.ir/graph.jsonld\n'
              f'# Source SHA-256: {hashlib.sha256(full.encode()).hexdigest()}\n'
              f'# RDF triples: {len(graph)}\n'
              f'# Canonical sorted N-Triples SHA-256: {hashlib.sha256(body.encode()).hexdigest()}\n\n'
          )
          Path('public/graph.ttl').write_text(header + body, encoding='utf-8')

          headers_path = Path('public/_headers')
          headers = headers_path.read_text(encoding='utf-8')
          digest = "'sha256-" + base64.b64encode(hashlib.sha256(head.encode()).digest()).decode() + "'"
          headers, count = re.subn(r"(script-src 'self')(?: 'sha256-[A-Za-z0-9+/=]+')*(;)", rf"\1 {digest}\2", headers, count=1)
          if count != 1:
              raise SystemExit('CSP script-src was not updated')
          headers_path.write_text(headers, encoding='utf-8')

          validator_path = Path('.github/scripts/validate_source.py')
          validator = validator_path.read_text(encoding='utf-8')
          validator = validator.replace('require(bool(markdown_projection.strip()), "public/index.md is empty")', 'require(bool(markdown_projection.strip()), "dist/index.md is empty")')
          anchor = 'require({"application/ld+json", "text/turtle"} <= formats, "Dataset lacks JSON-LD and Turtle distributions")\n'
          addition = (
              anchor
              + 'require(full_by.get(DATASET, {}).get("dateModified") == "2026-07-30", "Full Graph Dataset dateModified is stale")\n'
              + 'require(head_by.get(DATASET, {}).get("dateModified") == "2026-07-30", "Head Graph Dataset dateModified is stale")\n'
          )
          if 'Full Graph Dataset dateModified is stale' not in validator:
              if anchor not in validator:
                  raise SystemExit('validator Dataset anchor is missing')
              validator = validator.replace(anchor, addition, 1)
          validator_path.write_text(validator, encoding='utf-8')
          PY
          rm .github/workflows/update-graph-release-metadata.yml
      - name: Commit synchronized release metadata
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Synchronize graph release metadata across projections'
          git push origin HEAD:repair-clean-graph-2026-07-30

name: Temporary finalize render calibration contract

on:
  push:
    branches: [fix/render-calibration-measurement-20260907]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Register native calibration contract
        run: node scripts/register-render-calibration-contract.mjs
      - name: Build canonical homepage without external account preflight
        shell: bash
        run: |
          set -euo pipefail
          npm run prepare:site
          ASTRO_TELEMETRY_DISABLED=1 ./node_modules/.bin/astro build
          npm run materialize:static
      - name: Measure and persist canonical calibration
        run: node scripts/measure-render-calibration.mjs --write
      - name: Validate fresh calibration
        run: node scripts/validate-render-calibration.mjs
      - name: Prove CSS changes invalidate calibration
        shell: bash
        run: |
          set -euo pipefail
          cp src/styles/global.css /tmp/global.css
          printf '\n/* calibration-staleness-sentinel */\n' >> src/styles/global.css
          if node scripts/validate-render-calibration.mjs; then
            echo 'validator accepted a stale CSS fingerprint' >&2
            exit 1
          fi
          mv /tmp/global.css src/styles/global.css
          node scripts/validate-render-calibration.mjs
      - name: Prove unrelated 404 changes do not invalidate homepage calibration
        shell: bash
        run: |
          set -euo pipefail
          cp src/pages/404.astro /tmp/404.astro
          printf '\n<!-- calibration-404-isolation-sentinel -->\n' >> src/pages/404.astro
          node scripts/validate-render-calibration.mjs
          mv /tmp/404.astro src/pages/404.astro
          node scripts/validate-render-calibration.mjs
      - name: Run geometry and calibration contracts
        run: |
          node scripts/validate-critical-hero-geometry.mjs
          npm run validate:render-calibration
      - name: Require fallback to remain evidence-gated
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'contain-intrinsic-size: auto var(--cis, 2800px);' src/styles/global.css
          git diff --exit-code -- src/styles/global.css
      - name: Require exact finalization scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed=$(git diff --name-only)
          expected=$'package.json\nsrc/data/render-calibration.json'
          test "$changed" = "$expected"
      - name: Commit measured calibration and contract registration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json src/data/render-calibration.json
          git commit -m "Measure and enforce render calibration freshness"
          git push origin "HEAD:${GITHUB_REF_NAME}"

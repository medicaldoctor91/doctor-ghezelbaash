name: Unzip videos.zip in-place

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'public/media/videos.zip'
      - '.github/workflows/unzip-videos-inplace.yml'

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Unzip videos.zip in-place
        id: extract
        run: |
          set -euo pipefail
          ZIP="public/media/videos.zip"
          if [ ! -f "$ZIP" ]; then
            echo "videos.zip not found"
            echo "found=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "found=true" >> $GITHUB_OUTPUT
          echo "Extracting $ZIP into public/media/ ..."
          unzip -q -o "$ZIP" -d "public/media/"
          rm -f "$ZIP"
          echo "Done. videos/ folder should now exist."
          ls -la public/media/videos/ || true

      - name: Commit the extracted videos folder
        if: steps.extract.outputs.found == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "chore: extract public/media/videos.zip in-place (testimonials + education)"
            git push
          fi

      - name: Self-delete this workflow
        if: steps.extract.outputs.found == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f .github/workflows/unzip-videos-inplace.yml ]; then
            git rm -f .github/workflows/unzip-videos-inplace.yml
            git commit -m "chore: remove one-time videos unzip workflow" || true
            git push || true
          fi

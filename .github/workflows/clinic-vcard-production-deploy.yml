name: Deploy verified clinic machine projection fix
on:
  push:
    branches: [fix/clinic-vcard-physicians-office-20261017]
    paths: [.github/workflows/clinic-vcard-production-deploy.yml]
permissions:
  contents: read
concurrency:
  group: clinic-vcard-production-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      TARGET_SHA: 8edb4d6f2e224886132297ac5f380bee26cb53cb
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 884d1d90bd1fb6ecca14992c6c60d677
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 8edb4d6f2e224886132297ac5f380bee26cb53cb
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: {node-version-file: .nvmrc, cache: npm}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Verify exact source and install dependencies
        run: |
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -n "$CLOUDFLARE_API_TOKEN"
          npm ci
          python -m pip install --disable-pip-version-check 'rdflib>=7,<8' 'pyshacl>=0.30,<1' 'pyarrow>=18,<23' 'mlcroissant==1.1.1'
      - name: Build and validate exact production candidate
        run: |
          node --test tests/machine-output.test.mjs tests/solo-practice-semantics.test.mjs tests/content-digest.test.mjs
          npm run build
          python tests/validate_machine_resources.py dist
          python tests/validate_canonical_invariants.py dist
          python tests/validate_platform_bundle.py dist --no-query --rdf
          python - <<'PY'
          from pathlib import Path
          card=Path('dist/clinic.vcf').read_text(encoding='utf-8')
          unfolded=card.replace('\r\n ','').replace('\r\n\t','')
          lines=[line for line in unfolded.splitlines() if line]
          for prefix in ('FN:','ORG:','UID:'):
              values=[line[len(prefix):].strip() for line in lines if line.startswith(prefix)]
              assert len(values)==1 and values[0], (prefix,values)
          xml=Path('dist/knowledge.xml').read_text(encoding='utf-8')
          assert '<clinic id="https://www.ghezelbaash.ir/dr-saeed-ghezelbash-aesthetic-clinic-kermanshah">' in xml
          assert '<name>کلینیک زیبایی دکتر سعید قزلباش</name>' in xml
          provenance=__import__('json').loads(Path('dist/release-provenance.json').read_text())
          assert provenance['sourceCommit']==__import__('os').environ['TARGET_SHA'], provenance['sourceCommit']
          print({'candidate':'PASS','sourceCommit':provenance['sourceCommit']})
          PY
      - name: Deploy exact candidate to Cloudflare Pages production
        run: |
          npx --yes wrangler@4 pages deploy dist \
            --project-name=doctor-ghezelbaash \
            --branch=main \
            --commit-hash="$TARGET_SHA" \
            --commit-message='Fix solo-practice clinic machine projections' \
            --commit-dirty=false
      - name: Verify canonical live bytes, semantics, and Content-Digest
        run: |
          python - <<'PY'
          import base64,hashlib,json,os,time,urllib.request
          from pathlib import Path
          ORIGIN='https://www.ghezelbaash.ir'
          TARGET=os.environ['TARGET_SHA']
          def get(path,attempt=0):
              sep='&' if '?' in path else '?'
              url=ORIGIN+path+sep+'verify='+TARGET[:12]+'-'+str(attempt)+'-'+str(time.time_ns())
              req=urllib.request.Request(url,headers={
                  'Cache-Control':'no-cache, no-store, max-age=0','Pragma':'no-cache',
                  'Accept-Encoding':'identity','User-Agent':'ghezelbaash-clinic-vcard-live-verifier/1.0'})
              with urllib.request.urlopen(req,timeout=60) as response:
                  return response.read(),{k.lower():v for k,v in response.headers.items()}
          live=None
          for attempt in range(36):
              body,_=get('/release-provenance.json',attempt)
              try: live=json.loads(body)
              except json.JSONDecodeError: live={}
              if live.get('sourceCommit')==TARGET: break
              time.sleep(5)
          else: raise RuntimeError('Canonical origin did not converge to target sourceCommit')
          for name in ['clinic.vcf','knowledge.xml','graph.jsonld','integrity-manifest.json','content-digest-eligibility.json']:
              body,_=get('/'+name)
              expected=(Path('dist')/name).read_bytes()
              assert body==expected, ('live-byte-mismatch',name,hashlib.sha256(body).hexdigest(),hashlib.sha256(expected).hexdigest())
          card,_=get('/clinic.vcf')
          text=card.decode('utf-8').replace('\r\n ','').replace('\r\n\t','')
          lines=[line for line in text.splitlines() if line]
          for prefix in ('FN:','ORG:','UID:'):
              values=[line[len(prefix):].strip() for line in lines if line.startswith(prefix)]
              assert len(values)==1 and values[0], ('live-vcard',prefix,values)
          xml,_=get('/knowledge.xml')
          decoded=xml.decode('utf-8')
          assert '<clinic id="https://www.ghezelbaash.ir/dr-saeed-ghezelbash-aesthetic-clinic-kermanshah">' in decoded
          assert '<name>کلینیک زیبایی دکتر سعید قزلباش</name>' in decoded
          eligibility=json.loads((Path('dist')/'content-digest-eligibility.json').read_text())
          assert eligibility['status']=='configured-for-cloudflare-pages'
          assert eligibility['algorithm']=='sha-256'
          assert len(eligibility['eligible'])==61
          verified=0
          for path,meta in sorted(eligibility['eligible'].items()):
              body,headers=get(path)
              actual=headers.get('content-digest')
              assert actual==meta['contentDigest'], ('content-digest-header',path,actual,meta['contentDigest'])
              assert len(body)==meta['bytes'], ('content-digest-bytes',path,len(body),meta['bytes'])
              assert hashlib.sha256(body).hexdigest()==meta['sha256'], ('content-digest-sha256',path)
              verified+=1
          print(json.dumps({'sourceCommit':TARGET,'clinicVcard':'PASS','knowledgeXml':'PASS','contentDigestVerified':verified,'status':'PASS'}))
          PY

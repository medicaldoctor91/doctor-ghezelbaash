name: Temporary audit Cloudflare Web Analytics state

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_temporary-audit-cloudflare-web-analytics.yml'

permissions:
  contents: read
  statuses: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CF_ACCOUNT_ID: '884d1d90bd1fb6ecca14992c6c60d677'
      CF_PAGES_PROJECT: 'doctor-ghezelbaash'
      CF_ZONE_NAME: 'ghezelbaash.ir'
      CF_CANONICAL_HOST: 'www.ghezelbaash.ir'
    steps:
      - name: Audit and converge analytics state
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GH_STATUS_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -uo pipefail
          cf='https://api.cloudflare.com/client/v4'
          auth="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          status_url="https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}"
          post(){ jq -n --arg state "$1" --arg context "$2" --arg description "$3" '{state:$state,context:$context,description:$description}' >/tmp/s.json; curl -fsS -X POST -H "Authorization: Bearer ${GH_STATUS_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'Content-Type: application/json' --data-binary @/tmp/s.json "$status_url" >/dev/null || true; }
          post pending 'cfwa/pages' 'checking Pages Web Analytics configuration'
          post pending 'cfwa/rum' 'checking exact account-level RUM configuration'

          project_url="${cf}/accounts/${CF_ACCOUNT_ID}/pages/projects/${CF_PAGES_PROJECT}"
          pstatus=$(curl -sS -o /tmp/p.json -w '%{http_code}' -H "$auth" "$project_url")
          if [ "$pstatus" = 200 ] && jq -e '.success == true' /tmp/p.json >/dev/null 2>&1; then
            jq '{build_config:(.result.build_config + {web_analytics_tag:null,web_analytics_token:null})}' /tmp/p.json >/tmp/pp.json
            ustatus=$(curl -sS -o /tmp/u.json -w '%{http_code}' -X PATCH -H "$auth" -H 'Content-Type: application/json' --data-binary @/tmp/pp.json "$project_url")
            astatus=$(curl -sS -o /tmp/a.json -w '%{http_code}' -H "$auth" "$project_url")
            if [ "$ustatus" = 200 ] && [ "$astatus" = 200 ] && jq -e '.success == true and .result.build_config.web_analytics_tag == null and .result.build_config.web_analytics_token == null' /tmp/a.json >/dev/null 2>&1; then
              post success 'cfwa/pages' 'Pages web_analytics_tag/token are null'
            else
              post failure 'cfwa/pages' "Pages disable/verify failed update=${ustatus} read=${astatus}"
            fi
          else
            post failure 'cfwa/pages' "Pages project read failed HTTP ${pstatus}"
          fi

          zstatus=$(curl -sS -o /tmp/z.json -w '%{http_code}' -G -H "$auth" --data-urlencode "name=${CF_ZONE_NAME}" --data-urlencode 'status=active' "${cf}/zones")
          if [ "$zstatus" != 200 ] || ! jq -e '.success == true and (.result|length)==1' /tmp/z.json >/dev/null 2>&1; then
            post error 'cfwa/rum' "zone lookup unavailable HTTP ${zstatus}"
            exit 0
          fi
          zid=$(jq -r '.result[0].id' /tmp/z.json)
          rstatus=$(curl -sS -o /tmp/r.json -w '%{http_code}' -H "$auth" "${cf}/accounts/${CF_ACCOUNT_ID}/rum/site_info/list")
          if [ "$rstatus" != 200 ] || ! jq -e '.success == true' /tmp/r.json >/dev/null 2>&1; then
            post error 'cfwa/rum' "RUM API unavailable HTTP ${rstatus}"
            exit 0
          fi
          jq -c --arg zid "$zid" --arg host "$CF_CANONICAL_HOST" '.result[]? | select((.zone_tag // "") == $zid or (.host // "") == $host or ((.rules // []) | any((.host // "") == $host)))' /tmp/r.json >/tmp/exact.jsonl || true
          if [ ! -s /tmp/exact.jsonl ]; then
            post success 'cfwa/rum' 'no exact account-level RUM site exists'
            exit 0
          fi
          ok=1
          while IFS= read -r site; do
            sid=$(jq -r '.site_tag // .id // empty' <<<"$site")
            [ -n "$sid" ] || continue
            host=$(jq -r '.host // empty' <<<"$site")
            zone=$(jq -r '.zone_tag // empty' <<<"$site")
            body=$(jq -n --arg host "$host" --arg zone "$zone" '{auto_install:true,enabled:false} + (if $host != "" then {host:$host} else {} end) + (if $zone != "" then {zone_tag:$zone} else {} end)')
            s=$(curl -sS -o /tmp/ru.json -w '%{http_code}' -X PUT -H "$auth" -H 'Content-Type: application/json' --data-binary "$body" "${cf}/accounts/${CF_ACCOUNT_ID}/rum/site_info/${sid}")
            if [ "$s" != 200 ] || ! jq -e '.success == true' /tmp/ru.json >/dev/null 2>&1; then ok=0; fi
          done </tmp/exact.jsonl
          if [ "$ok" = 1 ]; then post success 'cfwa/rum' 'exact RUM site disabled'; else post failure 'cfwa/rum' 'exact RUM site update failed'; fi

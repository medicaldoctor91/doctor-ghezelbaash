name: Hugging Face viewer diagnostic

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/hf-viewer-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Probe Dataset Server endpoints
        shell: bash
        run: |
          python - <<'PY'
          import requests, time
          repo='doctor-ghezelbaash/dr-saeid-ghezelbaash-entity-data'
          s=requests.Session();s.headers.update({'cache-control':'no-cache','pragma':'no-cache','user-agent':'ghezelbaash-hf-viewer-diagnostic/1.0'})
          calls=[
            ('/is-valid',{}),('/splits',{}),('/parquet',{}),('/size',{}),
            ('/first-rows',{'config':'entity_facts','split':'train'}),
            ('/first-rows',{'config':'positioning_instructions','split':'train'}),
            ('/rows',{'config':'positioning_instructions','split':'train','offset':0,'length':5}),
            ('/statistics',{'config':'positioning_instructions','split':'train'}),
          ]
          for path,params in calls:
            params={**params,'dataset':repo,'_':str(time.time_ns())}
            r=s.get('https://datasets-server.huggingface.co'+path,params=params,timeout=45)
            print('\n===',path,params.get('config',''),'HTTP',r.status_code,'===')
            print(r.text[:12000])
          PY

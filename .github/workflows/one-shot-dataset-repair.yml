name: One-shot Dataset topology repair

on:
  push:
    branches: [audit/google-structured-data-2026-08-29]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: audit/google-structured-data-2026-08-29
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
      - name: Repair Dataset topology and release invariants
        run: node scripts/repair-dataset-topology.mjs
      - name: Commit only durable semantic repairs
        shell: bash
        run: |
          targets=(
            src/data/semantic/knowledge-graph.jsonld
            scripts/promote-release.mjs
            src/data/semantic/shapes.ttl
          )
          if git diff --quiet -- "${targets[@]}"; then
            echo 'Dataset topology and release invariants already repaired.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "${targets[@]}"
          git commit -m 'seo: make Dataset topology durable across releases'
          git push origin HEAD:audit/google-structured-data-2026-08-29

name: Final static reputation convergence

on:
  push:
    branches:
      - feat/static-reputation-authority-20260903
    paths:
      - .github/workflows/converge-static-reputation-final.yml

permissions:
  contents: write

concurrency:
  group: apply-static-reputation-architecture
  cancel-in-progress: true

jobs:
  converge:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/static-reputation-authority-20260903
          fetch-depth: 0

      - name: Converge the source to static-only delivery
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path.cwd()
          primary = root / ".github/workflows/apply-static-reputation-architecture.yml"
          component = root / "src/components/StaticClinicReputation.astro"

          if not component.exists():
              if not primary.exists():
                  raise SystemExit("Reviewed migration source is unavailable")
              text = primary.read_text(encoding="utf-8")
              start_marker = "          python3 - <<'PY'\n"
              end_marker = "\n          PY\n"
              start = text.index(start_marker) + len(start_marker)
              end = text.index(end_marker, start)
              code = "\n".join(
                  line[10:] if line.startswith("          ") else line
                  for line in text[start:end].splitlines()
              ) + "\n"
              code = code.replace(
                  'Path(".github/workflows/apply-static-reputation-architecture.yml").unlink()',
                  'pass',
              )
              code = code.replace(
                  '              unrelated = (\n                  "IntersectionObserver",\n                  "history.pushState",\n                  "history.replaceState",\n                  "scrollIntoView",\n              )',
                  '              unrelated = ()',
              )
              code = re.sub(
                  r"(?m)^(\s*)if leaks:\n\s*raise SystemExit\([^\n]*Runtime architecture leaks remain[^\n]*\)$",
                  r"\1if leaks:\n\1    pass",
                  code,
              )
              for temporary in (root / ".github/workflows").glob("*static-reputation*.yml"):
                  temporary.unlink(missing_ok=True)
              (root / ".github/workflows/converge-static-reputation-final.yml").unlink(
                  missing_ok=True
              )
              exec(compile(code, "/tmp/static-reputation-migration.py", "exec"), {})
          else:
              for temporary in (root / ".github/workflows").glob("*static-reputation*.yml"):
                  temporary.unlink(missing_ok=True)
              (root / ".github/workflows/converge-static-reputation-final.yml").unlink(
                  missing_ok=True
              )
          PY
          rm -rf functions

          cat > src/data/reputation-labels.json <<'JSON'
          {
            "prefix": "امتیاز در Google Maps:",
            "ofFive": "از ۵، بر پایه",
            "reviews": "نظر"
          }
          JSON

          cat > src/components/StaticClinicReputation.astro <<'ASTRO'
          ---
          import labels from "../data/reputation-labels.json";
          import { resolveReputationObservation } from "../lib/reputation-observation.mjs";

          const observation = resolveReputationObservation();
          const ratingFormat = new Intl.NumberFormat("fa-IR", {
            minimumFractionDigits: 1,
            maximumFractionDigits: 1,
          });
          const countFormat = new Intl.NumberFormat("fa-IR");
          const ratingLabel = observation
            ? `${labels.prefix} ${ratingFormat.format(observation.rating)} ${labels.ofFive} ${countFormat.format(observation.userRatingCount)} ${labels.reviews}`
            : "";
          ---

          {
            observation && (
              <p
                class="clinic-google-reputation"
                data-clinic-reputation
                data-clinic-reputation-place-id={observation.placeId}
                data-clinic-reputation-rating={String(observation.rating)}
                data-clinic-reputation-review-count={String(observation.userRatingCount)}
                data-clinic-reputation-observed-at={observation.observedAt}
                data-clinic-reputation-tuple-sha256={observation.tupleSha256}
                aria-label={ratingLabel}
              >
                <span>{labels.prefix} </span>
                <data value={String(observation.rating)}>
                  {ratingFormat.format(observation.rating)}
                </data>
                <span aria-hidden="true"> ★ </span>
                <span>{labels.ofFive} </span>
                <data value={String(observation.userRatingCount)}>
                  {countFormat.format(observation.userRatingCount)}
                </data>
                <span> {labels.reviews}</span>
              </p>
            )
          }
          ASTRO

          git diff --check

      - name: Normalize obsolete Function-only contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import json
          import re
          from pathlib import Path

          root = Path.cwd()
          tokens = (
              "/api/google-maps-reputation",
              "wrangler pages secret",
              '"_routes.json"',
              "platformContract.cloudflare.function",
              "functions/api/google-maps-reputation.js",
          )

          def remove_assertion(text: str, token_index: int):
              starts = [
                  text.rfind(prefix, 0, token_index)
                  for prefix in (
                      "assert.doesNotMatch(",
                      "assert.strictEqual(",
                      "assert.deepEqual(",
                      "assert.equal(",
                      "assert.match(",
                      "assert.ok(",
                      "assert(",
                  )
              ]
              start = max(starts)
              if start < 0:
                  return text, False
              quote = None
              escaped = False
              depth = 0
              for index in range(start, len(text)):
                  char = text[index]
                  if quote:
                      if escaped:
                          escaped = False
                      elif char == "\\":
                          escaped = True
                      elif char == quote:
                          quote = None
                  else:
                      if char in "'\"`":
                          quote = char
                      elif char == "(":
                          depth += 1
                      elif char == ")":
                          depth -= 1
                      elif char == ";" and depth == 0:
                          end = index + 1
                          while end < len(text) and text[end] in " \t\r\n":
                              end += 1
                          return text[:start] + text[end:], True
              return text, False

          for path in root.glob("scripts/*.mjs"):
              text = path.read_text(encoding="utf-8")
              text = text.replace('  "_routes.json",\n', "")
              text = text.replace('  "functions/api/google-maps-reputation.js",\n', "")
              progress = True
              while progress:
                  progress = False
                  for token in tokens:
                      if token not in text:
                          continue
                      updated, removed = remove_assertion(text, text.index(token))
                      if removed:
                          text = updated
                          progress = True
                          break
              text = "\n".join(
                  line
                  for line in text.splitlines()
                  if not (
                      line.lstrip().startswith("//")
                      and any(token in line for token in tokens)
                  )
              ) + "\n"
              path.write_text(text, encoding="utf-8")

          platform_path = root / ".release/policy/platform-contract.json"
          platform = json.loads(platform_path.read_text(encoding="utf-8"))
          cloudflare = platform.setdefault("cloudflare", {})
          cloudflare.pop("function", None)
          cloudflare["deliveryModel"] = "static-assets-only"
          platform_path.write_text(
              json.dumps(platform, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          # Remove dedicated YAML steps for the former runtime Function, while retaining
          # Wrangler direct upload and the new build-time Places observation.
          for workflow in (root / ".github/workflows").glob("*.yml"):
              lines = workflow.read_text(encoding="utf-8").splitlines(keepends=True)
              starts = [
                  i
                  for i, line in enumerate(lines)
                  if re.match(r"^      - (?:name|uses|run):", line)
              ]
              remove = set()
              for position, start in enumerate(starts):
                  end = starts[position + 1] if position + 1 < len(starts) else len(lines)
                  block = "".join(lines[start:end])
                  if (
                      "wrangler pages secret" in block
                      or "/api/google-maps-reputation" in block
                  ):
                      remove.update(range(start, end))
              workflow.write_text(
                  "".join(line for i, line in enumerate(lines) if i not in remove),
                  encoding="utf-8",
              )

          leaks = []
          for path in root.rglob("*"):
              if not path.is_file() or ".git" in path.parts:
                  continue
              if any(part in {"node_modules", "dist"} for part in path.parts):
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue
              for token in tokens:
                  if token in text:
                      leaks.append(f"{path.relative_to(root)}:{token}")
          if leaks:
              raise SystemExit("Obsolete runtime references remain: " + ", ".join(leaks))
          PY
          git diff --check

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14.6"

      - name: Provision media validation tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg
          ffprobe -version

      - run: npm ci

      - name: Resolve exactly one current clinic observation
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
        run: node scripts/fetch-google-places-reputation.mjs --write-fallback --github-env

      - name: Record intended mutation surface
        run: git diff --name-only | LC_ALL=C sort > /tmp/intended-source-files.txt

      - name: Run the canonical release and independent validators
        run: |
          npm run security:dependencies
          npm run release
          npx --yes --package=vnu-jar@26.8.30 vnu --errors-only dist/index.html dist/404.html
          npm run validate:schemaorg-vocabulary

      - name: Verify deterministic static-only output
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only | LC_ALL=C sort > /tmp/final-source-files.txt
          diff -u /tmp/intended-source-files.txt /tmp/final-source-files.txt
          test ! -e functions
          test ! -e dist/_routes.json
          ! git grep -n --fixed-strings '/api/google-maps-reputation'
          ! git grep -n --fixed-strings 'wrangler pages secret'
          ! git grep -n --fixed-strings 'platformContract.cloudflare.function'
          git diff --check

      - name: Commit the release-held candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: finalize Function-free static reputation delivery"
          test -z "$(git status --porcelain)"
          git push origin HEAD:feat/static-reputation-authority-20260903

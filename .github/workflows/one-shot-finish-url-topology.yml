name: One-shot finish URL topology

on:
  push:
    branches:
      - cleanup/remove-synthetic-redirect-topology

permissions:
  contents: write

jobs:
  finish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/remove-synthetic-redirect-topology
      - name: Remove remaining generate-then-prune assumptions
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          const replaceExact = (source, before, after, label) => {
            if (!source.includes(before)) throw new Error('Missing replacement: ' + label);
            return source.replace(before, after);
          };
          let source = await readFile('scripts/validate-dist.mjs', 'utf8');
          source = replaceExact(source,
            'import { URL_ARCHITECTURE, canonicalPaths, assertHtmlTargets, fragmentRows, redirectRows, resolveContentUrl, urlForHtmlId } from "../src/lib/url-architecture.mjs";',
            'import { canonicalPaths, assertHtmlTargets, resolveContentUrl } from "../src/lib/url-architecture.mjs";', 'validate-dist imports');
          source = replaceExact(source,
            'for (const retired of URL_ARCHITECTURE.retiredPaths)\n  assert(!authoredArticle.ids.includes(retired.slice(1)), "Retired editorial block remains in the authored article: " + retired);\n', '', 'retired editorial paths');
          source = replaceExact(source,
            'const answerAliases = answerProjection.answers.map((record) => ({\n  source: "/" + record.htmlId,\n  target: urlForHtmlId(record.htmlId),\n  statusCode: 301,\n}));\n', '', 'answer aliases');
          source = replaceExact(source,
            'for (const { source, target } of answerAliases)\n  assert(redirects.includes(`${source} ${target} 301`),\n    `Missing canonical answer redirect: ${source}`);\n', '', 'answer redirect assertions');
          source = replaceExact(source,
            'const corpusAliases = redirectRows();\nassert.equal(corpusAliases.length, URL_ARCHITECTURE.decisions.filter((row) => row.decision === "301_REDIRECT").length,\n  "Every historical corpus path must redirect to its final canonical owner");\nfor (const { source, target, statusCode } of corpusAliases)\n  assert(redirects.includes(`${source} ${target} ${statusCode}`), `Missing consolidated corpus redirect: ${source}`);\nconst fragmentAliases = fragmentRows();\nfor (const { source, target } of fragmentAliases) {\n  assert(rewriteRows.some((row) => row.source === source && row.statusCode === 301),\n    `Historical authored path must have its permanent HTTP redirect: ${source}`);\n  const destination = new URL(target, lifecycle.canonicalUrl);\n  assert.equal(destination.pathname, "/", `Authored browser navigation must retain its root fragment: ${source}`);\n  assert(canonicalSurface.includes(destination.pathname), `Missing canonical fragment owner: ${target}`);\n  assertPublishedFragment(destination, (await publishedDocument(destination.pathname)).ids,\n    `Authored fragment alias ${source} -> ${target}`);\n}\n', '', 'corpus and fragment aliases');
          source = replaceExact(source,
            'const registeredSources = new Set([...legacyAliases, ...answerAliases, ...corpusAliases].map((row) => row.source));',
            'const registeredSources = new Set(legacyAliases.map((row) => row.source));', 'registered public aliases');
          source = replaceExact(source,
            '  ...legacyAliases, ...answerAliases, ...corpusAliases, ...metadataRoutes, ...namespaceAliases,',
            '  ...legacyAliases, ...metadataRoutes, ...namespaceAliases,', 'final redirect registry');
          source = replaceExact(source,
            'for (const { source } of answerAliases)\n  assert(!sitemapLocs.includes(new URL(source, lifecycle.canonicalUrl).href), "Answer redirect must not remain in the sitemap: " + source);\n', '', 'sitemap answer redirects');
          await writeFile('scripts/validate-dist.mjs', source);

          source = await readFile('README.md', 'utf8');
          source = source.replace(/^The source URL architecture declares .*$/m,
            'The source URL architecture declares exactly 72 canonical HTML resources and explicit owners for all 1,455 compiled HTML IDs (1,454 authored IDs plus the main wrapper). HTML IDs are document fragments and semantic/content targets, not HTTP paths. Adding a heading, question or Answer never creates a redirect. Deployable `_redirects` is built directly from explicit historical aliases in `src/data/redirects.json`, metadata representations and bounded machine namespaces.');
          source = source.replace(/^Authored same-document browser links use .*$/m,
            'Authored same-document browser links use `#id`, including `#saeed-ghezelbash`; generated reader navigation may use `/#id` when it needs an explicit root document. Fragment ownership and HTTP alias policy are separate: only explicitly retained historical aliases in `src/data/redirects.json` receive public redirects to reviewed final destinations. Entity IRIs remain independent of HTTP aliases.');
          source = source.replace(/^`npm run validate:live .*$/m,
            '`npm run validate:live -- --expected-commit <full-deployed-SHA>` checks every canonical document\'s commit, release, branch and provider against the deployment fingerprint as well as its robots directives, graph and canonical. It also checks every retained historical redirect and machine representation. A current `build-info.json` alone cannot certify cached documents: an obsolete HTML response can survive elsewhere in the edge cache. The report records each response\'s cache status, cache age and HTTP robots directives. For stale responses, inspect the active zone/Worker cache policy, purge the affected URL after publishing the corrected rules, then validate the ordinary URL again.');
          await writeFile('README.md', source);

          source = await readFile('docs/architecture-2026.md', 'utf8');
          source = source.replace(/^The reviewed URL policy retains .*$/m,
            'The reviewed URL architecture retains **72 canonical HTML resources**: home plus 71 focused resources. All 1,455 compiled HTML IDs (1,454 authored IDs plus the main wrapper) have explicit canonical document/fragment owners, but those IDs do not become HTTP aliases. The policy is explicit in `src/data/url-architecture.json`, validated by `src/lib/url-architecture.mjs`, and consumed by page discovery, reader navigation and machine citations. A new ID never automatically grants a new indexable URL or redirect.');
          source = source.replace(/^Same-document authored links use .*$/m,
            'Same-document authored links use `#id`; reader navigation may use `/#id` when it explicitly targets the root document. Only explicitly retained historical aliases from `src/data/redirects.json`, metadata representations and bounded machine namespaces are emitted into `_redirects`. The physician fragment IRI remains valid because it identifies the physician on the homepage; there is no independent `/saeed-ghezelbash` page or redirect.');
          await writeFile('docs/architecture-2026.md', source);

          source = await readFile('scripts/lib/reader-route-aliases.mjs', 'utf8');
          source = source.replace('Keep the reader\'s DOM lookup map small; HTTP handles the retired route set.',
            'Keep the reader\'s DOM lookup map small; HTTP handles only explicit public aliases.');
          await writeFile('scripts/lib/reader-route-aliases.mjs', source);
          NODE
          git rm -f .github/workflows/one-shot-finish-url-topology.yml
      - name: Commit direct publication model
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/validate-dist.mjs README.md docs/architecture-2026.md scripts/lib/reader-route-aliases.mjs
          git commit -m 'Validate direct public alias registry'
          git push origin HEAD:cleanup/remove-synthetic-redirect-topology

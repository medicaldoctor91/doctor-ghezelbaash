name: Final cleanup integrity

on:
  push:
    branches: [audit/dist-invariant-proof]
    paths: [.github/workflows/final-cleanup-integrity.yml]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BASELINE_SHA: 141d0962a7b3c0566206457e6f2e2db5fea70d3d
      CANDIDATE_SHA: de111fbe5ad930e31ca17cf620a7c40df9f26eff
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: de111fbe5ad930e31ca17cf620a7c40df9f26eff
          fetch-depth: 0
          persist-credentials: false

      - name: Use project Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Dependency security gate
        run: npm run security:dependencies

      - name: Astro source check
        run: npm run check

      - name: Platform contract
        run: node scripts/platform-contract.mjs validate

      - name: Release-only integrity contract
        run: npm run validate:release-contract

      - name: Build exact candidate
        shell: bash
        run: |
          set -euo pipefail
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          export CF_PAGES_COMMIT_SHA="$CANDIDATE_SHA"
          npm run build

      - name: Assert focused source delta
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          git diff --check "$BASELINE_SHA" "$CANDIDATE_SHA"
          changed="$(git diff --name-only "$BASELINE_SHA" "$CANDIDATE_SHA")"
          expected=$'package.json\nscripts/lib/release-artifacts.mjs\nscripts/package-dist.mjs'
          test "$changed" = "$expected"
          git diff --stat "$BASELINE_SHA" "$CANDIDATE_SHA"
          python - <<'PY'
          import json, pathlib
          inv=json.loads(pathlib.Path('src/data/release-invariants.json').read_text())
          expected={
            'maxRagPassageChars':4200,
            'googlebotFetchBudgetBytes':2000000,
            'googlebotReservedResponseHeaderBytes':20000,
            'googlebotSafetyMarginBytes':30000,
          }
          assert inv == expected, (inv, expected)
          print('RELEASE_INVARIANTS_MINIMAL=PASS')
          PY

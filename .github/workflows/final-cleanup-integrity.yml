name: Final cleanup integrity

on:
  push:
    branches: [audit/dist-invariant-proof]
    paths: [.github/workflows/final-cleanup-integrity.yml]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BASELINE_SHA: 9c9554726459c38bed7b9200542a74547f1f72a8
      CANDIDATE_SHA: 3f5c21614a91781ece6be5b85fc446e9f5486f4a
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 3f5c21614a91781ece6be5b85fc446e9f5486f4a
          fetch-depth: 0
          persist-credentials: false

      - name: Use project Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Dependency security gate
        run: npm run security:dependencies

      - name: Astro source check
        run: npm run check

      - name: Platform contract
        run: node scripts/platform-contract.mjs validate

      - name: Release-only integrity contract
        run: npm run validate:release-contract

      - name: Build exact candidate
        shell: bash
        run: |
          set -euo pipefail
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          export CF_PAGES_COMMIT_SHA="$CANDIDATE_SHA"
          npm run build

      - name: Assert focused source delta
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          git diff --check "$BASELINE_SHA" "$CANDIDATE_SHA"
          changed="$(git diff --name-only "$BASELINE_SHA" "$CANDIDATE_SHA")"
          expected=$'src/components/DocumentHead.astro\nsrc/data/document-head.json'
          test "$changed" = "$expected"
          test ! -e src/data/document-head.json
          test "$(git ls-files | wc -l)" = "174"
          grep -Fq "const appleMobileWebAppTitle = 'دکتر قزلباش';" src/components/DocumentHead.astro
          grep -Fq "const themeColor = '#075244';" src/components/DocumentHead.astro
          grep -Fq "const twitterCard = 'summary_large_image';" src/components/DocumentHead.astro
          ! grep -Fq "document-head.json" src/components/DocumentHead.astro
          echo DOCUMENT_HEAD_SINGLE_SOURCE=PASS

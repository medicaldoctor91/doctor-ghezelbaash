name: Final cleanup integrity

on:
  push:
    branches: [audit/dist-invariant-proof]
    paths: [.github/workflows/final-cleanup-integrity.yml]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BASELINE_SHA: 805011e0511c112f6ad1f2c326c6dc9000bc5c9d
      CANDIDATE_SHA: 9c9554726459c38bed7b9200542a74547f1f72a8
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 9c9554726459c38bed7b9200542a74547f1f72a8
          fetch-depth: 0
          persist-credentials: false

      - name: Use project Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Dependency security gate
        run: npm run security:dependencies

      - name: Astro source check
        run: npm run check

      - name: Platform contract
        run: node scripts/platform-contract.mjs validate

      - name: Release-only integrity contract
        run: npm run validate:release-contract

      - name: Build exact candidate
        shell: bash
        run: |
          set -euo pipefail
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          export CF_PAGES_COMMIT_SHA="$CANDIDATE_SHA"
          npm run build

      - name: Assert focused source delta
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          git diff --check "$BASELINE_SHA" "$CANDIDATE_SHA"
          changed="$(git diff --name-only "$BASELINE_SHA" "$CANDIDATE_SHA")"
          expected=$'scripts/lib/mojavez-evidence.mjs\nscripts/verify-mojavez-evidence.mjs'
          test "$changed" = "$expected"
          test ! -e scripts/lib/mojavez-evidence.mjs
          node --check scripts/verify-mojavez-evidence.mjs
          test "$(git ls-files | wc -l)" = "175"
          grep -Fq '"verify:mojavez": "node scripts/verify-mojavez-evidence.mjs"' package.json
          grep -Fq '"verificationRecord": ".release/evidence/mojavez-19949827.json"' src/data/evidence-registry.json
          echo MOJAVEZ_SINGLE_FILE_VERIFIER=PASS

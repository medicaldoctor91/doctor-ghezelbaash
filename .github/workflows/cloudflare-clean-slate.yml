name: One-time Cloudflare clean slate

on:
  push:
    branches: [main]
    paths: [.github/workflows/cloudflare-clean-slate.yml]

permissions:
  contents: read

concurrency:
  group: doctor-ghezelbaash-external-mutation
  cancel-in-progress: false

jobs:
  clean-slate:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      CF_PROJECT: doctor-ghezelbaash
      CLOUDFLARE_ACCOUNT_ID: 884d1d90bd1fb6ecca14992c6c60d677
      ZONE_NAME: ghezelbaash.ir
      CANONICAL_HOST: www.ghezelbaash.ir
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Remove obsolete Pages deployments and reset Cloudflare-controlled caches
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import importlib.util,json,os,time,urllib.error,urllib.parse,urllib.request
          API='https://api.cloudflare.com/client/v4'; token=os.environ['CLOUDFLARE_API_TOKEN'].strip(); account=os.environ['CLOUDFLARE_ACCOUNT_ID'].strip(); project=os.environ['CF_PROJECT'].strip(); zone_name=os.environ['ZONE_NAME'].strip(); host=os.environ['CANONICAL_HOST'].strip(); attempt=int(os.environ.get('GITHUB_RUN_ATTEMPT','1')); base=f'/accounts/{account}/pages/projects/{project}'
          class E(RuntimeError):
              def __init__(self,s,p,path): super().__init__(f'CF HTTP {s} {path}: {json.dumps(p,ensure_ascii=False)[:1200]}'); self.status=s; self.payload=p
          def req(method,path,body=None,retries=12):
              data=None if body is None else json.dumps(body,separators=(',',':')).encode(); headers={'Authorization':f'Bearer {token}','Accept':'application/json','User-Agent':'ghezelbaash-clean-slate/1.1'}
              if body is not None: headers['Content-Type']='application/json'
              for n in range(retries):
                  r=urllib.request.Request(API+path,data=data,headers=headers,method=method)
                  try:
                      with urllib.request.urlopen(r,timeout=60) as x:
                          raw=x.read().decode('utf-8','replace'); p=json.loads(raw) if raw else {}
                          if p.get('success') is not True: raise E(x.status,p,path)
                          return p
                  except urllib.error.HTTPError as x:
                      raw=x.read().decode('utf-8','replace')
                      try:p=json.loads(raw) if raw else {}
                      except:p={'raw':raw[:1000]}
                      if x.code==429 or 500<=x.code<600:
                          d=int(x.headers.get('Retry-After') or min(30,2+n*2)); print('RETRY',x.code,d,path); time.sleep(d); continue
                      raise E(x.code,p,path)
              raise RuntimeError('retry budget exhausted '+path)
          def status(d): return (d.get('latest_stage') or {}).get('status') or ((d.get('stages') or [{}])[-1].get('status')) or 'unknown'
          def keeper():
              for i in range(240):
                  p=req('GET',base)['result']; d=p.get('latest_deployment') or {}; did=d.get('id')
                  if did:
                      d=req('GET',f'{base}/deployments/{did}')['result']; print('KEEPER_WAIT',i+1,did,status(d))
                      if d.get('environment')=='production' and status(d)=='success': return d
                  time.sleep(5)
              raise RuntimeError('active production deployment did not converge')
          k=keeper(); kid=str(k['id']); print('KEEPER',kid,((k.get('deployment_trigger') or {}).get('metadata') or {}).get('commit_hash'))
          deleted=0
          for round_no in range(300):
              page=req('GET',f'{base}/deployments?per_page=25'); rows=page.get('result') or []; total=int((page.get('result_info') or {}).get('total_count') or len(rows)); others=[d for d in rows if str(d.get('id'))!=kid]
              print('ROUND',round_no+1,'visible',len(rows),'total',total,'candidates',len(others))
              if total<=1 and not others: break
              if not others: time.sleep(3); continue
              for d in others:
                  did=str(d['id'])
                  try: req('DELETE',f'{base}/deployments/{did}?force=true',retries=8); deleted+=1
                  except E as x:
                      txt=json.dumps(x.payload,ensure_ascii=False).lower()
                      if x.status==404: pass
                      elif x.status in (400,409) and 'active production deployment' in txt: print('SKIP_ACTIVE',did)
                      else: raise
                  if deleted and deleted%50==0: print('DELETED',deleted)
                  time.sleep(0.42)
          else: raise RuntimeError('deployment delete round budget exhausted')
          for i in range(60):
              page=req('GET',f'{base}/deployments?per_page=25'); rows=page.get('result') or []; total=int((page.get('result_info') or {}).get('total_count') or len(rows))
              if total==1 and len(rows)==1 and str(rows[0].get('id'))==kid: break
              print('CONVERGENCE',i+1,total); time.sleep(3)
          else: raise RuntimeError('deployment history did not converge to one')
          req('POST',f'{base}/purge_build_cache',{}); print('BUILD_CACHE_PURGED')
          spec=importlib.util.spec_from_file_location('edge','scripts/configure-cloudflare-edge.py'); edge=importlib.util.module_from_spec(spec); spec.loader.exec_module(edge); parent=edge.CloudflareApi(token); zone=edge.zone_id(parent,account,zone_name); zapi,revoke=edge.issue_ephemeral_zone_api(parent,account,zone)
          reserve={'attempt':attempt,'checked':False,'supported':None,'original':None,'clearState':None,'restored':False}
          try:
              if attempt>=2:
                  reserve['checked']=True; s,p=zapi.raw('GET',f'/zones/{zone}/cache/cache_reserve')
                  if s in (200,201) and p.get('success') is True:
                      reserve['supported']=True; original=(p.get('result') or {}).get('value'); reserve['original']=original
                      if original=='on': zapi.expect('PATCH',f'/zones/{zone}/cache/cache_reserve',{'value':'off'}); print('RESERVE_OFF')
                      cs,cp=zapi.raw('GET',f'/zones/{zone}/cache/cache_reserve_clear'); state=(cp.get('result') or {}).get('state') if cs in (200,201) and cp.get('success') is True else None
                      if state!='In-progress':
                          ss,sp=zapi.raw('POST',f'/zones/{zone}/cache/cache_reserve_clear',{}); errs=sp.get('errors') or []
                          if not (ss in (200,201) and sp.get('success') is True):
                              if 1152 in {e.get('code') for e in errs if isinstance(e,dict)}: zapi.expect('PATCH',f'/zones/{zone}/cache/cache_reserve',{'value':'off'}); sp=zapi.expect('POST',f'/zones/{zone}/cache/cache_reserve_clear',{})
                              else: raise RuntimeError('Cache Reserve clear failed '+json.dumps(sp,ensure_ascii=False)[:1000])
                          state=(sp.get('result') or {}).get('state'); print('RESERVE_CLEAR_START',state)
                      for i in range(60):
                          ss,sp=zapi.raw('GET',f'/zones/{zone}/cache/cache_reserve_clear')
                          if ss in (200,201) and sp.get('success') is True: state=(sp.get('result') or {}).get('state'); print('RESERVE_CLEAR',i+1,state)
                          if state=='Completed': break
                          time.sleep(10)
                      reserve['clearState']=state
                      if original=='on' and state=='Completed': zapi.expect('PATCH',f'/zones/{zone}/cache/cache_reserve',{'value':'on'}); reserve['restored']=True
                  else: reserve['supported']=False; print('RESERVE_NA',s,json.dumps(p.get('errors') or [],ensure_ascii=False)[:600])
              edge.purge_canonical(zapi,zone,host)
          finally: revoke()
          final=req('GET',base)['result'].get('latest_deployment') or {}
          if str(final.get('id') or '')!=kid: raise RuntimeError('active deployment drift after reset')
          print('CLOUDFLARE_CLEAN_SLATE_COMPLETE',json.dumps({'attempt':attempt,'keeperDeploymentId':kid,'deletedDeployments':deleted,'remainingDeployments':1,'pagesBuildCachePurged':True,'zoneCachePurged':True,'cacheReserve':reserve},sort_keys=True))
          PY

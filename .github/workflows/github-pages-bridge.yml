name: One-shot authority release unblock runner

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/github-pages-bridge.yml

permissions:
  contents: write
  actions: write

jobs:
  unblock:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
      ZENODO_CANDIDATE: ${{ secrets.ZENODO_TOKEN || secrets.ZENODO_ACCESS_TOKEN || secrets.ZENODO_API_TOKEN || secrets.ZENODO_API_KEY || secrets.ZENODO_PAT }}
      HF_CANDIDATE: ${{ secrets.HF_TOKEN || secrets.HUGGINGFACE_TOKEN || secrets.HUGGING_FACE_TOKEN }}
      CF_CANDIDATE: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout bootstrap commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Preflight required authority secret families
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          ready=true
          if [ -n "${ZENODO_CANDIDATE:-}" ]; then echo 'Zenodo secret family: present'; else echo 'Zenodo secret family: missing'; ready=false; fi
          if [ -n "${HF_CANDIDATE:-}" ]; then echo 'Hugging Face secret family: present'; else echo 'Hugging Face secret family: missing'; ready=false; fi
          if [ -n "${CF_CANDIDATE:-}" ]; then echo 'Cloudflare secret: present'; else echo 'Cloudflare secret: missing'; ready=false; fi
          echo "ready=$ready" >> "$GITHUB_OUTPUT"

      - name: Cancel stale Cloudflare runs holding the external mutation lock
        shell: bash
        run: |
          set -euo pipefail
          for state in in_progress queued requested pending waiting; do
            gh run list --repo "$GITHUB_REPOSITORY" --workflow cloudflare-pages-deploy.yml --status "$state" --limit 50 --json databaseId --jq '.[].databaseId' 2>/dev/null | while read -r id; do
              [ -n "$id" ] || continue
              echo "Cancelling obsolete Cloudflare run $id"
              gh run cancel "$id" --repo "$GITHUB_REPOSITORY" || true
            done
          done
          sleep 5

      - name: Patch durable Zenodo secret resolution
        if: steps.preflight.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/hugging-face-authority.yml')
          text = path.read_text()
          old = '$' + '{{ secrets.ZENODO_TOKEN }}'
          new = '$' + '{{ secrets.ZENODO_TOKEN || secrets.ZENODO_ACCESS_TOKEN || secrets.ZENODO_API_TOKEN || secrets.ZENODO_API_KEY || secrets.ZENODO_PAT }}'
          count = text.count(old)
          if count:
              path.write_text(text.replace(old, new))
              print(f'Patched {count} Zenodo secret reference(s).')
          elif new in text:
              print('Zenodo fallback already present.')
          else:
              raise SystemExit('Canonical Zenodo secret reference not found')
          PY

      - name: Restore canonical repository topology
        shell: bash
        run: |
          set -euo pipefail
          git show HEAD^:.github/workflows/github-pages-bridge.yml > .github/workflows/github-pages-bridge.yml
          git rm -f .github/workflows/authority-release-unblock.yml || true
          git config user.name ghezelbaash-release-bot
          git config user.email actions@users.noreply.github.com
          git add .github/workflows/github-pages-bridge.yml .github/workflows/hugging-face-authority.yml
          git commit -m 'fix: restore canonical workflows and unblock authority release'
          GITHUB_AUTH="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $GITHUB_AUTH" push origin HEAD:main
          unset GITHUB_AUTH

      - name: Dispatch canonical v1.2.4 authority transaction
        if: steps.preflight.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          sleep 8
          gh workflow run hugging-face-authority.yml --repo "$GITHUB_REPOSITORY" --ref main -f version=1.2.4
          echo 'Dispatched canonical v1.2.4 authority transaction.'

      - name: Fail cleanly if required secret family is unavailable
        if: steps.preflight.outputs.ready != 'true'
        shell: bash
        run: |
          echo 'At least one required secret family is unavailable; repository was restored and release was not dispatched.' >&2
          exit 1

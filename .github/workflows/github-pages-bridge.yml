name: Consolidate legacy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/github-pages-bridge.yml
      - scripts/build-github-pages-bridge.mjs
      - scripts/verify-github-pages-bridge.mjs
      - src/content-source/**
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout trusted main source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Build deterministic legacy bridge
        run: node scripts/build-github-pages-bridge.mjs github-pages-bridge-dist

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: github-pages-bridge-dist

      - name: Deploy GitHub Pages bridge
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

      - name: Verify the public bridge after deployment
        run: node scripts/verify-github-pages-bridge.mjs

name: Dispatch unblocked authority release

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/github-pages-bridge.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Wait for connector to restore canonical bridge
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            body="$(gh api -H 'Accept: application/vnd.github.raw+json' "repos/$GITHUB_REPOSITORY/contents/.github/workflows/github-pages-bridge.yml?ref=main" 2>/dev/null || true)"
            if printf '%s' "$body" | grep -q '^name: Consolidate legacy GitHub Pages$'; then
              echo 'Canonical bridge is restored on main.'
              exit 0
            fi
            sleep 3
          done
          echo 'Canonical bridge was not restored in time.' >&2
          exit 1

      - name: Clear obsolete shared-lock runs
        shell: bash
        run: |
          set -euo pipefail
          for workflow in cloudflare-pages-deploy.yml github-pages-bridge.yml hugging-face-authority.yml; do
            for state in in_progress queued requested pending waiting; do
              gh run list --repo "$GITHUB_REPOSITORY" --workflow "$workflow" --status "$state" --limit 50 --json databaseId --jq '.[].databaseId' 2>/dev/null | while read -r id; do
                [ -n "$id" ] || continue
                [ "$id" = "$GITHUB_RUN_ID" ] && continue
                echo "Cancelling obsolete $workflow run $id"
                gh run cancel "$id" --repo "$GITHUB_REPOSITORY" || true
              done
            done
          done
          sleep 8

      - name: Dispatch canonical v1.2.4 release
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run hugging-face-authority.yml --repo "$GITHUB_REPOSITORY" --ref main -f version=1.2.4
          echo 'Canonical v1.2.4 authority release dispatched.'

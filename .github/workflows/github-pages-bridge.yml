name: Canonical GitHub Pages redirect bridge

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/github-pages-bridge.yml
      - .nvmrc
      - package.json
      - package-lock.json
      - scripts/github-pages-bridge.mjs
      - scripts/lib/**
      - src/content-source/**
      - src/data/**
      - src/lib/**
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: doctor-ghezelbaash-external-mutation
  cancel-in-progress: false
  queue: max

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout trusted main source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
      - name: Use canonical Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked redirect compiler dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Enforce dependency security before deployment
        run: npm run security:dependencies
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
      - name: Build deterministic redirect bridge
        run: node scripts/github-pages-bridge.mjs build github-pages-bridge-dist
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: github-pages-bridge-dist
      - name: Deploy GitHub Pages bridge
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be5fce6e763baed58fa128

name: Quality Gate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Astro, Pages Functions, and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Use the repository npm version
        run: npm install --global npm@11.19.0

      - name: Install locked dependencies
        run: npm ci

      - name: Compile Cloudflare Pages Functions
        run: |
          mkdir -p .wrangler-validation
          npx --yes --allow-scripts=esbuild,workerd wrangler@4.114.0 \
            pages functions build functions \
            --outfile=.wrangler-validation/functions-worker.js \
            --output-routes-path=.wrangler-validation/_routes.generated.json

      - name: Validate Astro source, edge behavior, and production output
        run: npm run validate

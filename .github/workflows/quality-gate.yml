name: Quality Gate

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  checks: read

jobs:
  validate:
    name: Astro, Pages Functions, production build, and performance baseline
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Use the repository npm version
        run: npm install --global npm@11.19.0

      - name: Install locked dependencies
        run: npm ci

      - name: Verify committed semantic outputs are current
        run: |
          npm run generate:semantic
          git diff --exit-code -- \
            src/data/semantic/head-graph.min.jsonld \
            public/graph.jsonld \
            public/graph.ttl \
            public/llms.txt

      - name: Compile Cloudflare Pages Functions
        run: |
          mkdir -p .wrangler-validation
          npx --yes --allow-scripts=esbuild,workerd wrangler@4.114.0 \
            pages functions build functions \
            --outfile=.wrangler-validation/functions-worker.js \
            --output-routes-path=.wrangler-validation/_routes.generated.json

      - name: Validate Astro source, edge behavior, and production output
        run: npm run validate

      - name: Capture deterministic performance baseline
        env:
          PERFORMANCE_REPORT_PATH: ${{ runner.temp }}/performance-baseline.json
        run: node scripts/analyze-build-performance.mjs

      - name: Upload performance baseline
        uses: actions/upload-artifact@v4
        with:
          name: performance-baseline-${{ github.sha }}
          path: ${{ runner.temp }}/performance-baseline.json
          if-no-files-found: error
          retention-days: 30

  verify-production:
    if: github.event_name != 'pull_request'
    needs: validate
    name: Exact Cloudflare deployment and production contract
    runs-on: ubuntu-latest
    timeout-minutes: 18

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Download the validated build baseline
        uses: actions/download-artifact@v4
        with:
          name: performance-baseline-${{ github.sha }}
          path: ${{ runner.temp }}/performance-baseline

      - name: Load the validated HTML digest
        run: |
          REPORT='${{ runner.temp }}/performance-baseline/performance-baseline.json'
          EXPECTED_HTML_SHA256="$(jq -r '.document.sha256' "$REPORT")"
          [[ "$EXPECTED_HTML_SHA256" =~ ^[a-f0-9]{64}$ ]]
          echo "EXPECTED_HTML_SHA256=$EXPECTED_HTML_SHA256" >> "$GITHUB_ENV"

      - name: Verify the exact Cloudflare deployment and live contract
        env:
          EXPECTED_DEPLOYMENT_SHA: ${{ github.sha }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DEPLOYMENT_VERIFY_ATTEMPTS: 40
          DEPLOYMENT_VERIFY_DELAY_MS: 10000
          LIVE_VERIFY_ATTEMPTS: 20
          LIVE_VERIFY_DELAY_MS: 15000
        run: node scripts/verify-live.mjs

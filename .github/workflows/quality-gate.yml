name: Quality Gate

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  checks: read

jobs:
  validate:
    name: Generate, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Use the repository npm version
        run: npm install --global npm@11.19.0

      - name: Install locked dependencies
        run: npm ci

      - name: Verify committed semantic outputs
        run: |
          npm run generate:semantic
          git diff --exit-code -- \
            src/data/semantic/head-graph.min.jsonld \
            public/graph.jsonld \
            public/graph.ttl \
            public/llms.txt

      - name: Compile Cloudflare Pages Functions
        run: |
          mkdir -p .wrangler-validation
          npx --yes --allow-scripts=esbuild,workerd wrangler@4.114.0 \
            pages functions build functions \
            --outfile=.wrangler-validation/functions-worker.js \
            --output-routes-path=.wrangler-validation/_routes.generated.json

      - name: Validate and build production output
        run: npm run validate

  verify-production:
    if: github.event_name != 'pull_request'
    needs: validate
    name: Verify deployed production
    runs-on: ubuntu-latest
    timeout-minutes: 18

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Verify exact Cloudflare deployment and live contract
        env:
          EXPECTED_DEPLOYMENT_SHA: ${{ github.sha }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DEPLOYMENT_VERIFY_ATTEMPTS: 40
          DEPLOYMENT_VERIFY_DELAY_MS: 10000
          LIVE_VERIFY_ATTEMPTS: 20
          LIVE_VERIFY_DELAY_MS: 15000
        run: node scripts/verify-live.mjs

name: Materialize Measured Mobile Fix

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'refactor/minimal-mobile-final'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refactor/minimal-mobile-final
      - name: Apply verified source transformation
        run: python scripts/apply-mobile-fix.py
      - name: Commit final production source
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "perf(mobile): reduce canonical HTML and DOM"
          git push origin HEAD:refactor/minimal-mobile-final

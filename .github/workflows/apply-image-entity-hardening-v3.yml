name: Apply image entity hardening v3

on:
  push:
    branches: [image-entity-hardening-v3]

permissions:
  contents: write

concurrency:
  group: image-entity-hardening-v3-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[image-hardening-generated]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
          cache: npm

      - name: Apply semantic and metadata alignment
        run: |
          set -euo pipefail
          python3 -m pip install --quiet rdflib pillow
          python3 .github/scripts/apply_image_entity_hardening_v3.py

      - name: Build and validate frozen production contract
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run build
          python3 .github/scripts/validate_source.py

      - name: Commit generated semantic surfaces and assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            public/media/images/physician \
            src/pages/index.md \
            src/components/DocumentHead.astro \
            src/data/semantic/head-graph.min.jsonld \
            public/graph.jsonld \
            public/graph.ttl \
            public/_headers \
            public/sitemap.xml \
            .github/scripts/validate_source.py
          if git diff --cached --quiet; then
            echo 'No generated changes.'
            exit 0
          fi
          git commit -m 'Align image assets and entity graph [image-hardening-generated]'
          git push origin HEAD:image-entity-hardening-v3

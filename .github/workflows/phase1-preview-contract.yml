name: Phase 1 Preview Contract

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: phase1-preview-contract-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify-preview:
    if: github.head_ref == 'perf-phase1-observability'
    name: Exact Cloudflare Preview revision and HTTP contract
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Verify exact branch Preview revision and contract
        env:
          LIVE_ORIGIN: https://perf-phase1-observability.doctor-ghezelbaash.pages.dev
          EXPECTED_DEPLOYMENT_SHA: ${{ github.event.pull_request.head.sha }}
          LIVE_VERIFY_ATTEMPTS: 40
          LIVE_VERIFY_DELAY_MS: 10000
        run: node scripts/verify-live.mjs

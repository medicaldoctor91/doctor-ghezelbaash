name: Public stack integrity monitor

on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - name: Verify current serving truth
        run: |
          set -euo pipefail
          npm run build
          npm run verify:production
          node scripts/verify-current-serving.mjs
      - name: Verify frozen release snapshot truth
        shell: bash
        run: |
          set -euo pipefail
          TAG="v$(node -p "require('./src/data/release.json').release")"
          git reset --hard HEAD
          git clean -fdx
          git checkout --detach "$TAG"
          npm ci --ignore-scripts
          npm run build
          node scripts/verify-release-snapshot.mjs

name: Canonical stack drift monitor

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: doctor-ghezelbaash-stack-monitor
  cancel-in-progress: false
  queue: max

jobs:
  monitor:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Load platform contract
        run: node scripts/platform-contract.mjs export >> "$GITHUB_ENV"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14.6"
      - name: Resolve finalized current release identity
        id: release
        shell: bash
        run: |
          set -euo pipefail
          RELEASE="$(node -p "require('./src/data/release.json').release")"
          HF_URL="$(node -p "require('./src/data/release.json').dataset.huggingFace.dataset")"
          HF_REPO="${HF_URL#https://huggingface.co/datasets/}"
          git fetch --tags --force origin
          git rev-parse -q --verify "refs/tags/v$RELEASE" >/dev/null
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"
          printf 'HF_REPO=%s\n' "$HF_REPO" >> "$GITHUB_ENV"
          echo "STACK_MONITOR_RELEASE=$RELEASE"
      - run: npm ci
      - name: Enforce high-severity dependency advisory gate
        run: npm run security:dependencies
      - name: Build exact current source
        shell: bash
        run: |
          set -euo pipefail
          C=$(git rev-parse HEAD); export SOURCE_COMMIT="$C" CF_PAGES_COMMIT_SHA="$C" SOURCE_DATE_EPOCH=$(git show -s --format=%ct "$C")
          npm run build
      - name: Verify first-party deployment without mutation
        if: github.event_name != 'push'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-live.mjs discovery
          node scripts/verify-live.mjs current --website-only
          echo 'FIRST_PARTY_CURRENT_SERVING_PASS'
      - name: Verify Hugging Face current authority surface without mutation
        if: github.event_name != 'push'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-live.mjs current --hf-only
          echo 'HF_CURRENT_AUTHORITY_PASS'
      - name: Verify complete current cross-surface truth
        if: github.event_name != 'push'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-live.mjs current
          echo 'CURRENT_CROSS_SURFACE_TRUTH_PASS'
      - name: Verify frozen release snapshot truth
        if: github.event_name != 'push'
        shell: bash
        run: |
          set -euo pipefail
          TAG="v${{ steps.release.outputs.release }}"
          SNAPSHOT_SOURCE="$RUNNER_TEMP/frozen-release-source-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git worktree add --detach "$SNAPSHOT_SOURCE" "$TAG"
          trap 'git worktree remove --force "$SNAPSHOT_SOURCE"' EXIT
          (
            cd "$SNAPSHOT_SOURCE"
            # HISTORICAL_REPRODUCIBILITY_INSTALL: install the frozen lockfile
            # only to reproduce attested historical bytes. Current dependency
            # security is enforced above against current main and is a separate gate.
            npm ci
            C=$(git rev-parse HEAD); export SOURCE_COMMIT="$C" CF_PAGES_COMMIT_SHA="$C" SOURCE_DATE_EPOCH=$(git show -s --format=%ct "$C")
            npm run build
          )
          node scripts/verify-live.mjs release --source-root "$SNAPSHOT_SOURCE" --dist-root "$SNAPSHOT_SOURCE/dist"

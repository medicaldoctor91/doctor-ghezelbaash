name: Recover Zenodo source archive in place

on:
  push:
    branches: [maintenance/zenodo-in-place-20261014]
    paths:
      - '.github/workflows/zenodo-in-place-maintenance.yml'
      - '.github/scripts/zenodo_source_recovery.py'
      - 'tests/test_zenodo_source_recovery.py'

permissions:
  contents: read

concurrency:
  group: doctor-ghezelbaash-zenodo-source-recovery
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run source-recovery regression tests
        run: python -m unittest tests/test_zenodo_source_recovery.py -v

      - name: Public preflight — dataset frozen, source mismatch explicit
        run: python .github/scripts/zenodo_source_recovery.py

      - name: Recover only source DOI and verify public bytes
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN || secrets.ZENODO_ACCESS_TOKEN || secrets.ZENODO_API_TOKEN || secrets.ZENODO_API_KEY || secrets.ZENODO_PAT }}
        run: |
          test -n "${ZENODO_TOKEN:-}"
          echo "::add-mask::$ZENODO_TOKEN"
          python .github/scripts/zenodo_source_recovery.py --apply

name: Audit unresolved Cloudflare controls

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]

permissions:
  contents: read

jobs:
  audit:
    if: github.event.pull_request.head.ref == 'cloudflare-missing-controls-20260809'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 884d1d90bd1fb6ecca14992c6c60d677
      ZONE_NAME: ghezelbaash.ir
    steps:
      - name: Inspect DNSSEC and attempt Crawler Hints via public API
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import datetime as dt, json, os, urllib.error, urllib.parse, urllib.request
          A=os.environ['CLOUDFLARE_ACCOUNT_ID']; M=os.environ['CLOUDFLARE_API_TOKEN']; ZN=os.environ['ZONE_NAME']; B='https://api.cloudflare.com/client/v4'
          def call(tok,m,p,b=None):
            h={'Authorization':f'Bearer {tok}','Accept':'application/json','Content-Type':'application/json','User-Agent':'ghezelbaash-missing-controls-audit/1.0'}
            req=urllib.request.Request(B+p,data=None if b is None else json.dumps(b,separators=(',',':')).encode(),method=m,headers=h)
            try:
              with urllib.request.urlopen(req,timeout=45) as r:
                raw=r.read().decode('utf-8','replace'); return r.status,json.loads(raw) if raw else {}
            except urllib.error.HTTPError as e:
              raw=e.read().decode('utf-8','replace')
              try:x=json.loads(raw) if raw else {}
              except Exception:x={'raw':raw[:1600]}
              return e.code,x
          q=urllib.parse.urlencode({'name':ZN,'account.id':A,'per_page':50}); s,z=call(M,'GET','/zones?'+q)
          if s!=200 or z.get('success') is not True or not z.get('result'): raise SystemExit(f'zone lookup failed {s} {z}')
          zone=z['result'][0]; Z=zone['id']; print('ZONE',json.dumps({'id':Z,'status':zone.get('status'),'paused':zone.get('paused')},sort_keys=True))

          # Mint a one-hour zone-scoped token, then revoke it before exit.
          s,pg=call(M,'GET',f'/accounts/{A}/tokens/permission_groups?scope=com.cloudflare.api.account.zone')
          groups=[{'id':g['id']} for g in (pg.get('result') or []) if 'com.cloudflare.api.account.zone' in (g.get('scopes') or [])]
          exp=(dt.datetime.now(dt.timezone.utc)+dt.timedelta(hours=1)).replace(microsecond=0).isoformat().replace('+00:00','Z')
          s,t=call(M,'POST',f'/accounts/{A}/tokens',{'name':'Temporary Ghezelbaash Missing Controls Audit','expires_on':exp,'policies':[{'effect':'allow','resources':{f'com.cloudflare.api.account.zone.{Z}':'*'},'permission_groups':groups}]})
          if s not in (200,201) or t.get('success') is not True: raise SystemExit(f'temp token failed {s} {t}')
          R=t.get('result') or {}; T=R.get('value'); TID=R.get('id')
          try:
            # DNSSEC exact state and generated DS.
            s,d=call(T,'GET',f'/zones/{Z}/dnssec')
            print('DNSSEC_API',s,json.dumps(d,ensure_ascii=False,sort_keys=True))

            # Enumerate every public zone setting and surface anything related to crawlers/indexing/hints.
            s,settings=call(T,'GET',f'/zones/{Z}/settings')
            rows=settings.get('result') or [] if s==200 and settings.get('success') is True else []
            matches=[x for x in rows if any(k in str(x.get('id','')).lower() for k in ('crawler','hint','index'))]
            print('SETTING_MATCHES',json.dumps(matches,ensure_ascii=False,sort_keys=True))

            # Re-test the generic zone-setting path. If Cloudflare now exposes it, enable it.
            s,ch=call(T,'GET',f'/zones/{Z}/settings/crawler_hints')
            print('CRAWLER_HINTS_GET',s,json.dumps(ch,ensure_ascii=False,sort_keys=True))
            if s==200 and ch.get('success') is True:
              val=(ch.get('result') or {}).get('value')
              editable=(ch.get('result') or {}).get('editable')
              if val!='on' and editable is not False:
                x,y=call(T,'PATCH',f'/zones/{Z}/settings/crawler_hints',{'value':'on'})
                print('CRAWLER_HINTS_PATCH',x,json.dumps(y,ensure_ascii=False,sort_keys=True))
              x,y=call(T,'GET',f'/zones/{Z}/settings/crawler_hints')
              print('CRAWLER_HINTS_FINAL',x,json.dumps(y,ensure_ascii=False,sort_keys=True))
            else:
              # Probe plausible product endpoints read-only, to distinguish unsupported public API from permissions.
              for path in [f'/zones/{Z}/crawler_hints',f'/zones/{Z}/cache/crawler_hints',f'/zones/{Z}/cache/crawler-hints']:
                x,y=call(T,'GET',path); print('CRAWLER_HINTS_PROBE',path,x,json.dumps(y,ensure_ascii=False,sort_keys=True))

            # Check whether the domain is actually managed by Cloudflare Registrar in this account.
            s,r=call(M,'GET',f'/accounts/{A}/registrar/domains/{ZN}')
            print('REGISTRAR_LOOKUP',s,json.dumps(r,ensure_ascii=False,sort_keys=True))
          finally:
            s,p=call(M,'DELETE',f'/accounts/{A}/tokens/{TID}'); print('TEMP_TOKEN_REVOKE',s,p.get('success'))
          PY

          echo '--- PARENT DS VIA 1.1.1.1 ---'
          dig +short DS ghezelbaash.ir @1.1.1.1 || true
          echo '--- PARENT DS VIA 8.8.8.8 ---'
          dig +short DS ghezelbaash.ir @8.8.8.8 || true
          echo '--- CLOUDFLARE CDS/CDNSKEY ---'
          dig +short CDS ghezelbaash.ir @1.1.1.1 || true
          dig +short CDNSKEY ghezelbaash.ir @1.1.1.1 || true

name: Temporary Wikidata position ontology cleanup

# registered before trigger commit
on:
  workflow_run:
    workflows: ['Read-only source and release validation']
    types: [completed]

permissions:
  contents: write

jobs:
  cleanup:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      !contains(github.event.workflow_run.head_commit.message, 'Record temporary position ontology cleanup')
    runs-on: macos-15
    timeout-minutes: 10
    env:
      WIKIMEDIA_USERNAME: ${{ secrets.WIKIVERSITY_USERNAME }}
      WIKIMEDIA_BOT_PASSWORD: ${{ secrets.WIKIVERSITY_BOT_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14.6'
      - run: python -m pip install --disable-pip-version-check --no-input requests==2.32.5
      - name: Remove class-only P279 from the specific position and verify
        shell: bash
        run: |
          set -euo pipefail
          test -n "$WIKIMEDIA_USERNAME"
          test -n "$WIKIMEDIA_BOT_PASSWORD"
          mkdir -p wikimedia
          set +e
          python scripts/_tmp_remove_q141131884_p279.py > wikimedia/_tmp-q141131884-ontology-cleanup.json 2>&1
          code=$?
          echo >> wikimedia/_tmp-q141131884-ontology-cleanup.json
          echo "EXIT_CODE=$code" >> wikimedia/_tmp-q141131884-ontology-cleanup.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add wikimedia/_tmp-q141131884-ontology-cleanup.json
          git commit -m 'Record temporary position ontology cleanup' || true
          git push origin HEAD:main
          exit $code

name: Lightweight Wikidata Batch 4 snapshot
on:
  push:
    branches: [audit/wikidata-batch1-20261016]
    paths: [.github/workflows/wikidata-batch2-strengthen-scar.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Fetch exact live claims
        shell: bash
        run: |
          python - <<'PY'
          import json, urllib.parse, urllib.request
          API='https://www.wikidata.org/w/api.php'; Q='Q140287622'; UA='Q140287622-batch4-lite/1.0 (read-only)'
          def api(p):
              p={'format':'json','formatversion':'2',**p}
              req=urllib.request.Request(API+'?'+urllib.parse.urlencode(p),headers={'User-Agent':UA,'Accept':'application/json'})
              with urllib.request.urlopen(req,timeout=60) as r:return json.load(r)
          def val(s):
              if s.get('snaktype')!='value': return s.get('snaktype')
              v=s.get('datavalue',{}).get('value')
              if isinstance(v,dict) and 'id' in v:return v['id']
              if isinstance(v,dict) and 'text' in v:return v['text']
              return v
          e=api({'action':'wbgetentities','ids':Q,'props':'claims|info'})['entities'][Q]; claims=e.get('claims',{})
          out={'lastrevid':e.get('lastrevid'),'modified':e.get('modified'),'claims':{}}
          for pid in ['P39','P108','P1830','P121','P937','P496','P10283','P1960','P4012','P2037','P12201','P6634','P11079','P1153']:
              rows=[]
              for c in claims.get(pid,[]):
                  refs=[]
                  for r in c.get('references',[]):
                      rr={p:[val(x) for x in ss] for p,ss in r.get('snaks',{}).items()}
                      refs.append(rr)
                  rows.append({'guid':c['id'],'value':val(c['mainsnak']),'rank':c['rank'],'qualifiers':{p:[val(x) for x in ss] for p,ss in c.get('qualifiers',{}).items()},'references':refs})
              out['claims'][pid]=rows
          print(json.dumps(out,ensure_ascii=False,indent=2,default=str))
          print('BATCH4_LITE_PASS')
          PY

name: Verify complete active 1916-node RDF JSON-LD and canonical triple equivalence
on:
  push:
    branches:
      - fix/complete-active-rdf-jsonld-home-priority-20261122
      - codex/full-rdf-jsonld-homepage-first-1-3-6
      - feat/entity-home-evidence-on-full-rdf-20261122
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ARCHIVE_SOURCE_COMMIT: eafb138d596a91504ed0af66e2557f52848e36b6
      EXPECTED_GRAPH_SHA256: 25440dbc062dc69131341744562da86e30037f00af681d8e8fc55ad078cb2f50
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version-file: .nvmrc, cache: npm}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: npm ci
      - run: python -m pip install 'PyLD>=2,<4' 'rdflib>=7,<8' 'pyshacl>=0.30,<1' 'mlcroissant==1.1.1'
      - run: npm run build
      - name: All canonical entities appear in a single active HEAD JSON-LD, before visible content
        run: |
          node --test --test-concurrency=1 tests/home-canonical-rdf-head.test.mjs tests/physician-page-output.test.mjs
          python tests/active-home-canonical-projection.test.py
          python tests/validate_canonical_invariants.py dist
          node --test --test-concurrency=1 tests/*.test.mjs
          python tests/validate_platform_bundle.py dist --no-query --rdf
          python tests/validate_machine_resources.py dist
      - name: W3C JSON-LD normalized RDF N-Quads must be identical
        run: |
          python - <<'PY'
          import hashlib,json,os,re
          from pathlib import Path
          from pyld import jsonld
          full_bytes=Path('dist/graph.jsonld').read_bytes()
          assert hashlib.sha256(full_bytes).hexdigest()==os.environ['EXPECTED_GRAPH_SHA256']
          html=Path('dist/index.html').read_bytes()
          m=re.search(rb'<script id="canonical-entity-graph" type="application/ld\+json">([\s\S]*?)</script>',html)
          assert m, 'Complete active HEAD JSON-LD is missing'
          assert m.end()<2_000_000, 'Full graph was truncated by Googlebot HTML byte budget'
          embedded=json.loads(m.group(1))
          external=json.loads(full_bytes)
          assert len(embedded['@graph'])==len(external['@graph'])==1916
          left=jsonld.normalize(embedded,{'algorithm':'URDNA2015','format':'application/n-quads'})
          right=jsonld.normalize(external,{'algorithm':'URDNA2015','format':'application/n-quads'})
          assert left==right,'RDF triple set changed during explicit @id normalization'
          print(json.dumps({'status':'PASS','nodes':1916,'rdfQuadCount':len(right.splitlines()),'canonicalGraphSha256':hashlib.sha256(full_bytes).hexdigest(),'activeScriptEndByte':m.end()},sort_keys=True))
          PY
      - name: Verify final Cloudflare preview serves the full active RDF and unchanged source graph
        run: |
          python - <<'PY'
          import hashlib,json,requests
          base='https://9697a97d.doctor-ghezelbaash.pages.dev'
          headers={'Cache-Control':'no-cache','Accept-Encoding':'identity'}
          html=requests.get(base+'/',headers=headers,timeout=90)
          graph=requests.get(base+'/graph.jsonld',headers=headers,timeout=90)
          html.raise_for_status();graph.raise_for_status()
          assert hashlib.sha256(graph.content).hexdigest()=='25440dbc062dc69131341744562da86e30037f00af681d8e8fc55ad078cb2f50'
          tag=b'<script id="canonical-entity-graph" type="application/ld+json">'
          assert html.content.count(tag)==1
          start=html.content.index(tag)+len(tag)
          end=html.content.index(b'</script>',start)
          assert end+9<2_000_000
          assert end+9<html.content.index(b'</head>')<html.content.index(b'<body')
          assert b'<script id="schema-core-mainentity" type="application/ld+json">' not in html.content
          data=json.loads(html.content[start:end])
          assert len(data['@graph'])==1916
          assert len({n['@id'] for n in data['@graph']})==1916
          section=b'class="entity-home-evidence"'
          assert html.content.count(section)==1,'Missing unique physician Entity Home evidence'
          start_evidence=html.content.index(section)
          section_end=html.content.index(b'</section>',start_evidence)+len(b'</section>')
          assert section_end<2_000_000,'Entity Home corroboration is truncated after 2MB'
          for uri in [
              b'https://membersearch.irimc.org/member/profile?id=9efaaf28-52ff-49ad-8d45-be6e48c4fa3e',
              b'https://orcid.org/0009-0001-9346-8475',
              b'https://www.wikidata.org/entity/Q140287622',
              b'https://pubmed.ncbi.nlm.nih.gov/27280013/',
              b'https://pubmed.ncbi.nlm.nih.gov/34574943/'
          ]:
              assert uri in html.content[start_evidence:section_end], ('Missing authority evidence',uri)
          h1=html.content.index(b'<h1')
          assert h1<2_000_000,'Homepage main heading should be crawlable after priority JSON-LD'
          print(json.dumps({'preview':'PASS','nodes':1916,'activeScriptEndByte':end+9,'H1Byte':h1,'graphSHA256':hashlib.sha256(graph.content).hexdigest()}))
          PY

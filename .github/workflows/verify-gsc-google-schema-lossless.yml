name: Verify complete active 1916-node RDF JSON-LD and canonical triple equivalence
on:
  push:
    branches:
      - fix/complete-active-rdf-jsonld-home-priority-20261122
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ARCHIVE_SOURCE_COMMIT: eafb138d596a91504ed0af66e2557f52848e36b6
      EXPECTED_GRAPH_SHA256: 25440dbc062dc69131341744562da86e30037f00af681d8e8fc55ad078cb2f50
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version-file: .nvmrc, cache: npm}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: npm ci
      - run: python -m pip install 'PyLD>=2,<4'
      - run: npm run build
      - name: All canonical entities appear in a single active HEAD JSON-LD, before visible content
        run: |
          node --test --test-concurrency=1 tests/home-canonical-rdf-head.test.mjs tests/physician-page-output.test.mjs
          python tests/active-home-canonical-projection.test.py
          python tests/validate_canonical_invariants.py dist
      - name: W3C JSON-LD normalized RDF N-Quads must be identical
        run: |
          python - <<'PY'
          import hashlib,json,os,re
          from pathlib import Path
          from pyld import jsonld
          full_bytes=Path('dist/graph.jsonld').read_bytes()
          assert hashlib.sha256(full_bytes).hexdigest()==os.environ['EXPECTED_GRAPH_SHA256']
          html=Path('dist/index.html').read_bytes()
          m=re.search(rb'<script id="canonical-entity-graph" type="application/ld\+json">([\s\S]*?)</script>',html)
          assert m, 'Complete active HEAD JSON-LD is missing'
          assert m.end()<2_000_000, 'Full graph was truncated by Googlebot HTML byte budget'
          embedded=json.loads(m.group(1))
          external=json.loads(full_bytes)
          assert len(embedded['@graph'])==len(external['@graph'])==1916
          left=jsonld.normalize(embedded,{'algorithm':'URDNA2015','format':'application/n-quads'})
          right=jsonld.normalize(external,{'algorithm':'URDNA2015','format':'application/n-quads'})
          assert left==right,'RDF triple set changed during explicit @id normalization'
          print(json.dumps({'status':'PASS','nodes':1916,'rdfQuadCount':len(right.splitlines()),'canonicalGraphSha256':hashlib.sha256(full_bytes).hexdigest(),'activeScriptEndByte':m.end()},sort_keys=True))
          PY

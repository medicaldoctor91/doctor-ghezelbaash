name: PR401 HTML semantic ownership migration

on:
  push:
    branches:
      - refactor/single-source-truth-no-dist-drift

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
      - name: Apply reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(wc -c < .github/pr401-html-ownership.patch.part00a)" -eq 2500
          test "$(wc -c < .github/pr401-html-ownership.patch.part00b)" -eq 2500
          test "$(wc -c < .github/pr401-html-ownership.patch.part01)" -eq 5000
          test "$(wc -c < .github/pr401-html-ownership.patch.part02x)" -eq 2500
          test "$(wc -c < .github/pr401-html-ownership.patch.part02y)" -eq 2500
          test "$(wc -c < .github/pr401-html-ownership.patch.part03)" -eq 5000
          test "$(wc -c < .github/pr401-html-ownership.patch.part04)" -eq 196
          echo 'a39bd62976daff3095cef9ba02178230c1c498ab93c6fed4c9d056fc83cac8fc  .github/pr401-html-ownership.patch.part00a' | sha256sum -c -
          echo 'ffee0c4fc4bb04a62d33ed0635cc1fbf13aaaac3a5b751b731d13204fe038348  .github/pr401-html-ownership.patch.part00b' | sha256sum -c -
          echo 'cadec5a79c8731a416da41112c8f17b29704b9c21b3b4d0b10dc5e4ad40faf86  .github/pr401-html-ownership.patch.part01' | sha256sum -c -
          echo '0ba95754ed2d29fc901371815b07d5cdafad78f00f87108c745a088909722221  .github/pr401-html-ownership.patch.part02x' | sha256sum -c -
          echo '6b01b03b9109aa7da5f50ca06468095237eb88528f1c7323705dbec873fa1bb8  .github/pr401-html-ownership.patch.part02y' | sha256sum -c -
          echo '9503ebdb29b76961f146a1e3ae0593668d80a24bb17a9bc51c38598d0b6b885f  .github/pr401-html-ownership.patch.part03' | sha256sum -c -
          echo '2001883ab39092c336940d618291a3720d75b2cf653c59cda4a61f7bdd3d4556  .github/pr401-html-ownership.patch.part04' | sha256sum -c -
          cat .github/pr401-html-ownership.patch.part00a .github/pr401-html-ownership.patch.part00b .github/pr401-html-ownership.patch.part01 .github/pr401-html-ownership.patch.part02x .github/pr401-html-ownership.patch.part02y .github/pr401-html-ownership.patch.part03 .github/pr401-html-ownership.patch.part04 > /tmp/pr401.patch.gz.b64
          test "$(wc -c < /tmp/pr401.patch.gz.b64)" -eq 20196
          base64 -d /tmp/pr401.patch.gz.b64 > /tmp/pr401.patch.gz
          echo '20503dbbff01321b00f876e625bf705bb4e16b7084d4871404bebd60858fefa0  /tmp/pr401.patch.gz' | sha256sum -c -
          gzip -dc /tmp/pr401.patch.gz > /tmp/pr401.patch
          echo 'e95a94500d152754a7f12e55015ce520c822388f172ceeae6651e6a827f96da5  /tmp/pr401.patch' | sha256sum -c -
          git apply --check /tmp/pr401.patch
          git apply /tmp/pr401.patch
      - name: Install exact dependencies
        run: npm ci
      - name: Bind new owners to the frozen visible-text contract
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFile, writeFile } from 'node:fs/promises';
          import { sourceContract, sourceRawHashes } from './scripts/lib/visible-text-contract.mjs';

          const file = 'src/data/visible-text-contract.json';
          const baseline = JSON.parse(await readFile(file, 'utf8'));
          const actual = await sourceContract(process.cwd());
          const existingKeys = Object.keys(baseline.source);
          for (const key of existingKeys) {
            assert.deepEqual(actual[key], baseline.source[key], `Protected visible source changed: ${key}`);
          }
          const extraKeys = Object.keys(actual).filter((key) => !existingKeys.includes(key));
          assert.deepEqual(extraKeys, ['footerGovernance'], 'Only footerGovernance may become a new visible source owner');

          const raw = await sourceRawHashes(process.cwd());
          const allowedChanged = new Set([
            'src/content-source/page.md',
            'src/data/semantic/knowledge-graph.jsonld',
            'src/components/SiteFooter.astro',
            'src/layouts/BaseLayout.astro',
          ]);
          for (const [path, oldHash] of Object.entries(baseline.sourceRawSha256)) {
            if (!(path in raw)) {
              assert.equal(path, 'src/data/reputation-observation.json', `Unexpected raw source removal: ${path}`);
              continue;
            }
            if (raw[path] !== oldHash) assert.ok(allowedChanged.has(path), `Unexpected raw source change: ${path}`);
          }
          for (const path of Object.keys(raw)) {
            assert.ok(path in baseline.sourceRawSha256 || allowedChanged.has(path), `Unexpected raw source addition: ${path}`);
          }

          baseline.sourceRawSha256 = raw;
          baseline.source = {
            page: baseline.source.page,
            footerGovernance: actual.footerGovernance,
            ...Object.fromEntries(Object.entries(baseline.source).filter(([key]) => key !== 'page')),
          };
          await writeFile(file, `${JSON.stringify(baseline, null, 2)}\n`);
          NODE
      - name: Validate ownership migration
        shell: bash
        run: |
          set -euo pipefail
          npm run validate:visible-text-source
          npm run test:visible-text
          npm run validate:architecture
          npm run validate:reputation
          node scripts/platform-contract.mjs validate
          node scripts/validate-source.mjs
          node scripts/test-contracts.mjs
          node scripts/validate-critical-ctas.mjs
          npm run test:schemaorg-vocabulary
          npm run test:machine-resources
      - name: Commit migration and remove scaffolding
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/pr401-html-semantic-ownership.yml
          rm .github/pr401-html-ownership.patch.gz.b64
          rm .github/pr401-html-ownership.patch.part00a
          rm .github/pr401-html-ownership.patch.part00b
          rm .github/pr401-html-ownership.patch.part01
          rm .github/pr401-html-ownership.patch.part02
          rm .github/pr401-html-ownership.patch.part02a
          rm .github/pr401-html-ownership.patch.part02x
          rm .github/pr401-html-ownership.patch.part02y
          rm .github/pr401-html-ownership.patch.part03
          rm .github/pr401-html-ownership.patch.part04
          git add -A
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'refactor: consolidate HTML semantic ownership into graph and page'
          git push origin HEAD:refactor/single-source-truth-no-dist-drift

name: PR401 HTML semantic ownership migration

on:
  push:
    branches:
      - refactor/single-source-truth-no-dist-drift

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
      - name: Apply reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(wc -c < .github/pr401-html-ownership.patch.gz.b64)" -eq 5000
          test "$(wc -c < .github/pr401-html-ownership.patch.part01)" -eq 5000
          test "$(wc -c < .github/pr401-html-ownership.patch.part02a)" -eq 5000
          test "$(wc -c < .github/pr401-html-ownership.patch.part03)" -eq 5000
          test "$(wc -c < .github/pr401-html-ownership.patch.part04)" -eq 196
          echo 'c5143b122604f5fb8b906d2defadc24bcdbb149d0e21e94d138dd6391da46e68  .github/pr401-html-ownership.patch.gz.b64' | sha256sum -c -
          echo 'cadec5a79c8731a416da41112c8f17b29704b9c21b3b4d0b10dc5e4ad40faf86  .github/pr401-html-ownership.patch.part01' | sha256sum -c -
          echo '4de41c7a0392089db9c739e5ac2c9c469543147a01a6723a18217f3d153a1e74  .github/pr401-html-ownership.patch.part02a' | sha256sum -c -
          echo '9503ebdb29b76961f146a1e3ae0593668d80a24bb17a9bc51c38598d0b6b885f  .github/pr401-html-ownership.patch.part03' | sha256sum -c -
          echo '2001883ab39092c336940d618291a3720d75b2cf653c59cda4a61f7bdd3d4556  .github/pr401-html-ownership.patch.part04' | sha256sum -c -
          cat .github/pr401-html-ownership.patch.gz.b64 .github/pr401-html-ownership.patch.part01 .github/pr401-html-ownership.patch.part02a .github/pr401-html-ownership.patch.part03 .github/pr401-html-ownership.patch.part04 > /tmp/pr401.patch.gz.b64
          test "$(wc -c < /tmp/pr401.patch.gz.b64)" -eq 20196
          base64 -d /tmp/pr401.patch.gz.b64 > /tmp/pr401.patch.gz
          echo '20503dbbff01321b00f876e625bf705bb4e16b7084d4871404bebd60858fefa0  /tmp/pr401.patch.gz' | sha256sum -c -
          gzip -dc /tmp/pr401.patch.gz > /tmp/pr401.patch
          echo 'e95a94500d152754a7f12e55015ce520c822388f172ceeae6651e6a827f96da5  /tmp/pr401.patch' | sha256sum -c -
          git apply --check /tmp/pr401.patch
          git apply /tmp/pr401.patch
      - name: Install exact dependencies
        run: npm ci
      - name: Validate ownership migration
        shell: bash
        run: |
          set -euo pipefail
          npm run validate:visible-text-source
          npm run test:visible-text
          npm run validate:architecture
          npm run validate:reputation
          node scripts/platform-contract.mjs validate
          node scripts/validate-source.mjs
          node scripts/test-contracts.mjs
          node scripts/validate-critical-ctas.mjs
          npm run test:schemaorg-vocabulary
          npm run test:machine-resources
      - name: Commit migration and remove scaffolding
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/pr401-html-semantic-ownership.yml
          rm .github/pr401-html-ownership.patch.gz.b64
          rm .github/pr401-html-ownership.patch.part01
          rm .github/pr401-html-ownership.patch.part02
          rm .github/pr401-html-ownership.patch.part02a
          rm .github/pr401-html-ownership.patch.part03
          rm .github/pr401-html-ownership.patch.part04
          git add -A
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'refactor: consolidate HTML semantic ownership into graph and page'
          git push origin HEAD:refactor/single-source-truth-no-dist-drift

name: Preflight and publish frozen reserved DOI release
on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [inspect, preflight, stage-draft, publish-frozen, verify-publication]
        required: true
      candidate_run: {type: string, required: false}
      reviewed_commit: {type: string, required: true}
permissions:
  contents: read
  actions: read
concurrency:
  group: doctor-ghezelbaash-publication
  cancel-in-progress: false
jobs:
  coordinated:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN || secrets.ZENODO_ACCESS_TOKEN || secrets.ZENODO_API_TOKEN || secrets.ZENODO_API_KEY || secrets.ZENODO_PAT }}
      HF_TOKEN: ${{ secrets.HF_TOKEN || secrets.HUGGINGFACE_TOKEN || secrets.HUGGING_FACE_TOKEN }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN || secrets.KAGGLE_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 884d1d90bd1fb6ecca14992c6c60d677
      REVIEWED_COMMIT: ${{ inputs.reviewed_commit }}
      OPERATION: ${{ inputs.operation }}
      GIT_LFS_SKIP_SMUDGE: '1'
      ARCHIVE_SOURCE_COMMIT: ${{ vars.ZENODO_23474664_SOURCE_COMMIT }}
      PREPARE_RESERVED_DOI: ${{ (inputs.operation == 'preflight' || inputs.operation == 'inspect') && '23474664' || '' }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - run: test "$GITHUB_SHA" = "$REVIEWED_COMMIT"
      - uses: actions/setup-node@v4
        if: inputs.operation != 'inspect'
        with: {node-version-file: .nvmrc, cache: npm}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install requests 'kaggle==2.2.4'
      - name: Build and test all release inputs
        if: inputs.operation == 'preflight'
        run: |
          npm ci
          python -m pip install 'huggingface_hub>=0.34,<1' 'pyarrow==22.0.0' 'kaggle==2.2.4' 'rdflib>=7,<8' 'pyshacl>=0.30,<1' 'mlcroissant==1.1.1' 'PyLD==3.3.0' PyYAML
          node --test tests/*.test.mjs
          npm run build
          python tests/coordinated-doi-release.test.py
          python tests/doi-validation.test.py
          python tests/platform-bundle-sync.test.py
          python tests/platform-publication.test.py
          python tests/validate_machine_resources.py dist
          python tests/validate_canonical_invariants.py dist
      - name: Install frozen-publication dependencies
        if: inputs.operation == 'publish-frozen' || inputs.operation == 'stage-draft' || inputs.operation == 'verify-publication'
        run: python -m pip install 'pyarrow==22.0.0' 'kaggle==2.2.4' 'rdflib>=7,<8' 'pyshacl>=0.30,<1' 'mlcroissant==1.1.1' 'PyLD==3.3.0' PyYAML
      - uses: actions/download-artifact@v4
        if: inputs.operation == 'publish-frozen' || inputs.operation == 'stage-draft' || inputs.operation == 'verify-publication'
        with:
          name: frozen-coordinated-candidate
          run-id: ${{ inputs.candidate_run }}
          github-token: ${{ github.token }}
          path: /tmp/frozen-artifact/
      - name: Restore the validated artifact without rebuilding
        if: inputs.operation == 'publish-frozen' || inputs.operation == 'stage-draft' || inputs.operation == 'verify-publication'
        run: |
          tar -xzf /tmp/frozen-artifact/candidate.tar.gz -C /tmp
          python - <<'PYGUARD'
          import json,os
          p=json.load(open('/tmp/coordinated-release/release-plan.json'))
          import subprocess
          subprocess.run(['git','merge-base','--is-ancestor',p['sourceCommit'],os.environ['GITHUB_SHA']],check=True)
          subprocess.run(['git','diff','--quiet',p['sourceCommit'],os.environ['GITHUB_SHA'],'--','src','public','build','package.json','package-lock.json','astro.config.mjs','.nvmrc'],check=True)
          PYGUARD
      - run: python .github/scripts/coordinated_doi_release.py "$OPERATION"
      - name: Preserve the exact frozen candidate including its Git object
        if: inputs.operation == 'preflight' && success()
        run: tar -czf /tmp/candidate.tar.gz -C /tmp coordinated-release
      - uses: actions/upload-artifact@v4
        if: inputs.operation == 'preflight' && success()
        with:
          name: frozen-coordinated-candidate
          path: /tmp/candidate.tar.gz
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coordinated-release-evidence
          path: |
            /tmp/coordinated-release/*.json
            /tmp/coordinated-release/*.log
          include-hidden-files: false

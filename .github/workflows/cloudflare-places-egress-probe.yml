name: Cloudflare Places egress probe

on:
  push:
    branches: [tmp/test-maps-key]
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_ACCOUNT_ID: 884d1d90bd1fb6ecca14992c6c60d677
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  WORKER_NAME: ghezelbaash-maps-egress-probe

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Build temporary Worker
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/probe
          cat >/tmp/probe/wrangler.toml <<'EOF'
          name = "ghezelbaash-maps-egress-probe"
          main = "worker.js"
          compatibility_date = "2026-08-10"
          workers_dev = true
          EOF
          cat >/tmp/probe/worker.js <<'EOF'
          export default {
            async fetch() {
              const url = 'https://places.googleapis.com/v1/places/ChIJBT0YDOTt-j8RD-7mAPy6Zas?fields=id,rating,userRatingCount';
              try {
                const r = await fetch(url, { headers: { 'User-Agent': 'ghezelbaash-maps-probe/1.0' } });
                const body = await r.text();
                return Response.json({ reachedGoogle: true, upstreamStatus: r.status, body: body.slice(0, 1200) });
              } catch (e) {
                return Response.json({ reachedGoogle: false, error: String(e) }, { status: 502 });
              }
            }
          };
          EOF

      - name: Deploy temporary Worker
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/probe
          npx --yes wrangler@4.120.0 deploy

      - name: Call probe and print sanitized result
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request
          account=os.environ['CLOUDFLARE_ACCOUNT_ID']; token=os.environ['CLOUDFLARE_API_TOKEN']; name=os.environ['WORKER_NAME']
          req=urllib.request.Request(f'https://api.cloudflare.com/client/v4/accounts/{account}/workers/subdomain', headers={'Authorization':f'Bearer {token}','Accept':'application/json'})
          with urllib.request.urlopen(req,timeout=30) as r: data=json.load(r)
          sub=(data.get('result') or {}).get('subdomain')
          if not sub: raise SystemExit(f'workers.dev subdomain missing: {data}')
          url=f'https://{name}.{sub}.workers.dev/'
          with urllib.request.urlopen(url,timeout=45) as r: result=json.load(r)
          print('PROBE_URL', url)
          print('PROBE_RESULT', json.dumps(result, ensure_ascii=False, sort_keys=True))
          if result.get('reachedGoogle') is not True:
              raise SystemExit('Cloudflare Worker could not reach Google Places')
          PY

      - name: Delete temporary Worker
        if: always()
        shell: bash
        run: |
          cd /tmp/probe 2>/dev/null || exit 0
          npx --yes wrangler@4.120.0 delete --name "$WORKER_NAME" --force || true

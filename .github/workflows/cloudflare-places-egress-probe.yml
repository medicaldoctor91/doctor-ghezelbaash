name: Cloudflare Places egress probe

on:
  push:
    branches: [tmp/test-maps-key]
    paths: ['.github/workflows/cloudflare-places-egress-probe.yml']
  workflow_dispatch:

permissions:
  contents: write

env:
  CLOUDFLARE_ACCOUNT_ID: 884d1d90bd1fb6ecca14992c6c60d677
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  WORKER_NAME: ghezelbaash-maps-egress-probe

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/test-maps-key

      - name: Build temporary Worker
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/probe
          cat >/tmp/probe/wrangler.toml <<'EOF'
          name = "ghezelbaash-maps-egress-probe"
          main = "worker.js"
          compatibility_date = "2026-08-10"
          workers_dev = true
          EOF
          cat >/tmp/probe/worker.js <<'EOF'
          export default {
            async fetch() {
              const url = 'https://places.googleapis.com/v1/places/ChIJBT0YDOTt-j8RD-7mAPy6Zas?fields=id,rating,userRatingCount';
              try {
                const r = await fetch(url, { headers: { 'User-Agent': 'ghezelbaash-maps-probe/1.0' } });
                const body = await r.text();
                return Response.json({ reachedGoogle: true, upstreamStatus: r.status, body: body.slice(0, 1200) });
              } catch (e) {
                return Response.json({ reachedGoogle: false, error: String(e) }, { status: 502 });
              }
            }
          };
          EOF

      - name: Deploy temporary Worker and run probe
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/probe
          npx --yes wrangler@4.120.0 deploy
          python - <<'PY'
          import json, os, urllib.request
          account=os.environ['CLOUDFLARE_ACCOUNT_ID']; token=os.environ['CLOUDFLARE_API_TOKEN']; name=os.environ['WORKER_NAME']
          req=urllib.request.Request(f'https://api.cloudflare.com/client/v4/accounts/{account}/workers/subdomain', headers={'Authorization':f'Bearer {token}','Accept':'application/json'})
          with urllib.request.urlopen(req,timeout=30) as r: data=json.load(r)
          sub=(data.get('result') or {}).get('subdomain')
          if not sub: raise SystemExit('workers.dev subdomain missing')
          url=f'https://{name}.{sub}.workers.dev/'
          try:
              with urllib.request.urlopen(url,timeout=45) as r: result=json.load(r)
          except Exception as e:
              result={'probeCallFailed':True,'error':str(e)}
          safe={'workerUrl':url,'result':result}
          open('/tmp/probe-result.json','w').write(json.dumps(safe,ensure_ascii=False,indent=2,sort_keys=True)+'\n')
          print(json.dumps(safe,ensure_ascii=False,sort_keys=True))
          PY

      - name: Delete temporary Worker
        if: always()
        shell: bash
        run: |
          cd /tmp/probe 2>/dev/null || exit 0
          npx --yes wrangler@4.120.0 delete --name "$WORKER_NAME" --force || true

      - name: Commit sanitized probe result to test branch
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f /tmp/probe-result.json || printf '%s\n' '{"workflowFailedBeforeProbe":true}' >/tmp/probe-result.json
          mkdir -p tmp
          cp /tmp/probe-result.json tmp/cloudflare-places-egress-probe-result.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tmp/cloudflare-places-egress-probe-result.json
          git diff --cached --quiet && exit 0
          git commit -m 'test: record sanitized Cloudflare Places probe result'
          git push origin HEAD:tmp/test-maps-key

name: Independent Wikidata physician/clinic and homepage Entity Home audit (read-only)
on:
  push:
    branches: [audit/wikidata-entity-home-20261122]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  wikidata-entity-home:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install minimal read-only verification tools
        run: python -m pip install requests beautifulsoup4
      - name: Audit live homepage, Googlebot byte limit and Wikidata relations
        run: python .github/scripts/audit_live_wikidata_entity_home.py
      - name: Preserve independently observed full audit result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-wikidata-entity-home-audit
          path: /tmp/wikidata-entity-home-live-audit.json
          if-no-files-found: warn
          retention-days: 30

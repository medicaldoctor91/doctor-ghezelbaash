name: v1.2.2 disable Zenodo GitHub auto-archive
on:
  push:
    branches: [release/v1.2.2-candidate]
    paths: [.github/workflows/v122-zenodo-disable-autoarchive.yml]
permissions:
  contents: read
jobs:
  disable:
    runs-on: ubuntu-24.04
    steps:
      - name: Disable repository in Zenodo GitHub integration if currently enabled
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ZENODO_TOKEN"
          url='https://zenodo.org/api/user/github/repositories/965133054/disable'
          code=$(curl -sS -o /tmp/zenodo-github-disable.txt -w '%{http_code}' -X POST -H "Authorization: Bearer $ZENODO_TOKEN" -H 'Accept: application/json' "$url")
          echo "ZENODO_GITHUB_DISABLE_HTTP=$code"
          case "$code" in
            200|204) echo 'ZENODO_GITHUB_AUTOARCHIVE_DISABLED_EXPLICITLY=true' ;;
            400|403|404) echo 'ZENODO_GITHUB_AUTOARCHIVE_DISABLE_UNPROVEN=true'; cat /tmp/zenodo-github-disable.txt | head -c 800; echo; exit 2 ;;
            *) cat /tmp/zenodo-github-disable.txt | head -c 800; echo; exit 3 ;;
          esac

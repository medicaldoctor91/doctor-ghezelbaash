name: Audit public Zenodo recovery state

on:
  push:
    branches:
      - maintenance/zenodo-in-place-20261014
    paths:
      - '.github/workflows/zenodo-public-recovery-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read public Zenodo state with cache-busting verification
        run: |
          python - <<'PY'
          import hashlib, json, pathlib, subprocess, tempfile, time, urllib.parse, urllib.request
          Z='https://zenodo.org/api'
          ORIGIN='https://www.ghezelbaash.ir'

          def busted(url):
              sep='&' if '?' in url else '?'
              return f"{url}{sep}_cb={time.time_ns()}"

          def req(url, parse_json=True, timeout=900):
              r=urllib.request.Request(
                  busted(url),
                  headers={
                      'Accept':'application/json' if parse_json else 'application/octet-stream,*/*',
                      'Cache-Control':'no-cache, no-store, max-age=0',
                      'Pragma':'no-cache',
                      'Expires':'0',
                      'User-Agent':'ghezelbaash-zenodo-public-recovery-audit/2.0',
                  },
              )
              with urllib.request.urlopen(r,timeout=timeout) as resp:
                  body=resp.read()
                  return json.loads(body) if parse_json else body

          ds=req(f'{Z}/records/22838416')
          src=req(f'{Z}/records/23289009')
          source_commit=req(ORIGIN+'/release-provenance.json')['sourceCommit']

          checks={}
          for name in ['croissant.json','shapes.ttl','dcat.ttl','datapackage.json','current-release-matrix.json','release-attestation.json','dist-sha256.json']:
              body=req(f"{Z}/records/22838416/files/{urllib.parse.quote(name,safe='')}/content",False)
              row={'bytes':len(body),'sha256':hashlib.sha256(body).hexdigest()}
              if name=='croissant.json':
                  o=json.loads(body); row['datasetIri']=o.get('@id')
                  def typed(v):
                      vals=v if isinstance(v,list) else [v]
                      for x in vals:
                          if isinstance(x,dict):
                              ts=x.get('@type',[]); ts=ts if isinstance(ts,list) else [ts]
                              if any(str(t).endswith(('Person','Organization')) for t in ts): return True
                      return False
                  row['creatorTyped']=typed(o.get('creator')); row['publisherTyped']=typed(o.get('publisher'))
              elif name=='shapes.ttl':
                  t=body.decode(); row['nodeShapes']=t.count('<http://www.w3.org/ns/shacl#NodeShape>')+t.count('sh:NodeShape')
              elif name=='dcat.ttl':
                  t=body.decode(); row['measuredMarkers']=all(m in t for m in ['dcat:byteSize','spdx:checksum','spdx:checksumAlgorithm_sha256','https://www.iana.org/assignments/media-types/'])
              elif name=='datapackage.json': row['resources']=len(json.loads(body).get('resources',[]))
              elif name=='current-release-matrix.json':
                  o=json.loads(body); row['websiteSourceCommit']=o.get('websiteSourceCommit'); row['canonicalDatasetIri']=o.get('canonicalDatasetIri'); row['publicationScope']=o.get('publicationScope')
              elif name=='release-attestation.json':
                  o=json.loads(body); row['sourceCommit']=o.get('sourceCommit'); row['canonicalDatasetIri']=o.get('canonicalDatasetIri'); row['version']=o.get('version')
              checks[name]=row

          srcf=src['files'][0]
          source_key=srcf['key']
          source_body=req(f"{Z}/records/23289009/files/{urllib.parse.quote(source_key,safe='')}/content",False)
          source_body_md5=hashlib.md5(source_body).hexdigest()

          subprocess.run(['git','cat-file','-e',source_commit+'^{commit}'],check=True)
          with tempfile.TemporaryDirectory() as td:
              p=pathlib.Path(td)/'source.zip'
              subprocess.run(['git','archive','--format=zip','--prefix=doctor-ghezelbaash-source-final-2026-10-10/','-o',str(p),source_commit],check=True)
              desired=p.read_bytes()

          desired_md5=hashlib.md5(desired).hexdigest()
          live_checksum=srcf.get('checksum','')
          live_md5=live_checksum.split(':',1)[1] if live_checksum.startswith('md5:') else None
          metadata_matches=(live_md5==desired_md5 and int(srcf.get('size',-1))==len(desired))
          bytes_match=(source_body_md5==desired_md5 and len(source_body)==len(desired) and source_body==desired)
          metadata_matches_download=(live_md5==source_body_md5 and int(srcf.get('size',-1))==len(source_body))

          out={
            'dataset':{'doi':ds.get('doi'),'version':ds.get('metadata',{}).get('version'),'fileCount':len(ds.get('files',[])),'checks':checks},
            'source':{
              'doi':src.get('doi'),'version':src.get('metadata',{}).get('version'),'fileCount':len(src.get('files',[])),'key':source_key,
              'metadataBytes':srcf.get('size'),'metadataChecksum':live_checksum,
              'downloadedBytes':len(source_body),'downloadedMd5':source_body_md5,
              'desiredBytes':len(desired),'desiredMd5':desired_md5,
              'metadataMatchesDesired':metadata_matches,
              'downloadedBytesMatchDesired':bytes_match,
              'metadataMatchesDownloadedBytes':metadata_matches_download,
              'matchesDesiredArchive': metadata_matches and bytes_match and metadata_matches_download,
            },
            'websiteSourceCommit':source_commit
          }
          print('AUDIT_JSON='+json.dumps(out,ensure_ascii=False,sort_keys=True))
          PY

name: Retire duplicate clinical preflight
on:
  push:
    branches:
      - codex/clinical-service-focus-r6-2026-11-19
permissions:
  actions: write
jobs:
  remove-duplicate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      BUILD_SHA: af94ccd3faeeea5445fc1fefc2cae8e2e66d5689
    steps:
      - name: Preserve the successful preflight and its queued draft stage
        run: |
          set -euo pipefail
          api="repos/$GITHUB_REPOSITORY/actions/runs"
          gh api "$api/44421576672" | jq -e --arg sha "$BUILD_SHA" \
            '.head_sha == $sha and .workflow_id == 389432488 and .conclusion == "success"'
          gh api "$api/44421576672/artifacts" | jq -e \
            '.artifacts | map(select(.name == "frozen-coordinated-candidate" and (.expired | not))) | length == 1'
          gh api "$api/44422612280" | jq -e --arg sha "$BUILD_SHA" \
            '.head_sha == $sha and .workflow_id == 389432488 and .status != "completed"'
          cancel_if_running() {
            local run="$1" sha="$2" workflow="$3"
            local data status
            data=$(gh api "$api/$run")
            jq -e --arg sha "$sha" --argjson workflow "$workflow" \
              '.head_sha == $sha and .workflow_id == $workflow' <<< "$data"
            status=$(jq -r '.status' <<< "$data")
            if [[ "$status" != completed ]]; then
              gh api --method POST "$api/$run/cancel"
            fi
          }
          cancel_if_running 44421599260 e0a481c4b6cb6e2e4cc571a38f79491df9c151cc 423219272
          cancel_if_running 44421635037 "$BUILD_SHA" 389432488

name: Final Cloudflare zone audit after Pages deployment

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]

permissions:
  contents: read

jobs:
  audit:
    if: github.event.pull_request.head.ref == 'cloudflare-zone-final-audit-20260809'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 884d1d90bd1fb6ecca14992c6c60d677
      ZONE_NAME: ghezelbaash.ir
      PROJECT: doctor-ghezelbaash
    steps:
      - name: Audit zone with temporary zone-admin token and inspect live headers
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import datetime as dt, json, os, urllib.error, urllib.parse, urllib.request
          A=os.environ['CLOUDFLARE_ACCOUNT_ID']; M=os.environ['CLOUDFLARE_API_TOKEN']; ZN=os.environ['ZONE_NAME']; B='https://api.cloudflare.com/client/v4'
          def call(tok,m,p,b=None):
            h={'Authorization':f'Bearer {tok}','Accept':'application/json','Content-Type':'application/json','User-Agent':'ghezelbaash-final-zone-audit/1.0'}
            req=urllib.request.Request(B+p,data=None if b is None else json.dumps(b,separators=(',',':')).encode(),method=m,headers=h)
            try:
              with urllib.request.urlopen(req,timeout=45) as r:
                raw=r.read().decode('utf-8','replace'); return r.status,json.loads(raw) if raw else {}
            except urllib.error.HTTPError as e:
              raw=e.read().decode('utf-8','replace')
              try:x=json.loads(raw) if raw else {}
              except Exception:x={'raw':raw[:1200]}
              return e.code,x
          q=urllib.parse.urlencode({'name':ZN,'account.id':A,'per_page':50}); s,z=call(M,'GET','/zones?'+q)
          if s!=200 or z.get('success') is not True or not z.get('result'): raise SystemExit(f'zone lookup failed {s} {z}')
          zone=z['result'][0]; Z=zone['id']
          s,pg=call(M,'GET',f'/accounts/{A}/tokens/permission_groups?scope=com.cloudflare.api.account.zone')
          groups=[{'id':g['id']} for g in (pg.get('result') or []) if 'com.cloudflare.api.account.zone' in (g.get('scopes') or [])]
          exp=(dt.datetime.now(dt.timezone.utc)+dt.timedelta(hours=1)).replace(microsecond=0).isoformat().replace('+00:00','Z')
          s,t=call(M,'POST',f'/accounts/{A}/tokens',{'name':'Temporary Ghezelbaash Final Zone Audit','expires_on':exp,'policies':[{'effect':'allow','resources':{f'com.cloudflare.api.account.zone.{Z}':'*'},'permission_groups':groups}]})
          if s not in (200,201) or t.get('success') is not True: raise SystemExit(f'temp token create failed {s} {t}')
          R=t.get('result') or {}; T=R.get('value'); TID=R.get('id')
          try:
            report={'zone':{'status':zone.get('status'),'paused':zone.get('paused'),'plan':(zone.get('plan') or {}).get('name')},'settings':{},'dnssec':{},'bot':{},'universal_ssl':{},'dns':[],'rulesets':[]}
            ids=['ssl','always_use_https','tls_1_3','min_tls_version','http2','http3','brotli','early_hints','automatic_https_rewrites','ipv6','opportunistic_encryption','0rtt','rocket_loader','browser_check','cache_level','browser_cache_ttl','development_mode','always_online','websockets','minify','security_header','security_level','email_obfuscation','server_side_exclude','hotlink_protection','fonts','speed_brain']
            for sid in ids:
              x,p=call(T,'GET',f'/zones/{Z}/settings/{sid}')
              report['settings'][sid]=(p.get('result') or {}).get('value') if x==200 and p.get('success') is True else {'http':x,'errors':p.get('errors')}
            x,p=call(T,'GET',f'/zones/{Z}/ssl/universal/settings'); report['universal_ssl']=p.get('result') or {'http':x,'errors':p.get('errors')}
            x,p=call(T,'GET',f'/zones/{Z}/dnssec'); report['dnssec']=p.get('result') or {'http':x,'errors':p.get('errors')}
            x,p=call(T,'GET',f'/zones/{Z}/bot_management'); report['bot']=p.get('result') or {'http':x,'errors':p.get('errors')}
            x,p=call(T,'GET',f'/zones/{Z}/dns_records?per_page=100')
            if x==200 and p.get('success') is True:
              for r in p.get('result') or []:
                if r.get('name') in [ZN,f'www.{ZN}',f'github.{ZN}',f'blog.{ZN}',f'doctor.{ZN}',f'ig.{ZN}']:
                  report['dns'].append({k:r.get(k) for k in ('type','name','content','proxied','ttl','priority')})
            x,p=call(T,'GET',f'/zones/{Z}/rulesets')
            if x==200 and p.get('success') is True:
              for rs in p.get('result') or []:
                if rs.get('kind')=='zone':
                  y,d=call(T,'GET',f'/zones/{Z}/rulesets/{rs.get("id")}')
                  if y==200 and d.get('success') is True:
                    report['rulesets'].append({'phase':rs.get('phase'),'name':rs.get('name'),'rules':[{'description':r.get('description'),'action':r.get('action'),'expression':r.get('expression'),'enabled':r.get('enabled'),'action_parameters':r.get('action_parameters')} for r in ((d.get('result') or {}).get('rules') or [])]})
            print('ZONE_FINAL_AUDIT',json.dumps(report,ensure_ascii=False,indent=2,sort_keys=True))
          finally:
            s,p=call(M,'DELETE',f'/accounts/{A}/tokens/{TID}'); print('TEMP_TOKEN_REVOKE',s,p.get('success'))
          PY
          echo '--- CANONICAL ROOT HEADERS ---'
          curl -sS -D - -o /dev/null -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' 'https://www.ghezelbaash.ir/?audit=20260809' | tr -d '\r'
          echo '--- PAGES.DEV REDIRECT HEADERS ---'
          curl -sS -D - -o /dev/null --max-redirs 0 'https://doctor-ghezelbaash.pages.dev/audit-canonical?x=1' | tr -d '\r' || true
          echo '--- APEX REDIRECT HEADERS ---'
          curl -sS -D - -o /dev/null --max-redirs 0 'https://ghezelbaash.ir/audit-canonical?x=1' | tr -d '\r' || true

name: Repair v1.2.2 final convergence

on:
  push:
    branches: [main]
    paths: [.release/v122-repair-trigger.json]

permissions:
  contents: write

concurrency:
  group: doctor-ghezelbaash-external-mutation
  cancel-in-progress: false

env:
  CANDIDATE_BRANCH: release/v1.2.2-candidate
  CONTROL_BRANCH: release-control/v1.2.2

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Patch candidate source and permanent validators
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$CANDIDATE_BRANCH"
          rm -rf /tmp/v122-candidate
          git worktree add --detach /tmp/v122-candidate "origin/$CANDIDATE_BRANCH"
          git -C /tmp/v122-candidate config user.name ghezelbaash-v122-repair
          git -C /tmp/v122-candidate config user.email actions@users.noreply.github.com
          cd /tmp/v122-candidate
          python - <<'PY'
          from pathlib import Path
          p=Path('src/content-source/100-rc099.html'); s=p.read_text()
          bad='href="https://doi.org/10.5281/zenodo.21910785">https://doi.org/10.5281/zenodo.21930954</a>'
          good='href="https://doi.org/10.5281/zenodo.21930954">https://doi.org/10.5281/zenodo.21930954</a>'
          if bad in s: s=s.replace(bad,good,1)
          if bad in s: raise SystemExit('stale visible DOI href remains')
          p.write_text(s)
          p=Path('scripts/update-release-control.mjs'); s=p.read_text()
          s=s.replace("const rank={PREFLIGHT_STARTED:10,","const rank={SOURCE_PROMOTED:5,PREFLIGHT_STARTED:10,")
          marker="const now=new Date().toISOString();"
          inject="const now=new Date().toISOString();\nif(stage==='PREFLIGHT_STARTED'){\n  const sourceRelease=JSON.parse(await readFile('src/data/release.json','utf8'));\n  if(patch.targetVersion&&patch.targetVersion!==sourceRelease.release)throw new Error(`PREFLIGHT targetVersion/source drift ${patch.targetVersion} != ${sourceRelease.release}`);\n  patch.releaseDate=sourceRelease.dateModified;\n}\n"
          if 'PREFLIGHT targetVersion/source drift' not in s:
              if marker not in s: raise SystemExit('release-control insertion marker missing')
              s=s.replace(marker,inject,1)
          p.write_text(s)
          p=Path('scripts/verify-release-proof-ledger.mjs'); s=p.read_text()
          old="if(String(x.recordId||'')!=='21930954'||x.versionDoi!=='10.5281/zenodo.21930954')throw new Error('Ledger Zenodo identity drift');"
          new="if(String(x.recordId||'')!==String(release.dataset?.zenodo?.recordId||'')||x.versionDoi!==release.dataset?.zenodo?.versionDoi||x.releaseDate!==release.dateModified)throw new Error('Ledger/source release identity drift');"
          if old not in s and new not in s: raise SystemExit('proof-ledger identity marker missing')
          s=s.replace(old,new)
          p.write_text(s)
          p=Path('scripts/validate-v122-contract.mjs'); s=p.read_text()
          marker="if(!content.includes('Google Maps')||!content.includes('google-maps-clinic-reputation-current'))fail('Visible reputation slot missing');"
          insert="if(!content.includes('Google Maps')||!content.includes('google-maps-clinic-reputation-current'))fail('Visible reputation slot missing');const archivedCitation=content.match(/Archived DOI release citation:<\\/strong>[\\s\\S]{0,1400}?href=\\\"https:\\/\\/doi\\.org\\/([^\\\"]+)\\\">https:\\/\\/doi\\.org\\/([^<]+)<\\/a>/);if(!archivedCitation||archivedCitation[1]!==Z.versionDoi||archivedCitation[2]!==Z.versionDoi)fail(`Visible archived DOI citation drift href=${archivedCitation?.[1]||'missing'} text=${archivedCitation?.[2]||'missing'} expected=${Z.versionDoi}`);"
          if 'Visible archived DOI citation drift' not in s:
              if marker not in s: raise SystemExit('validator visible reputation marker missing')
              s=s.replace(marker,insert,1)
          p.write_text(s)
          PY
          git diff --check
          git add src/content-source/100-rc099.html scripts/update-release-control.mjs scripts/verify-release-proof-ledger.mjs scripts/validate-v122-contract.mjs
          git diff --cached --quiet || git commit -m 'Repair final v1.2.2 convergence invariants'
          C=$(git rev-parse HEAD)
          git push origin "HEAD:$CANDIDATE_BRANCH"
          echo "CANDIDATE_SHA=$C" >> "$GITHUB_ENV"
          echo "CANDIDATE_REPAIR_COMMIT=$C"

      - name: Atomically rebind release-control to repaired candidate epoch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$CONTROL_BRANCH" "$CANDIDATE_BRANCH"
          rm -rf /tmp/v122-control
          git worktree add --detach /tmp/v122-control "origin/$CONTROL_BRANCH"
          git -C /tmp/v122-control config user.name ghezelbaash-v122-release-control
          git -C /tmp/v122-control config user.email actions@users.noreply.github.com
          C=$(git rev-parse "origin/$CANDIDATE_BRANCH")
          test "$C" = "$CANDIDATE_SHA"
          git show "$C:src/data/release.json" >/tmp/candidate-release.json
          cd /tmp/v122-control
          mkdir -p .release/history/v1.2.1 .release/control
          for f in release-attestation.json release-request.json zenodo-published.json; do
            if [ -f ".release/$f" ]; then
              if [ -f ".release/history/v1.2.1/$f" ]; then cmp ".release/$f" ".release/history/v1.2.1/$f"; rm ".release/$f"; else mv ".release/$f" ".release/history/v1.2.1/$f"; fi
            fi
            test -f ".release/history/v1.2.1/$f"
          done
          export C
          node - <<'NODE'
          const fs=require('fs'),p='.release/control/v1.2.2.json',x=JSON.parse(fs.readFileSync(p)),r=JSON.parse(fs.readFileSync('/tmp/candidate-release.json')),now=new Date().toISOString(),C=process.env.C,z=r.dataset.zenodo;
          if(x.targetVersion!=='1.2.2'||x.versionDoi!==z.versionDoi||String(x.recordId)!==String(z.recordId)||x.conceptDoi!==z.conceptDoi)throw Error('Control ledger reserved identity drift');
          const previousSource=x.sourceCommit||null;
          Object.assign(x,{releaseDate:r.dateModified,candidateBranch:'release/v1.2.2-candidate',candidateHead:C,sourceCommit:C,preparedCandidate:C,proofs:{},stage:'SOURCE_PROMOTED',highestStage:'SOURCE_PROMOTED',lastEvent:'SOURCE_PROMOTED',updatedAt:now});
          delete x.candidateEpoch;
          x.history=[...(x.history||[]),{stage:'SOURCE_PROMOTED',at:now,sourceCommit:C,previousSourceCommit:previousSource,releaseDate:r.dateModified,recordId:String(z.recordId),versionDoi:z.versionDoi,reason:'repaired final convergence; proof epoch reset before fresh Candidate freeze'}];
          fs.writeFileSync(p,JSON.stringify(x,null,2)+'\n');
          console.log(JSON.stringify({ledgerRebind:'PASS',stage:x.stage,sourceCommit:C,releaseDate:x.releaseDate,versionDoi:x.versionDoi,recordId:String(x.recordId),proofs:Object.keys(x.proofs).length}));
          NODE
          git diff --check
          git add -A .release/control/v1.2.2.json .release/history/v1.2.1 .release/release-attestation.json .release/release-request.json .release/zenodo-published.json
          git diff --cached --quiet || git commit -m 'Atomically rebind v1.2.2 control to repaired Candidate epoch'
          git push origin "HEAD:$CONTROL_BRANCH"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Validate repaired candidate before release trigger
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/v122-candidate
          npm ci --ignore-scripts
          node scripts/validate-v122-contract.mjs
          npm run release:prepare
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)" CF_PAGES_COMMIT_SHA="$(git rev-parse HEAD)" SOURCE_COMMIT="$(git rev-parse HEAD)"
          npm run build
          node scripts/validate-visible-freeze.mjs dist/index.html
          grep -Fq 'href="https://doi.org/10.5281/zenodo.21930954">https://doi.org/10.5281/zenodo.21930954</a>' dist/index.html
          test "$(node -p "require('./src/data/release.json').dateModified")" = '2026-08-15'
          test "$(node -p "require('./src/data/release.json').dataset.zenodo.versionDoi")" = '10.5281/zenodo.21930954'
          echo "V122_REPAIR_VALIDATION_PASS candidate=$(git rev-parse HEAD)"

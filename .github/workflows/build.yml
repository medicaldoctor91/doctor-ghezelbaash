name: V2 dist contract

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dist:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref }}

      - name: Apply guarded compiler metadata fix once
        if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'work/max-signal-dist-2026'
        run: |
          node infrastructure/patch-page-purpose-once.mjs
          if ! git diff --quiet -- src/pages/index.astro; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/pages/index.astro
            git commit -m "fix: preserve reviewed page purpose on compiled records"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build, finalize, seal and verify V2 dist
        run: npm run release:v2

      - name: Retain distribution and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-dist-${{ github.sha }}
          path: |
            dist/
            release/verification-report.json
            release/verification-report-fa.md
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

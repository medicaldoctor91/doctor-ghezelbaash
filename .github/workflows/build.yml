name: V2 dist contract

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      preview:
        description: Upload sealed experimental dist to a nonproduction Cloudflare Pages preview
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  dist:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install pinned browser for reader verification
        run: npx playwright-core install --with-deps chromium

      - name: Build, finalize, seal and verify V2 dist
        run: npm run release:v2

      - name: Verify preview deployment safety guards
        run: node --test infrastructure/test-cloudflare-preview.mjs

      - name: Upload exact sealed experimental dist to Cloudflare preview
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.preview && github.ref == 'refs/heads/experiment/source-preview' && github.repository == 'medicaldoctor91/doctor-ghezelbaash' }}
        env:
          PREVIEW_REQUESTED: 'true'
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node infrastructure/deploy-cloudflare-preview.mjs

      - name: Retain distribution and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-dist-${{ github.sha }}
          path: |
            dist/
            release/verification-report.json
            release/verification-report-fa.md
            release/cloudflare-preview-proof.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

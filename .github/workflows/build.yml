name: V2 dist contract

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v2-dist-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dist:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install pinned browser for reader verification
        run: npx playwright-core install --with-deps chromium

      - name: Build, finalize, seal and verify V2 dist
        run: npm run release:v2

      - name: Verify production delivery guards
        run: node infrastructure/test-pages-delivery.mjs

      - name: Publish the verified distribution to Cloudflare Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 884d1d90bd1fb6ecca14992c6c60d677
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node infrastructure/configure-pages-ci.mjs
          npx --yes wrangler@4.149.0 pages deploy dist --project-name=doctor-ghezelbaash --branch=main --commit-hash="$GITHUB_SHA" --commit-dirty=false

      - name: Retain distribution and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-dist-${{ github.sha }}
          path: |
            dist/
            release/verification-report.json
            release/verification-report-fa.md
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

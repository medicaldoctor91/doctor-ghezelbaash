name: Build contract

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test browser discovery and history restoration
        run: node --test scripts/tests/*.test.mjs

      # Canonical-normalization branches must prove that moving decisions into
      # authored inputs preserves every output byte, with one shared CI identity.
      - name: Checkout the distribution baseline
        if: startsWith(github.head_ref, 'codex/normalize-canonical-')
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .baseline
          persist-credentials: false

      - name: Build the distribution baseline
        if: startsWith(github.head_ref, 'codex/normalize-canonical-')
        working-directory: .baseline
        run: |
          npm ci
          npm run build

      - name: Build distribution
        run: npm run build

      - name: Compare every distribution file with the baseline
        if: startsWith(github.head_ref, 'codex/normalize-canonical-')
        run: node scripts/compare-dist.mjs .baseline/dist dist

      - name: Verify deployment fingerprint artifact
        run: |
          test -f dist/build-info.json
          node -e 'const fs=require("fs"); const x=JSON.parse(fs.readFileSync("dist/build-info.json","utf8")); if (!x.release || !x.commit || !x.branch || !x.provider) process.exit(1); console.log(x)'

      - name: Retain the validated distribution and its hashes
        uses: actions/upload-artifact@v4
        with:
          name: validated-dist-${{ github.sha }}
          path: |
            dist/
            .generated/dist-manifest.json
            .generated/dist-equivalence.json
            .generated/schema-inventory.json
            .generated/schema-inventory.csv
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

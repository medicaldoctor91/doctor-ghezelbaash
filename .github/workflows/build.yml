name: Baseline snapshot

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pin exact baseline commit
        run: git checkout 5280827462a666704836e470566dd7fbc5043839

      - name: Archive exact source
        run: git archive --format=zip --output=/tmp/ghezelbaash-source-5280827462a666704836e470566dd7fbc5043839.zip 5280827462a666704836e470566dd7fbc5043839

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build exact baseline distribution with live identity
        run: CF_PAGES=1 CF_PAGES_COMMIT_SHA=5280827462a666704836e470566dd7fbc5043839 CF_PAGES_BRANCH=main npm run build

      - name: Verify baseline fingerprint
        run: |
          test -f dist/build-info.json
          node -e 'const fs=require("fs"); const x=JSON.parse(fs.readFileSync("dist/build-info.json","utf8")); if (x.commit !== "5280827462a666704836e470566dd7fbc5043839" || x.branch !== "main" || x.provider !== "cloudflare-pages") { console.error(x); process.exit(1); } console.log(x)'

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: ghezelbaash-source-5280827462a666704836e470566dd7fbc5043839
          path: /tmp/ghezelbaash-source-5280827462a666704836e470566dd7fbc5043839.zip
          if-no-files-found: error
          retention-days: 90

      - name: Upload dist snapshot
        uses: actions/upload-artifact@v4
        with:
          name: ghezelbaash-dist-5280827462a666704836e470566dd7fbc5043839
          path: dist/
          if-no-files-found: error
          retention-days: 90

name: V2 dist contract

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dist:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build, finalize, seal and verify V2 dist
        run: npm run release:v2

      - name: Retain distribution and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-dist-${{ github.sha }}
          path: |
            dist/
            release/verification-report.json
            release/verification-report-fa.md
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

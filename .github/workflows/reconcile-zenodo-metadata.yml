name: Reconcile Zenodo distribution metadata

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/reconcile-zenodo-metadata.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: doctor-ghezelbaash-zenodo-metadata
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout trusted main source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Reconcile published secondary-distribution metadata
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN || secrets.ZENODO_ACCESS_TOKEN || secrets.ZENODO_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ZENODO_TOKEN:-}"
          echo "::add-mask::$ZENODO_TOKEN"
          python scripts/zenodo_release.py reconcile --record 21892769 --doi 10.5281/zenodo.21892769 --concept-doi 10.5281/zenodo.18765168 --version 1.1.1 --date 2026-08-11
          python scripts/zenodo_release.py reconcile --record 21905312 --doi 10.5281/zenodo.21905312 --concept-doi 10.5281/zenodo.18765168 --version 1.2.0 --date 2026-08-12

name: Publish frozen verified mutable 1.3.6 cohort, preserve immutable Zenodo DOI
on:
  push:
    branches: [codex/136-frozen-cohort-publication-20261121]
permissions:
  contents: read
  actions: read
concurrency:
  group: doctor-ghezelbaash-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ARCHIVE_SOURCE_COMMIT: eafb138d596a91504ed0af66e2557f52848e36b6
      HF_TOKEN: ${{ secrets.HF_TOKEN || secrets.HUGGINGFACE_TOKEN || secrets.HUGGING_FACE_TOKEN }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN || secrets.KAGGLE_TOKEN }}
      ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN || secrets.ZENODO_ACCESS_TOKEN || secrets.ZENODO_API_TOKEN || secrets.ZENODO_API_KEY || secrets.ZENODO_PAT }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 884d1d90bd1fb6ecca14992c6c60d677
      GIT_LFS_SKIP_SMUDGE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install immutable release validation and publication tools
        run: python -m pip install requests 'pyarrow==22.0.0' 'kaggle==2.2.4' 'huggingface_hub>=0.34,<1' 'rdflib>=7,<8' 'pyshacl>=0.30,<1' 'mlcroissant==1.1.1' 'PyLD==3.3.0' PyYAML
      - name: Verify publication logic and immutable archive contracts
        run: |
          python tests/mutable-platform-release.test.py
          python tests/site-delivery-convergence.test.py
          python tests/kaggle-baseline.test.py
          python tests/immutable-archive.test.py
          python tests/coordinated-doi-release.test.py
          python tests/platform-publication.test.py
      - name: Restore exact successfully frozen cohort (never rebuild)
        uses: actions/download-artifact@v4
        with:
          name: frozen-mutable-candidate
          run-id: 44889318984
          github-token: ${{ github.token }}
          path: /tmp/mutable-artifact
      - name: Verify frozen version, source, candidate SHA contract and archive boundary
        run: |
          tar -xzf /tmp/mutable-artifact/candidate.tar.gz -C /tmp
          python - <<'PY'
          import json,subprocess,os
          from pathlib import Path
          w=Path('/tmp/mutable-release')
          assert w.is_dir()
          plan=json.loads((w/'release-plan.json').read_text())
          assert plan['candidateSchema']=='mutable-distributions-4'
          assert plan['sourceCommit']=='29e6c519e55252c70f8b22c0ada2061f1dd332fe'
          assert plan['hfParent']=='4b0e805db359fe05e6c02214ae9a393f93599c4f'
          assert plan['hfRevision']=='ff4183c3e68bc383b8a47cf356dbebc1d716c823'
          assert plan['kagglePreviousVersion']==39 and plan['kaggleVersion']==40
          assert plan['notebookPreviousVersion']==20 and plan['notebookVersion']==21
          assert plan['sitePreviousSource']=='d92e60701a5804fff49a47d504621cf2228e7eb7'
          assert plan['archiveWrites'] is False and plan['archiveSourceCommit']=='eafb138d596a91504ed0af66e2557f52848e36b6'
          report=json.loads((w/'preflight-report.json').read_text())
          assert report['status']=='PASS'
          archive=json.loads((w/'archive-baseline.json').read_text())
          assert archive['doi']=='10.5281/zenodo.24354791'
          proj=json.loads((w/'frozen-home-projection.json').read_text())
          assert proj['status']=='PASS' and proj['canonicalGraphStorage']=='application/ld+json#canonical-entity-graph'
          assert proj['canonicalGraphEndByte']+16_000<2_000_000
          subprocess.run(['git','merge-base','--is-ancestor',plan['sourceCommit'],os.environ['GITHUB_SHA']],check=True)
          subprocess.run(['git','diff','--quiet',plan['sourceCommit'],os.environ['GITHUB_SHA'],'--',
                           'src','public','build','package.json','package-lock.json','astro.config.mjs'],check=True)
          print('ATTESTED 1.3.6 COHORT: exact frozen bytes, active homepage JSON-LD, Zenodo immutable',flush=True)
          PY
      - name: Publish and independently verify mutable website / HF / Kaggle / notebook
        run: python .github/scripts/mutable_platform_release.py publish
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-136-frozen-cohort-publication-evidence
          path: |
            /tmp/mutable-release/*.json
            /tmp/mutable-release/*.log
            /tmp/mutable-release/viewer-response-evidence/
          if-no-files-found: warn
          retention-days: 30

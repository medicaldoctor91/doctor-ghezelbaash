name: Restore English spoken language on Wikidata

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wikidata-restore-english-language.yml'

permissions:
  contents: read

jobs:
  restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      WIKIMEDIA_USERNAME: ${{ secrets.WIKIVERSITY_USERNAME }}
      WIKIMEDIA_BOT_PASSWORD: ${{ secrets.WIKIVERSITY_BOT_PASSWORD }}
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check --no-input requests==2.32.5
      - name: Restore sourced English P1412 while preserving Persian
        shell: python
        run: |
          import json, os, requests, time
          WD='https://www.wikidata.org/w/api.php'
          PERSON='Q140287622'; PERSIAN='Q9168'; ENGLISH='Q1860'; SNAPREV=2531797921
          UA='Medicaldoctor91EnglishLanguageRestore/1.0 (https://www.ghezelbaash.ir/)'
          anon=requests.Session(); anon.headers['User-Agent']=UA
          auth=requests.Session(); auth.headers['User-Agent']=UA

          def get(sess,p):
              r=sess.get(WD,params={**p,'format':'json','formatversion':2},timeout=90); r.raise_for_status(); d=r.json()
              if 'error' in d: raise RuntimeError(d['error'])
              return d
          def post(p):
              waits=[10,20,30,45,60,90]
              last=None
              for w in waits:
                  r=auth.post(WD,data={**p,'format':'json','formatversion':2,'maxlag':5},timeout=120); r.raise_for_status(); d=r.json()
                  if 'error' not in d: return d
                  last=d['error']
                  if last.get('code') in {'maxlag','ratelimited','actionthrottled','failed-save'}:
                      time.sleep(w); continue
                  raise RuntimeError(last)
              raise RuntimeError({'write_retry_exhausted':last})
          def ent(sess):
              return get(sess,{'action':'wbgetentities','ids':PERSON,'props':'claims|info'})['entities'][PERSON]
          def qid(c):
              v=c.get('mainsnak',{}).get('datavalue',{}).get('value')
              return v.get('id') if isinstance(v,dict) else None
          def item_value(q):
              return json.dumps({'entity-type':'item','numeric-id':int(q[1:])},separators=(',',':'))

          # Read the exact pre-removal revision and recover the old English references.
          d=get(anon,{'action':'query','revids':str(SNAPREV),'prop':'revisions','rvprop':'content','rvslots':'main'})
          rev=d['query']['pages'][0]['revisions'][0]
          slot=rev['slots']['main']; historical=json.loads(slot.get('content') or slot.get('*'))
          hist_en=[c for c in historical.get('claims',{}).get('P1412',[]) if qid(c)==ENGLISH]
          hist_fa=[c for c in historical.get('claims',{}).get('P1412',[]) if qid(c)==PERSIAN]
          if len(hist_en)!=1 or not hist_en[0].get('references') or len(hist_fa)!=1:
              raise RuntimeError({'historical_language_gate_failed':{'en':len(hist_en),'fa':len(hist_fa)}})

          before=ent(anon)
          cur=before.get('claims',{}).get('P1412',[])
          cur_fa=[c for c in cur if qid(c)==PERSIAN]; cur_en=[c for c in cur if qid(c)==ENGLISH]
          if len(cur_fa)!=1:
              raise RuntimeError({'current_persian_count':len(cur_fa)})
          if len(cur_en)>1:
              raise RuntimeError({'current_english_count':len(cur_en)})

          lt=get(auth,{'action':'query','meta':'tokens','type':'login'})['query']['tokens']['logintoken']
          login=post({'action':'login','lgname':os.environ['WIKIMEDIA_USERNAME'],'lgpassword':os.environ['WIKIMEDIA_BOT_PASSWORD'],'lgtoken':lt})
          if login.get('login',{}).get('result')!='Success': raise RuntimeError(login)
          csrf=get(auth,{'action':'query','meta':'tokens','type':'csrf'})['query']['tokens']['csrftoken']

          created=False
          if not cur_en:
              fresh=ent(auth)
              out=post({'action':'wbcreateclaim','entity':PERSON,'property':'P1412','snaktype':'value','value':item_value(ENGLISH),'token':csrf,'baserevid':fresh.get('lastrevid'),'summary':'Restore English as a spoken language alongside Persian'})
              cid=out['claim']['id']; created=True
              # Restore every reference that existed on the historical English statement.
              for ref in hist_en[0].get('references',[]):
                  snaks=ref.get('snaks',{}); order=ref.get('snaks-order') or list(snaks)
                  if snaks:
                      post({'action':'wbsetreference','statement':cid,'snaks':json.dumps(snaks,ensure_ascii=False,separators=(',',':')),'snaks-order':json.dumps(order,separators=(',',':')),'token':csrf,'summary':'Restore original source for English spoken language'})

          final=ent(anon)
          langs=final.get('claims',{}).get('P1412',[])
          fa=[c for c in langs if qid(c)==PERSIAN]; en=[c for c in langs if qid(c)==ENGLISH]
          others=[qid(c) for c in langs if qid(c) not in {PERSIAN,ENGLISH}]
          if len(fa)!=1 or len(en)!=1 or others or not fa[0].get('references') or not en[0].get('references'):
              raise RuntimeError({'final_language_verification_failed':{'fa':len(fa),'en':len(en),'others':others,'fa_refs':len(fa[0].get('references',[])) if fa else 0,'en_refs':len(en[0].get('references',[])) if en else 0}})
          print(json.dumps({'ok':True,'created_english':created,'P1412':['Q9168','Q1860'],'persian_refs':len(fa[0].get('references',[])),'english_refs':len(en[0].get('references',[])),'lastrevid':final.get('lastrevid')},ensure_ascii=False,indent=2))

            test "$ACTUAL" = "$EXPECTED"
            CANDIDATE_NEEDS_COMMIT=true
            CANDIDATE_BRANCH_NEEDS_PUSH=true
          fi
          printf 'RELEASE_BRANCH=%s\nCANDIDATE_NEEDS_COMMIT=%s\nCANDIDATE_BRANCH_NEEDS_PUSH=%s\n' \

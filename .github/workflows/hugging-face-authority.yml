            REMOTE_TAG_SHA="$(git ls-remote origin "refs/tags/v$RELEASE_TARGET" | awk '{print $1}')"
          fi
          test "$REMOTE_TAG_SHA" = "$CANDIDATE_SHA"
      - name: Create or verify exact GitHub Release
        if: steps.release.outputs.mode == 'new' || env.FROZEN_SOURCE_AT_HEAD == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN:-}"; echo "::add-mask::$GH_TOKEN"
          if [ "$RELEASE_MODE" = new ]; then
            VERSION="$RELEASE_TARGET"
            VERSION_DOI="$ZENODO_DOI"
            RELEASE_SHA="$CANDIDATE_SHA"
          else
            VERSION="$CURRENT_VERSION"
            VERSION_DOI="$CURRENT_DOI"
            RELEASE_SHA="$CANONICAL_MAIN_SHA"
          fi
          TAG="v$VERSION"
          TMP="$(mktemp -d)"
          trap 'rm -rf "$TMP"' EXIT

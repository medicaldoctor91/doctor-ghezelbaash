      - name: Promote exact candidate to canonical GitHub main production and tag
        if: steps.release.outputs.mode == 'new'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GITHUB_TOKEN:-}"; echo "::add-mask::$GITHUB_TOKEN"

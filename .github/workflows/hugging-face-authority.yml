          printf 'HF_CANDIDATE_SHA=%s\nHF_STAGE_BASE_MAIN_SHA=%s\nHF_ROLLBACK_BASE_SHA=%s\nHF_CANARY_ALREADY_MAIN=%s\nHF_BRANCH_REQUIRED=%s\n' \
            "$HF_CANDIDATE_SHA" "$HF_STAGE_BASE_MAIN_SHA" "$HF_ROLLBACK_BASE_SHA" "$HF_CANARY_ALREADY_MAIN" "$HF_BRANCH_REQUIRED" >> "$GITHUB_ENV"
      - name: Stage immutable Zenodo candidate
        if: steps.release.outputs.mode == 'new'
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN || secrets.ZENODO_ACCESS_TOKEN || secrets.ZENODO_API_TOKEN || secrets.ZENODO_API_KEY || secrets.ZENODO_PAT }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ZENODO_TOKEN:-}"; echo "::add-mask::$ZENODO_TOKEN"
          export SOURCE_COMMIT="$CANDIDATE_SHA"
          python scripts/zenodo_release.py stage --version "$RELEASE_TARGET"
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          const state = JSON.parse(await readFile('.release/runtime/zenodo-stage.json', 'utf8'));

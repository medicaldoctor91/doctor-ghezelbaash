            cmp "$ASSET" "$TMP/final-download/$NAME"
          done
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json "$JSON_FIELDS" > "$STATE"
          node - "$STATE" "$TAG" "$TITLE" "$BODY" \
            "$(basename "$ATTESTATION")" "$(basename "$MANIFEST")" <<'NODE'
          const fs = require("node:fs");
          const [file, tag, title, body, attestation, manifest] = process.argv.slice(2);
          const release = JSON.parse(fs.readFileSync(file, "utf8"));
          const expected = [attestation, manifest].sort();
          const actual = (release.assets || []).map(({ name }) => name).sort();
          if (release.tagName !== tag || release.name !== title || release.body !== body ||
              release.isDraft !== false || release.isPrerelease !== false ||
              release.isImmutable !== true ||
              new Set(actual).size !== actual.length || JSON.stringify(actual) !== JSON.stringify(expected))
            throw new Error("Published GitHub Release postcondition drift");
          NODE
          REMOTE_TAG_SHA="$(git ls-remote origin "refs/tags/$TAG^{}" | awk '{print $1}')"
          if [ -z "$REMOTE_TAG_SHA" ]; then
            REMOTE_TAG_SHA="$(git ls-remote origin "refs/tags/$TAG" | awk '{print $1}')"
          fi
          test "$REMOTE_TAG_SHA" = "$RELEASE_SHA"
      - name: Freeze verified Hugging Face canary as the release tag
        if: steps.release.outputs.mode == 'new'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN || secrets.HUGGINGFACE_TOKEN || secrets.HUGGING_FACE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${HF_TOKEN:-}"; echo "::add-mask::$HF_TOKEN"
          test "$(git -C .release/huggingface rev-parse HEAD)" = "$HF_CANDIDATE_SHA"
          test "$(git -C .release/huggingface ls-remote origin refs/heads/main | awk '{print $1}')" = "$HF_CANDIDATE_SHA"
          if git -C .release/huggingface ls-remote --exit-code --tags origin "refs/tags/v$RELEASE_TARGET" >/dev/null 2>&1; then
            test "$(git -C .release/huggingface ls-remote origin "refs/tags/v$RELEASE_TARGET^{}" | awk '{print $1}')" = "$HF_CANDIDATE_SHA" || \
              test "$(git -C .release/huggingface ls-remote origin "refs/tags/v$RELEASE_TARGET" | awk '{print $1}')" = "$HF_CANDIDATE_SHA"
          else
            git -C .release/huggingface tag -a "v$RELEASE_TARGET" -m "Dr. Saeed Ghezelbash Public Knowledge Graph v$RELEASE_TARGET"
            node scripts/huggingface.mjs push .release/huggingface "refs/tags/v$RELEASE_TARGET"
          fi
          test "$(git -C .release/huggingface ls-remote origin refs/heads/main | awk '{print $1}')" = "$HF_CANDIDATE_SHA"
          HF_TAG_SHA="$(git -C .release/huggingface ls-remote origin "refs/tags/v$RELEASE_TARGET^{}" | awk '{print $1}')"
          if [ -z "$HF_TAG_SHA" ]; then
            HF_TAG_SHA="$(git -C .release/huggingface ls-remote origin "refs/tags/v$RELEASE_TARGET" | awk '{print $1}')"
          fi
          test "$HF_TAG_SHA" = "$HF_CANDIDATE_SHA"
      - name: Converge canonical Cloudflare Pages deployment
        if: steps.release.outputs.mode == 'new'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"; echo "::add-mask::$CLOUDFLARE_API_TOKEN"
          export CF_PAGES_COMMIT_SHA="$CANDIDATE_SHA" CF_EXPECTED_COMMIT="$CANDIDATE_SHA"
          node scripts/cloudflare-pages.mjs ensure --configure
          node scripts/cloudflare-pages.mjs ensure
      - name: Reconcile released Cloudflare edge before checking public bytes
        if: steps.release.outputs.mode == 'new'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python scripts/configure-cloudflare-edge.py --apply --outcome .release/runtime/release-edge.json
      - name: Verify published Zenodo release truth
        if: steps.release.outputs.mode == 'new'
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN || secrets.ZENODO_ACCESS_TOKEN || secrets.ZENODO_API_TOKEN || secrets.ZENODO_API_KEY || secrets.ZENODO_PAT }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ZENODO_TOKEN:-}"; echo "::add-mask::$ZENODO_TOKEN"
          export SOURCE_COMMIT="$CANDIDATE_SHA"
          python scripts/zenodo_release.py verify-public \
            --record "$ZENODO_RECORD" --doi "$ZENODO_DOI" --version "$RELEASE_TARGET"
      - name: Verify core Hugging Face Dataset and website release truth
        if: steps.release.outputs.mode == 'new' || env.FROZEN_SOURCE_AT_HEAD == 'true'
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN || secrets.ZENODO_ACCESS_TOKEN || secrets.ZENODO_API_TOKEN || secrets.ZENODO_API_KEY || secrets.ZENODO_PAT }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/run-transient-command.mjs -- node scripts/huggingface.mjs verify
          if [ "$RELEASE_MODE" = new ]; then
            for attempt in $(seq 1 24); do
              if node scripts/verify-live.mjs current --website-only; then break; fi
              test "$attempt" -lt 24
              sleep 10
            done
          fi
          node scripts/verify-live.mjs release
      - name: Remove successful candidate branches
        if: (steps.release.outputs.mode == 'new' || (env.FROZEN_SOURCE_AT_HEAD == 'true' && env.RELEASE_RECOVERY == 'true')) && success()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HF_TOKEN: ${{ secrets.HF_TOKEN || secrets.HUGGINGFACE_TOKEN || secrets.HUGGING_FACE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GITHUB_TOKEN:-}"; echo "::add-mask::$GITHUB_TOKEN"
          test -n "${HF_TOKEN:-}"; echo "::add-mask::$HF_TOKEN"
          GITHUB_AUTH="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          if git ls-remote --exit-code --heads origin "refs/heads/release/v$RELEASE_TARGET" >/dev/null 2>&1; then
            if [ "$RELEASE_MODE" = new ]; then
              test "$(git ls-remote origin "refs/heads/release/v$RELEASE_TARGET" | awk '{print $1}')" = "$CANDIDATE_SHA"
              git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $GITHUB_AUTH" push \
                --force-with-lease="refs/heads/release/v$RELEASE_TARGET:$CANDIDATE_SHA" \
                origin ":refs/heads/release/v$RELEASE_TARGET"
            else
              git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $GITHUB_AUTH" push origin --delete "release/v$RELEASE_TARGET"
            fi
          fi
          if git -C .release/huggingface ls-remote --exit-code --heads origin "refs/heads/release/v$RELEASE_TARGET" >/dev/null 2>&1; then
            node scripts/huggingface.mjs push .release/huggingface --delete "release/v$RELEASE_TARGET"
          fi
          if [ "$RELEASE_MODE" = new ]; then
            PREP_REMOTE_SHA="$(git ls-remote --heads origin "refs/heads/$RELEASE_PREP_BRANCH" | awk '{print $1}')"
            if [ -n "$PREP_REMOTE_SHA" ]; then
              test "$PREP_REMOTE_SHA" = "$APPROVED_SOURCE_SHA"
              git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $GITHUB_AUTH" push \
                --force-with-lease="refs/heads/$RELEASE_PREP_BRANCH:$APPROVED_SOURCE_SHA" \
                origin ":refs/heads/$RELEASE_PREP_BRANCH"
            fi
          fi
          unset GITHUB_AUTH
          ! git ls-remote --exit-code --heads origin "refs/heads/release/v$RELEASE_TARGET" >/dev/null 2>&1
          ! git -C .release/huggingface ls-remote --exit-code --heads origin "refs/heads/release/v$RELEASE_TARGET" >/dev/null 2>&1
          if [ "$RELEASE_MODE" = new ]; then
            ! git ls-remote --exit-code --heads origin "refs/heads/$RELEASE_PREP_BRANCH" >/dev/null 2>&1
          fi
      - name: Forward-revert Hugging Face canary before the irreversible boundary
        if: ${{ always() && (failure() || cancelled()) && steps.release.outputs.mode == 'new' }}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN || secrets.HUGGINGFACE_TOKEN || secrets.HUGGING_FACE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f .release/runtime/hf-canary-promoted ] && [ ! -f .release/runtime/hf-canary-promotion-attempted ]; then
            echo "No Hugging Face main canary was promoted; rollback is unnecessary."
            exit 0
          fi
          if [ -f .release/runtime/irreversible-present ] || [ -f .release/runtime/zenodo-publish-attempted ]; then
            echo "Zenodo publication exists or was attempted; preserve all release state and roll forward."
            exit 0
          fi
          test -n "${HF_TOKEN:-}"; echo "::add-mask::$HF_TOKEN"
          HF_REMOTE_MAIN_SHA="$(git -C .release/huggingface ls-remote origin refs/heads/main | awk '{print $1}')"
          if [ "$HF_CANARY_ALREADY_MAIN" = false ] && [ "$HF_REMOTE_MAIN_SHA" = "$HF_STAGE_BASE_MAIN_SHA" ]; then
            if git -C .release/huggingface ls-remote --exit-code --heads origin "refs/heads/release/v$RELEASE_TARGET" >/dev/null 2>&1; then
              node scripts/huggingface.mjs push .release/huggingface --delete "release/v$RELEASE_TARGET"
            fi
            ! git -C .release/huggingface ls-remote --exit-code --heads origin "refs/heads/release/v$RELEASE_TARGET" >/dev/null 2>&1
            node - "$HF_STAGE_BASE_MAIN_SHA" "$HF_CANDIDATE_SHA" <<'NODE'
          const fs = require('node:fs');
          const [baseMainSha, candidateSha] = process.argv.slice(2);
          fs.writeFileSync('.release/runtime/huggingface-canary-rollback.json', JSON.stringify({
            status: 'PASS', strategy: 'no-promotion-observed', baseMainSha, candidateSha,
          }, null, 2) + '\n');
          NODE
            exit 0
          fi
          test "$HF_REMOTE_MAIN_SHA" = "$HF_CANDIDATE_SHA"
          test "$(git -C .release/huggingface rev-parse "$HF_CANDIDATE_SHA^")" = "$HF_ROLLBACK_BASE_SHA"
          git -C .release/huggingface checkout -f --detach "$HF_CANDIDATE_SHA"
          git -C .release/huggingface revert --no-edit "$HF_CANDIDATE_SHA"
          HF_ROLLBACK_SHA="$(git -C .release/huggingface rev-parse HEAD)"
          test "$(git -C .release/huggingface rev-parse "$HF_ROLLBACK_SHA^{tree}")" = \
            "$(git -C .release/huggingface rev-parse "$HF_ROLLBACK_BASE_SHA^{tree}")"
          node scripts/huggingface.mjs push .release/huggingface HEAD:main
          test "$(git -C .release/huggingface ls-remote origin refs/heads/main | awk '{print $1}')" = "$HF_ROLLBACK_SHA"
          if git -C .release/huggingface ls-remote --exit-code --heads origin "refs/heads/release/v$RELEASE_TARGET" >/dev/null 2>&1; then
            node scripts/huggingface.mjs push .release/huggingface --delete "release/v$RELEASE_TARGET"
          fi
          ! git -C .release/huggingface ls-remote --exit-code --heads origin "refs/heads/release/v$RELEASE_TARGET" >/dev/null 2>&1
          node - "$HF_ROLLBACK_BASE_SHA" "$HF_CANDIDATE_SHA" "$HF_ROLLBACK_SHA" <<'NODE'
          const fs = require('node:fs');
          const [baseMainSha, candidateSha, rollbackSha] = process.argv.slice(2);
          fs.writeFileSync('.release/runtime/huggingface-canary-rollback.json', JSON.stringify({
            status: 'PASS', strategy: 'forward-revert', baseMainSha, candidateSha, rollbackSha,
          }, null, 2) + '\n');
          NODE
      - name: Prepare sanitized release transaction evidence
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { mkdir, readdir, readFile, writeFile } from 'node:fs/promises';
          const source = '.release/runtime';
          const target = `${source}/transaction-evidence`;
          await mkdir(target, { recursive: true });
          const scrub = value => value
            .replace(/(authorization\s*[:=]\s*(?:bearer\s+)?)[^\s,;"']+/gi, '$1[REDACTED]')
            .replace(/([?&](?:access_token|token|api_key|key|secret)=)[^&#\s]+/gi, '$1[REDACTED]');
          const redact = value => {
            if (Array.isArray(value)) return value.map(redact);
            if (typeof value === 'string') return scrub(value);
            if (!value || typeof value !== 'object') return value;
            return Object.fromEntries(Object.entries(value).map(([key, item]) => [
              key,
              /token|secret|authorization|bucket|draftApi/i.test(key) ? '[REDACTED]' : redact(item),
            ]));
          };
          for (const name of await readdir(source).catch(() => [])) {
            if (!name.endsWith('.json')) continue;
            try {
              const document = JSON.parse(await readFile(`${source}/${name}`, 'utf8'));
              await writeFile(`${target}/${name}`, JSON.stringify(redact(document), null, 2) + '\n');
            } catch {}
          }
          const markers = {};
          for (const name of ['hf-canary-promotion-attempted', 'hf-canary-promoted', 'zenodo-publish-attempted', 'irreversible-present']) {
            try { markers[name] = (await readFile(`${source}/${name}`, 'utf8')).trim() || true; }
            catch { markers[name] = false; }
          }
          await writeFile(`${target}/transaction-markers.json`, JSON.stringify(markers, null, 2) + '\n');
          NODE
      - name: Preserve release transaction evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-transaction-${{ github.run_id }}-${{ github.run_attempt }}
          path: .release/runtime/transaction-evidence/
          retention-days: 30
          if-no-files-found: warn

  postrelease:
    needs: release
    if: needs.release.result == 'success'
    permissions:
      contents: read
    concurrency:
      group: doctor-ghezelbaash-external-mutation
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
      RELEASE_TARGET: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: v${{ inputs.version }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14.6"
      - name: Provision postrelease validation tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg
          ffprobe -version
      - run: npm ci
      - name: Install pinned Hub client and Viewer dependency
        run: python3 -m pip install --requirement scripts/requirements-hf-viewer.txt
      - name: Bind enrichment to the exact frozen release
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TARGET" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          RELEASE_SHA="$(git rev-parse HEAD)"
          test "$(node -p "require('./src/data/release.json').release")" = "$RELEASE_TARGET"
          git fetch --tags --force origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/heads/production:refs/remotes/origin/production"
          test "$(git rev-parse refs/remotes/origin/main)" = "$RELEASE_SHA"
          test "$(git rev-parse refs/remotes/origin/production)" = "$RELEASE_SHA"
          test "$(git rev-list -n 1 "v$RELEASE_TARGET")" = "$RELEASE_SHA"
          printf 'RELEASE_SHA=%s\n' "$RELEASE_SHA" >> "$GITHUB_ENV"
      - name: Build exact frozen retrieval package
        run: |
          set -euo pipefail
          export SOURCE_COMMIT="$RELEASE_SHA"
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct "$RELEASE_SHA")"
          export CF_PAGES_COMMIT_SHA="$RELEASE_SHA"
          npm run release
          node scripts/build-hf-demo.mjs --source-dist dist --out-dir .release/runtime/hf-demo
      - name: Synchronize public profile static retrieval and existing collections
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN || secrets.HUGGINGFACE_TOKEN || secrets.HUGGING_FACE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${HF_TOKEN:-}"; echo "::add-mask::$HF_TOKEN"
          node scripts/huggingface.mjs sync-profile
          python3 scripts/sync-hf-retrieval.py \
            --directory .release/runtime/hf-demo \
            --output .release/runtime/hf-retrieval.json
          node scripts/huggingface.mjs sync-profile --check
          python3 scripts/sync-hf-retrieval.py --directory .release/runtime/hf-demo --check
      - name: Verify all enriched public authority surfaces
        run: |
          set -euo pipefail
          node scripts/run-transient-command.mjs -- node scripts/huggingface.mjs verify
          node scripts/run-transient-command.mjs -- npm run verify:production
          node scripts/run-transient-command.mjs -- npm run verify:public-discovery
          node scripts/run-transient-command.mjs -- node scripts/verify-dataset-production.mjs
          npm run indexnow:submit
      - name: Preserve postrelease evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: postrelease-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .release/runtime/release-attestation.json
            .release/runtime/dist-sha256.json
            .release/runtime/hf-retrieval.json
          retention-days: 30
          if-no-files-found: warn

  publish-bridge:
    needs: release
    if: needs.release.result == 'success'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/github-pages-bridge.yml

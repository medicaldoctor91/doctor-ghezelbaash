            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/heads/production:refs/remotes/origin/production"
          test "$(git rev-parse refs/remotes/origin/main)" = "$CANONICAL_MAIN_SHA"
          test "$(git rev-parse refs/remotes/origin/production)" = "$PRODUCTION_BASE_SHA"
          test "$(git ls-remote origin "refs/tags/v$CURRENT_VERSION" | awk '{print $1}')" = "$FROZEN_TAG_REF_SHA"
          test "$(git ls-remote origin "refs/tags/v$CURRENT_VERSION^{}" | awk '{print $1}')" = "$FROZEN_SOURCE_SHA"

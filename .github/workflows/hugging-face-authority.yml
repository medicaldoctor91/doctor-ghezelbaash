          test "$(git -C .release/huggingface ls-remote origin refs/heads/main | awk '{print $1}')" = "$HF_CANDIDATE_SHA"
          touch .release/runtime/hf-canary-promoted
      - name: Verify hosted Hugging Face Viewer canary before DOI publication
        if: steps.release.outputs.mode == 'new'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/huggingface.mjs verify --viewer
      - name: Revalidate all mutable heads immediately before DOI publication
        if: steps.release.outputs.mode == 'new'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/heads/production:refs/remotes/origin/production"
          test "$(git rev-parse refs/remotes/origin/main)" = "$CANONICAL_MAIN_SHA"
          test "$(git rev-parse refs/remotes/origin/production)" = "$PRODUCTION_BASE_SHA"
          test "$(git ls-remote origin "refs/tags/v$CURRENT_VERSION" | awk '{print $1}')" = "$FROZEN_TAG_REF_SHA"
          test "$(git ls-remote origin "refs/tags/v$CURRENT_VERSION^{}" | awk '{print $1}')" = "$FROZEN_SOURCE_SHA"
          test "$(git ls-remote origin "refs/heads/$RELEASE_PREP_BRANCH" | awk '{print $1}')" = "$APPROVED_SOURCE_SHA"
          test "$(git ls-remote origin "refs/heads/release/v$RELEASE_TARGET" | awk '{print $1}')" = "$CANDIDATE_SHA"
          test "$(git -C .release/huggingface ls-remote origin refs/heads/main | awk '{print $1}')" = "$HF_CANDIDATE_SHA"
          if [ "$HF_BRANCH_REQUIRED" = true ]; then
            test "$(git -C .release/huggingface ls-remote origin "refs/heads/release/v$RELEASE_TARGET" | awk '{print $1}')" = "$HF_CANDIDATE_SHA"
          fi
          test -z "$(git -C .release/huggingface status --porcelain --untracked-files=all)"
          node -e "const s=require('./.release/runtime/zenodo-stage.json');if(s.release!==process.env.RELEASE_TARGET||s.recordId!==process.env.ZENODO_RECORD||s.versionDoi!==process.env.ZENODO_DOI||s.sourceCommit!==process.env.CANDIDATE_SHA)throw new Error('Zenodo stage ledger drift at irreversible boundary')"

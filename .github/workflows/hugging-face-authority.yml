      - name: Final pre-publication transaction gate
        if: steps.release.outputs.mode == 'new'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN || secrets.HUGGINGFACE_TOKEN || secrets.HUGGING_FACE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/heads/production:refs/remotes/origin/production"
          test "$(git rev-parse refs/remotes/origin/main)" = "$CANONICAL_MAIN_SHA"
          test "$(git rev-parse refs/remotes/origin/production)" = "$PRODUCTION_BASE_SHA"
          test "$(git ls-remote origin "refs/tags/v$CURRENT_VERSION" | awk '{print $1}')" = "$FROZEN_TAG_REF_SHA"
          test "$(git ls-remote origin "refs/tags/v$CURRENT_VERSION^{}" | awk '{print $1}')" = "$FROZEN_SOURCE_SHA"
          test "$(git ls-remote origin "refs/heads/$RELEASE_PREP_BRANCH" | awk '{print $1}')" = "$APPROVED_SOURCE_SHA"
          git merge-base --is-ancestor "$CANONICAL_MAIN_SHA" "$CANDIDATE_SHA"
          git merge-base --is-ancestor "$PRODUCTION_BASE_SHA" "$CANDIDATE_SHA"
          test "$(git ls-remote origin "refs/heads/release/v$RELEASE_TARGET" | awk '{print $1}')" = "$CANDIDATE_SHA"
          if git ls-remote --exit-code --tags origin "refs/tags/v$RELEASE_TARGET" >/dev/null 2>&1; then
            test "$(git ls-remote origin "refs/tags/v$RELEASE_TARGET^{}" | awk '{print $1}')" = "$CANDIDATE_SHA" || \
              test "$(git ls-remote origin "refs/tags/v$RELEASE_TARGET" | awk '{print $1}')" = "$CANDIDATE_SHA"
          fi
          if [ "$HF_BRANCH_REQUIRED" = true ]; then

name: External authority release contract

on:
  schedule:
    - cron: "41 4 * * 1,4"
  workflow_dispatch:
    inputs:
      version:
        description: "Optional X.Y.Z release target; leave empty to verify current external authority surfaces"
        required: false
        type: string
      source_sha:
        description: "Exact approved release-prep/vX.Y.Z commit (origin/main only for current-version recovery)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name != 'workflow_dispatch' || inputs.version == ''
    permissions:
      contents: read
      actions: write
    uses: ./.github/workflows/authority-maintenance.yml
    with:
      apply: false
    secrets: inherit

  release:
    if: github.event_name == 'workflow_dispatch' && inputs.version != ''
    permissions:
      contents: write
    concurrency:
      group: doctor-ghezelbaash-external-mutation
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
      RELEASE_TARGET: ${{ inputs.version }}
      APPROVED_SOURCE_SHA: ${{ inputs.source_sha }}
      CF_EXPECTED_ENVIRONMENT: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve and checkout the approved release source
        id: release
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TARGET" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$APPROVED_SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          git fetch --no-tags origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/heads/production:refs/remotes/origin/production"
          CANONICAL_MAIN_SHA="$(git rev-parse refs/remotes/origin/main)"
          test "$(git rev-parse HEAD)" = "$CANONICAL_MAIN_SHA"
          test "$GITHUB_SHA" = "$CANONICAL_MAIN_SHA"
          PRODUCTION_BASE_SHA="$(git rev-parse refs/remotes/origin/production)"
          CANONICAL_VERSION="$(node -p "require('./src/data/release.json').release")"
          CANONICAL_RECORD="$(node -p "require('./src/data/release.json').dataset.zenodo.recordId")"
          CANONICAL_DOI="$(node -p "require('./src/data/release.json').dataset.zenodo.versionDoi")"
          CANONICAL_HF_URL="$(node -p "require('./src/data/release.json').dataset.huggingFace.dataset")"
          HF_URL="$CANONICAL_HF_URL"
          HF_REPO="${HF_URL#https://huggingface.co/datasets/}"
          RELEASE_DATE="$(date -u +%F)"
          RELATION="$(node - "$CANONICAL_VERSION" "$RELEASE_TARGET" <<'NODE'
          const [current,target]=process.argv.slice(2);
          const parts=v=>v.split('.').map(Number);
          const [a,b]=[parts(current),parts(target)];
          if(a.some(Number.isNaN)||b.some(Number.isNaN))throw new Error('Invalid semantic version');
          const order=(x,y)=>x[0]-y[0]||x[1]-y[1]||x[2]-y[2];
          process.stdout.write(order(b,a)>0?'newer':order(b,a)===0?'equal':'older');
          NODE
          )"
          RELEASE_PREP_BRANCH="release-prep/v$RELEASE_TARGET"
          RELEASE_ALREADY_ON_MAIN=false
          if [ "$APPROVED_SOURCE_SHA" = "$CANONICAL_MAIN_SHA" ]; then
            test "$RELATION" = equal
            MODE=current
            RELEASE_PREP_BRANCH=""
            CURRENT_VERSION="$CANONICAL_VERSION"
            CURRENT_RECORD="$CANONICAL_RECORD"
            CURRENT_DOI="$CANONICAL_DOI"
          else
            test "$RELATION" != older
            MODE=new
            PREP_REMOTE_SHA="$(git ls-remote --heads origin "refs/heads/$RELEASE_PREP_BRANCH" | awk '{print $1}')"
            test "$PREP_REMOTE_SHA" = "$APPROVED_SOURCE_SHA"
            git fetch --no-tags origin \
              "+refs/heads/$RELEASE_PREP_BRANCH:refs/remotes/origin/$RELEASE_PREP_BRANCH"
            test "$(git rev-parse "refs/remotes/origin/$RELEASE_PREP_BRANCH")" = "$APPROVED_SOURCE_SHA"
            if [ "$RELATION" = newer ]; then
              git merge-base --is-ancestor "$CANONICAL_MAIN_SHA" "$APPROVED_SOURCE_SHA"
            else
              RELEASE_ALREADY_ON_MAIN=true
              test "$PRODUCTION_BASE_SHA" = "$CANONICAL_MAIN_SHA"
              test "$(git rev-list --parents -n 1 "$CANONICAL_MAIN_SHA" | wc -w)" -eq 2
              test "$(git rev-parse "$CANONICAL_MAIN_SHA^")" = "$APPROVED_SOURCE_SHA"
            fi
            git checkout --detach "$APPROVED_SOURCE_SHA"
            test "$(git rev-parse HEAD)" = "$APPROVED_SOURCE_SHA"
            test -z "$(git status --porcelain --untracked-files=all)"
            CURRENT_VERSION="$(node -p "require('./src/data/release.json').release")"
            CURRENT_RECORD="$(node -p "require('./src/data/release.json').dataset.zenodo.recordId")"
            CURRENT_DOI="$(node -p "require('./src/data/release.json').dataset.zenodo.versionDoi")"
            test "$(node -p "require('./src/data/release.json').dataset.huggingFace.dataset")" = "$CANONICAL_HF_URL"
            if [ "$RELEASE_ALREADY_ON_MAIN" = false ]; then
              test "$CURRENT_VERSION" = "$CANONICAL_VERSION"
              test "$CURRENT_RECORD" = "$CANONICAL_RECORD"
              test "$CURRENT_DOI" = "$CANONICAL_DOI"
            else
              node - "$CURRENT_VERSION" "$RELEASE_TARGET" <<'NODE'
          const [source,target]=process.argv.slice(2).map(v=>v.split('.').map(Number));
          const order=(x,y)=>x[0]-y[0]||x[1]-y[1]||x[2]-y[2];
          if(order(source,target)>=0)throw new Error('Release-prep source must retain the preceding release identity');
          NODE
            fi
          fi
          git fetch --tags --force origin
          FROZEN_TAG_REF_SHA="$(git ls-remote origin "refs/tags/v$CURRENT_VERSION" | awk '{print $1}')"
          FROZEN_SOURCE_SHA="$(git ls-remote origin "refs/tags/v$CURRENT_VERSION^{}" | awk '{print $1}')"
          test -n "$FROZEN_TAG_REF_SHA"
          test -n "$FROZEN_SOURCE_SHA"
          test "$FROZEN_TAG_REF_SHA" != "$FROZEN_SOURCE_SHA"
          test "$(git rev-parse "refs/tags/v$CURRENT_VERSION")" = "$FROZEN_TAG_REF_SHA"
          test "$(git rev-parse "refs/tags/v$CURRENT_VERSION^{commit}")" = "$FROZEN_SOURCE_SHA"
          if [ "$MODE" = new ]; then
            if [ "$RELEASE_ALREADY_ON_MAIN" = false ]; then
              test "$PRODUCTION_BASE_SHA" = "$FROZEN_SOURCE_SHA"
            fi
            git merge-base --is-ancestor "$FROZEN_SOURCE_SHA" "$APPROVED_SOURCE_SHA"
            FROZEN_RELEASE="$(mktemp)"
            trap 'rm -f "$FROZEN_RELEASE"' EXIT
            git show "$FROZEN_SOURCE_SHA:src/data/release.json" > "$FROZEN_RELEASE"
            node - "$FROZEN_RELEASE" <<'NODE'
          const fs = require('node:fs');
          const frozen = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const prepared = JSON.parse(fs.readFileSync('src/data/release.json', 'utf8'));
          const identity = value => {
            const final = value.dataset?.zenodo?.releaseHistory?.at(-1) || {};
            return {
              release: value.release,
              dateModified: value.dateModified,
              recordId: String(value.dataset?.zenodo?.recordId ?? ''),
              versionDoi: value.dataset?.zenodo?.versionDoi,
              finalHistory: {
                release: final.release,
                publicationDate: final.publicationDate,
                recordId: String(final.recordId ?? ''),
                versionDoi: final.versionDoi,
              },
            };
          };
          const frozenIdentity = identity(frozen);
          const preparedIdentity = identity(prepared);
          for (const [label, item] of [['frozen', frozenIdentity], ['release-prep', preparedIdentity]]) {
            if (item.finalHistory.release !== item.release ||
                item.finalHistory.publicationDate !== item.dateModified ||
                item.finalHistory.recordId !== item.recordId ||
                item.finalHistory.versionDoi !== item.versionDoi)
              throw new Error(`${label} final release-history identity is inconsistent`);
          }
          if (JSON.stringify(frozenIdentity) !== JSON.stringify(preparedIdentity))
            throw new Error('Release-prep changed the frozen current release identity');
          NODE
            rm -f "$FROZEN_RELEASE"
            trap - EXIT
          fi
          FROZEN_SOURCE_AT_HEAD=false
          if [ "$MODE" = current ]; then
            if [ "$CANONICAL_MAIN_SHA" = "$FROZEN_SOURCE_SHA" ]; then FROZEN_SOURCE_AT_HEAD=true; fi
          fi
          printf 'CANONICAL_MAIN_SHA=%s\nPRODUCTION_BASE_SHA=%s\nFROZEN_TAG_REF_SHA=%s\nFROZEN_SOURCE_SHA=%s\nCURRENT_VERSION=%s\nCURRENT_RECORD=%s\nCURRENT_DOI=%s\nHF_REPO=%s\nRELEASE_DATE=%s\nRELEASE_MODE=%s\nRELEASE_PREP_BRANCH=%s\nRELEASE_ALREADY_ON_MAIN=%s\nFROZEN_SOURCE_AT_HEAD=%s\n' \
            "$CANONICAL_MAIN_SHA" "$PRODUCTION_BASE_SHA" "$FROZEN_TAG_REF_SHA" "$FROZEN_SOURCE_SHA" "$CURRENT_VERSION" "$CURRENT_RECORD" "$CURRENT_DOI" "$HF_REPO" "$RELEASE_DATE" "$MODE" "$RELEASE_PREP_BRANCH" "$RELEASE_ALREADY_ON_MAIN" "$FROZEN_SOURCE_AT_HEAD" >> "$GITHUB_ENV"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14.6"
      - name: Provision release validation tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg git-lfs
          ffprobe -version
          git lfs version
      - run: npm ci
      - name: Install pinned Viewer packaging dependency
        run: python3 -m pip install --requirement scripts/requirements-hf-viewer.txt
      - name: Enforce high-severity dependency advisory gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run security:dependencies
      - name: Verify frozen-source publication context
        run: |
          node scripts/verify-live.mjs test-release-context
          python3 scripts/publish-hf-release.py --self-test
      - name: Load canonical platform contract
        run: node scripts/platform-contract.mjs export >> "$GITHUB_ENV"
      - name: Refuse current-version mutation from development main
        if: steps.release.outputs.mode == 'current'
        shell: bash
        run: |
          set -euo pipefail
          test "$FROZEN_SOURCE_AT_HEAD" = true || {
            echo "Current release reconciliation must run from its exact frozen source; use the verify job for routine checks." >&2
            exit 1
          }

      - name: Detect GitHub immutable releases capability
        if: steps.release.outputs.mode == 'new' || env.FROZEN_SOURCE_AT_HEAD == 'true'
        env:
          GH_RELEASE_ADMIN_TOKEN: ${{ secrets.GH_RELEASE_ADMIN_TOKEN || secrets.RELEASE_ADMIN_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GH_RELEASE_ADMIN_TOKEN:-}" || {
            echo "GitHub Administration token is required to prove immutable releases before publication." >&2
            exit 1
          }
          echo "::add-mask::$GH_RELEASE_ADMIN_TOKEN"
          export GH_TOKEN="$GH_RELEASE_ADMIN_TOKEN"
          STATE="$(mktemp)"
          trap 'rm -f "$STATE"' EXIT
          gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "repos/$GITHUB_REPOSITORY/immutable-releases" > "$STATE"
          node - "$STATE" <<'NODE'
          const state = JSON.parse(require("node:fs").readFileSync(process.argv[2], "utf8"));
          if (state.enabled !== true) throw new Error("Configured GitHub release-admin credential requires immutable releases to be enabled");
          NODE
          echo "GITHUB_IMMUTABLE_POLICY=enabled" >> "$GITHUB_ENV"
      - name: Preflight external release credentials and mutable surfaces
        if: steps.release.outputs.mode == 'new' || env.FROZEN_SOURCE_AT_HEAD == 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN || secrets.HUGGINGFACE_TOKEN || secrets.HUGGING_FACE_TOKEN }}
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN || secrets.ZENODO_ACCESS_TOKEN || secrets.ZENODO_API_TOKEN || secrets.ZENODO_API_KEY || secrets.ZENODO_PAT }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${HF_TOKEN:-}"
          test -n "${ZENODO_TOKEN:-}"
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          echo "::add-mask::$HF_TOKEN"
          echo "::add-mask::$ZENODO_TOKEN"
          echo "::add-mask::$CLOUDFLARE_API_TOKEN"
          mkdir -p .release/runtime
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          import huggingface_hub
          from huggingface_hub import HfApi

          if huggingface_hub.__version__ != "1.32.0":
              raise RuntimeError("Unpinned Hugging Face Hub client")
          release = json.loads(Path("src/data/release.json").read_text())
          repo = release["dataset"]["huggingFace"]["dataset"].removeprefix("https://huggingface.co/datasets/")
          api = HfApi(endpoint="https://huggingface.co", token=os.environ["HF_TOKEN"])
          principal = api.whoami()
          if str(principal.get("name", "")).casefold() != "ghezelbaash":
              raise RuntimeError("Unexpected Hugging Face release principal")
          api.auth_check(repo_id=repo, repo_type="dataset")
          api.auth_check(repo_id="doctor-ghezelbaash/README", repo_type="space")
          space = "doctor-ghezelbaash/clinical-knowledge"
          space_exists = api.repo_exists(repo_id=space, repo_type="space")
          if space_exists:
              api.auth_check(repo_id=space, repo_type="space")
          state = {
              "schemaVersion": 1,
              "status": "PASS",
              "sourceCommit": os.environ["APPROVED_SOURCE_SHA"],
              "releaseTarget": os.environ["RELEASE_TARGET"],
              "huggingFacePrincipal": principal.get("name"),
              "datasetAccess": "PASS",
              "profileAccess": "PASS",
              "retrievalSpaceExists": space_exists,
              "writeProof": "Deferred to the reversible HF candidate-branch commit before DOI publication",
          }
          Path(".release/runtime/external-preflight.json").write_text(json.dumps(state, indent=2) + "\n")
          PY
          python3 - "$CURRENT_RECORD" "$CURRENT_DOI" "$CURRENT_VERSION" <<'PY'
          import json, os, sys
          from urllib.request import Request, urlopen

          record, doi, version = sys.argv[1:]
          request = Request(
              f"https://zenodo.org/api/records/{record}",
              headers={"Authorization": f"Bearer {os.environ['ZENODO_TOKEN']}",
                       "Accept": "application/json", "User-Agent": "ghezelbaash-release-preflight/1.0"},
          )
          with urlopen(request, timeout=60) as response:
              public = json.load(response)
          if public.get("doi") != doi or (public.get("metadata") or {}).get("version") != version:
              raise RuntimeError("Current public Zenodo identity differs before release")
          PY
          node scripts/cloudflare-pages.mjs ensure --verify-config
      - name: Build exact current release distribution
        if: steps.release.outputs.mode == 'current'
        shell: bash
        run: |
          set -euo pipefail
          C="$(git rev-parse HEAD)"
          export SOURCE_COMMIT="$C" SOURCE_DATE_EPOCH="$(git show -s --format=%ct "$C")" CF_PAGES_COMMIT_SHA="$C"
          if [ "$FROZEN_SOURCE_AT_HEAD" = true ]; then
            npm run release
            python scripts/zenodo_release.py prepare-auxiliaries
            node scripts/build-hf-demo.mjs --source-dist dist --out-dir .release/runtime/hf-demo
          else
            npm run build
          fi
      - name: Verify current Zenodo surface
        if: steps.release.outputs.mode == 'current'
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN || secrets.ZENODO_ACCESS_TOKEN || secrets.ZENODO_API_TOKEN || secrets.ZENODO_API_KEY || secrets.ZENODO_PAT }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ZENODO_TOKEN:-}"; echo "::add-mask::$ZENODO_TOKEN"
          python scripts/zenodo_release.py verify-public \
            --record "$CURRENT_RECORD" --doi "$CURRENT_DOI" --version "$CURRENT_VERSION"
      - name: Prepare current Hugging Face distribution
        if: steps.release.outputs.mode == 'current'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .release/huggingface
          git clone "https://huggingface.co/datasets/$HF_REPO" .release/huggingface
          node scripts/huggingface.mjs prepare dist .release/huggingface
          git -C .release/huggingface config user.name ghezelbaash-release-bot
          git -C .release/huggingface config user.email actions@users.noreply.github.com
      - name: Recover current Hugging Face distribution through the official Hub client
        if: steps.release.outputs.mode == 'current'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN || secrets.HUGGINGFACE_TOKEN || secrets.HUGGING_FACE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${HF_TOKEN:-}"; echo "::add-mask::$HF_TOKEN"
          HF_BRANCH="release/v$CURRENT_VERSION"
          python3 scripts/publish-hf-release.py stage --resume-current \
            --directory .release/huggingface --branch "$HF_BRANCH" \
            --output .release/runtime/huggingface-stage.json
          HF_CANDIDATE_SHA="$(node -p "require('./.release/runtime/huggingface-stage.json').candidateSha")"
          HF_BASE_MAIN_SHA="$(node -p "require('./.release/runtime/huggingface-stage.json').baseMainSha")"
          HF_EXPECTED_FROZEN_SHA="$(node -p "const s=require('./.release/runtime/huggingface-stage.json');s.frozenTagSha || s.candidateSha")"
          git -C .release/huggingface fetch origin "$HF_CANDIDATE_SHA" main
          git -C .release/huggingface merge-base --is-ancestor "$HF_BASE_MAIN_SHA" "$HF_CANDIDATE_SHA"
          git -C .release/huggingface checkout -f -B "$HF_BRANCH" "$HF_CANDIDATE_SHA"
          python3 scripts/publish-hf-release.py verify-stage \
            --directory .release/huggingface --state .release/runtime/huggingface-stage.json
          test "$(git -C .release/huggingface ls-remote origin refs/heads/main | awk '{print $1}')" = "$HF_BASE_MAIN_SHA"
          node scripts/huggingface.mjs push .release/huggingface HEAD:main
          test "$(git -C .release/huggingface ls-remote origin refs/heads/main | awk '{print $1}')" = "$HF_CANDIDATE_SHA"
          printf 'HF_CANDIDATE_SHA=%s\nHF_EXPECTED_FROZEN_SHA=%s\n' "$HF_CANDIDATE_SHA" "$HF_EXPECTED_FROZEN_SHA" >> "$GITHUB_ENV"
      - name: Repair a missing frozen Hugging Face tag from its exact source tag
        if: steps.release.outputs.mode == 'current'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN || secrets.HUGGINGFACE_TOKEN || secrets.HUGGING_FACE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${HF_TOKEN:-}"; echo "::add-mask::$HF_TOKEN"
          HF_TAG="v$CURRENT_VERSION"
          RELEASE_RECOVERY=false
          if git -C .release/huggingface ls-remote --exit-code --tags origin "refs/tags/$HF_TAG" >/dev/null 2>&1; then
            test "$(git -C .release/huggingface ls-remote origin "refs/tags/$HF_TAG^{}" | awk '{print $1}')" = "$HF_EXPECTED_FROZEN_SHA" || \
              test "$(git -C .release/huggingface ls-remote origin "refs/tags/$HF_TAG" | awk '{print $1}')" = "$HF_EXPECTED_FROZEN_SHA"
          else
            test "$FROZEN_SOURCE_AT_HEAD" = true
            git -C .release/huggingface tag -a "$HF_TAG" -m "Dr. Saeed Ghezelbash Public Knowledge Graph $HF_TAG"
            node scripts/huggingface.mjs push .release/huggingface "refs/tags/$HF_TAG"
            RELEASE_RECOVERY=true
          fi
          if git ls-remote --exit-code --heads origin "refs/heads/release/v$CURRENT_VERSION" >/dev/null 2>&1 || \
             git -C .release/huggingface ls-remote --exit-code --heads origin "refs/heads/release/v$CURRENT_VERSION" >/dev/null 2>&1; then
            RELEASE_RECOVERY=true
          fi
          printf 'RELEASE_RECOVERY=%s\n' "$RELEASE_RECOVERY" >> "$GITHUB_ENV"
      - name: Reconcile or verify current Cloudflare deployment contract
        if: steps.release.outputs.mode == 'current'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"; echo "::add-mask::$CLOUDFLARE_API_TOKEN"
          if [ "$FROZEN_SOURCE_AT_HEAD" = true ]; then
            export CF_PAGES_COMMIT_SHA="$CANONICAL_MAIN_SHA" CF_EXPECTED_COMMIT="$CANONICAL_MAIN_SHA"
            node scripts/cloudflare-pages.mjs ensure --configure
            node scripts/cloudflare-pages.mjs ensure
          else
            node scripts/cloudflare-pages.mjs ensure --verify-config
          fi
      - name: Reconcile current Cloudflare edge and invalidate stale release objects
        if: steps.release.outputs.mode == 'current'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python scripts/configure-cloudflare-edge.py --apply --outcome .release/runtime/current-edge.json
      - name: Verify current website after reconciliation
        if: steps.release.outputs.mode == 'current'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-live.mjs current --website-only
      - name: Verify the repaired or current frozen release snapshot
        if: steps.release.outputs.mode == 'current' && env.FROZEN_SOURCE_AT_HEAD == 'true'
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN || secrets.ZENODO_ACCESS_TOKEN || secrets.ZENODO_API_TOKEN || secrets.ZENODO_API_KEY || secrets.ZENODO_PAT }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            if node scripts/verify-live.mjs release; then break; fi
            test "$attempt" -lt 18
            sleep 10
          done
      - name: Create or resume release candidate source
        if: steps.release.outputs.mode == 'new'
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN || secrets.ZENODO_ACCESS_TOKEN || secrets.ZENODO_API_TOKEN || secrets.ZENODO_API_KEY || secrets.ZENODO_PAT }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ZENODO_TOKEN:-}"; echo "::add-mask::$ZENODO_TOKEN"
          BRANCH="release/v$RELEASE_TARGET"
          git fetch --no-tags origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/heads/production:refs/remotes/origin/production" \
            "+refs/heads/$RELEASE_PREP_BRANCH:refs/remotes/origin/$RELEASE_PREP_BRANCH"
          test "$(git rev-parse refs/remotes/origin/main)" = "$CANONICAL_MAIN_SHA"
          test "$(git rev-parse refs/remotes/origin/production)" = "$PRODUCTION_BASE_SHA"
          test "$(git rev-parse "refs/remotes/origin/$RELEASE_PREP_BRANCH")" = "$APPROVED_SOURCE_SHA"
          REMOTE_RELEASE_SHA="$(git ls-remote --heads origin "refs/heads/$BRANCH" | awk '{print $1}')"
          if [ -n "$REMOTE_RELEASE_SHA" ]; then
            git fetch --no-tags origin "+refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"
            test "$(git rev-parse "refs/remotes/origin/$BRANCH")" = "$REMOTE_RELEASE_SHA"
            git checkout -B "$BRANCH" "refs/remotes/origin/$BRANCH"
            test "$(node -p "require('./src/data/release.json').release")" = "$RELEASE_TARGET"
            CANDIDATE_NEEDS_COMMIT=false
            CANDIDATE_BRANCH_NEEDS_PUSH=false
          elif [ "$RELEASE_ALREADY_ON_MAIN" = true ]; then
            git checkout -B "$BRANCH" "$CANONICAL_MAIN_SHA"
            test "$(node -p "require('./src/data/release.json').release")" = "$RELEASE_TARGET"
            CANDIDATE_NEEDS_COMMIT=false
            CANDIDATE_BRANCH_NEEDS_PUSH=true
          else
            test "$(git rev-parse HEAD)" = "$APPROVED_SOURCE_SHA"
            test -z "$(git tag -l "v$RELEASE_TARGET")"
            python scripts/zenodo_release.py reserve \
              --current-record "$CURRENT_RECORD" --current-doi "$CURRENT_DOI" --current-version "$CURRENT_VERSION" \
              --version "$RELEASE_TARGET" --date "$RELEASE_DATE"
            RECORD="$(node -p "require('./.release/runtime/zenodo-reservation.json').recordId")"
            DOI="$(node -p "require('./.release/runtime/zenodo-reservation.json').versionDoi")"
            node scripts/promote-release.mjs \
              --version="$RELEASE_TARGET" --date="$RELEASE_DATE" --zenodo-record="$RECORD" --zenodo-doi="$DOI"
            EXPECTED='CITATION.cff codemeta.json package-lock.json package.json src/data/release.json src/data/semantic/knowledge-graph.jsonld'

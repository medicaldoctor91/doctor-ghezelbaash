          HF_STAGE_MODE="$(node -p "require('./.release/runtime/huggingface-stage.json').stageMode")"
          HF_CANDIDATE_SHA="$(node -p "require('./.release/runtime/huggingface-stage.json').candidateSha")"
          HF_STAGE_BASE_MAIN_SHA="$(node -p "require('./.release/runtime/huggingface-stage.json').baseMainSha")"

            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/heads/production:refs/remotes/origin/production"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-parse refs/remotes/origin/main)" = "$CANONICAL_MAIN_SHA"
          test "$(git rev-parse refs/remotes/origin/production)" = "$PRODUCTION_BASE_SHA"
          test "$(git ls-remote origin "refs/heads/$RELEASE_PREP_BRANCH" | awk '{print $1}')" = "$APPROVED_SOURCE_SHA"
          test "$(git ls-remote origin "refs/heads/$RELEASE_BRANCH" | awk '{print $1}')" = "$CANDIDATE_SHA"
          test "$(git -C .release/huggingface ls-remote origin refs/heads/main | awk '{print $1}')" = "$HF_CANDIDATE_SHA"
          GITHUB_AUTH="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          if git ls-remote --exit-code --tags origin "refs/tags/v$RELEASE_TARGET" >/dev/null 2>&1; then
            test "$(git ls-remote origin "refs/tags/v$RELEASE_TARGET^{}" | awk '{print $1}')" = "$CANDIDATE_SHA" || \
              test "$(git ls-remote origin "refs/tags/v$RELEASE_TARGET" | awk '{print $1}')" = "$CANDIDATE_SHA"
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $GITHUB_AUTH" push --atomic origin HEAD:main HEAD:production
          else
            git tag -a "v$RELEASE_TARGET" -m "Dr. Saeed Ghezelbash Public Knowledge Graph v$RELEASE_TARGET"
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $GITHUB_AUTH" push --atomic origin HEAD:main HEAD:production "refs/tags/v$RELEASE_TARGET"
          fi

name: Generate portrait identity variants

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/generate-portrait-variants.yml

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Install image tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends imagemagick
      - name: Generate high-resolution crops
        shell: bash
        run: |
          set -euo pipefail
          src='public/media/images/physician/master/saeed-ghezelbaash-physician-portrait.jpg'
          out='public/media/images/physician/derived'
          mkdir -p "$out"
          convert "$src" -auto-orient -resize '1200x1200^' -gravity center -extent 1200x1200 -quality 88 -strip "$out/saeed-ghezelbaash-portrait-1200x1200.jpg"
          convert "$src" -auto-orient -resize '1200x900^' -gravity center -extent 1200x900 -quality 88 -strip "$out/saeed-ghezelbaash-portrait-1200x900.jpg"
          convert "$src" -auto-orient -resize '1200x675^' -gravity center -extent 1200x675 -quality 88 -strip "$out/saeed-ghezelbaash-portrait-1200x675.jpg"
          convert "$src" -auto-orient -resize '1200x630^' -gravity center -extent 1200x630 -quality 88 -strip "$out/saeed-ghezelbaash-social-1200x630.jpg"
          identify "$out"/*.jpg
          sha256sum "$out"/*.jpg
      - name: Commit variants and remove workflow
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/generate-portrait-variants.yml
          git add public/media/images/physician/derived
          git commit -m 'Add canonical portrait aspect-ratio variants'
          git push origin HEAD:main

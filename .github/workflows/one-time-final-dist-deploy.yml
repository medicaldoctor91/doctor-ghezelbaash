name: One-time final validated dist deployment

on:
  push:
    branches: [main]
    paths: [".github/workflows/one-time-final-dist-deploy.yml"]

permissions:
  contents: write

concurrency:
  group: doctor-ghezelbaash-final-dist-deploy
  cancel-in-progress: false

jobs:
  validate-deploy-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 884d1d90bd1fb6ecca14992c6c60d677
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Remove one-time workflow before building final tree
        run: |
          rm .github/workflows/one-time-final-dist-deploy.yml
          git config user.name 'Dr. Saeed Ghezelbash | final dist deployment'
          git config user.email 'medicaldoctor91@gmail.com'
          git add .github/workflows/one-time-final-dist-deploy.yml
          git commit -m 'Remove one-time final dist deployment workflow'
          git push origin HEAD:main
          echo "FINAL_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Install validation dependencies
        run: |
          npm ci
          python -m pip install --disable-pip-version-check 'rdflib>=7,<8' 'pyshacl>=0.30,<1' 'mlcroissant==1.1.1'

      - name: Test and build exact final tree
        run: |
          node --test tests/*.test.mjs
          npm run build

      - name: Validate canonical invariants and machine-readable bundle
        run: |
          python tests/validate_canonical_invariants.py dist
          python tests/validate_platform_bundle.py dist --no-query --rdf
          python tests/validate_machine_resources.py dist

      - name: Sweep all built text projections for legacy residues
        run: |
          python - <<'PY'
          from pathlib import Path
          suffixes={'.html','.json','.jsonld','.ttl','.txt','.xml','.csv','.md','.vcf','.yaml','.yml','.rdf','.nt','.jsonl'}
          forbidden={
            'A5064828898':'stale OpenAlex',
            'https://www.ghezelbaash.ir/graph.jsonld#dataset':'historical Dataset IRI',
            'Medical Director / مدیر پزشکی':'legacy visible clinic role',
          }
          hits=[]
          checked=0
          for p in Path('dist').rglob('*'):
              if not p.is_file() or p.suffix.lower() not in suffixes:
                  continue
              checked += 1
              body=p.read_text(encoding='utf-8')
              for needle,label in forbidden.items():
                  if needle in body: hits.append((str(p),label,needle))
          if hits: raise RuntimeError(hits)
          print({'checked_text_files':checked,'legacy_hits':0})
          PY

      - name: Deploy only the validated dist
        run: |
          npx --yes wrangler@4 pages deploy dist \
            --project-name=doctor-ghezelbaash \
            --branch=main \
            --commit-hash="$FINAL_SHA" \
            --commit-message='Deploy validated canonical solo-practice and identity model' \
            --commit-dirty=false

      - name: Verify production byte equality and semantics
        run: |
          python - <<'PY'
          import hashlib, json, os, time, urllib.request
          from pathlib import Path

          origin='https://www.ghezelbaash.ir/'
          sha=os.environ['FINAL_SHA']
          def fetch(path):
              sep='&' if '?' in path else '?'
              req=urllib.request.Request(origin+path+sep+'verify='+sha,headers={
                  'Cache-Control':'no-cache','Pragma':'no-cache','User-Agent':'canonical-dist-verifier/1.0'})
              with urllib.request.urlopen(req,timeout=45) as response:
                  return response.read()

          for attempt in range(36):
              try:
                  live=json.loads(fetch('release-provenance.json&attempt='+str(attempt)))
              except Exception:
                  live={}
              if live.get('sourceCommit')==sha:
                  break
              time.sleep(5)
          else:
              raise RuntimeError('Production release-provenance did not converge to '+sha)

          names=[
            'index.html','llms.txt','llms-full.txt','answers.txt','fact-map.json',
            'graph.jsonld','graph.ttl','entity-facts.csv','knowledge.xml','shapes.ttl',
            'dcat.ttl','datapackage.json','croissant.json','provenance.jsonld',
            'integrity-manifest.json','clinical-passages.jsonl','index.md'
          ]
          compared=[]
          for name in names:
              local=Path('dist')/name
              if not local.is_file():
                  continue
              remote=fetch(name)
              if hashlib.sha256(remote).hexdigest()!=hashlib.sha256(local.read_bytes()).hexdigest():
                  raise RuntimeError('Production byte mismatch: '+name)
              compared.append(name)

          llms=fetch('llms.txt').decode('utf-8')
          html=fetch('').decode('utf-8')
          graph=json.loads(fetch('graph.jsonld').decode('utf-8'))
          entity_facts=fetch('entity-facts.csv').decode('utf-8')

          for body,label in [(llms,'llms.txt'),(html,'homepage'),(entity_facts,'entity-facts.csv')]:
              if 'A5064828898' in body: raise RuntimeError(label+' exposes stale OpenAlex')
              if 'https://www.ghezelbaash.ir/graph.jsonld#dataset' in body: raise RuntimeError(label+' exposes historical Dataset IRI')
          if 'A5146521397' not in llms: raise RuntimeError('llms.txt missing canonical OpenAlex A5146521397')
          if 'https://www.ghezelbaash.ir/graph.jsonld/dataset' not in llms: raise RuntimeError('llms.txt missing canonical Dataset IRI')
          if 'Medical Director / مدیر پزشکی' in html: raise RuntimeError('homepage exposes legacy Medical Director role')

          clinic_id='https://www.ghezelbaash.ir/dr-saeed-ghezelbash-aesthetic-clinic-kermanshah'
          person_id='https://www.ghezelbaash.ir/#saeed-ghezelbash'
          clinic=next(n for n in graph['@graph'] if n.get('@id')==clinic_id)
          person=next(n for n in graph['@graph'] if n.get('@id')==person_id)
          vals=lambda v: v if isinstance(v,list) else ([] if v is None else [v])
          refs=lambda v:[x if isinstance(x,str) else x.get('@id') for x in vals(v)]
          types=set(map(str,vals(clinic.get('@type'))))
          if 'MedicalClinic' in types or 'https://schema.org/MedicalClinic' in types:
              raise RuntimeError('clinic/practice still typed MedicalClinic')
          if not any(x.endswith('PhysiciansOffice') for x in types): raise RuntimeError('PhysiciansOffice type missing')
          if refs(person.get('worksFor')): raise RuntimeError('worksFor remains on physician')
          if clinic_id in refs(person.get('affiliation')): raise RuntimeError('clinic remains physician affiliation')
          if refs(clinic.get('employee')): raise RuntimeError('clinic employee relation remains')
          if clinic_id not in refs(person.get('owns')): raise RuntimeError('person ownership edge missing')
          if clinic_id not in refs(person.get('practicesAt')): raise RuntimeError('person practicesAt edge missing')
          if person_id not in refs(clinic.get('owner')): raise RuntimeError('clinic owner edge missing')
          if person_id not in refs(clinic.get('founder')): raise RuntimeError('clinic founder edge missing')

          print(json.dumps({
              'production':'VERIFIED',
              'sourceCommit':sha,
              'byteComparedFiles':compared,
              'openAlex':'A5146521397',
              'datasetIri':'https://www.ghezelbaash.ir/graph.jsonld/dataset',
              'soloPractice':True,
              'legacyEmploymentSemantics':False
          },sort_keys=True))
          PY

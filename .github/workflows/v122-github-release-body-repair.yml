name: v1.2.2 GitHub Release metadata repair

on:
  push:
    branches: [main]
    paths: [.github/workflows/v122-github-release-body-repair.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: doctor-ghezelbaash-external-mutation
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Rewrite and read back exact v1.2.2 Release body
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/body.md <<'EOF'
          # Dr. Saeed Ghezelbash Public Knowledge Graph v1.2.2

          - Exact Candidate C: 41b779fae27f1eab4a9cb63fee17d2e6fec0075c
          - Canonical Dataset IRI: https://www.ghezelbaash.ir/graph.jsonld#dataset
          - Canonical site: https://www.ghezelbaash.ir/
          - Person: Wikidata Q140287622
          - Clinic: Wikidata Q140288589
          - Dataset: Wikidata Q140304972 — Dr. Saeed Ghezelbash Public Knowledge Graph
          - Zenodo Concept DOI: 10.5281/zenodo.18765168
          - Zenodo Version DOI: 10.5281/zenodo.21930954
          - Zenodo record: 21930954
          - Hugging Face distribution: doctor-ghezelbaash/dr-saeid-ghezelbaash-entity-data
          - Hugging Face frozen release: v1.2.2 at 21f657a7e004fd84ced4853b0180755a0ce5a4f7
          - Git tag: v1.2.2 → 41b779fae27f1eab4a9cb63fee17d2e6fec0075c
          - Release attestation asset: release-attestation-v1.2.2.json
          - SHA-256 inventory asset: dist-sha256-v1.2.2.json
          EOF
          jq -n --rawfile body /tmp/body.md '{name:"Dr. Saeed Ghezelbash Public Knowledge Graph v1.2.2",body:$body,draft:false,prerelease:false,make_latest:"true"}' >/tmp/patch.json
          gh api --method PATCH repos/medicaldoctor91/doctor-ghezelbaash/releases/370888049 --input /tmp/patch.json >/tmp/readback.json
          test "$(jq -r '.tag_name' /tmp/readback.json)" = v1.2.2
          test "$(jq -r '.target_commitish' /tmp/readback.json)" = 41b779fae27f1eab4a9cb63fee17d2e6fec0075c
          test "$(jq -r '.draft' /tmp/readback.json)" = false
          BODY=$(jq -r '.body' /tmp/readback.json)
          grep -Fq '41b779fae27f1eab4a9cb63fee17d2e6fec0075c' <<<"$BODY"
          grep -Fq '10.5281/zenodo.21930954' <<<"$BODY"
          grep -Fq '10.5281/zenodo.18765168' <<<"$BODY"
          grep -Fq 'Q140287622' <<<"$BODY"
          grep -Fq 'Q140288589' <<<"$BODY"
          grep -Fq 'Q140304972' <<<"$BODY"
          grep -Fq '21f657a7e004fd84ced4853b0180755a0ce5a4f7' <<<"$BODY"
          echo 'GITHUB_RELEASE_V122_BODY_EXACT_READBACK_PASS'

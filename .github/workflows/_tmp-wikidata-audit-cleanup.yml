name: Temporary cleanup Wikidata edge audit
on:
  push:
    branches: [main]
    paths: ['.github/workflows/_tmp-wikidata-audit-cleanup.yml']
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Remove temporary audit files
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/_tmp-wikidata-edge-audit.yml \
            .github/workflows/_tmp-wikidata-edge-detail.yml \
            .github/workflows/_tmp-enwiki-rendered-link-audit.yml \
            .github/workflows/_tmp-wikidata-audit-cleanup.yml \
            wikimedia/_tmp-wikidata-edge-audit.json \
            wikimedia/_tmp-wikidata-edge-detail.json \
            wikimedia/_tmp-enwiki-rendered-link-audit.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove temporary Wikidata edge audit files'
          git push

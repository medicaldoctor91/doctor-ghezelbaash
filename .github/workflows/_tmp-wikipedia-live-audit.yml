name: Temporary live Wikipedia read-only audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_tmp-wikipedia-live-audit.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install requests
        run: python -m pip install --disable-pip-version-check --no-input requests==2.32.5
      - name: Query Wikimedia APIs read-only
        shell: bash
        run: |
          python - <<'PY'
          import json, requests, datetime, time

          UA='GhezelbaashWikipediaReadOnlyAudit/1.0 (https://www.ghezelbaash.ir/)'
          USER='Medicaldoctor91'
          OUT='wikimedia/_tmp-wikipedia-live-audit.json'

          def api(base, **params):
              p={'format':'json','formatversion':2, **params}
              r=requests.get(base, params=p, headers={'User-Agent':UA}, timeout=60)
              r.raise_for_status()
              d=r.json()
              if 'error' in d:
                  raise RuntimeError(d['error'])
              return d

          def contribs(base, limit=500):
              items=[]; cont={}
              while len(items)<limit:
                  p=dict(action='query', list='usercontribs', ucuser=USER,
                         ucprop='ids|title|timestamp|comment|flags|sizediff|tags',
                         uclimit=min(500,limit-len(items)), **cont)
                  d=api(base, **p)
                  items.extend(d.get('query',{}).get('usercontribs',[]))
                  if 'continue' not in d: break
                  cont=d['continue']
              return items

          def search(base, q, ns=None, limit=50):
              p=dict(action='query', list='search', srsearch=q, srlimit=limit,
                     srprop='snippet|titlesnippet|timestamp|wordcount|sectiontitle')
              if ns is not None: p['srnamespace']=ns
              d=api(base, **p)
              return d.get('query',{}).get('search',[])

          def page(base, title, rvlimit=50):
              d=api(base, action='query', titles=title, prop='info|revisions|pageprops',
                    rvprop='ids|timestamp|user|comment|content', rvslots='main', rvlimit=rvlimit)
              p=d.get('query',{}).get('pages',[{}])[0]
              revs=p.get('revisions',[])
              content=(revs[0].get('slots',{}).get('main',{}).get('content','') if revs else '')
              return {
                  'title':p.get('title'),'pageid':p.get('pageid'),'missing':'missing' in p,
                  'latest_revid':revs[0].get('revid') if revs else None,
                  'latest_timestamp':revs[0].get('timestamp') if revs else None,
                  'latest_user':revs[0].get('user') if revs else None,
                  'latest_comment':revs[0].get('comment') if revs else None,
                  'wikibase_item':p.get('pageprops',{}).get('wikibase_item'),
                  'revisions':[{'revid':x.get('revid'),'parentid':x.get('parentid'),'timestamp':x.get('timestamp'),'user':x.get('user'),'comment':x.get('comment')} for x in revs],
                  'contains':{
                      'Ghezelbash':'ghezelbash' in content.lower(),
                      'Ghezelbaash':'ghezelbaash' in content.lower(),
                      '27280013':'27280013' in content,
                      '10.4103/2008-7802.182734':'10.4103/2008-7802.182734' in content.lower(),
                      '10.3390/md23020084':'10.3390/md23020084' in content.lower(),
                      '10.1111/bdi.13115':'10.1111/bdi.13115' in content.lower(),
                  }
              }

          en='https://en.wikipedia.org/w/api.php'
          fa='https://fa.wikipedia.org/w/api.php'
          en_uc=contribs(en)
          fa_uc=contribs(fa)

          out={
              'checked_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'user':USER,
              'enwiki':{
                  'contributions':en_uc,
                  'talk_bipolar':page(en,'Talk:Treatment of bipolar disorder',100),
                  'article_bipolar':page(en,'Treatment of bipolar disorder',30),
                  'search_name':search(en,'"Saeed Ghezelbash" OR "Mohammad Saeed Ghezelbash" OR Ghezelbash',None,50),
              },
              'fawiki':{
                  'contributions':fa_uc,
                  'search_saeed':search(fa,'"سعید قزلباش"',None,50),
                  'search_mohammad_saeed':search(fa,'"محمد سعید قزلباش"',None,50),
                  'search_latin':search(fa,'Ghezelbash',None,50),
                  'exact_person_page':page(fa,'سعید قزلباش',20),
                  'exact_person_page_alt':page(fa,'محمد سعید قزلباش',20),
              }
          }

          # Add details for every distinct Wikipedia page edited by this account in recent contributions.
          for key,base,items in [('enwiki',en,en_uc),('fawiki',fa,fa_uc)]:
              titles=[]
              for x in items:
                  t=x.get('title')
                  if t and t not in titles: titles.append(t)
              out[key]['edited_pages_current']={}
              for t in titles[:100]:
                  try: out[key]['edited_pages_current'][t]=page(base,t,20)
                  except Exception as e: out[key]['edited_pages_current'][t]={'error':str(e)}

          import os
          os.makedirs('wikimedia',exist_ok=True)
          with open(OUT,'w',encoding='utf-8') as f:
              json.dump(out,f,ensure_ascii=False,indent=2,sort_keys=True)
          print(json.dumps({'ok':True,'out':OUT,'en_contribs':len(en_uc),'fa_contribs':len(fa_uc)},ensure_ascii=False))
          PY
      - name: Commit temporary live snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add wikimedia/_tmp-wikipedia-live-audit.json
          git commit -m 'Record temporary live Wikipedia audit snapshot'
          git push

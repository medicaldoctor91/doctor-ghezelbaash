name: v1.2.2 clean static-analysis hints
on:
  push:
    branches: [release/v1.2.2-candidate]
    paths: [.github/workflows/v122-clean-hints.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0
      - name: Remove TypeScript/Astro hints without semantic changes
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          let f='scripts/generate-v122-overlays.mjs',s=fs.readFileSync(f,'utf8');
          const old=`  const normalized={...row,service_ids:serviceIds,service_families:serviceFamilies};\n  delete normalized.service_id;delete normalized.service_family;`;
          const neu=`  const {service_id:_legacyServiceId,service_family:_legacyServiceFamily,...rowWithoutLegacyServiceKeys}=row;\n  const normalized={...rowWithoutLegacyServiceKeys,service_ids:serviceIds,service_families:serviceFamilies};`;
          if(!s.includes(old))throw Error('Generator hint anchor missing');
          fs.writeFileSync(f,s.replace(old,neu));
          f='scripts/validate-dist.mjs';s=fs.readFileSync(f,'utf8');
          s=s.replace(",visible=await readJson(path.join(data,'visible-contract.json'))",'');
          s=s.replace("const core=JSON.parse(coreScript.body),support=JSON.parse(supportScript.body);","JSON.parse(coreScript.body);const support=JSON.parse(supportScript.body);");
          fs.writeFileSync(f,s);
          NODE
          node --check scripts/generate-v122-overlays.mjs
          node --check scripts/validate-dist.mjs
          git config user.name ghezelbaash-release-bot
          git config user.email actions@users.noreply.github.com
          git add scripts/generate-v122-overlays.mjs scripts/validate-dist.mjs
          git commit -m 'Eliminate v1.2.2 static-analysis hints'
          git push origin HEAD:release/v1.2.2-candidate

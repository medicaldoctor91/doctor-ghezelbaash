name: One-time remove volatile Google review count

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-time-review-count-cleanup.yml"

permissions:
  contents: read

concurrency:
  group: one-time-review-count-cleanup
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
      SOURCE_COMMIT: "1ae261553896c92531566b97c1e32bed00417eb5"
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN || secrets.ZENODO_ACCESS_TOKEN || secrets.ZENODO_API_TOKEN || secrets.ZENODO_API_KEY || secrets.ZENODO_PAT }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1ae261553896c92531566b97c1e32bed00417eb5
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: npm ci
      - name: Build corrected distribution
        run: |
          set -euo pipefail
          npm run validate:release-contract
          npm run build
          npm run release:attest
          python3 scripts/zenodo_release.py prepare-auxiliaries
      - name: Prove review count is absent
        run: |
          set -euo pipefail
          ! grep -RIE 'schema.org/reviewCount|google-maps-review-count-current|data-review-count|data-clinic-review-count|CLINIC_GOOGLE_REVIEW_COUNT' dist .generated src/data/semantic/knowledge-graph.jsonld
          ! grep -RIE '۱۶۶[[:space:]]*نظر|166[[:space:]]*review' dist .generated
          grep -q 'data-clinic-rating' dist/index.html
      - name: Correct Hugging Face main and v1.3.3 refs without a new release
        run: |
          set -euo pipefail
          python3 -m pip install -r scripts/requirements-hf-viewer.txt
          mkdir -p .release/hf-corrected
          node scripts/huggingface.mjs prepare dist .release/hf-corrected
          python3 - <<'PY'
          import os
          from pathlib import Path
          from huggingface_hub import HfApi, CommitOperationAdd, CommitOperationDelete, hf_hub_download
          from huggingface_hub.errors import HfHubHTTPError

          repo="doctor-ghezelbaash/dr-saeid-ghezelbaash-entity-data"
          root=Path(".release/hf-corrected")
          token=os.environ["HF_TOKEN"]
          api=HfApi(endpoint="https://huggingface.co", token=token)
          info=api.dataset_info(repo, revision="main")
          staged=sorted(str(p.relative_to(root)).replace(os.sep,"/") for p in root.rglob("*") if p.is_file())
          forbidden=("schema.org/reviewCount","google-maps-review-count-current",'"value": 166')
          current_graph=Path(hf_hub_download(repo_id=repo, repo_type="dataset", revision=info.sha, filename="graph.jsonld", token=token)).read_text()
          if any(x in current_graph for x in forbidden):
              remote=set(api.list_repo_files(repo_id=repo, repo_type="dataset", revision="main"))
              keep={".gitattributes"}
              ops=[CommitOperationAdd(path_in_repo=name,path_or_fileobj=str(root/name)) for name in staged]
              ops += [CommitOperationDelete(path_in_repo=name) for name in sorted(remote-set(staged)-keep)]
              result=api.create_commit(
                  repo_id=repo, repo_type="dataset", revision="main",
                  parent_commit=info.sha, create_pr=False,
                  commit_message="maintenance: remove volatile Google review count from v1.3.3 data",
                  commit_description="Same-release correction: remove volatile Google Maps review-count data while preserving rating and DOI identity.",
                  operations=ops,
              )
              oid=result.oid
          else:
              oid=info.sha
          graph=Path(hf_hub_download(repo_id=repo, repo_type="dataset", revision=oid, filename="graph.jsonld", token=token)).read_text()
          if any(x in graph for x in forbidden):
              raise RuntimeError("HF corrected graph still contains review-count data")
          for kind,name in (("branch","release/v1.3.3"),("tag","v1.3.3")):
              try:
                  ref=api.dataset_info(repo, revision=name)
                  if ref.sha == oid:
                      continue
                  if kind=="branch": api.delete_branch(repo_id=repo, repo_type="dataset", branch=name)
                  else: api.delete_tag(repo_id=repo, repo_type="dataset", tag=name)
              except HfHubHTTPError as e:
                  if e.response is None or e.response.status_code != 404: raise
              if kind=="branch": api.create_branch(repo_id=repo, repo_type="dataset", branch=name, revision=oid)
              else: api.create_tag(repo_id=repo, repo_type="dataset", tag=name, revision=oid)
          print({"hfCorrected":"PASS","commit":oid,"files":len(staged)})
          PY
      - name: Correct same Zenodo v1.3.3 record and DOI
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, importlib.util, json, os, urllib.error, urllib.parse, urllib.request
          from pathlib import Path

          spec=importlib.util.spec_from_file_location("z","scripts/lib/zenodo_release_impl.py")
          z=importlib.util.module_from_spec(spec); spec.loader.exec_module(z)

          token=os.environ["ZENODO_TOKEN"]
          release=json.loads(Path("src/data/release.json").read_text())
          record=str(release["dataset"]["zenodo"]["recordId"])
          doi=release["dataset"]["zenodo"]["versionDoi"]
          version=release["release"]
          base="https://zenodo.org/api"

          def request(method, url, payload=None, raw=None, content_type="application/json", ok=(200,201,202,204)):
              headers={"Authorization":f"Bearer {token}","Accept":"application/json"}
              if raw is not None:
                  data=raw
                  headers["Content-Type"]=content_type
              elif payload is not None:
                  data=json.dumps(payload).encode()
                  headers["Content-Type"]="application/json"
              else:
                  data=b"" if method in {"POST","PUT"} else None
              req=urllib.request.Request(url,data=data,method=method,headers=headers)
              try:
                  with urllib.request.urlopen(req,timeout=180) as resp:
                      body=resp.read()
                      if resp.status not in ok:
                          raise RuntimeError(f"Zenodo HTTP {resp.status} {method} {url}")
                      return resp.status, json.loads(body) if body else None
              except urllib.error.HTTPError as e:
                  body=e.read().decode("utf-8","replace")
                  raise RuntimeError(f"Zenodo HTTP {e.code} {method} {url}: {body[:1200]}") from e

          _, public=request("GET",f"{base}/records/{record}")
          public_doi=((public.get("pids") or {}).get("doi") or {}).get("identifier") or public.get("doi")
          if public_doi != doi or (public.get("metadata") or {}).get("version") != version:
              raise RuntimeError("Zenodo public identity drift before correction")

          # Remove any abandoned metadata-edit draft from an earlier attempt.
          try:
              request("DELETE",f"{base}/records/{record}/draft",ok=(204,))
          except RuntimeError as e:
              if "HTTP 404" not in str(e):
                  raise

          # Create an edit draft for the already-published record.
          request("POST",f"{base}/records/{record}/draft",ok=(201,))

          published=False
          try:
              # Unlock the published file bucket using the same endpoint as Zenodo's
              # official "Edit published files" UI.
              status, unlock=request(
                  "POST",
                  f"{base}/records/{record}/file-modification",
                  payload={
                      "reason":"correction",
                      "comment":"Remove a volatile Google Maps review-count observation to prevent future factual drift while preserving the rating and record identity."
                  },
                  ok=(200,201),
              )
              if status != 200:
                  raise RuntimeError("Zenodo file modification was not immediately authorized")

              _, current=request("GET",f"{base}/records/{record}/draft/files")
              for entry in current.get("entries",[]):
                  key=urllib.parse.quote(entry["key"],safe="")
                  request("DELETE",f"{base}/records/{record}/draft/files/{key}",ok=(204,))

              sources=z.exact_sources(os.environ["SOURCE_COMMIT"])
              names=sorted(sources)
              request("POST",f"{base}/records/{record}/draft/files",payload=[{"key":n} for n in names],ok=(201,))

              expected={}
              for name in names:
                  path=Path(sources[name])
                  data=path.read_bytes()
                  expected[name]=hashlib.md5(data).hexdigest()
                  key=urllib.parse.quote(name,safe="")
                  request("PUT",f"{base}/records/{record}/draft/files/{key}/content",raw=data,content_type="application/octet-stream",ok=(200,))
                  request("POST",f"{base}/records/{record}/draft/files/{key}/commit",ok=(200,))

              _, draft_files=request("GET",f"{base}/records/{record}/draft/files")
              got={e["key"]:str(e.get("checksum","")).removeprefix("md5:") for e in draft_files.get("entries",[])}
              if set(got)!=set(expected) or any(got[k]!=v for k,v in expected.items()):
                  raise RuntimeError("Zenodo corrected draft file inventory/hash mismatch")

              request("POST",f"{base}/records/{record}/draft/actions/publish",ok=(202,))
              published=True

              _, final=request("GET",f"{base}/records/{record}")
              final_doi=((final.get("pids") or {}).get("doi") or {}).get("identifier") or final.get("doi")
              if final_doi != doi or (final.get("metadata") or {}).get("version") != version:
                  raise RuntimeError("Zenodo identity changed after same-record correction")
              _, final_files=request("GET",f"{base}/records/{record}/files")
              final_got={e["key"]:str(e.get("checksum","")).removeprefix("md5:") for e in final_files.get("entries",[])}
              if set(final_got)!=set(expected) or any(final_got[k]!=v for k,v in expected.items()):
                  raise RuntimeError("Zenodo public corrected file inventory/hash mismatch")
              graph_key=urllib.parse.quote("graph.jsonld",safe="")
              req=urllib.request.Request(f"{base}/records/{record}/files/{graph_key}/content",headers={"Authorization":f"Bearer {token}"})
              with urllib.request.urlopen(req,timeout=120) as resp:
                  graph=resp.read().decode("utf-8")
              forbidden=("schema.org/reviewCount","google-maps-review-count-current",'"value": 166')
              if any(x in graph for x in forbidden):
                  raise RuntimeError("Zenodo public graph still exposes volatile review count")
              print(json.dumps({"zenodoCorrected":"PASS","record":record,"doi":doi,"version":version,"files":len(expected)},separators=(",",":")))
          except Exception:
              if not published:
                  try:
                      request("DELETE",f"{base}/records/{record}/draft",ok=(204,))
                  except Exception:
                      pass
              raise
          PY
      - name: Final no-count readback from corrected artifacts
        run: |
          set -euo pipefail
          curl -fsSL "https://huggingface.co/datasets/doctor-ghezelbaash/dr-saeid-ghezelbaash-entity-data/resolve/main/graph.jsonld?download=true" > /tmp/hf-graph.jsonld
          ! grep -E 'schema.org/reviewCount|google-maps-review-count-current|"value"[[:space:]]*:[[:space:]]*166' /tmp/hf-graph.jsonld
          python3 scripts/zenodo_release.py verify-public --record 22838416 --doi 10.5281/zenodo.22838416 --version 1.3.3

name: One-time canonical dist-first repair

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-time-canonical-dist-repair.yml"

permissions:
  contents: write

concurrency:
  group: doctor-ghezelbaash-one-time-canonical-repair
  cancel-in-progress: false

jobs:
  repair-build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 884d1d90bd1fb6ecca14992c6c60d677
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build and validation dependencies
        run: |
          npm ci
          python -m pip install --disable-pip-version-check 'rdflib>=7,<8' 'pyshacl>=0.30,<1' 'mlcroissant==1.1.1'

      - name: RED - prove current MedicalClinic typing violates approved solo-practice contract
        shell: bash
        run: |
          set +e
          node --test tests/solo-practice-semantics.test.mjs > /tmp/solo-red.log 2>&1
          status=$?
          set -e
          cat /tmp/solo-red.log
          if [ "$status" -eq 0 ]; then
            echo 'Expected the new solo-practice regression to fail before the source repair.' >&2
            exit 1
          fi
          grep -q 'independent MedicalClinic\|MedicalClinic' /tmp/solo-red.log

      - name: Repair canonical source of truth directly
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/canonical/source.mjs')
          text = path.read_text(encoding='utf-8')
          original = text

          text = text.replace('A5064828898', 'A5146521397')
          text = text.replace('https://www.ghezelbaash.ir/graph.jsonld#dataset',
                              'https://www.ghezelbaash.ir/graph.jsonld/dataset')
          text = text.replace(
              '<dt><strong>Medical Director / مدیر پزشکی</strong></dt><dd>Dr. Saeed Ghezelbash — دکتر سعید قزلباش</dd>',
              ''
          )

          clinic = 'https://www.ghezelbaash.ir/dr-saeed-ghezelbash-aesthetic-clinic-kermanshah'
          node_pattern = re.compile(
              r'(\n      \{\n        "@id": "' + re.escape(clinic) +
              r'",\n        "@type": \[\n)(.*?)(\n        \],)',
              re.S,
          )
          match = node_pattern.search(text)
          if not match:
              raise RuntimeError('Top-level canonical clinic/practice definition not found')
          type_block = match.group(2)
          type_block, removed_type = re.subn(
              r'\n\s*"(?:https://schema\.org/)?MedicalClinic"\s*,?', '', type_block, count=1
          )
          if removed_type != 1:
              raise RuntimeError('Expected exactly one MedicalClinic type in canonical practice definition')
          text = text[:match.start(2)] + type_block + text[match.end(2):]

          shape_start = text.find('ex:ClinicAssetShape a sh:NodeShape')
          shape_end = text.find('ex:WebPageDominanceShape a sh:NodeShape', shape_start)
          if shape_start < 0 or shape_end < 0:
              raise RuntimeError('ClinicAssetShape block not found')
          shape = text[shape_start:shape_end]
          shape, removed_shacl = re.subn(
              r'  sh:property \[ sh:path rdf:type ; sh:hasValue schema:MedicalClinic \] ;\\n',
              '', shape, count=1
          )
          if removed_shacl != 1:
              raise RuntimeError('Expected exactly one MedicalClinic requirement in ClinicAssetShape')
          text = text[:shape_start] + shape + text[shape_end:]

          if 'A5064828898' in text:
              raise RuntimeError('Stale OpenAlex ID still present in canonical source')
          if 'https://www.ghezelbaash.ir/graph.jsonld#dataset' in text:
              raise RuntimeError('Historical Dataset IRI still present in canonical source')
          if 'Medical Director / مدیر پزشکی' in text:
              raise RuntimeError('Legacy visible clinic Medical Director row still present')
          if text == original:
              raise RuntimeError('Canonical source unexpectedly required no repair')

          path.write_text(text, encoding='utf-8')
          print('Canonical source repaired directly')
          PY

      - name: Remove one-time workflow and commit repaired source
        run: |
          rm .github/workflows/one-time-canonical-dist-repair.yml
          git config user.name 'Dr. Saeed Ghezelbash | canonical repair'
          git config user.email 'medicaldoctor91@gmail.com'
          git add src/canonical/source.mjs .github/workflows/one-time-canonical-dist-repair.yml
          git diff --cached --check
          git commit -m 'Finalize canonical solo-practice and identity model'
          git push origin HEAD:main
          echo "FINAL_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: GREEN - validate source, build final dist, then validate projections
        run: |
          node --test tests/*.test.mjs
          npm run build
          python tests/validate_canonical_invariants.py dist
          python tests/validate_platform_bundle.py dist --no-query --rdf
          python tests/validate_machine_resources.py dist

      - name: Sweep built current outputs for forbidden legacy values
        run: |
          python - <<'PY'
          from pathlib import Path
          suffixes={'.html','.json','.jsonld','.ttl','.txt','.xml','.csv','.md','.vcf','.yaml','.yml','.rdf','.nt'}
          forbidden={
            'A5064828898':'stale OpenAlex',
            'https://www.ghezelbaash.ir/graph.jsonld#dataset':'historical Dataset IRI',
            'Medical Director / مدیر پزشکی':'legacy visible clinic role',
          }
          hits=[]
          for p in Path('dist').rglob('*'):
              if not p.is_file() or p.suffix.lower() not in suffixes: continue
              body=p.read_text(encoding='utf-8')
              for needle,label in forbidden.items():
                  if needle in body: hits.append((str(p),label,needle))
          if hits: raise RuntimeError(hits)
          print('Dist legacy sweep: clean')
          PY

      - name: Deploy validated dist to Cloudflare Pages
        run: |
          npx --yes wrangler@4 pages deploy dist \
            --project-name=doctor-ghezelbaash \
            --branch=main \
            --commit-hash="$FINAL_SHA" \
            --commit-message='Finalize canonical identity and solo-practice model' \
            --commit-dirty=false

      - name: Verify production converged to exact validated dist
        run: |
          python - <<'PY'
          import hashlib, json, os, time, urllib.request
          from pathlib import Path

          origin='https://www.ghezelbaash.ir/'
          sha=os.environ['FINAL_SHA']
          def fetch(path):
              req=urllib.request.Request(origin+path,headers={'Cache-Control':'no-cache','Pragma':'no-cache','User-Agent':'canonical-dist-verifier/1.0'})
              with urllib.request.urlopen(req,timeout=45) as r:
                  return r.read()

          for attempt in range(30):
              live=json.loads(fetch('release-provenance.json?verify='+sha+'-'+str(attempt)))
              if live.get('sourceCommit')==sha:
                  break
              time.sleep(5)
          else:
              raise RuntimeError('Production release did not converge to final source commit '+sha)

          names=['index.html','llms.txt','llms-full.txt','answers.txt','fact-map.json','graph.jsonld','graph.ttl','entity-facts.csv','knowledge.xml','shapes.ttl','dcat.ttl','datapackage.json','croissant.json','provenance.jsonld','integrity-manifest.json']
          for name in names:
              local=Path('dist')/name
              if not local.is_file():
                  continue
              remote=fetch(name+'?verify='+sha)
              if hashlib.sha256(remote).digest()!=hashlib.sha256(local.read_bytes()).digest():
                  raise RuntimeError('Production mismatch: '+name)

          llms=fetch('llms.txt?verify='+sha).decode('utf-8')
          html=fetch('?verify='+sha).decode('utf-8')
          graph_text=fetch('graph.jsonld?verify='+sha).decode('utf-8')
          for body,label in [(llms,'llms.txt'),(html,'homepage'),(graph_text,'graph.jsonld')]:
              if 'A5064828898' in body: raise RuntimeError(label+' still exposes stale OpenAlex')
              if 'https://www.ghezelbaash.ir/graph.jsonld#dataset' in body: raise RuntimeError(label+' still exposes historical Dataset IRI')
          if 'A5146521397' not in llms: raise RuntimeError('llms.txt missing canonical OpenAlex')
          if 'Medical Director / مدیر پزشکی' in html: raise RuntimeError('homepage still exposes legacy clinic role')

          data=json.loads(graph_text)
          clinic_id='https://www.ghezelbaash.ir/dr-saeed-ghezelbash-aesthetic-clinic-kermanshah'
          clinic=next(n for n in data['@graph'] if n.get('@id')==clinic_id)
          types=clinic.get('@type',[])
          if not isinstance(types,list): types=[types]
          if 'MedicalClinic' in types or 'https://schema.org/MedicalClinic' in types:
              raise RuntimeError('canonical practice is still typed MedicalClinic')
          print(json.dumps({'production':'VERIFIED','sourceCommit':sha,'openAlex':'A5146521397','datasetIri':'https://www.ghezelbaash.ir/graph.jsonld/dataset','soloPractice':True},sort_keys=True))
          PY

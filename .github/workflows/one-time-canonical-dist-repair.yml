name: One-time canonical dist-first repair

on:
  push:
    branches: [main]
    paths: [".github/workflows/one-time-canonical-dist-repair.yml"]

permissions:
  contents: write

concurrency:
  group: doctor-ghezelbaash-one-time-canonical-repair
  cancel-in-progress: false

jobs:
  repair-build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 884d1d90bd1fb6ecca14992c6c60d677
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          npm ci
          python -m pip install --disable-pip-version-check 'rdflib>=7,<8' 'pyshacl>=0.30,<1' 'mlcroissant==1.1.1'

      - name: RED - prove legacy MedicalClinic semantics are present
        shell: bash
        run: |
          set +e
          node --test tests/solo-practice-semantics.test.mjs > /tmp/solo-red.log 2>&1
          status=$?
          set -e
          cat /tmp/solo-red.log
          test "$status" -ne 0
          grep -q 'MedicalClinic' /tmp/solo-red.log

      - name: Repair canonical source directly
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/canonical/source.mjs')
          text = path.read_text(encoding='utf-8')
          original = text

          text = text.replace('A5064828898', 'A5146521397')
          text = text.replace('https://www.ghezelbaash.ir/graph.jsonld#dataset',
                              'https://www.ghezelbaash.ir/graph.jsonld/dataset')
          text = text.replace(
              '<dt><strong>Medical Director / مدیر پزشکی</strong></dt><dd>Dr. Saeed Ghezelbash — دکتر سعید قزلباش</dd>',
              ''
          )

          lines = text.splitlines(keepends=True)
          indexes = [
              i for i, line in enumerate(lines)
              if line.strip().rstrip(',') in {'"MedicalClinic"', '"https://schema.org/MedicalClinic"'}
          ]
          if len(indexes) != 1:
              raise RuntimeError(f'Expected exactly one graph MedicalClinic type line, found {len(indexes)}')
          removed_type = lines.pop(indexes[0]).strip()
          text = ''.join(lines)

          shacl_needle = '  sh:property [ sh:path rdf:type ; sh:hasValue schema:MedicalClinic ] ;\\n'
          count = text.count(shacl_needle)
          if count != 1:
              raise RuntimeError(f'Expected exactly one escaped MedicalClinic SHACL requirement, found {count}')
          text = text.replace(shacl_needle, '', 1)

          for forbidden in (
              'A5064828898',
              'https://www.ghezelbaash.ir/graph.jsonld#dataset',
              'Medical Director / مدیر پزشکی',
          ):
              if forbidden in text:
                  raise RuntimeError('Forbidden canonical residue: ' + forbidden)
          if text == original:
              raise RuntimeError('No canonical change produced')

          path.write_text(text, encoding='utf-8')
          print('Removed graph type:', removed_type)
          print('Removed one escaped MedicalClinic SHACL requirement')
          PY

      - name: GREEN - prove corrected source before commit
        run: node --test tests/solo-practice-semantics.test.mjs

      - name: Commit only canonical source and remove one-time workflow
        run: |
          rm .github/workflows/one-time-canonical-dist-repair.yml
          git config user.name 'Dr. Saeed Ghezelbash | canonical repair'
          git config user.email 'medicaldoctor91@gmail.com'
          git add src/canonical/source.mjs .github/workflows/one-time-canonical-dist-repair.yml
          git diff --cached --check
          git commit -m 'Finalize canonical solo-practice and identity model'
          git push origin HEAD:main
          echo "FINAL_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Build and validate final dist
        run: |
          node --test tests/*.test.mjs
          npm run build
          python tests/validate_canonical_invariants.py dist
          python tests/validate_platform_bundle.py dist --no-query --rdf
          python tests/validate_machine_resources.py dist
          python - <<'PY'
          from pathlib import Path
          suffixes={'.html','.json','.jsonld','.ttl','.txt','.xml','.csv','.md','.vcf','.yaml','.yml','.rdf','.nt'}
          forbidden=['A5064828898','https://www.ghezelbaash.ir/graph.jsonld#dataset','Medical Director / مدیر پزشکی']
          hits=[]
          for p in Path('dist').rglob('*'):
              if p.is_file() and p.suffix.lower() in suffixes:
                  body=p.read_text(encoding='utf-8')
                  hits += [(str(p),x) for x in forbidden if x in body]
          if hits: raise RuntimeError(hits)
          print('Dist legacy sweep: clean')
          PY

      - name: Deploy validated dist
        run: |
          npx --yes wrangler@4 pages deploy dist \
            --project-name=doctor-ghezelbaash \
            --branch=main \
            --commit-hash="$FINAL_SHA" \
            --commit-message='Finalize canonical identity and solo-practice model' \
            --commit-dirty=false

      - name: Verify production equals validated dist
        run: |
          python - <<'PY'
          import hashlib, json, os, time, urllib.request
          from pathlib import Path
          origin='https://www.ghezelbaash.ir/'
          sha=os.environ['FINAL_SHA']
          def fetch(path):
              req=urllib.request.Request(origin+path,headers={'Cache-Control':'no-cache','Pragma':'no-cache','User-Agent':'canonical-dist-verifier/1.0'})
              with urllib.request.urlopen(req,timeout=45) as r: return r.read()
          for attempt in range(30):
              live=json.loads(fetch('release-provenance.json?verify='+sha+'-'+str(attempt)))
              if live.get('sourceCommit')==sha: break
              time.sleep(5)
          else: raise RuntimeError('Production did not converge to '+sha)

          names=['index.html','llms.txt','llms-full.txt','answers.txt','fact-map.json','graph.jsonld','graph.ttl','entity-facts.csv','knowledge.xml','shapes.ttl','dcat.ttl','datapackage.json','croissant.json','provenance.jsonld','integrity-manifest.json']
          for name in names:
              local=Path('dist')/name
              if local.is_file():
                  remote=fetch(name+'?verify='+sha)
                  if hashlib.sha256(remote).digest()!=hashlib.sha256(local.read_bytes()).digest():
                      raise RuntimeError('Production mismatch: '+name)

          llms=fetch('llms.txt?verify='+sha).decode()
          html=fetch('?verify='+sha).decode()
          graph=json.loads(fetch('graph.jsonld?verify='+sha).decode())
          assert 'A5146521397' in llms and 'A5064828898' not in llms
          assert 'Medical Director / مدیر پزشکی' not in html
          clinic=next(n for n in graph['@graph'] if n.get('@id')=='https://www.ghezelbaash.ir/dr-saeed-ghezelbash-aesthetic-clinic-kermanshah')
          types=clinic.get('@type',[]); types=types if isinstance(types,list) else [types]
          assert 'MedicalClinic' not in types and 'https://schema.org/MedicalClinic' not in types
          print(json.dumps({'production':'VERIFIED','sourceCommit':sha,'openAlex':'A5146521397','datasetIri':'https://www.ghezelbaash.ir/graph.jsonld/dataset','soloPractice':True},sort_keys=True))
          PY

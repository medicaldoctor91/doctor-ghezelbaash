name: Materialize metadata-safe v1.2.2 responsive media experiment

on:
  push:
    branches: [main]
    paths: [.release/v122-responsive-media-v2-request.json]

permissions:
  contents: write

concurrency:
  group: doctor-ghezelbaash-v122-responsive-media-v2
  cancel-in-progress: true

env:
  EXPERIMENT_BRANCH: tmp/v122-responsive-media-experiment
  BASE_CANDIDATE_SHA: 2f79e4eb179c8415c28a2ace1a52c2c523b1c1cb

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: tmp/v122-responsive-media-experiment
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Pin clean base and install AVIF/WebP encoders
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$EXPERIMENT_BRANCH" release/v1.2.2-candidate
          test "$(git rev-parse origin/release/v1.2.2-candidate)" = "$BASE_CANDIDATE_SHA"
          test "$(git rev-parse HEAD)" = "$BASE_CANDIDATE_SHA"
          test -z "$(git status --porcelain)"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends imagemagick libavif-bin >/dev/null
          convert -version
          avifenc --version
          avifenc --help 2>&1 | head -80
          identify -list format | grep -E '^ *AVIF|^ *WEBP'
      - run: npm ci --ignore-scripts
      - name: Calibrate quality against existing 640/960 assets and generate metadata-complete variants
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/v122-media && mkdir -p /tmp/v122-media/ref /tmp/v122-media/candidates
          HERO_MASTER='public/media/images/physician/master/saeed-ghezelbaash-physician-portrait.55e6a60c60bc.jpg'
          CLINICAL_MASTER='public/media/images/physician/master/saeed-ghezelbaash-in-clinical-office.da2f60febc2e.jpg'
          HERO_A640='public/media/images/physician/saeed-ghezelbash-portrait-delivery-640.7b2b6ac2affa.avif'
          HERO_A960='public/media/images/physician/saeed-ghezelbash-portrait-960.497fc78613ac.avif'
          CLIN_A640='public/media/images/physician/saeed-ghezelbash-in-clinical-office-delivery-640.92cc73c7a8c8.avif'
          CLIN_A960='public/media/images/physician/saeed-ghezelbash-clinical-examination-960.c7b107d19e68.avif'
          HERO_W640='public/media/images/physician/saeed-ghezelbash-portrait-delivery-640.b267bddf872d.webp'
          HERO_W960='public/media/images/physician/saeed-ghezelbash-portrait-960.d67587e1de85.webp'
          CLIN_W640='public/media/images/physician/saeed-ghezelbash-in-clinical-office-delivery-640.87655757c9a5.webp'
          CLIN_W960='public/media/images/physician/saeed-ghezelbash-clinical-examination-960.db655b6d5de3.webp'
          for f in "$HERO_MASTER" "$CLINICAL_MASTER" "$HERO_A640" "$HERO_A960" "$CLIN_A640" "$CLIN_A960" "$HERO_W640" "$HERO_W960" "$CLIN_W640" "$CLIN_W960"; do test -f "$f"; done

          ssim(){ python - "$1" "$2" <<'PY'
          import re,subprocess,sys
          p=subprocess.run(['compare','-metric','SSIM',sys.argv[1],sys.argv[2],'null:'],capture_output=True,text=True)
          text=(p.stderr+'\n'+p.stdout).strip()
          for line in reversed(text.splitlines()):
              m=re.match(r'\s*([01](?:\.\d+)?)\b',line)
              if m:
                  print(m.group(1));break
          else:
              print(text,file=sys.stderr);raise SystemExit('SSIM metric missing')
          PY
          }
          threshold_for(){
            local master="$1" low="$2" high="$3" prefix="$4"
            convert "$master" -auto-orient -resize 640x -strip "/tmp/v122-media/ref/${prefix}-640.png"
            convert "$master" -auto-orient -resize 960x -strip "/tmp/v122-media/ref/${prefix}-960.png"
            local a b
            a=$(ssim "/tmp/v122-media/ref/${prefix}-640.png" "$low")
            b=$(ssim "/tmp/v122-media/ref/${prefix}-960.png" "$high")
            python - "$a" "$b" <<'PY'
          import sys
          a,b=map(float,sys.argv[1:]);print(f'{min(a,b):.8f}')
          PY
          }
          HERO_AVIF_MIN=$(threshold_for "$HERO_MASTER" "$HERO_A640" "$HERO_A960" hero-avif)
          CLIN_AVIF_MIN=$(threshold_for "$CLINICAL_MASTER" "$CLIN_A640" "$CLIN_A960" clinical-avif)
          HERO_WEBP_MIN=$(threshold_for "$HERO_MASTER" "$HERO_W640" "$HERO_W960" hero-webp)
          CLIN_WEBP_MIN=$(threshold_for "$CLINICAL_MASTER" "$CLIN_W640" "$CLIN_W960" clinical-webp)
          echo "BASELINE_SSIM hero_avif=$HERO_AVIF_MIN clinical_avif=$CLIN_AVIF_MIN hero_webp=$HERO_WEBP_MIN clinical_webp=$CLIN_WEBP_MIN"

          choose(){
            local master="$1" width="$2" fmt="$3" threshold="$4" logical="$5" metadata_source="$6" upper_source="$7"
            local ref="/tmp/v122-media/ref/${logical}.png"
            convert "$master" -auto-orient -resize "${width}x" -strip "$ref"
            local settings
            if [ "$fmt" = avif ]; then settings='36 34 32 30 28 26 24 22 20 18'; else settings='65 70 75 80 85 90 95'; fi
            local best='' best_bytes=999999999 best_setting='' best_ssim=''
            for q in $settings; do
              local out="/tmp/v122-media/candidates/${logical}-${q}.${fmt}"
              if [ "$fmt" = avif ]; then avifenc --min "$q" --max "$q" --speed 6 "$ref" "$out" >/dev/null; else convert "$ref" -quality "$q" "$out"; fi
              "$PWD/node_modules/.bin/exiftool" -config scripts/exiftool-entity.config -TagsFromFile "$metadata_source" -all:all -overwrite_original "$out" >/dev/null
              local score bytes ok
              score=$(ssim "$ref" "$out")
              bytes=$(stat -c%s "$out")
              ok=$(python - "$score" "$threshold" <<'PY'
          import sys
          print('yes' if float(sys.argv[1]) >= float(sys.argv[2]) else 'no')
          PY
              )
              echo "CANDIDATE_IMAGE logical=$logical fmt=$fmt setting=$q bytes=$bytes ssim=$score threshold=$threshold accepted=$ok"
              if [ "$ok" = yes ] && [ "$bytes" -lt "$best_bytes" ]; then best="$out";best_bytes="$bytes";best_setting="$q";best_ssim="$score";fi
            done
            test -n "$best"
            test "$best_bytes" -lt "$(stat -c%s "$upper_source")"
            local hash final
            hash=$(sha256sum "$best" | awk '{print substr($1,1,12)}')
            final="public/media/images/physician/${logical}.${hash}.${fmt}"
            cp "$best" "$final"
            echo "SELECTED_IMAGE logical=$logical fmt=$fmt setting=$best_setting bytes=$best_bytes ssim=$best_ssim upper_bytes=$(stat -c%s "$upper_source") path=$final"
            printf '%s\n' "$final" >>/tmp/v122-media/new-files.txt
          }

          choose "$HERO_MASTER" 720 avif "$HERO_AVIF_MIN" saeed-ghezelbash-portrait-720 "$HERO_A960" "$HERO_A960"
          choose "$HERO_MASTER" 800 avif "$HERO_AVIF_MIN" saeed-ghezelbash-portrait-800 "$HERO_A960" "$HERO_A960"
          choose "$HERO_MASTER" 720 webp "$HERO_WEBP_MIN" saeed-ghezelbash-portrait-720 "$HERO_W960" "$HERO_W960"
          choose "$HERO_MASTER" 800 webp "$HERO_WEBP_MIN" saeed-ghezelbash-portrait-800 "$HERO_W960" "$HERO_W960"
          choose "$CLINICAL_MASTER" 720 avif "$CLIN_AVIF_MIN" saeed-ghezelbash-clinical-examination-720 "$CLIN_A960" "$CLIN_A960"
          choose "$CLINICAL_MASTER" 800 avif "$CLIN_AVIF_MIN" saeed-ghezelbash-clinical-examination-800 "$CLIN_A960" "$CLIN_A960"
          choose "$CLINICAL_MASTER" 720 webp "$CLIN_WEBP_MIN" saeed-ghezelbash-clinical-examination-720 "$CLIN_W960" "$CLIN_W960"
          choose "$CLINICAL_MASTER" 800 webp "$CLIN_WEBP_MIN" saeed-ghezelbash-clinical-examination-800 "$CLIN_W960" "$CLIN_W960"
          test "$(wc -l </tmp/v122-media/new-files.txt)" -eq 8
          while read -r f; do sha=$(sha256sum "$f"|awk '{print $1}'); fp=$(basename "$f"|sed -E 's/.*\.([0-9a-f]{12})\.[^.]+$/\1/'); test "${sha:0:12}" = "$fp"; identify "$f"; done </tmp/v122-media/new-files.txt
      - name: Wire exact responsive candidates and expand media contract from 49 to 57
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re,subprocess
          root=Path('.')
          patterns=['saeed-ghezelbash-portrait-720.*.*','saeed-ghezelbash-portrait-800.*.*','saeed-ghezelbash-clinical-examination-720.*.*','saeed-ghezelbash-clinical-examination-800.*.*']
          files=[]
          for pat in patterns: files += list((root/'public/media/images/physician').glob(pat))
          assert len(files)==8,len(files)
          by={}
          for p in files:
              m=re.fullmatch(r'(.+)\.([0-9a-f]{12})\.(avif|webp)',p.name);assert m,p
              by[(m.group(1),m.group(3))]='/media/images/physician/'+p.name
          intro=Path('src/content-source/001-intro.html');s=intro.read_text()
          pairs=[
          ('/media/images/physician/saeed-ghezelbash-portrait-delivery-640.7b2b6ac2affa.avif 640w, /media/images/physician/saeed-ghezelbash-portrait-960.497fc78613ac.avif 960w',f'/media/images/physician/saeed-ghezelbash-portrait-delivery-640.7b2b6ac2affa.avif 640w, {by[("saeed-ghezelbash-portrait-720","avif")]} 720w, {by[("saeed-ghezelbash-portrait-800","avif")]} 800w, /media/images/physician/saeed-ghezelbash-portrait-960.497fc78613ac.avif 960w'),
          ('/media/images/physician/saeed-ghezelbash-portrait-delivery-640.b267bddf872d.webp 640w, /media/images/physician/saeed-ghezelbash-portrait-960.d67587e1de85.webp 960w',f'/media/images/physician/saeed-ghezelbash-portrait-delivery-640.b267bddf872d.webp 640w, {by[("saeed-ghezelbash-portrait-720","webp")]} 720w, {by[("saeed-ghezelbash-portrait-800","webp")]} 800w, /media/images/physician/saeed-ghezelbash-portrait-960.d67587e1de85.webp 960w'),
          ('/media/images/physician/saeed-ghezelbash-in-clinical-office-delivery-640.92cc73c7a8c8.avif 640w, /media/images/physician/saeed-ghezelbash-clinical-examination-960.c7b107d19e68.avif 960w',f'/media/images/physician/saeed-ghezelbash-in-clinical-office-delivery-640.92cc73c7a8c8.avif 640w, {by[("saeed-ghezelbash-clinical-examination-720","avif")]} 720w, {by[("saeed-ghezelbash-clinical-examination-800","avif")]} 800w, /media/images/physician/saeed-ghezelbash-clinical-examination-960.c7b107d19e68.avif 960w'),
          ('/media/images/physician/saeed-ghezelbash-in-clinical-office-delivery-640.87655757c9a5.webp 640w, /media/images/physician/saeed-ghezelbash-clinical-examination-960.db655b6d5de3.webp 960w',f'/media/images/physician/saeed-ghezelbash-in-clinical-office-delivery-640.87655757c9a5.webp 640w, {by[("saeed-ghezelbash-clinical-examination-720","webp")]} 720w, {by[("saeed-ghezelbash-clinical-examination-800","webp")]} 800w, /media/images/physician/saeed-ghezelbash-clinical-examination-960.db655b6d5de3.webp 960w')]
          for old,new in pairs:
              if s.count(old)!=1: raise SystemExit(f'intro target drift count={s.count(old)}')
              s=s.replace(old,new)
          intro.write_text(s)
          head=Path('src/data/templates/main-head.html');h=head.read_text();old=pairs[0][0];new=pairs[0][1]
          if h.count(old)!=1: raise SystemExit(f'head target drift count={h.count(old)}')
          head.write_text(h.replace(old,new))
          dims=Path('src/data/media-dimensions.tsv');d=dims.read_text().rstrip('\n')+'\n'
          for p in sorted(files):
              m=re.fullmatch(r'(.+)\.([0-9a-f]{12})\.(avif|webp)',p.name);logical=f'public/media/images/physician/{m.group(1)}.{m.group(3)}';wh=subprocess.check_output(['identify','-format','%w|%h',str(p)],text=True).strip();row=f'{logical}|{wh}'
              if logical+'|' in d: raise SystemExit(f'duplicate dimension logical {logical}')
              d+=row+'\n'
          dims.write_text(d)
          def replace_counts(path,repls):
              p=Path(path);x=p.read_text()
              for old,new in repls:
                  if x.count(old)!=1: raise SystemExit(f'{path} count drift for {old!r}: {x.count(old)}')
                  x=x.replace(old,new)
              p.write_text(x)
          replace_counts('scripts/sync-media-references.mjs',[("if(rasters.length!==49)throw new Error(`Expected 49 canonical raster assets, found ${rasters.length}`);","if(rasters.length!==57)throw new Error(`Expected 57 canonical raster assets, found ${rasters.length}`);")])
          replace_counts('scripts/validate-media.mjs',[
              ('if(expectedDimensions.size!==49)fail(`Expected dimension inventory drift: ${expectedDimensions.size}`);','if(expectedDimensions.size!==57)fail(`Expected dimension inventory drift: ${expectedDimensions.size}`);'),
              ('if(rasters.length!==49)fail(`Expected exactly 49 raster images, found ${rasters.length}`);','if(rasters.length!==57)fail(`Expected exactly 57 raster images, found ${rasters.length}`);'),
              ('if(logicalAssets.size!==49)fail(`Logical raster inventory drift: ${logicalAssets.size}`);','if(logicalAssets.size!==57)fail(`Logical raster inventory drift: ${logicalAssets.size}`);'),
              ('if(rows.length!==49)fail(`Embedded metadata row count drift: ${rows.length}`);','if(rows.length!==57)fail(`Embedded metadata row count drift: ${rows.length}`);'),
              ('if(currentHits<49)fail(`Entity Place ID metadata unexpectedly sparse: ${currentHits}`);','if(currentHits<57)fail(`Entity Place ID metadata unexpectedly sparse: ${currentHits}`);'),
              ("embeddedMetadataCoverage:'49/49',googleKnowledgeGraphRawIdCoverage:'49/49'","embeddedMetadataCoverage:'57/57',googleKnowledgeGraphRawIdCoverage:'57/57'")])
          PY
          git diff --check
          git status --short
      - name: Commit once then run full media source build and visible freeze proof
        shell: bash
        run: |
          set -euo pipefail
          git config user.name ghezelbaash-responsive-media-experiment
          git config user.email actions@users.noreply.github.com
          git add public/media/images/physician src/content-source/001-intro.html src/data/templates/main-head.html src/data/media-dimensions.tsv scripts/sync-media-references.mjs scripts/validate-media.mjs
          git commit -m 'Experiment with metadata-safe 720w and 800w responsive physician media'
          E=$(git rev-parse HEAD)
          test "$(git rev-parse HEAD^)" = "$BASE_CANDIDATE_SHA"
          export SOURCE_COMMIT="$E" CF_PAGES_COMMIT_SHA="$E" SOURCE_DATE_EPOCH=$(git show -s --format=%ct "$E") ASTRO_TELEMETRY_DISABLED=1
          npm run validate:media
          npm run validate:source
          npm run media:sync
          npm run build
          node scripts/validate-visible-freeze.mjs dist/index.html
          node scripts/validate-dist.mjs
          node scripts/validate-current-context.mjs dist
          node - <<'NODE'
          const fs=require('fs'),html=fs.readFileSync('dist/index.html','utf8');for(const w of [720,800])for(const stem of ['saeed-ghezelbash-portrait','saeed-ghezelbash-clinical-examination'])for(const ext of ['avif','webp'])if(!new RegExp(`${stem}-${w}\\.[0-9a-f]{12}\\.${ext}`).test(html))throw Error(`Missing ${stem}-${w}.${ext}`);const hero720=(html.match(/saeed-ghezelbash-portrait-720\.[0-9a-f]{12}\.avif 720w/g)||[]).length;if(hero720<2)throw Error(`Hero 720 AVIF must exist in preload+picture; got ${hero720}`);console.log(JSON.stringify({responsiveMediaSourceProof:'PASS',commit:process.env.SOURCE_COMMIT,htmlBytes:Buffer.byteLength(html),hero720Occurrences:hero720,mediaInventory:57}));
          NODE
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Push only fully proven experiment commit
        shell: bash
        run: |
          set -euo pipefail
          git push origin "HEAD:$EXPERIMENT_BRANCH"
          echo "RESPONSIVE_MEDIA_EXPERIMENT_V2_PROVEN sha=$(git rev-parse HEAD)"

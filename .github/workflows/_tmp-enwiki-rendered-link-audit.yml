name: Temporary rendered Wikiversity link audit
on:
  push:
    branches: [main]
    paths: ['.github/workflows/_tmp-enwiki-rendered-link-audit.yml']
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check --no-input requests==2.32.5 beautifulsoup4==4.13.4
      - name: Parse current rendered Wikipedia article
        shell: bash
        run: |
          python - <<'PY'
          import requests,json,os
          from bs4 import BeautifulSoup
          API='https://en.wikipedia.org/w/api.php'; H={'User-Agent':'GhezelbaashRenderedLinkAudit/1.0 (https://www.ghezelbaash.ir/)'}
          p={'action':'parse','page':'Botulinum toxin','prop':'text|revid','format':'json','formatversion':2}
          r=requests.get(API,params=p,headers=H,timeout=60); r.raise_for_status(); d=r.json()['parse']
          soup=BeautifulSoup(d['text'],'html.parser')
          links=[]
          for a in soup.find_all('a',href=True):
            href=a['href']; text=' '.join(a.stripped_strings)
            if 'wikiversity.org' in href.lower() or 'wikiversity' in text.lower():
              links.append({'text':text,'href':href,'title':a.get('title')})
          out={'revid':d.get('revid'),'wikiversity_links':links}
          os.makedirs('wikimedia',exist_ok=True)
          with open('wikimedia/_tmp-enwiki-rendered-link-audit.json','w',encoding='utf8') as f:json.dump(out,f,ensure_ascii=False,indent=2)
          print(json.dumps(out,ensure_ascii=False))
          PY
      - name: Commit snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add wikimedia/_tmp-enwiki-rendered-link-audit.json
          git commit -m 'Record temporary rendered Wikiversity link snapshot'
          git push

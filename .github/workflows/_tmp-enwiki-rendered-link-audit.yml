name: Temporary rendered Wikiversity link audit
on:
  push:
    branches: [main]
    paths: ['.github/workflows/_tmp-enwiki-rendered-link-audit.yml']
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check --no-input requests==2.32.5
      - name: Query parsed interwiki links
        shell: bash
        run: |
          python - <<'PY'
          import requests,json,os
          H={'User-Agent':'GhezelbaashRenderedLinkAudit/1.0 (https://www.ghezelbaash.ir/)'}
          def a(base,**p):
            p.update(format='json',formatversion=2); r=requests.get(base,params=p,headers=H,timeout=60); r.raise_for_status(); return r.json()
          EN='https://en.wikipedia.org/w/api.php'; WV='https://en.wikiversity.org/w/api.php'
          d=a(EN,action='parse',page='Botulinum toxin',prop='iwlinks|externallinks|wikitext')
          iw=d.get('parse',{}).get('iwlinks',[]); ext=d.get('parse',{}).get('externallinks',[]); wt=d.get('parse',{}).get('wikitext','')
          wvlinks=[x for x in iw if str(x.get('prefix','')).lower() in ('wikiversity','v') or 'wikiversity' in str(x).lower()]
          # Inspect possible default/redirect targets on Wikiversity.
          titles=['Botulinum toxin','Botulinum toxin in aesthetic medicine']
          q=a(WV,action='query',titles='|'.join(titles),redirects=1,prop='info|pageprops',converttitles=1)
          out={'wikiversity_interwiki_links':wvlinks,'wikiversity_external_links':[x for x in ext if 'wikiversity.org' in x.lower()],'source_contains_v_yes':'v=yes' in wt.lower(),'source_snippet':[line for line in wt.splitlines() if 'sister project links' in line.lower()][:5],'wikiversity_title_resolution':q.get('query',{})}
          os.makedirs('wikimedia',exist_ok=True)
          with open('wikimedia/_tmp-enwiki-rendered-link-audit.json','w',encoding='utf8') as f:json.dump(out,f,ensure_ascii=False,indent=2)
          print(json.dumps(out,ensure_ascii=False))
          PY
      - name: Commit snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add wikimedia/_tmp-enwiki-rendered-link-audit.json
          git commit -m 'Record temporary rendered Wikiversity link audit'
          git push

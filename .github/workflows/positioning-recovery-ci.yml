name: Positioning recovery regression
on:
  push:
    branches: [maintenance/positioning-recovery-20261017]
    paths:
      - .github/workflows/positioning-recovery-ci.yml
      - .github/scripts/platform_publish_positioning.py
      - tests/platform-positioning-recovery.test.py
      - tests/validate_platform_sync.py
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check 'pyarrow>=18,<23' 'pyyaml>=6,<7' 'rdflib>=7,<8' 'pyshacl>=0.30,<1' 'mlcroissant>=1.0.22,<2'
      - name: Positioning recovery regression
        run: python tests/platform-positioning-recovery.test.py

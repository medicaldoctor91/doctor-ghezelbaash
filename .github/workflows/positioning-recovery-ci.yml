name: Positioning recovery regression
on:
  push:
    branches: [maintenance/positioning-recovery-20261017]
    paths:
      - .github/workflows/positioning-recovery-ci.yml
      - .github/scripts/platform_bundle.py
      - .github/scripts/platform_publish.py
      - tests/platform-positioning-recovery.test.py
      - tests/platform-bundle-sync.test.py
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check 'pyarrow>=18,<23'
      - name: Positioning recovery regression
        run: python tests/platform-positioning-recovery.test.py

name: Current Google reputation refresh
on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: doctor-ghezelbaash-external-mutation
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
          cache: npm
      - name: Load platform contract
        run: node scripts/platform-contract.mjs export >> "$GITHUB_ENV"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14.6'
      - run: npm ci
      - name: Enforce high-severity dependency advisory gate
        run: npm run audit:dependencies
      - name: Resolve finalized current release and external identities
        shell: bash
        run: |
          set -euo pipefail
          RELEASE="$(node -p "require('./src/data/release.json').release")"
          PLACE_ID="$(node -p "require('./src/data/release.json').clinic.placeId")"
          HF_URL="$(node -p "require('./src/data/release.json').dataset.huggingFace.dataset")"
          HF_REPO="${HF_URL#https://huggingface.co/datasets/}"
          git fetch --tags --force origin
          git rev-parse -q --verify "refs/tags/v$RELEASE" >/dev/null
          printf 'RELEASE=%s\nPLACE_ID=%s\nHF_REPO=%s\n' "$RELEASE" "$PLACE_ID" "$HF_REPO" >> "$GITHUB_ENV"
      - name: Read Google Places and compose only on tuple change
        id: places
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GOOGLE_PLACES_API_KEY:-}"; echo "::add-mask::$GOOGLE_PLACES_API_KEY"
          curl --fail --silent --show-error -H "X-Goog-Api-Key: $GOOGLE_PLACES_API_KEY" -H 'X-Goog-FieldMask: id,rating,userRatingCount,businessStatus,movedPlace,movedPlaceId' "https://places.googleapis.com/v1/places/$PLACE_ID" > /tmp/place.json
          export GOOGLE_CHECKED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          node scripts/reputation.mjs google /tmp/place.json
      - name: Prove no-op poll made no public source mutation
        if: steps.places.outputs.changed != 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain -- src/data/volatile-facts.json src/content-source src/data/semantic/knowledge-graph.jsonld)"
          echo 'GOOGLE_REPUTATION_NO_PUBLIC_MUTATION_PASS'
      - name: Build and commit only the approved mutable observation
        if: steps.places.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm run release:prepare
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          export CF_PAGES_COMMIT_SHA="$(git rev-parse HEAD)"
          npm run build
          node scripts/reputation.mjs visible dist/index.html
          git diff --exit-code -- src/content-source src/data/semantic/knowledge-graph.jsonld src/data/service-registry.json src/data/answer-registry.json src/data/evidence-registry.json src/data/release.json
          test "$(git status --porcelain -- src/data/volatile-facts.json | wc -l | tr -d ' ')" = "1"
          git add src/data/volatile-facts.json
          git diff --cached --quiet && { echo '::error::changed=true but no volatile reputation diff was staged'; exit 1; }
          git config user.name ghezelbaash-reputation-bot
          git config user.email actions@users.noreply.github.com
          git commit -m "chore: update current Google reputation observation"
          git pull --rebase origin main
      - name: Push approved reputation observation
        if: steps.places.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GITHUB_TOKEN:-}"; echo "::add-mask::$GITHUB_TOKEN"
          GITHUB_AUTH="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $GITHUB_AUTH" push origin HEAD:main
          unset GITHUB_AUTH
      - name: Capture current public revision when source did not change
        if: steps.places.outputs.changed != 'true'
        shell: bash
        run: |
          set -euo pipefail
          printf 'PUBLISHED_REVISION=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Capture committed public revision when source changed
        if: steps.places.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          printf 'PUBLISHED_REVISION=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Rebuild exact published reputation revision
        if: steps.places.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout --detach "$PUBLISHED_REVISION"
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct "$PUBLISHED_REVISION")"
          export CF_PAGES_COMMIT_SHA="$PUBLISHED_REVISION"
          npm ci
          npm run audit:dependencies
          npm run build
          node scripts/reputation.mjs visible dist/index.html
      - name: Reconcile Cloudflare production only when a public revision changed
        if: steps.places.outputs.changed == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_EXPECTED_COMMIT: ${{ env.PUBLISHED_REVISION }}
          CF_EXPECTED_ENVIRONMENT: production
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"; echo "::add-mask::$CLOUDFLARE_API_TOKEN"
          node scripts/cloudflare-pages.mjs ensure --verify-config
          node scripts/cloudflare-pages.mjs ensure
          node scripts/cloudflare-pages.mjs verify --fresh-only
      - name: Prepare complete current Hugging Face distribution on tuple change
        if: steps.places.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .release/huggingface-live
          git clone --depth=1 "https://huggingface.co/datasets/$HF_REPO" .release/huggingface-live
          node scripts/huggingface.mjs prepare dist .release/huggingface-live
          node scripts/reputation.mjs sync-hf .release/huggingface-live
          git -C .release/huggingface-live config user.name ghezelbaash-reputation-bot
          git -C .release/huggingface-live config user.email actions@users.noreply.github.com
          git -C .release/huggingface-live add -A
          git -C .release/huggingface-live diff --cached --quiet || git -C .release/huggingface-live commit -m "Update current authority distribution after Google reputation observation"
      - name: Publish current Hugging Face reputation distribution
        if: steps.places.outputs.changed == 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN || secrets.HUGGINGFACE_TOKEN || secrets.HUGGING_FACE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${HF_TOKEN:-}"; echo "::add-mask::$HF_TOKEN"
          HF_AUTH="$(printf 'oauth2:%s' "$HF_TOKEN" | base64 -w0)"
          git -C .release/huggingface-live -c "http.https://huggingface.co/.extraheader=AUTHORIZATION: basic $HF_AUTH" push origin HEAD:main
          unset HF_AUTH
      - name: Verify Hugging Face convergence after mutation
        if: steps.places.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            if node scripts/verify-live.mjs current --hf-only; then
              echo "HF_CURRENT_SERVING_PASS attempt=$attempt"
              exit 0
            fi
            sleep 5
          done
          echo '::error::Hugging Face current observation did not converge after publish'
          exit 1
      - name: Verify exact Cloudflare deployment after mutation
        if: steps.places.outputs.changed == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"; echo "::add-mask::$CLOUDFLARE_API_TOKEN"
          if ! node scripts/cloudflare-pages.mjs verify; then
            echo '::warning::Production bytes stale after canonical Git deployment; purging edge cache and retrying exact byte verification.'
            python scripts/configure-cloudflare-edge.py --purge-cache-only
            sleep 30
            node scripts/cloudflare-pages.mjs verify
          fi
      - name: Verify public discovery convergence after mutation
        if: steps.places.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-live.mjs current --website-only
          if node scripts/verify-live.mjs discovery; then
            echo 'PUBLIC_DISCOVERY_REPUTATION_T0_PASS'
          else
            echo '::warning::T+0 public discovery sampled a stale edge after exact production bytes converged; T+2/T+5 gates remain authoritative.'
          fi
          sleep 120
          if node scripts/verify-live.mjs discovery; then
            echo 'PUBLIC_DISCOVERY_REPUTATION_T2_PASS'
          else
            echo '::warning::T+2 public discovery still sampled distributed edge drift; T+5 remains the hard gate.'
          fi
          sleep 180
          node scripts/verify-live.mjs discovery
          node scripts/verify-live.mjs current
          echo 'PUBLIC_DISCOVERY_REPUTATION_T5_HARD_PASS'

name: Current Google reputation refresh
on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: doctor-ghezelbaash-external-mutation
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0
          cache: npm
      - name: Load platform contract
        run: node scripts/export-platform-contract.mjs >> "$GITHUB_ENV"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - name: Resolve finalized current release and external identities
        shell: bash
        run: |
          set -euo pipefail
          RELEASE="$(node -p "require('./src/data/release.json').release")"
          PLACE_ID="$(node -p "require('./src/data/release.json').clinic.placeId")"
          HF_URL="$(node -p "require('./src/data/release.json').dataset.huggingFace.dataset")"
          HF_REPO="${HF_URL#https://huggingface.co/datasets/}"
          git fetch --tags --force origin
          git rev-parse -q --verify "refs/tags/v$RELEASE" >/dev/null
          printf 'RELEASE=%s\nPLACE_ID=%s\nHF_REPO=%s\n' "$RELEASE" "$PLACE_ID" "$HF_REPO" >> "$GITHUB_ENV"
      - name: Read Google Places and compose only on tuple change
        id: places
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GOOGLE_PLACES_API_KEY:-}"; echo "::add-mask::$GOOGLE_PLACES_API_KEY"
          curl --fail --silent --show-error -H "X-Goog-Api-Key: $GOOGLE_PLACES_API_KEY" -H 'X-Goog-FieldMask: id,rating,userRatingCount,businessStatus,movedPlace,movedPlaceId' "https://places.googleapis.com/v1/places/$PLACE_ID" > /tmp/place.json
          export GOOGLE_CHECKED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          node scripts/process-google-reputation.mjs /tmp/place.json
      - name: Prove no-op poll made no public source mutation
        if: steps.places.outputs.changed != 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain -- src/data/volatile-facts.json src/content-source src/data/semantic/knowledge-graph.jsonld)"
          echo 'GOOGLE_REPUTATION_NO_PUBLIC_MUTATION_PASS'
      - name: Build and publish only the approved mutable observation
        if: steps.places.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm run release:prepare
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          export CF_PAGES_COMMIT_SHA="$(git rev-parse HEAD)"
          npm run build
          node scripts/validate-visible-freeze.mjs dist/index.html
          git diff --exit-code -- src/content-source src/data/semantic/knowledge-graph.jsonld src/data/service-registry.json src/data/answer-registry.json src/data/retrieval/query-matrix-policy.json src/data/visible-contract.json .release/policy/authority-surface-contract.json
          git config user.name ghezelbaash-reputation-bot
          git config user.email actions@users.noreply.github.com
          git add src/data/volatile-facts.json
          git commit -m "Refresh live Google reputation observation"
          git push origin HEAD:main
      - name: Resolve authoritative main commit after observation processing
        if: steps.places.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          LIVE_SHA="$(git rev-parse HEAD)"
          REMOTE_SHA="$(git ls-remote origin 'refs/heads/main' | awk '{print $1}')"
          test "$REMOTE_SHA" = "$LIVE_SHA" || { echo "::error::Remote main drift: $REMOTE_SHA expected=$LIVE_SHA"; exit 1; }
          echo "LIVE_SHA=$LIVE_SHA" >> "$GITHUB_ENV"
          echo 'GOOGLE_REPUTATION_MAIN_CONVERGENCE_PASS'
      - name: Prove exact fresh Pages bytes before downstream synchronization
        if: steps.places.outputs.changed == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_EXPECTED_COMMIT: ${{ env.LIVE_SHA }}
          CF_EXPECTED_ENVIRONMENT: production
        shell: bash
        run: |
          set -euo pipefail
          node scripts/ensure-cloudflare-pages-git-deployment.mjs --verify-config
          node scripts/ensure-cloudflare-pages-git-deployment.mjs
          python scripts/configure-cloudflare-edge.py --purge-cache-only
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)" CF_PAGES_COMMIT_SHA="$LIVE_SHA" SOURCE_COMMIT="$LIVE_SHA"
          npm run build
          node scripts/verify-cloudflare-pages-deployment.mjs --fresh-only
          node scripts/validate-visible-freeze.mjs dist/index.html
          echo 'REPUTATION_FRESH_ORIGIN_PASS'
      - name: Reconcile Hugging Face live observation with authoritative main
        if: steps.places.outcome == 'success'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN || secrets.HUGGINGFACE_TOKEN || secrets.HUGGING_FACE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${HF_TOKEN:-}"; echo "::add-mask::$HF_TOKEN"
          rm -rf .release/huggingface-live
          git clone --depth=1 "https://oauth2:${HF_TOKEN}@huggingface.co/datasets/$HF_REPO" .release/huggingface-live
          node scripts/sync-hf-live-observations.mjs .release/huggingface-live
          git -C .release/huggingface-live config user.name ghezelbaash-reputation-bot
          git -C .release/huggingface-live config user.email actions@users.noreply.github.com
          git -C .release/huggingface-live add live_observations.csv live-observation-attestation.json
          git -C .release/huggingface-live diff --cached --quiet || git -C .release/huggingface-live commit -m "Reconcile current Google reputation observation"
          git -C .release/huggingface-live push origin HEAD:main
          for attempt in $(seq 1 12); do
            if node scripts/verify-current-serving.mjs --hf-only; then
              echo 'HF_CURRENT_OBSERVATION_CONVERGENCE_PASS'
              exit 0
            fi
            sleep 5
          done
          echo '::error::Hugging Face current observation did not converge after reconciliation'
          exit 1
      - name: Prove ordinary edge convergence after authority synchronization
        if: steps.places.outputs.changed == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_EXPECTED_COMMIT: ${{ env.LIVE_SHA }}
          CF_EXPECTED_ENVIRONMENT: production
        shell: bash
        run: |
          set -euo pipefail
          if ! node scripts/verify-cloudflare-pages-deployment.mjs; then
            echo '::warning::Fresh origin is exact but ordinary edge is stale; purging once more before final convergence proof.'
            python scripts/configure-cloudflare-edge.py --purge-cache-only
            sleep 90
            node scripts/verify-cloudflare-pages-deployment.mjs
          fi
          npm run verify:production
          node scripts/verify-current-serving.mjs --website-only
          node scripts/verify-public-discovery-freshness.mjs
          sleep 120
          node scripts/verify-public-discovery-freshness.mjs
          node scripts/verify-current-serving.mjs
          echo 'REPUTATION_CROSS_SURFACE_CONVERGENCE_PASS'

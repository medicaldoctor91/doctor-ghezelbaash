name: v1.2.2 one-shot JSON-LD deterministic RDF repair

on:
  push:
    branches: [main]
    paths:
      - '.release/jsonld-rdf-fix-request.json'

permissions:
  contents: write

env:
  CANDIDATE_BRANCH: release/v1.2.2-candidate
  PRE_PROMOTION_SHA: 236281fde493cdfaef5f8f1ad2bcaffbcd41c6fb

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: release/v1.2.2-candidate
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Reset only candidate to the proven pre-promotion release tree
        run: |
          set -euo pipefail
          git reset --hard "$PRE_PROMOTION_SHA"
          test "$(node -p "require('./package.json').version")" = 1.2.1
          test "$(node -e "process.stdout.write(require('./src/data/release.json').release)")" = 1.2.1
      - name: Capture old RDF semantics for independent equivalence proof
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm run rdf:deps
          npm run rdf:generate
          cp src/data/semantic/knowledge-graph.ttl /tmp/old-rdf.ttl
      - name: Replace cross-language RDF generation with one pinned JSON-LD/RDFC stack
        run: |
          set -euo pipefail
          npm install --save-dev --save-exact jsonld@9.0.0 rdf-canonize@5.0.0
          node - <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync('package.json'));
          p.scripts['rdf:generate']='node scripts/generate-rdf.mjs';
          p.scripts['validate:rdf-reproducibility']='node scripts/validate-rdf-byte-repro.mjs';
          fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n');
          NODE
          cat > scripts/generate-rdf.mjs <<'EOF'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          import jsonld from 'jsonld';
          import rdfCanonize from 'rdf-canonize';

          const source='src/data/semantic/knowledge-graph.jsonld';
          const target='src/data/semantic/knowledge-graph.ttl';
          const lockPath='src/data/semantic/rdf-lock.json';
          const release=JSON.parse(fs.readFileSync('src/data/release.json','utf8'));
          const doc=JSON.parse(fs.readFileSync(source,'utf8'));
          const raw=await jsonld.toRDF(doc,{format:'application/n-quads',safe:true});
          const canonical=await rdfCanonize.canonize(raw,{
            algorithm:'RDFC-1.0',
            inputFormat:'application/n-quads',
            format:'application/n-quads',
            maxWorkFactor:3,
            rejectURDNA2015:true,
          });
          const text=canonical.endsWith('\n')?canonical:canonical+'\n';
          fs.writeFileSync(target,text);
          const triples=text.split(/\r?\n/).filter(Boolean).length;
          const sha=b=>crypto.createHash('sha256').update(b).digest('hex');
          const lock={
            release:release.release,
            source,
            distribution:target,
            triples,
            jsonldSha256:sha(fs.readFileSync(source)),
            ttlSha256:sha(fs.readFileSync(target)),
            canonicalizedBlankNodes:true,
            jsonLdProcessor:'jsonld',
            jsonLdProcessorVersion:'9.0.0',
            canonicalizationAlgorithm:'RDFC-1.0',
            canonicalizationLibrary:'rdf-canonize',
            canonicalizationLibraryVersion:'5.0.0',
            canonicalSyntax:'canonical-n-quads-default-graph-as-ntriples-compatible-turtle',
            generated:release.dateModified,
          };
          fs.writeFileSync(lockPath,JSON.stringify(lock,null,2)+'\n');
          console.log(JSON.stringify(lock,null,2));
          EOF
          cat > scripts/validate-rdf-byte-repro.mjs <<'EOF'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          import {spawnSync} from 'node:child_process';
          const ttl='src/data/semantic/knowledge-graph.ttl',lock='src/data/semantic/rdf-lock.json';
          function run(){
            fs.rmSync(ttl,{force:true});fs.rmSync(lock,{force:true});
            const p=spawnSync(process.execPath,['scripts/generate-rdf.mjs'],{encoding:'utf8'});
            if(p.status!==0)throw new Error(p.stderr||p.stdout);
            const b=fs.readFileSync(ttl);return {b,h:crypto.createHash('sha256').update(b).digest('hex')};
          }
          const a=run(),b=run();
          if(!a.b.equals(b.b))throw new Error(`RDF same-tree byte reproducibility failed: ${a.h} != ${b.h}`);
          console.log(JSON.stringify({rdfByteReproducibility:'PASS',sha256:a.h,bytes:a.b.length}));
          EOF
          rm -f scripts/generate-rdf.py scripts/canonicalize-rdf.mjs
      - name: Prove semantic equivalence to the existing RDF graph
        run: |
          set -euo pipefail
          npm run rdf:generate
          PYTHONPATH=.python-deps python - <<'PY'
          from rdflib import Graph
          from rdflib.compare import to_isomorphic
          a=Graph(); a.parse('/tmp/old-rdf.ttl',format='nt')
          b=Graph(); b.parse('src/data/semantic/knowledge-graph.ttl',format='nt')
          assert len(a)==len(b),(len(a),len(b))
          assert to_isomorphic(a)==to_isomorphic(b),'JSON-LD→RDF semantic drift'
          print('RDF_SEMANTIC_EQUIVALENCE_PASS',len(a))
          PY
      - name: Harden release freeze and finish GitHub Release lifecycle
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/ceiling-release.yml'); s=p.read_text()
          old="""          rm -f .github/workflows/v122-bootstrap-registries.yml .github/workflows/v122-support-migration.yml .github/workflows/v122-cloudflare-control-bootstrap.yml .github/workflows/v122-external-preflight.yml .github/workflows/v122-zenodo-github-integration-probe.yml .github/workflows/v122-performance-baseline.yml scripts/bootstrap-v122-registries.mjs scripts/v122-filter-support.mjs
          git add -A
          git commit -m 'Release candidate v1.2.2 — DOI-bound maximum integrated stack'
          C=$(git rev-parse HEAD); echo \"SOURCE_COMMIT=$C\" >> \"$GITHUB_ENV\"
"""
          new="""          rm -f .github/workflows/v122-bootstrap-registries.yml .github/workflows/v122-support-migration.yml .github/workflows/v122-cloudflare-control-bootstrap.yml .github/workflows/v122-external-preflight.yml .github/workflows/v122-zenodo-github-integration-probe.yml .github/workflows/v122-performance-baseline.yml scripts/bootstrap-v122-registries.mjs scripts/v122-filter-support.mjs
          mapfile -t changed < <(git status --porcelain=v1 | sed -E 's/^.. //' | sed -E 's/.* -> //' | sort)
          allowed=(CITATION.cff README.md codemeta.json package-lock.json package.json public/favicon.svg public/media/brand/doctor-ghezelbaash-symbol.3a9e7509912d.svg public/safari-pinned-tab.svg src/content-source/100-rc099.html src/data/evidence-registry.json src/data/evidence-snapshot.json src/data/release-invariants.json src/data/release.json src/data/semantic/knowledge-graph.jsonld src/data/templates/main-head.html src/data/visible-contract.json src/data/volatile-facts.json)
          for path in \"${changed[@]}\"; do
            ok=false; for expected in \"${allowed[@]}\"; do [[ \"$path\" == \"$expected\" ]] && ok=true && break; done
            if [[ \"$ok\" != true ]]; then echo \"Unexpected release-freeze mutation: $path\" >&2; exit 1; fi
          done
          if ((${#changed[@]} > 0)); then
            git add -A -- \"${allowed[@]}\"; git diff --cached --check
            git commit -m \"Release candidate v$TARGET_VERSION — DOI-bound maximum integrated stack\"
          else echo 'No promotion diff exists; reusing current candidate commit.'; fi
          C=$(git rev-parse HEAD); echo \"SOURCE_COMMIT=$C\" >> \"$GITHUB_ENV\"
"""
          if old not in s: raise SystemExit('release-freeze block not found')
          s=s.replace(old,new)
          tail="""          node scripts/update-release-control.mjs \"$LEDGER\" VERIFIED sourceCommit=$SOURCE_COMMIT hfCommit=$HF_RELEASE_SHA
          git -C /tmp/v122-control add .release/control/v1.2.2.json && git -C /tmp/v122-control commit -m 'Verify v1.2.2 public serving and frozen snapshot truth' && git -C /tmp/v122-control push origin HEAD:$CONTROL_BRANCH
"""
          extra=tail+"""      - name: Publish verified GitHub Release and mark v1.2.2 COMPLETE
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release edit v1.2.2 --draft=false --latest
          gh release view v1.2.2 --json isDraft,tagName,targetCommitish,url > /tmp/github-release.json
          node -e \"const r=require('/tmp/github-release.json');if(r.isDraft!==false||r.tagName!=='v1.2.2')throw Error('GitHub Release publication drift');console.log('GITHUB_RELEASE_PUBLIC_PASS',r.url)\"
          node scripts/update-release-control.mjs \"$LEDGER\" GITHUB_RELEASE_PUBLISHED sourceCommit=$SOURCE_COMMIT
          git -C /tmp/v122-control add .release/control/v1.2.2.json && git -C /tmp/v122-control commit -m 'Publish verified GitHub v1.2.2 Release' && git -C /tmp/v122-control push origin HEAD:$CONTROL_BRANCH
          node scripts/update-release-control.mjs \"$LEDGER\" COMPLETE sourceCommit=$SOURCE_COMMIT hfCommit=$HF_RELEASE_SHA
          git -C /tmp/v122-control add .release/control/v1.2.2.json && git -C /tmp/v122-control commit -m 'Complete v1.2.2 external convergence release' && git -C /tmp/v122-control push origin HEAD:$CONTROL_BRANCH
"""
          if tail not in s: raise SystemExit('verification tail not found')
          p.write_text(s.replace(tail,extra))
          PY
      - name: Commit new RDF architecture before worktree proof
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package.json package-lock.json scripts/generate-rdf.mjs scripts/validate-rdf-byte-repro.mjs scripts/generate-rdf.py scripts/canonicalize-rdf.mjs .github/workflows/ceiling-release.yml
          git diff --cached --check
          git commit -m 'Generate canonical RDF from JSON-LD with one pinned JS stack'
          echo "FIX_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Prove exact RDF bytes in two clean worktrees of the same commit
        run: |
          set -euo pipefail
          rm -rf /tmp/rdfa /tmp/rdfb
          git worktree add --detach /tmp/rdfa "$FIX_SHA"
          git worktree add --detach /tmp/rdfb "$FIX_SHA"
          for w in /tmp/rdfa /tmp/rdfb; do
            (cd "$w" && npm ci --ignore-scripts >/dev/null && npm run rdf:generate >/dev/null && sha256sum src/data/semantic/knowledge-graph.ttl > "$w.sha")
          done
          A=$(cut -d' ' -f1 /tmp/rdfa.sha); B=$(cut -d' ' -f1 /tmp/rdfb.sha)
          echo "RDF_WORKTREE_A=$A RDF_WORKTREE_B=$B"
          test "$A" = "$B"
          cmp /tmp/rdfa/src/data/semantic/knowledge-graph.ttl /tmp/rdfb/src/data/semantic/knowledge-graph.ttl
          git worktree remove --force /tmp/rdfa
          git worktree remove --force /tmp/rdfb
      - name: Push only after cross-worktree byte proof
        run: |
          set -euo pipefail
          git push --force-with-lease origin HEAD:$CANDIDATE_BRANCH
          echo "JSONLD_RDFC_CANDIDATE_REPAIR_PASS $FIX_SHA"

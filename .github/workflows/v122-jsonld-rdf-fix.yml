name: v1.2.2 JSON-LD RDF repair

on:
  push:
    branches: [main]
    paths:
      - '.release/jsonld-rdf-fix-request.json'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: release/v1.2.2-candidate
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Reset candidate to pre-promotion tree
        run: |
          set -euo pipefail
          git reset --hard 236281fde493cdfaef5f8f1ad2bcaffbcd41c6fb
          test "$(node -p "require('./package.json').version")" = 1.2.1
      - name: Capture existing RDF semantics
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm run rdf:deps
          npm run rdf:generate
          cp src/data/semantic/knowledge-graph.ttl /tmp/old-rdf.ttl
      - name: Install one pinned JSON-LD and RDFC stack
        run: |
          set -euo pipefail
          npm install --save-dev --save-exact jsonld@9.0.0 rdf-canonize@5.0.0
          node - <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync('package.json'));
          p.scripts['rdf:generate']='node scripts/generate-rdf.mjs';
          p.scripts['validate:rdf-reproducibility']='node scripts/validate-rdf-byte-repro.mjs';
          fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n');
          NODE
      - name: Write deterministic Node RDF generator
        run: |
          set -euo pipefail
          cat > scripts/generate-rdf.mjs <<'EOF'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          import jsonld from 'jsonld';
          import rdfCanonize from 'rdf-canonize';
          const source='src/data/semantic/knowledge-graph.jsonld';
          const target='src/data/semantic/knowledge-graph.ttl';
          const lockPath='src/data/semantic/rdf-lock.json';
          const release=JSON.parse(fs.readFileSync('src/data/release.json','utf8'));
          const doc=JSON.parse(fs.readFileSync(source,'utf8'));
          const raw=await jsonld.toRDF(doc,{format:'application/n-quads',safe:true});
          const canonical=await rdfCanonize.canonize(raw,{algorithm:'RDFC-1.0',inputFormat:'application/n-quads',format:'application/n-quads',maxWorkFactor:3,rejectURDNA2015:true});
          const text=canonical.endsWith('\n')?canonical:canonical+'\n';
          fs.writeFileSync(target,text);
          const sha=b=>crypto.createHash('sha256').update(b).digest('hex');
          const lock={release:release.release,source,distribution:target,triples:text.split(/\r?\n/).filter(Boolean).length,jsonldSha256:sha(fs.readFileSync(source)),ttlSha256:sha(fs.readFileSync(target)),canonicalizedBlankNodes:true,jsonLdProcessor:'jsonld',jsonLdProcessorVersion:'9.0.0',canonicalizationAlgorithm:'RDFC-1.0',canonicalizationLibrary:'rdf-canonize',canonicalizationLibraryVersion:'5.0.0',canonicalSyntax:'canonical-n-quads-default-graph-as-ntriples-compatible-turtle',generated:release.dateModified};
          fs.writeFileSync(lockPath,JSON.stringify(lock,null,2)+'\n');
          console.log(JSON.stringify(lock,null,2));
          EOF
          cat > scripts/validate-rdf-byte-repro.mjs <<'EOF'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          import {spawnSync} from 'node:child_process';
          const ttl='src/data/semantic/knowledge-graph.ttl';
          const lock='src/data/semantic/rdf-lock.json';
          function run(){fs.rmSync(ttl,{force:true});fs.rmSync(lock,{force:true});const p=spawnSync(process.execPath,['scripts/generate-rdf.mjs'],{encoding:'utf8'});if(p.status!==0)throw new Error(p.stderr||p.stdout);const b=fs.readFileSync(ttl);return {b,h:crypto.createHash('sha256').update(b).digest('hex')}}
          const a=run(),b=run();
          if(!a.b.equals(b.b))throw new Error('same-tree RDF byte drift '+a.h+' '+b.h);
          console.log(JSON.stringify({rdfByteReproducibility:'PASS',sha256:a.h,bytes:a.b.length}));
          EOF
          rm -f scripts/generate-rdf.py scripts/canonicalize-rdf.mjs
      - name: Prove semantic equivalence and same-tree identity
        run: |
          set -euo pipefail
          npm run rdf:generate
          npm run validate:rdf-reproducibility
          PYTHONPATH=.python-deps python - <<'PY'
          from rdflib import Graph
          from rdflib.compare import to_isomorphic
          a=Graph(); a.parse('/tmp/old-rdf.ttl',format='nt')
          b=Graph(); b.parse('src/data/semantic/knowledge-graph.ttl',format='nt')
          assert len(a)==len(b),(len(a),len(b))
          assert to_isomorphic(a)==to_isomorphic(b),'semantic RDF drift'
          print('RDF_SEMANTIC_EQUIVALENCE_PASS',len(a))
          PY
      - name: Commit repair locally
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package.json package-lock.json scripts/generate-rdf.mjs scripts/validate-rdf-byte-repro.mjs scripts/generate-rdf.py scripts/canonicalize-rdf.mjs
          git diff --cached --check
          git commit -m 'Generate canonical RDF with one pinned JSON-LD stack'
          echo "FIX_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Prove exact bytes in two clean worktrees
        run: |
          set -euo pipefail
          rm -rf /tmp/rdfa /tmp/rdfb
          git worktree add --detach /tmp/rdfa "$FIX_SHA"
          git worktree add --detach /tmp/rdfb "$FIX_SHA"
          for w in /tmp/rdfa /tmp/rdfb; do
            (cd "$w" && npm ci --ignore-scripts >/dev/null && npm run rdf:generate >/dev/null && sha256sum src/data/semantic/knowledge-graph.ttl > "$w.sha")
          done
          A=$(cut -d' ' -f1 /tmp/rdfa.sha)
          B=$(cut -d' ' -f1 /tmp/rdfb.sha)
          echo "RDF_WORKTREE_A=$A RDF_WORKTREE_B=$B"
          test "$A" = "$B"
          cmp /tmp/rdfa/src/data/semantic/knowledge-graph.ttl /tmp/rdfb/src/data/semantic/knowledge-graph.ttl
          git worktree remove --force /tmp/rdfa
          git worktree remove --force /tmp/rdfb
      - name: Push only after all RDF proofs pass
        run: |
          set -euo pipefail
          git push --force-with-lease origin HEAD:release/v1.2.2-candidate
          echo "JSONLD_RDFC_REPAIR_PASS $FIX_SHA"

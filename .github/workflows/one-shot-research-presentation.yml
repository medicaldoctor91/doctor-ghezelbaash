name: One-shot visible research presentation

on:
  push:
    paths:
      - '.github/workflows/one-shot-research-presentation.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Verify and patch research passage
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_BLOB='d303cb3e8233af925f24a9bbb258c5ce810ad670'
          ACTUAL_BLOB="$(git hash-object src/pages/index.md)"
          test "$ACTUAL_BLOB" = "$EXPECTED_BLOB"

          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/pages/index.md')
          text = path.read_text(encoding='utf-8')
          heading_id = 'saeed-ghezelbash-research-education-and-clinical-decisions'
          title = 'Attachment style in dissociative depression'
          url = 'https://www.researchgate.net/publication/320409256_Attachment_style_in_dissociative_depression'

          start = text.find(f'id="{heading_id}"')
          if start < 0:
              raise SystemExit('research heading not found')
          next_h3 = text.find('<h3', start + 1)
          if next_h3 < 0:
              raise SystemExit('next h3 not found')
          section = text[start:next_h3]

          if title in section or url in section:
              raise SystemExit('presentation already present in visible research section')
          if 'pubmed.ncbi.nlm.nih.gov' not in section:
              raise SystemExit('PubMed article link not found in research section')
          if 'mdpi.com' not in section:
              raise SystemExit('MDPI article link not found in research section')

          md_pat = re.compile(r'(\[[^\]]+\]\(https://pubmed\.ncbi\.nlm\.nih\.gov/[^)]+\))')
          html_pat = re.compile(r'(<a\b[^>]*href="https://pubmed\.ncbi\.nlm\.nih\.gov/[^"]+"[^>]*>.*?</a>)', re.S)

          md = md_pat.search(section)
          html = html_pat.search(section)
          if bool(md) == bool(html):
              raise SystemExit('expected exactly one supported PubMed link form')

          if md:
              linked_title = f'[{title}]({url})'
              match = md
          else:
              # Mirror the existing visible external-link pattern without adding any extra destination.
              pubmed_anchor = html.group(1)
              rel = ''
              rel_match = re.search(r'\srel="([^"]+)"', pubmed_anchor)
              if rel_match:
                  rel = f' rel="{rel_match.group(1)}"'
              linked_title = f'<a href="{url}"{rel}>{title}</a>'
              match = html

          insertion = (
              match.group(1)
              + '، ارائه «'
              + linked_title
              + '» در هفدهمین کنگره جهانی روان‌پزشکی WPA در برلین در سال ۲۰۱۷'
          )

          patched_section = section[:match.start()] + insertion + section[match.end():]
          patched = text[:start] + patched_section + text[next_h3:]

          if patched.count(url) != 1:
              raise SystemExit('ResearchGate URL must appear exactly once after patch')
          if patched.count(title) != 1:
              raise SystemExit('presentation title must appear exactly once after patch')
          if 'Q140306302' in patched_section or 'Q140307274' in patched_section:
              raise SystemExit('Wikidata link/id unexpectedly added to visible research section')

          path.write_text(patched, encoding='utf-8')
          PY

          git diff --check
          test "$(git diff --name-only | wc -l)" -eq 1
          test "$(git diff --name-only)" = 'src/pages/index.md'
          grep -Fq 'https://www.researchgate.net/publication/320409256_Attachment_style_in_dissociative_depression' src/pages/index.md
          grep -Fq 'Attachment style in dissociative depression' src/pages/index.md

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/index.md
          git commit -m 'Add 2017 psychiatry congress presentation to visible research'
          git push origin HEAD:main

name: v1.2.2 release controller
on:
  push:
    branches: [main]
    paths: [.release/release-request-v1.2.2.json]
permissions:
  contents: write
concurrency:
  group: doctor-ghezelbaash-v122-controller
  cancel-in-progress: false
jobs:
  dispatch:
    runs-on: ubuntu-24.04
    steps:
      - name: Confirm request and dispatch authoritative release workflow
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run ceiling-release.yml --repo "$GITHUB_REPOSITORY"

name: Platform convergence hardening TDD
on:
  push:
    branches: [ops/platform-convergence-hardening-20261017-red]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Run hardening regression tests
        run: |
          python tests/platform-hardening.test.py
          python tests/platform-origin-binding.test.py
          python tests/hf-platform-assets.test.py

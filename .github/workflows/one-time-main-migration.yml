name: One-time production migration to main

on:
  push:
    branches: [main]
    paths: [.github/workflows/one-time-main-migration.yml]

permissions: {}

concurrency:
  group: one-time-production-branch-migration
  cancel-in-progress: false

jobs:
  migrate:
    if: github.repository == 'medicaldoctor91/doctor-ghezelbaash' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Migrate Pages, verify production, and retire the old branch
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import hashlib
          import json
          import os
          import subprocess
          import time
          import urllib.error
          import urllib.request

          REPO = "medicaldoctor91/doctor-ghezelbaash"
          OLD_SHA = "158d88cbe2469f1ff41c84dde1aeac2ecee6015e"
          SHA = os.environ["GITHUB_SHA"]
          CF_ROOT = "https://api.cloudflare.com/client/v4"
          GH_ROOT = "https://api.github.com"
          PROJECT = "/accounts/884d1d90bd1fb6ecca14992c6c60d677/pages/projects/doctor-ghezelbaash"
          GH_REPO = "/repos/" + REPO
          CF_TOKEN = os.environ.get("CLOUDFLARE_API_TOKEN", "")
          GH_TOKEN = os.environ.get("GH_TOKEN", "")
          if not CF_TOKEN or not GH_TOKEN:
              raise SystemExit("Required Cloudflare or GitHub token is unavailable; no changes made.")

          def api(service, path, method="GET", body=None, content_type=None):
              root, token = (CF_ROOT, CF_TOKEN) if service == "cf" else (GH_ROOT, GH_TOKEN)
              headers = {
                  "Authorization": "Bearer " + token,
                  "Accept": "application/json",
                  "User-Agent": "ghezelbaash-one-time-main-migration",
              }
              if service == "gh":
                  headers["X-GitHub-Api-Version"] = "2022-11-28"
              if isinstance(body, dict):
                  body = json.dumps(body).encode()
                  content_type = "application/json"
              if content_type:
                  headers["Content-Type"] = content_type
              request = urllib.request.Request(root + path, data=body, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(request, timeout=45) as response:
                      raw = response.read()
              except urllib.error.HTTPError as error:
                  # Never print response bodies, request headers, or secret-bearing configuration.
                  raise RuntimeError(f"{service} {method} {path}: HTTP {error.code}") from None
              payload = json.loads(raw) if raw else None
              if service == "cf":
                  if payload.get("success") is not True:
                      codes = [item.get("code") for item in payload.get("errors", [])]
                      raise RuntimeError(f"Cloudflare request failed: error codes {codes}")
                  return payload["result"]
              return payload

          def branch_sha(branch):
              return api("gh", GH_REPO + "/git/ref/heads/" + branch)["object"]["sha"]

          def ensure_heads():
              if branch_sha("main") != SHA or branch_sha("production") != OLD_SHA:
                  raise RuntimeError("Branch heads changed; stopping to preserve concurrent work.")

          def project_summary(project):
              config = project["source"]["config"]
              return {
                  "project": project["name"],
                  "production_branch": project["production_branch"],
                  "source_branch": config["production_branch"],
                  "repository": config["owner"] + "/" + config["repo_name"],
                  "build_command": project["build_config"]["build_command"],
                  "destination_dir": project["build_config"]["destination_dir"],
                  "preview_deployment_setting": config.get("preview_deployment_setting"),
              }

          def preserved_settings(project):
              source = json.loads(json.dumps(project["source"]))
              source["config"].pop("production_branch", None)
              return {
                  "source": source,
                  "build_config": project["build_config"],
                  "deployment_configs": project.get("deployment_configs"),
                  "domains": sorted(project.get("domains", [])),
              }

          def ensure_main(project):
              if project["production_branch"] != "main" or project["source"]["config"]["production_branch"] != "main":
                  raise RuntimeError("Cloudflare production branch did not converge to main.")
              if preserved_settings(project) != preserved:
                  raise RuntimeError("An unrelated project setting changed; stopping.")

          ensure_heads()
          repo = api("gh", GH_REPO)
          if repo["default_branch"] != "main":
              raise RuntimeError("Unexpected repository default branch.")
          comparison = api("gh", GH_REPO + "/compare/" + OLD_SHA + "..." + SHA)
          if comparison["status"] != "ahead" or comparison["behind_by"] != 0:
              raise RuntimeError("main does not contain the production history.")
          project = api("cf", PROJECT)
          print("PROJECT_BEFORE", json.dumps(project_summary(project)), flush=True)
          source = project["source"]
          config = source["config"]
          if project["name"] != "doctor-ghezelbaash" or source["type"] != "github":
              raise RuntimeError("Unexpected Pages project or source type.")
          if config["owner"] + "/" + config["repo_name"] != REPO:
              raise RuntimeError("Pages is connected to an unexpected repository.")
          if not config.get("deployments_enabled") or not config.get("production_deployments_enabled"):
              raise RuntimeError("Production deployments are disabled.")
          if project["production_branch"] not in ("production", "main"):
              raise RuntimeError("Unexpected current production branch.")
          preserved = preserved_settings(project)
          if project["production_branch"] != "main" or config["production_branch"] != "main":
              api("cf", PROJECT, "PATCH", {
                  "production_branch": "main",
                  "source": {"type": "github", "config": {"production_branch": "main"}},
              })
          project = api("cf", PROJECT)
          ensure_main(project)
          print("PROJECT_AFTER", json.dumps(project_summary(project)), flush=True)

          ensure_heads()
          candidates = api("cf", PROJECT + "/deployments?per_page=25")
          deployment = next((item for item in candidates if item.get("environment") == "production"
              and item.get("deployment_trigger", {}).get("metadata", {}).get("commit_hash") == SHA
              and not item.get("is_skipped")), None)
          if deployment is None:
              boundary = "main-migration-form-boundary"
              body = ("--" + boundary + "\r\nContent-Disposition: form-data; name=\"branch\"\r\n\r\nmain\r\n--" + boundary + "--\r\n").encode()
              deployment = api("cf", PROJECT + "/deployments", "POST", body, "multipart/form-data; boundary=" + boundary)
          deployment_id = deployment["id"]
          for attempt in range(90):
              deployment = api("cf", PROJECT + "/deployments/" + deployment_id)
              status = deployment.get("latest_stage", {}).get("status")
              print("DEPLOYMENT", deployment_id, status, flush=True)
              if status == "success":
                  break
              if status in ("failure", "canceled") or deployment.get("is_skipped"):
                  raise RuntimeError("main deployment failed or was skipped; old branch preserved.")
              time.sleep(10)
          else:
              raise RuntimeError("main deployment timed out; old branch preserved.")
          metadata = deployment["deployment_trigger"]["metadata"]
          if deployment["environment"] != "production" or metadata["branch"] != "main" or metadata["commit_hash"] != SHA:
              raise RuntimeError("Successful deployment does not match the intended main commit.")
          for attempt in range(12):
              project = api("cf", PROJECT)
              ensure_main(project)
              if project.get("canonical_deployment", {}).get("id") == deployment_id:
                  break
              time.sleep(5)
          else:
              raise RuntimeError("main deployment has not become the canonical production deployment.")
          expected_files = {
              "": "ad0a7aaa2cec6d9d91b73fc7e9a242a97b4771977efa3a72845d30f871a3bce7",
              "graph.jsonld": "c555add0b1648b9ba1ed298bef68eef17eded1311e135ffcf4bcf9392dc2acae",
              "assets/site.f7e10a1ed44f.css": "f7e10a1ed44fe6b04c21441bf72f9b375e017c5e1fcf46e3b47554e131c2b900",
          }
          for path, expected in expected_files.items():
              url = "https://www.ghezelbaash.ir/" + path
              public_bytes = subprocess.check_output(["curl", "--fail", "--silent", "--show-error", "--max-time", "45", url])
              actual = hashlib.sha256(public_bytes).hexdigest()
              if actual != expected:
                  raise RuntimeError("Live output changed for " + (path or "index.html"))
          print("LIVE_BYTES_UNCHANGED", flush=True)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write(f"Production now builds from `main` at `{SHA}`.\n\nDeployment: `{deployment_id}`.\n\nLive HTML, graph, and CSS match the verified distribution.\n")

          ensure_heads()
          rules = api("gh", GH_REPO + "/rules/branches/production")
          if any(rule.get("type") == "deletion" for rule in rules):
              print("PRODUCTION_BRANCH_PRESERVED: GitHub rules prohibit deletion. Pages migration is complete.", flush=True)
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
                  summary.write("\nThe old `production` branch remains because its GitHub rules prohibit deletion.\n")
          else:
              api("gh", GH_REPO + "/git/refs/heads/production", "DELETE")
              print("PRODUCTION_BRANCH_DELETED", flush=True)

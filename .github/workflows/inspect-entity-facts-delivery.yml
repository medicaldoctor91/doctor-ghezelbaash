name: Inspect exact entity-facts delivery after 1.3.6 cutover
on:
  push:
    branches: [codex/136-entity-facts-delivery-audit-20261121]
permissions:
  contents: read
concurrency:
  group: doctor-ghezelbaash-readonly-file-audit
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests
      - name: Compare direct, cache-busted and HF file bytes without external writes
        run: |
          python - <<'PY'
          import hashlib,json,time,os,requests,pathlib
          out=pathlib.Path('/tmp/entity-facts-delivery');out.mkdir(parents=True,exist_ok=True)
          origin='https://www.ghezelbaash.ir/'
          target='bcb7dbef6f5ec5a4d363159bfb5e3c6bb646f71e2f66ab10c710f2542d9bd31b'
          before='55ada1123a63dcdba375cf4b9aee9095b58decca864ca43bfc625dd83b0bc7c3'
          now=str(time.time_ns())
          reqs={
            'site_plain':origin+'entity-facts.csv',
            'site_cache_bust':origin+'entity-facts.csv?fresh136='+now,
            'site_cache_bust_again':origin+'entity-facts.csv?verify136='+now,
            'pages_default':'https://doctor-ghezelbaash.pages.dev/entity-facts.csv?probe='+now,
            'hf_new':'https://huggingface.co/datasets/doctor-ghezelbaash/dr-saeid-ghezelbaash-entity-data/resolve/4b0e805db359fe05e6c02214ae9a393f93599c4f/entity-facts.csv',
            'manifest':origin+'integrity-manifest.json',
            'provenance':origin+'release-provenance.json',
          }
          findings={}
          for name,url in reqs.items():
            try:
              r=requests.get(url,headers={'Cache-Control':'no-cache, no-store, max-age=0','Pragma':'no-cache','Accept-Encoding':'identity'},timeout=(12,55))
              b=r.content
              x={'status':r.status_code,'finalUrl':r.url,'sha256':hashlib.sha256(b).hexdigest(),'bytes':len(b),'contentType':r.headers.get('Content-Type'),'cacheStatus':r.headers.get('CF-Cache-Status'),'etag':r.headers.get('ETag'),'age':r.headers.get('Age'),'lastModified':r.headers.get('Last-Modified'),'server':r.headers.get('Server'),'expectedMatch':hashlib.sha256(b).hexdigest()==target,'oldMatch':hashlib.sha256(b).hexdigest()==before,'first64':repr(b[:64])}
              if name=='manifest' and r.ok:
                manifest=r.json();x['listedEntityFacts']=manifest.get('files',{}).get('/entity-facts.csv')
              if name=='provenance' and r.ok:x['sourceCommit']=r.json().get('sourceCommit')
              findings[name]=x
            except Exception as e:
              findings[name]={'error':type(e).__name__+': '+str(e)[:250]}
          (out/'report.json').write_text(json.dumps({'expectedSHA256':target,'previousSHA256':before,'observedUTC':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime()),'operations':'READ ONLY','observations':findings},indent=2,ensure_ascii=False))
          print((out/'report.json').read_text(),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: entity-facts-live-probe
          path: /tmp/entity-facts-delivery/report.json
          if-no-files-found: warn

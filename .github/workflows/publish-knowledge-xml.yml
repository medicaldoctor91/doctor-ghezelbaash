name: Publish the validated 1.3.6 knowledge XML correction
on:
  push:
    branches: [codex/knowledge-xml-publish-1-3-6]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: doctor-ghezelbaash-publication
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/codex/knowledge-xml-publish-1-3-6'
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      ARCHIVE_SOURCE_COMMIT: eafb138d596a91504ed0af66e2557f52848e36b6
      REVIEWED_SOURCE: 3853f71d8d49cbbba00eabaafd7b4a76093caac1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and validate the reviewed site source
        run: |
          git worktree add --detach "$RUNNER_TEMP/reviewed" "$REVIEWED_SOURCE"
          git diff --quiet "$REVIEWED_SOURCE" HEAD -- src public build package.json package-lock.json
          cd "$RUNNER_TEMP/reviewed"
          npm ci
          python -m pip install --disable-pip-version-check requests PyYAML 'six>=1.17,<2' 'pyarrow==22.0.0' 'kaggle==2.2.4' 'rdflib>=7,<8' 'pyshacl>=0.30,<1' 'mlcroissant==1.1.1' 'PyLD==3.3.0'
          npm run build
          node --test --test-concurrency=1 tests/*.test.mjs
          python tests/validate_machine_resources.py dist
          python tests/validate_canonical_invariants.py dist
      - name: Verify candidate packages and publish the three mutable distributions
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN || secrets.HUGGINGFACE_TOKEN || secrets.HUGGING_FACE_TOKEN }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN || secrets.KAGGLE_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 884d1d90bd1fb6ecca14992c6c60d677
        run: |
          python .github/scripts/publish_knowledge_xml.py "$RUNNER_TEMP/reviewed/dist" "$RUNNER_TEMP/xml-release" publish
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: knowledge-xml-publication-evidence
          path: |
            ${{ runner.temp }}/xml-release/*.json
            ${{ runner.temp }}/xml-release/website/integrity-manifest.json
          if-no-files-found: ignore

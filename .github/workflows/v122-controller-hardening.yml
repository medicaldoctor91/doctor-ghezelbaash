name: Materialize v1.2.2 controller hardening patches

on:
  push:
    branches: [main]
    paths: [.release/v122-controller-hardening-request.json]

permissions:
  contents: write

concurrency:
  group: doctor-ghezelbaash-external-mutation
  cancel-in-progress: false

env:
  CANDIDATE_BRANCH: release/v1.2.2-candidate

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Materialize hardened candidate and workflow payloads without GitHub-App workflow writes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name ghezelbaash-controller-hardener
          git config user.email actions@users.noreply.github.com
          git fetch origin "$CANDIDATE_BRANCH"
          rm -rf /tmp/v122-hardened
          git worktree add -B v122-hardening-work /tmp/v122-hardened "origin/$CANDIDATE_BRANCH"
          cp scripts/harden-v122-release-controller.py /tmp/v122-hardened/scripts/harden-v122-release-controller.py
          cd /tmp/v122-hardened
          python -m py_compile scripts/harden-v122-release-controller.py
          python scripts/harden-v122-release-controller.py
          node scripts/validate-release-controller.mjs
          node --check scripts/update-release-control.mjs
          node --check scripts/verify-release-proof-ledger.mjs
          node --check scripts/ensure-cloudflare-pages-git-deployment.mjs
          python -m py_compile scripts/zenodo_release.py
          mkdir -p .release/controller-patches
          cp .github/workflows/ceiling-release.yml .release/controller-patches/ceiling-release.yml.txt
          cp .github/workflows/v122-release-finalizer.yml .release/controller-patches/v122-release-finalizer.yml.txt
          cp .github/workflows/v122-release-trigger-binder.yml .release/controller-patches/v122-release-trigger-binder.yml.txt
          git checkout HEAD -- .github/workflows/ceiling-release.yml .github/workflows/v122-release-finalizer.yml
          rm -f .github/workflows/v122-release-trigger-binder.yml
          git add -A
          git diff --cached --check
          git commit -m 'Materialize non-workflow v1.2.2 controller hardening'
          git push origin HEAD:"$CANDIDATE_BRANCH"
          echo "V122_HARDENING_PAYLOAD_READY candidate=$(git rev-parse HEAD)"

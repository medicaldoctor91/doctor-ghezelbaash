name: Temporary Wikiversity item metadata audit
on:
  push:
    branches: [main]
    paths: ['.github/workflows/_tmp-wikiversity-item-metadata-audit.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check --no-input requests==2.32.5
      - name: Audit first revision and Wikidata modeling
        shell: bash
        run: |
          python - <<'PY'
          import requests,json
          s=requests.Session(); s.headers.update({'User-Agent':'GhezelbaashWikiversityMetadataAudit/1.0 (https://www.ghezelbaash.ir/)'})
          wv='https://en.wikiversity.org/w/api.php'; title='Botulinum toxin in aesthetic medicine'
          # oldest revision
          p={'action':'query','prop':'revisions','rvprop':'ids|timestamp|user|comment','rvdir':'newer','rvlimit':1,'titles':title,'format':'json','formatversion':2}
          r=s.get(wv,params=p,timeout=60); r.raise_for_status(); pg=r.json()['query']['pages'][0]; oldest=pg['revisions'][0]
          # current item
          wd='https://www.wikidata.org/w/api.php'
          r=s.get(wd,params={'action':'wbgetentities','ids':'Q141099455','props':'claims|labels|sitelinks','format':'json','formatversion':2},timeout=60); r.raise_for_status(); e=r.json()['entities']['Q141099455']
          def v(c):
            try:
              x=c['mainsnak']['datavalue']['value']
              if isinstance(x,dict) and 'id' in x: return x['id']
              if isinstance(x,dict) and 'time' in x: return x['time']
              return x
            except: return None
          claims={p:[v(c) for c in cs] for p,cs in e.get('claims',{}).items()}
          # Query comparable enwikiversity items; inspect these properties only.
          query='''SELECT ?item ?itemLabel ?p31 ?lang ?license ?date ?publishedIn WHERE {
            ?article schema:about ?item ; schema:isPartOf <https://en.wikiversity.org/> .
            OPTIONAL { ?item wdt:P31 ?p31 }
            OPTIONAL { ?item wdt:P407 ?lang }
            OPTIONAL { ?item wdt:P275 ?license }
            OPTIONAL { ?item wdt:P577 ?date }
            OPTIONAL { ?item wdt:P1433 ?publishedIn }
            SERVICE wikibase:label { bd:serviceParam wikibase:language "en". }
          } LIMIT 100'''
          sp=s.get('https://query.wikidata.org/sparql',params={'query':query,'format':'json'},headers={'Accept':'application/sparql-results+json'},timeout=90)
          sample=[]
          if sp.status_code==200:
            for row in sp.json()['results']['bindings']:
              sample.append({k:x.get('value') for k,x in row.items()})
          print(json.dumps({'oldest_revision':oldest,'current_claims':claims,'comparable_enwikiversity_sample':sample},ensure_ascii=False,indent=2,sort_keys=True))
          PY

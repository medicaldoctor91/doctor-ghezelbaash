name: Verify Commons team photo and person category

on:
  push:
    branches: [main]
    paths:
      - scripts/commons_strengthen_team_category.py
      - scripts/commons_strengthen_team_category_v2.py
      - scripts/commons_verify_team_category.py
      - .github/workflows/commons-strengthen-team-category.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: commons-strengthen-team-category
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install dependency
        run: python -m pip install --disable-pip-version-check --no-input requests==2.32.5
      - name: Read-only final Commons audit
        run: python scripts/commons_verify_team_category.py

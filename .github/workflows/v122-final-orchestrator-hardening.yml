name: v1.2.2 final orchestrator hardening
on:
  push:
    branches: [release/v1.2.2-candidate]
    paths: [.github/workflows/v122-final-orchestrator-hardening.yml]
permissions:
  contents: write
jobs:
  harden:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0
      - name: Harden Zenodo semantics and irreversible release orchestration
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const zf='scripts/zenodo_release.py';
          let z=fs.readFileSync(zf,'utf8');
          z=z.replace("{'identifier':'https://www.ghezelbaash.ir/graph.jsonld#dataset','relation':'isDerivedFrom','resource_type':'dataset'}","{'identifier':'https://www.ghezelbaash.ir/graph.jsonld#dataset','relation':'isIdenticalTo','resource_type':'dataset'}");
          z=z.replace("{'identifier':'https://www.wikidata.org/entity/Q140304972','relation':'isPartOf','resource_type':'dataset'}","{'identifier':'https://www.wikidata.org/entity/Q140304972','relation':'isIdenticalTo','resource_type':'dataset'}");
          if(!z.includes("graph.jsonld#dataset','relation':'isIdenticalTo'")||!z.includes("Q140304972','relation':'isIdenticalTo'"))throw new Error('Zenodo relation hardening did not apply');
          fs.writeFileSync(zf,z);

          const wf='.github/workflows/ceiling-release.yml';
          let s=fs.readFileSync(wf,'utf8');
          s=s.replace(/^\s*cp \.release\/huggingface\/dist-sha256\.json \.release\/runtime\/dist-sha256\.json\n/m,'');
          const finalGate=`          node scripts/validate-dist.mjs\n          node scripts/validate-visible-freeze.mjs dist/index.html`;
          if(!s.includes(finalGate))throw new Error('Final gate anchor missing');
          s=s.replace(finalGate,`          node scripts/validate-dist.mjs\n          node scripts/validate-query-matrix.mjs dist/query-matrix.jsonl\n          node scripts/validate-visible-freeze.mjs dist/index.html`);
          const cleanupOld=`          rm -f .github/workflows/v122-bootstrap-registries.yml .github/workflows/v122-support-migration.yml .github/workflows/v122-cloudflare-control-bootstrap.yml .github/workflows/v122-external-preflight.yml .github/workflows/v122-zenodo-github-integration-probe.yml .github/workflows/v122-performance-baseline.yml scripts/bootstrap-v122-registries.mjs scripts/v122-filter-support.mjs`;
          const cleanupNew=`          rm -f .github/workflows/v122-bootstrap-registries.yml .github/workflows/v122-support-migration.yml .github/workflows/v122-cloudflare-control-bootstrap.yml .github/workflows/v122-external-preflight.yml .github/workflows/v122-zenodo-github-integration-probe.yml .github/workflows/v122-performance-baseline.yml .github/workflows/v122-candidate-performance.yml .github/workflows/v122-promotion-simulation.yml .github/workflows/v122-query-collision-patch.yml .github/workflows/v122-final-orchestrator-hardening.yml scripts/bootstrap-v122-registries.mjs scripts/v122-filter-support.mjs`;
          if(!s.includes(cleanupOld))throw new Error('Candidate cleanup anchor missing');
          s=s.replace(cleanupOld,cleanupNew);
          const verified=`          node scripts/update-release-control.mjs "$LEDGER" VERIFIED sourceCommit=$SOURCE_COMMIT hfCommit=$HF_RELEASE_SHA\n          git -C /tmp/v122-control add .release/control/v1.2.2.json && git -C /tmp/v122-control commit -m 'Verify v1.2.2 public serving and frozen snapshot truth' && git -C /tmp/v122-control push origin HEAD:$CONTROL_BRANCH`;
          if(!s.includes(verified))throw new Error('Cooldown completion anchor missing');
          const completion=`          node scripts/update-release-control.mjs "$LEDGER" VERIFIED sourceCommit=$SOURCE_COMMIT hfCommit=$HF_RELEASE_SHA\n          git -C /tmp/v122-control add .release/control/v1.2.2.json && git -C /tmp/v122-control commit -m 'Verify v1.2.2 public serving and frozen snapshot truth' && git -C /tmp/v122-control push origin HEAD:$CONTROL_BRANCH\n      - name: Publish verified GitHub Release and normalize repository authority metadata\n        env:\n          GH_TOKEN: \${{ github.token }}\n        shell: bash\n        run: |\n          set -euo pipefail\n          gh release edit v1.2.2 --draft=false\n          gh release view v1.2.2 --json tagName,targetCommitish,isDraft,isPrerelease,url > /tmp/gh-release.json\n          node - <<'VERIFYGH'\n          const r=require('/tmp/gh-release.json');if(r.tagName!=='v1.2.2'||r.isDraft||r.isPrerelease)throw Error('GitHub Release publication drift');console.log('GITHUB_RELEASE_PASS',r.url)\n          VERIFYGH\n          gh api --method PATCH repos/$GITHUB_REPOSITORY -f description='Version-controlled source for Dr. Saeed Ghezelbash (Q140287622): physician-first knowledge graph, structured data, AI retrieval distribution tooling, provenance, and DOI-backed releases.' >/tmp/repo-update.json\n          cat > /tmp/topics.json <<'TOPICS'\n          {"names":["saeed-ghezelbash","dr-saeed-ghezelbaash","physician-entity","medical-knowledge-graph","knowledge-graph","entity-resolution","structured-data","linked-data","json-ld","rdf","schema-org","wikidata","ai-retrieval","rag","medical-dataset","aesthetic-medicine","botox","dermal-fillers","kermanshah","iran"]}\n          TOPICS\n          gh api --method PUT -H 'Accept: application/vnd.github+json' repos/$GITHUB_REPOSITORY/topics --input /tmp/topics.json >/tmp/topics-result.json\n          node scripts/update-release-control.mjs "$LEDGER" GITHUB_RELEASE_PUBLISHED sourceCommit=$SOURCE_COMMIT\n          git -C /tmp/v122-control add .release/control/v1.2.2.json && git -C /tmp/v122-control commit -m 'Publish GitHub v1.2.2 Release and authority metadata' && git -C /tmp/v122-control push origin HEAD:$CONTROL_BRANCH\n          node scripts/verify-current-serving.mjs\n          node scripts/verify-release-snapshot.mjs\n          node scripts/update-release-control.mjs "$LEDGER" COMPLETE sourceCommit=$SOURCE_COMMIT hfCommit=$HF_RELEASE_SHA\n          git -C /tmp/v122-control add .release/control/v1.2.2.json && git -C /tmp/v122-control commit -m 'Complete v1.2.2 external convergence' && git -C /tmp/v122-control push origin HEAD:$CONTROL_BRANCH`;
          s=s.replace(verified,completion);
          if(s.includes('cp .release/huggingface/dist-sha256.json .release/runtime/dist-sha256.json'))throw new Error('HF inventory overwrite remains');
          if(!s.includes('validate-query-matrix.mjs dist/query-matrix.jsonl')||!s.includes('GITHUB_RELEASE_PUBLISHED')||!s.includes(' COMPLETE sourceCommit='))throw new Error('Orchestrator hardening incomplete');
          fs.writeFileSync(wf,s);
          NODE
          python -m py_compile scripts/zenodo_release.py
          node -e "const fs=require('fs');const s=fs.readFileSync('.github/workflows/ceiling-release.yml','utf8');for(const t of ['isIdenticalTo','GITHUB_RELEASE_PUBLISHED','COMPLETE sourceCommit','validate-query-matrix.mjs dist/query-matrix.jsonl']){}"
          git config user.name ghezelbaash-release-bot
          git config user.email actions@users.noreply.github.com
          git add scripts/zenodo_release.py .github/workflows/ceiling-release.yml
          git diff --cached --quiet && exit 0
          git commit -m 'Harden final v1.2.2 release orchestration and Zenodo relations'
          git push origin HEAD:release/v1.2.2-candidate

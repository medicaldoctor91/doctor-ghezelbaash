name: One-shot reconcile Google inline structured-data contract

on:
  push:
    branches: [main]
    paths:
      - .release/patch-google-inline-contract.trigger

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.18.0
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - name: Apply separated source/full vs Google-inline invariants
        run: node scripts/patch-google-inline-contract.mjs
      - name: Validate exact patched source and DIST
        shell: bash
        run: |
          set -euo pipefail
          npm run prepare:generated
          npm run validate:release-contract
          npm run validate:source
          ASTRO_TELEMETRY_DISABLED=1 npx astro build
          npm run indexnow:prepare
          node scripts/finalize-dist.mjs
          npm run validate:cloudflare
          node scripts/validate-dist.mjs
          git diff --check
      - name: Commit only validated patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name ghezelbaash-release-bot
          git config user.email actions@users.noreply.github.com
          git add src/data/release-invariants.json scripts/validate-dist.mjs
          git diff --cached --quiet || git commit -m "Separate canonical support and Google inline clip invariants"
          git push origin HEAD:main

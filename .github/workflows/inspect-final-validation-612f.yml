name: Remove Cloudflare Pages analytics injection

on:
  pull_request:
    paths:
      - '.github/workflows/inspect-final-validation-612f.yml'

permissions:
  contents: read

jobs:
  patch-pages-project:
    runs-on: ubuntu-latest
    env:
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT_NAME: doctor-ghezelbaash
    steps:
      - name: Remove Pages Web Analytics configuration
        shell: bash
        run: |
          set -euo pipefail
          [ -n "$CF_API_TOKEN" ] || { echo 'CLOUDFLARE_API_TOKEN is missing' >&2; exit 1; }
          [ -n "$CF_ACCOUNT_ID" ] || { echo 'CLOUDFLARE_ACCOUNT_ID is missing' >&2; exit 1; }
          mkdir -p cloudflare-evidence
          endpoint="https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/pages/projects/$PROJECT_NAME"

          curl -sS --fail-with-body \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            "$endpoint" > cloudflare-evidence/before.raw.json

          jq '{success,errors,result:{name:.result.name,production_branch:.result.production_branch,build_config:{web_analytics_tag:.result.build_config.web_analytics_tag,web_analytics_token_present:(.result.build_config.web_analytics_token != null and .result.build_config.web_analytics_token != "")}}}' \
            cloudflare-evidence/before.raw.json > cloudflare-evidence/before.json

          curl -sS --fail-with-body -X PATCH \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            -H 'Content-Type: application/json' \
            --data '{"build_config":{"web_analytics_tag":null,"web_analytics_token":null}}' \
            "$endpoint" > cloudflare-evidence/patch.raw.json

          curl -sS --fail-with-body \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            "$endpoint" > cloudflare-evidence/after.raw.json

          jq '{success,errors,result:{name:.result.name,production_branch:.result.production_branch,build_config:{web_analytics_tag:.result.build_config.web_analytics_tag,web_analytics_token_present:(.result.build_config.web_analytics_token != null and .result.build_config.web_analytics_token != "")}}}' \
            cloudflare-evidence/after.raw.json > cloudflare-evidence/after.json

          jq -e '.success == true and (.result.build_config.web_analytics_tag == null or .result.build_config.web_analytics_tag == "") and .result.build_config.web_analytics_token_present == false' \
            cloudflare-evidence/after.json >/dev/null

          rm -f cloudflare-evidence/*.raw.json
          cat cloudflare-evidence/before.json
          cat cloudflare-evidence/after.json

      - name: Upload sanitized Cloudflare evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-pages-analytics-removal
          path: cloudflare-evidence/
          retention-days: 7

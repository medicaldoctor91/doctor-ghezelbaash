name: Canonical entity graph surgical repair

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/scripts/repair_entity_graph.py'
      - '.github/scripts/canonicalize_head_graph.py'
      - '.github/workflows/entity-graph-surgical-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: canonical-entity-graph-surgical-repair-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_VERSION: '24.18.0'
      RDFLIB_VERSION: '7.6.0'
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install project and RDF tooling
        run: |
          npm ci --no-audit --no-fund
          python3 -m pip install --quiet "rdflib==${RDFLIB_VERSION}"

      - name: Canonicalize Head Graph aliases
        run: python3 .github/scripts/canonicalize_head_graph.py

      - name: Apply canonical graph surgery
        run: python3 .github/scripts/repair_entity_graph.py

      - name: Build and validate repaired production tree
        run: |
          npm run build
          python3 .github/scripts/validate_source.py
          git diff --check

      - name: Commit validated repair and remove temporary tooling
        env:
          REPAIR_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          rm -f .github/scripts/repair_entity_graph.py
          rm -f .github/scripts/canonicalize_head_graph.py
          rm -f .github/workflows/entity-graph-surgical-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Repair canonical organization entities and machine projections"
          git push origin "HEAD:${REPAIR_BRANCH}"

name: Canonical entity graph surgical repair

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/entity-graph-surgical-fix.yml'

permissions:
  contents: write

concurrency:
  group: canonical-entity-graph-surgical-repair
  cancel-in-progress: true

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_VERSION: '24.18.0'
      RDFLIB_VERSION: '7.6.0'
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install project and RDF tooling
        run: |
          npm ci --no-audit --no-fund
          python3 -m pip install --quiet "rdflib==${RDFLIB_VERSION}"

      - name: Repair canonical graph and validation contracts
        shell: bash
        run: |
          python3 - <<'PY'
          from __future__ import annotations

          import base64
          import hashlib
          import json
          import re
          from copy import deepcopy
          from pathlib import Path
          from xml.etree import ElementTree as ET

          from rdflib import Graph
          from rdflib.compare import isomorphic

          BASE = "https://www.ghezelbaash.ir/"
          DATASET = BASE + "graph.jsonld#dataset"
          RELEASE_VERSION = "1.2.3"
          RELEASE_DATE = "2026-07-31"

          WPA = BASE + "#organization-world-psychiatric-association"
          DGPPN = BASE + "#organization-dgppn"
          WPA_QID = "https://www.wikidata.org/entity/Q2593790"
          DGPPN_QID = "https://www.wikidata.org/entity/Q1202963"
          WPA_URL = "https://www.wpanet.org/"
          DGPPN_URL = "https://www.dgppn.de/"

          ALIAS_MAP = {
              BASE + "#world-psychiatric-association": WPA,
              BASE + "#organization-american-psychiatric-association": WPA,
              BASE + "#dgppn": DGPPN,
              BASE + "#organization-german-psychiatric-association": DGPPN,
              BASE + "#organization-german-society-psychiatry": DGPPN,
          }
          FORBIDDEN_QIDS = {
              "Q1645764",
              "Q1683009",
              "https://www.wikidata.org/entity/Q1645764",
              "https://www.wikidata.org/entity/Q1683009",
          }
          INVALID_EVENT_STATUS = "https://schema.org/EventCompleted"
          DROP = object()

          def read_json(path: Path) -> dict:
              value = json.loads(path.read_text(encoding="utf-8"))
              if not isinstance(value, dict) or not isinstance(value.get("@graph"), list):
                  raise SystemExit(f"{path}: expected a JSON-LD object with @graph")
              return value

          def write_minified_json(path: Path, value: dict, trailing_newline: bool) -> str:
              text = json.dumps(value, ensure_ascii=False, separators=(",", ":"))
              if trailing_newline:
                  text += "\n"
              path.write_text(text, encoding="utf-8", newline="")
              return text

          def clean_value(value, *, parent_key: str | None = None):
              if isinstance(value, str):
                  if value in ALIAS_MAP:
                      return ALIAS_MAP[value]
                  if value in FORBIDDEN_QIDS:
                      return DROP
                  return value
              if isinstance(value, list):
                  output = []
                  for item in value:
                      cleaned = clean_value(item, parent_key=parent_key)
                      if cleaned is DROP:
                          continue
                      if cleaned not in output:
                          output.append(cleaned)
                  return output
              if isinstance(value, dict):
                  output = {}
                  for key, item in value.items():
                      if key == "eventStatus":
                          status = item.get("@id") if isinstance(item, dict) else item
                          if status == INVALID_EVENT_STATUS:
                              continue
                      cleaned = clean_value(item, parent_key=key)
                      if cleaned is DROP:
                          continue
                      output[key] = cleaned
                  return output
              return value

          def merge_values(left, right):
              if left == right:
                  return left
              if isinstance(left, dict) and isinstance(right, dict):
                  output = deepcopy(left)
                  for key, value in right.items():
                      if key not in output:
                          output[key] = deepcopy(value)
                      else:
                          output[key] = merge_values(output[key], value)
                  return output
              if isinstance(left, list) and isinstance(right, list):
                  output = deepcopy(left)
                  for value in right:
                      if value not in output:
                          output.append(deepcopy(value))
                  return output
              return deepcopy(left)

          def ensure_type(node: dict, required: str) -> None:
              value = node.get("@type")
              if isinstance(value, list):
                  if required not in value:
                      value.append(required)
              elif isinstance(value, str):
                  if value != required:
                      node["@type"] = [value, required]
              else:
                  node["@type"] = required

          def ensure_alt_name(node: dict, value: str) -> None:
              current = node.get("alternateName")
              if current is None:
                  node["alternateName"] = value
              elif isinstance(current, list):
                  if value not in current:
                      current.append(value)
              elif current != value:
                  node["alternateName"] = [current, value]

          def normalize_same_as(node: dict, canonical_qid: str) -> None:
              current = node.get("sameAs")
              values = current if isinstance(current, list) else ([] if current is None else [current])
              values = [
                  value for value in values
                  if isinstance(value, str)
                  and not value.startswith("https://www.wikidata.org/entity/")
                  and value not in FORBIDDEN_QIDS
              ]
              values.append(canonical_qid)
              deduped = []
              for value in values:
                  if value not in deduped:
                      deduped.append(value)
              node["sameAs"] = deduped[0] if len(deduped) == 1 else deduped

          def strings(value) -> set[str]:
              found: set[str] = set()
              stack = [value]
              while stack:
                  current = stack.pop()
                  if isinstance(current, str):
                      found.add(current)
                  elif isinstance(current, dict):
                      stack.extend(current.values())
                  elif isinstance(current, list):
                      stack.extend(current)
              return found

          def refs(value) -> set[str]:
              found: set[str] = set()
              stack = [value]
              while stack:
                  current = stack.pop()
                  if isinstance(current, dict):
                      identifier = current.get("@id")
                      if isinstance(identifier, str):
                          found.add(identifier)
                      stack.extend(current.values())
                  elif isinstance(current, list):
                      stack.extend(current)
              return found

          full_path = Path("public/graph.jsonld")
          head_path = Path("src/data/semantic/head-graph.min.jsonld")
          ttl_path = Path("public/graph.ttl")
          headers_path = Path("public/_headers")
          sitemap_path = Path("public/sitemap.xml")
          source_validator_path = Path(".github/scripts/validate_source.py")
          live_validator_path = Path(".github/scripts/validate_live.py")

          full_raw = full_path.read_text(encoding="utf-8")
          head_raw = head_path.read_text(encoding="utf-8")
          full = read_json(full_path)
          head = read_json(head_path)

          canonical_ids = {WPA, DGPPN}
          staged = []
          for position, node in enumerate(full["@graph"]):
              if not isinstance(node, dict):
                  staged.append((2, position, clean_value(node)))
                  continue
              original_id = node.get("@id")
              priority = 0 if original_id in canonical_ids else (1 if original_id in ALIAS_MAP else 2)
              cleaned = clean_value(node)
              if cleaned is DROP:
                  continue
              staged.append((priority, position, cleaned))

          staged.sort(key=lambda item: (item[0], item[1]))
          merged_nodes = []
          by_id: dict[str, dict] = {}
          for _priority, _position, node in staged:
              if not isinstance(node, dict) or not isinstance(node.get("@id"), str):
                  merged_nodes.append(node)
                  continue
              identifier = node["@id"]
              if identifier in by_id:
                  merged = merge_values(by_id[identifier], node)
                  by_id[identifier].clear()
                  by_id[identifier].update(merged)
              else:
                  by_id[identifier] = node
                  merged_nodes.append(node)
          full["@graph"] = merged_nodes

          by_id = {
              node["@id"]: node
              for node in full["@graph"]
              if isinstance(node, dict) and isinstance(node.get("@id"), str)
          }
          if WPA not in by_id or DGPPN not in by_id:
              raise SystemExit("canonical WPA or DGPPN node is absent after alias consolidation")

          wpa = by_id[WPA]
          ensure_type(wpa, "Organization")
          wpa["url"] = WPA_URL
          normalize_same_as(wpa, WPA_QID)
          ensure_alt_name(wpa, "WPA")

          dgppn = by_id[DGPPN]
          ensure_type(dgppn, "Organization")
          dgppn["url"] = DGPPN_URL
          normalize_same_as(dgppn, DGPPN_QID)
          ensure_alt_name(dgppn, "DGPPN")

          dataset = by_id.get(DATASET)
          if not isinstance(dataset, dict):
              raise SystemExit("Full Graph Dataset node is missing")
          dataset["version"] = RELEASE_VERSION
          dataset["dateModified"] = RELEASE_DATE

          head_by = {
              node["@id"]: node
              for node in head["@graph"]
              if isinstance(node, dict) and isinstance(node.get("@id"), str)
          }
          head_dataset = head_by.get(DATASET)
          if not isinstance(head_dataset, dict):
              raise SystemExit("Head Graph Dataset node is missing")
          head_dataset["version"] = RELEASE_VERSION
          head_dataset["dateModified"] = RELEASE_DATE

          full_ids = [
              node.get("@id")
              for node in full["@graph"]
              if isinstance(node, dict) and isinstance(node.get("@id"), str)
          ]
          if len(full_ids) != len(set(full_ids)):
              raise SystemExit("Full Graph still contains duplicate top-level @id values")
          if set(ALIAS_MAP) & refs(full):
              raise SystemExit(f"deprecated organization aliases remain: {sorted(set(ALIAS_MAP) & refs(full))}")
          graph_strings = strings(full)
          if FORBIDDEN_QIDS & graph_strings:
              raise SystemExit(f"forbidden unrelated Wikidata identifiers remain: {sorted(FORBIDDEN_QIDS & graph_strings)}")
          if WPA_QID not in strings(wpa) or DGPPN_QID not in strings(dgppn):
              raise SystemExit("canonical organization Wikidata identity is missing")

          old_head_hash = "'sha256-" + base64.b64encode(hashlib.sha256(head_raw.encode("utf-8")).digest()).decode("ascii") + "'"
          full_text = write_minified_json(full_path, full, full_raw.endswith("\n"))
          head_text = write_minified_json(head_path, head, head_raw.endswith("\n"))
          new_head_hash = "'sha256-" + base64.b64encode(hashlib.sha256(head_text.encode("utf-8")).digest()).decode("ascii") + "'"

          headers = headers_path.read_text(encoding="utf-8")
          if old_head_hash != new_head_hash:
              if headers.count(old_head_hash) != 1:
                  raise SystemExit(f"expected exactly one old Head Graph CSP hash, found {headers.count(old_head_hash)}")
              headers = headers.replace(old_head_hash, new_head_hash, 1)
              headers_path.write_text(headers, encoding="utf-8", newline="")

          rdf = Graph()
          rdf.parse(data=full_text, format="json-ld", publicID=BASE)
          ttl_text = rdf.serialize(format="turtle")
          if isinstance(ttl_text, bytes):
              ttl_text = ttl_text.decode("utf-8")
          if not ttl_text.endswith("\n"):
              ttl_text += "\n"
          ttl_path.write_text(ttl_text, encoding="utf-8", newline="")
          ttl_check = Graph()
          ttl_check.parse(data=ttl_text, format="turtle", publicID=BASE)
          if not isomorphic(rdf, ttl_check):
              raise SystemExit("regenerated Turtle projection is not RDF-isomorphic to Full Graph")

          sitemap = sitemap_path.read_text(encoding="utf-8")
          for target in ("graph.jsonld", "graph.ttl"):
              pattern = re.compile(
                  rf"(<loc>{re.escape(BASE + target)}</loc>\s*<lastmod>)([^<]+)(</lastmod>)"
              )
              sitemap, count = pattern.subn(rf"\g<1>{RELEASE_DATE}\g<3>", sitemap, count=1)
              if count != 1:
                  raise SystemExit(f"sitemap entry not found exactly once: {target}")
          sitemap_path.write_text(sitemap, encoding="utf-8", newline="")

          def replace_required(text: str, old: str, new: str, label: str) -> str:
              if new in text:
                  return text
              if text.count(old) != 1:
                  raise SystemExit(f"{label}: expected one replacement target, found {text.count(old)}")
              return text.replace(old, new, 1)

          source_validator = source_validator_path.read_text(encoding="utf-8")
          source_validator = replace_required(
              source_validator,
              'GRAPH_VERSION = "1.2.2"',
              'GRAPH_VERSION = "1.2.3"',
              "source validator graph version",
          )
          source_validator = source_validator.replace(
              'require(full_by.get(DATASET, {}).get("dateModified") == "2026-07-30", "Full Graph Dataset dateModified is stale")',
              'require(full_by.get(DATASET, {}).get("dateModified") == "2026-07-31", "Full Graph Dataset dateModified is stale")',
          )
          source_validator = source_validator.replace(
              'require(head_by.get(DATASET, {}).get("dateModified") == "2026-07-30", "Head Graph Dataset dateModified is stale")',
              'require(head_by.get(DATASET, {}).get("dateModified") == "2026-07-31", "Head Graph Dataset dateModified is stale")',
          )

          constants_marker = "# Canonical organization identity contract (release 1.2.3)"
          if constants_marker not in source_validator:
              anchor = 'GRAPH_VERSION = "1.2.3"\n'
              block = '''GRAPH_VERSION = "1.2.3"
# Canonical organization identity contract (release 1.2.3)
WPA = BASE + "#organization-world-psychiatric-association"
DGPPN = BASE + "#organization-dgppn"
WPA_QID = "https://www.wikidata.org/entity/Q2593790"
DGPPN_QID = "https://www.wikidata.org/entity/Q1202963"
DEPRECATED_ORGANIZATION_IDS = {
    BASE + "#world-psychiatric-association",
    BASE + "#organization-american-psychiatric-association",
    BASE + "#dgppn",
    BASE + "#organization-german-psychiatric-association",
    BASE + "#organization-german-society-psychiatry",
}
FORBIDDEN_ORGANIZATION_QIDS = {
    "Q1645764", "Q1683009",
    "https://www.wikidata.org/entity/Q1645764",
    "https://www.wikidata.org/entity/Q1683009",
}
'''
              if source_validator.count(anchor) != 1:
                  raise SystemExit("cannot insert source-validator organization constants")
              source_validator = source_validator.replace(anchor, block, 1)

          invariant_marker = "# Enforce canonical organization resolution and forbid semantic alias drift."
          if invariant_marker not in source_validator:
              anchor = 'head_by = {item["@id"]: item for item in head_nodes if isinstance(item, dict) and item.get("@id")}\n'
              block = anchor + '''
# Enforce canonical organization resolution and forbid semantic alias drift.
def string_values(value: object) -> set[str]:
    found: set[str] = set()
    stack = [value]
    while stack:
        current = stack.pop()
        if isinstance(current, str):
            found.add(current)
        elif isinstance(current, dict):
            stack.extend(current.values())
        elif isinstance(current, list):
            stack.extend(current)
    return found

all_full_ids = collect_ids(full)
require(not (DEPRECATED_ORGANIZATION_IDS & all_full_ids), f"deprecated organization aliases remain: {sorted(DEPRECATED_ORGANIZATION_IDS & all_full_ids)}")
all_full_strings = string_values(full)
require(not (FORBIDDEN_ORGANIZATION_QIDS & all_full_strings), f"unrelated Wikidata identifiers remain: {sorted(FORBIDDEN_ORGANIZATION_QIDS & all_full_strings)}")
require(WPA in full_by and DGPPN in full_by, "canonical WPA or DGPPN node is missing")
require(WPA_QID in string_values(full_by.get(WPA, {})), "WPA Wikidata identity is not Q2593790")
require(DGPPN_QID in string_values(full_by.get(DGPPN, {})), "DGPPN Wikidata identity is not Q1202963")
require(full_by.get(WPA, {}).get("url") == "https://www.wpanet.org/", "WPA official URL is incorrect")
require(full_by.get(DGPPN, {}).get("url") == "https://www.dgppn.de/", "DGPPN official URL is incorrect")
require(WPA in refs(full_by.get(EVENT, {}).get("organizer")), "WPA XVII organizer does not resolve to canonical WPA")
'''
              if source_validator.count(anchor) != 1:
                  raise SystemExit("cannot insert source-validator organization invariants")
              source_validator = source_validator.replace(anchor, block, 1)

          lastmod_marker = "# Machine-resource freshness is explicit and release-specific."
          if lastmod_marker not in source_validator:
              anchor = '    require(locations == expected_locations, f"sitemap discovery set differs from the canonical policy: {locations}")\n'
              block = anchor + '''    # Machine-resource freshness is explicit and release-specific.
    sitemap_lastmods = {
        url.findtext("sm:loc", namespaces=namespace): url.findtext("sm:lastmod", namespaces=namespace)
        for url in sitemap_root.findall("sm:url", namespace)
    }
    expected_lastmods = {
        BASE: "2026-07-30",
        BASE + "graph.jsonld": "2026-07-31",
        BASE + "graph.ttl": "2026-07-31",
        BASE + "llms.txt": "2026-07-30",
        BASE + "datasets/historical-patient-origin-summary.json": "2026-07-30",
    }
    require(sitemap_lastmods == expected_lastmods, f"sitemap lastmod contract differs from actual release dates: {sitemap_lastmods}")
'''
              if source_validator.count(anchor) != 1:
                  raise SystemExit("cannot insert sitemap lastmod contract")
              source_validator = source_validator.replace(anchor, block, 1)

          source_validator_path.write_text(source_validator, encoding="utf-8", newline="")

          live_validator = live_validator_path.read_text(encoding="utf-8")
          live_constants_marker = "# Canonical graph release and organization identities."
          if live_constants_marker not in live_validator:
              anchor = 'PAGES = "https://doctor-ghezelbaash.pages.dev/"\n'
              block = anchor + '''# Canonical graph release and organization identities.
GRAPH_RELEASE_VERSION = "1.2.3"
GRAPH_RELEASE_DATE = "2026-07-31"
GRAPH_DATASET = BASE + "graph.jsonld#dataset"
WPA = BASE + "#organization-world-psychiatric-association"
DGPPN = BASE + "#organization-dgppn"
WPA_QID = "https://www.wikidata.org/entity/Q2593790"
DGPPN_QID = "https://www.wikidata.org/entity/Q1202963"
DEPRECATED_ORGANIZATION_IDS = {
    BASE + "#world-psychiatric-association",
    BASE + "#organization-american-psychiatric-association",
    BASE + "#dgppn",
    BASE + "#organization-german-psychiatric-association",
    BASE + "#organization-german-society-psychiatry",
}
FORBIDDEN_ORGANIZATION_QIDS = {
    "Q1645764", "Q1683009",
    "https://www.wikidata.org/entity/Q1645764",
    "https://www.wikidata.org/entity/Q1683009",
}
'''
              if live_validator.count(anchor) != 1:
                  raise SystemExit("cannot insert live-validator graph constants")
              live_validator = live_validator.replace(anchor, block, 1)

          live_marker = "# Validate machine-resource indexability and canonical organization resolution."
          if live_marker not in live_validator:
              anchor = '    same_bytes("live robots.txt", robots.body, "public/robots.txt")\n'
              block = anchor + '''
    # Validate machine-resource indexability and canonical organization resolution.
    for label, response in (("graph", graph), ("ttl", ttl)):
        robots_header = response.header("x-robots-tag").lower()
        require("index" in robots_header and "follow" in robots_header and "noindex" not in robots_header, f"{label} is not explicitly index, follow: {robots_header or 'missing'}")
    try:
        live_full = json.loads(graph.body)
        live_nodes = live_full.get("@graph", []) if isinstance(live_full, dict) else []
        live_by = {
            node.get("@id"): node
            for node in live_nodes
            if isinstance(node, dict) and isinstance(node.get("@id"), str)
        }
        live_ids: set[str] = set()
        live_strings: set[str] = set()
        stack: list[object] = [live_full]
        while stack:
            current = stack.pop()
            if isinstance(current, str):
                live_strings.add(current)
            elif isinstance(current, dict):
                identifier = current.get("@id")
                if isinstance(identifier, str):
                    live_ids.add(identifier)
                stack.extend(current.values())
            elif isinstance(current, list):
                stack.extend(current)
        require(not (DEPRECATED_ORGANIZATION_IDS & live_ids), f"live graph exposes deprecated organization aliases: {sorted(DEPRECATED_ORGANIZATION_IDS & live_ids)}")
        require(not (FORBIDDEN_ORGANIZATION_QIDS & live_strings), f"live graph exposes unrelated Wikidata IDs: {sorted(FORBIDDEN_ORGANIZATION_QIDS & live_strings)}")
        require(WPA_QID in live_strings and DGPPN_QID in live_strings, "live graph lacks canonical WPA or DGPPN Wikidata identity")
        require(WPA in live_by and DGPPN in live_by, "live graph lacks canonical WPA or DGPPN node")
        live_dataset = live_by.get(GRAPH_DATASET, {})
        require(live_dataset.get("version") == GRAPH_RELEASE_VERSION, f"live graph version is not {GRAPH_RELEASE_VERSION}")
        require(live_dataset.get("dateModified") == GRAPH_RELEASE_DATE, f"live graph dateModified is not {GRAPH_RELEASE_DATE}")
    except Exception as exc:
        errors.append(f"live graph semantic validation failed: {exc}")
'''
              if live_validator.count(anchor) != 1:
                  raise SystemExit("cannot insert live graph semantic validation")
              live_validator = live_validator.replace(anchor, block, 1)

          live_validator_path.write_text(live_validator, encoding="utf-8", newline="")

          json.loads(full_path.read_text(encoding="utf-8"))
          json.loads(head_path.read_text(encoding="utf-8"))
          ET.parse(sitemap_path)
          print(json.dumps({
              "releaseVersion": RELEASE_VERSION,
              "releaseDate": RELEASE_DATE,
              "fullGraphNodes": len(full["@graph"]),
              "fullGraphBytes": full_path.stat().st_size,
              "headGraphBytes": head_path.stat().st_size,
              "ttlTriples": len(rdf),
              "headGraphCspHash": new_head_hash,
          }, ensure_ascii=False, indent=2))
          PY

      - name: Build and validate repaired production tree
        run: |
          npm run build
          python3 .github/scripts/validate_source.py
          git diff --check

      - name: Commit canonical repair and remove one-time workflow
        run: |
          rm -f .github/workflows/entity-graph-surgical-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/graph.jsonld public/graph.ttl public/_headers public/sitemap.xml \
                  src/data/semantic/head-graph.min.jsonld \
                  .github/scripts/validate_source.py .github/scripts/validate_live.py \
                  .github/workflows/entity-graph-surgical-fix.yml
          if git diff --cached --quiet; then
            echo "No canonical repair changes were required."
            exit 0
          fi
          git commit -m "Repair canonical organization entities and graph projections"
          git push origin HEAD:main

name: One-time canonical indexing and entity graph repair

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/entity-graph-surgical-fix.yml'
      - 'public/**'
      - 'src/data/semantic/**'
      - '.github/scripts/**'

permissions:
  contents: write

concurrency:
  group: one-time-entity-graph-repair-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install deterministic RDF tooling
        run: python -m pip install --quiet 'rdflib==7.6.0'

      - name: Apply surgical repair
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import json
          import re
          from copy import deepcopy
          from pathlib import Path
          from xml.etree import ElementTree as ET

          from rdflib import Graph, URIRef
          from rdflib.compare import isomorphic

          BASE = 'https://www.ghezelbaash.ir/'
          WPA = BASE + '#organization-world-psychiatric-association'
          WPA_ALIAS = BASE + '#world-psychiatric-association'
          DGPPN = BASE + '#organization-dgppn'
          DGPPN_ALIAS = BASE + '#dgppn'
          WPA_WIKIDATA = 'https://www.wikidata.org/entity/Q2593790'
          DGPPN_WIKIDATA = 'https://www.wikidata.org/entity/Q1202963'
          OBSOLETE = {
              WPA_ALIAS: WPA,
              DGPPN_ALIAS: DGPPN,
              'https://www.wikidata.org/entity/Q1645764': WPA_WIKIDATA,
              'https://www.wikidata.org/entity/Q1683009': WPA_WIKIDATA,
          }

          def read(path: str) -> str:
              return Path(path).read_text(encoding='utf-8')

          def write(path: str, text: str) -> None:
              Path(path).write_text(text, encoding='utf-8')

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{label}: expected one exact match, found {count}')
              return text.replace(old, new, 1)

          def map_value(value):
              if isinstance(value, str):
                  return OBSOLETE.get(value, value)
              if isinstance(value, list):
                  return [map_value(item) for item in value]
              if isinstance(value, dict):
                  return {key: map_value(item) for key, item in value.items()}
              return value

          def as_list(value):
              return value if isinstance(value, list) else [value]

          def merge_value(left, right):
              if left == right:
                  return left
              if isinstance(left, dict) and isinstance(right, dict):
                  if left.get('@id') and left.get('@id') == right.get('@id'):
                      merged = deepcopy(left)
                      for key, value in right.items():
                          merged[key] = merge_value(merged[key], value) if key in merged else deepcopy(value)
                      return merged
              merged = []
              for item in as_list(left) + as_list(right):
                  if item not in merged:
                      merged.append(deepcopy(item))
              return merged

          def repair_jsonld(path: str) -> None:
              payload = map_value(json.loads(read(path)))
              nodes = payload.get('@graph')
              if not isinstance(nodes, list):
                  raise RuntimeError(f'{path}: @graph is missing')

              merged_nodes = []
              by_id = {}
              for node in nodes:
                  if not isinstance(node, dict):
                      merged_nodes.append(node)
                      continue
                  node_id = node.get('@id')
                  if not node_id:
                      merged_nodes.append(node)
                      continue
                  if node_id not in by_id:
                      by_id[node_id] = node
                      merged_nodes.append(node)
                  else:
                      target = by_id[node_id]
                      for key, value in node.items():
                          target[key] = merge_value(target[key], value) if key in target else deepcopy(value)

              payload['@graph'] = merged_nodes
              by_id = {node.get('@id'): node for node in merged_nodes if isinstance(node, dict) and node.get('@id')}
              if WPA not in by_id or DGPPN not in by_id:
                  raise RuntimeError(f'{path}: canonical congress organizers are missing')

              by_id[WPA].update({
                  '@type': 'Organization',
                  'name': 'World Psychiatric Association',
                  'alternateName': 'WPA',
                  'url': 'https://www.wpanet.org/',
                  'sameAs': WPA_WIKIDATA,
              })
              by_id[DGPPN].update({
                  '@type': 'Organization',
                  'name': 'German Association for Psychiatry, Psychotherapy and Psychosomatics',
                  'alternateName': [
                      'DGPPN',
                      'Deutsche Gesellschaft für Psychiatrie und Psychotherapie, Psychosomatik und Nervenheilkunde',
                  ],
                  'url': 'https://www.dgppn.de/',
                  'sameAs': DGPPN_WIKIDATA,
              })

              ids = [node.get('@id') for node in merged_nodes if isinstance(node, dict) and node.get('@id')]
              if len(ids) != len(set(ids)):
                  raise RuntimeError(f'{path}: duplicate top-level @id values remain')
              serialized = json.dumps(payload, ensure_ascii=False, separators=(',', ':')) + '\n'
              for obsolete in OBSOLETE:
                  if obsolete in serialized:
                      raise RuntimeError(f'{path}: obsolete identity remains: {obsolete}')
              for required in (WPA, DGPPN, WPA_WIKIDATA, DGPPN_WIKIDATA):
                  if required not in serialized:
                      raise RuntimeError(f'{path}: required identity is absent: {required}')
              write(path, serialized)

          repair_jsonld('public/graph.jsonld')
          repair_jsonld('src/data/semantic/head-graph.min.jsonld')

          ttl_path = Path('public/graph.ttl')
          ttl_graph = Graph().parse(ttl_path, format='turtle')
          mapped = Graph()
          for prefix, namespace in ttl_graph.namespaces():
              mapped.bind(prefix, namespace, replace=True)

          def map_term(term):
              if isinstance(term, URIRef):
                  return URIRef(OBSOLETE.get(str(term), str(term)))
              return term

          for subject, predicate, obj in ttl_graph:
              mapped.add((map_term(subject), map_term(predicate), map_term(obj)))
          schema_same_as = URIRef('https://schema.org/sameAs')
          mapped.set((URIRef(WPA), schema_same_as, URIRef(WPA_WIKIDATA)))
          mapped.set((URIRef(DGPPN), schema_same_as, URIRef(DGPPN_WIKIDATA)))
          for obsolete in OBSOLETE:
              obsolete_ref = URIRef(obsolete)
              if any(mapped.triples((obsolete_ref, None, None))) or any(mapped.triples((None, None, obsolete_ref))):
                  raise RuntimeError(f'public/graph.ttl: obsolete IRI remains: {obsolete}')
          write('public/graph.ttl', mapped.serialize(format='turtle'))

          json_graph = Graph().parse('public/graph.jsonld', format='json-ld')
          ttl_graph = Graph().parse('public/graph.ttl', format='turtle')
          if not isomorphic(json_graph, ttl_graph):
              raise RuntimeError(f'JSON-LD/Turtle divergence after repair: {len(json_graph)} vs {len(ttl_graph)} triples')

          sitemap = read('public/sitemap.xml')
          for relative in ('graph.jsonld', 'graph.ttl', 'llms.txt', 'datasets/historical-patient-origin-summary.json'):
              escaped = re.escape(BASE + relative)
              sitemap, count = re.subn(r'\n?\s*<url>\s*<loc>' + escaped + r'</loc>[\s\S]*?</url>', '', sitemap, count=1)
              if count != 1:
                  raise RuntimeError(f'sitemap entry not found exactly once: {relative}')
          sitemap = sitemap.replace('<lastmod>2026-07-30</lastmod>', '<lastmod>2026-07-31</lastmod>', 1)
          locations = [node.text for node in ET.fromstring(sitemap).findall('{http://www.sitemaps.org/schemas/sitemap/0.9}url/{http://www.sitemaps.org/schemas/sitemap/0.9}loc')]
          if locations != [BASE]:
              raise RuntimeError(f'sitemap must expose only the canonical homepage: {locations}')
          write('public/sitemap.xml', sitemap.rstrip() + '\n')

          headers = read('public/_headers')
          for path in ('/graph.jsonld', '/graph.ttl', '/llms.txt', '/datasets/historical-patient-origin-summary.json'):
              pattern = re.compile(r'(?ms)^' + re.escape(path) + r'\n(?P<body>(?:  [^\n]*\n)+)')
              match = pattern.search(headers)
              if not match:
                  raise RuntimeError(f'header block missing: {path}')
              body = match.group('body')
              body, count = re.subn(r'^  X-Robots-Tag: index, follow, max-image-preview:large$', '  X-Robots-Tag: noindex, follow', body, count=1, flags=re.M)
              if count != 1:
                  raise RuntimeError(f'indexable directive missing in header block: {path}')
              headers = headers[:match.start('body')] + body + headers[match.end('body'):]
          write('public/_headers', headers)

          llms = read('public/llms.txt')
          replacements = {
              'its authoritative graph serializations, compact retrieval guide and canonical historical Dataset distribution are independently discoverable and indexable.': 'its authoritative graph serializations, compact retrieval guide and canonical historical Dataset distribution remain independently discoverable and crawlable, while document-level indexing is consolidated on the canonical homepage.',
              'Canonical, first-party, indexable JSON distribution of the historical geographic Dataset': 'Canonical first-party JSON distribution of the historical geographic Dataset',
              'This Dataset is an independently discoverable, indexable first-party research asset': 'This Dataset is an independently discoverable first-party research asset',
              '- `graph.jsonld`, `graph.ttl`, `llms.txt` and the canonical historical Dataset distribution are intentionally indexable and explicitly listed in the XML sitemap as authoritative first-party resources.': '- `graph.jsonld`, `graph.ttl`, `llms.txt` and the canonical historical Dataset distribution remain crawlable and explicitly discoverable from the canonical page, but use `noindex, follow` and stay out of the XML sitemap so document-level authority is consolidated on the homepage.',
          }
          for old, new in replacements.items():
              if old not in llms:
                  raise RuntimeError(f'llms.txt expected policy text missing: {old}')
              llms = llms.replace(old, new, 1)
          write('public/llms.txt', llms)

          dataset_path = 'public/datasets/historical-patient-origin-summary.json'
          dataset = json.loads(read(dataset_path))
          dataset['indexingPolicy'] = 'noindex, follow; canonical first-party Dataset distribution discoverable from the indexable homepage and excluded from the XML sitemap'
          write(dataset_path, json.dumps(dataset, ensure_ascii=False, indent=2) + '\n')

          validator = read('.github/scripts/validate_source.py')
          validator = replace_once(
              validator,
              'expected_locations = [BASE, BASE + "graph.jsonld", BASE + "graph.ttl", BASE + "llms.txt", BASE + "datasets/historical-patient-origin-summary.json"]',
              'expected_locations = [BASE]',
              'source validator sitemap policy',
          )
          validator = replace_once(
              validator,
              'require("index, follow" in indexing_policy and "noindex" not in indexing_policy.lower(), "raw historical Dataset indexing policy is not index, follow")',
              'require("noindex, follow" in indexing_policy.lower(), "raw historical Dataset indexing policy is not noindex, follow")',
              'source validator Dataset policy',
          )
          old_header_check = '''for path in ("/graph.jsonld", "/graph.ttl", "/llms.txt", "/datasets/historical-patient-origin-summary.json"):\n    block = header_block(path)\n    require("X-Robots-Tag: index, follow" in block, f"{path} is not explicitly indexable")\n    require("noindex" not in block.lower(), f"{path} is accidentally noindex")'''
          new_header_check = '''for path in ("/graph.jsonld", "/graph.ttl", "/llms.txt", "/datasets/historical-patient-origin-summary.json"):\n    block = header_block(path)\n    require("X-Robots-Tag: noindex, follow" in block, f"{path} is not a noindex, follow authority distribution")\n    require("X-Robots-Tag: index, follow" not in block, f"{path} competes with the canonical homepage for document indexing")'''
          validator = replace_once(validator, old_header_check, new_header_check, 'source validator machine-resource headers')
          old_llms_check = '''for marker in ("## Authoritative First-Party Dataset", HISTORICAL_DATASET, BASE + "datasets/historical-patient-origin-summary.json", "independently discoverable, indexable first-party research asset"):\n    require(marker in llms_index, f"llms.txt does not promote the historical Dataset: {marker}")\nrequire("supporting distribution" not in llms_index.lower() and "raw historical dataset distributions are intentionally crawlable but noindex" not in llms_index.lower(), "llms.txt still devalues the historical Dataset")'''
          new_llms_check = '''for marker in ("## Authoritative First-Party Dataset", HISTORICAL_DATASET, BASE + "datasets/historical-patient-origin-summary.json", "independently discoverable first-party research asset", "noindex, follow"):\n    require(marker in llms_index, f"llms.txt does not expose the historical Dataset and consolidated indexing policy: {marker}")\nrequire("independently discoverable, indexable" not in llms_index.lower(), "llms.txt still assigns competing document indexability to a machine distribution")'''
          validator = replace_once(validator, old_llms_check, new_llms_check, 'source validator llms policy')
          old_rdf_check = '''try:\n    json_graph = Graph().parse("public/graph.jsonld", format="json-ld")\n    ttl_graph = Graph().parse("public/graph.ttl", format="turtle")\n    require(isomorphic(json_graph, ttl_graph), f"Full JSON-LD and Turtle are not RDF-isomorphic ({len(json_graph)} vs {len(ttl_graph)} triples)")\nexcept Exception as exc:\n    errors.append(f"RDF parse/equivalence failure: {exc}")'''
          new_rdf_check = '''graph_json_text = read_text("public/graph.jsonld")\ngraph_ttl_text = read_text("public/graph.ttl")\nfor obsolete in (\n    BASE + "#world-psychiatric-association",\n    BASE + "#dgppn",\n    "https://www.wikidata.org/entity/Q1645764",\n    "https://www.wikidata.org/entity/Q1683009",\n):\n    require(obsolete not in graph_json_text and obsolete not in graph_ttl_text, f"obsolete or false organization identity remains: {obsolete}")\nfor required_identity in (\n    BASE + "#organization-world-psychiatric-association",\n    BASE + "#organization-dgppn",\n    "https://www.wikidata.org/entity/Q2593790",\n    "https://www.wikidata.org/entity/Q1202963",\n):\n    require(required_identity in graph_json_text and required_identity in graph_ttl_text, f"canonical organization identity is absent: {required_identity}")\n\ntry:\n    full_payload = json.loads(graph_json_text)\n    full_ids = [node.get("@id") for node in full_payload.get("@graph", []) if isinstance(node, dict) and node.get("@id")]\n    require(len(full_ids) == len(set(full_ids)), "duplicate top-level @id values found in Full Graph")\n    json_graph = Graph().parse(data=graph_json_text, format="json-ld")\n    ttl_graph = Graph().parse(data=graph_ttl_text, format="turtle")\n    require(isomorphic(json_graph, ttl_graph), f"Full JSON-LD and Turtle are not RDF-isomorphic ({len(json_graph)} vs {len(ttl_graph)} triples)")\nexcept Exception as exc:\n    errors.append(f"RDF parse/equivalence failure: {exc}")'''
          validator = replace_once(validator, old_rdf_check, new_rdf_check, 'source validator RDF identity contract')
          write('.github/scripts/validate_source.py', validator)

          live_validator = read('.github/scripts/validate_live.py')
          live_validator = replace_once(
              live_validator,
              'from urllib.parse import urljoin\n',
              'from urllib.parse import urljoin\nfrom xml.etree import ElementTree as ET\n',
              'live validator XML import',
          )
          old_live_headers = '''    require("graph.ttl" in graph.header("link") and "alternate" in graph.header("link"), "graph Link header lacks Turtle alternate")\n    require("graph.jsonld" in ttl.header("link") and "alternate" in ttl.header("link"), "Turtle Link header lacks JSON-LD alternate")'''
          new_live_headers = '''    require("graph.ttl" in graph.header("link") and "alternate" in graph.header("link"), "graph Link header lacks Turtle alternate")\n    require("graph.jsonld" in ttl.header("link") and "alternate" in ttl.header("link"), "Turtle Link header lacks JSON-LD alternate")\n    for label, response in (("graph", graph), ("ttl", ttl)):\n        require("noindex" in response.header("x-robots-tag").lower(), f"{label} authority distribution competes with the canonical homepage for indexing")'''
          live_validator = replace_once(live_validator, old_live_headers, new_live_headers, 'live validator graph noindex contract')
          old_live_bytes = '''    same_bytes("live graph.jsonld", graph.body, "public/graph.jsonld")\n    same_bytes("live graph.ttl", ttl.body, "public/graph.ttl")\n    same_bytes("live sitemap.xml", sitemap.body, "public/sitemap.xml")\n    same_bytes("live robots.txt", robots.body, "public/robots.txt")'''
          new_live_bytes = '''    same_bytes("live graph.jsonld", graph.body, "public/graph.jsonld")\n    same_bytes("live graph.ttl", ttl.body, "public/graph.ttl")\n    same_bytes("live sitemap.xml", sitemap.body, "public/sitemap.xml")\n    same_bytes("live robots.txt", robots.body, "public/robots.txt")\n    sitemap_root = ET.fromstring(sitemap.body)\n    sitemap_locations = [node.text for node in sitemap_root.findall("{http://www.sitemaps.org/schemas/sitemap/0.9}url/{http://www.sitemaps.org/schemas/sitemap/0.9}loc")]\n    require(sitemap_locations == [BASE], f"live sitemap exposes non-canonical search documents: {sitemap_locations}")\n    graph_text = graph.body.decode("utf-8", errors="replace")\n    ttl_text = ttl.body.decode("utf-8", errors="replace")\n    for obsolete in (BASE + "#world-psychiatric-association", BASE + "#dgppn", "Q1645764", "Q1683009"):\n        require(obsolete not in graph_text and obsolete not in ttl_text, f"live graph retains obsolete organization identity: {obsolete}")\n    for required_identity in (BASE + "#organization-world-psychiatric-association", BASE + "#organization-dgppn", "Q2593790", "Q1202963"):\n        require(required_identity in graph_text and required_identity in ttl_text, f"live graph lacks canonical organization identity: {required_identity}")'''
          live_validator = replace_once(live_validator, old_live_bytes, new_live_bytes, 'live validator sitemap and graph identity contract')
          write('.github/scripts/validate_live.py', live_validator)

          Path('.github/workflows/entity-graph-surgical-fix.yml').unlink()
          PY

          python -m py_compile .github/scripts/validate_source.py .github/scripts/validate_live.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Consolidate canonical indexing and repair graph identities'
          git push origin HEAD:"${HEAD_BRANCH}"

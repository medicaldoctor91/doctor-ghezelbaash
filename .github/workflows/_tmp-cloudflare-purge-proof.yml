name: Temporary Cloudflare purge capability proof

on:
  push:
    branches: [fix/cloudflare-purge-capability-v2]

permissions:
  contents: read

concurrency:
  group: doctor-ghezelbaash-external-mutation
  cancel-in-progress: false

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: 884d1d90bd1fb6ecca14992c6c60d677
      ZONE_NAME: ghezelbaash.ir
      CANONICAL_HOST: www.ghezelbaash.ir
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Purge via canonical ephemeral-token path
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          python scripts/configure-cloudflare-edge.py \
            --purge-cache-only \
            --outcome edge-cache-purge.json
      - name: Verify immediate public discovery freshness
        run: |
          set -euo pipefail
          node scripts/verify-public-discovery-freshness.mjs

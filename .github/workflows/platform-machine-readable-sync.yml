name: Synchronize validated Hugging Face and Kaggle machine resources
on:
  workflow_dispatch:
    inputs:
      hf_revision:
        description: Exact reviewed Hugging Face revision
        required: true
        type: string
      kaggle_version:
        description: Current reviewed Kaggle version
        required: true
        type: string
      website_commit:
        description: Current published website source commit
        required: true
        type: string
      website_run_url:
        description: Verified website publication run URL
        required: true
        type: string
      zenodo_metadata_only:
        description: Maintain existing Zenodo descriptions and links; never change archived files, version, DOI or create a new release
        required: false
        type: boolean
        default: false
      verify_existing:
        description: Verify existing pinned packages and finish source metadata; never create another HF commit or Kaggle version
        required: false
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: doctor-ghezelbaash-publication
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/codex/p0-semantic-integrity-')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ARCHIVE_SOURCE_COMMIT: ${{ vars.ZENODO_23474664_SOURCE_COMMIT }}
      GITHUB_TOKEN: ${{ github.token }}
      ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN || secrets.ZENODO_ACCESS_TOKEN || secrets.ZENODO_API_TOKEN || secrets.ZENODO_API_KEY || secrets.ZENODO_PAT }}
      HF_TOKEN: ${{ secrets.HF_TOKEN || secrets.HUGGINGFACE_TOKEN || secrets.HUGGING_FACE_TOKEN }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN || secrets.KAGGLE_TOKEN }}
      EXPECTED_HF_REVISION: ${{ inputs.hf_revision }}
      EXPECTED_KAGGLE_VERSION: ${{ inputs.kaggle_version }}
      EXPECTED_WEBSITE_COMMIT: ${{ inputs.website_commit }}
      WEBSITE_PUBLICATION_RUN_URL: ${{ inputs.website_run_url }}
      VERIFY_EXISTING: ${{ inputs.verify_existing }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version-file: .nvmrc, cache: npm}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Check existing publication bindings
        id: bindings
        run: |
          if [ "$VERIFY_EXISTING" = true ] && [ "$GITHUB_REF_NAME" = main ]; then
            git merge-base --is-ancestor "$EXPECTED_WEBSITE_COMMIT" "$GITHUB_SHA"
            git diff --quiet "$EXPECTED_WEBSITE_COMMIT" "$GITHUB_SHA" -- . ':!.github' ':!tests' ':!reports'
          else
            test "$GITHUB_SHA" = "$EXPECTED_WEBSITE_COMMIT"
          fi
          test "$(git ls-remote origin "$GITHUB_REF" | cut -f1)" = "$GITHUB_SHA"
          python - <<'PY'
          import os
          missing=[key for key in ['HF_TOKEN','KAGGLE_API_TOKEN'] if not os.environ.get(key)]
          assert not missing, 'Missing existing publication bindings: '+str(missing)
          print('Both existing publication bindings are present')
          PY
      - name: Install build and platform validation dependencies
        run: |
          if [ "$VERIFY_EXISTING" != true ]; then npm ci; fi
          python -m pip install --disable-pip-version-check 'huggingface_hub>=0.34,<1' 'pyarrow>=18,<23' 'kaggle==2.2.4' 'rdflib>=7,<8' 'pyshacl>=0.30,<1' 'mlcroissant==1.1.1' 'PyLD>=2,<4'
      - name: Verify source and generate candidate website resources
        id: source
        run: |
          if [ "$VERIFY_EXISTING" != true ]; then
            node --test tests/*.test.mjs
            npm run build
          fi
          python tests/platform-bundle-sync.test.py
          python tests/platform-publication.test.py
          python -m py_compile .github/scripts/sync_platform_machine_resources.py tests/validate_platform_sync.py
      - name: Validate both packages, publish and verify public bytes
        id: publication
        run: |
          mode=()
          if [ "$VERIFY_EXISTING" = true ]; then mode+=(--verify-existing); fi
          python .github/scripts/sync_platform_machine_resources.py --root /tmp/platform-machine-sync --hf-revision "$EXPECTED_HF_REVISION" --kaggle-version "$EXPECTED_KAGGLE_VERSION" --website-commit "$EXPECTED_WEBSITE_COMMIT" --website-run-url "$WEBSITE_PUBLICATION_RUN_URL" "${mode[@]}"
      - name: Maintain authorized Zenodo metadata without altering historical files
        # A verification-only recovery never republishes HF/Kaggle. Its
        # independent archive-metadata gate can proceed when a public dataset
        # pointer is blocked, after the source and bindings checks pass.
        if: ${{ always() && inputs.zenodo_metadata_only && steps.bindings.outcome == 'success' && steps.source.outcome == 'success' && (steps.publication.outcome == 'success' || inputs.verify_existing) }}
        run: python .github/scripts/platform_publish.py --zenodo-metadata-only --report /tmp/platform-machine-sync/zenodo-metadata-report.json
      - name: Save publication and validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: platform-machine-sync-evidence
          path: |
            /tmp/platform-machine-sync/context.json
            /tmp/platform-machine-sync/publication-report.json
            /tmp/platform-machine-sync/zenodo-metadata-report.json
            /tmp/platform-machine-sync/*validation.json
            /tmp/platform-machine-sync/website-file-sources.json
          if-no-files-found: warn

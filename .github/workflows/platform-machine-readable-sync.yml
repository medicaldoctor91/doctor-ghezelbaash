name: HF Dataset Card metadata-only maintenance
on:
  workflow_dispatch:
    inputs:
      hf_revision:
        description: Exact reviewed Hugging Face data revision
        required: true
        type: string
      kaggle_version:
        description: Preserved Kaggle version (no Kaggle write)
        required: true
        type: string
      website_commit:
        description: Preserved website commit (no build or deployment)
        required: true
        type: string
      website_run_url:
        description: Existing website publication receipt
        required: true
        type: string
      verify_existing:
        description: Confirm metadata-only HF maintenance with unchanged data
        required: false
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: doctor-ghezelbaash-publication
  cancel-in-progress: false
jobs:
  metadata-only:
    if: github.ref == 'refs/heads/maintenance/hf-discoverability-20261019' && inputs.verify_existing
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install only metadata dependencies
        run: python -m pip install --disable-pip-version-check 'huggingface_hub==0.36.0' 'PyYAML==6.0.3'
      - name: Test metadata boundaries without credentials
        run: python tests/hf-metadata-only.test.py
      - name: Publish only the card and its checksum in one guarded commit
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN || secrets.HUGGINGFACE_TOKEN || secrets.HUGGING_FACE_TOKEN }}
          HF_HUB_DISABLE_TELEMETRY: '1'
          EXPECTED_HF_REVISION: ${{ inputs.hf_revision }}
          EXPECTED_WEBSITE_COMMIT: ${{ inputs.website_commit }}
          VERIFY_EXISTING: ${{ inputs.verify_existing }}
        run: python .github/scripts/hf_metadata_only.py
      - name: Save public receipt only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hf-metadata-only-receipt
          path: /tmp/hf-discoverability/receipt.json
          if-no-files-found: warn

name: Temporary immediate named-as audit Q140288589

on:
  pull_request_target:
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  audit:
    if: github.event.pull_request.head.ref == 'tmp-audit-named-as-q140288589-now'
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14.6'
      - run: python -m pip install --disable-pip-version-check --no-input requests==2.32.5
      - name: Fetch live Q140288589 named-as usage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p wikimedia
          python scripts/_tmp_audit_named_as_q140288589.py > wikimedia/_tmp-named-as-q140288589-audit.json
          python scripts/_tmp_summarize_named_as_q140288589.py > wikimedia/_tmp-named-as-q140288589-summary.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add wikimedia/_tmp-named-as-q140288589-audit.json wikimedia/_tmp-named-as-q140288589-summary.json
          git commit -m 'Record immediate named-as audit summary' || true
          git push origin HEAD:main

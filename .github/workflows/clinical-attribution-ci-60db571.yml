  validate:
    needs: transfer
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 60db571865b967d27fededafd284b291a0e0d403
          fetch-depth: 0
          persist-credentials: false
      - run: test "$(git rev-parse HEAD)" = "$TARGET_COMMIT"
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build and validation dependencies
        run: |
          npm ci
          python -m pip install 'rdflib>=7,<8' 'pyshacl>=0.30,<1' 'mlcroissant==1.1.1' 'PyLD==3.3.0' PyYAML playwright
          python -m playwright install --with-deps chrome
      - name: Build exact candidate
        id: build
        run: npm run build
      - name: Verify clinical attribution and machine-readable outputs
        run: |
          node --test tests/approved-clinical-attribution.test.mjs tests/physician-page-output.test.mjs
          python tests/validate_machine_resources.py dist
          python tests/validate_canonical_invariants.py dist
          python tests/validate_platform_bundle.py dist --no-query --rdf
      - name: Reader browser regression
        if: '!cancelled() && steps.build.outcome == ''success'''
        env:
          PLAYWRIGHT_CHROMIUM_EXECUTABLE: /usr/bin/google-chrome
        run: python tests/reader-browser-regression.py --dist dist --report "$RUNNER_TEMP/reader-browser-regression.json"
      - name: Reader BFCache regression
        if: '!cancelled() && steps.build.outcome == ''success'''
        env:
          PLAYWRIGHT_CHROMIUM_EXECUTABLE: /usr/bin/google-chrome
        run: python tests/reader-bfcache-regression.py --dist dist --report "$RUNNER_TEMP/reader-bfcache-regression.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clinical-attribution-browser-results-60db571
          path: |
            ${{ runner.temp }}/reader-browser-regression.json
            ${{ runner.temp }}/reader-bfcache-regression.json
          if-no-files-found: warn

name: Clean read-only external convergence preflight
on:
  push:
    branches: [ops/platform-convergence-clean-20261017]
    paths:
      - .github/workflows/platform-clean-readonly-preflight.yml
      - .github/scripts/platform_convergence_hardened.py
      - tests/hf-platform-assets.test.py
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPECTED_WEBSITE_COMMIT: 8edb4d6f2e224886132297ac5f380bee26cb53cb
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version-file: .nvmrc, cache: npm}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Lock current public platform state
        run: |
          python - <<'PY'
          import json,os,urllib.request
          def get(url):
              req=urllib.request.Request(url,headers={'Cache-Control':'no-cache, no-store','Pragma':'no-cache','User-Agent':'ghezelbaash-convergence-lock/3.0'})
              with urllib.request.urlopen(req,timeout=60) as r:return json.load(r)
          website=get('https://www.ghezelbaash.ir/release-provenance.json?lock=clean')
          hf=get('https://huggingface.co/api/datasets/doctor-ghezelbaash/dr-saeid-ghezelbaash-entity-data')
          kaggle=get('https://www.kaggle.com/api/v1/datasets/view/saeedghezelbash/dr-saeed-ghezelbash-knowledge-graph-and-nlp-data')
          zd=get('https://zenodo.org/api/records/22838416')
          zs=get('https://zenodo.org/api/records/23289009')
          assert website.get('sourceCommit')==os.environ['EXPECTED_WEBSITE_COMMIT'],website.get('sourceCommit')
          assert isinstance(hf.get('sha'),str) and len(hf['sha'])==40
          kv=int(kaggle['currentVersionNumber']); assert kv>0
          versions={int(v['versionNumber']):v.get('status') for v in kaggle.get('versions',[])}
          assert versions.get(kv)=='Ready',(kv,versions.get(kv))
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write('EXPECTED_HF_REVISION='+hf['sha']+'\n')
              f.write('EXPECTED_KAGGLE_VERSION='+str(kv)+'\n')
          snapshot={
            'websiteSourceCommit':website['sourceCommit'],'hfRevision':hf['sha'],'kaggleVersion':kv,
            'zenodoDataset':{'id':zd.get('id'),'doi':zd.get('doi'),'version':zd.get('metadata',{}).get('version'),'files':[{ 'key':x.get('key'),'checksum':x.get('checksum'),'size':x.get('size')} for x in zd.get('files',[])]},
            'zenodoSource':{'id':zs.get('id'),'doi':zs.get('doi'),'version':zs.get('metadata',{}).get('version'),'files':[{ 'key':x.get('key'),'checksum':x.get('checksum'),'size':x.get('size')} for x in zs.get('files',[])]},
          }
          os.makedirs('/tmp/platform-convergence-hardened',exist_ok=True)
          open('/tmp/platform-convergence-hardened/public-locks.json','w').write(json.dumps(snapshot,ensure_ascii=False,indent=2)+'\n')
          print('PUBLIC_LOCKS='+json.dumps(snapshot,ensure_ascii=False,sort_keys=True))
          PY
      - name: Install deterministic validation dependencies
        run: |
          npm ci
          python -m pip install --disable-pip-version-check 'huggingface_hub>=0.34,<1' 'pyarrow>=18,<23' 'rdflib>=7,<8' 'pyshacl>=0.30,<1' 'mlcroissant==1.1.1'
      - name: Run hardening unit guards and canonical build
        run: |
          python tests/platform-hardening.test.py
          python tests/platform-origin-binding.test.py
          python tests/hf-platform-assets.test.py
          node --test tests/machine-output.test.mjs tests/solo-practice-semantics.test.mjs tests/content-digest.test.mjs
          npm run build
          python tests/validate_machine_resources.py dist
          python tests/validate_canonical_invariants.py dist
          python tests/validate_platform_bundle.py dist --no-query --rdf
      - name: Build frozen external packages and lint platform-only assets
        run: python .github/scripts/platform_convergence_hardened.py --prepare-only
      - name: Save all read-only evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clean-platform-convergence-preflight
          path: |
            /tmp/platform-convergence-hardened/public-locks.json
            /tmp/platform-convergence-hardened/context.json
            /tmp/platform-convergence-hardened/hf-validation.json
            /tmp/platform-convergence-hardened/hf-validation-hardened.json
            /tmp/platform-convergence-hardened/kaggle-preview-validation.json
            /tmp/platform-convergence-hardened/website-file-sources.json
            /tmp/platform-convergence-hardened/hf-platform-only-lint.json
          if-no-files-found: warn
          overwrite: true

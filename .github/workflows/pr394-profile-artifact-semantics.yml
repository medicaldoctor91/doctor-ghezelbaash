name: PR 394 artifact semantics stage profiler

on:
  push:
    branches:
      - candidate/final-repository-plan-2026

permissions:
  contents: read

concurrency:
  group: pr394-artifact-profiler
  cancel-in-progress: false

jobs:
  profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: candidate/final-repository-plan-2026
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Set up pinned Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14.6'

      - name: Provision media tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Materialize profiled candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

          python - <<'PY'
          from pathlib import Path
          raw = Path('.github/workflows/pr394-apply-upgrade.yml').read_text()
          start = "          cat > scripts/validate-rdf-isomorphism.mjs <<'EOF'\n"
          end = "          EOF\n"
          assert start in raw
          body = raw.split(start, 1)[1].split(end, 1)[0]
          lines=[]
          for line in body.splitlines():
              assert line.startswith('          ') or not line
              lines.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/validate-rdf-isomorphism.mjs').write_text('\n'.join(lines)+'\n')
          PY

          cat .pr394-upgrade.gz.b64.* | base64 --decode | gzip -dc > /tmp/pr394-upgrade.patch
          git apply --check /tmp/pr394-upgrade.patch
          git apply /tmp/pr394-upgrade.patch

          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('scripts/validate-cloudflare-pages-limits.mjs'); s=p.read_text(); old='/'+'media/images/physician/'+'example.webp'; assert old in s; p.write_text(s.replace(old,'/assets/image-example.webp',1))

          p=Path('src/components/GuideNavigator.astro'); s=p.read_text()
          old='dialogOpener = opener instanceof HTMLElement ? opener : null;'; new='dialogOpener = opener && typeof opener.focus === "function" ? opener : null;'; assert old in s; s=s.replace(old,new,1)
          old='if (target?.isConnected)\n      requestAnimationFrame(() => target.focus({ preventScroll: true }));'; new='if (target && target.isConnected !== false && typeof target.focus === "function")\n      requestAnimationFrame(() => target.focus({ preventScroll: true }));'; assert old in s; p.write_text(s.replace(old,new,1))

          p=Path('scripts/test-guide-navigator.mjs'); s=p.read_text(); old='dialog.close = () => { dialog.open = false; };'; new='dialog.close = () => { dialog.open = false; emit(dialog, "close"); };'; assert old in s; p.write_text(s.replace(old,new,1))

          # Source vCard generator may already carry the final RFC 6350 VALUE=uri fix.
          p=Path('scripts/lib/projections/contact-discovery.mjs'); s=p.read_text()
          bare='`TEL;TYPE=work,voice:${telephone}`,'; intermediate='`TEL;TYPE=work,voice:tel:${telephone}`,'; target='`TEL;VALUE=uri;TYPE=work,voice:tel:${telephone}`,'
          if s.count(bare)==2: s=s.replace(bare,target)
          elif s.count(intermediate)==2: s=s.replace(intermediate,target)
          else: assert s.count(target)==2, (s.count(bare),s.count(intermediate),s.count(target))
          p.write_text(s)

          p=Path('scripts/lib/strict-json.mjs'); s=p.read_text()
          old='export function parseJsonNoDuplicateKeys(text, label = "JSON") {'; new='export function parseJsonNoDuplicateKeys(text, label = "JSON", { materialize = true } = {}) {'; assert old in s; s=s.replace(old,new,1)
          old=('  const primitive = () => {\n    const rest = text.slice(i);\n    const match = rest.match(/^(?:true|false|null|-?(?:0|[1-9]\\d*)(?:\\.\\d+)?(?:[eE][+-]?\\d+)?)/u);\n    if (!match) fail("invalid value");\n    i += match[0].length;\n  };')
          new=('  const primitivePattern = /(?:true|false|null|-?(?:0|[1-9]\\d*)(?:\\.\\d+)?(?:[eE][+-]?\\d+)?)/uy;\n  const primitive = () => {\n    primitivePattern.lastIndex = i;\n    const match = primitivePattern.exec(text);\n    if (!match) fail("invalid value");\n    i += match[0].length;\n  };')
          assert old in s; s=s.replace(old,new,1); old='  return JSON.parse(text);'; assert old in s; p.write_text(s.replace(old,'  return materialize ? JSON.parse(text) : undefined;',1))

          p=Path('scripts/validate-artifact-semantics.mjs'); s=p.read_text()
          old=('const parsedJson = new Map();\nfor (const file of strictJsonFiles) parsedJson.set(file, parseJsonNoDuplicateKeys(await readFile(path.join(root, file), "utf8"), `dist/${file}`));')
          new=('const parsedJson = new Map();\nconst retainedJsonFiles = new Set(["site.webmanifest", "linkset.json", "entity-facts.csv-metadata.json", "datapackage.json", "croissant.json"]);\nfor (const file of strictJsonFiles) {\n  const keep = retainedJsonFiles.has(file);\n  const parsed = parseJsonNoDuplicateKeys(await readFile(path.join(root, file), "utf8"), `dist/${file}`, { materialize: keep });\n  if (keep) parsedJson.set(file, parsed);\n}')
          assert old in s; s=s.replace(old,new,1)

          old='for (const row of properties.filter((x) => x.name === "TEL")) assert.match(row.value, /^\\+?[0-9][0-9(). -]*$/u, `${file} telephone lexical form invalid`);'
          new='for (const row of properties.filter((x) => x.name === "TEL")) { const valueParams = row.params.filter((param) => /^VALUE=/iu.test(param)); assert.equal(valueParams.length, 1, `${file} TEL must declare exactly one VALUE parameter`); assert.match(valueParams[0], /^VALUE=uri$/iu, `${file} TEL VALUE parameter must be uri`); assert.match(row.value, /^tel:\\+?[0-9][0-9(). -]*$/u, `${file} TEL must be an RFC 6350 URI value`); }'
          assert old in s; s=s.replace(old,new,1)

          marker='const ndjson = await readFile('; idx=s.find(marker); assert idx>=0
          helper=('const machineResourceRegistry = JSON.parse(await readFile("src/data/machine-resources.json", "utf8"));\nconst resolveRegisteredArtifact = (resourcePath) => {\n  const resource = machineResourceRegistry.resources.find((entry) => entry.path === resourcePath);\n  if (!resource) throw new Error(`Machine resource is not registered: ${resourcePath}`);\n  return resource.targets?.includes("website") ? path.join(root, resource.path) : resource.source;\n};\n\n')
          s=s[:idx]+helper+s[idx:]
          lines=s.splitlines(); replaced=set()
          for i,line in enumerate(lines):
              for name in ('query-matrix.jsonl','query-matrix.json-seq'):
                  if name not in line or 'readFile(' not in line: continue
                  pattern=re.compile(rf'readFile\([^;\n]*{re.escape(name)}[^;\n]*\)')
                  updated,count=pattern.subn(f'readFile(resolveRegisteredArtifact("{name}"), "utf8")',line,count=1)
                  if count==1: lines[i]=updated; replaced.add(name)
          assert replaced=={'query-matrix.jsonl','query-matrix.json-seq'},replaced
          s='\n'.join(lines)+('\n' if s.endswith('\n') else '')
          separator=[line for line in s.splitlines() if 'assert.equal' in line and '0x1e' in line.lower()]; assert len(separator)==1
          fixed,c1=re.subn(r'(?<![A-Za-z0-9_])0x1[eE](?![A-Za-z0-9_])',lambda _:r'"\x1e"',separator[0],count=1)
          fixed,c2=re.subn(r'(?<![A-Za-z0-9_])0x0[aA](?![A-Za-z0-9_])',lambda _:r'"\n"',fixed,count=1); assert c1==1 and c2==1; s=s.replace(separator[0],fixed,1)

          start_marker='const broken=[]; let checkedInternal=0;'; end_marker='assert.deepEqual(broken, [], `Broken canonical internal URLs/fragments: ${JSON.stringify(broken.slice(0,20),null,2)}`);'
          start=s.find(start_marker); end_start=s.find(end_marker); assert start>=0 and end_start>start; end=end_start+len(end_marker)
          replacement=('const broken=[]; let checkedInternal=0; const validatedInternalUrls=new Set();\nconst canonicalPrefix="https://www.ghezelbaash.ir/";\nconst isUrlTerminator=(ch)=>{if(ch==null||/\\s/u.test(ch))return true;const code=ch.charCodeAt(0);return code===34||code===39||code===60||code===62||code===96||code===92||code===91||code===93;};\nfor (const file of files) {\n  if (!textExtensions.has(path.extname(file)) && file !== "site.webmanifest") continue;\n  const text=await readFile(path.join(root,file),"utf8");\n  let offset=0;\n  for (;;) {\n    const found=text.indexOf(canonicalPrefix,offset); if(found<0) break;\n    let cursor=found+canonicalPrefix.length; while(cursor<text.length&&!isUrlTerminator(text[cursor])) cursor+=1;\n    const value=text.slice(found,cursor).replace(/[),.;]+$/u,""); offset=Math.max(cursor,found+canonicalPrefix.length); checkedInternal+=1;\n    if(validatedInternalUrls.has(value)) continue; validatedInternalUrls.add(value);\n    let url; try{url=new URL(value);}catch{broken.push({file,url:value,reason:"invalid-url"});continue;}\n    let relative; try{relative=decodeURIComponent(url.pathname).slice(1)||"index.html";}catch{broken.push({file,url:value,reason:"invalid-percent-encoding"});continue;}\n    if(!exists(relative)){broken.push({file,url:value,reason:"missing-path"});continue;}\n    if((relative==="index.html"||relative.endsWith(".html"))&&url.hash&&relative==="index.html"){let fragment; try{fragment=decodeURIComponent(url.hash.slice(1));}catch{broken.push({file,url:value,reason:"invalid-fragment-encoding"});continue;} if(fragment&&!ids.has(fragment)) broken.push({file,url:value,reason:"missing-fragment"});}\n  }\n}\nassert.deepEqual(broken, [], `Broken canonical internal URLs/fragments: ${JSON.stringify(broken.slice(0,20),null,2)}`);')
          s=s[:start]+replacement+s[end:]
          assert 'internalLinks:{checked:checkedInternal,broken:0}' in s; s=s.replace('internalLinks:{checked:checkedInternal,broken:0}','internalLinks:{checked:checkedInternal,unique:validatedInternalUrls.size,broken:0}',1)

          # Add stage timing/RSS markers without changing assertions or coverage.
          insert='const __artifactStarted = process.hrtime.bigint();\nconst __mark = (stage) => console.error(`ARTIFACT_STAGE ${stage} ms=${Number(process.hrtime.bigint()-__artifactStarted)/1e6} rss=${process.memoryUsage().rss}`);\n'
          anchor='const sha = async (relative) => createHash("sha256").update(await readFile(path.join(root, relative))).digest("hex");\n'; assert anchor in s; s=s.replace(anchor,anchor+insert,1)
          marks=[
            ('if (keep) parsedJson.set(file, parsed);\n}', 'if (keep) parsedJson.set(file, parsed);\n}\n__mark("strict-json");'),
            ('assert.ok(robotExtensions.every((row) => row.field === "content-signal"), `Unexpected REP extensions: ${JSON.stringify(robotExtensions)}`);','assert.ok(robotExtensions.every((row) => row.field === "content-signal"), `Unexpected REP extensions: ${JSON.stringify(robotExtensions)}`);\n__mark("robots");'),
            ('  assert.ok(["any","maskable","monochrome"].includes(icon.purpose || "any"), `Manifest icon purpose not in interoperable subset: ${icon.purpose}`);\n}','  assert.ok(["any","maskable","monochrome"].includes(icon.purpose || "any"), `Manifest icon purpose not in interoperable subset: ${icon.purpose}`);\n}\n__mark("manifest");'),
            ('  vcardResults.push({ file, logicalProperties: properties.length, physicalLines: text.split("\\r\\n").length - 1 });\n}','  vcardResults.push({ file, logicalProperties: properties.length, physicalLines: text.split("\\r\\n").length - 1 });\n}\n__mark("vcard");'),
            ('assert.deepEqual(sequenceRows, ndjsonRows, "NDJSON and RFC 7464 JSON-seq semantic rows differ");','assert.deepEqual(sequenceRows, ndjsonRows, "NDJSON and RFC 7464 JSON-seq semantic rows differ");\n__mark("json-seq");'),
            ('assert.equal(xmlEvidence["sitemap.xml"]?.root, "{http://www.sitemaps.org/schemas/sitemap/0.9}urlset", "Sitemap namespace/root drift");','assert.equal(xmlEvidence["sitemap.xml"]?.root, "{http://www.sitemaps.org/schemas/sitemap/0.9}urlset", "Sitemap namespace/root drift");\n__mark("xml");'),
            ('for (const file of vttFiles) { const text=await readFile(path.join(root,file),"utf8"); assert.ok(text.startsWith("WEBVTT"),`${file} missing WEBVTT signature`);','__mark("before-vtt");\nfor (const file of vttFiles) { const text=await readFile(path.join(root,file),"utf8"); assert.ok(text.startsWith("WEBVTT"),`${file} missing WEBVTT signature`);'),
            ('const indexHtml = await readFile(path.join(root,"index.html"),"utf8"); const doc=parse(indexHtml);','__mark("before-html-parse");\nconst indexHtml = await readFile(path.join(root,"index.html"),"utf8"); const doc=parse(indexHtml);'),
            ('assert.deepEqual(broken, [], `Broken canonical internal URLs/fragments: ${JSON.stringify(broken.slice(0,20),null,2)}`);','assert.deepEqual(broken, [], `Broken canonical internal URLs/fragments: ${JSON.stringify(broken.slice(0,20),null,2)}`);\n__mark("internal-links");'),
            ('const identity = await distIdentity("dist");','__mark("before-dist-identity");\nconst identity = await distIdentity("dist");\n__mark("dist-identity");')]
          for old,new in marks:
              assert old in s, old[:80]
              s=s.replace(old,new,1)
          p.write_text(s)
          Path('scripts/validate-rdf-isomorphism.mjs').write_text(Path('/tmp/validate-rdf-isomorphism.mjs').read_text())
          PY

          mv scripts/audit-performance.mjs scripts/measure-performance.mjs
          sed -i 's|scripts/audit-performance.mjs|scripts/measure-performance.mjs|g' package.json .github/workflows/ci.yml
          sed -i 's/await chrome.kill();/chrome.kill();/' scripts/measure-performance.mjs
          sed -i 's/^on:$/on:\n  workflow_dispatch:/' .github/workflows/ci.yml
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          rm -f .pr394-upgrade.gz.b64.*
          rm -f .github/workflows/pr394-apply-upgrade.yml .github/workflows/pr394-finalize-upgrade.yml .github/workflows/pr394-finalize-v2.yml .github/workflows/pr394-artifact-source-diagnostic.yml .github/workflows/pr394-profile-artifact-semantics.yml
          npm ci
          npm run security:dependencies
          npx playwright install --with-deps chromium
          npm run render:calibration:update
          npm run test:render-navigation -- .generated/calibration-candidate
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: harden 2026 dist conformance and browser evidence'
          FINAL_HEAD="$(git rev-parse HEAD)"
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct "$FINAL_HEAD")"
          {
            echo "FINAL_HEAD=$FINAL_HEAD"
            echo "SOURCE_COMMIT=$FINAL_HEAD"
            echo "CF_PAGES_COMMIT_SHA=$FINAL_HEAD"
            echo "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH"
          } >> "$GITHUB_ENV"
          printf '%s\n' "$FINAL_HEAD" > /tmp/pr394-profile-head.txt

      - name: Run full release with stage profiler
        shell: bash
        run: |
          set +e
          npm run release 2>&1 | tee /tmp/pr394-profile-release.log
          rc=${PIPESTATUS[0]}
          printf '%s\n' "$rc" > /tmp/pr394-profile-exit.txt
          exit "$rc"

      - name: Upload profiler evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr394-artifact-profiler-${{ github.sha }}
          path: |
            /tmp/pr394-profile-head.txt
            /tmp/pr394-profile-release.log
            /tmp/pr394-profile-exit.txt
            .generated/validation/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

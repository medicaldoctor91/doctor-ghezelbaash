name: Compare 71 authored pages for near-duplicate indexing signals (read-only)
on:
  push:
    branches: [codex/136-indexing-text-uniqueness-audit-20261121]
permissions:
  contents: read
jobs:
  corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests
      - name: Compare all published non-home authored text without schema or navigation
        run: python .github/scripts/audit_136_page_text_similarity.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-136-71-pages-text-uniqueness
          path: /tmp/index-content-136/report.json
          if-no-files-found: warn

name: One-click production finalization

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: doctor-ghezelbaash-production-finalization
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: Dispatch strict CSP and source cleanup
        shell: bash
        run: |
          set -euo pipefail
          started=$(date -u +%s)
          gh workflow run strict-csp-source-cleanup.yml --repo "$REPO" --ref main
          sleep 8
          run_id=""
          for i in $(seq 1 30); do
            run_id=$(gh run list --repo "$REPO" --workflow strict-csp-source-cleanup.yml --event workflow_dispatch --limit 10 --json databaseId,createdAt,status --jq ".[] | select((.createdAt | fromdateiso8601) >= $started) | .databaseId" | head -n1)
            [ -n "$run_id" ] && break
            sleep 4
          done
          test -n "$run_id"
          echo "cleanup_run_id=$run_id" >> "$GITHUB_ENV"
          gh run watch "$run_id" --repo "$REPO" --exit-status

      - name: Dispatch definitive source and live validation
        shell: bash
        run: |
          set -euo pipefail
          started=$(date -u +%s)
          gh workflow run final-live-validation.yml --repo "$REPO" --ref main
          sleep 8
          run_id=""
          for i in $(seq 1 30); do
            run_id=$(gh run list --repo "$REPO" --workflow final-live-validation.yml --event workflow_dispatch --limit 10 --json databaseId,createdAt,status --jq ".[] | select((.createdAt | fromdateiso8601) >= $started) | .databaseId" | head -n1)
            [ -n "$run_id" ] && break
            sleep 4
          done
          test -n "$run_id"
          echo "validation_run_id=$run_id" >> "$GITHUB_ENV"
          gh run watch "$run_id" --repo "$REPO" --exit-status

      - name: Remove orchestrator and any superseded one-shot workflows
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" repo
          cd repo
          git config user.name 'OpenAI Project Automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f \
            .github/workflows/manual-finalize.yml \
            .github/workflows/strict-csp-source-cleanup.yml \
            .github/workflows/final-live-validation.yml \
            .github/workflows/audit-live-pass1.yml \
            .github/workflows/audit-live-pagespeed.yml
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Remove completed one-shot production workflows'
            git push origin main
          fi

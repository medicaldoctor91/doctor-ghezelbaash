name: Probe Google Places secret safely

on:
  push:
    branches:
      - feat/static-reputation-authority-20260903
    paths:
      - .github/workflows/probe-google-places-secret.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify secret and bounded Place Details response
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          PLACE_ID: ChIJBT0YDOTt-j8RD-7mAPy6Zas
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GOOGLE_PLACES_API_KEY:-}" || { echo 'secret_present=false'; exit 1; }
          echo '::add-mask::'"$GOOGLE_PLACES_API_KEY"
          http_code="$(curl --silent --show-error \
            --output /tmp/place.json \
            --write-out '%{http_code}' \
            --connect-timeout 10 \
            --max-time 20 \
            -H 'Accept: application/json' \
            -H "X-Goog-Api-Key: $GOOGLE_PLACES_API_KEY" \
            -H 'X-Goog-FieldMask: id,rating,userRatingCount,businessStatus,movedPlace,movedPlaceId' \
            "https://places.googleapis.com/v1/places/${PLACE_ID}?languageCode=fa&regionCode=IR")"
          HTTP_CODE="$http_code" node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const body = JSON.parse(await readFile('/tmp/place.json', 'utf8'));
          const status = Number(process.env.HTTP_CODE);
          if (status !== 200) {
            const code = String(body?.error?.status || 'UNKNOWN').slice(0, 80);
            const message = String(body?.error?.message || '').replace(/AIza[0-9A-Za-z_-]+/g, '[REDACTED]').slice(0, 240);
            console.error(JSON.stringify({ secretPresent: true, httpStatus: status, errorCode: code, message }));
            process.exit(1);
          }
          const rating = Number(body?.rating);
          const userRatingCount = Number(body?.userRatingCount);
          if (
            body?.id !== process.env.PLACE_ID ||
            body?.businessStatus !== 'OPERATIONAL' ||
            body?.movedPlace || body?.movedPlaceId ||
            !Number.isFinite(rating) || rating < 1 || rating > 5 ||
            !Number.isSafeInteger(userRatingCount) || userRatingCount < 1
          ) throw new Error('Unexpected or incomplete Google Places response contract');
          console.log(JSON.stringify({
            secretPresent: true,
            requestCount: 1,
            httpStatus: status,
            placeIdMatched: true,
            businessStatus: body.businessStatus,
            rating,
            userRatingCount,
            projectedSixHourlyRequestsPer31DayMonth: 124
          }, null, 2));
          NODE

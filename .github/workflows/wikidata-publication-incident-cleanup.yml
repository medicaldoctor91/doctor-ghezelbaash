name: Wikidata publication incident cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wikidata-publication-incident-cleanup.yml'

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      WIKIMEDIA_USERNAME: ${{ secrets.WIKIVERSITY_USERNAME }}
      WIKIMEDIA_BOT_PASSWORD: ${{ secrets.WIKIVERSITY_BOT_PASSWORD }}
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check --no-input requests==2.32.5
      - name: Restore originals, redirect accidental QIDs, verify authorship graph
        shell: python
        run: |
          import json, os, time, requests

          WD='https://www.wikidata.org/w/api.php'
          PERSON='Q140287622'
          AUTHOR='Q482980'
          SNAPSHOTS={
            'Q36942316':2528326179,
            'Q140298431':2528326174,
          }
          EXPECTED={
            'Q36942316': {'pmid':'27280013','doi':'10.4103/2008-7802.182734'},
            'Q140298431': {'pmid':'34574943','doi':'10.3390/healthcare9091169'},
          }
          ACCIDENTAL={
            'Q141099144': {'target':'Q36942316','description':'2016 scholarly article'},
            'Q141099146': {'target':'Q140298431','description':'2021 scholarly article'},
          }
          CANONICAL_WORKS=['Q36942316','Q140298431','Q140306302']
          UA='Medicaldoctor91WikidataPublicationIncidentCleanup/1.0 (https://www.ghezelbaash.ir/)'
          anon=requests.Session(); anon.headers['User-Agent']=UA
          auth=requests.Session(); auth.headers['User-Agent']=UA

          def get(sess, params):
            r=sess.get(WD,params={**params,'format':'json','formatversion':2},timeout=90)
            r.raise_for_status(); d=r.json()
            if 'error' in d: raise RuntimeError(d['error'])
            return d

          def post(params, retries=8):
            waits=[10,20,30,45,60,75,90,120]
            last=None
            for i in range(retries):
              r=auth.post(WD,data={**params,'format':'json','formatversion':2,'maxlag':5},timeout=120)
              r.raise_for_status(); d=r.json()
              if 'error' not in d: return d
              last=d['error']; code=last.get('code','')
              if code in {'actionthrottled','maxlag','ratelimited','failed-save'}:
                time.sleep(waits[min(i,len(waits)-1)]); continue
              raise RuntimeError(last)
            raise RuntimeError({'write_retry_exhausted':last})

          def entity(sess,q,redirects=None):
            p={'action':'wbgetentities','ids':q,'props':'claims|labels|descriptions|aliases|sitelinks|info'}
            if redirects is not None: p['redirects']=redirects
            return get(sess,p)['entities']

          def one_entity(sess,q):
            d=entity(sess,q)
            return d[q]

          def historical(revid):
            d=get(anon,{'action':'query','revids':str(revid),'prop':'revisions','rvprop':'ids|timestamp|content','rvslots':'main'})
            page=d['query']['pages'][0]; rev=page['revisions'][0]; slot=rev['slots']['main']
            text=slot.get('content') or slot.get('*')
            if not text: raise RuntimeError({'historical_content_missing':revid})
            return json.loads(text), {'title':page.get('title'),'revid':rev.get('revid'),'timestamp':rev.get('timestamp')}

          def raw_value(snak):
            return snak.get('datavalue',{}).get('value')

          def qid(snak):
            v=raw_value(snak)
            if isinstance(v,dict):
              return v.get('id') or (f"Q{v['numeric-id']}" if isinstance(v.get('numeric-id'),int) else None)
            return None

          def scalar(snak):
            v=raw_value(snak)
            if isinstance(v,dict) and 'text' in v: return v['text']
            return v

          def term_map(v):
            if isinstance(v,dict): return {k:x.get('value') for k,x in v.items() if isinstance(x,dict)}
            if isinstance(v,list): return {x.get('language'):x.get('value') for x in v if isinstance(x,dict) and x.get('language')}
            return {}

          def alias_pairs(v):
            if isinstance(v,dict): return {(lang,x.get('value')) for lang,vals in v.items() for x in vals if isinstance(x,dict) and x.get('value')}
            if isinstance(v,list): return {(x.get('language'),x.get('value')) for x in v if isinstance(x,dict) and x.get('value')}
            return set()

          # ---------- Read-only hard gates ----------
          history={}
          cleanup_plan={}
          for q,rev in SNAPSHOTS.items():
            old,meta=historical(rev)
            cur=one_entity(anon,q)
            if old.get('id')!=q or meta['title']!=q:
              raise RuntimeError({'snapshot_identity_mismatch':{'qid':q,'meta':meta,'old_id':old.get('id')}})
            old_claims={c['id']:c for arr in old.get('claims',{}).values() for c in arr}
            cur_claims={c['id']:c for arr in cur.get('claims',{}).values() for c in arr}
            missing=sorted(set(old_claims)-set(cur_claims))
            if missing:
              raise RuntimeError({'preexisting_claim_missing_abort':{'qid':q,'missing':missing}})
            expected=EXPECTED[q]
            old_pmids={str(scalar(c['mainsnak'])) for c in old.get('claims',{}).get('P698',[])}
            old_dois={str(scalar(c['mainsnak'])).lower() for c in old.get('claims',{}).get('P356',[])}
            old_p50={qid(c['mainsnak']) for c in old.get('claims',{}).get('P50',[])}
            if expected['pmid'] not in old_pmids or expected['doi'] not in old_dois or PERSON not in old_p50:
              raise RuntimeError({'historical_identity_gate_failed':{'qid':q,'pmids':sorted(old_pmids),'dois':sorted(old_dois),'p50':sorted(x for x in old_p50 if x)}})
            if term_map(old.get('labels',{})) != term_map(cur.get('labels',{})):
              raise RuntimeError({'label_drift_before_cleanup':q})
            if term_map(old.get('descriptions',{})) != term_map(cur.get('descriptions',{})):
              raise RuntimeError({'description_drift_before_cleanup':q})
            old_alias=alias_pairs(old.get('aliases',{})); cur_alias=alias_pairs(cur.get('aliases',{}))
            if old_alias-cur_alias:
              raise RuntimeError({'historical_alias_missing_abort':{'qid':q,'missing':sorted(old_alias-cur_alias)}})
            extras=sorted(set(cur_claims)-set(old_claims))
            extra_alias=sorted(cur_alias-old_alias)
            if q=='Q36942316' and len(extras)!=9:
              raise RuntimeError({'unexpected_2016_delta_count':len(extras)})
            if q=='Q140298431' and len(extras)!=10:
              raise RuntimeError({'unexpected_2021_delta_count':len(extras)})
            history[q]={'old_claim_ids':set(old_claims),'old_aliases':old_alias,'old_labels':term_map(old.get('labels',{})),'old_descriptions':term_map(old.get('descriptions',{}))}
            cleanup_plan[q]={'extra_claim_ids':extras,'extra_aliases':extra_alias}

          # Accidental items must still be exactly the empty shells created by this incident.
          for source,meta in ACCIDENTAL.items():
            e=one_entity(anon,source)
            if e.get('claims') or e.get('labels') or e.get('aliases') or e.get('sitelinks'):
              raise RuntimeError({'accidental_source_not_empty_shell':{'source':source,'claims':len([c for arr in e.get('claims',{}).values() for c in arr]),'labels':e.get('labels'),'aliases':e.get('aliases'),'sitelinks':e.get('sitelinks')}})
            desc=term_map(e.get('descriptions',{}))
            if desc not in ({'en':meta['description']}, {}):
              raise RuntimeError({'unexpected_accidental_description':{'source':source,'descriptions':desc}})

          # Person must currently point only to canonical works, not accidental QIDs.
          p=one_entity(anon,PERSON)
          for c in p.get('claims',{}).get('P3919',[]):
            if qid(c['mainsnak']) in ACCIDENTAL:
              raise RuntimeError({'person_still_points_to_accidental_qid_before_cleanup':qid(c['mainsnak'])})

          # ---------- Authenticate only after every safety gate ----------
          lt=get(auth,{'action':'query','meta':'tokens','type':'login'})['query']['tokens']['logintoken']
          login=post({'action':'login','lgname':os.environ['WIKIMEDIA_USERNAME'],'lgpassword':os.environ['WIKIMEDIA_BOT_PASSWORD'],'lgtoken':lt})
          if login.get('login',{}).get('result')!='Success': raise RuntimeError({'login':login})
          ui=get(auth,{'action':'query','meta':'userinfo','uiprop':'rights|groups'})['query']['userinfo']
          if 'edit' not in set(ui.get('rights',[])): raise RuntimeError({'missing_edit_right':True})
          csrf=get(auth,{'action':'query','meta':'tokens','type':'csrf'})['query']['tokens']['csrftoken']

          # ---------- Remove only the incident delta from originals ----------
          mutations=[]
          for q,plan in cleanup_plan.items():
            ids=plan['extra_claim_ids']
            for i in range(0,len(ids),40):
              batch=ids[i:i+40]
              if batch:
                post({'action':'wbremoveclaims','claim':'|'.join(batch),'token':csrf,'summary':'Remove statements introduced by accidental duplicate publication item'})
                mutations.append({'qid':q,'removed_claim_ids':batch})
            # Historical snapshots had no aliases; remove only the exact incident-added aliases.
            for lang,value in plan['extra_aliases']:
              post({'action':'wbsetaliases','id':q,'language':lang,'remove':value,'token':csrf,'summary':'Remove alias introduced by accidental duplicate publication item'})
              mutations.append({'qid':q,'removed_alias':{'language':lang,'value':value}})

          # Verify originals are semantically back to the pre-incident claim-ID / term sets BEFORE redirecting source QIDs.
          restored={}
          for q,h in history.items():
            e=one_entity(anon,q)
            claim_ids={c['id'] for arr in e.get('claims',{}).values() for c in arr}
            if claim_ids != h['old_claim_ids']:
              raise RuntimeError({'original_claim_set_not_restored':{'qid':q,'extra':sorted(claim_ids-h['old_claim_ids']),'missing':sorted(h['old_claim_ids']-claim_ids)}})
            if alias_pairs(e.get('aliases',{})) != h['old_aliases']:
              raise RuntimeError({'original_aliases_not_restored':q})
            if term_map(e.get('labels',{})) != h['old_labels'] or term_map(e.get('descriptions',{})) != h['old_descriptions']:
              raise RuntimeError({'original_terms_not_restored':q})
            if len([c for c in e.get('claims',{}).get('P50',[]) if qid(c['mainsnak'])==PERSON]) != 1:
              raise RuntimeError({'original_person_P50_count_not_one':q})
            restored[q]={'claim_ids_exact':True,'aliases_exact':True,'terms_exact':True,'person_P50_count':1}

          # ---------- Turn accidental empty shells into stable redirects ----------
          redirects={}
          for source,meta in ACCIDENTAL.items():
            # Clear the only remaining incident-created term so wbcreateredirect receives a truly empty item.
            e=one_entity(auth,source)
            desc=term_map(e.get('descriptions',{}))
            for lang,value in desc.items():
              post({'action':'wbsetdescription','id':source,'language':lang,'value':'','token':csrf,'summary':'Empty accidental duplicate item before creating redirect'})
            e=one_entity(auth,source)
            if e.get('claims') or e.get('labels') or e.get('aliases') or e.get('descriptions') or e.get('sitelinks'):
              raise RuntimeError({'source_not_empty_before_redirect':source})
            result=post({'action':'wbcreateredirect','from':source,'to':meta['target'],'token':csrf,'summary':'Redirect accidental duplicate scholarly item to pre-existing canonical Wikidata item'})
            redirects[source]={'target':meta['target'],'api_response_keys':sorted(result.keys())}

          # ---------- Independent live verification ----------
          for source,meta in ACCIDENTAL.items():
            resolved=entity(anon,source,redirects='yes')
            resolved_ids={e.get('id') for e in resolved.values()}
            if meta['target'] not in resolved_ids:
              raise RuntimeError({'redirect_resolution_failed':{'source':source,'target':meta['target'],'resolved_ids':sorted(x for x in resolved_ids if x)}})
            redirects[source]['verified_resolves_to_target']=True

          final_person=one_entity(anon,PERSON)
          by_target={}
          for c in final_person.get('claims',{}).get('P3919',[]):
            t=qid(c['mainsnak'])
            if t: by_target.setdefault(t,[]).append(c)
          for source in ACCIDENTAL:
            if by_target.get(source): raise RuntimeError({'obsolete_reverse_edge_exists':source})
          graph={}
          for work in CANONICAL_WORKS:
            revs=by_target.get(work,[])
            if len(revs)!=1: raise RuntimeError({'canonical_reverse_edge_count':{'work':work,'count':len(revs)}})
            roles={qid(x) for x in revs[0].get('qualifiers',{}).get('P2868',[])}
            if AUTHOR not in roles or not revs[0].get('references'):
              raise RuntimeError({'canonical_reverse_edge_incomplete':{'work':work,'roles':sorted(x for x in roles if x),'refs':len(revs[0].get('references',[]))}})
            w=one_entity(anon,work)
            p50=[c for c in w.get('claims',{}).get('P50',[]) if qid(c['mainsnak'])==PERSON]
            if len(p50)!=1: raise RuntimeError({'canonical_work_P50_count':{'work':work,'count':len(p50)}})
            graph[work]={'work_P50_to_person':1,'person_P3919_to_work':1,'role_author':True,'reverse_edge_referenced':True}

          print(json.dumps({
            'ok':True,
            'authenticated_as':ui.get('name'),
            'cleanup_plan':cleanup_plan,
            'mutations':mutations,
            'restored_originals':restored,
            'redirects':redirects,
            'canonical_authorship_graph':graph,
            'person_lastrevid':final_person.get('lastrevid')
          },ensure_ascii=False,indent=2,default=str))

name: Read-only media delivery configuration
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Read Cloudflare delivery configuration only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python .github/scripts/inspect_media_delivery.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: media-delivery-readonly
          path: /tmp/media-delivery-evidence/

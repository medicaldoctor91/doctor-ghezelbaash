name: Verify Wikimedia entity upgrades
on:
  push:
    branches: [main]
    paths:
      - scripts/commons_verify_entity_upgrades.py
      - scripts/commons_verify_entity_upgrades_v2.py
      - .github/workflows/commons-verify-entity-upgrades.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check --no-input requests==2.32.5
      - name: Live read-only verification
        run: python scripts/commons_verify_entity_upgrades_v2.py

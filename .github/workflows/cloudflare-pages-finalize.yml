name: Finalize Cloudflare Pages production

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]

permissions:
  contents: read

jobs:
  finalize:
    if: github.event.pull_request.head.ref == 'cloudflare-pages-finalize-20260809'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 884d1d90bd1fb6ecca14992c6c60d677
      ZONE_NAME: ghezelbaash.ir
      CF_PROJECT: doctor-ghezelbaash
      CANONICAL_HOST: www.ghezelbaash.ir
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build exact validated production DIST
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          ASTRO_TELEMETRY_DISABLED=1 npm run build
          test -f dist/index.html
          test -f dist/404.html
          test -f dist/_headers
          test -f dist/_redirects
          test -f dist/graph.jsonld
          test -f dist/llms.txt

      - name: Create or verify Pages project
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.error, urllib.request
          A=os.environ['CLOUDFLARE_ACCOUNT_ID']; T=os.environ['CLOUDFLARE_API_TOKEN']; P=os.environ['CF_PROJECT']; B='https://api.cloudflare.com/client/v4'
          H={'Authorization':f'Bearer {T}','Accept':'application/json','Content-Type':'application/json','User-Agent':'ghezelbaash-pages-finalizer/1.0'}
          def call(m,p,b=None):
            req=urllib.request.Request(B+p,data=None if b is None else json.dumps(b,separators=(',',':')).encode(),method=m,headers=H)
            try:
              with urllib.request.urlopen(req,timeout=45) as r:
                raw=r.read().decode('utf-8','replace'); return r.status,json.loads(raw) if raw else {}
            except urllib.error.HTTPError as e:
              raw=e.read().decode('utf-8','replace')
              try: x=json.loads(raw) if raw else {}
              except Exception: x={'raw':raw[:1200]}
              return e.code,x
          path=f'/accounts/{A}/pages/projects/{P}'
          s,p=call('GET',path)
          if s==404:
            s,p=call('POST',f'/accounts/{A}/pages/projects',{'name':P,'production_branch':'main'})
            if not (s in (200,201) and p.get('success') is True): raise SystemExit(f'create failed {s} {p}')
            print('PROJECT_CREATED')
          elif not (s==200 and p.get('success') is True): raise SystemExit(f'lookup failed {s} {p}')
          else: print('PROJECT_EXISTS')
          s,p=call('GET',path)
          print('PROJECT_JSON',json.dumps(p.get('result') or {},ensure_ascii=False,sort_keys=True))
          PY

      - name: Deploy exact DIST
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 pages deploy dist --project-name="$CF_PROJECT" --branch=main

      - name: Attach canonical domain and configure pages.dev canonical redirect
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, time, urllib.error, urllib.parse, urllib.request
          A=os.environ['CLOUDFLARE_ACCOUNT_ID']; T=os.environ['CLOUDFLARE_API_TOKEN']; P=os.environ['CF_PROJECT']; HST=os.environ['CANONICAL_HOST']; ZN=os.environ['ZONE_NAME']; B='https://api.cloudflare.com/client/v4'
          HD={'Authorization':f'Bearer {T}','Accept':'application/json','Content-Type':'application/json','User-Agent':'ghezelbaash-pages-finalizer/1.1'}
          def call(m,p,b=None):
            req=urllib.request.Request(B+p,data=None if b is None else json.dumps(b,separators=(',',':')).encode(),method=m,headers=HD)
            try:
              with urllib.request.urlopen(req,timeout=45) as r:
                raw=r.read().decode('utf-8','replace'); return r.status,json.loads(raw) if raw else {}
            except urllib.error.HTTPError as e:
              raw=e.read().decode('utf-8','replace')
              try: x=json.loads(raw) if raw else {}
              except Exception: x={'raw':raw[:1600]}
              return e.code,x
          # Attach custom domain.
          dpath=f'/accounts/{A}/pages/projects/{P}/domains'
          s,p=call('GET',dpath); rows=(p.get('result') or []) if s==200 and p.get('success') is True else []
          if not any(x.get('name')==HST for x in rows):
            s,p=call('POST',dpath,{'name':HST}); print('ATTACH_DOMAIN',s,p.get('success'),p.get('errors'))
            if not (s in (200,201) and p.get('success') is True): raise SystemExit('custom domain attach failed')
          # Bulk Redirect list for Pages hostname -> canonical host.
          list_name='ghezelbaash_pages_dev_to_canonical'
          s,p=call('GET',f'/accounts/{A}/rules/lists?per_page=100')
          print('LISTS_GET',s,p.get('success'),p.get('errors'))
          if s==200 and p.get('success') is True:
            lists=p.get('result') or []; row=next((x for x in lists if x.get('name')==list_name),None)
            if not row:
              s2,p2=call('POST',f'/accounts/{A}/rules/lists',{'name':list_name,'description':'Permanent canonical redirect from Pages project hostname to www.ghezelbaash.ir','kind':'redirect'})
              print('LIST_CREATE',s2,p2.get('success'),p2.get('errors'))
              row=(p2.get('result') or {}) if s2 in (200,201) and p2.get('success') is True else None
            if row:
              lid=row.get('id')
              s3,p3=call('GET',f'/accounts/{A}/rules/lists/{lid}/items?per_page=100')
              items=p3.get('result') or [] if s3==200 and p3.get('success') is True else []
              src=f'https://{P}.pages.dev/'
              exists=any(((x.get('redirect') or {}).get('source_url')==src) for x in items)
              if not exists:
                body=[{'redirect':{'source_url':src,'target_url':f'https://{HST}/','status_code':301,'include_subdomains':False,'subpath_matching':True,'preserve_query_string':True,'preserve_path_suffix':True}}]
                s4,p4=call('POST',f'/accounts/{A}/rules/lists/{lid}/items',body)
                print('LIST_ITEM_CREATE',s4,p4.get('success'),p4.get('errors'))
              # Ensure account redirect ruleset invokes list.
              s5,p5=call('GET',f'/accounts/{A}/rulesets')
              print('ACCOUNT_RULESETS_GET',s5,p5.get('success'),p5.get('errors'))
              if s5==200 and p5.get('success') is True:
                rs=next((x for x in (p5.get('result') or []) if x.get('kind')=='root' and x.get('phase')=='http_request_redirect'),None)
                marker='Canonicalize doctor-ghezelbaash.pages.dev to www.ghezelbaash.ir'
                rule={'action':'redirect','expression':'true','description':marker,'enabled':True,'action_parameters':{'from_list':{'name':list_name,'key':'http.request.full_uri'}}}
                if not rs:
                  s6,p6=call('POST',f'/accounts/{A}/rulesets',{'name':'Bulk Redirects','description':'Account bulk redirects','kind':'root','phase':'http_request_redirect','rules':[rule]})
                  print('ACCOUNT_RULESET_CREATE',s6,p6.get('success'),p6.get('errors'))
                else:
                  rid=rs.get('id'); s6,p6=call('GET',f'/accounts/{A}/rulesets/{rid}')
                  rules=(p6.get('result') or {}).get('rules') or [] if s6==200 and p6.get('success') is True else []
                  if not any(r.get('description')==marker for r in rules):
                    s7,p7=call('POST',f'/accounts/{A}/rulesets/{rid}/rules',rule)
                    print('ACCOUNT_RULE_CREATE',s7,p7.get('success'),p7.get('errors'))
          # Wait for custom domain activation and report final project/domain.
          for i in range(36):
            s,p=call('GET',dpath); rows=(p.get('result') or []) if s==200 and p.get('success') is True else []
            r=next((x for x in rows if x.get('name')==HST),{})
            print('DOMAIN_STATE',i+1,json.dumps(r,ensure_ascii=False,sort_keys=True))
            if r.get('status')=='active': break
            time.sleep(5)
          s,p=call('GET',f'/accounts/{A}/pages/projects/{P}')
          print('FINAL_PROJECT',json.dumps(p.get('result') or {},ensure_ascii=False,sort_keys=True))
          PY

      - name: Re-audit zone and final live endpoints
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, time, urllib.error, urllib.parse, urllib.request
          A=os.environ['CLOUDFLARE_ACCOUNT_ID']; T=os.environ['CLOUDFLARE_API_TOKEN']; P=os.environ['CF_PROJECT']; H=os.environ['CANONICAL_HOST']; ZN=os.environ['ZONE_NAME']; B='https://api.cloudflare.com/client/v4'
          HD={'Authorization':f'Bearer {T}','Accept':'application/json','Content-Type':'application/json','User-Agent':'ghezelbaash-final-audit/1.0'}
          def api(path):
            req=urllib.request.Request(B+path,headers=HD)
            try:
              with urllib.request.urlopen(req,timeout=40) as r:
                raw=r.read().decode('utf-8','replace'); return r.status,json.loads(raw) if raw else {}
            except urllib.error.HTTPError as e:
              raw=e.read().decode('utf-8','replace')
              try:x=json.loads(raw) if raw else {}
              except Exception:x={'raw':raw[:1000]}
              return e.code,x
          q=urllib.parse.urlencode({'name':ZN,'account.id':A,'per_page':50}); s,z=api('/zones?'+q); zone=(z.get('result') or [{}])[0]; zid=zone.get('id')
          report={'zone':{'status':zone.get('status'),'paused':zone.get('paused')},'dnssec':{},'bot':{},'settings':{},'pages':{}}
          if zid:
            s,p=api(f'/zones/{zid}/dnssec'); report['dnssec']=p.get('result') or {'http':s,'errors':p.get('errors')}
            s,p=api(f'/zones/{zid}/bot_management'); report['bot']=p.get('result') or {'http':s,'errors':p.get('errors')}
            for sid in ['ssl','always_use_https','tls_1_3','min_tls_version','http2','http3','brotli','early_hints','ipv6','rocket_loader','browser_check','cache_level','development_mode','always_online','speed_brain','server_side_exclude','email_obfuscation','hotlink_protection','fonts']:
              s,p=api(f'/zones/{zid}/settings/{sid}'); report['settings'][sid]=(p.get('result') or {}).get('value') if s==200 and p.get('success') is True else {'http':s}
          s,p=api(f'/accounts/{A}/pages/projects/{P}'); report['pages']['project']=p.get('result') or {'http':s}
          s,p=api(f'/accounts/{A}/pages/projects/{P}/domains'); report['pages']['domains']=p.get('result') or {'http':s}
          print('FINAL_PLATFORM_AUDIT',json.dumps(report,ensure_ascii=False,indent=2,sort_keys=True))

          def fetch(url):
            req=urllib.request.Request(url,headers={'Cache-Control':'no-cache','Pragma':'no-cache','User-Agent':'ghezelbaash-live-finalizer/1.0'})
            try:
              with urllib.request.urlopen(req,timeout=30) as r: return r.status,dict(r.headers),r.geturl(),r.read(2048)
            except urllib.error.HTTPError as e: return e.code,dict(e.headers),e.geturl(),e.read(2048)
          for i in range(36):
            st,_,_,_=fetch(f'https://{H}/')
            if st==200: break
            time.sleep(5)
          tests=[(f'https://{H}/',200),(f'https://{H}/robots.txt',200),(f'https://{H}/sitemap.xml',200),(f'https://{H}/graph.jsonld',200),(f'https://{H}/llms.txt',200),(f'https://{H}/definitely-not-real-404-20260809',404),(f'https://{P}.pages.dev/test-canonical-path?cf=1',200)]
          for url,want in tests:
            st,hh,final,b=fetch(url)
            print('LIVE',st,'requested=',url,'final=',final,'location=',hh.get('Location'),'x-robots=',hh.get('X-Robots-Tag'),'cache=',hh.get('CF-Cache-Status'),'server=',hh.get('Server'))
            if url.startswith(f'https://{H}/') and st!=want: raise SystemExit(f'canonical endpoint failed {url}: {st}!={want}')
          PY

name: v1.2.2 foundation migration
on:
  push:
    branches: [release/v1.2.2-candidate]
    paths:
      - scripts/bootstrap-v122-registries.mjs
      - .github/workflows/v122-bootstrap-registries.yml
permissions:
  contents: write
jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0
      - run: node scripts/bootstrap-v122-registries.mjs
      - name: Commit coherent migration result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name ghezelbaash-release-bot
          git config user.email actions@users.noreply.github.com
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Migrate v1.2.2 foundation architecture"
          git push origin HEAD:release/v1.2.2-candidate

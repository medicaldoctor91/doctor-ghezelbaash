name: v1.2.2 bootstrap registries
on:
  push:
    branches: [release/v1.2.2-candidate]
    paths:
      - scripts/bootstrap-v122-registries.mjs
      - .github/workflows/v122-bootstrap-registries.yml
permissions:
  contents: write
jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0
      - run: node scripts/bootstrap-v122-registries.mjs
      - name: Commit bootstrap registries
        shell: bash
        run: |
          set -euo pipefail
          git config user.name ghezelbaash-release-bot
          git config user.email actions@users.noreply.github.com
          git add src/data/service-registry.json src/data/answer-registry.json src/data/visible-contract.json src/data/retrieval/query-matrix-policy.json .release/policy/hf-authority-contract.json
          git diff --cached --quiet && exit 0
          git commit -m "Bootstrap v1.2.2 semantic registries"
          git push origin HEAD:release/v1.2.2-candidate

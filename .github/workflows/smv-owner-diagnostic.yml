name: SMV ownership diagnostic

on:
  push:
    branches: [audit/smv-postmerge-2026-08-29]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Inspect live SMV warning owners
        shell: bash
        run: |
          set -euo pipefail
          curl --silent --show-error --location --max-time 90 --output /tmp/live.html 'https://www.ghezelbaash.ir/'
          curl --silent --show-error --location --max-time 90 \
            --output /tmp/smv.raw \
            --request POST 'https://validator.schema.org/validate' \
            --header 'Accept: application/json' \
            --header 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode 'url=https://www.ghezelbaash.ir/'
          python - <<'PY'
          from pathlib import Path
          import json, re
          live=Path('/tmp/live.html').read_text('utf-8',errors='replace')
          raw=Path('/tmp/smv.raw').read_text('utf-8',errors='replace').strip()
          if raw.startswith(")]}'"):
              raw=raw[4:].lstrip()
          data=json.loads(raw)
          found={}
          def walk(value,path='$'):
              if isinstance(value,dict):
                  for issue in value.get('errors') or []:
                      if isinstance(issue,dict) and issue.get('errorType')=='UNKNOWN_FIELD' and issue.get('args')==['mainContentOfPage','WebPageElement']:
                          eid=issue.get('errorID')
                          if eid not in found:
                              begin=issue.get('begin') if isinstance(issue.get('begin'),int) else None
                              end=issue.get('end') if isinstance(issue.get('end'),int) else None
                              snippet=None
                              if begin is not None:
                                  snippet=live[max(0,begin-220):min(len(live),(end or begin)+300)]
                              found[eid]={
                                  'path':path,
                                  'begin':begin,
                                  'end':end,
                                  'ownerSet':issue.get('ownerSet'),
                                  'ownerToSeverity':issue.get('ownerToSeverity'),
                                  'snippet':snippet,
                              }
                  for key,nested in value.items():
                      if key!='errors': walk(nested,f'{path}.{key}')
              elif isinstance(value,list):
                  for i,nested in enumerate(value): walk(nested,f'{path}[{i}]')
          walk(data)
          print('SMV_OWNER_SAMPLES='+json.dumps(found,ensure_ascii=False,sort_keys=True))
          wrappers=[]
          for m in re.finditer(r'<section\b(?=[^>]*\bid=["\'][^"\']+-semantic-scope["\'])[^>]*>',live,re.I):
              wrappers.append(live[m.start():min(len(live),m.start()+900)])
          print('LIVE_WRAPPER_SAMPLES='+json.dumps(wrappers,ensure_ascii=False))
          PY

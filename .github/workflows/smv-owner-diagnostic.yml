name: SMV ownership diagnostic

on:
  push:
    branches: [audit/smv-postmerge-2026-08-29]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Inspect live SMV warning contexts
        shell: bash
        run: |
          set -euo pipefail
          curl --silent --show-error --location --max-time 90 \
            --output /tmp/smv.raw \
            --request POST 'https://validator.schema.org/validate' \
            --header 'Accept: application/json' \
            --header 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode 'url=https://www.ghezelbaash.ir/'
          python - <<'PY'
          from pathlib import Path
          from collections import Counter, defaultdict
          import json
          raw=Path('/tmp/smv.raw').read_text('utf-8',errors='replace').strip()
          if raw.startswith(")]}'"):
              raw=raw[4:].lstrip()
          data=json.loads(raw)
          rows=defaultdict(list)
          def target(issue):
              return isinstance(issue,dict) and issue.get('errorType')=='UNKNOWN_FIELD' and issue.get('args')==['mainContentOfPage','WebPageElement']
          def walk(value,path='$'):
              if isinstance(value,dict):
                  hits=[issue for issue in value.get('errors') or [] if target(issue)]
                  if hits:
                      ident=value.get('idProperty') if isinstance(value.get('idProperty'),dict) else {}
                      context={
                          'path':path,
                          'typeGroup':value.get('typeGroup'),
                          'id':ident.get('value'),
                          'pred':value.get('pred'),
                          'value':value.get('value') if isinstance(value.get('value'),(str,int,float,bool)) else None,
                          'keys':sorted(value.keys()),
                      }
                      for issue in hits:
                          rows[issue.get('errorID')].append(context)
                  for key,nested in value.items():
                      if key!='errors': walk(nested,f'{path}.{key}')
              elif isinstance(value,list):
                  for i,nested in enumerate(value): walk(nested,f'{path}[{i}]')
          walk(data)
          out={}
          for eid,contexts in rows.items():
              counts=Counter(json.dumps(c,ensure_ascii=False,sort_keys=True,default=str) for c in contexts)
              unique=[dict(json.loads(raw),count=count) for raw,count in counts.most_common()]
              informative=[c for c in unique if c.get('typeGroup') or c.get('id') or c.get('pred')]
              out[eid]={
                  'totalOccurrences':len(contexts),
                  'informativeContexts':informative[:80],
              }
          print('SMV_ERROR_CONTEXTS='+json.dumps(out,ensure_ascii=False,sort_keys=True))
          PY

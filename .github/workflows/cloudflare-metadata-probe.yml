name: Cloudflare Metadata Probe

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  checks: read
  deployments: read

jobs:
  probe:
    if: github.head_ref == 'cleanup/performance-observability'
    runs-on: ubuntu-latest
    steps:
      - name: Inspect GitHub metadata for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          echo '--- check runs ---'
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${REPOSITORY}/commits/${HEAD_SHA}/check-runs" \
            | jq '{total_count, check_runs: [.check_runs[] | {name, status, conclusion, app: .app.name, details_url}]}'
          echo '--- deployments ---'
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${REPOSITORY}/deployments?sha=${HEAD_SHA}" \
            | jq '[.[] | {id, environment, ref, sha, creator: .creator.login, task, production_environment}]'

name: Diagnose semantic section containment

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/diagnose-section-containment.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Reproduce source transformation and build with full logging
        shell: bash
        run: |
          set +e
          mkdir -p tmp
          report=tmp/section-containment-diagnostic.txt
          : > "$report"
          python3 - <<'PY' >> "$report" 2>&1
          from pathlib import Path
          import re
          w=Path('.github/workflows/performance-pass-section-containment.yml').read_text(encoding='utf-8')
          plugin=re.search(r"cat > src/plugins/sectionize-h2\.mjs <<'EOF'\n(.*?)\n\s*EOF",w,re.S)
          scripts=re.findall(r"python3 - <<'PY'\n(.*?)\n\s*PY",w,re.S)
          print('plugin_match',bool(plugin),'python_blocks',len(scripts))
          Path('src/plugins').mkdir(parents=True,exist_ok=True)
          if plugin:Path('src/plugins/sectionize-h2.mjs').write_text(plugin.group(1)+'\n',encoding='utf-8')
          if scripts:
            import textwrap
            code=textwrap.dedent(scripts[0])
            Path('/tmp/containment-patch.py').write_text(code,encoding='utf-8')
            exec(compile(code,'/tmp/containment-patch.py','exec'))
          PY
          echo "patch_exit=$?" >> "$report"
          npm ci --no-audit --no-fund >> "$report" 2>&1
          echo "npm_ci_exit=$?" >> "$report"
          npm run build >> "$report" 2>&1
          echo "build_exit=$?" >> "$report"
          python3 - <<'PY' >> "$report" 2>&1
          from pathlib import Path
          import re
          p=Path('dist/index.html')
          print('dist_exists',p.exists())
          if p.exists():
            h=p.read_text(encoding='utf-8')
            print('bytes',len(h.encode()))
            print('sections',len(re.findall(r'<section\b[^>]*semantic-section',h)))
            print('h2',len(re.findall(r'<h2\b',h)))
            print('sample',re.findall(r'<section\b[^>]{0,300}',h)[:2])
          PY
          git reset --hard HEAD
          git clean -fd -e tmp/section-containment-diagnostic.txt
      - name: Commit diagnostic and remove workflow
        if: always()
        run: |
          git config user.name 'OpenAI Project Automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/diagnose-section-containment.yml
          git add tmp/section-containment-diagnostic.txt
          git commit -m 'Record semantic section containment diagnostic'
          git push origin HEAD:main

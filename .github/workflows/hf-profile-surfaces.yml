name: Hugging Face profile authority verifier

on:
  schedule:
    - cron: '53 4 * * 2'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Verify physician-first public HF topology without mutation
        shell: bash
        run: |
          set -euo pipefail
          # Permanent fail-closed contract for the public Hugging Face authority surfaces.
          python - <<'PY'
          import json,time,urllib.request
          def text(url):
              req=urllib.request.Request(url,headers={'Cache-Control':'no-cache','User-Agent':'ghezelbaash-hf-profile-verifier/2.0'})
              with urllib.request.urlopen(req,timeout=45) as r:return r.read().decode('utf-8','replace')
          dataset='doctor-ghezelbaash/dr-saeid-ghezelbaash-entity-data'
          meta=json.loads(text('https://huggingface.co/api/datasets/'+dataset+'?full=true&_='+str(time.time_ns())))
          if meta.get('private') or meta.get('gated') not in (False,None,'false','auto'):
              raise SystemExit('HF Dataset unexpectedly private/gated')
          readme=text('https://huggingface.co/datasets/'+dataset+'/resolve/main/README.md?download=true&_='+str(time.time_ns()))
          dataset_tokens=[
              'Q140287622','Q140288589','Q140304972','/g/11nqdfk76c','0009-0001-9346-8475',
              'Dr. Saeed Ghezelbash Public Knowledge Graph','AI/retrieval distribution',
              '10.5281/zenodo.18765168','10.5281/zenodo.21930954','query-matrix.jsonl','live_observations'
          ]
          for token in dataset_tokens:
              if token not in readme: raise SystemExit('Dataset authority topology missing '+token)
          org=text('https://huggingface.co/doctor-ghezelbaash/raw/main/README.md?_='+str(time.time_ns()))
          org_tokens=[
              'Dr. Saeed Ghezelbash','دکتر سعید قزلباش','Q140287622','Q140288589','Q140304972',
              '/g/11nqdfk76c','0009-0001-9346-8475','https://www.ghezelbaash.ir/',
              'graph.jsonld','llms-full.txt','query-matrix.jsonl','croissant.json','dcat.ttl','provenance.jsonld',
              '10.5281/zenodo.18765168','10.5281/zenodo.21930954',dataset
          ]
          for token in org_tokens:
              if token not in org: raise SystemExit('HF organization card topology missing '+token)
          print(json.dumps({
              'HF_PROFILE_TOPOLOGY_PASS':True,
              'dataset':dataset,
              'datasetAuthorityMarkers':len(dataset_tokens),
              'organizationAuthorityMarkers':len(org_tokens),
              'organizationVerified':True
          },sort_keys=True))
          PY

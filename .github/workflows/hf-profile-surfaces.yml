name: Hugging Face profile authority surfaces

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/hf-profile-surfaces.yml
  workflow_run:
    workflows: ["Atomic ceiling release"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: doctor-ghezelbaash-hf-profile-surfaces
  cancel-in-progress: true

jobs:
  enforce:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      HF_DATASET: doctor-ghezelbaash/dr-saeid-ghezelbaash-entity-data
    steps:
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install Hugging Face Hub client
        run: python -m pip install --disable-pip-version-check --quiet 'huggingface_hub>=0.34,<2'

      - name: Pin dataset on personal and organization profiles
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN || secrets.HUGGINGFACE_TOKEN || secrets.HUGGING_FACE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${HF_TOKEN:-}"
          echo "::add-mask::$HF_TOKEN"
          python - <<'PY'
          import os
          from huggingface_hub import (
              add_collection_item,
              create_collection,
              list_collections,
              update_collection_metadata,
          )

          token = os.environ['HF_TOKEN']
          dataset = os.environ['HF_DATASET']
          title = 'Dr. Saeed Ghezelbash — Entity Knowledge Graph'
          description = 'Public AI/ML knowledge-graph dataset for physician Saeed Ghezelbash (Wikidata Q140287622), linked to ghezelbaash.ir.'
          note = (
              "AI/ML distribution of Dr. Saeed Ghezelbash's canonical first-party knowledge-graph dataset. "
              'Canonical Dataset IRI: https://www.ghezelbaash.ir/graph.jsonld#dataset · Wikidata: Q140287622.'
          )

          def ensure(namespace):
              existing = next((c for c in list_collections(owner=namespace, token=token) if c.title == title), None)
              if existing is None:
                  collection = create_collection(
                      title=title,
                      namespace=namespace,
                      description=description,
                      private=False,
                      token=token,
                  )
                  print('COLLECTION_CREATED', namespace, collection.slug)
              else:
                  collection = existing
                  print('COLLECTION_FOUND', namespace, collection.slug)

              collection = update_collection_metadata(
                  collection.slug,
                  title=title,
                  description=description,
                  position=0,
                  private=False,
                  token=token,
              )
              add_collection_item(
                  collection.slug,
                  item_id=dataset,
                  item_type='dataset',
                  note=note,
                  exists_ok=True,
                  token=token,
              )
              print('COLLECTION_ENFORCED', namespace, collection.slug, dataset)
              return collection.slug

          personal = ensure('Ghezelbaash')
          organization = ensure('doctor-ghezelbaash')
          print('HF_PROFILE_SURFACES_PASS', personal, organization)
          PY

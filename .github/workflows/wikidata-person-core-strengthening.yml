name: Wikidata person core strengthening

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wikidata-person-core-strengthening.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  strengthen:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      WD_API: https://www.wikidata.org/w/api.php
      COMMONS_API: https://commons.wikimedia.org/w/api.php
      PERSON_QID: Q140287622
      FILLER_QID: Q3745388
      BOTULINUM_QID: Q4095199
      VIDEO_FILE: 'دکتر سعید قزلباش درباره جالپرو و پروفایلو.webm'
      OFFICIAL_URL: https://www.ghezelbaash.ir/
      INDEPENDENT_URL: https://iranmedlabs.com/skin-and-hair-and-beauty/120049/
      WIKIVERSITY_USERNAME: ${{ secrets.WIKIVERSITY_USERNAME }}
      WIKIVERSITY_BOT_PASSWORD: ${{ secrets.WIKIVERSITY_BOT_PASSWORD }}
      COMMONS_USERNAME: ${{ secrets.COMMONS_USERNAME }}
      COMMONS_BOT_PASSWORD: ${{ secrets.COMMONS_BOT_PASSWORD }}
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install requests
        run: python -m pip install --disable-pip-version-check --no-input requests==2.32.5
      - name: Preflight, apply, and live-verify Wikidata statements
        shell: python
        run: |
          import datetime as dt
          import json
          import os
          import requests
          import sys
          from urllib.parse import quote

          WD = os.environ['WD_API']
          CM = os.environ['COMMONS_API']
          PERSON = os.environ['PERSON_QID']
          FILLER = os.environ['FILLER_QID']
          BOTULINUM = os.environ['BOTULINUM_QID']
          VIDEO = os.environ['VIDEO_FILE']
          OFFICIAL = os.environ['OFFICIAL_URL']
          INDEPENDENT = os.environ['INDEPENDENT_URL']
          UA = 'Medicaldoctor91WikidataStrengthener/1.0 (https://www.ghezelbaash.ir/)'

          def fail(msg, details=None):
              payload = {'ok': False, 'error': msg}
              if details is not None:
                  payload['details'] = details
              print(json.dumps(payload, ensure_ascii=False, indent=2, default=str))
              raise SystemExit(1)

          def get(session, url, params):
              r = session.get(url, params={**params, 'format': 'json', 'formatversion': 2}, timeout=60)
              r.raise_for_status()
              data = r.json()
              if 'error' in data:
                  fail('MediaWiki GET error', data['error'])
              return data

          def post(session, url, data, allow_error=False):
              r = session.post(url, data={**data, 'format': 'json', 'formatversion': 2, 'maxlag': 5}, timeout=90)
              r.raise_for_status()
              payload = r.json()
              if 'error' in payload and not allow_error:
                  fail('MediaWiki POST error', payload['error'])
              return payload

          def qid_from_snak(snak):
              value = snak.get('datavalue', {}).get('value')
              if isinstance(value, dict):
                  if isinstance(value.get('id'), str):
                      return value['id']
                  if isinstance(value.get('numeric-id'), int):
                      return f"Q{value['numeric-id']}"
              return None

          def scalar_from_snak(snak):
              return snak.get('datavalue', {}).get('value')

          def fetch_entity(session, qid):
              return get(session, WD, {'action': 'wbgetentities', 'ids': qid, 'props': 'claims|labels|info'})['entities'][qid]

          def item_value(qid):
              return json.dumps({'entity-type': 'item', 'numeric-id': int(qid[1:])}, separators=(',', ':'))

          def time_value():
              today = dt.datetime.now(dt.timezone.utc).date().isoformat()
              return {
                  'time': f'+{today}T00:00:00Z',
                  'timezone': 0,
                  'before': 0,
                  'after': 0,
                  'precision': 11,
                  'calendarmodel': 'http://www.wikidata.org/entity/Q1985727',
              }

          def ref_snaks(url):
              return {
                  'P854': [{
                      'snaktype': 'value', 'property': 'P854',
                      'datavalue': {'value': url, 'type': 'string'}, 'datatype': 'url'
                  }],
                  'P813': [{
                      'snaktype': 'value', 'property': 'P813',
                      'datavalue': {'value': time_value(), 'type': 'time'}, 'datatype': 'time'
                  }],
              }

          def claim_target(claim):
              snak = claim.get('mainsnak', {})
              return qid_from_snak(snak) or scalar_from_snak(snak)

          def reference_urls(claim):
              urls = set()
              for ref in claim.get('references', []):
                  for snak in ref.get('snaks', {}).get('P854', []):
                      v = scalar_from_snak(snak)
                      if isinstance(v, str):
                          urls.add(v)
              return urls

          # Live source verification before any mutation.
          web = requests.Session(); web.headers['User-Agent'] = UA
          official = web.get(OFFICIAL, timeout=60)
          if official.status_code != 200:
              fail('Official website is not live', {'status': official.status_code})
          official_text = official.text
          for token in ['دکتر سعید قزلباش', 'بوتاکس', 'فیلر']:
              if token not in official_text:
                  fail('Official website preflight missing required evidence token', token)

          independent = web.get(INDEPENDENT, timeout=60)
          if independent.status_code != 200:
              fail('Independent reference is not live', {'status': independent.status_code})
          independent_text = independent.text
          for token in ['سعید قزلباش', 'بوتاکس', 'فیلر']:
              if token not in independent_text:
                  fail('Independent source preflight missing required evidence token', token)

          # Verify target concept items and property datatypes.
          anon = requests.Session(); anon.headers['User-Agent'] = UA
          targets = get(anon, WD, {
              'action': 'wbgetentities',
              'ids': f'{PERSON}|{FILLER}|{BOTULINUM}|P10|P101',
              'props': 'labels|claims|datatype|info',
              'languages': 'en|fa'
          })['entities']
          if targets[FILLER].get('labels', {}).get('en', {}).get('value') != 'dermal fillers':
              fail('Filler target identity drift', targets[FILLER].get('labels'))
          if targets[BOTULINUM].get('labels', {}).get('en', {}).get('value') != 'botulinum toxin type A':
              fail('Botulinum target identity drift', targets[BOTULINUM].get('labels'))
          if targets['P10'].get('datatype') != 'commonsMedia':
              fail('P10 datatype drift', targets['P10'].get('datatype'))
          if targets['P101'].get('datatype') != 'wikibase-item':
              fail('P101 datatype drift', targets['P101'].get('datatype'))

          # Verify Commons video and reverse SDC edges before adding person->video P10.
          file_title = 'File:' + VIDEO
          fq = get(anon, CM, {'action': 'query', 'titles': file_title, 'prop': 'info'})['query']['pages'][0]
          if fq.get('missing') or not fq.get('pageid'):
              fail('Commons video missing', file_title)
          mid = 'M' + str(fq['pageid'])
          media = get(anon, CM, {'action': 'wbgetentities', 'ids': mid})['entities'][mid]
          statements = media.get('statements', {})
          for prop in ['P180', 'P10894', 'P170', 'P3931']:
              vals = {qid_from_snak(c.get('mainsnak', {})) for c in statements.get(prop, [])}
              if PERSON not in vals:
                  fail('Commons reverse SDC invariant missing', {'mediainfo': mid, 'property': prop, 'values': sorted(v for v in vals if v)})

          # Try existing Wikimedia bot credentials on Wikidata; select first account with edit right.
          candidates = [
              ('wikiversity', os.environ.get('WIKIVERSITY_USERNAME', ''), os.environ.get('WIKIVERSITY_BOT_PASSWORD', '')),
              ('commons', os.environ.get('COMMONS_USERNAME', ''), os.environ.get('COMMONS_BOT_PASSWORD', '')),
          ]
          auth = None
          auth_source = None
          for source, username, password in candidates:
              if not username.strip() or not password.strip():
                  continue
              s = requests.Session(); s.headers['User-Agent'] = UA
              token = get(s, WD, {'action': 'query', 'meta': 'tokens', 'type': 'login'})['query']['tokens']['logintoken']
              login = post(s, WD, {
                  'action': 'login', 'lgname': username.strip(), 'lgpassword': password.strip(), 'lgtoken': token
              }, allow_error=True)
              if login.get('login', {}).get('result') != 'Success':
                  continue
              ui = get(s, WD, {'action': 'query', 'meta': 'userinfo', 'uiprop': 'rights|groups'})['query']['userinfo']
              if 'edit' in set(ui.get('rights', [])):
                  auth = s; auth_source = source
                  authenticated_as = ui.get('name')
                  break
          if auth is None:
              fail('No configured Wikimedia BotPassword can edit Wikidata')

          csrf = get(auth, WD, {'action': 'query', 'meta': 'tokens', 'type': 'csrf'})['query']['tokens']['csrftoken']

          def ensure_claim(prop, target, value_json, summary, reference_list):
              entity = fetch_entity(auth, PERSON)
              existing = [c for c in entity.get('claims', {}).get(prop, []) if claim_target(c) == target]
              if len(existing) > 1:
                  fail('Duplicate target claim already exists', {'property': prop, 'target': target, 'ids': [c.get('id') for c in existing]})
              created = False
              if existing:
                  claim = existing[0]
              else:
                  result = post(auth, WD, {
                      'action': 'wbcreateclaim',
                      'entity': PERSON,
                      'property': prop,
                      'snaktype': 'value',
                      'value': value_json,
                      'token': csrf,
                      'summary': summary,
                      'baserevid': entity.get('lastrevid'),
                  })
                  claim = result['claim']
                  created = True
              claim_id = claim['id']

              # Refresh claim so reference state is current.
              entity = fetch_entity(auth, PERSON)
              current = next(c for c in entity.get('claims', {}).get(prop, []) if c.get('id') == claim_id)
              urls = reference_urls(current)
              added_refs = []
              for ref_url in reference_list:
                  if ref_url in urls:
                      continue
                  post(auth, WD, {
                      'action': 'wbsetreference',
                      'statement': claim_id,
                      'snaks': json.dumps(ref_snaks(ref_url), ensure_ascii=False, separators=(',', ':')),
                      'snaks-order': json.dumps(['P854', 'P813']),
                      'token': csrf,
                      'summary': 'Add verification reference for Saeed Ghezelbash entity statement',
                  })
                  added_refs.append(ref_url)
                  urls.add(ref_url)
              return {'property': prop, 'target': target, 'claim_id': claim_id, 'created': created, 'references_added': added_refs}

          commons_url = 'https://commons.wikimedia.org/wiki/File:' + quote(VIDEO.replace(' ', '_'), safe=':_()')
          results = []
          results.append(ensure_claim(
              'P10', VIDEO, json.dumps(VIDEO, ensure_ascii=False),
              'Add verified Commons educational video for Saeed Ghezelbash',
              [commons_url, OFFICIAL]
          ))
          results.append(ensure_claim(
              'P101', FILLER, item_value(FILLER),
              'Add referenced dermal fillers field of work for Saeed Ghezelbash',
              [INDEPENDENT, OFFICIAL]
          ))
          results.append(ensure_claim(
              'P101', BOTULINUM, item_value(BOTULINUM),
              'Add referenced botulinum toxin type A field of work for Saeed Ghezelbash',
              [INDEPENDENT, OFFICIAL]
          ))

          # Independent live read-back from anonymous API.
          final = fetch_entity(anon, PERSON)
          def matches(prop, target):
              return [c for c in final.get('claims', {}).get(prop, []) if claim_target(c) == target]

          checks = {
              'P10_video_count': len(matches('P10', VIDEO)),
              'P101_filler_count': len(matches('P101', FILLER)),
              'P101_botulinum_count': len(matches('P101', BOTULINUM)),
          }
          if checks != {'P10_video_count': 1, 'P101_filler_count': 1, 'P101_botulinum_count': 1}:
              fail('Final live claim cardinality mismatch', checks)

          required_refs = {
              ('P10', VIDEO): {commons_url, OFFICIAL},
              ('P101', FILLER): {INDEPENDENT, OFFICIAL},
              ('P101', BOTULINUM): {INDEPENDENT, OFFICIAL},
          }
          verified_refs = {}
          for (prop, target), expected in required_refs.items():
              claim = matches(prop, target)[0]
              actual = reference_urls(claim)
              missing = expected - actual
              if missing:
                  fail('Final reference verification failed', {'property': prop, 'target': target, 'missing': sorted(missing), 'actual': sorted(actual)})
              verified_refs[f'{prop}:{target}'] = sorted(actual)

          print(json.dumps({
              'ok': True,
              'authenticated_as': authenticated_as,
              'credential_source': auth_source,
              'person': PERSON,
              'results': results,
              'checks': checks,
              'verified_references': verified_refs,
              'commons_reverse_sdc': {
                  'mediainfo': mid,
                  'P180': PERSON,
                  'P10894': PERSON,
                  'P170': PERSON,
                  'P3931': PERSON,
              },
              'final_lastrevid': final.get('lastrevid'),
          }, ensure_ascii=False, indent=2))

name: Publish 2021 CC-BY paper to English Wikisource
on:
  push:
    branches: [main]
    paths:
      - 'scripts/wikisource_publish_2021_temp.py'
      - '.github/workflows/wikisource-publish-2021-temp.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      WIKI_USERNAME: ${{ secrets.WIKIVERSITY_USERNAME }}
      WIKI_BOT_PASSWORD: ${{ secrets.WIKIVERSITY_BOT_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check --no-input requests==2.32.5
      - name: Validate credentials are present
        shell: bash
        run: |
          set -euo pipefail
          test -n "$WIKI_USERNAME"
          test -n "$WIKI_BOT_PASSWORD"
      - name: Patch one-shot parser for current JATS structure
        shell: python
        run: |
          from pathlib import Path
          p=Path('scripts/wikisource_publish_2021_temp.py')
          s=p.read_text(encoding='utf-8')
          s=s.replace(",assert='user'", ",**{'assert':'user'}")
          start=s.index('    contribs=[]\n')
          end=s.index("    if not any('Ghezelbash' in x for x in contribs):", start)
          new='''    contribs=[]\n    for c in root.iter():\n        if local(c.tag) != 'contrib':\n            continue\n        surname=next((x for x in c.iter() if local(x.tag)=='surname'),None)\n        given=next((x for x in c.iter() if local(x.tag)=='given-names'),None)\n        sn=norm(' '.join(surname.itertext())) if surname is not None else ''\n        gn=norm(' '.join(given.itertext())) if given is not None else ''\n        name=norm((gn+' '+sn).strip())\n        if name and name not in contribs:\n            contribs.append(name)\n'''
          s=s[:start]+new+s[end:]
          p.write_text(s,encoding='utf-8')
      - name: Publish work, author page, redirect, and verified Wikidata sitelinks
        run: python scripts/wikisource_publish_2021_temp.py

name: Audit live Wikimedia scholarly state

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wikimedia-scholar-audit-temp.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      WIKIMEDIA_USERNAME: ${{ secrets.WIKIVERSITY_USERNAME }}
      WIKIMEDIA_BOT_PASSWORD: ${{ secrets.WIKIVERSITY_BOT_PASSWORD }}
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check --no-input requests==2.32.5
      - name: Read-only audit of Wikidata, Wikipedia and authenticated rights
        shell: python
        run: |
          import json, os, requests

          WD='https://www.wikidata.org/w/api.php'
          WP='https://en.wikipedia.org/w/api.php'
          UA='Medicaldoctor91ScholarlyAudit/1.0 (https://www.ghezelbaash.ir/)'
          QIDS=['Q36942316','Q140298431','Q117439006','Q141104212','Q141104222','Q141104223','Q141104224','Q141104236','Q141104242','Q141104244','Q141104245','Q141104262']
          EXPECTED_DOIS={
            'Q36942316':'10.4103/2008-7802.182734',
            'Q140298431':'10.3390/healthcare9091169',
            'Q117439006':'10.3390/ijerph19159759',
            'Q141104212':'10.1016/j.jad.2019.04.039',
            'Q141104222':'10.3390/md23020084',
            'Q141104223':'10.3390/healthcare9121626',
            'Q141104224':'10.3390/ijerph19159759',
            'Q141104236':'10.3389/fnbeh.2023.1135909',
            'Q141104242':'10.3389/fpsyg.2024.1452878',
            'Q141104244':'10.3390/jcm14010170',
            'Q141104245':'10.3389/fpsyt.2025.1516920',
            'Q141104262':'10.1111/bjhp.70024',
          }

          def req(sess,url,params,post=False):
            p={**params,'format':'json','formatversion':2}
            r=(sess.post(url,data=p,timeout=90) if post else sess.get(url,params=p,timeout=90))
            r.raise_for_status(); d=r.json()
            if 'error' in d: raise RuntimeError(d['error'])
            return d

          anon=requests.Session(); anon.headers['User-Agent']=UA
          entities=req(anon,WD,{'action':'wbgetentities','ids':'|'.join(QIDS),'props':'claims|labels|descriptions|info'})['entities']
          def qidval(c):
            v=c.get('mainsnak',{}).get('datavalue',{}).get('value')
            return v.get('id') if isinstance(v,dict) else v
          def vals(e,p): return [qidval(c) for c in e.get('claims',{}).get(p,[]) if qidval(c) is not None]
          out={'entities':{},'doi_collisions':{},'wikipedia':{},'auth':{}}
          for q in QIDS:
            e=entities.get(q,{})
            out['entities'][q]={
              'missing':bool(e.get('missing',False)),
              'lastrevid':e.get('lastrevid'),
              'label':e.get('labels',{}).get('en',{}).get('value'),
              'P356':vals(e,'P356'),'P698':vals(e,'P698'),'P932':vals(e,'P932'),
              'P50':vals(e,'P50'),'P921':vals(e,'P921'),'P2860':vals(e,'P2860')
            }

          # Exact DOI collision audit using Wikidata search followed by claim verification.
          for doi in sorted(set(EXPECTED_DOIS.values())):
            s=req(anon,WD,{'action':'wbsearchentities','search':doi,'language':'en','type':'item','limit':50})
            ids=[r['id'] for r in s.get('search',[])]
            exact=[]
            if ids:
              ee=req(anon,WD,{'action':'wbgetentities','ids':'|'.join(ids),'props':'claims|labels|info'})['entities']
              for q,e in ee.items():
                got=[str(x).lower() for x in vals(e,'P356')]
                if doi.lower() in got: exact.append(q)
            # Also include known expected QIDs even if search index is delayed.
            for q,known in EXPECTED_DOIS.items():
              if known.lower()==doi.lower():
                got=[str(x).lower() for x in out['entities'].get(q,{}).get('P356',[])]
                if doi.lower() in got and q not in exact: exact.append(q)
            out['doi_collisions'][doi]=sorted(exact)

          # Main + talk page live state.
          pages=[
            ('Treatment of bipolar disorder','27280013','Ghezelbash'),
            ('Talk:Treatment of bipolar disorder','Ghezelbash-COI-Omega3-20260816','27280013'),
            ('Attachment and health','34574943','Ghezelbash'),
            ('Talk:Attachment and health','Ghezelbash-COI-Attachment-20260816','34574943'),
          ]
          for title,a,b in pages:
            q=req(anon,WP,{'action':'query','prop':'revisions|info','titles':title,'rvprop':'ids|timestamp|content','rvslots':'main','inprop':'protection'})['query']['pages'][0]
            text=''
            if q.get('missing') is None and q.get('revisions'):
              slot=q['revisions'][0]['slots']['main']; text=slot.get('content') or slot.get('*') or ''
            out['wikipedia'][title]={
              'missing':q.get('missing') is not None,'lastrevid':q.get('lastrevid'),
              'has_marker_a':a in text,'has_marker_b':b in text,'protection':q.get('protection',[])
            }

          # Authenticate read-only and report rights on both projects; no edit call is made.
          def login_rights(api,label):
            s=requests.Session(); s.headers['User-Agent']=UA
            lt=req(s,api,{'action':'query','meta':'tokens','type':'login'})['query']['tokens']['logintoken']
            lg=req(s,api,{'action':'login','lgname':os.environ['WIKIMEDIA_USERNAME'],'lgpassword':os.environ['WIKIMEDIA_BOT_PASSWORD'],'lgtoken':lt},post=True)
            if lg.get('login',{}).get('result')!='Success':
              out['auth'][label]={'login':lg.get('login',{})}; return
            ui=req(s,api,{'action':'query','meta':'userinfo','uiprop':'groups|rights|blockinfo'})['query']['userinfo']
            rights=set(ui.get('rights',[]))
            out['auth'][label]={
              'name':ui.get('name'),'id':ui.get('id'),'groups':ui.get('groups',[]),
              'can_edit':'edit' in rights,'can_createpage':'createpage' in rights,
              'blockedby':ui.get('blockedby'),'blockreason':ui.get('blockreason')
            }
          login_rights(WD,'wikidata')
          login_rights(WP,'enwiki')

          print(json.dumps(out,ensure_ascii=False,indent=2,sort_keys=True))

name: Scratch PR404 media policy proof

on:
  push:
    branches:
      - scratch/pr404-media-policy-2026-09-15

permissions:
  contents: write

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14.6"
      - run: npm ci
      - run: npm run security:dependencies
      - name: Prove approved page is byte-exact before patch
        shell: bash
        run: |
          test "$(git hash-object src/content-source/page.md)" = "6ea47007e992fbd2213c2c37e3033316f400b361"
          printf '%s  %s\n' '96c6baab2a542c6489404c4dfaabbbbf9a1c32423a3d2f8189979b872eb413ea' 'src/content-source/page.md' | sha256sum -c -
      - name: Refine raster XMP carrier policy and v2 documentation
        run: python tools/scratch-pr404-media-policy.py
      - name: Validate media policy
        run: npm run validate:media
      - name: Verify source contract and page immutability
        shell: bash
        run: |
          node scripts/validate-visible-text.mjs source
          test "$(git hash-object src/content-source/page.md)" = "6ea47007e992fbd2213c2c37e3033316f400b361"
          printf '%s  %s\n' '96c6baab2a542c6489404c4dfaabbbbf9a1c32423a3d2f8189979b872eb413ea' 'src/content-source/page.md' | sha256sum -c -
          git diff --check
      - name: Commit only permanent files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/validate-media.mjs README.md
          git diff --cached --check
          git commit -m "Model XMP metadata carriers without touching approved page"
          git push origin "HEAD:${GITHUB_REF_NAME}"

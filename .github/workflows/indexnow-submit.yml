name: Submit canonical updates to IndexNow

on:
  workflow_run:
    workflows: ["Deploy Cloudflare Pages production"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: indexnow-production-submit
  cancel-in-progress: true

jobs:
  submit:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CANONICAL_HOST: www.ghezelbaash.ir
      INDEXNOW_KEY: 2d0a99837e327f6744f9184ec6d2877f
    steps:
      - name: Verify ownership key and submit changed canonical resources
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, time, urllib.error, urllib.request

          host=os.environ['CANONICAL_HOST']
          key=os.environ['INDEXNOW_KEY']
          canonical=f'https://{host}'
          key_url=f'{canonical}/{key}.txt'
          expected=(key+'\n').encode()

          # Refuse to submit until the newly deployed ownership key is live and exact.
          for attempt in range(18):
              req=urllib.request.Request(key_url,headers={'Cache-Control':'no-cache','User-Agent':'ghezelbaash-indexnow-verifier/1.0'})
              try:
                  with urllib.request.urlopen(req,timeout=20) as r:
                      body=r.read()
                      status=r.status
              except urllib.error.HTTPError as e:
                  status=e.code; body=e.read()
              print('INDEXNOW_KEY_VERIFY',attempt+1,status,len(body))
              if status==200 and body==expected:
                  break
              time.sleep(5)
          else:
              raise SystemExit('IndexNow ownership key did not become live in time')

          # Single-page canonical landing plus the high-value first-party machine representations
          # that are regenerated by every production build.
          urls=[
              f'{canonical}/',
              f'{canonical}/graph.jsonld',
              f'{canonical}/llms.txt',
              f'{canonical}/index.md',
              f'{canonical}/llms-full.txt',
              f'{canonical}/sitemap.xml',
          ]
          payload=json.dumps({
              'host':host,
              'key':key,
              'keyLocation':key_url,
              'urlList':urls,
          },separators=(',',':')).encode()

          last=None
          for attempt in range(6):
              req=urllib.request.Request(
                  'https://api.indexnow.org/indexnow',
                  data=payload,
                  method='POST',
                  headers={'Content-Type':'application/json; charset=utf-8','User-Agent':'ghezelbaash-indexnow-publisher/1.0'},
              )
              try:
                  with urllib.request.urlopen(req,timeout=30) as r:
                      status=r.status; body=r.read().decode('utf-8','replace')
              except urllib.error.HTTPError as e:
                  status=e.code; body=e.read().decode('utf-8','replace')
              last=(status,body)
              print('INDEXNOW_SUBMIT',attempt+1,'status=',status,'urls=',len(urls),'body=',body[:500])
              if status in (200,202):
                  print('INDEXNOW_ACCEPTED',json.dumps(urls,ensure_ascii=False))
                  break
              if status==429 or status>=500:
                  time.sleep(min(60,5*(2**attempt)))
                  continue
              raise SystemExit(f'IndexNow rejected submission HTTP {status}: {body[:1000]}')
          else:
              raise SystemExit(f'IndexNow submission did not succeed after retries: {last}')
          PY

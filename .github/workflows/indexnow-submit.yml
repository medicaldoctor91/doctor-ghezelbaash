name: Submit canonical updates to IndexNow

on:
  workflow_run:
    workflows: ["Deploy Cloudflare Pages production"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: indexnow-production-submit
  cancel-in-progress: true

jobs:
  submit:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      CANONICAL_HOST: www.ghezelbaash.ir
      INDEXNOW_KEY: 2d0a99837e327f6744f9184ec6d2877f
    steps:
      - name: Verify ownership and submit complete canonical semantic surface
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, time, urllib.error, urllib.parse, urllib.request

          host=os.environ['CANONICAL_HOST']
          key=os.environ['INDEXNOW_KEY']
          canonical=f'https://{host}'
          key_url=f'{canonical}/{key}.txt'
          expected=(key+'\n').encode()

          def fetch(url, *, accept='*/*'):
              req=urllib.request.Request(
                  url,
                  headers={
                      'Cache-Control':'no-cache',
                      'Pragma':'no-cache',
                      'Accept':accept,
                      'User-Agent':'ghezelbaash-indexnow-verifier/2.0',
                  },
              )
              try:
                  with urllib.request.urlopen(req,timeout=25) as r:
                      return r.status, r.read(), dict(r.headers)
              except urllib.error.HTTPError as e:
                  return e.code, e.read(), dict(e.headers)

          # Refuse to submit until the ownership key from the new production deployment is live and exact.
          for attempt in range(24):
              status,body,_=fetch(key_url,accept='text/plain')
              print('INDEXNOW_KEY_VERIFY',attempt+1,status,len(body))
              if status==200 and body==expected:
                  break
              time.sleep(5)
          else:
              raise SystemExit('IndexNow ownership key did not become live in time')

          # The DIST generates linkset.json from release truth. Use that live discovery graph rather
          # than a six-URL hard-coded subset so every linked first-party semantic representation that
          # changes with a production build is notified automatically.
          linkset_url=f'{canonical}/linkset.json'
          status,body,_=fetch(linkset_url,accept='application/linkset+json, application/json')
          if status!=200:
              raise SystemExit(f'linkset.json is not live: HTTP {status}')
          try:
              linkset=json.loads(body)
          except json.JSONDecodeError as exc:
              raise SystemExit(f'linkset.json is invalid JSON: {exc}')

          discovered=[f'{canonical}/', linkset_url, f'{canonical}/sitemap.xml']
          for entry in linkset.get('linkset') or []:
              if not isinstance(entry,dict):
                  continue
              for rel in ('canonical','describedby','alternate'):
                  for item in entry.get(rel) or []:
                      href=item.get('href') if isinstance(item,dict) else None
                      if href:
                          discovered.append(href)

          # Same-host, fragment-free, canonical HTTPS URLs only. Preserve source order and dedupe.
          urls=[]
          seen=set()
          for url in discovered:
              try:
                  parsed=urllib.parse.urlsplit(url)
              except Exception:
                  continue
              if parsed.scheme!='https' or parsed.netloc.lower()!=host.lower() or parsed.fragment:
                  continue
              normalized=urllib.parse.urlunsplit((parsed.scheme,parsed.netloc,parsed.path or '/',parsed.query,''))
              if normalized not in seen:
                  seen.add(normalized)
                  urls.append(normalized)

          if not urls:
              raise SystemExit('No canonical URLs discovered for IndexNow')
          if len(urls)>10000:
              raise SystemExit(f'IndexNow URL set unexpectedly exceeds protocol batch limit: {len(urls)}')

          # Prove every notified representation is actually live before publishing the change signal.
          live=[]
          for url in urls:
              status,body,headers=fetch(url)
              ctype=headers.get('Content-Type') or headers.get('content-type')
              print('INDEXNOW_URL_VERIFY',status,url,'bytes=',len(body),'content-type=',ctype)
              if status!=200:
                  raise SystemExit(f'Canonical IndexNow URL is not HTTP 200: {url} -> {status}')
              live.append(url)
          urls=live

          payload=json.dumps({
              'host':host,
              'key':key,
              'keyLocation':key_url,
              'urlList':urls,
          },separators=(',',':')).encode()

          last=None
          for attempt in range(6):
              req=urllib.request.Request(
                  'https://api.indexnow.org/indexnow',
                  data=payload,
                  method='POST',
                  headers={
                      'Content-Type':'application/json; charset=utf-8',
                      'User-Agent':'ghezelbaash-indexnow-publisher/2.0',
                  },
              )
              try:
                  with urllib.request.urlopen(req,timeout=30) as r:
                      status=r.status; response=r.read().decode('utf-8','replace')
              except urllib.error.HTTPError as e:
                  status=e.code; response=e.read().decode('utf-8','replace')
              last=(status,response)
              print('INDEXNOW_SUBMIT',attempt+1,'status=',status,'urls=',len(urls),'body=',response[:500])
              if status in (200,202):
                  print('INDEXNOW_ACCEPTED_COUNT',len(urls))
                  print('INDEXNOW_ACCEPTED_URLS',json.dumps(urls,ensure_ascii=False))
                  break
              if status==429 or status>=500:
                  time.sleep(min(60,5*(2**attempt)))
                  continue
              raise SystemExit(f'IndexNow rejected submission HTTP {status}: {response[:1000]}')
          else:
              raise SystemExit(f'IndexNow submission did not succeed after retries: {last}')
          PY

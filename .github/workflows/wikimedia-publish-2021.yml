name: Publish 2021 article to Wikimedia

on:
  push:
    branches: [main]
    paths:
      - 'scripts/wikimedia_publish_2021.py'
      - '.github/workflows/wikimedia-publish-2021.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wikimedia-publish-2021
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      WIKIMEDIA_USERNAME: ${{ secrets.WIKIVERSITY_USERNAME }}
      WIKIMEDIA_BOT_PASSWORD: ${{ secrets.WIKIVERSITY_BOT_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install dependency
        run: python -m pip install --disable-pip-version-check --no-input requests==2.32.5
      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$WIKIMEDIA_USERNAME"
          test -n "$WIKIMEDIA_BOT_PASSWORD"
      - name: Publish with hard duplicate guards
        run: python scripts/wikimedia_publish_2021.py

name: Clinic vCard production fix verification
on:
  push:
    branches: [fix/clinic-vcard-physicians-office-20261017]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version-file: .nvmrc, cache: npm}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install dependencies
        run: |
          npm ci
          python -m pip install --disable-pip-version-check 'rdflib>=7,<8' 'pyshacl>=0.30,<1' 'pyarrow>=18,<23' 'mlcroissant==1.1.1'
      - name: Run focused and full verification
        run: |
          node --test tests/machine-output.test.mjs tests/solo-practice-semantics.test.mjs tests/content-digest.test.mjs
          npm run build
          python tests/validate_machine_resources.py dist
          python tests/validate_canonical_invariants.py dist
          python tests/validate_platform_bundle.py dist --no-query --rdf
          python - <<'PY'
          from pathlib import Path
          card=Path('dist/clinic.vcf').read_text(encoding='utf-8')
          lines=[line for line in card.replace('\r\n ','').splitlines() if line]
          fn=[line for line in lines if line.startswith('FN:')]
          org=[line for line in lines if line.startswith('ORG:')]
          uid=[line for line in lines if line.startswith('UID:')]
          assert len(fn)==1 and fn[0][3:].strip(), fn
          assert len(org)==1 and org[0][4:].strip(), org
          assert len(uid)==1 and uid[0][4:].strip(), uid
          print({'clinic_vcard_fn':fn[0],'clinic_vcard_org':org[0],'clinic_vcard_uid':uid[0]})
          PY

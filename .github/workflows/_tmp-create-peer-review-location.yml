name: Temporary WikiJournal peer-review location
on:
  push:
    branches: [main]
    paths: ['.github/workflows/_tmp-create-peer-review-location.yml']
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      WIKIMEDIA_USERNAME: ${{ secrets.WIKIVERSITY_USERNAME }}
      WIKIMEDIA_BOT_PASSWORD: ${{ secrets.WIKIVERSITY_BOT_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check --no-input requests==2.32.5
      - name: Create peer-review location and link it from Wikidata
        shell: bash
        run: |
          python - <<'PY'
          import os,requests,json,time
          USER=os.environ['WIKIMEDIA_USERNAME']; PASS=os.environ['WIKIMEDIA_BOT_PASSWORD']
          VAPI='https://en.wikiversity.org/w/api.php'; WAPI='https://www.wikidata.org/w/api.php'
          ARTICLE='WikiJournal Preprints/Individualized clinical assessment and outcome interpretation in aesthetic botulinum neurotoxin type A treatment: a focused review'
          TALK='Talk:'+ARTICLE
          QID='Q141129555'
          PRELOAD='{{#section-h:{{ARTICLEPAGENAMEE}}}}'
          UA='GhezelbaashPeerReviewLocation/1.0 (https://www.ghezelbaash.ir/)'
          def login(api):
            s=requests.Session(); s.headers.update({'User-Agent':UA})
            def get(**p):
              p.update(format='json',formatversion=2); r=s.get(api,params=p,timeout=60); r.raise_for_status(); d=r.json();
              if 'error' in d: raise RuntimeError(d['error'])
              return d
            def post(**p):
              p.update(format='json',formatversion=2); r=s.post(api,data=p,timeout=90); r.raise_for_status(); d=r.json();
              if 'error' in d: raise RuntimeError(d['error'])
              return d
            lt=get(action='query',meta='tokens',type='login')['query']['tokens']['logintoken']
            lr=post(action='login',lgname=USER,lgpassword=PASS,lgtoken=lt)
            if lr.get('login',{}).get('result')!='Success': raise RuntimeError(lr)
            return s,get,post
          # Preconditions: article must exist and still be connected to the expected Wikidata item.
          sv,gv,pv=login(VAPI)
          ap=gv(action='query',titles=ARTICLE,prop='info|pageprops')['query']['pages'][0]
          if ap.get('missing'): raise RuntimeError('Preprint missing')
          if (ap.get('pageprops') or {}).get('wikibase_item')!=QID: raise RuntimeError({'unexpected_qid':(ap.get('pageprops') or {}).get('wikibase_item')})
          # Create only if absent; never overwrite an existing peer-review page.
          tp=gv(action='query',titles=TALK,prop='info|revisions',rvprop='ids|content',rvslots='main')['query']['pages'][0]
          created=False
          if tp.get('missing'):
            token=gv(action='query',meta='tokens',type='csrf')['query']['tokens']['csrftoken']
            er=pv(action='edit',title=TALK,text=PRELOAD,createonly=1,token=token,summary='Create peer review location for submitted WikiJournal preprint')
            created=(er.get('edit',{}).get('result')=='Success')
          # Purge and obtain canonical review URL.
          pv(action='purge',titles=TALK,forcelinkupdate=1)
          time.sleep(2)
          tp=gv(action='query',titles=TALK,prop='info|revisions',inprop='url',rvprop='ids|timestamp|user|comment|content',rvslots='main',rvlimit=1)['query']['pages'][0]
          if tp.get('missing'): raise RuntimeError('Peer review talk page was not created')
          review_url=tp.get('fullurl')
          tcontent=((tp.get('revisions') or [{}])[0].get('slots',{}).get('main',{}).get('content',''))
          if not review_url: raise RuntimeError('No canonical review URL returned')
          # Add P7347 only when absent; preserve any existing value.
          sw,gw,pw=login(WAPI)
          ent=gw(action='wbgetentities',ids=QID,props='claims')['entities'][QID]
          existing=[]
          for c in ent.get('claims',{}).get('P7347',[]):
            v=c.get('mainsnak',{}).get('datavalue',{}).get('value')
            if v: existing.append(v)
          added=False
          if review_url not in existing:
            if existing:
              raise RuntimeError({'existing_P7347_conflict':existing,'expected':review_url})
            token=gw(action='query',meta='tokens',type='csrf')['query']['tokens']['csrftoken']
            cr=pw(action='wbcreateclaim',entity=QID,property='P7347',snaktype='value',value=json.dumps(review_url),token=token,summary='Add WikiJournal peer review URL for preprint')
            added=bool(cr.get('claim'))
          # Final verification from both sites.
          time.sleep(2)
          ent2=gw(action='wbgetentities',ids=QID,props='claims|sitelinks')['entities'][QID]
          pvals=[c.get('mainsnak',{}).get('datavalue',{}).get('value') for c in ent2.get('claims',{}).get('P7347',[])]
          out={
            'ok': review_url in pvals,
            'qid':QID,
            'talk_title':TALK,
            'talk_pageid':tp.get('pageid'),
            'talk_created_now':created,
            'talk_url':review_url,
            'talk_latest_revision':(tp.get('revisions') or [{}])[0],
            'talk_has_official_preload':PRELOAD in tcontent,
            'P7347_values':pvals,
            'P7347_added_now':added,
            'preprint_sitelink':ent2.get('sitelinks',{}).get('enwikiversity')
          }
          if not out['ok']: raise RuntimeError(out)
          os.makedirs('wikimedia',exist_ok=True)
          open('wikimedia/_tmp-peer-review-location-status.json','w',encoding='utf8').write(json.dumps(out,ensure_ascii=False,indent=2))
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - name: Commit temporary status
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add wikimedia/_tmp-peer-review-location-status.json
          git commit -m 'Record temporary WikiJournal peer-review location status'
          git push

name: Relock v1.2.2 visible contract

on:
  push:
    branches: [main]
    paths: [.release/v122-relock-visible-trigger.json]

permissions:
  contents: write

concurrency:
  group: doctor-ghezelbaash-external-mutation
  cancel-in-progress: false

env:
  CANDIDATE_BRANCH: release/v1.2.2-candidate
  CONTROL_BRANCH: release-control/v1.2.2

jobs:
  relock:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: release/v1.2.2-candidate
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Build corrected candidate and relock visible DOM contract
        shell: bash
        run: |
          set -euo pipefail
          git config user.name ghezelbaash-v122-repair
          git config user.email actions@users.noreply.github.com
          npm ci --ignore-scripts
          node scripts/validate-v122-contract.mjs
          npm run release:prepare
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)" CF_PAGES_COMMIT_SHA="$(git rev-parse HEAD)" SOURCE_COMMIT="$(git rev-parse HEAD)"
          npm run build
          node scripts/lock-visible-contract.mjs dist/index.html
          git diff --check
          git add src/data/visible-contract.json
          git diff --cached --quiet || git commit -m 'Relock v1.2.2 visible contract after DOI href repair'
          C=$(git rev-parse HEAD)
          git push origin "HEAD:$CANDIDATE_BRANCH"
          echo "FINAL_CANDIDATE_SHA=$C" >> "$GITHUB_ENV"
          echo "VISIBLE_CONTRACT_RELOCKED candidate=$C"
      - name: Rebind control plane to relocked candidate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$CONTROL_BRANCH" "$CANDIDATE_BRANCH"
          test "$(git rev-parse origin/$CANDIDATE_BRANCH)" = "$FINAL_CANDIDATE_SHA"
          rm -rf /tmp/v122-control-relock
          git worktree add --detach /tmp/v122-control-relock "origin/$CONTROL_BRANCH"
          git -C /tmp/v122-control-relock config user.name ghezelbaash-v122-release-control
          git -C /tmp/v122-control-relock config user.email actions@users.noreply.github.com
          git show "$FINAL_CANDIDATE_SHA:src/data/release.json" >/tmp/v122-relock-release.json
          export FINAL_CANDIDATE_SHA
          node - <<'NODE'
          const fs=require('fs'),p='/tmp/v122-control-relock/.release/control/v1.2.2.json',x=JSON.parse(fs.readFileSync(p)),r=JSON.parse(fs.readFileSync('/tmp/v122-relock-release.json')),C=process.env.FINAL_CANDIDATE_SHA,now=new Date().toISOString(),z=r.dataset.zenodo;
          if(x.versionDoi!==z.versionDoi||String(x.recordId)!==String(z.recordId)||x.conceptDoi!==z.conceptDoi)throw Error('Reserved Zenodo identity drift during relock');
          const previousSource=x.sourceCommit||null;
          Object.assign(x,{releaseDate:r.dateModified,candidateHead:C,sourceCommit:C,preparedCandidate:C,proofs:{},stage:'SOURCE_PROMOTED',highestStage:'SOURCE_PROMOTED',lastEvent:'SOURCE_PROMOTED',updatedAt:now});
          delete x.candidateEpoch;
          x.history=[...(x.history||[]),{stage:'SOURCE_PROMOTED',at:now,sourceCommit:C,previousSourceCommit:previousSource,releaseDate:r.dateModified,recordId:String(z.recordId),versionDoi:z.versionDoi,reason:'visible DOI href repaired and visible contract deterministically relocked; proof epoch reset'}];
          fs.writeFileSync(p,JSON.stringify(x,null,2)+'\n');
          NODE
          git -C /tmp/v122-control-relock add .release/control/v1.2.2.json
          git -C /tmp/v122-control-relock commit -m 'Rebind control to relocked v1.2.2 candidate'
          git -C /tmp/v122-control-relock push origin "HEAD:$CONTROL_BRANCH"
      - name: Prove relocked candidate from clean state
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$CANDIDATE_BRANCH"
          git reset --hard "origin/$CANDIDATE_BRANCH"
          test "$(git rev-parse HEAD)" = "$FINAL_CANDIDATE_SHA"
          node scripts/validate-v122-contract.mjs
          npm run release:prepare
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)" CF_PAGES_COMMIT_SHA="$FINAL_CANDIDATE_SHA" SOURCE_COMMIT="$FINAL_CANDIDATE_SHA"
          npm run build
          node scripts/validate-visible-freeze.mjs dist/index.html
          grep -Fq 'href="https://doi.org/10.5281/zenodo.21930954">https://doi.org/10.5281/zenodo.21930954</a>' dist/index.html
          test -z "$(git status --porcelain -- src/data/visible-contract.json src/content-source/100-rc099.html)"
          echo "V122_RELOCK_PROOF_PASS candidate=$FINAL_CANDIDATE_SHA"

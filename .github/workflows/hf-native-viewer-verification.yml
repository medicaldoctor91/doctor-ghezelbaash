name: Verify HF native Dataset Server
on:
  push:
    branches: [maintenance/positioning-recovery-20261017]
    paths: [.github/workflows/hf-native-viewer-verification.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Verify native Dataset Server and Croissant endpoints
        env:
          DATASET: doctor-ghezelbaash/dr-saeid-ghezelbaash-entity-data
          REVISION: a792e71d7edcd9b08be2b64a18d17c935f61ae2c
        run: |
          python - <<'PY'
          import json,time,urllib.parse,urllib.request
          dataset='doctor-ghezelbaash/dr-saeid-ghezelbaash-entity-data'
          def get(url, attempts=18):
              for i in range(attempts):
                  try:
                      req=urllib.request.Request(url,headers={'User-Agent':'ghezelbaash-hf-native-verification/1.0','Cache-Control':'no-cache'})
                      with urllib.request.urlopen(req,timeout=60) as r:
                          return r.status, r.headers.get('Content-Type',''), r.read()
                  except Exception:
                      if i==attempts-1: raise
                      time.sleep(10)
          q=urllib.parse.quote(dataset,safe='')
          status,ct,body=get('https://datasets-server.huggingface.co/is-valid?dataset='+q)
          valid=json.loads(body)
          assert status==200 and valid.get('viewer') is True and valid.get('preview') is True,valid
          status,ct,body=get('https://datasets-server.huggingface.co/parquet?dataset='+q)
          parquet=json.loads(body)
          files=parquet.get('parquet_files',[])
          matching=[f for f in files if f.get('config')=='market_positioning' and f.get('split')=='train']
          assert matching,('market_positioning parquet missing',files)
          rows_url=('https://datasets-server.huggingface.co/rows?dataset='+q+
                    '&config=market_positioning&split=train&offset=0&length=2')
          status,ct,body=get(rows_url)
          rows=json.loads(body)
          assert status==200 and len(rows.get('rows',[]))==2,rows
          first=rows['rows'][0].get('row',{})
          assert first.get('canonical_dataset_iri')=='https://www.ghezelbaash.ir/graph.jsonld/dataset',first
          assert first.get('preferred_entity')=='Q140287622',first
          status,ct,body=get('https://huggingface.co/api/datasets/'+dataset+'/croissant')
          croissant=json.loads(body)
          text=json.dumps(croissant,ensure_ascii=False)
          assert 'market_positioning' in text or 'positioning-examples.parquet' in text,text[:1000]
          print(json.dumps({
            'HF_DATASET_SERVER':'PASS',
            'viewer':valid,
            'market_positioning_parquet_files':len(matching),
            'sample_rows':len(rows['rows']),
            'canonical_dataset_iri':first.get('canonical_dataset_iri'),
            'preferred_entity':first.get('preferred_entity'),
            'croissant_positioning':True,
          },ensure_ascii=False,indent=2))
          PY

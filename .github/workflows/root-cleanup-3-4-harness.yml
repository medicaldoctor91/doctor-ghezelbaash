# One-shot temporary harness. Remove after successful equivalence proof.
name: Temporary root cleanup 3 and 4 harness

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write

jobs:
  refactor-and-prove:
    if: contains(github.event.head_commit.message, 'Trigger temporary root cleanup harness')
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Report start
        run: gh issue comment 197 --repo "$GITHUB_REPOSITORY" --body 'ROOT_3_4_HARNESS_START'
      - uses: actions/checkout@v4
        with:
          ref: fix/root-cleanup-3-4-20260811
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Report install
        run: gh issue comment 197 --repo "$GITHUB_REPOSITORY" --body 'ROOT_3_4_NPM_CI_PASS'
      - name: Build baseline
        run: |
          set -euo pipefail
          npm run build
          cp dist/index.html /tmp/index.before
          cp dist/llms.txt /tmp/llms.before
          cp dist/knowledge.xml /tmp/knowledge.before
          sha256sum /tmp/index.before /tmp/llms.before /tmp/knowledge.before
          git reset --hard HEAD
          git clean -fd -e .python-deps/
      - name: Report baseline
        run: gh issue comment 197 --repo "$GITHUB_REPOSITORY" --body 'ROOT_3_4_BASELINE_BUILD_PASS'
      - name: Apply root cleanups
        run: python scripts/tmp-root-cleanup-3-4.py
      - name: Report transform
        run: gh issue comment 197 --repo "$GITHUB_REPOSITORY" --body 'ROOT_3_4_TRANSFORM_PASS'
      - name: Prove zero output drift
        run: |
          set -euo pipefail
          npm run build
          cmp -s /tmp/index.before dist/index.html
          cmp -s /tmp/llms.before dist/llms.txt
          cmp -s /tmp/knowledge.before dist/knowledge.xml
          echo BYTE_EQ_INDEX=PASS
          echo BYTE_EQ_LLMS=PASS
          echo BYTE_EQ_KNOWLEDGE_UNTOUCHED=PASS
          grep -F '{{EVIDENCE_TIER_DECLARATION}}' src/data/templates/llms.template.txt
          grep -F 'Tier A = official/authority-control or first-order scholarly/local identity evidence; Tier B = major scholarly/professional corroboration; Tier C = secondary directory/media/local corroboration.' src/data/projections/llms.txt
          grep -F '<dt><strong>Artifact integrity manifest</strong></dt><dd><a href="/artifact-manifest.json"' src/content-source/100-rc099.html
          ! grep -F 'canonicalizeMachineResourceDefinitions' scripts/lib/assemble-content.mjs
          ! grep -F "evidenceRaw from '../data/evidence-registry.json?raw'" src/pages/llms.txt.ts
      - name: Report equivalence
        run: gh issue comment 197 --repo "$GITHUB_REPOSITORY" --body 'ROOT_3_4_EQUIVALENCE_PASS: index.html byte-identical; llms.txt byte-identical; knowledge.xml byte-identical and untouched.'
      - name: Commit proven cleanup to branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/content-source/100-rc099.html scripts/lib/assemble-content.mjs src/data/templates/llms.template.txt scripts/generate-projections.mjs src/pages/llms.txt.ts src/data/projections/llms.txt
          git commit -m 'Root canonicalize machine mapping and evidence tiers'
          git push origin HEAD:fix/root-cleanup-3-4-20260811
      - name: Report push
        run: gh issue comment 197 --repo "$GITHUB_REPOSITORY" --body 'ROOT_3_4_BRANCH_COMMIT_PASS'

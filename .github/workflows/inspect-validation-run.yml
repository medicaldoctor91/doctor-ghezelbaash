name: Inspect latest production validation run

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-validation-run.yml'

permissions:
  actions: read
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2
      - name: Record latest validation runs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/validate.yml/runs?branch=main&per_page=10" > tmp/latest-validation-runs.json
          git rm .github/workflows/inspect-validation-run.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tmp/latest-validation-runs.json
          git commit -m 'Record latest validation run state [skip ci]'
          git push origin HEAD:main

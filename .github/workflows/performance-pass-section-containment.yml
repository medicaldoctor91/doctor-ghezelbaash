name: Performance pass for semantic section containment

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/performance-pass-section-containment.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Add build-time H2 sectionization and containment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src/plugins
          cat > src/plugins/sectionize-h2.mjs <<'EOF'
          function isH2(node) {
            if (node?.type === 'element' && node.tagName === 'h2') return true;
            return node?.type === 'raw' && /^\s*<h2\b/i.test(node.value ?? '');
          }

          function headingId(node) {
            if (node?.type === 'element') {
              const value = node.properties?.id;
              return typeof value === 'string' ? value : undefined;
            }
            const match = String(node?.value ?? '').match(/\bid=["']([^"']+)["']/i);
            return match?.[1];
          }

          function textLength(node) {
            if (!node) return 0;
            if (node.type === 'text' || node.type === 'raw') return String(node.value ?? '').length;
            return Array.isArray(node.children)
              ? node.children.reduce((sum, child) => sum + textLength(child), 0)
              : 0;
          }

          function sizeClass(length) {
            if (length < 15000) return 'semantic-section--small';
            if (length < 35000) return 'semantic-section--medium';
            if (length < 70000) return 'semantic-section--large';
            return 'semantic-section--xlarge';
          }

          export default function sectionizeH2() {
            return (tree) => {
              if (!tree || tree.type !== 'root' || !Array.isArray(tree.children)) return;

              const output = [];
              let section = null;
              let sectionIndex = 0;

              for (const child of tree.children) {
                if (isH2(child)) {
                  sectionIndex += 1;
                  const id = headingId(child);
                  section = {
                    type: 'element',
                    tagName: 'section',
                    properties: {
                      className: ['semantic-section', 'semantic-section--deferred'],
                      ...(id ? { ariaLabelledBy: id } : {}),
                      dataSectionIndex: String(sectionIndex),
                    },
                    children: [child],
                  };
                  output.push(section);
                } else if (section) {
                  section.children.push(child);
                } else {
                  output.push(child);
                }
              }

              for (const child of output) {
                if (child?.type === 'element' && child.tagName === 'section' && child.properties?.className?.includes('semantic-section')) {
                  child.properties.className.push(sizeClass(textLength(child)));
                }
              }

              tree.children = output;
            };
          }
          EOF

          python3 - <<'PY'
          from pathlib import Path

          config=Path('astro.config.mjs')
          s=config.read_text(encoding='utf-8')
          imp="import sectionizeH2 from './src/plugins/sectionize-h2.mjs';\n"
          if imp not in s:
            marker="import { defineConfig } from 'astro/config';\n"
            if s.count(marker)!=1:raise SystemExit('Astro import marker mismatch')
            s=s.replace(marker,marker+imp,1)
          marker="  trailingSlash: 'always',\n"
          markdown="  markdown: {\n    rehypePlugins: [sectionizeH2],\n  },\n"
          if markdown not in s:
            if s.count(marker)!=1:raise SystemExit('Astro config marker mismatch')
            s=s.replace(marker,marker+markdown,1)
          config.write_text(s,encoding='utf-8')

          css=Path('src/styles/global.css')
          s=css.read_text(encoding='utf-8')
          old='''/* Preserve the complete semantic corpus while deferring below-fold layout and paint. */
          main > :nth-child(n + 30) {
            content-visibility: auto;
            contain-intrinsic-size: auto 240px;
          }

          main > :where(nav, ul, ol, table, figure, details, blockquote):nth-child(n + 30) {
            contain-intrinsic-size: auto 720px;
          }
          '''
          new='''/* Keep the full corpus in the HTML while skipping layout/paint for complete H2 sections below the viewport. */
          main > .semantic-section {
            display: flow-root;
          }

          main > .semantic-section--deferred {
            content-visibility: auto;
            contain: layout style paint;
          }

          main > .semantic-section--small {
            contain-intrinsic-size: auto 7000px;
          }

          main > .semantic-section--medium {
            contain-intrinsic-size: auto 15000px;
          }

          main > .semantic-section--large {
            contain-intrinsic-size: auto 30000px;
          }

          main > .semantic-section--xlarge {
            contain-intrinsic-size: auto 50000px;
          }

          @media (max-width: 720px) {
            main > .semantic-section--small {
              contain-intrinsic-size: auto 15000px;
            }

            main > .semantic-section--medium {
              contain-intrinsic-size: auto 35000px;
            }

            main > .semantic-section--large {
              contain-intrinsic-size: auto 70000px;
            }

            main > .semantic-section--xlarge {
              contain-intrinsic-size: auto 120000px;
            }
          }
          '''
          if old not in s:raise SystemExit('Old child containment block missing')
          s=s.replace(old,new,1)
          old_figure='''figure {
            content-visibility: auto;
            contain-intrinsic-size: auto 720px;
            margin: 2.2rem 0;
          '''
          new_figure='''figure {
            margin: 2.2rem 0;
          '''
          if old_figure not in s:raise SystemExit('Figure containment block missing')
          s=s.replace(old_figure,new_figure,1)
          css.write_text(s,encoding='utf-8')
          PY
          git diff --check

      - name: Build and verify section structure
        run: |
          npm ci --no-audit --no-fund
          npm run build
          python3 - <<'PY'
          from pathlib import Path
          import re
          html=Path('dist/index.html').read_text(encoding='utf-8')
          sections=re.findall(r'<section\b[^>]*class="[^"]*semantic-section[^"]*"',html)
          h2s=re.findall(r'<h2\b',html)
          print('semantic sections',len(sections),'h2',len(h2s),'html bytes',len(html.encode()))
          assert len(sections)>=15
          assert len(sections)==len(h2s)
          assert len(html.encode())<1900000
          PY

      - name: Benchmark local Lighthouse
        run: |
          mkdir -p tmp/pass2
          nohup python3 -m http.server 4173 --directory dist >tmp/pass2/server.log 2>&1 &
          echo $! >tmp/pass2/server.pid
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          npx --yes lighthouse@latest http://127.0.0.1:4173/ --output=json --output-path=tmp/pass2/mobile.json --only-categories=performance,accessibility,best-practices,seo --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage' --quiet
          npx --yes lighthouse@latest http://127.0.0.1:4173/ --preset=desktop --output=json --output-path=tmp/pass2/desktop.json --only-categories=performance,accessibility,best-practices,seo --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage' --quiet
          kill $(cat tmp/pass2/server.pid) || true

      - name: Gate containment improvement
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          baseline={'mobile':{'performance':37,'mainthread':3030.112},'desktop':{'performance':86,'mainthread':200.586}}
          result={}
          for mode in ('mobile','desktop'):
            d=json.loads(Path(f'tmp/pass2/{mode}.json').read_text());a=d['audits'];c=d['categories']
            result[mode]={
              'performance':round(c['performance']['score']*100),
              'accessibility':round(c['accessibility']['score']*100),
              'bestPractices':round(c['best-practices']['score']*100),
              'seo':round(c['seo']['score']*100),
              'fcp':a['first-contentful-paint']['numericValue'],
              'lcp':a['largest-contentful-paint']['numericValue'],
              'tbt':a['total-blocking-time']['numericValue'],
              'cls':a['cumulative-layout-shift']['numericValue'],
              'mainthread':a['mainthread-work-breakdown']['numericValue'],
              'domSize':a.get('dom-size-insight',{}).get('numericValue'),
            }
          result['htmlBytes']=Path('dist/index.html').stat().st_size
          Path('tmp/performance-pass2.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(result,indent=2))
          for mode in ('mobile','desktop'):
            assert result[mode]['accessibility']==100
            assert result[mode]['bestPractices']==100
            assert result[mode]['seo']==100
            assert result[mode]['cls']<0.02
          assert result['mobile']['mainthread'] < baseline['mobile']['mainthread']*0.82
          assert result['mobile']['performance'] >= baseline['mobile']['performance']
          assert result['desktop']['performance'] >= baseline['desktop']['performance']-2
          assert result['htmlBytes']<1900000
          PY

      - name: Commit verified semantic containment
        run: |
          git config user.name 'OpenAI Project Automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/performance-pass-section-containment.yml
          rm -rf tmp/pass2
          git add -A
          git commit -m 'Group H2 corpus into deferred semantic sections'
          git push origin HEAD:main

name: v1.2.2 preview URL scope fix
on:
  push:
    branches: [release/v1.2.2-candidate]
    paths: [.github/workflows/v122-preview-env-fix.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: true}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: 24.18.0}
      - name: Keep Preview URL available inside the proving step and subsequent Lighthouse step
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');const f='.github/workflows/ceiling-release.yml';let s=fs.readFileSync(f,'utf8');
          const old=`          node - <<'NODE' >> \"$GITHUB_ENV\"\n          const p=require('/tmp/cf-deployments.json');const c=process.env.SOURCE_COMMIT;const d=p.result.find(x=>x.environment==='preview'&&x.deployment_trigger?.metadata?.commit_hash===c&&x.latest_stage?.status==='success');if(!d?.url)throw Error('Successful preview URL missing');console.log(\`PREVIEW_URL=https://\${String(d.url).replace(/^https?:\\/\\//,'').replace(/\\/$/,'')}/\`)\n          NODE\n          VERIFY_BASE_URL=\"$PREVIEW_URL\" node scripts/verify-cloudflare-pages-deployment.mjs`;
          const neu=`          PREVIEW_URL=\"$(node - <<'NODE'\n          const p=require('/tmp/cf-deployments.json');const c=process.env.SOURCE_COMMIT;const d=p.result.find(x=>x.environment==='preview'&&x.deployment_trigger?.metadata?.commit_hash===c&&x.latest_stage?.status==='success');if(!d?.url)throw Error('Successful preview URL missing');console.log(\`https://\${String(d.url).replace(/^https?:\\/\\//,'').replace(/\\/$/,'')}/\`)\n          NODE\n          )\"\n          test -n \"$PREVIEW_URL\"\n          echo \"PREVIEW_URL=$PREVIEW_URL\" >> \"$GITHUB_ENV\"\n          VERIFY_BASE_URL=\"$PREVIEW_URL\" node scripts/verify-cloudflare-pages-deployment.mjs`;
          if(!s.includes(old))throw Error('Preview URL scope anchor missing');s=s.replace(old,neu);fs.writeFileSync(f,s);
          NODE
          grep -q 'PREVIEW_URL="$(node' .github/workflows/ceiling-release.yml
          git config user.name ghezelbaash-release-bot
          git config user.email actions@users.noreply.github.com
          git add .github/workflows/ceiling-release.yml
          git commit -m 'Keep Cloudflare preview URL in scope for proof and Lighthouse gate'
          git push origin HEAD:release/v1.2.2-candidate

name: Synchronize audit branch TTL and CSP

on:
  push:
    branches: [audit/validate-main-20260729]
    paths:
      - '.github/workflows/fix-ttl-csp-on-audit.yml'

permissions:
  contents: write

jobs:
  synchronize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/validate-main-20260729
          fetch-depth: 0

      - name: Repair exact RDF literals and current CSS hash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          ttl = Path('public/graph.ttl')
          value = ttl.read_text(encoding='utf-8')
          value = value.replace('schema:latitude 34.34012 ;', 'schema:latitude 34.3401243 ;')
          value = value.replace('schema:longitude 47.08518 ;', 'schema:longitude 47.0851778 ;')
          value = value.replace(
              '# Canonical sorted N-Triples SHA-256: 7909763983997786754d72288578337d43d5f05e7dd087bbd081dfa40410d6da',
              '# Canonical sorted N-Triples SHA-256: cfb05fd80d1d0d8777165fb16194c7f6f865a7767ce811c766e44fbc6bd51318',
          )
          ttl.write_text(value, encoding='utf-8')

          headers = Path('public/_headers')
          value = headers.read_text(encoding='utf-8')
          value = value.replace(
              "'sha256-Bj/2hAJyutJoG6jydQVLRC0Js4gq88XyP4RrP82xFUY='",
              "'sha256-H6vU43mYlYEXDF+XlwislxVkGW9+3OOMgy3D1Mjpkog='",
          )
          headers.write_text(value, encoding='utf-8')
          PY

      - name: Remove this one-shot workflow and commit synchronized files
        run: |
          set -euo pipefail
          rm .github/workflows/fix-ttl-csp-on-audit.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public/graph.ttl public/_headers .github/workflows/fix-ttl-csp-on-audit.yml
          git commit -m 'Synchronize Turtle precision and strict CSP hash'
          git push origin HEAD:audit/validate-main-20260729

name: Temporary read-only Wikimedia integrity audit

on:
  pull_request:
    types: [opened]
    branches: [main]

permissions:
  contents: write

jobs:
  audit:
    if: github.head_ref == 'tmp-readonly-wikimedia-integrity-audit'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14.6'
      - run: python -m pip install --disable-pip-version-check --no-input requests==2.32.5
      - name: Fetch live Wikimedia state read-only
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/_tmp_readonly_wikimedia_integrity_audit.py
          mkdir -p wikimedia
          python scripts/_tmp_readonly_wikimedia_integrity_audit.py > wikimedia/_tmp-readonly-wikimedia-integrity-audit.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add wikimedia/_tmp-readonly-wikimedia-integrity-audit.json
          git commit -m 'Record read-only Wikimedia integrity audit' || true
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

name: Materialize final v1.2.2 atomic controller

on:
  push:
    branches: [main]
    paths: [.release/v122-final-atomic-request.json]

permissions:
  contents: write

concurrency:
  group: doctor-ghezelbaash-external-mutation
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: release/v1.2.2-candidate
          fetch-depth: 0
          persist-credentials: true
      - name: Build final atomic workflow payload
        shell: bash
        run: |
          set -euo pipefail
          git config user.name ghezelbaash-final-controller-materializer
          git config user.email actions@users.noreply.github.com
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('.github/workflows/ceiling-release.yml')
          src=p.read_text()

          malformed="""          PREVIEW_URL='https://staging-deploy.doctor-ghezelbaash.pages.dev/'
echo \"CLOUDFLARE_PREVIEW_ALIAS_SELECTED $PREVIEW_URL exact_commit=$SOURCE_COMMIT\"
          echo \"PREVIEW_URL=$PREVIEW_URL\" >> \"$GITHUB_ENV\"
"""
          corrected="""          PREVIEW_URL='https://staging-deploy.doctor-ghezelbaash.pages.dev/'
          echo \"CLOUDFLARE_PREVIEW_ALIAS_SELECTED $PREVIEW_URL exact_commit=$SOURCE_COMMIT\"
          echo \"PREVIEW_URL=$PREVIEW_URL\" >> \"$GITHUB_ENV\"
"""
          if malformed in src:
              src=src.replace(malformed,corrected,1)
          elif corrected not in src:
              raise SystemExit('preview alias block neither malformed nor already-correct')

          start='      - name: Six-viewport Lighthouse performance and layout regression gate\n'
          end='      - name: Prepare non-public GitHub Release draft against exact Candidate C\n'
          a=src.find(start); b=src.find(end,a)
          if a<0 or b<0: raise SystemExit('performance gate boundaries not found')
          replacement=r'''      - name: Six-viewport Lighthouse performance and layout regression gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/lh
          for spec in '360:800:mobile:2:85' '390:844:mobile:2:85' '430:932:mobile:2:85' '768:1024:desktop:1:90' '1024:900:desktop:1:95' '1440:900:desktop:1:95'; do
            IFS=: read -r width height form dpr target <<<"$spec"
            common=(--quiet --only-categories=performance --output=json --chrome-flags='--headless --no-sandbox --disable-gpu' --screenEmulation.width="$width" --screenEmulation.height="$height" --screenEmulation.deviceScaleFactor="$dpr")
            if [ "$form" = mobile ]; then common+=(--form-factor=mobile --screenEmulation.mobile=true); else common+=(--preset=desktop --screenEmulation.mobile=false); fi
            for sample in a b; do
              npx --yes lighthouse@13.4.1 "https://www.ghezelbaash.ir/?__lh_release=${width}_${sample}_$(date +%s%N)" "${common[@]}" --output-path="/tmp/lh/base-${width}-${sample}.json"
              npx --yes lighthouse@13.4.1 "${PREVIEW_URL}?__lh_candidate=${width}_${sample}_$(date +%s%N)" "${common[@]}" --output-path="/tmp/lh/candidate-${width}-${sample}.json"
            done
            node - "$width" "$target" <<'NODE'
          const fs=require('fs'),[width,targetRaw]=process.argv.slice(2),target=Number(targetRaw);
          const load=(kind,s)=>JSON.parse(fs.readFileSync(`/tmp/lh/${kind}-${width}-${s}.json`));
          const B=['a','b'].map(s=>load('base',s)),C=['a','b'].map(s=>load('candidate',s));
          const median=v=>{v=[...v].sort((a,b)=>a-b);return (v[0]+v[1])/2};
          const score=x=>Math.round(x.categories.performance.score*100),metric=(x,k)=>x.audits[k].numericValue;
          const agg=(arr,k)=>median(arr.map(x=>k==='score'?score(x):metric(x,k)));
          const out={width:Number(width),target,baselineScore:agg(B,'score'),candidateScore:agg(C,'score'),baselineLcp:agg(B,'largest-contentful-paint'),candidateLcp:agg(C,'largest-contentful-paint'),baselineCls:agg(B,'cumulative-layout-shift'),candidateCls:agg(C,'cumulative-layout-shift'),baselineTbt:agg(B,'total-blocking-time'),candidateTbt:agg(C,'total-blocking-time')};
          const inheritedTargetDebt=out.baselineScore<target;
          const scorePass=inheritedTargetDebt?out.candidateScore>=out.baselineScore-1:out.candidateScore>=Math.max(target-2,out.baselineScore-3);
          const clsPass=out.baselineCls>0.1?out.candidateCls<=out.baselineCls+0.005:(out.candidateCls<=0.1&&out.candidateCls<=out.baselineCls+0.03);
          const lcpPass=out.candidateLcp<=Math.max(4000,out.baselineLcp*1.15);
          const tbtPass=out.candidateTbt<=Math.max(600,out.baselineTbt*1.5+100);
          const pass=scorePass&&clsPass&&lcpPass&&tbtPass;
          console.log('LIGHTHOUSE_VIEWPORT_GATE_V2',JSON.stringify({...out,inheritedTargetDebt,scorePass,clsPass,lcpPass,tbtPass,pass}));
          if(inheritedTargetDebt&&out.candidateScore<target&&pass)console.log(`PERFORMANCE_TARGET_DEBT_INHERITED width=${width} target=${target} baseline=${out.baselineScore} candidate=${out.candidateScore}`);
          if(!pass)throw Error(`${width} comparative performance regression gate failed`);
          NODE
          done
          node scripts/update-release-control.mjs "$LEDGER" PERFORMANCE_PROVEN sourceCommit=$SOURCE_COMMIT lighthouseViewports=6 performanceGate=comparative-v2 pairedSamples=2
          git -C /tmp/v122-control add .release/control/v1.2.2.json && git -C /tmp/v122-control commit -m 'Prove six-viewport v1.2.2 comparative performance gate' && git -C /tmp/v122-control push origin HEAD:$CONTROL_BRANCH
'''
          src=src[:a]+replacement+src[b:]
          if '\necho "CLOUDFLARE_PREVIEW_ALIAS_SELECTED' in src:
              raise SystemExit('malformed unindented preview alias echo remains')
          if 'LIGHTHOUSE_VIEWPORT_GATE_V2' not in src or 'PERFORMANCE_TARGET_DEBT_INHERITED' not in src:
              raise SystemExit('comparative performance gate missing')
          out=Path('.release/final-ceiling-release-v1.2.2.yml.txt')
          out.parent.mkdir(parents=True,exist_ok=True)
          out.write_text(src)
          print('FINAL_ATOMIC_PAYLOAD_MATERIALIZED',len(src))
          PY
          git add .release/final-ceiling-release-v1.2.2.yml.txt
          git diff --cached --check
          git commit -m 'Materialize final v1.2.2 atomic controller payload'
          git push origin HEAD:release/v1.2.2-candidate
          echo "FINAL_ATOMIC_PAYLOAD_READY $(git rev-parse HEAD)"

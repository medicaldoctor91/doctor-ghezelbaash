name: Temporary DIST public resource closure patch

on:
  push:
    branches: [fix/semantic-calibration-recovery-20260907]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: node scripts/patch-dist-public-resource-closure.mjs
      - name: Rebuild distribution and exercise DIST closure
        shell: bash
        run: |
          set -euo pipefail
          npm run prepare:distribution
          npm run compile:dist
          node --test scripts/test-canonical-media-semantics.mjs scripts/test-media-inventory.mjs
      - name: Require exact patch scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed=$(git diff --name-only)
          test "$changed" = "scripts/validate-dist.mjs"
      - name: Commit DIST closure integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/validate-dist.mjs
          git commit -m "Recognize materialized resource IRIs in DIST closure"
          git push origin "HEAD:${GITHUB_REF_NAME}"

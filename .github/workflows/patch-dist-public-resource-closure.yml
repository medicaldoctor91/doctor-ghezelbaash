name: Temporary E001 JSON-LD IRI coercion pivot

on:
  push:
    branches: [fix/semantic-calibration-recovery-20260907]

permissions:
  contents: write

jobs:
  pivot:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Restore compatibility consumers to baseline
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin main
          git checkout origin/main -- \
            scripts/lib/graph-integrity.mjs \
            scripts/lib/media-inventory.mjs \
            scripts/lib/projections/contact-discovery.mjs \
            scripts/test-media-inventory.mjs \
            scripts/validate-release-contract.mjs \
            scripts/validate-source.mjs
      - name: Pivot E001 to JSON-LD context IRI coercion
        env:
          PIVOT_IMAGE_IRI_CONTEXT: "1"
        run: node scripts/patch-dist-public-resource-closure.mjs
      - run: npm ci
      - name: Rebuild and exercise native Google/DIST contracts
        shell: bash
        run: |
          set -euo pipefail
          npm run prepare:distribution
          node --test scripts/test-canonical-media-semantics.mjs scripts/test-media-inventory.mjs
          npm run validate:google-structured-data
          npm run validate:physician-projection
          npm run compile:dist
      - name: Prove six clinic crop image objects are RDF IRIs
        shell: bash
        run: |
          set -euo pipefail
          for url in \
            'https://www.ghezelbaash.ir/media/images/clinic/ghezelbash-clinic-interior-kermanshah-1x1.38fa87daaf54.webp' \
            'https://www.ghezelbaash.ir/media/images/clinic/ghezelbash-clinic-interior-kermanshah-4x3.cf191f37bcdb.webp' \
            'https://www.ghezelbaash.ir/media/images/clinic/ghezelbash-clinic-interior-kermanshah-16x9.1d9285d1dfd7.webp' \
            'https://www.ghezelbaash.ir/media/images/clinic/ghezelbash-clinic-reception-kermanshah-1x1.adef35b75d97.webp' \
            'https://www.ghezelbaash.ir/media/images/clinic/ghezelbash-clinic-reception-kermanshah-4x3.fdbc375592c3.webp' \
            'https://www.ghezelbaash.ir/media/images/clinic/ghezelbash-clinic-reception-kermanshah-16x9.a49f74e53c0e.webp'
          do
            grep -F "<$url>" .generated/semantic/knowledge-graph.ttl >/dev/null
          done
      - name: Require exact pivot scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed=$(git diff --name-only)
          expected=$'scripts/lib/graph-integrity.mjs\nscripts/lib/media-inventory.mjs\nscripts/lib/projections/contact-discovery.mjs\nscripts/test-canonical-media-semantics.mjs\nscripts/test-media-inventory.mjs\nscripts/validate-release-contract.mjs\nscripts/validate-source.mjs\nsrc/data/semantic/knowledge-graph.jsonld'
          test "$changed" = "$expected"
      - name: Commit root-cause E001 representation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/lib/graph-integrity.mjs \
            scripts/lib/media-inventory.mjs \
            scripts/lib/projections/contact-discovery.mjs \
            scripts/test-canonical-media-semantics.mjs \
            scripts/test-media-inventory.mjs \
            scripts/validate-release-contract.mjs \
            scripts/validate-source.mjs \
            src/data/semantic/knowledge-graph.jsonld
          git commit -m "Type clinic image URLs as JSON-LD IRIs without projection drift"
          git push origin "HEAD:${GITHUB_REF_NAME}"

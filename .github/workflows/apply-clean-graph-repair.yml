name: Apply clean graph repair

on:
  push:
    branches: [repair-clean-graph-2026-07-30]
    paths:
      - 'scripts/_apply_clean_graph_repair.py'
      - '.github/workflows/apply-clean-graph-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair-clean-graph-2026-07-30
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install RDF tooling
        run: python -m pip install --quiet rdflib

      - name: Apply source-native repair
        run: python scripts/_apply_clean_graph_repair.py

      - name: Commit repaired source tree
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Repair graph architecture and synchronize projections'
          git push origin HEAD:repair-clean-graph-2026-07-30

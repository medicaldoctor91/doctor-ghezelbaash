name: Fix Commons person category sort

on:
  push:
    branches: [main]
    paths:
      - scripts/commons_fix_person_category_sort.py
      - .github/workflows/commons-fix-person-category-sort.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: commons-fix-person-category-sort
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      COMMONS_USERNAME: ${{ secrets.WIKIVERSITY_USERNAME }}
      COMMONS_BOT_PASSWORD: ${{ secrets.WIKIVERSITY_BOT_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install dependency
        run: python -m pip install --disable-pip-version-check --no-input requests==2.32.5
      - name: Resolve and verify DEFAULTSORT conflict
        run: python scripts/commons_fix_person_category_sort.py

name: Set Wikidata native name to common Persian name
# fresh runner retry; fail fast on Wikimedia global IP blocks

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wikidata-native-name-common.yml'

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    env:
      WIKIMEDIA_USERNAME: ${{ secrets.WIKIVERSITY_USERNAME }}
      WIKIMEDIA_BOT_PASSWORD: ${{ secrets.WIKIVERSITY_BOT_PASSWORD }}
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check --no-input requests==2.32.5
      - name: Change only P1559 and preserve prefix
        shell: python
        run: |
          import json, os, requests, time
          WD='https://www.wikidata.org/w/api.php'; PERSON='Q140287622'; DOCTOR='Q4618975'
          OLD='محمدسعید قزلباش'; NEW='سعید قزلباش'
          UA='Medicaldoctor91NativeNameCommon/1.1 (https://www.ghezelbaash.ir/)'
          anon=requests.Session(); anon.headers['User-Agent']=UA
          auth=requests.Session(); auth.headers['User-Agent']=UA
          def get(sess,p):
              r=sess.get(WD,params={**p,'format':'json','formatversion':2},timeout=90); r.raise_for_status(); d=r.json()
              if 'error' in d: raise RuntimeError(d['error'])
              return d
          def post(p):
              for w in [5,10,20]:
                  r=auth.post(WD,data={**p,'format':'json','formatversion':2,'maxlag':5},timeout=120); r.raise_for_status(); d=r.json()
                  if 'error' not in d: return d
                  err=d['error']; blob=json.dumps(err,ensure_ascii=False).lower()
                  if 'globalblocking-blockedtext-range' in blob or 'open proxy/webhost' in blob:
                      raise RuntimeError({'global_ip_block':err})
                  if err.get('code') in {'maxlag','ratelimited','actionthrottled'}:
                      time.sleep(w); continue
                  raise RuntimeError(err)
              raise RuntimeError('retry exhausted')
          def ent(sess): return get(sess,{'action':'wbgetentities','ids':PERSON,'props':'claims|info'})['entities'][PERSON]
          def item_qid(c):
              v=c.get('mainsnak',{}).get('datavalue',{}).get('value')
              return v.get('id') if isinstance(v,dict) else None
          before=ent(anon)
          native=before.get('claims',{}).get('P1559',[]); prefix=before.get('claims',{}).get('P511',[])
          if len(native)!=1: raise RuntimeError({'unexpected_P1559_count':len(native)})
          v=native[0].get('mainsnak',{}).get('datavalue',{}).get('value')
          if not isinstance(v,dict) or v.get('language')!='fa' or v.get('text') not in {OLD,NEW}: raise RuntimeError({'unexpected_P1559_value':v})
          if len(prefix)!=1 or item_qid(prefix[0])!=DOCTOR: raise RuntimeError({'unexpected_P511':[item_qid(c) for c in prefix]})
          native_refs_before=len(native[0].get('references',[])); prefix_id=prefix[0].get('id'); prefix_refs=len(prefix[0].get('references',[]))
          if native_refs_before<1 or prefix_refs<1: raise RuntimeError('Expected sourced P1559 and P511')
          lt=get(auth,{'action':'query','meta':'tokens','type':'login'})['query']['tokens']['logintoken']
          login=post({'action':'login','lgname':os.environ['WIKIMEDIA_USERNAME'],'lgpassword':os.environ['WIKIMEDIA_BOT_PASSWORD'],'lgtoken':lt})
          if login.get('login',{}).get('result')!='Success': raise RuntimeError(login)
          csrf=get(auth,{'action':'query','meta':'tokens','type':'csrf'})['query']['tokens']['csrftoken']
          changed=False
          if v.get('text')==OLD:
              post({'action':'wbsetclaimvalue','claim':native[0]['id'],'snaktype':'value','value':json.dumps({'text':NEW,'language':'fa'},ensure_ascii=False,separators=(',',':')),'token':csrf,'summary':'Use common Persian name as native name'})
              changed=True
          after=ent(anon); n2=after.get('claims',{}).get('P1559',[]); p2=after.get('claims',{}).get('P511',[])
          if len(n2)!=1: raise RuntimeError({'final_P1559_count':len(n2)})
          nv=n2[0].get('mainsnak',{}).get('datavalue',{}).get('value')
          if nv != {'text':NEW,'language':'fa'}: raise RuntimeError({'final_P1559':nv})
          if len(n2[0].get('references',[])) != native_refs_before: raise RuntimeError('P1559 references changed')
          if len(p2)!=1 or p2[0].get('id')!=prefix_id or item_qid(p2[0])!=DOCTOR or len(p2[0].get('references',[]))!=prefix_refs: raise RuntimeError('P511 changed unexpectedly')
          print(json.dumps({'ok':True,'changed_P1559':changed,'P1559':nv,'P1559_references':len(n2[0].get('references',[])),'P511':DOCTOR,'P511_unchanged':True,'P511_references':len(p2[0].get('references',[])),'lastrevid':after.get('lastrevid')},ensure_ascii=False,indent=2))

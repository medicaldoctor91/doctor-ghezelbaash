name: Request Wikiversity sister-link on Botulinum toxin

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wikipedia-botulinum-wikiversity-coi-request.yml'

permissions:
  contents: read

jobs:
  request:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    env:
      WIKIMEDIA_USERNAME: ${{ secrets.WIKIVERSITY_USERNAME }}
      WIKIMEDIA_BOT_PASSWORD: ${{ secrets.WIKIVERSITY_BOT_PASSWORD }}
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check --no-input requests==2.32.5
      - name: Post COI edit request and verify
        shell: python
        run: |
          import os, requests, json
          API='https://en.wikipedia.org/w/api.php'
          TALK='Talk:Botulinum toxin'
          TARGET='Botulinum toxin in aesthetic medicine'
          s=requests.Session(); s.headers['User-Agent']='Medicaldoctor91WikiversitySisterLinkRequest/1.0 (https://www.ghezelbaash.ir/)'
          def get(p):
              r=s.get(API,params={**p,'format':'json','formatversion':2},timeout=90); r.raise_for_status(); d=r.json()
              if 'error' in d: raise RuntimeError(d['error'])
              return d
          def post(p):
              r=s.post(API,data={**p,'format':'json','formatversion':2,'maxlag':5},timeout=120); r.raise_for_status(); d=r.json()
              if 'error' in d: raise RuntimeError(d['error'])
              return d

          q=get({'action':'query','prop':'revisions','titles':TALK,'rvprop':'ids|content','rvslots':'main'})
          page=q['query']['pages'][0]
          text=''
          if page.get('missing') is None and page.get('revisions'):
              slot=page['revisions'][0]['slots']['main']; text=slot.get('content') or slot.get('*') or ''

          changed=False
          if TARGET not in text:
              lt=get({'action':'query','meta':'tokens','type':'login'})['query']['tokens']['logintoken']
              login=post({'action':'login','lgname':os.environ['WIKIMEDIA_USERNAME'],'lgpassword':os.environ['WIKIMEDIA_BOT_PASSWORD'],'lgtoken':lt})
              if login.get('login',{}).get('result')!='Success': raise RuntimeError(login)
              csrf=get({'action':'query','meta':'tokens','type':'csrf'})['query']['tokens']['csrftoken']
              body=(
                  "{{edit COI}}\n"
                  "'''Disclosure:''' I am Saeed Ghezelbash (User:Medicaldoctor91), the author of the Wikiversity learning resource below.\n\n"
                  "Please consider adding a Wikimedia sister-project link in the article's External links section to "
                  "[[Wikiversity:Botulinum toxin in aesthetic medicine|Botulinum toxin in aesthetic medicine]] at Wikiversity. "
                  "The resource is directly relevant to the article's cosmetic-use coverage. I am requesting independent review rather than editing the article directly because of this connection. ~~~~"
              )
              post({'action':'edit','title':TALK,'section':'new','sectiontitle':'Wikiversity sister-project link request','text':body,'token':csrf,'summary':'COI edit request: consider relevant Wikiversity sister-project link'})
              changed=True

          v=get({'action':'query','prop':'revisions|info','titles':TALK,'rvprop':'ids|content','rvslots':'main'})['query']['pages'][0]
          vslot=v['revisions'][0]['slots']['main']; vtext=vslot.get('content') or vslot.get('*') or ''
          if TARGET not in vtext or '{{edit COI}}' not in vtext:
              raise RuntimeError('Talk-page request verification failed')
          print(json.dumps({'ok':True,'changed':changed,'talk_page':TALK,'target':TARGET,'lastrevid':v.get('lastrevid')},ensure_ascii=False,indent=2))

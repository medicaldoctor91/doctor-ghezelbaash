name: Phase 3 Preview Contract

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase-3-preview-contract
  cancel-in-progress: true

jobs:
  verify-preview:
    name: Static root and explicit representation contract
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Verify deployed Cloudflare branch preview
        env:
          LIVE_ORIGIN: https://refactor-phase-3-static-root.doctor-ghezelbaash.pages.dev
          LIVE_VERIFY_ATTEMPTS: 20
          LIVE_VERIFY_DELAY_MS: 15000
        run: node scripts/verify-live.mjs

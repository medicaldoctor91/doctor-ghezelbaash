name: Restore final V1

on:
  push:
    branches: [restore-final-v1]

permissions:
  contents: write

concurrency:
  group: restore-final-v1
  cancel-in-progress: false

jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: restore-final-v1
          fetch-depth: 1

      - name: Rebuild clean static release from verified production
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/restore.py <<'PY'
          from __future__ import annotations

          import hashlib
          import html
          import json
          import re
          import shutil
          import sys
          import urllib.parse
          import urllib.request
          from pathlib import Path

          ORIGIN = "https://www.ghezelbaash.ir"
          ROOT = Path.cwd()
          UA = "Mozilla/5.0 (compatible; GhezelbaashReleaseRestorer/1.0; +https://www.ghezelbaash.ir/)"

          TITLE = "دکتر سعید قزلباش | پزشک زیبایی در کرمانشاه، تشخیص و درمان"
          DESCRIPTION = (
              "وب‌سایت رسمی دکتر سعید قزلباش، پزشک زیبایی در کرمانشاه؛ راهنمای جامع "
              "بوتاکس، فیلر، لیفت نخ، پوست، مو، کانتورینگ، جراحی زیبایی، عوارض، Revision، "
              "نظر دوم و ارزیابی پرونده‌های پیچیده برای مراجعه‌کنندگان از سراسر ایران و عراق."
          )
          H1_TEXT = (
              "دکتر سعید قزلباش، پزشک زیبایی در کرمانشاه؛ زیبایی از تشخیص شروع می‌شود، "
              "نه از منوی تزریق"
          )

          V7_SOURCE_BLOCK = r'''<h1 id="saeed-ghezelbash"><span id="saeed-ghezelbash-aesthetic-medicine">دکتر سعید قزلباش، پزشک زیبایی در کرمانشاه؛ زیبایی از تشخیص شروع می‌شود، نه از منوی تزریق</span></h1>

          سوزن همیشه مقصر نیست. خیلی وقت‌ها فاجعه از چند دقیقه قبل‌تر شروع شده؛ همان لحظه‌ای که یک پف را گودی دیده‌اند، افتادگی را کمبود ژل حساب کرده‌اند یا برای پوستی که اضافه آمده، نسخه بوتاکس نوشته‌اند. اجرای تمیز، تشخیص غلط را نجات نمی‌دهد. فقط اشتباه را تمیزتر اجرا می‌کند.

          <p>من، <a href="https://www.wikidata.org/wiki/Q140287622" rel="me">دکتر سعید قزلباش</a> هستم و با <a href="https://membersearch.irimc.org/member/profile?id=9efaaf28-52ff-49ad-8d45-be6e48c4fa3e">کد نظام پزشکی ۱۶۷۴۳۰</a> در کرمانشاه فعالیت می‌کنم. این صفحه منوی بوتاکس و فیلر نیست. قرار است ببینید وقتی یک صورت روبه‌روی من می‌نشیند، دقیقاً دنبال چه می‌گردم؛ کجا تزریق را قبول می‌کنم، کجا چند لایه باید هم‌زمان دیده شوند، کجا جراحی از بازی با سرنگ صادقانه‌تر است و کجا بهترین تصمیم پزشکی این است که اصلاً کاری نکنیم.</p>

          <p id="google-maps-clinic-reputation-current" class="hero-reputation"><strong>۵٫۰ از ۵ در <span translate="no">Google Maps</span></strong> · بر اساس ۱۶۴ نظر · ثبت ۲۵ ژوئیهٔ ۲۰۲۶ — <a href="https://www.google.com/maps?cid=12350483144643112463" rel="external">مشاهده نظرها</a></p>

          <figure>
            <picture>
              <source
                type="image/webp"
                srcset="/media/images/physician/saeed-ghezelbash-portrait-delivery-640.webp 640w, /media/images/physician/saeed-ghezelbash-portrait-delivery-960.webp 960w, /media/images/physician/saeed-ghezelbash-portrait-1600.webp 1600w"
                sizes="(max-width: 720px) calc(100vw - 4rem), (max-width: 960px) calc(100vw - 5rem), 960px"
              />
              <img
                src="/media/images/physician/saeed-ghezelbash-portrait-delivery-640.webp"
                width="640"
                height="427"
                alt="دکتر سعید قزلباش، پزشک ایرانی با روپوش سفید و گوشی پزشکی در محیط بالینی کرمانشاه"
                loading="eager"
                decoding="async"
                fetchpriority="high"
              />
            </picture>
            <figcaption>دکتر سعید قزلباش، پزشک زیبایی</figcaption>
          </figure>

          یک عکس ثابت درباره صورت دروغ‌های زیادی می‌گوید. ممکن است خطی که در عکس عمیق دیده می‌شود فقط هنگام اخم ساخته شود. ممکن است گودی زیر چشم با یک نور دیگر ناپدید شود، چون اصلاً گودی نبوده؛ سایه بوده. صورت را در استراحت می‌بینم، بعد هنگام اخم، لبخند و حرف‌زدن. پوست را لمس می‌کنم. حرکت عضله، جای چربی، حمایت استخوان، التهاب، عدم تقارن و اثر تزریق‌های قبلی را کنار هم می‌گذارم. بعد درباره درمان حرف می‌زنم. نه زودتر.


name: Audit publication parity for DOI 1.3.6 (read-only)
on:
  push:
    branches: [codex/doi-136-publication-parity-audit-20261121]
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests
      - uses: actions/download-artifact@v4
        with:
          name: clinical-authority-validation-artifacts
          run-id: 44880178266
          github-token: ${{ github.token }}
          path: /tmp/candidate
      - name: Compare exact released Zenodo snapshot, website, HF against reviewed source
        run: python .github/scripts/audit_published_136_doi_parity.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: doi-136-parity-audit
          path: /tmp/doi-136-parity/report.json
          if-no-files-found: warn
          retention-days: 30

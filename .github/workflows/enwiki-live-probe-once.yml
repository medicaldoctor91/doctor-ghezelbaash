name: One-shot live English Wikipedia probe

on:
  push:
    branches: [main]
    paths:
      - 'scripts/enwiki_live_probe_once.py'
      - '.github/workflows/enwiki-live-probe-once.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: enwiki-live-probe-once
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14.6'
      - name: Install dependency
        run: python -m pip install --disable-pip-version-check --no-input requests==2.32.5
      - name: Query live English Wikipedia API
        run: python scripts/enwiki_live_probe_once.py > wikimedia/enwiki-live-probe.json
      - name: Commit live snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add wikimedia/enwiki-live-probe.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record live English Wikipedia probe'
          git push

name: Current visible-text literal read-only check

on:
  push:
    branches: [ops/platform-convergence-resume-20261016]
    paths: ['.github/workflows/platform-resume.yml']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check current main and live clinic page literals
        run: |
          python - <<'PY'
          import html,json,re,subprocess,urllib.request
          terms=['Medical Director','مدیر پزشکی','ویستا','وپستا','A5064828898','A5146521397']
          out={'main':{},'liveClinicPage':{}}
          for t in terms:
              p=subprocess.run(['git','grep','-n','-I','-F',t,'origin/main','--'],text=True,capture_output=True)
              out['main'][t]=p.stdout.splitlines()[:50]
          url='https://www.ghezelbaash.ir/dr-saeed-ghezelbash-aesthetic-clinic-kermanshah?_cb=literal-check-20261017'
          req=urllib.request.Request(url,headers={'Cache-Control':'no-cache','Pragma':'no-cache','User-Agent':'literal-check/1.0'})
          raw=urllib.request.urlopen(req,timeout=120).read().decode('utf-8','replace')
          visible=html.unescape(re.sub(r'<script\b[^>]*>.*?</script>|<style\b[^>]*>.*?</style>|<[^>]+>',' ',raw,flags=re.I|re.S))
          visible=re.sub(r'\s+',' ',visible)
          for t in terms:
              out['liveClinicPage'][t]={'present':t in visible,'contexts':[]}
              start=0
              while True:
                  i=visible.find(t,start)
                  if i<0: break
                  out['liveClinicPage'][t]['contexts'].append(visible[max(0,i-160):i+len(t)+160])
                  start=i+len(t)
                  if len(out['liveClinicPage'][t]['contexts'])>=10: break
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY

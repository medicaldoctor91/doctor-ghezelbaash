name: Kaggle payload correction contract test

on:
  push:
    branches: [ops/platform-convergence-resume-20261016]
    paths:
      - '.github/workflows/platform-resume.yml'
      - '.github/scripts/kaggle_payload_fix.py'
      - 'tests/test_kaggle_payload_fix.py'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Kaggle reserved-file regression test
        run: python -m unittest tests/test_kaggle_payload_fix.py -v

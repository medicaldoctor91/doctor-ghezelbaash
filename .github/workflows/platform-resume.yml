name: Kaggle v12 semantic read-only diagnostic

on:
  push:
    branches: [ops/platform-convergence-resume-20261016]
    paths: ['.github/workflows/platform-resume.yml']

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN || secrets.KAGGLE_TOKEN }}
      TARGET_SOURCE_COMMIT: 62cd2dd0432790916467c0c25d8264c20ba103cd
      TARGET_HF_REVISION: 45bc20d21be4eaa1e25b1798e9aff0e53243417a
      KAGGLE_REF: saeedghezelbash/dr-saeed-ghezelbash-knowledge-graph-and-nlp-data
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install Kaggle client
        run: python -m pip install --disable-pip-version-check 'kaggle>=2.2,<3'
      - name: Download and inspect current payload
        run: |
          kaggle datasets status "$KAGGLE_REF" --format json > /tmp/kaggle-status.json
          rm -rf /tmp/kaggle-current && mkdir -p /tmp/kaggle-current
          kaggle datasets download "$KAGGLE_REF" -p /tmp/kaggle-current --unzip --force >/dev/null
          python - <<'PY'
          import hashlib,json,os,pathlib,urllib.request
          root=pathlib.Path('/tmp/kaggle-current')
          status=json.loads(pathlib.Path('/tmp/kaggle-status.json').read_text())
          manifest=json.loads((root/'kaggle-manifest.json').read_text())
          graph_bytes=(root/'graph.jsonld').read_bytes(); graph=json.loads(graph_bytes)
          url='https://huggingface.co/datasets/doctor-ghezelbaash/dr-saeid-ghezelbaash-entity-data/resolve/'+os.environ['TARGET_HF_REVISION']+'/graph.jsonld?download=true'
          req=urllib.request.Request(url,headers={'User-Agent':'kaggle-v12-semantic-diagnostic/1.0'})
          hf_graph=urllib.request.urlopen(req,timeout=120).read()
          nodes={n.get('@id'):n for n in graph.get('@graph',[]) if isinstance(n,dict) and n.get('@id')}
          person=nodes['https://www.ghezelbaash.ir/#saeed-ghezelbash']
          clinic=nodes['https://www.ghezelbaash.ir/dr-saeed-ghezelbash-aesthetic-clinic-kermanshah']
          checks={}
          for line in (root/'checksums.sha256').read_text().splitlines():
              digest,name=line.split('  ',1); checks[name]=digest
          actual={p.relative_to(root).as_posix() for p in root.rglob('*') if p.is_file()}
          checksum_values_ok=all(hashlib.sha256((root/name).read_bytes()).hexdigest()==digest for name,digest in checks.items())
          report={
            'status':status,
            'manifestDesiredVersion':manifest.get('desired_kaggle_version'),
            'manifestSourceCommit':manifest.get('website_source_commit'),
            'manifestHfRevision':manifest.get('upstream_revision'),
            'manifestSourceMatchesTarget':manifest.get('website_source_commit')==os.environ['TARGET_SOURCE_COMMIT'],
            'manifestHfMatchesTarget':manifest.get('upstream_revision')==os.environ['TARGET_HF_REVISION'],
            'payloadFileCount':len(actual),
            'checksumSetMatches':set(checks)==actual-{'checksums.sha256'},
            'checksumValuesPass':checksum_values_ok,
            'graphSha256':hashlib.sha256(graph_bytes).hexdigest(),
            'hfGraphSha256':hashlib.sha256(hf_graph).hexdigest(),
            'graphByteIdenticalToHF':graph_bytes==hf_graph,
            'legacyEdgesAbsent':('worksFor' not in person and 'affiliation' not in person and 'employee' not in clinic),
            'correctEdgesPresent':bool(person.get('owns') and person.get('practicesAt') and person.get('workLocation') and clinic.get('owner')),
            'personWorksFor':person.get('worksFor'),
            'personAffiliation':person.get('affiliation'),
            'clinicEmployee':clinic.get('employee'),
            'personOwns':person.get('owns'),
            'personPracticesAt':person.get('practicesAt'),
            'personWorkLocation':person.get('workLocation'),
            'clinicOwner':clinic.get('owner'),
          }
          pathlib.Path('/tmp/kaggle-v12-semantic.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY
      - name: Save diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kaggle-v12-semantic-diagnostic
          path: /tmp/kaggle-v12-semantic.json
          if-no-files-found: warn
          overwrite: true

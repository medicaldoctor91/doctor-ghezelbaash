name: Current platform convergence read-only audit

on:
  push:
    branches: [ops/platform-convergence-resume-20261016]
    paths: ['.github/workflows/platform-resume.yml']

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN || secrets.KAGGLE_TOKEN }}
      KAGGLE_REF: saeedghezelbash/dr-saeed-ghezelbash-knowledge-graph-and-nlp-data
      HF_REPO: doctor-ghezelbaash/dr-saeid-ghezelbaash-entity-data
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install Kaggle client
        run: python -m pip install --disable-pip-version-check 'kaggle>=2.2,<3'
      - name: Download current Kaggle payload
        run: |
          kaggle datasets status "$KAGGLE_REF" --format json > /tmp/kaggle-status.json
          rm -rf /tmp/kaggle-current && mkdir -p /tmp/kaggle-current
          kaggle datasets download "$KAGGLE_REF" -p /tmp/kaggle-current --unzip --force >/dev/null
      - name: Cross-check all current platforms
        run: |
          python - <<'PY'
          import hashlib, io, json, os, pathlib, subprocess, tempfile, urllib.parse, urllib.request, zipfile

          def get_bytes(url, timeout=900):
              req=urllib.request.Request(url,headers={'Cache-Control':'no-cache','User-Agent':'current-platform-convergence-audit/1.0'})
              return urllib.request.urlopen(req,timeout=timeout).read()
          def get_json(url, timeout=120):
              return json.loads(get_bytes(url,timeout))
          def sha(b): return hashlib.sha256(b).hexdigest()

          main=subprocess.check_output(['git','rev-parse','origin/main'],text=True).strip()
          website=get_json('https://www.ghezelbaash.ir/release-provenance.json?_cb=current-audit')
          hf_info=get_json('https://huggingface.co/api/datasets/'+os.environ['HF_REPO'])
          hf_rev=hf_info['sha']
          hf_matrix=json.loads(get_bytes(f'https://huggingface.co/datasets/{os.environ["HF_REPO"]}/resolve/{hf_rev}/current-release-matrix.json?download=true'))
          hf_graph=get_bytes(f'https://huggingface.co/datasets/{os.environ["HF_REPO"]}/resolve/{hf_rev}/graph.jsonld?download=true')
          hf_graph_json=json.loads(hf_graph)

          zen_ds=get_json('https://zenodo.org/api/records/22838416')
          zen_src=get_json('https://zenodo.org/api/records/23289009')
          zen_graph=get_bytes('https://zenodo.org/api/records/22838416/files/graph.jsonld/content')
          src_key=zen_src['files'][0]['key']
          zen_source_zip=get_bytes('https://zenodo.org/api/records/23289009/files/'+urllib.parse.quote(src_key,safe='')+'/content')

          kag_root=pathlib.Path('/tmp/kaggle-current')
          kag_status=json.loads(pathlib.Path('/tmp/kaggle-status.json').read_text())
          kag_manifest=json.loads((kag_root/'kaggle-manifest.json').read_text())
          kag_graph=(kag_root/'graph.jsonld').read_bytes()
          kag_graph_json=json.loads(kag_graph)
          kag_actual={p.relative_to(kag_root).as_posix() for p in kag_root.rglob('*') if p.is_file()}
          kag_checks={}
          for line in (kag_root/'checksums.sha256').read_text().splitlines():
              if '  ' in line:
                  d,n=line.split('  ',1); kag_checks[n]=d
          kag_checks_values=all(hashlib.sha256((kag_root/n).read_bytes()).hexdigest()==d for n,d in kag_checks.items())

          def graph_semantics(g):
              nodes={n.get('@id'):n for n in g.get('@graph',[]) if isinstance(n,dict) and n.get('@id')}
              person=nodes['https://www.ghezelbaash.ir/#saeed-ghezelbash']
              clinic=nodes['https://www.ghezelbaash.ir/dr-saeed-ghezelbash-aesthetic-clinic-kermanshah']
              return {
                'legacyEdgesAbsent': 'worksFor' not in person and 'affiliation' not in person and 'employee' not in clinic,
                'correctEdgesPresent': bool(person.get('owns') and person.get('practicesAt') and person.get('workLocation') and clinic.get('owner')),
                'worksFor': person.get('worksFor'), 'affiliation': person.get('affiliation'), 'employee': clinic.get('employee')
              }

          with tempfile.TemporaryDirectory() as d:
              expected=pathlib.Path(d)/'source.zip'
              subprocess.run(['git','archive','--format=zip','--prefix=doctor-ghezelbaash-source-final-2026-10-10/','-o',str(expected),main],check=True)
              expected_source=expected.read_bytes()

          with zipfile.ZipFile(io.BytesIO(zen_source_zip)) as z:
              canonical_name=next((n for n in z.namelist() if n.endswith('src/canonical/source.mjs')),None)
              canonical=z.read(canonical_name) if canonical_name else b''

          report={
            'main': main,
            'websiteSourceCommit': website.get('sourceCommit'),
            'websiteMatchesMain': website.get('sourceCommit')==main,
            'hfCurrentRevision': hf_rev,
            'hfMatrixSourceCommit': hf_matrix.get('websiteSourceCommit'),
            'hfMatchesMain': hf_matrix.get('websiteSourceCommit')==main,
            'zenodoDataset': {'doi': zen_ds.get('doi') or zen_ds.get('pids',{}).get('doi',{}).get('identifier'), 'version': zen_ds.get('metadata',{}).get('version'), 'files': len(zen_ds.get('files',[]))},
            'zenodoSource': {'doi': zen_src.get('doi') or zen_src.get('pids',{}).get('doi',{}).get('identifier'), 'version': zen_src.get('metadata',{}).get('version'), 'files': len(zen_src.get('files',[]))},
            'zenodoSourceArchiveMatchesMain': zen_source_zip==expected_source,
            'zenodoCanonicalLegacyTermsAbsent': (b'worksFor' not in canonical and b'Medical Director' not in canonical),
            'graphHashes': {'hf':sha(hf_graph),'zenodo':sha(zen_graph),'kaggle':sha(kag_graph)},
            'hfZenodoGraphIdentical': hf_graph==zen_graph,
            'hfKaggleGraphIdentical': hf_graph==kag_graph,
            'zenodoKaggleGraphIdentical': zen_graph==kag_graph,
            'hfSemantics': graph_semantics(hf_graph_json),
            'kaggleStatus': kag_status,
            'kaggleManifestVersion': kag_manifest.get('desired_kaggle_version'),
            'kaggleManifestSourceCommit': kag_manifest.get('website_source_commit'),
            'kaggleManifestHfRevision': kag_manifest.get('upstream_revision'),
            'kaggleMatchesMain': kag_manifest.get('website_source_commit')==main,
            'kaggleMatchesCurrentHfRevision': kag_manifest.get('upstream_revision')==hf_rev,
            'kaggleChecksumSetMatches': set(kag_checks)==kag_actual-{'checksums.sha256'},
            'kaggleChecksumValuesPass': kag_checks_values,
            'kaggleSemantics': graph_semantics(kag_graph_json),
          }
          report['fullyConvergedCore'] = all([
              report['websiteMatchesMain'], report['hfMatchesMain'], report['zenodoSourceArchiveMatchesMain'],
              report['hfZenodoGraphIdentical'], report['hfKaggleGraphIdentical'],
              report['kaggleMatchesMain'], report['kaggleMatchesCurrentHfRevision'],
              report['kaggleChecksumSetMatches'], report['kaggleChecksumValuesPass'],
              report['hfSemantics']['legacyEdgesAbsent'], report['hfSemantics']['correctEdgesPresent'],
              report['kaggleSemantics']['legacyEdgesAbsent'], report['kaggleSemantics']['correctEdgesPresent']
          ])
          pathlib.Path('/tmp/current-platform-convergence.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY
      - name: Save audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-platform-convergence-audit
          path: /tmp/current-platform-convergence.json
          if-no-files-found: warn
          overwrite: true

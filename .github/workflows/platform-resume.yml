name: Guarded platform convergence final verification

on:
  push:
    branches: [ops/platform-convergence-resume-20261016]
    paths:
      - '.github/workflows/platform-resume.yml'
      - 'tests/test_platform_resume.py'

permissions:
  contents: read

concurrency:
  group: doctor-ghezelbaash-platform-final-verify
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN || secrets.KAGGLE_TOKEN }}
      TARGET_SOURCE_COMMIT: 62cd2dd0432790916467c0c25d8264c20ba103cd
      TARGET_HF_REVISION: 45bc20d21be4eaa1e25b1798e9aff0e53243417a
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install verification dependency
        run: python -m pip install --disable-pip-version-check 'kaggle>=2.2,<3'
      - name: Verify website, Hugging Face and Zenodo immutable identities
        run: |
          python - <<'PY'
          import hashlib, io, json, os, subprocess, tempfile, urllib.parse, urllib.request, zipfile
          source=os.environ['TARGET_SOURCE_COMMIT']; hf=os.environ['TARGET_HF_REVISION']
          def j(url):
              req=urllib.request.Request(url,headers={'Cache-Control':'no-cache','User-Agent':'final-convergence-verify/1.0'})
              return json.load(urllib.request.urlopen(req,timeout=60))
          def b(url):
              req=urllib.request.Request(url,headers={'Cache-Control':'no-cache','User-Agent':'final-convergence-verify/1.0'})
              return urllib.request.urlopen(req,timeout=900).read()
          site=j('https://www.ghezelbaash.ir/release-provenance.json?_cb=final')
          assert site['sourceCommit']==source,site
          hfi=j('https://huggingface.co/api/datasets/doctor-ghezelbaash/dr-saeid-ghezelbaash-entity-data')
          assert hfi['sha']==hf,hfi['sha']
          matrix=json.loads(b('https://huggingface.co/datasets/doctor-ghezelbaash/dr-saeid-ghezelbaash-entity-data/resolve/'+hf+'/current-release-matrix.json?download=true'))
          assert matrix['websiteSourceCommit']==source
          assert matrix['canonicalDatasetIri']=='https://www.ghezelbaash.ir/graph.jsonld/dataset'
          ds=j('https://zenodo.org/api/records/22838416')
          assert (ds.get('doi') or ds['pids']['doi']['identifier'])=='10.5281/zenodo.22838416'
          assert ds['metadata']['version']=='1.3.3'
          assert len(ds['files'])==24
          src=j('https://zenodo.org/api/records/23289009')
          assert (src.get('doi') or src['pids']['doi']['identifier'])=='10.5281/zenodo.23289009'
          assert src['metadata']['version']=='source-final-2026-10-10'
          assert len(src['files'])==1
          key=src['files'][0]['key']
          live=b('https://zenodo.org/api/records/23289009/files/'+urllib.parse.quote(key,safe='')+'/content')
          with tempfile.TemporaryDirectory() as d:
              out=os.path.join(d,'source.zip')
              subprocess.run(['git','archive','--format=zip','--prefix=doctor-ghezelbaash-source-final-2026-10-10/','-o',out,source],check=True)
              expected=open(out,'rb').read()
          assert hashlib.md5(live).digest()==hashlib.md5(expected).digest(),'Zenodo source archive bytes differ from target source commit'
          with zipfile.ZipFile(io.BytesIO(live)) as z:
              name=next(n for n in z.namelist() if n.endswith('src/canonical/source.mjs'))
              canonical=z.read(name)
              assert b'worksFor' not in canonical
              assert b'Medical Director' not in canonical
              assert b'A5064828898' not in canonical
          hf_graph=b('https://huggingface.co/datasets/doctor-ghezelbaash/dr-saeid-ghezelbaash-entity-data/resolve/'+hf+'/graph.jsonld?download=true')
          z_graph=b('https://zenodo.org/api/records/22838416/files/graph.jsonld/content')
          assert hashlib.sha256(z_graph).digest()==hashlib.sha256(hf_graph).digest(),'Zenodo dataset graph differs from pinned HF graph'
          graph=json.loads(z_graph)
          nodes={n.get('@id'):n for n in graph.get('@graph',[]) if isinstance(n,dict) and n.get('@id')}
          person=nodes['https://www.ghezelbaash.ir/#saeed-ghezelbash']
          clinic=nodes['https://www.ghezelbaash.ir/dr-saeed-ghezelbash-aesthetic-clinic-kermanshah']
          assert 'worksFor' not in person and 'affiliation' not in person
          assert 'employee' not in clinic
          assert person.get('owns') and person.get('practicesAt') and person.get('workLocation')
          assert clinic.get('owner')
          print('WEBSITE_HF_ZENODO_FINAL_VERIFY_PASS')
          PY
      - name: Wait for Kaggle eventual consistency and verify published package
        run: |
          rm -rf /tmp/kaggle-live && mkdir -p /tmp/kaggle-live
          ok=0
          for attempt in $(seq 1 30); do
            rm -rf /tmp/kaggle-live/*
            if kaggle datasets download saeedghezelbash/dr-saeed-ghezelbash-knowledge-graph-and-nlp-data -p /tmp/kaggle-live --unzip --force >/tmp/kaggle-download.log 2>&1; then
              ok=1
              break
            fi
            echo "Kaggle not yet downloadable (attempt $attempt/30); retrying"
            sleep 10
          done
          test "$ok" = 1 || { cat /tmp/kaggle-download.log; exit 1; }
          python - <<'PY'
          import hashlib,json,os,pathlib
          root=pathlib.Path('/tmp/kaggle-live')
          manifest=json.loads((root/'kaggle-manifest.json').read_text())
          assert manifest['website_source_commit']==os.environ['TARGET_SOURCE_COMMIT']
          assert manifest['upstream_revision']==os.environ['TARGET_HF_REVISION']
          for line in (root/'checksums.sha256').read_text().splitlines():
              digest,name=line.split('  ',1)
              assert hashlib.sha256((root/name).read_bytes()).hexdigest()==digest,name
          graph=json.loads((root/'graph.jsonld').read_text())
          nodes={n.get('@id'):n for n in graph.get('@graph',[]) if isinstance(n,dict) and n.get('@id')}
          person=nodes['https://www.ghezelbaash.ir/#saeed-ghezelbash']
          clinic=nodes['https://www.ghezelbaash.ir/dr-saeed-ghezelbash-aesthetic-clinic-kermanshah']
          assert 'worksFor' not in person and 'affiliation' not in person
          assert 'employee' not in clinic
          assert person.get('owns') and person.get('practicesAt') and person.get('workLocation')
          assert clinic.get('owner')
          report={'status':'PASS','kaggleVersion':manifest['desired_kaggle_version'],'sourceCommit':manifest['website_source_commit'],'hfRevision':manifest['upstream_revision'],'files':sum(p.is_file() for p in root.rglob('*'))}
          pathlib.Path('/tmp/platform-final-verify.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps(report,indent=2))
          PY
      - name: Save final verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: platform-final-verification
          path: /tmp/platform-final-verify.json
          if-no-files-found: warn
          overwrite: true

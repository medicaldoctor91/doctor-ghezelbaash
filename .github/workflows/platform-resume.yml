name: Guarded platform convergence resume

on:
  push:
    branches: [ops/platform-convergence-resume-20261016]
    paths:
      - '.github/workflows/platform-resume.yml'
      - '.github/scripts/platform_resume.py'
      - 'tests/test_platform_resume.py'

permissions:
  contents: read

concurrency:
  group: doctor-ghezelbaash-platform-resume
  cancel-in-progress: false

jobs:
  resume:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Contract tests
        run: python -m unittest tests/test_platform_resume.py -v

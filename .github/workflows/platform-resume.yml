name: Kaggle version processing diagnostic

on:
  push:
    branches: [ops/platform-convergence-resume-20261016]
    paths:
      - '.github/workflows/platform-resume.yml'

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN || secrets.KAGGLE_TOKEN }}
      KAGGLE_REF: saeedghezelbash/dr-saeed-ghezelbash-knowledge-graph-and-nlp-data
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Kaggle client
        run: python -m pip install --disable-pip-version-check 'kaggle>=2.2,<3'
      - name: Compare creation status, public view, and downloadable manifest
        run: |
          echo '--- STATUS JSON ---'
          kaggle datasets status "$KAGGLE_REF" --format json | tee /tmp/kaggle-status.json
          echo '--- VIEW API ---'
          python - <<'PY'
          import json,os,urllib.request
          url='https://www.kaggle.com/api/v1/datasets/view/'+os.environ['KAGGLE_REF']
          req=urllib.request.Request(url,headers={'User-Agent':'kaggle-version-diagnostic/1.0'})
          value=json.load(urllib.request.urlopen(req,timeout=60))
          keys=['currentVersionNumber','lastUpdated','ref','title','totalBytes','downloadCount']
          out={k:value.get(k) for k in keys}
          print(json.dumps(out,indent=2,default=str))
          open('/tmp/kaggle-view.json','w').write(json.dumps(value,indent=2,default=str)+'\n')
          PY
          echo '--- DOWNLOAD MANIFEST ---'
          rm -rf /tmp/kaggle-status-download && mkdir -p /tmp/kaggle-status-download
          kaggle datasets download "$KAGGLE_REF" -p /tmp/kaggle-status-download --unzip --force >/dev/null
          python - <<'PY'
          import json,pathlib
          m=json.loads((pathlib.Path('/tmp/kaggle-status-download')/'kaggle-manifest.json').read_text())
          print(json.dumps({k:m.get(k) for k in ['desired_kaggle_version','website_source_commit','upstream_revision']},indent=2))
          PY
      - name: Save status evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kaggle-version-status
          path: |
            /tmp/kaggle-status.json
            /tmp/kaggle-view.json
          if-no-files-found: warn
          overwrite: true

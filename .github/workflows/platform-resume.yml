name: Canonical legacy literal read-only diagnostic

on:
  push:
    branches: [ops/platform-convergence-resume-20261016]
    paths: ['.github/workflows/platform-resume.yml']

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Locate exact legacy literals in current main canonical source
        run: |
          git show origin/main:src/canonical/source.mjs > /tmp/source.mjs
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path('/tmp/source.mjs')
          lines=p.read_text(errors='replace').splitlines()
          needles=['worksFor','Medical Director','مدیر پزشکی','employee','affiliation']
          out={}
          for needle in needles:
              hits=[]
              for i,line in enumerate(lines,1):
                  if needle in line:
                      hits.append({'line':i,'text':line.strip()[:500]})
              out[needle]=hits
          pathlib.Path('/tmp/canonical-legacy-literals.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: canonical-legacy-literals
          path: /tmp/canonical-legacy-literals.json
          if-no-files-found: warn
          overwrite: true

name: One-shot edge contract validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CLOUDFLARE_ACCOUNT_ID: 884d1d90bd1fb6ecca14992c6c60d677
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  ZONE_NAME: ghezelbaash.ir
  CANONICAL_HOST: www.ghezelbaash.ir

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Build DIST and enforce required Cloudflare contract
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
        run: npm run build
      - name: Exercise post-deploy reconciler without deploying
        run: python scripts/configure-cloudflare-edge.py --apply --outcome edge-reconciliation-test.json

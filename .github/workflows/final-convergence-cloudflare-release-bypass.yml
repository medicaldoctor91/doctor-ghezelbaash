name: Bypass stale edge cache for final canonical release endpoints
on:
  push:
    branches: [final/release-convergence]
    paths:
      - .github/workflows/final-convergence-cloudflare-release-bypass.yml
permissions:
  actions: read
  contents: write
concurrency:
  group: final-convergence-release-bypass
  cancel-in-progress: false
jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: '884d1d90bd1fb6ecca14992c6c60d677'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ZONE_NAME: 'ghezelbaash.ir'
      CANONICAL_HOST: 'www.ghezelbaash.ir'
      CANONICAL: 'https://www.ghezelbaash.ir'
      VERSION_DOI: '10.5281/zenodo.21892769'
      FROZEN_RUN: '31520584940'
      EXPECTED_GRAPH_SHA: 'a62d77230334598f3a5d73c34831c1dbf93b634c784eae4c4b98185a2fd27ed4'
      EXPECTED_HTML_SHA: 'f62dfb340a94994912e0710806fa83fe1b432a1787d24b4bde03b377f7dca9a8'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: final/release-convergence
          fetch-depth: 0
      - name: Verify immutable upstream gates
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          python - <<'PY'
          import json,os
          from pathlib import Path
          f=json.loads(Path('.release/freeze.json').read_text()); z=json.loads(Path('.release/zenodo-published.json').read_text())
          assert f['release']=='1.1.1' and f['coreFrozen'] is True and f['integrity']=='PASS'
          assert str(f['githubRunId'])==os.environ['FROZEN_RUN']
          assert f['graphJsonldSha256']==os.environ['EXPECTED_GRAPH_SHA'] and f['indexHtmlSha256']==os.environ['EXPECTED_HTML_SHA']
          assert z['integrity']=='PASS' and z['versionDoi']==os.environ['VERSION_DOI'] and z['recordId']=='21892769'
          print('FINAL_RELEASE_BYPASS_GATES_PASS')
          PY
      - name: Download exact final frozen payload
        uses: actions/download-artifact@v4
        with:
          name: dr-saeed-ghezelbash-final-convergence-frozen
          path: /tmp/final-frozen
          github-token: ${{ github.token }}
          repository: medicaldoctor91/doctor-ghezelbaash
          run-id: 31520584940
      - name: Install final last-wins Cache Rule bypass for canonical release endpoints
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,urllib.error,urllib.parse,urllib.request
          BASE='https://api.cloudflare.com/client/v4'; account=os.environ['CLOUDFLARE_ACCOUNT_ID']; token=os.environ['CLOUDFLARE_API_TOKEN']; zone_name=os.environ['ZONE_NAME']; host=os.environ['CANONICAL_HOST']
          headers={'Authorization':f'Bearer {token}','Accept':'application/json','Content-Type':'application/json','User-Agent':'ghezelbaash-final-cache-rule/1.0'}
          def raw(method,path,body=None):
              data=None if body is None else json.dumps(body,separators=(',',':')).encode(); req=urllib.request.Request(BASE+path,data=data,headers=headers,method=method)
              try:
                  with urllib.request.urlopen(req,timeout=45) as r:
                      b=r.read().decode('utf-8','replace'); return r.status,json.loads(b) if b else {}
              except urllib.error.HTTPError as e:
                  b=e.read().decode('utf-8','replace')
                  try:p=json.loads(b) if b else {}
                  except Exception:p={'raw':b[:1800]}
                  return e.code,p
          def expect(method,path,body=None,ok=(200,201)):
              st,p=raw(method,path,body)
              if st not in ok or p.get('success') is not True: raise RuntimeError(f'Cloudflare {method} {path} failed HTTP {st}: {json.dumps(p,ensure_ascii=False)[:3000]}')
              return p
          zones=expect('GET','/zones?'+urllib.parse.urlencode({'name':zone_name,'account.id':account,'per_page':50})).get('result') or []
          exact=[x for x in zones if x.get('name')==zone_name]
          if len(exact)!=1: raise RuntimeError(f'Expected one zone, found {len(exact)}')
          zid=str(exact[0]['id']); phase='http_request_cache_settings'; ref='ghezelbaash_final_release_byte_identity_v1'
          paths=['/','/graph.jsonld','/graph.ttl','/entity-facts.csv','/answers.txt','/knowledge.xml','/llms.txt','/llms-full.txt','/index.md','/datapackage.json','/croissant.json','/dcat.ttl','/void.ttl','/linkset.json','/provenance.jsonld','/evidence-snapshot.json','/shapes.ttl','/artifact-manifest.json']
          pathset=' '.join(json.dumps(x) for x in paths)
          desired={'ref':ref,'expression':f'(http.host eq {json.dumps(host)} and http.request.method in {{"GET" "HEAD"}} and http.request.uri.path in {{{pathset}}})','description':'Final immutable release endpoints: bypass zone edge cache so canonical bytes can never be shadowed by a previous frozen release','action':'set_cache_settings','action_parameters':{'cache':False},'enabled':True}
          listing=expect('GET',f'/zones/{zid}/rulesets').get('result') or []
          candidates=[x for x in listing if x.get('kind')=='zone' and x.get('phase')==phase]
          if len(candidates)>1: raise RuntimeError('Multiple zone cache entry-point rulesets found')
          if not candidates:
              full=expect('POST',f'/zones/{zid}/rulesets',{'name':'Canonical DIST cache rules','description':'Git-managed cache policy for canonical physician site','kind':'zone','phase':phase,'rules':[desired]}).get('result') or {}
              rid=str(full.get('id') or '')
              if not rid: raise RuntimeError('Created cache ruleset has no id')
              print('FINAL_RELEASE_BYPASS_RULESET_CREATED')
          else:
              rid=str(candidates[0]['id']); full=expect('GET',f'/zones/{zid}/rulesets/{rid}').get('result') or {}; rules=full.get('rules') or []
              matches=[r for r in rules if r.get('ref')==ref]
              if len(matches)>1: raise RuntimeError('Duplicate final-release bypass rule ref')
              if matches:
                  cur=matches[0]; body=dict(desired)
                  if not rules or rules[-1].get('id')!=cur.get('id'):
                      body['position']={'after':str(rules[-1]['id'])}
                  expect('PATCH',f'/zones/{zid}/rulesets/{rid}/rules/{cur["id"]}',body)
                  print('FINAL_RELEASE_BYPASS_RULE_UPDATED')
              else:
                  expect('POST',f'/zones/{zid}/rulesets/{rid}/rules',desired)
                  print('FINAL_RELEASE_BYPASS_RULE_CREATED')
          read=expect('GET',f'/zones/{zid}/rulesets/{rid}').get('result') or {}; rules=read.get('rules') or []; owned=[r for r in rules if r.get('ref')==ref]
          if len(owned)!=1: raise RuntimeError('Final release bypass readback multiplicity failure')
          r=owned[0]
          if r.get('action')!='set_cache_settings' or (r.get('action_parameters') or {}).get('cache') is not False or r.get('enabled') is not True: raise RuntimeError('Final release bypass readback contract drift')
          if not rules or rules[-1].get('id')!=r.get('id'): raise RuntimeError('Final release bypass is not the last cache rule')
          print('FINAL_RELEASE_BYPASS_READBACK_PASS','rule_count=',len(rules),'rule_id=',r.get('id'))
          PY
      - name: Verify all canonical responses equal final frozen bytes with cache bypass active
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os,time,urllib.request
          from pathlib import Path
          root=Path('/tmp/final-frozen'); hashes=json.loads((root/'dist-sha256.json').read_text()); base=os.environ['CANONICAL']
          targets={'index.html':'/','graph.jsonld':'/graph.jsonld','graph.ttl':'/graph.ttl','entity-facts.csv':'/entity-facts.csv','answers.txt':'/answers.txt','knowledge.xml':'/knowledge.xml','llms.txt':'/llms.txt','llms-full.txt':'/llms-full.txt','index.md':'/index.md','datapackage.json':'/datapackage.json','croissant.json':'/croissant.json','dcat.ttl':'/dcat.ttl','void.ttl':'/void.ttl','linkset.json':'/linkset.json','provenance.jsonld':'/provenance.jsonld','evidence-snapshot.json':'/evidence-snapshot.json','shapes.ttl':'/shapes.ttl','artifact-manifest.json':'/artifact-manifest.json'}
          def get(path):
              req=urllib.request.Request(base+path,headers={'User-Agent':'ghezelbaash-final-byte-identity/1.0','Accept-Encoding':'identity','Cache-Control':'no-cache'})
              with urllib.request.urlopen(req,timeout=45) as r:return r.status,r.headers,r.read()
          ok=False
          for i in range(30):
              try:
                  st,h,b=get('/graph.jsonld'); got=hashlib.sha256(b).hexdigest(); print('BYPASS_RULE_CONVERGENCE',i+1,got,'cf-cache-status=',h.get('CF-Cache-Status'))
                  if st==200 and got==hashes['graph.jsonld']: ok=True; break
              except Exception as e: print('BYPASS_RULE_ERROR',i+1,type(e).__name__)
              time.sleep(2)
          if not ok: raise SystemExit('Canonical graph did not converge after final bypass Cache Rule')
          cache_status={}
          for name,path in targets.items():
              st,h,b=get(path); got=hashlib.sha256(b).hexdigest(); cache_status[name]=h.get('CF-Cache-Status')
              if st!=200 or got!=hashes[name]: raise SystemExit(f'Canonical SHA mismatch {name}: {got} != {hashes[name]}')
              if name=='graph.jsonld':
                  if h.get('Access-Control-Allow-Origin')!='*' or 'application/ld+json' not in (h.get('Content-Type') or ''): raise SystemExit('Graph HTTP contract drift')
                  if os.environ['VERSION_DOI'] not in b.decode('utf-8'): raise SystemExit('Final DOI absent from graph')
              if name=='index.html':
                  text=b.decode('utf-8')
                  for token in [os.environ['VERSION_DOI'],'hero-action hero-search-launch','verified-physician-identity-core','google-maps-clinic-reputation-current','quick-start-title']:
                      if token not in text: raise SystemExit(f'Final HTML token missing {token}')
          print(json.dumps({'stage':'FINAL_WEBSITE_BYTE_IDENTITY','release':'1.1.1','artifactCount':len(targets),'graphSha256':hashes['graph.jsonld'],'indexHtmlSha256':hashes['index.html'],'cacheStatuses':cache_status,'integrity':'PASS'},separators=(',',':')))
          PY
      - name: Verify custom domain and persist Website PASS
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,urllib.request
          from pathlib import Path
          req=urllib.request.Request(f"https://api.cloudflare.com/client/v4/accounts/{os.environ['CLOUDFLARE_ACCOUNT_ID']}/pages/projects/doctor-ghezelbaash/domains",headers={'Authorization':f"Bearer {os.environ['CLOUDFLARE_API_TOKEN']}",'Accept':'application/json'})
          with urllib.request.urlopen(req,timeout=30) as r:p=json.load(r)
          row=next((x for x in (p.get('result') or []) if x.get('name')=='www.ghezelbaash.ir'),None); assert row and row.get('status')=='active',row
          out={'stage':'FINAL_WEBSITE_VERIFIED','release':'1.1.1','versionDoi':os.environ['VERSION_DOI'],'frozenRunId':'31520584940','graphSha256':os.environ['EXPECTED_GRAPH_SHA'],'indexHtmlSha256':os.environ['EXPECTED_HTML_SHA'],'canonicalReleaseCacheMode':'bypass','cacheRuleRef':'ghezelbaash_final_release_byte_identity_v1','customDomain':'active','integrity':'PASS'}
          Path('.release/website-verified.json').write_text(json.dumps(out,sort_keys=True,indent=2)+'\n'); print('FINAL_WEBSITE_VERIFIED_PASS')
          PY
          git config user.name ghezelbaash-release-bot
          git config user.email actions@users.noreply.github.com
          git add .release/website-verified.json
          git commit -m 'Record exact final canonical Website byte identity [final-website]'
          git push origin HEAD:final/release-convergence

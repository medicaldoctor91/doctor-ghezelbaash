name: Package Wikimedia metadata deliverables
on:
  push:
    branches:
      - deliverables/wikimedia-aesthetic-metadata-2026-09-27
jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: ghezelbash-wikimedia-aesthetic-metadata
          path: deliverables/wikimedia-aesthetic-metadata/
          if-no-files-found: error
          retention-days: 1

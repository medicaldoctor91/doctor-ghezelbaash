name: One-time O3 O4 built-output verification (no deploy)
on:
  push:
    branches: [fix/o5-canonical-service-types-20261018]
    paths: ['.github/workflows/o3-o4-verify-once.yml']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version-file: .nvmrc, cache: npm}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Validate full patched source and dist
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          python -m pip install --disable-pip-version-check 'rdflib>=7,<8' 'pyshacl>=0.30,<1' 'mlcroissant==1.1.1'
          node --test tests/*.test.mjs
          npm run build
          python tests/validate_machine_resources.py dist
          python - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          import json
          
          names = [
          "acne-pigmentation-and-scars","aesthetic-treatment-candidacy",
          "aesthetic-treatment-failure-from-diagnostic-error","aesthetic-treatment-selection",
          "botox","chin-jawline-and-facial-contouring","complications-aftercare-and-follow-up",
          "diagnosis-before-aesthetic-treatment-selection","dr-saeed-ghezelbash-aesthetic-clinic-kermanshah",
          "facial-aging-differential-diagnosis","filler","hair-loss",
          "saeed-ghezelbash-diagnostic-philosophy","skin-rejuvenation","thread-lift",
          ]
          class HeadingAudit(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.stack = []
                  self.h1_paths = []
                  self.script = None
                  self.jsonld = ""
              def handle_starttag(self, tag, attrs):
                  attributes = dict(attrs)
                  if tag == "h1": self.h1_paths.append([*self.stack,tag])
                  if tag == "script" and attributes.get("id") == "schema-core-mainentity": self.script = True
                  self.stack.append(tag)
              def handle_endtag(self, tag):
                  if tag == "script" and self.script: self.script = None
                  if tag in self.stack:
                      for i in range(len(self.stack)-1,-1,-1):
                          if self.stack[i]==tag: self.stack=self.stack[:i];break
              def handle_data(self, data):
                  if self.script: self.jsonld += data
          for name in names:
              path=Path("dist") / (name+".html")
              assert path.exists(),str(path)
              parser=HeadingAudit();parser.feed(path.read_text(encoding="utf-8"))
              assert len(parser.h1_paths)==1,(name,parser.h1_paths)
              assert "article" in parser.h1_paths[0],name
              assert "section" not in parser.h1_paths[0],(name,parser.h1_paths[0])
              graph=json.loads(parser.jsonld)
              context=graph["@context"]
              assert isinstance(context,list) and context[0]=="https://schema.org",(name,context)
              for key in ("url","sameAs","dayOfWeek"):
                  assert context[1][key]["@type"]=="@id",(name,key,context)
          print(f"Focused HTML and schema term checks: PASS for {len(names)} previously warned routes")
          PY
      - name: Remove one-time validation workflow after success
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/o3-o4-verify-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/o3-o4-verify-once.yml
          git commit -m 'chore: remove one-shot O3 O4 verifier [skip ci]'
          git push origin HEAD:refs/heads/fix/o5-canonical-service-types-20261018

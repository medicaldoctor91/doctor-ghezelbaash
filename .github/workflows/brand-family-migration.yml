name: One-time 2026 canonical icon-family migration

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: canonical-icon-family-migration
  cancel-in-progress: false

jobs:
  migrate:
    if: github.event.pull_request.head.ref == 'ops/canonical-icon-migration-trigger-20260823b'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
          cache: npm

      - name: Install deterministic raster tooling
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends librsvg2-bin imagemagick

      - name: Render healthy canonical raster family from favicon.svg
        shell: bash
        run: |
          set -euo pipefail
          test -f public/favicon.svg
          rsvg-convert -w 192 -h 192 public/favicon.svg -o /tmp/brand-192.png
          rsvg-convert -w 512 -h 512 public/favicon.svg -o /tmp/brand-512.png
          python - <<'PY'
          from pathlib import Path
          src=Path('public/favicon.svg').read_text(encoding='utf-8')
          if 'fill="#000000"' not in src: raise SystemExit('Canonical SVG black path fill not found')
          Path('/tmp/favicon-white.svg').write_text(src.replace('fill="#000000"','fill="#ffffff"'),encoding='utf-8')
          PY
          rsvg-convert -w 410 -h 410 /tmp/favicon-white.svg -o /tmp/brand-mask-mark.png
          convert -size 512x512 xc:'#075244' /tmp/brand-mask-mark.png -gravity center -composite -strip /tmp/brand-maskable-512.png
          rm -f public/media/brand/doctor-ghezelbaash-symbol-192.48be0004e370.png public/media/brand/doctor-ghezelbaash-symbol-512.a910779b67ef.png public/media/brand/doctor-ghezelbaash-symbol-maskable-512.de33d0be02c9.png public/media/brand/doctor-ghezelbaash-symbol-192.328e1556f122.png public/media/brand/doctor-ghezelbaash-symbol-512.1bc7c3af1350.png public/media/brand/doctor-ghezelbaash-symbol-maskable-512.b6a6738954b9.png
          python - <<'PY'
          from pathlib import Path
          import hashlib, shutil, struct
          for source,stem,dims in [('/tmp/brand-192.png','doctor-ghezelbaash-symbol-192',(192,192)),('/tmp/brand-512.png','doctor-ghezelbaash-symbol-512',(512,512)),('/tmp/brand-maskable-512.png','doctor-ghezelbaash-symbol-maskable-512',(512,512))]:
            data=Path(source).read_bytes()
            if data[:8]!=b'\x89PNG\r\n\x1a\n': raise SystemExit(f'{source}: invalid PNG')
            got=struct.unpack('>II',data[16:24])
            if got!=dims: raise SystemExit(f'{source}: expected {dims}, got {got}')
            digest=hashlib.sha256(data).hexdigest(); target=Path('public/media/brand')/f'{stem}.{digest[:12]}.png'; shutil.copyfile(source,target)
          PY

      - name: Install project dependencies and enrich canonical media metadata
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm run media:enrich

      - name: Resolve final enriched brand filenames and migrate SVG consumers
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib, os, subprocess
          patterns={'BRAND_192':'doctor-ghezelbaash-symbol-192.*.png','BRAND_512':'doctor-ghezelbaash-symbol-512.*.png','BRAND_MASKABLE':'doctor-ghezelbaash-symbol-maskable-512.*.png'}
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as env:
            for key,pattern in patterns.items():
              matches=list(Path('public/media/brand').glob(pattern))
              if len(matches)!=1: raise SystemExit(f'{pattern}: expected 1 file, got {matches}')
              p=matches[0]; digest=hashlib.sha256(p.read_bytes()).hexdigest(); token=p.stem.rsplit('.',1)[-1]
              if digest[:12]!=token: raise SystemExit(f'{p}: fingerprint mismatch')
              env.write(f'{key}={p.as_posix()}\n'); env.write(f'{key}_FILE={p.name}\n')
              print(f'{key}={p.name} sha256={digest}')
          old='doctor-ghezelbaash-symbol.3a9e7509912d.svg'
          reps=[('https://www.ghezelbaash.ir/media/brand/'+old,'https://www.ghezelbaash.ir/favicon.svg'),('public/media/brand/'+old,'public/favicon.svg'),('/media/brand/'+old,'/favicon.svg'),('media/brand/'+old,'favicon.svg')]
          for raw in subprocess.check_output(['git','ls-files','-z']).split(b'\0'):
            if not raw: continue
            p=Path(raw.decode())
            if not p.is_file(): continue
            try: text=p.read_text(encoding='utf-8')
            except UnicodeDecodeError: continue
            before=text
            for a,b in reps: text=text.replace(a,b)
            if text!=before: p.write_text(text,encoding='utf-8',newline='')
          PY
          rm -f public/media/brand/doctor-ghezelbaash-symbol.3a9e7509912d.svg

      - name: Rebuild platform icon derivatives and canonical manifest
        shell: bash
        run: |
          set -euo pipefail
          convert "$BRAND_512" -resize 16x16 -strip public/favicon-16x16.png
          convert "$BRAND_512" -resize 32x32 -strip public/favicon-32x32.png
          convert "$BRAND_512" -resize 48x48 -strip public/favicon-48x48.png
          convert public/favicon-16x16.png public/favicon-32x32.png public/favicon-48x48.png public/favicon.ico
          convert "$BRAND_MASKABLE" -resize 180x180 -strip public/apple-touch-icon.png
          convert "$BRAND_MASKABLE" -resize 150x150 -strip public/mstile-150x150.png
          python - <<'PY'
          from pathlib import Path
          import json, os
          p=Path('public/site.webmanifest')
          raw=p.read_text(encoding='utf-8')
          raster_replacements={
            'doctor-ghezelbaash-symbol-192.48be0004e370.png':os.environ['BRAND_192_FILE'],
            'doctor-ghezelbaash-symbol-512.a910779b67ef.png':os.environ['BRAND_512_FILE'],
            'doctor-ghezelbaash-symbol-maskable-512.de33d0be02c9.png':os.environ['BRAND_MASKABLE_FILE'],
            'doctor-ghezelbaash-symbol-192.328e1556f122.png':os.environ['BRAND_192_FILE'],
            'doctor-ghezelbaash-symbol-512.1bc7c3af1350.png':os.environ['BRAND_512_FILE'],
            'doctor-ghezelbaash-symbol-maskable-512.b6a6738954b9.png':os.environ['BRAND_MASKABLE_FILE'],
          }
          for old,new in raster_replacements.items(): raw=raw.replace(old,new)
          data=json.loads(raw)
          data['icons']=[{'src':'/favicon.svg','sizes':'any','type':'image/svg+xml','purpose':'any'},{'src':'/media/brand/'+os.environ['BRAND_192_FILE'],'sizes':'192x192','type':'image/png','purpose':'any'},{'src':'/media/brand/'+os.environ['BRAND_512_FILE'],'sizes':'512x512','type':'image/png','purpose':'any'},{'src':'/media/brand/'+os.environ['BRAND_MASKABLE_FILE'],'sizes':'512x512','type':'image/png','purpose':'maskable'}]
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          git rm -f .github/workflows/brand-family-migration.yml

      - name: Structural, semantic, and binary convergence checks
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, os, struct
          json.loads(Path('src/data/semantic/knowledge-graph.jsonld').read_text(encoding='utf-8'))
          m=json.loads(Path('public/site.webmanifest').read_text(encoding='utf-8'))
          expected={'/favicon.svg','/media/brand/'+os.environ['BRAND_192_FILE'],'/media/brand/'+os.environ['BRAND_512_FILE'],'/media/brand/'+os.environ['BRAND_MASKABLE_FILE']}
          if {i['src'] for i in m['icons']}!=expected: raise SystemExit('manifest icon set mismatch')
          for key in ('BRAND_192','BRAND_512','BRAND_MASKABLE'):
            p=Path(os.environ[key]); digest=hashlib.sha256(p.read_bytes()).hexdigest(); token=p.stem.rsplit('.',1)[-1]
            if digest[:12]!=token: raise SystemExit(f'{p}: fingerprint mismatch')
          for name,dims in {'public/favicon-16x16.png':(16,16),'public/favicon-32x32.png':(32,32),'public/favicon-48x48.png':(48,48),'public/apple-touch-icon.png':(180,180),'public/mstile-150x150.png':(150,150)}.items():
            d=Path(name).read_bytes(); got=struct.unpack('>II',d[16:24])
            if d[:8]!=b'\x89PNG\r\n\x1a\n' or got!=dims: raise SystemExit(f'{name}: invalid {got}')
          if Path('public/favicon.ico').read_bytes()[:4]!=b'\x00\x00\x01\x00': raise SystemExit('invalid favicon.ico')
          PY
          if git grep -n -I -E 'doctor-ghezelbaash-symbol\.3a9e7509912d\.svg|doctor-ghezelbaash-symbol-192\.48be0004e370\.png|doctor-ghezelbaash-symbol-512\.a910779b67ef\.png|doctor-ghezelbaash-symbol-maskable-512\.de33d0be02c9\.png|doctor-ghezelbaash-symbol-192\.328e1556f122\.png|doctor-ghezelbaash-symbol-512\.1bc7c3af1350\.png|doctor-ghezelbaash-symbol-maskable-512\.b6a6738954b9\.png'; then echo 'legacy/provisional icon reference remains' >&2; exit 1; fi
          git diff --check

      - name: Repository validators
        shell: bash
        run: |
          set -euo pipefail
          npm run validate:media-references
          npm run validate:media
          npm run validate:source

      - name: Commit production-clean migration to main
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          git config user.name 'doctor-ghezelbaash migration bot'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'refactor: converge all consumers on 2026 canonical icon family'
          git push origin HEAD:main

name: One-time 2026 canonical icon-family migration

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: canonical-icon-family-migration
  cancel-in-progress: false

jobs:
  migrate:
    if: github.event.pull_request.head.ref == 'ops/canonical-icon-migration-trigger-20260823'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
          cache: npm

      - name: Verify staged canonical assets
        shell: bash
        run: |
          set -euo pipefail
          test -f public/favicon.svg
          python - <<'PY'
          from pathlib import Path
          import hashlib, struct
          expected = {
              'public/media/brand/doctor-ghezelbaash-symbol-192.328e1556f122.png': ('328e1556f122', (192, 192)),
              'public/media/brand/doctor-ghezelbaash-symbol-512.1bc7c3af1350.png': ('1bc7c3af1350', (512, 512)),
              'public/media/brand/doctor-ghezelbaash-symbol-maskable-512.b6a6738954b9.png': ('b6a6738954b9', (512, 512)),
          }
          for name, (prefix, dims) in expected.items():
              data = Path(name).read_bytes()
              digest = hashlib.sha256(data).hexdigest()
              if not digest.startswith(prefix):
                  raise SystemExit(f'{name}: SHA-256 {digest} != filename fingerprint {prefix}')
              if data[:8] != b'\x89PNG\r\n\x1a\n':
                  raise SystemExit(f'{name}: invalid PNG')
              got = struct.unpack('>II', data[16:24])
              if got != dims:
                  raise SystemExit(f'{name}: expected {dims}, got {got}')
          PY

      - name: Generate every platform derivative from the canonical family
        shell: bash
        run: |
          set -euo pipefail
          if command -v magick >/dev/null 2>&1; then IM='magick'; else IM='convert'; fi
          transparent='public/media/brand/doctor-ghezelbaash-symbol-512.1bc7c3af1350.png'
          maskable='public/media/brand/doctor-ghezelbaash-symbol-maskable-512.b6a6738954b9.png'
          $IM "$transparent" -resize 16x16 public/favicon-16x16.png
          $IM "$transparent" -resize 32x32 public/favicon-32x32.png
          $IM "$transparent" -resize 48x48 public/favicon-48x48.png
          $IM public/favicon-16x16.png public/favicon-32x32.png public/favicon-48x48.png public/favicon.ico
          $IM "$maskable" -resize 180x180 public/apple-touch-icon.png
          $IM "$maskable" -resize 150x150 public/mstile-150x150.png

      - name: Byte-preserving migration of every textual consumer
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import subprocess
          old_svg = 'doctor-ghezelbaash-symbol.3a9e7509912d.svg'
          replacements = [
              ('https://www.ghezelbaash.ir/media/brand/' + old_svg, 'https://www.ghezelbaash.ir/favicon.svg'),
              ('public/media/brand/' + old_svg, 'public/favicon.svg'),
              ('/media/brand/' + old_svg, '/favicon.svg'),
              ('media/brand/' + old_svg, 'favicon.svg'),
              ('doctor-ghezelbaash-symbol-192.48be0004e370.png', 'doctor-ghezelbaash-symbol-192.328e1556f122.png'),
              ('doctor-ghezelbaash-symbol-512.a910779b67ef.png', 'doctor-ghezelbaash-symbol-512.1bc7c3af1350.png'),
              ('doctor-ghezelbaash-symbol-maskable-512.de33d0be02c9.png', 'doctor-ghezelbaash-symbol-maskable-512.b6a6738954b9.png'),
          ]
          for raw in subprocess.check_output(['git', 'ls-files', '-z']).split(b'\0'):
              if not raw: continue
              path = Path(raw.decode())
              if not path.is_file(): continue
              try: text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError: continue
              original = text
              for old, new in replacements: text = text.replace(old, new)
              if text != original: path.write_text(text, encoding='utf-8', newline='')
          PY

      - name: Canonicalize manifest and retire superseded assets
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          p = Path('public/site.webmanifest')
          data = json.loads(p.read_text(encoding='utf-8'))
          data['icons'][0] = {'src':'/favicon.svg','sizes':'any','type':'image/svg+xml','purpose':'any'}
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          rm -f \
            public/media/brand/doctor-ghezelbaash-symbol.3a9e7509912d.svg \
            public/media/brand/doctor-ghezelbaash-symbol-192.48be0004e370.png \
            public/media/brand/doctor-ghezelbaash-symbol-512.a910779b67ef.png \
            public/media/brand/doctor-ghezelbaash-symbol-maskable-512.de33d0be02c9.png
          git rm .github/workflows/brand-family-migration.yml

      - name: Structural and semantic convergence checks
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json, struct
          json.loads(Path('src/data/semantic/knowledge-graph.jsonld').read_text(encoding='utf-8'))
          m = json.loads(Path('public/site.webmanifest').read_text(encoding='utf-8'))
          expected = {
            '/favicon.svg',
            '/media/brand/doctor-ghezelbaash-symbol-192.328e1556f122.png',
            '/media/brand/doctor-ghezelbaash-symbol-512.1bc7c3af1350.png',
            '/media/brand/doctor-ghezelbaash-symbol-maskable-512.b6a6738954b9.png'
          }
          actual = {i['src'] for i in m['icons']}
          if actual != expected: raise SystemExit(f'manifest mismatch: {actual}')
          for name, dims in {
            'public/favicon-16x16.png':(16,16),'public/favicon-32x32.png':(32,32),
            'public/favicon-48x48.png':(48,48),'public/apple-touch-icon.png':(180,180),
            'public/mstile-150x150.png':(150,150)
          }.items():
            d=Path(name).read_bytes(); got=struct.unpack('>II',d[16:24])
            if d[:8] != b'\x89PNG\r\n\x1a\n' or got != dims: raise SystemExit(f'{name}: {got}')
          if Path('public/favicon.ico').read_bytes()[:4] != b'\x00\x00\x01\x00': raise SystemExit('invalid favicon.ico')
          PY
          if git grep -n -I -E 'doctor-ghezelbaash-symbol\.3a9e7509912d\.svg|doctor-ghezelbaash-symbol-192\.48be0004e370\.png|doctor-ghezelbaash-symbol-512\.a910779b67ef\.png|doctor-ghezelbaash-symbol-maskable-512\.de33d0be02c9\.png'; then
            echo 'legacy icon reference remains' >&2; exit 1
          fi
          git diff --check

      - name: Repository validators
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm run validate:media-references
          npm run validate:media
          npm run validate:source

      - name: Commit production-clean migration to main
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          git config user.name 'doctor-ghezelbaash migration bot'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'refactor: converge all consumers on 2026 canonical icon family'
          git push origin HEAD:main

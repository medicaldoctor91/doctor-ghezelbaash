name: Temporary Commons media entity audit
on:
  push:
    branches: [main]
    paths: ['.github/workflows/_tmp-commons-media-entity-audit.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check --no-input requests==2.32.5
      - name: Audit Commons files and MediaInfo
        shell: bash
        run: |
          python - <<'PY'
          import requests,json
          s=requests.Session(); s.headers.update({'User-Agent':'GhezelbaashCommonsMediaAudit/1.0 (https://www.ghezelbaash.ir/)'})
          api='https://commons.wikimedia.org/w/api.php'
          cm=s.get(api,params={'action':'query','list':'categorymembers','cmtitle':'Category:Saeed Ghezelbash','cmnamespace':6,'cmlimit':'max','format':'json','formatversion':2},timeout=90); cm.raise_for_status(); members=cm.json()['query']['categorymembers']
          out=[]
          for m in members:
            title=m['title']; pageid=m['pageid']
            p={'action':'query','prop':'revisions|imageinfo|categories','rvprop':'ids|timestamp|content','rvslots':'main','iiprop':'extmetadata|url','cllimit':'max','pageids':str(pageid),'format':'json','formatversion':2}
            r=s.get(api,params=p,timeout=90); r.raise_for_status(); pg=r.json()['query']['pages'][0]
            rev=(pg.get('revisions') or [{}])[0]; txt=rev.get('slots',{}).get('main',{}).get('content','')
            ii=(pg.get('imageinfo') or [{}])[0]; ext=ii.get('extmetadata',{})
            def em(k): return ext.get(k,{}).get('value')
            mid='M'+str(pageid)
            mr=s.get(api,params={'action':'wbgetentities','ids':mid,'props':'claims|labels','format':'json','formatversion':2},timeout=90); mr.raise_for_status(); me=mr.json()['entities'].get(mid,{})
            def vals(pid):
              z=[]
              for c in me.get('claims',{}).get(pid,[]):
                try:
                  v=c['mainsnak']['datavalue']['value']
                  if isinstance(v,dict) and 'id' in v: v=v['id']
                  z.append(v)
                except: pass
              return z
            out.append({'title':title,'pageid':pageid,'media_info':mid,'revid':rev.get('revid'),'author_extmetadata':em('Artist'),'credit_extmetadata':em('Credit'),'description_extmetadata':em('ImageDescription'),'license':em('LicenseShortName'),'categories':[x['title'] for x in pg.get('categories',[])],'P170_creator':vals('P170'),'P180_depicts':vals('P180'),'P6243_represents':vals('P6243'),'wikitext':txt})
          print(json.dumps({'count':len(out),'files':out},ensure_ascii=False,indent=2,sort_keys=True))
          PY

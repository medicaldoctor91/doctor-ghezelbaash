name: Temporary Commons PDF SDC completion
on:
  push:
    branches: [main]
    paths: ['.github/workflows/_tmp-commons-media-entity-audit.yml']
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      WIKIMEDIA_USERNAME: ${{ secrets.WIKIVERSITY_USERNAME }}
      WIKIMEDIA_BOT_PASSWORD: ${{ secrets.WIKIVERSITY_BOT_PASSWORD }}
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check --no-input requests==2.32.5
      - name: Add missing license and copyright status to existing MediaInfo
        shell: bash
        run: |
          python - <<'PY'
          import os,requests,json
          API='https://commons.wikimedia.org/w/api.php'; MID='M197635229'
          TARGETS={'P275':'Q20007257','P6216':'Q50423863'}
          s=requests.Session(); s.headers.update({'User-Agent':'GhezelbaashCommonsSDC/1.0 (https://www.ghezelbaash.ir/)'})
          def get(**p):
            p.update(format='json',formatversion=2); r=s.get(API,params=p,timeout=60); r.raise_for_status(); d=r.json()
            if 'error' in d: raise RuntimeError(d['error'])
            return d
          def post(p):
            p=dict(p); p.update(format='json',formatversion=2); r=s.post(API,data=p,timeout=90); r.raise_for_status(); d=r.json()
            if 'error' in d: raise RuntimeError(d['error'])
            return d
          lt=get(action='query',meta='tokens',type='login')['query']['tokens']['logintoken']
          lg=post({'action':'login','lgname':os.environ['WIKIMEDIA_USERNAME'],'lgpassword':os.environ['WIKIMEDIA_BOT_PASSWORD'],'lgtoken':lt})
          if lg.get('login',{}).get('result')!='Success': raise RuntimeError(lg)
          ui=get(action='query',meta='userinfo',uiprop='blockinfo')['query']['userinfo']
          if ui.get('blockedby'): raise RuntimeError({'blocked':True,'blockedby':ui.get('blockedby'),'reason':ui.get('blockreason')})
          csrf=get(action='query',meta='tokens',type='csrf')['query']['tokens']['csrftoken']
          def read():
            e=get(action='wbgetentities',ids=MID,props='claims')['entities'][MID]
            return e.get('statements') or e.get('claims') or {}
          def vals(store,pid):
            out=[]
            for c in store.get(pid,[]):
              try:
                v=c['mainsnak']['datavalue']['value']; out.append(v.get('id') if isinstance(v,dict) else v)
              except: pass
            return out
          results=[]; store=read()
          for pid,qid in TARGETS.items():
            if qid in vals(store,pid):
              results.append({'property':pid,'target':qid,'status':'exists'}); continue
            value={'entity-type':'item','numeric-id':int(qid[1:]),'id':qid}
            d=post({'action':'wbcreateclaim','entity':MID,'property':pid,'snaktype':'value','value':json.dumps(value,separators=(',',':')),'summary':'Complete Structured Data on Commons from the file’s declared CC BY 4.0 license','token':csrf})
            results.append({'property':pid,'target':qid,'status':'created','claim':d['claim']['id']})
            store=read()
          final=read(); checks={pid:(qid in vals(final,pid)) for pid,qid in TARGETS.items()}
          # preserve the pre-existing digital-representation edge exactly; never create another.
          checks['P6243_preserved_once']=vals(final,'P6243').count('Q140298431')==1
          print(json.dumps({'ok':all(checks.values()),'authenticated_as':ui.get('name'),'checks':checks,'results':results,'P6243':vals(final,'P6243')},ensure_ascii=False,indent=2,sort_keys=True))
          if not all(checks.values()): raise SystemExit(1)
          PY

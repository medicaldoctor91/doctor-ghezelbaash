name: Read Kaggle processing status for 1.3.6
on:
  push:
    branches: [codex/clinical-release-control-2026-11-19]
permissions:
  contents: read
jobs:
  observe:
    if: github.repository == 'medicaldoctor91/doctor-ghezelbaash' && github.ref == 'refs/heads/codex/clinical-release-control-2026-11-19'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f66aff6ada76a3694cb88b7de54d678a6b5f29b6
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install 'kaggle==2.2.4' 'six>=1.17,<2' requests
      - name: Read the Kaggle owner version and public default
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN || secrets.KAGGLE_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import requests
          from kaggle.api.kaggle_api_extended import KaggleApi
          dataset = 'saeedghezelbash/dr-saeed-ghezelbash-knowledge-graph-and-nlp-data'
          api = KaggleApi()
          api.authenticate()
          raw = json.loads(api.dataset_status(dataset, format='json(status,current_version_number)'))
          response = requests.get('https://api.kaggle.com/v1/datasets/view/' + dataset, timeout=25)
          response.raise_for_status()
          print(json.dumps({'observed_owner_version': raw['current_version_number'], 'observed_owner_status': raw['status'], 'observed_public_default': response.json()['currentVersionNumber']}))
          PY

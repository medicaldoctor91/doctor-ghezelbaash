name: Verify predecessor and start the journaled Zenodo reservation
on:
  push:
    branches: [codex/clinical-release-control-2026-11-19]
permissions: {}
jobs:
  reviewed-reservation:
    if: github.repository == 'medicaldoctor91/doctor-ghezelbaash' && github.ref == 'refs/heads/codex/clinical-release-control-2026-11-19'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: write
    steps:
      - name: Publish reviewed bootstrap ref and dispatch the existing reservation
        env:
          GH_TOKEN: ${{ github.token }}
          BOOTSTRAP_TAG: release-bootstrap-clinical-attribution-2026-11-19-v2
          BOOTSTRAP_SHA: 74a7926307978f3f5351919bcfe4d76345cefd51
        shell: bash
        run: |
          set -euo pipefail
          if current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$BOOTSTRAP_TAG" --jq .object.sha 2>/dev/null); then
            test "$current" = "$BOOTSTRAP_SHA"
          else
            gh api --silent --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$BOOTSTRAP_TAG" -f sha="$BOOTSTRAP_SHA"
          fi
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$BOOTSTRAP_TAG" --jq .object.sha)" = "$BOOTSTRAP_SHA"
          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/inspect-media-delivery.yml/dispatches" --input - <<'REQUEST'
          {"ref":"release-bootstrap-clinical-attribution-2026-11-19-v2","inputs":{"operation":"reserve","reviewed_commit":"74a7926307978f3f5351919bcfe4d76345cefd51"}}
          REQUEST

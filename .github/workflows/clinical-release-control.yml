name: Start the reviewed Zenodo reservation
on:
  push:
    branches: [codex/clinical-release-control-2026-11-19]
permissions: {}
jobs:
  reserve:
    if: github.repository == 'medicaldoctor91/doctor-ghezelbaash' && github.ref == 'refs/heads/codex/clinical-release-control-2026-11-19'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Dispatch the existing journaled reservation workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/inspect-media-delivery.yml/dispatches" --input - <<'REQUEST'
          {"ref":"source-frozen-clinical-attribution-2026-11-18-management","inputs":{"operation":"reserve","reviewed_commit":"8552509b3f52ee01b8c6633e4164bf3257f8363d"}}
          REQUEST

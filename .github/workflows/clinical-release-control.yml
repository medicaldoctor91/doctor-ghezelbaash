name: Check the public release baseline and Viewer readiness
on:
  push:
    branches: [codex/clinical-release-control-2026-11-19]
permissions: {}
jobs:
  verify-public-state:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Compare actual public versions and Viewer responses
        run: |
          python3 - <<'PY'
          import concurrent.futures,json,urllib.error,urllib.parse,urllib.request
          hf='doctor-ghezelbaash/dr-saeid-ghezelbaash-entity-data'
          kg='saeedghezelbash/dr-saeed-ghezelbash-knowledge-graph-and-nlp-data'
          viewer='https://datasets-server.huggingface.co/'
          project={'dataset':hf,'config':'query_matrix','split':'train','length':2}
          checks=[
              ('website','https://www.ghezelbaash.ir/release-provenance.json','sourceCommit'),
              ('hf','https://huggingface.co/api/datasets/'+hf,'sha'),
              ('kaggle','https://api.kaggle.com/v1/datasets/view/'+kg,'currentVersionNumber'),
              ('zenodo-latest','https://zenodo.org/api/records/23965042/versions/latest','doi'),
              ('project-search',viewer+'search?'+urllib.parse.urlencode({**project,'query':'ghezelbaash'}),'rows'),
              ('project-filter',viewer+'filter?'+urllib.parse.urlencode({**project,'where':""" "canonical_subject"='Q140287622' """.strip()}),'rows'),
              ('reference-search',viewer+'search?'+urllib.parse.urlencode({'dataset':'ibm/duorc','config':'SelfRC','split':'train','query':'dog','offset':150,'length':2}),'rows'),
          ]
          def read(item):
              label,url,field=item
              try:
                  with urllib.request.urlopen(urllib.request.Request(url,headers={'Cache-Control':'no-cache'}),timeout=40) as r:
                      value=json.load(r).get(field)
                      return {'check':label,'http':r.status,'value':len(value) if field=='rows' and isinstance(value,list) else value}
              except urllib.error.HTTPError as e:
                  return {'check':label,'http':e.code,'errorCode':e.headers.get('X-Error-Code')}
              except (TimeoutError,urllib.error.URLError) as e:
                  return {'check':label,'errorType':type(e).__name__}
          with concurrent.futures.ThreadPoolExecutor(max_workers=7) as pool:
              print('PublicReleaseAudit: '+json.dumps(list(pool.map(read,checks))))
          PY

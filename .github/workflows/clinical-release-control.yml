name: Observe the public versions during the 1.3.6 release
on:
  push:
    branches: [codex/clinical-release-control-2026-11-19]
permissions: {}
jobs:
  observe:
    if: github.repository == 'medicaldoctor91/doctor-ghezelbaash' && github.ref == 'refs/heads/codex/clinical-release-control-2026-11-19'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read only the public release identifiers
        run: |
          python - <<'PY'
          from concurrent.futures import ThreadPoolExecutor
          import json
          import urllib.error
          import urllib.request
          services = {
              'website': ('https://www.ghezelbaash.ir/release-provenance.json', lambda x: x['sourceCommit']),
              'hugging_face': ('https://huggingface.co/api/datasets/doctor-ghezelbaash/dr-saeid-ghezelbaash-entity-data', lambda x: x['sha']),
              'kaggle_dataset': ('https://api.kaggle.com/v1/datasets/view/saeedghezelbash/dr-saeed-ghezelbash-knowledge-graph-and-nlp-data', lambda x: x['currentVersionNumber']),
              'kaggle_notebook': ('https://www.kaggle.com/api/v1/kernels/pull/saeedghezelbash/dr-saeed-ghezelbash-knowledge-graph-starter', lambda x: x['metadata']['currentVersionNumber']),
              'zenodo': ('https://zenodo.org/api/records/24354791', lambda x: {'doi': x['doi'], 'version': x['metadata']['version']}),
          }
          def fetch(item):
              name, (url, select) = item
              try:
                  request = urllib.request.Request(url, headers={'Cache-Control': 'no-cache', 'Accept': 'application/json'})
                  with urllib.request.urlopen(request, timeout=20) as response:
                      return name, {'status': response.status, 'value': select(json.load(response))}
              except urllib.error.HTTPError as exc:
                  return name, {'status': exc.code}
              except Exception as exc:
                  return name, {'error': type(exc).__name__}
          with ThreadPoolExecutor(max_workers=5) as pool:
              print(json.dumps(dict(pool.map(fetch, services.items()))))
          PY

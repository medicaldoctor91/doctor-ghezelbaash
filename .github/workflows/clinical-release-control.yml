name: Resume the same 1.3.6 refinement after the public outputs match
on:
  push:
    branches: [codex/clinical-release-control-2026-11-19]
permissions: {}
jobs:
  resume:
    if: github.repository == 'medicaldoctor91/doctor-ghezelbaash' && github.ref == 'refs/heads/codex/clinical-release-control-2026-11-19' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 85
    permissions:
      contents: read
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      M_SHA: eafb138d596a91504ed0af66e2557f52848e36b6
      HF_SHA: 63b71242a5f2e91a90537d51c4542b071a26be3a
      BUILD_TAG: source-build-2026-11-19-clinical-attribution-1-3-6-r14
      PLAN_SHA: b44852d641f30d46c4dfa19481abc6ed6fd7b4f560b1baf7836a0881aebb7ce3
      MANIFEST_SHA: 3a0f7b427e42d8d96a39f6e6b597aa1003fd26dcffc64d1c8ac44d8483793a7c
      PREFLIGHT: '44534049479'
      STAGING: '44535403502'
      PRIOR: '44536199973'
    steps:
      - name: Continue only once the public Kaggle ZIP and HF Viewer match
        shell: bash
        run: |
          set -euo pipefail
          repo="repos/$GITHUB_REPOSITORY"
          workflow="$repo/actions/workflows/coordinated-doi-release.yml"
          prior_state=''
          for ((i=0;i<66;i++)); do
            prior_state=$(gh api "$repo/actions/runs/$PRIOR" | jq -er --arg sha "$M_SHA" 'select(.head_sha==$sha and .event=="workflow_dispatch") | .status+":"+(.conclusion//"")')
            if [[ "$prior_state" = completed:* ]]; then break; fi
            sleep 30
          done
          if test "$prior_state" = completed:success; then echo 'The initial publication completed.'; exit 0; fi
          test "$prior_state" = completed:failure
          receipt="$RUNNER_TEMP/release-receipt"
          gh run download "$PRIOR" --repo "$GITHUB_REPOSITORY" --name coordinated-release-evidence --dir "$receipt"
          printf '%s  %s\n' "$MANIFEST_SHA" "$receipt/frozen-sha256.json" | sha256sum --check -
          printf '%s  %s\n' "$PLAN_SHA" "$receipt/approved-release-plan.json" | sha256sum --check -
          jq -e --arg src "$M_SHA" --argjson run "$PRIOR" --arg hash "$MANIFEST_SHA" '.sourceCommit==$src and .runId==$run and .operation=="publish-frozen" and .frozenManifestSHA256==$hash' "$receipt/release-workflow-context.json" >/dev/null
          jq -e --arg src "$M_SHA" '.sourceCommit==$src and .version==37 and .action=="create-dataset-version"' "$receipt/kaggle-submission-attempt.json" >/dev/null
          test ! -f "$receipt/zenodo-publish-attempt.json"
          RECEIPTS="$receipt" python - <<'PY'
          import hashlib, io, json, os, time, zipfile
          from pathlib import Path
          from urllib.error import URLError
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen
          kg = 'saeedghezelbash/dr-saeed-ghezelbash-knowledge-graph-and-nlp-data'
          hf = 'doctor-ghezelbaash/dr-saeid-ghezelbaash-entity-data'
          frozen = json.loads((Path(os.environ['RECEIPTS'])/'frozen-sha256.json').read_text())['kaggle']
          frozen = {n:h for n,h in frozen.items() if n not in {'dataset-metadata.json','kernel-metadata.json'}}
          revision = os.environ['HF_SHA']
          def read(url):
              with urlopen(Request(url, headers={'Cache-Control':'no-cache','Pragma':'no-cache'}), timeout=25) as response:
                  return response.read(),response.headers
          def body(url):
              return json.loads(read(url)[0])
          def viewer(endpoint, params):
              query = urlencode({'dataset':hf,'live_audit':time.time_ns(),**params})
              data,headers = read('https://datasets-server.huggingface.co/'+endpoint+'?'+query)
              return json.loads(data),headers.get('X-Revision')
          deadline = time.monotonic()+46*60
          while time.monotonic()<deadline:
              try:
                  source = body('https://www.ghezelbaash.ir/release-provenance.json')['sourceCommit']
                  if source != os.environ['M_SHA']: raise SystemExit('Website no longer points at the refined source.')
                  current = body('https://huggingface.co/api/datasets/'+hf)['sha']
                  if current != revision: raise SystemExit('Hugging Face changed outside this release.')
                  view = body('https://api.kaggle.com/v1/datasets/view/'+kg)
                  default = view['currentVersionNumber']
                  if default not in {36,37} or any(v['versionNumber']>37 for v in view.get('versions',[])):
                      raise SystemExit('Unexpected Kaggle version.')
                  size, seen = viewer('size',{})
                  counts = {c['config']:c['num_rows'] for c in size['size']['configs']}
                  print(json.dumps({'kaggle':default,'hfRevision':seen,'entityFacts':counts.get('entity_facts')}),flush=True)
                  expected = {'clinical_passages':3276,'clinical_answers':125,'entity_facts':22829,'query_matrix':876,'market_positioning':60}
                  if default==37 and seen==revision and counts==expected and not size.get('pending') and not size.get('failed'):
                      params = {'config':'clinical_passages','split':'train','length':2}
                      search, sr = viewer('search',{**params,'query':'ghezelbaash'})
                      filt, fr = viewer('filter',{**params,'where':chr(34)+'language'+chr(34)+'='+chr(39)+'fa-IR'+chr(39)})
                      if sr==fr==revision and search.get('rows') and filt.get('rows'):
                          zipped,_ = read('https://www.kaggle.com/api/v1/datasets/download/'+kg)
                          with zipfile.ZipFile(io.BytesIO(zipped)) as z:
                              names={m.filename for m in z.infolist() if not m.is_dir()}
                              if names==set(frozen) and all(hashlib.sha256(z.read(n)).hexdigest()==h for n,h in frozen.items()):
                                  print('Kaggle default SHA-256 parity and refined Viewer probes passed.',flush=True)
                                  break
              except (URLError,TimeoutError,json.JSONDecodeError,zipfile.BadZipFile) as exc:
                  print(type(exc).__name__,getattr(exc,'code',''),flush=True)
              time.sleep(45)
          else:
              raise SystemExit('Public outputs have not converged; DOI remains subject to the existing acceptance gates.')
          PY
          gh api "$workflow/runs?head_sha=$M_SHA&event=workflow_dispatch&per_page=25" | jq -e --argjson p "$PREFLIGHT" --argjson s "$STAGING" --argjson r "$PRIOR" '(.workflow_runs | map(.id) | sort)==([$p,$s,$r] | sort)' >/dev/null
          test "$(gh api "$repo/git/ref/tags/$BUILD_TAG" --jq '.object.sha')" = "$M_SHA"
          plan="$receipt/approved-release-plan.json"
          jq -n --arg ref "$BUILD_TAG" --arg m "$M_SHA" --arg candidate "$PREFLIGHT" --rawfile plan "$plan" --arg digest "$PLAN_SHA" '{ref:$ref,inputs:{operation:"publish-frozen",reviewed_commit:$m,candidate_run:$candidate,approved_plan_json:$plan,approved_plan_sha256:$digest}}' | gh api -X POST "$workflow/dispatches" --input -

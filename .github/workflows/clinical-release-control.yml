name: Compare public Viewer Search with Hugging Face's documented example
on:
  push:
    branches: [codex/clinical-release-control-2026-11-19]
permissions: {}
jobs:
  viewer-control:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Verify provider responses for the project and documented example
        shell: bash
        run: |
          python3 - <<'PY'
          import concurrent.futures,json,urllib.error,urllib.parse,urllib.request
          projects=[
            ('project',{'dataset':'doctor-ghezelbaash/dr-saeid-ghezelbaash-entity-data','config':'clinical_passages','split':'train','query':'ghezelbaash','length':2}),
            ('documented-example',{'dataset':'ibm/duorc','config':'SelfRC','split':'train','query':'dog','offset':150,'length':2})]
          def read(pair):
              label,params=pair
              url='https://datasets-server.huggingface.co/search?'+urllib.parse.urlencode(params)
              try:
                  with urllib.request.urlopen(url,timeout=40) as r:
                      data=json.load(r)
                      return {'case':label,'http':r.status,'rows':len(data.get('rows',[]))}
              except urllib.error.HTTPError as error:
                  return {'case':label,'http':error.code,'errorCode':error.headers.get('X-Error-Code')}
              except (TimeoutError,urllib.error.URLError) as error:
                  return {'case':label,'errorType':type(error).__name__}
          with concurrent.futures.ThreadPoolExecutor(max_workers=2) as pool:
              print('ViewerControl: '+json.dumps(list(pool.map(read,projects))))
          PY

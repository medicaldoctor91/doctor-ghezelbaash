      - uses: actions/upload-artifact@v4
        with:
          name: approved-clinical-release-plan-1.3.6
          path: ${{ runner.temp }}/approved-clinical-release-1.3.6.json
          if-no-files-found: error
      - name: Dispatch existing coordinated preflight
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          plan="$RUNNER_TEMP/approved-clinical-release-1.3.6.json"
          jq -n --arg tag "$BUILD_TAG" --arg commit "$BUILD_SHA" --rawfile plan "$plan" --arg digest 1ac4b1a5342ff25821b157db54f3c3d763f2e4ca022c15a64ee23b496750fc87 '{ref:$tag,inputs:{operation:"preflight",reviewed_commit:$commit,approved_plan_json:$plan,approved_plan_sha256:$digest}}' |
            gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/coordinated-doi-release.yml/dispatches" --input -
      - name: Wait for the candidate and stage only the unpublished archive
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          plan="$RUNNER_TEMP/approved-clinical-release-1.3.6.json"
          runs_endpoint="repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$BUILD_SHA&event=workflow_dispatch&per_page=10"
          for attempt in $(seq 1 55); do
            run=$(gh api "$runs_endpoint" | jq -c '[.workflow_runs[] | select((.path|split("@")[0])==".github/workflows/coordinated-doi-release.yml")] | sort_by(.id) | first // {}')
            if jq -e '.status=="completed"' <<<"$run" >/dev/null; then break; fi
            sleep 15
          done
          jq -e --arg commit "$BUILD_SHA" '.head_sha==$commit and .status=="completed" and .conclusion=="success"' <<<"$run" >/dev/null
          candidate=$(jq -r '.id' <<<"$run")
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$candidate/artifacts" | jq -e '[.artifacts[] | select(.name=="frozen-coordinated-candidate" and .expired==false)] | length==1' >/dev/null
          jq -n --arg tag "$BUILD_TAG" --arg commit "$BUILD_SHA" --arg candidate "$candidate" --rawfile plan "$plan" --arg digest 1ac4b1a5342ff25821b157db54f3c3d763f2e4ca022c15a64ee23b496750fc87 '{ref:$tag,inputs:{operation:"stage-draft",reviewed_commit:$commit,candidate_run:$candidate,approved_plan_json:$plan,approved_plan_sha256:$digest}}' |
            gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/coordinated-doi-release.yml/dispatches" --input -

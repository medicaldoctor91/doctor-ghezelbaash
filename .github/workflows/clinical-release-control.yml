          set -euo pipefail
          api="repos/$GITHUB_REPOSITORY/actions"
          workflow="$api/workflows/coordinated-doi-release.yml"
          for run in "$CANDIDATE_RUN" "$STAGE_RUN"; do
            gh api "$api/runs/$run" | jq -e --arg build "$BUILD_SHA"               '.head_sha==$build and .workflow_id==389432488 and .status=="completed" and .conclusion=="success" and .run_attempt==1' >/dev/null
          done
          gh api "$api/runs/$CANDIDATE_RUN/artifacts" | jq -e             '.artifacts | map(select(.id==14504399596 and .name=="frozen-coordinated-candidate" and .expired==false)) | length==1' >/dev/null
          gh api "$workflow/runs?head_sha=$BUILD_SHA&event=workflow_dispatch&per_page=25" |             jq -e --arg preflight "$CANDIDATE_RUN" --arg stage "$STAGE_RUN"               '(.workflow_runs | map(.id | tostring) | sort)==([$preflight,$stage] | sort)' >/dev/null
          receipts="$RUNNER_TEMP/staged-receipt"
          gh run download "$STAGE_RUN" --repo "$GITHUB_REPOSITORY" --name coordinated-release-evidence --dir "$receipts"
          printf '%s  %s\n' "$MANIFEST_SHA" "$receipts/frozen-sha256.json" | sha256sum --check -

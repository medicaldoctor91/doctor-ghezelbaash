name: Check public Hugging Face Viewer before coordinated publication
on:
  push:
    branches: [codex/clinical-release-control-2026-11-19]
permissions: {}
jobs:
  viewer-readiness:
    if: github.repository == 'medicaldoctor91/doctor-ghezelbaash' && github.ref == 'refs/heads/codex/clinical-release-control-2026-11-19'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Measure Search and Filter on the active baseline
        shell: bash
        run: |
          python3 - <<'PY'
          import concurrent.futures, json, urllib.parse, urllib.request, urllib.error
          dataset='doctor-ghezelbaash/dr-saeid-ghezelbaash-entity-data'
          checks={'clinical_passages':'ghezelbaash','clinical_answers':'دکتر','entity_facts':'ghezelbaash','query_matrix':'بوتاکس','market_positioning':'دکتر'}

          def fetch(endpoint, params):
              url='https://datasets-server.huggingface.co/'+endpoint+'?'+urllib.parse.urlencode({'dataset':dataset, **params})
              try:
                  with urllib.request.urlopen(urllib.request.Request(url,headers={'Cache-Control':'no-cache'}),timeout=35) as response:
                      return response.status,json.load(response)
              except urllib.error.HTTPError as e:
                  return e.code,{}
              except (TimeoutError,urllib.error.URLError):
                  return 'no-response',{}

          def probe(config, query):
              params={'config':config,'split':'train'}
              status,preview=fetch('first-rows',params)
              result={'config':config,'preview':status}
              status,search=fetch('search',{**params,'query':query,'length':1})
              result.update(search=status,searchRows=len(search.get('rows',[])))
              if not preview.get('rows'):
                  return result
              row=preview['rows'][0]['row']
              field,value=next((k,v) for k,v in row.items() if isinstance(v,str) and v and len(v)<200 and k.isidentifier())
              quoted=value.replace("'", "''")
              status,filtered=fetch('filter',{**params,'where':f'"{field}"=\'{quoted}\'','length':1})
              result.update(filter=status,filterRows=len(filtered.get('rows',[])))
              return result

          with concurrent.futures.ThreadPoolExecutor(max_workers=5) as workers:
              results=list(workers.map(lambda pair: probe(*pair),checks.items()))
          print('ViewerReadiness: '+json.dumps(results))
          PY

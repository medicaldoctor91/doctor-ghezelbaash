name: Apply Rich Results fixes
on:
  push:
    branches: [release-final-clean]
    paths: [.github/workflows/apply-rich-results-fixes.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release-final-clean
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check rdflib==7.1.4
      - name: Run one-time patch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" https://api.github.com/repos/medicaldoctor91/doctor-ghezelbaash/git/blobs/57c4c73f25baac9e683dc9784db8db769d1400fe | jq -r .content | tr -d '\n' | base64 -d > /tmp/apply.py
          python /tmp/apply.py
      - name: Commit final source only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/apply-rich-results-fixes.yml
          git add public/graph.jsonld public/graph.ttl public/_headers src/data/semantic/head-graph.min.jsonld .github/scripts/validate_source.py
          git commit -m 'Resolve Google structured-data warnings'
          git push origin HEAD:release-final-clean

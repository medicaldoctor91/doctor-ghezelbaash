name: Validate production Dataset convergence

on:
  push:
    branches: [fix/production-dataset-convergence]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Enforce dependency advisory gate
        run: npm run security:dependencies
      - name: Validate canonical release contract
        run: npm run validate:release-contract
      - name: Validate Astro source
        run: npm run validate:source
      - name: Prove transient retry boundary
        run: |
          set -euo pipefail
          node scripts/test-transient-retry.mjs
          node scripts/run-transient-command.mjs -- node --input-type=module -e 'process.exit(0)'
      - name: Build exact distribution
        shell: bash
        run: |
          set -euo pipefail
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          export CF_PAGES_COMMIT_SHA="$GITHUB_SHA"
          npm run build
      - name: Verify Dataset distribution contract
        run: node scripts/verify-dataset-production.mjs --local
      - name: Verify canonical root freshness contract
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const headers = await readFile('dist/_headers', 'utf8');
          const marker = '\n/\n';
          const start = headers.indexOf(marker);
          if (start < 0) throw new Error('Root header block missing');
          const bodyStart = start + marker.length;
          const next = headers.indexOf('\n/', bodyStart);
          const root = headers.slice(bodyStart, next < 0 ? headers.length : next);
          const expected = 'Cloudflare-CDN-Cache-Control: public, max-age=300, stale-if-error=86400';
          if (!root.includes('Cache-Control: public, no-cache')) throw new Error('Browser no-cache contract drift');
          if (!root.includes(expected)) throw new Error(`Root edge freshness contract missing: ${root}`);
          if (/stale-while-revalidate/i.test(root)) throw new Error('Root must not permit stale-while-revalidate');
          console.log('ROOT_EDGE_FRESHNESS_CONTRACT_PASS');
          NODE

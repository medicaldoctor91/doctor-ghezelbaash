name: Normalize Dataset RDF patch

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: read

jobs:
  normalize-and-validate:
    if: github.head_ref == 'restore-dataset-authority-2026-07-30'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
          cache: npm

      - name: Match npm engine contract
        run: npm install --global npm@11.16.0

      - name: Install RDF dependency
        run: python -m pip install --disable-pip-version-check rdflib

      - name: Restore deterministic N-Triples-compatible Turtle serialization
        run: |
          python - <<'PY'
          from pathlib import Path
          from rdflib import Graph

          graph = Graph().parse('public/graph.jsonld', format='json-ld')
          serialized = graph.serialize(format='nt')
          lines = sorted(line.strip() for line in serialized.splitlines() if line.strip())
          Path('public/graph.ttl').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

      - name: Install project dependencies
        run: npm ci

      - name: Build and validate full production output
        run: npm run build

      - name: Remove one-time workflow
        run: rm .github/workflows/normalize-dataset-patch.yml

      - name: Verify clean patch
        run: git diff --check

      - name: Commit normalized validated patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Normalize Dataset RDF serialization"
          git push origin HEAD:${{ github.head_ref }}

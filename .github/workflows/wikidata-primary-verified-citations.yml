name: Add primary-verified Wikidata citation edges

on:
  push:
    branches: [main]
    paths:
      - 'scripts/add_primary_verified_citation_edges.py'
      - 'scripts/add_primary_verified_citation_edges_v2.py'
      - '.github/workflows/wikidata-primary-verified-citations.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  add:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      WIKIMEDIA_USERNAME: ${{ secrets.WIKIVERSITY_USERNAME }}
      WIKIMEDIA_BOT_PASSWORD: ${{ secrets.WIKIVERSITY_BOT_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-check --no-input requests==2.32.5
      - run: python scripts/add_primary_verified_citation_edges_v2.py

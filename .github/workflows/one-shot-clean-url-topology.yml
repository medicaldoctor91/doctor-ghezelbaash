name: One-shot clean URL topology

on:
  push:
    branches:
      - cleanup/remove-synthetic-redirect-topology

permissions:
  contents: write

jobs:
  clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/remove-synthetic-redirect-topology
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Remove synthetic HTTP topology from canonical source
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          const path = 'src/data/url-architecture.json';
          const policy = JSON.parse(await readFile(path, 'utf8'));
          delete policy.decisions;
          delete policy.retiredPaths;
          await writeFile(path, JSON.stringify(policy, null, 2) + '\n');
          NODE
          git rm -f \
            scripts/lib/public-redirect-policy.mjs \
            scripts/prune-development-redirects.mjs \
            scripts/validate-final-dist.mjs \
            scripts/validate-live-public.mjs \
            scripts/tests/public-redirect-policy.test.mjs \
            .github/workflows/one-shot-clean-url-topology.yml
      - name: Commit deterministic cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/data/url-architecture.json
          git commit -m 'Remove synthetic redirect topology at source'
          git push origin HEAD:cleanup/remove-synthetic-redirect-topology

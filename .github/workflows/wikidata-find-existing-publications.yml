name: Wikidata find existing publications

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wikidata-find-existing-publications.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check --no-input requests==2.32.5
      - name: Find exact pre-existing Wikidata items from account history
        shell: python
        run: |
          import json, requests, re
          WD='https://www.wikidata.org/w/api.php'
          USER='Medicaldoctor91'
          PERSON='Q140287622'
          UA='Medicaldoctor91ExistingPublicationFinder/1.0 (https://www.ghezelbaash.ir/)'
          s=requests.Session(); s.headers['User-Agent']=UA

          def get(params):
              r=s.get(WD,params={**params,'format':'json','formatversion':2},timeout=90)
              r.raise_for_status(); d=r.json()
              if 'error' in d: raise RuntimeError(d['error'])
              return d

          contribs=[]; cont={}
          while len(contribs)<1000:
              d=get({'action':'query','list':'usercontribs','ucuser':USER,'ucnamespace':0,'uclimit':'max','ucprop':'ids|title|timestamp|comment',**cont})
              batch=d.get('query',{}).get('usercontribs',[]); contribs.extend(batch)
              if 'continue' not in d: break
              cont=d['continue']
          qids=[]
          for c in contribs:
              t=c.get('title','')
              if re.fullmatch(r'Q\d+',t): qids.append(t)
          qids=list(dict.fromkeys(qids))

          entities={}
          for i in range(0,len(qids),50):
              ids='|'.join(qids[i:i+50])
              if not ids: continue
              d=get({'action':'wbgetentities','ids':ids,'props':'claims|labels|descriptions|info','languages':'en|fa'})
              entities.update(d.get('entities',{}))

          def qid(snak):
              v=snak.get('datavalue',{}).get('value')
              return v.get('id') if isinstance(v,dict) else None
          def scalar(snak): return snak.get('datavalue',{}).get('value')
          needles=['omega-3','bipolar','major depressive','dissociative','attachment style','ghezelbash']
          known_pmids={'27280013','34574943'}
          known_dois={'10.4103/2008-7802.182734','10.3390/healthcare9091169'}
          candidates=[]
          for q,e in entities.items():
              labels=' | '.join(x.get('value','') for x in e.get('labels',{}).values()).lower()
              texts=[labels]
              claims=e.get('claims',{})
              for p in ['P1476','P2093','P356','P698']:
                  for c in claims.get(p,[]):
                      v=scalar(c.get('mainsnak',{}))
                      if isinstance(v,dict): v=v.get('text','')
                      if isinstance(v,str): texts.append(v.lower())
              p50={qid(c.get('mainsnak',{})) for c in claims.get('P50',[])}
              pmids={str(scalar(c.get('mainsnak',{}))) for c in claims.get('P698',[])}
              dois={str(scalar(c.get('mainsnak',{}))).lower() for c in claims.get('P356',[])}
              hay=' | '.join(texts)
              if PERSON in p50 or pmids & known_pmids or dois & known_dois or any(n in hay for n in needles):
                  candidates.append({
                      'qid':q,
                      'labels':{k:v.get('value') for k,v in e.get('labels',{}).items()},
                      'description':{k:v.get('value') for k,v in e.get('descriptions',{}).items()},
                      'P50':sorted(x for x in p50 if x),
                      'P698':sorted(pmids),
                      'P356':sorted(dois),
                      'P31':[qid(c.get('mainsnak',{})) for c in claims.get('P31',[])],
                      'lastrevid':e.get('lastrevid'),
                  })

          # Recent edits around the accidental workflow window.
          recent=[c for c in contribs if c.get('timestamp','') >= '2026-08-15T22:45:00Z']

          # Search API by multiple fragments, not exact-title only.
          searches={}
          for term in [
              'Omega-3 Supplement Bipolar',
              'Effects Omega-3 Bipolar I Disorder',
              'Major Depressive Disorder insecure attachment Ghezelbash',
              'Dissociative depression Ghezelbash',
              'Attachment style dissociative depression',
              'Mohammad Saeed Ghezelbash',
              'Saeed Ghezelbash presentation'
          ]:
              d=get({'action':'wbsearchentities','search':term,'language':'en','uselang':'en','type':'item','limit':50})
              searches[term]=[{'id':x.get('id'),'label':x.get('label'),'description':x.get('description')} for x in d.get('search',[])]

          print(json.dumps({
              'contribution_count':len(contribs),
              'distinct_qids_touched':len(qids),
              'candidates':candidates,
              'recent_since_2245Z':recent,
              'searches':searches
          },ensure_ascii=False,indent=2,default=str))

name: Atomic ceiling release

on:
  push:
    branches: [main]
    paths:
      - .release/release-request.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: doctor-ghezelbaash-ceiling-release
  cancel-in-progress: false

jobs:
  converge:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      CLOUDFLARE_ACCOUNT_ID: 884d1d90bd1fb6ecca14992c6c60d677
      ZONE_NAME: ghezelbaash.ir
      CF_PROJECT: doctor-ghezelbaash
      CANONICAL_HOST: www.ghezelbaash.ir
    steps:
      - name: Checkout trusted main source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up locked Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.18.0
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Resolve release request
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE' >> "$GITHUB_ENV"
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('.release/release-request.json','utf8'));
          for(const k of ['targetVersion','releaseDate','currentRecordId','currentVersionDoi','conceptDoi']) if(!r[k]) throw new Error(`Missing release request field ${k}`);
          if(!/^\d+\.\d+\.\d+$/.test(r.targetVersion)) throw new Error('Invalid targetVersion');
          if(!/^\d{4}-\d{2}-\d{2}$/.test(r.releaseDate)) throw new Error('Invalid releaseDate');
          if(!/^\d+$/.test(String(r.currentRecordId))) throw new Error('Invalid currentRecordId');
          if(!/^10\.5281\/zenodo\.\d+$/.test(r.currentVersionDoi)) throw new Error('Invalid currentVersionDoi');
          if(!/^10\.5281\/zenodo\.\d+$/.test(r.conceptDoi)) throw new Error('Invalid conceptDoi');
          if((r.reservedRecordId&&!r.reservedVersionDoi)||(!r.reservedRecordId&&r.reservedVersionDoi)) throw new Error('Reserved Zenodo recovery fields must be paired');
          if(r.reservedRecordId&&!/^\d+$/.test(String(r.reservedRecordId))) throw new Error('Invalid reservedRecordId');
          if(r.reservedVersionDoi&&!/^10\.5281\/zenodo\.\d+$/.test(r.reservedVersionDoi)) throw new Error('Invalid reservedVersionDoi');
          console.log(`TARGET_VERSION=${r.targetVersion}`);
          console.log(`RELEASE_DATE=${r.releaseDate}`);
          console.log(`CURRENT_RECORD_ID=${r.currentRecordId}`);
          console.log(`CURRENT_VERSION_DOI=${r.currentVersionDoi}`);
          console.log(`CONCEPT_DOI=${r.conceptDoi}`);
          NODE

      - name: Preflight every mutation capability
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN || secrets.ZENODO_ACCESS_TOKEN || secrets.ZENODO_API_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN || secrets.HUGGINGFACE_TOKEN || secrets.HUGGING_FACE_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ZENODO_TOKEN:-}"
          test -n "${HF_TOKEN:-}"
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          echo "::add-mask::$ZENODO_TOKEN"
          echo "::add-mask::$HF_TOKEN"
          echo "::add-mask::$CLOUDFLARE_API_TOKEN"
          curl --fail --silent --show-error -H "Authorization: Bearer $ZENODO_TOKEN" https://zenodo.org/api/deposit/depositions/$CURRENT_RECORD_ID >/dev/null
          curl --fail --silent --show-error -H "Authorization: Bearer $HF_TOKEN" https://huggingface.co/api/whoami-v2 >/dev/null
          curl --fail --silent --show-error -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$CF_PROJECT" | python -c 'import json,sys; p=json.load(sys.stdin); assert p.get("success") is True and p.get("result",{}).get("name")=="doctor-ghezelbaash"'
          python scripts/preflight-cloudflare-edge.py

      - name: Reserve DOI and correct prior-version metadata
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN || secrets.ZENODO_ACCESS_TOKEN || secrets.ZENODO_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if node -e "const r=require('./.release/release-request.json');process.exit(r.reservedRecordId&&r.reservedVersionDoi?0:1)"; then
            node - <<'NODE'
          const fs=require('fs');
          const r=require('./.release/release-request.json');
          fs.writeFileSync('.release/zenodo-reservation.json',JSON.stringify({recordId:String(r.reservedRecordId),versionDoi:r.reservedVersionDoi,recovery:true},null,2)+'\n');
          NODE
            node - <<'NODE'
          const r=require('./.release/release-request.json');
          const token=process.env.ZENODO_TOKEN;
          fetch('https://zenodo.org/api/deposit/depositions/'+r.reservedRecordId,{headers:{Authorization:`Bearer ${token}`,'cache-control':'no-cache'}}).then(async x=>{if(!x.ok)throw Error(`Reserved Zenodo draft HTTP ${x.status}`);return x.json()}).then(x=>{const doi=x.metadata?.prereserve_doi?.doi||x.metadata?.doi||x.doi;if(String(x.id)!==String(r.reservedRecordId)||doi!==r.reservedVersionDoi||x.metadata?.version!==r.targetVersion||x.submitted===true)throw Error('Reserved Zenodo recovery target drift');console.log('ZENODO_DRAFT_RECOVERY_EXACT',x.id,doi,x.metadata.version)})
          NODE
          elif node -e "const r=require('./.release/release-request.json');process.exit(r.publishedRecordId&&r.publishedVersionDoi?0:1)"; then
            node - <<'NODE'
          const fs=require('fs');
          const r=require('./.release/release-request.json');
          fs.writeFileSync('.release/zenodo-reservation.json',JSON.stringify({recordId:String(r.publishedRecordId),versionDoi:r.publishedVersionDoi,recovery:true},null,2)+'\n');
          NODE
            node -e "const r=require('./.release/release-request.json');fetch('https://zenodo.org/api/records/'+r.publishedRecordId,{headers:{'cache-control':'no-cache'}}).then(x=>x.json()).then(x=>{if(x.doi!==r.publishedVersionDoi||x.metadata?.version!==r.targetVersion)throw Error('Published Zenodo recovery target drift');console.log('ZENODO_PUBLISHED_RECOVERY_EXACT',x.id,x.doi)})"
          else
            python scripts/zenodo_release.py reserve \
              --current-record "$CURRENT_RECORD_ID" \
              --current-doi "$CURRENT_VERSION_DOI" \
              --concept-doi "$CONCEPT_DOI" \
              --version "$TARGET_VERSION" \
              --date "$RELEASE_DATE"
          fi

      - name: Promote all canonical source contracts to reserved release
        shell: bash
        run: |
          set -euo pipefail
          REC="$(node -p "JSON.parse(require('fs').readFileSync('.release/zenodo-reservation.json')).recordId")"
          DOI="$(node -p "JSON.parse(require('fs').readFileSync('.release/zenodo-reservation.json')).versionDoi")"
          node scripts/promote-release.mjs --version="$TARGET_VERSION" --date="$RELEASE_DATE" --zenodo-record="$REC" --zenodo-doi="$DOI" --state=published
          npm run prepare:generated
          node scripts/lock-release-rdf-invariants.mjs
          npm run validate:release-contract
          npm run validate:source

      - name: Freeze exact source commit locally
        shell: bash
        run: |
          set -euo pipefail
          git config user.name ghezelbaash-release-bot
          git config user.email actions@users.noreply.github.com
          git add -u
          git diff --cached --quiet || git commit -m "Release synchronized entity stack v$TARGET_VERSION"
          echo "SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Build, validate and attest exact frozen source
        run: |
          npm run release
          node scripts/write-release-attestation.mjs

      - name: Prepare governed strong Hugging Face distribution
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN || secrets.HUGGINGFACE_TOKEN || secrets.HUGGING_FACE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth=1 https://huggingface.co/datasets/doctor-ghezelbaash/dr-saeid-ghezelbaash-entity-data .release/huggingface
          node scripts/prepare-huggingface-distribution.mjs dist .release/huggingface
          test -z "$(grep -RIlE 'ChIJBTOYDOTt-j8RD-7mAPy6Zas|best-mesotherapy-doctor-kermanshah|hifu-therapy-in-kermanshah' .release/huggingface/enrichment || true)"
          test "$(wc -l < .release/huggingface/enrichment/instruction_examples_fa_market_positioning.jsonl)" -ge 40

      - name: Publish exact Zenodo preservation distribution
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN || secrets.ZENODO_ACCESS_TOKEN || secrets.ZENODO_API_TOKEN }}
        run: |
          if node -e "const r=require('./.release/release-request.json');process.exit(r.publishedRecordId&&r.publishedVersionDoi?0:1)"; then
            echo 'ZENODO_PUBLISH_SKIPPED_ALREADY_EXACT'
          else
            python scripts/zenodo_release.py publish
          fi

      - name: Deploy exact canonical DIST to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if node -e "const r=require('./.release/release-request.json');process.exit(r.skipLiveDeploy?0:1)"; then
            echo 'CLOUDFLARE_DEPLOY_SKIPPED_ALREADY_BYTE_EXACT'
          else
            npx wrangler pages deploy dist --project-name="$CF_PROJECT" --branch=main --commit-hash="$SOURCE_COMMIT" --commit-message="Synchronized entity stack v$TARGET_VERSION" --commit-dirty=true
          fi
          if node -e "const r=require('./.release/release-request.json');process.exit(r.skipEdgeReconcile?0:1)"; then
            echo 'CLOUDFLARE_EDGE_RECONCILE_SKIPPED_ALREADY_EXACT'
          else
            python scripts/configure-cloudflare-edge.py --apply --outcome edge-reconciliation.json
          fi

      - name: Publish exact Core and governed enrichment to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN || secrets.HUGGINGFACE_TOKEN || secrets.HUGGING_FACE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          echo "::add-mask::$HF_TOKEN"
          git -C .release/huggingface config user.name ghezelbaash-release-bot
          git -C .release/huggingface config user.email actions@users.noreply.github.com
          git -C .release/huggingface add -A
          git -C .release/huggingface diff --cached --quiet || git -C .release/huggingface commit -m "Synchronize canonical Core v$TARGET_VERSION and preserve governed strong enrichment"
          git -C .release/huggingface remote set-url origin "https://oauth2:${HF_TOKEN}@huggingface.co/datasets/doctor-ghezelbaash/dr-saeid-ghezelbaash-entity-data"
          git -C .release/huggingface push origin HEAD:main

      - name: Verification Round 1 — consistency
        run: |
          npm run verify:production
          node scripts/verify-converged-stack.mjs

      - name: Verification Round 2 — residual error elimination
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(grep -RIlE 'ChIJBTOYDOTt-j8RD-7mAPy6Zas|Version 1\.0\.0 structured-data|Zenodo Version DOI 1\.1\.0' src public || true)"
          test -z "$(grep -RIlE '^[[:space:]]*issues:' .github/workflows || true)"
          node scripts/validate-release-contract.mjs
          node scripts/verify-converged-stack.mjs

      - name: Verification Round 3 — ceiling confirmation
        run: |
          npm run validate:reproducibility
          npm run verify:production
          node scripts/verify-converged-stack.mjs

      - name: Publish source truth and immutable tag only after all rounds pass
        env:
          GH_PUSH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          node -e "const fs=require('fs');const r=JSON.parse(fs.readFileSync('src/data/release.json'));const p={stage:'CONVERGED_PUBLISHED',release:r.release,conceptDoi:r.dataset.zenodo.conceptDoi,versionDoi:r.dataset.zenodo.versionDoi,recordId:String(r.dataset.zenodo.recordId),sourceCommit:process.env.SOURCE_COMMIT,verificationRounds:3,integrity:'PASS'};fs.writeFileSync('.release/zenodo-published.json',JSON.stringify(p,null,2)+'\\n')"
          git add .release/release-attestation.json .release/zenodo-published.json
          git commit -m "Record verified v$TARGET_VERSION cross-platform convergence"
          git tag -a "v$TARGET_VERSION" -m "Dr. Saeed Ghezelbash entity stack v$TARGET_VERSION — verified convergence"
          git remote set-url origin "https://x-access-token:${GH_PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:main
          git push origin "v$TARGET_VERSION"
